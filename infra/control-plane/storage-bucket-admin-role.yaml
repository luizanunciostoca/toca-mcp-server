title: TOCA MCP Infrastructure Resource Admin
description: Controlled infrastructure permissions for configuring TOCA MCP Cloud Storage buckets and narrowly scoped Secret Manager IAM without bucket deletion or project-wide IAM administration.
stage: GA
includedPermissions:
  - storage.buckets.create
  - storage.buckets.get
  - storage.buckets.getIamPolicy
  - storage.buckets.setIamPolicy
  - storage.buckets.update
  - secretmanager.secrets.get
  - secretmanager.secrets.getIamPolicy
  - secretmanager.secrets.setIamPolicy
