name: Cloud SQL DR Final Cleanup 2026-08-16

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: toca-mcp-production
  SOURCE_INSTANCE: toca-mcp-db
  TARGET_INSTANCE: toca-mcp-dr-final-31932660953
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Disable protection only on exact DR target, delete it, and prove production unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_INSTANCE" = 'toca-mcp-db'
          test "$TARGET_INSTANCE" = 'toca-mcp-dr-final-31932660953'
          test "$SOURCE_INSTANCE" != "$TARGET_INSTANCE"

          TOKEN="$(gcloud auth print-access-token)"
          printf '%s' '{"permissions":["cloudsql.instances.get","cloudsql.instances.update","cloudsql.instances.delete"]}' >/tmp/request.json
          HTTP="$(curl --silent --output /tmp/perms.json --write-out '%{http_code}' -X POST -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/request.json "https://cloudresourcemanager.googleapis.com/v1/projects/${GCP_PROJECT_ID}:testIamPermissions")"
          test "$HTTP" = 200
          for P in cloudsql.instances.get cloudsql.instances.update cloudsql.instances.delete; do
            if ! jq -e --arg p "$P" '(.permissions // []) | index($p) != null' /tmp/perms.json >/dev/null; then
              echo "DR_CLEANUP_BLOCKED_MISSING_PERMISSION=$P" >&2
              exit 41
            fi
          done

          SOURCE_BEFORE="$(gcloud sql instances describe "$SOURCE_INSTANCE" --project "$GCP_PROJECT_ID" --format=json)"
          printf '%s' "$SOURCE_BEFORE" | jq -e '.name=="toca-mcp-db" and .state=="RUNNABLE" and .settings.deletionProtectionEnabled==true and .settings.backupConfiguration.enabled==true and .settings.backupConfiguration.pointInTimeRecoveryEnabled==true' >/dev/null
          printf '%s' "$SOURCE_BEFORE" | jq '{name,state,databaseVersion,region,settings:{deletionProtectionEnabled:.settings.deletionProtectionEnabled,backupEnabled:.settings.backupConfiguration.enabled,pitrEnabled:.settings.backupConfiguration.pointInTimeRecoveryEnabled,tier:.settings.tier,edition:.settings.edition,dataDiskSizeGb:.settings.dataDiskSizeGb}}' >/tmp/source-before.json

          TARGET="$(gcloud sql instances describe "$TARGET_INSTANCE" --project "$GCP_PROJECT_ID" --format=json)"
          printf '%s' "$TARGET" | jq -e --arg t "$TARGET_INSTANCE" '.name==$t and .name!="toca-mcp-db" and .databaseVersion=="POSTGRES_18" and .region=="southamerica-east1"' >/dev/null

          if [ "$(jq -r '.settings.deletionProtectionEnabled // false' <<<"$TARGET")" = true ]; then
            gcloud sql instances patch "$TARGET_INSTANCE" --project "$GCP_PROJECT_ID" --no-deletion-protection --quiet
          fi

          TARGET_AFTER_PATCH="$(gcloud sql instances describe "$TARGET_INSTANCE" --project "$GCP_PROJECT_ID" --format=json)"
          printf '%s' "$TARGET_AFTER_PATCH" | jq -e '.settings.deletionProtectionEnabled==false' >/dev/null

          gcloud sql instances delete "$TARGET_INSTANCE" --project "$GCP_PROJECT_ID" --quiet
          if gcloud sql instances describe "$TARGET_INSTANCE" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            echo 'DR_TARGET_STILL_EXISTS_AFTER_DELETE' >&2
            exit 42
          fi

          SOURCE_AFTER="$(gcloud sql instances describe "$SOURCE_INSTANCE" --project "$GCP_PROJECT_ID" --format=json)"
          printf '%s' "$SOURCE_AFTER" | jq '{name,state,databaseVersion,region,settings:{deletionProtectionEnabled:.settings.deletionProtectionEnabled,backupEnabled:.settings.backupConfiguration.enabled,pitrEnabled:.settings.backupConfiguration.pointInTimeRecoveryEnabled,tier:.settings.tier,edition:.settings.edition,dataDiskSizeGb:.settings.dataDiskSizeGb}}' >/tmp/source-after.json
          cmp /tmp/source-before.json /tmp/source-after.json
          echo "CLOUD_SQL_DR_FINAL_CLEANUP=PASS target=$TARGET_INSTANCE production=$SOURCE_INSTANCE"
