name: WhatsApp Format Once

on:
  push:
    branches:
      - feat/next-whatsapp-real-stack-crm-v2-20260820

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/next-whatsapp-real-stack-crm-v2-20260820
          fetch-depth: 0
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format WhatsApp implementation and remove helper
        run: |
          pnpm exec prettier --write \
            src/omnichannel/whatsapp-runtime-contracts.ts \
            src/omnichannel/whatsapp-runtime.ts \
            src/persistence/postgres-whatsapp-runtime-store.ts \
            src/providers/whatsapp/whatsapp-cloud-adapter.ts \
            src/providers/whatsapp/whatsapp-cloud-webhook.ts \
            test/whatsapp-cloud-adapter.test.ts \
            test/whatsapp-cloud-webhook.test.ts \
            test/whatsapp-postgres-e2e.test.ts \
            .github/workflows/m-found-12-postgres-e2e.yml
          rm -f .github/workflows/whatsapp-format-once.yml
      - name: Commit normalized files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/omnichannel src/persistence/postgres-whatsapp-runtime-store.ts src/providers/whatsapp test/whatsapp-*.test.ts .github/workflows/m-found-12-postgres-e2e.yml
          git add -u .github/workflows
          git commit -m 'style(whatsapp): normalize implementation with repository prettier'
          git push origin HEAD:feat/next-whatsapp-real-stack-crm-v2-20260820
