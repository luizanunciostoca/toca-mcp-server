name: Ops Provider Config Preflight 2026-08-22

on:
  push:
    branches: [ops/google-ads-read-reverify-20260822]
    paths:
      - '.github/workflows/ops-provider-config-preflight-20260822.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_MCP_RUNTIME_SERVICE_ACCOUNT }}
      GCP_MCP_SERVICE: ${{ vars.GCP_CLOUD_RUN_MCP_SERVICE }}
      GCP_META_ACCESS_TOKEN_SECRET: ${{ vars.GCP_META_ACCESS_TOKEN_SECRET }}
      GCP_META_ACCESS_TOKEN_SECRET_VERSION: ${{ vars.GCP_META_ACCESS_TOKEN_SECRET_VERSION }}
      GCP_SENDGRID_API_KEY_SECRET: ${{ vars.GCP_SENDGRID_API_KEY_SECRET }}
      GCP_SENDGRID_API_KEY_SECRET_VERSION: ${{ vars.GCP_SENDGRID_API_KEY_SECRET_VERSION }}
      EMAIL_SENDGRID_SENDING_DOMAIN: ${{ vars.EMAIL_SENDGRID_SENDING_DOMAIN }}
      EMAIL_SENDGRID_FROM_EMAIL: ${{ vars.EMAIL_SENDGRID_FROM_EMAIL }}
      EMAIL_SENDGRID_EVENT_WEBHOOK_URL: ${{ vars.EMAIL_SENDGRID_EVENT_WEBHOOK_URL }}
      WHATSAPP_BUSINESS_ID: ${{ vars.WHATSAPP_BUSINESS_ID }}
      WHATSAPP_WABA_ID: ${{ vars.WHATSAPP_WABA_ID }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
      GCP_GOOGLE_ADS_DEVELOPER_TOKEN_SECRET: ${{ vars.GCP_GOOGLE_ADS_DEVELOPER_TOKEN_SECRET }}
      GCP_GOOGLE_ADS_DEVELOPER_TOKEN_SECRET_VERSION: ${{ vars.GCP_GOOGLE_ADS_DEVELOPER_TOKEN_SECRET_VERSION }}
      GCP_GOOGLE_ADS_CLIENT_ID_SECRET: ${{ vars.GCP_GOOGLE_ADS_CLIENT_ID_SECRET }}
      GCP_GOOGLE_ADS_CLIENT_ID_SECRET_VERSION: ${{ vars.GCP_GOOGLE_ADS_CLIENT_ID_SECRET_VERSION }}
      GCP_GOOGLE_ADS_CLIENT_SECRET_SECRET: ${{ vars.GCP_GOOGLE_ADS_CLIENT_SECRET_SECRET }}
      GCP_GOOGLE_ADS_CLIENT_SECRET_VERSION: ${{ vars.GCP_GOOGLE_ADS_CLIENT_SECRET_VERSION }}
      GCP_GOOGLE_ADS_REFRESH_TOKEN_SECRET: ${{ vars.GCP_GOOGLE_ADS_REFRESH_TOKEN_SECRET }}
      GCP_GOOGLE_ADS_REFRESH_TOKEN_SECRET_VERSION: ${{ vars.GCP_GOOGLE_ADS_REFRESH_TOKEN_SECRET_VERSION }}
      GOOGLE_ADS_ALLOWED_CURRENCY: ${{ vars.GOOGLE_ADS_ALLOWED_CURRENCY }}
      GOOGLE_ADS_MAX_DAILY_BUDGET_MICROS: ${{ vars.GOOGLE_ADS_MAX_DAILY_BUDGET_MICROS }}
      GOOGLE_ADS_CURRENCY_MINOR_UNIT_MICROS: ${{ vars.GOOGLE_ADS_CURRENCY_MINOR_UNIT_MICROS }}
      GOOGLE_ADS_ALLOWED_LOCATION_CRITERION_IDS: ${{ vars.GOOGLE_ADS_ALLOWED_LOCATION_CRITERION_IDS }}
      GOOGLE_ADS_CUSTOMER_ID: ${{ vars.GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ vars.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
    steps:
      - name: Report configuration presence only
        shell: bash
        run: |
          set -euo pipefail
          check_group() {
            local group="$1"; shift
            local missing=()
            for name in "$@"; do
              if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
            done
            if (( ${#missing[@]} == 0 )); then
              echo "${group}=CONFIG_PRESENT"
            else
              printf '%s_MISSING=%s\n' "$group" "$(IFS=,; echo "${missing[*]}")"
            fi
          }
          check_group GCP_BASE GCP_PROJECT_ID GCP_REGION GCP_ARTIFACT_REPOSITORY GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT GCP_RUNTIME_SERVICE_ACCOUNT GCP_MCP_SERVICE
          check_group SENDGRID GCP_SENDGRID_API_KEY_SECRET GCP_SENDGRID_API_KEY_SECRET_VERSION EMAIL_SENDGRID_SENDING_DOMAIN EMAIL_SENDGRID_FROM_EMAIL
          check_group WHATSAPP GCP_META_ACCESS_TOKEN_SECRET GCP_META_ACCESS_TOKEN_SECRET_VERSION WHATSAPP_BUSINESS_ID
          check_group GOOGLE_ADS GCP_GOOGLE_ADS_DEVELOPER_TOKEN_SECRET GCP_GOOGLE_ADS_DEVELOPER_TOKEN_SECRET_VERSION GCP_GOOGLE_ADS_CLIENT_ID_SECRET GCP_GOOGLE_ADS_CLIENT_ID_SECRET_VERSION GCP_GOOGLE_ADS_CLIENT_SECRET_SECRET GCP_GOOGLE_ADS_CLIENT_SECRET_VERSION GCP_GOOGLE_ADS_REFRESH_TOKEN_SECRET GCP_GOOGLE_ADS_REFRESH_TOKEN_SECRET_VERSION GOOGLE_ADS_ALLOWED_CURRENCY GOOGLE_ADS_MAX_DAILY_BUDGET_MICROS GOOGLE_ADS_CURRENCY_MINOR_UNIT_MICROS GOOGLE_ADS_ALLOWED_LOCATION_CRITERION_IDS
          echo 'PROVIDER_CONFIG_PREFLIGHT_COMPLETED=true'
