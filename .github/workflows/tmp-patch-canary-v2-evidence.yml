name: Temporary Canary V2 Evidence Patch

on:
  push:
    branches:
      - feat/instagram-controlled-write-canary-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/instagram-controlled-write-canary-v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate patched neutral workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 .tmp-canary-v2-evidence-patch.py
          pnpm exec prettier --write .canary-v2-output/instagram-engagement-controlled-write-canary-v2.yml
      - name: Commit neutral output only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .canary-v2-output/instagram-engagement-controlled-write-canary-v2.yml
          git commit -m 'chore(instagram): generate canary v2 evidence patch blob'
          git push origin HEAD:feat/instagram-controlled-write-canary-v2
