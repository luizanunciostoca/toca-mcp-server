name: Instagram Shadow Step Order Transform

on:
  push:
    branches:
      - fix/instagram-production-shadow-readiness-order-20260903

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/instagram-production-shadow-readiness-order-20260903
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply deterministic step-order repair
        run: python .github/scripts/fix-instagram-shadow-step-order.py

      - name: Format exact outputs
        run: >-
          pnpm exec prettier --write
          .github/workflows/instagram-engagement-shadow-production.yml
          test/instagram-engagement-production-shadow-step-order.test.ts

      - name: Run focused regression contract
        run: pnpm exec vitest run test/instagram-engagement-production-shadow-step-order.test.ts test/instagram-engagement-production-shadow-candidate-routing.test.ts test/instagram-conversation-shadow-controller.test.ts

      - name: Stage transformed blobs in neutral paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/generated-instagram-shadow-order
          cp .github/workflows/instagram-engagement-shadow-production.yml control/generated-instagram-shadow-order/instagram-engagement-shadow-production.yml
          cp test/instagram-engagement-production-shadow-step-order.test.ts control/generated-instagram-shadow-order/instagram-engagement-production-shadow-step-order.test.ts

      - name: Publish neutral transformed blobs only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control/generated-instagram-shadow-order/
          git diff --cached --quiet && { echo 'No transformed blobs produced' >&2; exit 1; }
          git commit -m "chore(instagram): publish shadow ordering repair blobs"
          git push origin HEAD:fix/instagram-production-shadow-readiness-order-20260903
