name: Instagram Webhook Dependency Readonly Diagnostic

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: write
  id-token: write

concurrency:
  # Observe the same callback service while holding its existing control mutex.
  group: ${{ github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'PRODUCTION AUTHORIZATION — Instagram webhook dependency READONLY diagnostic AUTO') && 'instagram-engagement-webhook-callback-control' || format('webhook-dependency-irrelevant-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'PRODUCTION AUTHORIZATION — Instagram webhook dependency READONLY diagnostic AUTO')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      AUTHORIZATION_ISSUE_NUMBER: ${{ github.event.issue.number }}
      WEBHOOK_DIAGNOSTIC_DIR: /tmp/webhook-dependency-${{ github.run_id }}-${{ github.run_attempt }}
      CLOUD_SQL_PROXY_PATH: /tmp/webhook-dependency-proxy-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout exact controller and observed runtime history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Validate LIVE owner authorization and certified source contracts
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/instagram-webhook-dependency-readonly-diagnostic.mjs authorize

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Install existing locked PostgreSQL client
        run: pnpm install --frozen-lockfile

      - name: Obtain pinned existing Cloud SQL client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 60 \
            'https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.24.1/cloud-sql-proxy.linux.amd64' \
            --output "$CLOUD_SQL_PROXY_PATH"
          echo "fae2766aac9d614a2bdef2f2a7778f3d054f3acd5ff07a81a9e300bd471512eb  $CLOUD_SQL_PROXY_PATH" | sha256sum --check --status
          chmod 700 "$CLOUD_SQL_PROXY_PATH"

      - name: Authenticate existing governed deployer identity
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Read bounded metadata and outbox aggregate under LIVE authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/instagram-webhook-dependency-readonly-diagnostic.mjs diagnose

      - name: Record sanitized result and close only this authorization
        if: always() && steps.authorize.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/instagram-webhook-dependency-readonly-diagnostic.mjs finish

      - name: Upload only public scoped diagnostic evidence
        if: always() && steps.authorize.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webhook-dependency-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.WEBHOOK_DIAGNOSTIC_DIR }}/context.json
            ${{ env.WEBHOOK_DIAGNOSTIC_DIR }}/result.json
            ${{ env.WEBHOOK_DIAGNOSTIC_DIR }}/finalization.json
          if-no-files-found: error
          retention-days: 7
