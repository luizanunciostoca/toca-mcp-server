name: Ops Staging WIF Condition Read Now 2026-08-21

on:
  push:
    branches: [ops/staging-wif-condition-read-20260821]
    paths: ['.github/workflows/ops-staging-wif-condition-read-now.yml']

permissions:
  contents: read
  id-token: write

jobs:
  read:
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 10
    steps:
      - name: Authenticate infrastructure administrator
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Read exact staging provider condition
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'luizanunciostoca/toca-mcp-server'
          gcloud iam workload-identity-pools providers describe github-toca-mcp-staging \
            --project toca-mcp-next-staging \
            --location global \
            --workload-identity-pool github-staging \
            --format='value(attributeCondition)'
          echo 'PRODUCTION_MUTATION=NO'
          echo 'STAGING_MUTATION=NO'
