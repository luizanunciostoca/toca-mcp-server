name: TEMP Instagram Limited Safety Patch

on:
  push:
    branches:
      - fix/instagram-limited-activation-safety-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/instagram-limited-activation-safety-v1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply deterministic safety patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          processor = Path('src/instagram-engagement/processor.ts')
          text = processor.read_text()
          old = """  readonly writesEnabled: boolean;\n  readonly actorPrincipalId?: string;"""
          new = """  readonly writesEnabled: boolean;\n  readonly autoReplyChannels?: readonly ('COMMENT' | 'DIRECT')[];\n  readonly actorPrincipalId?: string;"""
          assert old in text
          text = text.replace(old, new, 1)
          old = """    const autoWriteEligible =\n      this.options.writesEnabled &&\n      classification.confidence !== 'LOW' &&\n      !context.automationBlocked;"""
          new = """    const autoReplyChannels = new Set(\n      this.options.autoReplyChannels ?? (['COMMENT', 'DIRECT'] as const),\n    );\n    const autoWriteEligible =\n      this.options.writesEnabled &&\n      autoReplyChannels.has(payload.channel) &&\n      classification.confidence === 'HIGH' &&\n      ['P2', 'P3'].includes(classification.priority) &&\n      !classification.containsPotentialSensitiveData &&\n      classification.commercialIntent === 'NONE' &&\n      classification.urgency === 'LOW' &&\n      !context.automationBlocked;"""
          assert old in text
          processor.write_text(text.replace(old, new, 1))

          runtime = Path('src/instagram-engagement/runtime.ts')
          text = runtime.read_text()
          old = """    instagramUserId,\n    writesEnabled: config.INSTAGRAM_ENGAGEMENT_WRITES_ENABLED,\n  });"""
          new = """    instagramUserId,\n    writesEnabled: config.INSTAGRAM_ENGAGEMENT_WRITES_ENABLED,\n    // Persistent production activation is intentionally DIRECT-only until a\n    // separate real COMMENT provider-acknowledgement gate is satisfied.\n    autoReplyChannels: ['DIRECT'],\n  });"""
          assert old in text
          runtime.write_text(text.replace(old, new, 1))

          lead = Path('src/crm/social-engagement-lead-engine.ts')
          text = lead.read_text()
          old = """      containsSensitivePersonalData: sensitive,\n      writesEnabled: hasWriteAuthority(input.authorization),\n    });"""
          new = """      containsSensitivePersonalData: sensitive,\n      writesEnabled: hasWriteAuthority(input.authorization),\n      classificationConfidence:\n        input.authorization.classificationConfidence ?? classification.confidence,\n      contextConflict: input.authorization.contextConflict,\n      threadAutomationBlocked: input.authorization.threadAutomationBlocked,\n    });"""
          assert old in text
          lead.write_text(text.replace(old, new, 1))
          PY
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            src/instagram-engagement/processor.ts \
            src/instagram-engagement/runtime.ts \
            src/crm/social-engagement-lead-engine.ts
          git diff --check
      - name: Commit deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/instagram-engagement/processor.ts src/instagram-engagement/runtime.ts src/crm/social-engagement-lead-engine.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(instagram): align persistent writes with limited canary envelope'
          git push origin HEAD:fix/instagram-limited-activation-safety-v1
