name: Ops Staging Monitoring Service Agent Binding 2026-08-22

on:
  pull_request:
    paths: ['.github/workflows/ops-staging-monitoring-service-agent-binding.yml']

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-next-staging
  PROJECT_NUMBER: '729069789107'
  PRODUCTION_PROJECT_ID: toca-mcp-production
  PRODUCTION_PROJECT_NUMBER: '990081828836'
  REGION: southamerica-east1
  WEBHOOK_SERVICE: toca-webhook-next-staging
  STAGING_WIF: projects/729069789107/locations/global/workloadIdentityPools/github-staging/providers/github-toca-mcp-staging
  STAGING_OPERATOR_SA: toca-next-stg-deployer@toca-mcp-next-staging.iam.gserviceaccount.com
  INFRA_WIF: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  INFRA_ADMIN_SA: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com
  MONITORING_SERVICE_AGENT: service-729069789107@gcp-sa-monitoring-notification.iam.gserviceaccount.com
  UPTIME_DISPLAY_NAME: TOCA Next Staging — Webhook Readiness

jobs:
  seed-uptime:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    outputs:
      uptime_name: ${{ steps.seed.outputs.uptime_name }}
    steps:
      - name: Authenticate isolated staging operator
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.STAGING_WIF }}
          service_account: ${{ env.STAGING_OPERATOR_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Seed exact authenticated Cloud Run uptime check
        id: seed
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'luizanunciostoca/toca-mcp-server'
          test "$PROJECT_ID" != "$PRODUCTION_PROJECT_ID"
          test "$PROJECT_NUMBER" != "$PRODUCTION_PROJECT_NUMBER"
          test "$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)" = "$STAGING_OPERATOR_SA"
          test "$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')" = "$PROJECT_NUMBER"

          gcloud run services describe "$WEBHOOK_SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(metadata.name)' | grep -Fx "$WEBHOOK_SERVICE" >/dev/null

          TOKEN="$(gcloud auth print-access-token)"
          UPTIME_API="https://monitoring.googleapis.com/v3/projects/${PROJECT_ID}/uptimeCheckConfigs"
          curl --fail --silent --show-error -H "Authorization: Bearer ${TOKEN}" "$UPTIME_API" > /tmp/uptime-list.json
          UPTIME_NAME="$(jq -r --arg display "$UPTIME_DISPLAY_NAME" 'first(.uptimeCheckConfigs[]? | select(.displayName==$display) | .name) // empty' /tmp/uptime-list.json)"

          if [[ -z "$UPTIME_NAME" ]]; then
            jq -n \
              --arg display "$UPTIME_DISPLAY_NAME" \
              --arg project "$PROJECT_ID" \
              --arg location "$REGION" \
              --arg service "$WEBHOOK_SERVICE" \
              '{
                displayName:$display,
                monitoredResource:{type:"cloud_run_revision",labels:{project_id:$project,location:$location,service_name:$service}},
                httpCheck:{requestMethod:"GET",path:"/readyz",port:443,useSsl:true,serviceAgentAuthentication:{type:"OIDC_TOKEN"}},
                timeout:"10s",
                period:"300s"
              }' > /tmp/uptime-create.json
            HTTP_CODE="$(curl --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/uptime-create.json \
              --output /tmp/uptime-created.json \
              --write-out '%{http_code}' \
              "$UPTIME_API")"
            if [[ "$HTTP_CODE" != 2* ]]; then
              echo "STAGING_UPTIME_CREATE_HTTP=${HTTP_CODE}"
              jq -c '{error:{code:(.error.code // null),status:(.error.status // null),message:(.error.message // "unknown")}}' /tmp/uptime-created.json
              exit 1
            fi
            UPTIME_NAME="$(jq -r '.name // empty' /tmp/uptime-created.json)"
          fi
          test -n "$UPTIME_NAME"

          curl --fail --silent --show-error -H "Authorization: Bearer ${TOKEN}" \
            "https://monitoring.googleapis.com/v3/${UPTIME_NAME}" > /tmp/uptime-readback.json
          unset TOKEN

          jq -e \
            --arg display "$UPTIME_DISPLAY_NAME" \
            --arg project "$PROJECT_ID" \
            --arg location "$REGION" \
            --arg service "$WEBHOOK_SERVICE" '
            .displayName==$display and
            .monitoredResource.type=="cloud_run_revision" and
            .monitoredResource.labels.project_id==$project and
            .monitoredResource.labels.location==$location and
            .monitoredResource.labels.service_name==$service and
            .httpCheck.requestMethod=="GET" and
            .httpCheck.path=="/readyz" and
            .httpCheck.port==443 and
            .httpCheck.useSsl==true and
            .httpCheck.serviceAgentAuthentication.type=="OIDC_TOKEN" and
            .period=="300s" and
            .timeout=="10s"
          ' /tmp/uptime-readback.json >/dev/null

          echo "uptime_name=$UPTIME_NAME" >> "$GITHUB_OUTPUT"
          echo 'STAGING_AUTHENTICATED_CLOUD_RUN_UPTIME_SEED=PASS'
          echo 'PRODUCTION_MUTATION=false'
          echo 'PROVIDER_MUTATION=false'
          echo 'DATABASE_MUTATION=false'
          echo 'BACKUP_MUTATION=false'
          echo 'DR_MUTATION=false'
          echo 'TRAFFIC_MUTATION=false'
          echo 'CLOUD_RUN_MUTATION=false'
          echo 'SECRET_MUTATION=false'

  bind-service-agent:
    needs: seed-uptime
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 10
    steps:
      - name: Authenticate infrastructure administrator
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.INFRA_WIF }}
          service_account: ${{ env.INFRA_ADMIN_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Bind and read back exact Monitoring service agent role
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_ID" != "$PRODUCTION_PROJECT_ID"
          test "$PROJECT_NUMBER" != "$PRODUCTION_PROJECT_NUMBER"
          test "$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')" = "$PROJECT_NUMBER"
          test -n "${{ needs.seed-uptime.outputs.uptime_name }}"

          OBSERVED_EMAIL=''
          for attempt in $(seq 1 30); do
            OBSERVED_EMAIL="$(gcloud iam service-accounts describe "$MONITORING_SERVICE_AGENT" \
              --project="$PROJECT_ID" \
              --format='value(email)' 2>/dev/null || true)"
            if [[ "$OBSERVED_EMAIL" = "$MONITORING_SERVICE_AGENT" ]]; then
              break
            fi
            sleep 3
          done
          test "$OBSERVED_EMAIL" = "$MONITORING_SERVICE_AGENT"

          MEMBER="serviceAccount:${MONITORING_SERVICE_AGENT}"
          ROLE='roles/monitoring.notificationServiceAgent'
          gcloud projects add-iam-policy-binding "$PROJECT_ID" \
            --member="$MEMBER" \
            --role="$ROLE" \
            --condition=None \
            --quiet >/dev/null

          PROJECT_POLICY="$(gcloud projects get-iam-policy "$PROJECT_ID" --format=json)"
          jq -e --arg role "$ROLE" --arg member "$MEMBER" \
            'any(.bindings[]?; .role==$role and any(.members[]?; .==$member))' \
            <<<"$PROJECT_POLICY" >/dev/null

          echo 'STAGING_MONITORING_SERVICE_AGENT_IDENTITY=PASS'
          echo 'STAGING_MONITORING_SERVICE_AGENT_BINDING=PASS'
          echo 'PRODUCTION_MUTATION=false'
          echo 'PROVIDER_MUTATION=false'
          echo 'DATABASE_MUTATION=false'
          echo 'BACKUP_MUTATION=false'
          echo 'DR_MUTATION=false'
          echo 'TRAFFIC_MUTATION=false'
          echo 'CLOUD_RUN_MUTATION=false'
          echo 'SECRET_MUTATION=false'
