name: Internal Acceptance PostgreSQL Migrations Tenancy

on:
  pull_request:
    paths:
      - 'test/internal-acceptance-scheduler-tenancy-postgres.test.ts'
      - '.github/workflows/internal-acceptance-postgres-tenancy.yml'

permissions:
  contents: read

concurrency:
  group: internal-acceptance-postgres-tenancy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: 75c165a044c6e79e9545328dd04a2a3e73d2e910
  DATABASE_URL: postgres://toca:toca-internal-acceptance-only@127.0.0.1:5432/toca_acceptance
  DATABASE_SSL: 'false'
  GOOGLE_ADS_PHASE: 'OFF'

jobs:
  acceptance:
    if: github.head_ref == 'internal-acceptance/postgres-tenancy-75c165a-20260822'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: toca
          POSTGRES_PASSWORD: toca-internal-acceptance-only
          POSTGRES_DB: toca_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toca -d toca_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout acceptance harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prove product tree is exact candidate plus harness only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$CANDIDATE_SHA")" = "$CANDIDATE_SHA"
          mapfile -t changed < <(git diff --name-only "$CANDIDATE_SHA"..HEAD | sort)
          printf 'Acceptance-only diff:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/internal-acceptance-postgres-tenancy.yml"
          test "${changed[1]}" = "test/internal-acceptance-scheduler-tenancy-postgres.test.ts"
          echo "PRODUCT_CANDIDATE_SHA=$CANDIDATE_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install exact-candidate dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify migration inventory contract
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync } from 'node:fs';
          const files = readdirSync('migrations').filter((f) => f.endsWith('.sql')).sort();
          const expected = [
            '001_production_foundation.sql','002_worker_dead_letter.sql','003_meta_webhook_idempotency.sql',
            '004_meta_webhook_reply_routing.sql','005_approval_governance.sql','006_approval_execution_atomicity.sql',
            '007_durable_workflow_persistence.sql','008_workflow_execution_claims.sql','009_transactional_outbox.sql',
            '010_audit_ledger_observability.sql','011_event_record.sql','012_crm_core_records.sql',
            '013_measurement_ticketing_attribution.sql','014_privacy_governance.sql','020_content_item_versioning_video.sql',
            '021_r29_video_artifacts.sql','022_meta_ads_geo_demand_intelligence.sql','023_crm_sales_engine.sql',
            '024_email_provider_runtime.sql','025_marketing_autopilot_r31_learning.sql','026_ag01_orchestrator_runtime.sql',
            '028_attribution_revenue_feedback.sql','029_asset_intelligence_content_supply.sql','030_whatsapp_provider_runtime.sql',
            '031_multi_tenant_foundation.sql','032_tenant_scoped_approvals.sql','033_omnichannel_prepared_content.sql'
          ];
          if (JSON.stringify(files) !== JSON.stringify(expected)) throw new Error(`MIGRATION_INVENTORY_DRIFT:${JSON.stringify(files)}`);
          if (files.some((f) => /^027_/.test(f))) throw new Error('MIGRATION_027_MUST_REMAIN_ABSENT');
          if (files.at(-1) !== '033_omnichannel_prepared_content.sql') throw new Error(`MIGRATION_MAX_INVALID:${files.at(-1)}`);
          console.log(`MIGRATIONS_TOTAL=${files.length}`);
          console.log(`MIGRATION_MAX=${files.at(-1)}`);
          console.log('GAP_027_ABSENT=true');
          NODE

      - name: Apply migrations to empty PostgreSQL 18
        run: pnpm migrate

      - name: Validate schema_migrations and catalog constraints
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          import { writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          const versions = (await pool.query('select version from schema_migrations order by version')).rows.map((r) => r.version);
          if (versions.length !== 27) throw new Error(`SCHEMA_MIGRATIONS_COUNT:${versions.length}`);
          if (versions.some((v) => /^027_/.test(v))) throw new Error('SCHEMA_MIGRATIONS_CONTAINS_027');
          if (versions.at(-1) !== '033_omnichannel_prepared_content.sql') throw new Error(`SCHEMA_MIGRATIONS_MAX:${versions.at(-1)}`);
          const tables = (await pool.query("select tablename from pg_tables where schemaname='public' order by tablename")).rows.map((r) => r.tablename);
          const critical = {
            workflow: tables.some((t) => t.startsWith('workflow_')),
            outbox: tables.includes('event_outbox'),
            dlq: tables.includes('dead_letter_jobs'),
            audit: tables.some((t) => t.startsWith('audit_')),
            privacy: tables.some((t) => /privacy|consent|suppression|erasure/.test(t)),
            crm: tables.some((t) => t.startsWith('crm_')),
            ag01: tables.some((t) => t.startsWith('ag01_')),
            prepared_content: tables.includes('omnichannel_prepared_content'),
          };
          for (const [name, present] of Object.entries(critical)) if (!present) throw new Error(`CRITICAL_TABLE_FAMILY_MISSING:${name}`);
          const constraints = await pool.query(`select c.contype, count(*)::int as count from pg_constraint c join pg_namespace n on n.oid=c.connamespace where n.nspname='public' group by c.contype order by c.contype`);
          const counts = Object.fromEntries(constraints.rows.map((r) => [r.contype, Number(r.count)]));
          for (const type of ['p','f','u','c']) if (!counts[type]) throw new Error(`CONSTRAINT_TYPE_MISSING:${type}`);
          const nn = Number((await pool.query("select count(*) from information_schema.columns where table_schema='public' and is_nullable='NO'")).rows[0].count);
          const defaults = Number((await pool.query("select count(*) from information_schema.columns where table_schema='public' and column_default is not null")).rows[0].count);
          const indexes = Number((await pool.query("select count(*) from pg_indexes where schemaname='public'")).rows[0].count);
          const timestamps = Number((await pool.query("select count(*) from information_schema.columns where table_schema='public' and data_type like 'timestamp%'")).rows[0].count);
          if (!nn || !defaults || !indexes || !timestamps) throw new Error(`CATALOG_INTEGRITY_COUNTS:${nn}:${defaults}:${indexes}:${timestamps}`);
          const catalog = {
            columns: (await pool.query(`select table_name,column_name,data_type,udt_name,is_nullable,column_default from information_schema.columns where table_schema='public' order by table_name,ordinal_position`)).rows,
            constraints: (await pool.query(`select c.conname,c.contype,c.conrelid::regclass::text as rel,pg_get_constraintdef(c.oid,true) as def from pg_constraint c join pg_namespace n on n.oid=c.connamespace where n.nspname='public' order by rel,c.conname`)).rows,
            indexes: (await pool.query(`select tablename,indexname,indexdef from pg_indexes where schemaname='public' order by tablename,indexname`)).rows,
          };
          const fingerprint = createHash('sha256').update(JSON.stringify(catalog)).digest('hex');
          writeFileSync('/tmp/schema-fingerprint-before.txt', fingerprint);
          console.log(`PUBLIC_TABLES=${tables.length}`);
          console.log(`CONSTRAINTS=${JSON.stringify(counts)}`);
          console.log(`NOT_NULL_COLUMNS=${nn}`);
          console.log(`DEFAULTED_COLUMNS=${defaults}`);
          console.log(`INDEXES=${indexes}`);
          console.log(`TIMESTAMP_COLUMNS=${timestamps}`);
          console.log(`SCHEMA_FINGERPRINT_BEFORE=${fingerprint}`);
          await pool.end();
          NODE

      - name: Run canonical real-PostgreSQL and tenant boundary suites
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pg_tests < <(find test -maxdepth 1 -type f -name '*postgres-e2e.test.ts' -print | sort)
          printf 'PostgreSQL E2E files (%s):\n%s\n' "${#pg_tests[@]}" "${pg_tests[*]}"
          pnpm exec vitest run "${pg_tests[@]}" \
            test/tenant-isolation.test.ts \
            test/tenant-runtime-identity.test.ts \
            test/multi-tenant-migration-contract.test.ts

      - name: Re-run migrator and prove idempotence
        shell: bash
        run: |
          set -euo pipefail
          output="$(pnpm migrate)"
          printf '%s\n' "$output"
          if grep -q '^Applied migration ' <<<"$output"; then
            echo 'Migration re-run unexpectedly applied a migration.' >&2
            exit 1
          fi
          echo 'MIGRATOR_IDEMPOTENT=true'

      - name: Prove schema has no drift after tests and migrator re-run
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          const catalog = {
            columns: (await pool.query(`select table_name,column_name,data_type,udt_name,is_nullable,column_default from information_schema.columns where table_schema='public' order by table_name,ordinal_position`)).rows,
            constraints: (await pool.query(`select c.conname,c.contype,c.conrelid::regclass::text as rel,pg_get_constraintdef(c.oid,true) as def from pg_constraint c join pg_namespace n on n.oid=c.connamespace where n.nspname='public' order by rel,c.conname`)).rows,
            indexes: (await pool.query(`select tablename,indexname,indexdef from pg_indexes where schemaname='public' order by tablename,indexname`)).rows,
          };
          const after = createHash('sha256').update(JSON.stringify(catalog)).digest('hex');
          const before = readFileSync('/tmp/schema-fingerprint-before.txt','utf8').trim();
          console.log(`SCHEMA_FINGERPRINT_AFTER=${after}`);
          if (after !== before) throw new Error(`SCHEMA_DRIFT:${before}:${after}`);
          console.log('SCHEMA_DRIFT=NONE');
          await pool.end();
          NODE

      - name: Adversarial scheduler and DLQ cross-tenant probes
        run: pnpm exec vitest run test/internal-acceptance-scheduler-tenancy-postgres.test.ts
