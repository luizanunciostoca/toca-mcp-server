name: Internal Acceptance PostgreSQL Migrations Tenancy

on:
  push:
    branches:
      - 'internal-acceptance/postgres-tenancy-75c165a-20260822'
    paths:
      - 'test/internal-acceptance-scheduler-tenancy-postgres.test.ts'
      - '.github/workflows/internal-acceptance-postgres-tenancy.yml'

permissions:
  contents: write

env:
  CANDIDATE_SHA: 75c165a044c6e79e9545328dd04a2a3e73d2e910
  DATABASE_URL: postgres://toca:toca-internal-acceptance-only@127.0.0.1:5432/toca_acceptance
  DATABASE_SSL: 'false'
  GOOGLE_ADS_PHASE: 'OFF'

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: toca
          POSTGRES_PASSWORD: toca-internal-acceptance-only
          POSTGRES_DB: toca_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toca -d toca_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout harness branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Prove product tree equals frozen candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$CANDIDATE_SHA")" = "$CANDIDATE_SHA"
          mapfile -t changed < <(git diff --name-only "$CANDIDATE_SHA"..HEAD | sort)
          printf 'HARNESS_DIFF=%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/internal-acceptance-postgres-tenancy.yml"
          test "${changed[1]}" = "test/internal-acceptance-scheduler-tenancy-postgres.test.ts"
          echo "PRODUCT_CANDIDATE_SHA=$CANDIDATE_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify migration inventory
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, writeFileSync } from 'node:fs';
          const files = readdirSync('migrations').filter((f) => f.endsWith('.sql')).sort();
          if (files.length !== 27) throw new Error(`MIGRATIONS_TOTAL:${files.length}`);
          if (files.some((f) => /^027_/.test(f))) throw new Error('GAP_027_NOT_ABSENT');
          if (files.at(-1) !== '033_omnichannel_prepared_content.sql') throw new Error(`MIGRATION_MAX:${files.at(-1)}`);
          writeFileSync('/tmp/migrations.json', JSON.stringify(files));
          console.log(`MIGRATIONS_TOTAL=${files.length}`);
          console.log(`MIGRATION_MAX=${files.at(-1)}`);
          console.log('GAP_027_ABSENT=true');
          NODE

      - name: Apply migrations from empty database
        run: pnpm migrate

      - name: Snapshot schema and validate catalog
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg'; import { createHash } from 'node:crypto'; import { writeFileSync } from 'node:fs';
          const p = new pg.Pool({connectionString:process.env.DATABASE_URL});
          const versions=(await p.query('select version from schema_migrations order by version')).rows.map(r=>r.version);
          if(versions.length!==27 || versions.some(v=>/^027_/.test(v)) || versions.at(-1)!=='033_omnichannel_prepared_content.sql') throw new Error(`SCHEMA_MIGRATIONS_INVALID:${JSON.stringify(versions)}`);
          const tables=(await p.query("select tablename from pg_tables where schemaname='public' order by tablename")).rows.map(r=>r.tablename);
          for(const [name,ok] of Object.entries({workflow:tables.some(t=>t.startsWith('workflow_')),outbox:tables.includes('event_outbox'),dlq:tables.includes('dead_letter_jobs'),audit:tables.some(t=>t.startsWith('audit_')),privacy:tables.some(t=>/privacy|consent|suppression|erasure/.test(t)),crm:tables.some(t=>t.startsWith('crm_')),ag01:tables.some(t=>t.startsWith('ag01_')),prepared:tables.includes('omnichannel_prepared_content')})) if(!ok) throw new Error(`CRITICAL_TABLE_MISSING:${name}`);
          const cons=(await p.query("select c.contype,count(*)::int count from pg_constraint c join pg_namespace n on n.oid=c.connamespace where n.nspname='public' group by c.contype order by c.contype")).rows;
          const counts=Object.fromEntries(cons.map(r=>[r.contype,Number(r.count)])); for(const t of ['p','f','u','c']) if(!counts[t]) throw new Error(`CONSTRAINT_TYPE_MISSING:${t}`);
          const nn=Number((await p.query("select count(*) from information_schema.columns where table_schema='public' and is_nullable='NO'")).rows[0].count);
          const defaults=Number((await p.query("select count(*) from information_schema.columns where table_schema='public' and column_default is not null")).rows[0].count);
          const indexes=Number((await p.query("select count(*) from pg_indexes where schemaname='public'")).rows[0].count);
          const timestamps=Number((await p.query("select count(*) from information_schema.columns where table_schema='public' and data_type like 'timestamp%'")).rows[0].count);
          const catalog={columns:(await p.query("select table_name,column_name,data_type,udt_name,is_nullable,column_default from information_schema.columns where table_schema='public' order by table_name,ordinal_position")).rows,constraints:(await p.query("select c.conname,c.contype,c.conrelid::regclass::text rel,pg_get_constraintdef(c.oid,true) def from pg_constraint c join pg_namespace n on n.oid=c.connamespace where n.nspname='public' order by rel,c.conname")).rows,indexes:(await p.query("select tablename,indexname,indexdef from pg_indexes where schemaname='public' order by tablename,indexname")).rows};
          const hash=createHash('sha256').update(JSON.stringify(catalog)).digest('hex');
          writeFileSync('/tmp/schema-before.txt',hash); writeFileSync('/tmp/catalog-summary.json',JSON.stringify({publicTables:tables.length,constraints:counts,notNullColumns:nn,defaultedColumns:defaults,indexes,timestampColumns:timestamps,criticalTables:tables.filter(t=>/workflow|outbox|dead|audit|privacy|consent|crm_|ag01_|prepared_content/.test(t))},null,2));
          console.log(`SCHEMA_FINGERPRINT_BEFORE=${hash}`); console.log(`PUBLIC_TABLES=${tables.length}`); console.log(`CONSTRAINTS=${JSON.stringify(counts)}`); console.log(`NOT_NULL_COLUMNS=${nn} DEFAULTS=${defaults} INDEXES=${indexes} TIMESTAMPS=${timestamps}`);
          await p.end();
          NODE

      - id: canonical
        name: Run all real PostgreSQL E2E and tenant-boundary suites
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mapfile -t pg_tests < <(find test -maxdepth 1 -type f -name '*postgres-e2e.test.ts' -print | sort)
          echo "POSTGRES_E2E_FILES=${#pg_tests[@]}"
          pnpm exec vitest run "${pg_tests[@]}" test/tenant-isolation.test.ts test/tenant-runtime-identity.test.ts test/multi-tenant-migration-contract.test.ts 2>&1 | tee /tmp/canonical.log

      - id: rerun
        name: Re-run migrator for idempotence
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          output="$(pnpm migrate)"; printf '%s\n' "$output" | tee /tmp/migrate-rerun.log
          if grep -q '^Applied migration ' <<<"$output"; then exit 1; fi
          echo 'MIGRATOR_IDEMPOTENT=true'

      - id: drift
        name: Verify schema drift is zero
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg'; import { createHash } from 'node:crypto'; import { readFileSync,writeFileSync } from 'node:fs';
          const p=new pg.Pool({connectionString:process.env.DATABASE_URL});
          const catalog={columns:(await p.query("select table_name,column_name,data_type,udt_name,is_nullable,column_default from information_schema.columns where table_schema='public' order by table_name,ordinal_position")).rows,constraints:(await p.query("select c.conname,c.contype,c.conrelid::regclass::text rel,pg_get_constraintdef(c.oid,true) def from pg_constraint c join pg_namespace n on n.oid=c.connamespace where n.nspname='public' order by rel,c.conname")).rows,indexes:(await p.query("select tablename,indexname,indexdef from pg_indexes where schemaname='public' order by tablename,indexname")).rows};
          const after=createHash('sha256').update(JSON.stringify(catalog)).digest('hex'); const before=readFileSync('/tmp/schema-before.txt','utf8').trim(); writeFileSync('/tmp/schema-after.txt',after); console.log(`SCHEMA_FINGERPRINT_AFTER=${after}`); if(after!==before) throw new Error(`SCHEMA_DRIFT:${before}:${after}`); console.log('SCHEMA_DRIFT=NONE'); await p.end();
          NODE

      - id: probe
        name: Adversarial scheduler and DLQ cross-tenant probes
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec vitest run test/internal-acceptance-scheduler-tenancy-postgres.test.ts 2>&1 | tee /tmp/probe.log

      - name: Persist acceptance evidence on disposable branch
        if: always()
        shell: bash
        env:
          CANONICAL_OUTCOME: ${{ steps.canonical.outcome }}
          RERUN_OUTCOME: ${{ steps.rerun.outcome }}
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          TESTED_HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p internal-acceptance-evidence
          node --input-type=module <<'NODE'
          import { existsSync,readFileSync,writeFileSync } from 'node:fs';
          const read=(p,fallback)=>existsSync(p)?readFileSync(p,'utf8').trim():fallback;
          const probe=JSON.parse(read('/tmp/internal-acceptance-tenant-probe.json','{"tenantsTested":0,"crossTenantAttempts":0,"crossTenantLeaks":0,"attempts":[]}'));
          const summary={front:'POSTGRES_MIGRATIONS_TENANCY',candidateSha:process.env.CANDIDATE_SHA,testedHarnessHead:process.env.TESTED_HEAD_SHA,runId:process.env.RUN_ID,postgres:'18',productionTouched:false,providerCalls:false,googleAdsPhase:'OFF',migrations:JSON.parse(read('/tmp/migrations.json','[]')),migrationMax:'033_omnichannel_prepared_content.sql',gap027Absent:true,catalog:JSON.parse(read('/tmp/catalog-summary.json','{}')),schemaFingerprintBefore:read('/tmp/schema-before.txt',null),schemaFingerprintAfter:read('/tmp/schema-after.txt',null),canonicalOutcome:process.env.CANONICAL_OUTCOME,migratorRerunOutcome:process.env.RERUN_OUTCOME,schemaDriftOutcome:process.env.DRIFT_OUTCOME,adversarialProbeOutcome:process.env.PROBE_OUTCOME,...probe};
          writeFileSync('internal-acceptance-evidence/postgres-tenancy-75c165a.json',JSON.stringify(summary,null,2)+'\n');
          NODE
          git config user.name 'toca-os-internal-acceptance'
          git config user.email 'actions@users.noreply.github.com'
          git add internal-acceptance-evidence/postgres-tenancy-75c165a.json
          git commit -m 'test(internal-acceptance): record PostgreSQL tenancy evidence' || true
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Enforce acceptance gate
        if: always()
        shell: bash
        env:
          CANONICAL_OUTCOME: ${{ steps.canonical.outcome }}
          RERUN_OUTCOME: ${{ steps.rerun.outcome }}
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          set -euo pipefail
          leaks="$(node -e "const r=require('fs').existsSync('/tmp/internal-acceptance-tenant-probe.json')?JSON.parse(require('fs').readFileSync('/tmp/internal-acceptance-tenant-probe.json','utf8')).crossTenantLeaks:999; process.stdout.write(String(r))")"
          echo "CANONICAL=$CANONICAL_OUTCOME RERUN=$RERUN_OUTCOME DRIFT=$DRIFT_OUTCOME PROBE=$PROBE_OUTCOME CROSS_TENANT_LEAKS=$leaks"
          test "$CANONICAL_OUTCOME" = success
          test "$RERUN_OUTCOME" = success
          test "$DRIFT_OUTCOME" = success
          test "$PROBE_OUTCOME" = success
          test "$leaks" = 0
