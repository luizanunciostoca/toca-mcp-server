name: Meta Ads Post-Fix Failure Diagnostic

on:
  push:
    branches:
      - diag/meta-ads-post-fix-create-paused-smoke
    paths:
      - '.github/workflows/meta-ads-post-fix-failure-diagnostic.yml'

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Read sanitized failed execution logs
        shell: bash
        run: |
          set -euo pipefail
          gcloud logging read \
            'resource.type="cloud_run_job" AND resource.labels.job_name="toca-meta-ads-create-paused-smoke-fix74-v2" AND timestamp>="2026-08-14T03:05:15Z" AND timestamp<="2026-08-14T03:05:40Z"' \
            --project toca-mcp-production \
            --order=asc \
            --limit=300 \
            --format=json > /tmp/logs.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          entries = json.loads(Path('/tmp/logs.json').read_text() or '[]')
          markers = (
              'MetaApiError', 'META_HTTP_', 'META_CODE_', 'META_SUBCODE_', 'META_REASON_',
              'createCampaign', 'createAdSet', 'createCreative', 'createAd',
              'MetaAdsControlledWriteService', 'SMOKE_FAILED', 'Error:'
          )
          matches = []
          for entry in entries:
              text = entry.get('textPayload')
              if not isinstance(text, str):
                  payload = entry.get('jsonPayload')
                  if isinstance(payload, dict):
                      text = json.dumps(payload, sort_keys=True)
              if isinstance(text, str) and any(marker in text for marker in markers):
                  matches.append(text[:6000])

          print(f'META_ADS_POST_FIX_DIAGNOSTIC_MATCH_COUNT={len(matches)}')
          for i, text in enumerate(matches, 1):
              print(f'--- DIAGNOSTIC_{i} ---')
              print(text)
          if not matches:
              raise SystemExit('No diagnostic lines found')
          PY
