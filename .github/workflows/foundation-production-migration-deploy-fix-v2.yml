name: Foundation Production Migration Deploy Fix V2

on:
  push:
    branches: [fix/foundation-daily-control-observability]
    paths: ['.github/workflows/foundation-production-migration-deploy-fix-v2.yml']

permissions:
  contents: write

env:
  MIGRATION_JOB_B64:  

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/foundation-daily-control-observability
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch permanent deploy gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path('.github/workflows/deploy-toca-managed-instagram-daemon-gcp.yml')
          text = path.read_text()
          if '  migrate-production:\n' in text:
              raise SystemExit('migrate-production already exists')
          marker = '  provision-minute-trigger:\n'
          if marker not in text:
              raise SystemExit('provision marker missing')
          job = base64.b64decode(os.environ['MIGRATION_JOB_B64']).decode()
          text = text.replace(marker, job + marker, 1)
          old = '    needs: [quality-build-image, provision-minute-trigger]\n'
          new = '    needs: [quality-build-image, migrate-production, provision-minute-trigger]\n'
          if old not in text:
              raise SystemExit('deploy needs marker missing')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write .github/workflows/deploy-toca-managed-instagram-daemon-gcp.yml
          pnpm quality
      - name: Commit deployment gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/deploy-toca-managed-instagram-daemon-gcp.yml
          git commit -m 'fix(reliability): gate production deploy on schema migrations'
          git push origin HEAD:fix/foundation-daily-control-observability
