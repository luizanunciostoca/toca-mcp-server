name: Instagram Engagement Webhook Startup Diagnostic

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: ${{ github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'PRODUCTION DIAGNOSTIC AUTHORIZATION — Instagram webhook startup AUTO') && 'instagram-webhook-startup-diagnostic' || format('instagram-webhook-startup-diagnostic-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DIAGNOSTIC_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  WEBHOOK_SERVICE_NAME: toca-webhook-next-production

jobs:
  diagnose:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'PRODUCTION DIAGNOSTIC AUTHORIZATION — Instagram webhook startup AUTO')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate exact read-only authorization
        id: auth
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ISSUE_NUMBER="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
          ISSUE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
          BODY="$(printf '%s' "$ISSUE_JSON" | jq -r '.body // ""')"
          printf '%s' "$ISSUE_JSON" | jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" '
            (.state == "open") and
            (.user.login == $owner) and
            (.title | startswith("PRODUCTION DIAGNOSTIC AUTHORIZATION — Instagram webhook startup AUTO"))
          ' >/dev/null

          CURRENT_MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          test "$CURRENT_MAIN_SHA" = "$GITHUB_SHA"

          EXPECTED_REVISION="$(grep '^EXPECTED_REVISION=' <<< "$BODY" | cut -d= -f2-)"
          [[ "$EXPECTED_REVISION" =~ ^toca-webhook-next-production-[a-z0-9-]+$ ]]
          required=(
            "AUTHORIZED_CONTROLLER_SHA=$GITHUB_SHA"
            'AUTHORIZATION_STATE=ACTIVE'
            'INSTAGRAM_WEBHOOK_STARTUP_DIAGNOSTIC=AUTHORIZED'
            'EXPECTED_SERVICE=toca-webhook-next-production'
            "EXPECTED_REVISION=$EXPECTED_REVISION"
            'READ_ONLY=true'
            'SERVICE_MUTATIONS_AUTHORIZED=false'
            'TRAFFIC_MUTATIONS_AUTHORIZED=false'
            'DATABASE_MUTATIONS_AUTHORIZED=false'
            'PROVIDER_CALLS_AUTHORIZED=false'
            'EXTERNAL_REPLY_WRITES_AUTHORIZED=false'
          )
          for marker in "${required[@]}"; do grep -Fxq "$marker" <<< "$BODY"; done

          CONTROL_BODY="$(gh api "repos/${GITHUB_REPOSITORY}/issues/640" --jq '.body // ""')"
          grep -Fxq 'MAIN_STABILITY=PASS' <<< "$CONTROL_BODY"
          grep -Fxq "EVALUATED_MAIN_SHA=$GITHUB_SHA" <<< "$CONTROL_BODY"
          grep -Fxq 'MERGE_RESERVATION=NONE' <<< "$CONTROL_BODY"

          echo "authorization_issue=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "expected_revision=$EXPECTED_REVISION" >> "$GITHUB_OUTPUT"

      - name: Authenticate diagnostic identity
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DIAGNOSTIC_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Read revision conditions and startup logs only
        id: readback
        env:
          EXPECTED_REVISION: ${{ steps.auth.outputs.expected_revision }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p startup-diagnostic

          SERVICE_JSON="$(gcloud run services describe "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          REVISION_JSON="$(gcloud run revisions describe "$EXPECTED_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"

          test "$(printf '%s' "$REVISION_JSON" | jq -r '.metadata.labels["serving.knative.dev/service"] // .metadata.labels["serving.knative.dev/serviceUid"] // empty' | wc -l)" -ge 1
          test "$(printf '%s' "$REVISION_JSON" | jq -r '.metadata.name')" = "$EXPECTED_REVISION"

          ROUTED="$(printf '%s' "$SERVICE_JSON" | jq -r '[.status.traffic[]? | select((.percent // 0)==100 and (.revisionName // "")!="") | .revisionName] | if length==1 then .[0] else empty end')"
          LATEST_READY="$(printf '%s' "$SERVICE_JSON" | jq -r '.status.latestReadyRevisionName // empty')"
          LATEST_CREATED="$(printf '%s' "$SERVICE_JSON" | jq -r '.status.latestCreatedRevisionName // empty')"
          READY="$(printf '%s' "$REVISION_JSON" | jq -r '[.status.conditions[]? | select(.type=="Ready") | .status] | last // "Unknown"')"
          READY_REASON="$(printf '%s' "$REVISION_JSON" | jq -r '[.status.conditions[]? | select(.type=="Ready") | .reason] | last // "UNKNOWN"')"
          READY_MESSAGE="$(printf '%s' "$REVISION_JSON" | jq -r '[.status.conditions[]? | select(.type=="Ready") | .message] | last // ""')"

          LOG_FILTER="resource.type=\\\"cloud_run_revision\\\" AND resource.labels.service_name=\\\"${WEBHOOK_SERVICE_NAME}\\\" AND resource.labels.revision_name=\\\"${EXPECTED_REVISION}\\\""
          gcloud logging read "$LOG_FILTER" \
            --project "$GCP_PROJECT_ID" --freshness=30m --limit=300 --order=asc --format=json \
            > /tmp/webhook-startup-logs.json || printf '[]\\n' > /tmp/webhook-startup-logs.json

          REVISION_JSON_VALUE="$REVISION_JSON" READY_MESSAGE_VALUE="$READY_MESSAGE" node <<'NODE'
          import fs from 'node:fs';

          const logs = JSON.parse(fs.readFileSync('/tmp/webhook-startup-logs.json','utf8'));
          const values = [];
          const walk = (value) => {
            if (typeof value === 'string') values.push(value);
            else if (Array.isArray(value)) value.forEach(walk);
            else if (value && typeof value === 'object') Object.values(value).forEach(walk);
          };
          walk(logs);

          const readyMessage = process.env.READY_MESSAGE_VALUE || '';
          if (readyMessage) values.push(readyMessage);

          const redact = (input) => String(input)
            .replace(/https?:\/\/[^\s]+/giu,'<URL>')
            .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/giu,'<EMAIL>')
            .replace(/sha256:[a-f0-9]{32,}/giu,'<DIGEST>')
            .replace(/\b[0-9]{10,}\b/gu,'<ID>')
            .replace(/\b[A-Za-z0-9_\-]{32,}\b/gu,'<TOKEN>')
            .replace(/(secret|token|password|authorization)=([^\s,;]+)/giu,'$1=<REDACTED>')
            .replace(/\s+/gu,' ')
            .trim()
            .slice(0,700);

          const interesting = values
            .map(redact)
            .filter(Boolean)
            .filter((value) => /(error|fail|missing|required|invalid|readiness|database|postgres|meta_|webhook|secret|token|port|listen|startup|econn|timeout|permission|denied|zod)/iu.test(value));

          const unique = [...new Set(interesting)].slice(0,40);
          fs.writeFileSync('/tmp/startup-errors.txt', unique.join('\n'));

          let classification = 'STARTUP_FAILURE_UNCLASSIFIED';
          const joined = unique.join('\n');
          if (/META_WEBHOOK_VERIFY_TOKEN_REFERENCE_MISSING|META_WEBHOOK_DERIVED_VERIFY_TOKEN_REQUIRES_ENV_APP_SECRET|META_APP_SECRET_(KEY|REFERENCE)_MISSING/iu.test(joined)) classification='STARTUP_META_WEBHOOK_SECRET_CONFIG';
          else if (/Missing environment secret|READINESS_SECRET_MISSING|secret.*required/iu.test(joined)) classification='STARTUP_SECRET_REFERENCE_MISSING';
          else if (/DATABASE_URL|required.*database|ECONNREFUSED|postgres/iu.test(joined)) classification='STARTUP_DATABASE_CONFIG_OR_CONNECTIVITY';
          else if (/PORT=8080|listen|failed to start/iu.test(joined)) classification='STARTUP_PORT_OR_PROCESS_EXIT';
          else if (/Zod|Invalid input|configuration/iu.test(joined)) classification='STARTUP_CONFIG_VALIDATION';

          fs.writeFileSync('/tmp/classification.txt', classification);
          NODE

          CLASSIFICATION="$(cat /tmp/classification.txt)"
          ERROR_COUNT="$(awk 'NF{count++} END{print count+0}' /tmp/startup-errors.txt)"
          {
            echo "classification=$CLASSIFICATION"
            echo "error_count=$ERROR_COUNT"
            echo "routed_revision=$ROUTED"
            echo "latest_ready_revision=$LATEST_READY"
            echo "latest_created_revision=$LATEST_CREATED"
            echo "candidate_ready=$READY"
            echo "candidate_ready_reason=$READY_REASON"
          } >> "$GITHUB_OUTPUT"

          {
            echo "WEBHOOK_STARTUP_DIAGNOSTIC=PASS"
            echo "CLASSIFICATION=$CLASSIFICATION"
            echo "EXPECTED_REVISION=$EXPECTED_REVISION"
            echo "ROUTED_REVISION=$ROUTED"
            echo "LATEST_READY_REVISION=$LATEST_READY"
            echo "LATEST_CREATED_REVISION=$LATEST_CREATED"
            echo "CANDIDATE_READY=$READY"
            echo "CANDIDATE_READY_REASON=$READY_REASON"
            echo "SANITIZED_ERROR_COUNT=$ERROR_COUNT"
            echo 'READ_ONLY=true'
            echo 'SERVICE_MUTATIONS=false'
            echo 'TRAFFIC_MUTATIONS=false'
            echo 'DATABASE_MUTATIONS=false'
            echo 'PROVIDER_CALLS=false'
            echo 'EXTERNAL_REPLY_WRITES=false'
            echo 'RAW_USER_DATA_LOGGED=false'
            echo 'SECRETS_PRINTED=false'
            echo
            echo 'SANITIZED_STARTUP_ERRORS_BEGIN'
            cat /tmp/startup-errors.txt
            echo 'SANITIZED_STARTUP_ERRORS_END'
          } > /tmp/startup-report.txt

      - name: Publish sanitized diagnostic and consume authorization
        if: always() && steps.auth.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.auth.outputs.authorization_issue }}
          READBACK_OUTCOME: ${{ steps.readback.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          ISSUE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
          BODY="$(printf '%s' "$ISSUE_JSON" | jq -r '.body // ""')"
          BODY="$(sed 's/^AUTHORIZATION_STATE=ACTIVE$/AUTHORIZATION_STATE=CONSUMED_AND_CLOSED/' <<< "$BODY")"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" -f state=closed -f state_reason=completed -f body="$BODY" >/dev/null

          if [[ "$READBACK_OUTCOME" == success && -f /tmp/startup-report.txt ]]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/startup-report.txt >/dev/null
          else
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body $'WEBHOOK_STARTUP_DIAGNOSTIC=FAIL\nREAD_ONLY=true\nSERVICE_MUTATIONS=false\nTRAFFIC_MUTATIONS=false\nDATABASE_MUTATIONS=false\nPROVIDER_CALLS=false\nEXTERNAL_REPLY_WRITES=false' >/dev/null
            exit 1
          fi
