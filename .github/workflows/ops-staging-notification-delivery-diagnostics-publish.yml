name: Ops Staging Notification Delivery Diagnostics Publish

on:
  push:
    branches: [ops/staging-notification-delivery-diagnostics-20260822]
    paths:
      - '.github/workflows/ops-staging-notification-delivery-diagnostics-publish.yml'

permissions:
  contents: write
  id-token: write

jobs:
  diagnose-and-publish:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      PROJECT_ID: toca-mcp-next-staging
      PROJECT_NUMBER: '729069789107'
      PRODUCTION_PROJECT_ID: toca-mcp-production
      STAGING_WIF: projects/729069789107/locations/global/workloadIdentityPools/github-staging/providers/github-toca-mcp-staging
      STAGING_OPERATOR_SA: toca-next-stg-deployer@toca-mcp-next-staging.iam.gserviceaccount.com
      SYNTHETIC_LOG_ID: toca-staging-reliability-synthetic
      SYNTHETIC_MARKER: TOCA_STAGING_RELIABILITY_SYNTHETIC_V1
      TARGET_RUN_ID: '32563070906'
      TARGET_MAIN_SHA: 152eb4f6eaa3236ff74156ca8bccb20ea3065e76
      EXPECTED_POLICY_ID: '5562724679805698256'
      RESULT_PATH: ops/evidence/staging-notification-delivery-diagnostic.json
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ops/staging-notification-delivery-diagnostics-20260822
          persist-credentials: true

      - name: Fail closed on exact staging boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'luizanunciostoca/toca-mcp-server'
          test "$GITHUB_REF" = 'refs/heads/ops/staging-notification-delivery-diagnostics-20260822'
          test "$PROJECT_ID" = 'toca-mcp-next-staging'
          test "$PROJECT_NUMBER" = '729069789107'
          test "$PROJECT_ID" != "$PRODUCTION_PROJECT_ID"

      - name: Authenticate isolated staging reader
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.STAGING_WIF }}
          service_account: ${{ env.STAGING_OPERATOR_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Read exact signal and sanitize notification error diagnostics
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE_ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)"
          test "$ACTIVE_ACCOUNT" = "$STAGING_OPERATOR_SA"
          test "$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')" = "$PROJECT_NUMBER"

          RUN_MARKER="${SYNTHETIC_MARKER}:run:${TARGET_RUN_ID}:sha:${TARGET_MAIN_SHA}"
          SYNTHETIC_FILTER="logName=\"projects/${PROJECT_ID}/logs/${SYNTHETIC_LOG_ID}\" AND jsonPayload.runMarker=\"${RUN_MARKER}\""
          gcloud logging read "$SYNTHETIC_FILTER" --project="$PROJECT_ID" --freshness=30m --limit=5 --format=json > /tmp/synthetic.json
          SYNTHETIC_COUNT="$(jq 'length' /tmp/synthetic.json)"
          test "$SYNTHETIC_COUNT" -ge 1
          SYNTHETIC_TS="$(jq -r 'sort_by(.timestamp) | last | .timestamp' /tmp/synthetic.json)"
          POLICY_NAME="$(jq -r 'sort_by(.timestamp) | last | .jsonPayload.alertPolicy // empty' /tmp/synthetic.json)"
          test "$POLICY_NAME" = "projects/${PROJECT_ID}/alertPolicies/${EXPECTED_POLICY_ID}"

          CHANNEL_FILTER='resource.type="stackdriver_notification_channel" AND logName="projects/toca-mcp-next-staging/logs/monitoring.googleapis.com%2Fnotification_channel_events"'
          gcloud logging read "$CHANNEL_FILTER" --project="$PROJECT_ID" --freshness=30m --limit=100 --format=json > /tmp/channel-events.json

          mkdir -p "$(dirname "$RESULT_PATH")"
          jq -n \
            --arg project "$PROJECT_ID" \
            --arg projectNumber "$PROJECT_NUMBER" \
            --arg operator "$STAGING_OPERATOR_SA" \
            --arg observedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg targetRunId "$TARGET_RUN_ID" \
            --arg targetMainSha "$TARGET_MAIN_SHA" \
            --arg runMarker "$RUN_MARKER" \
            --arg syntheticTimestamp "$SYNTHETIC_TS" \
            --arg policyName "$POLICY_NAME" \
            --argjson events "$(jq --arg ts "$SYNTHETIC_TS" '[.[] | select((.timestamp // "") >= $ts) | {
              timestamp,
              severity,
              channelResource:(.resource.labels.notification_channel_id // .resource.labels.channel_id // .resource.labels.channel_name // null),
              httpStatus:(.httpRequest.status // .jsonPayload.httpStatus // .jsonPayload.status // null),
              summary:((.textPayload // .jsonPayload.message // .jsonPayload.summary // .jsonPayload.error // "") | tostring | gsub("https?://[^ ]+";"<redacted-url>") | gsub("auth_token=[^& ]+";"auth_token=<redacted>"))
            }]' /tmp/channel-events.json)" \
            '{
              schemaVersion:"toca.staging.notification-delivery-diagnostic.v2",
              project:$project,
              projectNumber:$projectNumber,
              operator:$operator,
              observedAt:$observedAt,
              targetRunId:$targetRunId,
              targetMainSha:$targetMainSha,
              runMarker:$runMarker,
              syntheticSignal:{timestamp:$syntheticTimestamp,alertPolicy:$policyName,ingested:true},
              notificationChannelEventsAfterSignal:$events,
              notificationChannelEventCountAfterSignal:($events|length),
              notificationChannelErrorCountAfterSignal:([$events[] | select(.severity == "ERROR" or .severity == "CRITICAL" or .severity == "ALERT" or .severity == "EMERGENCY")]|length),
              interpretation:"notification_channel_events is an error-diagnostic source; zero errors is not positive recipient receipt",
              positiveRecipientReadbackRequired:true,
              productionMutation:false,
              providerMutation:false,
              databaseMutation:false,
              backupMutation:false,
              drRestore:false,
              trafficMutation:false,
              cloudRunMutation:false,
              secretMutation:false
            }' > "$RESULT_PATH"

          test "$(jq -r '.notificationChannelErrorCountAfterSignal' "$RESULT_PATH")" = 0
          echo 'STAGING_NOTIFICATION_DELIVERY_ERROR_READBACK=PASS'

      - name: Commit sanitized diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_PATH"
          git diff --cached --quiet && exit 0
          git commit -m 'ops(reliability): publish exact synthetic delivery diagnostic'
          git push origin HEAD:ops/staging-notification-delivery-diagnostics-20260822
