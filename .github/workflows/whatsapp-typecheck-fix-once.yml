name: WhatsApp Typecheck Fix Once

on:
  push:
    branches:
      - feat/next-whatsapp-real-stack-crm-v2-20260820

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/next-whatsapp-real-stack-crm-v2-20260820
          fetch-depth: 0
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply narrow type fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/persistence/postgres-whatsapp-runtime-store.ts')
          text = path.read_text()
          old = "if (target === 'FAILED') return current !== 'DELIVERED' && current !== 'READ';"
          new = "if (target === 'FAILED') return current !== 'DELIVERED';"
          if old not in text:
              raise SystemExit('WHATSAPP_TYPECHECK_FIX_PATTERN_NOT_FOUND')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/whatsapp-typecheck-fix-once.yml
      - name: Validate exact repaired tree
        run: |
          pnpm format:check
          pnpm architecture:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Commit repaired tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/persistence/postgres-whatsapp-runtime-store.ts
          git add -u .github/workflows
          git commit -m 'fix(whatsapp): simplify terminal delivery-state narrowing'
          git push origin HEAD:feat/next-whatsapp-real-stack-crm-v2-20260820
