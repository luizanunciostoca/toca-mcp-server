name: Meta Ads The Party Failure Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - control/meta-ads-the-party-2026-08-15.diagnose

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  META_TOKEN_SECRET_ID: toca-meta-oauth-token
  META_GRAPH_BASE_URL: https://graph.facebook.com
  META_GRAPH_API_VERSION: v24.0
  META_AD_ACCOUNT_ID: '311793958882290'
  META_PIXEL_ID: '461233076843065'
  PIXEL_OWNER_BUSINESS_ID: '232421267344387'
  ISOLATED_SMOKE_JOB_NAME: toca-meta-ads-create-paused-smoke-31780473667
  EXPECTED_MARKER: AUDIT_META_PIXEL_SHARING_AND_SMOKE_31780473667
  DIAGNOSTIC_IMAGE: southamerica-east1-docker.pkg.dev/toca-mcp-production/toca-mcp/server:meta-ads-smoke-4f26826402e7455a6281b30efd1b1a75b07844da

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate exact read-only trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -f control/meta-ads-the-party-2026-08-15.diagnose
          test "$(tr -d '\r\n' < control/meta-ads-the-party-2026-08-15.diagnose)" = "$EXPECTED_MARKER"
          CHANGED_FILES="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          test "$CHANGED_FILES" = "control/meta-ads-the-party-2026-08-15.diagnose"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Read isolated smoke Cloud Run logs
        shell: bash
        run: |
          set -euo pipefail
          gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=${ISOLATED_SMOKE_JOB_NAME} AND timestamp>=\"2026-08-14T07:34:45Z\" AND timestamp<=\"2026-08-14T07:38:40Z\"" \
            --project "$GCP_PROJECT_ID" \
            --order=asc \
            --limit=1000 \
            --format=json > isolated-smoke-31780473667-logs.json
          test -s isolated-smoke-31780473667-logs.json
          echo '--- ISOLATED SMOKE ERRORS ---'
          jq -r '.[] | select((.severity // "") == "ERROR" or ((.textPayload // "") | test("MetaApiError|META_|ZodError|error"; "i"))) | [(.timestamp // ""), (.severity // ""), (.textPayload // .jsonPayload.message // .jsonPayload.error // (.jsonPayload|tostring) // "")] | @tsv' isolated-smoke-31780473667-logs.json

      - name: Audit ad-account owner and pixel sharing read-only
        shell: bash
        run: |
          set -euo pipefail
          JOB_NAME="toca-meta-pixel-sharing-audit-${GITHUB_RUN_ID}"
          cleanup() {
            gcloud run jobs delete "$JOB_NAME" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          JS_CODE="$(cat <<'NODE'
          const token = process.env.META_TOKEN;
          const base = process.env.META_GRAPH_BASE_URL;
          const version = process.env.META_GRAPH_API_VERSION;
          const accountId = process.env.META_AD_ACCOUNT_ID;
          const pixelId = process.env.META_PIXEL_ID;
          const pixelOwnerBusinessId = process.env.PIXEL_OWNER_BUSINESS_ID;
          if (!token || !base || !version || !accountId || !pixelId || !pixelOwnerBusinessId) {
            throw new Error('PIXEL_SHARING_AUDIT_CONFIG_MISSING');
          }

          async function graph(path, params = {}) {
            const url = new URL(`${base}/${version}/${path}`);
            for (const [key, value] of Object.entries(params)) url.searchParams.set(key, String(value));
            const response = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
            let payload;
            try { payload = await response.json(); } catch { payload = { parse_error: true }; }
            return { ok: response.ok, status: response.status, payload };
          }

          const account = await graph(`act_${accountId}`, {
            fields: 'id,account_id,name,currency,account_status,business,owner_business',
          });
          const pixel = await graph(pixelId, {
            fields: 'id,name,owner_ad_account,owner_business,last_fired_time,is_unavailable',
          });
          const agencies = await graph(`${pixelId}/agencies`, {
            fields: 'id,name',
            limit: '100',
          });
          const assignedUsers = await graph(`${pixelId}/assigned_users`, {
            fields: 'id,name,permitted_tasks',
            limit: '100',
          });
          const pixelAdAccounts = await graph(`${pixelId}/adaccounts`, {
            business: pixelOwnerBusinessId,
            fields: 'id,account_id,name,currency,account_status,business,owner_business',
            limit: '100',
          });
          const ownerBusiness = await graph(pixelOwnerBusinessId, { fields: 'id,name' });
          const ownerBusinessClientAccounts = await graph(`${pixelOwnerBusinessId}/client_ad_accounts`, {
            fields: 'id,account_id,name,currency,account_status,business,owner_business',
            limit: '100',
          });
          const ownerBusinessOwnedAccounts = await graph(`${pixelOwnerBusinessId}/owned_ad_accounts`, {
            fields: 'id,account_id,name,currency,account_status,business,owner_business',
            limit: '100',
          });
          const ownerBusinessOwnedPixels = await graph(`${pixelOwnerBusinessId}/owned_pixels`, {
            fields: 'id,name',
            limit: '100',
          });
          const ownerBusinessClientPixels = await graph(`${pixelOwnerBusinessId}/client_pixels`, {
            fields: 'id,name',
            limit: '100',
          });

          const result = {
            accountId,
            pixelId,
            pixelOwnerBusinessId,
            account,
            pixel,
            agencies,
            assignedUsers,
            pixelAdAccounts,
            ownerBusiness,
            ownerBusinessClientAccounts,
            ownerBusinessOwnedAccounts,
            ownerBusinessOwnedPixels,
            ownerBusinessClientPixels,
          };
          console.log(`META_PIXEL_SHARING_AUDIT=${JSON.stringify(result)}`);
          NODE
          )"

          gcloud run jobs deploy "$JOB_NAME" \
            --image "$DIAGNOSTIC_IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --command node \
            --args "^~^-e~$JS_CODE" \
            --set-secrets "META_TOKEN=$META_TOKEN_SECRET_ID:latest" \
            --set-env-vars "^~^META_GRAPH_BASE_URL=$META_GRAPH_BASE_URL~META_GRAPH_API_VERSION=$META_GRAPH_API_VERSION~META_AD_ACCOUNT_ID=$META_AD_ACCOUNT_ID~META_PIXEL_ID=$META_PIXEL_ID~PIXEL_OWNER_BUSINESS_ID=$PIXEL_OWNER_BUSINESS_ID" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 120s \
            --quiet

          gcloud run jobs execute "$JOB_NAME" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --wait \
            --quiet

          RESULT_LINE=""
          for attempt in $(seq 1 12); do
            RESULT_LINE="$(gcloud logging read \
              "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME} AND textPayload:\"META_PIXEL_SHARING_AUDIT=\"" \
              --project "$GCP_PROJECT_ID" \
              --freshness=15m \
              --limit=20 \
              --order=desc \
              --format='value(textPayload)' | grep 'META_PIXEL_SHARING_AUDIT=' | head -n1 || true)"
            [ -n "$RESULT_LINE" ] && break
            sleep 5
          done
          test -n "$RESULT_LINE"
          RESULT_JSON="${RESULT_LINE#META_PIXEL_SHARING_AUDIT=}"
          printf '%s\n' "$RESULT_JSON" | jq . > meta-pixel-sharing-audit.json
          echo '--- META PIXEL SHARING AUDIT ---'
          printf '%s\n' "$RESULT_JSON" | jq '{accountId,pixelId,pixelOwnerBusinessId,account,pixel,agencies,assignedUsers,pixelAdAccounts,ownerBusiness,ownerBusinessClientAccounts,ownerBusinessOwnedAccounts,ownerBusinessOwnedPixels,ownerBusinessClientPixels}'

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: meta-pixel-sharing-and-smoke-audit-${{ github.sha }}
          path: |
            isolated-smoke-31780473667-logs.json
            meta-pixel-sharing-audit.json
          if-no-files-found: error
          retention-days: 30
