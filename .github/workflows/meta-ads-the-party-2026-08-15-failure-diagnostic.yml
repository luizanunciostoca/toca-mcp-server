name: Meta Ads The Party Failure Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - control/meta-ads-the-party-2026-08-15.diagnose

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  META_TOKEN_SECRET_ID: toca-meta-oauth-token
  META_GRAPH_BASE_URL: https://graph.facebook.com
  META_GRAPH_API_VERSION: v24.0
  META_PIXEL_ID: '461233076843065'
  EXPECTED_MARKER: AUDIT_META_PIXEL_ACROSS_ALL_ACCOUNTS_461233076843065
  DIAGNOSTIC_IMAGE: southamerica-east1-docker.pkg.dev/toca-mcp-production/toca-mcp/server:meta-ads-smoke-4f26826402e7455a6281b30efd1b1a75b07844da

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate exact read-only trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -f control/meta-ads-the-party-2026-08-15.diagnose
          test "$(tr -d '\r\n' < control/meta-ads-the-party-2026-08-15.diagnose)" = "$EXPECTED_MARKER"
          CHANGED_FILES="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          test "$CHANGED_FILES" = "control/meta-ads-the-party-2026-08-15.diagnose"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Audit target pixel across all accessible ad accounts
        shell: bash
        run: |
          set -euo pipefail
          JOB_NAME="toca-meta-all-account-pixel-audit-${GITHUB_RUN_ID}"
          cleanup() {
            gcloud run jobs delete "$JOB_NAME" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          JS_CODE="$(cat <<'NODE'
          const token = process.env.META_TOKEN;
          const base = process.env.META_GRAPH_BASE_URL;
          const version = process.env.META_GRAPH_API_VERSION;
          const pixelId = process.env.META_PIXEL_ID;
          if (!token || !base || !version || !pixelId) throw new Error('ALL_ACCOUNT_PIXEL_AUDIT_CONFIG_MISSING');

          async function graph(path, params = {}) {
            const url = new URL(`${base}/${version}/${path}`);
            for (const [key, value] of Object.entries(params)) url.searchParams.set(key, value);
            const response = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
            let payload;
            try {
              payload = await response.json();
            } catch {
              payload = { parse_error: true };
            }
            return { ok: response.ok, status: response.status, payload };
          }

          const accountsResponse = await graph('me/adaccounts', {
            fields: 'id,account_id,name,currency,account_status,business',
            limit: '100',
          });
          const accounts = Array.isArray(accountsResponse.payload?.data) ? accountsResponse.payload.data : [];
          const audited = [];
          for (const account of accounts) {
            const accountPath = String(account?.id ?? '').startsWith('act_')
              ? String(account.id)
              : `act_${String(account?.account_id ?? account?.id ?? '')}`;
            const pixels = await graph(`${accountPath}/adspixels`, {
              fields: 'id,name,last_fired_time,owner_ad_account,owner_business,is_unavailable',
              limit: '100',
            });
            const rows = Array.isArray(pixels.payload?.data) ? pixels.payload.data : [];
            audited.push({
              account,
              pixels,
              hasTargetPixel: rows.some((item) => String(item?.id ?? '') === pixelId),
            });
          }
          const result = {
            pixelId,
            accountsResponse,
            accessibleAccountCount: accounts.length,
            audited,
            matchingAccounts: audited
              .filter((item) => item.hasTargetPixel)
              .map((item) => item.account),
          };
          console.log(`META_PIXEL_ALL_ACCOUNT_AUDIT=${JSON.stringify(result)}`);
          NODE
          )"

          gcloud run jobs deploy "$JOB_NAME" \
            --image "$DIAGNOSTIC_IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --command node \
            --args "^~^-e~$JS_CODE" \
            --set-secrets "META_TOKEN=$META_TOKEN_SECRET_ID:latest" \
            --set-env-vars "^~^META_GRAPH_BASE_URL=$META_GRAPH_BASE_URL~META_GRAPH_API_VERSION=$META_GRAPH_API_VERSION~META_PIXEL_ID=$META_PIXEL_ID" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 120s \
            --quiet

          gcloud run jobs execute "$JOB_NAME" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --wait \
            --quiet

          RESULT_LINE=""
          for attempt in $(seq 1 12); do
            RESULT_LINE="$(gcloud logging read \
              "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME} AND textPayload:\"META_PIXEL_ALL_ACCOUNT_AUDIT=\"" \
              --project "$GCP_PROJECT_ID" \
              --freshness=15m \
              --limit=20 \
              --order=desc \
              --format='value(textPayload)' | grep 'META_PIXEL_ALL_ACCOUNT_AUDIT=' | head -n1 || true)"
            [ -n "$RESULT_LINE" ] && break
            sleep 5
          done
          test -n "$RESULT_LINE"
          RESULT_JSON="${RESULT_LINE#META_PIXEL_ALL_ACCOUNT_AUDIT=}"
          printf '%s\n' "$RESULT_JSON" | jq . > meta-pixel-all-account-audit.json
          echo '--- META PIXEL ALL-ACCOUNT AUDIT ---'
          printf '%s\n' "$RESULT_JSON" | jq '{pixelId,accessibleAccountCount,matchingAccounts,audited:[.audited[]|{account:.account,hasTargetPixel:.hasTargetPixel,pixels:{ok:.pixels.ok,status:.pixels.status,payload:.pixels.payload}}]}'

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: meta-pixel-all-account-audit-${{ github.sha }}
          path: meta-pixel-all-account-audit.json
          if-no-files-found: error
          retention-days: 30
