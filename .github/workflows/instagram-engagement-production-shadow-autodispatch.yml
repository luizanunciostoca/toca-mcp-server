name: Instagram Engagement Production Shadow Autodispatch

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read
  issues: read

concurrency:
  group: instagram-engagement-production-shadow-autodispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'PRODUCTION AUTHORIZATION — Instagram conversation production shadow AUTO')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout exact authorization controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate owner authorization and exact main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          ISSUE_JSON="$(jq -c '.issue' "$GITHUB_EVENT_PATH")"
          AUTHORIZATION_REF="$(printf '%s' "$ISSUE_JSON" | jq -r '.html_url // empty')"
          BODY="$(printf '%s' "$ISSUE_JSON" | jq -r '.body // ""')"

          printf '%s' "$ISSUE_JSON" | jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" '
            (.state == "open") and
            (.user.login == $owner) and
            (.title | startswith("PRODUCTION AUTHORIZATION — Instagram conversation production shadow AUTO"))
          ' >/dev/null

          CURRENT_MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          test "$CURRENT_MAIN_SHA" = "$GITHUB_SHA"

          required_lines=(
            "AUTHORIZED_CANDIDATE_SHA=$GITHUB_SHA"
            "AUTHORIZATION_STATE=ACTIVE"
            "INSTAGRAM_ENGAGEMENT_SHADOW=AUTHORIZED"
            "INSTAGRAM_ENGAGEMENT_DRS_CONTINUATION=AUTHORIZED"
            "PRODUCTION_MODE=SHADOW_ONLY"
            "RUNTIME_SOURCE_SHA=bc9f02ff4663589c4f60fc585c89ca88b0369eba"
            "RUNTIME_IMAGE_DIGEST=sha256:4fdcea3fbc9e87f9790ca6cd6917176152104e840f6f37b31d680a42fa13b32a"
            "WRITE_BOUNDARY=INSTAGRAM_ENGAGEMENT_WRITES_ENABLED:false"
            "EXTERNAL_REPLY_WRITES_AUTHORIZED=false"
            "AUTO_DISPATCH_AUTHORIZED=true"
          )
          for required in "${required_lines[@]}"; do
            grep -Fxq "$required" <<< "$BODY" || {
              echo "Missing exact authorization field: $required" >&2
              exit 1
            }
          done

          test -n "$AUTHORIZATION_REF"
          echo "AUTHORIZATION_REF=$AUTHORIZATION_REF" >> "$GITHUB_ENV"

      - name: Dispatch canonical governed production shadow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          test "$CURRENT_MAIN_SHA" = "$GITHUB_SHA"

          jq -n \
            --arg ref main \
            --arg confirm DEPLOY_ENGAGEMENT_SHADOW \
            --arg authorizationRef "$AUTHORIZATION_REF" \
            '{ref:$ref,inputs:{confirm_shadow:$confirm,authorization_ref:$authorizationRef}}' \
            > /tmp/dispatch.json

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/instagram-engagement-shadow-production.yml/dispatches" \
            --input /tmp/dispatch.json

          echo 'CANONICAL_PRODUCTION_SHADOW_DISPATCHED=true' >> "$GITHUB_STEP_SUMMARY"
          echo "AUTHORIZATION_REF=$AUTHORIZATION_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "CONTROLLER_SHA=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'EXTERNAL_REPLY_WRITES_AUTHORIZED=false' >> "$GITHUB_STEP_SUMMARY"
