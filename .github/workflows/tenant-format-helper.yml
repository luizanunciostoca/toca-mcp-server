name: Tenant Format Helper

on:
  push:
    branches:
      - feat/multi-tenant-foundation-20260820
    paths:
      - 'src/tenancy/**'
      - 'test/multi-tenant-migration-contract.test.ts'
      - '.github/workflows/tenant-format-helper.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format tenant files
        run: >-
          pnpm exec prettier --write
          src/tenancy/tenant-boundary.ts
          src/tenancy/tenant-configuration.ts
          src/tenancy/tenant-credential-resolver.ts
          src/tenancy/tenant-policy.ts
          test/multi-tenant-migration-contract.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tenancy test/multi-tenant-migration-contract.test.ts
          git commit -m "style(tenancy): apply repository prettier"
          git push origin HEAD:feat/multi-tenant-foundation-20260820
