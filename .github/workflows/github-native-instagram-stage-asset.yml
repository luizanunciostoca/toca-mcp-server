name: GitHub Native Instagram Asset Stager

on:
  repository_dispatch:
    types:
      - github-native-instagram-stage-asset

permissions:
  contents: write

concurrency:
  group: github-native-instagram-asset-stager
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact trusted default-branch controller SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact controller SHA and trusted ref
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF}" = "refs/heads/${DEFAULT_BRANCH}"

      - name: Checkout publication assets branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: publication-assets
          path: .publication-assets-worktree
          persist-credentials: true
          fetch-depth: 1

      - name: Download and bind exact approved JPEG
        id: asset
        shell: bash
        env:
          SOURCE_URL: ${{ github.event.client_payload.source_url }}
          EXPECTED_SHA256: ${{ github.event.client_payload.expected_sha256 }}
          CONTENT_ITEM_ID: ${{ github.event.client_payload.content_item_id }}
        run: |
          set -euo pipefail
          printf '%s' "$EXPECTED_SHA256" | grep -Eq '^[a-fA-F0-9]{64}$'
          printf '%s' "$CONTENT_ITEM_ID" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'

          validate_url() {
            node - "$1" <<'NODE'
          const value = process.argv[2];
          const url = new URL(value);
          const host = url.hostname.toLowerCase();
          if (url.protocol !== 'https:') process.exit(10);
          if (
            host === 'storage.googleapis.com' ||
            host === 'storage.cloud.google.com' ||
            host.endsWith('.storage.googleapis.com') ||
            host.endsWith('.run.app')
          ) process.exit(11);
          NODE
          }

          if ! validate_url "$SOURCE_URL"; then
            echo "GITHUB_NATIVE_ASSET_SOURCE_URL_DENIED" >&2
            exit 1
          fi

          sha="$(printf '%s' "$EXPECTED_SHA256" | tr '[:upper:]' '[:lower:]')"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          effective_url="$(curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location --max-redirs 5 \
            --write-out '%{url_effective}' --output "$work/asset.jpg" "$SOURCE_URL")"
          if ! validate_url "$effective_url"; then
            echo "GITHUB_NATIVE_ASSET_REDIRECT_TARGET_DENIED" >&2
            exit 1
          fi
          test -s "$work/asset.jpg"
          magic="$(od -An -tx1 -N3 "$work/asset.jpg" | tr -d ' \n')"
          test "$magic" = "ffd8ff"
          actual="$(sha256sum "$work/asset.jpg" | awk '{print $1}')"
          test "$actual" = "$sha"

          dest=".publication-assets-worktree/publication-assets/${sha}.jpg"
          manifest=".publication-assets-worktree/publication-assets/${sha}.json"
          mkdir -p "$(dirname "$dest")"
          cp "$work/asset.jpg" "$dest"
          jq -n \
            --arg contentItemId "$CONTENT_ITEM_ID" \
            --arg sha256 "$sha" \
            --arg stagedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg controllerSha "$GITHUB_SHA" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg effectiveHost "$(node -e 'console.log(new URL(process.argv[1]).hostname)' "$effective_url")" \
            '{schemaVersion:1,contentItemId:$contentItemId,sha256:$sha256,contentType:"image/jpeg",stagedAt:$stagedAt,controllerSha:$controllerSha,workflowRunId:$workflowRunId,effectiveSourceHost:$effectiveHost}' \
            > "$manifest"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Commit only content-addressed publication asset
        shell: bash
        env:
          SHA256: ${{ steps.asset.outputs.sha256 }}
        run: |
          set -euo pipefail
          worktree=.publication-assets-worktree
          git -C "$worktree" config user.name "toca-publication-assets[bot]"
          git -C "$worktree" config user.email "toca-publication-assets[bot]@users.noreply.github.com"
          git -C "$worktree" add -- "publication-assets/${SHA256}.jpg" "publication-assets/${SHA256}.json"
          if git -C "$worktree" diff --cached --quiet; then
            echo "Asset already staged with identical bytes."
          else
            git -C "$worktree" commit -m "asset(instagram): stage ${SHA256}"
            git -C "$worktree" push origin HEAD:publication-assets
          fi

      - name: Emit content-addressed raw URL
        env:
          SHA256: ${{ steps.asset.outputs.sha256 }}
        run: |
          set -euo pipefail
          echo "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/publication-assets/publication-assets/${SHA256}.jpg" >> "$GITHUB_STEP_SUMMARY"
