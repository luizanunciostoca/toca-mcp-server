name: Instagram Engagement Corrected Shadow Proof Retry

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: instagram-engagement-corrected-shadow-proof-retry
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  DATABASE_SECRET_ID: toca-database-url
  META_APP_SECRET_ID: toca-meta-app-secret
  DAEMON_SERVICE_NAME: toca-managed-instagram-daemon
  WEBHOOK_SERVICE_NAME: toca-webhook-next-production
  SCHEDULER_JOB_NAME: toca-managed-instagram-tick
  INSTAGRAM_ACCOUNT_ID: '17841402033495654'
  INSTAGRAM_PAGE_ID: '306103746115875'
  META_APP_ID: '2281930145887404'
  CANONICAL_FAQ_SPREADSHEET_ID: 1M0HSs7QJpFCJvvnrZxJRaaXY8scv5R3okCG_OyFLiEU
  TOCA_TENANT_ID: toca
  TOCA_WORKSPACE_ID: toca
  TOCA_ORGANIZATION_ID: toca
  META_REDIRECT_URI: https://toca-meta-oauth-staging-990081828836.southamerica-east1.run.app/oauth/meta/callback
  META_REQUESTED_SCOPES: pages_show_list,pages_read_engagement,pages_manage_metadata,pages_messaging,business_management,instagram_basic,instagram_manage_comments,instagram_manage_messages,instagram_content_publish
  RUNTIME_SOURCE_SHA: 334b54a6a4d730e5c949eda71647595c95030a9f
  RUNTIME_IMAGE_DIGEST: sha256:8bc7052b2794f5dc837f33006030590414b7e2883b6789909e373dba73242907
  RUNTIME_IMAGE: southamerica-east1-docker.pkg.dev/toca-mcp-production/toca-mcp/server@sha256:8bc7052b2794f5dc837f33006030590414b7e2883b6789909e373dba73242907

jobs:
  proof-retry:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'PRODUCTION AUTHORIZATION — Instagram corrected shadow proof retry AUTO')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Checkout exact controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate authorization
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")"
          ISSUE_NUMBER="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
          CURRENT_MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          test "$CURRENT_MAIN_SHA" = "$GITHUB_SHA"
          required=(
            "AUTHORIZED_CANDIDATE_SHA=$GITHUB_SHA"
            "AUTHORIZATION_STATE=ACTIVE"
            "INSTAGRAM_ENGAGEMENT_CORRECTED_SHADOW_PROOF_RETRY=AUTHORIZED"
            "RUNTIME_SOURCE_SHA=$RUNTIME_SOURCE_SHA"
            "RUNTIME_IMAGE_DIGEST=$RUNTIME_IMAGE_DIGEST"
            "TEMPORARY_CANDIDATE_TRAFFIC_AUTHORIZED=true"
            "TEMPORARY_CALLBACK_EXPOSURE_AUTHORIZED=true"
            "SCHEDULER_TICK_PUMP_AUTHORIZED=true"
            "EXTERNAL_REPLY_WRITES_AUTHORIZED=false"
          )
          for line in "${required[@]}"; do grep -Fxq "$line" <<< "$BODY"; done
          echo "AUTHORIZATION_ISSUE_NUMBER=$ISSUE_NUMBER" >> "$GITHUB_ENV"
          mkdir -p engagement-evidence

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Exact-head quality gate
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm quality

      - name: Authenticate governed deployer
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Verify fail-closed prestate
        shell: bash
        run: |
          set -euo pipefail
          DESCRIBED_DIGEST="$(gcloud artifacts docker images describe "$RUNTIME_IMAGE" --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          test "$DESCRIBED_DIGEST" = "$RUNTIME_IMAGE_DIGEST"
          current_revision() {
            local service="$1"
            gcloud run services describe "$service" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json | jq -r '. as $s | [($s.status.traffic // [])[] | select((.percent // 0) == 100) | (.revisionName // (if (.latestRevision // false) then $s.status.latestReadyRevisionName else empty end))] | unique | if length == 1 then .[0] else empty end'
          }
          PREVIOUS_DAEMON_REVISION="$(current_revision "$DAEMON_SERVICE_NAME")"
          PREVIOUS_WEBHOOK_REVISION="$(current_revision "$WEBHOOK_SERVICE_NAME")"
          test -n "$PREVIOUS_DAEMON_REVISION"; test -n "$PREVIOUS_WEBHOOK_REVISION"
          echo "PREVIOUS_DAEMON_REVISION=$PREVIOUS_DAEMON_REVISION" >> "$GITHUB_ENV"
          echo "PREVIOUS_WEBHOOK_REVISION=$PREVIOUS_WEBHOOK_REVISION" >> "$GITHUB_ENV"
          DAEMON_JSON="$(gcloud run services describe "$DAEMON_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          WEBHOOK_JSON="$(gcloud run services describe "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$DAEMON_JSON" | jq -e '.spec.template.spec.containers[0] as $c | ([$c.env[]? | select(.name == "INSTAGRAM_ENGAGEMENT_WRITES_ENABLED") | .value] | last // "false") == "false"' >/dev/null
          printf '%s' "$WEBHOOK_JSON" | jq -e '(.metadata.annotations["run.googleapis.com/default-url-disabled"] // "false") == "true"' >/dev/null
          if gcloud run services get-iam-policy "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json | jq -e '.bindings[]? | select(.role == "roles/run.invoker") | (.members // [])[]? | select(. == "allUsers")' >/dev/null; then exit 1; fi

      - name: Route exact corrected candidates
        shell: bash
        run: |
          set -euo pipefail
          RUN_TAIL="${GITHUB_RUN_ID: -7}"
          SUFFIX="p${RUN_TAIL}a${GITHUB_RUN_ATTEMPT}"
          DAEMON_CANDIDATE_REVISION="${DAEMON_SERVICE_NAME}-${SUFFIX}"
          WEBHOOK_CANDIDATE_REVISION="${WEBHOOK_SERVICE_NAME}-${SUFFIX}"
          echo "DAEMON_CANDIDATE_REVISION=$DAEMON_CANDIDATE_REVISION" >> "$GITHUB_ENV"
          echo "WEBHOOK_CANDIDATE_REVISION=$WEBHOOK_CANDIDATE_REVISION" >> "$GITHUB_ENV"
          DAEMON_ENV="^@^NODE_ENV=production@INSTAGRAM_ENGAGEMENT_RUNTIME_ENABLED=true@INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=false@INSTAGRAM_PUBLICATION_WRITES_ENABLED=false@INSTAGRAM_ENGAGEMENT_TENANT_ID=$TOCA_TENANT_ID@INSTAGRAM_ENGAGEMENT_WORKSPACE_ID=$TOCA_WORKSPACE_ID@INSTAGRAM_ENGAGEMENT_ORGANIZATION_ID=$TOCA_ORGANIZATION_ID@INSTAGRAM_ENGAGEMENT_PAGE_ID=$INSTAGRAM_PAGE_ID@INSTAGRAM_ENGAGEMENT_KNOWLEDGE_SPREADSHEET_ID=$CANONICAL_FAQ_SPREADSHEET_ID@INSTAGRAM_ENGAGEMENT_KNOWLEDGE_SOURCE=postgres@INSTAGRAM_BUSINESS_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID@INSTAGRAM_ENGAGEMENT_SHADOW_RUN_ID=$GITHUB_RUN_ID"
          gcloud run services update "$DAEMON_SERVICE_NAME" --image "$RUNTIME_IMAGE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" --add-cloudsql-instances "$CLOUD_SQL_INSTANCE" --update-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" --revision-suffix="$SUFFIX" --update-env-vars "$DAEMON_ENV" --command node --args dist/src/toca-managed-instagram-daemon.js --quiet
          gcloud run services update-traffic "$DAEMON_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions="${DAEMON_CANDIDATE_REVISION}=100" --quiet
          WEBHOOK_ENV="^@^NODE_ENV=production@MCP_ENABLED=false@TOCA_SERVICE_ROLE=webhook@TOCA_DEFAULT_TENANT_ID=$TOCA_TENANT_ID@TOCA_DEFAULT_WORKSPACE_ID=$TOCA_WORKSPACE_ID@TOCA_DEFAULT_ORGANIZATION_ID=$TOCA_ORGANIZATION_ID@META_ENABLED=true@META_PROVIDER_VERIFIED=true@META_WEBHOOK_ENABLED=true@META_WEBHOOK_PERSISTENCE_ENABLED=true@META_APP_ID=$META_APP_ID@META_APP_SECRET_PROVIDER=env@META_APP_SECRET_KEY=META_APP_SECRET@META_AUTHORIZATION_ENDPOINT=https://www.facebook.com/dialog/oauth@META_TOKEN_ENDPOINT=https://graph.facebook.com/oauth/access_token@META_REDIRECT_URI=$META_REDIRECT_URI@META_REQUESTED_SCOPES=$META_REQUESTED_SCOPES@META_GRAPH_BASE_URL=https://graph.facebook.com@META_GRAPH_API_VERSION=v24.0@INSTAGRAM_ENGAGEMENT_RUNTIME_ENABLED=true@INSTAGRAM_ENGAGEMENT_TENANT_ID=$TOCA_TENANT_ID@INSTAGRAM_ENGAGEMENT_WORKSPACE_ID=$TOCA_WORKSPACE_ID@INSTAGRAM_ENGAGEMENT_ORGANIZATION_ID=$TOCA_ORGANIZATION_ID@INSTAGRAM_ENGAGEMENT_SHADOW_RUN_ID=$GITHUB_RUN_ID@INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=false@INSTAGRAM_BUSINESS_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID"
          gcloud run services update "$WEBHOOK_SERVICE_NAME" --image "$RUNTIME_IMAGE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" --add-cloudsql-instances "$CLOUD_SQL_INSTANCE" --update-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest,META_APP_SECRET=$META_APP_SECRET_ID:latest" --revision-suffix="$SUFFIX" --update-env-vars "$WEBHOOK_ENV" --command node --args dist/src/http-instagram-engagement.js --quiet
          gcloud run services update-traffic "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions="${WEBHOOK_CANDIDATE_REVISION}=100" --quiet
          DAEMON_REVISION_JSON="$(gcloud run revisions describe "$DAEMON_CANDIDATE_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          WEBHOOK_REVISION_JSON="$(gcloud run revisions describe "$WEBHOOK_CANDIDATE_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$DAEMON_REVISION_JSON" | jq -e --arg d "$RUNTIME_IMAGE_DIGEST" '(.spec.containers[0].image | contains($d)) and (([.spec.containers[0].env[]? | select(.name=="INSTAGRAM_ENGAGEMENT_WRITES_ENABLED") | .value] | last) == "false")' >/dev/null
          printf '%s' "$WEBHOOK_REVISION_JSON" | jq -e --arg d "$RUNTIME_IMAGE_DIGEST" '(.spec.containers[0].image | contains($d)) and (([.spec.containers[0].env[]? | select(.name=="INSTAGRAM_ENGAGEMENT_WRITES_ENABLED") | .value] | last) == "false")' >/dev/null

      - name: Expose temporary DRS-safe callback
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --default-url --quiet
          gcloud run services update "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --default-url --no-invoker-iam-check --quiet
          WEBHOOK_JSON="$(gcloud run services describe "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          WEBHOOK_URL="$(printf '%s' "$WEBHOOK_JSON" | jq -r '.status.url // empty')"
          test -n "$WEBHOOK_URL"
          echo "WEBHOOK_URL=$WEBHOOK_URL" >> "$GITHUB_ENV"
          if gcloud run services get-iam-policy "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json | jq -e '.bindings[]? | select(.role=="roles/run.invoker") | (.members // [])[]? | select(.=="allUsers")' >/dev/null; then exit 1; fi

      - name: Prove COMMENT and DIRECT with bounded budget
        shell: bash
        run: |
          set -euo pipefail
          JOB="toca-ig-eng-proof-retry-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "PROOF_JOB=$JOB" >> "$GITHUB_ENV"
          TICK_PID=''
          cleanup_ticks() { if [[ -n "$TICK_PID" ]]; then kill "$TICK_PID" >/dev/null 2>&1 || true; wait "$TICK_PID" >/dev/null 2>&1 || true; fi; }
          trap cleanup_ticks EXIT
          gcloud run jobs deploy "$JOB" --image "$RUNTIME_IMAGE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest,META_APP_SECRET=$META_APP_SECRET_ID:latest" --set-env-vars "NODE_ENV=production,INSTAGRAM_ENGAGEMENT_SHADOW_WEBHOOK_URL=$WEBHOOK_URL,INSTAGRAM_BUSINESS_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID,INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=false" --command node --args dist/src/ops/instagram-engagement-shadow-proof.js --tasks 1 --max-retries 0 --task-timeout 420s --quiet
          tick_pump() { sleep 8; for attempt in $(seq 1 40); do gcloud scheduler jobs run "$SCHEDULER_JOB_NAME" --project "$GCP_PROJECT_ID" --location "$GCP_REGION" --quiet || return 1; sleep 10; done; }
          tick_pump & TICK_PID=$!
          set +e
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet
          PROOF_RC=$?
          set -e
          cleanup_ticks; TICK_PID=''
          sleep 8
          gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${JOB}\"" --project "$GCP_PROJECT_ID" --freshness=30m --limit=500 --order=asc --format=json > /tmp/proof-logs.json || printf '[]' > /tmp/proof-logs.json
          if [[ "$PROOF_RC" -ne 0 ]]; then
            node <<'NODE'
          import fs from 'node:fs';
          const entries=JSON.parse(fs.readFileSync('/tmp/proof-logs.json','utf8'));
          const strings=[]; const walk=v=>{if(typeof v==='string')strings.push(v);else if(Array.isArray(v))v.forEach(walk);else if(v&&typeof v==='object')Object.values(v).forEach(walk)}; walk(entries);
          const redact=v=>String(v).replaceAll('Que horas começa o Sunset?','<SYNTHETIC_MESSAGE>').replace(/https?:\/\/[^\s]+/giu,'<URL>').replace(/\b\d{10,}\b/gu,'<ID>').replace(/shadow-proof-[A-Z0-9_-]+/giu,'<SYNTHETIC_ID>').replace(/\s+/gu,' ').trim().slice(0,360);
          const markers=[...new Set(strings.filter(v=>/SHADOW_PROOF_|ERR_|ERROR|FAILED|TIMEOUT|DEADLINE|ECONN|EACCES|ENOENT/iu.test(v)).map(redact))].slice(0,40);
          fs.writeFileSync('engagement-evidence/proof-failure-sanitized.json',JSON.stringify({schemaVersion:'toca.instagram-engagement.corrected-shadow-proof-retry-failure.v1',exitCode:Number(process.env.PROOF_RC||1),safeMarkers:markers,rawPayloadPrinted:false,writesEnabled:false},null,2)+'\n');
          NODE
            exit "$PROOF_RC"
          fi
          PROOF="$(cat /tmp/proof-logs.json | node scripts/extract-instagram-engagement-cloud-run-evidence.mjs instagram-engagement-shadow-e2e)"
          printf '%s' "$PROOF" | jq -e '.status == "PASS" and (.channelsVerified | sort == ["COMMENT","DIRECT"]) and .webhookAccepted == true and .inboundDelivered == true and .faqResolved == true and .externalReplyObserved == false and .replyOutboxEvents == 0 and .writesEnabled == false' >/dev/null
          printf '%s\n' "$PROOF" > engagement-evidence/shadow-proof.json
          gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet
          trap - EXIT

      - name: Publish proof retry closeout
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf -v COMMENT '%s\n' 'CORRECTED_SHADOW_PROOF_RETRY_STATUS=PASS' "CONTROLLER_SHA=$GITHUB_SHA" "RUNTIME_SOURCE_SHA=$RUNTIME_SOURCE_SHA" "RUNTIME_IMAGE_DIGEST=$RUNTIME_IMAGE_DIGEST" 'CHANNELS_VERIFIED=COMMENT,DIRECT' 'INBOUND_DELIVERED=true' 'FAQ_RESOLVED=true' 'REPLY_OUTBOX_EVENTS=0' 'EXTERNAL_REPLY_WRITES=false'
          gh issue comment "$AUTHORIZATION_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$COMMENT"

      - name: Roll back and retain failed proof job for diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          if [[ -n "${PREVIOUS_DAEMON_REVISION:-}" ]]; then gcloud run services update-traffic "$DAEMON_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions="${PREVIOUS_DAEMON_REVISION}=100" --quiet; fi
          if [[ -n "${PREVIOUS_WEBHOOK_REVISION:-}" ]]; then gcloud run services update-traffic "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions="${PREVIOUS_WEBHOOK_REVISION}=100" --quiet; fi
          gcloud run services update "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --no-default-url --quiet
          gcloud run services update "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --no-default-url --invoker-iam-check --quiet
          echo "PROOF_JOB_RETAINED_FOR_DIAGNOSTICS=${PROOF_JOB:-UNKNOWN}" >> "$GITHUB_STEP_SUMMARY"
          echo 'EXTERNAL_REPLY_WRITES=false' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instagram-engagement-corrected-shadow-proof-retry-${{ github.run_id }}-${{ github.run_attempt }}
          path: engagement-evidence/
          if-no-files-found: warn
          retention-days: 90
