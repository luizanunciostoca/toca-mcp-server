name: AG-01 Production Readback

on:
  push:
    branches:
      - ops/ag01-readonly-readback-20260915
    paths:
      - '.github/workflows/ag01-production-readback.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  SERVICE: toca-ag01-orchestrator
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout exact readback source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify source binding contract
        run: |
          set -euo pipefail
          grep -Fq "export const AG01_SERVICE_VERSION = '0.2.0'" src/orchestrator/production-runtime.ts
          grep -Fq "config.modelProvider === 'vertex'" src/orchestrator/production-runtime.ts
          grep -Fq 'ExistingCoreCapabilityGateway' src/orchestrator/production-runtime.ts
          grep -Fq 'bindApprovalStoreToScope' src/orchestrator/production-runtime.ts
          grep -Fq 'assertAg01PersistenceReady(pool)' src/orchestrator/production-runtime.ts
          grep -Fq "AG01_GOOGLE_AUTH_MODE" src/orchestrator/production-config.ts
          grep -Fq "gcp_metadata" src/orchestrator/production-config.ts
          grep -Fq 'spreadsheets.readonly' src/orchestrator/google-oauth-secret-resolver.ts

      - name: Authenticate read-only GCP boundary
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Read production service, revision, IAM and readiness control plane
        run: |
          set -euo pipefail
          mkdir -p ag01-readback-evidence
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/service.json
          gcloud run services get-iam-policy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/iam.json

          SERVICE_ACCOUNT="$(jq -r '.spec.template.spec.serviceAccountName // .spec.template.spec.serviceAccount // empty' /tmp/service.json)"
          [[ "$SERVICE_ACCOUNT" == "$RUNTIME_SERVICE_ACCOUNT" ]] || {
            echo "Unexpected AG-01 runtime service account: $SERVICE_ACCOUNT" >&2
            exit 1
          }

          if jq -e '.bindings[]? | select(.role=="roles/run.invoker") | (.members // [])[]? | select(.=="allUsers" or .=="allAuthenticatedUsers")' /tmp/iam.json >/dev/null; then
            echo 'AG-01 must remain private.' >&2
            exit 1
          fi

          mapfile -t SERVING_REVISIONS < <(jq -r '.status.traffic[]? | select((.percent // 0) > 0) | "\(.revisionName // "")|\(.percent // 0)"' /tmp/service.json)
          [[ "${#SERVING_REVISIONS[@]}" -eq 1 ]] || {
            echo "Expected exactly one serving AG-01 revision, got ${#SERVING_REVISIONS[@]}" >&2
            exit 1
          }
          IFS='|' read -r REVISION TRAFFIC_PERCENT <<< "${SERVING_REVISIONS[0]}"
          [[ -n "$REVISION" && "$TRAFFIC_PERCENT" == "100" ]] || {
            echo "Expected one AG-01 revision at 100%, got $REVISION $TRAFFIC_PERCENT" >&2
            exit 1
          }

          AUDIENCE="$(jq -r '.status.url // empty' /tmp/service.json)"
          [[ -n "$AUDIENCE" ]] || { echo 'AG-01 service URL missing' >&2; exit 1; }
          INGRESS="$(jq -r '.metadata.annotations["run.googleapis.com/ingress"] // .spec.template.metadata.annotations["run.googleapis.com/ingress"] // "all"' /tmp/service.json)"
          SERVICE_READY="$(jq -r '[.status.conditions[]? | select(.type=="Ready") | .status] | first // empty' /tmp/service.json)"
          LATEST_READY_REVISION="$(jq -r '.status.latestReadyRevisionName // empty' /tmp/service.json)"

          [[ "$SERVICE_READY" == "True" ]] || { echo "Cloud Run service Ready is $SERVICE_READY" >&2; exit 1; }
          [[ "$LATEST_READY_REVISION" == "$REVISION" ]] || {
            echo "Serving revision $REVISION differs from latest ready revision $LATEST_READY_REVISION" >&2
            exit 1
          }

          echo "AUDIENCE=$AUDIENCE" >> "$GITHUB_ENV"
          echo "REVISION=$REVISION" >> "$GITHUB_ENV"
          echo "INGRESS=$INGRESS" >> "$GITHUB_ENV"
          echo "SERVICE_READY=$SERVICE_READY" >> "$GITHUB_ENV"

          gcloud run revisions describe "$REVISION" --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/revision.json
          REVISION_READY="$(jq -r '[.status.conditions[]? | select(.type=="Ready") | .status] | first // empty' /tmp/revision.json)"
          [[ "$REVISION_READY" == "True" ]] || { echo "Cloud Run revision Ready is $REVISION_READY" >&2; exit 1; }
          echo "REVISION_READY=$REVISION_READY" >> "$GITHUB_ENV"

          env_value() {
            local name="$1"
            jq -r --arg name "$name" '[.spec.containers[0].env[]? | select(.name==$name and .value != null) | .value] | first // empty' /tmp/revision.json
          }

          [[ "$(env_value AG01_MODEL_PROVIDER)" == "vertex" ]] || { echo 'AG01_MODEL_PROVIDER drift' >&2; exit 1; }
          [[ "$(env_value AG01_VERTEX_MODEL)" == "gemini-2.5-flash" ]] || { echo 'AG01_VERTEX_MODEL drift' >&2; exit 1; }
          [[ "$(env_value AG01_GOOGLE_AUTH_MODE)" == "gcp_metadata" ]] || { echo 'AG01_GOOGLE_AUTH_MODE drift' >&2; exit 1; }

          if jq -e '[.spec.containers[0].env[]?.name] | any(. == "OPENAI_API_KEY" or . == "GOOGLE_OAUTH_CLIENT_SECRET" or . == "GOOGLE_OAUTH_REFRESH_TOKEN")' /tmp/revision.json >/dev/null; then
            echo 'Unexpected long-lived AG-01 model/Sheets credential env binding.' >&2
            exit 1
          fi

          jq --arg ingress "$INGRESS" --arg serviceReady "$SERVICE_READY" '{schemaVersion:"toca.ag01.production-readback.service.v2",service:.metadata.name,url:.status.url,latestReadyRevision:.status.latestReadyRevisionName,traffic:[.status.traffic[]? | {revisionName,percent,tag}],runtimeServiceAccount:(.spec.template.spec.serviceAccountName // .spec.template.spec.serviceAccount // null),ingress:$ingress,ready:$serviceReady}' /tmp/service.json > ag01-readback-evidence/service.json
          jq --arg revisionReady "$REVISION_READY" '{schemaVersion:"toca.ag01.production-readback.revision.v2",revision:.metadata.name,image:(.spec.containers[0].image // null),imageDigest:(.status.imageDigest // null),ready:$revisionReady,startupProbe:(.spec.containers[0].startupProbe // null),livenessProbe:(.spec.containers[0].livenessProbe // null),plainRuntimeConfig:[.spec.containers[0].env[]? | select(.value != null and (.name | startswith("AG01_") or startswith("TOCA_RELEASE_SHA"))) | {name,value}],secretReferenceNames:[.spec.containers[0].env[]? | select(.valueFrom.secretKeyRef != null) | {envName:.name,secretName:.valueFrom.secretKeyRef.name,version:(.valueFrom.secretKeyRef.key // null)}]}' /tmp/revision.json > ag01-readback-evidence/revision.json
          jq '{schemaVersion:"toca.ag01.production-readback.iam.v1",bindings:[.bindings[]? | {role,members}]}' /tmp/iam.json > ag01-readback-evidence/iam.json

      - name: Mint private readback token
        id: probe_auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.AUDIENCE }}
          create_credentials_file: false
          export_environment_variables: false

      - name: Verify authenticated network boundary without business execution
        env:
          ID_TOKEN: ${{ steps.probe_auth.outputs.id_token }}
        run: |
          set -euo pipefail
          probe() {
            local path="$1" body="$2" headers="$3"
            curl --silent --show-error --dump-header "$headers" --output "$body" --write-out '%{http_code}' \
              -H "Authorization: Bearer $ID_TOKEN" "$AUDIENCE$path" || true
          }

          HEALTH_CODE="$(probe /healthz ag01-readback-evidence/healthz.json ag01-readback-evidence/healthz.headers)"
          READY_CODE="$(probe /readyz ag01-readback-evidence/readyz.json ag01-readback-evidence/readyz.headers)"
          echo "healthz_status=$HEALTH_CODE"
          echo "readyz_status=$READY_CODE"

          NETWORK_PROBE_RESULT=FAIL
          if [[ "$HEALTH_CODE" == "200" && "$READY_CODE" == "200" ]]; then
            jq -e '.status == "ok" and .service == "toca-ag01-orchestrator"' ag01-readback-evidence/healthz.json >/dev/null
            jq -e '.status == "ready" and .service == "toca-ag01-orchestrator" and .runtimeCapabilityCount > 0' ag01-readback-evidence/readyz.json >/dev/null
            NETWORK_PROBE_RESULT=APPLICATION_READY_OBSERVED
          elif [[ "$HEALTH_CODE" == "404" && "$READY_CODE" == "404" && "$INGRESS" != "all" ]]; then
            NETWORK_PROBE_RESULT=INGRESS_BLOCKED_EXPECTED
          else
            echo "Unexpected AG-01 probe result: ingress=$INGRESS health=$HEALTH_CODE ready=$READY_CODE" >&2
            exit 1
          fi

          echo "NETWORK_PROBE_RESULT=$NETWORK_PROBE_RESULT" >> "$GITHUB_ENV"
          jq -n \
            --arg ingress "$INGRESS" \
            --arg healthStatus "$HEALTH_CODE" \
            --arg readinessStatus "$READY_CODE" \
            --arg result "$NETWORK_PROBE_RESULT" \
            '{schemaVersion:"toca.ag01.production-readback.network.v2",ingress:$ingress,healthzHttpStatus:($healthStatus|tonumber),readyzHttpStatus:($readinessStatus|tonumber),result:$result,businessCapabilityExecuted:false}' \
            > ag01-readback-evidence/network-probe.json

      - name: Record immutable read-only metadata
        if: always()
        run: |
          set -euo pipefail
          mkdir -p ag01-readback-evidence
          jq -n \
            --arg sourceSha "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg revision "${REVISION:-unknown}" \
            --arg ingress "${INGRESS:-unknown}" \
            --arg serviceReady "${SERVICE_READY:-unknown}" \
            --arg revisionReady "${REVISION_READY:-unknown}" \
            --arg networkProbeResult "${NETWORK_PROBE_RESULT:-unknown}" \
            '{schemaVersion:"toca.ag01.production-readback.run.v2",sourceSha:$sourceSha,runId:$runId,runAttempt:$runAttempt,productionRevision:$revision,ingress:$ingress,cloudRunServiceReady:$serviceReady,cloudRunRevisionReady:$revisionReady,networkProbeResult:$networkProbeResult,providerMutationExecuted:false,cloudRunMutationExecuted:false,trafficMutationExecuted:false,databaseMutationExecuted:false,businessCapabilityExecuted:false,secretPayloadRead:false}' \
            > ag01-readback-evidence/run-metadata.json

      - name: Upload readback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ag01-production-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ag01-readback-evidence
          if-no-files-found: error
          retention-days: 90
