name: AG-01 Infra Repair Permission Readback

on:
  push:
    branches:
      - ops/ag01-readonly-readback-20260915
    paths:
      - '.github/workflows/ag01-infra-repair-permission-readback.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  INFRA_ADMIN_SERVICE_ACCOUNT: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com
  WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: infrastructure-admin
    steps:
      - name: Authenticate as infrastructure administrator
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.INFRA_ADMIN_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Test exact repair permissions without mutation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ag01-infra-repair-permissions
          TOKEN="$(gcloud auth print-access-token)"
          HTTP="$(curl --silent --show-error \
            --output /tmp/permissions.json \
            --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"permissions":["serviceusage.services.enable","serviceusage.services.get","artifactregistry.repositories.get","run.services.get"]}' \
            "https://cloudresourcemanager.googleapis.com/v1/projects/${PROJECT_ID}:testIamPermissions")"
          unset TOKEN
          test "$HTTP" = 200

          jq '{schemaVersion:"toca.ag01.infra-repair-permissions.v1",grantedPermissions:(.permissions // [] | sort),mutationExecuted:false,secretPayloadRead:false}' \
            /tmp/permissions.json > ag01-infra-repair-permissions/state.json
          cat ag01-infra-repair-permissions/state.json

      - name: Upload immutable permission readback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ag01-infra-repair-permissions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ag01-infra-repair-permissions
          if-no-files-found: error
          retention-days: 30
