name: One-shot Foundation recovery formatter

on:
  push:
    branches:
      - recovery/foundation-runtime-restart-safety-20260819
    paths:
      - '.github/workflows/recovery-format-foundation.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: recovery/foundation-runtime-restart-safety-20260819
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier
        run: pnpm exec prettier --write test/foundation-worker-postgres-e2e.test.ts
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/foundation-worker-postgres-e2e.test.ts
          git commit -m 'style(foundation): apply canonical Prettier'
          git push origin HEAD:recovery/foundation-runtime-restart-safety-20260819
