name: GCP Infra Admin Environment Subject Discovery

on:
  pull_request:
    paths:
      - '.github/workflows/gcp-infra-admin-environment-subject-discovery.yml'

permissions:
  contents: read
  id-token: write

env:
  CANDIDATE_SHA: 7db1a6e5caf01f98b200257c4aeecc2f1b29550a
  PROJECT_ID: toca-mcp-production
  WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp

jobs:
  subject:
    name: Discover exact direct-WIF environment subject read-only
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Authenticate direct WIF principal in infrastructure-admin environment
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Emit authenticated principal through expected denied read
        shell: bash
        run: |
          set -u -o pipefail
          gcloud projects describe "$PROJECT_ID" --format='value(projectId)' 2>&1 || true
          echo 'ENVIRONMENT_SUBJECT_DISCOVERY_COMPLETE=true'
