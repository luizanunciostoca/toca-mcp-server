name: Meta Ads Pixel Access Read-Only Discovery

on:
  push:
    branches:
      - diag/meta-ads-smoke-15442397-failure
    paths:
      - '.github/workflows/meta-ads-pixel-access-readonly-discovery.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  TOKEN_SECRET_ID: toca-meta-oauth-token
  JOB: toca-meta-ads-pixel-access-readonly-discovery
  ACCOUNT_ID: '311793958882290'
  CONFIGURED_PIXEL_ID: '461233076843065'

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Build immutable GET-only discovery image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pixel-discovery
          cat > /tmp/pixel-discovery/discover.mjs <<'NODE'
          const token = process.env.META_ACCESS_TOKEN;
          const accountId = process.env.ACCOUNT_ID;
          const configuredPixelId = process.env.CONFIGURED_PIXEL_ID;
          if (!token || !accountId || !configuredPixelId) throw new Error('CONFIGURATION_MISSING');
          const graph = 'https://graph.facebook.com/v24.0';
          const headers = { Authorization: `Bearer ${token}`, Accept: 'application/json' };
          const sanitize = (v) => String(v ?? '').replace(/[\r\n\t]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 300);
          const get = async (path) => {
            const response = await fetch(`${graph}/${path}`, { headers });
            const body = await response.json().catch(() => ({}));
            return { response, body };
          };
          const rows = (body) => Array.isArray(body?.data) ? body.data : [];
          const errorOf = (result) => {
            const error = result.body?.error ?? {};
            return { httpStatus: result.response.status, code: Number(error.code) || null, subcode: Number(error.error_subcode) || null, message: sanitize(error.message) };
          };

          const businessesResult = await get('me/businesses?fields=id,name&limit=200');
          const businesses = businessesResult.response.ok ? rows(businessesResult.body).map((item) => ({ id: String(item.id), name: item.name ?? null })) : [];
          const businessDiscoveryError = businessesResult.response.ok ? null : errorOf(businessesResult);
          const pixelMap = new Map();
          const edgeResults = [];

          for (const business of businesses) {
            for (const edge of ['adspixels', 'owned_pixels', 'client_pixels']) {
              const result = await get(`${business.id}/${edge}?fields=id,name,last_fired_time,is_unavailable&limit=200`);
              edgeResults.push({ businessId: business.id, businessName: business.name, edge, ok: result.response.ok, count: result.response.ok ? rows(result.body).length : null, error: result.response.ok ? null : errorOf(result) });
              if (!result.response.ok) continue;
              for (const pixel of rows(result.body)) {
                if (!pixel?.id) continue;
                const id = String(pixel.id);
                const existing = pixelMap.get(id) ?? { id, name: pixel.name ?? null, lastFiredTime: pixel.last_fired_time ?? null, isUnavailable: pixel.is_unavailable ?? null, discoveredFrom: [] };
                existing.discoveredFrom.push({ businessId: business.id, businessName: business.name, edge });
                pixelMap.set(id, existing);
              }
            }
          }

          const configuredDirect = await get(`${configuredPixelId}?fields=id,name,last_fired_time,is_unavailable`);
          const configuredDirectResult = configuredDirect.response.ok
            ? { ok: true, id: String(configuredDirect.body?.id ?? ''), name: configuredDirect.body?.name ?? null, lastFiredTime: configuredDirect.body?.last_fired_time ?? null, isUnavailable: configuredDirect.body?.is_unavailable ?? null }
            : { ok: false, error: errorOf(configuredDirect) };
          if (configuredDirect.response.ok && configuredDirect.body?.id && !pixelMap.has(configuredPixelId)) {
            pixelMap.set(configuredPixelId, { id: configuredPixelId, name: configuredDirect.body.name ?? null, lastFiredTime: configuredDirect.body.last_fired_time ?? null, isUnavailable: configuredDirect.body.is_unavailable ?? null, discoveredFrom: [{ edge: 'direct_configured_pixel_read' }] });
          }

          const pixels = [];
          for (const pixel of pixelMap.values()) {
            const assigned = await get(`${pixel.id}/adaccounts?fields=id,account_id,name,account_status&limit=200`);
            const assignedAccounts = assigned.response.ok ? rows(assigned.body).map((item) => ({ id: String(item?.id ?? ''), accountId: String(item?.account_id ?? ''), name: item?.name ?? null, accountStatus: item?.account_status ?? null })) : [];
            pixels.push({
              ...pixel,
              assignedAccounts,
              targetAccountAssigned: assignedAccounts.some((item) => item.accountId === accountId || item.id === `act_${accountId}` || item.id === accountId),
              assignmentReadError: assigned.response.ok ? null : errorOf(assigned),
            });
          }
          pixels.sort((a, b) => Number(b.targetAccountAssigned) - Number(a.targetAccountAssigned) || String(a.name ?? '').localeCompare(String(b.name ?? '')));
          const assignedCandidates = pixels.filter((pixel) => pixel.targetAccountAssigned && pixel.isUnavailable !== true);
          console.log(`META_ADS_PIXEL_ACCESS_DISCOVERY=${JSON.stringify({ configuredPixelId, businesses, businessDiscoveryError, edgeResults, configuredDirectResult, pixels, assignedCandidates })}`);
          NODE
          cat > /tmp/pixel-discovery/Dockerfile <<'DOCKER'
          FROM node:24-bookworm-slim
          WORKDIR /app
          COPY discover.mjs ./discover.mjs
          USER node
          CMD ["node", "discover.mjs"]
          DOCKER
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/meta-ads-pixel-readonly-discovery:${GITHUB_SHA}"
          docker build -t "$IMAGE" /tmp/pixel-discovery
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy GET-only discovery job
        run: |
          gcloud run jobs deploy "$JOB" --image "$IMAGE" --project "$PROJECT_ID" --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars "ACCOUNT_ID=$ACCOUNT_ID,CONFIGURED_PIXEL_ID=$CONFIGURED_PIXEL_ID" \
            --set-secrets "META_ACCESS_TOKEN=$TOKEN_SECRET_ID:latest" \
            --tasks 1 --max-retries 0 --task-timeout 180s --quiet
      - name: Execute GET-only discovery
        run: gcloud run jobs execute "$JOB" --project "$PROJECT_ID" --region "$REGION" --wait --quiet
      - name: Print persisted sanitized discovery
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULT=""
          for attempt in $(seq 1 15); do
            RESULT="$(gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$JOB\" AND textPayload:\"META_ADS_PIXEL_ACCESS_DISCOVERY=\"" \
              --project "$PROJECT_ID" --freshness=15m --order=desc --limit=1 --format='value(textPayload)')"
            [ -n "$RESULT" ] && break
            sleep 3
          done
          test -n "$RESULT"
          printf '%s\n' "$RESULT"
      - name: Remove GET-only discovery job
        if: always()
        run: gcloud run jobs delete "$JOB" --project "$PROJECT_ID" --region "$REGION" --quiet || true
