name: Instagram Engagement Format Ephemeral

on:
  push:
    branches: [feat/instagram-engagement-e2e-20260828]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/instagram-engagement-e2e-20260828
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format engagement files
        run: |
          pnpm exec prettier --write \
            src/crm/social-engagement-classifier.ts \
            src/instagram-engagement-worker.ts \
            src/instagram-engagement/events.ts \
            src/instagram-engagement/knowledge.ts \
            src/instagram-engagement/processor.ts \
            src/instagram-engagement/typed-outbox.ts \
            test/instagram-engagement-knowledge.test.ts \
            test/instagram-engagement-policy.test.ts
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/crm/social-engagement-classifier.ts \
            src/instagram-engagement-worker.ts \
            src/instagram-engagement/events.ts \
            src/instagram-engagement/knowledge.ts \
            src/instagram-engagement/processor.ts \
            src/instagram-engagement/typed-outbox.ts \
            test/instagram-engagement-knowledge.test.ts \
            test/instagram-engagement-policy.test.ts
          git commit -m "style(instagram): apply project prettier"
          git push origin HEAD:feat/instagram-engagement-e2e-20260828
