name: Instagram Engagement Format Ephemeral

on:
  push:
    branches:
      - fix/instagram-engagement-shadow-no-privileged-iam-20260829

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/instagram-engagement-shadow-no-privileged-iam-20260829
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Instagram engagement files
        run: >-
          pnpm exec prettier --write
          src/instagram-engagement-readiness-preflight.ts
          src/instagram-engagement/knowledge-snapshot-current.ts
          src/instagram-engagement/knowledge.ts
          src/instagram-engagement/postgres-knowledge.ts
          src/instagram-engagement/runtime.ts
          src/ops/configure-instagram-engagement-meta-subscriptions.ts
          src/ops/sync-instagram-engagement-knowledge.ts
          src/providers/meta/meta-webhook-runtime-env.ts
          test/meta-webhook-runtime-env.test.ts
          test/instagram-engagement-postgres-knowledge.test.ts
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'FORMAT_ALREADY_CLEAN=1'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/instagram-engagement-readiness-preflight.ts \
            src/instagram-engagement/knowledge-snapshot-current.ts \
            src/instagram-engagement/knowledge.ts \
            src/instagram-engagement/postgres-knowledge.ts \
            src/instagram-engagement/runtime.ts \
            src/ops/configure-instagram-engagement-meta-subscriptions.ts \
            src/ops/sync-instagram-engagement-knowledge.ts \
            src/providers/meta/meta-webhook-runtime-env.ts \
            test/meta-webhook-runtime-env.test.ts \
            test/instagram-engagement-postgres-knowledge.test.ts
          git commit -m 'style(instagram): format shadow IAM-free runtime'
          git push origin HEAD:fix/instagram-engagement-shadow-no-privileged-iam-20260829
