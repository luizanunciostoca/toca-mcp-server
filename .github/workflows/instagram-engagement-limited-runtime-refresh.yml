name: Instagram Engagement LIMITED Runtime Refresh

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: instagram-engagement-limited-runtime-refresh
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_ARTIFACT_REPOSITORY: toca-mcp
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  DATABASE_SECRET_ID: toca-database-url
  TOKEN_SECRET_ID: toca-meta-oauth-token
  DAEMON_SERVICE_NAME: toca-managed-instagram-daemon
  SCHEDULER_JOB_NAME: toca-managed-instagram-tick
  INSTAGRAM_ACCOUNT_ID: '17841402033495654'
  INSTAGRAM_PAGE_ID: '306103746115875'
  CANONICAL_FAQ_SPREADSHEET_ID: 1M0HSs7QJpFCJvvnrZxJRaaXY8scv5R3okCG_OyFLiEU
  TOCA_TENANT_ID: toca
  TOCA_WORKSPACE_ID: toca
  TOCA_ORGANIZATION_ID: toca
  KB_SOURCE_IDS: SRC-OPS-001,SRC-MENU-002,SRC-LOC-001

jobs:
  refresh-limited:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'PRODUCTION AUTHORIZATION — Instagram engagement LIMITED runtime refresh AUTO')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25

    steps:
      - name: Checkout exact authorized controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate exact LIMITED refresh authorization
        id: auth
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")"
          ISSUE_NUMBER="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
          CURRENT_MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          test "$CURRENT_MAIN_SHA" = "$GITHUB_SHA"
          RUNTIME_SHA="$(grep '^RUNTIME_SOURCE_SHA=' <<< "$BODY" | tail -1 | cut -d= -f2-)"
          RUNTIME_DIGEST="$(grep '^RUNTIME_IMAGE_DIGEST=' <<< "$BODY" | tail -1 | cut -d= -f2-)"
          test "$RUNTIME_SHA" = "$GITHUB_SHA"
          [[ "$RUNTIME_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          required=(
            "AUTHORIZED_CONTROLLER_SHA=$GITHUB_SHA"
            "AUTHORIZATION_STATE=ACTIVE"
            "INSTAGRAM_ENGAGEMENT_LIMITED_RUNTIME_REFRESH=AUTHORIZED"
            "RUNTIME_SOURCE_SHA=$GITHUB_SHA"
            "RUNTIME_IMAGE_DIGEST=$RUNTIME_DIGEST"
            "AUTONOMY_STAGE=LIMITED"
            "AUTO_REPLY_CHANNELS=DIRECT"
            "CURRENT_LIMITED_STATE_REQUIRED=true"
            "PERSISTENT_WRITES_AUTHORIZED=true"
            "COMMENT_AUTO_REPLY_AUTHORIZED=false"
            "DATABASE_MIGRATIONS_AUTHORIZED=false"
            "SERVICE_MUTATION_AUTHORIZED=true"
            "SCHEDULER_MUTATION_AUTHORIZED=false"
            "ZERO_TRAFFIC_STAGE_REQUIRED=true"
            "BATCH_SIZE=1"
            "ROLLBACK_ON_FAILURE=true"
          )
          for line in "${required[@]}"; do
            grep -Fxq "$line" <<< "$BODY" || {
              echo "Missing exact LIMITED refresh authorization field: $line" >&2
              exit 1
            }
          done

          CONTROL_BODY="$(gh api "repos/${GITHUB_REPOSITORY}/issues/640" --jq '.body // ""')"
          grep -Fxq 'MAIN_STABILITY=PASS' <<< "$CONTROL_BODY"
          grep -Fxq "EVALUATED_MAIN_SHA=$GITHUB_SHA" <<< "$CONTROL_BODY"
          grep -Fxq 'MERGE_RESERVATION=NONE' <<< "$CONTROL_BODY"

          echo "authorization_issue=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "runtime_image=$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/server@$RUNTIME_DIGEST" >> "$GITHUB_OUTPUT"
          echo "runtime_digest=$RUNTIME_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Exact-head Quality Gate
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm quality

      - name: Authenticate governed deployer
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Verify immutable image and exact current LIMITED prestate
        id: prestate
        env:
          RUNTIME_IMAGE: ${{ steps.auth.outputs.runtime_image }}
          RUNTIME_DIGEST: ${{ steps.auth.outputs.runtime_digest }}
        shell: bash
        run: |
          set -euo pipefail
          DESCRIBED_DIGEST="$(gcloud artifacts docker images describe "$RUNTIME_IMAGE" --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          test "$DESCRIBED_DIGEST" = "$RUNTIME_DIGEST"

          SERVICE_JSON="$(gcloud run services describe "$DAEMON_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          PRE_REVISION_COUNT="$(printf '%s' "$SERVICE_JSON" | jq '[.status.traffic[]? | select((.percent // 0) == 100 and (.revisionName // "") != "")] | length')"
          test "$PRE_REVISION_COUNT" = '1'
          PRE_REVISION="$(printf '%s' "$SERVICE_JSON" | jq -r '[.status.traffic[]? | select((.percent // 0) == 100 and (.revisionName // "") != "") | .revisionName] | .[0]')"
          test -n "$PRE_REVISION"

          PRE_REVISION_JSON="$(gcloud run revisions describe "$PRE_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$PRE_REVISION_JSON" | jq -e --arg sa "$GCP_RUNTIME_SERVICE_ACCOUNT" '
            .spec.containers[0] as $c |
            (([.status.conditions[]? | select(.type == "Ready") | .status] | last) == "True") and
            (.spec.serviceAccountName == $sa) and
            (([($c.env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_RUNTIME_ENABLED") | .value] | last) == "true") and
            (([($c.env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_WRITES_ENABLED") | .value] | last) == "true") and
            (([($c.env // [])[] | select(.name == "INSTAGRAM_PUBLICATION_WRITES_ENABLED") | .value] | last // "false") == "false") and
            (([($c.env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_AUTO_REPLY_CHANNELS") | .value] | last // "DIRECT") == "DIRECT")
          ' >/dev/null

          SCHEDULER_JSON="$(gcloud scheduler jobs describe "$SCHEDULER_JOB_NAME" --project "$GCP_PROJECT_ID" --location "$GCP_REGION" --format=json)"
          SCHEDULER_FINGERPRINT="$(printf '%s' "$SCHEDULER_JSON" | jq -c '{state,schedule,timeZone,httpTarget}' | sha256sum | awk '{print $1}')"
          test -n "$SCHEDULER_FINGERPRINT"

          echo "pre_revision=$PRE_REVISION" >> "$GITHUB_OUTPUT"
          echo "scheduler_fingerprint=$SCHEDULER_FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Stage exact runtime as zero-traffic LIMITED candidate
        id: stage
        env:
          RUNTIME_IMAGE: ${{ steps.auth.outputs.runtime_image }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_TAIL="${GITHUB_RUN_ID: -7}"
          REVISION_SUFFIX="r${RUN_TAIL}a${GITHUB_RUN_ATTEMPT}"
          CANDIDATE_REVISION="${DAEMON_SERVICE_NAME}-${REVISION_SUFFIX}"
          DAEMON_ENV="^@^NODE_ENV=production@META_ENABLED=true@META_PROVIDER_VERIFIED=true@META_ACCESS_TOKEN_ENV_KEY=TOCA_SECRET_META_ACCESS_TOKEN@META_GRAPH_BASE_URL=https://graph.facebook.com@META_GRAPH_API_VERSION=v24.0@INSTAGRAM_PUBLICATION_WRITES_ENABLED=false@INSTAGRAM_ENGAGEMENT_RUNTIME_ENABLED=true@INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=true@INSTAGRAM_ENGAGEMENT_AUTO_REPLY_CHANNELS=DIRECT@INSTAGRAM_ENGAGEMENT_BATCH_SIZE=1@INSTAGRAM_ENGAGEMENT_TENANT_ID=$TOCA_TENANT_ID@INSTAGRAM_ENGAGEMENT_WORKSPACE_ID=$TOCA_WORKSPACE_ID@INSTAGRAM_ENGAGEMENT_ORGANIZATION_ID=$TOCA_ORGANIZATION_ID@INSTAGRAM_ENGAGEMENT_PAGE_ID=$INSTAGRAM_PAGE_ID@INSTAGRAM_BUSINESS_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID@INSTAGRAM_ENGAGEMENT_KNOWLEDGE_SPREADSHEET_ID=$CANONICAL_FAQ_SPREADSHEET_ID@INSTAGRAM_ENGAGEMENT_KNOWLEDGE_SOURCE=postgres@INSTAGRAM_ENGAGEMENT_KNOWLEDGE_BASE_ENABLED=true@INSTAGRAM_ENGAGEMENT_KB_SOURCE_IDS=$KB_SOURCE_IDS@INSTAGRAM_ENGAGEMENT_KB_MIN_CONFIDENCE=0.58@INSTAGRAM_ENGAGEMENT_KB_CANDIDATE_LIMIT=12"

          gcloud run deploy "$DAEMON_SERVICE_NAME" \
            --image "$RUNTIME_IMAGE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --add-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --update-secrets "TOCA_SECRET_META_ACCESS_TOKEN=$TOKEN_SECRET_ID:latest,DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --update-env-vars "$DAEMON_ENV" \
            --command node --args dist/src/toca-managed-instagram-daemon.js \
            --revision-suffix "$REVISION_SUFFIX" \
            --min-instances 0 --max-instances 1 --concurrency 1 \
            --no-traffic --quiet

          echo "candidate_revision=$CANDIDATE_REVISION" >> "$GITHUB_OUTPUT"

      - name: Verify zero-traffic candidate before cutover
        env:
          CANDIDATE_REVISION: ${{ steps.stage.outputs.candidate_revision }}
          PRE_REVISION: ${{ steps.prestate.outputs.pre_revision }}
          RUNTIME_DIGEST: ${{ steps.auth.outputs.runtime_digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_REVISION"
          test -n "$PRE_REVISION"
          test "$CANDIDATE_REVISION" != "$PRE_REVISION"

          REVISION_JSON="$(gcloud run revisions describe "$CANDIDATE_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$REVISION_JSON" | jq -e --arg sa "$GCP_RUNTIME_SERVICE_ACCOUNT" --arg digest "$RUNTIME_DIGEST" '
            .spec.containers[0] as $c |
            (([.status.conditions[]? | select(.type == "Ready") | .status] | last) == "True") and
            (.spec.serviceAccountName == $sa) and
            (($c.image | endswith($digest))) and
            (([($c.env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_RUNTIME_ENABLED") | .value] | last) == "true") and
            (([($c.env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_WRITES_ENABLED") | .value] | last) == "true") and
            (([($c.env // [])[] | select(.name == "INSTAGRAM_PUBLICATION_WRITES_ENABLED") | .value] | last) == "false") and
            (([($c.env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_AUTO_REPLY_CHANNELS") | .value] | last) == "DIRECT") and
            (([($c.env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_BATCH_SIZE") | .value] | last) == "1")
          ' >/dev/null

          SERVICE_JSON="$(gcloud run services describe "$DAEMON_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$SERVICE_JSON" | jq -e --arg previous "$PRE_REVISION" --arg candidate "$CANDIDATE_REVISION" '
            ([.status.traffic[]? | select(.revisionName == $previous and (.percent // 0) == 100)] | length) == 1 and
            ([.status.traffic[]? | select(.revisionName == $candidate and (.percent // 0) > 0)] | length) == 0
          ' >/dev/null
          echo 'ZERO_TRAFFIC_STAGE_VERIFIED=true'

      - name: Cut over exact candidate while preserving LIMITED
        env:
          CANDIDATE_REVISION: ${{ steps.stage.outputs.candidate_revision }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$DAEMON_SERVICE_NAME" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --to-revisions="${CANDIDATE_REVISION}=100" --quiet

      - name: Verify post-cutover LIMITED boundary and scheduler immutability
        env:
          CANDIDATE_REVISION: ${{ steps.stage.outputs.candidate_revision }}
          RUNTIME_DIGEST: ${{ steps.auth.outputs.runtime_digest }}
          PRE_SCHEDULER_FINGERPRINT: ${{ steps.prestate.outputs.scheduler_fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_JSON="$(gcloud run services describe "$DAEMON_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          REVISION_COUNT="$(printf '%s' "$SERVICE_JSON" | jq '[.status.traffic[]? | select((.percent // 0) == 100 and (.revisionName // "") != "")] | length')"
          test "$REVISION_COUNT" = '1'
          printf '%s' "$SERVICE_JSON" | jq -e --arg candidate "$CANDIDATE_REVISION" '
            ([.status.traffic[]? | select(.revisionName == $candidate and (.percent // 0) == 100)] | length) == 1
          ' >/dev/null

          REVISION_JSON="$(gcloud run revisions describe "$CANDIDATE_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$REVISION_JSON" | jq -e --arg digest "$RUNTIME_DIGEST" '
            .spec.containers[0] as $c |
            (([.status.conditions[]? | select(.type == "Ready") | .status] | last) == "True") and
            (($c.image | endswith($digest))) and
            (([($c.env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_RUNTIME_ENABLED") | .value] | last) == "true") and
            (([($c.env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_WRITES_ENABLED") | .value] | last) == "true") and
            (([($c.env // [])[] | select(.name == "INSTAGRAM_PUBLICATION_WRITES_ENABLED") | .value] | last) == "false") and
            (([($c.env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_AUTO_REPLY_CHANNELS") | .value] | last) == "DIRECT") and
            (([($c.env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_BATCH_SIZE") | .value] | last) == "1")
          ' >/dev/null

          SCHEDULER_JSON="$(gcloud scheduler jobs describe "$SCHEDULER_JOB_NAME" --project "$GCP_PROJECT_ID" --location "$GCP_REGION" --format=json)"
          POST_SCHEDULER_FINGERPRINT="$(printf '%s' "$SCHEDULER_JSON" | jq -c '{state,schedule,timeZone,httpTarget}' | sha256sum | awk '{print $1}')"
          test "$POST_SCHEDULER_FINGERPRINT" = "$PRE_SCHEDULER_FINGERPRINT"

          echo 'INSTAGRAM_ENGAGEMENT_LIMITED_RUNTIME_REFRESH_STATUS=PASS'
          echo 'AUTONOMY_STAGE=LIMITED'
          echo 'AUTO_REPLY_CHANNELS=DIRECT'
          echo 'PERSISTENT_WRITES_ENABLED=true'
          echo 'COMMENT_AUTO_REPLY_ENABLED=false'
          echo 'INSTAGRAM_PUBLICATION_WRITES_ENABLED=false'
          echo 'BATCH_SIZE=1'
          echo 'SCHEDULER_MUTATION=false'
          echo 'DATABASE_MIGRATIONS=false'
          echo 'EXTERNAL_REPLY_WRITES_DURING_REFRESH=false'

      - name: Publish sanitized refresh evidence
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORIZATION_ISSUE: ${{ steps.auth.outputs.authorization_issue }}
        shell: bash
        run: |
          set -euo pipefail
          printf -v report '%s\n' \
            'INSTAGRAM_ENGAGEMENT_LIMITED_RUNTIME_REFRESH_STATUS=PASS' \
            'AUTONOMY_STAGE=LIMITED' \
            'AUTO_REPLY_CHANNELS=DIRECT' \
            'PERSISTENT_WRITES_ENABLED=true' \
            'COMMENT_AUTO_REPLY_ENABLED=false' \
            'INSTAGRAM_PUBLICATION_WRITES_ENABLED=false' \
            'BATCH_SIZE=1' \
            'ZERO_TRAFFIC_STAGE_VERIFIED=true' \
            'SCHEDULER_MUTATION=false' \
            'DATABASE_MIGRATIONS=false' \
            'EXTERNAL_REPLY_WRITES_DURING_REFRESH=false' \
            'ROLLBACK_ON_FAILURE=true'
          gh issue comment "$AUTHORIZATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$report" >/dev/null

      - name: Roll back traffic to previous LIMITED revision on failure
        if: failure() && steps.prestate.outputs.pre_revision != ''
        env:
          PRE_REVISION: ${{ steps.prestate.outputs.pre_revision }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$DAEMON_SERVICE_NAME" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --to-revisions="${PRE_REVISION}=100" --quiet >/dev/null 2>&1 || true
          echo 'ROLLBACK_ATTEMPTED=true'

      - name: Consume refresh authorization
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORIZATION_ISSUE: ${{ steps.auth.outputs.authorization_issue }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTHORIZATION_ISSUE:-}"
          ISSUE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${AUTHORIZATION_ISSUE}")"
          BODY="$(printf '%s' "$ISSUE_JSON" | jq -r '.body // ""' | sed 's/^AUTHORIZATION_STATE=ACTIVE$/AUTHORIZATION_STATE=CONSUMED_AND_CLOSED/')"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${AUTHORIZATION_ISSUE}" \
            -f state=closed -f state_reason=completed -f body="$BODY" >/dev/null
