name: AG-01 Production System Diagnostics

on:
  push:
    branches:
      - ops/ag01-readonly-readback-20260915
    paths:
      - '.github/workflows/ag01-production-system-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  SERVICE: toca-ag01-orchestrator
  DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Authenticate read-only GCP boundary
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Capture bounded Cloud Run system and request diagnostics
        run: |
          set -euo pipefail
          mkdir -p ag01-system-diagnostics

          gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/service.json
          REVISION="$(jq -r '.status.traffic[]? | select((.percent // 0) == 100) | .revisionName // empty' /tmp/service.json | head -n1)"
          [[ -n "$REVISION" ]] || { echo 'Serving revision unavailable' >&2; exit 1; }

          SYSTEM_FILTER="resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$SERVICE\" AND resource.labels.revision_name=\"$REVISION\" AND logName:\"run.googleapis.com%2Fvarlog%2Fsystem\""
          REQUEST_FILTER="resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$SERVICE\" AND resource.labels.revision_name=\"$REVISION\" AND logName:\"run.googleapis.com%2Frequests\""

          gcloud logging read "$SYSTEM_FILTER" \
            --project "$PROJECT_ID" --freshness=2h --limit=100 --order=desc --format=json \
            > /tmp/system.json || echo '[]' > /tmp/system.json
          gcloud logging read "$REQUEST_FILTER" \
            --project "$PROJECT_ID" --freshness=2h --limit=100 --order=desc --format=json \
            > /tmp/requests.json || echo '[]' > /tmp/requests.json

          jq '[.[] | {timestamp,severity,revision:(.resource.labels.revision_name // null),message:((.textPayload // "") | tostring | .[0:500])}]' \
            /tmp/system.json > ag01-system-diagnostics/system.json
          jq '[.[] | {timestamp,severity,revision:(.resource.labels.revision_name // null),status:(.httpRequest.status // null),requestMethod:(.httpRequest.requestMethod // null),requestUrl:((.httpRequest.requestUrl // "") | tostring | sub("[?].*$"; "") | .[0:500]),latency:(.httpRequest.latency // null),userAgent:((.httpRequest.userAgent // "") | tostring | .[0:200])}]' \
            /tmp/requests.json > ag01-system-diagnostics/requests.json

          jq -n \
            --arg sourceSha "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg revision "$REVISION" \
            '{schemaVersion:"toca.ag01.production-system-diagnostics.v1",sourceSha:$sourceSha,runId:$runId,productionRevision:$revision,providerMutationExecuted:false,cloudRunMutationExecuted:false,trafficMutationExecuted:false,databaseMutationExecuted:false,businessCapabilityExecuted:false,secretPayloadRead:false,applicationStdoutStderrRead:false,systemLogRead:true,requestMetadataRead:true}' \
            > ag01-system-diagnostics/run-metadata.json

      - name: Upload bounded diagnostic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ag01-production-system-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ag01-system-diagnostics
          if-no-files-found: error
          retention-days: 30
