name: Bootstrap Formatting

on:
  push:
    branches: [feat/bootstrap-mcp-phase-0]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bootstrap-mcp-phase-0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier --write src/core/policy.ts src/core/tool-registry.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/policy.ts src/core/tool-registry.ts
          git diff --cached --quiet || git commit -m "style: apply prettier to core contracts"
          git push origin HEAD:feat/bootstrap-mcp-phase-0
