name: Final Monitoring Smoke v2 2026-08-16

on:
  push:
    branches: [ops/final-external-closeout-20260816]
    paths: ['.github/workflows/final-monitoring-smoke-v2-20260816.yml']

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  OPS_EMAIL: adm@tocadomorcego.com
  PROD_SERVICE: toca-mcp-production
  GCP_INFRA_ADMIN_SERVICE_ACCOUNT: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp

jobs:
  smoke-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_INFRA_ADMIN_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Verify permanent policies and create corrected synthetic policy
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          TOKEN="$(gcloud auth print-access-token)"
          API="https://monitoring.googleapis.com/v3/projects/${GCP_PROJECT_ID}"
          TEST_RUN="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SMOKE_JOB="toca-monitoring-smoke-${GITHUB_RUN_ID}"
          curl --fail --silent -H "Authorization: Bearer ${TOKEN}" "${API}/notificationChannels?pageSize=100" >/tmp/channels.json
          CHANNEL="$(jq -r --arg email "$OPS_EMAIL" '.notificationChannels[]? | select(.type=="email" and .labels.email_address==$email and .enabled==true) | .name' /tmp/channels.json | head -n1)"
          test -n "$CHANNEL"
          curl --fail --silent -H "Authorization: Bearer ${TOKEN}" "${API}/alertPolicies?pageSize=100" >/tmp/policies.json
          for D in 'TOCA P0 Audit Ledger Integrity' 'TOCA P1 Outbox Stalled' 'TOCA P1 Stale Scheduler Jobs' 'TOCA P1 Foundation Daily Control Failed'; do
            jq -e --arg d "$D" --arg c "$CHANNEL" '[.alertPolicies[]? | select(.displayName==$d and .enabled==true and ((.notificationChannels // []) | index($c) != null) and .validity==null)] | length == 1' /tmp/policies.json >/dev/null
          done
          SYN_DISPLAY="TOCA Synthetic Monitoring Smoke ${GITHUB_RUN_ID}"
          SYN_FILTER="resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${SMOKE_JOB}\" AND jsonPayload.event=\"toca.monitoring.synthetic_test\" AND jsonPayload.test_run=\"${TEST_RUN}\""
          jq -n --arg display "$SYN_DISPLAY" --arg filter "$SYN_FILTER" --arg channel "$CHANNEL" '{displayName:$display,documentation:{content:"Controlled synthetic delivery test; temporary and deleted after firing window.",mimeType:"text/markdown"},userLabels:{toca_managed:"true",synthetic:"true"},conditions:[{displayName:"Synthetic controlled log match",conditionMatchedLog:{filter:$filter}}],combiner:"OR",enabled:true,alertStrategy:{notificationRateLimit:{period:"300s"},autoClose:"1800s"},notificationChannels:[$channel]}' >/tmp/syn.json
          H="$(curl --silent --output /tmp/syn-result.json --write-out '%{http_code}' -X POST -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/syn.json "${API}/alertPolicies")"
          test "$H" = 200 || { cat /tmp/syn-result.json >&2; exit 91; }
          SYN_POLICY="$(jq -r '.name' /tmp/syn-result.json)"
          test -n "$SYN_POLICY"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "test_run=$TEST_RUN" >> "$GITHUB_OUTPUT"
          echo "smoke_job=$SMOKE_JOB" >> "$GITHUB_OUTPUT"
          echo "synthetic_policy=$SYN_POLICY" >> "$GITHUB_OUTPUT"

      - name: Authenticate deployer
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Emit synthetic structured log after policy exists
        shell: bash
        env:
          TEST_RUN: ${{ steps.setup.outputs.test_run }}
          SMOKE_JOB: ${{ steps.setup.outputs.smoke_job }}
        run: |
          set -euo pipefail
          cleanup() { gcloud run jobs delete "$SMOKE_JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          SERVICE="$(gcloud run services describe "$PROD_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          IMAGE="$(jq -r '.spec.template.spec.containers[0].image // empty' <<<"$SERVICE")"
          test -n "$IMAGE"
          PAYLOAD="{\"severity\":\"ERROR\",\"event\":\"toca.monitoring.synthetic_test\",\"test_run\":\"${TEST_RUN}\",\"synthetic\":true,\"message\":\"TOCA OS controlled monitoring delivery test\"}"
          gcloud run jobs create "$SMOKE_JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --image "$IMAGE" --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" --command /bin/sh --args="^@^-lc@printf '%s\\n' '${PAYLOAD}'" --tasks 1 --parallelism 1 --max-retries 0 --task-timeout 60s --memory 512Mi --cpu 1 --quiet
          gcloud run jobs execute "$SMOKE_JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet
          for _ in $(seq 1 18); do
            LOGS="$(gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${SMOKE_JOB}\" AND jsonPayload.event=\"toca.monitoring.synthetic_test\" AND jsonPayload.test_run=\"${TEST_RUN}\"" --project "$GCP_PROJECT_ID" --freshness=10m --limit=10 --format=json || true)"
            if [ "$(jq 'length' <<<"${LOGS:-[]}")" -ge 1 ]; then echo "SYNTHETIC_LOG_INGESTED=PASS test_run=$TEST_RUN"; exit 0; fi
            sleep 5
          done
          exit 92

      - name: Authenticate infrastructure administrator for cleanup/readback
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_INFRA_ADMIN_SERVICE_ACCOUNT }}

      - name: Wait for notification processing, delete synthetic policy, preserve permanent policies
        shell: bash
        env:
          CHANNEL: ${{ steps.setup.outputs.channel }}
          SYN_POLICY: ${{ steps.setup.outputs.synthetic_policy }}
          TEST_RUN: ${{ steps.setup.outputs.test_run }}
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          API="https://monitoring.googleapis.com/v3/projects/${GCP_PROJECT_ID}"
          sleep 120
          DH="$(curl --silent --output /tmp/delete.json --write-out '%{http_code}' -X DELETE -H "Authorization: Bearer ${TOKEN}" "https://monitoring.googleapis.com/v3/${SYN_POLICY}")"
          test "$DH" = 200
          curl --fail --silent -H "Authorization: Bearer ${TOKEN}" "${API}/alertPolicies?pageSize=100" >/tmp/final.json
          for D in 'TOCA P0 Audit Ledger Integrity' 'TOCA P1 Outbox Stalled' 'TOCA P1 Stale Scheduler Jobs' 'TOCA P1 Foundation Daily Control Failed'; do
            jq -e --arg d "$D" --arg c "$CHANNEL" '[.alertPolicies[]? | select(.displayName==$d and .enabled==true and ((.notificationChannels // []) | index($c) != null) and .validity==null)] | length == 1' /tmp/final.json >/dev/null
          done
          test "$(jq '[.alertPolicies[]? | select(.userLabels.synthetic=="true")] | length' /tmp/final.json)" -eq 0
          jq -n --arg email "$OPS_EMAIL" --arg channel "$CHANNEL" --arg testRun "$TEST_RUN" --slurpfile p /tmp/final.json '{schemaVersion:2,email:$email,channel:$channel,testRun:$testRun,syntheticLogIngested:true,notificationProcessingWindowSeconds:120,syntheticPolicyDeleted:true,permanentPolicies:[ $p[0].alertPolicies[]? | select(.userLabels.source=="foundation") | {name,displayName,enabled,notificationChannels,userLabels,validity} ]}' > evidence/monitoring-smoke-v2.json
          cat evidence/monitoring-smoke-v2.json
          echo 'MONITORING_SMOKE_V2=PASS'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final-monitoring-smoke-v2-${{ github.sha }}
          path: evidence
          if-no-files-found: warn
          retention-days: 90
