name: Ops Staging Synthetic Alert Dispatch Now 2026-08-22

on:
  pull_request:
    paths: ['.github/workflows/ops-staging-synthetic-alert-dispatch-now.yml']

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact governed synthetic alert workflow
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_SHA256: 8e6971b626a8e82efec0de843f1495c44d4462a1a35f1f744f5f425f70f24605
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'luizanunciostoca/toca-mcp-server'
          echo 'REDISPATCH_REASON=runtime_observability_verified'
          echo 'REDISPATCH_SEQUENCE=5'
          DISPATCH_URL="$(gh workflow run staging-synthetic-alert.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f expected_policy_sha256="$POLICY_SHA256")"
          echo "SYNTHETIC_ALERT_CHILD_URL=${DISPATCH_URL}"
          CHILD_ID="${DISPATCH_URL##*/}"
          [[ "$CHILD_ID" =~ ^[0-9]+$ ]]
          echo "SYNTHETIC_ALERT_CHILD_RUN=${CHILD_ID}"
