name: Temporary Privacy Formatter

on:
  push:
    branches: [audit/privacy-lgpd-operational-final-20260820]

permissions:
  contents: write

jobs:
  format-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          ref: audit/privacy-lgpd-operational-final-20260820
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format permanent Privacy files and remove helper
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            src/omnichannel/email-orchestrator.ts \
            src/omnichannel/privacy-runtime-gate.ts \
            src/omnichannel/whatsapp-runtime.ts \
            test/email-orchestrator.test.ts \
            test/privacy-operational-final.test.ts \
            test/privacy-whatsapp-outbound.test.ts
          git rm .github/workflows/tmp-privacy-format-once.yml
          git config user.name 'TOCA OS Integration'
          git config user.email 'actions@users.noreply.github.com'
          git add src/omnichannel/email-orchestrator.ts src/omnichannel/privacy-runtime-gate.ts src/omnichannel/whatsapp-runtime.ts test/email-orchestrator.test.ts test/privacy-operational-final.test.ts test/privacy-whatsapp-outbound.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(privacy): format final operational revalidation'
          git push origin HEAD:audit/privacy-lgpd-operational-final-20260820
