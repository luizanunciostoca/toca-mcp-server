name: TEMP Instagram Limited Routed Prestate Fix

on:
  push:
    branches:
      - fix/instagram-limited-routed-prestate-v4

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/instagram-limited-routed-prestate-v4

      - name: Apply routed prestate patch
        run: python scripts/_tmp_patch_instagram_limited_routed_prestate.py

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/instagram-engagement-limited-activation.yml test/instagram-engagement-limited-activation.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(instagram): derive LIMITED prestate from routed revision'
          git push origin HEAD:fix/instagram-limited-routed-prestate-v4
