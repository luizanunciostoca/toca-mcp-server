name: Instagram Engagement Shadow Proof Diagnostic

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: instagram-engagement-shadow-proof-diagnostic
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DIAGNOSTIC_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  SOURCE_RUN_ID: '33274932765'
  SOURCE_PROOF_JOB: toca-ig-eng-corrected-proof-33274932765-1

jobs:
  read-only-diagnostic:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'PRODUCTION AUTHORIZATION — Instagram shadow proof diagnostic AUTO')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout exact diagnostic controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate owner authorization and read-only boundary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          ISSUE_JSON="$(jq -c '.issue' "$GITHUB_EVENT_PATH")"
          BODY="$(printf '%s' "$ISSUE_JSON" | jq -r '.body // ""')"
          ISSUE_NUMBER="$(printf '%s' "$ISSUE_JSON" | jq -r '.number')"
          printf '%s' "$ISSUE_JSON" | jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" '
            (.state == "open") and
            (.user.login == $owner) and
            (.title | startswith("PRODUCTION AUTHORIZATION — Instagram shadow proof diagnostic AUTO"))
          ' >/dev/null

          CURRENT_MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          test "$CURRENT_MAIN_SHA" = "$GITHUB_SHA"

          required_lines=(
            "AUTHORIZED_CANDIDATE_SHA=$GITHUB_SHA"
            "AUTHORIZATION_STATE=ACTIVE"
            "INSTAGRAM_ENGAGEMENT_SHADOW_PROOF_DIAGNOSTIC=AUTHORIZED"
            "SOURCE_RUN_ID=$SOURCE_RUN_ID"
            "SOURCE_PROOF_JOB=$SOURCE_PROOF_JOB"
            "READ_ONLY_DIAGNOSTIC=true"
            "SERVICE_MUTATIONS_AUTHORIZED=false"
            "DATABASE_MUTATIONS_AUTHORIZED=false"
            "PROVIDER_WRITES_AUTHORIZED=false"
            "EXTERNAL_REPLY_WRITES_AUTHORIZED=false"
          )
          for required in "${required_lines[@]}"; do
            grep -Fxq "$required" <<< "$BODY" || {
              echo "Missing exact authorization field: $required" >&2
              exit 1
            }
          done

          echo "AUTHORIZATION_ISSUE_NUMBER=$ISSUE_NUMBER" >> "$GITHUB_ENV"

      - name: Authenticate read-only diagnostic identity
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DIAGNOSTIC_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Classify and redact shadow proof failure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GCP_PROJECT_ID" = 'toca-mcp-production'
          test "$SOURCE_RUN_ID" = '33274932765'
          test "$SOURCE_PROOF_JOB" = 'toca-ig-eng-corrected-proof-33274932765-1'

          mkdir -p engagement-evidence
          gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${SOURCE_PROOF_JOB}\"" \
            --project "$GCP_PROJECT_ID" --freshness=1d --limit=500 --order=asc --format=json \
            > /tmp/shadow-proof-logs.json

          node <<'NODE'
          import fs from 'node:fs';

          const entries = JSON.parse(fs.readFileSync('/tmp/shadow-proof-logs.json', 'utf8'));
          if (!Array.isArray(entries) || entries.length === 0) {
            throw new Error('DIAGNOSTIC_LOGS_NOT_FOUND');
          }

          const errorEntries = entries.filter((entry) => entry?.severity === 'ERROR');
          const logClasses = [
            ...new Set(
              errorEntries.map((entry) => {
                const logName = String(entry?.logName ?? 'unknown').replaceAll('%2F', '/');
                return logName.includes('/logs/') ? logName.split('/logs/').at(-1) : 'unknown';
              }),
            ),
          ].sort();

          const payloadTypes = [
            ...new Set(
              errorEntries.map((entry) =>
                entry?.textPayload !== undefined
                  ? 'textPayload'
                  : entry?.jsonPayload !== undefined
                    ? 'jsonPayload'
                    : entry?.protoPayload !== undefined
                      ? 'protoPayload'
                      : 'unknown',
              ),
            ),
          ].sort();

          function collectStrings(value, output = []) {
            if (typeof value === 'string') output.push(value);
            else if (Array.isArray(value)) value.forEach((item) => collectStrings(item, output));
            else if (value && typeof value === 'object') {
              Object.values(value).forEach((item) => collectStrings(item, output));
            }
            return output;
          }

          function preferredMessage(entry) {
            if (typeof entry?.textPayload === 'string') return entry.textPayload;
            if (typeof entry?.jsonPayload?.message === 'string') return entry.jsonPayload.message;
            if (typeof entry?.protoPayload?.status?.message === 'string') {
              return entry.protoPayload.status.message;
            }
            return collectStrings(entry)
              .filter((value) => value.length > 0)
              .sort((left, right) => right.length - left.length)[0] ?? '';
          }

          function redact(value) {
            return String(value)
              .replaceAll('Que horas começa o Sunset?', '<SYNTHETIC_MESSAGE>')
              .replace(/https?:\/\/[^\s]+/giu, '<URL>')
              .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/giu, '<EMAIL>')
              .replace(/sha256:[a-f0-9]{32,}/giu, '<DIGEST>')
              .replace(/[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/giu, '<UUID>')
              .replace(/shadow-proof-[A-Z0-9_-]+/giu, '<SYNTHETIC_ID>')
              .replace(/"[^"\n]{1,500}"/gu, '<STR>')
              .replace(/'[^'\n]{1,500}'/gu, '<STR>')
              .replace(/\b\d{10,}\b/gu, '<ID>')
              .replace(/\b[A-Z0-9_-]{24,}\b/giu, '<TOKEN>')
              .replace(/\s+/gu, ' ')
              .trim()
              .slice(0, 240);
          }

          const allStrings = collectStrings(entries).join('\n');
          const knownMarkers = [];
          for (const channel of ['COMMENT', 'DIRECT']) {
            for (const marker of [
              'EVENT_NORMALIZATION_FAILED',
              'CHANNEL_NORMALIZATION_FAILED',
              'WEBHOOK_FAILED',
              'ACTION_NOT_OBSERVED',
              'UNEXPECTED_STATUS',
              'UNEXPECTED_INTENT',
              'UNEXPECTED_AUTONOMY',
              'FAQ_NOT_RESOLVED',
              'EXTERNAL_REPLY_DETECTED',
              'INBOUND_NOT_DELIVERED',
              'REPLY_EVENT_CREATED_WHILE_WRITES_DISABLED',
            ]) {
              const token = `SHADOW_PROOF_${channel}_${marker}`;
              if (allStrings.includes(token)) knownMarkers.push(token);
            }
          }
          if (allStrings.includes('SHADOW_PROOF_REQUIRES_WRITES_DISABLED')) {
            knownMarkers.push('SHADOW_PROOF_REQUIRES_WRITES_DISABLED');
          }

          const signatures = [
            ...new Set(errorEntries.map((entry) => redact(preferredMessage(entry))).filter(Boolean)),
          ];

          const evidence = {
            schemaVersion: 'toca.instagram-engagement.shadow-proof-diagnostic.v3',
            sourceRunId: process.env.SOURCE_RUN_ID,
            sourceProofJob: process.env.SOURCE_PROOF_JOB,
            logEntriesScanned: entries.length,
            errorSeverityEntries: errorEntries.length,
            errorLogClasses: logClasses,
            errorPayloadTypes: payloadTypes,
            knownFailureMarkers: [...new Set(knownMarkers)].sort(),
            safeErrorSignatures: signatures,
            rawErrorPayloadPrinted: false,
            readOnlyDiagnostic: true,
            serviceMutationsAuthorized: false,
            databaseMutationsAuthorized: false,
            providerWritesAuthorized: false,
            externalReplyWritesAuthorized: false,
          };
          fs.writeFileSync(
            'engagement-evidence/shadow-proof-diagnostic.json',
            `${JSON.stringify(evidence, null, 2)}\n`,
          );
          NODE

          LOG_ENTRIES_SCANNED="$(jq -r '.logEntriesScanned' engagement-evidence/shadow-proof-diagnostic.json)"
          ERROR_SEVERITY_ENTRIES="$(jq -r '.errorSeverityEntries' engagement-evidence/shadow-proof-diagnostic.json)"
          ERROR_LOG_CLASSES="$(jq -r '.errorLogClasses | join(",")' engagement-evidence/shadow-proof-diagnostic.json)"
          ERROR_PAYLOAD_TYPES="$(jq -r '.errorPayloadTypes | join(",")' engagement-evidence/shadow-proof-diagnostic.json)"
          KNOWN_FAILURE_MARKERS="$(jq -r '.knownFailureMarkers | if length == 0 then "NONE" else join(",") end' engagement-evidence/shadow-proof-diagnostic.json)"
          SAFE_ERROR_SIGNATURE="$(jq -r '.safeErrorSignatures | if length == 0 then "NONE" else join(" | ") end' engagement-evidence/shadow-proof-diagnostic.json)"

          printf -v DIAGNOSTIC_BODY '%s\n' \
            'SHADOW_PROOF_DIAGNOSTIC_STATUS=PASS' \
            "SOURCE_RUN_ID=${SOURCE_RUN_ID}" \
            "SOURCE_PROOF_JOB=${SOURCE_PROOF_JOB}" \
            "LOG_ENTRIES_SCANNED=${LOG_ENTRIES_SCANNED}" \
            "ERROR_SEVERITY_ENTRIES=${ERROR_SEVERITY_ENTRIES}" \
            "ERROR_LOG_CLASSES=${ERROR_LOG_CLASSES}" \
            "ERROR_PAYLOAD_TYPES=${ERROR_PAYLOAD_TYPES}" \
            "KNOWN_FAILURE_MARKERS=${KNOWN_FAILURE_MARKERS}" \
            "SAFE_ERROR_SIGNATURE=${SAFE_ERROR_SIGNATURE}" \
            'RAW_ERROR_PAYLOAD_PRINTED=false' \
            'READ_ONLY_DIAGNOSTIC=true' \
            'SERVICE_MUTATIONS_AUTHORIZED=false' \
            'DATABASE_MUTATIONS_AUTHORIZED=false' \
            'PROVIDER_WRITES_AUTHORIZED=false' \
            'EXTERNAL_REPLY_WRITES_AUTHORIZED=false'
          gh issue comment "$AUTHORIZATION_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "$DIAGNOSTIC_BODY"

      - name: Upload sanitized diagnostic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instagram-engagement-shadow-proof-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: engagement-evidence/
          if-no-files-found: error
          retention-days: 90
