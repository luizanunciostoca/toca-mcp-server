name: Temporary Controlled Direct Write

on:
  push:
    branches:
      - feat/instagram-engagement-messaging
    paths:
      - '.github/workflows/tmp-controlled-direct-write.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  TOKEN_SECRET_ID: toca-meta-oauth-token
  PAGE_ID: '306103746115875'
  INSTAGRAM_ACCOUNT_ID: '17841402033495654'
  WRITE_JOB: toca-controlled-direct-write

jobs:
  controlled-write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build fail-closed Direct writer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/controlled-direct-write
          cat > /tmp/controlled-direct-write/write.mjs <<'NODE'
          const oauthToken = process.env.META_ACCESS_TOKEN;
          const pageId = process.env.PAGE_ID;
          const accountId = process.env.INSTAGRAM_ACCOUNT_ID;
          const writesEnabled = process.env.INSTAGRAM_ENGAGEMENT_WRITES_ENABLED === 'true';
          const targetText = 'TESTE TOCA MCP PERSIST DIRECT 001';
          const replyText = 'TESTE TOCA MCP DIRECT REPLY CONTROLADO 001';

          if (!oauthToken || !pageId || !accountId) throw new Error('CONTROLLED_DIRECT_CONFIGURATION_MISSING');
          if (!writesEnabled) throw new Error('CONTROLLED_DIRECT_KILL_SWITCH_CLOSED');

          async function request(path, token, options = {}, stage = 'UNKNOWN', retryReads = true) {
            const method = String(options.method ?? 'GET').toUpperCase();
            const maxAttempts = retryReads && method === 'GET' ? 4 : 1;
            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const response = await fetch(`https://graph.facebook.com/v24.0/${path}`, {
                ...options,
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: 'application/json',
                  ...(options.headers ?? {}),
                },
              });
              const body = await response.json().catch(() => ({}));
              if (response.ok) return body;
              const transient = response.status === 429 || response.status >= 500;
              if (transient && attempt < maxAttempts) {
                console.log(`SAFE_CONTROLLED_DIRECT_${stage}_TRANSIENT_RETRY=${attempt}`);
                await new Promise((resolve) => setTimeout(resolve, 1000 * attempt));
                continue;
              }
              throw new Error(`META_CONTROLLED_DIRECT_${stage}_HTTP_${response.status}`);
            }
            throw new Error(`CONTROLLED_DIRECT_${stage}_RETRY_EXHAUSTED`);
          }

          const page = await request(
            `${pageId}?fields=access_token,instagram_business_account`,
            oauthToken,
            {},
            'PAGE_TOKEN',
          );
          const pageToken = page?.access_token;
          const linkedAccountId = page?.instagram_business_account?.id;
          if (typeof pageToken !== 'string' || pageToken.length === 0) throw new Error('CONTROLLED_DIRECT_PAGE_TOKEN_MISSING');
          if (linkedAccountId !== accountId) throw new Error('CONTROLLED_DIRECT_LINKED_ACCOUNT_MISMATCH');
          console.log('SAFE_CONTROLLED_DIRECT_PAGE_TOKEN_RESOLVED=1');

          // Use Meta's canonical Page conversations listing. We deliberately avoid
          // guessing a recipient: the write is permitted only after the known test
          // DM is found exactly once across the returned conversations.
          const conversations = await request(
            `${pageId}/conversations?fields=id&limit=50`,
            pageToken,
            {},
            'CONVERSATIONS',
          );
          if (!Array.isArray(conversations.data)) throw new Error('CONTROLLED_DIRECT_CONVERSATIONS_INVALID');

          const matches = [];
          const snapshots = new Map();
          for (const conversation of conversations.data) {
            if (typeof conversation?.id !== 'string') continue;
            const fields = encodeURIComponent('messages.limit(100){id,message,from,to,created_time}');
            const detail = await request(`${conversation.id}?fields=${fields}`, pageToken, {}, 'CONVERSATION_DETAIL');
            const messages = Array.isArray(detail?.messages?.data) ? detail.messages.data : [];
            snapshots.set(conversation.id, messages);
            for (const message of messages) {
              if (message?.message !== targetText || typeof message?.from?.id !== 'string') continue;
              matches.push({ conversationId: conversation.id, recipientId: message.from.id });
            }
          }

          console.log(`SAFE_CONTROLLED_DIRECT_TARGET_MATCHES=${matches.length}`);
          if (matches.length !== 1) throw new Error(`CONTROLLED_DIRECT_TARGET_MATCH_COUNT_${matches.length}`);

          const target = matches[0];
          const existing = snapshots.get(target.conversationId) ?? [];
          if (existing.some((message) => message?.message === replyText)) {
            console.log('SAFE_CONTROLLED_DIRECT_WRITE_ALREADY_PRESENT=1');
            console.log('SAFE_CONTROLLED_DIRECT_WRITE_CREATED=0');
            process.exit(0);
          }

          const created = await request(
            `${accountId}/messages`,
            pageToken,
            {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ recipient: { id: target.recipientId }, message: { text: replyText } }),
            },
            'SEND',
            false,
          );
          if (typeof created?.message_id !== 'string' || typeof created?.recipient_id !== 'string') {
            throw new Error('CONTROLLED_DIRECT_PROVIDER_IDS_MISSING');
          }

          let verified = false;
          for (let attempt = 0; attempt < 5; attempt += 1) {
            const fields = encodeURIComponent('messages.limit(100){id,message,from,to,created_time}');
            const detail = await request(`${target.conversationId}?fields=${fields}`, pageToken, {}, 'VERIFY');
            const messages = Array.isArray(detail?.messages?.data) ? detail.messages.data : [];
            verified = messages.some((message) => message?.message === replyText);
            if (verified) break;
            await new Promise((resolve) => setTimeout(resolve, 1500));
          }
          if (!verified) throw new Error('CONTROLLED_DIRECT_VERIFICATION_FAILED');

          console.log('SAFE_CONTROLLED_DIRECT_WRITE_ALREADY_PRESENT=0');
          console.log('SAFE_CONTROLLED_DIRECT_WRITE_CREATED=1');
          console.log('SAFE_CONTROLLED_DIRECT_WRITE_VERIFIED=1');
          NODE

          cat > /tmp/controlled-direct-write/Dockerfile <<'DOCKER'
          FROM node:24-bookworm-slim
          WORKDIR /app
          COPY write.mjs ./write.mjs
          USER node
          CMD ["node", "write.mjs"]
          DOCKER

          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/controlled-direct-write:${GITHUB_SHA}"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" /tmp/controlled-direct-write
          docker push "$IMAGE"
          echo "WRITE_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Execute exactly one controlled Direct write
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            gcloud run jobs delete "$WRITE_JOB" --project "$PROJECT_ID" --region "$REGION" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          gcloud run jobs deploy "$WRITE_JOB" \
            --image "$WRITE_IMAGE" --project "$PROJECT_ID" --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars "PAGE_ID=$PAGE_ID,INSTAGRAM_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID,INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=true" \
            --set-secrets "META_ACCESS_TOKEN=$TOKEN_SECRET_ID:latest" \
            --max-retries 0 --task-timeout 180s --quiet

          set +e
          gcloud run jobs execute "$WRITE_JOB" --project "$PROJECT_ID" --region "$REGION" --wait --quiet
          EXEC_STATUS=$?
          set -e

          MARKERS="$(gcloud logging read \
            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$WRITE_JOB\" AND textPayload:\"SAFE_CONTROLLED_DIRECT_\"" \
            --project "$PROJECT_ID" --freshness=10m --limit=100 --format='value(textPayload)' 2>/dev/null \
            | grep -E '^SAFE_CONTROLLED_DIRECT_([A-Z_]+_TRANSIENT_RETRY=[0-9]+|PAGE_TOKEN_RESOLVED=1|TARGET_MATCHES=[0-9]+|WRITE_(ALREADY_PRESENT|CREATED|VERIFIED)=[01])$' | sort -u || true)"
          echo "$MARKERS"

          if [ "$EXEC_STATUS" -ne 0 ]; then
            ERROR_MARKER="$(gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$WRITE_JOB\" AND textPayload:(\"CONTROLLED_DIRECT_\" OR \"META_CONTROLLED_DIRECT_\")" \
              --project "$PROJECT_ID" --freshness=10m --limit=50 --format='value(textPayload)' 2>/dev/null \
              | grep -Eo '(CONTROLLED_DIRECT_[A-Z0-9_]+|META_CONTROLLED_DIRECT_[A-Z_]+_HTTP_[0-9]+)' | sort -u | tail -10 || true)"
            echo "$ERROR_MARKER"
            exit "$EXEC_STATUS"
          fi

          CREATED="$(echo "$MARKERS" | sed -n 's/^SAFE_CONTROLLED_DIRECT_WRITE_CREATED=//p' | tail -1)"
          ALREADY="$(echo "$MARKERS" | sed -n 's/^SAFE_CONTROLLED_DIRECT_WRITE_ALREADY_PRESENT=//p' | tail -1)"
          VERIFIED="$(echo "$MARKERS" | sed -n 's/^SAFE_CONTROLLED_DIRECT_WRITE_VERIFIED=//p' | tail -1)"
          if [ "${CREATED:-0}" = "1" ]; then test "${VERIFIED:-0}" = "1"; else test "${ALREADY:-0}" = "1"; fi

      - name: Confirm public boundary remains writes-off
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe toca-meta-oauth-staging --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/service.json
          VALUE="$(jq -r '[.spec.template.spec.containers[0].env[]? | select(.name == "INSTAGRAM_ENGAGEMENT_WRITES_ENABLED") | .value][0] // "__MISSING__"' /tmp/service.json)"
          test "$VALUE" = "false"
          echo 'SAFE_PUBLIC_BOUNDARY_WRITES_ENABLED=0'
