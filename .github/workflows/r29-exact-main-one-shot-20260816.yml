name: R29 Exact Main One Shot 2026-08-16

on:
  push:
    branches: [ops/slo-production-assessment-20260816]
    paths: ['.github/workflows/r29-exact-main-one-shot-20260816.yml']

permissions:
  contents: read
  id-token: write

concurrency:
  group: r29-exact-main-one-shot-20260816
  cancel-in-progress: false

env:
  SOURCE_SHA: 58f31df28e63629d3933bbce67bf912932d05829
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_ARTIFACT_REPOSITORY: toca-mcp
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  DATABASE_SECRET_ID: toca-database-url
  DAEMON_SERVICE: toca-managed-instagram-daemon

jobs:
  verify-r29:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - name: Require stable exact main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$CURRENT" = "$SOURCE_SHA"

      - name: Authenticate deployer to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Execute exact-main R29 runtime drain and post-cleanup proof
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/server:toca-managed-daemon-$SOURCE_SHA"
          SERVICE_IMAGE="$(gcloud run services describe "$DAEMON_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(spec.template.spec.containers[0].image)')"
          test "$SERVICE_IMAGE" = "$IMAGE"
          VALIDATION_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          JOB="toca-r29-exact-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          DRAIN="toca-r29-exact-drain-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          POST="toca-r29-exact-post-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup_job(){ gcloud run jobs delete "$1" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          cleanup_all(){ cleanup_job "$POST"; cleanup_job "$DRAIN"; cleanup_job "$JOB"; }
          assert_absent(){ test -z "$(gcloud run jobs list --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --filter="metadata.name=$1" --format='value(metadata.name)')"; }
          trap cleanup_all EXIT

          deploy_job(){
            local NAME="$1" SCRIPT="$2"
            gcloud run jobs deploy "$NAME" --image "$IMAGE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
              --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
              --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" \
              --set-env-vars "SOURCE_SHA=$SOURCE_SHA,VALIDATION_RUN_ID=$VALIDATION_RUN_ID" \
              --command node --args "$SCRIPT" --tasks 1 --max-retries 0 --task-timeout 300s --quiet
          }
          logs_for(){ gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$1\"" --project "$GCP_PROJECT_ID" --freshness=20m --limit=250 --order=asc --format='value(textPayload)' || true; }

          deploy_job "$JOB" dist/scripts/verify-r29-production-runtime.js
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet
          LOGS="$(logs_for "$JOB")"
          printf '%s\n' "$LOGS"
          LINE="$(printf '%s\n' "$LOGS" | grep 'R29_PRODUCTION_RUNTIME_VERIFY=' | tail -n1)"
          test -n "$LINE"
          JSON="${LINE#R29_PRODUCTION_RUNTIME_VERIFY=}"
          jq -e --arg sha "$SOURCE_SHA" '.schemaVersion==1 and .sourceSha==$sha and .executionSurface=="toca.execute" and .executionEngine=="executeCoreCapability" and .publicToolCount==12 and .videoCapability=="video.caption.embed" and .r29Capability=="content_item.channel.adapt" and .providerReadbackVerified==true and .durableReadbackVerified==true and .artifactRows==1 and .outboxRows==1 and .auditValid==true and .failClosed==true and .externalPublicationExecuted==false' <<<"$JSON" >/dev/null

          deploy_job "$DRAIN" dist/scripts/drain-r29-validation-outbox.js
          gcloud run jobs execute "$DRAIN" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet
          DLOGS="$(logs_for "$DRAIN")"
          printf '%s\n' "$DLOGS"
          DLINE="$(printf '%s\n' "$DLOGS" | grep 'R29_VALIDATION_OUTBOX_DRAIN=' | tail -n1)"
          test -n "$DLINE"
          DJSON="${DLINE#R29_VALIDATION_OUTBOX_DRAIN=}"
          jq -e --arg sha "$SOURCE_SHA" --arg run "$VALIDATION_RUN_ID" '.schemaVersion==1 and .sourceSha==$sha and .validationRunId==$run and .matched==3 and .drained==3 and .delivered==3 and .pending==0 and .transport=="r29-production-verifier-validation-sink" and .externalPublicationExecuted==false' <<<"$DJSON" >/dev/null

          cleanup_job "$DRAIN"
          cleanup_job "$JOB"
          assert_absent "$DRAIN"
          assert_absent "$JOB"

          deploy_job "$POST" dist/scripts/verify-r29-post-cleanup.js
          gcloud run jobs execute "$POST" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet
          PLOGS="$(logs_for "$POST")"
          printf '%s\n' "$PLOGS"
          PLINE="$(printf '%s\n' "$PLOGS" | grep 'R29_POST_CLEANUP_RUNTIME_VERIFY=' | tail -n1)"
          test -n "$PLINE"
          PJSON="${PLINE#R29_POST_CLEANUP_RUNTIME_VERIFY=}"
          jq -e --arg sha "$SOURCE_SHA" --arg run "$VALIDATION_RUN_ID" '.schemaVersion==1 and .sourceSha==$sha and .validationRunId==$run and .migrationsVerified==["020_content_item_versioning_video.sql","021_r29_video_artifacts.sql"] and .artifactRows==1 and .providerReadbackVerified==true and .r29ReadbackVerified==true and .durableContentReadbackVerified==true and .auditReadbackVerified==true and .failClosed==true and .outboxMatched==3 and .outboxDelivered==3 and .outboxPending==0 and .externalPublicationExecuted==false' <<<"$PJSON" >/dev/null

          cleanup_job "$POST"
          assert_absent "$POST"
          assert_absent "$DRAIN"
          assert_absent "$JOB"
          trap - EXIT
          jq -n --arg sha "$SOURCE_SHA" --arg run "$VALIDATION_RUN_ID" --argjson runtime "$JSON" --argjson drain "$DJSON" --argjson post "$PJSON" '{schemaVersion:1,sourceSha:$sha,validationRunId:$run,runtime:$runtime,drain:$drain,postCleanup:$post,tempJobsAbsent:true}' > r29-exact-main-proof.json
          cat r29-exact-main-proof.json
          echo 'R29_EXACT_MAIN_RUNTIME_GATE=PASS'

      - name: Upload exact-main R29 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r29-exact-main-proof-${{ env.SOURCE_SHA }}
          path: r29-exact-main-proof.json
          retention-days: 90

  quality-after-cleanup:
    needs: verify-r29
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact deployed SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Re-run full Quality after R29 cleanup
        run: pnpm quality

  final:
    needs: [verify-r29, quality-after-cleanup]
    runs-on: ubuntu-latest
    steps:
      - name: Recheck main stability and promote R29 proof
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$CURRENT" = "$SOURCE_SHA"
          echo "R29_EXACT_MAIN_POST_CLEANUP=PASS sha=$SOURCE_SHA"
