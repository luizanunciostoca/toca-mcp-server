name: Sunset Runtime Format Helper

on:
  push:
    branches:
      - feat/sunset-runtime-render-preview-20260827-r2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Sunset runtime files
        run: |
          pnpm prettier --write \
            src/creative/sunset-story-semantic-analysis.ts \
            src/providers/local/local-imagemagick-sunset-image-analyzer.ts \
            src/creative/sunset-story-overlay.ts \
            src/providers/local/local-imagemagick-sunset-story-renderer.ts \
            src/creative/sunset-story-deterministic-preview-evaluator.ts \
            src/providers/local/filesystem-sunset-story-overlay-resolver.ts \
            control/creative-standards/sunset-overlays.v1.json \
            test/sunset-story-runtime-render-preview.test.ts
      - name: Commit formatting only when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "SUNSET_RUNTIME_FORMAT_NO_CHANGES=1"
            exit 0
          fi
          git config user.name "TOCA OS CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/creative/sunset-story-semantic-analysis.ts \
            src/providers/local/local-imagemagick-sunset-image-analyzer.ts \
            src/creative/sunset-story-overlay.ts \
            src/providers/local/local-imagemagick-sunset-story-renderer.ts \
            src/creative/sunset-story-deterministic-preview-evaluator.ts \
            src/providers/local/filesystem-sunset-story-overlay-resolver.ts \
            control/creative-standards/sunset-overlays.v1.json \
            test/sunset-story-runtime-render-preview.test.ts
          git commit -m "style(stories): format Sunset preview runtime"
          git push origin "HEAD:${GITHUB_REF_NAME}"
