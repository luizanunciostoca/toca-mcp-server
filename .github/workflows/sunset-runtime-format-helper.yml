name: Sunset Runtime Format Helper

on:
  push:
    branches:
      - feat/sunset-vertex-runtime-adapters-20260827

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format exact runtime files
        run: |
          pnpm prettier --write \
            docs/architecture/sunset-story-manual-source-map.md \
            src/creative/sunset-story-creative-truth-brand-resolver.ts \
            src/providers/gcp/vertex-gemini-sunset-story.ts \
            test/sunset-story-manual-typography.test.ts \
            test/sunset-story-renderer-typography.test.ts
      - name: Commit formatting only when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "SUNSET_RUNTIME_FORMAT_NO_CHANGES=1"
            exit 0
          fi
          git config user.name "TOCA OS CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            docs/architecture/sunset-story-manual-source-map.md \
            src/creative/sunset-story-creative-truth-brand-resolver.ts \
            src/providers/gcp/vertex-gemini-sunset-story.ts \
            test/sunset-story-manual-typography.test.ts \
            test/sunset-story-renderer-typography.test.ts
          git commit -m "style(stories): format Sunset runtime adapters"
          git push origin "HEAD:${GITHUB_REF_NAME}"
