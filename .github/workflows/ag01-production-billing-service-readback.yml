name: AG-01 Production Billing and Service Usage Readback

on:
  push:
    branches:
      - ops/ag01-readonly-readback-20260915
    paths:
      - '.github/workflows/ag01-production-billing-service-readback.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Authenticate read-only GCP boundary
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Read billing account, Service Usage and Artifact Registry control plane
        run: |
          set -euo pipefail
          mkdir -p ag01-billing-service-readback

          gcloud billing projects describe "$PROJECT_ID" --format=json > /tmp/project-billing.json
          BILLING_ENABLED="$(jq -r '.billingEnabled // false' /tmp/project-billing.json)"
          BILLING_ACCOUNT_NAME="$(jq -r '.billingAccountName // empty' /tmp/project-billing.json)"
          BILLING_ACCOUNT_LINKED=false
          [[ -n "$BILLING_ACCOUNT_NAME" ]] && BILLING_ACCOUNT_LINKED=true

          BILLING_ACCOUNT_OPEN=unknown
          if [[ -n "$BILLING_ACCOUNT_NAME" ]]; then
            BILLING_ACCOUNT_ID="${BILLING_ACCOUNT_NAME#billingAccounts/}"
            if gcloud billing accounts describe "$BILLING_ACCOUNT_ID" --format=json > /tmp/account.json 2>/tmp/account.err; then
              ACCOUNT_OPEN_RAW="$(jq -r '.open // empty' /tmp/account.json)"
              if [[ "$ACCOUNT_OPEN_RAW" == "true" ]]; then BILLING_ACCOUNT_OPEN=true; fi
              if [[ "$ACCOUNT_OPEN_RAW" == "false" ]]; then BILLING_ACCOUNT_OPEN=false; fi
            else
              echo '{}' > /tmp/account.json
            fi
          else
            echo '{}' > /tmp/account.json
          fi

          ARTIFACTREGISTRY_SERVICE_ENABLED=false
          if gcloud services list --enabled --project "$PROJECT_ID" --filter='name:artifactregistry.googleapis.com' --format='value(name)' | grep -Fxq 'artifactregistry.googleapis.com'; then
            ARTIFACTREGISTRY_SERVICE_ENABLED=true
          fi

          REPOSITORY_READABLE=false
          REPOSITORY_ERROR_CLASS=NONE
          if gcloud artifacts repositories describe "$REPOSITORY" --location "$REGION" --project "$PROJECT_ID" --format=json > /tmp/repository.json 2>/tmp/repository.err; then
            REPOSITORY_READABLE=true
          else
            echo '{}' > /tmp/repository.json
            if grep -Fq 'BILLING_DISABLED' /tmp/repository.err; then
              REPOSITORY_ERROR_CLASS=BILLING_DISABLED
            elif grep -Fq 'PERMISSION_DENIED' /tmp/repository.err; then
              REPOSITORY_ERROR_CLASS=PERMISSION_DENIED
            elif grep -Fq 'NOT_FOUND' /tmp/repository.err; then
              REPOSITORY_ERROR_CLASS=NOT_FOUND
            else
              REPOSITORY_ERROR_CLASS=OTHER
            fi
          fi

          jq -n \
            --argjson billingEnabled "$BILLING_ENABLED" \
            --argjson billingAccountLinked "$BILLING_ACCOUNT_LINKED" \
            --arg billingAccountOpen "$BILLING_ACCOUNT_OPEN" \
            --argjson artifactRegistryServiceEnabled "$ARTIFACTREGISTRY_SERVICE_ENABLED" \
            --argjson repositoryReadable "$REPOSITORY_READABLE" \
            --arg repositoryErrorClass "$REPOSITORY_ERROR_CLASS" \
            '{schemaVersion:"toca.ag01.production-billing-service-readback.v1",billingEnabled:$billingEnabled,billingAccountLinked:$billingAccountLinked,billingAccountOpen:(if $billingAccountOpen=="true" then true elif $billingAccountOpen=="false" then false else null end),artifactRegistryServiceEnabled:$artifactRegistryServiceEnabled,repositoryReadable:$repositoryReadable,repositoryErrorClass:$repositoryErrorClass}' \
            > ag01-billing-service-readback/state.json

          jq -n \
            --arg sourceSha "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            '{schemaVersion:"toca.ag01.production-billing-service-readback.run.v1",sourceSha:$sourceSha,runId:$runId,billingMutationExecuted:false,serviceUsageMutationExecuted:false,artifactRegistryMutationExecuted:false,cloudRunMutationExecuted:false,providerMutationExecuted:false,businessCapabilityExecuted:false,secretPayloadRead:false}' \
            > ag01-billing-service-readback/run-metadata.json

          cat ag01-billing-service-readback/state.json

      - name: Upload immutable billing and Service Usage readback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ag01-production-billing-service-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ag01-billing-service-readback
          if-no-files-found: error
          retention-days: 30
