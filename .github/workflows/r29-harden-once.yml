name: R29 Harden Once

on:
  push:
    branches: [feat/r29-video-reconciliation-final]
    paths:
      - scripts/r29-harden-runtime.mjs
      - .github/workflows/r29-harden-once.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/r29-video-reconciliation-final
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply runtime hardening
        run: node scripts/r29-harden-runtime.mjs
      - name: Format Video R29 reconciliation files
        run: >-
          pnpm exec prettier --write
          src/content/capability-contracts.ts
          src/content/capability-ids.ts
          src/content/content-item.ts
          src/content/runtime.ts
          src/content/video.ts
          src/governance/capability-catalog.ts
          src/mcp/runtime-capability-resolver.ts
          src/persistence/postgres-content-item-store.ts
          src/registry.ts
          src/server.ts
          test/capability-resolution.test.ts
          test/content-item-store-idempotency.test.ts
          test/content-video-foundation.test.ts
          test/governance-catalog.test.ts
          test/r20-r29-capability-contracts.test.ts
          test/r29-video-core-runtime.test.ts
          docs/checkpoints/r29-video-current-architecture-reconciliation.md
      - name: Remove one-shot hardening assets
        run: rm scripts/r29-harden-runtime.mjs .github/workflows/r29-harden-once.yml
      - name: Commit hardened implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(r29): harden runtime readback and contracts"
          git push origin HEAD:feat/r29-video-reconciliation-final
