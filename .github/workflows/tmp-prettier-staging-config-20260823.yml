name: TEMP Exact Prettier Staging Config 2026-08-23

on:
  push:
    branches:
      - fix/staging-canonical-deploy-config-20260823

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/staging-canonical-deploy-config-20260823
          fetch-depth: 1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Format only permanent non-workflow files
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write scripts/export-staging-deploy-config.mjs test/gcp-staging-canonical-workflow.test.ts
          pnpm exec prettier --check scripts/export-staging-deploy-config.mjs test/gcp-staging-canonical-workflow.test.ts
          git add scripts/export-staging-deploy-config.mjs test/gcp-staging-canonical-workflow.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(staging): apply repository prettier'
          git push origin HEAD:fix/staging-canonical-deploy-config-20260823
