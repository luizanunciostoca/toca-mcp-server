name: AG-01 Startup Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - ops/ag01-vertex-permanent-binding-20260828
    paths:
      - '.github/workflows/ag01-startup-diagnostics.yml'

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Capture failed revision logs
        run: |
          set -euo pipefail
          mkdir -p ag01-startup-diagnostics
          REVISION='toca-ag01-orchestrator-vtx-e2cd2149'
          gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=toca-ag01-orchestrator AND resource.labels.revision_name=${REVISION}" \
            --project toca-mcp-production --limit 200 --freshness 2h --format=json \
            > ag01-startup-diagnostics/logs.json
          gcloud run revisions describe "$REVISION" --project toca-mcp-production --region southamerica-east1 --format=json \
            > ag01-startup-diagnostics/revision.json || true
          jq -r '.. | .textPayload? // empty' ag01-startup-diagnostics/logs.json | tail -n 120 > ag01-startup-diagnostics/text.log || true
          cat ag01-startup-diagnostics/text.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ag01-startup-diagnostics-${{ github.run_id }}
          path: ag01-startup-diagnostics
          retention-days: 30
