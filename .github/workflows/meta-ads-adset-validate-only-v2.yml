name: Meta Ads AdSet Validate Only V2

on:
  push:
    branches:
      - diag/meta-ads-post-fix-create-paused-smoke
    paths:
      - '.github/workflows/meta-ads-adset-validate-only-v2.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  TOKEN_SECRET_ID: toca-meta-oauth-token
  JOB: toca-meta-ads-adset-validate-only-v2
  ACCOUNT_ID: '311793958882290'
  CAMPAIGN_ID: '52617447139665'
  CAMPAIGN_NAME: 'TOCA | P0 SMOKE CREATE_PAUSED | fix74v2-068a44052a6d'
  PIXEL_ID: '461233076843065'

jobs:
  validate-only:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Build validation image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/adset-v2
          cat > /tmp/adset-v2/validate.mjs <<'NODE'
          const token = process.env.META_ACCESS_TOKEN;
          const accountId = process.env.ACCOUNT_ID;
          const campaignId = process.env.CAMPAIGN_ID;
          const campaignName = process.env.CAMPAIGN_NAME;
          const pixelId = process.env.PIXEL_ID;
          if (!token || !accountId || !campaignId || !campaignName || !pixelId) throw new Error('CONFIGURATION_MISSING');
          const graph = 'https://graph.facebook.com/v24.0';
          const headers = { Authorization: `Bearer ${token}`, Accept: 'application/json' };
          const campaignResponse = await fetch(`${graph}/${campaignId}?fields=id,name,status,effective_status`, { headers });
          const campaign = await campaignResponse.json();
          if (!campaignResponse.ok || campaign.name !== campaignName || campaign.status !== 'PAUSED' || campaign.effective_status === 'ACTIVE') {
            throw new Error('PARTIAL_CAMPAIGN_SAFETY_CHECK_FAILED');
          }
          const start = new Date(Date.now() + 30 * 60 * 1000);
          const end = new Date(start.getTime() + 25 * 60 * 60 * 1000);
          const params = new URLSearchParams({
            campaign_id: campaignId,
            name: 'P0 AdSet VALIDATE_ONLY V2 | LOWEST_COST_WITHOUT_CAP',
            daily_budget: '17000',
            billing_event: 'IMPRESSIONS',
            optimization_goal: 'OFFSITE_CONVERSIONS',
            bid_strategy: 'LOWEST_COST_WITHOUT_CAP',
            targeting: JSON.stringify({ geo_locations: { custom_locations: [{ latitude: -13.3833, longitude: -38.9167, radius: 15, distance_unit: 'kilometer' }] } }),
            promoted_object: JSON.stringify({ pixel_id: pixelId, custom_event_type: 'PURCHASE' }),
            start_time: start.toISOString(),
            end_time: end.toISOString(),
            status: 'PAUSED',
            execution_options: JSON.stringify(['validate_only']),
          });
          const response = await fetch(`${graph}/act_${accountId}/adsets`, {
            method: 'POST',
            headers: { ...headers, 'content-type': 'application/x-www-form-urlencoded' },
            body: params.toString(),
          });
          const body = await response.json().catch(() => ({}));
          const error = body?.error ?? {};
          const sanitize = (v) => String(v ?? '').replace(/[\r\n\t]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 400);
          const result = response.ok
            ? { httpStatus: response.status, ok: true, returnedId: body?.id ?? null, durationHours: (end - start) / 3600000 }
            : { httpStatus: response.status, type: sanitize(error.type), code: Number(error.code) || null, subcode: Number(error.error_subcode) || null, userTitle: sanitize(error.error_user_title), userMessage: sanitize(error.error_user_msg), message: sanitize(error.message) };
          console.log(`META_ADS_ADSET_VALIDATE_ONLY_V2=${JSON.stringify(result)}`);
          if (!response.ok) process.exit(2);
          if (body?.id) throw new Error('VALIDATE_ONLY_UNEXPECTEDLY_RETURNED_ID');
          NODE
          cat > /tmp/adset-v2/Dockerfile <<'DOCKER'
          FROM node:24-bookworm-slim
          WORKDIR /app
          COPY validate.mjs ./validate.mjs
          USER node
          CMD ["node", "validate.mjs"]
          DOCKER
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/meta-ads-adset-validate-only-v2:${GITHUB_SHA}"
          docker build -t "$IMAGE" /tmp/adset-v2
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy validation job
        run: |
          gcloud run jobs deploy "$JOB" \
            --image "$IMAGE" --project "$PROJECT_ID" --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars "ACCOUNT_ID=$ACCOUNT_ID,CAMPAIGN_ID=$CAMPAIGN_ID,CAMPAIGN_NAME=$CAMPAIGN_NAME,PIXEL_ID=$PIXEL_ID" \
            --set-secrets "META_ACCESS_TOKEN=$TOKEN_SECRET_ID:latest" \
            --tasks 1 --max-retries 0 --task-timeout 120s --quiet
      - name: Execute validate-only
        run: gcloud run jobs execute "$JOB" --project "$PROJECT_ID" --region "$REGION" --wait --quiet
      - name: Print result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULT=""
          for attempt in $(seq 1 12); do
            RESULT="$(gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$JOB\" AND textPayload:\"META_ADS_ADSET_VALIDATE_ONLY_V2=\"" \
              --project "$PROJECT_ID" --freshness=10m --order=desc --limit=1 --format='value(textPayload)')"
            [ -n "$RESULT" ] && break
            sleep 5
          done
          test -n "$RESULT"
          printf '%s\n' "$RESULT"
      - name: Remove validation job
        if: always()
        run: gcloud run jobs delete "$JOB" --project "$PROJECT_ID" --region "$REGION" --quiet || true
