name: One-shot split deploy probe step

on:
  push:
    branches:
      - fix/deploy-gcp-run-step-limit-20260826

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'luizanunciostoca'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/deploy-gcp-run-step-limit-20260826
          fetch-depth: 1

      - name: Detect staged payload
        id: state
        run: |
          if [[ -f tmp/deploy-gcp.step-limit-patched.yml ]]; then
            echo 'already=true' >> "$GITHUB_OUTPUT"
          else
            echo 'already=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.state.outputs.already != 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        if: steps.state.outputs.already != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply remediation
        if: steps.state.outputs.already != 'true'
        run: python scripts/one-shot-split-deploy-probe-step.py

      - name: Validate affected contracts
        if: steps.state.outputs.already != 'true'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write test/gcp-workflow-run-length-contract.test.ts test/gcp-production-webhook-internal-probe-contract.test.ts test/gcp-deploy-cloud-run-probes.test.ts test/gcp-production-internal-probe-contract.test.ts test/gcp-production-probe-rollback-contract.test.ts
          git diff --check
          pnpm exec vitest run test/gcp-workflow-run-length-contract.test.ts test/gcp-production-webhook-internal-probe-contract.test.ts test/gcp-deploy-cloud-run-probes.test.ts test/gcp-production-internal-probe-contract.test.ts test/gcp-production-probe-rollback-contract.test.ts

      - name: Stage validated payload outside workflows
        if: steps.state.outputs.already != 'true'
        run: |
          set -euo pipefail
          mkdir -p tmp
          cp .github/workflows/deploy-gcp.yml tmp/deploy-gcp.step-limit-patched.yml
          git checkout -- .github/workflows/deploy-gcp.yml
          git diff --check
          git config user.name "TOCA OS Automation"
          git config user.email "actions@github.com"
          git add tmp/deploy-gcp.step-limit-patched.yml test/gcp-workflow-run-length-contract.test.ts test/gcp-production-webhook-internal-probe-contract.test.ts test/gcp-deploy-cloud-run-probes.test.ts test/gcp-production-internal-probe-contract.test.ts test/gcp-production-probe-rollback-contract.test.ts
          git commit -m "chore(ops): stage validated deploy step-limit payload"
          git push origin HEAD:fix/deploy-gcp-run-step-limit-20260826
