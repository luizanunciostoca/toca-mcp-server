name: Instagram Engagement E2E Format Ephemeral

on:
  push:
    branches: [feat/instagram-engagement-e2e-20260828]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/instagram-engagement-e2e-20260828
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format PostgreSQL E2E
        run: pnpm exec prettier --write test/instagram-engagement-postgres-e2e.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/instagram-engagement-postgres-e2e.test.ts
          git commit -m "style(instagram): format engagement PostgreSQL E2E"
          git push origin HEAD:feat/instagram-engagement-e2e-20260828
