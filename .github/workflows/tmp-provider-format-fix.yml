name: Temporary Provider Formatting Fix

on:
  push:
    branches:
      - feat/provider-token-onboarding-20260820

permissions:
  contents: write

jobs:
  format-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: feat/provider-token-onboarding-20260820
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and verify exact branch
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            src/providers/sendgrid/event-webhook-discovery.ts \
            src/providers/whatsapp/whatsapp-asset-discovery.ts \
            test/sendgrid-event-webhook-discovery.test.ts \
            test/google-ads-credential-discovery-client.test.ts \
            src/providers/sendgrid/runtime-config.ts \
            src/providers/google-ads/google-ads-api-client.ts \
            src/omnichannel/whatsapp-http-composition.ts \
            src/http.ts
          pnpm quality
          git config user.name 'TOCA OS Integration'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            src/providers/sendgrid/event-webhook-discovery.ts \
            src/providers/whatsapp/whatsapp-asset-discovery.ts \
            test/sendgrid-event-webhook-discovery.test.ts \
            test/google-ads-credential-discovery-client.test.ts \
            src/providers/sendgrid/runtime-config.ts \
            src/providers/google-ads/google-ads-api-client.ts \
            src/omnichannel/whatsapp-http-composition.ts \
            src/http.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(providers): apply canonical formatting after verification'
            git push origin HEAD:feat/provider-token-onboarding-20260820
          fi
