name: TEMP Demand Intelligence observable three-way recovery

on:
  push:
    branches:
      - recovery/meta-ads-demand-intelligence-auto3way-20260819

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply or record three-way result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TOCA Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main feat/meta-ads-morro-demand-intelligence-20260818
          SOURCE='origin/feat/meta-ads-morro-demand-intelligence-20260818'
          BASE="$(git merge-base origin/main "$SOURCE")"
          test "$BASE" = '7874ef7813f716aea685bef316310501b9f27a30'
          git diff --binary "$BASE" "$SOURCE" -- \
            docs/architecture/meta-ads-morro-demand-intelligence.md \
            migrations/022_meta_ads_geo_demand_intelligence.sql \
            scripts/architecture-check.mjs \
            src/mcp/runtime-capability-resolver.ts \
            src/persistence/postgres-meta-ads-geo-audience-store.ts \
            src/providers/meta-ads/meta-ads-demand-intelligence.ts \
            src/providers/meta-ads/meta-ads-read-provider.ts \
            src/registry.ts \
            src/server.ts \
            test/meta-ads-demand-intelligence.test.ts \
            > /tmp/demand-recovery.patch
          test -s /tmp/demand-recovery.patch

          if git apply --3way --index /tmp/demand-recovery.patch; then
            git diff --cached --check
            git rm .github/workflows/temp-demand-recovery-three-way.yml
            git commit -m 'feat(meta-ads): three-way recover Demand Intelligence bindings'
          else
            git diff --name-only --diff-filter=U | sort -u > /tmp/conflicts.txt || true
            git reset --hard HEAD
            mkdir -p docs/operations
            {
              echo '# Demand Intelligence three-way recovery diagnostic'
              echo
              echo 'Status: CONFLICTS_REQUIRE_MANUAL_RECONCILIATION'
              echo
              echo 'Historical source: feat/meta-ads-morro-demand-intelligence-20260818'
              echo 'Merge base: 7874ef7813f716aea685bef316310501b9f27a30'
              echo 'Current base: abfb09b17e90c83790e803dcda091c8142c7407f'
              echo
              echo 'Conflicting files:'
              sed 's/^/- `/' /tmp/conflicts.txt | sed 's/$/`/'
            } > docs/operations/demand-intelligence-three-way-diagnostic.md
            git rm .github/workflows/temp-demand-recovery-three-way.yml
            git add docs/operations/demand-intelligence-three-way-diagnostic.md
            git commit -m 'docs(recovery): record Demand Intelligence three-way conflicts'
          fi
          git push origin HEAD:recovery/meta-ads-demand-intelligence-auto3way-20260819
