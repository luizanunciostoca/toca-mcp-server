name: M-FOUND-06 Formatter

on:
  push:
    branches:
      - feat/m-found-06-durable-workflows

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only M-FOUND-06 files
        run: |
          pnpm exec prettier --write \
            src/workflow/workflow-contracts.ts \
            src/workflow/in-memory-workflow-store.ts \
            src/persistence/postgres-workflow-store.ts \
            test/durable-workflow.test.ts \
            test/durable-workflow-migration.test.ts \
            docs/checkpoints/m-found-06-durable-workflow-persistence.md
          pnpm format:check
      - name: Commit formatter result and remove temporary workflow
        run: |
          rm .github/workflows/format-m-found-06.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: format M-FOUND-06 durable workflow files"
      - name: Push formatted result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:feat/m-found-06-durable-workflows"
