name: GCP Staging Project Bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/gcp-staging-project-bootstrap.yml'

permissions:
  contents: read
  id-token: write

env:
  CANDIDATE_SHA: 7db1a6e5caf01f98b200257c4aeecc2f1b29550a
  REGION: southamerica-east1
  PROD_PROJECT_ID: toca-mcp-production
  PROD_PROJECT_NUMBER: '990081828836'
  PROD_SQL_INSTANCE: toca-mcp-db
  PROD_DATABASE_SECRET: toca-database-url
  PROD_MCP_SERVICE: toca-mcp-staging
  PROD_WEBHOOK_SERVICE: toca-meta-oauth-staging
  PROD_DEPLOYER_SA: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  PROD_RUNTIME_SA: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  PROD_WIF: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  INFRA_ADMIN_SA: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com
  STAGING_PROJECT_ID: toca-mcp-next-staging
  STAGING_PROJECT_NUMBER: '729069789107'
  STAGING_ARTIFACT_REPOSITORY: toca-mcp-staging
  STAGING_SQL_INSTANCE: toca-mcp-next-staging-db
  STAGING_DATABASE_SECRET: toca-next-staging-database-url
  STAGING_MCP_SERVICE: toca-mcp-next-staging
  STAGING_WEBHOOK_SERVICE: toca-webhook-next-staging
  STAGING_DEPLOYER_SA: toca-next-stg-deployer@toca-mcp-next-staging.iam.gserviceaccount.com
  STAGING_MCP_RUNTIME_SA: toca-next-stg-mcp@toca-mcp-next-staging.iam.gserviceaccount.com
  STAGING_WEBHOOK_RUNTIME_SA: toca-next-stg-webhook@toca-mcp-next-staging.iam.gserviceaccount.com
  STAGING_WIF: projects/729069789107/locations/global/workloadIdentityPools/github-staging/providers/github-toca-mcp-staging
  STAGING_WIF_POOL: github-staging
  STAGING_WIF_PROVIDER: github-toca-mcp-staging
  IMMUTABLE_SUBJECT: repo:luizanunciostoca@318748875/toca-mcp-server@1339919100:environment:staging

jobs:
  staging-wif-proof:
    name: Prove dedicated staging WIF and production denial
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Authenticate through dedicated staging WIF
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.STAGING_WIF }}
          service_account: ${{ env.STAGING_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Prove staging authority and no production mutation authority
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth print-access-token >/dev/null
          test "$(gcloud projects describe "$STAGING_PROJECT_ID" --format='value(projectNumber)')" = "$STAGING_PROJECT_NUMBER"
          gcloud run services describe "$STAGING_MCP_SERVICE" --project="$STAGING_PROJECT_ID" --region="$REGION" >/dev/null
          gcloud run services describe "$STAGING_WEBHOOK_SERVICE" --project="$STAGING_PROJECT_ID" --region="$REGION" >/dev/null
          gcloud sql instances describe "$STAGING_SQL_INSTANCE" --project="$STAGING_PROJECT_ID" >/dev/null

          TOKEN="$(gcloud auth print-access-token)"
          STAGING_BODY='{"permissions":["run.services.get","run.services.update","cloudsql.instances.connect","serviceusage.services.use"]}'
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data "$STAGING_BODY" \
            "https://cloudresourcemanager.googleapis.com/v3/projects/${STAGING_PROJECT_ID}:testIamPermissions" >/tmp/staging-perms.json
          for P in run.services.get run.services.update cloudsql.instances.connect serviceusage.services.use; do
            jq -e --arg p "$P" '(.permissions // []) | index($p) != null' /tmp/staging-perms.json >/dev/null
          done

          PROD_BODY='{"permissions":["run.services.update","cloudsql.instances.update","resourcemanager.projects.setIamPolicy","iam.serviceAccounts.actAs"]}'
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data "$PROD_BODY" \
            "https://cloudresourcemanager.googleapis.com/v3/projects/${PROD_PROJECT_ID}:testIamPermissions" >/tmp/prod-perms.json
          jq -e '(.permissions // []) | length == 0' /tmp/prod-perms.json >/dev/null
          echo 'STAGING_WIF_AUTH=PASS'
          echo 'STAGING_DEPLOYER_STAGING_AUTHORITY=PASS'
          echo 'STAGING_DEPLOYER_PRODUCTION_MUTATION_AUTHORITY=NONE'

  staging-snapshot:
    name: Snapshot isolated staging control plane live
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 15
    outputs:
      snapshot: ${{ steps.snapshot.outputs.snapshot }}
    env:
      DEPLOY_ENVIRONMENT: staging
      GCP_PROJECT_ID: toca-mcp-next-staging
      GCP_PROJECT_NUMBER: '729069789107'
      GCP_REGION: southamerica-east1
      GCP_ARTIFACT_REPOSITORY: toca-mcp-staging
      GCP_CLOUD_SQL_INSTANCE: toca-mcp-next-staging-db
      GCP_CLOUD_RUN_MCP_SERVICE: toca-mcp-next-staging
      GCP_CLOUD_RUN_WEBHOOK_SERVICE: toca-webhook-next-staging
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/729069789107/locations/global/workloadIdentityPools/github-staging/providers/github-toca-mcp-staging
      GCP_DEPLOY_SERVICE_ACCOUNT: toca-next-stg-deployer@toca-mcp-next-staging.iam.gserviceaccount.com
      GCP_MCP_RUNTIME_SERVICE_ACCOUNT: toca-next-stg-mcp@toca-mcp-next-staging.iam.gserviceaccount.com
      GCP_WEBHOOK_RUNTIME_SERVICE_ACCOUNT: toca-next-stg-webhook@toca-mcp-next-staging.iam.gserviceaccount.com
      GCP_DATABASE_URL_SECRET: toca-next-staging-database-url
      GCP_DATABASE_URL_SECRET_VERSION: '1'
      PRODUCTION_GCP_PROJECT_ID: toca-mcp-production
      PRODUCTION_GCP_PROJECT_NUMBER: '990081828836'
      PRODUCTION_GCP_REGION: southamerica-east1
      PRODUCTION_GCP_CLOUD_SQL_INSTANCE: toca-mcp-db
      PRODUCTION_GCP_CLOUD_RUN_MCP_SERVICE: toca-mcp-staging
      PRODUCTION_GCP_CLOUD_RUN_WEBHOOK_SERVICE: toca-meta-oauth-staging
      PRODUCTION_GCP_DATABASE_URL_SECRET: toca-database-url
      PRODUCTION_GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
      PRODUCTION_GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      PRODUCTION_GCP_MCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
      PRODUCTION_GCP_WEBHOOK_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
      STAGING_DATABASE_ISOLATION_MODE: DEDICATED_CLOUD_SQL
      STAGING_PROVIDER_MODE: DISABLED
      META_ENABLED: 'false'
      META_WEBHOOK_ENABLED: 'false'
      INSTAGRAM_READ_ENABLED: 'false'
      META_ADS_READ_ENABLED: 'false'
      META_ADS_WRITE_ENABLED: 'false'
      WHATSAPP_ENABLED: 'false'
      WHATSAPP_RUNTIME_ENABLED: 'false'
      EMAIL_SENDGRID_ENABLED: 'false'
      AG01_MODEL_ENABLED: 'false'
      GOOGLE_ADS_PHASE: OFF
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Enforce canonical fail-closed staging contract
        run: node scripts/validate-gcp-deploy-environment.mjs
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.PROD_WIF }}
          service_account: ${{ env.INFRA_ADMIN_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Read and assert live staging resources
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_JSON="$(gcloud projects describe "$STAGING_PROJECT_ID" --format=json)"
          test "$(printf '%s' "$PROJECT_JSON" | jq -r '.projectNumber|tostring')" = "$STAGING_PROJECT_NUMBER"
          test "$(printf '%s' "$PROJECT_JSON" | jq -r '.parent.id')" = '995529283213'

          ARTIFACT="$(gcloud artifacts repositories describe "$STAGING_ARTIFACT_REPOSITORY" --location="$REGION" --project="$STAGING_PROJECT_ID" --format='value(name)')"
          test "$ARTIFACT" = "projects/$STAGING_PROJECT_ID/locations/$REGION/repositories/$STAGING_ARTIFACT_REPOSITORY"

          SQL_JSON="$(gcloud sql instances describe "$STAGING_SQL_INSTANCE" --project="$STAGING_PROJECT_ID" --format=json)"
          SQL_RESOURCE="$(printf '%s' "$SQL_JSON" | jq -r '.connectionName')"
          test "$SQL_RESOURCE" = "${STAGING_PROJECT_ID}:${REGION}:${STAGING_SQL_INSTANCE}"
          test "$(printf '%s' "$SQL_JSON" | jq -r '(.settings.ipConfiguration.authorizedNetworks // [])|length')" = 0
          test "$(printf '%s' "$SQL_JSON" | jq -r '.settings.ipConfiguration.sslMode')" = ENCRYPTED_ONLY
          test "$(printf '%s' "$SQL_JSON" | jq -r '.settings.backupConfiguration.enabled')" = true
          test "$(printf '%s' "$SQL_JSON" | jq -r '.settings.backupConfiguration.pointInTimeRecoveryEnabled')" = true
          test "$(printf '%s' "$SQL_JSON" | jq -r '.settings.deletionProtectionEnabled')" = true

          SECRET_RESOURCE="$(gcloud secrets describe "$STAGING_DATABASE_SECRET" --project="$STAGING_PROJECT_ID" --format='value(name)')"
          test "$SECRET_RESOURCE" = "projects/$STAGING_PROJECT_NUMBER/secrets/$STAGING_DATABASE_SECRET"
          test -n "$(gcloud secrets versions list "$STAGING_DATABASE_SECRET" --project="$STAGING_PROJECT_ID" --filter='state=ENABLED' --format='value(name)' --limit=1)"

          MCP_JSON="$(gcloud run services describe "$STAGING_MCP_SERVICE" --project="$STAGING_PROJECT_ID" --region="$REGION" --format=json)"
          WEBHOOK_JSON="$(gcloud run services describe "$STAGING_WEBHOOK_SERVICE" --project="$STAGING_PROJECT_ID" --region="$REGION" --format=json)"
          test "$(printf '%s' "$MCP_JSON" | jq -r '.spec.template.spec.serviceAccountName')" = "$STAGING_MCP_RUNTIME_SA"
          test "$(printf '%s' "$WEBHOOK_JSON" | jq -r '.spec.template.spec.serviceAccountName')" = "$STAGING_WEBHOOK_RUNTIME_SA"
          for SERVICE in "$STAGING_MCP_SERVICE" "$STAGING_WEBHOOK_SERVICE"; do
            IAM="$(gcloud run services get-iam-policy "$SERVICE" --project="$STAGING_PROJECT_ID" --region="$REGION" --format=json)"
            if printf '%s' "$IAM" | jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers")' | grep -Fxq true; then
              echo "FAIL: public principal on $SERVICE" >&2; exit 1
            fi
          done
          for JSON in "$MCP_JSON" "$WEBHOOK_JSON"; do
            test "$(printf '%s' "$JSON" | jq -r '[.spec.template.spec.containers[].env[]? | select(.name=="STAGING_PROVIDER_MODE") | .value][0]')" = DISABLED
            test "$(printf '%s' "$JSON" | jq -r '[.. | objects | .secretKeyRef?.name? // empty] | length')" = 0
          done
          MCP_REV="$(printf '%s' "$MCP_JSON" | jq -r '.status.latestReadyRevisionName')"
          WEBHOOK_REV="$(printf '%s' "$WEBHOOK_JSON" | jq -r '.status.latestReadyRevisionName')"
          test -n "$MCP_REV"; test -n "$WEBHOOK_REV"

          CONDITION="assertion.repository_id=='1339919100' && assertion.repository_owner_id=='318748875' && assertion.environment=='staging' && assertion.sub=='${IMMUTABLE_SUBJECT}'"
          WIF_JSON="$(gcloud iam workload-identity-pools providers describe "$STAGING_WIF_PROVIDER" --workload-identity-pool="$STAGING_WIF_POOL" --location=global --project="$STAGING_PROJECT_ID" --format=json)"
          test "$(printf '%s' "$WIF_JSON" | jq -r '.name')" = "$STAGING_WIF"
          test "$(printf '%s' "$WIF_JSON" | jq -r '.attributeCondition')" = "$CONDITION"

          SNAPSHOT="$(jq -nc \
            --arg projectId "$STAGING_PROJECT_ID" --arg projectNumber "$STAGING_PROJECT_NUMBER" \
            --arg artifact "$ARTIFACT" --arg sql "$SQL_RESOURCE" --arg secret "$SECRET_RESOURCE" \
            --arg mcp "$STAGING_MCP_SERVICE" --arg webhook "$STAGING_WEBHOOK_SERVICE" \
            --arg mcpRev "$MCP_REV" --arg webhookRev "$WEBHOOK_REV" --arg wif "$STAGING_WIF" \
            --arg deploySa "$STAGING_DEPLOYER_SA" --arg mcpSa "$STAGING_MCP_RUNTIME_SA" --arg webhookSa "$STAGING_WEBHOOK_RUNTIME_SA" \
            '{projectId:$projectId,projectNumber:$projectNumber,artifact:$artifact,sql:$sql,secret:$secret,mcp:$mcp,webhook:$webhook,mcpRev:$mcpRev,webhookRev:$webhookRev,wif:$wif,deploySa:$deploySa,mcpSa:$mcpSa,webhookSa:$webhookSa}')"
          echo "snapshot=$SNAPSHOT" >> "$GITHUB_OUTPUT"
          echo 'STAGING_LIVE_SNAPSHOT=PASS'

  production-snapshot:
    name: Snapshot production reference live read-only
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    outputs:
      snapshot: ${{ steps.snapshot.outputs.snapshot }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.PROD_WIF }}
          service_account: ${{ env.PROD_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Read production reference without mutation
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud projects describe "$PROD_PROJECT_ID" --format='value(projectNumber)')" = "$PROD_PROJECT_NUMBER"
          SQL_JSON="$(gcloud sql instances describe "$PROD_SQL_INSTANCE" --project="$PROD_PROJECT_ID" --format=json)"
          SQL_RESOURCE="$(printf '%s' "$SQL_JSON" | jq -r '.connectionName')"
          test "$SQL_RESOURCE" = "${PROD_PROJECT_ID}:${REGION}:${PROD_SQL_INSTANCE}"
          gcloud secrets describe "$PROD_DATABASE_SECRET" --project="$PROD_PROJECT_ID" >/dev/null
          MCP_JSON="$(gcloud run services describe "$PROD_MCP_SERVICE" --project="$PROD_PROJECT_ID" --region="$REGION" --format=json)"
          WEBHOOK_JSON="$(gcloud run services describe "$PROD_WEBHOOK_SERVICE" --project="$PROD_PROJECT_ID" --region="$REGION" --format=json)"
          test "$(printf '%s' "$MCP_JSON" | jq -r '.spec.template.spec.serviceAccountName')" = "$PROD_RUNTIME_SA"
          test "$(printf '%s' "$WEBHOOK_JSON" | jq -r '.spec.template.spec.serviceAccountName')" = "$PROD_RUNTIME_SA"
          MCP_REV="$(printf '%s' "$MCP_JSON" | jq -r '.status.latestReadyRevisionName')"
          WEBHOOK_REV="$(printf '%s' "$WEBHOOK_JSON" | jq -r '.status.latestReadyRevisionName')"
          test -n "$MCP_REV"; test -n "$WEBHOOK_REV"
          PROD_ARTIFACTS="$(gcloud artifacts repositories list --project="$PROD_PROJECT_ID" --location="$REGION" --format=json 2>/dev/null || printf '[]')"
          SNAPSHOT="$(PROD_ARTIFACTS="$PROD_ARTIFACTS" jq -nc \
            --arg projectId "$PROD_PROJECT_ID" --arg projectNumber "$PROD_PROJECT_NUMBER" --arg sql "$SQL_RESOURCE" \
            --arg secret "projects/${PROD_PROJECT_NUMBER}/secrets/${PROD_DATABASE_SECRET}" --arg mcp "$PROD_MCP_SERVICE" --arg webhook "$PROD_WEBHOOK_SERVICE" \
            --arg mcpRev "$MCP_REV" --arg webhookRev "$WEBHOOK_REV" --arg wif "$PROD_WIF" --arg deploySa "$PROD_DEPLOYER_SA" --arg runtimeSa "$PROD_RUNTIME_SA" \
            --argjson artifacts "$PROD_ARTIFACTS" \
            '{projectId:$projectId,projectNumber:$projectNumber,artifacts:[$artifacts[]?.name],sql:$sql,secret:$secret,mcp:$mcp,webhook:$webhook,mcpRev:$mcpRev,webhookRev:$webhookRev,wif:$wif,deploySa:$deploySa,mcpSa:$runtimeSa,webhookSa:$runtimeSa}')"
          echo "snapshot=$SNAPSHOT" >> "$GITHUB_OUTPUT"
          echo 'PRODUCTION_REFERENCE_READ_ONLY=PASS'

  platform-ready:
    name: Certify live staging isolation
    needs: [staging-wif-proof, staging-snapshot, production-snapshot]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STAGING_SNAPSHOT: ${{ needs.staging-snapshot.outputs.snapshot }}
      PRODUCTION_SNAPSHOT: ${{ needs.production-snapshot.outputs.snapshot }}
    steps:
      - name: Fail closed on every staging and production collision
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_SNAPSHOT"; test -n "$PRODUCTION_SNAPSHOT"
          S="$STAGING_SNAPSHOT" P="$PRODUCTION_SNAPSHOT" node <<'NODE'
          const s = JSON.parse(process.env.S);
          const p = JSON.parse(process.env.P);
          const pairs = [
            ['projectId', s.projectId, p.projectId], ['projectNumber', s.projectNumber, p.projectNumber],
            ['sql', s.sql, p.sql], ['secret', s.secret, p.secret], ['wif', s.wif, p.wif],
            ['deploySa', s.deploySa, p.deploySa], ['mcpSa', s.mcpSa, p.mcpSa], ['webhookSa', s.webhookSa, p.webhookSa],
            ['mcpRevision', s.mcpRev, p.mcpRev], ['webhookRevision', s.webhookRev, p.webhookRev],
          ];
          for (const [name, a, b] of pairs) {
            if (!a || !b || a === b) throw new Error(`STAGING_PRODUCTION_COLLISION:${name}`);
          }
          for (const ss of [s.mcp, s.webhook]) for (const ps of [p.mcp, p.webhook]) {
            if (!ss || !ps || ss === ps) throw new Error('STAGING_PRODUCTION_COLLISION:cloud-run-service');
          }
          if (!s.artifact || (p.artifacts || []).includes(s.artifact)) throw new Error('STAGING_PRODUCTION_COLLISION:artifact-registry');
          console.log('PLATFORM_READY_FOR_STAGING=YES');
          NODE
          echo 'PLATFORM_READY_FOR_STAGING=YES' >> "$GITHUB_STEP_SUMMARY"
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'STAGING_PROVIDER_MODE=DISABLED' >> "$GITHUB_STEP_SUMMARY"
          echo 'APPLICATION_MIGRATION_EXECUTED=NO' >> "$GITHUB_STEP_SUMMARY"
          echo 'APPLICATION_DEPLOY_EXECUTED=NO' >> "$GITHUB_STEP_SUMMARY"
          echo 'PROVIDER_MUTATION_EXECUTED=NO' >> "$GITHUB_STEP_SUMMARY"
          echo 'PRODUCTION_MUTATION_EXECUTED=NO' >> "$GITHUB_STEP_SUMMARY"
