name: GCP Staging Project Bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/gcp-staging-project-bootstrap.yml'

permissions:
  contents: read
  id-token: write

env:
  CANDIDATE_SHA: 7db1a6e5caf01f98b200257c4aeecc2f1b29550a
  PROD_PROJECT_ID: toca-mcp-production
  PROD_PROJECT_NUMBER: '990081828836'
  PROD_MCP_SERVICE: toca-mcp-staging
  PROD_WEBHOOK_SERVICE: toca-meta-oauth-staging
  STAGING_PROJECT_ID: toca-mcp-next-staging
  STAGING_PROJECT_NUMBER: '729069789107'
  REGION: southamerica-east1
  SQL_INSTANCE: toca-mcp-next-staging-db
  MCP_SERVICE: toca-mcp-next-staging
  WEBHOOK_SERVICE: toca-webhook-next-staging
  MCP_RUNTIME_SA: toca-next-stg-mcp@toca-mcp-next-staging.iam.gserviceaccount.com
  WEBHOOK_RUNTIME_SA: toca-next-stg-webhook@toca-mcp-next-staging.iam.gserviceaccount.com
  PROD_WIF: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  INFRA_ADMIN_SA: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com

jobs:
  bootstrap:
    name: Bootstrap private staging Cloud Run shells
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Authenticate infrastructure administrator
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.PROD_WIF }}
          service_account: ${{ env.INFRA_ADMIN_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Create and verify private staging Cloud Run shells
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(gcloud projects describe "$PROD_PROJECT_ID" --format='value(projectNumber)')" = "$PROD_PROJECT_NUMBER"
          test "$(gcloud projects describe "$STAGING_PROJECT_ID" --format='value(projectNumber)')" = "$STAGING_PROJECT_NUMBER"
          test "$STAGING_PROJECT_NUMBER" != "$PROD_PROJECT_NUMBER"
          test "$MCP_SERVICE" != "$PROD_MCP_SERVICE"
          test "$WEBHOOK_SERVICE" != "$PROD_WEBHOOK_SERVICE"

          CONNECTION_NAME="$(gcloud sql instances describe "$SQL_INSTANCE" --project="$STAGING_PROJECT_ID" --format='value(connectionName)')"
          test "$CONNECTION_NAME" = "${STAGING_PROJECT_ID}:${REGION}:${SQL_INSTANCE}"
          gcloud iam service-accounts describe "$MCP_RUNTIME_SA" --project="$STAGING_PROJECT_ID" >/dev/null
          gcloud iam service-accounts describe "$WEBHOOK_RUNTIME_SA" --project="$STAGING_PROJECT_ID" >/dev/null

          PLACEHOLDER_IMAGE='us-docker.pkg.dev/cloudrun/container/hello:latest'
          COMMON_ENV='TOCA_DEPLOY_ENVIRONMENT=staging,STAGING_PROVIDER_MODE=DISABLED,TOCA_CONTROL_PLANE_SHELL=true'

          gcloud run deploy "$MCP_SERVICE" \
            --project="$STAGING_PROJECT_ID" \
            --region="$REGION" \
            --image="$PLACEHOLDER_IMAGE" \
            --service-account="$MCP_RUNTIME_SA" \
            --add-cloudsql-instances="$CONNECTION_NAME" \
            --set-env-vars="$COMMON_ENV" \
            --labels='environment=staging,system=toca-mcp,role=mcp-shell' \
            --ingress=all \
            --no-allow-unauthenticated \
            --min-instances=0 \
            --max-instances=1 \
            --quiet

          gcloud run deploy "$WEBHOOK_SERVICE" \
            --project="$STAGING_PROJECT_ID" \
            --region="$REGION" \
            --image="$PLACEHOLDER_IMAGE" \
            --service-account="$WEBHOOK_RUNTIME_SA" \
            --add-cloudsql-instances="$CONNECTION_NAME" \
            --set-env-vars="$COMMON_ENV" \
            --labels='environment=staging,system=toca-mcp,role=webhook-shell' \
            --ingress=all \
            --no-allow-unauthenticated \
            --min-instances=0 \
            --max-instances=1 \
            --quiet

          for SPEC in "$MCP_SERVICE|$MCP_RUNTIME_SA" "$WEBHOOK_SERVICE|$WEBHOOK_RUNTIME_SA"; do
            SERVICE="${SPEC%%|*}"
            EXPECTED_SA="${SPEC#*|}"
            JSON="$(gcloud run services describe "$SERVICE" --project="$STAGING_PROJECT_ID" --region="$REGION" --format=json)"
            test "$(printf '%s' "$JSON" | jq -r '.metadata.labels.environment')" = staging
            test "$(printf '%s' "$JSON" | jq -r '.spec.template.spec.serviceAccountName')" = "$EXPECTED_SA"
            test "$(printf '%s' "$JSON" | jq -r '.spec.template.metadata.annotations["run.googleapis.com/cloudsql-instances"]')" = "$CONNECTION_NAME"
            test "$(printf '%s' "$JSON" | jq -r '.metadata.annotations["run.googleapis.com/ingress"]')" = all
            IAM="$(gcloud run services get-iam-policy "$SERVICE" --project="$STAGING_PROJECT_ID" --region="$REGION" --format=json)"
            if printf '%s' "$IAM" | jq -e '.bindings[]? | (.members // []) | index("allUsers")' >/dev/null; then
              echo "FAIL: $SERVICE is publicly invokable" >&2
              exit 1
            fi
            URL="$(printf '%s' "$JSON" | jq -r '.status.url')"
            test -n "$URL"
            echo "${SERVICE}_URL=$URL"
          done

          echo 'STAGING_MCP_SERVICE_IDENTITY=PASS'
          echo 'STAGING_WEBHOOK_SERVICE_IDENTITY=PASS'
          echo 'STAGING_CLOUD_RUN_PRIVATE=PASS'
          echo 'STAGING_PROVIDER_MODE=DISABLED'
          echo 'APPLICATION_MIGRATION_EXECUTED=NO'
          echo 'APPLICATION_DEPLOY_EXECUTED=NO'
          echo 'PROVIDER_MUTATION_EXECUTED=NO'
