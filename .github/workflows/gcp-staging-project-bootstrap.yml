name: GCP Staging Project Bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/gcp-staging-project-bootstrap.yml'

permissions:
  contents: read
  id-token: write

env:
  CANDIDATE_SHA: 7db1a6e5caf01f98b200257c4aeecc2f1b29550a
  STAGING_PROJECT_ID: toca-mcp-next-staging
  STAGING_PROJECT_NUMBER: '729069789107'
  REGION: southamerica-east1
  STAGING_MCP_SERVICE: toca-mcp-next-staging
  FAILED_MCP_REVISION: toca-mcp-next-staging-mcp-7db1a6e-46
  STAGING_DEPLOYER_SA: toca-next-stg-deployer@toca-mcp-next-staging.iam.gserviceaccount.com
  STAGING_WIF: projects/729069789107/locations/global/workloadIdentityPools/github-staging/providers/github-toca-mcp-staging
  PROD_WIF: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  INFRA_ADMIN_SA: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com
  PROD_PROJECT_ID: toca-mcp-production
  PROD_PROJECT_NUMBER: '990081828836'

jobs:
  grant-log-viewer:
    name: Grant transient staging log viewer only
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Assert isolated staging boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$STAGING_PROJECT_ID" != "$PROD_PROJECT_ID"
          test "$STAGING_PROJECT_NUMBER" != "$PROD_PROJECT_NUMBER"
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.PROD_WIF }}
          service_account: ${{ env.INFRA_ADMIN_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Grant Logging Viewer in staging only
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud projects describe "$STAGING_PROJECT_ID" --format='value(projectNumber)')" = "$STAGING_PROJECT_NUMBER"
          gcloud projects add-iam-policy-binding "$STAGING_PROJECT_ID" \
            --member="serviceAccount:$STAGING_DEPLOYER_SA" \
            --role=roles/logging.viewer --condition=None --quiet >/dev/null
          echo 'TRANSIENT_STAGING_LOG_VIEWER_GRANTED=YES'
          echo 'PRODUCTION_MUTATION_EXECUTED=NO'

  diagnose:
    name: Read failed candidate revision logs
    needs: grant-log-viewer
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.STAGING_WIF }}
          service_account: ${{ env.STAGING_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Read revision logs and prove zero candidate traffic
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_JSON="$(gcloud run services describe "$STAGING_MCP_SERVICE" --project="$STAGING_PROJECT_ID" --region="$REGION" --format=json)"
          test "$(printf '%s' "$SERVICE_JSON" | jq -r --arg rev "$FAILED_MCP_REVISION" '[.status.traffic[]? | select(.revisionName==$rev and (.percent // 0) > 0)] | length')" = 0
          echo 'FAILED_REVISION_TRAFFIC_PERCENT=0'
          FILTER="resource.type=cloud_run_revision AND resource.labels.service_name=${STAGING_MCP_SERVICE} AND resource.labels.revision_name=${FAILED_MCP_REVISION}"
          gcloud logging read "$FILTER" --project="$STAGING_PROJECT_ID" --limit=200 --order=asc \
            --format='value(timestamp,severity,textPayload,jsonPayload.message)'
          echo 'FAILED_REVISION_LOG_READ=PASS'
          echo 'APPLICATION_MIGRATION_EXECUTED=NO'
          echo 'APPLICATION_DEPLOY_EXECUTED=NO'
          echo 'PROVIDER_MUTATION_EXECUTED=NO'
          echo 'PRODUCTION_MUTATION_EXECUTED=NO'

  revoke-log-viewer:
    name: Revoke transient staging log viewer
    if: always()
    needs: diagnose
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.PROD_WIF }}
          service_account: ${{ env.INFRA_ADMIN_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Revoke Logging Viewer from staging deployer
        shell: bash
        run: |
          set -euo pipefail
          gcloud projects remove-iam-policy-binding "$STAGING_PROJECT_ID" \
            --member="serviceAccount:$STAGING_DEPLOYER_SA" \
            --role=roles/logging.viewer --condition=None --quiet >/dev/null || true
          echo 'TRANSIENT_STAGING_LOG_VIEWER_REVOKED=YES'
          echo 'PRODUCTION_MUTATION_EXECUTED=NO'
