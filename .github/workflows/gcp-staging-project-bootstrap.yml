name: GCP Staging Project Bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/gcp-staging-project-bootstrap.yml'

permissions:
  contents: read
  id-token: write

env:
  CANDIDATE_SHA: 7db1a6e5caf01f98b200257c4aeecc2f1b29550a
  STAGING_PROJECT_ID: toca-mcp-next-staging
  STAGING_PROJECT_NUMBER: '729069789107'
  REGION: southamerica-east1
  STAGING_SQL_INSTANCE: toca-mcp-next-staging-db
  STAGING_DATABASE_SECRET: toca-next-staging-database-url
  STAGING_DATABASE_SECRET_VERSION: '1'
  STAGING_DEPLOYER_SA: toca-next-stg-deployer@toca-mcp-next-staging.iam.gserviceaccount.com
  STAGING_WIF: projects/729069789107/locations/global/workloadIdentityPools/github-staging/providers/github-toca-mcp-staging
  PROD_PROJECT_ID: toca-mcp-production
  PROD_PROJECT_NUMBER: '990081828836'

jobs:
  outbox-readback:
    name: Read isolated staging outbox blocker only
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Assert exact candidate and isolated boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$STAGING_PROJECT_ID" != "$PROD_PROJECT_ID"
          test "$STAGING_PROJECT_NUMBER" != "$PROD_PROJECT_NUMBER"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install exact frozen dependencies
        run: pnpm install --frozen-lockfile
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.STAGING_WIF }}
          service_account: ${{ env.STAGING_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Start checksum-pinned Cloud SQL Auth Proxy
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud projects describe "$STAGING_PROJECT_ID" --format='value(projectNumber)')" = "$STAGING_PROJECT_NUMBER"
          CONNECTION_NAME="$(gcloud sql instances describe "$STAGING_SQL_INSTANCE" --project="$STAGING_PROJECT_ID" --format='value(connectionName)')"
          test "$CONNECTION_NAME" = "${STAGING_PROJECT_ID}:${REGION}:${STAGING_SQL_INSTANCE}"
          PROXY_VERSION='2.24.1'
          PROXY_SHA256='fae2766aac9d614a2bdef2f2a7778f3d054f3acd5ff07a81a9e300bd471512eb'
          curl --fail --silent --show-error --location \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v${PROXY_VERSION}/cloud-sql-proxy.linux.amd64" \
            --output /tmp/cloud-sql-proxy
          echo "${PROXY_SHA256}  /tmp/cloud-sql-proxy" | sha256sum --check --strict
          chmod 0755 /tmp/cloud-sql-proxy
          /tmp/cloud-sql-proxy --address 127.0.0.1 --port 5432 "$CONNECTION_NAME" >/tmp/proxy.log 2>&1 &
          echo "PROXY_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if (echo >/dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then
              echo 'OUTBOX_DIAGNOSTIC_PROXY_READY=PASS'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/proxy.log >&2
          exit 1
      - name: Prove candidate SQL behavior and read outbox facts without payload access
        shell: bash
        run: |
          set -euo pipefail
          RAW_DATABASE_URL="$(gcloud secrets versions access "$STAGING_DATABASE_SECRET_VERSION" --secret="$STAGING_DATABASE_SECRET" --project="$STAGING_PROJECT_ID")"
          export DATABASE_URL="$(RAW_DATABASE_URL="$RAW_DATABASE_URL" node --input-type=module -e '
            const url = new URL(process.env.RAW_DATABASE_URL);
            url.hostname = "127.0.0.1";
            url.port = "5432";
            for (const key of ["host","port","ssl","sslmode","sslcert","sslkey","sslrootcert","sslaccept"]) url.searchParams.delete(key);
            process.stdout.write(url.toString());
          ')"
          unset RAW_DATABASE_URL
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL, ssl: false });
          try {
            try {
              await pool.query(`
                select
                  coalesce(
                    extract(epoch from (now() - min(available_at)))
                      filter (where status in ('PENDING', 'FAILED_RETRYABLE')),
                    0
                  ) as oldest_pending_age_seconds,
                  count(*) filter (where status = 'DEAD_LETTER') as dead_letter_count
                from event_outbox
              `);
              console.log('CANDIDATE_OUTBOX_SQL=PASS');
            } catch (error) {
              console.log('CANDIDATE_OUTBOX_SQL=FAIL');
              console.log('CANDIDATE_OUTBOX_SQLSTATE=' + String(error.code ?? 'UNKNOWN'));
              console.log('CANDIDATE_OUTBOX_SQL_MESSAGE=' + String(error.message ?? error));
            }

            const summary = await pool.query(`
              select
                count(*)::int as total,
                count(*) filter (where status = 'PENDING')::int as pending,
                count(*) filter (where status = 'FAILED_RETRYABLE')::int as failed_retryable,
                count(*) filter (where status = 'CLAIMED')::int as claimed,
                count(*) filter (where status = 'DELIVERED')::int as delivered,
                count(*) filter (where status = 'DEAD_LETTER')::int as dead_letter,
                coalesce(
                  round(
                    extract(epoch from (
                      now() - (min(available_at) filter (where status in ('PENDING','FAILED_RETRYABLE')))
                    ))
                  ),
                  0
                )::bigint as oldest_pending_age_seconds
              from event_outbox
            `);
            console.log('CORRECTED_OUTBOX_SQL=PASS');
            console.log('OUTBOX_SUMMARY=' + JSON.stringify(summary.rows[0]));

            const blocked = await pool.query(`
              select event_type, status, attempts, max_attempts, last_error_code,
                     round(extract(epoch from (now() - available_at)))::bigint as age_seconds
                from event_outbox
               where status in ('PENDING','FAILED_RETRYABLE','DEAD_LETTER')
               order by available_at asc
               limit 20
            `);
            console.log('OUTBOX_BLOCKING_ROWS=' + JSON.stringify(blocked.rows));
          } finally {
            await pool.end();
          }
          NODE
          unset DATABASE_URL
          echo 'OUTBOX_READINESS_FACTS_READ_ONLY=PASS'
          echo 'APPLICATION_MIGRATION_EXECUTED=NO'
          echo 'APPLICATION_DEPLOY_EXECUTED=NO'
          echo 'PROVIDER_MUTATION_EXECUTED=NO'
          echo 'PRODUCTION_MUTATION_EXECUTED=NO'
      - name: Stop Cloud SQL Auth Proxy
        if: always()
        shell: bash
        run: |
          if [[ -n "${PROXY_PID:-}" ]] && kill -0 "$PROXY_PID" 2>/dev/null; then
            kill "$PROXY_PID" || true
          fi
