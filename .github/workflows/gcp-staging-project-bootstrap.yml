name: GCP Staging Candidate Readiness Proof

on:
  pull_request:
    paths:
      - '.github/workflows/gcp-staging-project-bootstrap.yml'

permissions:
  contents: read
  id-token: write

env:
  CANDIDATE_SHA: 75c165a044c6e79e9545328dd04a2a3e73d2e910
  STAGING_PROJECT_ID: toca-mcp-next-staging
  STAGING_PROJECT_NUMBER: '729069789107'
  REGION: southamerica-east1
  STAGING_SQL_INSTANCE: toca-mcp-next-staging-db
  STAGING_DATABASE_SECRET: toca-next-staging-database-url
  STAGING_DATABASE_SECRET_VERSION: '1'
  STAGING_DEPLOYER_SA: toca-next-stg-deployer@toca-mcp-next-staging.iam.gserviceaccount.com
  STAGING_WIF: projects/729069789107/locations/global/workloadIdentityPools/github-staging/providers/github-toca-mcp-staging
  PROD_PROJECT_ID: toca-mcp-production
  PROD_PROJECT_NUMBER: '990081828836'

jobs:
  exact-readiness:
    name: Exact final main candidate readiness through isolated staging DB
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Assert exact candidate and isolated boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = '2b373b1564e495d81a73ca04254efec18c0e774c'
          test "$STAGING_PROJECT_ID" != "$PROD_PROJECT_ID"
          test "$STAGING_PROJECT_NUMBER" != "$PROD_PROJECT_NUMBER"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Build exact final candidate
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.STAGING_WIF }}
          service_account: ${{ env.STAGING_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Start checksum-pinned Cloud SQL Auth Proxy
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud projects describe "$STAGING_PROJECT_ID" --format='value(projectNumber)')" = "$STAGING_PROJECT_NUMBER"
          CONNECTION_NAME="$(gcloud sql instances describe "$STAGING_SQL_INSTANCE" --project="$STAGING_PROJECT_ID" --format='value(connectionName)')"
          test "$CONNECTION_NAME" = "${STAGING_PROJECT_ID}:${REGION}:${STAGING_SQL_INSTANCE}"
          PROXY_VERSION='2.24.1'
          PROXY_SHA256='fae2766aac9d614a2bdef2f2a7778f3d054f3acd5ff07a81a9e300bd471512eb'
          curl --fail --silent --show-error --location \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v${PROXY_VERSION}/cloud-sql-proxy.linux.amd64" \
            --output /tmp/cloud-sql-proxy
          echo "${PROXY_SHA256}  /tmp/cloud-sql-proxy" | sha256sum --check --strict
          chmod 0755 /tmp/cloud-sql-proxy
          /tmp/cloud-sql-proxy --address 127.0.0.1 --port 5432 "$CONNECTION_NAME" >/tmp/proxy.log 2>&1 &
          echo "PROXY_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if (echo >/dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then
              echo 'READINESS_PROXY_READY=PASS'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/proxy.log >&2
          exit 1
      - name: Run exact final candidate readiness against staging DB
        shell: bash
        run: |
          set -euo pipefail
          RAW_DATABASE_URL="$(gcloud secrets versions access "$STAGING_DATABASE_SECRET_VERSION" --secret="$STAGING_DATABASE_SECRET" --project="$STAGING_PROJECT_ID")"
          export DATABASE_URL="$(RAW_DATABASE_URL="$RAW_DATABASE_URL" node --input-type=module -e '
            const url = new URL(process.env.RAW_DATABASE_URL);
            url.hostname = "127.0.0.1";
            url.port = "5432";
            for (const key of ["host","port","ssl","sslmode","sslcert","sslkey","sslrootcert","sslaccept"]) url.searchParams.delete(key);
            process.stdout.write(url.toString());
          ')"
          unset RAW_DATABASE_URL
          export DATABASE_SSL=false
          export NODE_ENV=production
          export MCP_PORT=18080
          export TOCA_DEPLOY_ENVIRONMENT=staging
          export TOCA_RELEASE_SHA="$CANDIDATE_SHA"
          export TOCA_PLATFORM_KILL_SWITCH=false
          export TOCA_DEFAULT_TENANT_ID=toca
          export TOCA_DEFAULT_WORKSPACE_ID=toca
          export TOCA_DEFAULT_ORGANIZATION_ID=toca
          export STAGING_PROVIDER_MODE=DISABLED
          export META_ENABLED=false META_PROVIDER_VERIFIED=false META_WEBHOOK_ENABLED=false META_WEBHOOK_PERSISTENCE_ENABLED=false
          export INSTAGRAM_READ_ENABLED=false META_ADS_READ_ENABLED=false META_ADS_WRITE_ENABLED=false
          export WHATSAPP_ENABLED=false WHATSAPP_RUNTIME_ENABLED=false WHATSAPP_PROVIDER_VERIFIED=false
          export EMAIL_SENDGRID_ENABLED=false EMAIL_SENDGRID_PROVIDER_VERIFIED=false
          export GOOGLE_ADS_PHASE=OFF GOOGLE_ADS_PROVIDER_VERIFIED=false
          export AG01_MODEL_ENABLED=false AG01_MODEL_PROVIDER_VERIFIED=false
          export GCP_PROJECT_ID="$STAGING_PROJECT_ID"
          export MCP_ENABLED=true TOCA_SERVICE_ROLE=mcp
          node dist/src/http.js >/tmp/candidate.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
            if [[ -n "${PROXY_PID:-}" ]]; then kill "$PROXY_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18080/healthz >/tmp/health.json; then break; fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then cat /tmp/candidate.log >&2; exit 1; fi
            sleep 1
          done
          HEALTH_CODE="$(curl --silent --max-time 5 --output /tmp/health.json --write-out '%{http_code}' http://127.0.0.1:18080/healthz)"
          READY_CODE="$(curl --silent --max-time 15 --output /tmp/ready.json --write-out '%{http_code}' http://127.0.0.1:18080/readyz)"
          echo "LOCAL_HEALTH_HTTP=$HEALTH_CODE"
          cat /tmp/health.json; echo
          echo "LOCAL_READY_HTTP=$READY_CODE"
          cat /tmp/ready.json; echo
          echo 'LOCAL_FAILED_CHECKS='
          jq -r '.checks[]? | select(.ok==false) | .name' /tmp/ready.json || true
          test "$HEALTH_CODE" = 200
          test "$READY_CODE" = 200
          jq -e '.status == "ready"' /tmp/ready.json >/dev/null
          jq -e '[.checks[]? | select(.ok==false)] | length == 0' /tmp/ready.json >/dev/null
          echo 'LOCAL_EXACT_FINAL_CANDIDATE_READINESS=PASS'
          echo 'STAGING_PROVIDER_MODE=DISABLED'
          echo 'APPLICATION_MIGRATION_EXECUTED=NO'
          echo 'APPLICATION_DEPLOY_EXECUTED=NO'
          echo 'PROVIDER_MUTATION_EXECUTED=NO'
          echo 'PRODUCTION_MUTATION_EXECUTED=NO'
      - name: Stop Cloud SQL Auth Proxy
        if: always()
        shell: bash
        run: |
          if [[ -n "${PROXY_PID:-}" ]] && kill -0 "$PROXY_PID" 2>/dev/null; then
            kill "$PROXY_PID" || true
          fi
