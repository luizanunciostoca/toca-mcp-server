name: GCP Staging Project Bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/gcp-staging-project-bootstrap.yml'

permissions:
  contents: read
  id-token: write

env:
  CANDIDATE_SHA: 7db1a6e5caf01f98b200257c4aeecc2f1b29550a
  PROD_PROJECT_ID: toca-mcp-production
  PROD_PROJECT_NUMBER: '990081828836'
  STAGING_PROJECT_ID: toca-mcp-next-staging
  STAGING_PROJECT_NUMBER: '729069789107'
  BILLING_ACCOUNT: 017F93-60A594-4271D6
  REGION: southamerica-east1
  ARTIFACT_REPOSITORY: toca-mcp-staging
  DEPLOYER_ACCOUNT_ID: toca-next-stg-deployer
  MCP_RUNTIME_ACCOUNT_ID: toca-next-stg-mcp
  WEBHOOK_RUNTIME_ACCOUNT_ID: toca-next-stg-webhook
  WIF_POOL: github-staging
  WIF_PROVIDER: github-toca-mcp-staging
  PROD_WIF: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  INFRA_ADMIN_SA: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com

jobs:
  bootstrap:
    name: Bootstrap staging identities and federation
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Authenticate infrastructure administrator
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.PROD_WIF }}
          service_account: ${{ env.INFRA_ADMIN_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Bootstrap staging-only identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(gcloud projects describe "$PROD_PROJECT_ID" --format='value(projectNumber)')" = "$PROD_PROJECT_NUMBER"
          test "$(gcloud projects describe "$STAGING_PROJECT_ID" --format='value(projectNumber)')" = "$STAGING_PROJECT_NUMBER"
          test "$STAGING_PROJECT_NUMBER" != "$PROD_PROJECT_NUMBER"
          test "$(gcloud billing projects describe "$STAGING_PROJECT_ID" --format='value(billingAccountName)' | sed 's#^billingAccounts/##')" = "$BILLING_ACCOUNT"

          gcloud services enable run.googleapis.com artifactregistry.googleapis.com sqladmin.googleapis.com secretmanager.googleapis.com iam.googleapis.com iamcredentials.googleapis.com sts.googleapis.com monitoring.googleapis.com logging.googleapis.com --project="$STAGING_PROJECT_ID" --quiet

          if ! gcloud artifacts repositories describe "$ARTIFACT_REPOSITORY" --location="$REGION" --project="$STAGING_PROJECT_ID" >/dev/null 2>&1; then
            gcloud artifacts repositories create "$ARTIFACT_REPOSITORY" --repository-format=docker --location="$REGION" --description='TOCA MCP isolated staging images' --project="$STAGING_PROJECT_ID" --quiet
          fi

          for ACCOUNT_ID in "$DEPLOYER_ACCOUNT_ID" "$MCP_RUNTIME_ACCOUNT_ID" "$WEBHOOK_RUNTIME_ACCOUNT_ID"; do
            SA_EMAIL="${ACCOUNT_ID}@${STAGING_PROJECT_ID}.iam.gserviceaccount.com"
            if ! gcloud iam service-accounts describe "$SA_EMAIL" --project="$STAGING_PROJECT_ID" >/dev/null 2>&1; then
              gcloud iam service-accounts create "$ACCOUNT_ID" --project="$STAGING_PROJECT_ID" --display-name="$ACCOUNT_ID" --quiet
            fi
          done

          DEPLOYER_SA="${DEPLOYER_ACCOUNT_ID}@${STAGING_PROJECT_ID}.iam.gserviceaccount.com"
          MCP_RUNTIME_SA="${MCP_RUNTIME_ACCOUNT_ID}@${STAGING_PROJECT_ID}.iam.gserviceaccount.com"
          WEBHOOK_RUNTIME_SA="${WEBHOOK_RUNTIME_ACCOUNT_ID}@${STAGING_PROJECT_ID}.iam.gserviceaccount.com"
          for ROLE in roles/run.admin roles/artifactregistry.writer roles/cloudsql.client roles/serviceusage.serviceUsageConsumer; do
            gcloud projects add-iam-policy-binding "$STAGING_PROJECT_ID" --member="serviceAccount:$DEPLOYER_SA" --role="$ROLE" --condition=None --quiet >/dev/null
          done
          for RUNTIME_SA in "$MCP_RUNTIME_SA" "$WEBHOOK_RUNTIME_SA"; do
            gcloud projects add-iam-policy-binding "$STAGING_PROJECT_ID" --member="serviceAccount:$RUNTIME_SA" --role=roles/cloudsql.client --condition=None --quiet >/dev/null
            gcloud iam service-accounts add-iam-policy-binding "$RUNTIME_SA" --project="$STAGING_PROJECT_ID" --member="serviceAccount:$DEPLOYER_SA" --role=roles/iam.serviceAccountUser --condition=None --quiet >/dev/null
          done

          if ! gcloud iam workload-identity-pools describe "$WIF_POOL" --location=global --project="$STAGING_PROJECT_ID" >/dev/null 2>&1; then
            gcloud iam workload-identity-pools create "$WIF_POOL" --location=global --project="$STAGING_PROJECT_ID" --display-name='GitHub staging only' --quiet
          fi
          if ! gcloud iam workload-identity-pools providers describe "$WIF_PROVIDER" --workload-identity-pool="$WIF_POOL" --location=global --project="$STAGING_PROJECT_ID" >/dev/null 2>&1; then
            gcloud iam workload-identity-pools providers create-oidc "$WIF_PROVIDER" --workload-identity-pool="$WIF_POOL" --location=global --project="$STAGING_PROJECT_ID" --display-name='GitHub TOCA MCP staging' --issuer-uri='https://token.actions.githubusercontent.com' --attribute-mapping='google.subject=assertion.sub,attribute.repository_id=assertion.repository_id,attribute.repository_owner_id=assertion.repository_owner_id' --attribute-condition="assertion.repository_id=='1339919100' && assertion.repository_owner_id=='318748875' && assertion.sub=='repo:luizanunciostoca/toca-mcp-server:environment:staging'" --quiet
          fi
          PRINCIPAL="principal://iam.googleapis.com/projects/${STAGING_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${WIF_POOL}/subject/repo:luizanunciostoca/toca-mcp-server:environment:staging"
          gcloud iam service-accounts add-iam-policy-binding "$DEPLOYER_SA" --project="$STAGING_PROJECT_ID" --member="$PRINCIPAL" --role=roles/iam.workloadIdentityUser --condition=None --quiet >/dev/null

          PROVIDER_NAME="$(gcloud iam workload-identity-pools providers describe "$WIF_PROVIDER" --workload-identity-pool="$WIF_POOL" --location=global --project="$STAGING_PROJECT_ID" --format='value(name)')"
          test "$PROVIDER_NAME" = "projects/$STAGING_PROJECT_NUMBER/locations/global/workloadIdentityPools/$WIF_POOL/providers/$WIF_PROVIDER"
          POLICY="$(gcloud projects get-iam-policy "$STAGING_PROJECT_ID" --format=json)"
          if printf '%s' "$POLICY" | jq -e --arg member "serviceAccount:${INFRA_ADMIN_SA}" '.bindings[] | select((.role=="roles/owner" or .role=="roles/editor") and (.members // [] | index($member)))' >/dev/null; then
            echo 'FAIL: infra-admin has forbidden Owner/Editor in staging' >&2; exit 1
          fi

          echo "STAGING_WIF_PROVIDER=$PROVIDER_NAME"
          echo "STAGING_DEPLOYER_SA=$DEPLOYER_SA"
          echo "STAGING_MCP_RUNTIME_SA=$MCP_RUNTIME_SA"
          echo "STAGING_WEBHOOK_RUNTIME_SA=$WEBHOOK_RUNTIME_SA"
          echo 'STAGING_IDENTITIES_AND_WIF=PASS'
          echo 'APPLICATION_MIGRATION_EXECUTED=NO'
          echo 'APPLICATION_DEPLOY_EXECUTED=NO'
          echo 'PROVIDER_MUTATION_EXECUTED=NO'
