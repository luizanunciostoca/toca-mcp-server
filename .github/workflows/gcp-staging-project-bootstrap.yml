name: GCP Staging Project Bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/gcp-staging-project-bootstrap.yml'

permissions:
  contents: read
  id-token: write

env:
  CANDIDATE_SHA: 7db1a6e5caf01f98b200257c4aeecc2f1b29550a

jobs:
  oidc-claims:
    name: Discover staging GitHub OIDC claims read-only
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Assert exact frozen candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Request and decode selected OIDC claims only
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=staging-claim-discovery")"
          TOKEN="$(printf '%s' "$RESPONSE" | jq -r '.value')"
          test -n "$TOKEN"
          PAYLOAD="$(printf '%s' "$TOKEN" | cut -d. -f2)"
          OIDC_PAYLOAD="$PAYLOAD" python3 - <<'PY'
          import base64, json, os
          raw = os.environ['OIDC_PAYLOAD']
          raw += '=' * ((4 - len(raw) % 4) % 4)
          claims = json.loads(base64.urlsafe_b64decode(raw.encode()))
          selected = {k: claims.get(k) for k in [
              'iss','aud','sub','repository','repository_id','repository_owner',
              'repository_owner_id','environment','event_name','ref','ref_type',
              'workflow_ref','workflow_sha','job_workflow_ref'
          ]}
          print(json.dumps(selected, sort_keys=True))
          assert selected['repository_id'] == '1339919100'
          assert selected['repository_owner_id'] == '318748875'
          assert selected['environment'] == 'staging'
          PY
          unset TOKEN PAYLOAD RESPONSE
          echo 'STAGING_OIDC_CLAIMS_DISCOVERY=PASS'
          echo 'RAW_OIDC_TOKEN_EXPOSED=NO'
          echo 'GCP_MUTATION_EXECUTED=NO'
