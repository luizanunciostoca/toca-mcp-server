name: GCP Staging Project Bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/gcp-staging-project-bootstrap.yml'

permissions:
  contents: read
  id-token: write

env:
  CANDIDATE_SHA: 7db1a6e5caf01f98b200257c4aeecc2f1b29550a
  PROD_PROJECT_ID: toca-mcp-production
  PROD_PROJECT_NUMBER: '990081828836'
  PROD_WIF_POOL: github
  PROD_WIF_PROVIDER: github-toca-mcp
  PROD_WIF: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  INFRA_ADMIN_SA: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com
  STAGING_PROJECT_ID: toca-mcp-next-staging
  STAGING_PROJECT_NUMBER: '729069789107'
  STAGING_WIF_POOL: github-staging
  STAGING_WIF_PROVIDER: github-toca-mcp-staging

jobs:
  inspect-wif:
    name: Inspect production and staging WIF mappings read-only
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Authenticate infrastructure administrator
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.PROD_WIF }}
          service_account: ${{ env.INFRA_ADMIN_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Read provider mappings and conditions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo 'PRODUCTION_WIF_BEGIN'
          gcloud iam workload-identity-pools providers describe "$PROD_WIF_PROVIDER" \
            --workload-identity-pool="$PROD_WIF_POOL" \
            --location=global \
            --project="$PROD_PROJECT_ID" \
            --format='json(name,attributeMapping,attributeCondition,oidc.issuerUri,state)'
          echo 'PRODUCTION_WIF_END'
          echo 'STAGING_WIF_BEGIN'
          gcloud iam workload-identity-pools providers describe "$STAGING_WIF_PROVIDER" \
            --workload-identity-pool="$STAGING_WIF_POOL" \
            --location=global \
            --project="$STAGING_PROJECT_ID" \
            --format='json(name,attributeMapping,attributeCondition,oidc.issuerUri,state)'
          echo 'STAGING_WIF_END'
          echo 'WIF_MAPPING_DIAGNOSTIC_READ_ONLY=PASS'
          echo 'APPLICATION_MIGRATION_EXECUTED=NO'
          echo 'APPLICATION_DEPLOY_EXECUTED=NO'
          echo 'PROVIDER_MUTATION_EXECUTED=NO'
