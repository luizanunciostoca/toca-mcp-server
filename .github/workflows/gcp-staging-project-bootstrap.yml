name: GCP Staging Project Bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/gcp-staging-project-bootstrap.yml'

permissions:
  contents: read
  id-token: write

env:
  CANDIDATE_SHA: 7db1a6e5caf01f98b200257c4aeecc2f1b29550a
  PLATFORM_READINESS_RUN: '32509071007'
  PLATFORM_READY_FOR_STAGING: 'YES'
  REGION: southamerica-east1
  PROD_PROJECT_ID: toca-mcp-production
  PROD_PROJECT_NUMBER: '990081828836'
  STAGING_PROJECT_ID: toca-mcp-next-staging
  STAGING_PROJECT_NUMBER: '729069789107'
  STAGING_ARTIFACT_REPOSITORY: toca-mcp-staging
  STAGING_SQL_INSTANCE: toca-mcp-next-staging-db
  STAGING_DATABASE_SECRET: toca-next-staging-database-url
  STAGING_DATABASE_SECRET_VERSION: '1'
  STAGING_MCP_SERVICE: toca-mcp-next-staging
  STAGING_WEBHOOK_SERVICE: toca-webhook-next-staging
  STAGING_DEPLOYER_SA: toca-next-stg-deployer@toca-mcp-next-staging.iam.gserviceaccount.com
  STAGING_MCP_RUNTIME_SA: toca-next-stg-mcp@toca-mcp-next-staging.iam.gserviceaccount.com
  STAGING_WEBHOOK_RUNTIME_SA: toca-next-stg-webhook@toca-mcp-next-staging.iam.gserviceaccount.com
  STAGING_WIF: projects/729069789107/locations/global/workloadIdentityPools/github-staging/providers/github-toca-mcp-staging
  PROD_WIF: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  INFRA_ADMIN_SA: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com

jobs:
  authorize-smoke:
    name: Grant staging deployer authenticated smoke invocation only
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Assert immutable staging boundary and readiness evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$PLATFORM_READY_FOR_STAGING" = YES
          test "$PLATFORM_READINESS_RUN" = 32509071007
          test "$STAGING_PROJECT_ID" != "$PROD_PROJECT_ID"
          test "$STAGING_PROJECT_NUMBER" != "$PROD_PROJECT_NUMBER"
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.PROD_WIF }}
          service_account: ${{ env.INFRA_ADMIN_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Grant run.invoker in staging only
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud projects describe "$STAGING_PROJECT_ID" --format='value(projectNumber)')" = "$STAGING_PROJECT_NUMBER"
          gcloud projects add-iam-policy-binding "$STAGING_PROJECT_ID" \
            --member="serviceAccount:$STAGING_DEPLOYER_SA" \
            --role=roles/run.invoker \
            --condition=None --quiet >/dev/null
          POLICY="$(gcloud projects get-iam-policy "$STAGING_PROJECT_ID" --format=json)"
          printf '%s' "$POLICY" | jq -e --arg m "serviceAccount:$STAGING_DEPLOYER_SA" '.bindings[] | select(.role=="roles/run.invoker") | (.members // []) | index($m) != null' >/dev/null
          echo 'STAGING_DEPLOYER_RUN_INVOKER=PASS'
          echo 'PRODUCTION_MUTATION_EXECUTED=NO'

  deploy-candidate:
    name: Migrate and deploy exact frozen candidate to isolated staging with no traffic
    needs: authorize-smoke
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 60
    env:
      DEPLOY_ENVIRONMENT: staging
      GCP_PROJECT_ID: toca-mcp-next-staging
      GCP_PROJECT_NUMBER: '729069789107'
      GCP_REGION: southamerica-east1
      GCP_ARTIFACT_REPOSITORY: toca-mcp-staging
      GCP_CLOUD_SQL_INSTANCE: toca-mcp-next-staging-db
      GCP_CLOUD_RUN_MCP_SERVICE: toca-mcp-next-staging
      GCP_CLOUD_RUN_WEBHOOK_SERVICE: toca-webhook-next-staging
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/729069789107/locations/global/workloadIdentityPools/github-staging/providers/github-toca-mcp-staging
      GCP_DEPLOY_SERVICE_ACCOUNT: toca-next-stg-deployer@toca-mcp-next-staging.iam.gserviceaccount.com
      GCP_MCP_RUNTIME_SERVICE_ACCOUNT: toca-next-stg-mcp@toca-mcp-next-staging.iam.gserviceaccount.com
      GCP_WEBHOOK_RUNTIME_SERVICE_ACCOUNT: toca-next-stg-webhook@toca-mcp-next-staging.iam.gserviceaccount.com
      GCP_DATABASE_URL_SECRET: toca-next-staging-database-url
      GCP_DATABASE_URL_SECRET_VERSION: '1'
      PRODUCTION_GCP_PROJECT_ID: toca-mcp-production
      PRODUCTION_GCP_PROJECT_NUMBER: '990081828836'
      PRODUCTION_GCP_REGION: southamerica-east1
      PRODUCTION_GCP_CLOUD_SQL_INSTANCE: toca-mcp-db
      PRODUCTION_GCP_CLOUD_RUN_MCP_SERVICE: toca-mcp-staging
      PRODUCTION_GCP_CLOUD_RUN_WEBHOOK_SERVICE: toca-meta-oauth-staging
      PRODUCTION_GCP_DATABASE_URL_SECRET: toca-database-url
      PRODUCTION_GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
      PRODUCTION_GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      PRODUCTION_GCP_MCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
      PRODUCTION_GCP_WEBHOOK_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
      STAGING_DATABASE_ISOLATION_MODE: DEDICATED_CLOUD_SQL
      STAGING_PROVIDER_MODE: DISABLED
      META_ENABLED: 'false'
      META_PROVIDER_VERIFIED: 'false'
      META_WEBHOOK_ENABLED: 'false'
      META_WEBHOOK_PERSISTENCE_ENABLED: 'false'
      INSTAGRAM_READ_ENABLED: 'false'
      META_ADS_READ_ENABLED: 'false'
      META_ADS_WRITE_ENABLED: 'false'
      WHATSAPP_ENABLED: 'false'
      WHATSAPP_RUNTIME_ENABLED: 'false'
      WHATSAPP_PROVIDER_VERIFIED: 'false'
      EMAIL_SENDGRID_ENABLED: 'false'
      EMAIL_SENDGRID_PROVIDER_VERIFIED: 'false'
      GOOGLE_ADS_PHASE: OFF
      GOOGLE_ADS_PROVIDER_VERIFIED: 'false'
      AG01_MODEL_ENABLED: 'false'
      AG01_MODEL_PROVIDER_VERIFIED: 'false'
      TOCA_DEFAULT_TENANT_ID: toca
      TOCA_DEFAULT_WORKSPACE_ID: toca
      TOCA_DEFAULT_ORGANIZATION_ID: toca
    steps:
      - name: Checkout exact frozen application candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Assert frozen candidate and fail-closed environment contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$PLATFORM_READY_FOR_STAGING" = YES
          test "$PLATFORM_READINESS_RUN" = 32509071007
          node scripts/validate-gcp-deploy-environment.mjs
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Exact-candidate Quality before staging mutation
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm quality
      - name: Authenticate through dedicated staging WIF
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.STAGING_WIF }}
          service_account: ${{ env.STAGING_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Revalidate live staging resources immediately before migration
        shell: bash
        run: |
          set -euo pipefail
          gcloud sql instances describe "$STAGING_SQL_INSTANCE" --project="$STAGING_PROJECT_ID" --format=json >/tmp/sql.json
          test "$(jq -r '.project' /tmp/sql.json)" = "$STAGING_PROJECT_ID"
          test "$(jq -r '.connectionName' /tmp/sql.json)" = "${STAGING_PROJECT_ID}:${REGION}:${STAGING_SQL_INSTANCE}"
          test "$(jq -r '(.settings.ipConfiguration.authorizedNetworks // []) | length' /tmp/sql.json)" = 0
          test "$(jq -r '.settings.backupConfiguration.enabled' /tmp/sql.json)" = true
          test "$(jq -r '.settings.backupConfiguration.pointInTimeRecoveryEnabled' /tmp/sql.json)" = true
          test "$(jq -r '.settings.deletionProtectionEnabled' /tmp/sql.json)" = true
          RAW_DATABASE_URL="$(gcloud secrets versions access "$STAGING_DATABASE_SECRET_VERSION" --secret="$STAGING_DATABASE_SECRET" --project="$STAGING_PROJECT_ID")"
          RAW_DATABASE_URL="$RAW_DATABASE_URL" node --input-type=module -e '
            const url = new URL(process.env.RAW_DATABASE_URL);
            if (!/^postgres(?:ql)?:$/.test(url.protocol)) throw new Error("invalid database protocol");
            if (!url.username) throw new Error("database username missing");
          '
          unset RAW_DATABASE_URL
          echo 'PRE_MIGRATION_STAGING_REVALIDATION=PASS'
      - name: Start checksum-pinned Cloud SQL Auth Proxy
        shell: bash
        run: |
          set -euo pipefail
          PROXY_VERSION='2.24.1'
          PROXY_SHA256='fae2766aac9d614a2bdef2f2a7778f3d054f3acd5ff07a81a9e300bd471512eb'
          curl --fail --silent --show-error --location \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v${PROXY_VERSION}/cloud-sql-proxy.linux.amd64" \
            --output /tmp/cloud-sql-proxy
          echo "${PROXY_SHA256}  /tmp/cloud-sql-proxy" | sha256sum --check --strict
          chmod 0755 /tmp/cloud-sql-proxy
          /tmp/cloud-sql-proxy --address 127.0.0.1 --port 5432 \
            "${STAGING_PROJECT_ID}:${REGION}:${STAGING_SQL_INSTANCE}" >/tmp/cloud-sql-proxy.log 2>&1 &
          PROXY_PID=$!
          echo "CLOUD_SQL_PROXY_PID=$PROXY_PID" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if (echo >/dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then
              echo 'CLOUD_SQL_PROXY_READY=PASS'
              exit 0
            fi
            if ! kill -0 "$PROXY_PID" 2>/dev/null; then
              cat /tmp/cloud-sql-proxy.log >&2
              exit 1
            fi
            sleep 1
          done
          cat /tmp/cloud-sql-proxy.log >&2
          exit 1
      - name: Apply repository migrations to isolated staging through authenticated proxy
        shell: bash
        run: |
          set -euo pipefail
          RAW_DATABASE_URL="$(gcloud secrets versions access "$STAGING_DATABASE_SECRET_VERSION" --secret="$STAGING_DATABASE_SECRET" --project="$STAGING_PROJECT_ID")"
          export DATABASE_URL="$(RAW_DATABASE_URL="$RAW_DATABASE_URL" node --input-type=module -e '
            const url = new URL(process.env.RAW_DATABASE_URL);
            url.hostname = "127.0.0.1";
            url.port = "5432";
            for (const key of ["host","port","ssl","sslmode","sslcert","sslkey","sslrootcert","sslaccept"]) url.searchParams.delete(key);
            process.stdout.write(url.toString());
          ')"
          unset RAW_DATABASE_URL
          export DATABASE_SSL=false
          pnpm migrate
          mkdir -p platform-evidence
          TOCA_RELEASE_SHA="$CANDIDATE_SHA" TOCA_DEPLOY_ENVIRONMENT=staging \
            node scripts/capture-platform-evidence.mjs platform-evidence/database-runtime.json
          unset DATABASE_URL DATABASE_SSL
          echo 'STAGING_MIGRATIONS_APPLIED=PASS'
      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Build push and resolve immutable candidate image digest
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REPOSITORY="${REGION}-docker.pkg.dev/${STAGING_PROJECT_ID}/${STAGING_ARTIFACT_REPOSITORY}/server"
          IMAGE_TAG="${IMAGE_REPOSITORY}:${CANDIDATE_SHA}"
          docker buildx build --pull --push --provenance=mode=max --sbom=true \
            --metadata-file /tmp/build-metadata.json -t "$IMAGE_TAG" .
          IMAGE_DIGEST="$(jq -r '."containerimage.digest" // empty' /tmp/build-metadata.json)"
          [[ "$IMAGE_DIGEST" == sha256:* ]]
          REMOTE_DIGEST="$(gcloud artifacts docker images describe "$IMAGE_TAG" --project="$STAGING_PROJECT_ID" --format='value(image_summary.digest)')"
          test "$REMOTE_DIGEST" = "$IMAGE_DIGEST"
          echo "IMAGE=${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"
          echo "MCP_TAG=candidate-${CANDIDATE_SHA:0:7}" >> "$GITHUB_ENV"
          echo "WEBHOOK_TAG=candidate-${CANDIDATE_SHA:0:7}" >> "$GITHUB_ENV"
          echo "MCP_SUFFIX=mcp-${CANDIDATE_SHA:0:7}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "WEBHOOK_SUFFIX=webhook-${CANDIDATE_SHA:0:7}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo 'STAGING_IMAGE_DIGEST_READBACK=PASS'
      - name: Deploy exact candidate revisions with zero production/provider exposure and no traffic
        shell: bash
        run: |
          set -euo pipefail
          COMMON_ENV="NODE_ENV=production,TOCA_DEPLOY_ENVIRONMENT=staging,TOCA_RELEASE_SHA=${CANDIDATE_SHA},TOCA_PLATFORM_KILL_SWITCH=false,TOCA_DEFAULT_TENANT_ID=toca,TOCA_DEFAULT_WORKSPACE_ID=toca,TOCA_DEFAULT_ORGANIZATION_ID=toca,STAGING_PROVIDER_MODE=DISABLED,META_ENABLED=false,META_PROVIDER_VERIFIED=false,META_WEBHOOK_ENABLED=false,META_WEBHOOK_PERSISTENCE_ENABLED=false,INSTAGRAM_READ_ENABLED=false,META_ADS_READ_ENABLED=false,META_ADS_WRITE_ENABLED=false,WHATSAPP_ENABLED=false,WHATSAPP_RUNTIME_ENABLED=false,WHATSAPP_PROVIDER_VERIFIED=false,EMAIL_SENDGRID_ENABLED=false,EMAIL_SENDGRID_PROVIDER_VERIFIED=false,GOOGLE_ADS_PHASE=OFF,GOOGLE_ADS_PROVIDER_VERIFIED=false,AG01_MODEL_ENABLED=false,AG01_MODEL_PROVIDER_VERIFIED=false,GCP_PROJECT_ID=${STAGING_PROJECT_ID}"
          CONNECTION_NAME="${STAGING_PROJECT_ID}:${REGION}:${STAGING_SQL_INSTANCE}"

          gcloud run deploy "$STAGING_MCP_SERVICE" --image "$IMAGE" --project="$STAGING_PROJECT_ID" --region="$REGION" \
            --revision-suffix "$MCP_SUFFIX" --tag "$MCP_TAG" --no-traffic \
            --service-account "$STAGING_MCP_RUNTIME_SA" --add-cloudsql-instances "$CONNECTION_NAME" \
            --update-secrets "DATABASE_URL=${STAGING_DATABASE_SECRET}:${STAGING_DATABASE_SECRET_VERSION}" \
            --update-env-vars "${COMMON_ENV},MCP_ENABLED=true,TOCA_SERVICE_ROLE=mcp" \
            --startup-probe 'httpGet.path=/readyz,httpGet.port=8080,failureThreshold=20,timeoutSeconds=3,periodSeconds=3' \
            --readiness-probe 'httpGet.path=/readyz,httpGet.port=8080,successThreshold=1,failureThreshold=3,timeoutSeconds=3,periodSeconds=5' \
            --liveness-probe 'httpGet.path=/healthz,httpGet.port=8080,failureThreshold=3,timeoutSeconds=3,periodSeconds=10' \
            --ingress=all --min=0 --max=1 --cpu=1 --memory=512Mi --no-allow-unauthenticated --quiet

          gcloud run deploy "$STAGING_WEBHOOK_SERVICE" --image "$IMAGE" --project="$STAGING_PROJECT_ID" --region="$REGION" \
            --revision-suffix "$WEBHOOK_SUFFIX" --tag "$WEBHOOK_TAG" --no-traffic \
            --service-account "$STAGING_WEBHOOK_RUNTIME_SA" --add-cloudsql-instances "$CONNECTION_NAME" \
            --update-secrets "DATABASE_URL=${STAGING_DATABASE_SECRET}:${STAGING_DATABASE_SECRET_VERSION}" \
            --update-env-vars "${COMMON_ENV},MCP_ENABLED=false,TOCA_SERVICE_ROLE=webhook" \
            --startup-probe 'httpGet.path=/readyz,httpGet.port=8080,failureThreshold=20,timeoutSeconds=3,periodSeconds=3' \
            --readiness-probe 'httpGet.path=/readyz,httpGet.port=8080,successThreshold=1,failureThreshold=3,timeoutSeconds=3,periodSeconds=5' \
            --liveness-probe 'httpGet.path=/healthz,httpGet.port=8080,failureThreshold=3,timeoutSeconds=3,periodSeconds=10' \
            --ingress=all --min=0 --max=1 --cpu=1 --memory=512Mi --no-allow-unauthenticated --quiet
          echo 'STAGING_CANDIDATE_DEPLOY_NO_TRAFFIC=PASS'
      - name: Resolve candidate revisions and prove no traffic promotion
        shell: bash
        run: |
          set -euo pipefail
          MCP_JSON="$(gcloud run services describe "$STAGING_MCP_SERVICE" --project="$STAGING_PROJECT_ID" --region="$REGION" --format=json)"
          WEBHOOK_JSON="$(gcloud run services describe "$STAGING_WEBHOOK_SERVICE" --project="$STAGING_PROJECT_ID" --region="$REGION" --format=json)"
          MCP_REVISION="$(printf '%s' "$MCP_JSON" | jq -r --arg tag "$MCP_TAG" '.status.traffic[] | select(.tag==$tag) | .revisionName')"
          MCP_URL="$(printf '%s' "$MCP_JSON" | jq -r --arg tag "$MCP_TAG" '.status.traffic[] | select(.tag==$tag) | .url')"
          WEBHOOK_REVISION="$(printf '%s' "$WEBHOOK_JSON" | jq -r --arg tag "$WEBHOOK_TAG" '.status.traffic[] | select(.tag==$tag) | .revisionName')"
          WEBHOOK_URL="$(printf '%s' "$WEBHOOK_JSON" | jq -r --arg tag "$WEBHOOK_TAG" '.status.traffic[] | select(.tag==$tag) | .url')"
          test -n "$MCP_REVISION"; test -n "$MCP_URL"; test -n "$WEBHOOK_REVISION"; test -n "$WEBHOOK_URL"
          test "$(printf '%s' "$MCP_JSON" | jq -r --arg rev "$MCP_REVISION" '[.status.traffic[] | select(.revisionName==$rev and (.percent // 0) > 0)] | length')" = 0
          test "$(printf '%s' "$WEBHOOK_JSON" | jq -r --arg rev "$WEBHOOK_REVISION" '[.status.traffic[] | select(.revisionName==$rev and (.percent // 0) > 0)] | length')" = 0
          echo "MCP_REVISION=$MCP_REVISION" >> "$GITHUB_ENV"
          echo "MCP_URL=$MCP_URL" >> "$GITHUB_ENV"
          echo "WEBHOOK_REVISION=$WEBHOOK_REVISION" >> "$GITHUB_ENV"
          echo "WEBHOOK_URL=$WEBHOOK_URL" >> "$GITHUB_ENV"
          echo 'STAGING_CANDIDATE_TRAFFIC_PERCENT=0'
      - name: Authenticated health and readiness smoke on tagged candidate revisions
        shell: bash
        run: |
          set -euo pipefail
          MCP_TOKEN="$(gcloud auth print-identity-token --audiences="$MCP_URL")"
          WEBHOOK_TOKEN="$(gcloud auth print-identity-token --audiences="$WEBHOOK_URL")"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            -H "Authorization: Bearer $MCP_TOKEN" "$MCP_URL/healthz" | tee platform-evidence/mcp-healthz.json
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            -H "Authorization: Bearer $MCP_TOKEN" "$MCP_URL/readyz" | tee platform-evidence/mcp-readyz.json
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            -H "Authorization: Bearer $WEBHOOK_TOKEN" "$WEBHOOK_URL/healthz" | tee platform-evidence/webhook-healthz.json
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            -H "Authorization: Bearer $WEBHOOK_TOKEN" "$WEBHOOK_URL/readyz" | tee platform-evidence/webhook-readyz.json
          jq -e '.status == "ready" and (.checks | all(.ok == true))' platform-evidence/mcp-readyz.json >/dev/null
          jq -e '.status == "ready" and (.checks | all(.ok == true))' platform-evidence/webhook-readyz.json >/dev/null
          MCP_PUBLIC="$(curl --silent --output /dev/null --write-out '%{http_code}' "$MCP_URL/healthz")"
          WEBHOOK_PUBLIC="$(curl --silent --output /dev/null --write-out '%{http_code}' "$WEBHOOK_URL/healthz")"
          [[ "$MCP_PUBLIC" == 401 || "$MCP_PUBLIC" == 403 ]]
          [[ "$WEBHOOK_PUBLIC" == 401 || "$WEBHOOK_PUBLIC" == 403 ]]
          echo 'STAGING_CANDIDATE_HEALTH_READY=PASS'
          echo 'STAGING_CANDIDATE_UNAUTHENTICATED_ACCESS=DENIED'
      - name: Final exact candidate deployment readback
        shell: bash
        run: |
          set -euo pipefail
          for SPEC in "$STAGING_MCP_SERVICE|$MCP_REVISION|$STAGING_MCP_RUNTIME_SA" "$STAGING_WEBHOOK_SERVICE|$WEBHOOK_REVISION|$STAGING_WEBHOOK_RUNTIME_SA"; do
            SERVICE="${SPEC%%|*}"; REST="${SPEC#*|}"; REVISION="${REST%%|*}"; EXPECTED_SA="${REST#*|}"
            REV_JSON="$(gcloud run revisions describe "$REVISION" --project="$STAGING_PROJECT_ID" --region="$REGION" --format=json)"
            test "$(printf '%s' "$REV_JSON" | jq -r '.spec.serviceAccountName')" = "$EXPECTED_SA"
            test "$(printf '%s' "$REV_JSON" | jq -r '.metadata.labels["cloud.googleapis.com/location"]')" = "$REGION"
            test "$(printf '%s' "$REV_JSON" | jq -r '[.spec.containers[].env[]? | select(.name=="TOCA_RELEASE_SHA") | .value][0]')" = "$CANDIDATE_SHA"
            test "$(printf '%s' "$REV_JSON" | jq -r '[.spec.containers[].env[]? | select(.name=="STAGING_PROVIDER_MODE") | .value][0]')" = DISABLED
            test "$(printf '%s' "$REV_JSON" | jq -r '[.spec.containers[].env[]? | select(.name=="GOOGLE_ADS_PHASE") | .value][0]')" = OFF
          done
          echo "CANDIDATE_SHA=$CANDIDATE_SHA"
          echo "IMAGE_DIGEST=$IMAGE_DIGEST"
          echo "MCP_REVISION=$MCP_REVISION"
          echo "WEBHOOK_REVISION=$WEBHOOK_REVISION"
          echo 'STAGING_EXACT_CANDIDATE_DEPLOYED=YES'
          echo 'STAGING_TRAFFIC_PROMOTED=NO'
          echo 'PROVIDER_MUTATION_EXECUTED=NO'
          echo 'PRODUCTION_MUTATION_EXECUTED=NO'
      - name: Stop Cloud SQL Auth Proxy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CLOUD_SQL_PROXY_PID:-}" ]] && kill -0 "$CLOUD_SQL_PROXY_PID" 2>/dev/null; then
            kill "$CLOUD_SQL_PROXY_PID"
            wait "$CLOUD_SQL_PROXY_PID" || true
          fi