name: GCP Staging Project Bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/gcp-staging-project-bootstrap.yml'

permissions:
  contents: read
  id-token: write

env:
  CANDIDATE_SHA: 7db1a6e5caf01f98b200257c4aeecc2f1b29550a
  REGION: southamerica-east1
  PROD_PROJECT_ID: toca-mcp-production
  PROD_PROJECT_NUMBER: '990081828836'
  PROD_SQL_INSTANCE: toca-mcp-db
  PROD_DATABASE_SECRET: toca-database-url
  PROD_MCP_SERVICE: toca-mcp-staging
  PROD_WEBHOOK_SERVICE: toca-meta-oauth-staging
  PROD_DEPLOYER_SA: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  PROD_RUNTIME_SA: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  PROD_WIF: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  INFRA_ADMIN_SA: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com
  STAGING_PROJECT_ID: toca-mcp-next-staging
  STAGING_PROJECT_NUMBER: '729069789107'
  STAGING_SQL_INSTANCE: toca-mcp-next-staging-db
  STAGING_DATABASE_SECRET: toca-next-staging-database-url
  STAGING_MCP_SERVICE: toca-mcp-next-staging
  STAGING_WEBHOOK_SERVICE: toca-webhook-next-staging
  STAGING_DEPLOYER_SA: toca-next-stg-deployer@toca-mcp-next-staging.iam.gserviceaccount.com
  STAGING_MCP_RUNTIME_SA: toca-next-stg-mcp@toca-mcp-next-staging.iam.gserviceaccount.com
  STAGING_WEBHOOK_RUNTIME_SA: toca-next-stg-webhook@toca-mcp-next-staging.iam.gserviceaccount.com
  STAGING_WIF: projects/729069789107/locations/global/workloadIdentityPools/github-staging/providers/github-toca-mcp-staging

jobs:
  isolation-proof:
    name: Prove live staging isolation from production
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.PROD_WIF }}
          service_account: ${{ env.INFRA_ADMIN_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Compare all staging coordinates against current production authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(gcloud projects describe "$PROD_PROJECT_ID" --format='value(projectNumber)')" = "$PROD_PROJECT_NUMBER"
          test "$(gcloud projects describe "$STAGING_PROJECT_ID" --format='value(projectNumber)')" = "$STAGING_PROJECT_NUMBER"
          test "$STAGING_PROJECT_ID" != "$PROD_PROJECT_ID"
          test "$STAGING_PROJECT_NUMBER" != "$PROD_PROJECT_NUMBER"
          test "$STAGING_SQL_INSTANCE" != "$PROD_SQL_INSTANCE"
          test "$STAGING_DATABASE_SECRET" != "$PROD_DATABASE_SECRET"
          test "$STAGING_MCP_SERVICE" != "$PROD_MCP_SERVICE"
          test "$STAGING_WEBHOOK_SERVICE" != "$PROD_WEBHOOK_SERVICE"
          test "$STAGING_DEPLOYER_SA" != "$PROD_DEPLOYER_SA"
          test "$STAGING_MCP_RUNTIME_SA" != "$PROD_RUNTIME_SA"
          test "$STAGING_WEBHOOK_RUNTIME_SA" != "$PROD_RUNTIME_SA"
          test "$STAGING_WIF" != "$PROD_WIF"

          SQL_JSON="$(gcloud sql instances describe "$STAGING_SQL_INSTANCE" --project="$STAGING_PROJECT_ID" --format=json)"
          test "$(printf '%s' "$SQL_JSON" | jq -r '.connectionName')" = "${STAGING_PROJECT_ID}:${REGION}:${STAGING_SQL_INSTANCE}"
          test "$(printf '%s' "$SQL_JSON" | jq -r '.project')" = "$STAGING_PROJECT_ID"
          test "$(printf '%s' "$SQL_JSON" | jq -r '.settings.ipConfiguration.sslMode')" = ENCRYPTED_ONLY
          test "$(printf '%s' "$SQL_JSON" | jq -r '(.settings.ipConfiguration.authorizedNetworks // []) | length')" = 0
          test "$(printf '%s' "$SQL_JSON" | jq -r '.settings.backupConfiguration.enabled')" = true
          test "$(printf '%s' "$SQL_JSON" | jq -r '.settings.backupConfiguration.pointInTimeRecoveryEnabled')" = true
          test "$(printf '%s' "$SQL_JSON" | jq -r '.settings.deletionProtectionEnabled')" = true

          SECRET_NAME="$(gcloud secrets describe "$STAGING_DATABASE_SECRET" --project="$STAGING_PROJECT_ID" --format='value(name)')"
          test "$SECRET_NAME" = "projects/$STAGING_PROJECT_NUMBER/secrets/$STAGING_DATABASE_SECRET"
          test -n "$(gcloud secrets versions list "$STAGING_DATABASE_SECRET" --project="$STAGING_PROJECT_ID" --filter='state=ENABLED' --format='value(name)' --limit=1)"

          for SPEC in "$STAGING_MCP_SERVICE|$STAGING_MCP_RUNTIME_SA" "$STAGING_WEBHOOK_SERVICE|$STAGING_WEBHOOK_RUNTIME_SA"; do
            SERVICE="${SPEC%%|*}"
            EXPECTED_SA="${SPEC#*|}"
            JSON="$(gcloud run services describe "$SERVICE" --project="$STAGING_PROJECT_ID" --region="$REGION" --format=json)"
            test "$(printf '%s' "$JSON" | jq -r '.spec.template.spec.serviceAccountName')" = "$EXPECTED_SA"
            test "$(printf '%s' "$JSON" | jq -r '.spec.template.metadata.annotations["run.googleapis.com/cloudsql-instances"]')" = "${STAGING_PROJECT_ID}:${REGION}:${STAGING_SQL_INSTANCE}"
            test "$(printf '%s' "$JSON" | jq -r '[.spec.template.spec.containers[].env[]? | select(.name=="STAGING_PROVIDER_MODE") | .value][0]')" = DISABLED
            test "$(printf '%s' "$JSON" | jq -r '[.. | objects | .secretKeyRef?.name? // empty] | length')" = 0
            IAM="$(gcloud run services get-iam-policy "$SERVICE" --project="$STAGING_PROJECT_ID" --region="$REGION" --format=json)"
            if printf '%s' "$IAM" | jq -e '.bindings[]? | (.members // []) | index("allUsers")' >/dev/null; then
              echo "FAIL: $SERVICE is publicly invokable" >&2
              exit 1
            fi
          done

          PROVIDER_NAME="$(gcloud iam workload-identity-pools providers describe github-toca-mcp-staging --workload-identity-pool=github-staging --location=global --project="$STAGING_PROJECT_ID" --format='value(name)')"
          test "$PROVIDER_NAME" = "$STAGING_WIF"

          EXPECTED_PRINCIPAL="principal://iam.googleapis.com/projects/${STAGING_PROJECT_NUMBER}/locations/global/workloadIdentityPools/github-staging/subject/repo:luizanunciostoca/toca-mcp-server:environment:staging"
          DEPLOYER_POLICY="$(gcloud iam service-accounts get-iam-policy "$STAGING_DEPLOYER_SA" --project="$STAGING_PROJECT_ID" --format=json)"
          printf '%s' "$DEPLOYER_POLICY" | jq -e --arg p "$EXPECTED_PRINCIPAL" '.bindings[] | select(.role=="roles/iam.workloadIdentityUser") | (.members // []) | index($p) != null' >/dev/null

          for RUNTIME_SA in "$STAGING_MCP_RUNTIME_SA" "$STAGING_WEBHOOK_RUNTIME_SA"; do
            SA_POLICY="$(gcloud iam service-accounts get-iam-policy "$RUNTIME_SA" --project="$STAGING_PROJECT_ID" --format=json)"
            printf '%s' "$SA_POLICY" | jq -e --arg d "serviceAccount:${STAGING_DEPLOYER_SA}" '.bindings[] | select(.role=="roles/iam.serviceAccountUser") | (.members // []) | index($d) != null' >/dev/null
          done

          SECRET_POLICY="$(gcloud secrets get-iam-policy "$STAGING_DATABASE_SECRET" --project="$STAGING_PROJECT_ID" --format=json)"
          for SA in "$STAGING_DEPLOYER_SA" "$STAGING_MCP_RUNTIME_SA" "$STAGING_WEBHOOK_RUNTIME_SA"; do
            printf '%s' "$SECRET_POLICY" | jq -e --arg m "serviceAccount:${SA}" '.bindings[] | select(.role=="roles/secretmanager.secretAccessor") | (.members // []) | index($m) != null' >/dev/null
          done

          PROJECT_POLICY="$(gcloud projects get-iam-policy "$STAGING_PROJECT_ID" --format=json)"
          for SA in "$STAGING_DEPLOYER_SA" "$STAGING_MCP_RUNTIME_SA" "$STAGING_WEBHOOK_RUNTIME_SA"; do
            if printf '%s' "$PROJECT_POLICY" | jq -e --arg m "serviceAccount:${SA}" '.bindings[] | select(.role=="roles/owner" or .role=="roles/editor") | (.members // []) | index($m) != null' >/dev/null; then
              echo "FAIL: forbidden Owner/Editor on $SA" >&2
              exit 1
            fi
          done

          echo 'STAGING_PROJECT_ISOLATION=PASS'
          echo 'STAGING_SQL_ISOLATION=PASS'
          echo 'STAGING_SECRET_ISOLATION=PASS'
          echo 'STAGING_CLOUD_RUN_ISOLATION=PASS'
          echo 'STAGING_IDENTITY_ISOLATION=PASS'
          echo 'STAGING_WIF_ISOLATION=PASS'
          echo 'STAGING_PROVIDER_MODE=DISABLED'
          echo 'LIVE_ISOLATION_PROOF=PASS'

  staging-wif-proof:
    name: Prove staging WIF and deny production authority
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Authenticate through staging-only WIF
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.STAGING_WIF }}
          service_account: ${{ env.STAGING_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Prove staging deploy authority and production denial
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          gcloud auth print-access-token >/dev/null
          echo 'STAGING_WIF_TOKEN=PASS'

          test "$(gcloud projects describe "$STAGING_PROJECT_ID" --format='value(projectNumber)')" = "$STAGING_PROJECT_NUMBER"
          gcloud run services describe "$STAGING_MCP_SERVICE" --project="$STAGING_PROJECT_ID" --region="$REGION" >/dev/null
          gcloud run services describe "$STAGING_WEBHOOK_SERVICE" --project="$STAGING_PROJECT_ID" --region="$REGION" >/dev/null
          gcloud sql instances describe "$STAGING_SQL_INSTANCE" --project="$STAGING_PROJECT_ID" >/dev/null

          TOKEN="$(gcloud auth print-access-token)"
          STAGING_BODY='{"permissions":["run.services.get","run.services.update","artifactregistry.repositories.uploadArtifacts","cloudsql.instances.connect","serviceusage.services.use"]}'
          STAGING_HTTP="$(curl -sS -o /tmp/staging-deploy-perms.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data "$STAGING_BODY" "https://cloudresourcemanager.googleapis.com/v3/projects/${STAGING_PROJECT_ID}:testIamPermissions")"
          test "$STAGING_HTTP" = 200
          for P in run.services.get run.services.update artifactregistry.repositories.uploadArtifacts cloudsql.instances.connect serviceusage.services.use; do
            jq -e --arg p "$P" '(.permissions // []) | index($p) != null' /tmp/staging-deploy-perms.json >/dev/null
          done

          SECRET_BODY='{"permissions":["secretmanager.versions.access"]}'
          SECRET_HTTP="$(curl -sS -o /tmp/staging-secret-perms.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data "$SECRET_BODY" "https://secretmanager.googleapis.com/v1/projects/${STAGING_PROJECT_ID}/secrets/${STAGING_DATABASE_SECRET}:testIamPermissions")"
          test "$SECRET_HTTP" = 200
          jq -e '(.permissions // []) | index("secretmanager.versions.access") != null' /tmp/staging-secret-perms.json >/dev/null

          PROD_BODY='{"permissions":["run.services.update","cloudsql.instances.update","secretmanager.versions.access","resourcemanager.projects.setIamPolicy","iam.serviceAccounts.actAs"]}'
          PROD_HTTP="$(curl -sS -o /tmp/prod-deny.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data "$PROD_BODY" "https://cloudresourcemanager.googleapis.com/v3/projects/${PROD_PROJECT_ID}:testIamPermissions")"
          test "$PROD_HTTP" = 200
          jq -e '(.permissions // []) | length == 0' /tmp/prod-deny.json >/dev/null

          echo 'STAGING_DEPLOYER_STAGING_AUTHORITY=PASS'
          echo 'STAGING_DEPLOYER_PRODUCTION_MUTATION_AUTHORITY=NONE'
          echo 'APPLICATION_MIGRATION_EXECUTED=NO'
          echo 'APPLICATION_DEPLOY_EXECUTED=NO'
          echo 'PROVIDER_MUTATION_EXECUTED=NO'
