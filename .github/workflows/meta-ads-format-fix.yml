name: Meta Ads Format Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format controlled Meta Ads files
        run: pnpm exec prettier --write src/providers/meta-ads/meta-ads-controlled-write.ts src/tools/register-meta-ads-write.ts test/meta-ads-controlled-write.test.ts
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/providers/meta-ads/meta-ads-controlled-write.ts src/tools/register-meta-ads-write.ts test/meta-ads-controlled-write.test.ts
          git commit -m "style(meta-ads): apply prettier"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
