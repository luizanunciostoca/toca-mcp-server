name: Google Business Local Reputation Apply

on:
  push:
    branches: [feat/google-business-local-reputation]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/google-business-local-reputation
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply architecture patch
        run: node scripts/apply-google-business-local-reputation.mjs
      - name: Apply lint corrections
        run: node scripts/fix-google-business-local-reputation-lint.mjs
      - name: Format implementation
        run: pnpm format
      - name: Full Quality Gate
        run: pnpm quality
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test docs scripts .github/workflows
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "feat: implement Google Business local discovery and reputation"
          git push origin HEAD:feat/google-business-local-reputation
