name: Ops Provider Secret Metadata Read 2026-08-22

on:
  pull_request:
    paths:
      - '.github/workflows/ops-provider-secret-metadata-read-20260822.yml'

permissions:
  contents: read
  id-token: write

jobs:
  read:
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: toca-mcp-production
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
      GCP_INFRA_ADMIN_SERVICE_ACCOUNT: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com
    steps:
      - name: Authenticate existing infrastructure administrator
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_INFRA_ADMIN_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: List provider-relevant Secret Manager metadata only
        shell: bash
        run: |
          set -euo pipefail
          gcloud secrets list --project "$GCP_PROJECT_ID" --format='value(name)' > /tmp/all-secret-ids.txt
          grep -Eai 'sendgrid|email|whatsapp|meta|google.*ads|ads.*google|developer.*token|refresh.*token|oauth.*client' /tmp/all-secret-ids.txt \
            | sort -u > /tmp/provider-secret-ids.txt || true
          echo "PROVIDER_SECRET_METADATA_MATCH_COUNT=$(wc -l < /tmp/provider-secret-ids.txt | tr -d ' ')"
          while IFS= read -r id; do
            [[ -n "$id" ]] || continue
            printf 'PROVIDER_SECRET_ID=%s\n' "$id"
          done < /tmp/provider-secret-ids.txt
          echo 'SECRET_PAYLOAD_READ_EXECUTED=false'
          echo 'SECRET_VERSION_PAYLOAD_READ_EXECUTED=false'
          echo 'PROVIDER_SECRET_METADATA_READ=PASS'
