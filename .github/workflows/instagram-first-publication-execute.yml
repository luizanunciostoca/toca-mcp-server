name: Instagram First Publication Execute

on:
  workflow_dispatch:
    inputs:
      approved_request_sha256:
        description: Exact approved SHA-256 from Instagram First Publication Prepare
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  TOKEN_SECRET_ID: toca-meta-oauth-token
  JOB_NAME: toca-instagram-first-publication-execute
  INSTAGRAM_ACCOUNT_ID: '17841402033495654'
  CORRELATION_ID: toca-instagram-first-real-publication-2026-08-12-sunset-001
  IDEMPOTENCY_KEY: toca-instagram-first-real-publication-2026-08-12-sunset-001
  EXPECTED_REQUEST_SHA256: e38b81ed8504691749adc11a9b039117173e6ce0b0e18370458b01484ae17d78

jobs:
  execute:
    runs-on: ubuntu-latest
    environment: instagram-production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm quality

      - name: Verify explicit approval hash
        shell: bash
        env:
          APPROVED_REQUEST_SHA256: ${{ inputs.approved_request_sha256 }}
        run: |
          set -euo pipefail
          test "$APPROVED_REQUEST_SHA256" = "$EXPECTED_REQUEST_SHA256"
          test "${#APPROVED_REQUEST_SHA256}" -eq 64
          printf '%s' "$APPROVED_REQUEST_SHA256" | grep -Eq '^[a-f0-9]{64}$'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify prepared request evidence exists
        shell: bash
        run: |
          set -euo pipefail
          RESULT_LINE="$(gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=toca-instagram-first-publication-prepare AND textPayload:\"INSTAGRAM_FIRST_PUBLICATION_PREPARE_RESULT=\" AND textPayload:\"${CORRELATION_ID}\"" \
            --project "$PROJECT_ID" \
            --freshness=24h \
            --limit=50 \
            --order=desc \
            --format='value(textPayload)' | grep 'INSTAGRAM_FIRST_PUBLICATION_PREPARE_RESULT=' | head -n1)"
          test -n "$RESULT_LINE"
          RESULT_JSON="${RESULT_LINE#INSTAGRAM_FIRST_PUBLICATION_PREPARE_RESULT=}"
          PREPARED_SHA256="$(printf '%s' "$RESULT_JSON" | jq -r .manifest.requestSha256)"
          test "$PREPARED_SHA256" = "$EXPECTED_REQUEST_SHA256"
          printf '%s\n' "$RESULT_JSON" | jq -e \
            --arg ig "$INSTAGRAM_ACCOUNT_ID" \
            --arg correlation "$CORRELATION_ID" \
            --arg idempotency "$IDEMPOTENCY_KEY" '
              .manifest.request.account.instagramAccountId == $ig and
              .manifest.request.correlationId == $correlation and
              .manifest.request.idempotencyKey == $idempotency and
              .manifest.request.mediaType == "IMAGE" and
              (.manifest.request.mediaUrls | length == 1) and
              (.manifest.request.caption | length > 0)
            ' >/dev/null
          printf '%s\n' "$RESULT_JSON" | jq . > first-publication-approved-request.json
          echo "MEDIA_URL=$(jq -r '.manifest.request.mediaUrls[0]' first-publication-approved-request.json)" >> "$GITHUB_ENV"
          echo "CAPTION_BASE64=$(jq -r '.manifest.request.caption' first-publication-approved-request.json | base64 -w0)" >> "$GITHUB_ENV"

      - name: Verify publication worker is deployed fail-closed by default
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_JSON="$(gcloud run services describe toca-instagram-publication-worker --project "$PROJECT_ID" --region "$REGION" --format=json)"
          printf '%s' "$SERVICE_JSON" | jq -e '
            [.spec.template.spec.containers[0].env[] | select(.name == "INSTAGRAM_PUBLICATION_WRITES_ENABLED") | .value] == ["false"]
          ' >/dev/null

      - name: Execute one-time approved publication
        shell: bash
        env:
          APPROVED_REQUEST_SHA256: ${{ inputs.approved_request_sha256 }}
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$JOB_NAME" \
            --image "$REGION-docker.pkg.dev/$PROJECT_ID/toca-mcp/server:latest" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --command node \
            --args dist/src/instagram-first-publication-execute.js \
            --set-env-vars "^@^NODE_ENV=production@MCP_ENABLED=false@META_ENABLED=true@META_WEBHOOK_ENABLED=false@META_WEBHOOK_PERSISTENCE_ENABLED=false@INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=false@INSTAGRAM_PUBLICATION_WRITES_ENABLED=true@INSTAGRAM_BUSINESS_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID@META_APP_ID=2281930145887404@META_APP_SECRET_PROVIDER=env@META_APP_SECRET_KEY=META_APP_SECRET@META_GRAPH_BASE_URL=https://graph.facebook.com@META_GRAPH_API_VERSION=v24.0@META_TOKEN_STORE_PROVIDER=gcp-secret-manager@META_TOKEN_SECRET_ID=$TOKEN_SECRET_ID@GCP_PROJECT_ID=$PROJECT_ID@INSTAGRAM_FIRST_PUBLICATION_APPROVED_REQUEST_SHA256=$APPROVED_REQUEST_SHA256@INSTAGRAM_FIRST_PUBLICATION_MEDIA_URL=$MEDIA_URL@INSTAGRAM_FIRST_PUBLICATION_CAPTION_BASE64=$CAPTION_BASE64@INSTAGRAM_FIRST_PUBLICATION_CORRELATION_ID=$CORRELATION_ID@INSTAGRAM_FIRST_PUBLICATION_IDEMPOTENCY_KEY=$IDEMPOTENCY_KEY" \
            --set-secrets "META_APP_SECRET=toca-meta-app-secret:1" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 180s \
            --quiet
          gcloud run jobs execute "$JOB_NAME" --project "$PROJECT_ID" --region "$REGION" --wait --quiet

      - name: Verify published result
        shell: bash
        run: |
          set -euo pipefail
          RESULT_LINE="$(gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME} AND textPayload:\"INSTAGRAM_FIRST_PUBLICATION_EXECUTE_RESULT=\" AND textPayload:\"${CORRELATION_ID}\"" \
            --project "$PROJECT_ID" \
            --freshness=30m \
            --limit=20 \
            --order=desc \
            --format='value(textPayload)' | grep 'INSTAGRAM_FIRST_PUBLICATION_EXECUTE_RESULT=' | head -n1)"
          test -n "$RESULT_LINE"
          RESULT_JSON="${RESULT_LINE#INSTAGRAM_FIRST_PUBLICATION_EXECUTE_RESULT=}"
          printf '%s\n' "$RESULT_JSON" | jq -e \
            --arg sha "$EXPECTED_REQUEST_SHA256" '
              .requestSha256 == $sha and
              .status == "PUBLISHED" and
              (.publicationId | length > 0)
            ' >/dev/null
          printf '%s\n' "$RESULT_JSON" | jq . > first-publication-execution.json

      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: instagram-first-publication-execution-${{ github.sha }}
          path: first-publication-execution.json
          if-no-files-found: error
          retention-days: 30
