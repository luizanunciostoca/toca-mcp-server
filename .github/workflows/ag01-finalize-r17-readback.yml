name: AG-01 Finalize R17 Planning Readback

on:
  push:
    branches:
      - ops/ag01-vertex-permanent-binding-20260828
    paths:
      - '.github/workflows/ag01-finalize-r17-readback.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  SERVICE: toca-ag01-orchestrator
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  AUTHORIZATION_ISSUE: '335'
  AUTHORIZED_RUNTIME_SHA: d2c85284f3f67d017ee800e4c4b772f5418542d6
  CANDIDATE_REVISION: toca-ag01-orchestrator-vtx-d2c85284-2
  CANDIDATE_TAG: candidate-d2c85284-2
  EXPECTED_IMAGE_DIGEST: sha256:491c0f4e05c8b02bd030080e9ab3d92fbc61a2252f2983fe582b619cbb222e96
  EXPECTED_MODEL: gemini-2.5-flash
  PROBE_JOB: toca-ag01-r17-production-probe

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Revalidate exact authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${AUTHORIZATION_ISSUE}" > /tmp/auth.json
          jq -e --arg sha "$AUTHORIZED_RUNTIME_SHA" --arg owner "$GITHUB_REPOSITORY_OWNER" '(.state=="open") and (.user.login==$owner) and (.title=="PRODUCTION AUTHORIZATION — AG-01 permanent Vertex binding") and ((.body//"")|contains("AUTHORIZATION_STATE=ACTIVE")) and ((.body//"")|contains("AUTHORIZED_CANDIDATE_SHA="+$sha))' /tmp/auth.json >/dev/null
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Preflight immutable candidate and private service
        run: |
          set -euo pipefail
          mkdir -p evidence
          gcloud run revisions describe "$CANDIDATE_REVISION" --project "$PROJECT_ID" --region "$REGION" --format=json > evidence/revision.json
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > evidence/service-before.json
          gcloud run services get-iam-policy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > evidence/iam-before.json
          jq -e --arg sa "$RUNTIME_SERVICE_ACCOUNT" --arg sha "$AUTHORIZED_RUNTIME_SHA" --arg model "$EXPECTED_MODEL" '(.spec.serviceAccountName==$sa) and ([.spec.containers[0].env[]?|select(.name=="TOCA_RELEASE_SHA")|.value]|first==$sha) and ([.spec.containers[0].env[]?|select(.name=="AG01_MODEL_PROVIDER")|.value]|first=="vertex") and ([.spec.containers[0].env[]?|select(.name=="AG01_VERTEX_MODEL")|.value]|first==$model)' evidence/revision.json >/dev/null
          IMAGE="$(jq -r '.spec.containers[0].image' evidence/revision.json)"; [[ "$IMAGE" == *"@$EXPECTED_IMAGE_DIGEST" ]] || exit 1
          if jq -e '.bindings[]?|select(.role=="roles/run.invoker")|(.members//[])[]?|select(.=="allUsers")' evidence/iam-before.json >/dev/null; then exit 1; fi
          BASE_URL="$(jq -r '.status.url' evidence/service-before.json)"
          TAG_URL="$(jq -r --arg tag "$CANDIDATE_TAG" '.status.traffic[]?|select(.tag==$tag)|.url' evidence/service-before.json)"
          ROLLBACK_REVISION="$(jq -r '.status.traffic[]?|select(.percent==100)|.revisionName' evidence/service-before.json | head -n1)"
          [[ -n "$BASE_URL" && -n "$TAG_URL" && -n "$ROLLBACK_REVISION" ]] || exit 1
          echo "BASE_URL=$BASE_URL" >> "$GITHUB_ENV"; echo "TAG_URL=$TAG_URL" >> "$GITHUB_ENV"; echo "ROLLBACK_REVISION=$ROLLBACK_REVISION" >> "$GITHUB_ENV"; echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Build R17 planning-only probe
        run: |
          set -euo pipefail
          cat > /tmp/probe.mjs <<'JS'
          const audience=process.env.BASE_URL; const target=process.env.TARGET_URL;
          const tokenResp=await fetch('http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/identity?audience='+encodeURIComponent(audience)+'&format=full',{headers:{'Metadata-Flavor':'Google'}});
          if(!tokenResp.ok) throw new Error(`TOKEN_${tokenResp.status}`); const token=(await tokenResp.text()).trim();
          const response=await fetch(target+'/v1/orchestrator/execute',{method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},body:JSON.stringify({idempotencyKey:process.env.PROBE_ID,message:'Technology system provider-readiness classification for R17 only. Do not propose or execute any capability. No external write, financial action, destructive action, or business side effect is requested.'})});
          const text=await response.text(); let body; try{body=JSON.parse(text)}catch{body={raw:text.slice(0,800)}};
          console.log('AG01_R17_HTTP_RESULT '+JSON.stringify({status:response.status,body}));
          if(response.status!==200 || body?.model!==process.env.EXPECTED_MODEL || typeof body?.modelResponseId!=='string' || !body.modelResponseId.length || !body?.orchestration) throw new Error(`R17_${JSON.stringify({status:response.status,body})}`);
          console.log('AG01_R17_PROD_PROBE '+JSON.stringify({status:'VERIFIED',target,model:body.model,modelResponseId:body.modelResponseId,routeId:body.orchestration.routeId,orchestrationStatus:body.orchestration.status,externalBusinessSideEffectExecuted:false}));
          JS
          echo "PROBE_B64=$(base64 -w0 /tmp/probe.mjs)" >> "$GITHUB_ENV"
      - name: Deploy runtime-identity probe
        run: |
          gcloud run jobs deploy "$PROBE_JOB" --project "$PROJECT_ID" --region "$REGION" --image "$IMAGE" --service-account "$RUNTIME_SERVICE_ACCOUNT" --command /bin/sh --args '-c,echo "$PROBE_B64" | base64 -d > /tmp/probe.mjs && node /tmp/probe.mjs' --set-env-vars "PROBE_B64=$PROBE_B64,BASE_URL=$BASE_URL,TARGET_URL=$TAG_URL,PROBE_ID=tag-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT},EXPECTED_MODEL=$EXPECTED_MODEL" --max-retries 0 --task-timeout 5m --quiet
      - name: Verify candidate tag on non-reserved route
        run: |
          set -euo pipefail
          TAG_EXEC="$(gcloud run jobs execute "$PROBE_JOB" --project "$PROJECT_ID" --region "$REGION" --wait --format='value(metadata.name)')"; echo "$TAG_EXEC" > evidence/tag-execution.txt
          sleep 3
          gcloud logging read 'resource.type="cloud_run_job" AND resource.labels.job_name="'$PROBE_JOB'" AND textPayload:"AG01_R17_PROD_PROBE"' --project "$PROJECT_ID" --freshness=10m --limit=30 --format=json > /tmp/taglogs.json
          jq -r '.[].textPayload//empty' /tmp/taglogs.json | grep 'AG01_R17_PROD_PROBE ' | head -n1 | sed 's/^.*AG01_R17_PROD_PROBE //' > evidence/tag-probe.json
          jq -e '.status=="VERIFIED" and .model=="gemini-2.5-flash" and (.modelResponseId|length>0) and .externalBusinessSideEffectExecuted==false' evidence/tag-probe.json >/dev/null
      - name: Promote exact candidate to 100 percent
        run: |
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --to-revisions "$CANDIDATE_REVISION=100" --quiet
      - name: Production base readback with rollback guard
        run: |
          set -euo pipefail
          rollback(){ gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --to-revisions "$ROLLBACK_REVISION=100" --quiet || true; }
          trap rollback ERR
          gcloud run jobs update "$PROBE_JOB" --project "$PROJECT_ID" --region "$REGION" --update-env-vars "TARGET_URL=$BASE_URL,PROBE_ID=prod-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --quiet
          PROD_EXEC="$(gcloud run jobs execute "$PROBE_JOB" --project "$PROJECT_ID" --region "$REGION" --wait --format='value(metadata.name)')"; echo "$PROD_EXEC" > evidence/production-execution.txt
          sleep 3
          gcloud logging read 'resource.type="cloud_run_job" AND resource.labels.job_name="'$PROBE_JOB'" AND textPayload:"AG01_R17_PROD_PROBE"' --project "$PROJECT_ID" --freshness=10m --limit=50 --format=json > /tmp/prodlogs.json
          jq -r '.[].textPayload//empty' /tmp/prodlogs.json | grep 'AG01_R17_PROD_PROBE ' | head -n1 | sed 's/^.*AG01_R17_PROD_PROBE //' > evidence/production-probe.json
          jq -e --arg target "$BASE_URL" '.status=="VERIFIED" and .target==$target and .model=="gemini-2.5-flash" and (.modelResponseId|length>0) and .externalBusinessSideEffectExecuted==false' evidence/production-probe.json >/dev/null
          trap - ERR
      - name: Final immutable closure
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > evidence/service-final.json
          gcloud run services get-iam-policy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > evidence/iam-final.json
          jq -e --arg rev "$CANDIDATE_REVISION" '.status.traffic[]?|select(.revisionName==$rev and .percent==100)' evidence/service-final.json >/dev/null
          if jq -e '.bindings[]?|select(.role=="roles/run.invoker")|(.members//[])[]?|select(.=="allUsers")' evidence/iam-final.json >/dev/null; then exit 1; fi
          RESPONSE_ID="$(jq -r '.modelResponseId' evidence/production-probe.json)"
          jq -n --arg sha "$AUTHORIZED_RUNTIME_SHA" --arg run "$GITHUB_RUN_ID" --arg rev "$CANDIDATE_REVISION" --arg digest "$EXPECTED_IMAGE_DIGEST" --arg response "$RESPONSE_ID" --arg sa "$RUNTIME_SERVICE_ACCOUNT" --arg url "$BASE_URL" '{schemaVersion:"toca.p2.2.ag01-production-closure.v5",status:"PRODUCTION_VERIFIED",runtimeSha:$sha,verificationRunId:$run,revision:$rev,imageDigest:$digest,provider:"google-vertex-ai",model:"gemini-2.5-flash",modelResponseId:$response,runtimeServiceAccount:$sa,serviceUrl:$url,verifiedPath:"/v1/orchestrator/execute",trafficPercent:100,unauthenticatedIngressAllowed:false,corePolicyApprovalAuthorityPreserved:true,externalBusinessSideEffectExecuted:false,cloudRunHealthzReadyzReservedPathKnownIssue:true,rollbackGuard:true}' > evidence/closure.json
      - name: Upload closure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ag01-production-r17-closure-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
          retention-days: 90
