name: Format Preview M-FOUND-04

on:
  push:
    branches:
      - feat/m-found-04-identity-authorization

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Render Prettier diff
        run: |
          pnpm exec prettier --write src/core/identity.ts
          git diff -- src/core/identity.ts
