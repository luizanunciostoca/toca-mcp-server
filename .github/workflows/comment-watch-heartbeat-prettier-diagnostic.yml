name: Comment Watch Heartbeat Prettier Diagnostic

on:
  pull_request:
    paths:
      - 'test/instagram-engagement-comment-canary-opportunity-watch-heartbeat.test.ts'
      - '.github/workflows/comment-watch-heartbeat-prettier-diagnostic.yml'

permissions:
  contents: read

jobs:
  prettier-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Print exact Prettier output
        run: pnpm exec prettier test/instagram-engagement-comment-canary-opportunity-watch-heartbeat.test.ts
