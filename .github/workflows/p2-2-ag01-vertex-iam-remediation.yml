name: P2.2 AG-01 Vertex IAM Remediation

on:
  push:
    branches: [ops/p2-2-ag01-vertex-20260828]
    paths: ['.github/workflows/p2-2-ag01-vertex-iam-remediation.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com

jobs:
  remediate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Authenticate to GCP via existing WIF deploy boundary
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Ensure Vertex AI API and minimum runtime role
        run: |
          set -euo pipefail
          mkdir -p p2-2-iam-evidence
          API_STATE="$(gcloud services describe aiplatform.googleapis.com --project "$PROJECT_ID" --format='value(state)' 2>/dev/null || true)"
          API_CHANGED=false
          if [ "$API_STATE" != 'ENABLED' ]; then
            gcloud services enable aiplatform.googleapis.com --project "$PROJECT_ID" --quiet
            API_CHANGED=true
            API_STATE='ENABLED'
          fi

          MEMBER="serviceAccount:$RUNTIME_SERVICE_ACCOUNT"
          ROLE='roles/aiplatform.user'
          ROLE_PRESENT="$(gcloud projects get-iam-policy "$PROJECT_ID" \
            --flatten='bindings[].members' \
            --filter="bindings.role=$ROLE AND bindings.members=$MEMBER" \
            --format='value(bindings.role)' | head -n 1 || true)"
          IAM_CHANGED=false
          if [ "$ROLE_PRESENT" != "$ROLE" ]; then
            gcloud projects add-iam-policy-binding "$PROJECT_ID" \
              --member="$MEMBER" \
              --role="$ROLE" \
              --condition=None \
              --quiet >/dev/null
            IAM_CHANGED=true
          fi

          VERIFIED_ROLE="$(gcloud projects get-iam-policy "$PROJECT_ID" \
            --flatten='bindings[].members' \
            --filter="bindings.role=$ROLE AND bindings.members=$MEMBER" \
            --format='value(bindings.role)' | head -n 1 || true)"
          test "$VERIFIED_ROLE" = "$ROLE"

          jq -n \
            --arg project "$PROJECT_ID" \
            --arg serviceAccount "$RUNTIME_SERVICE_ACCOUNT" \
            --arg role "$ROLE" \
            --arg apiState "$API_STATE" \
            --argjson apiChanged "$API_CHANGED" \
            --argjson iamChanged "$IAM_CHANGED" \
            --arg sourceSha "$GITHUB_SHA" \
            '{schemaVersion:"toca.p2.2.vertex-iam-remediation.v1",projectId:$project,runtimeServiceAccount:$serviceAccount,vertexApiState:$apiState,vertexApiChanged:$apiChanged,role:$role,iamChanged:$iamChanged,roleVerified:true,sourceSha:$sourceSha,secretRead:false}' \
            > p2-2-iam-evidence/iam-remediation.json

      - name: Upload IAM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p2-2-ag01-vertex-iam-${{ github.run_id }}
          path: p2-2-iam-evidence
          if-no-files-found: warn
          retention-days: 90
