name: Itacare Format Apply

on:
  push:
    branches:
      - feat/the-party-itacare-generative-campaign

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'style(video): apply prettier to Itacare campaign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Prettier to Itacare campaign files
        shell: bash
        run: |
          set -euo pipefail
          pnpm prettier --write \
            src/config/the-party-itacare-generative-campaign.ts \
            src/the-party-itacare-generative-campaign.ts \
            test/the-party-itacare-generative-campaign.test.ts
          git diff --check
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/config/the-party-itacare-generative-campaign.ts \
            src/the-party-itacare-generative-campaign.ts \
            test/the-party-itacare-generative-campaign.test.ts
          git commit -m 'style(video): apply prettier to Itacare campaign'
          git push origin HEAD:feat/the-party-itacare-generative-campaign
