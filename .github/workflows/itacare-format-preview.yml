name: Itacare Format Export

on:
  push:
    branches:
      - feat/the-party-itacare-generative-campaign

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact campaign files
        run: >-
          pnpm prettier --write
          src/config/the-party-itacare-generative-campaign.ts
          src/the-party-itacare-generative-campaign.ts
          test/the-party-itacare-generative-campaign.test.ts
      - name: Upload formatted sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: itacare-formatted-sources
          path: |
            src/config/the-party-itacare-generative-campaign.ts
            src/the-party-itacare-generative-campaign.ts
            test/the-party-itacare-generative-campaign.test.ts
          if-no-files-found: error
          retention-days: 1
