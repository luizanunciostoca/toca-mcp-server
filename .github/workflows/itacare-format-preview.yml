name: Itacare Format Preview

on:
  push:
    branches:
      - feat/the-party-itacare-generative-campaign

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format target files and emit base64
        shell: bash
        run: |
          set -euo pipefail
          pnpm prettier --write \
            src/config/the-party-itacare-generative-campaign.ts \
            src/the-party-itacare-generative-campaign.ts \
            test/the-party-itacare-generative-campaign.test.ts
          for file in \
            src/config/the-party-itacare-generative-campaign.ts \
            src/the-party-itacare-generative-campaign.ts \
            test/the-party-itacare-generative-campaign.test.ts; do
            echo "FORMAT_FILE_BEGIN=$file"
            base64 -w0 "$file"
            echo
            echo "FORMAT_FILE_END=$file"
          done
