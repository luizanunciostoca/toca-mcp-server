name: Temp Format Meta Ads 0904

on:
  push:
    branches:
      - feat/meta-ads-0904-add-two-activate
    paths:
      - '.github/workflows/tmp-format-meta-ads-0904.yml'

permissions:
  contents: write

jobs:
  format-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and push controller
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write src/meta-ads-the-party-2026-09-04-add-two-activate.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/meta-ads-the-party-2026-09-04-add-two-activate.ts
          if git diff --cached --quiet; then
            echo 'CONTROLLER_ALREADY_FORMATTED=1'
            exit 0
          fi
          git commit -m 'style(meta-ads): format activation controller'
          git push origin HEAD:feat/meta-ads-0904-add-two-activate
