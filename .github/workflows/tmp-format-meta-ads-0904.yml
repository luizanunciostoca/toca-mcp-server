name: Temp Format Meta Ads 0904

on:
  push:
    branches:
      - feat/meta-ads-0904-add-two-activate

permissions:
  contents: read

jobs:
  format-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and print file
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write src/meta-ads-the-party-2026-09-04-add-two-activate.ts
          echo 'FORMATTED_FILE_BEGIN'
          base64 -w0 src/meta-ads-the-party-2026-09-04-add-two-activate.ts
          echo
          echo 'FORMATTED_FILE_END'
