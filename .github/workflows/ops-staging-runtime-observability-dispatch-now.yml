name: Ops Staging Runtime Observability Dispatch Now 2026-08-22

on:
  pull_request:
    paths: ['.github/workflows/ops-staging-runtime-observability-dispatch-now.yml']

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact governed runtime observability workflow
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_SHA256: 7a128f29daca168e90f065a56eacc5fb206bde9a061b680aff789a17474dd9a1
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'luizanunciostoca/toca-mcp-server'
          DISPATCH_URL="$(gh workflow run staging-runtime-observability.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f expected_policy_sha256="$POLICY_SHA256")"
          echo "RUNTIME_OBSERVABILITY_CHILD_URL=${DISPATCH_URL}"
          CHILD_ID="${DISPATCH_URL##*/}"
          [[ "$CHILD_ID" =~ ^[0-9]+$ ]]
          echo "RUNTIME_OBSERVABILITY_CHILD_RUN=${CHILD_ID}"
