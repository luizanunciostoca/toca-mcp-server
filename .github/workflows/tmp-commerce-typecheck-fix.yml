name: Temporary Commerce Typecheck Fix

on:
  push:
    branches:
      - feat/commerce-provider-boundary

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/commerce-provider-boundary
      - name: Fix qualification fixture
        run: sed -i "s/qualification: 'QUALIFIED'/qualification: 'SALES_QUALIFIED'/" test/commerce-provider-r31-feedback.test.ts
      - name: Commit fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "TOCA OS Integration"
          git config user.email "actions@users.noreply.github.com"
          git add test/commerce-provider-r31-feedback.test.ts
          git commit -m "test(measurement): align R31 qualification fixture contract"
          git push origin HEAD:feat/commerce-provider-boundary
