name: TEMP Comment Watch Hardening Apply

on:
  push:
    branches: [fix/comment-opportunity-watch-log-propagation]
    paths:
      - .github/workflows/temp-comment-watch-hardening-apply.yml

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/comment-opportunity-watch-log-propagation
          persist-credentials: false
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply patch and repository formatting
        shell: bash
        run: |
          set -euo pipefail
          python .github/temp-comment-watch-hardening-apply.py
          pnpm install --frozen-lockfile
          pnpm exec prettier --write .github/workflows/instagram-engagement-comment-canary-opportunity-watch.yml test/instagram-engagement-comment-canary-opportunity-watch.test.ts
          git diff --check
          mkdir -p /tmp/comment-watch-patch/.github/workflows /tmp/comment-watch-patch/test
          cp .github/workflows/instagram-engagement-comment-canary-opportunity-watch.yml /tmp/comment-watch-patch/.github/workflows/
          cp test/instagram-engagement-comment-canary-opportunity-watch.test.ts /tmp/comment-watch-patch/test/
      - name: Upload exact formatted patch files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: comment-watch-hardening-${{ github.run_id }}
          path: /tmp/comment-watch-patch
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1