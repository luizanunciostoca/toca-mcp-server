name: TEMP Instagram Limited Readback Fix

on:
  push:
    branches:
      - fix/instagram-limited-zero-traffic-readback-v3

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/instagram-limited-zero-traffic-readback-v3
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Patch bounded zero-traffic readback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/instagram-engagement-limited-activation.yml')
          text = workflow_path.read_text()
          old = '''      - name: Verify zero-traffic candidate before cutover
        env:
          RUNTIME_IMAGE: ${{ steps.auth.outputs.runtime_image }}
          RUNTIME_DIGEST: ${{ steps.auth.outputs.runtime_digest }}
          CANDIDATE_REVISION: ${{ steps.stage.outputs.candidate_revision }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_REVISION"
          REVISION_JSON="$(gcloud run revisions describe "$CANDIDATE_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$REVISION_JSON" | jq -e \\
            --arg digest "$RUNTIME_DIGEST" \\
            --arg sa "$GCP_RUNTIME_SERVICE_ACCOUNT" \\
            --arg sources "$KB_SOURCE_IDS" '\n              .spec.containers[0] as $c |\n              (.spec.serviceAccountName == $sa) and\n              ($c.image | contains($digest)) and\n              ($c.command == ["node"]) and\n              ($c.args == ["dist/src/toca-managed-instagram-daemon.js"]) and\n              (([($c.env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_RUNTIME_ENABLED") | .value] | last) == "true") and\n              (([($c.env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_WRITES_ENABLED") | .value] | last) == "true") and\n              (([($c.env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_BATCH_SIZE") | .value] | last) == "1") and\n              (([($c.env // [])[] | select(.name == "INSTAGRAM_PUBLICATION_WRITES_ENABLED") | .value] | last) == "false") and\n              (([($c.env // [])[] | select(.name == "META_PROVIDER_VERIFIED") | .value] | last) == "true") and\n              (([($c.env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_KB_SOURCE_IDS") | .value] | last) == $sources)\n            ' >/dev/null

          SERVICE_JSON="$(gcloud run services describe "$DAEMON_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$SERVICE_JSON" | jq -e --arg candidate "$CANDIDATE_REVISION" '\n            ([.status.traffic[]? | select((.revisionName // "") == $candidate) | (.percent // 0)] | add // 0) == 0 and\n            .status.latestReadyRevisionName == $candidate\n          ' >/dev/null
          echo 'INSTAGRAM_ENGAGEMENT_LIMITED_ZERO_TRAFFIC_STAGE=PASS'
'''
          new = '''      - name: Verify zero-traffic candidate before cutover
        env:
          RUNTIME_IMAGE: ${{ steps.auth.outputs.runtime_image }}
          RUNTIME_DIGEST: ${{ steps.auth.outputs.runtime_digest }}
          CANDIDATE_REVISION: ${{ steps.stage.outputs.candidate_revision }}
          PRE_REVISION: ${{ steps.prestate.outputs.pre_revision }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_REVISION"
          test -n "$PRE_REVISION"

          REVISION_JSON="$(gcloud run revisions describe "$CANDIDATE_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          require_revision() {
            local label="$1"
            local expression="$2"
            if ! printf '%s' "$REVISION_JSON" | jq -e \\
              --arg digest "$RUNTIME_DIGEST" \\
              --arg sa "$GCP_RUNTIME_SERVICE_ACCOUNT" \\
              --arg sources "$KB_SOURCE_IDS" "$expression" >/dev/null; then
              echo "LIMITED_ZERO_TRAFFIC_REVISION_CHECK_FAILED=$label" >&2
              return 1
            fi
          }

          require_revision ready '([.status.conditions[]? | select(.type == "Ready") | .status] | last) == "True"'
          require_revision service_account '(.spec.serviceAccountName // .spec.template.spec.serviceAccountName // "") == $sa'
          require_revision image '.spec.containers[0].image | contains($digest)'
          require_revision command '.spec.containers[0].command == ["node"]'
          require_revision args '.spec.containers[0].args == ["dist/src/toca-managed-instagram-daemon.js"]'
          require_revision runtime_enabled '([(.spec.containers[0].env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_RUNTIME_ENABLED") | .value] | last) == "true"'
          require_revision writes_enabled '([(.spec.containers[0].env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_WRITES_ENABLED") | .value] | last) == "true"'
          require_revision batch_size '([(.spec.containers[0].env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_BATCH_SIZE") | .value] | last) == "1"'
          require_revision publication_writes '([(.spec.containers[0].env // [])[] | select(.name == "INSTAGRAM_PUBLICATION_WRITES_ENABLED") | .value] | last) == "false"'
          require_revision provider_verified '([(.spec.containers[0].env // [])[] | select(.name == "META_PROVIDER_VERIFIED") | .value] | last) == "true"'
          require_revision knowledge_source '([(.spec.containers[0].env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_KNOWLEDGE_SOURCE") | .value] | last) == "postgres"'
          require_revision kb_sources '([(.spec.containers[0].env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_KB_SOURCE_IDS") | .value] | last) == $sources'

          CONVERGED=false
          for attempt in $(seq 1 12); do
            SERVICE_JSON="$(gcloud run services describe "$DAEMON_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
            if printf '%s' "$SERVICE_JSON" | jq -e \\
              --arg candidate "$CANDIDATE_REVISION" \\
              --arg previous "$PRE_REVISION" '\n                ([.status.traffic[]? | select((.revisionName // "") == $candidate) | (.percent // 0)] | add // 0) == 0 and\n                ([.status.traffic[]? | select((.revisionName // "") == $previous) | (.percent // 0)] | add // 0) == 100 and\n                .status.latestReadyRevisionName == $candidate\n              ' >/dev/null; then
              CONVERGED=true
              break
            fi
            sleep 3
          done
          test "$CONVERGED" = 'true' || {
            echo 'LIMITED_ZERO_TRAFFIC_SERVICE_CONVERGENCE=FAIL' >&2
            exit 1
          }
          echo 'INSTAGRAM_ENGAGEMENT_LIMITED_ZERO_TRAFFIC_STAGE=PASS'
'''
          assert old in text, 'expected zero-traffic verification block not found'
          workflow_path.write_text(text.replace(old, new, 1))

          test_path = Path('test/instagram-engagement-limited-activation.test.ts')
          test = test_path.read_text()
          old_test = '''    expect(workflow).toContain('.status.latestReadyRevisionName == $candidate');
    expect(workflow).toContain('== 0 and');
'''
          new_test = '''    expect(workflow).toContain('require_revision ready');
    expect(workflow).toContain('require_revision knowledge_source');
    expect(workflow).toContain('for attempt in $(seq 1 12)');
    expect(workflow).toContain('.status.latestReadyRevisionName == $candidate');
    expect(workflow).toContain('--arg previous "$PRE_REVISION"');
    expect(workflow).toContain('== 0 and');
    expect(workflow).toContain('== 100 and');
    expect(workflow).toContain('LIMITED_ZERO_TRAFFIC_SERVICE_CONVERGENCE=FAIL');
'''
          assert old_test in test, 'expected test marker block not found'
          test_path.write_text(test.replace(old_test, new_test, 1))
          PY
          pnpm install --frozen-lockfile
          pnpm exec prettier --write .github/workflows/instagram-engagement-limited-activation.yml test/instagram-engagement-limited-activation.test.ts
          pnpm typecheck
          pnpm exec vitest run test/instagram-engagement-limited-activation.test.ts
          git diff --check
      - name: Commit bounded readback fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/instagram-engagement-limited-activation.yml test/instagram-engagement-limited-activation.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(instagram): tolerate bounded Cloud Run status convergence'
          git push origin HEAD:fix/instagram-limited-zero-traffic-readback-v3
