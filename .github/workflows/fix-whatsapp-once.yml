name: Fix WhatsApp Once

on:
  push:
    branches:
      - feat/next-whatsapp-real-20260820

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply integration fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}, got {text.count(old)}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'src/omnichannel/whatsapp-runtime.ts',
              """        approvalId: input.eligibility.approval?.approvalId,\n        externalResourceId: submitted.providerMessageId ?? undefined,\n""",
              """        ...(input.eligibility.approval\n          ? { approvalId: input.eligibility.approval.approvalId }\n          : {}),\n        ...(submitted.providerMessageId\n          ? { externalResourceId: submitted.providerMessageId }\n          : {}),\n""",
          )
          replace_once(
              'src/omnichannel/whatsapp-runtime.ts',
              """        approvalId: input.eligibility.approval?.approvalId,\n        errorCode: failure.errorCode,\n""",
              """        ...(input.eligibility.approval\n          ? { approvalId: input.eligibility.approval.approvalId }\n          : {}),\n        errorCode: failure.errorCode,\n""",
          )
          replace_once(
              'src/persistence/postgres-crm-communication-store.ts',
              """        `update crm_conversations set\n           status='HUMAN_HANDOFF', human_handoff_at=coalesce(human_handoff_at,$5::timestamptz),\n           human_handoff_reason=coalesce(human_handoff_reason,$6), version=version+1,\n           updated_at=$5::timestamptz\n""",
              """        `update crm_conversations set\n           status='HUMAN_HANDOFF',\n           human_handoff_at=coalesce(human_handoff_at,$5::timestamptz),\n           human_handoff_reason=coalesce(human_handoff_reason,$6),\n           version=case\n             when status='HUMAN_HANDOFF' and human_handoff_reason=$6 then version\n             else version+1\n           end,\n           updated_at=case\n             when status='HUMAN_HANDOFF' and human_handoff_reason=$6 then updated_at\n             else $5::timestamptz\n           end\n""",
          )
          replace_once(
              'src/http-server.ts',
              """import { createTocaServer, SERVER_NAME, SERVER_VERSION } from './server.js';\n""",
              """import {\n  parseWhatsAppWebhookEvents,\n  type WhatsAppWebhookEvent,\n} from './providers/whatsapp/whatsapp-cloud-webhook.js';\nimport { createTocaServer, SERVER_NAME, SERVER_VERSION } from './server.js';\n""",
          )
          replace_once(
              'src/http-server.ts',
              """  onEvents?: (events: readonly InstagramWebhookEvent[]) => Promise<void> | void;\n}\n""",
              """  onEvents?: (events: readonly InstagramWebhookEvent[]) => Promise<void> | void;\n  onWhatsAppEvents?: (events: readonly WhatsAppWebhookEvent[]) => Promise<void> | void;\n}\n""",
          )
          replace_once(
              'src/http-server.ts',
              """  const events = parseMetaWebhookEvents(rawBody);\n  await options.metaWebhook!.onEvents?.(events);\n\n  response.writeHead(200, {\n""",
              """  const events = parseMetaWebhookEvents(rawBody);\n  const whatsAppEvents = parseWhatsAppWebhookEvents(rawBody);\n  await options.metaWebhook!.onEvents?.(events);\n  await options.metaWebhook!.onWhatsAppEvents?.(whatsAppEvents);\n\n  response.writeHead(200, {\n""",
          )
          PY
          pnpm exec prettier --write src/http-server.ts src/omnichannel/whatsapp-runtime.ts src/persistence/postgres-crm-communication-store.ts
      - name: Commit fixes when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/http-server.ts src/omnichannel/whatsapp-runtime.ts src/persistence/postgres-crm-communication-store.ts
          git commit -m "fix(whatsapp): harden idempotency and Meta webhook integration"
          git push origin HEAD:feat/next-whatsapp-real-20260820
