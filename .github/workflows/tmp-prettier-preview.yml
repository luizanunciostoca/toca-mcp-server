name: Temporary Prettier Preview

on:
  push:
    branches:
      - feat/instagram-publication-readiness-preflight
    paths:
      - '.github/workflows/tmp-prettier-preview.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print canonical Prettier output
        run: pnpm prettier src/providers/instagram/instagram-publication-readiness-preflight.ts
