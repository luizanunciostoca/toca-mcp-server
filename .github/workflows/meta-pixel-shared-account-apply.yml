name: Meta Pixel Shared Account Apply
on:
  push:
    branches: [main]
    paths: [control/meta-pixel-shared-account.apply]
permissions:
  contents: read
  id-token: write
env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  META_TOKEN_SECRET_ID: toca-meta-oauth-token
  META_GRAPH_BASE_URL: https://graph.facebook.com
  META_GRAPH_API_VERSION: v24.0
  META_AD_ACCOUNT_ID: '311793958882290'
  META_PIXEL_ID: '461233076843065'
  META_BUSINESS_ID: '232421267344387'
  EXISTING_SHARED_ACCOUNT_ID: '394512749760530'
  EXPECTED_MARKER: APPLY_PIXEL_461233076843065_TO_ACCOUNT_311793958882290_BUSINESS_232421267344387
  IMAGE: southamerica-east1-docker.pkg.dev/toca-mcp-production/toca-mcp/server:meta-ads-smoke-4f26826402e7455a6281b30efd1b1a75b07844da
jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Validate exact one-file authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(tr -d '\r\n' < control/meta-pixel-shared-account.apply)" = "$EXPECTED_MARKER"
          test "$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")" = "control/meta-pixel-shared-account.apply"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Apply exact shared-account edge and verify provider state
        shell: bash
        run: |
          set -euo pipefail
          JOB="pixel-share-apply-${GITHUB_RUN_ID}"
          trap 'gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true' EXIT
          CODE='const t=process.env.META_TOKEN,b=process.env.BASE,v=process.env.VER,a=process.env.ACCOUNT,p=process.env.PIXEL,x=process.env.BUSINESS,e=process.env.EXISTING; async function get(path,q={}){const u=new URL(`${b}/${v}/${path}`);for(const[k,z]of Object.entries(q))u.searchParams.set(k,String(z));const r=await fetch(u,{headers:{Authorization:`Bearer ${t}`}});const j=await r.json();if(!r.ok)throw new Error(`GET_${path}_${r.status}_${JSON.stringify(j)}`);return j} async function post(path,values){const r=await fetch(`${b}/${v}/${path}`,{method:"POST",headers:{Authorization:`Bearer ${t}`,"content-type":"application/x-www-form-urlencoded"},body:new URLSearchParams(values).toString()});const j=await r.json();if(!r.ok)throw new Error(`POST_${path}_${r.status}_${JSON.stringify(j)}`);return j} const op=await get(`${x}/owned_pixels`,{fields:"id,name",limit:100});const ca=await get(`${x}/client_ad_accounts`,{fields:"id,account_id,name,currency,account_status",limit:100});const before=await get(`${p}/shared_accounts`,{business:x,fields:"id,account_id,name,currency,account_status",limit:100});const ids=q=>(q.data||[]).map(z=>String(z.account_id||z.id).replace(/^act_/,""));const owns=(op.data||[]).some(z=>String(z.id)===p);const client=(ca.data||[]).find(z=>String(z.account_id||z.id).replace(/^act_/,"")===a);if(!owns||!client||client.currency!=="BRL"||Number(client.account_status)!==1)throw new Error("PIXEL_SHARE_PRECONDITION_FAILED");if(ids(before).includes(a))throw new Error("PIXEL_SHARE_ALREADY_PRESENT");if(!ids(before).includes(e))throw new Error("PIXEL_SHARE_EXISTING_EDGE_MISSING");const mutation=await post(`${p}/shared_accounts`,{account_id:a,business:x});let after;for(let i=0;i<12;i++){after=await get(`${p}/shared_accounts`,{business:x,fields:"id,account_id,name,currency,account_status",limit:100});if(ids(after).includes(a))break;await new Promise(r=>setTimeout(r,5000));}if(!ids(after).includes(a))throw new Error("PIXEL_SHARE_POST_VERIFY_MISSING_TARGET");if(!ids(after).includes(e))throw new Error("PIXEL_SHARE_POST_VERIFY_EXISTING_EDGE_LOST");console.log(`PIXEL_SHARE_APPLY_RESULT=${JSON.stringify({business:x,pixel:p,account:a,before:ids(before),after:ids(after),mutation})}`);'
          gcloud run jobs deploy "$JOB" --image "$IMAGE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" --command node --args "^~^-e~$CODE" --set-secrets "META_TOKEN=$META_TOKEN_SECRET_ID:latest" --set-env-vars "^~^BASE=$META_GRAPH_BASE_URL~VER=$META_GRAPH_API_VERSION~ACCOUNT=$META_AD_ACCOUNT_ID~PIXEL=$META_PIXEL_ID~BUSINESS=$META_BUSINESS_ID~EXISTING=$EXISTING_SHARED_ACCOUNT_ID" --tasks 1 --max-retries 0 --task-timeout 180s --quiet
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet
          LINE=""
          for i in $(seq 1 12); do LINE="$(gcloud logging read "resource.type=cloud_run_job AND resource.labels.job_name=${JOB} AND textPayload:\"PIXEL_SHARE_APPLY_RESULT=\"" --project "$GCP_PROJECT_ID" --freshness=10m --limit=10 --order=desc --format='value(textPayload)' | grep PIXEL_SHARE_APPLY_RESULT= | head -n1 || true)"; [ -n "$LINE" ] && break; sleep 5; done
          test -n "$LINE"
          JSON="${LINE#PIXEL_SHARE_APPLY_RESULT=}"
          printf '%s\n' "$JSON" | jq . > pixel-share-apply.json
          printf '%s\n' "$JSON" | jq -e --arg a "$META_AD_ACCOUNT_ID" --arg e "$EXISTING_SHARED_ACCOUNT_ID" '(.after|index($a)) != null and (.after|index($e)) != null' >/dev/null
          cat pixel-share-apply.json
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-share-apply-${{ github.sha }}
          path: pixel-share-apply.json
          retention-days: 180
