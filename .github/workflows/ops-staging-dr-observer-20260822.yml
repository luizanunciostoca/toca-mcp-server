name: Ops Staging DR Observer 2026-08-22

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ops-staging-dr-observer-20260822.yml'

permissions:
  contents: read
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Locate emergency cleanup push run
        env:
          GH_TOKEN: ${{ github.token }}
          CLEANUP_HEAD_SHA: bca38be14f4618f00abcbcea74abe6dff073fbee
          OBSERVER_SEQUENCE: '4'
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${CLEANUP_HEAD_SHA}&per_page=20" > /tmp/runs.json
          COUNT="$(jq '[.workflow_runs[] | select(.name=="Ops Staging DR Emergency Cleanup 2026-08-22" and .event=="push")] | length' /tmp/runs.json)"
          test "$COUNT" -ge 1
          jq -r '.workflow_runs[] | select(.name=="Ops Staging DR Emergency Cleanup 2026-08-22" and .event=="push") | "EMERGENCY_CLEANUP_RUN_ID=\(.id) status=\(.status) conclusion=\(.conclusion // "") head=\(.head_sha)"' /tmp/runs.json
