name: Ops Staging DR Observer 2026-08-22

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ops-staging-dr-observer-20260822.yml'

permissions:
  contents: read
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact V5 rescue cleanup run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'luizanunciostoca/toca-mcp-server'
          RUNS="$(gh run list \
            --repo "$GH_REPO" \
            --workflow 'Ops Staging DR V5 Rescue Cleanup 2026-08-22' \
            --branch 'ops/staging-dr-authorized-20260822' \
            --event push \
            --limit 10 \
            --json databaseId,headSha,status,conclusion,createdAt,updatedAt,url)"
          echo "$RUNS" | jq -e --arg sha '0b06e4e7fafc2d284f55cc2900facbfa24406169' '[.[] | select(.headSha==$sha)] | length == 1' >/dev/null
          MATCH="$(echo "$RUNS" | jq -r --arg sha '0b06e4e7fafc2d284f55cc2900facbfa24406169' '.[] | select(.headSha==$sha) | [.databaseId,.status,(.conclusion // ""),.url] | @tsv')"
          IFS=$'\t' read -r RUN_ID RUN_STATUS RUN_CONCLUSION RUN_URL <<< "$MATCH"
          test -n "$RUN_ID"
          echo "DR_V5_RESCUE_RUN_ID=$RUN_ID DR_V5_RESCUE_STATUS=$RUN_STATUS DR_V5_RESCUE_CONCLUSION=$RUN_CONCLUSION DR_V5_RESCUE_URL=$RUN_URL"
