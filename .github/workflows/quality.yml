name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Generate regional Cloud Run v1 remediation artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/deploy-gcp.yml')
          source = path.read_text()
          old = 'https://run.googleapis.com/apis/serving.knative.dev/v1/namespaces/${GCP_PROJECT_ID}/revisions/${SERVING_REVISION}'
          new = 'https://${GCP_REGION}-run.googleapis.com/apis/serving.knative.dev/v1/namespaces/${GCP_PROJECT_NUMBER}/revisions/${SERVING_REVISION}'
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy global v1 URL, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
      - name: Upload regional Cloud Run v1 remediation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regional-v1-remediation-${{ github.event.pull_request.head.sha || github.sha }}
          path: .github/workflows/deploy-gcp.yml
          if-no-files-found: error
          retention-days: 1
      - name: Restore source after remediation artifact
        run: git checkout -- .github/workflows/deploy-gcp.yml
      - name: Verify exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify permanent workflow supply chain
        run: node scripts/check-workflow-supply-chain.mjs
      - name: Verify platform hardening contracts
        run: node scripts/platform-hardening-check.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Architecture check
        run: pnpm architecture:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
