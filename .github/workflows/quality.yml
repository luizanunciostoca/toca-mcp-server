name: Quality Gate

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-runtime-db-remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Materialize permanent deploy workflow
        run: |
          set -euo pipefail
          python3 scripts/stage-runtime-db-bundle.py
          pnpm exec prettier --write .github/workflows/deploy-gcp.yml
      - name: Finalize permanent remediation commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git checkout "$BASE_SHA" -- .github/workflows/quality.yml package.json
          rm -f scripts/stage-runtime-db-bundle.py .toca/tmp/runtime-db-stager-trigger.txt

          EXPECTED="$(git diff --name-only "$BASE_SHA" | sort)"
          REQUIRED="$(printf '%s\n' '.github/workflows/deploy-gcp.yml' 'Dockerfile' 'scripts/capture-platform-evidence.mjs' 'test/gcp-deploy-cloud-sql-proxy.test.ts' | sort)"
          printf '%s\n' "$EXPECTED"
          [[ "$EXPECTED" == "$REQUIRED" ]] || {
            echo 'Refusing finalization: remediation diff is not exactly the four permanent files' >&2
            exit 1
          }

          pnpm exec prettier --check .github/workflows/deploy-gcp.yml scripts/capture-platform-evidence.mjs test/gcp-deploy-cloud-sql-proxy.test.ts
          pnpm vitest run test/gcp-deploy-cloud-sql-proxy.test.ts
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(deploy): run production DB operations under runtime identity'
          git push origin "HEAD:${HEAD_BRANCH}"
