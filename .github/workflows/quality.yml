name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: M-FOUND-02 deterministic format preview
        run: |
          files=(
            src/core/tool-registry.ts
            src/governance/capability-catalog.ts
            src/governance/capability-contract-overrides.ts
            src/governance/capability-lifecycle.ts
            src/governance/types.ts
            test/capability-lifecycle.test.ts
          )
          pnpm exec prettier --write "${files[@]}"
          git diff -- "${files[@]}"
      - name: Format check
        run: pnpm format:check
      - name: Architecture check
        run: pnpm architecture:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
