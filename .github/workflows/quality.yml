name: Quality Gate

on:
  pull_request:

permissions:
  contents: write

jobs:
  update-runtime-db-hardening-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0
      - name: Replace stale production migration contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/platform-hardening-check.mjs')
          text = path.read_text()
          anchor = "const deploy = '.github/workflows/deploy-gcp.yml';"
          start = text.index(anchor)
          end = text.index("const stagingDeploy = '.github/workflows/deploy-gcp-staging-canonical.yml';", start)
          production = text[start:end]
          old = "  'pnpm migrate',\n"
          replacement = (
              "  'Apply repository migrations through runtime identity job',\n"
              "  '--args dist/scripts/migrate.js',\n"
              "  'DATABASE_MIGRATION_JOB_CLEANUP=PASS',\n"
          )
          if production.count(old) != 1:
              raise SystemExit('unexpected production migration contract shape')
          production = production.replace(old, replacement, 1)
          text = text[:start] + production + text[end:]
          path.write_text(text)
          PY
          node scripts/platform-hardening-check.mjs
          git diff --check
          test "$(git diff --name-only)" = "scripts/platform-hardening-check.mjs"
      - name: Commit hardening contract only
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add scripts/platform-hardening-check.mjs
          test "$(git diff --cached --name-only)" = "scripts/platform-hardening-check.mjs"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(hardening): require runtime-identity DB migrations'
          git push origin "HEAD:${HEAD_BRANCH}"
