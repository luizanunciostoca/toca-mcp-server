name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  crm-sales-strict-type-repair:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/next-crm-sales-engine-advanced-20260820'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout CRM branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/next-crm-sales-engine-advanced-20260820
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Repair strict optional and mutation metadata typing
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          runtime = Path('src/crm/runtime.ts')
          text = runtime.read_text()
          old = "return services.sales.resolveContact({ ...scope, channels: input.channels });"
          if old in text:
              text = text.replace(
                  old,
                  """return services.sales.resolveContact({
          ...scope,
          channels: input.channels.map((channel) => ({
            channelType: channel.channelType,
            value: channel.value,
            ...(channel.provider !== undefined ? { provider: channel.provider } : {}),
          })),
        });""",
                  1,
              )
          old = """preferredOwnerPrincipalId: input.preferredOwnerPrincipalId,
              })"""
          if old in text:
              text = text.replace(
                  old,
                  """...(input.preferredOwnerPrincipalId !== undefined
                  ? { preferredOwnerPrincipalId: input.preferredOwnerPrincipalId }
                  : {}),
              })""",
                  1,
              )
          old = """humanOverride: input.humanOverride,
          });"""
          if old in text:
              text = text.replace(
                  old,
                  """...(input.humanOverride !== undefined
              ? { humanOverride: input.humanOverride }
              : {}),
          });""",
                  1,
              )
          runtime.write_text(text)

          store = Path('src/persistence/postgres-crm-sales-store.ts')
          text = store.read_text()
          if 'type CrmSalesMutationMetadata =' not in text:
              text = text.replace('Required<CrmMutationMetadata>', 'CrmSalesMutationMetadata')
              marker = 'interface ContactCandidateRow {'
              if marker not in text:
                  raise SystemExit('CRM_STORE_ALIAS_MARKER_NOT_FOUND')
              text = text.replace(
                  marker,
                  "type CrmSalesMutationMetadata = Required<Omit<CrmMutationMetadata, 'now'>>;\n\n" + marker,
                  1,
              )
          text = re.sub(
              r"nullableCrmText\(([^,()]+),\s*'CRM_[A-Z0-9_]+'\)",
              r"nullableCrmText(\1)",
              text,
          )
          store.write_text(text)
          PY
      - name: Validate repaired sources
        run: |
          pnpm exec prettier --write src/crm/runtime.ts src/persistence/postgres-crm-sales-store.ts
          pnpm exec eslint src/crm/runtime.ts src/persistence/postgres-crm-sales-store.ts
          pnpm typecheck
      - name: Commit source repair only
        run: |
          if git diff --quiet -- src/crm/runtime.ts src/persistence/postgres-crm-sales-store.ts; then
            echo 'CRM_SALES_STRICT_TYPES_ALREADY_REPAIRED=1'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/crm/runtime.ts src/persistence/postgres-crm-sales-store.ts
          git commit -m 'fix(crm): satisfy strict runtime and store typing'
          git push origin HEAD:feat/next-crm-sales-engine-advanced-20260820

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify permanent workflow supply chain
        run: node scripts/check-workflow-supply-chain.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Architecture check
        run: pnpm architecture:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
