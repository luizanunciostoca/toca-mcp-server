name: Instagram Engagement Webhook Runtime Alignment

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: write
  id-token: write

concurrency:
  group: ${{ github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'PRODUCTION AUTHORIZATION — Instagram webhook runtime alignment AUTO') && 'instagram-engagement-webhook-callback-control' || format('instagram-webhook-runtime-align-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_ARTIFACT_REPOSITORY: toca-mcp
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  TOKEN_SECRET_ID: toca-meta-oauth-token
  META_APP_SECRET_ID: toca-meta-app-secret
  WEBHOOK_SERVICE_NAME: toca-webhook-next-production
  INSTAGRAM_PAGE_ID: '306103746115875'
  META_APP_ID: '2281930145887404'

jobs:
  align:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'PRODUCTION AUTHORIZATION — Instagram webhook runtime alignment AUTO')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact alignment controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Validate live owner authorization stable main and exact build receipt
        id: auth
        shell: bash
        run: bash .github/scripts/instagram-engagement-webhook-runtime-align.sh authorize

      - name: Authenticate governed deployer
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Configure existing registry authentication
        shell: bash
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - name: Capture immutable image and exact serving prestate
        id: prestate
        shell: bash
        run: bash .github/scripts/instagram-engagement-webhook-runtime-align.sh prestate

      - name: Persist sanitized recovery context before service mutation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webhook-runtime-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/webhook-runtime-align-${{ github.run_id }}-${{ github.run_attempt }}/sanitized-context.json
          if-no-files-found: error
          retention-days: 90

      - name: Consume single-use authorization before mutation
        shell: bash
        run: bash .github/scripts/instagram-engagement-webhook-runtime-align.sh consume

      - name: Clone serving revision and stage own tagged candidate at zero traffic
        id: stage
        shell: bash
        run: bash .github/scripts/instagram-engagement-webhook-runtime-align.sh stage

      - name: Require real candidate health and ready responses at zero traffic
        id: probe
        shell: bash
        run: bash .github/scripts/instagram-engagement-webhook-runtime-align.sh probe

      - name: Promote healthy candidate using fresh service resource version
        id: promote
        shell: bash
        run: bash .github/scripts/instagram-engagement-webhook-runtime-align.sh promote

      - name: Verify public runtime and callback provider GET readback
        id: verify
        shell: bash
        run: bash .github/scripts/instagram-engagement-webhook-runtime-align.sh verify

      - name: Restore previous traffic only while this candidate still owns it
        if: (failure() || cancelled()) && steps.prestate.outcome == 'success'
        shell: bash
        run: bash .github/scripts/instagram-engagement-webhook-runtime-align.sh rollback

      - name: Remove only the temporary tag belonging to this instance
        if: always() && steps.prestate.outcome == 'success'
        shell: bash
        run: bash .github/scripts/instagram-engagement-webhook-runtime-align.sh cleanup

      - name: Publish sanitized acceptance and compensation evidence
        if: always() && steps.auth.outputs.authorization_issue != ''
        shell: bash
        run: bash .github/scripts/instagram-engagement-webhook-runtime-align.sh report
