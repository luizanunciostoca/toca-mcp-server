name: Instagram Conversation Shadow Controller Apply

on:
  push:
    branches:
      - feat/instagram-conversation-shadow-controller-v1-20260903

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/instagram-conversation-shadow-controller-v1-20260903
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply deterministic controller transform
        run: python .github/scripts/apply-instagram-conversation-shadow-controller.py

      - name: Format exact changed controller files
        run: >-
          pnpm exec prettier --write
          .github/workflows/instagram-engagement-shadow-production.yml
          test/instagram-engagement-shadow-drs-continuation.test.ts
          test/instagram-conversation-shadow-controller.test.ts

      - name: Stage transformed blobs in neutral paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/generated-shadow-controller
          cp .github/workflows/instagram-engagement-shadow-production.yml \
            control/generated-shadow-controller/instagram-engagement-shadow-production.yml
          cp test/instagram-engagement-shadow-drs-continuation.test.ts \
            control/generated-shadow-controller/instagram-engagement-shadow-drs-continuation.test.ts
          cp test/instagram-conversation-shadow-controller.test.ts \
            control/generated-shadow-controller/instagram-conversation-shadow-controller.test.ts

      - name: Publish neutral transformed blobs only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control/generated-shadow-controller/
          git diff --cached --quiet && { echo 'Expected generated blobs missing' >&2; exit 1; }
          git commit -m "chore(instagram): publish transformed shadow controller blobs"
          git push origin HEAD:feat/instagram-conversation-shadow-controller-v1-20260903
