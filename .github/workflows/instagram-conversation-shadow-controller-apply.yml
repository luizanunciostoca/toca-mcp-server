name: Instagram Conversation Shadow Controller Apply

on:
  push:
    branches:
      - feat/instagram-conversation-shadow-controller-v1-20260903

permissions:
  contents: read

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/instagram-conversation-shadow-controller-v1-20260903
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply deterministic controller transform
        run: python .github/scripts/apply-instagram-conversation-shadow-controller.py

      - name: Format exact changed controller files
        run: >-
          pnpm exec prettier --write
          .github/workflows/instagram-engagement-shadow-production.yml
          test/instagram-engagement-shadow-drs-continuation.test.ts
          test/instagram-conversation-shadow-controller.test.ts

      - name: Export exact transformed blobs
        shell: bash
        run: |
          set -euo pipefail
          echo 'SHADOW_WORKFLOW_BASE64_BEGIN'
          base64 -w0 .github/workflows/instagram-engagement-shadow-production.yml
          echo
          echo 'SHADOW_WORKFLOW_BASE64_END'
          echo 'DRS_TEST_BASE64_BEGIN'
          base64 -w0 test/instagram-engagement-shadow-drs-continuation.test.ts
          echo
          echo 'DRS_TEST_BASE64_END'
          echo 'CONTROLLER_TEST_BASE64_BEGIN'
          base64 -w0 test/instagram-conversation-shadow-controller.test.ts
          echo
          echo 'CONTROLLER_TEST_BASE64_END'
