name: Platform Hardening Format Evidence Temporary

on:
  push:
    branches: [feat/platform-hardening-next-20260820]

permissions:
  contents: read

jobs:
  format-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format target files
        run: pnpm exec prettier --write infra/observability/platform-hardening-alerts.json infra/observability/platform-hardening-dashboard.json scripts/platform-hardening-check.mjs src/core/platform-slo-catalog.ts
      - name: Print exact formatter patch
        run: git diff --no-ext-diff --no-color -- infra/observability/platform-hardening-alerts.json infra/observability/platform-hardening-dashboard.json scripts/platform-hardening-check.mjs src/core/platform-slo-catalog.ts
