name: GCP Meta OAuth Callback Diagnostic

on:
  push:
    branches:
      - feat/instagram-engagement-messaging
    paths:
      - '.github/workflows/gcp-meta-oauth-callback-diagnostic.yml'

permissions:
  contents: read
  id-token: write

jobs:
  diagnose-callback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Inspect callback request and application outcome without secrets
        run: |
          echo 'Recent callback request logs:'
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="toca-meta-oauth-staging" AND httpRequest.requestUrl:"/oauth/meta/callback"' \
            --project toca-mcp-production \
            --freshness=30m \
            --limit=20 \
            --order=desc \
            --format='table(timestamp,httpRequest.requestMethod,httpRequest.status,resource.labels.revision_name)' || true

          echo 'Recent application error logs (sanitized messages only):'
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="toca-meta-oauth-staging" AND severity>=ERROR' \
            --project toca-mcp-production \
            --freshness=30m \
            --limit=20 \
            --order=desc \
            --format='table(timestamp,severity,textPayload)' || true
