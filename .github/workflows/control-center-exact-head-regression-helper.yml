name: Control Center exact-head regression helper

on:
  push:
    branches:
      - fix/control-center-approval-list-contract-20260820
    paths:
      - .github/workflows/control-center-exact-head-regression-helper.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  exact-head-postgres-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: toca
          POSTGRES_PASSWORD: toca-exact-head-local-only
          POSTGRES_DB: toca_m12
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toca -d toca_m12"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://toca:toca-exact-head-local-only@127.0.0.1:5432/toca_m12
      DATABASE_SSL: 'false'
    steps:
      - name: Checkout event revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve helper-free branch head
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            git fetch origin fix/control-center-approval-list-contract-20260820
            CANDIDATE_SHA=$(git rev-parse origin/fix/control-center-approval-list-contract-20260820)
            if ! git cat-file -e "$CANDIDATE_SHA:.github/workflows/control-center-exact-head-regression-helper.yml" 2>/dev/null; then
              echo "FINAL_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
              git checkout --detach "$CANDIDATE_SHA"
              echo "VALIDATED_HEAD=$CANDIDATE_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "Helper-free candidate head was not observed" >&2
          exit 1

      - name: Verify helper absent on validated head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          test ! -e .github/workflows/control-center-exact-head-regression-helper.yml
          echo "HELPER_ABSENT=PASS"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply canonical migrations for M-FOUND
        run: pnpm migrate

      - name: Execute canonical M-FOUND PostgreSQL E2E matrix
        run: >-
          pnpm exec vitest run
          test/m-found-12-postgres-e2e.test.ts
          test/crm-sales-postgres-e2e.test.ts
          test/whatsapp-postgres-e2e.test.ts
          test/foundation-worker-postgres-e2e.test.ts
          test/r29-video-postgres-e2e.test.ts
          test/meta-ads-demand-intelligence-postgres-e2e.test.ts
          test/r31-learning-postgres-e2e.test.ts
          test/ag01-orchestrator-postgres-e2e.test.ts
          test/attribution-revenue-postgres-e2e.test.ts
          test/asset-intelligence-postgres-e2e.test.ts
          test/tenant-approval-postgres-e2e.test.ts

      - name: Verify M-FOUND migration no-drift
        run: pnpm migrate

      - name: Create isolated Analytics database
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const client = new pg.Client({ connectionString: 'postgres://toca:toca-exact-head-local-only@127.0.0.1:5432/postgres' });
          await client.connect();
          await client.query('DROP DATABASE IF EXISTS toca_analytics_exact');
          await client.query('CREATE DATABASE toca_analytics_exact');
          await client.end();
          NODE

      - name: Apply canonical migrations for Analytics
        env:
          DATABASE_URL: postgres://toca:toca-exact-head-local-only@127.0.0.1:5432/toca_analytics_exact
        run: pnpm migrate

      - name: Execute canonical Analytics Capacity PostgreSQL E2E
        env:
          DATABASE_URL: postgres://toca:toca-exact-head-local-only@127.0.0.1:5432/toca_analytics_exact
        run: pnpm exec vitest run test/analytics-capacity-postgres-e2e.test.ts

      - name: Verify Analytics migration no-drift
        env:
          DATABASE_URL: postgres://toca:toca-exact-head-local-only@127.0.0.1:5432/toca_analytics_exact
        run: pnpm migrate

      - name: Record exact-head evidence on PR 40
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          EXACT_HEAD_POSTGRES_EVIDENCE=PASS
          validated_sha=$FINAL_SHA
          helper_absent=PASS
          m_found_postgresql_e2e=PASS
          tenant_approval_isolation_e2e=PASS
          m_found_second_migration_no_drift=PASS
          analytics_capacity_postgresql_e2e=PASS
          analytics_second_migration_no_drift=PASS
          run_id=$GITHUB_RUN_ID
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/40/comments" -f body="$BODY"
