name: Temp Format The Party CTA

on:
  push:
    branches:
      - fix/the-party-0904-learn-more-cta-active

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier --write src/meta-ads-the-party-2026-09-04-learn-more-cta-fix.ts
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/meta-ads-the-party-2026-09-04-learn-more-cta-fix.ts
          git commit -m 'chore: format The Party CTA controller'
          git push origin HEAD:fix/the-party-0904-learn-more-cta-active
