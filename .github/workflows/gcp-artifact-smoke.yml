name: GCP Artifact Smoke

on:
  push:
    branches:
      - feat/instagram-engagement-messaging
    paths:
      - .github/workflows/gcp-artifact-smoke.yml

permissions:
  contents: read
  id-token: write

jobs:
  artifact-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet

      - name: Build smoke image
        run: |
          IMAGE="southamerica-east1-docker.pkg.dev/toca-mcp-production/toca-mcp/server:smoke-${GITHUB_SHA::12}"
          docker build -t "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push smoke image
        run: docker push "$IMAGE"

      - name: Verify image exists
        run: |
          gcloud artifacts docker images describe "$IMAGE" \
            --project toca-mcp-production \
            --format='value(image_summary.digest)'
