name: AG-01 Promote Authorized Candidate with Canonical URL Readback

on:
  push:
    branches:
      - ops/ag01-vertex-permanent-binding-20260828
    paths:
      - '.github/workflows/ag01-promote-canonical-url-finalize.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  SERVICE: toca-ag01-orchestrator
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  AUTHORIZATION_ISSUE: '335'
  AUTHORIZED_RUNTIME_SHA: d2c85284f3f67d017ee800e4c4b772f5418542d6
  CANDIDATE_REVISION: toca-ag01-orchestrator-vtx-d2c85284-2
  EXPECTED_IMAGE_DIGEST: sha256:491c0f4e05c8b02bd030080e9ab3d92fbc61a2252f2983fe582b619cbb222e96
  EXPECTED_MODEL: gemini-2.5-flash
  PROBE_JOB: toca-ag01-canonical-prod-probe

jobs:
  promote-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Revalidate exact production authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${AUTHORIZATION_ISSUE}" > /tmp/auth.json
          jq -e --arg sha "$AUTHORIZED_RUNTIME_SHA" --arg owner "$GITHUB_REPOSITORY_OWNER" '
            (.state == "open") and (.user.login == $owner) and
            (.title == "PRODUCTION AUTHORIZATION — AG-01 permanent Vertex binding") and
            ((.body // "") | contains("AUTHORIZATION_STATE=ACTIVE")) and
            ((.body // "") | contains("AUTHORIZED_CANDIDATE_SHA=" + $sha))
          ' /tmp/auth.json >/dev/null

      - name: Authenticate control plane
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Preflight immutable candidate, private IAM, canonical URL and rollback target
        run: |
          set -euo pipefail
          mkdir -p evidence
          gcloud run revisions describe "$CANDIDATE_REVISION" --project "$PROJECT_ID" --region "$REGION" --format=json > evidence/revision-before.json
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > evidence/service-before.json
          gcloud run services get-iam-policy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > evidence/iam-before.json
          jq -e --arg sa "$RUNTIME_SERVICE_ACCOUNT" --arg sha "$AUTHORIZED_RUNTIME_SHA" --arg model "$EXPECTED_MODEL" '
            (.spec.serviceAccountName==$sa) and
            ([.spec.containers[0].env[]? | select(.name=="TOCA_RELEASE_SHA") | .value] | first == $sha) and
            ([.spec.containers[0].env[]? | select(.name=="AG01_MODEL_PROVIDER") | .value] | first == "vertex") and
            ([.spec.containers[0].env[]? | select(.name=="AG01_VERTEX_MODEL") | .value] | first == $model)
          ' evidence/revision-before.json >/dev/null
          REV_IMAGE="$(jq -r '.spec.containers[0].image // empty' evidence/revision-before.json)"
          [[ "$REV_IMAGE" == *"@$EXPECTED_IMAGE_DIGEST" ]] || { echo "Unexpected candidate image: $REV_IMAGE" >&2; exit 1; }
          if jq -e '.bindings[]? | select(.role=="roles/run.invoker") | (.members // [])[]? | select(.=="allUsers")' evidence/iam-before.json >/dev/null; then echo 'Refusing public service' >&2; exit 1; fi
          ROLLBACK_REVISION="$(jq -r '.status.traffic[]? | select(.percent==100) | .revisionName' evidence/service-before.json | head -n1)"
          [[ -n "$ROLLBACK_REVISION" ]] || { echo 'No rollback revision' >&2; exit 1; }
          URLS_JSON="$(jq -r '.metadata.annotations["run.googleapis.com/urls"] // "[]"' evidence/service-before.json)"
          CANONICAL_URL="$(printf '%s' "$URLS_JSON" | jq -r --arg region "$REGION" '[.[] | select(contains("."+$region+".run.app"))] | first // empty')"
          [[ -n "$CANONICAL_URL" ]] || { echo 'Canonical regional URL absent' >&2; exit 1; }
          echo "ROLLBACK_REVISION=$ROLLBACK_REVISION" >> "$GITHUB_ENV"
          echo "CANONICAL_URL=$CANONICAL_URL" >> "$GITHUB_ENV"
          echo "REV_IMAGE=$REV_IMAGE" >> "$GITHUB_ENV"
          jq -n --arg rollback "$ROLLBACK_REVISION" --arg canonical "$CANONICAL_URL" '{rollbackRevision:$rollback,canonicalUrl:$canonical}' > evidence/promotion-plan.json

      - name: Promote exact authorized candidate to 100 percent
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --to-revisions "$CANDIDATE_REVISION=100" --quiet
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > evidence/service-promoted.json
          jq -e --arg revision "$CANDIDATE_REVISION" '.status.traffic[]? | select(.revisionName==$revision and .percent==100)' evidence/service-promoted.json >/dev/null

      - name: Build canonical production runtime-identity probe
        run: |
          set -euo pipefail
          cat > /tmp/probe.mjs <<'JS'
          const target = process.env.CANONICAL_URL;
          const metadata = 'http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/identity?audience=' + encodeURIComponent(target) + '&format=full';
          const tokenResp = await fetch(metadata, {headers:{'Metadata-Flavor':'Google'}});
          if (!tokenResp.ok) throw new Error(`TOKEN_${tokenResp.status}`);
          const token = (await tokenResp.text()).trim();
          async function request(path, init={}) {
            const r = await fetch(target + path, {...init, headers:{...(init.headers||{}), authorization:`Bearer ${token}`}});
            const text = await r.text(); let body; try { body=JSON.parse(text); } catch { body={raw:text.slice(0,500)}; }
            return {status:r.status,body};
          }
          const health=await request('/healthz');
          if (health.status!==200 || health.body?.status!=='ok' || health.body?.service!=='toca-ag01-orchestrator') throw new Error(`HEALTH_${JSON.stringify(health)}`);
          const ready=await request('/readyz');
          if (ready.status!==200 || ready.body?.status!=='ready' || !(ready.body?.runtimeCapabilityCount>0)) throw new Error(`READY_${JSON.stringify(ready)}`);
          const exec=await request('/v1/orchestrator/execute',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({idempotencyKey:process.env.PROBE_ID,message:'Return only a governed planning status. Do not propose or execute any capability, external write, financial action, or destructive action. No action is required.'})});
          if (exec.status!==200 || exec.body?.model!==process.env.EXPECTED_MODEL || typeof exec.body?.modelResponseId!=='string' || !exec.body.modelResponseId.length || !exec.body?.orchestration) throw new Error(`MODEL_${JSON.stringify(exec)}`);
          console.log('AG01_CANONICAL_PROD_PROBE '+JSON.stringify({status:'PRODUCTION_VERIFIED',target,model:exec.body.model,modelResponseId:exec.body.modelResponseId,routeId:exec.body.orchestration.routeId,orchestrationStatus:exec.body.orchestration.status,runtimeCapabilityCount:ready.body.runtimeCapabilityCount,externalBusinessSideEffectExecuted:false}));
          JS
          echo "PROBE_B64=$(base64 -w0 /tmp/probe.mjs)" >> "$GITHUB_ENV"

      - name: Deploy canonical probe using production runtime identity
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$PROBE_JOB" --project "$PROJECT_ID" --region "$REGION" --image "$REV_IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" --command /bin/sh \
            --args '-c,echo "$PROBE_B64" | base64 -d > /tmp/probe.mjs && node /tmp/probe.mjs' \
            --set-env-vars "PROBE_B64=$PROBE_B64,CANONICAL_URL=$CANONICAL_URL,PROBE_ID=prod-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT},EXPECTED_MODEL=$EXPECTED_MODEL" \
            --max-retries 0 --task-timeout 5m --quiet

      - name: Production readback with automatic rollback on failure
        run: |
          set -euo pipefail
          rollback() {
            echo 'Readback failed; restoring previous 100% revision.' >&2
            gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --to-revisions "$ROLLBACK_REVISION=100" --quiet || true
          }
          trap rollback ERR
          EXECUTION="$(gcloud run jobs execute "$PROBE_JOB" --project "$PROJECT_ID" --region "$REGION" --wait --format='value(metadata.name)')"
          echo "$EXECUTION" > evidence/production-execution.txt
          sleep 3
          gcloud logging read 'resource.type="cloud_run_job" AND resource.labels.job_name="'$PROBE_JOB'" AND textPayload:"AG01_CANONICAL_PROD_PROBE"' --project "$PROJECT_ID" --freshness=10m --limit=30 --format=json > /tmp/probe-logs.json
          jq -r '.[].textPayload // empty' /tmp/probe-logs.json | grep 'AG01_CANONICAL_PROD_PROBE ' | head -n1 | sed 's/^.*AG01_CANONICAL_PROD_PROBE //' > evidence/production-probe.json
          jq -e --arg target "$CANONICAL_URL" '.status=="PRODUCTION_VERIFIED" and .target==$target and .model=="gemini-2.5-flash" and (.modelResponseId|length>0) and .externalBusinessSideEffectExecuted==false' evidence/production-probe.json >/dev/null
          trap - ERR

      - name: Final independent control-plane readback and closure
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > evidence/service-final.json
          gcloud run services get-iam-policy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > evidence/iam-final.json
          jq -e --arg revision "$CANDIDATE_REVISION" '.status.traffic[]? | select(.revisionName==$revision and .percent==100)' evidence/service-final.json >/dev/null
          if jq -e '.bindings[]? | select(.role=="roles/run.invoker") | (.members // [])[]? | select(.=="allUsers")' evidence/iam-final.json >/dev/null; then exit 1; fi
          RESPONSE_ID="$(jq -r '.modelResponseId' evidence/production-probe.json)"
          jq -n --arg runtimeSha "$AUTHORIZED_RUNTIME_SHA" --arg runId "$GITHUB_RUN_ID" --arg revision "$CANDIDATE_REVISION" --arg imageDigest "$EXPECTED_IMAGE_DIGEST" --arg responseId "$RESPONSE_ID" --arg sa "$RUNTIME_SERVICE_ACCOUNT" --arg canonicalUrl "$CANONICAL_URL" '{schemaVersion:"toca.p2.2.ag01-production-closure.v3",status:"PRODUCTION_VERIFIED",runtimeSha:$runtimeSha,verificationRunId:$runId,revision:$revision,imageDigest:$imageDigest,provider:"google-vertex-ai",model:"gemini-2.5-flash",modelResponseId:$responseId,runtimeServiceAccount:$sa,canonicalUrl:$canonicalUrl,trafficPercent:100,unauthenticatedIngressAllowed:false,corePolicyApprovalAuthorityPreserved:true,externalBusinessSideEffectExecuted:false,rollbackGuard:true}' > evidence/closure.json

      - name: Upload immutable production closure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ag01-production-canonical-closure-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
          retention-days: 90
