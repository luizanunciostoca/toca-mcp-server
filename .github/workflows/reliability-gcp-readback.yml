name: Foundation Reliability GCP Readback

on:
  push:
    branches: [feat/foundation-v1-reliability-closeout]
    paths: ['.github/workflows/reliability-gcp-readback.yml']

permissions:
  contents: read
  id-token: write

concurrency:
  group: foundation-reliability-gcp-readback
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_INFRA_ADMIN_SERVICE_ACCOUNT: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  CLOUD_SQL_INSTANCE: toca-mcp-db

jobs:
  readback:
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Authenticate infrastructure readback identity
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_INFRA_ADMIN_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Probe Cloud SQL with infrastructure administrator
        id: infra_sql
        shell: bash
        run: |
          set +e
          gcloud sql instances describe "$CLOUD_SQL_INSTANCE" --project "$GCP_PROJECT_ID" --format=json > /tmp/infra-instance.json 2> /tmp/infra-sql.err
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" -eq 0 ]; then
            echo 'FOUNDATION_INFRA_ADMIN_CLOUD_SQL_READ=OK'
          else
            echo "FOUNDATION_INFRA_ADMIN_CLOUD_SQL_READ=BLOCKED exit=$STATUS"
            sed -n '1,3p' /tmp/infra-sql.err
          fi
          exit 0

      - name: Inventory Monitoring with infrastructure administrator
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          CHANNEL_HTTP="$(curl --silent --output /tmp/infra-channels.json --write-out '%{http_code}' \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H 'Accept: application/json' \
            "https://monitoring.googleapis.com/v3/projects/${GCP_PROJECT_ID}/notificationChannels?pageSize=100")"
          POLICY_HTTP="$(curl --silent --output /tmp/infra-policies.json --write-out '%{http_code}' \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H 'Accept: application/json' \
            "https://monitoring.googleapis.com/v3/projects/${GCP_PROJECT_ID}/alertPolicies?pageSize=100")"
          CHANNEL_COUNT=0
          POLICY_COUNT=0
          if [ "$CHANNEL_HTTP" = "200" ]; then CHANNEL_COUNT="$(jq '(.notificationChannels // []) | length' /tmp/infra-channels.json)"; fi
          if [ "$POLICY_HTTP" = "200" ]; then POLICY_COUNT="$(jq '(.alertPolicies // []) | length' /tmp/infra-policies.json)"; fi
          jq -n \
            --arg sourceSha "$GITHUB_SHA" \
            --argjson channelHttp "$CHANNEL_HTTP" \
            --argjson policyHttp "$POLICY_HTTP" \
            --argjson channelCount "$CHANNEL_COUNT" \
            --argjson policyCount "$POLICY_COUNT" \
            --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion:1,sourceSha:$sourceSha,identity:"infrastructure-admin",notificationChannels:{httpStatus:$channelHttp,count:$channelCount},alertPolicies:{httpStatus:$policyHttp,count:$policyCount},verifiedAt:$verifiedAt}' \
            > reliability-monitoring-infra-readback.json
          echo "FOUNDATION_MONITORING_INFRA_READBACK channel_http=$CHANNEL_HTTP channels=$CHANNEL_COUNT policy_http=$POLICY_HTTP policies=$POLICY_COUNT"

      - name: Reauthenticate as deployer
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Probe Cloud SQL with deployer and capture recovery state
        id: deployer_sql
        shell: bash
        run: |
          set +e
          INSTANCE_JSON="$(gcloud sql instances describe "$CLOUD_SQL_INSTANCE" --project "$GCP_PROJECT_ID" --format=json 2> /tmp/deployer-sql.err)"
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            echo "FOUNDATION_DEPLOYER_CLOUD_SQL_READ=BLOCKED exit=$STATUS"
            sed -n '1,3p' /tmp/deployer-sql.err
            jq -n \
              --arg sourceSha "$GITHUB_SHA" \
              --argjson infraStatus '${{ steps.infra_sql.outputs.status }}' \
              --argjson deployerStatus "$STATUS" \
              --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{schemaVersion:1,sourceSha:$sourceSha,verified:false,infraAdminReadExit:$infraStatus,deployerReadExit:$deployerStatus,reason:"CLOUD_SQL_READ_NOT_AUTHORIZED_OR_RESOURCE_NOT_VISIBLE",verifiedAt:$verifiedAt}' \
              > reliability-cloudsql-readback.json
            exit 0
          fi

          set -e
          printf '%s' "$INSTANCE_JSON" | jq -e '
            .state == "RUNNABLE" and
            .databaseVersion == "POSTGRES_18" and
            .settings.deletionProtectionEnabled == true and
            .settings.backupConfiguration.enabled == true and
            .settings.backupConfiguration.pointInTimeRecoveryEnabled == true
          ' >/dev/null
          BACKUPS_JSON="$(gcloud sql backups list --instance "$CLOUD_SQL_INSTANCE" --project "$GCP_PROJECT_ID" --limit=20 --format=json)"
          LATEST_END="$(jq -r '[.[] | select(.status == "SUCCESSFUL" and .endTime != null)] | sort_by(.endTime) | last | .endTime // empty' <<<"$BACKUPS_JSON")"
          test -n "$LATEST_END"
          NOW_EPOCH="$(date -u +%s)"
          BACKUP_EPOCH="$(date -u -d "$LATEST_END" +%s)"
          AGE_SECONDS=$((NOW_EPOCH - BACKUP_EPOCH))
          test "$AGE_SECONDS" -ge 0
          test "$AGE_SECONDS" -le 129600
          jq -n \
            --arg sourceSha "$GITHUB_SHA" \
            --arg instance "$CLOUD_SQL_INSTANCE" \
            --arg latestSuccessfulBackup "$LATEST_END" \
            --argjson backupAgeSeconds "$AGE_SECONDS" \
            --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion:1,sourceSha:$sourceSha,verified:true,identity:"deployer",instance:$instance,pitrEnabled:true,automatedBackupsEnabled:true,deletionProtectionEnabled:true,latestSuccessfulBackup:$latestSuccessfulBackup,backupAgeSeconds:$backupAgeSeconds,backupObjectiveSeconds:129600,verifiedAt:$verifiedAt}' \
            > reliability-cloudsql-readback.json
          echo 'FOUNDATION_CLOUD_SQL_RECOVERY_READBACK=VERIFIED'

      - name: Inventory Monitoring with deployer
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          CHANNEL_HTTP="$(curl --silent --output /tmp/deployer-channels.json --write-out '%{http_code}' \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H 'Accept: application/json' \
            "https://monitoring.googleapis.com/v3/projects/${GCP_PROJECT_ID}/notificationChannels?pageSize=100")"
          POLICY_HTTP="$(curl --silent --output /tmp/deployer-policies.json --write-out '%{http_code}' \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H 'Accept: application/json' \
            "https://monitoring.googleapis.com/v3/projects/${GCP_PROJECT_ID}/alertPolicies?pageSize=100")"
          CHANNEL_COUNT=0
          POLICY_COUNT=0
          if [ "$CHANNEL_HTTP" = "200" ]; then CHANNEL_COUNT="$(jq '(.notificationChannels // []) | length' /tmp/deployer-channels.json)"; fi
          if [ "$POLICY_HTTP" = "200" ]; then POLICY_COUNT="$(jq '(.alertPolicies // []) | length' /tmp/deployer-policies.json)"; fi
          jq -n \
            --arg sourceSha "$GITHUB_SHA" \
            --argjson channelHttp "$CHANNEL_HTTP" \
            --argjson policyHttp "$POLICY_HTTP" \
            --argjson channelCount "$CHANNEL_COUNT" \
            --argjson policyCount "$POLICY_COUNT" \
            --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion:1,sourceSha:$sourceSha,identity:"deployer",notificationChannels:{httpStatus:$channelHttp,count:$channelCount},alertPolicies:{httpStatus:$policyHttp,count:$policyCount},verifiedAt:$verifiedAt}' \
            > reliability-monitoring-deployer-readback.json
          echo "FOUNDATION_MONITORING_DEPLOYER_READBACK channel_http=$CHANNEL_HTTP channels=$CHANNEL_COUNT policy_http=$POLICY_HTTP policies=$POLICY_COUNT"

      - name: Upload sanitized reliability readback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-reliability-gcp-readback-${{ github.sha }}
          path: |
            reliability-cloudsql-readback.json
            reliability-monitoring-infra-readback.json
            reliability-monitoring-deployer-readback.json
          if-no-files-found: error
          retention-days: 90
