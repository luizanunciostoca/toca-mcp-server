name: TEMP Patch staging WIF ID token 2026-08-23

on:
  push:
    branches:
      - fix/staging-wif-id-token-20260823

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[wif-id-token-patched]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/staging-wif-id-token-20260823
          fetch-depth: 1

      - name: Apply exact minimal patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          canonical_path = Path('.github/workflows/deploy-gcp-staging-canonical.yml')
          canonical = canonical_path.read_text()

          old = """      - name: Resolve candidate tagged revisions and URLs\n        shell: bash\n"""
          new = """      - name: Resolve candidate tagged revisions and URLs\n        id: candidate\n        shell: bash\n"""
          assert canonical.count(old) == 1
          canonical = canonical.replace(old, new, 1)

          old = """          echo \"WEBHOOK_REVISION=$WEBHOOK_REVISION\" >> \"$GITHUB_ENV\"\n          echo \"WEBHOOK_URL=$WEBHOOK_URL\" >> \"$GITHUB_ENV\"\n\n      - name: Verify candidate health readiness and public route confinement before traffic\n        shell: bash\n        run: |\n          set -euo pipefail\n          MCP_TOKEN=\"$(gcloud auth print-identity-token --audiences=\"$MCP_URL\")\"\n"""
          new = """          echo \"WEBHOOK_REVISION=$WEBHOOK_REVISION\" >> \"$GITHUB_ENV\"\n          echo \"WEBHOOK_URL=$WEBHOOK_URL\" >> \"$GITHUB_ENV\"\n          echo \"mcp_url=$MCP_URL\" >> \"$GITHUB_OUTPUT\"\n\n      - name: Mint MCP readiness identity token through staging WIF\n        id: mcp_probe_auth\n        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2\n        with:\n          workload_identity_provider: ${{ steps.config.outputs.wif }}\n          service_account: ${{ steps.config.outputs.deployer_sa }}\n          token_format: id_token\n          id_token_audience: ${{ steps.candidate.outputs.mcp_url }}\n          create_credentials_file: false\n          export_environment_variables: false\n\n      - name: Verify candidate health readiness and public route confinement before traffic\n        env:\n          MCP_TOKEN: ${{ steps.mcp_probe_auth.outputs.id_token }}\n        shell: bash\n        run: |\n          set -euo pipefail\n"""
          assert canonical.count(old) == 1
          canonical = canonical.replace(old, new, 1)
          canonical_path.write_text(canonical)

          runtime_path = Path('.github/workflows/staging-runtime-observability.yml')
          runtime = runtime_path.read_text()

          marker = """          echo 'STAGING_EXACT_RUNTIME_IDENTITY=PASS'\n\n      - name: Verify health readiness and release runtime agreement\n        env:\n          MCP_URL: ${{ steps.runtime.outputs.mcp_url }}\n          WEBHOOK_URL: ${{ steps.runtime.outputs.webhook_url }}\n"""
          replacement = """          echo 'STAGING_EXACT_RUNTIME_IDENTITY=PASS'\n\n      - name: Mint MCP probe identity token through staging WIF\n        id: mcp_probe_auth\n        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2\n        with:\n          workload_identity_provider: ${{ env.STAGING_WIF }}\n          service_account: ${{ env.STAGING_OPERATOR_SA }}\n          token_format: id_token\n          id_token_audience: ${{ steps.runtime.outputs.mcp_url }}\n          create_credentials_file: false\n          export_environment_variables: false\n\n      - name: Mint webhook probe identity token through staging WIF\n        id: webhook_probe_auth\n        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2\n        with:\n          workload_identity_provider: ${{ env.STAGING_WIF }}\n          service_account: ${{ env.STAGING_OPERATOR_SA }}\n          token_format: id_token\n          id_token_audience: ${{ steps.runtime.outputs.webhook_url }}\n          create_credentials_file: false\n          export_environment_variables: false\n\n      - name: Verify health readiness and release runtime agreement\n        env:\n          MCP_URL: ${{ steps.runtime.outputs.mcp_url }}\n          WEBHOOK_URL: ${{ steps.runtime.outputs.webhook_url }}\n          MCP_TOKEN: ${{ steps.mcp_probe_auth.outputs.id_token }}\n          WEBHOOK_TOKEN: ${{ steps.webhook_probe_auth.outputs.id_token }}\n"""
          assert runtime.count(marker) == 1
          runtime = runtime.replace(marker, replacement, 1)

          old = """          probe() {\n            local service=\"$1\" base_url=\"$2\"\n            local token request_id correlation_id\n            token=\"$(gcloud auth print-identity-token --audiences=\"$base_url\")\"\n"""
          new = """          probe() {\n            local service=\"$1\" base_url=\"$2\" token=\"$3\"\n            local request_id correlation_id\n"""
          assert runtime.count(old) == 1
          runtime = runtime.replace(old, new, 1)

          old = """          probe mcp \"$MCP_URL\"\n          probe webhook \"$WEBHOOK_URL\"\n"""
          new = """          probe mcp \"$MCP_URL\" \"$MCP_TOKEN\"\n          probe webhook \"$WEBHOOK_URL\" \"$WEBHOOK_TOKEN\"\n"""
          assert runtime.count(old) == 1
          runtime = runtime.replace(old, new, 1)

          marker = """      - name: Run controlled non-destructive capacity sampling\n        if: ${{ inputs.run_capacity }}\n        id: capacity\n        env:\n          MCP_URL: ${{ steps.runtime.outputs.mcp_url }}\n        shell: bash\n        run: |\n          set -euo pipefail\n          TOKEN=\"$(gcloud auth print-identity-token --audiences=\"$MCP_URL\")\"\n          export MCP_URL TOKEN\n"""
          replacement = """      - name: Mint fresh MCP capacity identity token through staging WIF\n        if: ${{ inputs.run_capacity }}\n        id: capacity_auth\n        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2\n        with:\n          workload_identity_provider: ${{ env.STAGING_WIF }}\n          service_account: ${{ env.STAGING_OPERATOR_SA }}\n          token_format: id_token\n          id_token_audience: ${{ steps.runtime.outputs.mcp_url }}\n          create_credentials_file: false\n          export_environment_variables: false\n\n      - name: Run controlled non-destructive capacity sampling\n        if: ${{ inputs.run_capacity }}\n        id: capacity\n        env:\n          MCP_URL: ${{ steps.runtime.outputs.mcp_url }}\n          TOKEN: ${{ steps.capacity_auth.outputs.id_token }}\n        shell: bash\n        run: |\n          set -euo pipefail\n          export MCP_URL TOKEN\n"""
          assert runtime.count(marker) == 1
          runtime = runtime.replace(marker, replacement, 1)
          assert 'gcloud auth print-identity-token' not in runtime
          runtime_path.write_text(runtime)

          test_path = Path('test/gcp-staging-canonical-workflow.test.ts')
          test = test_path.read_text()
          old = """const workflow = readFileSync(workflowPath, 'utf8');\nconst config = JSON.parse(readFileSync(configPath, 'utf8')) as Record<string, unknown>;\n"""
          new = """const workflow = readFileSync(workflowPath, 'utf8');\nconst runtimeWorkflow = readFileSync('.github/workflows/staging-runtime-observability.yml', 'utf8');\nconst config = JSON.parse(readFileSync(configPath, 'utf8')) as Record<string, unknown>;\n"""
          assert test.count(old) == 1
          test = test.replace(old, new, 1)

          marker = """  it('requires exact frozen candidate, immutable digest, readiness before promotion and final readback', () => {\n"""
          addition = """  it('mints Cloud Run ID tokens through pinned staging WIF actions instead of gcloud external-account audiences', () => {\n    expect(workflow).not.toContain('gcloud auth print-identity-token');\n    expect(workflow).toContain('id: mcp_probe_auth');\n    expect(workflow).toContain('token_format: id_token');\n    expect(workflow).toContain('id_token_audience: ${{ steps.candidate.outputs.mcp_url }}');\n    expect(workflow).toContain('create_credentials_file: false');\n    expect(workflow).toContain('export_environment_variables: false');\n    expect(runtimeWorkflow).not.toContain('gcloud auth print-identity-token');\n    expect(runtimeWorkflow).toContain('id: mcp_probe_auth');\n    expect(runtimeWorkflow).toContain('id: webhook_probe_auth');\n    expect(runtimeWorkflow).toContain('id: capacity_auth');\n    expect(runtimeWorkflow).toContain('id_token_audience: ${{ steps.runtime.outputs.mcp_url }}');\n    expect(runtimeWorkflow).toContain('id_token_audience: ${{ steps.runtime.outputs.webhook_url }}');\n  });\n\n"""
          assert test.count(marker) == 1
          test = test.replace(marker, addition + marker, 1)
          test_path.write_text(test)
          PY

      - name: Format and run focused regression
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier --write test/gcp-staging-canonical-workflow.test.ts
          git diff --check
          pnpm vitest run test/gcp-staging-canonical-workflow.test.ts

      - name: Commit permanent files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-gcp-staging-canonical.yml .github/workflows/staging-runtime-observability.yml test/gcp-staging-canonical-workflow.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(staging): mint Cloud Run ID tokens through WIF [wif-id-token-patched]'
          git push origin HEAD:fix/staging-wif-id-token-20260823
