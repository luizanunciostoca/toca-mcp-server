name: Paid Media Read Structure Production TEMP

on:
  push:
    branches:
      - ops/paid-media-read-structure-production-20260813

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  PROJECT_NUMBER: '990081828836'
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  SERVICE: toca-mcp-production
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  CLOUD_SQL_INSTANCE: toca-mcp-db
  URL: https://toca-mcp-production-990081828836.southamerica-east1.run.app/mcp

jobs:
  deploy-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and deploy production read-only runtime
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/server:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --add-cloudsql-instances "$PROJECT_ID:$REGION:$CLOUD_SQL_INSTANCE" \
            --update-secrets "DATABASE_URL=toca-database-url:latest,TOCA_SECRET_META_APP_SECRET=toca-meta-app-secret:latest,TOCA_SECRET_META_ACCESS_TOKEN=toca-meta-oauth-token:latest" \
            --update-env-vars "META_ENABLED=false,MCP_ENABLED=true,META_ADS_READ_ENABLED=true,META_ACCESS_TOKEN_ENV_KEY=TOCA_SECRET_META_ACCESS_TOKEN" \
            --no-allow-unauthenticated \
            --quiet

      - id: runtime_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: https://toca-mcp-production-990081828836.southamerica-east1.run.app

      - name: Verify expanded READ surface against official account
        env:
          TOKEN: ${{ steps.runtime_auth.outputs.id_token }}
        shell: bash
        run: |
          set -euo pipefail
          call() {
            local id="$1" name="$2" args="$3"
            printf '{"jsonrpc":"2.0","id":%s,"method":"tools/call","params":{"name":"%s","arguments":%s}}' "$id" "$name" "$args" > /tmp/request.json
            curl -fsS -X POST "$URL" \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --data-binary @/tmp/request.json
            echo
          }

          echo '=== tools/list ==='
          printf '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' > /tmp/request.json
          curl -fsS -X POST "$URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data-binary @/tmp/request.json | tee /tmp/tools.txt
          grep -q 'meta_ads.adsets.list' /tmp/tools.txt
          grep -q 'meta_ads.ads.list' /tmp/tools.txt

          echo '=== adsets ==='
          call 2 'meta_ads.adsets.list' '{"adAccountId":"311793958882290","currency":"BRL"}' | tee /tmp/adsets.txt
          echo '=== ads ==='
          call 3 'meta_ads.ads.list' '{"adAccountId":"311793958882290","currency":"BRL"}' | tee /tmp/ads.txt

          grep -q 'data' /tmp/adsets.txt
          grep -q 'data' /tmp/ads.txt
          echo 'Expanded Meta Ads READ production smoke passed.'
