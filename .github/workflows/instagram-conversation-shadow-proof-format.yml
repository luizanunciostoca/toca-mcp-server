name: Instagram Conversation Shadow Proof Format

on:
  push:
    branches:
      - feat/instagram-conversation-shadow-proof-v1-20260902

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/instagram-conversation-shadow-proof-v1-20260902
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository Prettier exactly
        run: pnpm exec prettier --write test/instagram-conversation-shadow-proof-contract.test.ts

      - name: Remove temporary formatter workflow
        run: rm .github/workflows/instagram-conversation-shadow-proof-format.yml

      - name: Commit exact format result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/instagram-conversation-shadow-proof-contract.test.ts .github/workflows/instagram-conversation-shadow-proof-format.yml
          git diff --cached --quiet && { echo 'Expected formatter change missing' >&2; exit 1; }
          git commit -m "style(instagram): apply exact shadow proof formatter"
          git push origin HEAD:feat/instagram-conversation-shadow-proof-v1-20260902
