name: Staging Runtime Observability

on:
  workflow_dispatch:
    inputs:
      expected_policy_sha256:
        description: SHA-256 of infra/observability/staging-runtime-observability-policy.json
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: staging-runtime-observability
  cancel-in-progress: false

env:
  POLICY_PATH: infra/observability/staging-runtime-observability-policy.json
  PROJECT_ID: toca-mcp-next-staging
  PROJECT_NUMBER: '729069789107'
  PRODUCTION_PROJECT_ID: toca-mcp-production
  PRODUCTION_PROJECT_NUMBER: '990081828836'
  REGION: southamerica-east1
  WEBHOOK_SERVICE: toca-webhook-next-staging
  INFRA_WIF: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  INFRA_ADMIN_SA: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com
  STAGING_WIF: projects/729069789107/locations/global/workloadIdentityPools/github-staging/providers/github-toca-mcp-staging
  STAGING_OPERATOR_SA: toca-next-stg-deployer@toca-mcp-next-staging.iam.gserviceaccount.com
  DASHBOARD_DISPLAY_NAME: TOCA OS Next — Platform Readiness — Staging
  UPTIME_DISPLAY_NAME: TOCA Next Staging — Webhook Readiness

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 15
    outputs:
      policy_sha256: ${{ steps.policy.outputs.sha256 }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify runtime observability policy boundary
        id: policy
        shell: bash
        env:
          EXPECTED_POLICY_SHA256: ${{ inputs.expected_policy_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'luizanunciostoca/toca-mcp-server'
          test "$GITHUB_REF" = 'refs/heads/main'
          ACTUAL_POLICY_SHA256="$(sha256sum "$POLICY_PATH" | awk '{print $1}')"
          test "$ACTUAL_POLICY_SHA256" = "$EXPECTED_POLICY_SHA256"
          jq -e '
            .version == 1 and
            .operation == "staging-runtime-observability-bootstrap" and
            .projectId == "toca-mcp-next-staging" and
            .projectNumber == "729069789107" and
            .productionProjectId == "toca-mcp-production" and
            .productionProjectNumber == "990081828836" and
            .region == "southamerica-east1" and
            .operatorServiceAccount == "toca-next-stg-deployer@toca-mcp-next-staging.iam.gserviceaccount.com" and
            .webhookService == "toca-webhook-next-staging" and
            .requiredIamRoles == ["roles/run.viewer","roles/monitoring.dashboardEditor","roles/monitoring.uptimeCheckConfigEditor"] and
            .uptimeCheck.path == "/readyz" and
            .uptimeCheck.period == "300s" and
            .uptimeCheck.timeout == "10s" and
            .uptimeCheck.useSsl == true and
            .uptimeCheck.port == 443 and
            .forbid.productionMutation == true and
            .forbid.providerMutation == true and
            .forbid.databaseMutation == true and
            .forbid.backupMutation == true and
            .forbid.drRestore == true and
            .forbid.trafficMutation == true and
            .forbid.cloudRunMutation == true and
            .forbid.secretMutation == true and
            .forbid.serviceAccountKey == true and
            .forbid.projectOwner == true and
            .forbid.projectEditor == true
          ' "$POLICY_PATH" >/dev/null
          echo "sha256=$ACTUAL_POLICY_SHA256" >> "$GITHUB_OUTPUT"
          echo 'STAGING_RUNTIME_OBSERVABILITY_POLICY_BOUNDARY=PASS'

      - name: Authenticate infrastructure administrator
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.INFRA_WIF }}
          service_account: ${{ env.INFRA_ADMIN_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Bootstrap exact staging observability roles
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_ID" != "$PRODUCTION_PROJECT_ID"
          test "$PROJECT_NUMBER" != "$PRODUCTION_PROJECT_NUMBER"
          ACTUAL_NUMBER="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
          test "$ACTUAL_NUMBER" = "$PROJECT_NUMBER"
          MEMBER="serviceAccount:${STAGING_OPERATOR_SA}"
          for role in roles/run.viewer roles/monitoring.dashboardEditor roles/monitoring.uptimeCheckConfigEditor; do
            gcloud projects add-iam-policy-binding "$PROJECT_ID" \
              --member="$MEMBER" \
              --role="$role" \
              --condition=None \
              --quiet
          done
          POLICY="$(gcloud projects get-iam-policy "$PROJECT_ID" --format=json)"
          for role in roles/run.viewer roles/monitoring.dashboardEditor roles/monitoring.uptimeCheckConfigEditor; do
            jq -e --arg role "$role" --arg member "$MEMBER" \
              'any(.bindings[]?; .role == $role and any(.members[]?; . == $member))' \
              <<<"$POLICY" >/dev/null
          done
          echo 'STAGING_RUNTIME_OBSERVABILITY_ROLES=PASS'

  configure:
    needs: bootstrap
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - name: Checkout exact main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify exact staging execution boundary
        shell: bash
        env:
          EXPECTED_POLICY_SHA256: ${{ inputs.expected_policy_sha256 }}
          BOOTSTRAP_POLICY_SHA256: ${{ needs.bootstrap.outputs.policy_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'luizanunciostoca/toca-mcp-server'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$PROJECT_ID" = 'toca-mcp-next-staging'
          test "$PROJECT_NUMBER" = '729069789107'
          test "$PROJECT_ID" != "$PRODUCTION_PROJECT_ID"
          test "$PROJECT_NUMBER" != "$PRODUCTION_PROJECT_NUMBER"
          ACTUAL_POLICY_SHA256="$(sha256sum "$POLICY_PATH" | awk '{print $1}')"
          test "$ACTUAL_POLICY_SHA256" = "$EXPECTED_POLICY_SHA256"
          test "$ACTUAL_POLICY_SHA256" = "$BOOTSTRAP_POLICY_SHA256"
          echo 'STAGING_RUNTIME_OBSERVABILITY_EXECUTION_BOUNDARY=PASS'

      - name: Authenticate isolated staging operator
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.STAGING_WIF }}
          service_account: ${{ env.STAGING_OPERATOR_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Resolve and probe exact webhook readiness target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE_ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)"
          test "$ACTIVE_ACCOUNT" = "$STAGING_OPERATOR_SA"
          ACTUAL_NUMBER="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
          test "$ACTUAL_NUMBER" = "$PROJECT_NUMBER"

          SERVICE_URL="$(gcloud run services describe "$WEBHOOK_SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(status.url)')"
          test -n "$SERVICE_URL"
          HOST="${SERVICE_URL#https://}"
          HOST="${HOST%/}"
          [[ "$HOST" != *'/'* ]]
          HTTP_STATUS="$(curl --silent --show-error --output /tmp/readyz-body --write-out '%{http_code}' "https://${HOST}/readyz")"
          test "$HTTP_STATUS" = 200
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo 'STAGING_WEBHOOK_READINESS_DIRECT_PROBE=PASS'

      - name: Reconcile custom staging dashboard
        id: dashboard
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          DASH_API="https://monitoring.googleapis.com/v1/projects/${PROJECT_ID}/dashboards"
          ALERT_API="https://monitoring.googleapis.com/v3/projects/${PROJECT_ID}/alertPolicies?pageSize=100"

          curl --fail --silent --show-error -H "Authorization: Bearer ${TOKEN}" "$ALERT_API" > /tmp/alerts.json
          ALERT_POLICY="$(jq -r 'first(.alertPolicies[]? | select(.userLabels.toca_managed=="staging_reliability" and .userLabels.alert_role=="synthetic_delivery") | .name) // empty' /tmp/alerts.json)"
          test -n "$ALERT_POLICY"

          curl --fail --silent --show-error -H "Authorization: Bearer ${TOKEN}" "$DASH_API" > /tmp/dashboards.json
          DASHBOARD_NAME="$(jq -r 'first(.dashboards[]? | select(.displayName=="TOCA OS Next — Platform Readiness — Staging") | .name) // empty' /tmp/dashboards.json)"

          if [[ -z "$DASHBOARD_NAME" ]]; then
            jq -n --arg alertPolicy "$ALERT_POLICY" '{
              displayName:"TOCA OS Next — Platform Readiness — Staging",
              labels:{staging_reliability:"",toca_os_next:""},
              mosaicLayout:{
                columns:48,
                tiles:[
                  {xPos:0,yPos:0,width:48,height:5,widget:{text:{content:"# TOCA OS Next — Staging Reliability\n\nFrozen application candidate is isolated in staging. Provider-gated panels remain inactive until provider verification. This dashboard is a control-plane observability surface and does not promote provider or production lifecycle state.",format:"MARKDOWN"}}},
                  {xPos:0,yPos:5,width:24,height:16,widget:{title:"Cloud Run request rate — staging services",xyChart:{dataSets:[{timeSeriesQuery:{timeSeriesFilter:{filter:"metric.type=\"run.googleapis.com/request_count\" AND resource.type=\"cloud_run_revision\" AND (resource.label.\"service_name\"=\"toca-mcp-next-staging\" OR resource.label.\"service_name\"=\"toca-webhook-next-staging\")",aggregation:{alignmentPeriod:"60s",perSeriesAligner:"ALIGN_RATE"}}},plotType:"LINE",minAlignmentPeriod:"60s"}],yAxis:{scale:"LINEAR"},chartOptions:{mode:"COLOR"}}}},
                  {xPos:24,yPos:5,width:24,height:16,widget:{title:"Synthetic Reliability alert",alertChart:{name:$alertPolicy}}},
                  {xPos:0,yPos:21,width:48,height:10,widget:{title:"Staging incidents",incidentList:{policyNames:[$alertPolicy],monitoredResources:[]}}}
                ]
              }
            }' > /tmp/dashboard-create.json

            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/dashboard-create.json \
              "$DASH_API" > /tmp/dashboard-created.json
            DASHBOARD_NAME="$(jq -r '.name' /tmp/dashboard-created.json)"
          fi

          test -n "$DASHBOARD_NAME"
          curl --fail --silent --show-error -H "Authorization: Bearer ${TOKEN}" \
            "https://monitoring.googleapis.com/v1/${DASHBOARD_NAME}" > /tmp/dashboard-readback.json
          unset TOKEN

          jq -e '
            .displayName == "TOCA OS Next — Platform Readiness — Staging" and
            (.labels | has("staging_reliability")) and
            (.labels | has("toca_os_next")) and
            (.mosaicLayout.tiles | length) >= 4
          ' /tmp/dashboard-readback.json >/dev/null
          mkdir -p staging-runtime-observability-evidence
          jq '{name,displayName,labels,tileCount:(.mosaicLayout.tiles|length)}' /tmp/dashboard-readback.json \
            > staging-runtime-observability-evidence/dashboard.json
          echo "name=$DASHBOARD_NAME" >> "$GITHUB_OUTPUT"
          echo 'STAGING_RUNTIME_DASHBOARD=PASS'

      - name: Reconcile public webhook readiness uptime check
        id: uptime
        shell: bash
        env:
          HOST: ${{ steps.target.outputs.host }}
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          UPTIME_API="https://monitoring.googleapis.com/v3/projects/${PROJECT_ID}/uptimeCheckConfigs"
          curl --fail --silent --show-error -H "Authorization: Bearer ${TOKEN}" "$UPTIME_API" > /tmp/uptime-list.json
          UPTIME_NAME="$(jq -r 'first(.uptimeCheckConfigs[]? | select(.displayName=="TOCA Next Staging — Webhook Readiness") | .name) // empty' /tmp/uptime-list.json)"

          if [[ -z "$UPTIME_NAME" ]]; then
            jq -n --arg host "$HOST" '{
              displayName:"TOCA Next Staging — Webhook Readiness",
              monitoredResource:{type:"uptime_url",labels:{host:$host}},
              httpCheck:{requestMethod:"GET",path:"/readyz",port:443,useSsl:true,validateSsl:true},
              timeout:"10s",
              period:"300s"
            }' > /tmp/uptime-create.json
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/uptime-create.json \
              "$UPTIME_API" > /tmp/uptime-created.json
            UPTIME_NAME="$(jq -r '.name' /tmp/uptime-created.json)"
          fi

          test -n "$UPTIME_NAME"
          curl --fail --silent --show-error -H "Authorization: Bearer ${TOKEN}" \
            "https://monitoring.googleapis.com/v3/${UPTIME_NAME}" > /tmp/uptime-readback.json
          unset TOKEN

          jq -e --arg host "$HOST" '
            .displayName == "TOCA Next Staging — Webhook Readiness" and
            .monitoredResource.type == "uptime_url" and
            .monitoredResource.labels.host == $host and
            .httpCheck.path == "/readyz" and
            .httpCheck.port == 443 and
            .httpCheck.useSsl == true and
            .period == "300s" and
            .timeout == "10s"
          ' /tmp/uptime-readback.json >/dev/null
          jq '{name,displayName,monitoredResource,httpCheck:{requestMethod:.httpCheck.requestMethod,path:.httpCheck.path,port:.httpCheck.port,useSsl:.httpCheck.useSsl,validateSsl:.httpCheck.validateSsl},period,timeout}' \
            /tmp/uptime-readback.json > staging-runtime-observability-evidence/uptime-check.json
          echo "name=$UPTIME_NAME" >> "$GITHUB_OUTPUT"
          echo 'STAGING_WEBHOOK_UPTIME_CHECK=PASS'

      - name: Persist immutable sanitized observability evidence
        shell: bash
        env:
          HOST: ${{ steps.target.outputs.host }}
          DASHBOARD_NAME: ${{ steps.dashboard.outputs.name }}
          UPTIME_NAME: ${{ steps.uptime.outputs.name }}
          POLICY_SHA256: ${{ inputs.expected_policy_sha256 }}
        run: |
          set -euo pipefail
          jq -n \
            --arg project "$PROJECT_ID" \
            --arg projectNumber "$PROJECT_NUMBER" \
            --arg operator "$STAGING_OPERATOR_SA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg githubSha "$GITHUB_SHA" \
            --arg policySha256 "$POLICY_SHA256" \
            --arg host "$HOST" \
            --arg dashboard "$DASHBOARD_NAME" \
            --arg uptime "$UPTIME_NAME" \
            '{
              schemaVersion:"toca.staging.runtime-observability.evidence.v1",
              project:$project,
              projectNumber:$projectNumber,
              operator:$operator,
              githubRunId:$runId,
              githubSha:$githubSha,
              policySha256:$policySha256,
              webhookReadinessTarget:{host:$host,path:"/readyz",directProbeHttpStatus:200},
              dashboard:{name:$dashboard,readback:true},
              uptimeCheck:{name:$uptime,readback:true,period:"300s"},
              productionMutation:false,
              providerMutation:false,
              databaseMutation:false,
              backupMutation:false,
              drRestore:false,
              trafficMutation:false,
              cloudRunMutation:false,
              secretMutation:false,
              result:"CONFIGURED_AND_READ_BACK"
            }' > staging-runtime-observability-evidence/manifest.json
          sha256sum staging-runtime-observability-evidence/* > staging-runtime-observability-evidence/SHA256SUMS
          echo 'STAGING_RUNTIME_OBSERVABILITY=CONFIGURED_AND_READ_BACK'

      - name: Upload runtime observability evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-runtime-observability-${{ github.run_id }}
          path: staging-runtime-observability-evidence
          if-no-files-found: error
          retention-days: 90
