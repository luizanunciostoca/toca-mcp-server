name: Staging Runtime Observability

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact repository SHA to reconcile from
        required: true
        type: string
      expected_policy_sha256:
        description: SHA-256 of infra/observability/staging-runtime-observability-policy.json
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: staging-runtime-observability
  cancel-in-progress: false

env:
  POLICY_PATH: infra/observability/staging-runtime-observability-policy.json
  RECONCILE_SCRIPT: ops/staging-runtime-observability-reconcile-v3.sh
  PROJECT_ID: toca-mcp-next-staging
  PROJECT_NUMBER: '729069789107'
  PRODUCTION_PROJECT_ID: toca-mcp-production
  PRODUCTION_PROJECT_NUMBER: '990081828836'
  REGION: southamerica-east1
  MCP_SERVICE: toca-mcp-next-staging
  WEBHOOK_SERVICE: toca-webhook-next-staging
  INFRA_WIF: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  INFRA_ADMIN_SA: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com
  STAGING_WIF: projects/729069789107/locations/global/workloadIdentityPools/github-staging/providers/github-toca-mcp-staging
  STAGING_OPERATOR_SA: toca-next-stg-deployer@toca-mcp-next-staging.iam.gserviceaccount.com
  MONITORING_SERVICE_AGENT: service-729069789107@gcp-sa-monitoring-notification.iam.gserviceaccount.com

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 15
    outputs:
      policy_sha256: ${{ steps.policy.outputs.sha256 }}
      source_sha: ${{ steps.policy.outputs.source_sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_source_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify complete runtime observability policy boundary
        id: policy
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_POLICY_SHA256: ${{ inputs.expected_policy_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'luizanunciostoca/toca-mcp-server'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          ACTUAL="$(sha256sum "$POLICY_PATH" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED_POLICY_SHA256"
          jq -e '
            .version == 3 and
            .operation == "staging-runtime-observability-bootstrap" and
            .projectId == "toca-mcp-next-staging" and
            .projectNumber == "729069789107" and
            .productionProjectId == "toca-mcp-production" and
            .productionProjectNumber == "990081828836" and
            .region == "southamerica-east1" and
            .mcpService == "toca-mcp-next-staging" and
            .webhookService == "toca-webhook-next-staging" and
            .operatorServiceAccount == "toca-next-stg-deployer@toca-mcp-next-staging.iam.gserviceaccount.com" and
            .notificationChannels.requiredEnabledCount == 2 and
            .notificationChannels.requiredFamilies == ["email","webhook_tokenauth"] and
            ([.domainReadiness[].id] | sort) == (["ag01","approval","crm","db","outbox_dlq","workflow"] | sort) and
            ([.domainReadiness[].checkName] | sort) == (["ag01","approval_store","crm","db","outbox","workflow"] | sort) and
            .nativeSignals.latency.metricType == "run.googleapis.com/request_latencies" and
            .nativeSignals.latency.aligner == "ALIGN_PERCENTILE_95" and
            .nativeSignals.latency.thresholdMilliseconds == 2000 and
            .nativeSignals.errorRate.metricType == "run.googleapis.com/request_count" and
            .nativeSignals.errorRate.errorResponseClass == "5xx" and
            .nativeSignals.errorRate.thresholdRatio == 0.01 and
            (.requiredIamRoles | index("roles/monitoring.viewer") != null) and
            (.requiredIamRoles | index("roles/monitoring.alertPolicyEditor") != null) and
            (.requiredIamRoles | index("roles/monitoring.dashboardEditor") != null) and
            (.requiredIamRoles | index("roles/monitoring.uptimeCheckConfigEditor") != null) and
            (.requiredIamRoles | index("roles/owner") == null) and
            (.requiredIamRoles | index("roles/editor") == null) and
            .forbid.productionMutation == true and
            .forbid.providerMutation == true and
            .forbid.databaseMutation == true and
            .forbid.backupMutation == true and
            .forbid.drRestore == true and
            .forbid.trafficMutation == true and
            .forbid.cloudRunMutation == true and
            .forbid.secretMutation == true and
            .forbid.publicWebhookExposure == true
          ' "$POLICY_PATH" >/dev/null
          test -x "$RECONCILE_SCRIPT" || test -f "$RECONCILE_SCRIPT"
          echo "sha256=$ACTUAL" >> "$GITHUB_OUTPUT"
          echo "source_sha=$EXPECTED_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo 'STAGING_RUNTIME_OBSERVABILITY_V3_POLICY_BOUNDARY=PASS'

      - name: Authenticate infrastructure administrator
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.INFRA_WIF }}
          service_account: ${{ env.INFRA_ADMIN_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Bootstrap least-privilege staging observability roles
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_ID" != "$PRODUCTION_PROJECT_ID"
          test "$PROJECT_NUMBER" != "$PRODUCTION_PROJECT_NUMBER"
          test "$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')" = "$PROJECT_NUMBER"
          MEMBER="serviceAccount:${STAGING_OPERATOR_SA}"
          mapfile -t ROLES < <(jq -r '.requiredIamRoles[]' "$POLICY_PATH")
          for role in "${ROLES[@]}"; do
            case "$role" in
              roles/run.viewer|roles/monitoring.viewer|roles/monitoring.dashboardEditor|roles/monitoring.uptimeCheckConfigEditor|roles/monitoring.alertPolicyEditor) ;;
              *) echo "UNEXPECTED_OBSERVABILITY_ROLE:${role}" >&2; exit 1 ;;
            esac
            gcloud projects add-iam-policy-binding "$PROJECT_ID" --member="$MEMBER" --role="$role" --condition=None --quiet
          done
          PROJECT_POLICY="$(gcloud projects get-iam-policy "$PROJECT_ID" --format=json)"
          for role in "${ROLES[@]}"; do
            jq -e --arg role "$role" --arg member "$MEMBER" 'any(.bindings[]?; .role==$role and any(.members[]?; .==$member))' <<<"$PROJECT_POLICY" >/dev/null
          done
          jq -e --arg member "serviceAccount:${MONITORING_SERVICE_AGENT}" 'any(.bindings[]?; .role=="roles/monitoring.notificationServiceAgent" and any(.members[]?; .==$member))' <<<"$PROJECT_POLICY" >/dev/null
          echo 'STAGING_RUNTIME_OBSERVABILITY_V3_ROLES=PASS'

  configure:
    needs: bootstrap
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.bootstrap.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact staging execution boundary
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_POLICY_SHA256: ${{ inputs.expected_policy_sha256 }}
          BOOTSTRAP_SOURCE_SHA: ${{ needs.bootstrap.outputs.source_sha }}
          BOOTSTRAP_POLICY_SHA256: ${{ needs.bootstrap.outputs.policy_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'luizanunciostoca/toca-mcp-server'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$EXPECTED_SOURCE_SHA" = "$BOOTSTRAP_SOURCE_SHA"
          test "$PROJECT_ID" = 'toca-mcp-next-staging'
          test "$PROJECT_NUMBER" = '729069789107'
          test "$PROJECT_ID" != "$PRODUCTION_PROJECT_ID"
          test "$PROJECT_NUMBER" != "$PRODUCTION_PROJECT_NUMBER"
          ACTUAL="$(sha256sum "$POLICY_PATH" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED_POLICY_SHA256"
          test "$ACTUAL" = "$BOOTSTRAP_POLICY_SHA256"
          echo 'STAGING_RUNTIME_OBSERVABILITY_V3_EXECUTION_BOUNDARY=PASS'

      - name: Authenticate isolated staging operator
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.STAGING_WIF }}
          service_account: ${{ env.STAGING_OPERATOR_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Resolve private webhook readiness target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)" = "$STAGING_OPERATOR_SA"
          test "$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')" = "$PROJECT_NUMBER"
          SERVICE_URL="$(gcloud run services describe "$WEBHOOK_SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          test -n "$SERVICE_URL"
          HOST="${SERVICE_URL#https://}"
          HOST="${HOST%/}"
          [[ "$HOST" != *'/'* ]]
          UNAUTH_STATUS="$(curl --silent --show-error --output /tmp/unauth-readyz --write-out '%{http_code}' "https://${HOST}/readyz")"
          test "$UNAUTH_STATUS" = 403
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo 'STAGING_WEBHOOK_PRIVATE_BOUNDARY=PASS'

      - name: Reconcile complete staging SLI and domain alert coverage
        env:
          HOST: ${{ steps.target.outputs.host }}
          EVIDENCE_DIR: staging-runtime-observability-evidence
        shell: bash
        run: |
          set -euo pipefail
          bash "$RECONCILE_SCRIPT"

      - name: Persist exact-run provenance
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          POLICY_SHA256: ${{ inputs.expected_policy_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          jq --arg sourceSha "$EXPECTED_SOURCE_SHA" --arg runId "$GITHUB_RUN_ID" --arg policySha256 "$POLICY_SHA256" '. + {sourceSha:$sourceSha,githubRunId:$runId,policySha256:$policySha256}' staging-runtime-observability-evidence/manifest.json > /tmp/manifest.json
          mv /tmp/manifest.json staging-runtime-observability-evidence/manifest.json
          sha256sum staging-runtime-observability-evidence/* > staging-runtime-observability-evidence/SHA256SUMS
          echo 'STAGING_RUNTIME_OBSERVABILITY_V3_PROVENANCE=PASS'

      - name: Upload runtime observability evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-runtime-observability-v3-${{ github.run_id }}
          path: staging-runtime-observability-evidence
          if-no-files-found: error
          retention-days: 90
