name: TEMP Instagram Eligibility Prettier Autofix

on:
  push:
    branches:
      - fix/instagram-canary-eligibility-readonly-v3

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/instagram-canary-eligibility-readonly-v3
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply repository Prettier exactly
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write test/instagram-engagement-canary-eligibility-readonly.test.ts
          git diff --check
      - name: Commit formatter result when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- test/instagram-engagement-canary-eligibility-readonly.test.ts; then
            echo 'PRETTIER_ALREADY_CLEAN=true'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/instagram-engagement-canary-eligibility-readonly.test.ts
          git commit -m 'style(instagram): apply repository prettier output'
          git push origin HEAD:fix/instagram-canary-eligibility-readonly-v3
