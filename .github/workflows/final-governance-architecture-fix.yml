name: Final Governance Architecture Fix One-Shot

on:
  push:
    branches: [chore/foundation-v1-privileged-workflow-cleanup]
    paths: ['.github/workflows/final-governance-architecture-fix.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: chore/foundation-v1-privileged-workflow-cleanup
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove legacy provisioner from architecture contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/infrastructure-control-plane-check.mjs')
          s = p.read_text()
          s = s.replace("  '.github/workflows/provision-instagram-publication-assets-gcs.yml',\n", '')
          s = s.replace("const legacyProvisionPath = '.github/workflows/provision-instagram-publication-assets-gcs.yml';\n", '')
          s = s.replace("const legacyProvision = readFileSync(legacyProvisionPath, 'utf8');\n", '')
          block = """for (const forbidden of ['--member=\"allUsers\"', '--member=\"allAuthenticatedUsers\"']) {\n  if (legacyProvision.includes(forbidden)) {\n    console.error(`Legacy publication provisioning contains forbidden public IAM: ${forbidden}`);\n    process.exit(1);\n  }\n}\n\n"""
          if block not in s:
              raise SystemExit('legacy provisioner validation block not found')
          s = s.replace(block, '')
          p.write_text(s)
          PY
          pnpm exec prettier --write scripts/infrastructure-control-plane-check.mjs
          pnpm architecture:check
      - name: Commit canonical architecture guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/infrastructure-control-plane-check.mjs
          git commit -m 'chore(governance): make control plane the sole bucket path'
          git push origin HEAD:chore/foundation-v1-privileged-workflow-cleanup
