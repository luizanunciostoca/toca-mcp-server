name: Video Generative Approved Generation

on:
  push:
    branches:
      - main
    paths:
      - control/video-generative-command.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: video-generative-approved-generation
  cancel-in-progress: false

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  PUBLICATION_ASSET_BUCKET: toca-mcp-publication-assets
  COMMAND_PATH: control/video-generative-command.json

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm quality

      - name: Validate immutable approved command
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .schemaVersion == 1 and
            .action == "GENERATE" and
            .commandId == "VIDEO-GEN-TP-DUAS-PISTAS-20260903-V1" and
            .contentItemId == "VID-TP-20260904-DUAS-PISTAS-GEN-001" and
            .sourceAssetId == "TP-GEN-0001" and
            .expectedSourceSha256 == "e16d4bc9dba27eb60a826d9be6fd3dade2f1e2e48445e1155a421cf52ca7d85b" and
            .routeType == "GENERATIVE_SCENE_CONTINUATION_VIDEO" and
            .overlayDriveFileId == "1KY8YLzEtX1w40WFImOyYyqwmI_52P69G" and
            .derivativeSeconds == 5 and
            .approvalRef == "CHAT:2026-09-03:GENERATIVE_MOTION_DUAS_PISTAS" and
            (.creativeDirection | type == "string" and length > 100)
          ' "$COMMAND_PATH" >/dev/null

      - name: Authenticate to Google Cloud, Drive and Sheets
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/drive.readonly,https://www.googleapis.com/auth/spreadsheets

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Resolve OpenAI Secret Manager binding
        shell: bash
        env:
          VIDEO_OPENAI_SECRET: ${{ vars.GCP_VIDEO_OPENAI_API_KEY_SECRET }}
          AG01_OPENAI_SECRET: ${{ vars.GCP_AG01_MODEL_API_KEY_SECRET }}
        run: |
          set -euo pipefail
          OPENAI_SECRET_ID=''
          for candidate in "$VIDEO_OPENAI_SECRET" "$AG01_OPENAI_SECRET" OPENAI_API_KEY toca-openai-api-key; do
            [[ -n "$candidate" ]] || continue
            if gcloud secrets describe "$candidate" --project "$PROJECT_ID" >/dev/null 2>&1; then
              OPENAI_SECRET_ID="$candidate"
              break
            fi
          done
          [[ -n "$OPENAI_SECRET_ID" ]] || {
            echo 'No governed OpenAI Secret Manager binding was found.' >&2
            exit 1
          }
          echo "OPENAI_SECRET_ID=$OPENAI_SECRET_ID" >> "$GITHUB_ENV"

      - name: Build immutable video generation image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/video-generative-approved:${GITHUB_SHA}"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --pull -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Execute one-time governed generation job
        id: generate
        shell: bash
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          JOB_NAME="toca-video-gen-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            set +e
            gcloud run jobs delete "$JOB_NAME" \
              --project "$PROJECT_ID" --region "$REGION" --quiet >/dev/null 2>&1
            set -e
          }
          trap cleanup EXIT

          gcloud run jobs deploy "$JOB_NAME" \
            --image "$IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-secrets "TOCA_SECRET_OPENAI_API_KEY=$OPENAI_SECRET_ID:latest" \
            --set-env-vars "^@^NODE_ENV=production@GCP_PROJECT_ID=$PROJECT_ID@INSTAGRAM_PUBLICATION_ASSET_BUCKET=$PUBLICATION_ASSET_BUCKET@GOOGLE_SHEETS_ACCESS_TOKEN_ENV_KEY=TOCA_VIDEO_GOOGLE_ACCESS_TOKEN@GOOGLE_DRIVE_ACCESS_TOKEN_ENV_KEY=TOCA_VIDEO_GOOGLE_ACCESS_TOKEN@TOCA_VIDEO_GOOGLE_ACCESS_TOKEN=$GOOGLE_ACCESS_TOKEN@OPENAI_API_KEY_ENV_KEY=TOCA_SECRET_OPENAI_API_KEY@OPENAI_VIDEO_MODEL=sora-2@VIDEO_GENERATIVE_COMMAND_PATH=$COMMAND_PATH" \
            --command node \
            --args dist/src/ops/video-generative-approved-case-runner.js \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 900s \
            --memory 2Gi \
            --cpu 2 \
            --quiet

          gcloud run jobs execute "$JOB_NAME" \
            --project "$PROJECT_ID" --region "$REGION" --wait --quiet

          LOGS="$(gcloud logging read \
            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${JOB_NAME}\"" \
            --project "$PROJECT_ID" --freshness=30m --limit=300 --order=asc \
            --format='value(textPayload)' || true)"
          RESULT_LINE="$(printf '%s\n' "$LOGS" | grep 'TOCA_VIDEO_GENERATIVE_RESULT=' | tail -n1 || true)"
          [[ -n "$RESULT_LINE" ]] || {
            echo 'Generative provider job completed without a result marker.' >&2
            exit 1
          }
          RESULT_JSON="${RESULT_LINE#*TOCA_VIDEO_GENERATIVE_RESULT=}"
          printf '%s' "$RESULT_JSON" | jq -e '
            .status == "GENERATED_APPROVAL_DERIVATIVE" and
            .contentItemId == "VID-TP-20260904-DUAS-PISTAS-GEN-001" and
            .sourceAssetId == "TP-GEN-0001" and
            .candidate.provider == "OPENAI_VIDEO_API" and
            .candidate.publicationEligible == false and
            .derivative.seconds == 5 and
            .derivative.overlayDriveFileId == "1KY8YLzEtX1w40WFImOyYyqwmI_52P69G" and
            .requiresHumanReview == true and
            .publicationAuthorized == false
          ' >/dev/null
          printf '%s\n' "$RESULT_JSON" > /tmp/video-generative-result.json
          echo "result_base64=$(base64 -w0 /tmp/video-generative-result.json)" >> "$GITHUB_OUTPUT"
          jq '{status,contentItemId,sourceAssetId,candidate:{outputSha256,artifactRef,provider,providerJobId,providerModel,seconds,size,publicationEligible},derivative:{seconds,outputSha256,objectName,signedUrlTtlSeconds,overlayDriveFileId},requiresHumanReview,publicationAuthorized}' /tmp/video-generative-result.json >> "$GITHUB_STEP_SUMMARY"

          cleanup
          trap - EXIT

      - name: Verify ephemeral job cleanup
        shell: bash
        run: |
          set -euo pipefail
          REMAINING="$(gcloud run jobs list \
            --project "$PROJECT_ID" --region "$REGION" \
            --filter="metadata.name:toca-video-gen-${GITHUB_RUN_ID}-" \
            --format='value(metadata.name)')"
          [[ -z "$REMAINING" ]] || {
            echo "Ephemeral video job remained after cleanup: $REMAINING" >&2
            exit 1
          }
