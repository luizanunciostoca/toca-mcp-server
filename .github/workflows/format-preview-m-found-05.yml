name: Format Preview M-FOUND-05

on:
  push:
    branches:
      - feat/m-found-05-approval-atomicity

permissions:
  contents: write

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact Prettier output
        run: |
          pnpm exec prettier --write src/core/executor.ts src/governance/approval-governance.ts
          if git diff --quiet -- src/core/executor.ts src/governance/approval-governance.ts; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/executor.ts src/governance/approval-governance.ts
          git commit -m "style: apply Prettier to M-FOUND-05 atomicity core"
          git push
