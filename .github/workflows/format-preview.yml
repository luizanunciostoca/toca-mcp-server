name: Format Preview

on:
  push:
    branches:
      - feat/m-found-02-capability-contract-v1-1

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Render Prettier diff
        run: |
          pnpm exec prettier --write \
            src/core/tool-registry.ts \
            src/governance/capability-catalog.ts \
            src/governance/capability-contract-overrides.ts \
            src/governance/capability-lifecycle.ts \
            src/governance/types.ts \
            test/capability-lifecycle.test.ts
          git diff -- \
            src/core/tool-registry.ts \
            src/governance/capability-catalog.ts \
            src/governance/capability-contract-overrides.ts \
            src/governance/capability-lifecycle.ts \
            src/governance/types.ts \
            test/capability-lifecycle.test.ts
