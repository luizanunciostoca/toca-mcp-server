name: Temporary Final Omnichannel Compose

on:
  push:
    branches:
      - feat/final-omnichannel-composition-20260820

permissions:
  contents: write

jobs:
  compose-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: feat/final-omnichannel-composition-20260820
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compose canonical WhatsApp inbound runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('src/omnichannel/whatsapp-runtime.ts')
          s = p.read_text()
          old = "    readonly message: MessageRecord;\n    readonly humanHandoff: boolean;"
          new = "    readonly message: MessageRecord;\n    readonly contentText?: string | null;\n    readonly humanHandoff: boolean;"
          if old not in s:
              raise SystemExit('WhatsAppCrmWorkflow input anchor not found')
          s = s.replace(old, new, 1)
          old = "      message,\n      humanHandoff,"
          new = "      message,\n      contentText: event.text,\n      humanHandoff,"
          if old not in s:
              raise SystemExit('WhatsApp workflow call anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/http.ts')
          s = p.read_text()
          anchor = "import { SERVER_NAME } from './server.js';\n"
          addition = "import {\n  createWhatsAppHttpComposition,\n  type WhatsAppHttpComposition,\n} from './omnichannel/whatsapp-http-composition.js';\n"
          if anchor not in s:
              raise SystemExit('http import anchor not found')
          s = s.replace(anchor, addition + anchor, 1)

          old = "const metaWebhook = createMetaWebhookBoundary();\nconst sendGridEventRuntime = await createEmailWebhookRuntime();"
          new = "const whatsappRuntime = createWhatsAppWebhookRuntime();\nconst metaWebhook = createMetaWebhookBoundary(whatsappRuntime);\nconst sendGridEventRuntime = await createEmailWebhookRuntime();"
          if old not in s:
              raise SystemExit('http composition anchor not found')
          s = s.replace(old, new, 1)

          anchor = "async function createEmailWebhookRuntime(): Promise<SendGridEventHttpRuntime | undefined> {\n"
          helper = "function createWhatsAppWebhookRuntime(): WhatsAppHttpComposition | undefined {\n  if (!isTrue(process.env.WHATSAPP_RUNTIME_ENABLED)) return undefined;\n  if (!config.DATABASE_URL?.trim()) throw new Error('WHATSAPP_DATABASE_URL_REQUIRED');\n  return createWhatsAppHttpComposition({\n    pool: createPostgresPool({ connectionString: config.DATABASE_URL }),\n    env: process.env,\n  });\n}\n\n"
          if anchor not in s:
              raise SystemExit('email helper anchor not found')
          s = s.replace(anchor, helper + anchor, 1)

          old = "function createMetaWebhookBoundary(): MetaWebhookHttpBoundary | undefined {"
          new = "function createMetaWebhookBoundary(\n  whatsappRuntime: WhatsAppHttpComposition | undefined,\n): MetaWebhookHttpBoundary | undefined {"
          if old not in s:
              raise SystemExit('meta boundary signature anchor not found')
          s = s.replace(old, new, 1)

          old = "    onEvents: async (events) => {\n"
          new = "    ...(whatsappRuntime\n      ? { onWhatsAppEvents: (events) => whatsappRuntime.ingest(events) }\n      : {}),\n    onEvents: async (events) => {\n"
          if old not in s:
              raise SystemExit('meta callbacks anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          pnpm exec prettier --write src/omnichannel/whatsapp-runtime.ts src/http.ts src/omnichannel/whatsapp-http-composition.ts
          pnpm quality
          git config user.name 'TOCA OS Integration'
          git config user.email 'actions@users.noreply.github.com'
          git add src/omnichannel/whatsapp-runtime.ts src/http.ts src/omnichannel/whatsapp-http-composition.ts
          git commit -m 'feat(omnichannel): wire WhatsApp inbound through CRM Privacy and AG-01'
          git push origin HEAD:feat/final-omnichannel-composition-20260820
