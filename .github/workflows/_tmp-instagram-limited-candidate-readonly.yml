name: TEMP Instagram Limited Candidate Readonly

on:
  push:
    branches:
      - fix/instagram-limited-zero-traffic-readback-v3

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: toca-mcp-production
      GCP_REGION: southamerica-east1
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
      GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      DAEMON_SERVICE_NAME: toca-managed-instagram-daemon
      CANDIDATE_REVISION: toca-managed-instagram-daemon-l1733157a1
      PRE_REVISION: toca-managed-instagram-daemon-d9434008a1
      EXPECTED_DIGEST: sha256:f100a2f81dd13047135e8920ef571bff8510b60dab4f72eb6b03257f25bb7830
      EXPECTED_SA: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
      EXPECTED_KB_SOURCES: SRC-OPS-001,SRC-MENU-002,SRC-LOC-001
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Inspect sanitized candidate invariants
        shell: bash
        run: |
          set -euo pipefail
          REVISION_JSON="$(gcloud run revisions describe "$CANDIDATE_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          SERVICE_JSON="$(gcloud run services describe "$DAEMON_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$REVISION_JSON" | jq -c \
            --arg digest "$EXPECTED_DIGEST" \
            --arg sa "$EXPECTED_SA" \
            --arg sources "$EXPECTED_KB_SOURCES" '
              .spec.containers[0] as $c |
              {
                ready: (([.status.conditions[]? | select(.type == "Ready") | .status] | last) == "True"),
                serviceAccount: (.spec.serviceAccountName == $sa),
                imageDigest: ($c.image | contains($digest)),
                command: ($c.command == ["node"]),
                args: ($c.args == ["dist/src/toca-managed-instagram-daemon.js"]),
                runtimeEnabled: (([($c.env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_RUNTIME_ENABLED") | .value] | last) == "true"),
                writesEnabled: (([($c.env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_WRITES_ENABLED") | .value] | last) == "true"),
                batchSize: (([($c.env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_BATCH_SIZE") | .value] | last) == "1"),
                publicationWrites: (([($c.env // [])[] | select(.name == "INSTAGRAM_PUBLICATION_WRITES_ENABLED") | .value] | last) == "false"),
                providerVerified: (([($c.env // [])[] | select(.name == "META_PROVIDER_VERIFIED") | .value] | last) == "true"),
                knowledgeSource: (([($c.env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_KNOWLEDGE_SOURCE") | .value] | last) == "postgres"),
                kbSources: (([($c.env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_KB_SOURCE_IDS") | .value] | last) == $sources)
              }'
          printf '%s' "$SERVICE_JSON" | jq -c \
            --arg candidate "$CANDIDATE_REVISION" \
            --arg previous "$PRE_REVISION" '
              {
                candidateTraffic: ([.status.traffic[]? | select((.revisionName // "") == $candidate) | (.percent // 0)] | add // 0),
                previousTraffic: ([.status.traffic[]? | select((.revisionName // "") == $previous) | (.percent // 0)] | add // 0),
                latestReadyIsCandidate: (.status.latestReadyRevisionName == $candidate)
              }'
