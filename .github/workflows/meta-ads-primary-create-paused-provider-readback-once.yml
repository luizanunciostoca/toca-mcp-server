name: Meta Ads Primary CREATE_PAUSED Provider Readback One-Shot

on:
  push:
    branches: [ops/meta-ads-primary-create-paused-311793958882290]
    paths: ['.github/workflows/meta-ads-primary-create-paused-provider-readback-once.yml']

permissions:
  contents: read
  id-token: write

jobs:
  readback:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: toca-mcp-production
      GCP_REGION: southamerica-east1
      GCP_ARTIFACT_REPOSITORY: toca-mcp
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
      GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
      TOKEN_SECRET_ID: toca-meta-oauth-token
      GRAPH_VERSION: v24.0
      ACCOUNT_ID: '311793958882290'
      SMOKE_ID: primary-create-paused-31920903042-1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Assert readback-only repository delta
        shell: bash
        run: |
          set -euo pipefail
          BASE='0f812077c84cea92547352320e2cc859ec832003'
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git diff --name-only "$BASE" HEAD | grep -Fx '.github/workflows/meta-ads-primary-create-paused-once.yml'
          git diff --name-only "$BASE" HEAD | grep -Fx '.github/workflows/meta-ads-primary-create-paused-recovery-once.yml'
          git diff --name-only "$BASE" HEAD | grep -Fx '.github/workflows/meta-ads-primary-create-paused-provider-readback-once.yml'
          git diff --name-only "$BASE" HEAD | grep -Fx 'scripts/meta-ads-create-paused-readback-once.ts'
          test "$(git diff --name-only "$BASE" HEAD | wc -l)" = '4'

      - name: Authenticate deployer to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - name: Build immutable read-only reconciliation image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/server:meta-ads-readback-${GITHUB_SHA}"
          JOB_NAME="toca-meta-ads-readback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "JOB_NAME=$JOB_NAME" >> "$GITHUB_ENV"

      - name: Deploy provider GET-only reconciliation job
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$JOB_NAME" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --command node \
            --args dist/scripts/meta-ads-create-paused-readback-once.js \
            --set-env-vars "GRAPH_VERSION=$GRAPH_VERSION,ACCOUNT_ID=$ACCOUNT_ID,SMOKE_ID=$SMOKE_ID" \
            --set-secrets "META_TOKEN=$TOKEN_SECRET_ID:latest" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 180s \
            --quiet

      - name: Execute read-only provider reconciliation and capture truth
        shell: bash
        run: |
          set +e
          gcloud run jobs execute "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet
          EXEC_STATUS=$?
          set -e

          RESULT_JSON=''
          for attempt in $(seq 1 12); do
            LINE="$(gcloud logging read \
              "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME} AND textPayload:\"META_ADS_CREATE_PAUSED_PROVIDER_READBACK=\"" \
              --project "$GCP_PROJECT_ID" --freshness=15m --limit=50 --order=desc \
              --format='value(textPayload)' | grep 'META_ADS_CREATE_PAUSED_PROVIDER_READBACK=' | head -n1 || true)"
            if [ -n "$LINE" ]; then
              RESULT_JSON="${LINE#META_ADS_CREATE_PAUSED_PROVIDER_READBACK=}"
              break
            fi
            sleep 5
          done

          if [ -z "$RESULT_JSON" ]; then
            echo "META_ADS_CREATE_PAUSED_PROVIDER_READBACK=NO_EVIDENCE exit=$EXEC_STATUS"
            gcloud logging read \
              "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME}" \
              --project "$GCP_PROJECT_ID" --freshness=15m --limit=100 --order=asc \
              --format='value(textPayload)' \
              | sed -E 's/(access_token[=:])[A-Za-z0-9._-]+/\1[REDACTED]/g; s/(Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g' \
              | tail -n 100
            exit 1
          fi

          printf '%s' "$RESULT_JSON" | jq -e \
            --arg account "$ACCOUNT_ID" \
            --arg smoke "$SMOKE_ID" '
              .accountId == $account and
              .smokeId == $smoke and
              .duplicateCounts.campaign == 1 and
              .duplicateCounts.adSet == 1 and
              .duplicateCounts.ad == 1 and
              (.resourceIds.campaignId | length > 0) and
              (.resourceIds.adSetId | length > 0) and
              (.resourceIds.creativeId | length > 0) and
              (.resourceIds.adId | length > 0) and
              .safety.configuredPaused == true and
              .safety.noActiveEffectiveStatus == true and
              .safety.zeroSpend == true
            ' >/dev/null

          printf '%s\n' "$RESULT_JSON" | jq . > meta-ads-create-paused-provider-readback.json
          echo "META_ADS_CREATE_PAUSED_PROVIDER_READBACK=PASS exit=$EXEC_STATUS"
          jq '{duplicateCounts,resourceIds,campaign,adSet,ad,creative,insights,spend,safety}' meta-ads-create-paused-provider-readback.json

      - name: Upload immutable sanitized readback evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meta-ads-create-paused-provider-readback-${{ github.run_id }}
          path: meta-ads-create-paused-provider-readback.json
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary provider readback job
        if: always()
        run: gcloud run jobs delete "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet || true
