name: Temporary Control Center Format Capture

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/human-control-center-next-20260820
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format target files
        run: >-
          pnpm exec prettier --write
          docs/architecture/human-control-center.md
          src/mcp/human-control-center.ts
          test/human-control-center.test.ts
      - name: Commit exact formatting when needed
        shell: bash
        run: |
          if git diff --quiet -- docs/architecture/human-control-center.md src/mcp/human-control-center.ts test/human-control-center.test.ts; then
            echo "FORMAT_ALREADY_CLEAN=1"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/human-control-center.md src/mcp/human-control-center.ts test/human-control-center.test.ts
          git commit -m "style(control-center): apply repository formatter"
          git push origin HEAD:feat/human-control-center-next-20260820
