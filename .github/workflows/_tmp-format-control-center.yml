name: Temporary Control Center Format Capture

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format-capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format target files
        run: >-
          pnpm exec prettier --write
          docs/architecture/human-control-center.md
          src/mcp/human-control-center.ts
          test/human-control-center.test.ts
      - name: Emit formatted payloads
        shell: bash
        run: |
          for file in docs/architecture/human-control-center.md src/mcp/human-control-center.ts test/human-control-center.test.ts; do
            echo "FORMAT_PAYLOAD_BEGIN=$file"
            base64 -w 0 "$file"
            echo
            echo "FORMAT_PAYLOAD_END=$file"
          done
