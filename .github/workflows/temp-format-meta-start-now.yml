name: Temp Format Meta Start Now

on:
  push:
    branches: [fix/meta-ads-the-party-0904-start-now]
    paths:
      - 'src/meta-ads-the-party-2026-09-04-start-now.ts'
      - '.github/workflows/temp-format-meta-start-now.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/meta-ads-the-party-0904-start-now
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/meta-ads-the-party-2026-09-04-start-now.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/meta-ads-the-party-2026-09-04-start-now.ts
          git commit -m 'chore(meta-ads): format immediate-start controller'
          git push origin HEAD:fix/meta-ads-the-party-0904-start-now
