name: Provider Onboarding WhatsApp READ

on:
  pull_request:
    paths:
      - '.github/workflows/provider-onboarding-whatsapp-read.yml'
      - 'scripts/whatsapp-provider-read-preflight.mjs'
  push:
    branches:
      - audit/provider-onboarding-email-whatsapp-20260821
    paths:
      - '.github/workflows/provider-onboarding-whatsapp-read.yml'
      - 'scripts/whatsapp-provider-read-preflight.mjs'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: provider-onboarding-whatsapp-read-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  whatsapp-read:
    name: Meta WhatsApp provider READ preflight
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: toca-mcp-production
      GCP_REGION: southamerica-east1
      GCP_ARTIFACT_REPOSITORY: toca-mcp
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
      GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
      META_ACCESS_TOKEN_SECRET: toca-meta-oauth-token
      META_GRAPH_BASE_URL: https://graph.facebook.com
      META_GRAPH_API_VERSION: v24.0
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout audit code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate probe syntax
        run: node --check scripts/whatsapp-provider-read-preflight.mjs

      - name: Initialize sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg sha "$SOURCE_HEAD_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            '{schemaVersion:1,sourceSha:$sha,workflowRunId:$run,provider:"meta-whatsapp-cloud-api",mode:"READ_ONLY_PROVIDER_PREFLIGHT",pass:false,status:"INITIALIZED",safety:{providerWrites:false,messageSent:false,webhookMutated:false,templateMutated:false,lifecyclePromoted:false}}' \
            > whatsapp-provider-read.json

      - name: Authenticate deployer to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Build immutable WhatsApp READ probe image
        id: build
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          mkdir -p /tmp/whatsapp-read
          cp scripts/whatsapp-provider-read-preflight.mjs /tmp/whatsapp-read/probe.mjs
          cat > /tmp/whatsapp-read/Dockerfile <<'DOCKER'
          FROM node:24-bookworm-slim
          WORKDIR /app
          COPY probe.mjs ./probe.mjs
          USER node
          CMD ["node", "probe.mjs"]
          DOCKER
          IMAGE_REPOSITORY="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/provider-onboarding-whatsapp-read"
          IMAGE_TAG="${IMAGE_REPOSITORY}:${SOURCE_HEAD_SHA}"
          docker buildx build --pull --push --provenance=mode=max --sbom=true --metadata-file /tmp/build-metadata.json -t "$IMAGE_TAG" /tmp/whatsapp-read
          IMAGE_DIGEST="$(jq -r '."containerimage.digest" // empty' /tmp/build-metadata.json)"
          [[ "$IMAGE_DIGEST" == sha256:* ]]
          echo "IMAGE=${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=${IMAGE_DIGEST}" >> "$GITHUB_ENV"
          echo "JOB_NAME=toca-wa-read-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Execute GET-only Meta probe under runtime identity
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            gcloud run jobs delete "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          set +e
          gcloud run jobs deploy "$JOB_NAME" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars "SOURCE_SHA=${SOURCE_HEAD_SHA},META_GRAPH_BASE_URL=${META_GRAPH_BASE_URL},META_GRAPH_API_VERSION=${META_GRAPH_API_VERSION}" \
            --set-secrets "META_ACCESS_TOKEN=${META_ACCESS_TOKEN_SECRET}:latest" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 180s \
            --quiet
          DEPLOY_STATUS=$?
          set -e
          if [[ "$DEPLOY_STATUS" -ne 0 ]]; then
            jq \
              --arg digest "$IMAGE_DIGEST" \
              --arg runtime "$GCP_RUNTIME_SERVICE_ACCOUNT" \
              --arg secret "gcp-secret:${META_ACCESS_TOKEN_SECRET}:latest" \
              --argjson code "$DEPLOY_STATUS" \
              '.status="CLOUD_RUN_JOB_DEPLOY_BLOCKED" | .imageDigest=$digest | .runtimeIdentity=$runtime | .secretRef=$secret | .controlPlaneExitCode=$code' \
              whatsapp-provider-read.json > /tmp/evidence.json
            mv /tmp/evidence.json whatsapp-provider-read.json
            exit 0
          fi

          set +e
          gcloud run jobs execute "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet
          EXEC_STATUS=$?
          set -e

          RESULT_LINE="$(gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME} AND textPayload:\"TOCA_WHATSAPP_READ_RESULT=\"" \
            --project "$GCP_PROJECT_ID" \
            --freshness=30m \
            --limit=30 \
            --order=desc \
            --format='value(textPayload)' | grep 'TOCA_WHATSAPP_READ_RESULT=' | head -n1 || true)"
          if [[ -z "$RESULT_LINE" ]]; then
            jq \
              --arg digest "$IMAGE_DIGEST" \
              --arg runtime "$GCP_RUNTIME_SERVICE_ACCOUNT" \
              --arg secret "gcp-secret:${META_ACCESS_TOKEN_SECRET}:latest" \
              --argjson code "$EXEC_STATUS" \
              '.status="PROBE_RESULT_MISSING" | .imageDigest=$digest | .runtimeIdentity=$runtime | .secretRef=$secret | .probeExitCode=$code' \
              whatsapp-provider-read.json > /tmp/evidence.json
            mv /tmp/evidence.json whatsapp-provider-read.json
            exit 0
          fi

          RESULT_JSON="${RESULT_LINE#TOCA_WHATSAPP_READ_RESULT=}"
          jq -e --arg sha "$SOURCE_HEAD_SHA" \
            '.schemaVersion==1 and .sourceSha==$sha and .safety.providerWrites==false and .safety.messageSent==false and .safety.lifecyclePromoted==false' \
            <<<"$RESULT_JSON" >/dev/null
          jq \
            --arg run "$GITHUB_RUN_ID" \
            --arg runtime "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --arg secret "gcp-secret:${META_ACCESS_TOKEN_SECRET}:latest" \
            --arg digest "$IMAGE_DIGEST" \
            --argjson exit "$EXEC_STATUS" \
            '. + {workflowRunId:$run,runtimeIdentity:$runtime,secretRef:$secret,imageDigest:$digest,probeExitCode:$exit,status:(if .pass then "READ_PREFLIGHT_PASS" else "READ_PREFLIGHT_BLOCKED" end),lifecycle:{whatsappMessageSend:"PLANNED_CATALOG_ONLY_NO_REAL_SEND",providerVerifiedPromoted:false,productionVerifiedPromoted:false}}' \
            <<<"$RESULT_JSON" > whatsapp-provider-read.json

      - name: Assert safety invariants
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.safety.providerWrites==false and .safety.messageSent==false and .safety.lifecyclePromoted==false' whatsapp-provider-read.json >/dev/null
          jq . whatsapp-provider-read.json

      - name: Upload sanitized WhatsApp evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: whatsapp-provider-read-${{ env.SOURCE_HEAD_SHA }}
          path: whatsapp-provider-read.json
          if-no-files-found: error
          retention-days: 90

      - name: Fail closed when provider preflight is incomplete
        if: always()
        run: jq -e '.pass == true' whatsapp-provider-read.json >/dev/null
