name: Materialize readiness remediation blob

on:
  push:
    branches: [fix/production-readiness-acceptance-diagnostics-20260826]
    paths:
      - '.github/workflows/apply-readiness-remediation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/production-readiness-acceptance-diagnostics-20260826
          fetch-depth: 1

      - name: Materialize exact bounded workflow blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deploy-gcp.yml')
          text = path.read_text()
          start_marker = '            gcloud run deploy "$PROBE_SERVICE" --image "$IMAGE"'
          end_marker = '            gcloud run revisions describe "$MCP_REVISION"'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]

          required = [
              '--min-instances 0 --max-instances 1',
              '--ingress internal --no-default-url --no-allow-unauthenticated --quiet',
              '.status.latestReadyRevisionName // empty',
              "test -n \"$PROBE_REVISION\" || { echo 'Ephemeral MCP acceptance service has no Ready revision' >&2; exit 1; }",
          ]
          for token in required:
              if block.count(token) != 1:
                  raise SystemExit(f'acceptance patch token count mismatch: {token!r} -> {block.count(token)}')

          block = block.replace('--min-instances 0 --max-instances 1', '--min-instances 1 --max-instances 1')
          block = block.replace(
              '--ingress internal --no-default-url --no-allow-unauthenticated --quiet',
              '--ingress internal --no-default-url --no-allow-unauthenticated \\\n              --no-deploy-health-check --quiet',
          )
          block = block.replace('.status.latestReadyRevisionName // empty', '.status.latestCreatedRevisionName // empty')
          block = block.replace(
              "test -n \"$PROBE_REVISION\" || { echo 'Ephemeral MCP acceptance service has no Ready revision' >&2; exit 1; }",
              "test -n \"$PROBE_REVISION\" || { echo 'Ephemeral MCP acceptance service has no created revision' >&2; exit 1; }",
          )

          wait = '''
            # Cloud Run still owns the /readyz startup gate. The workflow owns only the bounded
            # wait so a rejected revision can emit sanitized failed-check diagnostics before cleanup.
            PROBE_READY=Unknown
            PROBE_READY_REASON=Pending
            for _ in $(seq 1 18); do
              if gcloud run revisions describe "$PROBE_REVISION" \\
                --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \\
                > /tmp/mcp-acceptance-revision.json 2>/dev/null; then
                PROBE_READY="$(jq -r '[.status.conditions[]? | select(.type == "Ready") | .status] | last // "Unknown"' /tmp/mcp-acceptance-revision.json)"
                PROBE_READY_REASON="$(jq -r '[.status.conditions[]? | select(.type == "Ready") | .reason] | last // "Unknown"' /tmp/mcp-acceptance-revision.json)"
                [[ "$PROBE_READY" == True ]] && break
              fi
              sleep 5
            done

            if [[ "$PROBE_READY" != True ]]; then
              READINESS_DIAGNOSTICS="$(gcloud logging read \\
                "resource.type=\\"cloud_run_revision\\" AND resource.labels.service_name=\\"${PROBE_SERVICE}\\" AND resource.labels.revision_name=\\"${PROBE_REVISION}\\" AND textPayload:\\"TOCA_READINESS_NOT_READY\\"" \\
                --project "$GCP_PROJECT_ID" --freshness=10m --limit=20 --order=desc \\
                --format='value(textPayload)' 2>/dev/null \\
                | grep -E '^TOCA_READINESS_NOT_READY failed_checks=[A-Za-z0-9_,.-]*$' \\
                | head -n 5 || true)"
              jq -n \\
                --arg probeService "$PROBE_SERVICE" \\
                --arg probeRevision "$PROBE_REVISION" \\
                --arg readyStatus "$PROBE_READY" \\
                --arg readyReason "$PROBE_READY_REASON" \\
                --arg readinessDiagnostics "$READINESS_DIAGNOSTICS" \\
                '{schemaVersion:"toca.platform.mcp-internal-probe-failure.v1",probeService:$probeService,probeRevision:$probeRevision,readyStatus:$readyStatus,readyReason:$readyReason,readinessDiagnostics:($readinessDiagnostics|split("\\n")|map(select(length>0))),secretPayloadDisclosed:false,providerCallExecuted:false,result:"FAIL"}' \\
                > platform-evidence/mcp-internal-probe-failure.json
              printf 'Ephemeral MCP acceptance failed Ready gate: status=%s reason=%s\\n' "$PROBE_READY" "$PROBE_READY_REASON" >&2
              [[ -z "$READINESS_DIAGNOSTICS" ]] || printf '%s\\n' "$READINESS_DIAGNOSTICS" >&2
              cleanup_internal_mcp_probe
              trap - EXIT
              exit 1
            fi

          '''
          block += wait
          text = text[:start] + block + text[end:]

          if text.count('toca.platform.mcp-internal-probe.v3') != 1:
              raise SystemExit('expected exactly one v3 success evidence object')
          text = text.replace('toca.platform.mcp-internal-probe.v3', 'toca.platform.mcp-internal-probe.v4')
          text = text.replace('mechanism:"cloud-run-native-startup-readiness"', 'mechanism:"cloud-run-native-startup-readiness-controlled-wait"')
          text = text.replace(
              'acceptanceDefaultUrlDisabled:true,exactReleaseShaMatched:true',
              'acceptanceDefaultUrlDisabled:true,deployHealthCheckWaitDisabled:true,temporaryMinInstance:1,exactReleaseShaMatched:true',
          )
          path.write_text(text)
          PY

          git diff --check -- .github/workflows/deploy-gcp.yml
          CONTENT_B64="$(base64 -w0 .github/workflows/deploy-gcp.yml)"
          PAYLOAD="$(jq -n --arg content "$CONTENT_B64" '{content:$content,encoding:"base64"}')"
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
            -d "$PAYLOAD")"
          BLOB_SHA="$(jq -r '.sha // empty' <<<"$RESPONSE")"
          [[ "$BLOB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Patched workflow blob SHA missing' >&2; exit 1; }
          echo "PATCHED_WORKFLOW_BLOB_SHA=$BLOB_SHA"
