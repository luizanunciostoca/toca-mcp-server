name: Meta Ads Format One-Shot

on:
  push:
    branches: [fix/meta-ads-primary-account-311793958882290]
    paths: ['.github/workflows/meta-ads-format-once.yml']

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only regression test
        run: pnpm exec prettier --write test/meta-ads-primary-account-binding.test.ts
      - name: Commit formatted test only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = 'test/meta-ads-primary-account-binding.test.ts'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/meta-ads-primary-account-binding.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'style(meta-ads): format primary account regression test'
          git push origin HEAD:fix/meta-ads-primary-account-311793958882290
