name: Materialize readiness indentation fix

on:
  push:
    branches: [fix/production-readiness-acceptance-diagnostics-20260826]
    paths:
      - '.github/workflows/materialize-readiness-indent-fix.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/production-readiness-acceptance-diagnostics-20260826
          fetch-depth: 1

      - name: Fix only readiness controlled-wait indentation and create blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deploy-gcp.yml')
          text = path.read_text()
          start_marker = '\n  # Cloud Run still owns the /readyz startup gate.'
          end_marker = '\n            gcloud run revisions describe "$MCP_REVISION"'
          start = text.index(start_marker) + 1
          end = text.index(end_marker, start)
          block = text[start:end]
          lines = block.splitlines()
          if not lines or not lines[0].startswith('  # Cloud Run still owns'):
              raise SystemExit('unexpected readiness controlled-wait indentation')
          if any(line and not line.startswith('  ') for line in lines):
              raise SystemExit('unexpected unindented line inside controlled-wait block')
          fixed = '\n'.join(('          ' + line) if line else line for line in lines)
          text = text[:start] + fixed + text[end:]
          path.write_text(text)
          PY

          git diff --check -- .github/workflows/deploy-gcp.yml
          CONTENT_B64="$(base64 -w0 .github/workflows/deploy-gcp.yml)"
          PAYLOAD="$(jq -n --arg content "$CONTENT_B64" '{content:$content,encoding:"base64"}')"
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
            -d "$PAYLOAD")"
          BLOB_SHA="$(jq -r '.sha // empty' <<<"$RESPONSE")"
          [[ "$BLOB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Corrected workflow blob SHA missing' >&2; exit 1; }
          echo "CORRECTED_WORKFLOW_BLOB_SHA=$BLOB_SHA"
