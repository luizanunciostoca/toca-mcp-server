name: Paid Media Read Diagnostic TEMP

on:
  push:
    branches:
      - ops/paid-media-read-smoke-20260813

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REVISION: toca-mcp-staging-00007-fd2

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud logging read "resource.type=cloud_run_revision AND resource.labels.revision_name=$REVISION" --project "$PROJECT_ID" --limit 100 --freshness 30m --format='value(timestamp,severity,textPayload,jsonPayload.message)'
