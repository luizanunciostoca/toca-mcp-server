name: P1.3 Meta Ads Readback

on:
  workflow_dispatch:
  push:
    branches: [ops/p1-3-meta-ads-preflight-fix-20260828]
    paths:
      - '.github/workflows/p1-3-meta-ads-readback.yml'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_ARTIFACT_REPOSITORY: toca-mcp
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  DATABASE_SECRET_ID: toca-database-url
  TOKEN_SECRET_ID: toca-meta-oauth-token
  MCP_SERVICE_NAME: toca-mcp-production
  META_APP_ID: '2281930145887404'
  META_REDIRECT_URI: https://toca-meta-oauth-staging-990081828836.southamerica-east1.run.app/oauth/meta/callback
  META_ADS_ACCOUNT_ID: '311793958882290'
  META_ADS_SMOKE_ID: prepare-33149821139-1
  META_ADS_SMOKE_APPROVED_SHA256: eb7aec363f249583f3a03ba7acb5a0487eda57255a52905b9138cf6009fe1260

jobs:
  readback:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Assert public MCP Meta Ads writes remain disabled
        shell: bash
        run: |
          set -euo pipefail
          MCP_JSON="$(gcloud run services describe "$MCP_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$MCP_JSON" | jq -e '
            .spec.template.spec.containers[0] as $container |
            ([ $container.env[]? | select(.name == "META_ADS_WRITE_ENABLED" and .value == "true") ] | length == 0)
          ' >/dev/null

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - name: Build and push immutable readback image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/server:p1-3-readback-${GITHUB_SHA}"
          JOB_NAME="toca-meta-ads-readback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "JOB_NAME=$JOB_NAME" >> "$GITHUB_ENV"

      - name: Deploy read-only reconciliation job
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$JOB_NAME" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --command node \
            --args dist/src/meta-ads-smoke-readback.js \
            --set-env-vars "^~^NODE_ENV=production~MCP_ENABLED=false~META_ENABLED=true~META_WEBHOOK_ENABLED=false~META_WEBHOOK_PERSISTENCE_ENABLED=false~INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=false~INSTAGRAM_PUBLICATION_WRITES_ENABLED=false~META_ADS_READ_ENABLED=true~META_ADS_WRITE_ENABLED=false~META_APP_ID=$META_APP_ID~META_APP_SECRET_PROVIDER=env~META_APP_SECRET_KEY=UNUSED_META_APP_SECRET~META_AUTHORIZATION_ENDPOINT=https://www.facebook.com/dialog/oauth~META_TOKEN_ENDPOINT=https://graph.facebook.com/oauth/access_token~META_REDIRECT_URI=$META_REDIRECT_URI~META_REQUESTED_SCOPES=ads_read,ads_management,business_management~META_GRAPH_BASE_URL=https://graph.facebook.com~META_GRAPH_API_VERSION=v24.0~META_TOKEN_STORE_PROVIDER=gcp-secret-manager~META_TOKEN_SECRET_ID=$TOKEN_SECRET_ID~GCP_PROJECT_ID=$GCP_PROJECT_ID~META_ADS_SMOKE_ACCOUNT_ID=$META_ADS_ACCOUNT_ID~META_ADS_SMOKE_ID=$META_ADS_SMOKE_ID~META_ADS_SMOKE_APPROVED_SHA256=$META_ADS_SMOKE_APPROVED_SHA256" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 180s \
            --quiet

      - name: Execute readback and capture evidence
        id: readback
        shell: bash
        run: |
          set -u -o pipefail
          set +e
          gcloud run jobs execute "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet
          EXEC_STATUS=$?
          set -e

          gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME}" \
            --project "$GCP_PROJECT_ID" --freshness=20m --limit=200 --order=asc \
            --format='value(textPayload)' > p1-3-meta-ads-readback-job.log || true

          RESULT_LINE="$(grep 'META_ADS_SMOKE_READBACK_RESULT=' p1-3-meta-ads-readback-job.log | tail -n1 || true)"
          FAILURE_LINE="$(grep 'META_ADS_SMOKE_READBACK_FAILURE=' p1-3-meta-ads-readback-job.log | tail -n1 || true)"

          if [ -n "$RESULT_LINE" ]; then
            RESULT_JSON="${RESULT_LINE#*META_ADS_SMOKE_READBACK_RESULT=}"
            printf '%s\n' "$RESULT_JSON" | jq -e '
              .mode == "READBACK" and
              .providerMutationExecuted == false and
              .smokeId == "prepare-33149821139-1" and
              .approvedRequestSha256 == "eb7aec363f249583f3a03ba7acb5a0487eda57255a52905b9138cf6009fe1260"
            ' >/dev/null
            printf '%s\n' "$RESULT_JSON" | jq '.' > p1-3-meta-ads-readback.json
          fi

          if [ -n "$FAILURE_LINE" ]; then
            FAILURE_JSON="${FAILURE_LINE#*META_ADS_SMOKE_READBACK_FAILURE=}"
            printf '%s\n' "$FAILURE_JSON" | jq '.' > p1-3-meta-ads-readback-failure.json || true
          fi

          printf '{"executionExitCode":%s,"resultCaptured":%s,"failureCaptured":%s}\n' \
            "$EXEC_STATUS" \
            "$([ -n "$RESULT_LINE" ] && echo true || echo false)" \
            "$([ -n "$FAILURE_LINE" ] && echo true || echo false)" \
            > p1-3-meta-ads-readback-execution.json

          if [ "$EXEC_STATUS" -ne 0 ] || [ -z "$RESULT_LINE" ]; then
            exit 1
          fi

      - name: Upload readback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-3-meta-ads-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            p1-3-meta-ads-readback.json
            p1-3-meta-ads-readback-failure.json
            p1-3-meta-ads-readback-execution.json
            p1-3-meta-ads-readback-job.log
          if-no-files-found: error

      - name: Reassert public MCP Meta Ads writes remain disabled
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          MCP_JSON="$(gcloud run services describe "$MCP_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$MCP_JSON" | jq -e '
            .spec.template.spec.containers[0] as $container |
            ([ $container.env[]? | select(.name == "META_ADS_WRITE_ENABLED" and .value == "true") ] | length == 0)
          ' >/dev/null

      - name: Remove temporary readback job
        if: always()
        run: gcloud run jobs delete "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet || true
