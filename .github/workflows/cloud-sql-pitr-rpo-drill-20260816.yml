name: Cloud SQL PITR RPO Drill v2 2026-08-16

on:
  push:
    branches: [ops/cloud-sql-pitr-rpo-drill-20260816]
    paths: ['.github/workflows/cloud-sql-pitr-rpo-drill-20260816.yml']

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  REPO_BASELINE_SHA: e0696df1d1860261afba78f1634e8c979401cdc7
  SOURCE_INSTANCE: toca-mcp-db
  PROD_SERVICE: toca-mcp-production
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_INFRA_ADMIN_SERVICE_ACCOUNT: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  DATABASE_URL_SECRET: toca-database-url

jobs:
  pitr-rpo-drill:
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Authenticate as infrastructure administrator
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_INFRA_ADMIN_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Preflight privileged cleanup authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          TOKEN="$(gcloud auth print-access-token)"
          printf '%s' '{"permissions":["cloudsql.instances.get","cloudsql.instances.update"]}' >/tmp/infra-perms-request.json
          HTTP="$(curl --silent --output /tmp/infra-perms.json --write-out '%{http_code}' -X POST \
            -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
            --data-binary @/tmp/infra-perms-request.json \
            "https://cloudresourcemanager.googleapis.com/v1/projects/${GCP_PROJECT_ID}:testIamPermissions")"
          if [ "$HTTP" != 200 ]; then
            echo "INFRA_PREFLIGHT_HTTP=$HTTP" >&2
            cat /tmp/infra-perms.json >&2 || true
            exit 80
          fi
          for P in cloudsql.instances.get cloudsql.instances.update; do
            if ! jq -e --arg p "$P" '(.permissions // []) | index($p) != null' /tmp/infra-perms.json >/dev/null; then
              echo "INFRA_PREFLIGHT_MISSING_PERMISSION=$P" >&2
              cat /tmp/infra-perms.json >&2
              exit 81
            fi
          done

          SOURCE="$(gcloud sql instances describe "$SOURCE_INSTANCE" --project "$GCP_PROJECT_ID" --format=json)"
          printf '%s' "$SOURCE" | jq -e '
            .name=="toca-mcp-db" and
            .state=="RUNNABLE" and
            .databaseVersion=="POSTGRES_18" and
            .region=="southamerica-east1" and
            .settings.deletionProtectionEnabled==true and
            .settings.backupConfiguration.enabled==true and
            .settings.backupConfiguration.pointInTimeRecoveryEnabled==true
          ' >/dev/null
          printf '%s' "$SOURCE" | jq '{name,state,databaseVersion,region,settings:{deletionProtectionEnabled:.settings.deletionProtectionEnabled,backupEnabled:.settings.backupConfiguration.enabled,pitrEnabled:.settings.backupConfiguration.pointInTimeRecoveryEnabled,tier:.settings.tier,edition:.settings.edition,availabilityType:.settings.availabilityType,dataDiskType:.settings.dataDiskType,dataDiskSizeGb:.settings.dataDiskSizeGb}}' > evidence/source-before.json
          echo 'PITR_INFRA_ADMIN_PREFLIGHT=PASS'

      - name: Authenticate as deployer
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Select temporal boundary and create isolated PITR target
        shell: bash
        run: |
          set -euo pipefail
          TARGET="toca-mcp-pitr-${GITHUB_RUN_ID}"
          PROBE_JOB="toca-mcp-pitr-probe-${GITHUB_RUN_ID}"
          SOURCE_CONNECTION="${GCP_PROJECT_ID}:${GCP_REGION}:${SOURCE_INSTANCE}"
          TARGET_CONNECTION="${GCP_PROJECT_ID}:${GCP_REGION}:${TARGET}"
          STATE="evidence/dr-state.json"

          case "$TARGET" in toca-mcp-pitr-*) ;; *) exit 90 ;; esac
          test "$TARGET" != "$SOURCE_INSTANCE"
          if gcloud sql instances describe "$TARGET" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            echo 'PITR_TARGET_ALREADY_EXISTS' >&2
            exit 91
          fi

          cleanup_probe() {
            set +e
            gcloud run jobs delete "$PROBE_JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup_probe EXIT

          TOKEN="$(gcloud auth print-access-token)"
          printf '%s' '{"permissions":["cloudsql.instances.get","cloudsql.instances.clone","cloudsql.instances.delete"]}' >/tmp/deployer-perms-request.json
          HTTP="$(curl --silent --output /tmp/deployer-perms.json --write-out '%{http_code}' -X POST \
            -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
            --data-binary @/tmp/deployer-perms-request.json \
            "https://cloudresourcemanager.googleapis.com/v1/projects/${GCP_PROJECT_ID}:testIamPermissions")"
          if [ "$HTTP" != 200 ]; then
            echo "DEPLOYER_PREFLIGHT_HTTP=$HTTP" >&2
            cat /tmp/deployer-perms.json >&2 || true
            exit 82
          fi
          for P in cloudsql.instances.get cloudsql.instances.clone cloudsql.instances.delete; do
            if ! jq -e --arg p "$P" '(.permissions // []) | index($p) != null' /tmp/deployer-perms.json >/dev/null; then
              echo "DEPLOYER_PREFLIGHT_MISSING_PERMISSION=$P" >&2
              cat /tmp/deployer-perms.json >&2
              exit 83
            fi
          done
          echo 'PITR_DEPLOYER_PREFLIGHT=PASS'

          SOURCE="$(gcloud sql instances describe "$SOURCE_INSTANCE" --project "$GCP_PROJECT_ID" --format=json)"
          printf '%s' "$SOURCE" | jq -e '.name=="toca-mcp-db" and .state=="RUNNABLE" and .databaseVersion=="POSTGRES_18" and .region=="southamerica-east1" and .settings.deletionProtectionEnabled==true and .settings.backupConfiguration.enabled==true and .settings.backupConfiguration.pointInTimeRecoveryEnabled==true' >/dev/null

          RHTTP="$(curl --silent --output /tmp/recovery.json --write-out '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://sqladmin.googleapis.com/v1/projects/${GCP_PROJECT_ID}/instances/${SOURCE_INSTANCE}/getLatestRecoveryTime")"
          if [ "$RHTTP" != 200 ]; then
            echo "LATEST_RECOVERY_HTTP=$RHTTP" >&2
            cat /tmp/recovery.json >&2 || true
            exit 84
          fi
          EARLIEST_RECOVERY="$(jq -r '.earliestRecoveryTime // empty' /tmp/recovery.json)"
          LATEST_RECOVERY="$(jq -r '.latestRecoveryTime // empty' /tmp/recovery.json)"
          test -n "$EARLIEST_RECOVERY"
          test -n "$LATEST_RECOVERY"
          REFERENCE_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          REFERENCE_EPOCH="$(date -u -d "$REFERENCE_AT" +%s)"
          LATEST_EPOCH="$(date -u -d "$LATEST_RECOVERY" +%s)"
          PROVIDER_LATEST_LAG=$((REFERENCE_EPOCH - LATEST_EPOCH))
          if [ "$PROVIDER_LATEST_LAG" -lt 0 ] && [ "$PROVIDER_LATEST_LAG" -ge -30 ]; then PROVIDER_LATEST_LAG=0; fi
          test "$PROVIDER_LATEST_LAG" -ge 0
          if [ "$PROVIDER_LATEST_LAG" -gt 900 ]; then
            echo "PITR_PROVIDER_LATEST_RPO_OBJECTIVE_FAILED lag_seconds=$PROVIDER_LATEST_LAG" >&2
            exit 85
          fi
          echo "PITR_RECOVERY_WINDOW=PASS latest=$LATEST_RECOVERY provider_latest_lag_seconds=$PROVIDER_LATEST_LAG"

          SERVICE="$(gcloud run services describe "$PROD_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          PROD_IMAGE="$(jq -r '.spec.template.spec.containers[0].image // empty' <<<"$SERVICE")"
          REVISION="$(jq -r '.status.latestReadyRevisionName // empty' <<<"$SERVICE")"
          test -n "$PROD_IMAGE"
          test -n "$REVISION"
          REV="$(gcloud run revisions describe "$REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          PROD_DIGEST="$(jq -r '.status.imageDigest // empty' <<<"$REV")"
          test -n "$PROD_DIGEST"

          cat >/tmp/probe.mjs <<'NODE'
          import { createRequire } from 'node:module';
          const require = createRequire('/app/package.json');
          const pg = require('pg');
          const url = new URL(process.env.SOURCE_DATABASE_URL);
          url.searchParams.set('host', `/cloudsql/${process.env.SOURCE_CONNECTION}`);
          const pool = new pg.Pool({ connectionString: url.toString() });
          try {
            const result = await pool.query(`
              select kind,id,ts
              from (
                select 'operational_signals'::text as kind, signal_id::text as id, occurred_at as ts
                from operational_signals
                where occurred_at >= now() - interval '30 minutes'
                union all
                select 'audit_ledger_events'::text as kind, event_id::text as id, created_at as ts
                from audit_ledger_events
                where created_at >= now() - interval '30 minutes'
              ) temporal
              order by ts asc, kind, id
              limit 1000
            `);
            const rows = result.rows.map(r => ({kind:r.kind,id:r.id,ts:new Date(r.ts).toISOString()}));
            if (rows.length < 2) throw new Error(`DR_TEMPORAL_EVIDENCE_INSUFFICIENT:${rows.length}`);
            console.log(`DR_MARKERS_B64=${Buffer.from(JSON.stringify(rows)).toString('base64')}`);
          } finally {
            await pool.end();
          }
          NODE
          PROBE_B64="$(base64 -w0 /tmp/probe.mjs)"
          rm -f /tmp/probe.mjs
          PROBE_SCRIPT='set -eu; printf %s "$DR_SCRIPT_B64" | base64 -d >/tmp/probe.mjs; node /tmp/probe.mjs; rm -f /tmp/probe.mjs; unset SOURCE_DATABASE_URL DR_SCRIPT_B64'

          gcloud run jobs create "$PROBE_JOB" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --image "$PROD_IMAGE" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" --set-cloudsql-instances "$SOURCE_CONNECTION" \
            --set-secrets "SOURCE_DATABASE_URL=${DATABASE_URL_SECRET}:latest" \
            --set-env-vars "SOURCE_CONNECTION=${SOURCE_CONNECTION},DR_SCRIPT_B64=${PROBE_B64}" \
            --command /bin/sh --args="^@^-lc@${PROBE_SCRIPT}" --tasks 1 --parallelism 1 --max-retries 0 \
            --task-timeout 10m --memory 512Mi --cpu 1 --quiet
          gcloud run jobs execute "$PROBE_JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet

          MARKERS_B64=""
          for _ in $(seq 1 18); do
            LOGS="$(gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${PROBE_JOB}\"" --project "$GCP_PROJECT_ID" --freshness=30m --limit=300 --order=asc --format='value(textPayload)' || true)"
            MARKERS_B64="$(printf '%s\n' "$LOGS" | grep -o 'DR_MARKERS_B64=[A-Za-z0-9+/=]*' | tail -1 | cut -d= -f2- || true)"
            [ -n "$MARKERS_B64" ] && break
            sleep 5
          done
          test -n "$MARKERS_B64"
          printf '%s' "$MARKERS_B64" | base64 -d >/tmp/markers.json
          jq -e 'type=="array" and length>=2' /tmp/markers.json >/dev/null

          MARKERS_JSON=/tmp/markers.json EARLIEST="$EARLIEST_RECOVERY" LATEST="$LATEST_RECOVERY" REFERENCE="$REFERENCE_AT" node - <<'NODE' >/tmp/selection.json
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync(process.env.MARKERS_JSON,'utf8'))
            .map(r => ({...r, ms: Date.parse(r.ts)}))
            .filter(r => Number.isFinite(r.ms))
            .sort((a,b) => a.ms-b.ms || a.kind.localeCompare(b.kind) || a.id.localeCompare(b.id));
          const earliest = Date.parse(process.env.EARLIEST);
          const latest = Date.parse(process.env.LATEST);
          const reference = Date.parse(process.env.REFERENCE);
          let selected = null;
          for (let i=0; i<rows.length-1; i++) {
            const before = rows[i];
            for (let j=i+1; j<rows.length; j++) {
              const after = rows[j];
              const gapMs = after.ms - before.ms;
              if (gapMs < 5000) continue;
              if (gapMs > 300000) break;
              const pointMs = before.ms + 2000;
              if (pointMs >= after.ms) continue;
              if (pointMs < earliest || pointMs > latest) continue;
              const rpoSeconds = Math.ceil((reference - pointMs) / 1000);
              if (rpoSeconds < 0 || rpoSeconds > 900) continue;
              if (!selected || pointMs > selected.pointMs) selected = {before,after,pointMs,rpoSeconds};
              break;
            }
          }
          if (!selected) {
            console.error('DR_NO_SAFE_TEMPORAL_BOUNDARY_WITHIN_RPO_OBJECTIVE');
            process.exit(1);
          }
          selected.pointInTime = new Date(selected.pointMs).toISOString();
          process.stdout.write(JSON.stringify(selected));
          NODE

          PITR_POINT="$(jq -r '.pointInTime' /tmp/selection.json)"
          SELECTED_RPO="$(jq -r '.rpoSeconds' /tmp/selection.json)"
          BEFORE_KIND="$(jq -r '.before.kind' /tmp/selection.json)"
          BEFORE_ID="$(jq -r '.before.id' /tmp/selection.json)"
          BEFORE_TS="$(jq -r '.before.ts' /tmp/selection.json)"
          AFTER_KIND="$(jq -r '.after.kind' /tmp/selection.json)"
          AFTER_ID="$(jq -r '.after.id' /tmp/selection.json)"
          AFTER_TS="$(jq -r '.after.ts' /tmp/selection.json)"
          test "$SELECTED_RPO" -ge 0
          test "$SELECTED_RPO" -le 900
          echo "PITR_TEMPORAL_BOUNDARY=PASS point=$PITR_POINT rpo_seconds=$SELECTED_RPO before=$BEFORE_KIND:$BEFORE_ID@$BEFORE_TS after=$AFTER_KIND:$AFTER_ID@$AFTER_TS"

          gcloud run jobs delete "$PROBE_JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet
          trap - EXIT

          RESTORE_STARTED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg repoBaselineSha "$REPO_BASELINE_SHA" \
            --arg workflowSha "$GITHUB_SHA" \
            --arg sourceInstance "$SOURCE_INSTANCE" \
            --arg targetInstance "$TARGET" \
            --arg targetConnection "$TARGET_CONNECTION" \
            --arg productionImage "$PROD_IMAGE" \
            --arg productionImageDigest "$PROD_DIGEST" \
            --arg earliestRecoveryTime "$EARLIEST_RECOVERY" \
            --arg latestRecoveryTime "$LATEST_RECOVERY" \
            --arg referenceAt "$REFERENCE_AT" \
            --arg pitrPoint "$PITR_POINT" \
            --arg beforeKind "$BEFORE_KIND" \
            --arg beforeId "$BEFORE_ID" \
            --arg beforeTimestamp "$BEFORE_TS" \
            --arg afterKind "$AFTER_KIND" \
            --arg afterId "$AFTER_ID" \
            --arg afterTimestamp "$AFTER_TS" \
            --arg restoreStarted "$RESTORE_STARTED" \
            --argjson providerLatestLagSeconds "$PROVIDER_LATEST_LAG" \
            --argjson selectedRpoSeconds "$SELECTED_RPO" \
            '{repoBaselineSha:$repoBaselineSha,workflowSha:$workflowSha,sourceInstance:$sourceInstance,targetInstance:$targetInstance,targetConnection:$targetConnection,productionImage:$productionImage,productionImageDigest:$productionImageDigest,recoveryWindow:{earliest:$earliestRecoveryTime,latest:$latestRecoveryTime,referenceAt:$referenceAt,providerLatestLagSeconds:$providerLatestLagSeconds},selectedRecovery:{pointInTime:$pitrPoint,measuredRpoSeconds:$selectedRpoSeconds},temporalBoundary:{before:{kind:$beforeKind,id:$beforeId,timestamp:$beforeTimestamp},after:{kind:$afterKind,id:$afterId,timestamp:$afterTimestamp}},timing:{restoreStarted:$restoreStarted,restoreRunnableAt:null,validationCompletedAt:null,restoreSeconds:null,rtoSeconds:null},validation:{passed:false,migrationCount:null,criticalTableCount:null,beforeMarkerPresent:false,afterMarkerAbsent:false},restore:{targetCreated:false,deletionProtectionDisabled:false},cleanup:{probeJobDeleted:true,validationJobDeleted:false,targetDeleted:false},production:{mutatedByDrill:false,unchangedSettingsReadback:false}}' > "$STATE"

          START_EPOCH="$(date -u -d "$RESTORE_STARTED" +%s)"
          gcloud sql instances clone "$SOURCE_INSTANCE" "$TARGET" \
            --project "$GCP_PROJECT_ID" \
            --point-in-time "$PITR_POINT" \
            --quiet

          TJSON="$(gcloud sql instances describe "$TARGET" --project "$GCP_PROJECT_ID" --format=json)"
          printf '%s' "$TJSON" | jq -e --arg t "$TARGET" '.name==$t and .state=="RUNNABLE" and .databaseVersion=="POSTGRES_18" and .region=="southamerica-east1"' >/dev/null
          RESTORE_RUNNABLE_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RUNNABLE_EPOCH="$(date -u -d "$RESTORE_RUNNABLE_AT" +%s)"
          RESTORE_SECONDS=$((RUNNABLE_EPOCH - START_EPOCH))
          jq --arg at "$RESTORE_RUNNABLE_AT" --argjson s "$RESTORE_SECONDS" '.restore.targetCreated=true | .timing.restoreRunnableAt=$at | .timing.restoreSeconds=$s' "$STATE" >/tmp/state.json && mv /tmp/state.json "$STATE"
          echo "PITR_ISOLATED_TARGET_RUNNABLE=PASS target=$TARGET restore_seconds=$RESTORE_SECONDS"

      - name: Re-authenticate as infrastructure administrator to unlock only the temporary target
        if: always()
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_INFRA_ADMIN_SERVICE_ACCOUNT }}

      - name: Disable deletion protection only on the PITR target
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          TARGET="toca-mcp-pitr-${GITHUB_RUN_ID}"
          STATE="evidence/dr-state.json"
          case "$TARGET" in toca-mcp-pitr-*) ;; *) exit 90 ;; esac
          test "$TARGET" != "$SOURCE_INSTANCE"
          if ! TJSON="$(gcloud sql instances describe "$TARGET" --project "$GCP_PROJECT_ID" --format=json 2>/dev/null)"; then
            echo 'PITR_TARGET_NOT_CREATED_NO_UNLOCK_NEEDED=true'
            exit 0
          fi
          printf '%s' "$TJSON" | jq -e --arg t "$TARGET" '.name==$t and .name!="toca-mcp-db"' >/dev/null
          DP="$(jq -r '.settings.deletionProtectionEnabled // false' <<<"$TJSON")"
          if [ "$DP" != false ]; then
            gcloud sql instances patch "$TARGET" --project "$GCP_PROJECT_ID" --no-deletion-protection --quiet
          fi
          for _ in $(seq 1 30); do
            TJSON="$(gcloud sql instances describe "$TARGET" --project "$GCP_PROJECT_ID" --format=json)"
            DP="$(jq -r '.settings.deletionProtectionEnabled // false' <<<"$TJSON")"
            [ "$DP" = false ] && break
            sleep 5
          done
          test "$DP" = false
          if [ -f "$STATE" ]; then
            jq '.restore.deletionProtectionDisabled=true' "$STATE" >/tmp/state.json && mv /tmp/state.json "$STATE"
          fi
          echo 'PITR_TARGET_DELETION_PROTECTION_DISABLED=PASS'

      - name: Re-authenticate as deployer for validation
        if: always()
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Validate PITR data boundary, migrations and critical tables
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          STATE="evidence/dr-state.json"
          TARGET="toca-mcp-pitr-${GITHUB_RUN_ID}"
          JOB="toca-mcp-pitr-val-${GITHUB_RUN_ID}"
          if [ ! -f "$STATE" ]; then
            echo 'PITR_STATE_ABSENT_VALIDATION_SKIPPED=true'
            exit 0
          fi
          if ! gcloud sql instances describe "$TARGET" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            echo 'PITR_TARGET_ABSENT_VALIDATION_SKIPPED=true'
            exit 0
          fi

          cleanup_job() {
            set +e
            if gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1; then
              jq '.cleanup.validationJobDeleted=true' "$STATE" >/tmp/state.json && mv /tmp/state.json "$STATE"
            fi
          }
          trap cleanup_job EXIT

          PROD_IMAGE="$(jq -r '.productionImage' "$STATE")"
          TARGET_CONNECTION="$(jq -r '.targetConnection' "$STATE")"
          BEFORE_KIND="$(jq -r '.temporalBoundary.before.kind' "$STATE")"
          BEFORE_ID="$(jq -r '.temporalBoundary.before.id' "$STATE")"
          AFTER_KIND="$(jq -r '.temporalBoundary.after.kind' "$STATE")"
          AFTER_ID="$(jq -r '.temporalBoundary.after.id' "$STATE")"
          RESTORE_STARTED="$(jq -r '.timing.restoreStarted' "$STATE")"
          test -n "$PROD_IMAGE"
          test -n "$TARGET_CONNECTION"

          cat >/tmp/validate.mjs <<'NODE'
          import { createRequire } from 'node:module';
          const require = createRequire('/app/package.json');
          const pg = require('pg');
          const url = new URL(process.env.SOURCE_DATABASE_URL);
          url.searchParams.set('host', `/cloudsql/${process.env.TARGET_CONNECTION}`);
          const pool = new pg.Pool({ connectionString: url.toString() });
          const tables = ['schema_migrations','event_outbox','event_outbox_delivery_attempts','event_consumer_receipts','audit_ledger_events','audit_ledger_heads','operational_signals','event_records','event_record_revisions','event_record_external_refs','crm_contacts','crm_contact_channels','crm_leads','crm_opportunities','crm_record_revisions','crm_idempotency_keys','privacy_ledger_events','content_items','content_item_versions','content_item_validations','content_item_history','content_video_artifacts'];
          const triggers = ['audit_ledger_events_append_only','operational_signals_append_only','audit_ledger_heads_no_delete','privacy_ledger_no_update','privacy_ledger_no_delete','content_item_versions_append_only','content_item_validations_append_only','content_item_history_append_only','content_video_artifacts_append_only'];
          const markerExists = async (kind,id) => {
            if (kind === 'operational_signals') return (await pool.query('select 1 from operational_signals where signal_id=$1 limit 1',[id])).rowCount === 1;
            if (kind === 'audit_ledger_events') return (await pool.query('select 1 from audit_ledger_events where event_id=$1 limit 1',[id])).rowCount === 1;
            throw new Error(`DR_UNSUPPORTED_MARKER_KIND:${kind}`);
          };
          try {
            const versions = await pool.query('select version from schema_migrations order by version');
            if (versions.rows.length !== 16) throw new Error(`DR_MIGRATION_COUNT_MISMATCH:${versions.rows.length}`);
            for (const table of tables) {
              const reg = await pool.query('select to_regclass($1) as reg',[`public.${table}`]);
              if (!reg.rows[0]?.reg) throw new Error(`DR_TABLE_MISSING:${table}`);
              await pool.query(`select count(*)::bigint as n from ${table}`);
            }
            const fk = await pool.query(`select count(*)::int as n from pg_constraint c join pg_class r on r.oid=c.conrelid where c.contype='f' and r.relname = any($1::text[]) and not c.convalidated`,[tables]);
            if (fk.rows[0].n !== 0) throw new Error('DR_UNVALIDATED_FOREIGN_KEYS');
            const tgs = await pool.query(`select tgname,tgenabled from pg_trigger where not tgisinternal and tgname = any($1::text[])`,[triggers]);
            const enabled = new Set(tgs.rows.filter(r => r.tgenabled !== 'D').map(r => r.tgname));
            for (const name of triggers) if (!enabled.has(name)) throw new Error(`DR_TRIGGER_MISSING:${name}`);
            const beforePresent = await markerExists(process.env.BEFORE_KIND,process.env.BEFORE_ID);
            const afterPresent = await markerExists(process.env.AFTER_KIND,process.env.AFTER_ID);
            if (!beforePresent) throw new Error(`DR_BEFORE_MARKER_MISSING:${process.env.BEFORE_KIND}:${process.env.BEFORE_ID}`);
            if (afterPresent) throw new Error(`DR_AFTER_MARKER_UNEXPECTEDLY_PRESENT:${process.env.AFTER_KIND}:${process.env.AFTER_ID}`);
            console.log(`DR_PITR_VALIDATION=PASS migrations=${versions.rows.length} critical_tables=${tables.length} before_marker_present=1 after_marker_absent=1`);
          } finally {
            await pool.end();
          }
          NODE
          VALIDATE_B64="$(base64 -w0 /tmp/validate.mjs)"
          rm -f /tmp/validate.mjs
          VALIDATE_SCRIPT='set -eu; printf %s "$DR_SCRIPT_B64" | base64 -d >/tmp/validate.mjs; node /tmp/validate.mjs; rm -f /tmp/validate.mjs; unset SOURCE_DATABASE_URL DR_SCRIPT_B64'

          gcloud run jobs create "$JOB" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --image "$PROD_IMAGE" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" --set-cloudsql-instances "$TARGET_CONNECTION" \
            --set-secrets "SOURCE_DATABASE_URL=${DATABASE_URL_SECRET}:latest" \
            --set-env-vars "TARGET_CONNECTION=${TARGET_CONNECTION},BEFORE_KIND=${BEFORE_KIND},BEFORE_ID=${BEFORE_ID},AFTER_KIND=${AFTER_KIND},AFTER_ID=${AFTER_ID},DR_SCRIPT_B64=${VALIDATE_B64}" \
            --command /bin/sh --args="^@^-lc@${VALIDATE_SCRIPT}" --tasks 1 --parallelism 1 --max-retries 0 \
            --task-timeout 15m --memory 512Mi --cpu 1 --quiet
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet

          VLOGS=""
          for _ in $(seq 1 18); do
            VLOGS="$(gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${JOB}\"" --project "$GCP_PROJECT_ID" --freshness=30m --limit=300 --order=asc --format='value(textPayload)' || true)"
            printf '%s' "$VLOGS" | grep -q 'DR_PITR_VALIDATION=PASS' && break
            sleep 5
          done
          printf '%s\n' "$VLOGS"
          LINE="$(printf '%s\n' "$VLOGS" | grep 'DR_PITR_VALIDATION=PASS' | tail -1)"
          test -n "$LINE"
          MIGRATION_COUNT="$(sed -n 's/.*migrations=\([0-9][0-9]*\).*/\1/p' <<<"$LINE")"
          CRITICAL_TABLE_COUNT="$(sed -n 's/.*critical_tables=\([0-9][0-9]*\).*/\1/p' <<<"$LINE")"
          test "$MIGRATION_COUNT" = 16
          test "$CRITICAL_TABLE_COUNT" -ge 21
          VALIDATION_COMPLETED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          START_EPOCH="$(date -u -d "$RESTORE_STARTED" +%s)"
          DONE_EPOCH="$(date -u -d "$VALIDATION_COMPLETED_AT" +%s)"
          RTO=$((DONE_EPOCH - START_EPOCH))
          test "$RTO" -ge 0
          test "$RTO" -le 3600
          jq --arg at "$VALIDATION_COMPLETED_AT" --argjson rto "$RTO" --argjson migrations "$MIGRATION_COUNT" --argjson tables "$CRITICAL_TABLE_COUNT" '.timing.validationCompletedAt=$at | .timing.rtoSeconds=$rto | .validation={passed:true,migrationCount:$migrations,criticalTableCount:$tables,beforeMarkerPresent:true,afterMarkerAbsent:true}' "$STATE" >/tmp/state.json && mv /tmp/state.json "$STATE"
          echo "PITR_DATA_VALIDATION=PASS migrations=$MIGRATION_COUNT critical_tables=$CRITICAL_TABLE_COUNT rto_seconds=$RTO"

      - name: Re-authenticate as infrastructure administrator for cleanup safeguard
        if: always()
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_INFRA_ADMIN_SERVICE_ACCOUNT }}

      - name: Re-assert temporary target is deletable
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          TARGET="toca-mcp-pitr-${GITHUB_RUN_ID}"
          case "$TARGET" in toca-mcp-pitr-*) ;; *) exit 90 ;; esac
          test "$TARGET" != "$SOURCE_INSTANCE"
          if TJSON="$(gcloud sql instances describe "$TARGET" --project "$GCP_PROJECT_ID" --format=json 2>/dev/null)"; then
            printf '%s' "$TJSON" | jq -e --arg t "$TARGET" '.name==$t and .name!="toca-mcp-db"' >/dev/null
            DP="$(jq -r '.settings.deletionProtectionEnabled // false' <<<"$TJSON")"
            if [ "$DP" != false ]; then
              gcloud sql instances patch "$TARGET" --project "$GCP_PROJECT_ID" --no-deletion-protection --quiet
            fi
            for _ in $(seq 1 30); do
              TJSON="$(gcloud sql instances describe "$TARGET" --project "$GCP_PROJECT_ID" --format=json)"
              DP="$(jq -r '.settings.deletionProtectionEnabled // false' <<<"$TJSON")"
              [ "$DP" = false ] && break
              sleep 5
            done
            test "$DP" = false
          fi
          echo 'PITR_CLEANUP_UNLOCK_GUARD=PASS'

      - name: Re-authenticate as deployer for deterministic delete
        if: always()
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Delete temporary jobs and PITR target, then verify production
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          TARGET="toca-mcp-pitr-${GITHUB_RUN_ID}"
          PROBE_JOB="toca-mcp-pitr-probe-${GITHUB_RUN_ID}"
          VALIDATE_JOB="toca-mcp-pitr-val-${GITHUB_RUN_ID}"
          STATE="evidence/dr-state.json"
          case "$TARGET" in toca-mcp-pitr-*) ;; *) exit 90 ;; esac
          test "$TARGET" != "$SOURCE_INSTANCE"

          gcloud run jobs delete "$PROBE_JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true
          gcloud run jobs delete "$VALIDATE_JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true

          TARGET_DELETED=false
          if TJSON="$(gcloud sql instances describe "$TARGET" --project "$GCP_PROJECT_ID" --format=json 2>/dev/null)"; then
            printf '%s' "$TJSON" | jq -e --arg t "$TARGET" '.name==$t and .name!="toca-mcp-db"' >/dev/null
            DP="$(jq -r '.settings.deletionProtectionEnabled // false' <<<"$TJSON")"
            if [ "$DP" != false ]; then
              echo 'PITR_CLEANUP_BLOCKED_DELETION_PROTECTION' >&2
              exit 92
            fi
            gcloud sql instances delete "$TARGET" --project "$GCP_PROJECT_ID" --quiet
            for _ in $(seq 1 60); do
              if ! gcloud sql instances describe "$TARGET" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
                TARGET_DELETED=true
                break
              fi
              sleep 5
            done
          else
            TARGET_DELETED=true
          fi
          test "$TARGET_DELETED" = true

          SOURCE_AFTER="$(gcloud sql instances describe "$SOURCE_INSTANCE" --project "$GCP_PROJECT_ID" --format=json)"
          printf '%s' "$SOURCE_AFTER" | jq -e '.name=="toca-mcp-db" and .state=="RUNNABLE" and .databaseVersion=="POSTGRES_18" and .region=="southamerica-east1" and .settings.deletionProtectionEnabled==true and .settings.backupConfiguration.enabled==true and .settings.backupConfiguration.pointInTimeRecoveryEnabled==true' >/dev/null
          printf '%s' "$SOURCE_AFTER" | jq '{name,state,databaseVersion,region,settings:{deletionProtectionEnabled:.settings.deletionProtectionEnabled,backupEnabled:.settings.backupConfiguration.enabled,pitrEnabled:.settings.backupConfiguration.pointInTimeRecoveryEnabled,tier:.settings.tier,edition:.settings.edition,availabilityType:.settings.availabilityType,dataDiskType:.settings.dataDiskType,dataDiskSizeGb:.settings.dataDiskSizeGb}}' > evidence/source-after.json
          cmp -s evidence/source-before.json evidence/source-after.json

          if [ -f "$STATE" ]; then
            jq '.cleanup.probeJobDeleted=true | .cleanup.validationJobDeleted=true | .cleanup.targetDeleted=true | .production.unchangedSettingsReadback=true' "$STATE" >/tmp/state.json && mv /tmp/state.json "$STATE"
          fi
          echo 'PITR_DR_CLEANUP=PASS target_deleted=true production_unchanged=true'

      - name: Build and enforce final PITR/RPO evidence gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          STATE="evidence/dr-state.json"
          EVIDENCE="evidence/cloud-sql-pitr-rpo-drill.json"
          if [ ! -f "$STATE" ]; then
            jq -n --arg workflowSha "$GITHUB_SHA" --arg source "$SOURCE_INSTANCE" --arg target "toca-mcp-pitr-${GITHUB_RUN_ID}" --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{schemaVersion:2,workflowSha:$workflowSha,sourceInstance:$source,targetInstance:$target,status:"FAILED_BEFORE_PITR_STATE",verifiedAt:$verifiedAt}' > "$EVIDENCE"
            cat "$EVIDENCE"
            exit 93
          fi

          VERIFIED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq --arg verifiedAt "$VERIFIED_AT" '
            . as $s |
            {
              schemaVersion:2,
              repoBaselineSha:$s.repoBaselineSha,
              workflowSha:$s.workflowSha,
              sourceInstance:$s.sourceInstance,
              targetInstance:$s.targetInstance,
              productionImage:$s.productionImage,
              productionImageDigest:$s.productionImageDigest,
              recoveryWindow:$s.recoveryWindow,
              selectedRecovery:($s.selectedRecovery + {objectiveSeconds:900,objectiveMet:($s.selectedRecovery.measuredRpoSeconds >= 0 and $s.selectedRecovery.measuredRpoSeconds <= 900)}),
              temporalBoundary:{before:($s.temporalBoundary.before + {presentInRestore:$s.validation.beforeMarkerPresent}),after:($s.temporalBoundary.after + {absentInRestore:$s.validation.afterMarkerAbsent})},
              timing:($s.timing + {rtoObjectiveSeconds:3600,rtoObjectiveMet:($s.timing.rtoSeconds != null and $s.timing.rtoSeconds >= 0 and $s.timing.rtoSeconds <= 3600)}),
              validation:$s.validation,
              restore:$s.restore,
              cleanup:$s.cleanup,
              production:$s.production,
              verifiedAt:$verifiedAt
            }
          ' "$STATE" > "$EVIDENCE"
          cat "$EVIDENCE"
          jq -e '
            .recoveryWindow.providerLatestLagSeconds >= 0 and .recoveryWindow.providerLatestLagSeconds <= 900 and
            .selectedRecovery.objectiveMet == true and
            .temporalBoundary.before.presentInRestore == true and
            .temporalBoundary.after.absentInRestore == true and
            .timing.rtoObjectiveMet == true and
            .validation.passed == true and
            .validation.migrationCount == 16 and
            .validation.criticalTableCount >= 21 and
            .restore.targetCreated == true and
            .restore.deletionProtectionDisabled == true and
            .cleanup.probeJobDeleted == true and
            .cleanup.validationJobDeleted == true and
            .cleanup.targetDeleted == true and
            .production.mutatedByDrill == false and
            .production.unchangedSettingsReadback == true
          ' "$EVIDENCE" >/dev/null
          echo "CLOUD_SQL_PITR_RPO_DRILL=PASS rpo_seconds=$(jq -r '.selectedRecovery.measuredRpoSeconds' "$EVIDENCE") rto_seconds=$(jq -r '.timing.rtoSeconds' "$EVIDENCE") provider_latest_lag_seconds=$(jq -r '.recoveryWindow.providerLatestLagSeconds' "$EVIDENCE")"

      - name: Upload PITR/RPO evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloud-sql-pitr-rpo-evidence-${{ github.sha }}
          path: evidence
          if-no-files-found: warn
          retention-days: 90
