name: TEMP Format Feed 18-35 Error Envelope
on:
  push:
    branches:
      - fix/meta-ads-itacare-feed-18-35-runner-error-envelope-20260923
    paths:
      - 'src/meta-ads-the-party-itacare-2026-10-11-feed-18-35-create-paused.ts'
      - '.github/workflows/temp-format-feed-error-envelope.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and self-remove
        run: |
          set -euo pipefail
          pnpm exec prettier --write src/meta-ads-the-party-itacare-2026-10-11-feed-18-35-create-paused.ts
          rm .github/workflows/temp-format-feed-error-envelope.yml
      - name: Commit canonical formatting
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/meta-ads-the-party-itacare-2026-10-11-feed-18-35-create-paused.ts .github/workflows/temp-format-feed-error-envelope.yml
          git commit -m "style(meta-ads): format feed 18-35 error envelope"
          git push origin HEAD:fix/meta-ads-itacare-feed-18-35-runner-error-envelope-20260923
