name: TEMP Video Marketing Ready Status Patch

on:
  push:
    branches:
      - fix/video-marketing-ready-status-drift
    paths:
      - .github/workflows/_tmp-video-marketing-ready-status-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/fix/video-marketing-ready-status-drift'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply exact canonical status patch
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('src/providers/google-sheets/photo-to-video-registry.ts')
          text = path.read_text()
          old = "    venue.status !== 'ACTIVE_APPROVED' ||\n"
          new = "    (venue.status !== 'ACTIVE_APPROVED' &&\n      venue.status !== 'VENUE_VERIFIED_MARKETING_READY') ||\n"
          if text.count(old) != 1:
              raise SystemExit(f'EXPECTED_EXACT_STATUS_GUARD_ONCE: observed={text.count(old)}')
          path.write_text(text.replace(old, new))
          PY

      - name: Apply repository Prettier output
        run: pnpm exec prettier --write src/providers/google-sheets/photo-to-video-registry.ts test/photo-to-video-registry-marketing-ready-status.test.ts

      - name: Run focused regression
        run: pnpm exec vitest run test/photo-to-video-registry-marketing-ready-status.test.ts

      - name: Commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- src/providers/google-sheets/photo-to-video-registry.ts test/photo-to-video-registry-marketing-ready-status.test.ts
          test -n "$(git status --porcelain -- src/providers/google-sheets/photo-to-video-registry.ts test/photo-to-video-registry-marketing-ready-status.test.ts)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/providers/google-sheets/photo-to-video-registry.ts test/photo-to-video-registry-marketing-ready-status.test.ts
          git commit -m 'fix(video): accept canonical marketing-ready venue status'
          git push origin HEAD:fix/video-marketing-ready-status-drift
