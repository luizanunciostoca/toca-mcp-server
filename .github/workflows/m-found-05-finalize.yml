name: M-FOUND-05 Finalizer

on:
  push:
    branches: [feat/m-found-05-approval-atomicity]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply M-FOUND-05 canonical patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'PATCH_ANCHOR_NOT_FOUND:{path}:{old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # Canonical INVALIDATED lifecycle + invalidate-on-change helper.
          replace_once(
              'src/governance/approval-governance.ts',
              "  'FAILED_REVIEW_REQUIRED',\n  'REVOKED',",
              "  'FAILED_REVIEW_REQUIRED',\n  'INVALIDATED',\n  'REVOKED',",
          )
          replace_once(
              'src/governance/approval-governance.ts',
              "export function revokeApproval(\n",
              """export function invalidateApprovalOnChange(
            record: ApprovalRecord,
            currentDescriptor: unknown,
            input: { readonly evidence: readonly string[]; readonly now?: string },
          ): ApprovalRecord {
            if (!RESERVABLE_STATUSES.has(record.status))
              throw new Error('APPROVAL_NOT_INVALIDATABLE');
            const currentDescriptorSha256 = hashApprovalDescriptor(currentDescriptor);
            if (currentDescriptorSha256 === record.descriptorSha256) return record;
            requireEvidence(input.evidence, 'APPROVAL_INVALIDATION_EVIDENCE_REQUIRED');
            return {
              ...record,
              status: 'INVALIDATED',
              evidence: mergeEvidence(record.evidence, input.evidence),
              version: record.version + 1,
            };
          }

          export function revokeApproval(
          """,
          )

          # R27 surface from the approved manual. Four are implemented now; two remain planned.
          replace_once(
              'src/governance/capability-ids.ts',
              "    'approval.issue',\n    'approval.consume',",
              """    'approval.issue',
              'approval.reserve',
              'approval.release',
              'approval.invalidate_on_change',
              'approval.delegate',
              'approval.execution.bind',
              'approval.sla.escalate',
              'approval.consume',""",
          )
          replace_once(
              'src/governance/capability-catalog.ts',
              "  'approval.issue',\n  'approval.consume',",
              """  'approval.issue',
            'approval.reserve',
            'approval.release',
            'approval.invalidate_on_change',
            'approval.execution.bind',
            'approval.consume',""",
          )
          replace_once(
              'src/governance/capability-catalog.ts',
              "  'replace',\n  'request',",
              """  'replace',
            'reserve',
            'release',
            'bind',
            'delegate',
            'invalidate_on_change',
            'request',""",
          )

          # The migration must accept historical CONSUMED rows and does not need unused
          # invalidation timestamp columns: INVALIDATED is terminal and evidence-backed.
          migration = Path('migrations/006_approval_execution_atomicity.sql')
          text = migration.read_text()
          text = text.replace(
              "  add column if not exists failed_review_at timestamptz,\n  add column if not exists failure_reason text,\n  add column if not exists invalidated_at timestamptz,\n  add column if not exists invalidation_reason text;",
              "  add column if not exists failed_review_at timestamptz,\n  add column if not exists failure_reason text;",
          )
          start = text.find("alter table approval_records\n  drop constraint if exists approval_records_invalidation_check;")
          if start != -1:
              end_marker = "\nalter table approval_records\n  drop constraint if exists approval_records_execution_issued_check;"
              end = text.find(end_marker, start)
              if end == -1:
                  raise SystemExit('PATCH_ANCHOR_NOT_FOUND:migration:invalidation_end')
              text = text[:start] + text[end+1:]
          migration.write_text(text)

          # Catalog cardinality grows by the six new R27 capabilities; eight compatibility
          # aliases remain, so the effective semantic catalog grows from 723 to 729.
          replace_once(
              'test/governance-catalog.test.ts',
              "it('materializes the 731-capability catalog using contract v1.1 without pretending inference is explicit', () => {\n    expect(() => validateCapabilityCatalog()).not.toThrow();\n    expect(CAPABILITY_CATALOG).toHaveLength(731);",
              "it('materializes the 737-capability catalog using contract v1.1 without pretending inference is explicit', () => {\n    expect(() => validateCapabilityCatalog()).not.toThrow();\n    expect(CAPABILITY_CATALOG).toHaveLength(737);",
          )
          replace_once(
              'test/capability-resolution.test.ts',
              "it('preserves the 731 compatibility IDs while collapsing exact semantic aliases', () => {",
              "it('preserves the compatibility IDs while collapsing exact semantic aliases', () => {",
          )
          replace_once(
              'test/capability-resolution.test.ts',
              "      raw_count: 731,\n      compatibility_alias_count: 8,\n      effective_count: 723,",
              "      raw_count: 737,\n      compatibility_alias_count: 8,\n      effective_count: 729,",
          )

          # Unit proof that payload drift invalidates approval rather than silently reusing it.
          replace_once(
              'test/approval-governance.test.ts',
              "  issueApproval,\n  requestApproval,",
              "  issueApproval,\n  invalidateApprovalOnChange,\n  requestApproval,",
          )
          approval_test = Path('test/approval-governance.test.ts')
          text = approval_test.read_text()
          anchor = "\n  it('prevents reusing an execution id even after a safe release', async () => {"
          if anchor not in text:
              raise SystemExit('PATCH_ANCHOR_NOT_FOUND:approval-governance-test')
          test = """

            it('invalidates an approved descriptor when its material payload changes', () => {
              const approved = approvedRecord();
              const unchanged = invalidateApprovalOnChange(approved, descriptor, {
                evidence: ['descriptor-reconciled'],
                now: '2026-08-14T21:00:00Z',
              });
              expect(unchanged).toBe(approved);

              const invalidated = invalidateApprovalOnChange(
                approved,
                { ...descriptor, dailyBudgetMinor: 18_000 },
                {
                  evidence: ['descriptor-changed:budget'],
                  now: '2026-08-14T21:01:00Z',
                },
              );
              expect(invalidated).toMatchObject({
                status: 'INVALIDATED',
                version: approved.version + 1,
              });
              expect(
                verifyApproval(invalidated, {
                  requester: 'luiz',
                  routeId: 'R28',
                  capabilityId: 'meta_ads.campaign.create_paused',
                  descriptorSha256: hashApprovalDescriptor(descriptor),
                  targetAccount: 'act_394512749760530',
                  requiredScope: ['meta_ads.campaign.create_paused'],
                }),
              ).toMatchObject({ valid: false });
            });
          """
          approval_test.write_text(text.replace(anchor, test + anchor, 1))

          replace_once(
              'test/approval-migration-contract.test.ts',
              "      'FAILED_REVIEW_REQUIRED',\n    ]) {",
              "      'FAILED_REVIEW_REQUIRED',\n      'INVALIDATED',\n    ]) {",
          )
          PY
      - name: Format and validate patched files
        run: |
          pnpm exec prettier --write \
            src/governance/approval-governance.ts \
            src/governance/capability-ids.ts \
            src/governance/capability-catalog.ts \
            migrations/006_approval_execution_atomicity.sql \
            test/governance-catalog.test.ts \
            test/capability-resolution.test.ts \
            test/approval-governance.test.ts \
            test/approval-migration-contract.test.ts
          pnpm format:check
          pnpm architecture:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Commit canonical result and remove finalizer
        run: |
          rm .github/workflows/m-found-05-finalize.yml
          git config user.name "toca-foundation-bot"
          git config user.email "47362223+luizidebook@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: complete R27 atomic approval contract"
      - name: Push final M-FOUND-05 result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:feat/m-found-05-approval-atomicity"
