name: Instagram Engagement Shadow Readonly Trace

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      confirm_trace:
        description: 'Type TRACE_ENGAGEMENT_SHADOW_READONLY to authorize read-only tracing'
        required: true
        type: string
      authorization_ref:
        description: 'Same-repository PRODUCTION DIAGNOSTIC AUTHORIZATION issue URL bound to exact controller SHA'
        required: true
        type: string
      target_failed_run:
        description: 'Failed Instagram Engagement Shadow Unique Candidate Recovery run id'
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: read
  id-token: write

concurrency:
  group: instagram-engagement-production-shadow-readonly-trace
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_ARTIFACT_REPOSITORY: toca-mcp
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  DATABASE_SECRET_ID: toca-database-url
  DAEMON_SERVICE_NAME: toca-managed-instagram-daemon
  WEBHOOK_SERVICE_NAME: toca-webhook-next-production

jobs:
  trace:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'PRODUCTION DIAGNOSTIC AUTHORIZATION — Instagram shadow readonly trace')) ||
        (github.event_name == 'workflow_dispatch' && inputs.confirm_trace == 'TRACE_ENGAGEMENT_SHADOW_READONLY' && inputs.authorization_ref != '' && inputs.target_failed_run != '')
      )
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25

    steps:
      - name: Checkout exact diagnostic controller SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify owner authorization and target failed run
        shell: bash
        env:
          DISPATCH_AUTHORIZATION_REF: ${{ inputs.authorization_ref }}
          DISPATCH_TARGET_FAILED_RUN: ${{ inputs.target_failed_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          mkdir -p engagement-evidence
          jq -n \
            --arg controllerSha "$GITHUB_SHA" \
            --arg eventName "$GITHUB_EVENT_NAME" \
            '{schemaVersion:"toca.instagram-engagement.shadow-readonly-trace-attempt.v1",controllerSha:$controllerSha,eventName:$eventName,databaseMutationsAuthorized:false,externalReplyWritesAuthorized:false}' \
            > engagement-evidence/trace-attempt.json

          if [[ "$GITHUB_EVENT_NAME" == 'issues' ]]; then
            jq '.issue' "$GITHUB_EVENT_PATH" > /tmp/diagnostic-authorization.json
            AUTHORIZATION_REF="$(jq -r '.html_url // empty' /tmp/diagnostic-authorization.json)"
            AUTH_BODY="$(jq -r '.body // ""' /tmp/diagnostic-authorization.json)"
            TARGET_FAILED_RUN="$(printf '%s\n' "$AUTH_BODY" | sed -n 's/^TARGET_FAILED_RUN=\([0-9][0-9]*\)$/\1/p' | head -n1)"
          else
            test "${{ inputs.confirm_trace }}" = 'TRACE_ENGAGEMENT_SHADOW_READONLY'
            AUTHORIZATION_REF="$DISPATCH_AUTHORIZATION_REF"
            TARGET_FAILED_RUN="$DISPATCH_TARGET_FAILED_RUN"

            AUTH_PREFIX="https://github.com/${GITHUB_REPOSITORY}/issues/"
            [[ "$AUTHORIZATION_REF" == "${AUTH_PREFIX}"* ]]
            AUTH_ISSUE="${AUTHORIZATION_REF#${AUTH_PREFIX}}"
            [[ "$AUTH_ISSUE" =~ ^[0-9]+$ ]]

            curl --fail-with-body --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'User-Agent: toca-instagram-shadow-readonly-trace' \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${AUTH_ISSUE}" \
              > /tmp/diagnostic-authorization.json
          fi

          AUTH_PREFIX="https://github.com/${GITHUB_REPOSITORY}/issues/"
          [[ "$AUTHORIZATION_REF" == "${AUTH_PREFIX}"* ]]
          AUTH_ISSUE="${AUTHORIZATION_REF#${AUTH_PREFIX}}"
          [[ "$AUTH_ISSUE" =~ ^[0-9]+$ ]]
          [[ "$TARGET_FAILED_RUN" =~ ^[0-9]+$ ]]

          jq -e \
            --arg expectedUrl "$AUTHORIZATION_REF" \
            --arg sha "$GITHUB_SHA" \
            --arg owner "$GITHUB_REPOSITORY_OWNER" \
            --arg targetRun "$TARGET_FAILED_RUN" '
              (.html_url == $expectedUrl) and
              (.state == "open") and
              (has("pull_request") | not) and
              (.user.login == $owner) and
              (.title | startswith("PRODUCTION DIAGNOSTIC AUTHORIZATION — Instagram shadow readonly trace")) and
              ((.body // "") | contains("AUTHORIZED_DIAGNOSTIC_SHA=" + $sha)) and
              ((.body // "") | contains("INSTAGRAM_ENGAGEMENT_SHADOW_READONLY_TRACE=AUTHORIZED")) and
              ((.body // "") | contains("TARGET_FAILED_RUN=" + $targetRun)) and
              ((.body // "") | contains("CLOUD_RUN_EPHEMERAL_JOB_AUTHORIZED=true")) and
              ((.body // "") | contains("ARTIFACT_REGISTRY_DIAGNOSTIC_IMAGE_AUTHORIZED=true")) and
              ((.body // "") | contains("DATABASE_MUTATIONS_AUTHORIZED=false")) and
              ((.body // "") | contains("EXTERNAL_REPLY_WRITES_AUTHORIZED=false"))
            ' /tmp/diagnostic-authorization.json >/dev/null || {
              echo 'Read-only diagnostic authorization mismatch' >&2
              exit 1
            }

          curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'User-Agent: toca-instagram-shadow-readonly-trace' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_FAILED_RUN}" \
            > /tmp/target-run.json

          jq -e '
            (.name == "Instagram Engagement Shadow Unique Candidate Recovery") and
            (.event == "workflow_dispatch") and
            (.conclusion == "failure") and
            (.head_branch == "main")
          ' /tmp/target-run.json >/dev/null || {
            echo 'Target run is not the expected failed unique-candidate recovery' >&2
            exit 1
          }

          TRACE_STARTED_AT="$(jq -r '.run_started_at // .created_at // empty' /tmp/target-run.json)"
          TRACE_ENDED_AT="$(jq -r '.updated_at // empty' /tmp/target-run.json)"
          TARGET_FAILED_CONTROLLER_SHA="$(jq -r '.head_sha // empty' /tmp/target-run.json)"
          test -n "$TRACE_STARTED_AT"
          test -n "$TRACE_ENDED_AT"
          [[ "$TARGET_FAILED_CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ ]]

          echo "AUTHORIZATION_REF=$AUTHORIZATION_REF" >> "$GITHUB_ENV"
          echo "TARGET_FAILED_RUN=$TARGET_FAILED_RUN" >> "$GITHUB_ENV"
          echo "TRACE_STARTED_AT=$TRACE_STARTED_AT" >> "$GITHUB_ENV"
          echo "TRACE_ENDED_AT=$TRACE_ENDED_AT" >> "$GITHUB_ENV"
          echo "TARGET_FAILED_CONTROLLER_SHA=$TARGET_FAILED_CONTROLLER_SHA" >> "$GITHUB_ENV"

          jq -n \
            --arg controllerSha "$GITHUB_SHA" \
            --arg targetRun "$TARGET_FAILED_RUN" \
            --arg targetControllerSha "$TARGET_FAILED_CONTROLLER_SHA" \
            --arg startedAt "$TRACE_STARTED_AT" \
            --arg endedAt "$TRACE_ENDED_AT" \
            --arg authorizationRef "$AUTHORIZATION_REF" \
            '{schemaVersion:"toca.instagram-engagement.shadow-readonly-trace-authorization.v3",controllerSha:$controllerSha,targetFailedRun:$targetRun,targetFailedControllerSha:$targetControllerSha,traceWindow:{startedAt:$startedAt,endedAt:$endedAt},authorizationRef:$authorizationRef,cloudRunEphemeralJobAuthorized:true,artifactRegistryDiagnosticImageAuthorized:true,databaseMutationsAuthorized:false,externalReplyWritesAuthorized:false}' \
            > engagement-evidence/trace-authorization.json

      - name: Authenticate production deployer for governed diagnostic control plane
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Verify production remains fail-closed before database trace
        shell: bash
        run: |
          set -euo pipefail
          DAEMON_JSON="$(gcloud run services describe "$DAEMON_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          WEBHOOK_JSON="$(gcloud run services describe "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"

          printf '%s' "$DAEMON_JSON" | jq -e '.spec.template.spec.containers[0] as $c | ([$c.env[]? | select(.name == "INSTAGRAM_ENGAGEMENT_WRITES_ENABLED") | .value] | last // "false") == "false"' >/dev/null
          printf '%s' "$WEBHOOK_JSON" | jq -e '.spec.template.spec.containers[0] as $c | ([$c.env[]? | select(.name == "INSTAGRAM_ENGAGEMENT_WRITES_ENABLED") | .value] | last // "false") == "false"' >/dev/null
          printf '%s' "$WEBHOOK_JSON" | jq -e '
            ((.metadata.annotations["run.googleapis.com/default-url-disabled"] // "false") == "true") and
            ((.metadata.annotations["run.googleapis.com/invoker-iam-disabled"] // "false") != "true")
          ' >/dev/null
          if gcloud run services get-iam-policy "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            | jq -e '.bindings[]? | select(.role == "roles/run.invoker") | (.members // [])[]? | select(. == "allUsers")' >/dev/null; then
            echo 'Fail-closed diagnostic boundary requires no allUsers invoker' >&2
            exit 1
          fi

          jq -n '{callbackClosed:true,legacyAllUsersInvoker:false,daemonEngagementWritesEnabled:false,webhookEngagementWritesEnabled:false,databaseMutationPerformed:false}' \
            > engagement-evidence/trace-prestate.json

      - name: Configure Docker authentication
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - name: Build and push isolated diagnostic image
        shell: bash
        run: |
          set -euo pipefail
          DIAGNOSTIC_IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/server:ig-eng-readonly-trace-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build \
            --file Dockerfile.instagram-engagement-shadow-readonly-trace \
            --tag "$DIAGNOSTIC_IMAGE" \
            .
          docker push "$DIAGNOSTIC_IMAGE"
          echo "DIAGNOSTIC_IMAGE=$DIAGNOSTIC_IMAGE" >> "$GITHUB_ENV"
          jq -n --arg image "$DIAGNOSTIC_IMAGE" '{diagnosticImage:$image,sourceSha:env.GITHUB_SHA,providerWritesAuthorized:false,databaseMutationsAuthorized:false}' \
            > engagement-evidence/diagnostic-image.json

      - name: Execute runtime-SA PostgreSQL read-only trace in ephemeral Cloud Run Job
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DIAGNOSTIC_IMAGE:-}"
          JOB_NAME="toca-ig-eng-ro-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            set +e
            if gcloud run jobs delete "$JOB_NAME" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --quiet >/dev/null 2>&1; then
              jq -n --arg job "$JOB_NAME" '{ephemeralJob:$job,deleteAttempted:true,deleted:true}' > engagement-evidence/ephemeral-job-cleanup.json
            else
              jq -n --arg job "$JOB_NAME" '{ephemeralJob:$job,deleteAttempted:true,deleted:false}' > engagement-evidence/ephemeral-job-cleanup.json
            fi
          }
          trap cleanup EXIT

          gcloud run jobs deploy "$JOB_NAME" \
            --image "$DIAGNOSTIC_IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --set-env-vars "^@^TARGET_FAILED_RUN=$TARGET_FAILED_RUN@TRACE_STARTED_AT=$TRACE_STARTED_AT@TRACE_ENDED_AT=$TRACE_ENDED_AT" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 300s \
            --quiet

          JOB_JSON="$(gcloud run jobs describe "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$JOB_JSON" | jq -e \
            --arg runtime "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --arg instance "$CLOUD_SQL_INSTANCE" \
            --arg secret "$DATABASE_SECRET_ID" '
              ([.. | objects | .serviceAccountName? // empty] | any(. == $runtime)) and
              ([.. | strings] | any(contains($instance))) and
              ([.. | objects | select(.name? == "DATABASE_URL") | tostring] | any(contains($secret)))
            ' >/dev/null || {
              echo 'Ephemeral diagnostic job configuration mismatch' >&2
              exit 1
            }

          set +e
          gcloud run jobs execute "$JOB_NAME" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --wait \
            --quiet
          EXEC_RC=$?
          set -e

          TRACE_JSON=''
          for attempt in $(seq 1 15); do
            LOGS_JSON="$(gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${JOB_NAME}\"" \
              --project "$GCP_PROJECT_ID" \
              --freshness=20m \
              --limit=200 \
              --order=asc \
              --format=json || printf '[]')"

            TRACE_JSON="$(printf '%s' "$LOGS_JSON" | jq -c '
              def parsed:
                if ((.jsonPayload? | type) == "object" and (.jsonPayload.schemaVersion? == "toca.instagram-engagement.shadow-readonly-trace.v1")) then .jsonPayload
                elif ((.jsonPayload.message? | type) == "string") then (.jsonPayload.message | fromjson? // empty)
                elif ((.textPayload? | type) == "string") then (.textPayload | fromjson? // empty)
                else empty end;
              [ .[] | parsed | select(.schemaVersion? == "toca.instagram-engagement.shadow-readonly-trace.v1") ] | last // empty
            ')"
            if [[ -n "$TRACE_JSON" ]]; then
              break
            fi
            sleep 2
          done

          test -n "$TRACE_JSON"
          printf '%s\n' "$TRACE_JSON" > engagement-evidence/readonly-trace.json
          jq -e '
            (.databaseMutationPerformed == false) and
            (.externalReplyWritesAuthorized == false) and
            (.rawSenderPrinted == false) and
            (.rawMessagePrinted == false) and
            (.secretsPrinted == false)
          ' engagement-evidence/readonly-trace.json >/dev/null
          cat engagement-evidence/readonly-trace.json >> "$GITHUB_STEP_SUMMARY"
          test "$EXEC_RC" -eq 0

      - name: Verify ephemeral job cleanup evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f engagement-evidence/ephemeral-job-cleanup.json ]]; then
            cat engagement-evidence/ephemeral-job-cleanup.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanitized read-only trace evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instagram-engagement-shadow-readonly-trace-${{ github.run_id }}
          path: engagement-evidence/
          if-no-files-found: error
          retention-days: 90
