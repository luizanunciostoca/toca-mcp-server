name: Temporary Prettier Probe

on:
  push:
    branches:
      - fix/instagram-shadow-readonly-github-auth-20260829

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Emit exact Prettier output
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write test/instagram-engagement-shadow-readonly-trace.test.ts
          echo 'BEGIN_FORMATTED_BASE64'
          base64 -w0 test/instagram-engagement-shadow-readonly-trace.test.ts
          echo
          echo 'END_FORMATTED_BASE64'
