name: Ops Staging Notification Delivery Diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/ops-staging-notification-delivery-diagnostics.yml'

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      PROJECT_ID: toca-mcp-next-staging
      PROJECT_NUMBER: '729069789107'
      PRODUCTION_PROJECT_ID: toca-mcp-production
      REGION: southamerica-east1
      WEBHOOK_SERVICE: toca-webhook-next-staging
      STAGING_WIF: projects/729069789107/locations/global/workloadIdentityPools/github-staging/providers/github-toca-mcp-staging
      STAGING_OPERATOR_SA: toca-next-stg-deployer@toca-mcp-next-staging.iam.gserviceaccount.com
      SYNTHETIC_LOG_ID: toca-staging-reliability-synthetic
      SYNTHETIC_MARKER: TOCA_STAGING_RELIABILITY_SYNTHETIC_V1
      TARGET_RUN_ID: '32563070906'
      TARGET_MAIN_SHA: 152eb4f6eaa3236ff74156ca8bccb20ea3065e76
      EXPECTED_POLICY_ID: '5562724679805698256'
    steps:
      - name: Fail closed on exact staging boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'luizanunciostoca/toca-mcp-server'
          test "$PROJECT_ID" = 'toca-mcp-next-staging'
          test "$PROJECT_NUMBER" = '729069789107'
          test "$PROJECT_ID" != "$PRODUCTION_PROJECT_ID"
          echo 'STAGING_NOTIFICATION_DIAGNOSTIC_BOUNDARY=PASS'

      - name: Authenticate isolated staging reader
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.STAGING_WIF }}
          service_account: ${{ env.STAGING_OPERATOR_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Verify exact staging reader identity
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE_ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)"
          test "$ACTIVE_ACCOUNT" = "$STAGING_OPERATOR_SA"
          ACTUAL_NUMBER="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
          test "$ACTUAL_NUMBER" = "$PROJECT_NUMBER"
          echo 'STAGING_NOTIFICATION_DIAGNOSTIC_IDENTITY=PASS'

      - name: Read exact synthetic signal and notification delivery errors
        shell: bash
        run: |
          set -euo pipefail
          RUN_MARKER="${SYNTHETIC_MARKER}:run:${TARGET_RUN_ID}:sha:${TARGET_MAIN_SHA}"
          SYNTHETIC_FILTER="logName=\"projects/${PROJECT_ID}/logs/${SYNTHETIC_LOG_ID}\" AND jsonPayload.runMarker=\"${RUN_MARKER}\""
          gcloud logging read "$SYNTHETIC_FILTER" \
            --project="$PROJECT_ID" --freshness=30m --limit=5 --format=json > /tmp/synthetic.json

          SYNTHETIC_COUNT="$(jq 'length' /tmp/synthetic.json)"
          test "$SYNTHETIC_COUNT" -ge 1
          SYNTHETIC_TS="$(jq -r 'sort_by(.timestamp) | last | .timestamp' /tmp/synthetic.json)"
          POLICY_NAME="$(jq -r 'sort_by(.timestamp) | last | .jsonPayload.alertPolicy // empty' /tmp/synthetic.json)"
          test "$POLICY_NAME" = "projects/${PROJECT_ID}/alertPolicies/${EXPECTED_POLICY_ID}"

          CHANNEL_FILTER='resource.type="stackdriver_notification_channel" AND logName="projects/toca-mcp-next-staging/logs/monitoring.googleapis.com%2Fnotification_channel_events"'
          gcloud logging read "$CHANNEL_FILTER" \
            --project="$PROJECT_ID" --freshness=30m --limit=100 --format=json > /tmp/channel-events.json

          TOTAL_EVENTS="$(jq 'length' /tmp/channel-events.json)"
          ERROR_EVENTS="$(jq '[.[] | select(.severity=="ERROR" or .severity=="CRITICAL" or .severity=="ALERT" or .severity=="EMERGENCY")] | length' /tmp/channel-events.json)"
          POST_SIGNAL_EVENTS="$(jq --arg ts "$SYNTHETIC_TS" '[.[] | select((.timestamp // "") >= $ts)] | length' /tmp/channel-events.json)"
          POST_SIGNAL_ERRORS="$(jq --arg ts "$SYNTHETIC_TS" '[.[] | select((.timestamp // "") >= $ts and (.severity=="ERROR" or .severity=="CRITICAL" or .severity=="ALERT" or .severity=="EMERGENCY"))] | length' /tmp/channel-events.json)"

          echo "TARGET_SYNTHETIC_SIGNAL_COUNT=${SYNTHETIC_COUNT}"
          echo "TARGET_SYNTHETIC_TIMESTAMP=${SYNTHETIC_TS}"
          echo "TARGET_ALERT_POLICY=${POLICY_NAME}"
          echo "NOTIFICATION_CHANNEL_EVENT_COUNT_30M=${TOTAL_EVENTS}"
          echo "NOTIFICATION_CHANNEL_ERROR_COUNT_30M=${ERROR_EVENTS}"
          echo "NOTIFICATION_CHANNEL_EVENTS_AFTER_SIGNAL=${POST_SIGNAL_EVENTS}"
          echo "NOTIFICATION_CHANNEL_ERRORS_AFTER_SIGNAL=${POST_SIGNAL_ERRORS}"
          test "$POST_SIGNAL_ERRORS" = 0
          echo 'STAGING_NOTIFICATION_DELIVERY_ERROR_READBACK=PASS'
          echo 'POSITIVE_DELIVERY_MUST_BE_PROVEN_AT_RECIPIENT=TRUE'
