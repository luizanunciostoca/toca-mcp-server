name: Temporary Commerce Test Lint Fix

on:
  push:
    branches:
      - feat/commerce-provider-boundary

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/commerce-provider-boundary
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Setup pnpm
        run: npm install --global pnpm@10.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply patch
        run: python scripts/tmp-commerce-test-lint-fix.py
      - name: Format
        run: pnpm exec prettier --write test/commerce-provider-boundary.test.ts
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "TOCA OS Integration"
          git config user.email "actions@users.noreply.github.com"
          git add test/commerce-provider-boundary.test.ts
          git commit -m "test(measurement): satisfy strict commerce lint"
          git push origin HEAD:feat/commerce-provider-boundary
