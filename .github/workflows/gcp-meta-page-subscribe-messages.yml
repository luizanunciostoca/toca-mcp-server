name: GCP Meta Page Subscribe Messages

on:
  push:
    branches:
      - feat/instagram-engagement-messaging
    paths:
      - .github/workflows/gcp-meta-page-subscribe-messages.yml

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  JOB: toca-meta-page-subscribe-messages
  PAGE_ID: "306103746115875"
  APP_ID: "2281930145887404"

jobs:
  subscribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy ephemeral subscription job
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT='import json, os, urllib.parse, urllib.request\n\ndef request(url, token, data=None):\n    headers={"Authorization":"Bearer "+token}\n    body=None\n    if data is not None:\n        body=urllib.parse.urlencode(data).encode()\n        headers["Content-Type"]="application/x-www-form-urlencoded"\n    req=urllib.request.Request(url, data=body, headers=headers, method="POST" if body is not None else "GET")\n    with urllib.request.urlopen(req, timeout=30) as r: return json.load(r)\n\nuser=os.environ["USER_TOKEN"]\npage_id=os.environ["PAGE_ID"]\napp_id=os.environ["APP_ID"]\nbase="https://graph.facebook.com/v26.0/"\npage=request(base+page_id+"?fields=access_token", user)\npage_token=page.get("access_token")\nif not page_token: raise SystemExit(31)\nrequest(base+page_id+"/subscribed_apps", page_token, {"subscribed_fields":"messages"})\nsubs=request(base+page_id+"/subscribed_apps", page_token).get("data",[])\nmatch=next((x for x in subs if str(x.get("id"))==app_id), None)\nif not match: raise SystemExit(32)\nfields=set(match.get("subscribed_fields") or [])\nif "messages" not in fields: raise SystemExit(33)\nprint("SAFE_PAGE_MESSAGES_SUBSCRIPTION_OK=true")\n'
          gcloud run jobs deploy "$JOB" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image python:3.12-slim \
            --service-account toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com \
            --set-env-vars "PAGE_ID=${PAGE_ID},APP_ID=${APP_ID}" \
            --set-secrets "USER_TOKEN=toca-meta-oauth-token:latest" \
            --command python \
            --args=-c,"$SCRIPT" \
            --max-retries 0 \
            --task-timeout 120s \
            --quiet
      - name: Subscribe and verify Page messaging webhook
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs execute "$JOB" --project "$PROJECT_ID" --region "$REGION" --wait --quiet
          echo "Toca Page is subscribed to TOCA MCP for messages."
      - name: Delete ephemeral job
        if: always()
        shell: bash
        run: |
          gcloud run jobs delete "$JOB" --project "$PROJECT_ID" --region "$REGION" --quiet || true
