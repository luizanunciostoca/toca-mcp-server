name: Temporary Instagram Readiness Prettier

on:
  push:
    branches:
      - codex/instagram-canary-readiness-diagnostic

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/instagram-canary-readiness-diagnostic
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write test/instagram-engagement-canary-readiness-diagnostic.test.ts
      - name: Commit formatted test
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- test/instagram-engagement-canary-readiness-diagnostic.test.ts; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/instagram-engagement-canary-readiness-diagnostic.test.ts
          git commit -m 'style(instagram): apply repository prettier'
          git push origin HEAD:codex/instagram-canary-readiness-diagnostic
