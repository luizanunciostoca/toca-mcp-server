name: Asset Intelligence Format Diff Once

on:
  push:
    branches:
      - feat/asset-intelligence-content-supply-20260820
    paths:
      - '.github/workflows/asset-intelligence-format-once.yml'

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Emit exact Prettier diff
        run: |
          pnpm exec prettier --write \
            src/assets/asset-intelligence-query.ts \
            src/assets/asset-intelligence.ts \
            src/persistence/postgres-asset-intelligence-store.ts \
            test/asset-intelligence-domain.test.ts \
            test/asset-intelligence-query.test.ts
          git diff --no-ext-diff --unified=3 -- \
            src/assets/asset-intelligence-query.ts \
            src/assets/asset-intelligence.ts \
            src/persistence/postgres-asset-intelligence-store.ts \
            test/asset-intelligence-domain.test.ts \
            test/asset-intelligence-query.test.ts
