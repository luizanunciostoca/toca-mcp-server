name: TEMP GitHub Native Format Diagnostic

on:
  push:
    branches:
      - wave/github-native-instagram-publisher

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Emit exact Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            src/github-native-publication/file-publication-store.ts \
            src/github-native-publication/github-native-meta-client.ts \
            src/github-native-publication/github-native-publication-runtime.ts \
            test/github-native-instagram-publication-boundary.test.ts
          git diff --no-ext-diff -- \
            src/github-native-publication/file-publication-store.ts \
            src/github-native-publication/github-native-meta-client.ts \
            src/github-native-publication/github-native-publication-runtime.ts \
            test/github-native-instagram-publication-boundary.test.ts
