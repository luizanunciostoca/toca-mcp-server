name: TEMP Fix Queue Sync Clock Boundary

on:
  push:
    branches:
      - fix/github-native-publication-queue-sync

permissions:
  contents: write

concurrency:
  group: temp-fix-queue-sync-clock
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/github-native-publication-queue-sync
          persist-credentials: true
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce explicit-offset reference clock and add regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/github-native-publication/github-native-publication-queue-sync.ts')
          text = source.read_text()
          old = """  const snapshot = githubNativePublicationRegistrySnapshotSchema.parse(value);\n  const now = Date.parse(nowIso);\n  if (!Number.isFinite(now)) throw new Error('GITHUB_NATIVE_QUEUE_SYNC_NOW_INVALID');\n"""
          new = """  const snapshot = githubNativePublicationRegistrySnapshotSchema.parse(value);\n  const parsedNow = explicitOffsetTimestampSchema.safeParse(nowIso);\n  if (!parsedNow.success) throw new Error('GITHUB_NATIVE_QUEUE_SYNC_NOW_INVALID');\n  const now = Date.parse(parsedNow.data);\n"""
          if text.count(old) != 1:
              raise SystemExit('expected exactly one reference-clock parsing block')
          source.write_text(text.replace(old, new))

          tests = Path('test/github-native-publication-queue-sync.test.ts')
          test_text = tests.read_text()
          marker = """  it('rejects a stale canonical snapshot', () => {\n"""
          addition = """  it('rejects an offset-less reference clock', () => {\n    expect(() =>\n      compileGithubNativePublicationQueue(\n        snapshot([validCandidate()]),\n        '2026-09-12T10:00:00',\n      ),\n    ).toThrow('GITHUB_NATIVE_QUEUE_SYNC_NOW_INVALID');\n  });\n\n"""
          if test_text.count(marker) != 1:
              raise SystemExit('expected exactly one stale-snapshot test marker')
          if "rejects an offset-less reference clock" not in test_text:
              tests.write_text(test_text.replace(marker, addition + marker))
          PY
          pnpm exec prettier --write \
            src/github-native-publication/github-native-publication-queue-sync.ts \
            test/github-native-publication-queue-sync.test.ts

      - name: Commit exact clock-boundary fix
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            src/github-native-publication/github-native-publication-queue-sync.ts
            test/github-native-publication-queue-sync.test.ts
          )
          git diff --check
          test -n "$(git diff --name-only -- "${paths[@]}")"
          git config user.name 'toca-clockfix[bot]'
          git config user.email 'toca-clockfix[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          git commit -m 'fix(instagram): require explicit-offset queue sync clock'
          git push origin HEAD:fix/github-native-publication-queue-sync
