name: Meta Ads Primary Account Reconcile One-Shot

on:
  push:
    branches: [fix/meta-ads-primary-account-311793958882290]
    paths: ['.github/workflows/meta-ads-primary-account-reconcile-once.yml']

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Reconcile primary Meta Ads account binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          OLD = '394512749760530'
          NEW = '311793958882290'
          ALT = '2036212826847237'

          binding = Path('src/providers/meta-ads/meta-ads-account-binding.ts')
          binding.write_text(
              "export const META_ADS_PRIMARY_ACCOUNT_ID = '311793958882290' as const;\n"
              "export const META_ADS_PRIMARY_ACCOUNT_REF = `act_${META_ADS_PRIMARY_ACCOUNT_ID}` as const;\n",
              encoding='utf-8',
          )

          plan = Path('src/providers/meta-ads/meta-ads-the-party-2026-08-15-plan.ts')
          text = plan.read_text(encoding='utf-8')
          marker = "import { createHash } from 'node:crypto';\n"
          import_line = "import { META_ADS_PRIMARY_ACCOUNT_ID } from './meta-ads-account-binding.js';\n"
          if import_line not in text:
              assert marker in text
              text = text.replace(marker, marker + import_line, 1)
          literal = f"export const THE_PARTY_2026_08_15_ACCOUNT_ID = '{NEW}';"
          assert literal in text
          text = text.replace(literal, 'export const THE_PARTY_2026_08_15_ACCOUNT_ID = META_ADS_PRIMARY_ACCOUNT_ID;', 1)
          plan.write_text(text, encoding='utf-8')

          for path in [
              Path('test/meta-ads-provider-preflight.test.ts'),
              Path('test/approval-governance.test.ts'),
              Path('test/approval-executor-atomicity.test.ts'),
          ]:
              text = path.read_text(encoding='utf-8')
              assert OLD in text
              path.write_text(text.replace(OLD, NEW), encoding='utf-8')

          smoke = Path('test/meta-ads-smoke-readiness.test.ts')
          text = smoke.read_text(encoding='utf-8')
          old_block = f"""    expect(\n      isMetaAdsPixelAssignedToAccount(\n        [{{ id: 'act_{OLD}', account_id: '{OLD}' }}],\n        '{OLD}',\n      ),\n    ).toBe(true);\n    expect(\n      isMetaAdsPixelAssignedToAccount(\n        [{{ id: 'act_{NEW}', account_id: '{NEW}' }}],\n        '{OLD}',\n      ),\n    ).toBe(false);"""
          new_block = f"""    expect(\n      isMetaAdsPixelAssignedToAccount(\n        [{{ id: 'act_{NEW}', account_id: '{NEW}' }}],\n        '{NEW}',\n      ),\n    ).toBe(true);\n    expect(\n      isMetaAdsPixelAssignedToAccount(\n        [{{ id: 'act_{ALT}', account_id: '{ALT}' }}],\n        '{NEW}',\n      ),\n    ).toBe(false);"""
          assert old_block in text
          smoke.write_text(text.replace(old_block, new_block, 1), encoding='utf-8')

          register = Path('docs/operations/provider-write-validation-register.md')
          text = register.read_text(encoding='utf-8')
          old_line = f"- the current validated ad-account target is `{OLD}`; old diagnostics/workflows that referenced `{NEW}` are superseded and must not be used;"
          new_line = f"- the primary Meta Ads account is now `{NEW}`; `{OLD}` is superseded as an operational target and remains relevant only to historical provider evidence;"
          assert old_line in text
          text = text.replace(old_line, new_line, 1)
          required = f"3. exact active ad account `{OLD}` + currency proof;"
          assert required in text
          text = text.replace(required, f"3. exact active ad account `{NEW}` + currency proof;", 1)
          register.write_text(text, encoding='utf-8')

          checkpoint = Path('docs/checkpoints/meta-ads-provider-settlement-readiness-v2.md')
          text = checkpoint.read_text(encoding='utf-8')
          old_status = 'Status: **CODE READY / PROVIDER PREPARE BLOCKED BY META BILLING — NO WRITE / NO SPEND**'
          new_status = f'Status: **CODE READY / PRIMARY ACCOUNT `{NEW}` REQUIRES FRESH PREPARE — NO WRITE / NO SPEND**'
          assert old_status in text
          text = text.replace(old_status, new_status, 1)
          anchor = "This is provider/billing state, not a repository validation failure. No campaign, ad set, creative or ad was created, no activation occurred, no retry was issued, and no spend was possible.\n\n"
          assert anchor in text
          transition = (
              f"## Primary account transition — 2026-08-15\n\n"
              f"The operational Meta Ads primary account is now `{NEW}`. The prior PREPARE against `{OLD}` remains immutable historical evidence only; its billing result must not be used to infer billing or write readiness for `{NEW}`.\n\n"
              f"The canonical campaign plan already targeted `{NEW}`. This reconciliation aligns the provider-validation workflow, approval fixtures and operational documentation with that primary account and adds a regression test so code and workflow cannot silently diverge again.\n\n"
          )
          text = text.replace(anchor, anchor + transition, 1)
          old_gate = 'The provider write gate remains **BLOCKED_EXTERNAL_BILLING**. `CREATE_PAUSED` must not be executed until the same exact-code PREPARE succeeds after the billing state is corrected.'
          new_gate = f'The old `{OLD}` target remains historically **BLOCKED_EXTERNAL_BILLING**, but it is no longer the operational target. The primary `{NEW}` target is **REVALIDATION_REQUIRED**: `CREATE_PAUSED` must not be executed until a fresh exact-code PREPARE succeeds for `{NEW}`.'
          assert old_gate in text
          text = text.replace(old_gate, new_gate, 1)
          checkpoint.write_text(text, encoding='utf-8')

          regression = Path('test/meta-ads-primary-account-binding.test.ts')
          regression.write_text(
              "import { readFileSync } from 'node:fs';\n"
              "import { describe, expect, it } from 'vitest';\n"
              "import { META_ADS_PRIMARY_ACCOUNT_ID } from '../src/providers/meta-ads/meta-ads-account-binding.js';\n"
              "import { THE_PARTY_2026_08_15_ACCOUNT_ID } from '../src/providers/meta-ads/meta-ads-the-party-2026-08-15-plan.js';\n\n"
              "describe('Meta Ads primary account binding', () => {\n"
              "  it('keeps canonical code and provider-validation workflow on the same primary account', () => {\n"
              "    expect(META_ADS_PRIMARY_ACCOUNT_ID).toBe('311793958882290');\n"
              "    expect(THE_PARTY_2026_08_15_ACCOUNT_ID).toBe(META_ADS_PRIMARY_ACCOUNT_ID);\n\n"
              "    const workflow = readFileSync('.github/workflows/meta-ads-create-paused-provider-smoke.yml', 'utf8');\n"
              "    expect(workflow).toContain(`META_ADS_ACCOUNT_ID: '${META_ADS_PRIMARY_ACCOUNT_ID}'`);\n"
              "  });\n"
              "});\n",
              encoding='utf-8',
          )

          for path in [
              Path('src/providers/meta-ads/meta-ads-the-party-2026-08-15-plan.ts'),
              Path('test/meta-ads-provider-preflight.test.ts'),
              Path('test/approval-governance.test.ts'),
              Path('test/approval-executor-atomicity.test.ts'),
              Path('test/meta-ads-smoke-readiness.test.ts'),
              Path('docs/operations/provider-write-validation-register.md'),
          ]:
              assert OLD not in path.read_text(encoding='utf-8'), path
          PY

      - name: Commit reconciled non-workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/providers/meta-ads/meta-ads-account-binding.ts \
            src/providers/meta-ads/meta-ads-the-party-2026-08-15-plan.ts \
            docs/operations/provider-write-validation-register.md \
            docs/checkpoints/meta-ads-provider-settlement-readiness-v2.md \
            test/meta-ads-smoke-readiness.test.ts \
            test/meta-ads-provider-preflight.test.ts \
            test/approval-governance.test.ts \
            test/approval-executor-atomicity.test.ts \
            test/meta-ads-primary-account-binding.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(meta-ads): make 311793958882290 the primary account'
          git push origin HEAD:fix/meta-ads-primary-account-311793958882290
