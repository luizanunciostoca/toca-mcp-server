name: R20 R29 Reconcile Main

on:
  push:
    branches: [feat/r20-r29-video-content-repurposing]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/r20-r29-video-content-repurposing
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Reconcile latest main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          rm .github/workflows/r20-r29-reconcile-main.yml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format final follow-up files
        run: >-
          pnpm exec prettier --write
          test/r20-r29-capability-contracts.test.ts
          docs/checkpoints/r20-r29-video-content-repurposing.md
      - name: Full Quality Gate on reconciled tree
        run: pnpm quality
      - name: Commit and push only after green Quality
        run: |
          git add -A
          git commit -m "chore: reconcile R20 R29 with latest main"
          git push origin HEAD:feat/r20-r29-video-content-repurposing
