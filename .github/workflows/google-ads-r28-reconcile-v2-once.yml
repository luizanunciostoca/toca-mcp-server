name: Google Ads R28 Reconcile V2 Once

on:
  push:
    branches: [reconcile/r28-google-ads-current-main]
    paths: ['.github/workflows/google-ads-r28-reconcile-v2-once.yml']

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Replay audited reconciliation with current lint fixes
        shell: bash
        run: |
          set -euo pipefail
          BASE='81f6f84df6b725bfc5994c2d1582241b7936c614'
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(git diff --name-only "$BASE" HEAD | sort)" = "$(printf '%s\n' \
            '.github/workflows/google-ads-r28-reconcile-once.yml' \
            '.github/workflows/google-ads-r28-reconcile-v2-once.yml' | sort)"

          awk '
            /- name: Reconcile legacy R28 delta into current core facade/ { wanted=1; next }
            wanted && /run: \|/ { capture=1; next }
            capture && /^      - name: Commit clean current-architecture reconciliation/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/google-ads-r28-reconcile-once.yml > /tmp/reconcile.sh
          test -s /tmp/reconcile.sh

          python - <<'PY'
          from pathlib import Path

          script = Path('/tmp/reconcile.sh')
          text = script.read_text()
          old_assert = "test \"$(git diff --name-only \"$BASE\" HEAD)\" = '.github/workflows/google-ads-r28-reconcile-once.yml'\n"
          if old_assert not in text:
              raise SystemExit('original one-shot assertion not found')
          text = text.replace(old_assert, '', 1)

          marker = 'pnpm exec prettier --write \\\n'
          if marker not in text:
              raise SystemExit('prettier marker not found')
          lint_fix = r'''python - <<'PYFIX'
          from pathlib import Path

          resolver = Path('src/mcp/runtime-capability-resolver.ts')
          value = resolver.read_text()
          value = value.replace('  GoogleAdsCampaignPlan,\n', '')
          value = value.replace('input as GoogleAdsCampaignPlan', 'input')
          resolver.write_text(value)

          api_test = Path('test/google-ads-api-client.test.ts')
          value = api_test.read_text()
          value = value.replace(
              "const fakeFetch = (async (input: string | URL | Request, init?: RequestInit) => {\n      calls.push({ url: String(input), init });",
              "const fakeFetch: typeof fetch = async (input: string | URL | Request, init?: RequestInit) => {\n      await Promise.resolve();\n      calls.push({\n        url: typeof input === 'string' ? input : input instanceof URL ? input.toString() : input.url,\n        init,\n      });",
          )
          value = value.replace(
              "    }) as typeof fetch;",
              "    };",
              1,
          )
          old_body = """    expect(JSON.parse(String(calls[0]?.init?.body))).toEqual({
      query: 'SELECT campaign.id FROM campaign LIMIT 1',
    });"""
          new_body = """    const body = calls[0]?.init?.body;
    expect(typeof body).toBe('string');
    if (typeof body !== 'string') throw new Error('TEST_REQUEST_BODY_STRING_REQUIRED');
    expect(JSON.parse(body)).toEqual({
      query: 'SELECT campaign.id FROM campaign LIMIT 1',
    });"""
          if old_body not in value:
              raise SystemExit('api test body assertion anchor missing')
          value = value.replace(old_body, new_body, 1)
          old_fetch = """      (async () => new Response('{}', { status: 200 })) as typeof fetch,"""
          new_fetch = """      async () => {
        await Promise.resolve();
        return new Response('{}', { status: 200 });
      },"""
          if old_fetch not in value:
              raise SystemExit('api test boundary fetch anchor missing')
          value = value.replace(old_fetch, new_fetch, 1)
          api_test.write_text(value)

          paid_test = Path('test/google-ads-paid-media.test.ts')
          value = paid_test.read_text()
          for signature in (
              '  async listAccessibleCustomers() {\n',
              '  async search(query: string) {\n',
              '  async mutate(path: string, body: Record<string, unknown>) {\n',
              '      override async mutate(path: string, body: Record<string, unknown>) {\n',
          ):
              if signature not in value:
                  raise SystemExit(f'paid-media lint anchor missing: {signature!r}')
              value = value.replace(signature, signature + '    await Promise.resolve();\n' if signature.startswith('  async') else signature + '        await Promise.resolve();\n', 1)
          paid_test.write_text(value)
          PYFIX

          '''
          text = text.replace(marker, lint_fix + marker, 1)
          script.write_text(text)
          PY

          bash /tmp/reconcile.sh

      - name: Commit clean current-architecture reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'luizidebook'
          git config user.email '47362223+luizidebook@users.noreply.github.com'
          git add \
            docs/architecture/r28-google-ads-paid-media.md \
            docs/architecture/routes-capabilities-v1.md \
            src/config.ts \
            src/governance/capability-catalog.ts \
            src/governance/capability-ids.ts \
            src/mcp/runtime-capability-resolver.ts \
            src/providers/google-ads/google-ads-api-client.ts \
            src/providers/google-ads/google-ads-paid-media.ts \
            src/providers/google-ads/google-ads-phase.ts \
            src/registry.ts \
            src/server.ts \
            test/config.test.ts \
            test/google-ads-api-client.test.ts \
            test/google-ads-create-idempotency.test.ts \
            test/google-ads-paid-media.test.ts \
            test/governance-catalog.test.ts
          test "$(git diff --cached --name-only | wc -l)" = '16'
          git commit -m 'feat(r28): reconcile Google Ads with TOCA Core facade'
          git push origin HEAD:reconcile/r28-google-ads-current-main
