name: Production Schema Audit One-Shot

on:
  push:
    branches: [chore/foundation-daily-control-evidence]
    paths: ['.github/workflows/production-schema-audit-once.yml']

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  ARTIFACT_REPOSITORY: toca-mcp
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  DATABASE_SECRET_ID: toca-database-url
  RUNTIME_SA: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  DEPLOY_SA: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  WIF: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  AUDIT_REASON: post-migration-attempt-31915535478

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Build immutable read-only audit image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/server:production-schema-audit-${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Execute read-only schema audit
        shell: bash
        run: |
          set -euo pipefail
          echo "AUDIT_REASON=$AUDIT_REASON"
          JOB="toca-production-schema-audit-${GITHUB_RUN_ID}"
          cleanup() { gcloud run jobs delete "$JOB" --project "$PROJECT_ID" --region "$REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          gcloud run jobs deploy "$JOB" \
            --image "$IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --command node \
            --args dist/src/production-schema-audit.js \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 120s \
            --quiet
          gcloud run jobs execute "$JOB" --project "$PROJECT_ID" --region "$REGION" --wait --quiet
          RESULT=''
          for attempt in $(seq 1 12); do
            RESULT="$(gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${JOB}\" AND textPayload:\"PRODUCTION_SCHEMA_AUDIT=\"" \
              --project "$PROJECT_ID" --freshness=20m --limit=20 --order=desc --format='value(textPayload)' \
              | grep 'PRODUCTION_SCHEMA_AUDIT=' | head -n1 || true)"
            [ -n "$RESULT" ] && break
            sleep 5
          done
          test -n "$RESULT"
          JSON="${RESULT#PRODUCTION_SCHEMA_AUDIT=}"
          printf '%s\n' "$JSON" | jq . | tee production-schema-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-schema-audit-${{ github.sha }}
          path: production-schema-audit.json
          if-no-files-found: error
          retention-days: 90
