name: Runtime Format Diagnostic

on:
  pull_request:
    paths:
      - src/server.ts
      - src/runtime/tenant-identity.ts
      - .github/workflows/runtime-format-diagnostic.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/next-runtime-convergence-20260820
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply canonical Prettier output once
        run: |
          set -euo pipefail
          pnpm exec prettier --write src/server.ts src/runtime/tenant-identity.ts
          if git diff --quiet -- src/server.ts src/runtime/tenant-identity.ts; then
            echo 'FORMAT_ALREADY_CANONICAL=true'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.ts src/runtime/tenant-identity.ts
          git commit -m 'style(runtime): apply canonical Prettier output'
          git push origin HEAD:refs/heads/feat/next-runtime-convergence-20260820
