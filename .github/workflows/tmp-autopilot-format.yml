name: Temporary Autopilot Formatter

on:
  push:
    branches:
      - feat/marketing-autopilot-closed-loop-composition

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed Autopilot files
        run: pnpm exec prettier --write src/learning/marketing-autopilot-closed-loop-runner.ts test/marketing-autopilot-closed-loop-runner.test.ts
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- src/learning/marketing-autopilot-closed-loop-runner.ts test/marketing-autopilot-closed-loop-runner.test.ts; then
            exit 0
          fi
          git config user.name "TOCA OS CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/learning/marketing-autopilot-closed-loop-runner.ts test/marketing-autopilot-closed-loop-runner.test.ts
          git commit -m "style(marketing): format closed-loop files"
          git push origin HEAD:feat/marketing-autopilot-closed-loop-composition
