name: Temporary Autopilot Formatter

on:
  push:
    branches:
      - ops/restore-marketing-autopilot-gcp-scheduler-20260916
    paths:
      - .github/workflows/tmp-autopilot-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ops/restore-marketing-autopilot-gcp-scheduler-20260916
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact Quality Gate failures
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            scripts/marketing-autopilot-daily-scheduler.mjs \
            src/instagram-provider-duplicate-preflight.ts \
            test/marketing-autopilot-registry-reconciliation.test.ts
          pnpm exec prettier --check \
            scripts/marketing-autopilot-daily-scheduler.mjs \
            src/instagram-provider-duplicate-preflight.ts \
            test/marketing-autopilot-registry-reconciliation.test.ts
      - name: Commit formatting only
        run: |
          set -euo pipefail
          git diff --exit-code -- .github/workflows || true
          git config user.name 'TOCA OS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            scripts/marketing-autopilot-daily-scheduler.mjs \
            src/instagram-provider-duplicate-preflight.ts \
            test/marketing-autopilot-registry-reconciliation.test.ts
          if git diff --cached --quiet; then
            echo 'FORMAT_NO_CHANGES=1'
            exit 0
          fi
          git commit -m 'style(marketing): format autopilot restoration'
          git push origin HEAD:ops/restore-marketing-autopilot-gcp-scheduler-20260916
