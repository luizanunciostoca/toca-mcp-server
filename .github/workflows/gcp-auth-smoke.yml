name: GCP Auth Smoke

on:
  pull_request:
    paths:
      - '.github/workflows/gcp-auth-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  auth-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify federated identity
        run: |
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          gcloud projects describe toca-mcp-production --format='value(projectId,projectNumber)'

      - name: Inspect runtime Secret Manager roles
        run: |
          gcloud projects get-iam-policy toca-mcp-production \
            --flatten='bindings[].members' \
            --filter='bindings.members:serviceAccount:toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com' \
            --format='value(bindings.role)'
