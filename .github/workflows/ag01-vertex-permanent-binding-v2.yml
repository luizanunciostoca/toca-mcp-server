name: AG-01 Permanent Vertex Binding v2

on:
  push:
    branches:
      - ops/ag01-vertex-permanent-binding-20260828
    paths:
      - '.github/workflows/ag01-vertex-permanent-binding-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  SERVICE: toca-ag01-orchestrator
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  CLOUD_SQL_INSTANCE: toca-mcp-db
  DATABASE_SECRET: toca-database-url
  AUTHORIZATION_ISSUE: '335'
  AG01_VERTEX_PROJECT_ID: toca-mcp-production
  AG01_VERTEX_LOCATION: global
  AG01_VERTEX_MODEL: gemini-2.5-flash
  ROUTING_SPREADSHEET_ID: 1vnSliJe2duw278DPPdiTylXUooOdzYtVa0nXD24LEtU
  CANONICAL_RESOURCES_SPREADSHEET_ID: 1Pc1tyx0dd9GvJBM_8mewh21tfXayfaOhajbmX-uACsY

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require exact production authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${AUTHORIZATION_ISSUE}" \
            > /tmp/ag01-production-authorization.json
          jq -e --arg sha "$GITHUB_SHA" --arg owner "$GITHUB_REPOSITORY_OWNER" '
            (.state == "open") and
            (.user.login == $owner) and
            (.title == "PRODUCTION AUTHORIZATION — AG-01 permanent Vertex binding") and
            ((.body // "") | contains("AUTHORIZATION_STATE=ACTIVE")) and
            ((.body // "") | contains("AUTHORIZED_CANDIDATE_SHA=" + $sha))
          ' /tmp/ag01-production-authorization.json >/dev/null

      - name: Verify authority and metadata-auth boundaries
        run: |
          set -euo pipefail
          grep -Fq 'ExistingCoreCapabilityGateway' src/orchestrator/production-runtime.ts
          grep -Fq 'bindApprovalStoreToScope' src/orchestrator/production-runtime.ts
          grep -Fq "config.modelProvider === 'vertex'" src/orchestrator/production-runtime.ts
          grep -Fq 'AG01_FAIL_CLOSED' src/orchestrator/production-runtime.ts
          grep -Fq "url.pathname === '/v1/orchestrator/execute'" src/orchestrator/http-server.ts
          grep -Fq "AG01_GOOGLE_AUTH_MODE" src/orchestrator/production-config.ts
          grep -Fq "gcp_metadata" src/orchestrator/production-config.ts
          grep -Fq "spreadsheets.readonly" src/orchestrator/google-oauth-secret-resolver.ts

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Full Quality Gate
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm quality

      - name: Authenticate deploy boundary to GCP
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Verify canonical production database binding without secret payload access
        run: |
          set -euo pipefail
          mkdir -p ag01-binding-evidence
          gcloud run services describe toca-mcp-production --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/mcp.json
          DB_SECRET="$(jq -r '[.spec.template.spec.containers[0].env[]? | select(.name=="DATABASE_URL") | .valueFrom.secretKeyRef.name] | first // empty' /tmp/mcp.json)"
          DB_VERSION="$(jq -r '[.spec.template.spec.containers[0].env[]? | select(.name=="DATABASE_URL") | .valueFrom.secretKeyRef.key] | first // empty' /tmp/mcp.json)"
          [[ "$DB_SECRET" == "$DATABASE_SECRET" ]] || { echo "Unexpected canonical DB secret binding: $DB_SECRET" >&2; exit 1; }
          [[ -n "$DB_VERSION" ]] || DB_VERSION=latest
          echo "DB_VERSION=$DB_VERSION" >> "$GITHUB_ENV"
          jq -n --arg dbSecret "$DB_SECRET" --arg dbVersion "$DB_VERSION" '{schemaVersion:"toca.ag01.permanent-binding-preflight.v2",status:"READY",databaseSecret:$dbSecret,databaseSecretVersion:$dbVersion,googleRegistryAuth:"GCP_RUNTIME_IDENTITY_SCOPED_TOKEN",secretPayloadRead:false}' > ag01-binding-evidence/preflight.json

      - name: Configure Artifact Registry auth
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push immutable orchestrator image
        run: |
          set -euo pipefail
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/ag01:permanent-${GITHUB_SHA}"
          docker build --file Dockerfile.orchestrator --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy permanent private candidate with Vertex primary
        run: |
          set -euo pipefail
          REV_SUFFIX="vtx-${GITHUB_SHA::8}-${GITHUB_RUN_ATTEMPT}"
          TAG="candidate-${GITHUB_SHA::8}-${GITHUB_RUN_ATTEMPT}"
          ENV_VARS="NODE_ENV=production,AG01_MODEL_PROVIDER=vertex,AG01_VERTEX_PROJECT_ID=$AG01_VERTEX_PROJECT_ID,AG01_VERTEX_LOCATION=$AG01_VERTEX_LOCATION,AG01_VERTEX_MODEL=$AG01_VERTEX_MODEL,AG01_TOCA_OS_ROUTING_SPREADSHEET_ID=$ROUTING_SPREADSHEET_ID,AG01_TOCA_OS_CANONICAL_RESOURCES_SPREADSHEET_ID=$CANONICAL_RESOURCES_SPREADSHEET_ID,AG01_GOOGLE_AUTH_MODE=gcp_metadata,AG01_AUTHORIZATION_ROLES=READER,AG01_ALLOWED_ROUTE_IDS=,AG01_ALLOWED_CAPABILITY_IDS=,AG01_ALLOWED_TARGET_ACCOUNTS=,TOCA_DEFAULT_TENANT_ID=toca,TOCA_DEFAULT_WORKSPACE_ID=toca,TOCA_DEFAULT_ORGANIZATION_ID=toca,TOCA_RELEASE_SHA=$GITHUB_SHA"
          if gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" >/dev/null 2>&1; then
            TRAFFIC_ARGS=(--no-traffic --tag "$TAG")
          else
            TRAFFIC_ARGS=(--tag "$TAG")
          fi
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "$IMAGE" --revision-suffix "$REV_SUFFIX" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --add-cloudsql-instances "${PROJECT_ID}:${REGION}:${CLOUD_SQL_INSTANCE}" \
            --update-secrets "DATABASE_URL=$DATABASE_SECRET:$DB_VERSION" \
            --update-env-vars "$ENV_VARS" \
            --startup-probe 'httpGet.path=/readyz,httpGet.port=8080,failureThreshold=24,timeoutSeconds=5,periodSeconds=5' \
            --liveness-probe 'httpGet.path=/healthz,httpGet.port=8080,failureThreshold=3,timeoutSeconds=3,periodSeconds=15' \
            --min-instances 0 --max-instances 2 --memory 1Gi --cpu 1 --cpu-throttling \
            --ingress all --no-allow-unauthenticated \
            "${TRAFFIC_ARGS[@]}" --quiet
          gcloud run services add-iam-policy-binding "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --member "serviceAccount:$DEPLOY_SERVICE_ACCOUNT" --role roles/run.invoker --quiet
          gcloud run services add-iam-policy-binding "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --member "serviceAccount:$RUNTIME_SERVICE_ACCOUNT" --role roles/run.invoker --quiet
          gcloud run services get-iam-policy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > ag01-binding-evidence/service-iam.json
          if jq -e '.bindings[]? | select(.role=="roles/run.invoker") | (.members // [])[]? | select(.=="allUsers")' ag01-binding-evidence/service-iam.json >/dev/null; then
            echo 'Refusing unauthenticated AG-01 exposure.' >&2; exit 1
          fi
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > ag01-binding-evidence/service-candidate.json
          AUDIENCE="$(jq -r '.status.url // empty' ag01-binding-evidence/service-candidate.json)"
          CANDIDATE_REVISION="$(jq -r '.status.latestCreatedRevisionName // empty' ag01-binding-evidence/service-candidate.json)"
          if [[ -z "$AUDIENCE" || -z "$CANDIDATE_REVISION" ]]; then echo 'Candidate identity missing' >&2; exit 1; fi
          BASE_HOST="${AUDIENCE#https://}"
          CANDIDATE_URL="https://${TAG}---${BASE_HOST}"
          echo "AUDIENCE=$AUDIENCE" >> "$GITHUB_ENV"
          echo "CANDIDATE_REVISION=$CANDIDATE_REVISION" >> "$GITHUB_ENV"
          echo "CANDIDATE_URL=$CANDIDATE_URL" >> "$GITHUB_ENV"
          jq -n --arg audience "$AUDIENCE" --arg candidateUrl "$CANDIDATE_URL" --arg revision "$CANDIDATE_REVISION" --arg tag "$TAG" '{audience:$audience,candidateUrl:$candidateUrl,candidateRevision:$revision,tag:$tag}' > ag01-binding-evidence/candidate-endpoints.json

      - name: Mint private probe token
        id: probe_auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.AUDIENCE }}
          create_credentials_file: false
          export_environment_variables: false

      - name: Verify permanent service readiness and planning-only execute
        env:
          ID_TOKEN: ${{ steps.probe_auth.outputs.id_token }}
        run: |
          set -euo pipefail
          URL="$CANDIDATE_URL"
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $ID_TOKEN" "$URL/healthz" > ag01-binding-evidence/healthz.json
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $ID_TOKEN" "$URL/readyz" > ag01-binding-evidence/readyz.json
          jq -e '.status == "ok" and .service == "toca-ag01-orchestrator"' ag01-binding-evidence/healthz.json >/dev/null
          jq -e '.status == "ready" and .model == "gemini-2.5-flash" and .runtimeCapabilityCount > 0' ag01-binding-evidence/readyz.json >/dev/null
          REQUEST_ID="permanent-binding-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          jq -n --arg key "$REQUEST_ID" --arg message 'Return a governed planning-only status. Do not execute any capability or external side effect. If action is unnecessary, return no executable steps.' '{idempotencyKey:$key,message:$message}' > /tmp/ag01-request.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ID_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/ag01-request.json "$URL/v1/orchestrator/execute" > ag01-binding-evidence/execute.json
          jq -e '.model == "gemini-2.5-flash" and (.modelResponseId|type=="string") and (.orchestration != null)' ag01-binding-evidence/execute.json >/dev/null

      - name: Promote verified permanent revision to 100 percent
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --to-revisions "$CANDIDATE_REVISION=100" --quiet
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > ag01-binding-evidence/service-final.json
          jq -e --arg revision "$CANDIDATE_REVISION" '.status.traffic[]? | select(.revisionName==$revision and .percent==100)' ag01-binding-evidence/service-final.json >/dev/null

      - name: Capture immutable evidence
        if: always()
        run: |
          mkdir -p ag01-binding-evidence
          jq -n --arg sourceSha "$GITHUB_SHA" --arg runId "$GITHUB_RUN_ID" --arg runAttempt "$GITHUB_RUN_ATTEMPT" --arg service "$SERVICE" --arg runtimeServiceAccount "$RUNTIME_SERVICE_ACCOUNT" --arg authIssue "$AUTHORIZATION_ISSUE" '{schemaVersion:"toca.ag01.permanent-binding-evidence.v2",sourceSha:$sourceSha,runId:$runId,runAttempt:$runAttempt,service:$service,runtimeServiceAccount:$runtimeServiceAccount,provider:"google-vertex-ai",model:"gemini-2.5-flash",googleRegistryAuth:"GCP_RUNTIME_IDENTITY_SCOPED_TOKEN",productionAuthorizationIssue:($authIssue|tonumber),externalApiKeyRequired:false,unauthenticatedIngressAllowed:false,corePolicyApprovalAuthorityPreserved:true}' > ag01-binding-evidence/run-metadata.json

      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ag01-vertex-permanent-binding-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ag01-binding-evidence
          if-no-files-found: error
          retention-days: 90
