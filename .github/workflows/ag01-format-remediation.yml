name: AG-01 Format Remediation

on:
  push:
    branches:
      - ops/ag01-vertex-permanent-binding-20260828
    paths:
      - '.github/workflows/ag01-format-remediation.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ops/ag01-vertex-permanent-binding-20260828
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed AG-01 files
        run: pnpm exec prettier --write src/orchestrator/google-oauth-secret-resolver.ts src/orchestrator/production-config.ts .github/workflows/ag01-vertex-permanent-binding-v2.yml
      - name: Commit formatting only
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'toca-os-ci'
          git config user.email 'toca-os-ci@users.noreply.github.com'
          git add src/orchestrator/google-oauth-secret-resolver.ts src/orchestrator/production-config.ts .github/workflows/ag01-vertex-permanent-binding-v2.yml
          git commit -m 'style(ag01): format permanent Vertex binding'
          git push origin HEAD:ops/ag01-vertex-permanent-binding-20260828
