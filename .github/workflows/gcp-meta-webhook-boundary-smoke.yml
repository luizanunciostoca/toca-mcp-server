name: GCP Meta Webhook Boundary Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feat/instagram-engagement-messaging

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  SERVICE: toca-meta-oauth-staging
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  REDIRECT_URI: https://toca-meta-oauth-staging-990081828836.southamerica-east1.run.app/oauth/meta/callback
  TOKEN_SECRET_ID: toca-meta-oauth-token
  WEBHOOK_VERIFY_TOKEN_SECRET_ID: toca-meta-webhook-verify-token
  META_APP_ID: '2281930145887404'
  META_GRAPH_API_VERSION: v24.0
  PAGE_ID: '306103746115875'
  INSTAGRAM_ACCOUNT_ID: '17841402033495654'
  RECONCILE_JOB: toca-meta-subscription-reconcile

jobs:
  webhook-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push webhook boundary image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/server:webhook-${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy isolated public OAuth and webhook boundary
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars "^@^NODE_ENV=production@META_ENABLED=true@META_WEBHOOK_ENABLED=true@MCP_ENABLED=false@LOG_LEVEL=info@META_APP_ID=$META_APP_ID@META_APP_SECRET_PROVIDER=env@META_APP_SECRET_KEY=META_APP_SECRET@META_WEBHOOK_VERIFY_TOKEN_KEY=META_WEBHOOK_VERIFY_TOKEN@META_AUTHORIZATION_ENDPOINT=https://www.facebook.com/dialog/oauth@META_TOKEN_ENDPOINT=https://graph.facebook.com/oauth/access_token@META_REDIRECT_URI=$REDIRECT_URI@META_REQUESTED_SCOPES=pages_show_list,pages_read_engagement,pages_manage_metadata,business_management,instagram_basic,instagram_manage_comments,instagram_manage_messages@META_GRAPH_BASE_URL=https://graph.facebook.com@META_GRAPH_API_VERSION=$META_GRAPH_API_VERSION@META_TOKEN_STORE_PROVIDER=gcp-secret-manager@META_TOKEN_SECRET_ID=$TOKEN_SECRET_ID@GCP_PROJECT_ID=$PROJECT_ID" \
            --set-secrets "META_APP_SECRET=toca-meta-app-secret:1,META_WEBHOOK_VERIFY_TOKEN=$WEBHOOK_VERIFY_TOKEN_SECRET_ID:latest" \
            --min-instances 0 \
            --max-instances 1 \
            --ingress all \
            --default-url \
            --no-invoker-iam-check \
            --quiet

      - name: Resolve public service URL
        run: |
          CANONICAL_URL="https://toca-meta-oauth-staging-990081828836.southamerica-east1.run.app"
          STATUS_URL="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          for CANDIDATE in "$CANONICAL_URL" "$STATUS_URL"; do
            [ -n "$CANDIDATE" ] || continue
            STATUS="$(curl --silent --output /tmp/health-response.json --write-out '%{http_code}' "$CANDIDATE/health")"
            if [ "$STATUS" = "200" ] && grep -q '"status":"ok"' /tmp/health-response.json; then
              echo "SERVICE_URL=$CANDIDATE" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo 'No unauthenticated Cloud Run URL served /health successfully.' >&2
          exit 1

      - name: Verify invalid webhook challenge is rejected
        run: |
          STATUS="$(curl --silent --output /tmp/webhook-invalid.json --write-out '%{http_code}' \
            "$SERVICE_URL/webhooks/meta?hub.mode=subscribe&hub.verify_token=invalid-token&hub.challenge=challenge-rejected")"
          test "$STATUS" = "403"
          grep -q '"error":"meta_webhook_verification_rejected"' /tmp/webhook-invalid.json
          echo 'Webhook boundary rejects an invalid verify token.'

      - name: Build Meta subscription reconciliation image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/meta-subscription-reconcile
          cat > /tmp/meta-subscription-reconcile/reconcile.mjs <<'NODE'
          const userToken = process.env.META_ACCESS_TOKEN;
          const appId = process.env.META_APP_ID;
          const apiVersion = process.env.META_GRAPH_API_VERSION;
          const pageId = process.env.PAGE_ID;
          const instagramAccountId = process.env.INSTAGRAM_ACCOUNT_ID;

          function fail(code) {
            console.error(code);
            process.exit(1);
          }

          if (!userToken || !appId || !apiVersion || !pageId || !instagramAccountId) {
            fail('META_SUBSCRIPTION_RECONCILE_CONFIG_MISSING');
          }

          async function request(base, path, token, stage, method = 'GET', values = {}) {
            const response = await fetch(new URL(`${base}/${apiVersion}/${path}`), {
              method,
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: 'application/json',
                ...(method === 'POST' ? { 'Content-Type': 'application/x-www-form-urlencoded' } : {}),
              },
              ...(method === 'POST' ? { body: new URLSearchParams(values).toString() } : {}),
            });

            let body;
            try {
              body = await response.json();
            } catch {
              body = {};
            }

            if (!response.ok) {
              const graphCode = Number.isInteger(body?.error?.code) ? body.error.code : 0;
              const graphSubcode = Number.isInteger(body?.error?.error_subcode)
                ? body.error.error_subcode
                : 0;
              throw new Error(
                `${stage}_HTTP_${response.status}_CODE_${graphCode}_SUBCODE_${graphSubcode}`,
              );
            }
            return body;
          }

          function grantedPermissions(payload) {
            const granted = new Set();
            for (const entry of Array.isArray(payload?.data) ? payload.data : []) {
              if (entry?.status === 'granted' && typeof entry?.permission === 'string') {
                granted.add(entry.permission);
              }
            }
            return granted;
          }

          const facebookBase = 'https://graph.facebook.com';
          const instagramBase = 'https://graph.instagram.com';

          try {
            const permissionsPayload = await request(
              facebookBase,
              'me/permissions',
              userToken,
              'META_USER_PERMISSIONS',
            );
            const granted = grantedPermissions(permissionsPayload);
            const requiredPermissions = [
              'pages_show_list',
              'pages_read_engagement',
              'pages_manage_metadata',
              'instagram_basic',
              'instagram_manage_comments',
              'instagram_manage_messages',
            ];
            for (const permission of requiredPermissions) {
              if (!granted.has(permission)) {
                fail(`META_PERMISSION_${permission.toUpperCase()}_NOT_GRANTED`);
              }
            }

            const page = await request(
              facebookBase,
              `${pageId}?fields=access_token`,
              userToken,
              'META_PAGE_TOKEN',
            );
            const pageToken = page?.access_token;
            if (typeof pageToken !== 'string' || pageToken.length === 0) {
              throw new Error('META_PAGE_ACCESS_TOKEN_MISSING');
            }

            const pageWrite = await request(
              facebookBase,
              `${pageId}/subscribed_apps`,
              pageToken,
              'META_PAGE_SUBSCRIBE',
              'POST',
              { subscribed_fields: 'messages' },
            );
            if (pageWrite?.success !== true) throw new Error('META_PAGE_SUBSCRIPTION_WRITE_FAILED');

            const instagramWrite = await request(
              instagramBase,
              `${instagramAccountId}/subscribed_apps`,
              pageToken,
              'META_INSTAGRAM_SUBSCRIBE',
              'POST',
              { subscribed_fields: 'comments,messages' },
            );
            if (instagramWrite?.success !== true) {
              throw new Error('META_INSTAGRAM_SUBSCRIPTION_WRITE_FAILED');
            }

            const pageSubscriptions = await request(
              facebookBase,
              `${pageId}/subscribed_apps`,
              pageToken,
              'META_PAGE_VERIFY',
            );
            const pageApp = Array.isArray(pageSubscriptions?.data)
              ? pageSubscriptions.data.find((entry) => entry?.id === appId)
              : undefined;
            const pageFields = Array.isArray(pageApp?.subscribed_fields) ? pageApp.subscribed_fields : [];
            if (!pageFields.includes('messages')) {
              throw new Error('META_PAGE_MESSAGES_SUBSCRIPTION_MISSING');
            }

            const instagramSubscriptions = await request(
              instagramBase,
              `${instagramAccountId}/subscribed_apps`,
              pageToken,
              'META_INSTAGRAM_VERIFY',
            );
            const instagramApp = Array.isArray(instagramSubscriptions?.data)
              ? instagramSubscriptions.data.find((entry) => entry?.id === appId)
              : undefined;
            const instagramFields = Array.isArray(instagramApp?.subscribed_fields)
              ? instagramApp.subscribed_fields
              : [];
            if (!instagramFields.includes('comments')) {
              throw new Error('META_INSTAGRAM_COMMENTS_SUBSCRIPTION_MISSING');
            }
            if (!instagramFields.includes('messages')) {
              throw new Error('META_INSTAGRAM_MESSAGES_SUBSCRIPTION_MISSING');
            }

            console.log('META_SUBSCRIPTION_RECONCILE_OK');
          } catch (error) {
            fail(error instanceof Error ? error.message : 'META_SUBSCRIPTION_RECONCILE_UNKNOWN');
          }
          NODE

          cat > /tmp/meta-subscription-reconcile/Dockerfile <<'DOCKER'
          FROM node:24-bookworm-slim
          WORKDIR /app
          COPY reconcile.mjs ./reconcile.mjs
          USER node
          CMD ["node", "reconcile.mjs"]
          DOCKER

          RECONCILE_IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/meta-subscription-reconcile:${GITHUB_SHA}"
          docker build -t "$RECONCILE_IMAGE" /tmp/meta-subscription-reconcile
          docker push "$RECONCILE_IMAGE"
          echo "RECONCILE_IMAGE=$RECONCILE_IMAGE" >> "$GITHUB_ENV"

      - name: Reconcile Meta asset subscriptions under runtime identity
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            gcloud run jobs delete "$RECONCILE_JOB" --project "$PROJECT_ID" --region "$REGION" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          gcloud run jobs deploy "$RECONCILE_JOB" \
            --image "$RECONCILE_IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars "META_APP_ID=$META_APP_ID,META_GRAPH_API_VERSION=$META_GRAPH_API_VERSION,PAGE_ID=$PAGE_ID,INSTAGRAM_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID" \
            --set-secrets "META_ACCESS_TOKEN=$TOKEN_SECRET_ID:latest" \
            --max-retries 0 \
            --task-timeout 120s \
            --quiet

          set +e
          gcloud run jobs execute "$RECONCILE_JOB" --project "$PROJECT_ID" --region "$REGION" --wait --quiet
          EXECUTE_STATUS=$?
          set -e

          if [ "$EXECUTE_STATUS" -ne 0 ]; then
            echo 'Meta reconciliation failed; sanitized application marker follows:' >&2
            gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$RECONCILE_JOB\" AND textPayload:\"META_\"" \
              --project "$PROJECT_ID" \
              --freshness=10m \
              --limit=10 \
              --format='value(textPayload)' \
              2>/dev/null | grep -E '^META_[A-Z0-9_]+$' | head -n 1 || true
            exit "$EXECUTE_STATUS"
          fi

          echo 'Meta Page and Instagram professional-account subscriptions reconciled under runtime identity.'

      - name: Verify MCP remains isolated
        run: |
          STATUS="$(curl --silent --output /tmp/mcp-response.json --write-out '%{http_code}' -X POST "$SERVICE_URL/mcp")"
          test "$STATUS" = "404"
          grep -q '"error":"not_found"' /tmp/mcp-response.json
          echo 'MCP remains disabled on the public OAuth/webhook boundary.'
