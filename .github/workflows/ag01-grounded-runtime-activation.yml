name: AG-01 Grounded Runtime Activation

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: write
  id-token: write

concurrency:
  group: ${{ github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'PRODUCTION AUTHORIZATION — AG-01 grounded runtime activation AUTO') && 'ag01-grounded-runtime-activation' || format('ag01-grounded-irrelevant-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  SERVICE: toca-ag01-orchestrator
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp

jobs:
  activate:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'PRODUCTION AUTHORIZATION — AG-01 grounded runtime activation AUTO')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - name: Checkout exact authorized source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate single-use authorization and main stability
        id: authz
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')" = "$GITHUB_SHA"
          ISSUE_NUMBER="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          ISSUE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
          BODY="$(jq -r '.body // ""' <<< "$ISSUE_JSON")"
          jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" '.state=="open" and .user.login==$owner and (.title|startswith("PRODUCTION AUTHORIZATION — AG-01 grounded runtime activation AUTO"))' <<< "$ISSUE_JSON" >/dev/null
          required=(
            "AUTHORIZED_CONTROLLER_SHA=$GITHUB_SHA"
            'AUTHORIZATION_STATE=ACTIVE'
            'AG01_GROUNDED_RUNTIME_ACTIVATION=AUTHORIZED'
            'ARTIFACT_BUILD_AUTHORIZED=true'
            'SERVICE_MUTATION_AUTHORIZED=true'
            'PROVIDER_WRITES_AUTHORIZED=false'
            'DIRECT_PROVIDER_WRITE_AUTHORIZED=false'
            'EXTERNAL_BUSINESS_SIDE_EFFECTS_AUTHORIZED=false'
            'ZERO_TRAFFIC_STAGE_REQUIRED=true'
            'ROLLBACK_ON_FAILURE=true'
          )
          for line in "${required[@]}"; do grep -Fxq "$line" <<< "$BODY" || exit 1; done
          # Old grounded activations retain the disabled default. If *any*
          # specialist key is present, require an exact, non-contradictory
          # one-per-key scope before enabling the internal READ-only bridge.
          SPECIALISTS_ENABLED=false
          scoped_specialist=(
            'AG01_INTERNAL_SPECIALISTS_ACTIVATION=AUTHORIZED'
            'AG01_INTERNAL_SPECIALISTS_MODE=READ_ONLY'
            'AG01_INTERNAL_SPECIALISTS_SIDE_EFFECTS_AUTHORIZED=false'
            'AG01_INTERNAL_SPECIALISTS_WORKFLOWSTORE_EXISTING_SCHEMA_ONLY=true'
            'AG01_INTERNAL_SPECIALISTS_CHATGPT_TASKS_DISPATCH=false'
          )
          specialist_key_present=false
          for line in "${scoped_specialist[@]}"; do
            key="${line%%=*}"
            if grep -Eq "^${key}=" <<< "$BODY"; then specialist_key_present=true; fi
          done
          if [[ "$specialist_key_present" == true ]]; then
            for line in "${scoped_specialist[@]}"; do
              key="${line%%=*}"
              occurrences="$(grep -Ec "^${key}=" <<< "$BODY" || true)"
              if [[ "$occurrences" != 1 ]] || ! grep -Fxq "$line" <<< "$BODY"; then
                echo 'AG01_SPECIALIST_OPTIN_INCOMPLETE' >&2
                exit 1
              fi
            done
            SPECIALISTS_ENABLED=true
          fi
          PREVIOUS="$(grep '^EXPECTED_PREVIOUS_REVISION=' <<< "$BODY" | tail -1 | cut -d= -f2-)"
          [[ "$PREVIOUS" =~ ^toca-ag01-orchestrator-[a-z0-9-]+$ ]]
          CONTROL="$(gh api "repos/${GITHUB_REPOSITORY}/issues/640" --jq '.body // ""')"
          for line in 'MAIN_STABILITY=PASS' "EVALUATED_MAIN_SHA=$GITHUB_SHA" 'MERGE_RESERVATION=NONE' 'GENERAL_AUTONOMY=false'; do
            grep -Fxq "$line" <<< "$CONTROL" || exit 1
          done
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('infra/control-plane/policy.json','utf8'));
          const a=p.activeRuntime?.ag01Orchestrator;
          if(!a || a.lifecycleStatus!=='PRODUCTION_VERIFIED' || a.currentOperationalStatus!=='HEALTHY' || a.executionAuthorized!==true || a.directProviderWriteAuthorized!==false || a.executionAuthority!=='CORE_POLICY_APPROVAL_ONLY') process.exit(1);
          NODE
          echo "authorization_issue=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "expected_previous_revision=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "specialists_enabled=$SPECIALISTS_ENABLED" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Exact-head Quality Gate
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm quality

      - name: Authenticate governed deployer
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Capture private production prestate
        id: prestate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: node scripts/ag01-activation-rollback-guard.mjs prestate ag01

      - name: Upload sanitized prestate diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: activation-prestate-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: activation-recovery/prestate-diagnostic.json
          if-no-files-found: warn
          retention-days: 90

      - name: Revalidate LIVE single-use authorization before first mutation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: node scripts/ag01-activation-rollback-guard.mjs authorize ag01

      - name: Configure Artifact Registry authentication
        shell: bash
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push immutable AG-01 image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/ag01:grounded-${GITHUB_SHA}"
          docker build --pull --file Dockerfile.orchestrator --tag "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"
          DIGEST="$(bash scripts/resolve-artifact-registry-digest.sh "$IMAGE_TAG")"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/ag01@$DIGEST"
          test "$(bash scripts/resolve-artifact-registry-digest.sh "$IMAGE")" = "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Persist authenticated instance prestate before stage
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_IMAGE: ${{ steps.image.outputs.image }}
        shell: bash
        run: node scripts/ag01-activation-rollback-guard.mjs prepare ag01

      - name: Upload required immutable rollback context before stage
        id: rollback_context
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: activation-rollback-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: activation-recovery/rollback-context.json
          if-no-files-found: error
          retention-days: 90

      - name: Stage private AG-01 candidate at zero traffic
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT_ARTIFACT_ID: ${{ steps.rollback_context.outputs.artifact-id }}
          CANDIDATE_SUFFIX: ${{ steps.prestate.outputs.candidate_suffix }}
          CANDIDATE_TAG: ${{ steps.prestate.outputs.candidate_tag }}
          IMAGE: ${{ steps.image.outputs.image }}
          PRE_REVISION: ${{ steps.prestate.outputs.pre_revision }}
          SPECIALISTS_ENABLED: ${{ steps.authz.outputs.specialists_enabled }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ag01-activation-rollback-guard.mjs validate-stage ag01
          [[ "$SPECIALISTS_ENABLED" == true || "$SPECIALISTS_ENABLED" == false ]]
          SUFFIX="$CANDIDATE_SUFFIX"
          TAG="$CANDIDATE_TAG"
          CANDIDATE="${SERVICE}-${SUFFIX}"
          gcloud run deploy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --image "$IMAGE" --service-account "$RUNTIME_SERVICE_ACCOUNT" --revision-suffix "$SUFFIX" --update-env-vars "TOCA_RELEASE_SHA=$GITHUB_SHA,INSTAGRAM_PUBLICATION_WRITES_ENABLED=false,TOCA_AG01_INTERNAL_SPECIALISTS_ENABLED=$SPECIALISTS_ENABLED,TOCA_ACTIVATION_RUN_ID=$GITHUB_RUN_ID,TOCA_ACTIVATION_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT,TOCA_ACTIVATION_CONTROLLER_SHA=$GITHUB_SHA" --tag "$TAG" --no-traffic --no-allow-unauthenticated --quiet
          SERVICE_JSON="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          URL="$(jq -r --arg tag "$TAG" '.status.traffic[]? | select(.tag==$tag) | .url // empty' <<< "$SERVICE_JSON")"
          test -n "$URL"
          CANDIDATE_JSON="$(gcloud run revisions describe "$CANDIDATE" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          jq -e --arg sa "$RUNTIME_SERVICE_ACCOUNT" --arg sha "$GITHUB_SHA" --arg digest "${{ steps.image.outputs.digest }}" '.spec.serviceAccountName==$sa and ([.status.conditions[]? | select(.type=="Ready") | .status]|last)=="True" and (.spec.containers[0].image|contains($digest)) and ([.spec.containers[0].env[]? | select(.name=="TOCA_RELEASE_SHA") | .value]|last)==$sha and ([.spec.containers[0].env[]? | select(.name=="INSTAGRAM_PUBLICATION_WRITES_ENABLED") | .value]|last)=="false"' <<< "$CANDIDATE_JSON" >/dev/null
          jq -e --arg specialists "$SPECIALISTS_ENABLED" '[.spec.containers[0].env[]? | select(.name=="TOCA_AG01_INTERNAL_SPECIALISTS_ENABLED") | .value] | last == $specialists' <<< "$CANDIDATE_JSON" >/dev/null
          jq -e --arg candidate "$CANDIDATE" --arg previous "$PRE_REVISION" '([.status.traffic[]? | select(.revisionName==$candidate) | (.percent//0)]|add//0)==0 and ([.status.traffic[]? | select(.revisionName==$previous) | (.percent//0)]|add//0)==100' <<< "$SERVICE_JSON" >/dev/null
          echo "candidate_revision=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "candidate_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Mint private candidate probe token
        id: candidate_token
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.prestate.outputs.base_url }}
          create_credentials_file: false
          export_environment_variables: false

      - name: Prove health readiness and grounded Drive answer without side effect
        env:
          ID_TOKEN: ${{ steps.candidate_token.outputs.id_token }}
          CANDIDATE_URL: ${{ steps.stage.outputs.candidate_url }}
        shell: bash
        run: |
          set -euo pipefail
          for path in health ready; do
            for attempt in $(seq 1 12); do
              code="$(curl --silent --show-error -o "/tmp/ag01-${path}.json" -w '%{http_code}' -H "Authorization: Bearer $ID_TOKEN" "$CANDIDATE_URL/$path" || true)"
              [[ "$code" == 200 ]] && break
              sleep 5
            done
            test "$code" = 200
          done
          jq -n --arg key "grounded-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '{idempotencyKey:$key,message:"Que horas começa o Sunset?",expectedIntent:"EVENT_INFO",correlationId:$key}' >/tmp/grounded-request.json
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $ID_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/grounded-request.json "$CANDIDATE_URL/v1/knowledge/answer" >/tmp/grounded-answer.json
          jq -e '.status=="GROUNDED" and (.answer|type=="string" and length>0) and (.confidence>=0.85) and (.citedResourceIds|length>0) and (.evidence|length>0)' /tmp/grounded-answer.json >/dev/null
          echo 'DRIVE_SCOPE=READ_ONLY' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify official sunset ticket calendar on candidate
        env:
          ID_TOKEN: ${{ steps.candidate_token.outputs.id_token }}
          PROBE_URL: ${{ steps.stage.outputs.candidate_url }}
          CALENDAR_ANSWER_FILE: /tmp/calendar-candidate-answer.json
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg key "calendar-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '{idempotencyKey:$key,message:"Em quais dias funciona o Pôr do Sol?",expectedIntent:"LOCATION_HOURS",correlationId:$key}' > /tmp/calendar-candidate-request.json
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $ID_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/calendar-candidate-request.json "$PROBE_URL/v1/knowledge/answer" > "$CALENDAR_ANSWER_FILE"
          node scripts/ag01-activation-rollback-guard.mjs calendar-evidence candidate

      - name: Promote exact candidate transactionally
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.stage.outputs.candidate_revision }}
          PRE_REVISION: ${{ steps.prestate.outputs.pre_revision }}
        shell: bash
        run: |
          set -euo pipefail
          current_revision(){ gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json | jq -r '[.status.traffic[]? | select((.percent//0)==100 and (.revisionName//"")!="") | .revisionName] | if length==1 then .[0] else empty end'; }
          rollback(){
            [[ "${PROMOTION_ATTEMPTED:-false}" == true ]] || return 0
            node scripts/ag01-activation-rollback-guard.mjs rollback ag01
          }
          test "$(current_revision)" = "$PRE_REVISION"
          IAM_JSON="$(gcloud run services get-iam-policy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          ! jq -e '.bindings[]? | select(.role=="roles/run.invoker") | (.members//[])[]? | select(.=="allUsers")' <<< "$IAM_JSON" >/dev/null
          PROMOTION_ATTEMPTED=true
          trap rollback ERR
          node scripts/ag01-activation-rollback-guard.mjs promote ag01
          test "$(current_revision)" = "$CANDIDATE"
          IAM_JSON="$(gcloud run services get-iam-policy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          ! jq -e '.bindings[]? | select(.role=="roles/run.invoker") | (.members//[])[]? | select(.=="allUsers")' <<< "$IAM_JSON" >/dev/null
          trap - ERR

      - name: Mint production base probe token
        id: base_token
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.prestate.outputs.base_url }}
          create_credentials_file: false
          export_environment_variables: false

      - name: Verify production grounded readback
        env:
          ID_TOKEN: ${{ steps.base_token.outputs.id_token }}
          BASE_URL: ${{ steps.prestate.outputs.base_url }}
          CANDIDATE: ${{ steps.stage.outputs.candidate_revision }}
          SPECIALISTS_ENABLED: ${{ steps.authz.outputs.specialists_enabled }}
        shell: bash
        run: |
          set -euo pipefail
          for path in health ready; do
            test "$(curl --silent --show-error -o "/tmp/base-${path}.json" -w '%{http_code}' -H "Authorization: Bearer $ID_TOKEN" "$BASE_URL/$path")" = 200
          done
          jq -n --arg key "grounded-base-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '{idempotencyKey:$key,message:"Que horas começa o Sunset?",expectedIntent:"EVENT_INFO",correlationId:$key}' >/tmp/base-request.json
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $ID_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/base-request.json "$BASE_URL/v1/knowledge/answer" >/tmp/base-answer.json
          jq -e '.status=="GROUNDED" and (.confidence>=0.85) and (.citedResourceIds|length>0)' /tmp/base-answer.json >/dev/null
          CURRENT="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json | jq -r '[.status.traffic[]? | select((.percent//0)==100) | .revisionName] | if length==1 then .[0] else empty end')"
          test "$CURRENT" = "$CANDIDATE"
          CURRENT_REVISION_JSON="$(gcloud run revisions describe "$CURRENT" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          jq -e --arg specialists "$SPECIALISTS_ENABLED" '[.spec.containers[0].env[]? | select(.name=="TOCA_AG01_INTERNAL_SPECIALISTS_ENABLED") | .value] | last == $specialists' <<< "$CURRENT_REVISION_JSON" >/dev/null

      - name: Verify official sunset ticket calendar on base
        env:
          ID_TOKEN: ${{ steps.base_token.outputs.id_token }}
          PROBE_URL: ${{ steps.prestate.outputs.base_url }}
          CALENDAR_ANSWER_FILE: /tmp/calendar-base-answer.json
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg key "calendar-base-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '{idempotencyKey:$key,message:"Em quais dias funciona o Pôr do Sol?",expectedIntent:"LOCATION_HOURS",correlationId:$key}' > /tmp/calendar-base-request.json
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $ID_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/calendar-base-request.json "$PROBE_URL/v1/knowledge/answer" > "$CALENDAR_ANSWER_FILE"
          node scripts/ag01-activation-rollback-guard.mjs calendar-evidence base

      - name: Publish sanitized activation evidence
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.authz.outputs.authorization_issue }}
          CANDIDATE: ${{ steps.stage.outputs.candidate_revision }}
          DIGEST: ${{ steps.image.outputs.digest }}
          SPECIALISTS_ENABLED: ${{ steps.authz.outputs.specialists_enabled }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ag01-grounded-evidence
          cat > ag01-grounded-evidence/sanitized-evidence.env <<EOF
          AG01_GROUNDED_RUNTIME_ACTIVATION_STATUS=PASS
          RUNTIME_SOURCE_SHA=$GITHUB_SHA
          RUNTIME_IMAGE_DIGEST=$DIGEST
          PROMOTED_REVISION=$CANDIDATE
          TRAFFIC_PERCENT=100
          SPECIALIST_READONLY_FLAG_VERIFIED=$SPECIALISTS_ENABLED
          SPECIALIST_CORE_PRODUCER_ACK=NOT_PROVEN_BY_GROUNDED_PROBE
          GROUNDING_PROBE=PASS
          SUNSET_TICKET_CALENDAR_PROBE=GROUNDED_URL_CITATIONS_VERIFIED
          SUNSET_TICKET_CALENDAR_SEMANTIC_REVIEW=REQUIRED
          DRIVE_SCOPE=READ_ONLY
          DIRECT_PROVIDER_WRITE=false
          EXTERNAL_BUSINESS_SIDE_EFFECT=false
          EOF
          COMMENT="$(cat ag01-grounded-evidence/sanitized-evidence.env)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="$COMMENT" >/dev/null
          printf '%s\n' "$COMMENT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized immutable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ag01-grounded-runtime-activation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ag01-grounded-evidence/sanitized-evidence.env
            ag01-grounded-evidence/calendar-*.json
          if-no-files-found: warn
          retention-days: 90

      - name: Consume single-use authorization
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.authz.outputs.authorization_issue }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ISSUE_NUMBER:-}" ]] || exit 0
          BODY="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" --jq '.body // ""')"
          UPDATED="$(printf '%s' "$BODY" | sed 's/^AUTHORIZATION_STATE=ACTIVE$/AUTHORIZATION_STATE=CONSUMED/')"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" -f body="$UPDATED" -f state=closed >/dev/null
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="AUTHORIZATION_CONSUMED=true\nWORKFLOW_STATUS=$JOB_STATUS\nREUSE_PROHIBITED=true" >/dev/null

      - name: Roll back if any post-promotion step failed
        if: failure() && steps.promote.outputs.promotion_attempted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: node scripts/ag01-activation-rollback-guard.mjs rollback ag01
