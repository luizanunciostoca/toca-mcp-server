name: AG-01 Grounded Runtime Activation

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: ag01-grounded-runtime-activation
  cancel-in-progress: false

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  SERVICE: toca-ag01-orchestrator
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp

jobs:
  activate:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'PRODUCTION AUTHORIZATION — AG-01 grounded runtime activation AUTO')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - name: Checkout exact authorized source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate single-use authorization and main stability
        id: authz
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          CURRENT_MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          test "$CURRENT_MAIN_SHA" = "$GITHUB_SHA"

          ISSUE_JSON="$(jq -c '.issue' "$GITHUB_EVENT_PATH")"
          BODY="$(jq -r '.body // ""' <<< "$ISSUE_JSON")"
          ISSUE_NUMBER="$(jq -r '.number' <<< "$ISSUE_JSON")"
          jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" '
            .state == "open" and .user.login == $owner and
            (.title | startswith("PRODUCTION AUTHORIZATION — AG-01 grounded runtime activation AUTO"))
          ' <<< "$ISSUE_JSON" >/dev/null

          required=(
            "AUTHORIZED_CONTROLLER_SHA=$GITHUB_SHA"
            'AUTHORIZATION_STATE=ACTIVE'
            'AG01_GROUNDED_RUNTIME_ACTIVATION=AUTHORIZED'
            'ARTIFACT_BUILD_AUTHORIZED=true'
            'SERVICE_MUTATION_AUTHORIZED=true'
            'PROVIDER_WRITES_AUTHORIZED=false'
            'DIRECT_PROVIDER_WRITE_AUTHORIZED=false'
            'EXTERNAL_BUSINESS_SIDE_EFFECTS_AUTHORIZED=false'
            'ZERO_TRAFFIC_STAGE_REQUIRED=true'
            'ROLLBACK_ON_FAILURE=true'
          )
          for line in "${required[@]}"; do
            grep -Fxq "$line" <<< "$BODY" || { echo "Missing authorization marker: $line" >&2; exit 1; }
          done
          EXPECTED_PREVIOUS_REVISION="$(grep '^EXPECTED_PREVIOUS_REVISION=' <<< "$BODY" | tail -1 | cut -d= -f2-)"
          [[ "$EXPECTED_PREVIOUS_REVISION" =~ ^toca-ag01-orchestrator-[a-z0-9-]+$ ]]

          CONTROL_BODY="$(gh api "repos/${GITHUB_REPOSITORY}/issues/640" --jq '.body // ""')"
          for line in \
            'PRO_PLUS_CONTROL_PLANE_SCHEMA_VERSION=2' \
            'CONTROL_PLANE_ROLE=INTEGRATION_QUEUE_AND_MAIN_STABILITY' \
            'MAIN_STABILITY=PASS' \
            "EVALUATED_MAIN_SHA=$GITHUB_SHA" \
            'MERGE_RESERVATION=NONE' \
            'GENERAL_AUTONOMY=false'; do
            grep -Fxq "$line" <<< "$CONTROL_BODY" || { echo "Control-plane marker missing: $line" >&2; exit 1; }
          done

          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('infra/control-plane/policy.json','utf8'));
          const a=p.activeRuntime?.ag01Orchestrator;
          if(!a || a.lifecycleStatus!=='PRODUCTION_VERIFIED' || a.currentOperationalStatus!=='HEALTHY' || a.executionAuthorized!==true || a.directProviderWriteAuthorized!==false || a.executionAuthority!=='CORE_POLICY_APPROVAL_ONLY') process.exit(1);
          NODE

          echo "authorization_issue=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "expected_previous_revision=$EXPECTED_PREVIOUS_REVISION" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Exact-head Quality Gate
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm quality

      - name: Authenticate governed deployer
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Capture private production prestate
        id: prestate
        env:
          EXPECTED_PREVIOUS_REVISION: ${{ steps.authz.outputs.expected_previous_revision }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ag01-grounded-evidence
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > ag01-grounded-evidence/service-before.json
          gcloud run services get-iam-policy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > ag01-grounded-evidence/iam-before.json
          PRE_REVISION="$(jq -r '[.status.traffic[]? | select((.percent // 0)==100 and (.revisionName // "")!="") | .revisionName] | if length==1 then .[0] else empty end' ag01-grounded-evidence/service-before.json)"
          test "$PRE_REVISION" = "$EXPECTED_PREVIOUS_REVISION"
          BASE_URL="$(jq -r '.status.url // empty' ag01-grounded-evidence/service-before.json)"
          test -n "$BASE_URL"
          if jq -e '.bindings[]? | select(.role=="roles/run.invoker") | (.members // [])[]? | select(.=="allUsers")' ag01-grounded-evidence/iam-before.json >/dev/null; then
            echo 'AG-01 must remain private' >&2; exit 1
          fi
          PRE_REVISION_JSON="$(gcloud run revisions describe "$PRE_REVISION" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          jq -e --arg sa "$RUNTIME_SERVICE_ACCOUNT" '.spec.serviceAccountName == $sa and ([.status.conditions[]? | select(.type=="Ready") | .status] | last)=="True"' <<< "$PRE_REVISION_JSON" >/dev/null
          echo "pre_revision=$PRE_REVISION" >> "$GITHUB_OUTPUT"
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Configure Artifact Registry authentication
        shell: bash
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push immutable AG-01 image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/ag01:grounded-${GITHUB_SHA}"
          docker build --pull --file Dockerfile.orchestrator --tag "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE_TAG" --project "$PROJECT_ID" --format='value(image_summary.digest)')"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          IMMUTABLE_IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/ag01@$DIGEST"
          test "$(gcloud artifacts docker images describe "$IMMUTABLE_IMAGE" --project "$PROJECT_ID" --format='value(image_summary.digest)')" = "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image=$IMMUTABLE_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Stage private AG-01 candidate at zero traffic
        id: stage
        env:
          IMMUTABLE_IMAGE: ${{ steps.image.outputs.image }}
          BASE_URL: ${{ steps.prestate.outputs.base_url }}
        shell: bash
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA::8}"
          REV_SUFFIX="gnd-${SHORT}-${GITHUB_RUN_ATTEMPT}"
          TAG="grounded-${SHORT}-${GITHUB_RUN_ATTEMPT}"
          CANDIDATE_REVISION="${SERVICE}-${REV_SUFFIX}"
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "$IMMUTABLE_IMAGE" \
            --revision-suffix "$REV_SUFFIX" \
            --update-env-vars "TOCA_RELEASE_SHA=$GITHUB_SHA" \
            --tag "$TAG" --no-traffic --no-allow-unauthenticated --quiet
          SERVICE_JSON="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          CANDIDATE_URL="$(jq -r --arg tag "$TAG" '.status.traffic[]? | select(.tag==$tag) | .url // empty' <<< "$SERVICE_JSON")"
          test -n "$CANDIDATE_URL"
          CANDIDATE_JSON="$(gcloud run revisions describe "$CANDIDATE_REVISION" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          jq -e --arg sa "$RUNTIME_SERVICE_ACCOUNT" --arg sha "$GITHUB_SHA" --arg digest "${{ steps.image.outputs.digest }}" '
            .spec.serviceAccountName == $sa and
            ([.status.conditions[]? | select(.type=="Ready") | .status] | last)=="True" and
            (.spec.containers[0].image | contains($digest)) and
            ([.spec.containers[0].env[]? | select(.name=="TOCA_RELEASE_SHA") | .value] | last)==$sha and
            ([.spec.containers[0].env[]? | select(.name=="AG01_MODEL_PROVIDER") | .value] | last)=="vertex" and
            ([.spec.containers[0].env[]? | select(.name=="AG01_GOOGLE_AUTH_MODE") | .value] | last)=="gcp_metadata"
          ' <<< "$CANDIDATE_JSON" >/dev/null
          PRE_REVISION="${{ steps.prestate.outputs.pre_revision }}"
          jq -e --arg candidate "$CANDIDATE_REVISION" --arg previous "$PRE_REVISION" '
            ([.status.traffic[]? | select(.revisionName==$candidate) | (.percent // 0)] | add // 0)==0 and
            ([.status.traffic[]? | select(.revisionName==$previous) | (.percent // 0)] | add // 0)==100
          ' <<< "$SERVICE_JSON" >/dev/null
          echo "candidate_revision=$CANDIDATE_REVISION" >> "$GITHUB_OUTPUT"
          echo "candidate_url=$CANDIDATE_URL" >> "$GITHUB_OUTPUT"

      - name: Mint private candidate probe token
        id: candidate_token
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.prestate.outputs.base_url }}
          create_credentials_file: false
          export_environment_variables: false

      - name: Prove health readiness and grounded Drive answer without side effect
        env:
          ID_TOKEN: ${{ steps.candidate_token.outputs.id_token }}
          CANDIDATE_URL: ${{ steps.stage.outputs.candidate_url }}
        shell: bash
        run: |
          set -euo pipefail
          probe_get() {
            local path="$1" output="$2"
            for attempt in $(seq 1 12); do
              code="$(curl --silent --show-error -o "$output" -w '%{http_code}' -H "Authorization: Bearer $ID_TOKEN" "$CANDIDATE_URL$path" || true)"
              if [[ "$code" == '200' ]]; then return 0; fi
              sleep 5
            done
            return 1
          }
          probe_get /health ag01-grounded-evidence/health.json
          probe_get /ready ag01-grounded-evidence/ready.json
          jq -e '.status=="ok"' ag01-grounded-evidence/health.json >/dev/null
          jq -e '.status=="ready"' ag01-grounded-evidence/ready.json >/dev/null
          jq -n --arg key "grounded-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '{idempotencyKey:$key,message:"Que horas começa o Sunset?",expectedIntent:"EVENT_INFO",correlationId:$key}' > /tmp/grounded-request.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ID_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/grounded-request.json "$CANDIDATE_URL/v1/knowledge/answer" > ag01-grounded-evidence/grounded-answer.json
          jq -e '.status=="GROUNDED" and (.answer|type=="string" and length>0) and (.confidence>=0.85) and (.citedResourceIds|type=="array" and length>0) and (.evidence|type=="array" and length>0)' ag01-grounded-evidence/grounded-answer.json >/dev/null

      - name: Promote exact AG-01 candidate and verify private base readback
        id: promote
        env:
          CANDIDATE_REVISION: ${{ steps.stage.outputs.candidate_revision }}
          PRE_REVISION: ${{ steps.prestate.outputs.pre_revision }}
        shell: bash
        run: |
          set -euo pipefail
          rollback(){ gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --to-revisions "$PRE_REVISION=100" --quiet || true; }
          trap rollback ERR
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --to-revisions "$CANDIDATE_REVISION=100" --quiet
          SERVICE_JSON="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          jq -e --arg candidate "$CANDIDATE_REVISION" '.status.traffic[]? | select(.revisionName==$candidate and .percent==100)' <<< "$SERVICE_JSON" >/dev/null
          gcloud run services get-iam-policy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > ag01-grounded-evidence/iam-final.json
          if jq -e '.bindings[]? | select(.role=="roles/run.invoker") | (.members // [])[]? | select(.=="allUsers")' ag01-grounded-evidence/iam-final.json >/dev/null; then exit 1; fi
          trap - ERR
          echo 'promoted=true' >> "$GITHUB_OUTPUT"

      - name: Mint production base probe token
        id: base_token
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.prestate.outputs.base_url }}
          create_credentials_file: false
          export_environment_variables: false

      - name: Verify production base grounded readback
        env:
          ID_TOKEN: ${{ steps.base_token.outputs.id_token }}
          BASE_URL: ${{ steps.prestate.outputs.base_url }}
          CANDIDATE_REVISION: ${{ steps.stage.outputs.candidate_revision }}
          PRE_REVISION: ${{ steps.prestate.outputs.pre_revision }}
        shell: bash
        run: |
          set -euo pipefail
          rollback(){ gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --to-revisions "$PRE_REVISION=100" --quiet || true; }
          trap rollback ERR
          for path in health ready; do
            code="$(curl --silent --show-error -o "ag01-grounded-evidence/base-${path}.json" -w '%{http_code}' -H "Authorization: Bearer $ID_TOKEN" "$BASE_URL/$path" || true)"
            test "$code" = '200'
          done
          jq -n --arg key "grounded-base-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '{idempotencyKey:$key,message:"Que horas começa o Sunset?",expectedIntent:"EVENT_INFO",correlationId:$key}' > /tmp/base-grounded-request.json
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $ID_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/base-grounded-request.json "$BASE_URL/v1/knowledge/answer" > ag01-grounded-evidence/base-grounded-answer.json
          jq -e '.status=="GROUNDED" and (.confidence>=0.85) and (.citedResourceIds|length>0)' ag01-grounded-evidence/base-grounded-answer.json >/dev/null
          SERVICE_JSON="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          jq -e --arg candidate "$CANDIDATE_REVISION" '.status.traffic[]? | select(.revisionName==$candidate and .percent==100)' <<< "$SERVICE_JSON" >/dev/null
          trap - ERR

      - name: Publish sanitized activation evidence
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.authz.outputs.authorization_issue }}
          CANDIDATE_REVISION: ${{ steps.stage.outputs.candidate_revision }}
          DIGEST: ${{ steps.image.outputs.digest }}
          BASE_URL: ${{ steps.prestate.outputs.base_url }}
        shell: bash
        run: |
          set -euo pipefail
          printf -v COMMENT '%s\n' \
            'AG01_GROUNDED_RUNTIME_ACTIVATION_STATUS=PASS' \
            "RUNTIME_SOURCE_SHA=$GITHUB_SHA" \
            "RUNTIME_IMAGE_DIGEST=$DIGEST" \
            "PROMOTED_REVISION=$CANDIDATE_REVISION" \
            "SERVICE_URL=$BASE_URL" \
            'TRAFFIC_PERCENT=100' \
            'GROUNDING_PROBE=PASS' \
            'DRIVE_SCOPE=READ_ONLY' \
            'DIRECT_PROVIDER_WRITE=false' \
            'EXTERNAL_BUSINESS_SIDE_EFFECT=false'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="$COMMENT" >/dev/null
          printf '%s\n' "$COMMENT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ag01-grounded-runtime-activation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ag01-grounded-evidence
          if-no-files-found: warn
          retention-days: 90

      - name: Consume single-use authorization
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.authz.outputs.authorization_issue }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ISSUE_NUMBER:-}" ]]; then exit 0; fi
          BODY="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" --jq '.body // ""')"
          UPDATED="$(printf '%s' "$BODY" | sed 's/^AUTHORIZATION_STATE=ACTIVE$/AUTHORIZATION_STATE=CONSUMED/')"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" -f body="$UPDATED" -f state=closed >/dev/null
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="AUTHORIZATION_CONSUMED=true\nWORKFLOW_STATUS=$JOB_STATUS\nREUSE_PROHIBITED=true" >/dev/null
