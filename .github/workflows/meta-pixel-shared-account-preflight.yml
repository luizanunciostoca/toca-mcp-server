name: Meta Pixel Shared Account Preflight
on:
  push:
    branches: [main]
    paths: [control/meta-pixel-shared-account.preflight]
permissions:
  contents: read
  id-token: write
env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  META_TOKEN_SECRET_ID: toca-meta-oauth-token
  META_GRAPH_BASE_URL: https://graph.facebook.com
  META_GRAPH_API_VERSION: v24.0
  META_AD_ACCOUNT_ID: '311793958882290'
  META_PIXEL_ID: '461233076843065'
  META_BUSINESS_ID: '232421267344387'
  EXPECTED_MARKER: PREFLIGHT_PIXEL_461233076843065_TO_ACCOUNT_311793958882290
  IMAGE: southamerica-east1-docker.pkg.dev/toca-mcp-production/toca-mcp/server:meta-ads-smoke-4f26826402e7455a6281b30efd1b1a75b07844da
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Validate exact trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < control/meta-pixel-shared-account.preflight)" = "$EXPECTED_MARKER"
          test "$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")" = "control/meta-pixel-shared-account.preflight"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify shared-account preconditions read-only
        shell: bash
        run: |
          set -euo pipefail
          JOB="pixel-share-preflight-${GITHUB_RUN_ID}"
          trap 'gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true' EXIT
          CODE='const t=process.env.META_TOKEN,b=process.env.BASE,v=process.env.VER,a=process.env.ACCOUNT,p=process.env.PIXEL,x=process.env.BUSINESS; async function g(path,q={}){const u=new URL(`${b}/${v}/${path}`);for(const[k,z]of Object.entries(q))u.searchParams.set(k,String(z));const r=await fetch(u,{headers:{Authorization:`Bearer ${t}`}});const j=await r.json();if(!r.ok)throw new Error(`GET_${path}_${r.status}_${JSON.stringify(j)}`);return j} const op=await g(`${x}/owned_pixels`,{fields:"id,name",limit:100});const ca=await g(`${x}/client_ad_accounts`,{fields:"id,account_id,name,currency,account_status",limit:100});const sa=await g(`${p}/shared_accounts`,{business:x,fields:"id,account_id,name,currency,account_status",limit:100});const owns=(op.data||[]).some(z=>String(z.id)===p);const client=(ca.data||[]).some(z=>String(z.account_id||z.id).replace(/^act_/,"")===a);const shared=(sa.data||[]).some(z=>String(z.account_id||z.id).replace(/^act_/,"")===a);if(!owns||!client)throw new Error("PRECONDITION_FAILED");console.log(`PIXEL_SHARE_PREFLIGHT=${JSON.stringify({business:x,pixel:p,account:a,owns,client,shared,sharedAccounts:sa.data||[]})}`);'
          gcloud run jobs deploy "$JOB" --image "$IMAGE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" --command node --args "^~^-e~$CODE" --set-secrets "META_TOKEN=$META_TOKEN_SECRET_ID:latest" --set-env-vars "^~^BASE=$META_GRAPH_BASE_URL~VER=$META_GRAPH_API_VERSION~ACCOUNT=$META_AD_ACCOUNT_ID~PIXEL=$META_PIXEL_ID~BUSINESS=$META_BUSINESS_ID" --tasks 1 --max-retries 0 --task-timeout 120s --quiet
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet
          LINE=""
          for attempt in $(seq 1 12); do
            LINE="$(gcloud logging read "resource.type=cloud_run_job AND resource.labels.job_name=${JOB} AND textPayload:\"PIXEL_SHARE_PREFLIGHT=\"" --project "$GCP_PROJECT_ID" --freshness=10m --limit=10 --order=desc --format='value(textPayload)' | grep PIXEL_SHARE_PREFLIGHT= | head -n1 || true)"
            [ -n "$LINE" ] && break
            sleep 5
          done
          test -n "$LINE"
          JSON="${LINE#PIXEL_SHARE_PREFLIGHT=}"
          printf '%s\n' "$JSON" | jq . > pixel-share-preflight.json
          cat pixel-share-preflight.json
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-share-preflight-${{ github.sha }}
          path: pixel-share-preflight.json
          retention-days: 30
