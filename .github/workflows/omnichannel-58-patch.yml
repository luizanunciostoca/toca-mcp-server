name: Temporary Omnichannel 58 Patch

on:
  push:
    branches:
      - feat/omnichannel-outbound-composition-58

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Apply exact convergence patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'PATCH_ANCHOR_NOT_FOUND:{path}:{old[:80]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'PATCH_ANCHOR_NOT_UNIQUE:{path}:{text.count(old)}')
              p.write_text(text.replace(old, new))

          replace(
              'src/registry.ts',
              "import { CRM_SALES_RUNTIME_TOOL_DEFINITIONS } from './crm/runtime.js';\n",
              "import { CRM_SALES_RUNTIME_TOOL_DEFINITIONS } from './crm/runtime.js';\nimport { OMNICHANNEL_READBACK_RUNTIME_TOOL_DEFINITIONS } from './omnichannel/runtime-tool-definitions.js';\n",
          )
          replace(
              'src/registry.ts',
              "  readonly crmSalesRuntimeEnabled?: boolean;\n}",
              "  readonly crmSalesRuntimeEnabled?: boolean;\n  readonly omnichannelReadbacksEnabled?: boolean;\n}",
          )
          replace(
              'src/registry.ts',
              "  if (options.crmSalesRuntimeEnabled)\n    for (const tool of CRM_SALES_RUNTIME_TOOL_DEFINITIONS) registry.register(tool);\n  return registry;",
              "  if (options.crmSalesRuntimeEnabled)\n    for (const tool of CRM_SALES_RUNTIME_TOOL_DEFINITIONS) registry.register(tool);\n  if (options.omnichannelReadbacksEnabled)\n    for (const tool of OMNICHANNEL_READBACK_RUNTIME_TOOL_DEFINITIONS) registry.register(tool);\n  return registry;",
          )

          replace(
              'src/server.ts',
              "import { createRuntimeCapabilityResolver } from './mcp/runtime-capability-resolver.js';\n",
              "import { createRuntimeCapabilityResolver } from './mcp/runtime-capability-resolver.js';\nimport { resolveOmnichannelReadbackRuntimeBinding } from './mcp/omnichannel-readback-runtime.js';\n",
          )
          replace(
              'src/server.ts',
              "import { PostgresApprovalStore } from './persistence/postgres-approval-store.js';\n",
              "import { PostgresOmnichannelProviderEventReadback } from './omnichannel/provider-event-readback.js';\nimport { PostgresApprovalStore } from './persistence/postgres-approval-store.js';\n",
          )
          replace(
              'src/server.ts',
              "    crmSalesRuntimeEnabled: Boolean(pool),\n  });",
              "    crmSalesRuntimeEnabled: Boolean(pool),\n    omnichannelReadbacksEnabled: Boolean(pool),\n  });",
          )
          replace(
              'src/server.ts',
              "  const crmSalesReadback = pool ? new PostgresCrmSalesPersistenceReadback(pool) : undefined;\n  const googleAdsTargetAccount =",
              "  const crmSalesReadback = pool ? new PostgresCrmSalesPersistenceReadback(pool) : undefined;\n  const omnichannelReadback = pool\n    ? new PostgresOmnichannelProviderEventReadback(pool)\n    : undefined;\n  const googleAdsTargetAccount =",
          )
          replace(
              'src/server.ts',
              "    }) ?? standardRuntimeResolver(capabilityId);",
              "    }) ??\n    resolveOmnichannelReadbackRuntimeBinding(capabilityId, omnichannelReadback) ??\n    standardRuntimeResolver(capabilityId);",
          )

          replace(
              'src/governance/capability-ids.ts',
              "    'campaign.postmortem',\n  ],\n  R08:",
              "    'campaign.postmortem',\n    'email.campaign.send',\n    'email.delivery.readback',\n  ],\n  R08:",
          )
          replace(
              'src/governance/capability-ids.ts',
              "    'sales.report.generate',\n  ],\n  R11:",
              "    'sales.report.generate',\n    'whatsapp.message.send',\n    'whatsapp.message.readback',\n  ],\n  R11:",
          )

          replace(
              'src/governance/capability-catalog.ts',
              "import {\n  CAPABILITY_CONTRACT_OVERRIDES,\n  permissionRequirementsForCapability,\n} from './capability-contract-overrides.js';\n",
              "import {\n  CAPABILITY_CONTRACT_OVERRIDES,\n  permissionRequirementsForCapability,\n} from './capability-contract-overrides.js';\nimport { OMNICHANNEL_CAPABILITY_CONTRACT_OVERRIDES } from './omnichannel-capability-contracts.js';\n",
          )
          replace(
              'src/governance/capability-catalog.ts',
              "    crmSalesRuntimeEnabled: true,\n  })",
              "    crmSalesRuntimeEnabled: true,\n    omnichannelReadbacksEnabled: true,\n  })",
          )
          replace(
              'src/governance/capability-catalog.ts',
              "  if (/^(meta_ads|google_ads)\\./.test(capabilityId)) return isMutationAction(capabilityId);",
              "  if (/^(meta_ads|google_ads|email|whatsapp)\\./.test(capabilityId))\n    return isMutationAction(capabilityId);",
          )
          replace(
              'src/governance/capability-catalog.ts',
              "  if (/^google_business\\./.test(capabilityId)) return 'Google Business Profile';\n",
              "  if (/^google_business\\./.test(capabilityId)) return 'Google Business Profile';\n  if (/^email\\./.test(capabilityId)) return 'Twilio SendGrid';\n  if (/^whatsapp\\./.test(capabilityId)) return 'Meta WhatsApp Cloud API';\n",
          )
          replace(
              'src/governance/capability-catalog.ts',
              "  if (/^(backup|restore|dr)\\./.test(capabilityId)) return ['DATABASE_URL', 'GCP_PROJECT_ID'];\n  return [];",
              "  if (capabilityId === 'email.campaign.send')\n    return ['DATABASE_URL', 'EMAIL_SENDGRID_ENABLED', 'EMAIL_SENDGRID_BINDING_STATE'];\n  if (capabilityId === 'email.delivery.readback') return ['DATABASE_URL'];\n  if (capabilityId === 'whatsapp.message.send')\n    return ['DATABASE_URL', 'WHATSAPP_RUNTIME_ENABLED', 'WHATSAPP_BINDING_STATE'];\n  if (capabilityId === 'whatsapp.message.readback') return ['DATABASE_URL'];\n  if (/^(backup|restore|dr)\\./.test(capabilityId)) return ['DATABASE_URL', 'GCP_PROJECT_ID'];\n  return [];",
          )
          replace(
              'src/governance/capability-catalog.ts',
              "    VIDEO_CONTENT_CAPABILITY_CONTRACT_OVERRIDES[capabilityId]?.contract_quality ??\n    CAPABILITY_CONTRACT_OVERRIDES[capabilityId]?.contract_quality;",
              "    VIDEO_CONTENT_CAPABILITY_CONTRACT_OVERRIDES[capabilityId]?.contract_quality ??\n    OMNICHANNEL_CAPABILITY_CONTRACT_OVERRIDES[capabilityId]?.contract_quality ??\n    CAPABILITY_CONTRACT_OVERRIDES[capabilityId]?.contract_quality;",
          )
          replace(
              'src/governance/capability-catalog.ts',
