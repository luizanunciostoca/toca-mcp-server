              "/^(instagram|meta_ads|google_ads|social|engagement|google_business|drive|release|security)\\./.test(\n      capabilityId,\n    );",
              "/^(instagram|meta_ads|google_ads|social|engagement|google_business|email|whatsapp|drive|release|security)\\./.test(\n      capabilityId,\n    );",
          )

          replace(
              'src/omnichannel/capability-specs.ts',
              "export interface OmnichannelCapabilitySpec {\n  readonly capabilityId: OmnichannelCapabilityId;\n  readonly primaryRouteId: RouteId;\n  readonly lifecycleStatus: Extract<CapabilityStatus, 'SPECIFIED'>;\n  readonly runtimeExposed: false;\n  readonly productionExecutionAllowed: false;\n  readonly blockedBy: readonly OmnichannelDependencyBlocker[];\n}\n\nfunction primaryRouteId(capabilityId: OmnichannelCapabilityId): RouteId {\n  return capabilityId.startsWith('nurture.') ? 'R10' : 'R30';\n}\n\nexport const OMNICHANNEL_CAPABILITY_SPECS: readonly OmnichannelCapabilitySpec[] =\n  OMNICHANNEL_CAPABILITY_IDS.map((capabilityId) => ({\n    capabilityId,\n    primaryRouteId: primaryRouteId(capabilityId),\n    lifecycleStatus: 'SPECIFIED',\n    runtimeExposed: false,\n    productionExecutionAllowed: false,\n    blockedBy: OMNICHANNEL_DEPENDENCY_BLOCKERS,\n  }));",
              "export interface OmnichannelCapabilitySpec {\n  readonly capabilityId: OmnichannelCapabilityId;\n  readonly primaryRouteId: RouteId;\n  readonly lifecycleStatus: Extract<CapabilityStatus, 'SPECIFIED' | 'PLANNED' | 'IMPLEMENTED'>;\n  readonly runtimeExposed: boolean;\n  readonly productionExecutionAllowed: boolean;\n  readonly blockedBy: readonly OmnichannelDependencyBlocker[];\n}\n\nconst runtimeReadbackIds = new Set<OmnichannelCapabilityId>([\n  'email.delivery.readback',\n  'whatsapp.message.readback',\n]);\nconst canonicalPlannedIds = new Set<OmnichannelCapabilityId>([\n  'email.campaign.send',\n  'whatsapp.message.send',\n]);\n\nfunction primaryRouteId(capabilityId: OmnichannelCapabilityId): RouteId {\n  if (capabilityId.startsWith('email.')) return 'R07';\n  return 'R10';\n}\n\nexport const OMNICHANNEL_CAPABILITY_SPECS: readonly OmnichannelCapabilitySpec[] =\n  OMNICHANNEL_CAPABILITY_IDS.map((capabilityId) => {\n    const runtimeExposed = runtimeReadbackIds.has(capabilityId);\n    return {\n      capabilityId,\n      primaryRouteId: primaryRouteId(capabilityId),\n      lifecycleStatus: runtimeExposed\n        ? 'IMPLEMENTED'\n        : canonicalPlannedIds.has(capabilityId)\n          ? 'PLANNED'\n          : 'SPECIFIED',\n      runtimeExposed,\n      productionExecutionAllowed: runtimeExposed,\n      blockedBy: OMNICHANNEL_DEPENDENCY_BLOCKERS,\n    };\n  });",
          )
          replace(
              'src/omnichannel/capability-specs.ts',
              "    if (spec.lifecycleStatus !== 'SPECIFIED') {\n      throw new Error(`OMNICHANNEL_LIFECYCLE_MUST_REMAIN_SPECIFIED:${spec.capabilityId}`);\n    }\n    if (spec.runtimeExposed || spec.productionExecutionAllowed) {\n      throw new Error(`OMNICHANNEL_RUNTIME_EXPOSURE_FORBIDDEN:${spec.capabilityId}`);\n    }",
              "    const readback = runtimeReadbackIds.has(spec.capabilityId);\n    const plannedSend = canonicalPlannedIds.has(spec.capabilityId);\n    const expectedLifecycle = readback ? 'IMPLEMENTED' : plannedSend ? 'PLANNED' : 'SPECIFIED';\n    if (spec.lifecycleStatus !== expectedLifecycle) {\n      throw new Error(`OMNICHANNEL_LIFECYCLE_DRIFT:${spec.capabilityId}`);\n    }\n    if (spec.runtimeExposed !== readback || spec.productionExecutionAllowed !== readback) {\n      throw new Error(`OMNICHANNEL_RUNTIME_EXPOSURE_DRIFT:${spec.capabilityId}`);\n    }",
          )

          replace(
              'src/governance/omnichannel-capability-contracts.ts',
              "const nonNegativeInteger: JsonSchemaNode = { type: 'integer', minimum: 0 };\n\n",
              "",
          )
          replace(
              'src/governance/omnichannel-capability-contracts.ts',
              "    ...approvalProperties,\n    prepared_message_id: text,\n    idempotency_key: text,",
              "    ...approvalProperties,\n    message_id: text,\n    prepared_message_id: text,\n    idempotency_key: text,",
          )
          replace(
              'src/governance/omnichannel-capability-contracts.ts',
              "    'approval_status',\n    'prepared_message_id',",
              "    'approval_status',\n    'message_id',\n    'prepared_message_id',",
          )
          replace(
              'src/governance/omnichannel-capability-contracts.ts',
              "    ...approvalProperties,\n    prepared_campaign_id: text,\n    idempotency_key: text,",
              "    ...approvalProperties,\n    message_id: text,\n    prepared_campaign_id: text,\n    idempotency_key: text,",
          )
          replace(
              'src/governance/omnichannel-capability-contracts.ts',
              "    'approval_status',\n    'prepared_campaign_id',",
              "    'approval_status',\n    'message_id',\n    'prepared_campaign_id',",
          )
          replace(
              'src/governance/omnichannel-capability-contracts.ts',
              "  {\n    provider_dispatch_id: text,\n    delivered_count: nonNegativeInteger,\n    failed_count: nonNegativeInteger,\n    suppressed_count: nonNegativeInteger,\n    observed_at: isoTimestamp,\n    evidence: { type: 'array', items: text, minItems: 1 },\n  },\n  [\n    'provider_dispatch_id',\n    'delivered_count',\n    'failed_count',\n    'suppressed_count',\n    'observed_at',\n    'evidence',\n  ],",
              "  {\n    provider_dispatch_id: text,\n    state: {\n      type: 'string',\n      enum: ['QUEUED', 'SENT', 'DELIVERED', 'FAILED', 'REJECTED', 'UNKNOWN'],\n    },\n    observed_at: isoTimestamp,\n    evidence: { type: 'array', items: text, minItems: 1 },\n  },\n  ['provider_dispatch_id', 'state', 'observed_at', 'evidence'],",
          )
          replace(
              'src/governance/omnichannel-capability-contracts.ts',
              "    idempotent: false,\n    provider: 'WhatsApp provider adapter (unbound)',\n    operation: 'message.send',",
              "    idempotent: true,\n    provider: 'Meta WhatsApp Cloud API',\n    operation: 'message.send',",
          )
          replace(
              'src/governance/omnichannel-capability-contracts.ts',
              "    provider: 'WhatsApp provider adapter (unbound)',\n    operation: 'message.readback',",
              "    provider: 'Meta WhatsApp Cloud API',\n    operation: 'provider_event.readback',\n    authentication_mode: 'INTERNAL',",
          )
          replace(
              'src/governance/omnichannel-capability-contracts.ts',
              "    idempotent: false,\n    provider: 'Email provider adapter (unbound)',\n    operation: 'campaign.send',",
              "    idempotent: true,\n    provider: 'Twilio SendGrid',\n    operation: 'campaign.send',",
          )
          replace(
              'src/governance/omnichannel-capability-contracts.ts',
              "    provider: 'Email provider adapter (unbound)',\n    operation: 'delivery.readback',",
              "    provider: 'Twilio SendGrid',\n    operation: 'provider_event.readback',\n    authentication_mode: 'INTERNAL',",
          )

          replace(
              'test/omnichannel-capability-specs.test.ts',
              "  it('specifies exactly the requested capabilities without mutating the canonical catalog', () => {\n    expect(() => validateOmnichannelCapabilitySpecs()).not.toThrow();\n    expect(OMNICHANNEL_CAPABILITY_IDS).toHaveLength(18);\n\n    const catalogIds = new Set(CAPABILITY_CATALOG.map((definition) => definition.capability_id));\n    for (const capabilityId of OMNICHANNEL_CAPABILITY_IDS) {\n      expect(catalogIds.has(capabilityId)).toBe(false);\n    }\n  });",
              "  it('keeps only the four reconciled channel capabilities in the canonical catalog', () => {\n    expect(() => validateOmnichannelCapabilitySpecs()).not.toThrow();\n    expect(OMNICHANNEL_CAPABILITY_IDS).toHaveLength(18);\n\n    const catalogIds = new Set(CAPABILITY_CATALOG.map((definition) => definition.capability_id));\n    for (const capabilityId of OMNICHANNEL_CAPABILITY_IDS) {\n      expect(catalogIds.has(capabilityId)).toBe(\n        ['email.campaign.send', 'email.delivery.readback', 'whatsapp.message.send', 'whatsapp.message.readback'].includes(\n          capabilityId,\n        ),\n      );\n    }\n  });",
          )
          replace(
              'test/omnichannel-capability-specs.test.ts',
              "  it('clears the resolved Privacy dependency but keeps runtime and production execution disabled', () => {\n    expect(OMNICHANNEL_DEPENDENCY_BLOCKERS).toEqual([]);\n    for (const spec of OMNICHANNEL_CAPABILITY_SPECS) {\n      expect(spec.lifecycleStatus).toBe('SPECIFIED');\n      expect(spec.runtimeExposed).toBe(false);\n      expect(spec.productionExecutionAllowed).toBe(false);\n      expect(spec.blockedBy).toEqual([]);\n    }\n  });",
              "  it('exposes only the two provider-event readbacks while sends remain catalog-only', () => {\n    expect(OMNICHANNEL_DEPENDENCY_BLOCKERS).toEqual([]);\n    for (const spec of OMNICHANNEL_CAPABILITY_SPECS) {\n      const readback = spec.capabilityId.endsWith('.readback');\n      const plannedSend = spec.capabilityId === 'email.campaign.send' || spec.capabilityId === 'whatsapp.message.send';\n      expect(spec.lifecycleStatus).toBe(readback ? 'IMPLEMENTED' : plannedSend ? 'PLANNED' : 'SPECIFIED');\n      expect(spec.runtimeExposed).toBe(readback);\n      expect(spec.productionExecutionAllowed).toBe(readback);\n      expect(spec.blockedBy).toEqual([]);\n    }\n  });",
          )
          replace(
              'test/omnichannel-capability-specs.test.ts',
              "  it('maps channel engagement to R30 and nurture to R10 without creating R33', () => {\n    for (const spec of OMNICHANNEL_CAPABILITY_SPECS) {\n      expect(spec.primaryRouteId).toBe(spec.capabilityId.startsWith('nurture.') ? 'R10' : 'R30');\n      expect(spec.primaryRouteId).not.toBe('R32');\n    }\n  });",
              "  it('maps Email to R07 and WhatsApp/nurture to R10 without creating R33', () => {\n    for (const spec of OMNICHANNEL_CAPABILITY_SPECS) {\n      expect(spec.primaryRouteId).toBe(spec.capabilityId.startsWith('email.') ? 'R07' : 'R10');\n      expect(spec.primaryRouteId).not.toBe('R32');\n    }\n  });",
          )
          replace(
              'test/omnichannel-capability-specs.test.ts',
              "  it('does not expose the specifications through the MCP runtime', () => {\n    const runtimeIds = new Set(\n      createToolRegistry({\n        instagramReadsEnabled: true,\n        metaAdsReadsEnabled: true,\n        metaAdsWritesEnabled: true,\n        tocaManagedInstagramSchedulerEnabled: true,\n      })\n        .list()\n        .map((definition) => definition.name),\n    );\n\n    for (const capabilityId of OMNICHANNEL_CAPABILITY_IDS) {\n      expect(runtimeIds.has(capabilityId)).toBe(false);\n    }\n  });",
              "  it('registers only the two readbacks when the omnichannel readback runtime is bound', () => {\n    const runtimeIds = new Set(\n      createToolRegistry({\n        instagramReadsEnabled: true,\n        metaAdsReadsEnabled: true,\n        metaAdsWritesEnabled: true,\n        tocaManagedInstagramSchedulerEnabled: true,\n        omnichannelReadbacksEnabled: true,\n      })\n        .list()\n        .map((definition) => definition.name),\n    );\n\n    for (const capabilityId of OMNICHANNEL_CAPABILITY_IDS) {\n      expect(runtimeIds.has(capabilityId)).toBe(capabilityId.endsWith('.readback'));\n    }\n  });",
          )
          replace(
              'test/omnichannel-capability-specs.test.ts',
              "  it('makes external sends explicit, approval-gated and provider-unbound', () => {",
              "  it('makes external sends explicit, approval-gated and idempotent while keeping runtime disabled', () => {",
          )
          replace(
              'test/omnichannel-capability-specs.test.ts',
              "        idempotent: false,\n        authentication_mode: 'UNKNOWN',",
              "        idempotent: true,\n        authentication_mode: 'UNKNOWN',",
          )
          replace(
              'test/omnichannel-capability-specs.test.ts',
              "      expect(OMNICHANNEL_CAPABILITY_CONTRACT_OVERRIDES[capabilityId].provider).toContain('unbound');",
              "      expect(OMNICHANNEL_CAPABILITY_CONTRACT_OVERRIDES[capabilityId].provider).not.toContain('unbound');",
          )
          PY

          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            src/registry.ts \
            src/server.ts \
            src/governance/capability-ids.ts \
            src/governance/capability-catalog.ts \
            src/governance/omnichannel-capability-contracts.ts \
            src/omnichannel/capability-specs.ts \
            src/omnichannel/provider-event-readback.ts \
            src/omnichannel/runtime-tool-definitions.ts \
            src/mcp/omnichannel-readback-runtime.ts \
            test/omnichannel-capability-specs.test.ts \
            test/omnichannel-provider-event-readback.test.ts

          git rm .github/workflows/omnichannel-58-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
