name: M-FOUND-11 Lint Fix One-Shot

on:
  push:
    branches:
      - feat/m-found-11-toca-core-mcp-surface
    paths:
      - '.github/workflows/m-found-11-lint-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/m-found-11-toca-core-mcp-surface
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Normalize typed test mocks
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'tests/m-found-11-core-surface.test.ts';
          let source = fs.readFileSync(path, 'utf8');
          const before = source;
          const marker = '/* eslint-disable @typescript-eslint/no-unsafe-assignment -- Vitest asymmetric matcher helpers expose any-typed matcher values in assertions. */\n';
          if (!source.startsWith(marker)) source = marker + source;
          source = source
            .replace("execute: options.execute ?? (async () => ({ id: 'job_1' })),", "execute: options.execute ?? (() => Promise.resolve({ id: 'job_1' })),")
            .replaceAll('vi.fn(async (_input: unknown) => (', 'vi.fn(() => Promise.resolve(')
            .replace('vi.fn(async (_input: unknown) => [])', 'vi.fn(() => Promise.resolve([]))')
            .replace('vi.fn(async (_input: unknown) => local)', 'vi.fn(() => Promise.resolve(local))')
            .replace('vi.fn(async (_workflowId: string) => local)', 'vi.fn(() => Promise.resolve(local))')
            .replaceAll('providerReadback: async () => ({', 'providerReadback: () => Promise.resolve({')
            .replaceAll('readback: async () => ({', 'readback: () => Promise.resolve({');
          if (source === before) throw new Error('M_FOUND_11_LINT_FIX_NO_CHANGES');
          fs.writeFileSync(path, source);
          NODE
          pnpm exec prettier --write tests/m-found-11-core-surface.test.ts
          pnpm eslint tests/m-found-11-core-surface.test.ts
      - name: Commit lint-only correction
        shell: bash
        run: |
          set -euo pipefail
          git add tests/m-found-11-core-surface.test.ts
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(m-found-11): satisfy strict lint for mocks'
          git push origin HEAD:feat/m-found-11-toca-core-mcp-surface
