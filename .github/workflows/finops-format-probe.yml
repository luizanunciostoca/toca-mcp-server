name: FinOps Format Probe

on:
  pull_request:
    paths:
      - 'src/finops/**'
      - 'test/finops-cost-control.test.ts'
      - '.github/workflows/finops-format-probe.yml'

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Print canonical Prettier output
        run: |
          echo '=== COST_GATE_BEGIN ==='
          pnpm exec prettier src/finops/cost-gate.ts
          echo '=== COST_GATE_END ==='
          echo '=== TEST_BEGIN ==='
          pnpm exec prettier test/finops-cost-control.test.ts
          echo '=== TEST_END ==='
