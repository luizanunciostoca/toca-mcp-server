name: TOCA C01 GCP Runtime Readback (Read Only)

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Exact owner authorization for a single GCP metadata read
        required: true
        type: choice
        options:
          - NOT_AUTHORIZED
          - TOCA_C01_READ_ONLY_AUTHORIZED
        default: NOT_AUTHORIZED

permissions:
  contents: read
  id-token: write

concurrency:
  group: toca-c01-gcp-runtime-readback
  cancel-in-progress: false

jobs:
  inventory:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.run_attempt == 1 &&
      inputs.authorization == 'TOCA_C01_READ_ONLY_AUTHORIZED'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    env:
      GCP_PROJECT_ID: toca-mcp-production
      GCP_REGION: southamerica-east1
      WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
      READBACK_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
    steps:
      - name: Checkout exact main controller without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact main and local read-only contract
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          python3 -m unittest discover -s tests -p 'test_toca_c01_gcp_inventory.py' -v

      - name: Authenticate existing GCP identity through WIF
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.READBACK_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Capture sanitized Cloud Run services, revisions, and jobs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/toca-c01-gcp-runtime-inventory.py \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --main-sha "$GITHUB_SHA" \
            --output toca-c01-readback.json

      - name: Reject concurrent main drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          echo 'C01_EXACT_MAIN_STILL_CURRENT=true' >> "$GITHUB_STEP_SUMMARY"

      - name: Store sanitized evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: toca-c01-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: toca-c01-readback.json
          if-no-files-found: error
          retention-days: 14
