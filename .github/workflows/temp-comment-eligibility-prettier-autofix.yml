name: TEMP Comment Eligibility Prettier Autofix

on:
  push:
    branches: [fix/comment-eligibility-log-propagation]
    paths:
      - .github/workflows/temp-comment-eligibility-prettier-autofix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/comment-eligibility-log-propagation
          persist-credentials: true
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Format exact regression with repository Prettier
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write test/instagram-engagement-comment-canary-eligibility-readonly.test.ts
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/instagram-engagement-comment-canary-eligibility-readonly.test.ts
          git commit -m 'style(test): apply repository Prettier output'
          git push origin HEAD:fix/comment-eligibility-log-propagation
