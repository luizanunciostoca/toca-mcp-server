name: GitHub Infrastructure Admin Metadata Read-Only

on:
  pull_request:
    paths:
      - '.github/workflows/github-infrastructure-admin-metadata-readonly.yml'

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    name: Read-only hosted environment context keys
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 5
    steps:
      - name: Enumerate secret and variable names only
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'AVAILABLE_SECRET_KEYS_BEGIN'
          printf '%s' "$SECRETS_JSON" | jq -r 'keys[]' | sed 's/^/SECRET_NAME=/'
          echo 'AVAILABLE_SECRET_KEYS_END'
          echo 'AVAILABLE_VARIABLE_KEYS_BEGIN'
          printf '%s' "$VARS_JSON" | jq -r 'keys[]' | sed 's/^/VARIABLE_NAME=/'
          echo 'AVAILABLE_VARIABLE_KEYS_END'
          echo 'NO_SECRET_VALUES_PRINTED=true'
