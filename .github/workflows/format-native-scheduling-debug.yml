name: Format Native Scheduling Debug

on:
  push:
    branches:
      - fix/native-provider-scheduling-only-policy

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print canonical file
        run: pnpm exec prettier test/marketing-autopilot-scheduling.test.ts
