name: TEMP Staging Fresh Cloud Run Service fd37 V9 2026-08-23

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  fresh-service:
    if: github.head_ref == 'ops/diag-staging-ingress-fd37-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fd3799153cf41b6d573dde8889f355247b7eaf74
          persist-credentials: false
          fetch-depth: 1

      - name: Load staging coordinates
        id: config
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'fd3799153cf41b6d573dde8889f355247b7eaf74'
          node scripts/export-staging-deploy-config.mjs infra/environments/staging.json > /tmp/staging.env
          cat /tmp/staging.env >> "$GITHUB_ENV"
          set -a; source /tmp/staging.env; set +a
          test "$GCP_PROJECT_ID" = 'toca-mcp-next-staging'
          test "$GCP_PROJECT_NUMBER" = '729069789107'
          test "$GCP_REGION" = 'southamerica-east1'
          echo "wif=$GCP_WORKLOAD_IDENTITY_PROVIDER" >> "$GITHUB_OUTPUT"
          echo "deployer_sa=$GCP_DEPLOY_SERVICE_ACCOUNT" >> "$GITHUB_OUTPUT"

      - name: Authenticate staging deployer only
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ steps.config.outputs.wif }}
          service_account: ${{ steps.config.outputs.deployer_sa }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Create and probe isolated no-data diagnostic service
        id: diag
        shell: bash
        run: |
          set -euo pipefail
          DIAG_SERVICE='toca-diag-fd379915-v9'
          echo "diag_service=$DIAG_SERVICE" >> "$GITHUB_OUTPUT"
          test "$GCP_PROJECT_ID" = 'toca-mcp-next-staging'
          test "$GCP_REGION" = 'southamerica-east1'
          test "$GCP_MCP_RUNTIME_SERVICE_ACCOUNT" = 'toca-next-stg-mcp@toca-mcp-next-staging.iam.gserviceaccount.com'
          gcloud run services describe "$DIAG_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" >/dev/null 2>&1 && {
            echo "Diagnostic service already exists; refusing to reuse it" >&2
            exit 1
          }

          DEPLOY_RESULT=PASS
          if ! gcloud run deploy "$DIAG_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image 'us-docker.pkg.dev/cloudrun/container/hello' \
            --service-account "$GCP_MCP_RUNTIME_SERVICE_ACCOUNT" \
            --ingress all \
            --no-invoker-iam-check \
            --min-instances 0 \
            --max-instances 1 \
            --memory 256Mi \
            --cpu 1 \
            --quiet > /tmp/diag-deploy.out 2>/tmp/diag-deploy.err; then
            DEPLOY_RESULT=FAIL
          fi
          echo "deploy_result=$DEPLOY_RESULT" >> "$GITHUB_OUTPUT"

          if [[ "$DEPLOY_RESULT" == PASS ]]; then
            ERROR_CLASS=none
            DIAG_URL="$(gcloud run services describe "$DIAG_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
            test -n "$DIAG_URL"
            DIAG_HTTP="$(curl --silent --show-error --retry 8 --retry-all-errors --retry-delay 3 --output /tmp/diag-body --write-out '%{http_code}' "$DIAG_URL/" || true)"
            DIAG_CTYPE="$(curl --silent --show-error -I "$DIAG_URL/" 2>/dev/null | awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/^[^:]+:[[:space:]]*/,""); gsub(/\r/,""); print; exit}' || true)"
            DIAG_REQUEST_LOG_COUNT="$(gcloud logging read "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$DIAG_SERVICE\"" --project "$GCP_PROJECT_ID" --freshness=10m --limit=20 --format=json 2>/dev/null | jq 'length' || echo unknown)"
          else
            DIAG_HTTP=not_run
            DIAG_CTYPE=not_run
            DIAG_REQUEST_LOG_COUNT=not_run
            if grep -qi 'iam.serviceAccounts.actAs' /tmp/diag-deploy.err; then ERROR_CLASS=SERVICE_ACCOUNT_ACTAS_DENIED
            elif grep -qi 'organization policy\|org policy\|constraint' /tmp/diag-deploy.err; then ERROR_CLASS=ORG_POLICY
            elif grep -qi 'Permission.*denied\|PERMISSION_DENIED\|does not have permission' /tmp/diag-deploy.err; then ERROR_CLASS=PERMISSION_DENIED
            elif grep -qi 'invoker.*IAM\|invoker-iam' /tmp/diag-deploy.err; then ERROR_CLASS=INVOKER_IAM_CONFIGURATION
            elif grep -qi 'image\|container' /tmp/diag-deploy.err; then ERROR_CLASS=IMAGE_OR_CONTAINER
            else ERROR_CLASS=OTHER
            fi
          fi
          echo "diag_http=$DIAG_HTTP" >> "$GITHUB_OUTPUT"
          echo "diag_ctype=${DIAG_CTYPE:-none}" >> "$GITHUB_OUTPUT"
          echo "diag_log_count=$DIAG_REQUEST_LOG_COUNT" >> "$GITHUB_OUTPUT"
          echo "error_class=$ERROR_CLASS" >> "$GITHUB_OUTPUT"

      - name: Publish sanitized fresh-service result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RESULT: ${{ steps.diag.outputs.deploy_result }}
          DIAG_HTTP: ${{ steps.diag.outputs.diag_http }}
          DIAG_CTYPE: ${{ steps.diag.outputs.diag_ctype }}
          DIAG_LOG_COUNT: ${{ steps.diag.outputs.diag_log_count }}
          ERROR_CLASS: ${{ steps.diag.outputs.error_class }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/comment.md <<EOF
          STAGING_FRESH_SERVICE_DIAG_V9 RUN_ID=${GITHUB_RUN_ID} CANDIDATE=fd3799153cf41b6d573dde8889f355247b7eaf74

          EPHEMERAL_SERVICE=toca-diag-fd379915-v9
          RUNTIME_IDENTITY=CANONICAL_STAGING_MCP_SA
          DEPLOY_RESULT=${DEPLOY_RESULT:-unknown}
          DEPLOY_ERROR_CLASS=${ERROR_CLASS:-unknown}
          HTTP_RESULT=${DIAG_HTTP:-unknown}
          CONTENT_TYPE=${DIAG_CTYPE:-unknown}
          REQUEST_LOG_COUNT=${DIAG_LOG_COUNT:-unknown}
          NO_SECRETS=true
          NO_DATABASE=true
          NO_EXTERNAL_PROVIDERS=true
          PRODUCTION_ACCESS=false
          EOF
          gh issue comment 151 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      - name: Delete isolated diagnostic service
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$GCP_PROJECT_ID" = 'toca-mcp-next-staging'
          test "$GCP_REGION" = 'southamerica-east1'
          if gcloud run services describe toca-diag-fd379915-v9 --project "$GCP_PROJECT_ID" --region "$GCP_REGION" >/dev/null 2>&1; then
            gcloud run services delete toca-diag-fd379915-v9 --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet
          fi
          if gcloud run services describe toca-diag-fd379915-v9 --project "$GCP_PROJECT_ID" --region "$GCP_REGION" >/dev/null 2>&1; then
            echo 'Diagnostic service cleanup failed' >&2
            exit 1
          fi
          echo 'DIAGNOSTIC_SERVICE_CLEANUP=PASS'
