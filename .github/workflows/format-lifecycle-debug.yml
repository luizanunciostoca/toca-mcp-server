name: Format Lifecycle Debug

on:
  push:
    branches:
      - fix/marketing-autopilot-lifecycle-hardening

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print canonical Prettier output
        run: pnpm exec prettier src/marketing-autopilot-lifecycle.ts
