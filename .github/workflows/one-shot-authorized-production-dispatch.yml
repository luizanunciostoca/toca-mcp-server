name: One-shot authorized production dispatch

on:
  push:
    branches:
      - ops/dispatch-production-904210f2-20260826

permissions:
  actions: write
  contents: read
  issues: read

jobs:
  dispatch:
    if: github.actor == 'luizanunciostoca'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AUTHORIZED_SHA: 904210f2ed000ac1f99783d5f210e58da938e775
      AUTHORIZATION_ISSUE: '280'
    steps:
      - name: Revalidate exact main and active authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')

          main_sha="$(curl --fail-with-body --silent --show-error "${headers[@]}" "${api}/branches/main" | jq -r '.commit.sha')"
          [[ "$main_sha" == "$AUTHORIZED_SHA" ]] || { echo "main moved: ${main_sha}" >&2; exit 1; }

          auth_json="$(curl --fail-with-body --silent --show-error "${headers[@]}" "${api}/issues/${AUTHORIZATION_ISSUE}")"
          jq -e --arg sha "$AUTHORIZED_SHA" '
            (.state == "open") and
            (.title | startswith("PRODUCTION AUTHORIZATION")) and
            ((.body // "") | contains("AUTHORIZED_CANDIDATE_SHA=" + $sha)) and
            ((.body // "") | contains("AUTHORIZATION_STATE=ACTIVE"))
          ' <<<"$auth_json" >/dev/null

          echo "EXACT_MAIN_AND_AUTHORIZATION=PASS sha=${main_sha} issue=${AUTHORIZATION_ISSUE}"

      - name: Dispatch canonical Deploy GCP Next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          payload="$(jq -n \
            --arg ref 'main' \
            --arg environment 'production' \
            --arg operation 'deploy' \
            --arg rollout 'full' \
            --arg staging 'https://github.com/luizanunciostoca/toca-mcp-server/issues/151#issuecomment-5390063189' \
            --arg authorization 'https://github.com/luizanunciostoca/toca-mcp-server/issues/280' \
            --arg alert 'https://github.com/luizanunciostoca/toca-mcp-server/issues/151#issuecomment-5390063189' \
            --arg dr 'https://github.com/luizanunciostoca/toca-mcp-server/actions/runs/32704372758' \
            '{ref:$ref,inputs:{environment:$environment,operation:$operation,rollout:$rollout,rollback_mcp_revision:"",rollback_webhook_revision:"",rollback_compatibility_ref:"",staging_evidence_ref:$staging,production_authorization_ref:$authorization,alert_evidence_ref:$alert,dr_evidence_ref:$dr}}')"

          code="$(curl --silent --show-error --output /tmp/dispatch-response.txt --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            "${api}/actions/workflows/deploy-gcp.yml/dispatches" \
            --data "$payload")"
          [[ "$code" == '204' ]] || { echo "dispatch failed HTTP ${code}" >&2; cat /tmp/dispatch-response.txt >&2; exit 1; }
          echo "CANONICAL_PRODUCTION_DISPATCH=PASS ref=main sha=${AUTHORIZED_SHA} authorization=#${AUTHORIZATION_ISSUE}"
