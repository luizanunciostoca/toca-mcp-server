name: TEMP — Format Marketing Autopilot

on:
  push:
    branches:
      - ops/restore-marketing-autopilot-gcp-scheduler-20260916
    paths:
      - .github/workflows/tmp-format-autopilot.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ops/restore-marketing-autopilot-gcp-scheduler-20260916
          persist-credentials: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier
        run: |
          pnpm exec prettier --write \
            control/marketing-autopilot-scheduler-policy.json \
            scripts/marketing-autopilot-registry.mjs \
            scripts/marketing-autopilot-scheduler.mjs
      - name: Commit formatting only
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- . ':!control/marketing-autopilot-scheduler-policy.json' ':!scripts/marketing-autopilot-registry.mjs' ':!scripts/marketing-autopilot-scheduler.mjs'
          if git diff --quiet -- control/marketing-autopilot-scheduler-policy.json scripts/marketing-autopilot-registry.mjs scripts/marketing-autopilot-scheduler.mjs; then
            echo 'FORMATTER_NO_CHANGES=1'
            exit 0
          fi
          git config user.name 'toca-autopilot-formatter[bot]'
          git config user.email 'toca-autopilot-formatter[bot]@users.noreply.github.com'
          git add control/marketing-autopilot-scheduler-policy.json scripts/marketing-autopilot-registry.mjs scripts/marketing-autopilot-scheduler.mjs
          git commit -m 'style(marketing): apply canonical prettier'
          git push origin HEAD:ops/restore-marketing-autopilot-gcp-scheduler-20260916
