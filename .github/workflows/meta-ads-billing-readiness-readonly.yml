name: Meta Ads Billing Readiness Read-Only

on:
  push:
    branches:
      - diag/meta-ads-smoke-15442397-failure
    paths:
      - '.github/workflows/meta-ads-billing-readiness-readonly.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  TOKEN_SECRET_ID: toca-meta-oauth-token
  JOB: toca-meta-ads-billing-readiness-readonly
  ACCOUNT_ID: '394512749760530'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Build GET-only image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/billing-readiness
          cat > /tmp/billing-readiness/read.mjs <<'NODE'
          const token = process.env.META_ACCESS_TOKEN;
          const accountId = process.env.ACCOUNT_ID;
          if (!token || !accountId) throw new Error('CONFIGURATION_MISSING');
          const response = await fetch(`https://graph.facebook.com/v24.0/act_${accountId}?fields=id,account_id,name,account_status,funding_source,funding_source_details,expired_funding_source_details,failed_delivery_checks`, {
            headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
          });
          const body = await response.json().catch(() => ({}));
          if (!response.ok) {
            const error = body?.error ?? {};
            console.log(`META_ADS_BILLING_READINESS=${JSON.stringify({ httpStatus: response.status, ok: false, code: Number(error.code) || null, subcode: Number(error.error_subcode) || null, message: String(error.message ?? '').slice(0, 300) })}`);
            process.exit(2);
          }
          const fundingDetails = body?.funding_source_details && typeof body.funding_source_details === 'object' ? body.funding_source_details : null;
          const expiredDetails = Array.isArray(body?.expired_funding_source_details) ? body.expired_funding_source_details : [];
          const failedChecks = Array.isArray(body?.failed_delivery_checks) ? body.failed_delivery_checks : [];
          console.log(`META_ADS_BILLING_READINESS=${JSON.stringify({
            httpStatus: response.status,
            ok: true,
            accountId: String(body?.account_id ?? ''),
            accountStatus: body?.account_status ?? null,
            hasFundingSource: Boolean(body?.funding_source),
            hasFundingSourceDetails: Boolean(fundingDetails),
            fundingSourceType: fundingDetails?.type ?? null,
            fundingSourceStatus: fundingDetails?.status ?? null,
            expiredFundingSourceCount: expiredDetails.length,
            failedDeliveryCheckCount: failedChecks.length,
          })}`);
          NODE
          cat > /tmp/billing-readiness/Dockerfile <<'DOCKER'
          FROM node:24-bookworm-slim
          WORKDIR /app
          COPY read.mjs ./read.mjs
          USER node
          CMD ["node", "read.mjs"]
          DOCKER
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/meta-ads-billing-readiness:${GITHUB_SHA}"
          docker build -t "$IMAGE" /tmp/billing-readiness
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy GET-only job
        run: |
          gcloud run jobs deploy "$JOB" --image "$IMAGE" --project "$PROJECT_ID" --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars "ACCOUNT_ID=$ACCOUNT_ID" \
            --set-secrets "META_ACCESS_TOKEN=$TOKEN_SECRET_ID:latest" \
            --tasks 1 --max-retries 0 --task-timeout 120s --quiet
      - name: Execute GET-only job
        run: gcloud run jobs execute "$JOB" --project "$PROJECT_ID" --region "$REGION" --wait --quiet
      - name: Print sanitized readiness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULT=""
          for attempt in $(seq 1 12); do
            RESULT="$(gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$JOB\" AND textPayload:\"META_ADS_BILLING_READINESS=\"" \
              --project "$PROJECT_ID" --freshness=10m --order=desc --limit=1 --format='value(textPayload)')"
            [ -n "$RESULT" ] && break
            sleep 3
          done
          test -n "$RESULT"
          printf '%s\n' "$RESULT"
      - name: Remove GET-only job
        if: always()
        run: gcloud run jobs delete "$JOB" --project "$PROJECT_ID" --region "$REGION" --quiet || true
