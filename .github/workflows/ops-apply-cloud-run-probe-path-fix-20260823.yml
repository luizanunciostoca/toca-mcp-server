name: TEMP Apply Cloud Run External Probe Path Fix 2026-08-23

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate-patch:
    if: github.head_ref == 'fix/cloud-run-external-probe-paths-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/cloud-run-external-probe-paths-20260823
          persist-credentials: true
          fetch-depth: 0

      - name: Stop after validated snapshot commit
        id: guard
        shell: bash
        run: |
          if [[ -f .validated/cloud-run-probe-paths/COMPLETE ]]; then
            echo 'done=true' >> "$GITHUB_OUTPUT"
          else
            echo 'done=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.guard.outputs.done != 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0

      - name: Setup Node
        if: steps.guard.outputs.done != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        if: steps.guard.outputs.done != 'true'
        run: pnpm install --frozen-lockfile

      - name: Apply minimal patch
        if: steps.guard.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match for {old!r}, got {count}')
              p.write_text(text.replace(old, new, 1))

          def replace_all(path, old, new, minimum=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'{path}: expected at least {minimum} matches for {old!r}, got {count}')
              p.write_text(text.replace(old, new))

          replace_once(
              'src/http-server.ts',
              "if (url.pathname === '/readyz' && method === 'GET') {",
              "if ((url.pathname === '/readyz' || url.pathname === '/ready') && method === 'GET') {",
          )
          replace_once(
              'src/orchestrator/http-server.ts',
              "if (method === 'GET' && url.pathname === '/readyz') {",
              "if (method === 'GET' && (url.pathname === '/readyz' || url.pathname === '/ready')) {",
          )
          replace_once(
              'src/http.ts',
              "  '/readyz',\n  '/webhooks/meta',",
              "  '/readyz',\n  '/ready',\n  '/webhooks/meta',",
          )

          canonical = '.github/workflows/deploy-gcp-staging-canonical.yml'
          for old, new in [
              ('$MCP_URL/healthz', '$MCP_URL/health'),
              ('$MCP_URL/readyz', '$MCP_URL/ready'),
              ('$WEBHOOK_URL/healthz', '$WEBHOOK_URL/health'),
              ('$WEBHOOK_URL/readyz', '$WEBHOOK_URL/ready'),
              ('mcp-healthz.json', 'mcp-health.json'),
              ('mcp-readyz.json', 'mcp-ready.json'),
              ('webhook-healthz.json', 'webhook-health.json'),
              ('webhook-readyz.json', 'webhook-ready.json'),
          ]:
              replace_all(canonical, old, new)

          runtime = '.github/workflows/staging-runtime-observability.yml'
          replace_all(runtime, '/healthz', '/health')
          replace_all(runtime, '/readyz', '/ready')

          replace_all('ops/staging-runtime-observability-reconcile-v3.sh', '/readyz', '/ready')
          replace_all('infra/observability/staging-runtime-observability-policy.json', '/readyz', '/ready')

          test = Path('test/gcp-staging-canonical-workflow.test.ts')
          text = test.read_text()
          text = text.replace("expect(workflow).toContain('$MCP_URL/readyz');", "expect(workflow).toContain('$MCP_URL/ready');")
          text = text.replace("expect(workflow).toContain('$WEBHOOK_URL/readyz');", "expect(workflow).toContain('$WEBHOOK_URL/ready');")
          text = text.replace('"$MCP_URL/healthz"', '"$MCP_URL/health"')
          text = text.replace('"$MCP_URL/readyz"', '"$MCP_URL/ready"')
          anchor = "    expect(workflow).toContain(\"--startup-probe 'httpGet.path=/readyz\");\n"
          if anchor not in text:
              raise SystemExit('canonical workflow test anchor not found')
          text = text.replace(
              anchor,
              anchor + "    expect(workflow).toContain(\"--liveness-probe 'httpGet.path=/healthz\");\n",
              1,
          )
          anchor2 = "    expect(workflow).toContain('$WEBHOOK_URL/ready');\n"
          if anchor2 not in text:
              raise SystemExit('external readiness test anchor not found')
          text = text.replace(
              anchor2,
              anchor2
              + "    expect(workflow).toContain('$MCP_URL/health');\n"
              + "    expect(workflow).toContain('$WEBHOOK_URL/health');\n"
              + "    expect(workflow).not.toContain('$MCP_URL/healthz');\n"
              + "    expect(workflow).not.toContain('$MCP_URL/readyz');\n"
              + "    expect(workflow).not.toContain('$WEBHOOK_URL/healthz');\n"
              + "    expect(workflow).not.toContain('$WEBHOOK_URL/readyz');\n",
              1,
          )
          anchor3 = "    expect(runtimeWorkflow).toContain(\n      'id_token_audience: ${{ steps.runtime.outputs.webhook_url }}',\n    );\n"
          if anchor3 not in text:
              raise SystemExit('runtime workflow test anchor not found')
          text = text.replace(
              anchor3,
              anchor3
              + "    expect(runtimeWorkflow).toContain('${base_url}/health');\n"
              + "    expect(runtimeWorkflow).toContain('${base_url}/ready');\n"
              + "    expect(runtimeWorkflow).not.toContain('/healthz');\n"
              + "    expect(runtimeWorkflow).not.toContain('/readyz');\n",
              1,
          )
          test.write_text(text)

          http_test = Path('test/http-server.test.ts')
          text = http_test.read_text()
          anchor = "  it('exposes public Meta compliance pages even when MCP is disabled', async () => {"
          if anchor not in text:
              raise SystemExit('http-server test anchor not found')
          readiness_test = """  it('exposes readiness through internal and Cloud Run-safe external aliases', async () => {\n    const baseUrl = await listen();\n\n    for (const path of ['/readyz', '/ready']) {\n      const response = await fetch(`${baseUrl}${path}`);\n\n      expect(response.status).toBe(200);\n      const body = (await response.json()) as { status?: string };\n      expect(body.status).toBe('ready');\n    }\n  });\n\n"""
          text = text.replace(anchor, readiness_test + anchor, 1)
          http_test.write_text(text)
          PY

      - name: Format and validate focused regression
        if: steps.guard.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            src/http-server.ts \
            src/http.ts \
            src/orchestrator/http-server.ts \
            .github/workflows/deploy-gcp-staging-canonical.yml \
            .github/workflows/staging-runtime-observability.yml \
            ops/staging-runtime-observability-reconcile-v3.sh \
            infra/observability/staging-runtime-observability-policy.json \
            test/http-server.test.ts \
            test/gcp-staging-canonical-workflow.test.ts
          git diff --check
          pnpm exec vitest run test/http-server.test.ts test/gcp-staging-canonical-workflow.test.ts
          grep -Fq 'httpGet.path=/readyz' .github/workflows/deploy-gcp-staging-canonical.yml
          grep -Fq 'httpGet.path=/healthz' .github/workflows/deploy-gcp-staging-canonical.yml
          ! grep -Fq '$MCP_URL/healthz' .github/workflows/deploy-gcp-staging-canonical.yml
          ! grep -Fq '$MCP_URL/readyz' .github/workflows/deploy-gcp-staging-canonical.yml
          ! grep -Fq '/readyz' .github/workflows/staging-runtime-observability.yml
          grep -Fq '"path": "/ready"' infra/observability/staging-runtime-observability-policy.json

      - name: Persist validated snapshots outside workflow directory
        if: steps.guard.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          root=.validated/cloud-run-probe-paths
          mkdir -p "$root"
          cp src/http-server.ts "$root/src-http-server.ts"
          cp src/http.ts "$root/src-http.ts"
          cp src/orchestrator/http-server.ts "$root/src-orchestrator-http-server.ts"
          cp .github/workflows/deploy-gcp-staging-canonical.yml "$root/deploy-gcp-staging-canonical.yml"
          cp .github/workflows/staging-runtime-observability.yml "$root/staging-runtime-observability.yml"
          cp ops/staging-runtime-observability-reconcile-v3.sh "$root/staging-runtime-observability-reconcile-v3.sh"
          cp infra/observability/staging-runtime-observability-policy.json "$root/staging-runtime-observability-policy.json"
          cp test/http-server.test.ts "$root/test-http-server.test.ts"
          cp test/gcp-staging-canonical-workflow.test.ts "$root/test-gcp-staging-canonical-workflow.test.ts"
          printf 'validated-by-run=%s\nbase=fd3799153cf41b6d573dde8889f355247b7eaf74\n' "$GITHUB_RUN_ID" > "$root/COMPLETE"
          git add "$root"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(validation): persist Cloud Run probe path snapshots'
          git push origin HEAD:fix/cloud-run-external-probe-paths-20260823
