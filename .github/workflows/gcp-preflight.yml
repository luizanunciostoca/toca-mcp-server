name: GCP Infrastructure Preflight

on:
  push:
    branches:
      - feat/instagram-engagement-messaging
    paths:
      - '.github/workflows/gcp-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify Artifact Registry
        run: |
          gcloud artifacts repositories describe toca-mcp \
            --project toca-mcp-production \
            --location southamerica-east1 \
            --format='value(name,format,mode)'
      - name: Verify runtime service account
        run: |
          gcloud iam service-accounts describe \
            toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com \
            --project toca-mcp-production \
            --format='value(email,disabled)'
      - name: Verify deployer service account
        run: |
          gcloud iam service-accounts describe \
            toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com \
            --project toca-mcp-production \
            --format='value(email,disabled)'
      - name: Verify Cloud SQL
        id: cloudsql
        continue-on-error: true
        run: |
          gcloud sql instances describe toca-mcp-db \
            --project toca-mcp-production \
            --format='value(name,databaseVersion,region,state,connectionName)'
      - name: Summarize preflight
        run: |
          if [ "${{ steps.cloudsql.outcome }}" != "success" ]; then
            echo "Cloud SQL describe failed. The instance is known to exist; deployer likely lacks cloudsql.instances.get."
            exit 1
          fi
