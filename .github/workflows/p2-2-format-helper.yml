name: P2.2 Format Helper

on:
  push:
    branches: [ops/p2-2-ag01-vertex-20260828]
    paths: ['.github/workflows/p2-2-format-helper.yml']

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/ag01-vertex-provider-smoke.ts src/orchestrator/production-config.ts src/orchestrator/production-runtime.ts src/orchestrator/vertex-gemini-decision-adapter.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-2-formatted-source
          path: |
            src/ag01-vertex-provider-smoke.ts
            src/orchestrator/production-config.ts
            src/orchestrator/production-runtime.ts
            src/orchestrator/vertex-gemini-decision-adapter.ts
          retention-days: 1
