name: Email Provider Gate

on:
  pull_request:
    paths:
      - '.env.example'
      - 'docs/checkpoints/email-real-sendgrid-2026-08-20.md'
      - 'migrations/024_email_provider_runtime.sql'
      - 'scripts/validate-sendgrid-email.ts'
      - 'scripts/verify-email-typecheck.mjs'
      - 'src/http.ts'
      - 'src/mcp/email-campaign-send-runtime.ts'
      - 'src/mcp/omnichannel-readback-runtime.ts'
      - 'src/omnichannel/email-campaign-send-runtime.ts'
      - 'src/omnichannel/email-runtime.ts'
      - 'src/omnichannel/email-orchestrator.ts'
      - 'src/omnichannel/provider-event-readback.ts'
      - 'src/omnichannel/runtime-tool-definitions.ts'
      - 'src/persistence/postgres-email-runtime-store.ts'
      - 'src/providers/sendgrid/**'
      - 'test/email-campaign-send-runtime.test.ts'
      - 'test/email-runtime.test.ts'
      - 'test/email-orchestrator.test.ts'
      - 'test/omnichannel-capability-specs.test.ts'
      - 'test/postgres-email-runtime-outbox.test.ts'
      - 'test/sendgrid-email-event-runtime.test.ts'
      - 'test/sendgrid-email-provider.test.ts'
      - 'tsconfig.email.json'
      - '.github/workflows/email-provider-gate.yml'

permissions:
  contents: read

jobs:
  email-owned:
    name: Email-owned verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Email-owned files
        run: >-
          pnpm exec prettier --check
          scripts/validate-sendgrid-email.ts
          scripts/verify-email-typecheck.mjs
          src/http.ts
          src/mcp/email-campaign-send-runtime.ts
          src/mcp/omnichannel-readback-runtime.ts
          src/omnichannel/email-campaign-send-runtime.ts
          src/omnichannel/email-runtime.ts
          src/omnichannel/email-orchestrator.ts
          src/omnichannel/provider-event-readback.ts
          src/omnichannel/runtime-tool-definitions.ts
          src/persistence/postgres-email-runtime-store.ts
          src/providers/sendgrid/email-event-http-runtime.ts
          src/providers/sendgrid/email-provider.ts
          src/providers/sendgrid/runtime-config.ts
          test/email-campaign-send-runtime.test.ts
          test/email-runtime.test.ts
          test/email-orchestrator.test.ts
          test/omnichannel-capability-specs.test.ts
          test/postgres-email-runtime-outbox.test.ts
          test/sendgrid-email-event-runtime.test.ts
          test/sendgrid-email-provider.test.ts
          tsconfig.email.json
      - name: Lint Email-owned files
        run: >-
          pnpm exec eslint
          scripts/validate-sendgrid-email.ts
          scripts/verify-email-typecheck.mjs
          src/http.ts
          src/mcp/email-campaign-send-runtime.ts
          src/mcp/omnichannel-readback-runtime.ts
          src/omnichannel/email-campaign-send-runtime.ts
          src/omnichannel/email-runtime.ts
          src/omnichannel/email-orchestrator.ts
          src/omnichannel/provider-event-readback.ts
          src/omnichannel/runtime-tool-definitions.ts
          src/persistence/postgres-email-runtime-store.ts
          src/providers/sendgrid/email-event-http-runtime.ts
          src/providers/sendgrid/email-provider.ts
          src/providers/sendgrid/runtime-config.ts
          test/email-campaign-send-runtime.test.ts
          test/email-runtime.test.ts
          test/email-orchestrator.test.ts
          test/omnichannel-capability-specs.test.ts
          test/postgres-email-runtime-outbox.test.ts
          test/sendgrid-email-event-runtime.test.ts
          test/sendgrid-email-provider.test.ts
      - name: Typecheck Email-owned graph
        run: node scripts/verify-email-typecheck.mjs
      - name: Email unit tests
        run: >-
          pnpm vitest run
          test/email-campaign-send-runtime.test.ts
          test/email-runtime.test.ts
          test/email-orchestrator.test.ts
          test/omnichannel-capability-specs.test.ts
          test/postgres-email-runtime-outbox.test.ts
          test/sendgrid-email-event-runtime.test.ts
          test/sendgrid-email-provider.test.ts

  stacked-integration:
    name: Stacked repository integration
    needs: email-owned
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Repository typecheck
        run: pnpm typecheck
      - name: Repository build
        run: pnpm build
