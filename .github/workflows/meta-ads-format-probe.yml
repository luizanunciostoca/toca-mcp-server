name: Meta Ads Format Probe

on:
  push:
    branches:
      - feat/meta-ads-controlled-create-paused

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format target files and print exact patch
        run: |
          pnpm exec prettier --write \
            src/providers/meta-ads/meta-ads-controlled-write.ts \
            src/tools/register-meta-ads-write.ts \
            test/meta-ads-controlled-write.test.ts
          git diff -- \
            src/providers/meta-ads/meta-ads-controlled-write.ts \
            src/tools/register-meta-ads-write.ts \
            test/meta-ads-controlled-write.test.ts
