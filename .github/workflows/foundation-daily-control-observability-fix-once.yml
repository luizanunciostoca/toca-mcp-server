name: Foundation Daily Control Observability Fix One-Shot

on:
  push:
    branches: [fix/foundation-daily-control-observability]
    paths: ['.github/workflows/foundation-daily-control-observability-fix-once.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/foundation-daily-control-observability
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Make initial persistence failures observable
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/operations/foundation-daily-control.ts')
          text = source.read_text()
          old = """  const alreadyCompleted = await input.pool.query<{ exists: boolean }>(\n    `select exists (\n       select 1 from operational_signals\n       where name = $1 and attributes->>'dayKey' = $2\n     ) as exists`,\n    [CONTROL_NAME, clock.dayKey],\n  );\n"""
          new = """  let alreadyCompleted: pg.QueryResult<{ exists: boolean }>;\n  try {\n    alreadyCompleted = await input.pool.query<{ exists: boolean }>(\n      `select exists (\n         select 1 from operational_signals\n         where name = $1 and attributes->>'dayKey' = $2\n       ) as exists`,\n      [CONTROL_NAME, clock.dayKey],\n    );\n  } catch (error) {\n    input.telemetry.increment('foundation.daily_control.failed');\n    input.logger.error('foundation.daily_control.failed', {\n      dayKey: clock.dayKey,\n      phase: 'COMPLETION_READ',\n      error: error instanceof Error ? error.message : String(error),\n    });\n    throw error;\n  }\n"""
          if old not in text:
              raise SystemExit('expected initial completion query not found')
          source.write_text(text.replace(old, new, 1))

          test = Path('test/foundation-daily-control.test.ts')
          text = test.read_text()
          text = text.replace("import { describe, expect, it } from 'vitest';", "import type pg from 'pg';\nimport { describe, expect, it, vi } from 'vitest';\nimport { RuntimeTelemetry } from '../src/core/observability.js';")
          text = text.replace("  classifyFoundationDailyControl,\n", "  classifyFoundationDailyControl,\n  runFoundationDailyControl,\n")
          marker = """  it('is healthy when outbox, scheduler and recent audit integrity are healthy', () => {\n"""
          case = """  it('logs and rethrows an initial completion-read persistence failure', async () => {\n    const databaseError = new Error('relation operational_signals does not exist');\n    const pool = { query: vi.fn().mockRejectedValue(databaseError) } as unknown as pg.Pool;\n    const logger = { info: vi.fn(), error: vi.fn() };\n    const telemetry = new RuntimeTelemetry(logger);\n\n    await expect(\n      runFoundationDailyControl({\n        pool,\n        telemetry,\n        logger,\n        now: new Date('2026-08-15T12:00:00.000Z'),\n      }),\n    ).rejects.toThrow('relation operational_signals does not exist');\n\n    expect(logger.error).toHaveBeenCalledWith(\n      'foundation.daily_control.failed',\n      expect.objectContaining({\n        dayKey: '2026-08-15',\n        phase: 'COMPLETION_READ',\n        error: 'relation operational_signals does not exist',\n      }),\n    );\n    expect(telemetry.snapshot().counters['foundation.daily_control.failed']).toBe(1);\n  });\n\n"""
          if marker not in text:
              raise SystemExit('test insertion marker not found')
          test.write_text(text.replace(marker, case + marker, 1))
          PY
          pnpm exec prettier --write src/operations/foundation-daily-control.ts test/foundation-daily-control.test.ts
          pnpm quality
      - name: Commit tested fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/operations/foundation-daily-control.ts test/foundation-daily-control.test.ts
          git commit -m 'fix(reliability): surface daily-control completion-read failures'
          git push origin HEAD:fix/foundation-daily-control-observability
