name: Instagram Engagement Corrected Runtime Shadow

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: instagram-engagement-corrected-runtime-shadow
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  DATABASE_SECRET_ID: toca-database-url
  META_APP_SECRET_ID: toca-meta-app-secret
  DAEMON_SERVICE_NAME: toca-managed-instagram-daemon
  WEBHOOK_SERVICE_NAME: toca-webhook-next-production
  SCHEDULER_JOB_NAME: toca-managed-instagram-tick
  INSTAGRAM_ACCOUNT_ID: '17841402033495654'
  INSTAGRAM_PAGE_ID: '306103746115875'
  META_APP_ID: '2281930145887404'
  CANONICAL_FAQ_SPREADSHEET_ID: 1M0HSs7QJpFCJvvnrZxJRaaXY8scv5R3okCG_OyFLiEU
  TOCA_TENANT_ID: toca
  TOCA_WORKSPACE_ID: toca
  TOCA_ORGANIZATION_ID: toca
  META_REDIRECT_URI: https://toca-meta-oauth-staging-990081828836.southamerica-east1.run.app/oauth/meta/callback
  META_REQUESTED_SCOPES: pages_show_list,pages_read_engagement,pages_manage_metadata,pages_messaging,business_management,instagram_basic,instagram_manage_comments,instagram_manage_messages,instagram_content_publish
  RUNTIME_SOURCE_SHA: 22ca9a0160ad3b08d0e133342256376a8e98cb17
  RUNTIME_IMAGE_DIGEST: sha256:50479566a83448090e9fd8f14c471ca6a79ba3c239eb386e8354379b5c872de6
  RUNTIME_IMAGE: southamerica-east1-docker.pkg.dev/toca-mcp-production/toca-mcp/server@sha256:50479566a83448090e9fd8f14c471ca6a79ba3c239eb386e8354379b5c872de6

jobs:
  corrected-runtime-shadow:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'PRODUCTION AUTHORIZATION — Instagram corrected runtime shadow AUTO')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - name: Checkout exact shadow controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate owner authorization and immutable runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          ISSUE_JSON="$(jq -c '.issue' "$GITHUB_EVENT_PATH")"
          BODY="$(printf '%s' "$ISSUE_JSON" | jq -r '.body // ""')"
          ISSUE_NUMBER="$(printf '%s' "$ISSUE_JSON" | jq -r '.number')"
          printf '%s' "$ISSUE_JSON" | jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" '
            (.state == "open") and
            (.user.login == $owner) and
            (.title | startswith("PRODUCTION AUTHORIZATION — Instagram corrected runtime shadow AUTO"))
          ' >/dev/null

          CURRENT_MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          test "$CURRENT_MAIN_SHA" = "$GITHUB_SHA"

          required_lines=(
            "AUTHORIZED_CANDIDATE_SHA=$GITHUB_SHA"
            "AUTHORIZATION_STATE=ACTIVE"
            "INSTAGRAM_ENGAGEMENT_CORRECTED_RUNTIME_SHADOW=AUTHORIZED"
            "RUNTIME_SOURCE_SHA=$RUNTIME_SOURCE_SHA"
            "RUNTIME_IMAGE_DIGEST=$RUNTIME_IMAGE_DIGEST"
            "DAEMON_CANDIDATE_TRAFFIC_ROUTING_AUTHORIZED=true"
            "WEBHOOK_CANDIDATE_TRAFFIC_ROUTING_AUTHORIZED=true"
            "CALLBACK_EXPOSURE_AUTHORIZED=true"
            "SCHEDULER_TICK_PUMP_AUTHORIZED=true"
            "EXTERNAL_REPLY_WRITES_AUTHORIZED=false"
          )
          for required in "${required_lines[@]}"; do
            grep -Fxq "$required" <<< "$BODY" || {
              echo "Missing exact authorization field: $required" >&2
              exit 1
            }
          done

          echo "AUTHORIZATION_ISSUE_NUMBER=$ISSUE_NUMBER" >> "$GITHUB_ENV"
          mkdir -p engagement-evidence
          jq -n --arg controllerSha "$GITHUB_SHA" --arg runtimeSha "$RUNTIME_SOURCE_SHA" --arg digest "$RUNTIME_IMAGE_DIGEST" \
            '{schemaVersion:"toca.instagram-engagement.corrected-runtime-shadow-authorization.v1",controllerSha:$controllerSha,runtimeSourceSha:$runtimeSha,runtimeImageDigest:$digest,externalReplyWritesAuthorized:false}' \
            > engagement-evidence/authorization.json

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Run exact-head Quality Gate
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm quality

      - name: Authenticate governed deployer
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Verify immutable runtime and fail-closed prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$GCP_PROJECT_ID" = 'toca-mcp-production'
          test "$GCP_REGION" = 'southamerica-east1'
          test "$RUNTIME_SOURCE_SHA" = '22ca9a0160ad3b08d0e133342256376a8e98cb17'
          test "$RUNTIME_IMAGE_DIGEST" = 'sha256:50479566a83448090e9fd8f14c471ca6a79ba3c239eb386e8354379b5c872de6'

          DESCRIBED_DIGEST="$(gcloud artifacts docker images describe "$RUNTIME_IMAGE" --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          test "$DESCRIBED_DIGEST" = "$RUNTIME_IMAGE_DIGEST"

          current_revision() {
            local service="$1"
            gcloud run services describe "$service" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
              | jq -r '. as $s | [($s.status.traffic // [])[] | select((.percent // 0) == 100) | (.revisionName // (if (.latestRevision // false) then $s.status.latestReadyRevisionName else empty end))] | unique | if length == 1 then .[0] else empty end'
          }

          DAEMON_JSON="$(gcloud run services describe "$DAEMON_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          WEBHOOK_JSON="$(gcloud run services describe "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          PREVIOUS_DAEMON_REVISION="$(current_revision "$DAEMON_SERVICE_NAME")"
          PREVIOUS_WEBHOOK_REVISION="$(current_revision "$WEBHOOK_SERVICE_NAME")"
          test -n "$PREVIOUS_DAEMON_REVISION"
          test -n "$PREVIOUS_WEBHOOK_REVISION"
          echo "PREVIOUS_DAEMON_REVISION=$PREVIOUS_DAEMON_REVISION" >> "$GITHUB_ENV"
          echo "PREVIOUS_WEBHOOK_REVISION=$PREVIOUS_WEBHOOK_REVISION" >> "$GITHUB_ENV"

          printf '%s' "$DAEMON_JSON" | jq -e '.spec.template.spec.containers[0] as $c | ([$c.env[]? | select(.name == "INSTAGRAM_ENGAGEMENT_WRITES_ENABLED") | .value] | last // "false") == "false"' >/dev/null
          printf '%s' "$WEBHOOK_JSON" | jq -e '(.metadata.annotations["run.googleapis.com/default-url-disabled"] // "false") == "true"' >/dev/null
          if gcloud run services get-iam-policy "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            | jq -e '.bindings[]? | select(.role == "roles/run.invoker") | (.members // [])[]? | select(. == "allUsers")' >/dev/null; then
            echo 'Fail-closed shadow requires no allUsers invoker' >&2
            exit 1
          fi

          DAEMON_URL="$(printf '%s' "$DAEMON_JSON" | jq -r '.status.url // empty')"
          test -n "$DAEMON_URL"
          SCHEDULER_JSON="$(gcloud scheduler jobs describe "$SCHEDULER_JOB_NAME" --project "$GCP_PROJECT_ID" --location "$GCP_REGION" --format=json)"
          printf '%s' "$SCHEDULER_JSON" | jq -e --arg uri "${DAEMON_URL}/tick" --arg sa "$GCP_RUNTIME_SERVICE_ACCOUNT" --arg audience "$DAEMON_URL" '
            (.httpTarget.uri == $uri) and
            (.httpTarget.httpMethod == "POST") and
            (.httpTarget.oidcToken.serviceAccountEmail == $sa) and
            (.httpTarget.oidcToken.audience == $audience)
          ' >/dev/null
          echo "DAEMON_URL=$DAEMON_URL" >> "$GITHUB_ENV"

          jq -n --arg daemon "$PREVIOUS_DAEMON_REVISION" --arg webhook "$PREVIOUS_WEBHOOK_REVISION" \
            '{schemaVersion:"toca.instagram-engagement.corrected-runtime-shadow-prestate.v1",daemonRevision:$daemon,webhookRevision:$webhook,callbackClosed:true,schedulerVerified:true,writesEnabled:false}' \
            > engagement-evidence/prestate.json

      - name: Re-run fail-closed readiness on corrected runtime
        shell: bash
        run: |
          set -euo pipefail
          JOB="toca-ig-eng-corrected-ready-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          gcloud run jobs deploy "$JOB" \
            --image "$RUNTIME_IMAGE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --set-env-vars "NODE_ENV=production,META_ENABLED=false,INSTAGRAM_ENGAGEMENT_RUNTIME_ENABLED=true,INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=false,INSTAGRAM_ENGAGEMENT_TENANT_ID=$TOCA_TENANT_ID,INSTAGRAM_ENGAGEMENT_WORKSPACE_ID=$TOCA_WORKSPACE_ID,INSTAGRAM_ENGAGEMENT_ORGANIZATION_ID=$TOCA_ORGANIZATION_ID,INSTAGRAM_ENGAGEMENT_PAGE_ID=$INSTAGRAM_PAGE_ID,INSTAGRAM_BUSINESS_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID,INSTAGRAM_ENGAGEMENT_KNOWLEDGE_SPREADSHEET_ID=$CANONICAL_FAQ_SPREADSHEET_ID,INSTAGRAM_ENGAGEMENT_KNOWLEDGE_SOURCE=postgres" \
            --command node --args dist/src/instagram-engagement-readiness-preflight.js \
            --tasks 1 --max-retries 0 --task-timeout 180s --quiet
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet
          LOG_ENTRIES="$(gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${JOB}\"" --project "$GCP_PROJECT_ID" --freshness=20m --limit=200 --order=asc --format=json || true)"
          READINESS="$(printf '%s' "$LOG_ENTRIES" | node scripts/extract-instagram-engagement-cloud-run-evidence.mjs instagram-engagement-readiness)"
          printf '%s' "$READINESS" | jq -e '.status == "PASS" and .writesEnabled == false and .databaseSchemaVerified == true and .migrationVerified == true and .knowledgeReadable == true and .knowledgeSnapshotVerified == true and .knowledgeAuthMode == "postgres" and .scopeConfigured == true and .secretsPrinted == false' >/dev/null
          printf '%s\n' "$READINESS" > engagement-evidence/readiness.json
          cleanup
          trap - EXIT

      - name: Create and route corrected daemon and webhook candidates
        shell: bash
        run: |
          set -euo pipefail
          RUN_TAIL="${GITHUB_RUN_ID: -7}"
          DAEMON_SUFFIX="c${RUN_TAIL}a${GITHUB_RUN_ATTEMPT}"
          WEBHOOK_SUFFIX="c${RUN_TAIL}a${GITHUB_RUN_ATTEMPT}"
          DAEMON_CANDIDATE_REVISION="${DAEMON_SERVICE_NAME}-${DAEMON_SUFFIX}"
          WEBHOOK_CANDIDATE_REVISION="${WEBHOOK_SERVICE_NAME}-${WEBHOOK_SUFFIX}"
          echo "DAEMON_CANDIDATE_REVISION=$DAEMON_CANDIDATE_REVISION" >> "$GITHUB_ENV"
          echo "WEBHOOK_CANDIDATE_REVISION=$WEBHOOK_CANDIDATE_REVISION" >> "$GITHUB_ENV"

          DAEMON_ENV="^@^NODE_ENV=production@INSTAGRAM_ENGAGEMENT_RUNTIME_ENABLED=true@INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=false@INSTAGRAM_PUBLICATION_WRITES_ENABLED=false@INSTAGRAM_ENGAGEMENT_TENANT_ID=$TOCA_TENANT_ID@INSTAGRAM_ENGAGEMENT_WORKSPACE_ID=$TOCA_WORKSPACE_ID@INSTAGRAM_ENGAGEMENT_ORGANIZATION_ID=$TOCA_ORGANIZATION_ID@INSTAGRAM_ENGAGEMENT_PAGE_ID=$INSTAGRAM_PAGE_ID@INSTAGRAM_ENGAGEMENT_KNOWLEDGE_SPREADSHEET_ID=$CANONICAL_FAQ_SPREADSHEET_ID@INSTAGRAM_ENGAGEMENT_KNOWLEDGE_SOURCE=postgres@INSTAGRAM_BUSINESS_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID@INSTAGRAM_ENGAGEMENT_SHADOW_RUN_ID=$GITHUB_RUN_ID"
          gcloud run services update "$DAEMON_SERVICE_NAME" \
            --image "$RUNTIME_IMAGE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" --add-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --update-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" --revision-suffix="$DAEMON_SUFFIX" \
            --update-env-vars "$DAEMON_ENV" --command node --args dist/src/toca-managed-instagram-daemon.js --quiet

          DAEMON_REVISION_JSON="$(gcloud run revisions describe "$DAEMON_CANDIDATE_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$DAEMON_REVISION_JSON" | jq -e --arg digest "$RUNTIME_IMAGE_DIGEST" --arg sa "$GCP_RUNTIME_SERVICE_ACCOUNT" '
            .spec.containers[0] as $c |
            (.spec.serviceAccountName == $sa) and
            ($c.image | contains($digest)) and
            ($c.command == ["node"]) and
            ($c.args == ["dist/src/toca-managed-instagram-daemon.js"]) and
            (([($c.env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_RUNTIME_ENABLED") | .value] | last) == "true") and
            (([($c.env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_WRITES_ENABLED") | .value] | last) == "false") and
            (([($c.env // [])[] | select(.name == "INSTAGRAM_PUBLICATION_WRITES_ENABLED") | .value] | last) == "false")
          ' >/dev/null
          gcloud run services update-traffic "$DAEMON_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions="${DAEMON_CANDIDATE_REVISION}=100" --quiet

          WEBHOOK_ENV="^@^NODE_ENV=production@MCP_ENABLED=false@TOCA_SERVICE_ROLE=webhook@TOCA_DEFAULT_TENANT_ID=$TOCA_TENANT_ID@TOCA_DEFAULT_WORKSPACE_ID=$TOCA_WORKSPACE_ID@TOCA_DEFAULT_ORGANIZATION_ID=$TOCA_ORGANIZATION_ID@META_ENABLED=true@META_PROVIDER_VERIFIED=true@META_WEBHOOK_ENABLED=true@META_WEBHOOK_PERSISTENCE_ENABLED=true@META_APP_ID=$META_APP_ID@META_APP_SECRET_PROVIDER=env@META_APP_SECRET_KEY=META_APP_SECRET@META_AUTHORIZATION_ENDPOINT=https://www.facebook.com/dialog/oauth@META_TOKEN_ENDPOINT=https://graph.facebook.com/oauth/access_token@META_REDIRECT_URI=$META_REDIRECT_URI@META_REQUESTED_SCOPES=$META_REQUESTED_SCOPES@META_GRAPH_BASE_URL=https://graph.facebook.com@META_GRAPH_API_VERSION=v24.0@INSTAGRAM_ENGAGEMENT_RUNTIME_ENABLED=true@INSTAGRAM_ENGAGEMENT_TENANT_ID=$TOCA_TENANT_ID@INSTAGRAM_ENGAGEMENT_WORKSPACE_ID=$TOCA_WORKSPACE_ID@INSTAGRAM_ENGAGEMENT_ORGANIZATION_ID=$TOCA_ORGANIZATION_ID@INSTAGRAM_ENGAGEMENT_SHADOW_RUN_ID=$GITHUB_RUN_ID@INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=false@INSTAGRAM_BUSINESS_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID"
          gcloud run services update "$WEBHOOK_SERVICE_NAME" \
            --image "$RUNTIME_IMAGE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" --add-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --update-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest,META_APP_SECRET=$META_APP_SECRET_ID:latest" \
            --revision-suffix="$WEBHOOK_SUFFIX" --update-env-vars "$WEBHOOK_ENV" \
            --command node --args dist/src/http-instagram-engagement.js --quiet

          WEBHOOK_REVISION_JSON="$(gcloud run revisions describe "$WEBHOOK_CANDIDATE_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$WEBHOOK_REVISION_JSON" | jq -e --arg digest "$RUNTIME_IMAGE_DIGEST" --arg sa "$GCP_RUNTIME_SERVICE_ACCOUNT" '
            .spec.containers[0] as $c |
            (.spec.serviceAccountName == $sa) and
            ($c.image | contains($digest)) and
            ($c.command == ["node"]) and
            ($c.args == ["dist/src/http-instagram-engagement.js"]) and
            (([($c.env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_RUNTIME_ENABLED") | .value] | last) == "true") and
            (([($c.env // [])[] | select(.name == "INSTAGRAM_ENGAGEMENT_WRITES_ENABLED") | .value] | last) == "false") and
            (([($c.env // [])[] | select(.name == "META_WEBHOOK_PERSISTENCE_ENABLED") | .value] | last) == "true")
          ' >/dev/null
          gcloud run services update-traffic "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions="${WEBHOOK_CANDIDATE_REVISION}=100" --quiet

          DAEMON_ROUTED="$(gcloud run services describe "$DAEMON_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          WEBHOOK_ROUTED="$(gcloud run services describe "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$DAEMON_ROUTED" | jq -e --arg revision "$DAEMON_CANDIDATE_REVISION" '([.status.traffic[]? | select((.percent // 0) == 100) | .revisionName] | first) == $revision' >/dev/null
          printf '%s' "$WEBHOOK_ROUTED" | jq -e --arg revision "$WEBHOOK_CANDIDATE_REVISION" '([.status.traffic[]? | select((.percent // 0) == 100) | .revisionName] | first) == $revision and ((.metadata.annotations["run.googleapis.com/default-url-disabled"] // "false") == "true")' >/dev/null

          jq -n --arg daemon "$DAEMON_CANDIDATE_REVISION" --arg webhook "$WEBHOOK_CANDIDATE_REVISION" \
            '{schemaVersion:"toca.instagram-engagement.corrected-runtime-shadow-routing.v1",daemonCandidateRevision:$daemon,webhookCandidateRevision:$webhook,daemonTrafficPercent:100,webhookTrafficPercent:100,callbackClosed:true,writesEnabled:false}' \
            > engagement-evidence/routing.json

      - name: Expose DRS-safe callback after exact corrected candidates own traffic
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --default-url --quiet
          gcloud run services update "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --default-url --no-invoker-iam-check --quiet
          WEBHOOK_JSON="$(gcloud run services describe "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$WEBHOOK_JSON" | jq -e --arg revision "$WEBHOOK_CANDIDATE_REVISION" '
            ((.metadata.annotations["run.googleapis.com/default-url-disabled"] // "false") != "true") and
            ((.metadata.annotations["run.googleapis.com/invoker-iam-disabled"] // "false") == "true") and
            (([.status.traffic[]? | select((.percent // 0) == 100) | .revisionName] | first) == $revision)
          ' >/dev/null
          if gcloud run services get-iam-policy "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            | jq -e '.bindings[]? | select(.role == "roles/run.invoker") | (.members // [])[]? | select(. == "allUsers")' >/dev/null; then
            echo 'DRS-safe callback must not add allUsers' >&2
            exit 1
          fi
          WEBHOOK_URL="$(printf '%s' "$WEBHOOK_JSON" | jq -r '.status.url // empty')"
          test -n "$WEBHOOK_URL"
          echo "WEBHOOK_URL=$WEBHOOK_URL" >> "$GITHUB_ENV"

      - name: Prove COMMENT and DIRECT on corrected runtime with authenticated ticks
        shell: bash
        run: |
          set -euo pipefail
          JOB="toca-ig-eng-corrected-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TICK_PID=''
          cleanup() {
            if [[ -n "$TICK_PID" ]]; then kill "$TICK_PID" >/dev/null 2>&1 || true; wait "$TICK_PID" >/dev/null 2>&1 || true; fi
            gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          gcloud run jobs deploy "$JOB" \
            --image "$RUNTIME_IMAGE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest,META_APP_SECRET=$META_APP_SECRET_ID:latest" \
            --set-env-vars "NODE_ENV=production,INSTAGRAM_ENGAGEMENT_SHADOW_WEBHOOK_URL=$WEBHOOK_URL,INSTAGRAM_BUSINESS_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID,INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=false" \
            --command node --args dist/src/ops/instagram-engagement-shadow-proof.js \
            --tasks 1 --max-retries 0 --task-timeout 240s --quiet

          tick_pump() {
            sleep 8
            for attempt in $(seq 1 20); do
              gcloud scheduler jobs run "$SCHEDULER_JOB_NAME" --project "$GCP_PROJECT_ID" --location "$GCP_REGION" --quiet || return 1
              sleep 10
            done
          }
          tick_pump &
          TICK_PID=$!

          set +e
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet
          PROOF_RC=$?
          set -e
          kill "$TICK_PID" >/dev/null 2>&1 || true
          wait "$TICK_PID" >/dev/null 2>&1 || true
          TICK_PID=''

          LOG_ENTRIES="$(gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${JOB}\"" --project "$GCP_PROJECT_ID" --freshness=20m --limit=300 --order=asc --format=json || true)"
          if [[ "$PROOF_RC" -ne 0 ]]; then
            jq -n --argjson exitCode "$PROOF_RC" --arg daemon "$DAEMON_CANDIDATE_REVISION" --arg webhook "$WEBHOOK_CANDIDATE_REVISION" \
              '{schemaVersion:"toca.instagram-engagement.corrected-runtime-shadow-proof-failure.v1",proofJobExitCode:$exitCode,daemonCandidateRevision:$daemon,webhookCandidateRevision:$webhook,writesEnabled:false}' \
              > engagement-evidence/proof-failure.json
            exit "$PROOF_RC"
          fi

          PROOF="$(printf '%s' "$LOG_ENTRIES" | node scripts/extract-instagram-engagement-cloud-run-evidence.mjs instagram-engagement-shadow-e2e)"
          printf '%s' "$PROOF" | jq -e '.status == "PASS" and (.channelsVerified | sort == ["COMMENT","DIRECT"]) and .webhookAccepted == true and .inboundDelivered == true and .faqResolved == true and .externalReplyObserved == false and .replyOutboxEvents == 0 and .writesEnabled == false' >/dev/null
          printf '%s\n' "$PROOF" > engagement-evidence/shadow-proof.json
          cleanup
          trap - EXIT

      - name: Publish corrected runtime shadow closeout
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg controllerSha "$GITHUB_SHA" --arg runtimeSha "$RUNTIME_SOURCE_SHA" --arg digest "$RUNTIME_IMAGE_DIGEST" --arg daemon "$DAEMON_CANDIDATE_REVISION" --arg webhook "$WEBHOOK_CANDIDATE_REVISION" \
            '{schemaVersion:"toca.instagram-engagement.corrected-runtime-shadow-closeout.v1",controllerSha:$controllerSha,runtimeSourceSha:$runtimeSha,runtimeImageDigest:$digest,daemonCandidateRevision:$daemon,webhookCandidateRevision:$webhook,channels:["COMMENT","DIRECT"],syntheticShadowProof:"PASS",inboundDelivered:true,faqResolved:true,externalReplyWritesEnabled:false,replyOutboxEvents:0}' \
            > engagement-evidence/closeout.json

          printf -v COMMENT '%s\n' \
            'CORRECTED_RUNTIME_SHADOW_STATUS=PASS' \
            "CONTROLLER_SHA=$GITHUB_SHA" \
            "RUNTIME_SOURCE_SHA=$RUNTIME_SOURCE_SHA" \
            "RUNTIME_IMAGE_DIGEST=$RUNTIME_IMAGE_DIGEST" \
            "DAEMON_CANDIDATE_REVISION=$DAEMON_CANDIDATE_REVISION" \
            "WEBHOOK_CANDIDATE_REVISION=$WEBHOOK_CANDIDATE_REVISION" \
            'CHANNELS_VERIFIED=COMMENT,DIRECT' \
            'INBOUND_DELIVERED=true' \
            'FAQ_RESOLVED=true' \
            'REPLY_OUTBOX_EVENTS=0' \
            'EXTERNAL_REPLY_WRITES=false'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${AUTHORIZATION_ISSUE_NUMBER}/comments" -f body="$COMMENT" >/dev/null
          cat engagement-evidence/closeout.json >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back corrected runtime shadow on failure
        if: failure()
        shell: bash
        run: |
          set +e
          if [[ -n "${PREVIOUS_DAEMON_REVISION:-}" ]]; then
            gcloud run services update-traffic "$DAEMON_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions="${PREVIOUS_DAEMON_REVISION}=100" --quiet
          fi
          if [[ -n "${PREVIOUS_WEBHOOK_REVISION:-}" ]]; then
            gcloud run services update-traffic "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions="${PREVIOUS_WEBHOOK_REVISION}=100" --quiet
          fi
          gcloud run services update "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --no-default-url --quiet
          gcloud run services update "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --no-default-url --invoker-iam-check --quiet
          gcloud run services remove-iam-policy-binding "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --member=allUsers --role=roles/run.invoker --quiet >/dev/null 2>&1 || true
          echo 'ROLLBACK_ATTEMPTED=true' >> "$GITHUB_STEP_SUMMARY"
          echo 'EXTERNAL_REPLY_WRITES=false' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized corrected runtime shadow evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instagram-engagement-corrected-runtime-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: engagement-evidence/
          if-no-files-found: warn
          retention-days: 90
