name: R28 Google Ads Readiness Metadata

on:
  push:
    branches:
      - ops/r28-google-ads-provider-closeout-20260816
    paths:
      - '.github/workflows/r28-google-ads-readiness-v2.yml'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  CLOUD_RUN_SERVICE: toca-mcp-production

jobs:
  metadata:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Capture sanitized runtime/provider metadata
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > /tmp/service.json
          jq '{
            schemaVersion: 2,
            service: .metadata.name,
            latestReadyRevision: .status.latestReadyRevisionName,
            image: .spec.template.spec.containers[0].image,
            googleAdsEnv: [
              .spec.template.spec.containers[0].env[]?
              | select(.name | startswith("GOOGLE_ADS_") or startswith("TOCA_SECRET_GOOGLE_ADS"))
              | {
                  name,
                  value: (.value // null),
                  secretRef: ((.valueFrom.secretKeyRef.name // .valueSource.secretKeyRef.secret // null)),
                  secretVersion: ((.valueFrom.secretKeyRef.key // .valueSource.secretKeyRef.version // null))
                }
            ]
          }' /tmp/service.json > r28-google-ads-readiness-v2.json

          SECRETS="$(gcloud secrets list --project "$GCP_PROJECT_ID" --format='value(name)' | grep -Ei 'google.*ads|ads.*google' || true)"
          jq --arg secrets "$SECRETS" '. + {googleAdsSecretCandidates: ($secrets | split("\n") | map(select(length > 0)))}' r28-google-ads-readiness-v2.json > /tmp/out.json
          mv /tmp/out.json r28-google-ads-readiness-v2.json
          cat r28-google-ads-readiness-v2.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r28-google-ads-readiness-v2-${{ github.sha }}
          path: r28-google-ads-readiness-v2.json
          if-no-files-found: error
          retention-days: 90
