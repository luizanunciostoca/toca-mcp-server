name: R29 Reconcile Once

on:
  push:
    branches: [feat/r29-video-reconciliation-final]
    paths:
      - scripts/reconcile-r29-runtime.mjs
      - .github/workflows/r29-reconcile-once.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/r29-video-reconciliation-final
          fetch-depth: 0
      - name: Apply deterministic R29 runtime reconciliation
        run: node scripts/reconcile-r29-runtime.mjs
      - name: Remove one-shot reconciliation assets
        run: rm scripts/reconcile-r29-runtime.mjs .github/workflows/r29-reconcile-once.yml
      - name: Commit reconciled implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(r29): bind video content through current TOCA Core"
          git push origin HEAD:feat/r29-video-reconciliation-final
