name: AG-01 Enable Sheets API

on:
  push:
    branches:
      - ops/ag01-vertex-permanent-binding-20260828
    paths:
      - '.github/workflows/ag01-enable-sheets-api.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Enable and verify Sheets API
        run: |
          set -euo pipefail
          gcloud services enable sheets.googleapis.com --project "$PROJECT_ID" --quiet
          gcloud services list --enabled --project "$PROJECT_ID" --filter='config.name:sheets.googleapis.com' --format='value(config.name)' | grep -x 'sheets.googleapis.com'
