name: Monitoring Admin Readback 2026-08-16

on:
  push:
    branches: [ops/cloud-sql-dr-drill-v3-20260816]
    paths: ['.github/workflows/monitoring-admin-readback-20260816.yml']

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: toca-mcp-production
  INFRA_SA: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com
  WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp

jobs:
  readback:
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.INFRA_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Test Monitoring permissions and inventory only
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          cat >/tmp/req.json <<'JSON'
          {"permissions":["monitoring.notificationChannels.list","monitoring.notificationChannels.get","monitoring.notificationChannels.create","monitoring.notificationChannels.update","monitoring.alertPolicies.list","monitoring.alertPolicies.get","monitoring.alertPolicies.create","monitoring.alertPolicies.update"]}
          JSON
          IAM_HTTP="$(curl --silent --output /tmp/perms.json --write-out '%{http_code}' -X POST -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/req.json "https://cloudresourcemanager.googleapis.com/v1/projects/${GCP_PROJECT_ID}:testIamPermissions")"
          test "$IAM_HTTP" = 200
          CH_HTTP="$(curl --silent --output /tmp/channels.json --write-out '%{http_code}' -H "Authorization: Bearer ${TOKEN}" "https://monitoring.googleapis.com/v3/projects/${GCP_PROJECT_ID}/notificationChannels")"
          AP_HTTP="$(curl --silent --output /tmp/policies.json --write-out '%{http_code}' -H "Authorization: Bearer ${TOKEN}" "https://monitoring.googleapis.com/v3/projects/${GCP_PROJECT_ID}/alertPolicies")"
          GRANTED="$(jq -c '(.permissions // [])|sort' /tmp/perms.json)"
          jq -n --argjson granted "$GRANTED" --argjson channelHttp "$CH_HTTP" --argjson policyHttp "$AP_HTTP" --argjson channels "$(jq '(.notificationChannels // [])|length' /tmp/channels.json 2>/dev/null || echo 0)" --argjson policies "$(jq '(.alertPolicies // [])|length' /tmp/policies.json 2>/dev/null || echo 0)" --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{schemaVersion:1,grantedPermissions:$granted,notificationChannels:{httpStatus:$channelHttp,count:$channels},alertPolicies:{httpStatus:$policyHttp,count:$policies},verifiedAt:$verifiedAt}' > monitoring-admin-readback.json
          echo "MONITORING_ADMIN_READBACK channel_http=$CH_HTTP policy_http=$AP_HTTP granted=$GRANTED"
          test "$CH_HTTP" = 200
          test "$AP_HTTP" = 200
          for P in monitoring.notificationChannels.list monitoring.notificationChannels.get monitoring.notificationChannels.create monitoring.notificationChannels.update monitoring.alertPolicies.list monitoring.alertPolicies.get monitoring.alertPolicies.create monitoring.alertPolicies.update; do jq -e --arg p "$P" '(.permissions // []) | index($p) != null' /tmp/perms.json >/dev/null; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: monitoring-admin-readback-${{ github.sha }}
          path: monitoring-admin-readback.json
          if-no-files-found: warn
          retention-days: 90
