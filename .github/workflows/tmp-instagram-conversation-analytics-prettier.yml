name: Temporary Instagram Conversation Analytics Prettier

on:
  push:
    branches:
      - codex/instagram-conversation-hardening-v3

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/instagram-conversation-hardening-v3
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format scoped analytics only
        run: pnpm exec prettier --write src/instagram-engagement/conversation-analytics-scoped.ts
      - name: Commit formatter result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/instagram-engagement/conversation-analytics-scoped.ts
          git diff --cached --quiet && exit 0
          git commit -m 'style(instagram): format scoped conversation analytics'
          git push origin HEAD:codex/instagram-conversation-hardening-v3
