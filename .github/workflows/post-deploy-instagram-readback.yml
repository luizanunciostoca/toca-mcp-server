name: Temporary post-deploy Instagram readback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/post-deploy-instagram-readback.yml'

permissions:
  contents: read
  id-token: write
  issues: write

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  DAEMON_SERVICE_NAME: toca-managed-instagram-daemon
  MCP_SERVICE_NAME: toca-mcp-production
  SCHEDULER_JOB_NAME: toca-managed-instagram-tick
  EXPECTED_SHA: 9152c54fc129dc51a8cbd0c12fbbe25659d9a60a
  EXPECTED_INSTAGRAM_ACCOUNT_ID: '17841402033495654'

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Publish diagnostic heartbeat
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/9/comments" \
            -f body="POST_DEPLOY_READBACK_STARTED run_id=${GITHUB_RUN_ID} run_attempt=${GITHUB_RUN_ATTEMPT} main_sha=${GITHUB_SHA} expected_deploy_sha=${EXPECTED_SHA}"

      - name: Authenticate readback to Google Cloud
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        id: gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Verify exact deployed revision and scheduler
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          expected_suffix=":toca-managed-daemon-${EXPECTED_SHA}"
          status="FAIL"
          reason="exact deployment not observed before timeout"
          daemon_ok=false
          mcp_ok=false
          scheduler_ok=false
          daemon_json='{}'
          mcp_json='{}'
          scheduler_json='{}'

          for attempt in $(seq 1 36); do
            daemon_json="$(gcloud run services describe "$DAEMON_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json 2>/dev/null || printf '{}')"
            mcp_json="$(gcloud run services describe "$MCP_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json 2>/dev/null || printf '{}')"
            scheduler_json="$(gcloud scheduler jobs describe "$SCHEDULER_JOB_NAME" --project "$GCP_PROJECT_ID" --location "$GCP_REGION" --format=json 2>/dev/null || printf '{}')"

            daemon_image="$(printf '%s' "$daemon_json" | jq -r '.spec.template.spec.containers[0].image // ""')"
            mcp_image="$(printf '%s' "$mcp_json" | jq -r '.spec.template.spec.containers[0].image // ""')"
            daemon_ok=false
            mcp_ok=false
            scheduler_ok=false

            if [[ "$daemon_image" == *"$expected_suffix" ]] && printf '%s' "$daemon_json" | jq -e '
              .spec.template.spec.containers[0] as $c |
              ([$c.env[] | select(.name == "MCP_ENABLED") | .value] == ["false"]) and
              ([$c.env[] | select(.name == "TOCA_MANAGED_INSTAGRAM_SCHEDULER_ENABLED") | .value] == ["true"]) and
              ([$c.env[] | select(.name == "TOCA_MANAGED_INSTAGRAM_EXECUTOR_ENABLED") | .value] == ["true"]) and
              ([$c.env[] | select(.name == "INSTAGRAM_PUBLICATION_WRITES_ENABLED") | .value] == ["false"]) and
              ([.status.conditions[]? | select(.type == "Ready") | .status] | index("True") != null)
            ' >/dev/null; then daemon_ok=true; fi

            if [[ "$mcp_image" == *"$expected_suffix" ]] && printf '%s' "$mcp_json" | jq -e --arg ig "$EXPECTED_INSTAGRAM_ACCOUNT_ID" '
              .spec.template.spec.containers[0] as $c |
              ([$c.env[] | select(.name == "MCP_ENABLED") | .value] == ["true"]) and
              ([$c.env[] | select(.name == "TOCA_MANAGED_INSTAGRAM_SCHEDULER_ENABLED") | .value] == ["true"]) and
              ([$c.env[] | select(.name == "TOCA_MANAGED_INSTAGRAM_EXECUTOR_ENABLED") | .value] == ["false"]) and
              ([$c.env[] | select(.name == "INSTAGRAM_PUBLICATION_WRITES_ENABLED") | .value] == ["true"]) and
              ([$c.env[] | select(.name == "INSTAGRAM_BUSINESS_ACCOUNT_ID") | .value] == [$ig]) and
              ([$c.env[] | select(.name == "META_ENABLED") | .value] == ["false"]) and
              ([$c.env[] | select(.name == "META_ACCESS_TOKEN_ENV_KEY") | .value] == ["TOCA_SECRET_META_ACCESS_TOKEN"]) and
              ([.status.conditions[]? | select(.type == "Ready") | .status] | index("True") != null)
            ' >/dev/null; then mcp_ok=true; fi

            if printf '%s' "$scheduler_json" | jq -e '
              (.schedule == "* * * * *") and
              (.timeZone == "America/Bahia") and
              (.state == "ENABLED") and
              (.httpTarget.httpMethod == "POST") and
              (.attemptDeadline == "120s")
            ' >/dev/null; then scheduler_ok=true; fi

            if [[ "$daemon_ok" == true && "$mcp_ok" == true && "$scheduler_ok" == true ]]; then
              status="PASS"
              reason="exact production revision, runtime boundary, and scheduler verified"
              break
            fi
            sleep 5
          done

          daemon_image="$(printf '%s' "$daemon_json" | jq -r '.spec.template.spec.containers[0].image // ""')"
          daemon_revision="$(printf '%s' "$daemon_json" | jq -r '.status.latestReadyRevisionName // ""')"
          mcp_image="$(printf '%s' "$mcp_json" | jq -r '.spec.template.spec.containers[0].image // ""')"
          mcp_revision="$(printf '%s' "$mcp_json" | jq -r '.status.latestReadyRevisionName // ""')"
          scheduler_state="$(printf '%s' "$scheduler_json" | jq -r '.state // ""')"

          {
            echo "status=$status"
            echo "reason=$reason"
            echo "daemon_ok=$daemon_ok"
            echo "mcp_ok=$mcp_ok"
            echo "scheduler_ok=$scheduler_ok"
            echo "daemon_image=$daemon_image"
            echo "daemon_revision=$daemon_revision"
            echo "mcp_image=$mcp_image"
            echo "mcp_revision=$mcp_revision"
            echo "scheduler_state=$scheduler_state"
          } >> "$GITHUB_OUTPUT"

      - name: Publish final diagnostic result
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          GCLOUD_OUTCOME: ${{ steps.gcloud.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          RESULT_STATUS: ${{ steps.verify.outputs.status }}
          RESULT_REASON: ${{ steps.verify.outputs.reason }}
          DAEMON_OK: ${{ steps.verify.outputs.daemon_ok }}
          MCP_OK: ${{ steps.verify.outputs.mcp_ok }}
          SCHEDULER_OK: ${{ steps.verify.outputs.scheduler_ok }}
          DAEMON_IMAGE: ${{ steps.verify.outputs.daemon_image }}
          DAEMON_REVISION: ${{ steps.verify.outputs.daemon_revision }}
          MCP_IMAGE: ${{ steps.verify.outputs.mcp_image }}
          MCP_REVISION: ${{ steps.verify.outputs.mcp_revision }}
          SCHEDULER_STATE: ${{ steps.verify.outputs.scheduler_state }}
        shell: bash
        run: |
          body=$(cat <<EOF
          POST_DEPLOY_READBACK_RESULT
          run_id=${GITHUB_RUN_ID}
          auth_outcome=${AUTH_OUTCOME}
          gcloud_outcome=${GCLOUD_OUTCOME}
          verify_outcome=${VERIFY_OUTCOME}
          status=${RESULT_STATUS:-NOT_RUN}
          reason=${RESULT_REASON:-verification step did not produce output}
          daemon_verified=${DAEMON_OK:-false}
          daemon_image=${DAEMON_IMAGE:-unknown}
          daemon_revision=${DAEMON_REVISION:-unknown}
          mcp_verified=${MCP_OK:-false}
          mcp_image=${MCP_IMAGE:-unknown}
          mcp_revision=${MCP_REVISION:-unknown}
          scheduler_verified=${SCHEDULER_OK:-false}
          scheduler_state=${SCHEDULER_STATE:-unknown}
          expected_deploy_sha=${EXPECTED_SHA}
          read_only_cloud_inspection=true
          publication_executed=false
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/9/comments" -f body="$body"

      - name: Enforce exact readback
        if: always()
        env:
          RESULT_STATUS: ${{ steps.verify.outputs.status }}
        shell: bash
        run: test "$RESULT_STATUS" = "PASS"
