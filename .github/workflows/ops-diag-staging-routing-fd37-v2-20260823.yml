name: TEMP Staging Routing Diagnostic fd37 V2 2026-08-23

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  diagnose-routing:
    if: github.head_ref == 'ops/diag-staging-ingress-fd37-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fd3799153cf41b6d573dde8889f355247b7eaf74
          persist-credentials: false
          fetch-depth: 1

      - name: Load exact staging coordinates
        id: config
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'fd3799153cf41b6d573dde8889f355247b7eaf74'
          node scripts/export-staging-deploy-config.mjs infra/environments/staging.json > /tmp/staging.env
          cat /tmp/staging.env >> "$GITHUB_ENV"
          set -a; source /tmp/staging.env; set +a
          test "$GCP_PROJECT_ID" = 'toca-mcp-next-staging'
          test "$GCP_PROJECT_NUMBER" = '729069789107'
          echo "wif=$GCP_WORKLOAD_IDENTITY_PROVIDER" >> "$GITHUB_OUTPUT"
          echo "deployer_sa=$GCP_DEPLOY_SERVICE_ACCOUNT" >> "$GITHUB_OUTPUT"

      - name: Authenticate staging deployer only
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ steps.config.outputs.wif }}
          service_account: ${{ steps.config.outputs.deployer_sa }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Resolve service URL and routing metadata
        id: route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/route
          gcloud run services describe "$GCP_CLOUD_RUN_MCP_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > /tmp/route/service.json
          SERVICE_URL="$(jq -r '.status.url // empty' /tmp/route/service.json)"
          TAG_URL="$(jq -r 'first(.status.traffic[]? | select(.tag == "staging-mcp-fd37991") | .url) // empty' /tmp/route/service.json)"
          URLS_RAW="$(jq -r '.metadata.annotations["run.googleapis.com/urls"] // "[]"' /tmp/route/service.json)"
          TRAFFIC_JSON="$(jq -c '[.status.traffic[]? | {revisionName,tag,percent,url,latestRevision}]' /tmp/route/service.json)"
          test -n "$SERVICE_URL"; test -n "$TAG_URL"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          echo "tag_url=$TAG_URL" >> "$GITHUB_OUTPUT"
          echo "urls_raw=$URLS_RAW" >> "$GITHUB_OUTPUT"
          echo "traffic_json=$TRAFFIC_JSON" >> "$GITHUB_OUTPUT"

      - name: Mint MCP ID token for canonical service URL
        id: auth_token
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ steps.config.outputs.wif }}
          service_account: ${{ steps.config.outputs.deployer_sa }}
          token_format: id_token
          id_token_audience: ${{ steps.route.outputs.service_url }}
          create_credentials_file: false
          export_environment_variables: false

      - name: Classify 404 source and inspect request logging
        env:
          GH_TOKEN: ${{ github.token }}
          MCP_TOKEN: ${{ steps.auth_token.outputs.id_token }}
          SERVICE_URL: ${{ steps.route.outputs.service_url }}
          TAG_URL: ${{ steps.route.outputs.tag_url }}
          URLS_RAW: ${{ steps.route.outputs.urls_raw }}
          TRAFFIC_JSON: ${{ steps.route.outputs.traffic_json }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/probes

          probe() {
            local name="$1" url="$2" mode="$3" code ctype body
            local -a headers=()
            if [[ "$mode" == auth ]]; then headers=(-H "Authorization: Bearer $MCP_TOKEN"); fi
            if [[ "$mode" == xauth ]]; then headers=(-H "X-Serverless-Authorization: Bearer $MCP_TOKEN"); fi
            code="$(curl --silent --show-error -D "/tmp/probes/${name}.headers" -o "/tmp/probes/${name}.body" --write-out '%{http_code}' "${headers[@]}" "$url/healthz" || true)"
            ctype="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/^[^:]+:[[:space:]]*/,""); gsub(/\r/,""); print; exit}' "/tmp/probes/${name}.headers")"
            body="$(head -c 180 "/tmp/probes/${name}.body" | tr '\r\n' '  ' | sed 's/`/'"'"'/g' | tr -cd '[:print:]')"
            printf '%s_HTTP=%s\n%s_CONTENT_TYPE=%s\n%s_BODY_PREFIX=%s\n' "$name" "$code" "$name" "${ctype:-none}" "$name" "${body:-empty}" >> /tmp/probes/results.env
          }

          probe TAG_AUTH "$TAG_URL" auth
          probe TAG_XAUTH "$TAG_URL" xauth
          probe SERVICE_AUTH "$SERVICE_URL" auth

          : > /tmp/probes/aliases.txt
          if jq -e . >/dev/null 2>&1 <<<"$URLS_RAW"; then
            while IFS= read -r base; do
              [[ -n "$base" ]] || continue
              host="${base#https://}"
              alias="https://staging-mcp-fd37991---${host}"
              echo "$alias" >> /tmp/probes/aliases.txt
            done < <(jq -r '.[]?' <<<"$URLS_RAW")
          fi
          sort -u /tmp/probes/aliases.txt -o /tmp/probes/aliases.txt
          alias_index=0
          while IFS= read -r alias; do
            [[ -n "$alias" ]] || continue
            alias_index=$((alias_index + 1))
            [[ $alias_index -le 3 ]] || break
            probe "ALIAS${alias_index}_AUTH" "$alias" auth
          done < /tmp/probes/aliases.txt

          LOG_ACCESS=PASS
          if gcloud logging read "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$GCP_CLOUD_RUN_MCP_SERVICE\" AND resource.labels.revision_name=\"toca-mcp-next-staging-mcp-fd379915\" AND httpRequest.requestUrl:\"healthz\"" --project "$GCP_PROJECT_ID" --freshness=10m --limit=50 --format=json > /tmp/probes/request-logs.json 2>/tmp/probes/log-error.txt; then
            REQUEST_LOG_COUNT="$(jq 'length' /tmp/probes/request-logs.json)"
            REQUEST_LOG_STATUSES="$(jq -c '[.[].httpRequest.status] | unique' /tmp/probes/request-logs.json)"
          else
            LOG_ACCESS=DENIED
            REQUEST_LOG_COUNT=unknown
            REQUEST_LOG_STATUSES=unknown
          fi

          source /tmp/probes/results.env
          ALIASES_COUNT="$(wc -l < /tmp/probes/aliases.txt | tr -d ' ')"
          ALIAS1_AUTH_HTTP="${ALIAS1_AUTH_HTTP:-not_tested}"
          ALIAS1_AUTH_CONTENT_TYPE="${ALIAS1_AUTH_CONTENT_TYPE:-not_tested}"
          ALIAS1_AUTH_BODY_PREFIX="${ALIAS1_AUTH_BODY_PREFIX:-not_tested}"
          ALIAS2_AUTH_HTTP="${ALIAS2_AUTH_HTTP:-not_tested}"
          ALIAS2_AUTH_CONTENT_TYPE="${ALIAS2_AUTH_CONTENT_TYPE:-not_tested}"
          ALIAS2_AUTH_BODY_PREFIX="${ALIAS2_AUTH_BODY_PREFIX:-not_tested}"

          cat > /tmp/comment.md <<EOF
          STAGING_ROUTING_DIAG_V2 RUN_ID=${GITHUB_RUN_ID} CANDIDATE=fd3799153cf41b6d573dde8889f355247b7eaf74

          TRAFFIC=${TRAFFIC_JSON}
          REGISTERED_SERVICE_URLS=${URLS_RAW}
          DERIVED_TAG_ALIAS_COUNT=${ALIASES_COUNT}

          TAG_AUTH_HTTP=${TAG_AUTH_HTTP}
          TAG_AUTH_CONTENT_TYPE=${TAG_AUTH_CONTENT_TYPE}
          TAG_AUTH_BODY_PREFIX=${TAG_AUTH_BODY_PREFIX}
          TAG_XAUTH_HTTP=${TAG_XAUTH_HTTP}
          TAG_XAUTH_CONTENT_TYPE=${TAG_XAUTH_CONTENT_TYPE}
          TAG_XAUTH_BODY_PREFIX=${TAG_XAUTH_BODY_PREFIX}
          SERVICE_AUTH_HTTP=${SERVICE_AUTH_HTTP}
          SERVICE_AUTH_CONTENT_TYPE=${SERVICE_AUTH_CONTENT_TYPE}
          SERVICE_AUTH_BODY_PREFIX=${SERVICE_AUTH_BODY_PREFIX}
          ALIAS1_AUTH_HTTP=${ALIAS1_AUTH_HTTP}
          ALIAS1_AUTH_CONTENT_TYPE=${ALIAS1_AUTH_CONTENT_TYPE}
          ALIAS1_AUTH_BODY_PREFIX=${ALIAS1_AUTH_BODY_PREFIX}
          ALIAS2_AUTH_HTTP=${ALIAS2_AUTH_HTTP}
          ALIAS2_AUTH_CONTENT_TYPE=${ALIAS2_AUTH_CONTENT_TYPE}
          ALIAS2_AUTH_BODY_PREFIX=${ALIAS2_AUTH_BODY_PREFIX}

          CLOUD_LOGGING_ACCESS=${LOG_ACCESS}
          CANDIDATE_HEALTHZ_REQUEST_LOG_COUNT=${REQUEST_LOG_COUNT}
          CANDIDATE_HEALTHZ_REQUEST_LOG_STATUSES=${REQUEST_LOG_STATUSES}

          READ_ONLY=true
          PRODUCTION_ACCESS=false
          PROVIDER_ACCESS=false
          TRAFFIC_MUTATION=false
          IAM_MUTATION=false
          EOF
          gh issue comment 151 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
