name: Instagram Canary Window Controller

on:
  schedule:
    - cron: '25 23 15 9 *'
      timezone: 'America/Bahia'

permissions:
  contents: write
  actions: read

concurrency:
  group: instagram-canary-window-controller-20260915-2330-dispatch-only
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TARGET_DATE: '2026-09-15'
      WINDOW_START: '2026-09-15T23:25:00-03:00'
      FIRST_DISPATCH_DEADLINE: '2026-09-15T23:34:00-03:00'
      SECOND_DISPATCH_DEADLINE: '2026-09-15T23:34:30-03:00'
      TARGET_ITEM: 'MKT-20260917-SUNSET-FEED-0900'
      EXPECTED_SCHEDULED_AT: '2026-09-15T23:30:00-03:00'
      EXPECTED_EXPIRES_AT: '2026-09-15T23:40:00-03:00'
      EXPECTED_ACCOUNT: '17841402033495654'
      EXPECTED_ASSET_SHA256: 'a495fa29db54dc2af24700b0556e8a6d1fb01472c333067c91ee6d613525e4e6'
      EXPECTED_CAPTION_SHA256: 'ae72ec055df7b2025fe08ce6cbf4ceefd2173fbeecfc5a731641a3e3a57a1aed'
      EXPECTED_CORRELATION_ID: 'CORR-MKT-20260917-SUNSET-FEED-0900-ROLLOVER-V1'
      EXPECTED_IDEMPOTENCY_KEY: 'GITHUB_NATIVE_ROLLOVER:MKT-20260917-SUNSET-FEED-0900:V1'
      EXPECTED_REQUEST_FINGERPRINT: '64601769c2fe5cbdb39c6b78b320f2643a32c0067361284aed03d94fd4d4957d'
      LEDGER_PATH: 'publication-state/3e9356148b41946660e2afd80e23b1d6fb220b94666cb01fb07ba65cc700e61e.json'
      SCHEDULE_MODE: ${{ vars.TOCA_GITHUB_NATIVE_PUBLICATION_MODE || 'SHADOW' }}
      SCHEDULE_WRITES: ${{ vars.TOCA_GITHUB_NATIVE_PUBLICATION_WRITES_ENABLED || 'false' }}

    steps:
      - name: Guard one-time governed date and window
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          local_date=$(TZ=America/Bahia date +%F)
          if [ "$local_date" != "$TARGET_DATE" ]; then
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo "ONE_TIME_CONTROLLER_INACTIVE:$local_date"
            exit 0
          fi
          test "$GITHUB_EVENT_NAME" = 'schedule'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')" = "$GITHUB_SHA"
          now=$(date +%s)
          start=$(date -d "$WINDOW_START" +%s)
          deadline=$(date -d "$FIRST_DISPATCH_DEADLINE" +%s)
          if [ "$now" -lt "$start" ]; then
            sleep $((start - now))
            now=$(date +%s)
          fi
          test "$now" -le "$deadline" || { echo 'CANARY_FIRST_DISPATCH_WINDOW_MISSED'; exit 1; }
          echo 'active=true' >> "$GITHUB_OUTPUT"

      - name: Verify schedule remains shadow and writes disabled
        if: steps.guard.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$SCHEDULE_MODE" = 'SHADOW' || { echo "SCHEDULE_MODE_NOT_SHADOW:$SCHEDULE_MODE"; exit 1; }
          test "$SCHEDULE_WRITES" != 'true' || { echo 'SCHEDULE_WRITES_UNEXPECTEDLY_ENABLED'; exit 1; }

      - name: Verify immutable approved queue item on main
        if: steps.guard.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/contents/control/github-native-publication-queue.json?ref=main" --jq '.content' \
            | tr -d '\n' | base64 -d > queue.json
          jq -e \
            --arg item "$TARGET_ITEM" \
            --arg scheduled "$EXPECTED_SCHEDULED_AT" \
            --arg expires "$EXPECTED_EXPIRES_AT" \
            --arg account "$EXPECTED_ACCOUNT" \
            --arg asset "$EXPECTED_ASSET_SHA256" \
            --arg corr "$EXPECTED_CORRELATION_ID" \
            --arg idem "$EXPECTED_IDEMPOTENCY_KEY" \
            '([.items[] | select(.contentItemId == $item)] | length) == 1 and
             (.items[] | select(.contentItemId == $item) |
               .scheduledAt == $scheduled and
               .expiresAt == $expires and
               .operation == "SUNSET" and
               .channel == "INSTAGRAM" and
               .contentStatus == "PRODUCED" and
               .approvalStatus == "APPROVED" and
               .publicationIntent == "SCHEDULED" and
               .mediaType == "IMAGE" and
               .instagramAccountId == $account and
               .asset.sha256 == $asset and
               .creativeTruthBinding.outputSha256 == $asset and
               .creativeTruthBinding.brandIntegrityStatus == "PASSED" and
               .creativeTruthBinding.venueFidelityStatus == "PASSED" and
               .creativeTruthBinding.qualityGateStatus == "PASSED" and
               .creativeTruthBinding.exactAssetBinding == true and
               .correlationId == $corr and
               .idempotencyKey == $idem)' queue.json >/dev/null
          caption=$(jq -r --arg item "$TARGET_ITEM" '.items[] | select(.contentItemId == $item) | .caption' queue.json)
          caption_sha=$(printf '%s' "$caption" | sha256sum | awk '{print $1}')
          test "$caption_sha" = "$EXPECTED_CAPTION_SHA256" || { echo 'CAPTION_SHA_MISMATCH'; exit 1; }

      - name: Verify unambiguous DRAFT ledger precondition
        if: steps.guard.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/contents/$LEDGER_PATH?ref=publication-state" --jq '.content' \
            | tr -d '\n' | base64 -d > ledger-before.json
          jq -e \
            --arg corr "$EXPECTED_CORRELATION_ID" \
            --arg idem "$EXPECTED_IDEMPOTENCY_KEY" \
            --arg fp "$EXPECTED_REQUEST_FINGERPRINT" \
            '.state == "DRAFT" and .correlationId == $corr and .idempotencyKey == $idem and .requestFingerprint == $fp' \
            ledger-before.json >/dev/null

      - name: Dispatch first controlled CANARY once
        if: steps.guard.outputs.active == 'true'
        id: first_dispatch
        shell: bash
        run: |
          set -euo pipefail
          now=$(date +%s)
          deadline=$(date -d "$FIRST_DISPATCH_DEADLINE" +%s)
          test "$now" -le "$deadline" || { echo 'CANARY_FIRST_DISPATCH_WINDOW_MISSED'; exit 1; }
          before=$(date -u +%s)
          jq -n --arg item "$TARGET_ITEM" \
            '{event_type:"github-native-instagram-publish-controlled",client_payload:{mode:"CANARY",writes_enabled:"true",canary_content_item_id:$item}}' \
            | gh api --method POST "repos/$REPO/dispatches" --input -
          echo "before=$before" >> "$GITHUB_OUTPUT"

      - name: Await first publisher run without retry
        if: steps.guard.outputs.active == 'true'
        id: first
        shell: bash
        env:
          BEFORE: ${{ steps.first_dispatch.outputs.before }}
        run: |
          set -euo pipefail
          run_id=''
          for _ in $(seq 1 90); do
            runs=$(gh api "repos/$REPO/actions/runs?event=repository_dispatch&branch=main&per_page=100")
            run_id=$(jq -r --arg sha "$GITHUB_SHA" --argjson before "$BEFORE" \
              '[.workflow_runs[] | select(.name == "GitHub Native Instagram Publisher") | select(.head_sha == $sha) | select((.created_at | fromdateiso8601) >= $before)] | sort_by(.created_at) | last | .id // empty' \
              <<<"$runs")
            [ -n "$run_id" ] && break
            sleep 5
          done
          test -n "$run_id" || { echo 'PUBLISHER_RUN_NOT_FOUND'; exit 1; }
          for _ in $(seq 1 180); do
            run=$(gh api "repos/$REPO/actions/runs/$run_id")
            status=$(jq -r '.status' <<<"$run")
            if [ "$status" = 'completed' ]; then
              conclusion=$(jq -r '.conclusion' <<<"$run")
              test "$conclusion" = 'success' || { echo "PUBLISHER_FAILED:$run_id:$conclusion"; exit 1; }
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo 'PUBLISHER_RUN_TIMEOUT'
          exit 1

      - name: Verify first immutable evidence and PUBLISHED ledger
        if: steps.guard.outputs.active == 'true'
        id: published
        shell: bash
        env:
          RUN_ID: ${{ steps.first.outputs.run_id }}
        run: |
          set -euo pipefail
          rm -rf first-evidence
          gh run download "$RUN_ID" --repo "$REPO" -n "github-native-instagram-${RUN_ID}-1" -D first-evidence
          evidence=$(find first-evidence -name 'github-native-publication-evidence.json' -print -quit)
          test -n "$evidence"
          external=$(jq -r --arg item "$TARGET_ITEM" \
            '.items[] | select(.contentItemId == $item and .outcome == "PUBLISHED_AND_READBACK_VERIFIED") | .externalMediaId // empty' \
            "$evidence")
          test -n "$external" || { echo 'FIRST_CANARY_EVIDENCE_NOT_VERIFIED'; exit 1; }
          jq -e '.mode == "CANARY" and .writesEnabled == true' "$evidence" >/dev/null
          gh api "repos/$REPO/contents/$LEDGER_PATH?ref=publication-state" --jq '.content' \
            | tr -d '\n' | base64 -d > ledger-after.json
          jq -e \
            --arg external "$external" \
            --arg corr "$EXPECTED_CORRELATION_ID" \
            --arg idem "$EXPECTED_IDEMPOTENCY_KEY" \
            '.state == "PUBLISHED" and .externalMediaId == $external and .correlationId == $corr and .idempotencyKey == $idem' \
            ledger-after.json >/dev/null
          echo "external_media_id=$external" >> "$GITHUB_OUTPUT"

      - name: Trigger fresh provider readback only
        if: steps.guard.outputs.active == 'true'
        id: second_dispatch
        shell: bash
        run: |
          set -euo pipefail
          now=$(date +%s)
          deadline=$(date -d "$SECOND_DISPATCH_DEADLINE" +%s)
          test "$now" -le "$deadline" || { echo 'CANARY_SECOND_READBACK_WINDOW_MISSED'; exit 1; }
          before=$(date -u +%s)
          jq -n --arg item "$TARGET_ITEM" \
            '{event_type:"github-native-instagram-publish-controlled",client_payload:{mode:"CANARY",writes_enabled:"true",canary_content_item_id:$item}}' \
            | gh api --method POST "repos/$REPO/dispatches" --input -
          echo "before=$before" >> "$GITHUB_OUTPUT"

      - name: Await reconciliation run without retry
        if: steps.guard.outputs.active == 'true'
        id: second
        shell: bash
        env:
          FIRST_RUN_ID: ${{ steps.first.outputs.run_id }}
          BEFORE: ${{ steps.second_dispatch.outputs.before }}
        run: |
          set -euo pipefail
          run_id=''
          for _ in $(seq 1 90); do
            runs=$(gh api "repos/$REPO/actions/runs?event=repository_dispatch&branch=main&per_page=100")
            run_id=$(jq -r --arg sha "$GITHUB_SHA" --arg first "$FIRST_RUN_ID" --argjson before "$BEFORE" \
              '[.workflow_runs[] | select(.name == "GitHub Native Instagram Publisher") | select(.head_sha == $sha) | select((.id | tostring) != $first) | select((.created_at | fromdateiso8601) >= $before)] | sort_by(.created_at) | last | .id // empty' \
              <<<"$runs")
            [ -n "$run_id" ] && break
            sleep 5
          done
          test -n "$run_id" || { echo 'RECONCILIATION_RUN_NOT_FOUND'; exit 1; }
          for _ in $(seq 1 180); do
            run=$(gh api "repos/$REPO/actions/runs/$run_id")
            status=$(jq -r '.status' <<<"$run")
            if [ "$status" = 'completed' ]; then
              conclusion=$(jq -r '.conclusion' <<<"$run")
              test "$conclusion" = 'success' || { echo "RECONCILIATION_FAILED:$run_id:$conclusion"; exit 1; }
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo 'RECONCILIATION_TIMEOUT'
          exit 1

      - name: Verify fresh readback evidence
        if: steps.guard.outputs.active == 'true'
        shell: bash
        env:
          RUN_ID: ${{ steps.second.outputs.run_id }}
          EXPECTED_EXTERNAL: ${{ steps.published.outputs.external_media_id }}
        run: |
          set -euo pipefail
          rm -rf second-evidence
          gh run download "$RUN_ID" --repo "$REPO" -n "github-native-instagram-${RUN_ID}-1" -D second-evidence
          evidence=$(find second-evidence -name 'github-native-publication-evidence.json' -print -quit)
          test -n "$evidence"
          jq -e \
            --arg item "$TARGET_ITEM" \
            --arg external "$EXPECTED_EXTERNAL" \
            '.mode == "CANARY" and .writesEnabled == true and (.items[] | select(.contentItemId == $item and .outcome == "RECONCILED_ALREADY_PUBLISHED_READBACK_VERIFIED" and .externalMediaId == $external))' \
            "$evidence" >/dev/null

      - name: Record successful controlled completion
        if: steps.guard.outputs.active == 'true'
        shell: bash
        env:
          FIRST_RUN_ID: ${{ steps.first.outputs.run_id }}
          SECOND_RUN_ID: ${{ steps.second.outputs.run_id }}
          EXTERNAL_MEDIA_ID: ${{ steps.published.outputs.external_media_id }}
        run: |
          set -euo pipefail
          echo "CANARY_ACCEPTED item=$TARGET_ITEM external_media_id=$EXTERNAL_MEDIA_ID first_run=$FIRST_RUN_ID reconciliation_run=$SECOND_RUN_ID"
