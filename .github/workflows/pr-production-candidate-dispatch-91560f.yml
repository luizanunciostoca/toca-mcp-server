name: PR Production Infra Readback 91560f

on:
  pull_request:
    branches: [ops/base-91560f-readbacks-20260823]
    paths:
      - '.github/workflows/pr-production-candidate-dispatch-91560f.yml'

permissions:
  contents: read
  id-token: write
  issues: write

env:
  CANDIDATE_SHA: 91560f21856012b367efb9513044004a978ba6c9
  PROJECT_ID: toca-mcp-production
  PROJECT_NUMBER: '990081828836'
  REGION: southamerica-east1
  WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  INFRA_ADMIN_SA: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com
  DATABASE_SECRET_ID: toca-database-url
  AUTH_ISSUE: '205'

jobs:
  readback:
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 20
    steps:
      - name: Exact candidate guard before privileged readback
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | awk '{print $1}')"
          test "$MAIN_SHA" = "$CANDIDATE_SHA"
          test "$PROJECT_ID" = toca-mcp-production
          test "$PROJECT_NUMBER" = 990081828836

      - name: Authenticate existing production infrastructure admin
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.INFRA_ADMIN_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Read secret version metadata and existing service accounts only
        id: inventory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)" = "$INFRA_ADMIN_SA"
          test "$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')" = "$PROJECT_NUMBER"

          SECRET_NAME="$(gcloud secrets versions describe latest --secret="$DATABASE_SECRET_ID" --project="$PROJECT_ID" --format='value(name)')"
          [[ "$SECRET_NAME" =~ /versions/([0-9]+)$ ]]
          SECRET_VERSION="${BASH_REMATCH[1]}"
          [[ "$SECRET_VERSION" =~ ^[0-9]+$ ]]

          gcloud iam service-accounts list --project="$PROJECT_ID" --format=json >/tmp/service-accounts.json
          SA_EMAILS="$(jq -r '.[].email' /tmp/service-accounts.json | sort)"
          MCP_RUNTIME_MATCH="$(printf '%s\n' "$SA_EMAILS" | grep -Fx 'toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com' || true)"
          test -n "$MCP_RUNTIME_MATCH"
          NEXT_SAS="$(printf '%s\n' "$SA_EMAILS" | grep -E 'next|webhook|mcp-runtime' | paste -sd, - || true)"

          BODY=$(cat <<EOF
          PRODUCTION_INFRA_READBACK=PASS
          candidate=${CANDIDATE_SHA}
          database_secret_id=${DATABASE_SECRET_ID}
          database_secret_numeric_version=${SECRET_VERSION}
          existing_runtime_identity=toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
          matching_runtime_service_accounts=${NEXT_SAS:-none}
          secret_payload_read=NO
          iam_mutation_executed=NO
          production_runtime_mutation_executed=NO
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/${AUTH_ISSUE}/comments" -f body="$BODY" >/dev/null
          echo "$BODY"
