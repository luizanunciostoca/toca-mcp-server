name: PR Production Bootstrap Preflight 91560f

on:
  pull_request:
    branches: [ops/base-91560f-readbacks-20260823]
    paths:
      - '.github/workflows/pr-production-candidate-dispatch-91560f.yml'

permissions:
  contents: read
  id-token: write
  issues: write
  actions: write

env:
  CANDIDATE_SHA: 91560f21856012b367efb9513044004a978ba6c9
  PROJECT_ID: toca-mcp-production
  PROJECT_NUMBER: '990081828836'
  REGION: southamerica-east1
  WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  DEPLOYER_SA: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  DATABASE_SECRET_ID: toca-database-url
  AUTH_ISSUE: '205'

jobs:
  bootstrap-preflight:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Fail closed on exact candidate
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | awk '{print $1}')"
          test "$MAIN_SHA" = "$CANDIDATE_SHA"
          test "$PROJECT_ID" = toca-mcp-production
          test "$PROJECT_NUMBER" = 990081828836

      - name: Authenticate production deployer
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Resolve exact numeric database secret version without disclosure
        id: secret
        shell: bash
        run: |
          set -euo pipefail
          VERSION=''
          if META="$(gcloud secrets versions describe latest --secret="$DATABASE_SECRET_ID" --project="$PROJECT_ID" --format='value(name)' 2>/dev/null)" && [[ "$META" =~ /versions/([0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            TOKEN="$(gcloud auth print-access-token)"
            umask 077
            HTTP="$(curl --silent --show-error --output /tmp/secret-access.json --write-out '%{http_code}' -H "Authorization: Bearer ${TOKEN}" "https://secretmanager.googleapis.com/v1/projects/${PROJECT_ID}/secrets/${DATABASE_SECRET_ID}/versions/latest:access")"
            unset TOKEN
            test "$HTTP" = 200
            NAME="$(jq -r '.name // empty' /tmp/secret-access.json)"
            [[ "$NAME" =~ /versions/([0-9]+)$ ]]
            VERSION="${BASH_REMATCH[1]}"
            rm -f /tmp/secret-access.json
          fi
          [[ "$VERSION" =~ ^[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "PRODUCTION_DB_SECRET_PINNED_VERSION=$VERSION"

      - name: Probe GitHub production environment variable API read access
        id: vars
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          gh api "repos/${GITHUB_REPOSITORY}/environments/production/variables" --paginate >/tmp/env-vars.json 2>/tmp/env-vars.err
          RC=$?
          set -e
          if [[ "$RC" -eq 0 ]]; then
            NAMES="$(jq -r '.variables[]?.name' /tmp/env-vars.json | sort | paste -sd, -)"
            echo 'readable=true' >> "$GITHUB_OUTPUT"
            echo "PRODUCTION_ENV_VARIABLE_API_READ=PASS names=${NAMES:-none}"
          else
            echo 'readable=false' >> "$GITHUB_OUTPUT"
            echo 'PRODUCTION_ENV_VARIABLE_API_READ=DENIED'
            cat /tmp/env-vars.err >&2 || true
          fi

      - name: Record sanitized bootstrap result
        env:
          GH_TOKEN: ${{ github.token }}
          DB_VERSION: ${{ steps.secret.outputs.version }}
          VAR_API_READABLE: ${{ steps.vars.outputs.readable }}
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          PRODUCTION_BOOTSTRAP_PREFLIGHT=PASS
          candidate=${CANDIDATE_SHA}
          database_secret=${DATABASE_SECRET_ID}
          database_secret_numeric_version=${DB_VERSION}
          github_environment_variable_api_readable=${VAR_API_READABLE}
          secret_payload_disclosed=NO
          production_mutation_executed=NO
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/${AUTH_ISSUE}/comments" -f body="$BODY" >/dev/null
          echo "$BODY"
