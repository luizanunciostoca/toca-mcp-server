name: PR Production DB Secret Version Resolver 91560f

on:
  pull_request:
    branches: [ops/base-91560f-readbacks-20260823]
    paths:
      - '.github/workflows/pr-production-candidate-dispatch-91560f.yml'

permissions:
  contents: read
  id-token: write
  issues: write

env:
  CANDIDATE_SHA: 91560f21856012b367efb9513044004a978ba6c9
  PROJECT_ID: toca-mcp-production
  PROJECT_NUMBER: '990081828836'
  REGION: southamerica-east1
  WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  DEPLOYER_SA: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  RUNTIME_SA: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  DATABASE_SECRET_ID: toca-database-url
  CURRENT_IMAGE: southamerica-east1-docker.pkg.dev/toca-mcp-production/toca-mcp/server:toca-managed-daemon-d36195f24e15a101edb70a48b267b23ebcc8ec94
  AUTH_ISSUE: '205'

jobs:
  resolve:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Exact candidate guard
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | awk '{print $1}')"
          test "$MAIN_SHA" = "$CANDIDATE_SHA"

      - name: Authenticate canonical production deployer
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Resolve latest DB secret to numeric version under runtime identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)" = "$DEPLOYER_SA"
          test "$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')" = "$PROJECT_NUMBER"
          JOB="toca-prod-secret-version-${GITHUB_RUN_ID}"
          cleanup() {
            gcloud run jobs delete "$JOB" --project="$PROJECT_ID" --region="$REGION" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          SCRIPT='const h={"Metadata-Flavor":"Google"};const tr=await fetch("http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token",{headers:h});if(!tr.ok)throw new Error(`metadata_${tr.status}`);const t=await tr.json();const u=`https://secretmanager.googleapis.com/v1/projects/${process.env.PROJECT_ID}/secrets/${process.env.SECRET_ID}/versions/latest:access`;const r=await fetch(u,{headers:{Authorization:`Bearer ${t.access_token}`}});if(!r.ok)throw new Error(`secret_access_${r.status}`);const j=await r.json();const n=j.name||"";delete j.payload;const m=/\/versions\/([0-9]+)$/.exec(n);if(!m)throw new Error("numeric_version_unresolved");console.log(`DATABASE_SECRET_NUMERIC_VERSION=${m[1]}`);'
          gcloud run jobs deploy "$JOB" \
            --image="$CURRENT_IMAGE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --service-account="$RUNTIME_SA" \
            --set-env-vars="PROJECT_ID=$PROJECT_ID,SECRET_ID=$DATABASE_SECRET_ID" \
            --command=node \
            --args="^~^-e~${SCRIPT}" \
            --tasks=1 --max-retries=0 --task-timeout=120s --quiet
          gcloud run jobs execute "$JOB" --project="$PROJECT_ID" --region="$REGION" --wait --quiet
          LOGS="$(gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${JOB}\"" --project="$PROJECT_ID" --freshness=15m --limit=100 --order=asc --format='value(textPayload)' || true)"
          VERSION_LINE="$(printf '%s\n' "$LOGS" | grep '^DATABASE_SECRET_NUMERIC_VERSION=' | tail -n1)"
          test -n "$VERSION_LINE"
          VERSION="${VERSION_LINE#DATABASE_SECRET_NUMERIC_VERSION=}"
          [[ "$VERSION" =~ ^[0-9]+$ ]]
          cleanup
          trap - EXIT
          test -z "$(gcloud run jobs list --project="$PROJECT_ID" --region="$REGION" --filter="metadata.name=${JOB}" --format='value(metadata.name)')"
          BODY=$(cat <<EOF
          PRODUCTION_DB_SECRET_VERSION_RESOLVER=PASS
          candidate=${CANDIDATE_SHA}
          database_secret_id=${DATABASE_SECRET_ID}
          database_secret_numeric_version=${VERSION}
          resolver_runtime_identity=${RUNTIME_SA}
          resolver_job_cleanup=PASS
          secret_payload_disclosed=NO
          provider_call_executed=NO
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/${AUTH_ISSUE}/comments" -f body="$BODY" >/dev/null
          echo "$BODY"
