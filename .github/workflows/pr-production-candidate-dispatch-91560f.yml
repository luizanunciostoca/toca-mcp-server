name: PR Production Runtime Reference Readback 91560f

on:
  pull_request:
    branches: [ops/base-91560f-readbacks-20260823]
    paths:
      - '.github/workflows/pr-production-candidate-dispatch-91560f.yml'

permissions:
  contents: read
  id-token: write
  issues: write

env:
  CANDIDATE_SHA: 91560f21856012b367efb9513044004a978ba6c9
  PROJECT_ID: toca-mcp-production
  PROJECT_NUMBER: '990081828836'
  REGION: southamerica-east1
  WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  DEPLOYER_SA: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  MCP_SERVICE: toca-mcp-production
  DATABASE_SECRET_ID: toca-database-url
  AUTH_ISSUE: '205'

jobs:
  readback:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Exact candidate guard
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | awk '{print $1}')"
          test "$MAIN_SHA" = "$CANDIDATE_SHA"

      - name: Authenticate canonical production deployer
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Read current MCP runtime reference metadata only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)" = "$DEPLOYER_SA"
          test "$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')" = "$PROJECT_NUMBER"

          gcloud run services describe "$MCP_SERVICE" --project="$PROJECT_ID" --region="$REGION" --format=json >/tmp/mcp.json
          CURRENT_REV="$(jq -r '[.status.traffic[]? | select(.percent==100) | .revisionName][0] // empty' /tmp/mcp.json)"
          CURRENT_IMAGE="$(jq -r '.spec.template.spec.containers[0].image // empty' /tmp/mcp.json)"
          CURRENT_SA="$(jq -r '.spec.template.spec.serviceAccountName // empty' /tmp/mcp.json)"
          DB_SECRET_NAME="$(jq -r '[.spec.template.spec.containers[0].env[]? | select(.name=="DATABASE_URL") | .valueFrom.secretKeyRef.name][0] // empty' /tmp/mcp.json)"
          DB_SECRET_VERSION="$(jq -r '[.spec.template.spec.containers[0].env[]? | select(.name=="DATABASE_URL") | .valueFrom.secretKeyRef.key][0] // empty' /tmp/mcp.json)"
          test -n "$CURRENT_REV"
          test -n "$CURRENT_IMAGE"
          test -n "$CURRENT_SA"

          if [[ -z "$DB_SECRET_NAME" ]]; then DB_SECRET_NAME='UNBOUND'; fi
          if [[ -z "$DB_SECRET_VERSION" ]]; then DB_SECRET_VERSION='UNBOUND'; fi

          BODY=$(cat <<EOF
          PRODUCTION_RUNTIME_REFERENCE_READBACK=PASS
          candidate=${CANDIDATE_SHA}
          mcp_service=${MCP_SERVICE}
          current_100pct_revision=${CURRENT_REV}
          current_image=${CURRENT_IMAGE}
          runtime_service_account=${CURRENT_SA}
          database_secret_name=${DB_SECRET_NAME}
          database_secret_bound_version=${DB_SECRET_VERSION}
          secret_payload_read=NO
          mutation_executed=NO
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/${AUTH_ISSUE}/comments" -f body="$BODY" >/dev/null
          echo "$BODY"
