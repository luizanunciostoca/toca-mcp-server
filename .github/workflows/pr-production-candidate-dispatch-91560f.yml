name: PR Production Live Discovery 91560f

on:
  pull_request:
    branches: [ops/base-91560f-readbacks-20260823]
    paths:
      - '.github/workflows/pr-production-candidate-dispatch-91560f.yml'

permissions:
  contents: read
  id-token: write
  issues: write

env:
  CANDIDATE_SHA: 91560f21856012b367efb9513044004a978ba6c9
  PROJECT_ID: toca-mcp-production
  PROJECT_NUMBER: '990081828836'
  REGION: southamerica-east1
  WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  DEPLOYER_SA: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  ARTIFACT_REPOSITORY: toca-mcp
  CLOUD_SQL_INSTANCE: toca-mcp-db
  DATABASE_SECRET_ID: toca-database-url
  AUTH_ISSUE: '205'

jobs:
  discovery:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Fail closed on exact candidate before production auth
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | awk '{print $1}')"
          test "$MAIN_SHA" = "$CANDIDATE_SHA"
          test "$PROJECT_ID" = toca-mcp-production
          test "$PROJECT_NUMBER" = 990081828836
          echo 'PRODUCTION_DISCOVERY_BOUNDARY=PASS'

      - name: Authenticate production deployer read-only usage
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Discover live production coordinates without mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)" = "$DEPLOYER_SA"
          test "$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')" = "$PROJECT_NUMBER"

          gcloud artifacts repositories describe "$ARTIFACT_REPOSITORY" --project="$PROJECT_ID" --location="$REGION" --format=json >/tmp/artifact.json
          gcloud run services list --project="$PROJECT_ID" --region="$REGION" --format=json >/tmp/services.json
          gcloud sql instances describe "$CLOUD_SQL_INSTANCE" --project="$PROJECT_ID" --format=json >/tmp/sql.json

          jq -e --arg p "$PROJECT_ID" --arg r "$REGION" '.project==$p and .region==$r and .name=="toca-mcp-db" and .state=="RUNNABLE" and .databaseVersion=="POSTGRES_18" and .settings.backupConfiguration.enabled==true and .settings.backupConfiguration.pointInTimeRecoveryEnabled==true' /tmp/sql.json >/dev/null

          jq '[.[] | {
            name:.metadata.name,
            url:(.status.url // null),
            latestReadyRevision:(.status.latestReadyRevisionName // null),
            runtimeServiceAccount:(.spec.template.spec.serviceAccountName // null),
            traffic:(.status.traffic // []),
            providerFlags:([.spec.template.spec.containers[0].env[]? | select(.name=="MCP_ENABLED" or .name=="META_ENABLED" or .name=="META_WEBHOOK_ENABLED" or .name=="INSTAGRAM_READ_ENABLED" or .name=="META_ADS_READ_ENABLED" or .name=="META_ADS_WRITE_ENABLED" or .name=="WHATSAPP_ENABLED" or .name=="EMAIL_SENDGRID_ENABLED" or .name=="GOOGLE_ADS_PHASE" or .name=="AG01_MODEL_ENABLED") | {name:.name,value:(.value // "<secret-ref>")}])
          }]' /tmp/services.json >/tmp/services-sanitized.json

          SECRET_VERSION=''
          if gcloud secrets versions list "$DATABASE_SECRET_ID" --project="$PROJECT_ID" --filter='state=ENABLED' --sort-by='~name' --limit=1 --format='value(name)' >/tmp/secret-version.txt 2>/tmp/secret-version.err; then
            SECRET_VERSION="$(cat /tmp/secret-version.txt)"
          fi

          SERVICE_NAMES="$(jq -r '.[].name' /tmp/services-sanitized.json | sort | paste -sd, -)"
          MCP_MATCHES="$(jq -r '[.[] | select(.name=="toca-mcp-production")] | length' /tmp/services-sanitized.json)"
          test "$MCP_MATCHES" = 1
          MCP_SA="$(jq -r '.[] | select(.name=="toca-mcp-production") | .runtimeServiceAccount // empty' /tmp/services-sanitized.json)"
          MCP_REV="$(jq -r '.[] | select(.name=="toca-mcp-production") | ([.traffic[]? | select(.percent==100) | .revisionName][0] // .latestReadyRevision // empty)' /tmp/services-sanitized.json)"
          test -n "$MCP_SA"
          test -n "$MCP_REV"

          UNAUTH_FLAGS="$(jq -c '[.[] | {name,flags:.providerFlags}]' /tmp/services-sanitized.json)"
          BODY=$(cat <<EOF
          PRODUCTION_LIVE_DISCOVERY=PASS
          candidate=${CANDIDATE_SHA}
          project=${PROJECT_ID}
          project_number=${PROJECT_NUMBER}
          region=${REGION}
          artifact_repository=${ARTIFACT_REPOSITORY}
          cloud_sql=${CLOUD_SQL_INSTANCE}
          cloud_sql_state=$(jq -r '.state' /tmp/sql.json)
          backup_enabled=$(jq -r '.settings.backupConfiguration.enabled' /tmp/sql.json)
          pitr_enabled=$(jq -r '.settings.backupConfiguration.pointInTimeRecoveryEnabled' /tmp/sql.json)
          services=${SERVICE_NAMES}
          mcp_service=toca-mcp-production
          mcp_runtime_sa=${MCP_SA}
          mcp_100pct_revision=${MCP_REV}
          database_secret_id=${DATABASE_SECRET_ID}
          latest_enabled_database_secret_version=${SECRET_VERSION:-UNREADABLE}
          provider_flags_sanitized=${UNAUTH_FLAGS}
          mutation_executed=NO
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/${AUTH_ISSUE}/comments" -f body="$BODY" >/dev/null
          echo "$BODY"
