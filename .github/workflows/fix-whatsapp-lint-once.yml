name: Fix WhatsApp Lint Once

on:
  push:
    branches:
      - feat/next-whatsapp-real-20260820

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply lint-safe fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}, got {text.count(old)}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'src/providers/whatsapp/whatsapp-cloud-adapter.ts',
              "import { MetaApiClient } from '../meta/meta-api-client.js';\n",
              "import type { MetaApiClient } from '../meta/meta-api-client.js';\n",
          )

          test = Path('test/whatsapp-cloud-adapter.test.ts')
          text = test.read_text()
          text = text.replace(
              "  async request(url: string, init: RequestInit): Promise<MetaApiResponse> {\n",
              "  request(url: string, init: RequestInit): Promise<MetaApiResponse> {\n",
          )
          text = text.replace("      return response({", "      return Promise.resolve(response({")
          text = text.replace("      });\n    }\n    if (init.method === 'POST'", "      }));\n    }\n    if (init.method === 'POST'", 1)
          text = text.replace(
              "      return response({ messages: [{ id: 'wamid.provider-1' }] });\n",
              "      return Promise.resolve(response({ messages: [{ id: 'wamid.provider-1' }] }));\n",
          )
          marker = "    if (init.method === 'GET' && url.endsWith('/v23.0/media-1')) {\n"
          start = text.index(marker)
          segment = text[start:]
          segment = segment.replace("      return response({", "      return Promise.resolve(response({", 1)
          segment = segment.replace("      });\n    }\n    return { ok: false", "      }));\n    }\n    return Promise.resolve({ ok: false", 1)
          segment = segment.replace("json: async () => ({ error: { code: 100 } }) };", "json: () => Promise.resolve({ error: { code: 100 } }) });", 1)
          text = text[:start] + segment
          text = text.replace(
              "  return { ok: true, status: 200, json: async () => value };\n",
              "  return { ok: true, status: 200, json: () => Promise.resolve(value) };\n",
          )
          text = text.replace(
              "  async resolve(ref: string): Promise<PreparedWhatsAppMessage | undefined> {\n    return this.values[ref];\n  }\n",
              "  resolve(ref: string): Promise<PreparedWhatsAppMessage | undefined> {\n    return Promise.resolve(this.values[ref]);\n  }\n",
          )
          text = text.replace(
              "  async latest(): Promise<ProviderMessageReadback | undefined> {\n    return this.value;\n  }\n",
              "  latest(): Promise<ProviderMessageReadback | undefined> {\n    return Promise.resolve(this.value);\n  }\n",
          )
          text = text.replace(
              "    expect(JSON.parse(String(request.init.body))).toEqual({\n",
              "    if (typeof request.init.body !== 'string') throw new Error('EXPECTED_JSON_BODY');\n    expect(JSON.parse(request.init.body)).toEqual({\n",
          )
          test.write_text(text)
          PY
          pnpm exec prettier --write src/providers/whatsapp/whatsapp-cloud-adapter.ts test/whatsapp-cloud-adapter.test.ts
          pnpm eslint src/providers/whatsapp/whatsapp-cloud-adapter.ts test/whatsapp-cloud-adapter.test.ts
      - name: Commit fixes when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/providers/whatsapp/whatsapp-cloud-adapter.ts test/whatsapp-cloud-adapter.test.ts
          git commit -m "fix(whatsapp): satisfy strict lint without bypasses"
          git push origin HEAD:feat/next-whatsapp-real-20260820
