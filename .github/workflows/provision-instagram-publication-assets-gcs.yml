name: Provision Instagram Publication Assets GCS

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  PUBLICATION_ASSET_BUCKET: toca-mcp-publication-assets

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Create or reconcile dedicated publication bucket
        shell: bash
        run: |
          set -euo pipefail
          BUCKET_URI="gs://${PUBLICATION_ASSET_BUCKET}"

          if ! gcloud storage buckets describe "$BUCKET_URI" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud storage buckets create "$BUCKET_URI" \
              --project "$GCP_PROJECT_ID" \
              --location "$GCP_REGION" \
              --uniform-bucket-level-access
          fi

          cat > /tmp/publication-assets-lifecycle.json <<'JSON'
          {
            "rule": [
              {
                "action": { "type": "Delete" },
                "condition": { "age": 7 }
              }
            ]
          }
          JSON

          gcloud storage buckets update "$BUCKET_URI" \
            --project "$GCP_PROJECT_ID" \
            --uniform-bucket-level-access \
            --lifecycle-file=/tmp/publication-assets-lifecycle.json

          gcloud storage buckets add-iam-policy-binding "$BUCKET_URI" \
            --project "$GCP_PROJECT_ID" \
            --member="serviceAccount:${GCP_RUNTIME_SERVICE_ACCOUNT}" \
            --role="roles/storage.objectCreator"

      - name: Verify bucket policy and lifecycle
        shell: bash
        run: |
          set -euo pipefail
          BUCKET_URI="gs://${PUBLICATION_ASSET_BUCKET}"
          POLICY="$(gcloud storage buckets get-iam-policy "$BUCKET_URI" --project "$GCP_PROJECT_ID" --format=json)"
          CONFIG="$(gcloud storage buckets describe "$BUCKET_URI" --project "$GCP_PROJECT_ID" --format=json)"

          jq -e --arg sa "serviceAccount:${GCP_RUNTIME_SERVICE_ACCOUNT}" '
            any(.bindings[]?; .role == "roles/storage.objectCreator" and any(.members[]?; . == $sa))
          ' <<<"$POLICY" >/dev/null

          jq -e '
            all(.bindings[]?; all(.members[]?; . != "allUsers" and . != "allAuthenticatedUsers"))
          ' <<<"$POLICY" >/dev/null

          jq -e '
            any(.lifecycle.rule[]?; .action.type == "Delete" and .condition.age == 7)
          ' <<<"$CONFIG" >/dev/null

          echo 'GCS_PUBLICATION_ASSET_BUCKET_PRIVATE_READY=1'
