name: GCP Cost Hygiene

on:
  push:
    branches: [main]
    paths:
      - 'infra/artifact-registry-cleanup-policy.json'
      - '.github/workflows/gcp-cost-hygiene.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_ARTIFACT_REPOSITORY: toca-mcp
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_INFRA_ADMIN_SERVICE_ACCOUNT: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com

jobs:
  artifact-registry-cleanup:
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    steps:
      - uses: actions/checkout@v4

      - name: Verify bounded cleanup policy before privileged auth
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            length == 2 and
            any(.[]; .name == "delete-images-older-than-30d" and .action.type == "Delete" and .condition.tagState == "any" and .condition.olderThan == "30d") and
            any(.[]; .name == "keep-last-10-versions" and .action.type == "Keep" and .mostRecentVersions.keepCount == 10)
          ' infra/artifact-registry-cleanup-policy.json >/dev/null
          echo 'ARTIFACT_REGISTRY_CLEANUP_POLICY_BOUNDARY=PASS'

      - name: Authenticate as infrastructure administrator
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_INFRA_ADMIN_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Apply bounded Artifact Registry cleanup policy
        shell: bash
        run: |
          set -euo pipefail
          gcloud artifacts repositories set-cleanup-policies "$GCP_ARTIFACT_REPOSITORY" \
            --project="$GCP_PROJECT_ID" \
            --location="$GCP_REGION" \
            --policy=infra/artifact-registry-cleanup-policy.json \
            --no-dry-run \
            --quiet

      - name: Verify cleanup policies are active
        shell: bash
        run: |
          set -euo pipefail
          POLICIES="$(gcloud artifacts repositories list-cleanup-policies "$GCP_ARTIFACT_REPOSITORY" \
            --project="$GCP_PROJECT_ID" \
            --location="$GCP_REGION" \
            --format=json)"
          printf '%s' "$POLICIES" | jq -e '
            any(.[]?; .name == "delete-images-older-than-30d") and
            any(.[]?; .name == "keep-last-10-versions")
          ' >/dev/null
          echo 'ARTIFACT_REGISTRY_COST_HYGIENE=VERIFIED'
