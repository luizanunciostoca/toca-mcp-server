name: GCP Cloud Run Staging Smoke

on:
  push:
    branches:
      - feat/instagram-engagement-messaging
    paths:
      - '.github/workflows/gcp-cloud-run-staging-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-staging-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy private staging service
        run: |
          IMAGE="southamerica-east1-docker.pkg.dev/toca-mcp-production/toca-mcp/server:smoke-0f43e17357605831b587e8a446efaa4243bf22bf"
          gcloud run deploy toca-mcp-staging \
            --image "$IMAGE" \
            --project toca-mcp-production \
            --region southamerica-east1 \
            --service-account toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com \
            --set-env-vars NODE_ENV=production,META_ENABLED=false,LOG_LEVEL=info \
            --min-instances 0 \
            --max-instances 1 \
            --no-allow-unauthenticated \
            --quiet

      - name: Verify service state
        run: |
          gcloud run services describe toca-mcp-staging \
            --project toca-mcp-production \
            --region southamerica-east1 \
            --format='value(status.url,status.latestReadyRevisionName,status.conditions[0].status)'
