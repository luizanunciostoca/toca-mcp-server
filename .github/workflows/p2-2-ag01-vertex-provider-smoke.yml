name: P2.2 AG-01 Vertex Gemini Provider Smoke

on:
  push:
    branches:
      - ops/p2-2-ag01-vertex-20260828
    paths:
      - 'Dockerfile.orchestrator'
      - 'src/orchestrator/vertex-gemini-decision-adapter.ts'
      - 'src/orchestrator/production-config.ts'
      - 'src/orchestrator/production-runtime.ts'
      - 'src/ag01-vertex-provider-smoke.ts'
      - '.github/workflows/p2-2-ag01-vertex-provider-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  AG01_VERTEX_PROJECT_ID: toca-mcp-production
  AG01_VERTEX_LOCATION: global
  AG01_VERTEX_MODEL: gemini-2.5-flash
  SMOKE_JOB: toca-ag01-vertex-p2-2-smoke

jobs:
  provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify AG-01 authority boundary remains Core-only
        run: |
          set -euo pipefail
          grep -Fq 'ExistingCoreCapabilityGateway' src/orchestrator/production-runtime.ts
          grep -Fq 'bindApprovalStoreToScope' src/orchestrator/production-runtime.ts
          grep -Fq 'Core remains authoritative for policy and approval.' src/orchestrator/vertex-gemini-decision-adapter.ts
          grep -Fq 'AG01_FAIL_CLOSED' src/orchestrator/production-runtime.ts

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Quality gate
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm quality

      - name: Authenticate deploy boundary to Google Cloud with WIF
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push immutable AG-01 smoke image
        run: |
          set -euo pipefail
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/ag01:p2-2-${GITHUB_SHA}"
          docker build --file Dockerfile.orchestrator --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy temporary smoke under production runtime service account
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$SMOKE_JOB" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --command node \
            --args dist/src/ag01-vertex-provider-smoke.js \
            --set-env-vars "AG01_VERTEX_PROJECT_ID=$AG01_VERTEX_PROJECT_ID,AG01_VERTEX_LOCATION=$AG01_VERTEX_LOCATION,AG01_VERTEX_MODEL=$AG01_VERTEX_MODEL,P2_2_EVIDENCE_PATH=/tmp/p2-2-ag01-vertex.json" \
            --max-retries 0 \
            --task-timeout 120s \
            --quiet

      - name: Execute real Vertex Gemini model smoke as runtime identity
        run: |
          set -euo pipefail
          mkdir -p p2-2-evidence
          set +e
          EXECUTION="$(gcloud run jobs execute "$SMOKE_JOB" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --wait \
            --format='value(metadata.name)' 2>p2-2-evidence/execution-stderr.log)"
          EXIT_CODE=$?
          set -e
          if [ -z "$EXECUTION" ]; then
            EXECUTION="$(grep -oE 'toca-ag01-vertex-p2-2-smoke-[a-z0-9]+' p2-2-evidence/execution-stderr.log | tail -n 1 || true)"
          fi
          echo "$EXECUTION" > p2-2-evidence/execution-name.txt
          echo "$EXIT_CODE" > p2-2-evidence/execution-exit-code.txt
          if [ -n "$EXECUTION" ]; then
            gcloud run jobs executions describe "$EXECUTION" \
              --project "$PROJECT_ID" \
              --region "$REGION" \
              --format=json > p2-2-evidence/execution-describe.json || true
            sleep 6
            gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$SMOKE_JOB\" AND labels.\"run.googleapis.com/execution_name\"=\"$EXECUTION\"" \
              --project "$PROJECT_ID" \
              --freshness 20m \
              --limit 200 \
              --order asc \
              --format='value(textPayload)' > p2-2-evidence/job.log || true
          else
            : > p2-2-evidence/job.log
          fi
          grep -F 'P2_2_PROVIDER_READBACK ' p2-2-evidence/job.log \
            | tail -n 1 \
            | sed 's/^P2_2_PROVIDER_READBACK //' \
            > p2-2-evidence/provider-readback.json || true
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo 'Cloud Run runtime-identity smoke failed.' >&2
            cat p2-2-evidence/execution-stderr.log >&2 || true
            cat p2-2-evidence/job.log >&2 || true
            exit "$EXIT_CODE"
          fi
          jq -e '.status == "PROVIDER_VERIFIED"' p2-2-evidence/provider-readback.json >/dev/null
          jq -e '.coreCapabilityExecuted == false and .externalSideEffectExecuted == false' p2-2-evidence/provider-readback.json >/dev/null
          jq -e '.authMode == "metadata-service"' p2-2-evidence/provider-readback.json >/dev/null

      - name: Capture immutable run metadata
        if: always()
        run: |
          mkdir -p p2-2-evidence
          jq -n \
            --arg sourceSha "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg project "$PROJECT_ID" \
            --arg runtimeServiceAccount "$RUNTIME_SERVICE_ACCOUNT" \
            --arg provider 'google-vertex-ai' \
            --arg model "$AG01_VERTEX_MODEL" \
            '{schemaVersion:"toca.p2.2.run-metadata.v2",sourceSha:$sourceSha,runId:$runId,runAttempt:$runAttempt,projectId:$project,runtimeServiceAccount:$runtimeServiceAccount,provider:$provider,model:$model,externalApiKeySecretRequired:false,executionBoundary:"cloud-run-runtime-service-account"}' \
            > p2-2-evidence/run-metadata.json

      - name: Upload P2.2 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p2-2-ag01-vertex-${{ github.run_id }}-${{ github.run_attempt }}
          path: p2-2-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary Cloud Run smoke job
        if: always()
        run: |
          gcloud run jobs delete "$SMOKE_JOB" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --quiet || true
