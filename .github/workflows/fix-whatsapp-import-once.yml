name: Fix WhatsApp Import Once

on:
  push:
    branches:
      - feat/next-whatsapp-real-20260820

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Fix type-only import and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/providers/whatsapp/whatsapp-cloud-adapter.ts')
          text = path.read_text()
          old = "import { MetaApiClient } from '../meta/meta-api-client.js';"
          new = "import type { MetaApiClient } from '../meta/meta-api-client.js';"
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('MetaApiClient import not found')
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/providers/whatsapp/whatsapp-cloud-adapter.ts
          git commit -m "fix(whatsapp): use type-only Meta client import"
          git push origin HEAD:feat/next-whatsapp-real-20260820
