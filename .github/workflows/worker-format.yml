name: Format Worker Foundation

on:
  push:
    branches: [feat/worker-observability-foundation]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/worker-observability-foundation
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier --write docs/operations/worker-runbook.md src/core/structured-logger.ts src/health/readiness.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/operations/worker-runbook.md src/core/structured-logger.ts src/health/readiness.ts
          git diff --cached --quiet || git commit -m "style: format worker foundation"
          git push origin HEAD:feat/worker-observability-foundation
