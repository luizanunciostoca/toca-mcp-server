name: Temporary Persisted Event Inspection

on:
  push:
    branches:
      - feat/instagram-engagement-messaging

permissions:
  contents: read
  id-token: write

concurrency:
  group: tmp-persisted-events-inspection
  cancel-in-progress: false

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  TOKEN_SECRET_ID: toca-meta-oauth-token
  INSTAGRAM_ACCOUNT_ID: '17841402033495654'
  META_GRAPH_API_VERSION: v24.0
  JOB: toca-meta-comment-subscription-repair

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build sanitized Instagram subscription reconciler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/meta-comment-subscription-repair
          cat > /tmp/meta-comment-subscription-repair/reconcile.mjs <<'NODE'
          const token = process.env.META_ACCESS_TOKEN;
          const igId = process.env.INSTAGRAM_ACCOUNT_ID;
          const version = process.env.META_GRAPH_API_VERSION;
          const runId = process.env.INSPECTION_RUN_ID;
          if (!token || !igId || !version || !runId) throw new Error('configuration missing');

          function marker(name, value) {
            console.log(`SAFE_RUN_${runId}_${name}=${value}`);
          }

          async function request(method) {
            const response = await fetch(`https://graph.instagram.com/${version}/${igId}/subscribed_apps`, {
              method,
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: 'application/json',
                ...(method === 'POST' ? { 'Content-Type': 'application/x-www-form-urlencoded' } : {}),
              },
              ...(method === 'POST'
                ? { body: new URLSearchParams({ subscribed_fields: 'comments,messages' }).toString() }
                : {}),
            });
            let body = {};
            try { body = await response.json(); } catch {}
            return {
              status: response.status,
              code: Number.isInteger(body?.error?.code) ? body.error.code : 0,
              subcode: Number.isInteger(body?.error?.error_subcode) ? body.error.error_subcode : 0,
              body,
            };
          }

          function fieldsFrom(body) {
            const fields = new Set();
            for (const entry of Array.isArray(body?.data) ? body.data : []) {
              for (const field of Array.isArray(entry?.subscribed_fields) ? entry.subscribed_fields : []) {
                if (typeof field === 'string') fields.add(field);
              }
            }
            return fields;
          }

          let current = await request('GET');
          marker('IG_USER_TOKEN_GET_HTTP', current.status);
          marker('IG_USER_TOKEN_GET_CODE', current.code);
          marker('IG_USER_TOKEN_GET_SUBCODE', current.subcode);
          if (current.status !== 200) process.exit(2);

          let fields = fieldsFrom(current.body);
          marker('IG_BEFORE_HAS_COMMENTS', fields.has('comments') ? 1 : 0);
          marker('IG_BEFORE_HAS_MESSAGES', fields.has('messages') ? 1 : 0);

          if (!fields.has('comments') || !fields.has('messages')) {
            const repair = await request('POST');
            marker('IG_REPAIR_HTTP', repair.status);
            marker('IG_REPAIR_CODE', repair.code);
            marker('IG_REPAIR_SUBCODE', repair.subcode);
            marker('IG_REPAIR_SUCCESS', repair.body?.success === true ? 1 : 0);
            if (repair.status !== 200 || repair.body?.success !== true) process.exit(3);

            current = await request('GET');
            marker('IG_VERIFY_HTTP', current.status);
            marker('IG_VERIFY_CODE', current.code);
            marker('IG_VERIFY_SUBCODE', current.subcode);
            if (current.status !== 200) process.exit(4);
            fields = fieldsFrom(current.body);
          }

          marker('IG_AFTER_HAS_COMMENTS', fields.has('comments') ? 1 : 0);
          marker('IG_AFTER_HAS_MESSAGES', fields.has('messages') ? 1 : 0);
          if (!fields.has('comments') || !fields.has('messages')) process.exit(5);
          marker('IG_SUBSCRIPTION_RECONCILED', 1);
          NODE

          cat > /tmp/meta-comment-subscription-repair/Dockerfile <<'DOCKER'
          FROM node:24-bookworm-slim
          WORKDIR /app
          COPY reconcile.mjs ./reconcile.mjs
          USER node
          CMD ["node", "reconcile.mjs"]
          DOCKER

          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/meta-comment-subscription-repair:${GITHUB_SHA}"
          docker build -t "$IMAGE" /tmp/meta-comment-subscription-repair
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Reconcile Instagram comments and messages subscription
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            gcloud run jobs delete "$JOB" --project "$PROJECT_ID" --region "$REGION" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          gcloud run jobs deploy "$JOB" \
            --image "$IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars "INSTAGRAM_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID,META_GRAPH_API_VERSION=$META_GRAPH_API_VERSION,INSPECTION_RUN_ID=$GITHUB_RUN_ID" \
            --set-secrets "META_ACCESS_TOKEN=$TOKEN_SECRET_ID:latest" \
            --max-retries 0 \
            --task-timeout 120s \
            --quiet

          set +e
          gcloud run jobs execute "$JOB" --project "$PROJECT_ID" --region "$REGION" --wait --quiet
          EXECUTE_STATUS=$?
          set -e

          MARKERS=''
          for ATTEMPT in 1 2 3 4 5; do
            MARKERS="$(gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$JOB\" AND textPayload:\"SAFE_RUN_${GITHUB_RUN_ID}_\"" \
              --project "$PROJECT_ID" --freshness=10m --limit=30 --format='value(textPayload)' 2>/dev/null \
              | grep -E "^SAFE_RUN_${GITHUB_RUN_ID}_[A-Z0-9_]+=[0-9]+$" | sort -u || true)"
            [ -n "$MARKERS" ] && break
            sleep 2
          done
          echo "$MARKERS"
          exit "$EXECUTE_STATUS"
