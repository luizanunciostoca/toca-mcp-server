name: Cloud Run Helper Diagnostics

on:
  push:
    branches: [chore/foundation-daily-control-evidence]
    paths: ['.github/workflows/cloud-run-helper-diagnostics.yml']

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  WIF: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  DEPLOY_SA: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Read post-repair daily-control logs
        shell: bash
        run: |
          set -euo pipefail
          FILTER='resource.type="cloud_run_revision" AND resource.labels.service_name="toca-managed-instagram-daemon" AND timestamp>="2026-08-15T23:55:25Z"'
          gcloud logging read "$FILTER" \
            --project "$PROJECT_ID" \
            --limit=300 \
            --order=asc \
            --format=json \
            | jq '[.[] | select(
                ((.jsonPayload.event // "") | tostring | contains("foundation.daily_control")) or
                ((.textPayload // "") | tostring | contains("foundation.daily_control")) or
                ((.jsonPayload.event // "") | tostring | contains("toca.managed.instagram.daemon.tick"))
              ) | {timestamp,severity,textPayload,jsonPayload}]' \
            | tee foundation-daily-control-post-repair.json
          echo "DAILY_CONTROL_LOG_COUNT=$(jq '[.[] | select(((.jsonPayload.event // "") | tostring | contains("foundation.daily_control")) or ((.textPayload // "") | tostring | contains("foundation.daily_control")))] | length' foundation-daily-control-post-repair.json)"
          jq -c '.[]' foundation-daily-control-post-repair.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-daily-control-post-repair-${{ github.sha }}
          path: foundation-daily-control-post-repair.json
          if-no-files-found: error
          retention-days: 90
