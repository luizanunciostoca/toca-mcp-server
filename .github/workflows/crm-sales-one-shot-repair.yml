name: CRM Sales one-shot repair

on:
  push:
    branches:
      - feat/next-crm-sales-engine-advanced-20260820

permissions:
  contents: write

concurrency:
  group: crm-sales-one-shot-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout CRM branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/next-crm-sales-engine-advanced-20260820
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply strict typing repair
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          runtime = Path('src/crm/runtime.ts')
          text = runtime.read_text()

          old = "return services.sales.resolveContact({ ...scope, channels: input.channels });"
          new = "\n".join([
              "return services.sales.resolveContact({",
              "          ...scope,",
              "          channels: input.channels.map((channel) => ({",
              "            channelType: channel.channelType,",
              "            value: channel.value,",
              "            ...(channel.provider !== undefined ? { provider: channel.provider } : {}),",
              "          })),",
              "        });",
          ])
          if old not in text:
              raise SystemExit('CRM_RUNTIME_CONTACT_RESOLUTION_PATTERN_NOT_FOUND')
          text = text.replace(old, new, 1)

          old = "\n".join([
              "preferredOwnerPrincipalId: input.preferredOwnerPrincipalId,",
              "              })",
          ])
          new = "\n".join([
              "...(input.preferredOwnerPrincipalId !== undefined",
              "                  ? { preferredOwnerPrincipalId: input.preferredOwnerPrincipalId }",
              "                  : {}),",
              "              })",
          ])
          if old not in text:
              raise SystemExit('CRM_RUNTIME_OWNER_PATTERN_NOT_FOUND')
          text = text.replace(old, new, 1)

          old = "\n".join([
              "humanOverride: input.humanOverride,",
              "          });",
          ])
          new = "\n".join([
              "...(input.humanOverride !== undefined",
              "              ? { humanOverride: input.humanOverride }",
              "              : {}),",
              "          });",
          ])
          if old not in text:
              raise SystemExit('CRM_RUNTIME_HUMAN_OVERRIDE_PATTERN_NOT_FOUND')
          runtime.write_text(text.replace(old, new, 1))

          store = Path('src/persistence/postgres-crm-sales-store.ts')
          text = store.read_text()
          if 'type CrmSalesMutationMetadata =' not in text:
              if 'Required<CrmMutationMetadata>' not in text:
                  raise SystemExit('CRM_STORE_REQUIRED_METADATA_PATTERN_NOT_FOUND')
              text = text.replace('Required<CrmMutationMetadata>', 'CrmSalesMutationMetadata')
              marker = 'interface ContactCandidateRow {'
              alias = "type CrmSalesMutationMetadata = Required<Omit<CrmMutationMetadata, 'now'>>;\n\n"
              if marker not in text:
                  raise SystemExit('CRM_STORE_ALIAS_MARKER_NOT_FOUND')
              text = text.replace(marker, alias + marker, 1)

          text, count = re.subn(
              r"nullableCrmText\(([^,()]+),\s*'CRM_[A-Z0-9_]+'\)",
              r"nullableCrmText(\1)",
              text,
          )
          if count < 10:
              raise SystemExit(f'CRM_STORE_NULLABLE_REPAIR_TOO_FEW:{count}')
          store.write_text(text)
          PY
      - name: Validate repaired code
        run: |
          pnpm exec prettier --write src/crm/runtime.ts src/persistence/postgres-crm-sales-store.ts
          pnpm exec eslint src/crm/runtime.ts src/persistence/postgres-crm-sales-store.ts
          pnpm typecheck
      - name: Commit repair and remove one-shot workflow
        run: |
          git rm .github/workflows/crm-sales-one-shot-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/crm/runtime.ts src/persistence/postgres-crm-sales-store.ts
          git commit -m 'fix(crm): satisfy strict sales runtime typing'
          git push origin HEAD:feat/next-crm-sales-engine-advanced-20260820
