name: Temporary SendGrid Token Onboarding Hardening

on:
  push:
    branches: [feat/email-sendgrid-runtime-composition-20260820]

permissions:
  contents: write

jobs:
  harden-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          ref: feat/email-sendgrid-runtime-composition-20260820
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add Event Webhook public-key discovery from the registered API token
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('src/providers/sendgrid/email-provider.ts')
          s = p.read_text()
          anchor = "  async getAuthenticatedDomains(): Promise<readonly SendGridAuthenticatedDomainReadback[]> {\n"
          method = '''  async discoverEventWebhookPublicKey(webhookId?: string): Promise<string> {
            const response = await this.request('/v3/user/webhooks/event/settings/all', { method: 'GET' });
            if (!response.ok) {
              throw new Error(`SENDGRID_EVENT_WEBHOOK_DISCOVERY_FAILED:${response.status}`);
            }
            const body = asObject(await response.json());
            if (!Array.isArray(body.webhooks)) {
              throw new Error('SENDGRID_EVENT_WEBHOOK_DISCOVERY_RESPONSE_INVALID');
            }
            const signed = body.webhooks
              .map((entry) => asObject(entry))
              .filter((entry) => Boolean(optionalString(entry.public_key)));
            const requestedId = webhookId?.trim();
            if (requestedId) {
              const selected = signed.find((entry) => optionalString(entry.id) === requestedId);
              if (!selected) throw new Error('SENDGRID_EVENT_WEBHOOK_ID_NOT_SIGNED_OR_NOT_FOUND');
              return requireText(
                optionalString(selected.public_key) ?? '',
                'SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY_REQUIRED',
              );
            }
            if (signed.length === 0) throw new Error('SENDGRID_EVENT_WEBHOOK_SIGNATURE_NOT_ENABLED');
            if (signed.length > 1) throw new Error('SENDGRID_EVENT_WEBHOOK_SELECTION_AMBIGUOUS');
            const selected = signed[0];
            if (!selected) throw new Error('SENDGRID_EVENT_WEBHOOK_SIGNATURE_NOT_ENABLED');
            return requireText(
              optionalString(selected.public_key) ?? '',
              'SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY_REQUIRED',
            );
          }

'''
          if anchor not in s:
              raise SystemExit('provider method anchor not found')
          p.write_text(s.replace(anchor, method + anchor, 1))

          p = Path('src/providers/sendgrid/email-event-http-runtime.ts')
          s = p.read_text()
          old = '''  if (!loaded.enabled || !loaded.config) return undefined;
          if (!loaded.config.eventWebhookPublicKeyPem?.trim()) {
            throw new Error('SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY_REQUIRED');
          }

          const dispatchStore = new PostgresEmailRuntimeStore(options.pool);'''
          new = '''  if (!loaded.enabled || !loaded.config) return undefined;
          let provider = new SendGridEmailProvider(loaded.config, EVENT_ONLY_PREPARED_RESOLVER);
          if (!loaded.config.eventWebhookPublicKeyPem?.trim()) {
            const publicKey = await provider.discoverEventWebhookPublicKey(
              env.EMAIL_SENDGRID_EVENT_WEBHOOK_ID,
            );
            provider = new SendGridEmailProvider(
              { ...loaded.config, eventWebhookPublicKeyPem: publicKey },
              EVENT_ONLY_PREPARED_RESOLVER,
            );
          }

          const dispatchStore = new PostgresEmailRuntimeStore(options.pool);'''
          if old not in s:
              raise SystemExit('event runtime factory anchor not found')
          s = s.replace(old, new, 1)
          duplicate = "  const provider = new SendGridEmailProvider(loaded.config, EVENT_ONLY_PREPARED_RESOLVER);\n"
          if duplicate not in s:
              raise SystemExit('provider duplicate anchor not found')
          p.write_text(s.replace(duplicate, '', 1))

          p = Path('test/sendgrid-email-provider.test.ts')
          s = p.read_text()
          anchor = "  it('fails closed when independent Email Activity readback is not enabled', async () => {\n"
          test = '''  it('discovers the signed Event Webhook public key from the registered API token', async () => {
            let requestedUrl = '';
            const fetchImpl: typeof fetch = (input) => {
              requestedUrl = String(input);
              return Promise.resolve(
                new Response(
                  JSON.stringify({
                    webhooks: [{ id: 'hook-1', enabled: true, public_key: 'PUBLIC-KEY-FROM-PROVIDER' }],
                  }),
                  { status: 200, headers: { 'content-type': 'application/json' } },
                ),
              );
            };
            const provider = new SendGridEmailProvider(productionConfig, resolver, fetchImpl);
            await expect(provider.discoverEventWebhookPublicKey()).resolves.toBe(
              'PUBLIC-KEY-FROM-PROVIDER',
            );
            expect(requestedUrl).toContain('/v3/user/webhooks/event/settings/all');
          });

'''
          if anchor not in s:
              raise SystemExit('provider test anchor not found')
          p.write_text(s.replace(anchor, test + anchor, 1))
          PY
          pnpm exec prettier --write src/providers/sendgrid/email-provider.ts src/providers/sendgrid/email-event-http-runtime.ts test/sendgrid-email-provider.test.ts
          pnpm exec eslint src/providers/sendgrid/email-provider.ts src/providers/sendgrid/email-event-http-runtime.ts test/sendgrid-email-provider.test.ts
          pnpm vitest run test/sendgrid-email-provider.test.ts test/sendgrid-email-event-runtime.test.ts
          git rm .github/workflows/tmp-sendgrid-token-onboarding-once.yml
          git config user.name 'TOCA OS Integration'
          git config user.email 'actions@users.noreply.github.com'
          git add src/providers/sendgrid/email-provider.ts src/providers/sendgrid/email-event-http-runtime.ts test/sendgrid-email-provider.test.ts
          git commit -m 'feat(email): discover signed webhook key from SendGrid token'
          git push origin HEAD:feat/email-sendgrid-runtime-composition-20260820
