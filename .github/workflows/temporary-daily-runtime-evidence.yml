name: Temporary Daily Runtime Evidence

on:
  push:
    branches: [ops/daily-runtime-evidence-20260816]
    paths:
      - '.github/workflows/temporary-daily-runtime-evidence.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: temporary-daily-runtime-evidence-final
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  SERVICE_NAME: toca-managed-instagram-daemon
  SCHEDULER_JOB_NAME: toca-managed-instagram-tick

jobs:
  evidence:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Authenticate deployer read-only inspection
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Verify singleton topology and read operational evidence
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          test -n "$SERVICE_URL"
          SCHEDULER_JSON="$(gcloud scheduler jobs describe "$SCHEDULER_JOB_NAME" --project "$GCP_PROJECT_ID" --location "$GCP_REGION" --format=json)"
          printf '%s' "$SCHEDULER_JSON" | jq -e --arg uri "${SERVICE_URL}/tick" --arg audience "$SERVICE_URL" --arg sa "$GCP_RUNTIME_SERVICE_ACCOUNT" '
            .state == "ENABLED" and .schedule == "* * * * *" and .timeZone == "America/Bahia" and
            .httpTarget.uri == $uri and .httpTarget.httpMethod == "POST" and
            .httpTarget.oidcToken.serviceAccountEmail == $sa and .httpTarget.oidcToken.audience == $audience
          ' >/dev/null
          SERVICE_JSON="$(gcloud run services describe "$SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$SERVICE_JSON" | jq -e '
            .spec.template.spec.containers[0] as $container |
            (.spec.template.spec.containerConcurrency == 1) and
            ((.spec.template.metadata.annotations["autoscaling.knative.dev/minScale"] // "0") == "0") and
            (.spec.template.metadata.annotations["autoscaling.knative.dev/maxScale"] == "1") and
            ([$container.env[] | select(.name == "TOCA_MANAGED_INSTAGRAM_SCHEDULER_ENABLED") | .value] == ["true"])
          ' >/dev/null

          FILTER='resource.type="cloud_run_revision" AND resource.labels.service_name="toca-managed-instagram-daemon" AND (jsonPayload.event="foundation.daily_control.completed" OR jsonPayload.event="foundation.daily_control.findings" OR jsonPayload.event="foundation.daily_control.failed" OR jsonPayload.event="daemon.scheduler_self_test.succeeded" OR jsonPayload.event="daemon.tick.succeeded")'
          timeout 90s gcloud logging read "$FILTER" --project "$GCP_PROJECT_ID" --freshness=36h --limit=5000 --order=asc --format=json > /tmp/evidence.json

          python3 - <<'PY'
          import json
          from collections import Counter
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          with open('/tmp/evidence.json', encoding='utf-8') as f:
              entries = json.load(f)
          by_event = Counter()
          daily_counts = Counter()
          daily_evidence = []
          latest_tick = None
          for entry in entries:
              payload = entry.get('jsonPayload') or {}
              event = payload.get('event')
              if not event:
                  continue
              by_event[event] += 1
              ts = entry.get('timestamp')
              if event == 'daemon.tick.succeeded' and ts:
                  latest_tick = max(latest_tick or ts, ts)
              if event in ('foundation.daily_control.completed', 'foundation.daily_control.findings'):
                  if not ts:
                      raise SystemExit('DAILY_CONTROL_TIMESTAMP_MISSING')
                  day = datetime.fromisoformat(ts.replace('Z', '+00:00')).astimezone(ZoneInfo('America/Bahia')).date().isoformat()
                  daily_counts[day] += 1
                  snapshot = payload.get('snapshot') or {}
                  daily_evidence.append({
                      'dayKey': day,
                      'timestamp': ts,
                      'event': event,
                      'outboxPending': snapshot.get('outboxPending'),
                      'oldestOutboxAgeSeconds': snapshot.get('oldestOutboxAgeSeconds'),
                      'staleRunningJobs': snapshot.get('staleRunningJobs'),
                      'auditExecutionsChecked': snapshot.get('auditExecutionsChecked'),
                      'invalidAuditExecutions': snapshot.get('invalidAuditExecutions'),
                      'findings': payload.get('findings'),
                  })
          print('TOCA_DAILY_CONTROL_COUNTS=' + json.dumps(dict(sorted(daily_counts.items())), separators=(',', ':')))
          print('TOCA_DAILY_CONTROL_EVIDENCE=' + json.dumps(daily_evidence[-3:], sort_keys=True, separators=(',', ':')))
          print('TOCA_RUNTIME_EVENT_COUNTS=' + json.dumps(dict(sorted(by_event.items())), separators=(',', ':')))
          print('TOCA_LATEST_TICK=' + str(latest_tick))
          if not daily_counts:
              raise SystemExit('DAILY_CONTROL_COMPLETION_NOT_FOUND')
          duplicates = {day: count for day, count in daily_counts.items() if count > 1}
          if duplicates:
              raise SystemExit(f'DAILY_CONTROL_DUPLICATE_COMPLETION:{duplicates}')
          if by_event['daemon.tick.succeeded'] < 1 or latest_tick is None:
              raise SystemExit('RECENT_TICK_EVIDENCE_NOT_FOUND')
          latest_tick_dt = datetime.fromisoformat(latest_tick.replace('Z', '+00:00'))
          if datetime.now(timezone.utc) - latest_tick_dt > timedelta(minutes=10):
              raise SystemExit(f'LATEST_TICK_STALE:{latest_tick}')
          print('TOCA_SCHEDULER_SELF_TEST_LOG_COUNT=' + str(by_event['daemon.scheduler_self_test.succeeded']))
          PY

          printf '%s\n' "$SCHEDULER_JSON" | jq -c '{name,state,schedule,timeZone,lastAttemptTime,status}'
          echo 'TOCA_DAILY_RUNTIME_EVIDENCE=PASS'
