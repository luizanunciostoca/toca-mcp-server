name: Temporary Direct Permissions Diagnostic

on:
  push:
    branches:
      - feat/instagram-engagement-messaging
    paths:
      - '.github/workflows/tmp-direct-permissions-diagnostic.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  TOKEN_SECRET_ID: toca-meta-oauth-token
  PAGE_ID: '306103746115875'
  INSTAGRAM_ACCOUNT_ID: '17841402033495654'
  DIAG_JOB: toca-direct-permissions-diagnostic

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build read-only permission diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/direct-perm-diag
          cat > /tmp/direct-perm-diag/diag.mjs <<'NODE'
          const token = process.env.META_ACCESS_TOKEN?.trim();
          const pageId = process.env.PAGE_ID;
          const igId = process.env.INSTAGRAM_ACCOUNT_ID;
          if (!token || !pageId || !igId) throw new Error('DIAG_CONFIGURATION_MISSING');
          const base = 'https://graph.facebook.com/v24.0';
          async function get(path, accessToken = token) {
            const r = await fetch(`${base}/${path}`, { headers: { Authorization: `Bearer ${accessToken}` } });
            const b = await r.json().catch(() => ({}));
            if (!r.ok) {
              console.log(`SAFE_DIRECT_PERM_HTTP_${r.status}=1`);
              if (Number.isInteger(b?.error?.code)) console.log(`SAFE_DIRECT_PERM_PROVIDER_CODE=${b.error.code}`);
              if (Number.isInteger(b?.error?.error_subcode)) console.log(`SAFE_DIRECT_PERM_PROVIDER_SUBCODE=${b.error.error_subcode}`);
              throw new Error(`GET_FAILED_${r.status}`);
            }
            return b;
          }
          const permissions = await get('me/permissions');
          const granted = new Set((permissions.data ?? []).filter((p) => p.status === 'granted').map((p) => p.permission));
          for (const name of ['instagram_basic','instagram_manage_messages','pages_manage_metadata','pages_read_engagement','pages_messaging','pages_show_list']) {
            console.log(`SAFE_DIRECT_PERM_${name.toUpperCase()}=${granted.has(name) ? 1 : 0}`);
          }
          const accounts = await get('me/accounts?fields=id,name,access_token,tasks,instagram_business_account&limit=100');
          const matches = (accounts.data ?? []).filter((page) => String(page?.id ?? '') === pageId);
          console.log(`SAFE_DIRECT_PERM_PAGE_MATCHES=${matches.length}`);
          if (matches.length !== 1) throw new Error(`PAGE_MATCH_COUNT_${matches.length}`);
          const page = matches[0];
          const tasks = new Set(Array.isArray(page.tasks) ? page.tasks : []);
          console.log(`SAFE_DIRECT_PERM_PAGE_MESSAGING_TASK=${tasks.has('MESSAGING') ? 1 : 0}`);
          console.log(`SAFE_DIRECT_PERM_LINKED_IG_MATCH=${String(page?.instagram_business_account?.id ?? '') === igId ? 1 : 0}`);
          console.log(`SAFE_DIRECT_PERM_PAGE_TOKEN_PRESENT=${typeof page.access_token === 'string' && page.access_token.length > 0 ? 1 : 0}`);
          if (!tasks.has('MESSAGING')) throw new Error('PAGE_MESSAGING_TASK_MISSING');
          if (String(page?.instagram_business_account?.id ?? '') !== igId) throw new Error('LINKED_IG_MISMATCH');
          if (typeof page.access_token !== 'string' || !page.access_token) throw new Error('PAGE_TOKEN_MISSING');
          console.log('SAFE_DIRECT_PERM_DIAGNOSTIC_COMPLETE=1');
          NODE
          cat > /tmp/direct-perm-diag/Dockerfile <<'DOCKER'
          FROM node:24-bookworm-slim
          WORKDIR /app
          COPY diag.mjs ./diag.mjs
          USER node
          CMD ["node", "diag.mjs"]
          DOCKER
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/direct-perm-diag:${GITHUB_SHA}"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" /tmp/direct-perm-diag
          docker push "$IMAGE"
          echo "DIAG_IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Run read-only permission diagnostic
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$DIAG_JOB" --image "$DIAG_IMAGE" --project "$PROJECT_ID" --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" --set-env-vars "PAGE_ID=$PAGE_ID,INSTAGRAM_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID" \
            --set-secrets "META_ACCESS_TOKEN=$TOKEN_SECRET_ID:latest" --max-retries 0 --task-timeout 120s --quiet
          set +e
          gcloud run jobs execute "$DIAG_JOB" --project "$PROJECT_ID" --region "$REGION" --wait --quiet
          STATUS=$?
          set -e
          sleep 3
          gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$DIAG_JOB\" AND textPayload:\"SAFE_DIRECT_PERM_\"" \
            --project "$PROJECT_ID" --freshness=10m --limit=50 --format='value(textPayload)' | sort -u
          exit "$STATUS"
      - name: Cleanup
        if: always()
        shell: bash
        run: gcloud run jobs delete "$DIAG_JOB" --project "$PROJECT_ID" --region "$REGION" --quiet || true
