name: Temporary Controlled Comment Write

on:
  push:
    branches:
      - feat/instagram-engagement-messaging
    paths:
      - '.github/workflows/tmp-controlled-comment-write.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  TOKEN_SECRET_ID: toca-meta-oauth-token
  INSTAGRAM_ACCOUNT_ID: '17841402033495654'
  WRITE_JOB: toca-controlled-comment-write

jobs:
  controlled-write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build one-shot controlled writer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/controlled-comment-write
          cat > /tmp/controlled-comment-write/write.mjs <<'NODE'
          const token = process.env.META_ACCESS_TOKEN;
          const accountId = process.env.INSTAGRAM_ACCOUNT_ID;
          const writesEnabled = process.env.INSTAGRAM_ENGAGEMENT_WRITES_ENABLED === 'true';
          const targetText = 'TESTE TOCA MCP COMMENT FINAL 001';
          const replyText = 'TESTE TOCA MCP REPLY CONTROLADO 001';

          if (!token || !accountId) throw new Error('CONTROLLED_WRITE_CONFIGURATION_MISSING');
          if (!writesEnabled) throw new Error('CONTROLLED_WRITE_KILL_SWITCH_CLOSED');

          async function graph(path, options = {}) {
            const response = await fetch(`https://graph.facebook.com/v24.0/${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: 'application/json',
                ...(options.headers ?? {}),
              },
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(`META_CONTROLLED_WRITE_HTTP_${response.status}`);
            return body;
          }

          const media = await graph(`${accountId}/media?fields=id&limit=10`);
          if (!Array.isArray(media.data)) throw new Error('CONTROLLED_WRITE_MEDIA_RESPONSE_INVALID');

          const matches = [];
          for (const item of media.data) {
            if (typeof item?.id !== 'string') continue;
            const comments = await graph(`${item.id}/comments?fields=id,text,replies{id,text}&limit=50`);
            if (!Array.isArray(comments.data)) continue;
            for (const comment of comments.data) {
              if (comment?.text === targetText && typeof comment?.id === 'string') matches.push(comment);
            }
          }

          if (matches.length !== 1) {
            throw new Error(`CONTROLLED_WRITE_TARGET_MATCH_COUNT_${matches.length}`);
          }

          const target = matches[0];
          const existingReplies = Array.isArray(target?.replies?.data) ? target.replies.data : [];
          if (existingReplies.some((reply) => reply?.text === replyText)) {
            console.log('SAFE_CONTROLLED_COMMENT_WRITE_ALREADY_PRESENT=1');
            console.log('SAFE_CONTROLLED_COMMENT_WRITE_CREATED=0');
            process.exit(0);
          }

          const body = new URLSearchParams({ message: replyText }).toString();
          const created = await graph(`${target.id}/replies`, {
            method: 'POST',
            headers: { 'content-type': 'application/x-www-form-urlencoded' },
            body,
          });
          if (typeof created?.id !== 'string' || created.id.length === 0) {
            throw new Error('CONTROLLED_WRITE_PROVIDER_ID_MISSING');
          }

          const verification = await graph(`${target.id}/replies?fields=id,text&limit=20`);
          const replies = Array.isArray(verification.data) ? verification.data : [];
          const verified = replies.some((reply) => reply?.text === replyText);
          if (!verified) throw new Error('CONTROLLED_WRITE_VERIFICATION_FAILED');

          console.log('SAFE_CONTROLLED_COMMENT_WRITE_ALREADY_PRESENT=0');
          console.log('SAFE_CONTROLLED_COMMENT_WRITE_CREATED=1');
          console.log('SAFE_CONTROLLED_COMMENT_WRITE_VERIFIED=1');
          NODE

          cat > /tmp/controlled-comment-write/Dockerfile <<'DOCKER'
          FROM node:24-bookworm-slim
          WORKDIR /app
          COPY write.mjs ./write.mjs
          USER node
          CMD ["node", "write.mjs"]
          DOCKER

          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/controlled-comment-write:${GITHUB_SHA}"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" /tmp/controlled-comment-write
          docker push "$IMAGE"
          echo "WRITE_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Execute exactly one controlled write under runtime identity
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            gcloud run jobs delete "$WRITE_JOB" --project "$PROJECT_ID" --region "$REGION" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          gcloud run jobs deploy "$WRITE_JOB" \
            --image "$WRITE_IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars "INSTAGRAM_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID,INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=true" \
            --set-secrets "META_ACCESS_TOKEN=$TOKEN_SECRET_ID:latest" \
            --max-retries 0 \
            --task-timeout 120s \
            --quiet

          gcloud run jobs execute "$WRITE_JOB" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --wait \
            --quiet

          MARKERS=''
          for ATTEMPT in 1 2 3 4 5; do
            MARKERS="$(gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$WRITE_JOB\" AND textPayload:\"SAFE_CONTROLLED_COMMENT_WRITE_\"" \
              --project "$PROJECT_ID" --freshness=10m --limit=20 --format='value(textPayload)' 2>/dev/null \
              | grep -E '^SAFE_CONTROLLED_COMMENT_WRITE_(ALREADY_PRESENT|CREATED|VERIFIED)=[01]$' | sort -u || true)"
            [ -n "$MARKERS" ] && break
            sleep 2
          done
          echo "$MARKERS"

          CREATED="$(echo "$MARKERS" | sed -n 's/^SAFE_CONTROLLED_COMMENT_WRITE_CREATED=//p' | tail -1)"
          ALREADY="$(echo "$MARKERS" | sed -n 's/^SAFE_CONTROLLED_COMMENT_WRITE_ALREADY_PRESENT=//p' | tail -1)"
          VERIFIED="$(echo "$MARKERS" | sed -n 's/^SAFE_CONTROLLED_COMMENT_WRITE_VERIFIED=//p' | tail -1)"

          if [ "${CREATED:-0}" = "1" ]; then
            test "${VERIFIED:-0}" = "1"
          else
            test "${ALREADY:-0}" = "1"
          fi

      - name: Confirm public boundary kill switch remains closed
        shell: bash
        run: |
          set -euo pipefail
          VALUE="$(gcloud run services describe toca-meta-oauth-staging \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(spec.template.spec.containers[0].env[?name="INSTAGRAM_ENGAGEMENT_WRITES_ENABLED"].value)')"
          test "$VALUE" = "false"
          echo 'SAFE_PUBLIC_BOUNDARY_WRITES_ENABLED=0'
