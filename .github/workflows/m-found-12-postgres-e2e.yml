name: M-FOUND-12 PostgreSQL E2E

on:
  push:
    branches:
      - feat/m-found-12-e2e-production-validation
  pull_request:
    paths:
      - 'test/m-found-12-postgres-e2e.test.ts'
      - 'test/workflow-timer-recovery-postgres-e2e.test.ts'
      - 'test/foundation-worker-postgres-e2e.test.ts'
      - 'test/r29-video-postgres-e2e.test.ts'
      - 'test/r29-video-core-runtime.test.ts'
      - 'test/meta-ads-demand-intelligence-postgres-e2e.test.ts'
      - 'test/crm-sales-postgres-e2e.test.ts'
      - 'test/whatsapp-postgres-e2e.test.ts'
      - 'test/r31-learning-postgres-e2e.test.ts'
      - 'test/ag01-orchestrator-postgres-e2e.test.ts'
      - 'test/attribution-revenue-postgres-e2e.test.ts'
      - 'test/asset-intelligence-postgres-e2e.test.ts'
      - 'test/tenant-approval-postgres-e2e.test.ts'
      - '.github/workflows/m-found-12-postgres-e2e.yml'
      - 'migrations/**'
      - 'src/assets/**'
      - 'src/content/**'
      - 'src/learning/**'
      - 'src/orchestrator/**'
      - 'src/registry.ts'
      - 'src/persistence/**'
      - 'src/events/**'
      - 'src/workflow/**'
      - 'src/crm/**'
      - 'src/omnichannel/**'
      - 'src/providers/whatsapp/**'
      - 'src/measurement/**'
      - 'src/scheduler/**'
      - 'src/worker/**'

permissions:
  contents: read

concurrency:
  group: m-found-12-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: toca
          POSTGRES_PASSWORD: toca-m12-local-only
          POSTGRES_DB: toca_m12
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toca -d toca_m12"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://toca:toca-m12-local-only@127.0.0.1:5432/toca_m12
      DATABASE_SSL: 'false'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply real repository migrations
        run: pnpm migrate
      - name: Execute PostgreSQL restart/outbox/audit, timer recovery, CRM Sales, WhatsApp, worker restart safety, Video/R29, Demand Intelligence, R31 Learning, AG-01, Attribution/Revenue, Asset Intelligence and tenant Approval isolation E2E
        run: >-
          pnpm exec vitest run
          test/m-found-12-postgres-e2e.test.ts
          test/workflow-timer-recovery-postgres-e2e.test.ts
          test/crm-sales-postgres-e2e.test.ts
          test/whatsapp-postgres-e2e.test.ts
          test/foundation-worker-postgres-e2e.test.ts
          test/r29-video-postgres-e2e.test.ts
          test/meta-ads-demand-intelligence-postgres-e2e.test.ts
          test/r31-learning-postgres-e2e.test.ts
          test/ag01-orchestrator-postgres-e2e.test.ts
          test/attribution-revenue-postgres-e2e.test.ts
          test/asset-intelligence-postgres-e2e.test.ts
          test/tenant-approval-postgres-e2e.test.ts
      - name: Verify no migration drift was introduced during execution
        run: pnpm migrate
