      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply real repository migrations
        run: pnpm migrate
      - name: Execute PostgreSQL restart/outbox/audit, CRM Sales, worker restart safety and Video/R29 E2E
