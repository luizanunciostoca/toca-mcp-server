name: M-FOUND-12 PostgreSQL E2E

on:
  push:
    branches:
      - feat/m-found-12-e2e-production-validation
  pull_request:
    paths:
      - 'test/m-found-12-postgres-e2e.test.ts'
      - 'test/foundation-worker-postgres-e2e.test.ts'
      - 'test/r29-video-postgres-e2e.test.ts'
      - 'test/r29-video-core-runtime.test.ts'
      - 'test/crm-sales-postgres-e2e.test.ts'
      - '.github/workflows/m-found-12-postgres-e2e.yml'
      - 'migrations/**'
      - 'src/content/**'
      - 'src/registry.ts'
      - 'src/persistence/**'
      - 'src/events/**'
      - 'src/workflow/**'
      - 'src/crm/**'
      - 'src/scheduler/**'
      - 'src/worker/**'

permissions:
  contents: write

concurrency:
  group: m-found-12-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  crm-sales-one-shot-normalize:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/next-crm-sales-engine-advanced-20260820'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout CRM branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/next-crm-sales-engine-advanced-20260820
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply CRM Core integration patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'PATTERN_NOT_FOUND:{path_name}:{old[:80]}')
              path.write_text(text.replace(old, new, 1))

          # Exact canonical audit readback table.
          replace(
              'test/crm-sales-postgres-e2e.test.ts',
              "`select count(*)::text as count from internal_audit_ledger\n          where tenant_id=$1 and workspace_id=$2 and organization_id=$3\n            and record_type='OPPORTUNITY' and record_id=$4`",
              "`select count(*)::text as count from audit_ledger_events\n          where tenant_id=$1 and workspace_id=$2 and organization_id=$3\n            and tool_name='core.crm.sales.opportunity.updated' and external_resource_id=$4`",
          )

          # Core authenticated runtime context: payload cannot spoof identity/scope/audit actor.
          replace(
              'src/mcp/core-execution.ts',
              "export interface CoreCapabilityRuntimeBinding {\n  readonly inputSchema: CoreInputParser;\n  execute(input: unknown): Promise<unknown>;",
              "export interface CoreCapabilityRuntimeContext {\n  readonly identity: ExecutionIdentity;\n  readonly executionId: string;\n  readonly correlationId: string;\n}\n\nexport interface CoreCapabilityRuntimeBinding {\n  readonly inputSchema: CoreInputParser;\n  execute(input: unknown, context?: CoreCapabilityRuntimeContext): Promise<unknown>;",
          )
          replace(
              'src/mcp/core-execution.ts',
              "const result = await resolved.binding.execute(resolved.payload);",
              "const result = await resolved.binding.execute(resolved.payload, {\n      identity,\n      executionId,\n      correlationId,\n    });",
          )

          # CRM runtime uses an explicit PostgreSQL readback adapter for append-only activities.
          replace(
              'src/crm/runtime.ts',
              "import type { CrmCoreStore, CrmMutationMetadata, CrmScope } from './crm-records.js';",
              "import type { CrmCoreStore, CrmMutationMetadata, CrmScope } from './crm-records.js';\nimport type { CrmSalesPersistenceReadback } from '../persistence/postgres-crm-sales-readback.js';",
          )
          replace(
              'src/crm/runtime.ts',
              "export interface CrmSalesRuntimeServices {\n  readonly core: CrmCoreStore;\n  readonly sales: CrmSalesStore;\n}",
              "export interface CrmSalesRuntimeServices {\n  readonly core: CrmCoreStore;\n  readonly sales: CrmSalesStore;\n  readonly persistenceReadback: CrmSalesPersistenceReadback;\n}",
          )
          replace(
              'src/crm/runtime.ts',
              "const persisted = await services.sales.getActivity({",
              "const persisted = await services.persistenceReadback.activityExists({",
          )

          # Runtime resolver composition.
          replace(
              'src/mcp/runtime-capability-resolver.ts',
              "import { VIDEO_CONTENT_TECHNICAL_EXTENSION_CAPABILITY_SET } from '../content/capability-ids.js';",
              "import { VIDEO_CONTENT_TECHNICAL_EXTENSION_CAPABILITY_SET } from '../content/capability-ids.js';\nimport {\n  resolveCrmSalesRuntimeBinding,\n  type CrmSalesRuntimeServices,\n} from '../crm/runtime.js';",
          )
          replace(
              'src/mcp/runtime-capability-resolver.ts',
              "  readonly videoContent?: VideoContentRuntimeService;\n}",
              "  readonly videoContent?: VideoContentRuntimeService;\n  readonly crmSales?: CrmSalesRuntimeServices;\n}",
          )
          replace(
              'src/mcp/runtime-capability-resolver.ts',
              "function resolveBinding(\n  capabilityId: string,\n  services: RuntimeCapabilityServices,\n): CoreCapabilityRuntimeBinding | undefined {\n  const instagramPublication",
              "function resolveBinding(\n  capabilityId: string,\n  services: RuntimeCapabilityServices,\n): CoreCapabilityRuntimeBinding | undefined {\n  const crmSales = resolveCrmSalesRuntimeBinding(capabilityId, services.crmSales);\n  if (crmSales) return crmSales;\n\n  const instagramPublication",
          )

          # Registry exposes the existing R10 IDs as IMPLEMENTED only when PostgreSQL runtime exists.
          replace(
              'src/registry.ts',
              "import { ToolRegistry, type ToolDefinition } from './core/tool-registry.js';",
              "import { ToolRegistry, type ToolDefinition } from './core/tool-registry.js';\nimport { CRM_SALES_RUNTIME_TOOL_DEFINITIONS } from './crm/runtime.js';",
          )
          replace(
              'src/registry.ts',
              "  readonly videoContentRuntimeEnabled?: boolean;\n}",
              "  readonly videoContentRuntimeEnabled?: boolean;\n  readonly crmSalesRuntimeEnabled?: boolean;\n}",
          )
          replace(
              'src/registry.ts',
              "  if (options.videoContentRuntimeEnabled)\n    for (const tool of videoContentRuntimeTools) registry.register(tool);\n  return registry;",
              "  if (options.videoContentRuntimeEnabled)\n    for (const tool of videoContentRuntimeTools) registry.register(tool);\n  if (options.crmSalesRuntimeEnabled)\n    for (const tool of CRM_SALES_RUNTIME_TOOL_DEFINITIONS) registry.register(tool);\n  return registry;",
          )

          # Server composes the CRM stores into the existing Core; no second MCP/CRM/runtime.
          replace(
              'src/server.ts',
              "import { PostgresApprovalStore } from './persistence/postgres-approval-store.js';",
              "import { PostgresApprovalStore } from './persistence/postgres-approval-store.js';\nimport { PostgresCrmCoreStore } from './persistence/postgres-crm-core-store.js';\nimport { PostgresCrmSalesStore } from './persistence/postgres-crm-sales-store.js';\nimport { PostgresCrmSalesPersistenceReadback } from './persistence/postgres-crm-sales-readback.js';",
          )
          replace(
              'src/server.ts',
              "    videoContentRuntimeEnabled: Boolean(pool),\n  });",
              "    videoContentRuntimeEnabled: Boolean(pool),\n    crmSalesRuntimeEnabled: Boolean(pool),\n  });",
          )
          replace(
              'src/server.ts',
              "  const videoContent = pool ? new PostgresVideoContentRuntime(pool) : undefined;\n\n  const runtimeResolver",
              "  const videoContent = pool ? new PostgresVideoContentRuntime(pool) : undefined;\n  const crmCore = pool ? new PostgresCrmCoreStore(pool) : undefined;\n  const crmSales = pool ? new PostgresCrmSalesStore(pool) : undefined;\n  const crmSalesReadback = pool ? new PostgresCrmSalesPersistenceReadback(pool) : undefined;\n\n  const runtimeResolver",
          )
          replace(
              'src/server.ts',
              "    ...(videoContent ? { videoContent } : {}),\n  });",
              "    ...(videoContent ? { videoContent } : {}),\n    ...(crmCore && crmSales && crmSalesReadback\n      ? { crmSales: { core: crmCore, sales: crmSales, persistenceReadback: crmSalesReadback } }\n      : {}),\n  });",
          )

          # Remove temporary helper and restore the permanent PostgreSQL gate definition.
          helper = Path('.github/workflows/crm-sales-format-helper.yml')
          if helper.exists():
              helper.unlink()

          Path('.github/workflows/m-found-12-postgres-e2e.yml').write_text('''name: M-FOUND-12 PostgreSQL E2E

