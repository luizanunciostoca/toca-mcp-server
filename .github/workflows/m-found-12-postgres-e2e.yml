name: M-FOUND-12 PostgreSQL E2E

on:
  push:
    branches:
      - feat/m-found-12-e2e-production-validation
      - feat/next-crm-sales-engine-advanced-20260820
  pull_request:
    paths:
      - 'test/m-found-12-postgres-e2e.test.ts'
      - 'test/foundation-worker-postgres-e2e.test.ts'
      - 'test/r29-video-postgres-e2e.test.ts'
      - 'test/r29-video-core-runtime.test.ts'
      - 'test/crm-sales-postgres-e2e.test.ts'
      - '.github/workflows/m-found-12-postgres-e2e.yml'
      - 'migrations/**'
      - 'src/content/**'
      - 'src/registry.ts'
      - 'src/persistence/**'
      - 'src/events/**'
      - 'src/workflow/**'
      - 'src/crm/**'
      - 'src/scheduler/**'
      - 'src/worker/**'

permissions:
  contents: write

concurrency:
  group: m-found-12-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  crm-sales-strict-type-repair:
    if: github.event_name == 'push' && github.event.head_commit.message == 'chore(crm): trigger strict type repair'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout CRM branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/next-crm-sales-engine-advanced-20260820
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Repair exact optional and canonical helper typing
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          runtime = Path('src/crm/runtime.ts')
          text = runtime.read_text()
          old = "return services.sales.resolveContact({ ...scope, channels: input.channels });"
          new = """return services.sales.resolveContact({
          ...scope,
          channels: input.channels.map((channel) => ({
            channelType: channel.channelType,
            value: channel.value,
            ...(channel.provider !== undefined ? { provider: channel.provider } : {}),
          })),
        });"""
          if old not in text:
              raise SystemExit('CRM_RUNTIME_CHANNELS_PATTERN_NOT_FOUND')
          text = text.replace(old, new, 1)
          old = """preferredOwnerPrincipalId: input.preferredOwnerPrincipalId,
              })"""
          new = """...(input.preferredOwnerPrincipalId !== undefined
                  ? { preferredOwnerPrincipalId: input.preferredOwnerPrincipalId }
                  : {}),
              })"""
          if old not in text:
              raise SystemExit('CRM_RUNTIME_PREFERRED_OWNER_PATTERN_NOT_FOUND')
          text = text.replace(old, new, 1)
          old = """humanOverride: input.humanOverride,
          });"""
          new = """...(input.humanOverride !== undefined
              ? { humanOverride: input.humanOverride }
              : {}),
          });"""
          if old not in text:
              raise SystemExit('CRM_RUNTIME_HUMAN_OVERRIDE_PATTERN_NOT_FOUND')
          runtime.write_text(text.replace(old, new, 1))

          store = Path('src/persistence/postgres-crm-sales-store.ts')
          text = store.read_text()
          text = text.replace('Required<CrmMutationMetadata>', 'CrmSalesMutationMetadata')
          marker = "interface ContactCandidateRow {"
          alias = "type CrmSalesMutationMetadata = Required<Omit<CrmMutationMetadata, 'now'>>;\n\n"
          if marker not in text:
              raise SystemExit('CRM_STORE_ALIAS_MARKER_NOT_FOUND')
          text = text.replace(marker, alias + marker, 1)
          text, count = re.subn(
              r"nullableCrmText\(([^,()]+),\s*'CRM_[A-Z0-9_]+'\)",
              r"nullableCrmText(\1)",
              text,
          )
          if count < 10:
              raise SystemExit(f'CRM_STORE_NULLABLE_REPAIR_TOO_FEW:{count}')
          store.write_text(text)
          PY
      - name: Format lint and typecheck repaired sources
        run: |
          pnpm exec prettier --write src/crm/runtime.ts src/persistence/postgres-crm-sales-store.ts
          pnpm exec eslint src/crm/runtime.ts src/persistence/postgres-crm-sales-store.ts
          pnpm typecheck
      - name: Commit source repair only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/crm/runtime.ts src/persistence/postgres-crm-sales-store.ts
          git commit -m 'fix(crm): satisfy strict runtime and store typing'
          git push origin HEAD:feat/next-crm-sales-engine-advanced-20260820

  postgres-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: toca
          POSTGRES_PASSWORD: toca-m12-local-only
          POSTGRES_DB: toca_m12
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toca -d toca_m12"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://toca:toca-m12-local-only@127.0.0.1:5432/toca_m12
      DATABASE_SSL: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply real repository migrations
        run: pnpm migrate
      - name: Execute PostgreSQL restart/outbox/audit, CRM Sales, worker restart safety and Video/R29 E2E
        run: >-
          pnpm exec vitest run
          test/m-found-12-postgres-e2e.test.ts
          test/crm-sales-postgres-e2e.test.ts
          test/foundation-worker-postgres-e2e.test.ts
          test/r29-video-postgres-e2e.test.ts
      - name: Verify no migration drift was introduced during execution
        run: pnpm migrate
