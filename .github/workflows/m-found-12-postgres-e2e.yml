name: M-FOUND-12 PostgreSQL E2E

on:
  pull_request:
    paths:
      - '.github/workflows/m-found-12-postgres-e2e.yml'
      - '.github/workflows/quality.yml'
      - '.github/workflows/crm-sales-catalog-one-shot.yml'
      - 'docs/checkpoints/next-crm-sales-engine-advanced.md'
      - 'src/governance/capability-catalog.ts'
      - 'src/registry.ts'
      - 'src/crm/**'
      - 'src/persistence/**'
      - 'test/crm-sales-runtime-contract.test.ts'
      - 'test/crm-sales-postgres-e2e.test.ts'

permissions:
  contents: write

concurrency:
  group: crm-sales-catalog-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  crm-sales-catalog-finalizer:
    if: github.event.pull_request.head.ref == 'feat/next-crm-sales-engine-advanced-20260820'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout CRM branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/next-crm-sales-engine-advanced-20260820
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Align canonical R10 catalog and create contract test
        run: |
          python - <<'PY'
          from pathlib import Path

          catalog = Path('src/governance/capability-catalog.ts')
          text = catalog.read_text()
          old = """    googleAdsPhase: 'MANAGE',
    tocaManagedInstagramSchedulerEnabled: true,
  })"""
          new = """    googleAdsPhase: 'MANAGE',
    tocaManagedInstagramSchedulerEnabled: true,
    crmSalesRuntimeEnabled: true,
  })"""
          if old in text:
              text = text.replace(old, new, 1)
          elif 'crmSalesRuntimeEnabled: true' not in text:
              raise SystemExit('CRM_SALES_CATALOG_ALIGNMENT_PATTERN_NOT_FOUND')
          catalog.write_text(text)

          Path('test/crm-sales-runtime-contract.test.ts').write_text("""import { describe, expect, it } from 'vitest';
import { getCapabilityDefinition } from '../src/governance/capability-catalog.js';
import { createToolRegistry } from '../src/registry.js';

const READ_CAPABILITIES = ['sales.lead.enrich', 'sales.report.generate'] as const;
const WRITE_CAPABILITIES = [
  'sales.lead.create',
  'sales.lead.qualify',
  'sales.pipeline.update',
  'sales.followup.create',
  'sales.followup.schedule',
] as const;

describe('CRM Sales R10 runtime contract', () => {
  it('keeps catalog and registry lifecycle/risk contracts aligned', () => {
    const registry = createToolRegistry({ crmSalesRuntimeEnabled: true });

    for (const capabilityId of READ_CAPABILITIES) {
      expect(registry.get(capabilityId)).toMatchObject({
        capabilityStatus: 'IMPLEMENTED',
        riskClass: 'READ',
        sideEffects: false,
        idempotent: true,
      });
      expect(getCapabilityDefinition(capabilityId)).toMatchObject({
        lifecycle_status: 'IMPLEMENTED',
        risk_class: 'READ',
        side_effects: false,
        idempotent: true,
        execution_surface: 'MCP_TOOL',
      });
    }

    for (const capabilityId of WRITE_CAPABILITIES) {
      expect(registry.get(capabilityId)).toMatchObject({
        capabilityStatus: 'IMPLEMENTED',
        riskClass: 'WRITE_REVERSIBLE',
        sideEffects: true,
        idempotent: true,
      });
      expect(getCapabilityDefinition(capabilityId)).toMatchObject({
        lifecycle_status: 'IMPLEMENTED',
        risk_class: 'WRITE_REVERSIBLE',
        side_effects: true,
        idempotent: true,
        execution_surface: 'MCP_TOOL',
      });
    }
  });
});
""")
          PY
      - name: Validate catalog integration
        run: |
          pnpm exec prettier --write src/governance/capability-catalog.ts test/crm-sales-runtime-contract.test.ts
          pnpm exec eslint src/governance/capability-catalog.ts test/crm-sales-runtime-contract.test.ts
          pnpm typecheck
          pnpm exec vitest run test/crm-sales-runtime-contract.test.ts
      - name: Restore permanent workflows and commit integration
        run: |
          git show origin/main:.github/workflows/quality.yml > .github/workflows/quality.yml
          git show origin/main:.github/workflows/m-found-12-postgres-e2e.yml > .github/workflows/m-found-12-postgres-e2e.yml
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/m-found-12-postgres-e2e.yml')
          text = path.read_text()
          path_anchor = "      - 'test/r29-video-core-runtime.test.ts'\n"
          if "      - 'test/crm-sales-postgres-e2e.test.ts'\n" not in text:
              if path_anchor not in text:
                  raise SystemExit('CRM_SALES_POSTGRES_PATH_ANCHOR_NOT_FOUND')
              text = text.replace(
                  path_anchor,
                  path_anchor + "      - 'test/crm-sales-postgres-e2e.test.ts'\n",
                  1,
              )
          old_name = 'Execute PostgreSQL restart/outbox/audit, worker restart safety and Video/R29 E2E'
          text = text.replace(
              old_name,
              'Execute PostgreSQL restart/outbox/audit, CRM Sales, worker restart safety and Video/R29 E2E',
              1,
          )
          run_anchor = '          test/m-found-12-postgres-e2e.test.ts\n'
          if '          test/crm-sales-postgres-e2e.test.ts\n' not in text:
              if run_anchor not in text:
                  raise SystemExit('CRM_SALES_POSTGRES_RUN_ANCHOR_NOT_FOUND')
              text = text.replace(
                  run_anchor,
                  run_anchor + '          test/crm-sales-postgres-e2e.test.ts\n',
                  1,
              )
          path.write_text(text)
          PY
          rm -f .github/workflows/crm-sales-catalog-one-shot.yml
          pnpm exec prettier --write .github/workflows/quality.yml .github/workflows/m-found-12-postgres-e2e.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/governance/capability-catalog.ts test/crm-sales-runtime-contract.test.ts .github/workflows/quality.yml .github/workflows/m-found-12-postgres-e2e.yml
          git add -u .github/workflows
          git commit -m 'fix(crm): align canonical R10 runtime contract'
          git push origin HEAD:feat/next-crm-sales-engine-advanced-20260820
