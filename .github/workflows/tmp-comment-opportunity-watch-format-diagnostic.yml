name: Temporary Comment Opportunity Watch Format Diagnostic

on:
  push:
    branches:
      - feat/instagram-comment-canary-opportunity-watch-20260903

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact pinned-Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier test/instagram-engagement-comment-canary-opportunity-watch.test.ts --write
          git diff --check
          git diff -- test/instagram-engagement-comment-canary-opportunity-watch.test.ts
