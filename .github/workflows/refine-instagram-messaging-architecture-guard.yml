name: Refine Instagram Messaging Architecture Guard

on:
  push:
    branches:
      - feat/instagram-messaging-readonly-20260828
    paths:
      - '.github/workflows/refine-instagram-messaging-architecture-guard.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/instagram-messaging-readonly-20260828
          fetch-depth: 0
      - name: Refine exact ToolDefinition boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('scripts/architecture-check.mjs')
          source = path.read_text()
          old = "  const definition = registry.slice(start, start + 800);"
          new = r"""  const end = registry.indexOf('\n  },', start);
          const definition = registry.slice(start, end === -1 ? registry.length : end);"""
          if old not in source:
              raise SystemExit('INSTAGRAM_MESSAGING_DEFINITION_BOUNDARY_NOT_FOUND')
          path.write_text(source.replace(old, new, 1))
          PY
          node --check scripts/architecture-check.mjs
          node scripts/architecture-check.mjs
          git diff --check
      - name: Commit refined guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TOCA OS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/architecture-check.mjs
          git commit -m 'fix(architecture): bind Instagram read guard to exact definitions'
          git push origin HEAD:feat/instagram-messaging-readonly-20260828
