name: Scheduler Live Health Probe 2026-09-02

on:
  push:
    branches:
      - diag/scheduler-live-health-20260902
    paths:
      - .github/workflows/scheduler-live-health-probe-20260902.yml

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  DAEMON_SERVICE_NAME: toca-managed-instagram-daemon
  SCHEDULER_JOB_NAME: toca-managed-instagram-tick

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Authenticate diagnostics session
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Resolve explicit observation window
        shell: bash
        run: |
          set -euo pipefail
          WINDOW_END="$(node -e 'console.log(new Date().toISOString())')"
          WINDOW_START="$(node -e 'console.log(new Date(Date.now()-10*60*1000).toISOString())')"
          {
            echo "WINDOW_START=$WINDOW_START"
            echo "WINDOW_END=$WINDOW_END"
          } >> "$GITHUB_ENV"
          mkdir -p scheduler-health-evidence
          jq -n --arg start "$WINDOW_START" --arg end "$WINDOW_END" \
            '{schemaVersion:"toca.scheduler.observation-window.v1",windowStart:$start,windowEnd:$end,readOnly:true}' \
            > scheduler-health-evidence/window.json

      - name: Read Cloud Run and Cloud Scheduler topology
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$DAEMON_SERVICE_NAME" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            > scheduler-health-evidence/daemon-service.json
          gcloud scheduler jobs describe "$SCHEDULER_JOB_NAME" \
            --project "$GCP_PROJECT_ID" --location "$GCP_REGION" --format=json \
            > scheduler-health-evidence/cloud-scheduler-job.json

          SERVICE_URL="$(jq -r '.status.url // empty' scheduler-health-evidence/daemon-service.json)"
          test -n "$SERVICE_URL"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"

          jq -e '
            any(.status.conditions[]?; .type == "Ready" and .status == "True") and
            (.status.latestReadyRevisionName | type == "string" and length > 0) and
            (.spec.template.spec.containerConcurrency == 1) and
            ([.spec.template.spec.containers[0].env[]? | select(.name == "TOCA_MANAGED_INSTAGRAM_SCHEDULER_ENABLED") | .value] == ["true"]) and
            ([.spec.template.spec.containers[0].env[]? | select(.name == "TOCA_MANAGED_INSTAGRAM_EXECUTOR_ENABLED") | .value] == ["true"]) and
            ([.spec.template.spec.containers[0].env[]? | select(.name == "INSTAGRAM_PUBLICATION_WRITES_ENABLED") | .value] == ["false"])
          ' scheduler-health-evidence/daemon-service.json >/dev/null

          jq -e --arg serviceUrl "$SERVICE_URL" --arg runtimeSa "$GCP_RUNTIME_SERVICE_ACCOUNT" '
            .state == "ENABLED" and
            .schedule == "* * * * *" and
            .timeZone == "America/Bahia" and
            .httpTarget.httpMethod == "POST" and
            .httpTarget.uri == ($serviceUrl + "/tick") and
            .httpTarget.oidcToken.serviceAccountEmail == $runtimeSa
          ' scheduler-health-evidence/cloud-scheduler-job.json >/dev/null
          echo 'SCHEDULER_TOPOLOGY_LIVE=PASS'

      - name: Read explicitly time-bounded live logs
        shell: bash
        run: |
          set -euo pipefail
          DAEMON_FILTER="resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${DAEMON_SERVICE_NAME}\" AND timestamp>=\"${WINDOW_START}\" AND timestamp<=\"${WINDOW_END}\""
          SCHEDULER_FILTER="resource.type=\"cloud_scheduler_job\" AND resource.labels.job_id=\"${SCHEDULER_JOB_NAME}\" AND timestamp>=\"${WINDOW_START}\" AND timestamp<=\"${WINDOW_END}\""
          gcloud logging read "$DAEMON_FILTER" \
            --project "$GCP_PROJECT_ID" --limit=3000 --order=asc --format=json \
            > /tmp/daemon-logs.json || printf '[]\n' > /tmp/daemon-logs.json
          gcloud logging read "$SCHEDULER_FILTER" \
            --project "$GCP_PROJECT_ID" --limit=2000 --order=asc --format=json \
            > /tmp/scheduler-logs.json || printf '[]\n' > /tmp/scheduler-logs.json

          node <<'NODE'
          const fs = require('fs');
          const daemon = JSON.parse(fs.readFileSync('/tmp/daemon-logs.json','utf8') || '[]');
          const scheduler = JSON.parse(fs.readFileSync('/tmp/scheduler-logs.json','utf8') || '[]');
          const start = Date.parse(process.env.WINDOW_START);
          const end = Date.parse(process.env.WINDOW_END);
          const strings = (v,out=[]) => {
            if (typeof v === 'string') out.push(v);
            else if (Array.isArray(v)) for (const x of v) strings(x,out);
            else if (v && typeof v === 'object') for (const x of Object.values(v)) strings(x,out);
            return out;
          };
          const inWindow = e => {
            const t = Date.parse(e?.timestamp ?? '');
            return Number.isFinite(t) && t >= start && t <= end;
          };
          if (!daemon.every(inWindow) || !scheduler.every(inWindow)) throw new Error('LOG_QUERY_RETURNED_ENTRY_OUTSIDE_EXPLICIT_WINDOW');

          const daemonEvents = daemon.map(e => ({e, joined:strings(e).join(' ')}));
          const completed = daemonEvents.filter(x => x.joined.includes('toca.managed.instagram.daemon.tick.completed'));
          const failed = daemonEvents.filter(x => x.joined.includes('toca.managed.instagram.daemon.tick.failed'));
          const selfTests = daemonEvents.filter(x => x.joined.includes('toca.managed.instagram.daemon.scheduler_self_test.passed'));
          const latestCompleted = completed.at(-1)?.e?.timestamp ?? null;
          const latestFailed = failed.at(-1)?.e?.timestamp ?? null;

          const schedulerTypes = {};
          const schedulerStatusCodes = {};
          for (const e of scheduler) {
            const type = e?.jsonPayload?.['@type'] ?? 'UNKNOWN';
            schedulerTypes[type] = (schedulerTypes[type] ?? 0) + 1;
            const code = e?.jsonPayload?.status ?? e?.httpRequest?.status ?? e?.severity ?? 'UNKNOWN';
            const key = typeof code === 'object' ? JSON.stringify(code) : String(code);
            schedulerStatusCodes[key] = (schedulerStatusCodes[key] ?? 0) + 1;
          }
          const schedulerErrorEntries = scheduler.filter(e => {
            const joined = strings(e).join(' ');
            const sev = String(e?.severity ?? '').toUpperCase();
            const http = Number(e?.httpRequest?.status ?? 0);
            return sev === 'ERROR' || sev === 'CRITICAL' || http >= 400 || /PERMISSION_DENIED|UNAUTHENTICATED|DEADLINE_EXCEEDED|INTERNAL/i.test(joined);
          });

          const result = {
            schemaVersion:'toca.scheduler.time-bounded-live-evidence.v1',
            windowStart:process.env.WINDOW_START,
            windowEnd:process.env.WINDOW_END,
            readOnlyProbe:true,
            externalPublicationWritesAuthorized:false,
            daemon:{
              logCount:daemon.length,
              tickCompletedCount:completed.length,
              tickFailedCount:failed.length,
              schedulerSelfTestPassedCount:selfTests.length,
              latestTickCompletedAt:latestCompleted,
              latestTickFailedAt:latestFailed
            },
            cloudScheduler:{
              logCount:scheduler.length,
              entryTypes:schedulerTypes,
              observedStatusCodes:schedulerStatusCodes,
              errorEntryCount:schedulerErrorEntries.length,
              latestLogAt:scheduler.at(-1)?.timestamp ?? null
            }
          };
          fs.writeFileSync('scheduler-health-evidence/time-bounded-signals.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));

          if (completed.length < 1) throw new Error('NO_CURRENT_TICK_COMPLETED_IN_EXPLICIT_WINDOW');
          if (failed.length > 0) throw new Error('CURRENT_TICK_FAILED_PRESENT_IN_EXPLICIT_WINDOW');
          if (!latestCompleted || Date.parse(latestCompleted) < start) throw new Error('LATEST_TICK_COMPLETED_OUTSIDE_WINDOW');
          if (scheduler.length < 1) throw new Error('NO_CURRENT_CLOUD_SCHEDULER_LOGS_IN_EXPLICIT_WINDOW');
          if (schedulerErrorEntries.length > 0) throw new Error('CURRENT_CLOUD_SCHEDULER_ERROR_PRESENT_IN_EXPLICIT_WINDOW');
          NODE
          echo 'TIME_BOUNDED_LIVE_TICK=PASS'

      - name: Validate current scheduler attempt timestamp
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const job=JSON.parse(fs.readFileSync('scheduler-health-evidence/cloud-scheduler-job.json','utf8'));
          const start=Date.parse(process.env.WINDOW_START);
          const last=Date.parse(job.lastAttemptTime ?? '');
          if (!Number.isFinite(last) || last < start) throw new Error(`LAST_ATTEMPT_NOT_CURRENT:${job.lastAttemptTime}`);
          fs.writeFileSync('scheduler-health-evidence/current-attempt.json',JSON.stringify({lastAttemptTime:job.lastAttemptTime,windowStart:process.env.WINDOW_START,current:true},null,2)+'\n');
          console.log('CLOUD_SCHEDULER_CURRENT_ATTEMPT=PASS');
          NODE

      - name: Build final read-only scheduler summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const read=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return null}};
          const svc=read('scheduler-health-evidence/daemon-service.json');
          const job=read('scheduler-health-evidence/cloud-scheduler-job.json');
          const sig=read('scheduler-health-evidence/time-bounded-signals.json');
          const cur=read('scheduler-health-evidence/current-attempt.json');
          const summary={
            schemaVersion:'toca.scheduler.final-live-health-summary.v1',
            observedAt:new Date().toISOString(),
            readOnlyProbe:true,
            externalPublicationWritesAuthorized:false,
            topology:{
              serviceReady:svc?.status?.conditions?.some?.(x=>x.type==='Ready'&&x.status==='True') ?? false,
              latestReadyRevision:svc?.status?.latestReadyRevisionName ?? null,
              schedulerState:job?.state ?? null,
              schedule:job?.schedule ?? null,
              timeZone:job?.timeZone ?? null,
              lastAttemptTime:job?.lastAttemptTime ?? null
            },
            currentAttempt:cur,
            timeBoundedSignals:sig
          };
          fs.writeFileSync('scheduler-health-evidence/final-summary.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify(summary,null,2));
          NODE

      - name: Upload live-health evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scheduler-live-health-${{ github.run_id }}
          path: scheduler-health-evidence
          if-no-files-found: error
          retention-days: 30
