name: TEMP Run WIF ID token patch on PR 2026-08-23

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/staging-wif-id-token-20260823' && !contains(github.event.pull_request.head.sha, 'never')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/staging-wif-id-token-20260823
          fetch-depth: 1

      - name: Extract and execute exact patch body
        shell: bash
        run: |
          set -euo pipefail
          awk '/^          python3 <<'\''PY'\''$/{capture=1;next} capture && /^          PY$/{exit} capture{sub(/^          /, ""); print}' \
            .github/workflows/tmp-patch-wif-id-token-20260823.yml > /tmp/patch.py
          test -s /tmp/patch.py
          python3 /tmp/patch.py

      - name: Format and run focused regression
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier --write test/gcp-staging-canonical-workflow.test.ts
          git diff --check
          pnpm vitest run test/gcp-staging-canonical-workflow.test.ts

      - name: Commit permanent files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-gcp-staging-canonical.yml .github/workflows/staging-runtime-observability.yml test/gcp-staging-canonical-workflow.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(staging): mint Cloud Run ID tokens through WIF [wif-id-token-patched]'
          git push origin HEAD:fix/staging-wif-id-token-20260823
