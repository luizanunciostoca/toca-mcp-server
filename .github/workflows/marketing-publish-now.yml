name: Marketing Publish Now

run-name: Marketing Publish Now — ${{ inputs.scheduler_content_item_id || github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - control/marketing-publish-now-command.json
  workflow_dispatch:
    inputs:
      scheduler_content_item_id:
        description: Exact approved Content Registry item selected by Marketing Autopilot.
        required: true
        type: string
      scheduler_scheduled_at:
        description: Exact America/Bahia scheduled_at value observed by the scheduler.
        required: true
        type: string
      scheduler_source_run_id:
        description: GitHub Actions scheduler run that authorized this dispatch.
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: marketing-instagram-publish-now
  cancel-in-progress: false

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  DATABASE_SECRET_ID: toca-database-url
  DATABASE_SECRET_VERSION: '1'
  TOKEN_SECRET_ID: toca-meta-oauth-token
  PUBLICATION_ASSET_BUCKET: toca-mcp-publication-assets
  PREPARE_JOB_NAME: toca-marketing-publish-now-prepare
  EXECUTE_JOB_NAME: toca-marketing-publish-now-execute
  DUPLICATE_PREFLIGHT_JOB_NAME: toca-marketing-publish-now-duplicate-preflight
  INSTAGRAM_ACCOUNT_ID: '17841402033495654'
  REDIRECT_URI: https://toca-meta-oauth-staging-990081828836.southamerica-east1.run.app/oauth/meta/callback
  REQUIRED_CTA: 'Ingressos limitados! garanta o seu pelo link na bio.'
  MARKETING_AUTOPILOT_POLICY_PATH: control/marketing-autopilot-scheduler-policy.json
  HEARTBEAT_WORKFLOW_NAME: GitHub Native Instagram Publisher
  HEARTBEAT_WORKFLOW_PATH: .github/workflows/github-native-instagram-publisher.yml

jobs:
  publish-now:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify publish-now invocation
        id: invocation
        shell: bash
        env:
          SCHEDULER_CONTENT_ITEM_ID: ${{ inputs.scheduler_content_item_id }}
          SCHEDULER_SCHEDULED_AT: ${{ inputs.scheduler_scheduled_at }}
          SCHEDULER_SOURCE_RUN_ID: ${{ inputs.scheduler_source_run_id }}
        run: |
          set -euo pipefail
          COMMAND=control/marketing-publish-now-command.json
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test -n "$SCHEDULER_CONTENT_ITEM_ID"
            test -n "$SCHEDULER_SCHEDULED_AT"
            test -n "$SCHEDULER_SOURCE_RUN_ID"
            jq -e '.schemaVersion == 1 and .action == "NOOP"' "$COMMAND" >/dev/null
            test "$GITHUB_REF" = "refs/heads/main"
            echo 'action=PUBLISH_NOW' >> "$GITHUB_OUTPUT"
            echo 'source=MARKETING_AUTOPILOT' >> "$GITHUB_OUTPUT"
            echo "content_item_id=$SCHEDULER_CONTENT_ITEM_ID" >> "$GITHUB_OUTPUT"
            echo "target_code_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo 'PUBLISH_NOW_DURABLE_COMMAND=NOOP'
            exit 0
          fi

          jq -e '.schemaVersion == 1 and (.action | IN("NOOP", "PUBLISH_NOW"))' "$COMMAND" >/dev/null
          action="$(jq -r .action "$COMMAND")"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo 'source=PROTECTED_COMMAND_FILE' >> "$GITHUB_OUTPUT"
          if [ "$action" = PUBLISH_NOW ]; then
            jq -e '.targetCodeSha | test("^[a-f0-9]{40}$")' "$COMMAND" >/dev/null
            echo "content_item_id=$(jq -r .contentItemId "$COMMAND")" >> "$GITHUB_OUTPUT"
            echo "target_code_sha=$(jq -r .targetCodeSha "$COMMAND")" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify one-shot scheduled-run authorization before cloud authentication
        if: steps.invocation.outputs.source == 'MARKETING_AUTOPILOT'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.scheduler_source_run_id }}
          CONTENT_ITEM_ID: ${{ inputs.scheduler_content_item_id }}
          SCHEDULED_AT: ${{ inputs.scheduler_scheduled_at }}
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_RUN_ID" | grep -Eq '^[0-9]+$'
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > /tmp/source-run.json
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" '
              .name == "Marketing Autopilot Publication" and
              (.event == "schedule" or .event == "workflow_run") and
              .head_branch == "main" and
              .head_sha == $sha and
              .repository.full_name == $repository and
              ((.status == "queued" or .status == "in_progress") or
               (.status == "completed" and .conclusion == "success"))
            ' /tmp/source-run.json >/dev/null
          source_event="$(jq -r .event /tmp/source-run.json)"
          created_at="$(jq -r .created_at /tmp/source-run.json)"
          created_epoch="$(date -d "$created_at" +%s)"
          now_epoch="$(date +%s)"
          age=$((now_epoch - created_epoch))
          test "$age" -ge -120
          test "$age" -le 1800

          rm -rf /tmp/source-authorization
          mkdir -p /tmp/source-authorization
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "marketing-autopilot-writer-authorization-${SOURCE_RUN_ID}" \
            --dir /tmp/source-authorization
          authorization=/tmp/source-authorization/marketing-autopilot-writer-authorization.json
          test -s "$authorization"
          jq -e \
            --arg sourceRunId "$SOURCE_RUN_ID" \
            --arg sourceSha "$GITHUB_SHA" \
            --arg sourceEvent "$source_event" \
            --arg contentItemId "$CONTENT_ITEM_ID" \
            --arg scheduledAt "$SCHEDULED_AT" '
              .schemaVersion == 1 and
              .sourceRunId == $sourceRunId and
              .sourceSha == $sourceSha and
              .event == "schedule" and
              .sourceEvent == $sourceEvent and
              .contentItemId == $contentItemId and
              .scheduledAt == $scheduledAt and
              .priorAttemptState == "NONE" and
              (.registrySnapshotSha256 | test("^[a-f0-9]{64}$")) and
              (.authorizedAt | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$")) and
              ((.sourceEvent == "schedule" and .triggerKind == "PRIMARY_SCHEDULE" and .upstreamRunId == "") or
               (.sourceEvent == "workflow_run" and .triggerKind == "REDUNDANT_SCHEDULE_HEARTBEAT" and (.upstreamRunId | test("^[0-9]+$"))))
            ' "$authorization" >/dev/null

          if [ "$source_event" = workflow_run ]; then
            upstream_run_id="$(jq -r .upstreamRunId "$authorization")"
            printf '%s' "$upstream_run_id" | grep -Eq '^[0-9]+$'
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${upstream_run_id}" > /tmp/upstream-run.json
            jq -e \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg name "$HEARTBEAT_WORKFLOW_NAME" \
              --arg path "$HEARTBEAT_WORKFLOW_PATH" '
                .name == $name and
                .path == $path and
                .event == "schedule" and
                .head_branch == "main" and
                .run_attempt == 1 and
                .status == "completed" and
                .conclusion == "success" and
                .repository.full_name == $repository
              ' /tmp/upstream-run.json >/dev/null
            upstream_updated_at="$(jq -r .updated_at /tmp/upstream-run.json)"
            upstream_epoch="$(date -d "$upstream_updated_at" +%s)"
            upstream_age=$((now_epoch - upstream_epoch))
            test "$upstream_age" -ge -120
            test "$upstream_age" -le 900
            echo "MARKETING_AUTOPILOT_HEARTBEAT_PROVENANCE=VERIFIED upstream_run_id=$upstream_run_id"
          fi

          authorized_at="$(jq -r .authorizedAt "$authorization")"
          authorized_epoch="$(date -d "$authorized_at" +%s)"
          authorization_age=$((now_epoch - authorized_epoch))
          test "$authorization_age" -ge -120
          test "$authorization_age" -le 900

          expected_title="Marketing Publish Now — ${CONTENT_ITEM_ID}"
          previous_consumers="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/marketing-publish-now.yml/runs?event=workflow_dispatch&per_page=100" \
            | jq --arg title "$expected_title" --argjson current "$GITHUB_RUN_ID" --arg authorized "$authorized_at" \
              '[.workflow_runs[] | select(.display_title == $title and .id != $current and .created_at >= $authorized)] | length')"
          test "$previous_consumers" -eq 0

          snapshot="$(jq -r .registrySnapshotSha256 "$authorization")"
          echo "AUTHORIZED_REGISTRY_SNAPSHOT_SHA256=$snapshot" >> "$GITHUB_ENV"
          echo "AUTHORIZED_SCHEDULER_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"
          echo "MARKETING_AUTOPILOT_SOURCE_RUN_PROVENANCE=VERIFIED run_id=$SOURCE_RUN_ID event=$source_event"

      - name: Verify deterministic brand binding before cloud auth
        if: steps.invocation.outputs.action == 'PUBLISH_NOW' && steps.invocation.outputs.source == 'PROTECTED_COMMAND_FILE'
        run: node scripts/check-publish-now-brand-determinism.mjs

      - name: Verify rights clearance before cloud auth
        if: steps.invocation.outputs.action == 'PUBLISH_NOW' && steps.invocation.outputs.source == 'PROTECTED_COMMAND_FILE'
        run: node scripts/check-publish-now-rights-clearance.mjs

      - name: Authenticate to Google Cloud, Drive and Content Registry
        if: steps.invocation.outputs.action == 'PUBLISH_NOW'
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/drive.readonly,https://www.googleapis.com/auth/spreadsheets

      - name: Build fresh ephemeral scheduler envelope from canonical registry
        if: steps.invocation.outputs.action == 'PUBLISH_NOW' && steps.invocation.outputs.source == 'MARKETING_AUTOPILOT'
        id: ephemeral
        shell: bash
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          MARKETING_AUTOPILOT_CONTENT_ITEM_ID: ${{ inputs.scheduler_content_item_id }}
          MARKETING_AUTOPILOT_TARGET_CODE_SHA: ${{ github.sha }}
          SCHEDULER_SCHEDULED_AT: ${{ inputs.scheduler_scheduled_at }}
          SCHEDULER_SOURCE_RUN_ID: ${{ inputs.scheduler_source_run_id }}
        run: |
          set -euo pipefail
          node scripts/marketing-autopilot-scheduler.mjs build-command > /tmp/autopilot-command.json
          jq -e \
            --arg id "$MARKETING_AUTOPILOT_CONTENT_ITEM_ID" \
            --arg scheduled "$SCHEDULER_SCHEDULED_AT" \
            --arg snapshot "$AUTHORIZED_REGISTRY_SNAPSHOT_SHA256" '
              .status == "COMMAND_READY" and
              .command.contentItemId == $id and
              .command.scheduledAt == $scheduled and
              .command.schedulerBinding.registrySnapshotSha256 == $snapshot
            ' /tmp/autopilot-command.json >/dev/null
          jq \
            --arg sourceRunId "$SCHEDULER_SOURCE_RUN_ID" \
            '.command | .schedulerBinding.sourceRunId = $sourceRunId' \
            /tmp/autopilot-command.json > control/marketing-publish-now-command.json
          jq -e \
            --arg sourceRunId "$AUTHORIZED_SCHEDULER_RUN_ID" \
            '.action == "PUBLISH_NOW" and .publicationIntent == "SHARE_NOW" and .schedulerBinding.sourceRunId == $sourceRunId' \
            control/marketing-publish-now-command.json >/dev/null
          echo "command_id=$(jq -r .commandId control/marketing-publish-now-command.json)" >> "$GITHUB_OUTPUT"
          echo 'PUBLISH_NOW_EPHEMERAL_COMMAND=READY'

      - name: Verify deterministic brand binding
        if: steps.invocation.outputs.action == 'PUBLISH_NOW' && steps.invocation.outputs.source == 'MARKETING_AUTOPILOT'
        run: node scripts/check-publish-now-brand-determinism.mjs

      - name: Verify rights clearance gate
        if: steps.invocation.outputs.action == 'PUBLISH_NOW' && steps.invocation.outputs.source == 'MARKETING_AUTOPILOT'
        run: node scripts/check-publish-now-rights-clearance.mjs

      - if: steps.invocation.outputs.action == 'PUBLISH_NOW'
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Bind execution tree to audited code snapshot
        if: steps.invocation.outputs.action == 'PUBLISH_NOW'
        shell: bash
        env:
          TARGET_CODE_SHA: ${{ steps.invocation.outputs.target_code_sha }}
        run: |
          set -euo pipefail
          cp control/marketing-publish-now-command.json /tmp/marketing-publish-now-command.json
          git cat-file -e "${TARGET_CODE_SHA}^{commit}"
          git checkout --detach "$TARGET_CODE_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_CODE_SHA"
          cp /tmp/marketing-publish-now-command.json control/marketing-publish-now-command.json
          echo "AUDITED_CODE_SHA=$TARGET_CODE_SHA" >> "$GITHUB_ENV"

      - name: Revalidate live Content Registry after audited-tree binding
        if: steps.invocation.outputs.action == 'PUBLISH_NOW' && steps.invocation.outputs.source == 'MARKETING_AUTOPILOT'
        shell: bash
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          MARKETING_AUTOPILOT_CONTENT_ITEM_ID: ${{ inputs.scheduler_content_item_id }}
          MARKETING_AUTOPILOT_TARGET_CODE_SHA: ${{ steps.invocation.outputs.target_code_sha }}
        run: |
          set -euo pipefail
          node scripts/marketing-autopilot-scheduler.mjs verify-command
          node scripts/check-publish-now-brand-determinism.mjs
          node scripts/check-publish-now-rights-clearance.mjs
          test "$(jq -r .schedulerBinding.registrySnapshotSha256 control/marketing-publish-now-command.json)" = "$AUTHORIZED_REGISTRY_SNAPSHOT_SHA256"
          echo 'MARKETING_AUTOPILOT_REGISTRY_REVALIDATION=PASS'

      - name: Provider duplicate read-only preflight
        if: steps.invocation.outputs.action == 'PUBLISH_NOW' && steps.invocation.outputs.source == 'MARKETING_AUTOPILOT'
        shell: bash
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          registry="$REGION-docker.pkg.dev"
          printf '%s' "$GOOGLE_ACCESS_TOKEN" | docker login -u oauth2accesstoken --password-stdin "https://${registry}" >/dev/null
          mkdir -p /tmp/instagram-duplicate-preflight
          cat > /tmp/instagram-duplicate-preflight/read.mjs <<'NODE'
          const token = process.env.META_ACCESS_TOKEN;
          const accountId = process.env.INSTAGRAM_ACCOUNT_ID;
          const contentItemId = process.env.CONTENT_ITEM_ID;
          const caption = Buffer.from(process.env.CAPTION_BASE64 || '', 'base64').toString('utf8');
          const scheduledAt = process.env.SCHEDULED_AT;
          if (!token || !accountId || !contentItemId || !caption || !scheduledAt) {
            throw new Error('INSTAGRAM_DUPLICATE_PREFLIGHT_CONFIG_MISSING');
          }
          const scheduledMs = Date.parse(scheduledAt);
          if (!Number.isFinite(scheduledMs)) throw new Error('INSTAGRAM_DUPLICATE_PREFLIGHT_SCHEDULE_INVALID');
          const url = new URL(`https://graph.facebook.com/v24.0/${accountId}/media`);
          url.searchParams.set('fields', 'id,caption,timestamp,permalink');
          url.searchParams.set('limit', '100');
          const response = await fetch(url, {
            method: 'GET',
            headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
          });
          const body = await response.json();
          if (!response.ok) throw new Error(`INSTAGRAM_DUPLICATE_PREFLIGHT_HTTP_${response.status}`);
          if (!Array.isArray(body?.data)) throw new Error('INSTAGRAM_DUPLICATE_PREFLIGHT_MEDIA_INVALID');
          const lowerBound = scheduledMs - 72 * 60 * 60 * 1000;
          const upperBound = Date.now() + 5 * 60 * 1000;
          const duplicate = body.data.find((item) => {
            const timestamp = typeof item?.timestamp === 'string' ? Date.parse(item.timestamp) : NaN;
            return Number.isFinite(timestamp) && timestamp >= lowerBound && timestamp <= upperBound && item?.caption === caption;
          });
          const evidence = {
            schemaVersion: 1,
            contentItemId,
            instagramAccountId: accountId,
            providerReadOnly: true,
            duplicateFound: Boolean(duplicate),
            duplicatePublicationId: duplicate?.id ?? null,
            duplicatePermalink: duplicate?.permalink ?? null,
            inspectedMediaCount: body.data.length,
            checkedAt: new Date().toISOString(),
          };
          console.log(`INSTAGRAM_DUPLICATE_PREFLIGHT_RESULT=${JSON.stringify(evidence)}`);
          if (duplicate) process.exit(2);
          NODE
          cat > /tmp/instagram-duplicate-preflight/Dockerfile <<'DOCKER'
          FROM node:24-bookworm-slim
          WORKDIR /app
          COPY read.mjs ./read.mjs
          USER node
          CMD ["node", "/app/read.mjs"]
          DOCKER
          tag="$registry/$PROJECT_ID/$REPOSITORY/duplicate-preflight:${AUDITED_CODE_SHA}-${GITHUB_RUN_ID}"
          docker build -t "$tag" /tmp/instagram-duplicate-preflight
          docker push "$tag"
          digest="$(gcloud artifacts docker images describe "$tag" --project "$PROJECT_ID" --format='value(image_summary.digest)')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="${tag%:*}@${digest}"
          caption_base64="$(jq -r .caption control/marketing-publish-now-command.json | base64 -w0)"
          scheduled_at="$(jq -r .scheduledAt control/marketing-publish-now-command.json)"
          content_item_id="$(jq -r .contentItemId control/marketing-publish-now-command.json)"
          correlation_id="$(jq -r .correlationId control/marketing-publish-now-command.json)"
          gcloud run jobs deploy "$DUPLICATE_PREFLIGHT_JOB_NAME" \
            --image "$image" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars "^~^INSTAGRAM_PUBLICATION_WRITES_ENABLED=false~INSTAGRAM_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID~CONTENT_ITEM_ID=$content_item_id~SCHEDULED_AT=$scheduled_at~CAPTION_BASE64=$caption_base64~CORRELATION_ID=$correlation_id" \
            --set-secrets "META_ACCESS_TOKEN=$TOKEN_SECRET_ID:latest" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 120s \
            --quiet
          job_json="$(gcloud run jobs describe "$DUPLICATE_PREFLIGHT_JOB_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          printf '%s' "$job_json" | jq -e '
            .spec.template.spec.template.spec.containers[0] as $container |
            ([$container.env[] | select(.name == "INSTAGRAM_PUBLICATION_WRITES_ENABLED") | .value] == ["false"])
          ' >/dev/null
          set +e
          gcloud run jobs execute "$DUPLICATE_PREFLIGHT_JOB_NAME" --project "$PROJECT_ID" --region "$REGION" --wait --quiet
          execute_rc=$?
          set -e
          result_line=''
          for _ in $(seq 1 12); do
            result_line="$(gcloud logging read \
              "resource.type=cloud_run_job AND resource.labels.job_name=${DUPLICATE_PREFLIGHT_JOB_NAME} AND textPayload:\"INSTAGRAM_DUPLICATE_PREFLIGHT_RESULT=\" AND textPayload:\"${content_item_id}\"" \
              --project "$PROJECT_ID" --freshness=30m --limit=50 --order=desc --format='value(textPayload)' \
              | grep 'INSTAGRAM_DUPLICATE_PREFLIGHT_RESULT=' | head -n1 || true)"
            [ -n "$result_line" ] && break
            sleep 5
          done
          test -n "$result_line"
          result_json="${result_line#INSTAGRAM_DUPLICATE_PREFLIGHT_RESULT=}"
          printf '%s\n' "$result_json" > marketing-publish-now-duplicate-preflight.json
          printf '%s\n' "$result_json" | jq -e \
            --arg id "$content_item_id" \
            --arg account "$INSTAGRAM_ACCOUNT_ID" '
              .contentItemId == $id and
              .instagramAccountId == $account and
              .providerReadOnly == true and
              .duplicateFound == false
            ' >/dev/null
          test "$execute_rc" -eq 0
          echo 'INSTAGRAM_DUPLICATE_PROVIDER_READBACK=PASS'

      - name: Snapshot immutable execution envelope
        if: steps.invocation.outputs.action == 'PUBLISH_NOW'
        shell: bash
        run: cp control/marketing-publish-now-command.json marketing-publish-now-command-envelope.json

      - name: Execute hardened publish-now lane
        if: steps.invocation.outputs.action == 'PUBLISH_NOW'
        shell: bash
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUDITED_CODE_SHA"
          if [ "${{ steps.invocation.outputs.source }}" = MARKETING_AUTOPILOT ]; then
            node scripts/check-publish-now-rights-clearance.mjs
            node scripts/check-publish-now-brand-determinism.mjs
          fi
          GITHUB_SHA="$AUDITED_CODE_SHA" bash scripts/marketing-publish-now-fixed.sh

      - name: Reconcile verified provider result into canonical Content Registry
        if: success() && steps.invocation.outputs.source == 'MARKETING_AUTOPILOT'
        shell: bash
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          MARKETING_AUTOPILOT_CONTENT_ITEM_ID: ${{ inputs.scheduler_content_item_id }}
          MARKETING_AUTOPILOT_PUBLICATION_EVIDENCE: marketing-publish-now-publication.json
          MARKETING_AUTOPILOT_RECONCILIATION_EVIDENCE: marketing-publish-now-reconciliation.json
        run: |
          set -euo pipefail
          node scripts/marketing-autopilot-registry.mjs reconcile-publication
          echo 'MARKETING_AUTOPILOT_REGISTRY_RECONCILIATION=PASS'

      - name: Upload immutable publication and reconciliation evidence
        if: always() && steps.invocation.outputs.action == 'PUBLISH_NOW'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marketing-publish-now-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            marketing-publish-now-*.json
            marketing-autopilot-registry-reconciliation.json
          if-no-files-found: warn
          retention-days: 90

      - name: Remove duplicate preflight runtime
        if: always() && steps.invocation.outputs.source == 'MARKETING_AUTOPILOT'
        shell: bash
        run: |
          gcloud run jobs delete "$DUPLICATE_PREFLIGHT_JOB_NAME" --project "$PROJECT_ID" --region "$REGION" --quiet || true
          docker logout "$REGION-docker.pkg.dev" >/dev/null 2>&1 || true
