name: TEMP Demand format test

on:
  push:
    branches:
      - recovery/meta-ads-demand-intelligence-20260819

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Format exact test and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TOCA Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          npm install --global pnpm@10.15.0
          pnpm install --frozen-lockfile
          pnpm exec prettier --write test/meta-ads-demand-intelligence.test.ts
          git rm .github/workflows/temp-demand-format-test.yml
          git add -A
          git diff --cached --check
          git commit -m 'style(meta-ads): format Demand Intelligence test'
          git push origin HEAD:recovery/meta-ads-demand-intelligence-20260819
