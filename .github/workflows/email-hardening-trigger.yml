name: Email hardening trigger

on:
  push:
    branches: [rebase/email-real-sendgrid-20260820]

permissions:
  contents: write

jobs:
  arm:
    if: github.event.head_commit.message != 'chore(email): enable hardening patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          ref: rebase/email-real-sendgrid-20260820
      - name: Enable one-shot patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/email-provider-hardening-patch.yml')
          text = p.read_text()
          old = "    if: github.actor != 'github-actions[bot]'\n"
          new = "    if: github.event.head_commit.message != 'fix(email): harden retry and inbound validation'\n"
          if old not in text:
              raise SystemExit('HARDENING_GUARD_PATTERN_NOT_FOUND')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/email-provider-hardening-patch.yml
          git commit -m "chore(email): enable hardening patch"
          git push origin HEAD:rebase/email-real-sendgrid-20260820
