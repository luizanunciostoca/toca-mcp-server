name: Sunset Reference Access Probe

on:
  push:
    branches:
      - feat/sunset-visual-regression-20260827

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify canonical Google Drive references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p refs
          fetch_ref() {
            local version="$1"
            local id="$2"
            local expected="$3"
            local out="refs/v${version}"
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" \
              --output "${out}"
            local observed
            observed="$(sha256sum "${out}" | awk '{print $1}')"
            printf 'V%s_SHA256=%s\n' "${version}" "${observed}"
            test "${observed}" = "${expected}"
          }
          fetch_ref 1 1uABkuHwKm5PNRNw5TP38Yzt4s4GTiwH_ b1ffa818a923c3ea94f43a10beb8ee3034d0661bdc437e937a7558042cb905a0
