name: Temporary PRO+ v2 YAML Format Diagnostic

on:
  push:
    branches:
      - chore/pro-plus-v2-control-plane

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact diagnostic HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff only
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier .github/workflows/pro-plus-v2-state-plane-validation.yml --write
          git diff -- .github/workflows/pro-plus-v2-state-plane-validation.yml
