name: Temporary The Party Prettier Render

on:
  push:
    branches:
      - feat/meta-ads-the-party-2026-08-15-execution

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier output
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier src/meta-ads-the-party-2026-08-15.ts --write
          if git diff --quiet -- src/meta-ads-the-party-2026-08-15.ts; then
            echo 'PRETTIER_ALREADY_CANONICAL=1'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/meta-ads-the-party-2026-08-15.ts
          git commit -m 'style(meta-ads): format The Party executor'
          git push origin HEAD:feat/meta-ads-the-party-2026-08-15-execution
