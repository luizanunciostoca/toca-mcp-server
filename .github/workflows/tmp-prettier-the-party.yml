name: Temporary The Party Prettier Render

on:
  push:
    branches:
      - feat/meta-ads-the-party-2026-08-15-execution

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier src/meta-ads-the-party-2026-08-15.ts --write
      - uses: actions/upload-artifact@v4
        with:
          name: prettier-the-party-runner
          path: src/meta-ads-the-party-2026-08-15.ts
          if-no-files-found: error
          retention-days: 1
