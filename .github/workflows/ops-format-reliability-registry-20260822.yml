name: Ops Format Reliability Registry 2026-08-22

on:
  push:
    branches: [docs/reliability-closure-reconcile-20260822]
    paths:
      - '.github/workflows/ops-format-reliability-registry-20260822.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout formatter branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: docs/reliability-closure-reconcile-20260822
          persist-credentials: true

      - name: Verify branch boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'luizanunciostoca/toca-mcp-server'
          test "$GITHUB_REF" = 'refs/heads/docs/reliability-closure-reconcile-20260822'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format exact registry with repository Prettier
        run: pnpm exec prettier --write control/next-version-feature-registry.v1.json

      - name: Remove temporary formatter harness and publish formatting only
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ops-format-reliability-registry-20260822.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/next-version-feature-registry.v1.json .github/workflows/ops-format-reliability-registry-20260822.yml
          git diff --cached --quiet && exit 0
          git commit -m 'style(reliability): apply repository prettier'
          git push origin HEAD:docs/reliability-closure-reconcile-20260822
