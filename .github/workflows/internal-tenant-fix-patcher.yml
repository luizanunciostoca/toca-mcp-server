name: Internal tenant fix patcher

on:
  push:
    branches:
      - 'fix/tenant-scoped-scheduler-dlq-20260822'
    paths:
      - '.github/workflows/internal-tenant-fix-patcher.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/internal-tenant-fix-patcher.yml'
      - 'scripts/internal-tenant-fix-patcher.mjs'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/tenant-scoped-scheduler-dlq-20260822' || github.ref_name == 'fix/tenant-scoped-scheduler-dlq-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/tenant-scoped-scheduler-dlq-20260822
          fetch-depth: 0
      - name: Remove stale R31 patch precondition locally
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/internal-tenant-fix-patcher.mjs')
          source = path.read_text()
          stale = """replaceAllExact(\n  'test/r31-learning-postgres-e2e.test.ts',\n  `new PostgresScheduler(pool)`,\n  `new PostgresScheduler(pool, 'toca')`,\n  1,\n);\n\n"""
          if stale not in source:
              raise SystemExit('STALE_R31_PATCH_BLOCK_NOT_FOUND')
          path.write_text(source.replace(stale, '', 1))
          PY
      - name: Apply deterministic tenant-scope patch
        run: node scripts/internal-tenant-fix-patcher.mjs
      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'toca-os-internal-acceptance'
          git config user.email 'actions@users.noreply.github.com'
          git add src test migrations
          git diff --cached --check
          git commit -m 'fix(tenancy): enforce scheduler and DLQ tenant boundaries'
          git push origin HEAD:fix/tenant-scoped-scheduler-dlq-20260822
