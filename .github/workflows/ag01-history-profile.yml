name: AG01 History Profile

on:
  push:
    branches:
      - ops/instagram-dm-2025-version-probe-20260828
    paths:
      - '.github/workflows/ag01-history-profile.yml'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_ARTIFACT_REPOSITORY: toca-mcp
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  DATABASE_SECRET_ID: toca-database-url

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Build ephemeral read-only image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/server:ag01-history-profile-${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Profile AG01 history without reading content
        shell: bash
        run: |
          set -euo pipefail
          JOB_NAME="toca-ag01-history-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            gcloud run jobs delete "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          gcloud run jobs deploy "$JOB_NAME" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --command node \
            --args dist/src/ops/ag01-history-profile.js \
            --tasks 1 --max-retries 0 --task-timeout 180s --quiet
          gcloud run jobs execute "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet
          sleep 10
          gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME}" \
            --project "$GCP_PROJECT_ID" --freshness=30m --limit=200 --order=asc --format=json > /tmp/logs.json
          python3 <<'PY'
          import json, sys
          rows=json.load(open('/tmp/logs.json'))
          for row in rows:
              vals=[]
              if isinstance(row.get('textPayload'),str): vals.append(row['textPayload'])
              if isinstance(row.get('jsonPayload'),dict): vals.append(json.dumps(row['jsonPayload'],separators=(',',':')))
              for text in vals:
                  try: obj=json.loads(text)
                  except Exception: continue
                  if isinstance(obj,dict) and obj.get('validation')=='ag01-history-profile':
                      print(json.dumps(obj,separators=(',',':')))
                      sys.exit(0)
          print('AG01_PROFILE_EVIDENCE_NOT_FOUND',file=sys.stderr)
          sys.exit(1)
          PY
