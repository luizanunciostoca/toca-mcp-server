name: M-FOUND-10 Lint Repair

on:
  push:
    branches: [feat/m-found-10-crm-core-records]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restrict idempotency snapshots to JSON objects
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/persistence/postgres-crm-core-store.ts')
          text = path.read_text()
          replacements = {
              '  readonly response_snapshot: unknown | null;':
              '  readonly response_snapshot: Readonly<Record<string, unknown>> | null;',
              '): Promise<unknown | undefined> {':
              '): Promise<Readonly<Record<string, unknown>> | undefined> {',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing pattern: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - run: pnpm format
      - name: Commit typing repair
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/persistence/postgres-crm-core-store.ts .github/workflows/m-found-10-lint-repair.yml
            git commit -m "fix: narrow CRM idempotency snapshot types"
            git push
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
