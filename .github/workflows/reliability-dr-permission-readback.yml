name: Foundation Reliability DR Permission Readback

on:
  push:
    branches: [feat/foundation-v1-reliability-closeout]
    paths: ['.github/workflows/reliability-dr-permission-readback.yml']

permissions:
  contents: read
  id-token: write

jobs:
  permissions:
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Test DR permissions only
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          printf '%s\n' '{"permissions":["cloudsql.instances.get","cloudsql.backupRuns.get","cloudsql.backupRuns.list","cloudsql.instances.create","cloudsql.instances.delete","cloudsql.instances.clone","cloudsql.instances.restoreBackup"]}' > /tmp/request.json
          HTTP="$(curl --silent --output /tmp/permissions.json --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/request.json \
            "https://cloudresourcemanager.googleapis.com/v1/projects/toca-mcp-production:testIamPermissions")"
          test "$HTTP" = "200"
          GRANTED="$(jq -c '(.permissions // []) | sort' /tmp/permissions.json)"
          echo "FOUNDATION_DR_GRANTED_PERMISSIONS=$GRANTED"
          jq -n \
            --arg sourceSha "$GITHUB_SHA" \
            --argjson granted "$GRANTED" \
            --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion:1,sourceSha:$sourceSha,identity:"deployer",grantedPermissions:$granted,restoreDrillCreateCapable:($granted|index("cloudsql.instances.create")!=null),restoreDrillDeleteCapable:($granted|index("cloudsql.instances.delete")!=null),restoreBackupCapable:($granted|index("cloudsql.instances.restoreBackup")!=null),verifiedAt:$verifiedAt}' \
            > reliability-dr-permissions.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-reliability-dr-permissions-${{ github.sha }}
          path: reliability-dr-permissions.json
          if-no-files-found: error
          retention-days: 90
