name: Temporary Bind Scheduled Caption Hash

on:
  push:
    branches:
      - ops/restore-gcp-instagram-scheduler-20260916
    paths:
      - 'scripts/tmp-bind-scheduled-caption-hash.py'
      - '.github/workflows/tmp-bind-scheduled-caption-hash.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 1
      - run: python3 scripts/tmp-bind-scheduled-caption-hash.py
      - name: Verify and retire patcher
        run: |
          set -euo pipefail
          node --check scripts/marketing-scheduled-publication-controller.mjs
          grep -Fq "createHash('sha256').update(item.caption).digest('hex')" scripts/marketing-scheduled-publication-controller.mjs
          grep -Fq 'SCHEDULED_PUBLICATION_CAPTION_HASH_MISMATCH' scripts/marketing-scheduled-publication-controller.mjs
          git rm scripts/tmp-bind-scheduled-caption-hash.py
          git rm .github/workflows/tmp-bind-scheduled-caption-hash.yml
          git diff --check
      - name: Commit final patch
        run: |
          set -euo pipefail
          git config user.name 'toca-scheduler[bot]'
          git config user.email 'toca-scheduler[bot]@users.noreply.github.com'
          git add scripts/marketing-scheduled-publication-controller.mjs
          git commit -m 'security(instagram): bind scheduled caption to approved hash'
          git push origin HEAD:ops/restore-gcp-instagram-scheduler-20260916
