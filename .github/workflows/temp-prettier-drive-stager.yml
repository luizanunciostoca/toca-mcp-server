name: Temporary Drive Stager Prettier Diagnostic

on:
  push:
    branches:
      - wave/github-native-publication-queue

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Emit exact Prettier diff
        run: |
          pnpm exec prettier --write src/github-native-publication/github-native-drive-asset-stager.ts
          git diff -- src/github-native-publication/github-native-drive-asset-stager.ts
