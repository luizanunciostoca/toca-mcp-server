name: Format R29 Validation Outbox Fix 2026-08-16

on:
  push:
    branches: [fix/r29-validation-outbox-drain]
    paths: ['.github/workflows/format-r29-validation-outbox-fix-20260816.yml']

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/r29-validation-outbox-drain
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact repository Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write .github/workflows/r29-production-runtime-verification.yml
          git diff --check
          git --no-pager diff -- .github/workflows/r29-production-runtime-verification.yml
