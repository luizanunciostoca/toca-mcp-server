name: Format R29 Validation Outbox Fix 2026-08-16

on:
  push:
    branches: [fix/r29-validation-outbox-drain]
    paths: ['.github/workflows/format-r29-validation-outbox-fix-20260816.yml']

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/r29-validation-outbox-drain
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier format and push
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write .github/workflows/r29-production-runtime-verification.yml
          git diff --check
          if git diff --quiet; then
            echo 'R29_FORMAT_ALREADY_CLEAN=1'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/r29-production-runtime-verification.yml
          git commit -m 'style(R29): format validation outbox drain workflow'
          git push origin HEAD:fix/r29-validation-outbox-drain
