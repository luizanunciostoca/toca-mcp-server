name: Omnichannel R16 Materialize One-Shot

on:
  push:
    branches: [reconcile/omnichannel-r16]
    paths: ['.github/workflows/omnichannel-r16-materialize-once.yml']

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: reconcile/omnichannel-r16
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Materialize exact Omnichannel delta
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=7a746bb901f03d9faf1b113de148f63fdefc62b6
          git fetch origin "$SOURCE"
          git checkout "$SOURCE" -- \
            docs/checkpoints/omnichannel-whatsapp-email-nurture-contracts.md \
            src/governance/omnichannel-capability-contracts.ts \
            src/omnichannel/capability-specs.ts \
            src/omnichannel/contracts.ts \
            test/omnichannel-capability-specs.test.ts \
            test/omnichannel-contracts.test.ts
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          pnpm quality
      - name: Commit materialized delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore(omnichannel): replay contracts on canonical Privacy main'
          git push origin HEAD:reconcile/omnichannel-r16
