name: TEMP Instagram Comment Canary Test Prettier

on:
  push:
    branches:
      - feat/instagram-comment-provider-canary-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/instagram-comment-provider-canary-v1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Format exact test
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write test/instagram-engagement-comment-provider-canary.test.ts
          pnpm exec prettier --check test/instagram-engagement-comment-provider-canary.test.ts
      - name: Commit formatted test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/instagram-engagement-comment-provider-canary.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'chore(instagram): format Comment canary test'
          git push origin HEAD:feat/instagram-comment-provider-canary-v1
