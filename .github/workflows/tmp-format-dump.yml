name: Temporary Format Dump

on:
  push:
    branches: [feat/deterministic-multilayer-artist-composer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Dump formatted files
        run: |
          for file in \
            src/contracts/artist-integrity.ts \
            src/creative/artist-integrity.ts \
            src/deterministic-artist-composite.ts \
            src/providers/local/local-multilayer-creative-composer.ts \
            test/local-multilayer-creative-composer.test.ts; do
            echo "@@BEGIN:$file@@"
            pnpm exec prettier "$file"
            echo "@@END:$file@@"
          done
