name: Measurement Branch Format

on:
  push:
    branches:
      - feat/measurement-ticketing-attribution-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/measurement-ticketing-attribution-foundation
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format measurement foundation files
        run: >-
          pnpm exec prettier --write
          src/measurement
          src/persistence/postgres-measurement-store.ts
          test/measurement-foundation.test.ts
          test/measurement-postgres-contract.test.ts
          migrations/013_measurement_ticketing_attribution.sql
          docs/checkpoints/measurement-ticketing-attribution-foundation.md
          .github/workflows/measurement-branch-format.yml
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/measurement src/persistence/postgres-measurement-store.ts test/measurement-foundation.test.ts test/measurement-postgres-contract.test.ts migrations/013_measurement_ticketing_attribution.sql docs/checkpoints/measurement-ticketing-attribution-foundation.md .github/workflows/measurement-branch-format.yml
          git commit -m "style: format measurement foundation"
          git push origin HEAD:feat/measurement-ticketing-attribution-foundation
