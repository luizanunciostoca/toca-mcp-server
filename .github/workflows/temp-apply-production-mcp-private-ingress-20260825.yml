name: TEMP Apply Production MCP Private Ingress 2026-08-25

on:
  push:
    branches: [fix/production-mcp-private-ingress-20260825]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/production-mcp-private-ingress-20260825
          fetch-depth: 0

      - name: Apply production ingress pin and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow_path = Path('.github/workflows/deploy-gcp.yml')
          test_path = Path('test/gcp-production-internal-probe-contract.test.ts')
          workflow = workflow_path.read_text()
          old_block = '          MCP_PROBE_ENDPOINT_ARGS=()\n          if [[ "$DEPLOY_ENVIRONMENT" == production ]]; then\n            MCP_PROBE_ENDPOINT_ARGS=(--default-url)\n          fi'
          new_block = '          MCP_PROBE_ENDPOINT_ARGS=()\n          MCP_PRIVATE_INGRESS_ARGS=()\n          if [[ "$DEPLOY_ENVIRONMENT" == production ]]; then\n            MCP_PROBE_ENDPOINT_ARGS=(--default-url)\n            MCP_PRIVATE_INGRESS_ARGS=(--ingress internal)\n          fi'
          old_args = '            "${MCP_PROBE_ENDPOINT_ARGS[@]}" --no-allow-unauthenticated'
          new_args = '            "${MCP_PROBE_ENDPOINT_ARGS[@]}" "${MCP_PRIVATE_INGRESS_ARGS[@]}" --no-allow-unauthenticated'
          if workflow.count(old_block) != 1:
              raise SystemExit('expected exactly one production MCP endpoint argument block')
          if workflow.count(old_args) != 1:
              raise SystemExit('expected exactly one MCP deploy final argument line')
          workflow_path.write_text(workflow.replace(old_block, new_block).replace(old_args, new_args))
          test = test_path.read_text()
          marker = "  it('fails closed on private network and IAM posture without broadening ingress', () => {"
          addition = "  it('pins production MCP ingress private without changing endpoint probe semantics', () => {\n    const deploy = section(\n      '- name: Deploy private MCP candidate by digest with no traffic',\n      '- name: Deploy controlled webhook candidate by digest',\n    );\n\n    expect(deploy).toContain('MCP_PROBE_ENDPOINT_ARGS=(--default-url)');\n    expect(deploy).toContain('MCP_PRIVATE_INGRESS_ARGS=()');\n    expect(deploy).toContain('MCP_PRIVATE_INGRESS_ARGS=(--ingress internal)');\n    expect(deploy).toContain('\\\"${MCP_PRIVATE_INGRESS_ARGS[@]}\\\"');\n    expect(deploy).toContain('--no-allow-unauthenticated');\n    expect(deploy).not.toContain('--ingress all');\n  });\n\n"
          if test.count(marker) != 1:
              raise SystemExit('expected exact production internal probe regression marker')
          test_path.write_text(test.replace(marker, addition + marker))
          PY
          grep -Fq -- 'MCP_PRIVATE_INGRESS_ARGS=(--ingress internal)' .github/workflows/deploy-gcp.yml
          grep -Fq -- '"${MCP_PROBE_ENDPOINT_ARGS[@]}" "${MCP_PRIVATE_INGRESS_ARGS[@]}" --no-allow-unauthenticated' .github/workflows/deploy-gcp.yml
          ! grep -A30 -F -- '- name: Deploy private MCP candidate by digest with no traffic' .github/workflows/deploy-gcp.yml | grep -q -- '--ingress all'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Run affected regression tests
        run: |
          pnpm install --frozen-lockfile
          pnpm vitest run test/gcp-production-internal-probe-contract.test.ts test/gcp-production-probe-rollback-contract.test.ts

      - name: Commit remediation and remove temporary applicator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-apply-production-mcp-private-ingress-20260825.yml
          git add .github/workflows/deploy-gcp.yml test/gcp-production-internal-probe-contract.test.ts
          git diff --cached --check
          git commit -m 'fix(deploy): pin production MCP ingress private'
          git push origin HEAD:fix/production-mcp-private-ingress-20260825
