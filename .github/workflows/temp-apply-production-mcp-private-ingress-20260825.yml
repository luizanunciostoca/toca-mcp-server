name: TEMP Apply Production MCP Private Ingress 2026-08-25

on:
  push:
    branches: [fix/production-mcp-private-ingress-20260825]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/production-mcp-private-ingress-20260825
          fetch-depth: 0

      - name: Apply production ingress pin and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/deploy-gcp.yml')
          test_path = Path('test/gcp-production-internal-probe-contract.test.ts')

          workflow = workflow_path.read_text()
          old = '''          if [[ "$DEPLOY_ENVIRONMENT" == production ]]; then
            MCP_PROBE_ENDPOINT_ARGS=(--default-url)
          fi'''
          new = '''          if [[ "$DEPLOY_ENVIRONMENT" == production ]]; then
            MCP_PROBE_ENDPOINT_ARGS=(--default-url --ingress internal)
          fi'''
          if workflow.count(old) != 1:
              raise SystemExit('expected exactly one production MCP probe endpoint argument block')
          workflow = workflow.replace(old, new)
          workflow_path.write_text(workflow)

          test = test_path.read_text()
          marker = '''  it('fails closed on private network and IAM posture without broadening ingress', () => {'''
          addition = '''  it('pins the production MCP candidate deploy to private ingress', () => {
    const deploy = section(
      '- name: Deploy private MCP candidate by digest with no traffic',
      '- name: Deploy controlled webhook candidate by digest',
    );

    expect(deploy).toContain('MCP_PROBE_ENDPOINT_ARGS=(--default-url --ingress internal)');
    expect(deploy).toContain('"${MCP_PROBE_ENDPOINT_ARGS[@]}" --no-allow-unauthenticated');
    expect(deploy).not.toContain('--ingress all');
  });

'''
          if test.count(marker) != 1:
              raise SystemExit('expected exact production internal probe regression marker')
          test = test.replace(marker, addition + marker)
          test_path.write_text(test)
          PY

          grep -q -- 'MCP_PROBE_ENDPOINT_ARGS=(--default-url --ingress internal)' .github/workflows/deploy-gcp.yml
          ! grep -A25 -F -- '- name: Deploy private MCP candidate by digest with no traffic' .github/workflows/deploy-gcp.yml | grep -q -- '--ingress all'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Run affected regression tests
        run: |
          pnpm install --frozen-lockfile
          pnpm vitest run test/gcp-production-internal-probe-contract.test.ts test/gcp-production-probe-rollback-contract.test.ts

      - name: Commit remediation and remove temporary applicator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-apply-production-mcp-private-ingress-20260825.yml
          git add .github/workflows/deploy-gcp.yml test/gcp-production-internal-probe-contract.test.ts
          git diff --cached --check
          git commit -m 'fix(deploy): pin production MCP ingress private'
          git push origin HEAD:fix/production-mcp-private-ingress-20260825
