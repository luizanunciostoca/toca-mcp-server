name: Meta Ads Primary PREPARE Log Recovery One-Shot

on:
  push:
    branches: [ops/meta-ads-primary-prepare-311793958882290]
    paths: ['.github/workflows/meta-ads-primary-prepare-log-recovery-once.yml']

permissions:
  contents: read
  id-token: write

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: toca-mcp-production
      GCP_REGION: southamerica-east1
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
      GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      SOURCE_JOB_NAME: toca-meta-ads-primary-prepare-31919904629-1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Assert read-only recovery delta
        shell: bash
        run: |
          set -euo pipefail
          BASE='326ae0296e7ad5a2fb531b8bdd222a7fba66c417'
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git diff --name-only "$BASE" HEAD | grep -Fx '.github/workflows/meta-ads-primary-prepare-recheck-once.yml'
          git diff --name-only "$BASE" HEAD | grep -Fx '.github/workflows/meta-ads-primary-prepare-log-recovery-once.yml'

      - name: Authenticate deployer to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Recover sanitized provider failure
        shell: bash
        run: |
          set -euo pipefail
          gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=${SOURCE_JOB_NAME}" \
            --project "$GCP_PROJECT_ID" \
            --freshness=30m \
            --limit=200 \
            --order=asc \
            --format=json > /tmp/raw.json

          jq '[.[] | {
            timestamp,
            severity,
            textPayload,
            message: (.jsonPayload.message // .jsonPayload.error.message // null),
            error: (.jsonPayload.error // null),
            labels: {execution_name: (.labels."run.googleapis.com/execution_name" // null)}
          } | select(.textPayload != null or .message != null or .error != null)]' /tmp/raw.json \
            | sed -E 's/(access_token[=:])[A-Za-z0-9._-]+/\1[REDACTED]/g; s/(Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g' \
            > /tmp/sanitized.json

          test "$(jq 'length' /tmp/sanitized.json)" -gt 0
          echo 'META_ADS_PRIMARY_PREPARE_PROVIDER_LOG_BEGIN'
          cat /tmp/sanitized.json
          echo 'META_ADS_PRIMARY_PREPARE_PROVIDER_LOG_END'
