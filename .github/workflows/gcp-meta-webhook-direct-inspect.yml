name: GCP Meta Webhook Direct Inspect

on:
  push:
    branches:
      - feat/instagram-engagement-messaging
    paths:
      - '.github/workflows/gcp-meta-webhook-direct-inspect.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  SERVICE: toca-meta-oauth-staging

jobs:
  inspect-direct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect sanitized webhook request and event logs
        shell: bash
        run: |
          set -euo pipefail

          SINCE="$(date -u -d '30 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')"

          EVENT_FILTER="resource.type=cloud_run_revision AND resource.labels.service_name=${SERVICE} AND timestamp>=\"${SINCE}\" AND textPayload:\"Meta webhook events accepted\""
          gcloud logging read "$EVENT_FILTER" --project "$PROJECT_ID" --limit 100 --order desc --format=json > /tmp/event-logs.json
          ACCEPTED_COUNT="$(jq 'length' /tmp/event-logs.json)"
          DIRECT_COUNT="$(jq '[.[] | .textPayload // "" | select(contains("DIRECT"))] | length' /tmp/event-logs.json)"

          REQUEST_FILTER="resource.type=cloud_run_revision AND resource.labels.service_name=${SERVICE} AND timestamp>=\"${SINCE}\" AND httpRequest.requestMethod=POST AND httpRequest.requestUrl:\"/webhooks/meta\""
          gcloud logging read "$REQUEST_FILTER" --project "$PROJECT_ID" --limit 100 --order desc --format=json > /tmp/request-logs.json
          POST_COUNT="$(jq 'length' /tmp/request-logs.json)"

          echo "Sanitized webhook POST count: ${POST_COUNT}"
          echo "Sanitized accepted event log entries: ${ACCEPTED_COUNT}"
          echo "Sanitized DIRECT event log entries: ${DIRECT_COUNT}"
          jq -r '.[] | [.timestamp, (.httpRequest.status|tostring), (.httpRequest.requestMethod // ""), ((.httpRequest.requestUrl // "") | sub("\\?.*$"; ""))] | @tsv' /tmp/request-logs.json | head -20 || true

          if [ "$POST_COUNT" -lt 1 ]; then
            echo "RESULT=no_webhook_post_seen"
            exit 2
          fi
          if [ "$DIRECT_COUNT" -lt 1 ]; then
            echo "RESULT=post_seen_but_no_direct_event"
            exit 3
          fi
          echo "RESULT=direct_event_confirmed"
