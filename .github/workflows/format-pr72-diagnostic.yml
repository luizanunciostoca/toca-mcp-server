name: Format PR72 Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/format-pr72-diagnostic.yml'

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0b024bd9df80981caf7c22906e096e66370fb8e8
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Render exact Prettier changes without committing
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write src/health/runtime-readiness.ts test/runtime-readiness-outbox-sql.test.ts
          git diff -- src/health/runtime-readiness.ts test/runtime-readiness-outbox-sql.test.ts
          test -z "$(git diff --name-only | grep -v -E '^(src/health/runtime-readiness.ts|test/runtime-readiness-outbox-sql.test.ts)$' || true)"
          echo 'FORMAT_DIAGNOSTIC_MUTATION_PERSISTED=NO'
