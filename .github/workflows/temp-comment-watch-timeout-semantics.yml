name: TEMP Comment Watch Timeout Semantics

on:
  push:
    branches: [fix/comment-opportunity-watch-log-propagation]
    paths:
      - .github/workflows/temp-comment-watch-timeout-semantics.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/comment-opportunity-watch-log-propagation
          persist-credentials: true
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply, format and persist transfer files
        shell: bash
        run: |
          set -euo pipefail
          python .github/temp-comment-watch-timeout-semantics.py
          pnpm install --frozen-lockfile
          pnpm exec prettier --write .github/workflows/instagram-engagement-comment-canary-opportunity-watch.yml test/instagram-engagement-comment-canary-opportunity-watch.test.ts
          git diff --check
          mkdir -p tmp/comment-watch-timeout-transfer
          cp .github/workflows/instagram-engagement-comment-canary-opportunity-watch.yml tmp/comment-watch-timeout-transfer/watch-workflow.yml.txt
          cp test/instagram-engagement-comment-canary-opportunity-watch.test.ts tmp/comment-watch-timeout-transfer/watch-test.ts.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/comment-watch-timeout-transfer/watch-workflow.yml.txt tmp/comment-watch-timeout-transfer/watch-test.ts.txt
          git commit -m 'chore(temp): persist Comment watch timeout transfer files'
          git push origin HEAD:fix/comment-opportunity-watch-log-propagation
