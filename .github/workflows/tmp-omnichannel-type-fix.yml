name: Temporary Omnichannel type fix

on:
  push:
    branches:
      - feat/omnichannel-outbound-composition-58

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true

      - name: Apply exact contract fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/governance/omnichannel-capability-contracts.ts')
          text = path.read_text()

          old_export = 'export const OMNICHANNEL_CAPABILITY_CONTRACT_OVERRIDES = {'
          new_export = (
              'export const OMNICHANNEL_CAPABILITY_CONTRACT_OVERRIDES: '
              'Readonly<Record<string, CapabilityContractOverride>> = {'
          )
          if text.count(old_export) != 1:
              raise SystemExit('OMNICHANNEL_EXPORT_ANCHOR_MISMATCH')
          text = text.replace(old_export, new_export, 1)

          duplicate_auth = "    authentication_mode: 'INTERNAL',\n    authentication_mode: 'UNKNOWN',"
          if text.count(duplicate_auth) != 2:
              raise SystemExit('OMNICHANNEL_READBACK_AUTH_DUPLICATE_COUNT_MISMATCH')
          text = text.replace(duplicate_auth, "    authentication_mode: 'INTERNAL',")

          path.write_text(text)

      - name: Format changed contract
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier --write src/governance/omnichannel-capability-contracts.ts

      - name: Commit clean head and remove temporary workflow
        run: |
          git config user.name 'TOCA OS Integration'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/tmp-omnichannel-type-fix.yml
          git add src/governance/omnichannel-capability-contracts.ts
          git commit -m 'fix(omnichannel): make readback contracts type-safe'
          git push
