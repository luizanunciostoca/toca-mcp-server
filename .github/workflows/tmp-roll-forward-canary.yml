name: Temporary Marketing Canary Roll Forward

on:
  push:
    branches:
      - ops/roll-forward-marketing-canary-1500-20260916
    paths:
      - .github/workflows/tmp-roll-forward-canary.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ops/roll-forward-marketing-canary-1500-20260916
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply explicit 15:00 canary roll-forward
        run: python3 .github/tmp-roll-forward-canary.py
      - name: Format and validate roll-forward
        run: |
          set -euo pipefail
          pnpm exec prettier --write control/marketing-autopilot-scheduler-policy.json test/marketing-autopilot-scheduler-restoration.test.ts
          pnpm exec prettier --check control/marketing-autopilot-scheduler-policy.json test/marketing-autopilot-scheduler-restoration.test.ts
          pnpm exec eslint test/marketing-autopilot-scheduler-restoration.test.ts
          pnpm exec vitest run test/marketing-autopilot-scheduler-restoration.test.ts test/github-native-instagram-publication-boundary.test.ts test/marketing-publish-now-hardening.test.ts
      - name: Commit validated production policy
        run: |
          set -euo pipefail
          git config user.name 'TOCA OS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add control/marketing-autopilot-scheduler-policy.json test/marketing-autopilot-scheduler-restoration.test.ts
          git commit -m 'fix(marketing): roll canary forward to 15:00 after stale window'
          git push origin HEAD:ops/roll-forward-marketing-canary-1500-20260916
