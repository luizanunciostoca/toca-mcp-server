name: Temporary Provider Token Onboarding

on:
  push:
    branches:
      - feat/provider-token-onboarding-20260820

permissions:
  contents: write

jobs:
  integrate-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: feat/provider-token-onboarding-20260820
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integrate discovered provider configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('src/providers/sendgrid/email-event-http-runtime.ts')
          s = p.read_text()
          anchor = "import { loadSendGridRuntimeConfig } from './runtime-config.js';\n"
          addition = "import { discoverSendGridEventWebhookPublicKey } from './event-webhook-discovery.js';\n"
          if addition not in s:
              if anchor not in s:
                  raise SystemExit('SendGrid import anchor not found')
              s = s.replace(anchor, addition + anchor, 1)

          old = "  if (!loaded.enabled || !loaded.config) return undefined;\n  if (!loaded.config.eventWebhookPublicKeyPem?.trim()) {\n    throw new Error('SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY_REQUIRED');\n  }\n\n  const dispatchStore = new PostgresEmailRuntimeStore(options.pool);"
          new = "  if (!loaded.enabled || !loaded.config) return undefined;\n  let providerConfig = loaded.config;\n  if (!providerConfig.eventWebhookPublicKeyPem?.trim()) {\n    const discovered = await discoverSendGridEventWebhookPublicKey({\n      apiKey: providerConfig.apiKey,\n      apiBaseUrl: providerConfig.apiBaseUrl,\n      expectedUrl: env.EMAIL_SENDGRID_EVENT_WEBHOOK_URL?.trim() || null,\n    });\n    providerConfig = {\n      ...providerConfig,\n      eventWebhookPublicKeyPem: discovered.publicKey,\n    };\n  }\n\n  const dispatchStore = new PostgresEmailRuntimeStore(options.pool);"
          if old not in s:
              raise SystemExit('SendGrid runtime config anchor not found')
          s = s.replace(old, new, 1)
          old = "  const provider = new SendGridEmailProvider(loaded.config, EVENT_ONLY_PREPARED_RESOLVER);"
          new = "  const provider = new SendGridEmailProvider(providerConfig, EVENT_ONLY_PREPARED_RESOLVER);"
          if old not in s:
              raise SystemExit('SendGrid provider construction anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          pnpm exec prettier --write \
            src/providers/sendgrid/event-webhook-discovery.ts \
            src/providers/sendgrid/email-event-http-runtime.ts \
            src/providers/whatsapp/whatsapp-asset-discovery.ts \
            src/omnichannel/whatsapp-http-composition.ts \
            src/http.ts \
            src/providers/google-ads/google-ads-api-client.ts \
            test/sendgrid-event-webhook-discovery.test.ts \
            test/whatsapp-asset-discovery.test.ts \
            test/google-ads-credential-discovery-client.test.ts
          pnpm quality
          git config user.name 'TOCA OS Integration'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            src/providers/sendgrid/event-webhook-discovery.ts \
            src/providers/sendgrid/email-event-http-runtime.ts \
            src/providers/whatsapp/whatsapp-asset-discovery.ts \
            src/omnichannel/whatsapp-http-composition.ts \
            src/http.ts \
            src/providers/google-ads/google-ads-api-client.ts \
            test/sendgrid-event-webhook-discovery.test.ts \
            test/whatsapp-asset-discovery.test.ts \
            test/google-ads-credential-discovery-client.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'feat(providers): complete token-backed asset discovery'
            git push origin HEAD:feat/provider-token-onboarding-20260820
          fi
