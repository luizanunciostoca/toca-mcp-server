name: Paid Media Production Runtime Repair TEMP

on:
  push:
    branches:
      - ops/paid-media-production-runtime-inspect-20260813

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  SERVICE: toca-mcp-production
  CLOUD_SQL_INSTANCE: toca-mcp-db
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker auth
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/server:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Repair production Paid Media READ runtime
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --add-cloudsql-instances "${PROJECT_ID}:${REGION}:${CLOUD_SQL_INSTANCE}" \
            --update-secrets "DATABASE_URL=toca-database-url:latest,TOCA_SECRET_META_APP_SECRET=toca-meta-app-secret:latest,TOCA_SECRET_META_ACCESS_TOKEN=toca-meta-oauth-token:latest" \
            --update-env-vars "META_ENABLED=false,MCP_ENABLED=true,META_ADS_READ_ENABLED=true,META_ACCESS_TOKEN_ENV_KEY=TOCA_SECRET_META_ACCESS_TOKEN" \
            --no-allow-unauthenticated \
            --quiet
      - name: Verify repaired production runtime
        shell: bash
        run: |
          set -euo pipefail
          READY="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.conditions[0].status)')"
          REVISION="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          ENV_DUMP="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='json(spec.template.spec.containers[0].env)')"
          echo "READY=$READY"
          echo "REVISION=$REVISION"
          printf '%s\n' "$ENV_DUMP"
          test "$READY" = "True"
          printf '%s' "$ENV_DUMP" | grep -q '"name": "META_ENABLED"'
          printf '%s' "$ENV_DUMP" | grep -q '"value": "false"'
          printf '%s' "$ENV_DUMP" | grep -q '"name": "MCP_ENABLED"'
          printf '%s' "$ENV_DUMP" | grep -q '"name": "META_ADS_READ_ENABLED"'
          printf '%s' "$ENV_DUMP" | grep -q '"name": "META_ACCESS_TOKEN_ENV_KEY"'
          printf '%s' "$ENV_DUMP" | grep -q 'toca-meta-oauth-token'
