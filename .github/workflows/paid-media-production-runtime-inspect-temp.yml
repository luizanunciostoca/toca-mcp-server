name: Paid Media Production Runtime Inspect TEMP

on:
  push:
    branches:
      - ops/paid-media-production-runtime-inspect-20260813

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  SERVICE: toca-mcp-production

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect production runtime without mutation
        shell: bash
        run: |
          set -euo pipefail
          READY="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.conditions[0].status)')"
          REVISION="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          IMAGE="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.containers[0].image)')"
          ENV_DUMP="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='json(spec.template.spec.containers[0].env)')"
          echo "READY=$READY"
          echo "REVISION=$REVISION"
          echo "IMAGE=$IMAGE"
          printf '%s\n' "$ENV_DUMP"
          echo "HAS_META_ENABLED=$(printf '%s' "$ENV_DUMP" | grep -q 'META_ENABLED' && echo yes || echo no)"
          echo "HAS_MCP_ENABLED=$(printf '%s' "$ENV_DUMP" | grep -q 'MCP_ENABLED' && echo yes || echo no)"
          echo "HAS_META_ADS_READ_ENABLED=$(printf '%s' "$ENV_DUMP" | grep -q 'META_ADS_READ_ENABLED' && echo yes || echo no)"
          echo "HAS_META_ACCESS_TOKEN_ENV_KEY=$(printf '%s' "$ENV_DUMP" | grep -q 'META_ACCESS_TOKEN_ENV_KEY' && echo yes || echo no)"
