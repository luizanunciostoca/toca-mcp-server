name: Instagram Publication Canary Recovery Controller

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/instagram-publication-canary-recovery-controller.yml'
      - 'control/github-native-publication-queue.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: instagram-publication-canary-recovery-20260916-0035
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TARGET_DATE: '2026-09-16'
      WINDOW_START: '2026-09-16T00:30:00-03:00'
      FIRST_DISPATCH_DEADLINE: '2026-09-16T00:39:00-03:00'
      SECOND_DISPATCH_DEADLINE: '2026-09-16T00:42:30-03:00'
      TARGET_ITEM: 'MKT-20260917-SUNSET-FEED-0900'
      EXPECTED_SCHEDULED_AT: '2026-09-16T00:35:00-03:00'
      EXPECTED_EXPIRES_AT: '2026-09-16T00:45:00-03:00'
      EXPECTED_ACCOUNT: '17841402033495654'
      EXPECTED_ASSET_SHA256: 'a495fa29db54dc2af24700b0556e8a6d1fb01472c333067c91ee6d613525e4e6'
      EXPECTED_CAPTION_SHA256: 'ae72ec055df7b2025fe08ce6cbf4ceefd2173fbeecfc5a731641a3e3a57a1aed'
      EXPECTED_CORRELATION_ID: 'CORR-MKT-20260917-SUNSET-FEED-0900-ROLLOVER-V1'
      EXPECTED_IDEMPOTENCY_KEY: 'GITHUB_NATIVE_ROLLOVER:MKT-20260917-SUNSET-FEED-0900:V1'
      EXPECTED_REQUEST_FINGERPRINT: '64601769c2fe5cbdb39c6b78b320f2643a32c0067361284aed03d94fd4d4957d'
      LEDGER_PATH: 'publication-state/3e9356148b41946660e2afd80e23b1d6fb220b94666cb01fb07ba65cc700e61e.json'
      SCHEDULE_MODE: ${{ vars.TOCA_GITHUB_NATIVE_PUBLICATION_MODE || 'SHADOW' }}
      SCHEDULE_WRITES: ${{ vars.TOCA_GITHUB_NATIVE_PUBLICATION_WRITES_ENABLED || 'false' }}

    steps:
      - name: Guard protected main push and recovery window
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF" = 'refs/heads/main'
          local_date=$(TZ=America/Bahia date +%F)
          test "$local_date" = "$TARGET_DATE" || { echo "RECOVERY_DATE_MISMATCH:$local_date"; exit 1; }
          live_main=$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')
          test "$live_main" = "$GITHUB_SHA" || { echo "STALE_CONTROLLER_SHA:$GITHUB_SHA:$live_main"; exit 1; }
          now=$(date +%s)
          start=$(date -d "$WINDOW_START" +%s)
          deadline=$(date -d "$FIRST_DISPATCH_DEADLINE" +%s)
          if [ "$now" -lt "$start" ]; then
            sleep $((start - now))
            now=$(date +%s)
          fi
          test "$now" -le "$deadline" || { echo 'CANARY_FIRST_DISPATCH_WINDOW_MISSED'; exit 1; }

      - name: Verify routine scheduler remains SHADOW
        shell: bash
        run: |
          set -euo pipefail
          test "$SCHEDULE_MODE" = 'SHADOW' || { echo "SCHEDULE_MODE_NOT_SHADOW:$SCHEDULE_MODE"; exit 1; }
          test "$SCHEDULE_WRITES" != 'true' || { echo 'SCHEDULE_WRITES_UNEXPECTEDLY_ENABLED'; exit 1; }

      - name: Verify exact approved queue item
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/contents/control/github-native-publication-queue.json?ref=main" --jq '.content' | tr -d '\n' | base64 -d > queue.json
          jq -e \
            --arg item "$TARGET_ITEM" \
            --arg scheduled "$EXPECTED_SCHEDULED_AT" \
            --arg expires "$EXPECTED_EXPIRES_AT" \
            --arg account "$EXPECTED_ACCOUNT" \
            --arg asset "$EXPECTED_ASSET_SHA256" \
            --arg corr "$EXPECTED_CORRELATION_ID" \
            --arg idem "$EXPECTED_IDEMPOTENCY_KEY" \
            '(.items | length) == 1 and
             (.items[0].contentItemId == $item) and
             (.items[0].scheduledAt == $scheduled) and
             (.items[0].expiresAt == $expires) and
             (.items[0].operation == "SUNSET") and
             (.items[0].channel == "INSTAGRAM") and
             (.items[0].contentStatus == "PRODUCED") and
             (.items[0].approvalStatus == "APPROVED") and
             (.items[0].publicationIntent == "SCHEDULED") and
             (.items[0].mediaType == "IMAGE") and
             (.items[0].instagramAccountId == $account) and
             (.items[0].asset.sha256 == $asset) and
             (.items[0].creativeTruthBinding.outputSha256 == $asset) and
             (.items[0].creativeTruthBinding.brandIntegrityStatus == "PASSED") and
             (.items[0].creativeTruthBinding.venueFidelityStatus == "PASSED") and
             (.items[0].creativeTruthBinding.qualityGateStatus == "PASSED") and
             (.items[0].creativeTruthBinding.exactAssetBinding == true) and
             (.items[0].correlationId == $corr) and
             (.items[0].idempotencyKey == $idem)' queue.json >/dev/null
          caption=$(jq -r '.items[0].caption' queue.json)
          caption_sha=$(printf '%s' "$caption" | sha256sum | awk '{print $1}')
          test "$caption_sha" = "$EXPECTED_CAPTION_SHA256" || { echo 'CAPTION_SHA_MISMATCH'; exit 1; }

      - name: Verify DRAFT ledger precondition
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/contents/$LEDGER_PATH?ref=publication-state" --jq '.content' | tr -d '\n' | base64 -d > ledger-before.json
          jq -e \
            --arg corr "$EXPECTED_CORRELATION_ID" \
            --arg idem "$EXPECTED_IDEMPOTENCY_KEY" \
            --arg fp "$EXPECTED_REQUEST_FINGERPRINT" \
            '.state == "DRAFT" and .correlationId == $corr and .idempotencyKey == $idem and .requestFingerprint == $fp' ledger-before.json >/dev/null

      - name: Dispatch first controlled CANARY once
        id: first_dispatch
        shell: bash
        run: |
          set -euo pipefail
          live_main=$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')
          test "$live_main" = "$GITHUB_SHA" || { echo "MAIN_DRIFT_BEFORE_FIRST_DISPATCH:$GITHUB_SHA:$live_main"; exit 1; }
          now=$(date +%s)
          deadline=$(date -d "$FIRST_DISPATCH_DEADLINE" +%s)
          test "$now" -le "$deadline" || { echo 'CANARY_FIRST_DISPATCH_WINDOW_MISSED'; exit 1; }
          before=$(date -u +%s)
          jq -n --arg item "$TARGET_ITEM" '{event_type:"github-native-instagram-publish-controlled",client_payload:{mode:"CANARY",writes_enabled:"true",canary_content_item_id:$item}}' | gh api --method POST "repos/$REPO/dispatches" --input -
          echo "before=$before" >> "$GITHUB_OUTPUT"

      - name: Await first publisher run without retry
        id: first
        env:
          BEFORE: ${{ steps.first_dispatch.outputs.before }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for _ in $(seq 1 90); do
            runs=$(gh api "repos/$REPO/actions/runs?event=repository_dispatch&branch=main&per_page=100")
            run_id=$(jq -r --arg sha "$GITHUB_SHA" --argjson before "$BEFORE" '[.workflow_runs[] | select(.name == "GitHub Native Instagram Publisher") | select(.head_sha == $sha) | select((.created_at | fromdateiso8601) >= $before)] | sort_by(.created_at) | last | .id // empty' <<<"$runs")
            [ -n "$run_id" ] && break
            sleep 5
          done
          test -n "$run_id" || { echo 'PUBLISHER_RUN_NOT_FOUND'; exit 1; }
          for _ in $(seq 1 180); do
            run=$(gh api "repos/$REPO/actions/runs/$run_id")
            status=$(jq -r '.status' <<<"$run")
            if [ "$status" = 'completed' ]; then
              conclusion=$(jq -r '.conclusion' <<<"$run")
              test "$conclusion" = 'success' || { echo "PUBLISHER_FAILED:$run_id:$conclusion"; exit 1; }
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo 'PUBLISHER_RUN_TIMEOUT'; exit 1

      - name: Verify first evidence and PUBLISHED ledger
        id: published
        env:
          RUN_ID: ${{ steps.first.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf first-evidence
          gh run download "$RUN_ID" --repo "$REPO" -n "github-native-instagram-${RUN_ID}-1" -D first-evidence
          evidence=$(find first-evidence -name 'github-native-publication-evidence.json' -print -quit)
          test -n "$evidence"
          external=$(jq -r --arg item "$TARGET_ITEM" '.items[] | select(.contentItemId == $item and .outcome == "PUBLISHED_AND_READBACK_VERIFIED") | .externalMediaId // empty' "$evidence")
          test -n "$external" || { echo 'FIRST_CANARY_EVIDENCE_NOT_VERIFIED'; exit 1; }
          jq -e '.mode == "CANARY" and .writesEnabled == true' "$evidence" >/dev/null
          gh api "repos/$REPO/contents/$LEDGER_PATH?ref=publication-state" --jq '.content' | tr -d '\n' | base64 -d > ledger-after.json
          jq -e --arg external "$external" --arg corr "$EXPECTED_CORRELATION_ID" --arg idem "$EXPECTED_IDEMPOTENCY_KEY" '.state == "PUBLISHED" and .externalMediaId == $external and .correlationId == $corr and .idempotencyKey == $idem' ledger-after.json >/dev/null
          echo "external_media_id=$external" >> "$GITHUB_OUTPUT"

      - name: Dispatch fresh reconciliation readback
        id: second_dispatch
        shell: bash
        run: |
          set -euo pipefail
          live_main=$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')
          test "$live_main" = "$GITHUB_SHA" || { echo "MAIN_DRIFT_BEFORE_SECOND_DISPATCH:$GITHUB_SHA:$live_main"; exit 1; }
          now=$(date +%s)
          deadline=$(date -d "$SECOND_DISPATCH_DEADLINE" +%s)
          test "$now" -le "$deadline" || { echo 'CANARY_SECOND_READBACK_WINDOW_MISSED'; exit 1; }
          before=$(date -u +%s)
          jq -n --arg item "$TARGET_ITEM" '{event_type:"github-native-instagram-publish-controlled",client_payload:{mode:"CANARY",writes_enabled:"true",canary_content_item_id:$item}}' | gh api --method POST "repos/$REPO/dispatches" --input -
          echo "before=$before" >> "$GITHUB_OUTPUT"

      - name: Await distinct reconciliation run
        id: second
        env:
          FIRST_RUN_ID: ${{ steps.first.outputs.run_id }}
          BEFORE: ${{ steps.second_dispatch.outputs.before }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for _ in $(seq 1 90); do
            runs=$(gh api "repos/$REPO/actions/runs?event=repository_dispatch&branch=main&per_page=100")
            run_id=$(jq -r --arg sha "$GITHUB_SHA" --arg first "$FIRST_RUN_ID" --argjson before "$BEFORE" '[.workflow_runs[] | select(.name == "GitHub Native Instagram Publisher") | select(.head_sha == $sha) | select((.id | tostring) != $first) | select((.created_at | fromdateiso8601) >= $before)] | sort_by(.created_at) | last | .id // empty' <<<"$runs")
            [ -n "$run_id" ] && break
            sleep 5
          done
          test -n "$run_id" || { echo 'RECONCILIATION_RUN_NOT_FOUND'; exit 1; }
          for _ in $(seq 1 180); do
            run=$(gh api "repos/$REPO/actions/runs/$run_id")
            status=$(jq -r '.status' <<<"$run")
            if [ "$status" = 'completed' ]; then
              conclusion=$(jq -r '.conclusion' <<<"$run")
              test "$conclusion" = 'success' || { echo "RECONCILIATION_FAILED:$run_id:$conclusion"; exit 1; }
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo 'RECONCILIATION_TIMEOUT'; exit 1

      - name: Verify fresh reconciliation evidence
        env:
          RUN_ID: ${{ steps.second.outputs.run_id }}
          EXPECTED_EXTERNAL: ${{ steps.published.outputs.external_media_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf second-evidence
          gh run download "$RUN_ID" --repo "$REPO" -n "github-native-instagram-${RUN_ID}-1" -D second-evidence
          evidence=$(find second-evidence -name 'github-native-publication-evidence.json' -print -quit)
          test -n "$evidence"
          jq -e --arg item "$TARGET_ITEM" --arg external "$EXPECTED_EXTERNAL" '.mode == "CANARY" and .writesEnabled == true and (.items[] | select(.contentItemId == $item and .outcome == "RECONCILED_ALREADY_PUBLISHED_READBACK_VERIFIED" and .externalMediaId == $external))' "$evidence" >/dev/null

      - name: Record controlled acceptance
        env:
          FIRST_RUN_ID: ${{ steps.first.outputs.run_id }}
          SECOND_RUN_ID: ${{ steps.second.outputs.run_id }}
          EXTERNAL_MEDIA_ID: ${{ steps.published.outputs.external_media_id }}
        shell: bash
        run: |
          set -euo pipefail
          echo "CANARY_ACCEPTED item=$TARGET_ITEM external_media_id=$EXTERNAL_MEDIA_ID first_run=$FIRST_RUN_ID reconciliation_run=$SECOND_RUN_ID"
