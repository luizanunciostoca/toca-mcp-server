name: Instagram Engagement Shadow Unique Candidate Recovery

on:
  workflow_dispatch:
    inputs:
      confirm_recovery:
        description: 'Type RECOVER_ENGAGEMENT_SHADOW_UNIQUE_CANDIDATE to authorize unique candidate recovery'
        required: true
        type: string
      authorization_ref:
        description: 'Same-repository PRODUCTION AUTHORIZATION issue URL bound to the exact controller SHA'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: instagram-engagement-production-shadow
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  DATABASE_SECRET_ID: toca-database-url
  META_TOKEN_SECRET_ID: toca-meta-oauth-token
  META_APP_SECRET_ID: toca-meta-app-secret
  DAEMON_SERVICE_NAME: toca-managed-instagram-daemon
  WEBHOOK_SERVICE_NAME: toca-webhook-next-production
  SCHEDULER_JOB_NAME: toca-managed-instagram-tick
  INSTAGRAM_ACCOUNT_ID: '17841402033495654'
  INSTAGRAM_PAGE_ID: '306103746115875'
  META_APP_ID: '2281930145887404'
  CANONICAL_FAQ_SPREADSHEET_ID: 1M0HSs7QJpFCJvvnrZxJRaaXY8scv5R3okCG_OyFLiEU
  TOCA_TENANT_ID: toca
  TOCA_WORKSPACE_ID: toca
  TOCA_ORGANIZATION_ID: toca
  META_REDIRECT_URI: https://toca-meta-oauth-staging-990081828836.southamerica-east1.run.app/oauth/meta/callback
  META_REQUESTED_SCOPES: pages_show_list,pages_read_engagement,pages_manage_metadata,pages_messaging,business_management,instagram_basic,instagram_manage_comments,instagram_manage_messages,instagram_content_publish
  RUNTIME_SOURCE_SHA: d23039fa360b1e1674964a59bd003ca76227e48f
  RUNTIME_IMAGE_DIGEST: sha256:4f7f9775fea909416341b18e0bc042fe0318037d6c1791fc7bcb4e121af24e30
  RUNTIME_IMAGE: southamerica-east1-docker.pkg.dev/toca-mcp-production/toca-mcp/server@sha256:4f7f9775fea909416341b18e0bc042fe0318037d6c1791fc7bcb4e121af24e30

jobs:
  recover-unique-candidate:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_recovery == 'RECOVER_ENGAGEMENT_SHADOW_UNIQUE_CANDIDATE' && inputs.authorization_ref != '' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - name: Checkout exact controller SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact unique-candidate authorization
        env:
          AUTHORIZATION_REF: ${{ inputs.authorization_ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = 'refs/heads/main'
          test "${{ inputs.confirm_recovery }}" = 'RECOVER_ENGAGEMENT_SHADOW_UNIQUE_CANDIDATE'

          AUTH_PREFIX="https://github.com/${GITHUB_REPOSITORY}/issues/"
          [[ "$AUTHORIZATION_REF" == "${AUTH_PREFIX}"* ]] || { echo 'authorization_ref must be a same-repository issue URL' >&2; exit 1; }
          AUTH_ISSUE="${AUTHORIZATION_REF#${AUTH_PREFIX}}"
          [[ "$AUTH_ISSUE" =~ ^[0-9]+$ ]] || { echo 'authorization_ref must end in one numeric issue id' >&2; exit 1; }

          curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'User-Agent: toca-instagram-shadow-unique-candidate-recovery' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${AUTH_ISSUE}" \
            > /tmp/production-authorization.json

          jq -e \
            --arg expectedUrl "$AUTHORIZATION_REF" \
            --arg sha "$GITHUB_SHA" \
            --arg owner "$GITHUB_REPOSITORY_OWNER" \
            --arg runtimeSha "$RUNTIME_SOURCE_SHA" \
            --arg digest "$RUNTIME_IMAGE_DIGEST" '
              (.html_url == $expectedUrl) and
              (.state == "open") and
              (has("pull_request") | not) and
              (.user.login == $owner) and
              (.title | startswith("PRODUCTION AUTHORIZATION")) and
              ((.body // "") | contains("AUTHORIZED_CANDIDATE_SHA=" + $sha)) and
              ((.body // "") | contains("AUTHORIZATION_STATE=ACTIVE")) and
              ((.body // "") | contains("INSTAGRAM_ENGAGEMENT_SHADOW_UNIQUE_CANDIDATE_RECOVERY=AUTHORIZED")) and
              ((.body // "") | contains("DAEMON_CANDIDATE_TRAFFIC_ROUTING_AUTHORIZED=true")) and
              ((.body // "") | contains("RUNTIME_SOURCE_SHA=" + $runtimeSha)) and
              ((.body // "") | contains("RUNTIME_IMAGE_DIGEST=" + $digest)) and
              ((.body // "") | contains("EXTERNAL_REPLY_WRITES_AUTHORIZED=false"))
            ' /tmp/production-authorization.json >/dev/null || {
              echo 'Production authorization is not active for this exact unique-candidate recovery controller/runtime' >&2
              exit 1
            }

          mkdir -p engagement-evidence
          jq -n --arg controllerSha "$GITHUB_SHA" --arg runtimeSha "$RUNTIME_SOURCE_SHA" --arg digest "$RUNTIME_IMAGE_DIGEST" --arg ref "$AUTHORIZATION_REF" \
            '{schemaVersion:"toca.instagram-engagement.shadow-unique-candidate-authorization.v2",controllerSha:$controllerSha,runtimeSourceSha:$runtimeSha,runtimeImageDigest:$digest,authorizationRef:$ref,daemonCandidateTrafficRoutingAuthorized:true,externalReplyWritesAuthorized:false}' \
            > engagement-evidence/authorization.json

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Run exact-head Quality Gate
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm quality

      - name: Authenticate deployer to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Verify immutable runtime, closed prestate and authenticated scheduler
        shell: bash
        run: |
          set -euo pipefail
          test "$GCP_PROJECT_ID" = 'toca-mcp-production'
          test "$GCP_REGION" = 'southamerica-east1'
          test "$RUNTIME_SOURCE_SHA" = 'd23039fa360b1e1674964a59bd003ca76227e48f'
          test "$RUNTIME_IMAGE_DIGEST" = 'sha256:4f7f9775fea909416341b18e0bc042fe0318037d6c1791fc7bcb4e121af24e30'

          DESCRIBED_DIGEST="$(gcloud artifacts docker images describe "$RUNTIME_IMAGE" --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          [[ "$DESCRIBED_DIGEST" == "$RUNTIME_IMAGE_DIGEST" ]] || { echo 'Runtime image digest mismatch' >&2; exit 1; }

          current_revision() {
            local service="$1"
            gcloud run services describe "$service" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
              | jq -r '. as $s | [($s.status.traffic // [])[] | select((.percent // 0) == 100) | (.revisionName // (if (.latestRevision // false) then $s.status.latestReadyRevisionName else empty end))] | unique | if length == 1 then .[0] else empty end'
          }

          DAEMON_JSON="$(gcloud run services describe "$DAEMON_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          WEBHOOK_JSON="$(gcloud run services describe "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          PREVIOUS_DAEMON_REVISION="$(current_revision "$DAEMON_SERVICE_NAME")"
          PREVIOUS_WEBHOOK_REVISION="$(current_revision "$WEBHOOK_SERVICE_NAME")"
          BEFORE_DAEMON_LATEST_READY="$(printf '%s' "$DAEMON_JSON" | jq -r '.status.latestReadyRevisionName // empty')"
          BEFORE_LATEST_READY="$(printf '%s' "$WEBHOOK_JSON" | jq -r '.status.latestReadyRevisionName // empty')"
          test -n "$PREVIOUS_DAEMON_REVISION"
          test -n "$PREVIOUS_WEBHOOK_REVISION"
          test -n "$BEFORE_DAEMON_LATEST_READY"
          test -n "$BEFORE_LATEST_READY"
          echo "PREVIOUS_DAEMON_REVISION=$PREVIOUS_DAEMON_REVISION" >> "$GITHUB_ENV"
          echo "PREVIOUS_WEBHOOK_REVISION=$PREVIOUS_WEBHOOK_REVISION" >> "$GITHUB_ENV"
          echo "BEFORE_DAEMON_LATEST_READY=$BEFORE_DAEMON_LATEST_READY" >> "$GITHUB_ENV"
          echo "BEFORE_LATEST_READY=$BEFORE_LATEST_READY" >> "$GITHUB_ENV"

          printf '%s' "$DAEMON_JSON" | jq -e '.spec.template.spec.containers[0] as $c | ([$c.env[]? | select(.name == "INSTAGRAM_ENGAGEMENT_WRITES_ENABLED") | .value] | last // "false" == "false") and ([$c.env[]? | select(.name == "INSTAGRAM_PUBLICATION_WRITES_ENABLED") | .value] | last // "false" == "false")' >/dev/null
          printf '%s' "$WEBHOOK_JSON" | jq -e '(.metadata.annotations["run.googleapis.com/default-url-disabled"] // "false") == "true" and ((.metadata.annotations["run.googleapis.com/invoker-iam-disabled"] // "false") != "true")' >/dev/null
          if gcloud run services get-iam-policy "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            | jq -e '.bindings[]? | select(.role == "roles/run.invoker") | (.members // [])[]? | select(. == "allUsers")' >/dev/null; then
            echo 'Legacy allUsers invoker binding must be absent' >&2
            exit 1
          fi

          DAEMON_URL="$(printf '%s' "$DAEMON_JSON" | jq -r '.status.url // empty')"
          test -n "$DAEMON_URL"
          SCHEDULER_JSON="$(gcloud scheduler jobs describe "$SCHEDULER_JOB_NAME" --project "$GCP_PROJECT_ID" --location "$GCP_REGION" --format=json)"
          printf '%s' "$SCHEDULER_JSON" | jq -e --arg uri "${DAEMON_URL}/tick" --arg sa "$GCP_RUNTIME_SERVICE_ACCOUNT" --arg audience "$DAEMON_URL" '
            (.httpTarget.uri == $uri) and
            (.httpTarget.httpMethod == "POST") and
            (.httpTarget.oidcToken.serviceAccountEmail == $sa) and
            (.httpTarget.oidcToken.audience == $audience)
          ' >/dev/null || { echo 'Scheduler target/OIDC boundary mismatch' >&2; exit 1; }
          echo "DAEMON_URL=$DAEMON_URL" >> "$GITHUB_ENV"

          jq -n --arg daemon "$PREVIOUS_DAEMON_REVISION" --arg daemonLatest "$BEFORE_DAEMON_LATEST_READY" --arg webhook "$PREVIOUS_WEBHOOK_REVISION" --arg latest "$BEFORE_LATEST_READY" --arg scheduler "$SCHEDULER_JOB_NAME" \
            '{schemaVersion:"toca.instagram-engagement.shadow-unique-candidate-prestate.v2",daemonRevision:$daemon,daemonLatestReadyBefore:$daemonLatest,webhookTrafficRevision:$webhook,webhookLatestReadyBefore:$latest,callbackClosed:true,scheduler:$scheduler,schedulerTargetVerified:true,schedulerOidcVerified:true,writesEnabled:false}' \
            > engagement-evidence/prestate.json

      - name: Re-run fail-closed readiness
        shell: bash
        run: |
          set -euo pipefail
          JOB="toca-ig-eng-unique-ready-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          gcloud run jobs deploy "$JOB" \
            --image "$RUNTIME_IMAGE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --set-env-vars "NODE_ENV=production,META_ENABLED=false,INSTAGRAM_ENGAGEMENT_RUNTIME_ENABLED=true,INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=false,INSTAGRAM_ENGAGEMENT_TENANT_ID=$TOCA_TENANT_ID,INSTAGRAM_ENGAGEMENT_WORKSPACE_ID=$TOCA_WORKSPACE_ID,INSTAGRAM_ENGAGEMENT_ORGANIZATION_ID=$TOCA_ORGANIZATION_ID,INSTAGRAM_ENGAGEMENT_PAGE_ID=$INSTAGRAM_PAGE_ID,INSTAGRAM_BUSINESS_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID,INSTAGRAM_ENGAGEMENT_KNOWLEDGE_SPREADSHEET_ID=$CANONICAL_FAQ_SPREADSHEET_ID,INSTAGRAM_ENGAGEMENT_KNOWLEDGE_SOURCE=postgres" \
            --command node --args dist/src/instagram-engagement-readiness-preflight.js --tasks 1 --max-retries 0 --task-timeout 180s --quiet
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet
          LOG_ENTRIES="$(gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${JOB}\"" --project "$GCP_PROJECT_ID" --freshness=20m --limit=200 --order=asc --format=json || true)"
          READINESS="$(printf '%s' "$LOG_ENTRIES" | node scripts/extract-instagram-engagement-cloud-run-evidence.mjs instagram-engagement-readiness)"
          printf '%s' "$READINESS" | jq -e '.status == "PASS" and .writesEnabled == false and .databaseSchemaVerified == true and .migrationVerified == true and .knowledgeReadable == true and .knowledgeSnapshotVerified == true and .knowledgeAuthMode == "postgres" and .scopeConfigured == true and .secretsPrinted == false' >/dev/null
          printf '%s\n' "$READINESS" > engagement-evidence/readiness.json
          cleanup
          trap - EXIT

      - name: Create and validate deterministic unique candidates while callback remains closed
        id: candidate
        shell: bash
        run: |
          set -euo pipefail

          RUN_TAIL="${GITHUB_RUN_ID: -7}"
          DAEMON_REVISION_SUFFIX="d${RUN_TAIL}a${GITHUB_RUN_ATTEMPT}"
          REVISION_SUFFIX="u${RUN_TAIL}a${GITHUB_RUN_ATTEMPT}"
          EXPECTED_DAEMON_CANDIDATE_REVISION="${DAEMON_SERVICE_NAME}-${DAEMON_REVISION_SUFFIX}"
          EXPECTED_WEBHOOK_CANDIDATE_REVISION="${WEBHOOK_SERVICE_NAME}-${REVISION_SUFFIX}"
          [[ "$EXPECTED_DAEMON_CANDIDATE_REVISION" != "$PREVIOUS_DAEMON_REVISION" ]]
          [[ "$EXPECTED_DAEMON_CANDIDATE_REVISION" != "$BEFORE_DAEMON_LATEST_READY" ]]
          [[ "$EXPECTED_WEBHOOK_CANDIDATE_REVISION" != "$PREVIOUS_WEBHOOK_REVISION" ]]
          [[ "$EXPECTED_WEBHOOK_CANDIDATE_REVISION" != "$BEFORE_LATEST_READY" ]]

          DAEMON_ENV="^@^INSTAGRAM_ENGAGEMENT_RUNTIME_ENABLED=true@INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=false@INSTAGRAM_ENGAGEMENT_TENANT_ID=$TOCA_TENANT_ID@INSTAGRAM_ENGAGEMENT_WORKSPACE_ID=$TOCA_WORKSPACE_ID@INSTAGRAM_ENGAGEMENT_ORGANIZATION_ID=$TOCA_ORGANIZATION_ID@INSTAGRAM_ENGAGEMENT_PAGE_ID=$INSTAGRAM_PAGE_ID@INSTAGRAM_ENGAGEMENT_KNOWLEDGE_SPREADSHEET_ID=$CANONICAL_FAQ_SPREADSHEET_ID@INSTAGRAM_ENGAGEMENT_KNOWLEDGE_SOURCE=postgres@INSTAGRAM_BUSINESS_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID@INSTAGRAM_ENGAGEMENT_SHADOW_RUN_ID=$GITHUB_RUN_ID"
          gcloud run services update "$DAEMON_SERVICE_NAME" \
            --image "$RUNTIME_IMAGE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" --add-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --update-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --revision-suffix="$DAEMON_REVISION_SUFFIX" \
            --update-env-vars "$DAEMON_ENV" \
            --command node --args dist/src/toca-managed-instagram-daemon.js --quiet

          DAEMON_REVISION_JSON="$(gcloud run revisions describe "$EXPECTED_DAEMON_CANDIDATE_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$DAEMON_REVISION_JSON" | jq \
            --arg expected "$EXPECTED_DAEMON_CANDIDATE_REVISION" \
            --arg digest "$RUNTIME_IMAGE_DIGEST" \
            --arg sa "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --arg tenant "$TOCA_TENANT_ID" \
            --arg workspace "$TOCA_WORKSPACE_ID" \
            --arg organization "$TOCA_ORGANIZATION_ID" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg databaseSecret "$DATABASE_SECRET_ID" \
            --arg cloudSql "$CLOUD_SQL_INSTANCE" '
            .spec.containers[0] as $c |
            def envValue($name): ([($c.env // [])[] | select(.name == $name) | .value] | last // null);
            {
              schemaVersion:"toca.instagram-engagement.shadow-daemon-candidate-contract.v1",
              revisionName:(.metadata.name // ""),
              expectedRevisionName:$expected,
              serviceAccountMatches:(.spec.serviceAccountName == $sa),
              imageDigestMatches:($c.image | contains($digest)),
              commandMatches:($c.command == ["node"]),
              argsMatches:($c.args == ["dist/src/toca-managed-instagram-daemon.js"]),
              runtimeEnabled:envValue("INSTAGRAM_ENGAGEMENT_RUNTIME_ENABLED"),
              writesEnabled:envValue("INSTAGRAM_ENGAGEMENT_WRITES_ENABLED"),
              tenantMatches:(envValue("INSTAGRAM_ENGAGEMENT_TENANT_ID") == $tenant),
              workspaceMatches:(envValue("INSTAGRAM_ENGAGEMENT_WORKSPACE_ID") == $workspace),
              organizationMatches:(envValue("INSTAGRAM_ENGAGEMENT_ORGANIZATION_ID") == $organization),
              shadowRunMatches:(envValue("INSTAGRAM_ENGAGEMENT_SHADOW_RUN_ID") == $runId),
              knowledgeSourceMatches:(envValue("INSTAGRAM_ENGAGEMENT_KNOWLEDGE_SOURCE") == "postgres"),
              databaseSecretBound:([($c.env // [])[] | select(.name == "DATABASE_URL") | tostring] | any(contains($databaseSecret))),
              cloudSqlBound:([.. | strings] | any(contains($cloudSql)))
            }
          ' > engagement-evidence/daemon-candidate-contract.json

          jq -e '
            (.revisionName == .expectedRevisionName) and
            (.serviceAccountMatches == true) and
            (.imageDigestMatches == true) and
            (.commandMatches == true) and
            (.argsMatches == true) and
            (.runtimeEnabled == "true") and
            (.writesEnabled == "false") and
            (.tenantMatches == true) and
            (.workspaceMatches == true) and
            (.organizationMatches == true) and
            (.shadowRunMatches == true) and
            (.knowledgeSourceMatches == true) and
            (.databaseSecretBound == true) and
            (.cloudSqlBound == true)
          ' engagement-evidence/daemon-candidate-contract.json >/dev/null || {
            cat engagement-evidence/daemon-candidate-contract.json >&2
            echo 'Daemon unique candidate revision contract mismatch' >&2
            exit 1
          }

          gcloud run services update-traffic "$DAEMON_SERVICE_NAME" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --to-revisions="${EXPECTED_DAEMON_CANDIDATE_REVISION}=100" --quiet

          DAEMON_ROUTED_JSON="$(gcloud run services describe "$DAEMON_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$DAEMON_ROUTED_JSON" | jq -e --arg revision "$EXPECTED_DAEMON_CANDIDATE_REVISION" '
            ([.status.traffic[]? | select((.percent // 0) == 100) | .revisionName] | length == 1) and
            ([.status.traffic[]? | select((.percent // 0) == 100) | .revisionName] | first == $revision)
          ' >/dev/null || { echo 'Daemon unique candidate must own exactly 100% traffic before proof' >&2; exit 1; }

          echo "DAEMON_CANDIDATE_REVISION=$EXPECTED_DAEMON_CANDIDATE_REVISION" >> "$GITHUB_ENV"
          jq -n --arg revision "$EXPECTED_DAEMON_CANDIDATE_REVISION" --arg previous "$PREVIOUS_DAEMON_REVISION" --arg beforeLatest "$BEFORE_DAEMON_LATEST_READY" \
            '{schemaVersion:"toca.instagram-engagement.shadow-daemon-candidate-routing.v1",daemonCandidateRevision:$revision,previousTrafficRevision:$previous,latestReadyBefore:$beforeLatest,candidateRevisionUnique:true,candidateRevisionVerified:true,candidateTrafficPercent:100,writesEnabled:false}' \
            > engagement-evidence/daemon-candidate-routing.json

          WEBHOOK_ENV="^@^NODE_ENV=production@MCP_ENABLED=false@TOCA_SERVICE_ROLE=webhook@TOCA_DEFAULT_TENANT_ID=$TOCA_TENANT_ID@TOCA_DEFAULT_WORKSPACE_ID=$TOCA_WORKSPACE_ID@TOCA_DEFAULT_ORGANIZATION_ID=$TOCA_ORGANIZATION_ID@META_ENABLED=true@META_PROVIDER_VERIFIED=true@META_WEBHOOK_ENABLED=true@META_WEBHOOK_PERSISTENCE_ENABLED=true@META_APP_ID=$META_APP_ID@META_APP_SECRET_PROVIDER=env@META_APP_SECRET_KEY=META_APP_SECRET@META_AUTHORIZATION_ENDPOINT=https://www.facebook.com/dialog/oauth@META_TOKEN_ENDPOINT=https://graph.facebook.com/oauth/access_token@META_REDIRECT_URI=$META_REDIRECT_URI@META_REQUESTED_SCOPES=$META_REQUESTED_SCOPES@META_GRAPH_BASE_URL=https://graph.facebook.com@META_GRAPH_API_VERSION=v24.0@INSTAGRAM_ENGAGEMENT_RUNTIME_ENABLED=true@INSTAGRAM_ENGAGEMENT_TENANT_ID=$TOCA_TENANT_ID@INSTAGRAM_ENGAGEMENT_WORKSPACE_ID=$TOCA_WORKSPACE_ID@INSTAGRAM_ENGAGEMENT_ORGANIZATION_ID=$TOCA_ORGANIZATION_ID@INSTAGRAM_ENGAGEMENT_SHADOW_RUN_ID=$GITHUB_RUN_ID@INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=false@INSTAGRAM_BUSINESS_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID"
          gcloud run services update "$WEBHOOK_SERVICE_NAME" \
            --image "$RUNTIME_IMAGE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" --add-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --update-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest,META_APP_SECRET=$META_APP_SECRET_ID:latest" \
            --revision-suffix="$REVISION_SUFFIX" \
            --update-env-vars "$WEBHOOK_ENV" --command node --args dist/src/http-instagram-engagement.js --quiet

          # Do not trust latestReadyRevisionName to identify the candidate. Address the exact requested revision directly.
          REVISION_JSON="$(gcloud run revisions describe "$EXPECTED_WEBHOOK_CANDIDATE_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$REVISION_JSON" | jq \
            --arg expected "$EXPECTED_WEBHOOK_CANDIDATE_REVISION" \
            --arg digest "$RUNTIME_IMAGE_DIGEST" \
            --arg sa "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --arg tenant "$TOCA_TENANT_ID" \
            --arg workspace "$TOCA_WORKSPACE_ID" \
            --arg organization "$TOCA_ORGANIZATION_ID" \
            --arg runId "$GITHUB_RUN_ID" '
            .spec.containers[0] as $c |
            def envValue($name): ([($c.env // [])[] | select(.name == $name) | .value] | last // null);
            {
              schemaVersion:"toca.instagram-engagement.shadow-unique-candidate-contract.v1",
              revisionName:(.metadata.name // ""),
              expectedRevisionName:$expected,
              serviceAccountMatches:(.spec.serviceAccountName == $sa),
              imageDigestMatches:($c.image | contains($digest)),
              commandMatches:($c.command == ["node"]),
              argsMatches:($c.args == ["dist/src/http-instagram-engagement.js"]),
              runtimeEnabled:envValue("INSTAGRAM_ENGAGEMENT_RUNTIME_ENABLED"),
              tenantId:envValue("INSTAGRAM_ENGAGEMENT_TENANT_ID"),
              workspaceId:envValue("INSTAGRAM_ENGAGEMENT_WORKSPACE_ID"),
              organizationId:envValue("INSTAGRAM_ENGAGEMENT_ORGANIZATION_ID"),
              shadowRunId:envValue("INSTAGRAM_ENGAGEMENT_SHADOW_RUN_ID"),
              writesEnabled:envValue("INSTAGRAM_ENGAGEMENT_WRITES_ENABLED"),
              persistenceEnabled:envValue("META_WEBHOOK_PERSISTENCE_ENABLED"),
              tenantMatches:(envValue("INSTAGRAM_ENGAGEMENT_TENANT_ID") == $tenant),
              workspaceMatches:(envValue("INSTAGRAM_ENGAGEMENT_WORKSPACE_ID") == $workspace),
              organizationMatches:(envValue("INSTAGRAM_ENGAGEMENT_ORGANIZATION_ID") == $organization),
              shadowRunMatches:(envValue("INSTAGRAM_ENGAGEMENT_SHADOW_RUN_ID") == $runId)
            }
          ' > engagement-evidence/candidate-contract.json

          jq -e '
            (.revisionName == .expectedRevisionName) and
            (.serviceAccountMatches == true) and
            (.imageDigestMatches == true) and
            (.commandMatches == true) and
            (.argsMatches == true) and
            (.runtimeEnabled == "true") and
            (.tenantMatches == true) and
            (.workspaceMatches == true) and
            (.organizationMatches == true) and
            (.shadowRunMatches == true) and
            (.writesEnabled == "false") and
            (.persistenceEnabled == "true")
          ' engagement-evidence/candidate-contract.json >/dev/null || {
            cat engagement-evidence/candidate-contract.json >&2
            echo 'Webhook unique candidate revision contract mismatch' >&2
            exit 1
          }

          SERVICE_JSON="$(gcloud run services describe "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$SERVICE_JSON" | jq -e '(.metadata.annotations["run.googleapis.com/default-url-disabled"] // "false") == "true"' >/dev/null || {
            echo 'Callback must remain closed while validating unique candidate' >&2
            exit 1
          }

          gcloud run services update-traffic "$WEBHOOK_SERVICE_NAME" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --to-revisions="${EXPECTED_WEBHOOK_CANDIDATE_REVISION}=100" --quiet

          ROUTED_JSON="$(gcloud run services describe "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$ROUTED_JSON" | jq -e --arg revision "$EXPECTED_WEBHOOK_CANDIDATE_REVISION" '
            ([.status.traffic[]? | select((.percent // 0) == 100) | .revisionName] | length == 1) and
            ([.status.traffic[]? | select((.percent // 0) == 100) | .revisionName] | first == $revision) and
            ((.metadata.annotations["run.googleapis.com/default-url-disabled"] // "false") == "true")
          ' >/dev/null || { echo 'Unique candidate must own exactly 100% traffic while callback remains closed' >&2; exit 1; }

          echo "WEBHOOK_CANDIDATE_REVISION=$EXPECTED_WEBHOOK_CANDIDATE_REVISION" >> "$GITHUB_ENV"
          echo "candidate_revision=$EXPECTED_WEBHOOK_CANDIDATE_REVISION" >> "$GITHUB_OUTPUT"
          jq -n --arg revision "$EXPECTED_WEBHOOK_CANDIDATE_REVISION" --arg previous "$PREVIOUS_WEBHOOK_REVISION" --arg beforeLatest "$BEFORE_LATEST_READY" --arg daemonRevision "$EXPECTED_DAEMON_CANDIDATE_REVISION" \
            '{schemaVersion:"toca.instagram-engagement.shadow-unique-candidate-routing.v2",candidateRevision:$revision,previousTrafficRevision:$previous,latestReadyBefore:$beforeLatest,candidateRevisionUnique:true,candidateRevisionVerified:true,candidateTrafficPercent:100,daemonCandidateRevision:$daemonRevision,daemonCandidateTrafficPercent:100,callbackClosedDuringRouting:true,webhookInboundOutboxEnabled:true,writesEnabled:false}' \
            > engagement-evidence/candidate-routing.json

      - name: Expose DRS-safe callback only after exact unique candidate owns 100 percent traffic
        id: deployed
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --default-url --quiet
          gcloud run services update "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --default-url --no-invoker-iam-check --quiet

          WEBHOOK_JSON="$(gcloud run services describe "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$WEBHOOK_JSON" | jq -e --arg revision "$WEBHOOK_CANDIDATE_REVISION" '
            ((.metadata.annotations["run.googleapis.com/default-url-disabled"] // "false") != "true") and
            ((.metadata.annotations["run.googleapis.com/invoker-iam-disabled"] // "false") == "true") and
            ([.status.traffic[]? | select((.percent // 0) == 100) | .revisionName] | first == $revision)
          ' >/dev/null || { echo 'DRS callback or exact unique candidate traffic verification failed' >&2; exit 1; }
          if gcloud run services get-iam-policy "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            | jq -e '.bindings[]? | select(.role == "roles/run.invoker") | (.members // [])[]? | select(. == "allUsers")' >/dev/null; then
            echo 'DRS-safe callback must not use allUsers IAM' >&2
            exit 1
          fi
          WEBHOOK_URL="$(printf '%s' "$WEBHOOK_JSON" | jq -r '.status.url // empty')"
          test -n "$WEBHOOK_URL"
          echo "webhook_url=$WEBHOOK_URL" >> "$GITHUB_OUTPUT"
          jq -n --arg webhookUrl "$WEBHOOK_URL" --arg revision "$WEBHOOK_CANDIDATE_REVISION" --arg daemonRevision "$DAEMON_CANDIDATE_REVISION" \
            '{schemaVersion:"toca.instagram-engagement.shadow-unique-candidate-deploy.v2",webhookUrl:$webhookUrl,candidateRevision:$revision,candidateRevisionUnique:true,candidateTrafficPercent:100,daemonCandidateRevision:$daemonRevision,daemonCandidateTrafficPercent:100,webhookInboundOutboxEnabled:true,callbackDrsSafe:true,legacyAllUsersInvoker:false,engagementWritesEnabled:false}' \
            > engagement-evidence/deploy.json

      - name: Prove COMMENT and DIRECT against exact unique candidates with authenticated ticks
        env:
          WEBHOOK_URL: ${{ steps.deployed.outputs.webhook_url }}
        shell: bash
        run: |
          set -euo pipefail
          JOB="toca-ig-eng-unique-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TICK_PID=''
          cleanup() {
            if [[ -n "$TICK_PID" ]]; then kill "$TICK_PID" >/dev/null 2>&1 || true; wait "$TICK_PID" >/dev/null 2>&1 || true; fi
            gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ROUTED_JSON="$(gcloud run services describe "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$ROUTED_JSON" | jq -e --arg revision "$WEBHOOK_CANDIDATE_REVISION" '([.status.traffic[]? | select((.percent // 0) == 100) | .revisionName] | first == $revision)' >/dev/null
          DAEMON_ROUTED_JSON="$(gcloud run services describe "$DAEMON_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$DAEMON_ROUTED_JSON" | jq -e --arg revision "$DAEMON_CANDIDATE_REVISION" '([.status.traffic[]? | select((.percent // 0) == 100) | .revisionName] | first == $revision)' >/dev/null || {
            echo 'Exact daemon candidate must still own 100% traffic immediately before proof' >&2
            exit 1
          }

          gcloud run jobs deploy "$JOB" \
            --image "$RUNTIME_IMAGE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest,META_APP_SECRET=$META_APP_SECRET_ID:latest" \
            --set-env-vars "NODE_ENV=production,INSTAGRAM_ENGAGEMENT_SHADOW_WEBHOOK_URL=$WEBHOOK_URL,INSTAGRAM_BUSINESS_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID,INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=false" \
            --command node --args dist/src/ops/instagram-engagement-shadow-proof.js --tasks 1 --max-retries 0 --task-timeout 240s --quiet

          tick_pump() {
            sleep 8
            for attempt in $(seq 1 20); do
              gcloud scheduler jobs run "$SCHEDULER_JOB_NAME" --project "$GCP_PROJECT_ID" --location "$GCP_REGION" --quiet || return 1
              sleep 10
            done
          }
          tick_pump &
          TICK_PID=$!

          set +e
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet
          PROOF_RC=$?
          set -e
          kill "$TICK_PID" >/dev/null 2>&1 || true
          wait "$TICK_PID" >/dev/null 2>&1 || true
          TICK_PID=''

          LOG_ENTRIES="$(gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${JOB}\"" --project "$GCP_PROJECT_ID" --freshness=20m --limit=300 --order=asc --format=json || true)"
          if [[ "$PROOF_RC" -ne 0 ]]; then
            printf '%s\n' "$LOG_ENTRIES" | jq '[.[] | {timestamp,severity,textPayload,jsonPayload,labels}]' > engagement-evidence/proof-job-sanitized-logs.json || true
            jq -n --argjson exitCode "$PROOF_RC" --arg revision "$WEBHOOK_CANDIDATE_REVISION" --arg daemonRevision "$DAEMON_CANDIDATE_REVISION" \
              '{schemaVersion:"toca.instagram-engagement.shadow-unique-candidate-proof-failure.v2",proofJobExitCode:$exitCode,candidateRevision:$revision,candidateRevisionUnique:true,candidateTrafficPercent:100,daemonCandidateRevision:$daemonRevision,daemonCandidateTrafficPercent:100,webhookInboundOutboxEnabled:true,tickPumpUsed:true,schedulerTargetVerified:true,writesEnabled:false}' \
              > engagement-evidence/proof-failure.json
            echo 'Synthetic proof job failed against exact unique candidates after authenticated tick pump' >&2
            exit "$PROOF_RC"
          fi

          PROOF="$(printf '%s' "$LOG_ENTRIES" | node scripts/extract-instagram-engagement-cloud-run-evidence.mjs instagram-engagement-shadow-e2e)"
          printf '%s' "$PROOF" | jq -e '.status == "PASS" and (.channelsVerified | sort == ["COMMENT","DIRECT"]) and .webhookAccepted == true and .inboundDelivered == true and .faqResolved == true and .externalReplyObserved == false and .replyOutboxEvents == 0 and .writesEnabled == false' >/dev/null
          printf '%s\n' "$PROOF" > engagement-evidence/shadow-proof.json
          cleanup
          trap - EXIT

      - name: Configure and read back Meta COMMENT and DIRECT subscriptions
        env:
          WEBHOOK_URL: ${{ steps.deployed.outputs.webhook_url }}
        shell: bash
        run: |
          set -euo pipefail
          JOB="toca-ig-eng-unique-sub-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          gcloud run jobs deploy "$JOB" \
            --image "$RUNTIME_IMAGE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --set-secrets "META_APP_SECRET=$META_APP_SECRET_ID:latest,META_ACCESS_TOKEN=$META_TOKEN_SECRET_ID:latest" \
            --set-env-vars "INSTAGRAM_ENGAGEMENT_SHADOW_WEBHOOK_URL=$WEBHOOK_URL,META_APP_ID=$META_APP_ID,INSTAGRAM_ENGAGEMENT_PAGE_ID=$INSTAGRAM_PAGE_ID,INSTAGRAM_BUSINESS_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID,META_GRAPH_BASE_URL=https://graph.facebook.com,META_GRAPH_API_VERSION=v24.0" \
            --command node --args dist/src/ops/configure-instagram-engagement-meta-subscriptions.js --tasks 1 --max-retries 0 --task-timeout 180s --quiet
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet
          LOG_ENTRIES="$(gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${JOB}\"" --project "$GCP_PROJECT_ID" --freshness=20m --limit=200 --order=asc --format=json || true)"
          SUBSCRIPTION="$(printf '%s' "$LOG_ENTRIES" | node scripts/extract-instagram-engagement-cloud-run-evidence.mjs instagram-engagement-meta-subscriptions)"
          printf '%s' "$SUBSCRIPTION" | jq -e '.status == "PASS" and .appSubscriptionConfigured == true and .pageSubscriptionConfigured == true and .instagramSubscriptionConfigured == true and .pageAccessTokenResolved == true and .secretsPrinted == false' >/dev/null
          printf '%s\n' "$SUBSCRIPTION" > engagement-evidence/meta-subscriptions.json
          cleanup
          trap - EXIT

      - name: Write successful unique-candidate recovery closeout
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg controllerSha "$GITHUB_SHA" --arg runtimeSha "$RUNTIME_SOURCE_SHA" --arg digest "$RUNTIME_IMAGE_DIGEST" --arg revision "$WEBHOOK_CANDIDATE_REVISION" --arg daemonRevision "$DAEMON_CANDIDATE_REVISION" \
            '{schemaVersion:"toca.instagram-engagement.production-shadow-unique-candidate-recovery.v2",controllerSha:$controllerSha,runtimeSourceSha:$runtimeSha,runtimeImageDigest:$digest,webhookCandidateRevision:$revision,candidateRevisionUnique:true,webhookCandidateTrafficPercent:100,daemonCandidateRevision:$daemonRevision,daemonCandidateRevisionUnique:true,daemonCandidateTrafficPercent:100,webhookInboundOutboxEnabled:true,channels:["COMMENT","DIRECT"],schedulerTargetVerified:true,schedulerOidcVerified:true,syntheticShadowProof:"PASS",metaSubscriptionsProviderReadback:true,externalReplyWritesEnabled:false,productionWriteValidation:"PENDING_EXPLICIT_AUTHORIZATION"}' \
            > engagement-evidence/closeout.json
          cat engagement-evidence/closeout.json >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back unique-candidate recovery on failure
        if: failure()
        shell: bash
        run: |
          set +e
          if [[ -n "${PREVIOUS_DAEMON_REVISION:-}" ]]; then
            gcloud run services update-traffic "$DAEMON_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions="${PREVIOUS_DAEMON_REVISION}=100" --quiet
          fi
          if [[ -n "${PREVIOUS_WEBHOOK_REVISION:-}" ]]; then
            gcloud run services update-traffic "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions="${PREVIOUS_WEBHOOK_REVISION}=100" --quiet
          fi
          gcloud run services update "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --no-default-url --quiet
          gcloud run services update "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --no-default-url --invoker-iam-check --quiet
          gcloud run services remove-iam-policy-binding "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --member=allUsers --role=roles/run.invoker --quiet >/dev/null 2>&1 || true
          echo 'WEBHOOK_AUTOMATIC_ROLLBACK_MODE=DRS_CLOSED' >> "$GITHUB_STEP_SUMMARY"
          echo 'ROLLBACK_ATTEMPTED=true' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized unique-candidate recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instagram-engagement-shadow-unique-candidate-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: engagement-evidence/
          if-no-files-found: warn
          retention-days: 90
