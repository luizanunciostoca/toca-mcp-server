name: Paid Media Production Provider Reconcile TEMP

on:
  push:
    branches:
      - ops/paid-media-production-runtime-inspect-20260813

permissions:
  contents: read
  id-token: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: https://toca-mcp-production-990081828836.southamerica-east1.run.app
      - name: Pinpoint final February Meta Ads delivery date read-only through production MCP
        env:
          TOKEN: ${{ steps.auth.outputs.id_token }}
          URL: https://toca-mcp-production-990081828836.southamerica-east1.run.app/mcp
        shell: bash
        run: |
          set -euo pipefail
          mcp_call() {
            local id="$1" day="$2"
            printf '{"jsonrpc":"2.0","id":%s,"method":"tools/call","params":{"name":"meta_ads.insights.get","arguments":{"adAccountId":"311793958882290","currency":"BRL","level":"account","fields":["account_id","account_name","impressions","reach","clicks","spend","cpc","ctr","actions"],"since":"%s","until":"%s"}}}' "$id" "$day" "$day" > /tmp/request.json
            echo "===== DAY $day ====="
            curl -fsS -X POST "$URL" \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --data-binary @/tmp/request.json
            echo
          }

          mcp_call 30 2026-02-22
          mcp_call 31 2026-02-23
          mcp_call 32 2026-02-24
          mcp_call 33 2026-02-25
          mcp_call 34 2026-02-26
          mcp_call 35 2026-02-27
          mcp_call 36 2026-02-28

          echo 'Read-only daily delivery localization completed through production MCP.'
