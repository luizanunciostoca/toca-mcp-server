name: Paid Media Production Provider Reconcile TEMP

on:
  push:
    branches:
      - ops/paid-media-production-runtime-inspect-20260813

permissions:
  contents: read
  id-token: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: https://toca-mcp-production-990081828836.southamerica-east1.run.app
      - name: Audit 2026 Meta Ads delivery history read-only through production MCP
        env:
          TOKEN: ${{ steps.auth.outputs.id_token }}
          URL: https://toca-mcp-production-990081828836.southamerica-east1.run.app/mcp
        shell: bash
        run: |
          set -euo pipefail
          mcp_call() {
            local id="$1" name="$2" arguments="$3" output="$4"
            printf '{"jsonrpc":"2.0","id":%s,"method":"tools/call","params":{"name":"%s","arguments":%s}}' "$id" "$name" "$arguments" > /tmp/request.json
            curl -fsS -o "$output" -X POST "$URL" \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --data-binary @/tmp/request.json
            echo "===== $name / $arguments ====="
            cat "$output"
            echo
          }

          mcp_call 1 'meta_ads.accounts.list' '{}' /tmp/accounts.txt

          id=10
          for account in 311793958882290 394512749760530 2036212826847237 1737287297102678; do
            mcp_call "$id" 'meta_ads.insights.get' "{\"adAccountId\":\"$account\",\"currency\":\"BRL\",\"level\":\"account\",\"fields\":[\"account_id\",\"account_name\",\"impressions\",\"reach\",\"clicks\",\"spend\",\"cpc\",\"ctr\",\"actions\"],\"since\":\"2026-01-01\",\"until\":\"2026-08-12\"}" "/tmp/account-$account.txt"
            id=$((id+1))
          done

          mcp_call 20 'meta_ads.insights.get' '{"adAccountId":"311793958882290","currency":"BRL","level":"campaign","fields":["campaign_id","campaign_name","impressions","reach","clicks","spend","cpc","ctr","actions"],"since":"2026-01-01","until":"2026-08-12"}' /tmp/official-ytd.txt

          echo 'Read-only 2026 delivery-history audit completed through production MCP.'
