name: Instagram DM 2025 MCP Execution

on:
  push:
    branches:
      - ops/instagram-dm-2025-mcp-exec-20260828
    paths:
      - '.github/workflows/instagram-dm-2025-mcp-exec.yml'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_ARTIFACT_REPOSITORY: toca-mcp
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  DATABASE_SECRET_ID: toca-database-url
  TOKEN_SECRET_ID: toca-meta-oauth-token
  INSTAGRAM_ACCOUNT_ID: '17841402033495654'

jobs:
  execute-through-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Materialize MCP execution-only catalog binding and client
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          ids = Path('src/governance/capability-ids.ts')
          source = ids.read_text()
          old = "  R08: ['meta_ads.accounts.list', 'meta_ads.campaign.prepare_paused'],\n  R17: ['system.capabilities', 'system.health'],"
          new = "  R08: ['meta_ads.accounts.list', 'meta_ads.campaign.prepare_paused'],\n  R09: [\n    'instagram.messaging.conversations.read',\n    'instagram.messaging.messages.read',\n  ],\n  R17: ['system.capabilities', 'system.health'],"
          if old not in source:
              raise SystemExit('MCP_EXECUTION_CATALOG_PATCH_TARGET_NOT_FOUND')
          ids.write_text(source.replace(old, new, 1))

          server = Path('src/server.ts')
          source = server.read_text()
          old = "  const cloudRunService = env.K_SERVICE?.trim();"
          new = "  const cloudRunService = env.K_SERVICE?.trim() || env.CLOUD_RUN_JOB?.trim();"
          if old not in source:
              raise SystemExit('MCP_EXECUTION_JOB_IDENTITY_PATCH_TARGET_NOT_FOUND')
          server.write_text(source.replace(old, new, 1))
          PY

          cat > src/instagram-dm-2025-mcp-exec.ts <<'TS'
          import { spawn } from 'node:child_process';
          import { createInterface } from 'node:readline';

          type JsonObject = Record<string, unknown>;
          type RpcReply = { jsonrpc: '2.0'; id?: number; result?: unknown; error?: { code?: number; message?: string } };

          const child = spawn(process.execPath, ['dist/src/index.js'], {
            env: process.env,
            stdio: ['pipe', 'pipe', 'pipe'],
          });

          let nextId = 1;
          const pending = new Map<number, { resolve: (value: unknown) => void; reject: (error: Error) => void }>();
          const stderr: string[] = [];

          createInterface({ input: child.stdout }).on('line', (line) => {
            const trimmed = line.trim();
            if (!trimmed) return;
            let reply: RpcReply;
            try {
              reply = JSON.parse(trimmed) as RpcReply;
            } catch {
              return;
            }
            if (typeof reply.id !== 'number') return;
            const waiter = pending.get(reply.id);
            if (!waiter) return;
            pending.delete(reply.id);
            if (reply.error) {
              waiter.reject(new Error(`MCP_RPC_ERROR:${reply.error.code ?? 'UNKNOWN'}:${safe(reply.error.message)}`));
              return;
            }
            waiter.resolve(reply.result);
          });

          createInterface({ input: child.stderr }).on('line', (line) => {
            const sanitized = safe(line);
            if (sanitized) stderr.push(sanitized);
            if (stderr.length > 20) stderr.shift();
          });

          function safe(value: unknown): string {
            const text = String(value ?? '').replace(/[\r\n]+/g, ' ').trim();
            const meta = text.match(/META_GRAPH_READ_FAILED:\d+:\d+:[A-Za-z0-9_]+/);
            if (meta) return meta[0];
            const uppercase = text.match(/[A-Z][A-Z0-9_]+(?::[A-Z0-9_.-]+){0,5}/);
            return uppercase?.[0] ?? 'REDACTED_ERROR';
          }

          function send(method: string, params: JsonObject): Promise<unknown> {
            const id = nextId++;
            const payload = JSON.stringify({ jsonrpc: '2.0', id, method, params });
            child.stdin.write(`${payload}\n`);
            return new Promise((resolve, reject) => {
              const timer = setTimeout(() => {
                pending.delete(id);
                reject(new Error(`MCP_TIMEOUT:${method}`));
              }, 20000);
              pending.set(id, {
                resolve: (value) => {
                  clearTimeout(timer);
                  resolve(value);
                },
                reject: (error) => {
                  clearTimeout(timer);
                  reject(error);
                },
              });
            });
          }

          function notify(method: string, params: JsonObject): void {
            child.stdin.write(`${JSON.stringify({ jsonrpc: '2.0', method, params })}\n`);
          }

          function structured(result: unknown): JsonObject {
            const value = result as { isError?: boolean; structuredContent?: JsonObject; content?: Array<{ type?: string; text?: string }> };
            if (value?.isError) {
              const text = value.content?.find((item) => item.type === 'text')?.text ?? 'MCP_TOOL_ERROR';
              throw new Error(safe(text));
            }
            if (value?.structuredContent && typeof value.structuredContent === 'object') return value.structuredContent;
            const text = value?.content?.find((item) => item.type === 'text')?.text;
            if (text) {
              const parsed = JSON.parse(text) as unknown;
              if (parsed && typeof parsed === 'object') return parsed as JsonObject;
            }
            throw new Error('MCP_STRUCTURED_RESULT_REQUIRED');
          }

          async function callTool(name: string, args: JsonObject): Promise<JsonObject> {
            return structured(await send('tools/call', { name, arguments: args }));
          }

          async function main(): Promise<void> {
            const initialized = await send('initialize', {
              protocolVersion: '2025-06-18',
              capabilities: {},
              clientInfo: { name: 'toca-os-instagram-dm-2025-exec', version: '1.0.0' },
            });
            notify('notifications/initialized', {});

            const initRecord = initialized as { serverInfo?: { name?: string; version?: string }; protocolVersion?: string };
            console.log(JSON.stringify({
              validation: 'toca-mcp-handshake',
              server: initRecord.serverInfo?.name ?? null,
              version: initRecord.serverInfo?.version ?? null,
              protocolVersion: initRecord.protocolVersion ?? null,
            }));

            const toolsReply = (await send('tools/list', {})) as { tools?: Array<{ name?: string }> };
            const toolNames = (toolsReply.tools ?? []).map((tool) => tool.name).filter(Boolean);
            console.log(JSON.stringify({
              validation: 'toca-mcp-tool-surface',
              tocaExecutePresent: toolNames.includes('toca.execute'),
              capabilitySearchPresent: toolNames.includes('toca.capabilities.search'),
              toolCount: toolNames.length,
            }));

            const search = await callTool('toca.capabilities.search', {
              query: 'instagram.messaging',
              executableOnly: true,
              limit: 10,
            });
            const capabilities = Array.isArray(search.capabilities) ? search.capabilities as Array<JsonObject> : [];
            console.log(JSON.stringify({
              validation: 'toca-mcp-instagram-messaging-capabilities',
              executableCapabilities: capabilities.map((entry) => entry.capabilityId).filter(Boolean),
            }));

            try {
              const execution = await callTool('toca.execute', {
                capabilityId: 'instagram.messaging.conversations.read',
                payload: { limit: 1 },
                correlationId: `instagram-dm-2025-mcp-smoke-${Date.now()}`,
              });
              const result = execution.result && typeof execution.result === 'object' ? execution.result as JsonObject : {};
              const conversations = Array.isArray(result.conversations) ? result.conversations : [];
              console.log(JSON.stringify({
                validation: 'toca-mcp-instagram-direct-read',
                status: 'PASS',
                executionIdPresent: typeof execution.executionId === 'string',
                conversationsReturned: conversations.length,
                nextAfterPresent: typeof result.nextAfter === 'string',
              }));
            } catch (error) {
              console.log(JSON.stringify({
                validation: 'toca-mcp-instagram-direct-read',
                status: 'BLOCKED',
                errorCode: safe(error instanceof Error ? error.message : error),
                serverStderrCodes: stderr,
              }));
            }
          }

          main()
            .catch((error) => {
              console.log(JSON.stringify({
                validation: 'toca-mcp-execution-fatal',
                status: 'FAILED',
                errorCode: safe(error instanceof Error ? error.message : error),
                serverStderrCodes: stderr,
              }));
              process.exitCode = 1;
            })
            .finally(() => {
              child.kill('SIGTERM');
            });
          TS

          pnpm install --frozen-lockfile
          pnpm exec prettier --write src/governance/capability-ids.ts src/server.ts src/instagram-dm-2025-mcp-exec.ts
          pnpm typecheck
          pnpm build

      - name: Authenticate deployer to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Build immutable MCP execution image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/server:instagram-dm-mcp-exec-${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "JOB_NAME=toca-instagram-dm-mcp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Execute governed Instagram Direct read through TOCA MCP
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            gcloud run jobs delete "$JOB_NAME" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          gcloud run jobs deploy "$JOB_NAME" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --command node \
            --args dist/src/instagram-dm-2025-mcp-exec.js \
            --set-env-vars "^~^NODE_ENV=production~MCP_ENABLED=true~INSTAGRAM_READ_ENABLED=true~INSTAGRAM_BUSINESS_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID~META_ACCESS_TOKEN_ENV_KEY=META_ACCESS_TOKEN~META_GRAPH_BASE_URL=https://graph.facebook.com~META_GRAPH_API_VERSION=v24.0~META_ENABLED=false~META_WEBHOOK_ENABLED=false~META_WEBHOOK_PERSISTENCE_ENABLED=false~INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=false~INSTAGRAM_PUBLICATION_WRITES_ENABLED=false~META_ADS_READ_ENABLED=false~META_ADS_WRITE_ENABLED=false~GOOGLE_ADS_PHASE=OFF~TOCA_MANAGED_INSTAGRAM_SCHEDULER_ENABLED=false~TOCA_MANAGED_INSTAGRAM_EXECUTOR_ENABLED=false" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest,META_ACCESS_TOKEN=$TOKEN_SECRET_ID:latest" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 180s \
            --quiet

          STATUS=0
          gcloud run jobs execute "$JOB_NAME" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --wait \
            --quiet || STATUS=$?

          sleep 5
          gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME} AND textPayload:\"validation\"" \
            --project "$GCP_PROJECT_ID" \
            --freshness=20m \
            --limit=100 \
            --order=asc \
            --format='value(textPayload)' | grep '"validation"' || true

          exit "$STATUS"
