name: Temporary PR15 Prettier Fix

on:
  push:
    branches:
      - feat/instagram-publication-execution

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore: apply prettier to PR15'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/instagram-publication-execution
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "NO_FORMAT_CHANGES=1"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: apply prettier to PR15"
          git push origin HEAD:feat/instagram-publication-execution
