name: GCP Infra Admin Test IAM Permissions

on:
  pull_request:
    paths:
      - '.github/workflows/gcp-infra-admin-test-iam-permissions.yml'

permissions:
  contents: read
  id-token: write

env:
  CANDIDATE_SHA: 7db1a6e5caf01f98b200257c4aeecc2f1b29550a
  PROJECT_ID: toca-mcp-production
  WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  DEPLOYER_SA: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  INFRA_ADMIN_SA: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com

jobs:
  direct-wif:
    name: Direct WIF testIamPermissions on infra-admin SA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Authenticate direct WIF principal
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Test direct principal permissions on infra-admin SA
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          BODY='{"permissions":["iam.serviceAccounts.get","iam.serviceAccounts.getIamPolicy","iam.serviceAccounts.setIamPolicy","iam.serviceAccounts.getAccessToken","iam.serviceAccounts.actAs"]}'
          HTTP_CODE="$(curl -sS -o /tmp/iam.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$BODY" \
            "https://iam.googleapis.com/v1/projects/-/serviceAccounts/$INFRA_ADMIN_SA:testIamPermissions")"
          echo "DIRECT_SA_TEST_IAM_HTTP=$HTTP_CODE"
          jq -c '{permissions:(.permissions // [])}' /tmp/iam.json || cat /tmp/iam.json
          test "$HTTP_CODE" = '200'

  deployer:
    name: Deployer testIamPermissions on infra-admin SA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Authenticate deployer
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Test deployer permissions on infra-admin SA
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          BODY='{"permissions":["iam.serviceAccounts.get","iam.serviceAccounts.getIamPolicy","iam.serviceAccounts.setIamPolicy","iam.serviceAccounts.getAccessToken","iam.serviceAccounts.actAs"]}'
          HTTP_CODE="$(curl -sS -o /tmp/iam.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$BODY" \
            "https://iam.googleapis.com/v1/projects/-/serviceAccounts/$INFRA_ADMIN_SA:testIamPermissions")"
          echo "DEPLOYER_SA_TEST_IAM_HTTP=$HTTP_CODE"
          jq -c '{permissions:(.permissions // [])}' /tmp/iam.json || cat /tmp/iam.json
          test "$HTTP_CODE" = '200'
