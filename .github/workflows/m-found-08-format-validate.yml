name: M-FOUND-08 Validate

on:
  push:
    branches:
      - feat/m-found-08-audit-observability

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/m-found-08-validate.py
      - run: pnpm exec prettier --write src/core/audit-ledger.ts src/persistence/postgres-audit-sink.ts src/persistence/postgres-operational-observability.ts test/audit-ledger.test.ts test/p0-production-readiness.test.ts
      - run: pnpm quality
      - name: Commit validated result
        run: |
          rm .github/workflows/m-found-08-format-validate.yml scripts/m-found-08-validate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: validate M-FOUND-08 audit observability"
      - name: Push validated result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:feat/m-found-08-audit-observability"
