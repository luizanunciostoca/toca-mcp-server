name: M-FOUND-08 Format Validate

on:
  push:
    branches:
      - feat/m-found-08-audit-observability

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact M-FOUND-08 fixes
        env:
          P0_AUDIT_TEST_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"PATCH_ANCHOR_COUNT_INVALID:{path}:{count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'src/persistence/postgres-audit-sink.ts',
              "function asRoles(value: unknown): AuditEvent['authorizationRoles'] {",
              "function asRoles(value: unknown): NonNullable<AuditEvent['authorizationRoles']> {",
          )
          replace_once(
              'test/audit-ledger.test.ts',
              "    expect(normalizeAuditEvidence({ ...base, evidence: undefined })).toEqual([\n      'audit:started:exec-1',\n    ]);",
              "    expect(\n      normalizeAuditEvidence({\n        executionId: base.executionId,\n        correlationId: base.correlationId,\n        toolName: base.toolName,\n        requester: base.requester,\n        status: base.status,\n        createdAt: base.createdAt,\n      }),\n    ).toEqual(['audit:started:exec-1']);",
          )

          file = Path('test/p0-production-readiness.test.ts')
          text = file.read_text()
          start = text.find(
              "  it('persists identity-aware execution audit using the registered risk class', async () => {"
          )
          end_marker = "\n  });\n});\n\ndescribe('RuntimeTelemetry'"
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('P0_AUDIT_TEST_BOUNDARY_INVALID')
          replacement = base64.b64decode(os.environ['P0_AUDIT_TEST_B64']).decode()
          file.write_text(text[:start] + replacement + text[end + len("\n  });"):])
          PY
      - name: Format M-FOUND-08 files
        run: |
          pnpm exec prettier --write \
            src/core/audit-ledger.ts \
            src/persistence/postgres-audit-sink.ts \
            src/persistence/postgres-operational-observability.ts \
            test/audit-ledger.test.ts \
            test/p0-production-readiness.test.ts
      - name: Validate complete repository
        run: pnpm quality
      - name: Commit validated result
        run: |
          rm .github/workflows/m-found-08-format-validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: validate M-FOUND-08 audit observability"
      - name: Push validated result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:feat/m-found-08-audit-observability"
