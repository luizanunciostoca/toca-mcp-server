name: GCP Read-Only Resource Discovery

on:
  pull_request:
    paths:
      - '.github/workflows/gcp-readonly-resource-discovery.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-readonly-resource-discovery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: 7db1a6e5caf01f98b200257c4aeecc2f1b29550a
  PROD_PROJECT_ID: toca-mcp-production
  PROD_PROJECT_NUMBER: '990081828836'
  PROD_REGION: southamerica-east1
  PROD_WIF: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  PROD_DEPLOY_SA: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  PROD_RUNTIME_SA: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  PROD_SQL: toca-mcp-db

jobs:
  discover:
    name: Discover GCP Resource Metadata Read-Only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout frozen candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Assert exact frozen candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Authenticate through already-validated production WIF for metadata READ only
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.PROD_WIF }}
          service_account: ${{ env.PROD_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Enumerate projects visible to deployer
        shell: bash
        run: |
          set -euo pipefail
          echo 'VISIBLE_PROJECTS_BEGIN'
          gcloud projects list --format='value(projectId,projectNumber)' || true
          echo 'VISIBLE_PROJECTS_END'
      - name: Read canonical production metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gcp-readonly
          gcloud projects describe "$PROD_PROJECT_ID" --format=json > /tmp/gcp-readonly/project.json
          test "$(jq -r '.projectNumber | tostring' /tmp/gcp-readonly/project.json)" = "$PROD_PROJECT_NUMBER"
          gcloud sql instances describe "$PROD_SQL" --project "$PROD_PROJECT_ID" --format=json > /tmp/gcp-readonly/sql.json
          gcloud run services list --project "$PROD_PROJECT_ID" --region "$PROD_REGION" --format=json > /tmp/gcp-readonly/run-services.json
          gcloud iam service-accounts list --project "$PROD_PROJECT_ID" --format=json > /tmp/gcp-readonly/service-accounts.json
          jq -e --arg sa "$PROD_RUNTIME_SA" 'map(.email) | index($sa) != null' /tmp/gcp-readonly/service-accounts.json >/dev/null

          echo "PRODUCTION_PROJECT=${PROD_PROJECT_ID}:${PROD_PROJECT_NUMBER}"
          echo "PRODUCTION_REGION=$PROD_REGION"
          echo "PRODUCTION_SQL=$(jq -r '.name' /tmp/gcp-readonly/sql.json)"
          echo 'PRODUCTION_CLOUD_RUN_SERVICES_BEGIN'
          jq -r '.[] | (.metadata.name // .name // "unknown") + "|runtime=" + (.spec.template.spec.serviceAccountName // "")' /tmp/gcp-readonly/run-services.json
          echo 'PRODUCTION_CLOUD_RUN_SERVICES_END'
          echo 'PRODUCTION_CLOUD_RUN_SECRET_BINDINGS_BEGIN'
          jq -r '[.. | objects | .secretKeyRef?.name? // empty] | unique[]' /tmp/gcp-readonly/run-services.json || true
          echo 'PRODUCTION_CLOUD_RUN_SECRET_BINDINGS_END'
          echo 'PRODUCTION_SERVICE_ACCOUNTS_BEGIN'
          jq -r '.[].email' /tmp/gcp-readonly/service-accounts.json
          echo 'PRODUCTION_SERVICE_ACCOUNTS_END'
          echo 'PRODUCTION_METADATA_READ=PASS'
      - name: Probe historically referenced staging project IDs without mutation
        shell: bash
        run: |
          set -euo pipefail
          for project in toca-mcp-staging toca-staging; do
            if gcloud projects describe "$project" --format=json > "/tmp/gcp-readonly/${project}.json" 2>"/tmp/gcp-readonly/${project}.err"; then
              number="$(jq -r '.projectNumber | tostring' "/tmp/gcp-readonly/${project}.json")"
              echo "STAGING_PROJECT_CANDIDATE_FOUND=${project}:${number}"
              echo "STAGING_${project}_SQL_BEGIN"
              gcloud sql instances list --project "$project" --format='value(name,region)' 2>/dev/null || echo 'UNREADABLE'
              echo "STAGING_${project}_SQL_END"
              echo "STAGING_${project}_RUN_BEGIN"
              gcloud run services list --project "$project" --region "$PROD_REGION" --format='value(metadata.name,spec.template.spec.serviceAccountName)' 2>/dev/null || echo 'UNREADABLE'
              echo "STAGING_${project}_RUN_END"
              echo "STAGING_${project}_SERVICE_ACCOUNTS_BEGIN"
              gcloud iam service-accounts list --project "$project" --format='value(email)' 2>/dev/null || echo 'UNREADABLE'
              echo "STAGING_${project}_SERVICE_ACCOUNTS_END"
              echo "STAGING_${project}_WIF_BEGIN"
              gcloud iam workload-identity-pools list --project "$project" --location=global --format='value(name)' 2>/dev/null || echo 'UNREADABLE'
              echo "STAGING_${project}_WIF_END"
            else
              echo "STAGING_PROJECT_CANDIDATE_UNRESOLVED=${project}"
              sed -n '1p' "/tmp/gcp-readonly/${project}.err" | sed 's/[[:space:]]\+/ /g' || true
            fi
          done
          echo 'DISCOVERY_READ_ONLY=true'
