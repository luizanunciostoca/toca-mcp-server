name: Local Photo Enhancer Smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      SOURCE_ASSET_ID: SUN-0087
      SOURCE_DRIVE_FILE_ID: 1j6cUBD82Hw8an3Bu9Cx19WesaUF4Gr7b
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm quality

      - name: Install local image runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick
          convert -version

      - name: Authenticate to Google Cloud and Drive
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly

      - name: Download exact source image from Drive
        shell: bash
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          mkdir -p .image-edit-smoke
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GOOGLE_ACCESS_TOKEN}" \
            "https://www.googleapis.com/drive/v3/files/${SOURCE_DRIVE_FILE_ID}?alt=media" \
            --output .image-edit-smoke/source.jpg
          test -s .image-edit-smoke/source.jpg
          test "$(file --brief --mime-type .image-edit-smoke/source.jpg)" = "image/jpeg"
          sha256sum .image-edit-smoke/source.jpg | tee .image-edit-smoke/source.sha256

      - name: Execute deterministic local enhancement
        shell: bash
        run: |
          set -euo pipefail
          pnpm dev:marketing-autopilot-image-edit \
            --source .image-edit-smoke/source.jpg \
            --output .image-edit-smoke/output.jpg \
            --source-asset-id "$SOURCE_ASSET_ID" \
            --source-drive-file-id "$SOURCE_DRIVE_FILE_ID" \
            --content-type image/jpeg \
            --provider local \
            | tee .image-edit-smoke/command.log
          tail -n 1 .image-edit-smoke/command.log > .image-edit-smoke/result.json
          jq -e . .image-edit-smoke/result.json >/dev/null

      - name: Validate binding evidence and output
        shell: bash
        run: |
          set -euo pipefail
          jq -e \
            --arg asset "$SOURCE_ASSET_ID" \
            --arg drive "$SOURCE_DRIVE_FILE_ID" \
            '.sourceAssetId == $asset and
             .sourceDriveFileId == $drive and
             .sourceImageBound == true and
             .editMode == "ENHANCE_EXISTING_IMAGE" and
             .editorProvider == "LOCAL_IMAGEMAGICK" and
             .pipelineVersion == "local-photo-enhancer-v1" and
             .requestedScale == "200%" and
             .requestedOutputFormat == "jpeg" and
             .outputContentType == "image/jpeg" and
             .outputSizeBytes > 0 and
             .sourceSha256 != .outputSha256' \
            .image-edit-smoke/result.json >/dev/null
          test -s .image-edit-smoke/output.jpg
          test "$(file --brief --mime-type .image-edit-smoke/output.jpg)" = "image/jpeg"
          sha256sum .image-edit-smoke/output.jpg | tee .image-edit-smoke/output.sha256

      - name: Validate dimensions
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(identify -format '%wx%h' .image-edit-smoke/source.jpg)"
          OUT="$(identify -format '%wx%h' .image-edit-smoke/output.jpg)"
          echo "source_dimensions=$SRC" | tee .image-edit-smoke/dimensions.txt
          echo "output_dimensions=$OUT" | tee -a .image-edit-smoke/dimensions.txt
          SRC_W="${SRC%x*}"
          SRC_H="${SRC#*x}"
          OUT_W="${OUT%x*}"
          OUT_H="${OUT#*x}"
          test "$OUT_W" -eq $((SRC_W * 2))
          test "$OUT_H" -eq $((SRC_H * 2))

      - name: Upload smoke evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: local-photo-enhancer-smoke-evidence
          path: |
            .image-edit-smoke/result.json
            .image-edit-smoke/source.sha256
            .image-edit-smoke/output.sha256
            .image-edit-smoke/dimensions.txt
            .image-edit-smoke/output.jpg
          retention-days: 7
