name: Meta Ads Morro Type Fix

on:
  push:
    branches:
      - fix/meta-ads-morro-custom-location

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/meta-ads-morro-custom-location
          fetch-depth: 0
      - name: Widen test override scalars without weakening production types
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/meta-ads-controlled-write.test.ts')
          s = p.read_text()
          old = "function withCustomLocation(overrides: Partial<typeof MORRO_LOCATION>): ControlledCreatePausedPlan {"
          new = "function withCustomLocation(overrides: { latitude?: number; longitude?: number; radius?: number; distance_unit?: 'kilometer' | 'mile' }): ControlledCreatePausedPlan {"
          if old not in s:
              raise SystemExit('expected typing target not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Format patched test
        run: npx prettier --write test/meta-ads-controlled-write.test.ts
      - name: Commit typing fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/meta-ads-controlled-write.test.ts
          git commit -m 'test(meta-ads): widen custom-location override test typing'
          git push origin HEAD:fix/meta-ads-morro-custom-location
