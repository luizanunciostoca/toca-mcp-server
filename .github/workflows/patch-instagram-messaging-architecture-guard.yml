name: Patch Instagram Messaging Architecture Guard

on:
  push:
    branches:
      - feat/instagram-messaging-readonly-20260828
    paths:
      - '.github/workflows/patch-instagram-messaging-architecture-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/instagram-messaging-readonly-20260828
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch architecture guard for governed read-only messaging
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('scripts/architecture-check.mjs')
          source = path.read_text()
          old_guard = """const registry = readFileSync('src/registry.ts', 'utf8');
          if (registry.includes('instagram.comments.reply') || registry.includes('instagram.messaging.')) {
            console.error('Unpromoted external write capabilities must not be advertised');
            process.exit(1);
          }
          """
          new_guard = """const registry = readFileSync('src/registry.ts', 'utf8');
          if (registry.includes('instagram.comments.reply')) {
            console.error('Unpromoted external write capabilities must not be advertised');
            process.exit(1);
          }
          const allowedInstagramMessagingReadNames = new Set([
            'instagram.messaging.conversations.read',
            'instagram.messaging.messages.read',
          ]);
          const advertisedInstagramMessagingNames = [
            ...registry.matchAll(/name: '(instagram\\.messaging\\.[^']+)'/g),
          ].map((match) => match[1]);
          for (const name of advertisedInstagramMessagingNames) {
            if (!allowedInstagramMessagingReadNames.has(name)) {
              console.error('Unpromoted Instagram messaging capability must not be advertised: ' + name);
              process.exit(1);
            }
            const marker = "name: '" + name + "'";
            const start = registry.indexOf(marker);
            const end = registry.indexOf('\n  },', start);
            const definition = registry.slice(start, end === -1 ? registry.length : end);
            if (
              !definition.includes("riskClass: 'READ'") ||
              !definition.includes("capabilityStatus: 'IMPLEMENTED'") ||
              !definition.includes('sideEffects: false') ||
              !definition.includes('idempotent: true') ||
              !definition.includes(
                "requiredScopes: ['instagram_basic', 'instagram_manage_messages', 'pages_manage_metadata']",
              )
            ) {
              console.error('Instagram messaging read capability violates the read-only boundary: ' + name);
              process.exit(1);
            }
          }
          """
          if old_guard not in source:
              raise SystemExit('ARCHITECTURE_INSTAGRAM_MESSAGING_GUARD_NOT_FOUND')
          source = source.replace(old_guard, new_guard)
          required_needle = "  'src/providers/instagram/instagram-engagement-provider.ts',\n"
          required_addition = required_needle + "  'src/providers/instagram/instagram-messaging-read-provider.ts',\n"
          if "'src/providers/instagram/instagram-messaging-read-provider.ts'" not in source:
              if required_needle not in source:
                  raise SystemExit('ARCHITECTURE_REQUIRED_LIST_ANCHOR_NOT_FOUND')
              source = source.replace(required_needle, required_addition, 1)
          path.write_text(source)
          PY
          pnpm exec prettier --write scripts/architecture-check.mjs
          git diff --check
      - name: Verify architecture gate locally
        run: pnpm architecture:check
      - name: Commit architecture contract update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TOCA OS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/architecture-check.mjs
          git commit -m 'fix(architecture): allow governed Instagram messaging reads'
          git push origin HEAD:feat/instagram-messaging-readonly-20260828
