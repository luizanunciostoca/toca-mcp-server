name: Foundation Daily Control Evidence

on:
  push:
    branches: [chore/foundation-daily-control-evidence]
    paths:
      - '.github/workflows/foundation-daily-control-evidence.yml'
      - 'src/foundation-daily-evidence.ts'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  RUNTIME_SA: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  DEPLOY_SA: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  WIF: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  DATABASE_SECRET_ID: toca-database-url
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db

jobs:
  evidence:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Build read-only evidence image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/toca-mcp/server:foundation-daily-evidence-${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "JOB_NAME=toca-foundation-daily-evidence-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - name: Query durable production signal
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { gcloud run jobs delete "$JOB_NAME" --project "$PROJECT_ID" --region "$REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          gcloud run jobs deploy "$JOB_NAME" \
            --image "$IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --command node \
            --args dist/src/foundation-daily-evidence.js \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --tasks 1 --max-retries 0 --task-timeout 120s --quiet
          gcloud run jobs execute "$JOB_NAME" --project "$PROJECT_ID" --region "$REGION" --wait --quiet
          LINE="$(gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME} AND textPayload:\"FOUNDATION_DAILY_CONTROL_DB_RESULT=\"" \
            --project "$PROJECT_ID" --freshness=20m --limit=20 --order=desc --format='value(textPayload)' \
            | grep 'FOUNDATION_DAILY_CONTROL_DB_RESULT=' | head -n1)"
          test -n "$LINE"
          JSON="${LINE#FOUNDATION_DAILY_CONTROL_DB_RESULT=}"
          printf '%s' "$JSON" | jq -e '.name == "foundation.daily_control.completed" and .attributes.dayKey == "2026-08-15" and (.value == 0 or .value == 1)' >/dev/null
          printf '%s\n' "$JSON" | jq . > foundation-daily-control-evidence.json
          echo 'FOUNDATION_DAILY_CONTROL_2026_08_15=VERIFIED'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-daily-control-evidence-${{ github.sha }}
          path: foundation-daily-control-evidence.json
          if-no-files-found: error
          retention-days: 90
