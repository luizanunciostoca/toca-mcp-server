name: Foundation Daily Control Evidence

on:
  push:
    branches: [chore/foundation-daily-control-evidence]
    paths: ['.github/workflows/foundation-daily-control-evidence.yml']

permissions:
  contents: read
  id-token: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Verify dated production daily-control completion
        shell: bash
        run: |
          set -euo pipefail
          FILTER_BASE='resource.type="cloud_run_revision" AND resource.labels.service_name="toca-managed-instagram-daemon"'
          RESULT="$(gcloud logging read "${FILTER_BASE} AND jsonPayload.event=\"foundation.daily_control.completed\"" \
            --project toca-mcp-production --freshness=12h --limit=50 --order=desc --format=json)"
          if [ "$(printf '%s' "$RESULT" | jq 'length')" -eq 0 ]; then
            RESULT="$(gcloud logging read "${FILTER_BASE} AND textPayload:\"foundation.daily_control.completed\"" \
              --project toca-mcp-production --freshness=12h --limit=50 --order=desc --format=json)"
          fi
          test "$(printf '%s' "$RESULT" | jq 'length')" -gt 0
          printf '%s' "$RESULT" | jq -e '
            any(.[];
              ((.jsonPayload.dayKey // "") == "2026-08-15") or
              ((.textPayload // "") | contains("2026-08-15"))
            )
          ' >/dev/null
          printf '%s' "$RESULT" | jq '[.[] | {timestamp, severity, jsonPayload, textPayload}]' > foundation-daily-control-evidence.json
          echo 'FOUNDATION_DAILY_CONTROL_2026_08_15=VERIFIED'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-daily-control-evidence-${{ github.sha }}
          path: foundation-daily-control-evidence.json
          if-no-files-found: error
          retention-days: 90
