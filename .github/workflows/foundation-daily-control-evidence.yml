name: Foundation Daily Control Evidence

on:
  push:
    branches: [chore/foundation-daily-control-evidence]
    paths: ['.github/workflows/foundation-daily-control-evidence.yml']

permissions:
  contents: read
  id-token: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Inspect production daemon logs and verify daily-control completion
        shell: bash
        run: |
          set -euo pipefail
          FILTER_BASE='resource.type="cloud_run_revision" AND resource.labels.service_name="toca-managed-instagram-daemon"'
          gcloud logging read "$FILTER_BASE" \
            --project toca-mcp-production \
            --freshness=12h \
            --limit=1000 \
            --order=desc \
            --format=json > /tmp/daemon-logs.json

          jq '[.[] | select(
            ((.jsonPayload.event // "") | tostring | contains("foundation.daily_control")) or
            ((.textPayload // "") | tostring | contains("foundation.daily_control")) or
            ((.jsonPayload.event // "") | tostring | contains("toca.managed.instagram.daemon.tick")) or
            ((.textPayload // "") | tostring | contains("toca.managed.instagram.daemon.tick"))
          ) | {timestamp, severity, jsonPayload, textPayload}]' \
            /tmp/daemon-logs.json > foundation-daily-control-diagnostic.json

          echo "FOUNDATION_DAEMON_RELEVANT_LOG_COUNT=$(jq 'length' foundation-daily-control-diagnostic.json)"
          jq -c '.[]' foundation-daily-control-diagnostic.json | head -n 20 || true

          jq -e 'any(.[];
            ((.jsonPayload.event // "") == "foundation.daily_control.completed" and (.jsonPayload.dayKey // "") == "2026-08-15") or
            (((.textPayload // "") | tostring | contains("foundation.daily_control.completed")) and
             ((.textPayload // "") | tostring | contains("2026-08-15")))
          )' foundation-daily-control-diagnostic.json >/dev/null

          cp foundation-daily-control-diagnostic.json foundation-daily-control-evidence.json
          echo 'FOUNDATION_DAILY_CONTROL_2026_08_15=VERIFIED'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: foundation-daily-control-evidence-${{ github.sha }}
          path: |
            foundation-daily-control-evidence.json
            foundation-daily-control-diagnostic.json
          if-no-files-found: warn
          retention-days: 90
