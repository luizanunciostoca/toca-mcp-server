name: Next Coordinator Format TEMP

on:
  push:
    branches:
      - coord/next-version-control-plane-20260820
    paths:
      - 'control/next-version-feature-registry.v1.json'
      - 'docs/operations/next-version-*.md'
      - '.github/workflows/next-coordinator-format-temp.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: coord/next-version-control-plane-20260820
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format coordinator artifacts
        run: pnpm exec prettier --write control/next-version-feature-registry.v1.json docs/operations/next-version-baseline-2026-08-20.md docs/operations/next-version-roadmap.md docs/operations/next-version-master-tracker.md docs/operations/next-version-evidence-index.md
      - name: Commit formatting when required
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/next-version-feature-registry.v1.json docs/operations/next-version-baseline-2026-08-20.md docs/operations/next-version-roadmap.md docs/operations/next-version-master-tracker.md docs/operations/next-version-evidence-index.md
          git commit -m 'style(next): format coordinator artifacts'
          git push origin HEAD:coord/next-version-control-plane-20260820
