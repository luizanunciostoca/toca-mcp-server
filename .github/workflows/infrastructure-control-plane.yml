name: Infrastructure Control Plane

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Approved infrastructure operation
        required: true
        type: choice
        options:
          - reconcile-publication-assets-bucket
          - optimize-cloud-sql-cost
      expected_policy_sha256:
        description: SHA-256 of infra/control-plane/policy.json
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_INFRA_ADMIN_SERVICE_ACCOUNT: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  PUBLICATION_ASSET_BUCKET: toca-mcp-publication-assets
  CLOUD_SQL_INSTANCE: toca-mcp-db

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify policy boundary
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          EXPECTED_POLICY_SHA256: ${{ inputs.expected_policy_sha256 }}
        run: |
          set -euo pipefail
          ACTUAL_POLICY_SHA256="$(sha256sum infra/control-plane/policy.json | awk '{print $1}')"
          test "$ACTUAL_POLICY_SHA256" = "$EXPECTED_POLICY_SHA256"
          jq -e '.projectId == "toca-mcp-production"' infra/control-plane/policy.json >/dev/null
          jq -e '.adminServiceAccount == "toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com"' infra/control-plane/policy.json >/dev/null
          jq -e '.forbidden.projectOwner == true and .forbidden.projectEditor == true and .forbidden.serviceAccountKeys == true and .forbidden.bucketDelete == true and .forbidden.arbitraryGcloud == true and .forbidden.runtimePrivilegeEscalation == true and .forbidden.publicBucketIam == true and .forbidden.perContentSchedulerJobs == true and .forbidden.legacyHeartbeatRecreation == true and .forbidden.deployAsSchedulingTransport == true' infra/control-plane/policy.json >/dev/null

          case "$OPERATION" in
            reconcile-publication-assets-bucket)
              jq -e '.allowedOperations["reconcile-publication-assets-bucket"].resourceName == "toca-mcp-publication-assets"' infra/control-plane/policy.json >/dev/null
              jq -e '.allowedOperations["reconcile-publication-assets-bucket"].publicRead == false' infra/control-plane/policy.json >/dev/null
              jq -e '.allowedOperations["reconcile-publication-assets-bucket"].deliveryMode == "signed-url"' infra/control-plane/policy.json >/dev/null
              jq -e '.allowedOperations["reconcile-publication-assets-bucket"].runtimeRoles == ["roles/storage.objectCreator", "roles/storage.objectViewer"]' infra/control-plane/policy.json >/dev/null
              ;;
            optimize-cloud-sql-cost)
              jq -e '
                .allowedOperations["optimize-cloud-sql-cost"] as $op |
                $op.resourceType == "cloud-sql-instance" and
                $op.resourceName == "toca-mcp-db" and
                $op.databaseVersion == "POSTGRES_18" and
                $op.requireRecentSuccessfulBackupHours == 36 and
                $op.source.edition == "ENTERPRISE_PLUS" and
                $op.source.availabilityType == "REGIONAL" and
                $op.source.tier == "db-perf-optimized-N-8" and
                $op.source.dataDiskType == "PD_SSD" and
                $op.source.dataDiskSizeGb == 250 and
                $op.storageShrink.enabled == true and
                $op.storageShrink.sourceSizeGb == 250 and
                $op.storageShrink.minimumStorageGb == 10 and
                $op.storageShrink.reserveBufferGb == 100 and
                $op.storageShrink.strategy == "minimal-target-plus-buffer" and
                $op.storageShrink.autoResizeHeadroomGb == 50 and
                $op.storageShrink.maximumAutoResizeLimitGb == 250 and
                $op.storageShrink.mustRunBeforeSharedCore == true and
                $op.target.edition == "ENTERPRISE" and
                $op.target.availabilityType == "ZONAL" and
                $op.target.tier == "db-g1-small" and
                $op.target.retainedBackups == 7 and
                $op.target.transactionLogRetentionDays == 7 and
                $op.preserve.databaseVersion == true and
                $op.preserve.dataDiskType == true and
                $op.preserve.deletionProtection == true and
                $op.preserve.automatedBackups == true and
                $op.preserve.pointInTimeRecovery == true and
                $op.preserve.storageAutoResize == true and
                $op.forbid.instanceDelete == true and
                $op.forbid.databaseDelete == true and
                $op.forbid.backupDelete == true and
                $op.forbid.userMutation == true and
                $op.forbid.sslMutation == true and
                $op.forbid.iamMutation == true and
                $op.forbid.billingMutation == true and
                $op.forbid.unguardedDiskShrink == true
              ' infra/control-plane/policy.json >/dev/null
              ;;
            *)
              echo 'INFRA_OPERATION_NOT_ALLOWLISTED' >&2
              exit 1
              ;;
          esac
          echo "INFRA_POLICY_BOUNDARY_OK=1"

      - name: Authenticate as infrastructure administrator
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_INFRA_ADMIN_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 563.0.0'

      - name: Reconcile publication asset bucket
        if: inputs.operation == 'reconcile-publication-assets-bucket'
        shell: bash
        run: |
          set -euo pipefail
          BUCKET_URI="gs://${PUBLICATION_ASSET_BUCKET}"

          if ! gcloud storage buckets describe "$BUCKET_URI" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud storage buckets create "$BUCKET_URI" \
              --project "$GCP_PROJECT_ID" \
              --location "$GCP_REGION" \
              --uniform-bucket-level-access
          fi

          cat > /tmp/lifecycle.json <<'JSON'
          {"rule":[{"action":{"type":"Delete"},"condition":{"age":7}}]}
          JSON

          gcloud storage buckets update "$BUCKET_URI" \
            --project "$GCP_PROJECT_ID" \
            --uniform-bucket-level-access \
            --lifecycle-file=/tmp/lifecycle.json

          gcloud storage buckets add-iam-policy-binding "$BUCKET_URI" \
            --project "$GCP_PROJECT_ID" \
            --member="serviceAccount:${GCP_RUNTIME_SERVICE_ACCOUNT}" \
            --role="roles/storage.objectCreator"

          gcloud storage buckets add-iam-policy-binding "$BUCKET_URI" \
            --project "$GCP_PROJECT_ID" \
            --member="serviceAccount:${GCP_RUNTIME_SERVICE_ACCOUNT}" \
            --role="roles/storage.objectViewer"

      - name: Verify publication asset bucket state
        if: inputs.operation == 'reconcile-publication-assets-bucket'
        shell: bash
        run: |
          set -euo pipefail
          BUCKET_URI="gs://${PUBLICATION_ASSET_BUCKET}"
          POLICY="$(gcloud storage buckets get-iam-policy "$BUCKET_URI" --project "$GCP_PROJECT_ID" --format=json)"
          CONFIG="$(gcloud storage buckets describe "$BUCKET_URI" --project "$GCP_PROJECT_ID" --raw --format=json)"
          jq -e --arg sa "serviceAccount:${GCP_RUNTIME_SERVICE_ACCOUNT}" 'any(.bindings[]?; .role == "roles/storage.objectCreator" and any(.members[]?; . == $sa))' <<<"$POLICY" >/dev/null
          jq -e --arg sa "serviceAccount:${GCP_RUNTIME_SERVICE_ACCOUNT}" 'any(.bindings[]?; .role == "roles/storage.objectViewer" and any(.members[]?; . == $sa))' <<<"$POLICY" >/dev/null
          jq -e 'all(.bindings[]?; all(.members[]?; . != "allUsers" and . != "allAuthenticatedUsers"))' <<<"$POLICY" >/dev/null
          jq -e 'any(.lifecycle.rule[]?; .action.type == "Delete" and .condition.age == 7)' <<<"$CONFIG" >/dev/null
          echo 'INFRA_CONTROL_PLANE_RECONCILED=1'

      - name: Preflight Cloud SQL cost optimization
        if: inputs.operation == 'optimize-cloud-sql-cost'
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_JSON="$(gcloud sql instances describe "$CLOUD_SQL_INSTANCE" --project "$GCP_PROJECT_ID" --format=json)"
          printf '%s' "$INSTANCE_JSON" | jq -e '
            .state == "RUNNABLE" and
            .databaseVersion == "POSTGRES_18" and
            .settings.edition == "ENTERPRISE_PLUS" and
            .settings.availabilityType == "REGIONAL" and
            .settings.tier == "db-perf-optimized-N-8" and
            .settings.dataDiskType == "PD_SSD" and
            (.settings.dataDiskSizeGb | tonumber) == 250 and
            .settings.storageAutoResize == true and
            .settings.deletionProtectionEnabled == true and
            .settings.backupConfiguration.enabled == true and
            .settings.backupConfiguration.pointInTimeRecoveryEnabled == true and
            ((.replicaNames // []) | length) == 0 and
            (.onPremisesConfiguration == null) and
            all(.settings.databaseFlags[]?; .name != "max_wal_size")
          ' >/dev/null

          BACKUPS_JSON="$(gcloud sql backups list --instance "$CLOUD_SQL_INSTANCE" --project "$GCP_PROJECT_ID" --limit=20 --format=json)"
          LATEST_END="$(jq -r '[.[] | select(.status == "SUCCESSFUL" and .endTime != null)] | sort_by(.endTime) | last | .endTime // empty' <<<"$BACKUPS_JSON")"
          test -n "$LATEST_END"
          NOW_EPOCH="$(date -u +%s)"
          BACKUP_EPOCH="$(date -u -d "$LATEST_END" +%s)"
          AGE_SECONDS=$((NOW_EPOCH - BACKUP_EPOCH))
          test "$AGE_SECONDS" -ge 0
          test "$AGE_SECONDS" -le 129600
          echo "CLOUD_SQL_COST_PREFLIGHT=PASS backup_age_seconds=$AGE_SECONDS"

      - name: Shrink oversized Cloud SQL storage safely
        if: inputs.operation == 'optimize-cloud-sql-cost'
        shell: bash
        run: |
          set -euo pipefail
          SHRINK_JSON="$(gcloud sql instances get-storage-shrink-config "$CLOUD_SQL_INSTANCE" --project "$GCP_PROJECT_ID" --format=json)"
          MIN_TARGET="$(jq -r '.minimalTargetSizeGb // .minTargetSizeGb // .min_target_size_gb // empty' <<<"$SHRINK_JSON")"
          printf '%s' "$MIN_TARGET" | grep -Eq '^[0-9]+$'

          TARGET_STORAGE_GB=$((MIN_TARGET + 100))
          if [ "$TARGET_STORAGE_GB" -lt 10 ]; then TARGET_STORAGE_GB=10; fi
          if [ "$TARGET_STORAGE_GB" -gt 250 ]; then TARGET_STORAGE_GB=250; fi

          STORAGE_AUTO_RESIZE_LIMIT_GB=$((TARGET_STORAGE_GB + 50))
          if [ "$STORAGE_AUTO_RESIZE_LIMIT_GB" -gt 250 ]; then STORAGE_AUTO_RESIZE_LIMIT_GB=250; fi

          echo "MINIMAL_TARGET_STORAGE_GB=$MIN_TARGET" >> "$GITHUB_ENV"
          echo "TARGET_STORAGE_GB=$TARGET_STORAGE_GB" >> "$GITHUB_ENV"
          echo "STORAGE_AUTO_RESIZE_LIMIT_GB=$STORAGE_AUTO_RESIZE_LIMIT_GB" >> "$GITHUB_ENV"
          printf '%s\n' "$SHRINK_JSON" > cloudsql-storage-shrink-config.json

          if [ "$TARGET_STORAGE_GB" -lt 250 ]; then
            gcloud sql instances perform-storage-shrink "$CLOUD_SQL_INSTANCE" \
              --project "$GCP_PROJECT_ID" \
              --storage-size="${TARGET_STORAGE_GB}GB" \
              --no-async \
              --quiet
          else
            echo 'CLOUD_SQL_STORAGE_SHRINK=SKIPPED_NO_SAFE_REDUCTION'
          fi

          gcloud sql instances patch "$CLOUD_SQL_INSTANCE" \
            --project "$GCP_PROJECT_ID" \
            --storage-auto-increase-limit="$STORAGE_AUTO_RESIZE_LIMIT_GB" \
            --quiet

          INSTANCE_JSON="$(gcloud sql instances describe "$CLOUD_SQL_INSTANCE" --project "$GCP_PROJECT_ID" --format=json)"
          printf '%s' "$INSTANCE_JSON" | jq -e \
            --argjson target "$TARGET_STORAGE_GB" \
            --argjson limit "$STORAGE_AUTO_RESIZE_LIMIT_GB" '
              .state == "RUNNABLE" and
              (.settings.dataDiskSizeGb | tonumber) == $target and
              .settings.dataDiskType == "PD_SSD" and
              .settings.storageAutoResize == true and
              (.settings.storageAutoResizeLimit | tonumber) == $limit
            ' >/dev/null
          echo "CLOUD_SQL_STORAGE=VERIFIED target_gb=$TARGET_STORAGE_GB auto_resize_limit_gb=$STORAGE_AUTO_RESIZE_LIMIT_GB"

      - name: Disable Cloud SQL regional HA
        if: inputs.operation == 'optimize-cloud-sql-cost'
        shell: bash
        run: |
          set -euo pipefail
          gcloud sql instances patch "$CLOUD_SQL_INSTANCE" \
            --project "$GCP_PROJECT_ID" \
            --availability-type=zonal \
            --quiet
          INSTANCE_JSON="$(gcloud sql instances describe "$CLOUD_SQL_INSTANCE" --project "$GCP_PROJECT_ID" --format=json)"
          printf '%s' "$INSTANCE_JSON" | jq -e '
            .state == "RUNNABLE" and
            .settings.availabilityType == "ZONAL" and
            .settings.edition == "ENTERPRISE_PLUS" and
            .settings.tier == "db-perf-optimized-N-8"
          ' >/dev/null
          echo 'CLOUD_SQL_HA_DISABLED=VERIFIED'

      - name: Downgrade Cloud SQL edition and tier
        if: inputs.operation == 'optimize-cloud-sql-cost'
        shell: bash
        run: |
          set -euo pipefail
          gcloud sql instances patch "$CLOUD_SQL_INSTANCE" \
            --project "$GCP_PROJECT_ID" \
            --edition=enterprise \
            --tier=db-g1-small \
            --quiet
          INSTANCE_JSON="$(gcloud sql instances describe "$CLOUD_SQL_INSTANCE" --project "$GCP_PROJECT_ID" --format=json)"
          printf '%s' "$INSTANCE_JSON" | jq -e '
            .state == "RUNNABLE" and
            .settings.edition == "ENTERPRISE" and
            .settings.availabilityType == "ZONAL" and
            .settings.tier == "db-g1-small"
          ' >/dev/null
          echo 'CLOUD_SQL_EDITION_TIER=VERIFIED'

      - name: Reduce Cloud SQL backup retention
        if: inputs.operation == 'optimize-cloud-sql-cost'
        shell: bash
        run: |
          set -euo pipefail
          gcloud sql instances patch "$CLOUD_SQL_INSTANCE" \
            --project "$GCP_PROJECT_ID" \
            --retained-backups-count=7 \
            --retained-transaction-log-days=7 \
            --quiet

      - name: Verify optimized Cloud SQL state
        if: inputs.operation == 'optimize-cloud-sql-cost'
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_JSON="$(gcloud sql instances describe "$CLOUD_SQL_INSTANCE" --project "$GCP_PROJECT_ID" --format=json)"
          printf '%s' "$INSTANCE_JSON" | jq -e \
            --argjson target "$TARGET_STORAGE_GB" \
            --argjson limit "$STORAGE_AUTO_RESIZE_LIMIT_GB" '
              .state == "RUNNABLE" and
              .databaseVersion == "POSTGRES_18" and
              .settings.edition == "ENTERPRISE" and
              .settings.availabilityType == "ZONAL" and
              .settings.tier == "db-g1-small" and
              .settings.dataDiskType == "PD_SSD" and
              (.settings.dataDiskSizeGb | tonumber) == $target and
              .settings.storageAutoResize == true and
              (.settings.storageAutoResizeLimit | tonumber) == $limit and
              .settings.deletionProtectionEnabled == true and
              .settings.backupConfiguration.enabled == true and
              .settings.backupConfiguration.pointInTimeRecoveryEnabled == true and
              .settings.backupConfiguration.backupRetentionSettings.retainedBackups == 7 and
              .settings.backupConfiguration.transactionLogRetentionDays == 7
            ' >/dev/null
          jq -n \
            --arg instance "$CLOUD_SQL_INSTANCE" \
            --argjson minimalTargetStorageGb "$MINIMAL_TARGET_STORAGE_GB" \
            --argjson diskSizeGb "$TARGET_STORAGE_GB" \
            --argjson storageAutoResizeLimitGb "$STORAGE_AUTO_RESIZE_LIMIT_GB" \
            --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{operation:"optimize-cloud-sql-cost",instance:$instance,state:"VERIFIED",edition:"ENTERPRISE",availabilityType:"ZONAL",tier:"db-g1-small",diskType:"PD_SSD",minimalTargetStorageGb:$minimalTargetStorageGb,diskSizeGb:$diskSizeGb,storageAutoResizeLimitGb:$storageAutoResizeLimitGb,retainedBackups:7,transactionLogRetentionDays:7,verifiedAt:$verifiedAt}' \
            > cloudsql-cost-optimization-evidence.json
          echo 'CLOUD_SQL_COST_OPTIMIZATION=VERIFIED'

      - name: Upload Cloud SQL optimization evidence
        if: inputs.operation == 'optimize-cloud-sql-cost'
        uses: actions/upload-artifact@v4
        with:
          name: cloudsql-cost-optimization-${{ github.run_id }}
          path: |
            cloudsql-cost-optimization-evidence.json
            cloudsql-storage-shrink-config.json
          if-no-files-found: error
          retention-days: 30
