name: Infrastructure Control Plane

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Approved infrastructure operation
        required: true
        type: choice
        options:
          - reconcile-publication-assets-bucket
          - optimize-cloud-sql-cost
          - grant-staging-verification-readers
      expected_policy_sha256:
        description: SHA-256 of infra/control-plane/policy.json
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: infrastructure-control-plane
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_INFRA_ADMIN_SERVICE_ACCOUNT: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  PUBLICATION_ASSET_BUCKET: toca-mcp-publication-assets
  CLOUD_SQL_INSTANCE: toca-mcp-db
  STAGING_GCP_PROJECT_ID: toca-mcp-next-staging
  STAGING_GCP_PROJECT_NUMBER: '729069789107'
  STAGING_DEPLOYER_SERVICE_ACCOUNT: toca-next-stg-deployer@toca-mcp-next-staging.iam.gserviceaccount.com
  STAGING_CLOUD_SQL_INSTANCE: toca-mcp-next-staging-db

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify policy boundary
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          EXPECTED_POLICY_SHA256: ${{ inputs.expected_policy_sha256 }}
        run: |
          set -euo pipefail
          ACTUAL_POLICY_SHA256="$(sha256sum infra/control-plane/policy.json | awk '{print $1}')"
          test "$ACTUAL_POLICY_SHA256" = "$EXPECTED_POLICY_SHA256"
          jq -e '.version == 10' infra/control-plane/policy.json >/dev/null
          jq -e '.projectId == "toca-mcp-production"' infra/control-plane/policy.json >/dev/null
          jq -e '.adminServiceAccount == "toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com"' infra/control-plane/policy.json >/dev/null
          jq -e '.forbidden.projectOwner == true and .forbidden.projectEditor == true and .forbidden.serviceAccountKeys == true and .forbidden.bucketDelete == true and .forbidden.arbitraryGcloud == true and .forbidden.runtimePrivilegeEscalation == true and .forbidden.publicBucketIam == true and .forbidden.perContentSchedulerJobs == true and .forbidden.legacyHeartbeatRecreation == true and .forbidden.alwaysOnSchedulerPolling == true and .forbidden.unboundedCloudRunScaling == true and .forbidden.deployAsSchedulingTransport == true' infra/control-plane/policy.json >/dev/null

          case "$OPERATION" in
            reconcile-publication-assets-bucket)
              jq -e '.allowedOperations["reconcile-publication-assets-bucket"].resourceName == "toca-mcp-publication-assets"' infra/control-plane/policy.json >/dev/null
              jq -e '.allowedOperations["reconcile-publication-assets-bucket"].publicRead == false' infra/control-plane/policy.json >/dev/null
              jq -e '.allowedOperations["reconcile-publication-assets-bucket"].deliveryMode == "signed-url"' infra/control-plane/policy.json >/dev/null
              jq -e '.allowedOperations["reconcile-publication-assets-bucket"].runtimeRoles == ["roles/storage.objectCreator", "roles/storage.objectViewer"]' infra/control-plane/policy.json >/dev/null
              ;;
            grant-staging-verification-readers)
              jq -e '
                .allowedOperations["grant-staging-verification-readers"] as $op |
                $op.resourceType == "gcp-project-iam" and
                $op.projectId == "toca-mcp-next-staging" and
                $op.projectNumber == "729069789107" and
                $op.principal == "serviceAccount:toca-next-stg-deployer@toca-mcp-next-staging.iam.gserviceaccount.com" and
                $op.allowedRoles == ["roles/cloudsql.viewer", "roles/monitoring.viewer"] and
                $op.verification.cloudSqlBackupRead == true and
                $op.verification.monitoringConfigurationRead == true and
                $op.forbid.productionMutation == true and
                $op.forbid.providerMutation == true and
                $op.forbid.destructiveOperations == true and
                $op.forbid.projectOwner == true and
                $op.forbid.projectEditor == true and
                $op.forbid.serviceAccountKeys == true
              ' infra/control-plane/policy.json >/dev/null
              ;;
            optimize-cloud-sql-cost)
              jq -e '
                .allowedOperations["optimize-cloud-sql-cost"] as $op |
                $op.resourceType == "cloud-sql-instance" and
                $op.resourceName == "toca-mcp-db" and
                $op.databaseVersion == "POSTGRES_18" and
                $op.requireRecentSuccessfulBackupHours == 36 and
                $op.originalSource.edition == "ENTERPRISE_PLUS" and
                $op.originalSource.availabilityType == "REGIONAL" and
                $op.originalSource.tier == "db-perf-optimized-N-8" and
                $op.originalSource.dataDiskType == "PD_SSD" and
                $op.originalSource.dataDiskSizeGb == 250 and
                $op.storageShrink.enabled == true and
                $op.storageShrink.completed == true and
                $op.storageShrink.sourceSizeGb == 250 and
                $op.storageShrink.providerMinimalTargetSizeGb == 56 and
                $op.storageShrink.reserveBufferGb == 100 and
                $op.storageShrink.targetSizeGb == 156 and
                $op.storageShrink.autoIncreaseHeadroomGb == 50 and
                $op.storageShrink.autoIncreaseLimitGb == 206 and
                $op.storageShrink.completedProviderRunId == 31844320778 and
                $op.storageShrink.mustRunBeforeSharedCore == true and
                ($op.allowedResumeStates | length) == 3 and
                $op.allowedResumeStates[0].name == "STORAGE_SHRUNK" and
                $op.allowedResumeStates[0].edition == "ENTERPRISE_PLUS" and
                $op.allowedResumeStates[0].availabilityType == "REGIONAL" and
                $op.allowedResumeStates[0].tier == "db-perf-optimized-N-8" and
                $op.allowedResumeStates[0].dataDiskSizeGb == 156 and
                $op.allowedResumeStates[1].name == "HA_DISABLED" and
                $op.allowedResumeStates[1].edition == "ENTERPRISE_PLUS" and
                $op.allowedResumeStates[1].availabilityType == "ZONAL" and
                $op.allowedResumeStates[1].tier == "db-perf-optimized-N-8" and
                $op.allowedResumeStates[1].dataDiskSizeGb == 156 and
                $op.allowedResumeStates[2].name == "EDITION_TIER_DOWNGRADED" and
                $op.allowedResumeStates[2].edition == "ENTERPRISE" and
                $op.allowedResumeStates[2].availabilityType == "ZONAL" and
                $op.allowedResumeStates[2].tier == "db-g1-small" and
                $op.allowedResumeStates[2].dataDiskSizeGb == 156 and
                $op.target.edition == "ENTERPRISE" and
                $op.target.availabilityType == "ZONAL" and
                $op.target.tier == "db-g1-small" and
                $op.target.dataDiskType == "PD_SSD" and
                $op.target.dataDiskSizeGb == 156 and
                $op.target.storageAutoIncreaseLimitGb == 206 and
                $op.target.retainedBackups == 7 and
                $op.target.transactionLogRetentionDays == 7 and
                $op.preserve.databaseVersion == true and
                $op.preserve.dataDiskType == true and
                $op.preserve.deletionProtection == true and
                $op.preserve.automatedBackups == true and
                $op.preserve.pointInTimeRecovery == true and
                $op.preserve.storageAutoResize == true and
                $op.forbid.instanceDelete == true and
                $op.forbid.databaseDelete == true and
                $op.forbid.backupDelete == true and
                $op.forbid.userMutation == true and
                $op.forbid.sslMutation == true and
                $op.forbid.iamMutation == true and
                $op.forbid.billingMutation == true and
                $op.forbid.secondStorageShrink == true and
                $op.forbid.unguardedDiskShrink == true
              ' infra/control-plane/policy.json >/dev/null
              ;;
            *)
              echo 'INFRA_OPERATION_NOT_ALLOWLISTED' >&2
              exit 1
              ;;
          esac
          echo "INFRA_POLICY_BOUNDARY_OK=1"

      - name: Authenticate as infrastructure administrator
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_INFRA_ADMIN_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Grant staging verification read-only roles
        if: inputs.operation == 'grant-staging-verification-readers'
        shell: bash
        run: |
          set -euo pipefail
          test "$STAGING_GCP_PROJECT_ID" != "$GCP_PROJECT_ID"
          test "$STAGING_GCP_PROJECT_NUMBER" != '990081828836'
          ACTUAL_NUMBER="$(gcloud projects describe "$STAGING_GCP_PROJECT_ID" --format='value(projectNumber)')"
          test "$ACTUAL_NUMBER" = "$STAGING_GCP_PROJECT_NUMBER"
          MEMBER="serviceAccount:${STAGING_DEPLOYER_SERVICE_ACCOUNT}"
          for role in roles/cloudsql.viewer roles/monitoring.viewer; do
            gcloud projects add-iam-policy-binding "$STAGING_GCP_PROJECT_ID" \
              --member="$MEMBER" \
              --role="$role" \
              --condition=None \
              --quiet
          done
          echo 'STAGING_VERIFICATION_READERS_RECONCILED=1'

      - name: Verify staging verification read-only roles
        if: inputs.operation == 'grant-staging-verification-readers'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging-verification-reader-evidence
          MEMBER="serviceAccount:${STAGING_DEPLOYER_SERVICE_ACCOUNT}"
          gcloud projects get-iam-policy "$STAGING_GCP_PROJECT_ID" --format=json \
            > staging-verification-reader-evidence/staging-iam.json
          for role in roles/cloudsql.viewer roles/monitoring.viewer; do
            jq -e --arg role "$role" --arg member "$MEMBER" \
              'any(.bindings[]?; .role == $role and any(.members[]?; . == $member))' \
              staging-verification-reader-evidence/staging-iam.json >/dev/null
          done

          gcloud sql backups list \
            --instance "$STAGING_CLOUD_SQL_INSTANCE" \
            --project "$STAGING_GCP_PROJECT_ID" \
            --limit 20 \
            --format=json \
            > staging-verification-reader-evidence/cloudsql-backups.json
          jq -e '[.[] | select(.status == "SUCCESSFUL")] | length > 0' \
            staging-verification-reader-evidence/cloudsql-backups.json >/dev/null

          TOKEN="$(gcloud auth print-access-token)"
          POLICIES_HTTP="$(curl --silent --show-error \
            --output staging-verification-reader-evidence/monitoring-alert-policies.json \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://monitoring.googleapis.com/v3/projects/${STAGING_GCP_PROJECT_ID}/alertPolicies?pageSize=100")"
          CHANNELS_HTTP="$(curl --silent --show-error \
            --output staging-verification-reader-evidence/monitoring-notification-channels.json \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://monitoring.googleapis.com/v3/projects/${STAGING_GCP_PROJECT_ID}/notificationChannels?pageSize=100")"
          unset TOKEN
          test "$POLICIES_HTTP" = 200
          test "$CHANNELS_HTTP" = 200

          jq -n \
            --arg operation 'grant-staging-verification-readers' \
            --arg targetProject "$STAGING_GCP_PROJECT_ID" \
            --arg targetProjectNumber "$STAGING_GCP_PROJECT_NUMBER" \
            --arg principal "$MEMBER" \
            --argjson successfulBackups "$(jq '[.[] | select(.status == "SUCCESSFUL")] | length' staging-verification-reader-evidence/cloudsql-backups.json)" \
            --argjson policyCount "$(jq '(.alertPolicies // []) | length' staging-verification-reader-evidence/monitoring-alert-policies.json)" \
            --argjson channelCount "$(jq '(.notificationChannels // []) | length' staging-verification-reader-evidence/monitoring-notification-channels.json)" \
            '{
              schemaVersion:"toca.staging.verification-readers.v1",
              operation:$operation,
              targetProject:$targetProject,
              targetProjectNumber:$targetProjectNumber,
              principal:$principal,
              roles:["roles/cloudsql.viewer","roles/monitoring.viewer"],
              successfulBackupCount:$successfulBackups,
              alertPolicyCount:$policyCount,
              notificationChannelCount:$channelCount,
              productionMutation:false,
              providerMutation:false,
              destructiveOperation:false,
              result:"PASS"
            }' > staging-verification-reader-evidence/manifest.json
          echo 'STAGING_VERIFICATION_READERS=VERIFIED'

      - name: Upload staging verification reader evidence
        if: inputs.operation == 'grant-staging-verification-readers'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-verification-readers-${{ github.run_id }}
          path: staging-verification-reader-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Install gcloud beta component
        if: inputs.operation == 'optimize-cloud-sql-cost'
        shell: bash
        run: |
          set -euo pipefail
          gcloud components install beta --quiet
          gcloud beta sql instances patch --help >/dev/null

      - name: Reconcile publication asset bucket
        if: inputs.operation == 'reconcile-publication-assets-bucket'
        shell: bash
        run: |
          set -euo pipefail
          BUCKET_URI="gs://${PUBLICATION_ASSET_BUCKET}"

          if ! gcloud storage buckets describe "$BUCKET_URI" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud storage buckets create "$BUCKET_URI" \
              --project "$GCP_PROJECT_ID" \
              --location "$GCP_REGION" \
              --uniform-bucket-level-access
          fi

          cat > /tmp/lifecycle.json <<'JSON'
          {"rule":[{"action":{"type":"Delete"},"condition":{"age":7}}]}
          JSON

          gcloud storage buckets update "$BUCKET_URI" \
            --project "$GCP_PROJECT_ID" \
            --uniform-bucket-level-access \
            --lifecycle-file=/tmp/lifecycle.json

          gcloud storage buckets add-iam-policy-binding "$BUCKET_URI" \
            --project "$GCP_PROJECT_ID" \
            --member="serviceAccount:${GCP_RUNTIME_SERVICE_ACCOUNT}" \
            --role="roles/storage.objectCreator"

          gcloud storage buckets add-iam-policy-binding "$BUCKET_URI" \
            --project "$GCP_PROJECT_ID" \
            --member="serviceAccount:${GCP_RUNTIME_SERVICE_ACCOUNT}" \
            --role="roles/storage.objectViewer"

      - name: Verify publication asset bucket state
        if: inputs.operation == 'reconcile-publication-assets-bucket'
        shell: bash
        run: |
          set -euo pipefail
          BUCKET_URI="gs://${PUBLICATION_ASSET_BUCKET}"
          POLICY="$(gcloud storage buckets get-iam-policy "$BUCKET_URI" --project "$GCP_PROJECT_ID" --format=json)"
          CONFIG="$(gcloud storage buckets describe "$BUCKET_URI" --project "$GCP_PROJECT_ID" --raw --format=json)"
          jq -e --arg sa "serviceAccount:${GCP_RUNTIME_SERVICE_ACCOUNT}" 'any(.bindings[]?; .role == "roles/storage.objectCreator" and any(.members[]?; . == $sa))' <<<"$POLICY" >/dev/null
          jq -e --arg sa "serviceAccount:${GCP_RUNTIME_SERVICE_ACCOUNT}" 'any(.bindings[]?; .role == "roles/storage.objectViewer" and any(.members[]?; . == $sa))' <<<"$POLICY" >/dev/null
          jq -e 'all(.bindings[]?; all(.members[]?; . != "allUsers" and . != "allAuthenticatedUsers"))' <<<"$POLICY" >/dev/null
          jq -e 'any(.lifecycle.rule[]?; .action.type == "Delete" and .condition.age == 7)' <<<"$CONFIG" >/dev/null
          echo 'INFRA_CONTROL_PLANE_RECONCILED=1'

      - name: Preflight Cloud SQL cost optimization
        if: inputs.operation == 'optimize-cloud-sql-cost'
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_JSON="$(gcloud sql instances describe "$CLOUD_SQL_INSTANCE" --project "$GCP_PROJECT_ID" --format=json)"
          printf '%s' "$INSTANCE_JSON" | jq -e '
            .state == "RUNNABLE" and
            .databaseVersion == "POSTGRES_18" and
            .settings.dataDiskType == "PD_SSD" and
            (.settings.dataDiskSizeGb | tonumber) == 156 and
            .settings.storageAutoResize == true and
            .settings.deletionProtectionEnabled == true and
            .settings.backupConfiguration.enabled == true and
            .settings.backupConfiguration.pointInTimeRecoveryEnabled == true and
            ((.replicaNames // []) | length) == 0 and
            (.onPremisesConfiguration == null) and
            all(.settings.databaseFlags[]?; .name != "max_wal_size") and
            (
              (.settings.edition == "ENTERPRISE_PLUS" and .settings.availabilityType == "REGIONAL" and .settings.tier == "db-perf-optimized-N-8") or
              (.settings.edition == "ENTERPRISE_PLUS" and .settings.availabilityType == "ZONAL" and .settings.tier == "db-perf-optimized-N-8") or
              (.settings.edition == "ENTERPRISE" and .settings.availabilityType == "ZONAL" and .settings.tier == "db-g1-small")
            )
          ' >/dev/null

          BACKUPS_JSON="$(gcloud sql backups list --instance "$CLOUD_SQL_INSTANCE" --project "$GCP_PROJECT_ID" --limit=20 --format=json)"
          LATEST_END="$(jq -r '[.[] | select(.status == "SUCCESSFUL" and .endTime != null)] | sort_by(.endTime) | last | .endTime // empty' <<<"$BACKUPS_JSON")"
          test -n "$LATEST_END"
          NOW_EPOCH="$(date -u +%s)"
          BACKUP_EPOCH="$(date -u -d "$LATEST_END" +%s)"
          AGE_SECONDS=$((NOW_EPOCH - BACKUP_EPOCH))
          test "$AGE_SECONDS" -ge 0
          test "$AGE_SECONDS" -le 129600
          echo "CLOUD_SQL_COST_PREFLIGHT=PASS backup_age_seconds=$AGE_SECONDS"

      - name: Verify completed shrink and cap automatic growth
        if: inputs.operation == 'optimize-cloud-sql-cost'
        shell: bash
        run: |
          set -euo pipefail
          TARGET_STORAGE_GB=156
          STORAGE_AUTO_INCREASE_LIMIT_GB=206
          MINIMAL_TARGET_STORAGE_GB=56
          echo "TARGET_STORAGE_GB=$TARGET_STORAGE_GB" >> "$GITHUB_ENV"
          echo "STORAGE_AUTO_INCREASE_LIMIT_GB=$STORAGE_AUTO_INCREASE_LIMIT_GB" >> "$GITHUB_ENV"
          echo "MINIMAL_TARGET_STORAGE_GB=$MINIMAL_TARGET_STORAGE_GB" >> "$GITHUB_ENV"

          BEFORE_JSON="$(gcloud sql instances describe "$CLOUD_SQL_INSTANCE" --project "$GCP_PROJECT_ID" --format=json)"
          printf '%s' "$BEFORE_JSON" | jq -e '
            .state == "RUNNABLE" and
            (.settings.dataDiskSizeGb | tonumber) == 156 and
            .settings.dataDiskType == "PD_SSD" and
            .settings.storageAutoResize == true
          ' >/dev/null

          jq -n \
            --arg instance "$CLOUD_SQL_INSTANCE" \
            --argjson priorRunId 31844320778 \
            --argjson sourceSizeGb 250 \
            --argjson providerMinimalTargetSizeGb 56 \
            --argjson targetSizeGb 156 \
            --arg completedAt "2026-08-14T22:01:48Z" \
            '{instance:$instance,priorRunId:$priorRunId,sourceSizeGb:$sourceSizeGb,providerMinimalTargetSizeGb:$providerMinimalTargetSizeGb,targetSizeGb:$targetSizeGb,completedAt:$completedAt,state:"STORAGE_SHRINK_PROVIDER_VERIFIED"}' \
            > cloudsql-storage-resume-evidence.json

          gcloud beta sql instances patch "$CLOUD_SQL_INSTANCE" \
            --project "$GCP_PROJECT_ID" \
            --storage-auto-increase \
            --storage-auto-increase-limit=206 \
            --quiet

          AFTER_JSON="$(gcloud sql instances describe "$CLOUD_SQL_INSTANCE" --project "$GCP_PROJECT_ID" --format=json)"
          printf '%s' "$AFTER_JSON" | jq -e '
            .state == "RUNNABLE" and
            (.settings.dataDiskSizeGb | tonumber) == 156 and
            .settings.dataDiskType == "PD_SSD" and
            .settings.storageAutoResize == true and
            (.settings.storageAutoResizeLimit | tonumber) == 206
          ' >/dev/null
          echo 'CLOUD_SQL_RESUME_STATE=VERIFIED'

      - name: Disable Cloud SQL regional HA
        if: inputs.operation == 'optimize-cloud-sql-cost'
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_JSON="$(gcloud sql instances describe "$CLOUD_SQL_INSTANCE" --project "$GCP_PROJECT_ID" --format=json)"
          AVAILABILITY="$(jq -r '.settings.availabilityType' <<<"$INSTANCE_JSON")"
          EDITION="$(jq -r '.settings.edition' <<<"$INSTANCE_JSON")"
          TIER="$(jq -r '.settings.tier' <<<"$INSTANCE_JSON")"

          if [ "$AVAILABILITY" = "REGIONAL" ]; then
            test "$EDITION" = "ENTERPRISE_PLUS"
            test "$TIER" = "db-perf-optimized-N-8"
            gcloud sql instances patch "$CLOUD_SQL_INSTANCE" \
              --project "$GCP_PROJECT_ID" \
              --availability-type=zonal \
              --quiet
          elif [ "$AVAILABILITY" != "ZONAL" ]; then
            echo 'CLOUD_SQL_AVAILABILITY_OUTSIDE_RESUME_ENVELOPE' >&2
            exit 1
          fi

          INSTANCE_JSON="$(gcloud sql instances describe "$CLOUD_SQL_INSTANCE" --project "$GCP_PROJECT_ID" --format=json)"
          printf '%s' "$INSTANCE_JSON" | jq -e '
            .state == "RUNNABLE" and
            .settings.availabilityType == "ZONAL" and
            (.settings.dataDiskSizeGb | tonumber) == 156 and
            (
              (.settings.edition == "ENTERPRISE_PLUS" and .settings.tier == "db-perf-optimized-N-8") or
              (.settings.edition == "ENTERPRISE" and .settings.tier == "db-g1-small")
            )
          ' >/dev/null
          echo 'CLOUD_SQL_HA_DISABLED=VERIFIED'

      - name: Downgrade Cloud SQL edition and tier
        if: inputs.operation == 'optimize-cloud-sql-cost'
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_JSON="$(gcloud sql instances describe "$CLOUD_SQL_INSTANCE" --project "$GCP_PROJECT_ID" --format=json)"
          EDITION="$(jq -r '.settings.edition' <<<"$INSTANCE_JSON")"
          TIER="$(jq -r '.settings.tier' <<<"$INSTANCE_JSON")"
          test "$(jq -r '.settings.availabilityType' <<<"$INSTANCE_JSON")" = "ZONAL"

          if [ "$EDITION" = "ENTERPRISE_PLUS" ]; then
            test "$TIER" = "db-perf-optimized-N-8"
            gcloud sql instances patch "$CLOUD_SQL_INSTANCE" \
              --project "$GCP_PROJECT_ID" \
              --edition=enterprise \
              --tier=db-g1-small \
              --quiet
          else
            test "$EDITION" = "ENTERPRISE"
            test "$TIER" = "db-g1-small"
          fi

          INSTANCE_JSON="$(gcloud sql instances describe "$CLOUD_SQL_INSTANCE" --project "$GCP_PROJECT_ID" --format=json)"
          printf '%s' "$INSTANCE_JSON" | jq -e '
            .state == "RUNNABLE" and
            .settings.edition == "ENTERPRISE" and
            .settings.availabilityType == "ZONAL" and
            .settings.tier == "db-g1-small" and
            (.settings.dataDiskSizeGb | tonumber) == 156
          ' >/dev/null
          echo 'CLOUD_SQL_EDITION_TIER=VERIFIED'

      - name: Reduce Cloud SQL backup retention
        if: inputs.operation == 'optimize-cloud-sql-cost'
        shell: bash
        run: |
          set -euo pipefail
          gcloud sql instances patch "$CLOUD_SQL_INSTANCE" \
            --project "$GCP_PROJECT_ID" \
            --retained-backups-count=7 \
            --retained-transaction-log-days=7 \
            --quiet

      - name: Verify optimized Cloud SQL state
        if: inputs.operation == 'optimize-cloud-sql-cost'
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_JSON="$(gcloud sql instances describe "$CLOUD_SQL_INSTANCE" --project "$GCP_PROJECT_ID" --format=json)"
          printf '%s' "$INSTANCE_JSON" | jq -e '
            .state == "RUNNABLE" and
            .databaseVersion == "POSTGRES_18" and
            .settings.edition == "ENTERPRISE" and
            .settings.availabilityType == "ZONAL" and
            .settings.tier == "db-g1-small" and
            .settings.dataDiskType == "PD_SSD" and
            (.settings.dataDiskSizeGb | tonumber) == 156 and
            .settings.storageAutoResize == true and
            (.settings.storageAutoResizeLimit | tonumber) == 206 and
            .settings.deletionProtectionEnabled == true and
            .settings.backupConfiguration.enabled == true and
            .settings.backupConfiguration.pointInTimeRecoveryEnabled == true and
            .settings.backupConfiguration.backupRetentionSettings.retainedBackups == 7 and
            .settings.backupConfiguration.transactionLogRetentionDays == 7
          ' >/dev/null
          jq -n \
            --arg instance "$CLOUD_SQL_INSTANCE" \
            --argjson minimalTargetStorageGb 56 \
            --argjson diskSizeGb 156 \
            --argjson storageAutoIncreaseLimitGb 206 \
            --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{operation:"optimize-cloud-sql-cost",instance:$instance,state:"VERIFIED",edition:"ENTERPRISE",availabilityType:"ZONAL",tier:"db-g1-small",diskType:"PD_SSD",minimalTargetStorageGb:$minimalTargetStorageGb,diskSizeGb:$diskSizeGb,storageAutoIncreaseLimitGb:$storageAutoIncreaseLimitGb,retainedBackups:7,transactionLogRetentionDays:7,verifiedAt:$verifiedAt}' \
            > cloudsql-cost-optimization-evidence.json
          echo 'CLOUD_SQL_COST_OPTIMIZATION=VERIFIED'

      - name: Upload Cloud SQL optimization evidence
        if: inputs.operation == 'optimize-cloud-sql-cost'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudsql-cost-optimization-${{ github.run_id }}
          path: |
            cloudsql-cost-optimization-evidence.json
            cloudsql-storage-resume-evidence.json
          if-no-files-found: error
          retention-days: 30
