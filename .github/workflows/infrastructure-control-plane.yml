name: Infrastructure Control Plane

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Approved infrastructure operation
        required: true
        type: choice
        options:
          - reconcile-publication-assets-bucket
          - reconcile-toca-managed-instagram-heartbeat
      expected_policy_sha256:
        description: SHA-256 of infra/control-plane/policy.json
        required: true
        type: string
      worker_image:
        description: Immutable Artifact Registry image by digest for heartbeat reconciliation
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_ARTIFACT_REPOSITORY: toca-mcp
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_INFRA_ADMIN_SERVICE_ACCOUNT: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  PUBLICATION_ASSET_BUCKET: toca-mcp-publication-assets
  TOCA_MANAGED_JOB_NAME: toca-managed-instagram-publication-worker
  TOCA_MANAGED_SCHEDULER_NAME: toca-managed-instagram-publication-heartbeat
  TOCA_MANAGED_SCHEDULE: '*/5 * * * *'
  TOCA_MANAGED_TIME_ZONE: America/Bahia

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify policy boundary
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          EXPECTED_POLICY_SHA256: ${{ inputs.expected_policy_sha256 }}
          WORKER_IMAGE: ${{ inputs.worker_image }}
        run: |
          set -euo pipefail
          ACTUAL_POLICY_SHA256="$(sha256sum infra/control-plane/policy.json | awk '{print $1}')"
          test "$ACTUAL_POLICY_SHA256" = "$EXPECTED_POLICY_SHA256"
          jq -e '.projectId == "toca-mcp-production"' infra/control-plane/policy.json >/dev/null
          jq -e '.adminServiceAccount == "toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com"' infra/control-plane/policy.json >/dev/null
          jq -e '.forbidden.projectOwner == true and .forbidden.projectEditor == true and .forbidden.serviceAccountKeys == true and .forbidden.bucketDelete == true and .forbidden.arbitraryGcloud == true and .forbidden.runtimePrivilegeEscalation == true and .forbidden.publicBucketIam == true and .forbidden.perContentSchedulerJobs == true' infra/control-plane/policy.json >/dev/null

          case "$OPERATION" in
            reconcile-publication-assets-bucket)
              jq -e '.allowedOperations["reconcile-publication-assets-bucket"].resourceName == "toca-mcp-publication-assets"' infra/control-plane/policy.json >/dev/null
              jq -e '.allowedOperations["reconcile-publication-assets-bucket"].publicRead == false' infra/control-plane/policy.json >/dev/null
              jq -e '.allowedOperations["reconcile-publication-assets-bucket"].deliveryMode == "signed-url"' infra/control-plane/policy.json >/dev/null
              jq -e '.allowedOperations["reconcile-publication-assets-bucket"].runtimeRoles == ["roles/storage.objectCreator", "roles/storage.objectViewer"]' infra/control-plane/policy.json >/dev/null
              ;;
            reconcile-toca-managed-instagram-heartbeat)
              jq -e '.allowedOperations["reconcile-toca-managed-instagram-heartbeat"].cloudRunJobName == "toca-managed-instagram-publication-worker"' infra/control-plane/policy.json >/dev/null
              jq -e '.allowedOperations["reconcile-toca-managed-instagram-heartbeat"].schedulerJobName == "toca-managed-instagram-publication-heartbeat"' infra/control-plane/policy.json >/dev/null
              jq -e '.allowedOperations["reconcile-toca-managed-instagram-heartbeat"].schedule == "*/5 * * * *"' infra/control-plane/policy.json >/dev/null
              jq -e '.allowedOperations["reconcile-toca-managed-instagram-heartbeat"].timeZone == "America/Bahia"' infra/control-plane/policy.json >/dev/null
              jq -e '.allowedOperations["reconcile-toca-managed-instagram-heartbeat"].executorEnabledByDefault == false' infra/control-plane/policy.json >/dev/null
              jq -e '.allowedOperations["reconcile-toca-managed-instagram-heartbeat"].schedulerPausedByDefault == true' infra/control-plane/policy.json >/dev/null
              jq -e '.allowedOperations["reconcile-toca-managed-instagram-heartbeat"].contentPayloadAllowed == false' infra/control-plane/policy.json >/dev/null
              test -n "$WORKER_IMAGE"
              IMAGE_PREFIX="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/server@sha256:"
              case "$WORKER_IMAGE" in
                "$IMAGE_PREFIX"*) ;;
                *) echo 'WORKER_IMAGE_OUTSIDE_APPROVED_REGISTRY' >&2; exit 1 ;;
              esac
              DIGEST="${WORKER_IMAGE#${IMAGE_PREFIX}}"
              printf '%s' "$DIGEST" | grep -Eq '^[a-f0-9]{64}$'
              ;;
            *)
              echo 'INFRA_OPERATION_NOT_ALLOWLISTED' >&2
              exit 1
              ;;
          esac
          echo "INFRA_POLICY_BOUNDARY_OK=1"

      - name: Authenticate as infrastructure administrator
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_INFRA_ADMIN_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Reconcile publication asset bucket
        if: ${{ inputs.operation == 'reconcile-publication-assets-bucket' }}
        shell: bash
        run: |
          set -euo pipefail
          BUCKET_URI="gs://${PUBLICATION_ASSET_BUCKET}"

          if ! gcloud storage buckets describe "$BUCKET_URI" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud storage buckets create "$BUCKET_URI" \
              --project "$GCP_PROJECT_ID" \
              --location "$GCP_REGION" \
              --uniform-bucket-level-access
          fi

          cat > /tmp/lifecycle.json <<'JSON'
          {"rule":[{"action":{"type":"Delete"},"condition":{"age":7}}]}
          JSON

          gcloud storage buckets update "$BUCKET_URI" \
            --project "$GCP_PROJECT_ID" \
            --uniform-bucket-level-access \
            --lifecycle-file=/tmp/lifecycle.json

          gcloud storage buckets add-iam-policy-binding "$BUCKET_URI" \
            --project "$GCP_PROJECT_ID" \
            --member="serviceAccount:${GCP_RUNTIME_SERVICE_ACCOUNT}" \
            --role="roles/storage.objectCreator"

          gcloud storage buckets add-iam-policy-binding "$BUCKET_URI" \
            --project "$GCP_PROJECT_ID" \
            --member="serviceAccount:${GCP_RUNTIME_SERVICE_ACCOUNT}" \
            --role="roles/storage.objectViewer"

      - name: Reconcile TOCA-managed Instagram heartbeat in disabled state
        if: ${{ inputs.operation == 'reconcile-toca-managed-instagram-heartbeat' }}
        shell: bash
        env:
          WORKER_IMAGE: ${{ inputs.worker_image }}
        run: |
          set -euo pipefail

          gcloud run jobs deploy "$TOCA_MANAGED_JOB_NAME" \
            --image "$WORKER_IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --command node \
            --args dist/src/instagram-publication-worker.js \
            --set-env-vars NODE_ENV=production,TOCA_MANAGED_INSTAGRAM_SCHEDULER_ENABLED=false,TOCA_MANAGED_INSTAGRAM_EXECUTOR_ENABLED=false,INSTAGRAM_PUBLICATION_WRITES_ENABLED=false,META_ENABLED=false \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 60s \
            --quiet

          gcloud run jobs add-iam-policy-binding "$TOCA_MANAGED_JOB_NAME" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --member="serviceAccount:${GCP_RUNTIME_SERVICE_ACCOUNT}" \
            --role="roles/run.invoker" \
            --quiet

          TARGET_URI="https://${GCP_REGION}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${GCP_PROJECT_ID}/jobs/${TOCA_MANAGED_JOB_NAME}:run"

          if gcloud scheduler jobs describe "$TOCA_MANAGED_SCHEDULER_NAME" \
            --project "$GCP_PROJECT_ID" \
            --location "$GCP_REGION" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "$TOCA_MANAGED_SCHEDULER_NAME" \
              --project "$GCP_PROJECT_ID" \
              --location "$GCP_REGION" \
              --schedule "$TOCA_MANAGED_SCHEDULE" \
              --time-zone "$TOCA_MANAGED_TIME_ZONE" \
              --uri "$TARGET_URI" \
              --http-method POST \
              --message-body='{}' \
              --headers='Content-Type=application/json' \
              --oauth-service-account-email "$GCP_RUNTIME_SERVICE_ACCOUNT" \
              --oauth-token-scope='https://www.googleapis.com/auth/cloud-platform' \
              --quiet
          else
            gcloud scheduler jobs create http "$TOCA_MANAGED_SCHEDULER_NAME" \
              --project "$GCP_PROJECT_ID" \
              --location "$GCP_REGION" \
              --schedule "$TOCA_MANAGED_SCHEDULE" \
              --time-zone "$TOCA_MANAGED_TIME_ZONE" \
              --uri "$TARGET_URI" \
              --http-method POST \
              --message-body='{}' \
              --headers='Content-Type=application/json' \
              --oauth-service-account-email "$GCP_RUNTIME_SERVICE_ACCOUNT" \
              --oauth-token-scope='https://www.googleapis.com/auth/cloud-platform' \
              --quiet
          fi

          gcloud scheduler jobs pause "$TOCA_MANAGED_SCHEDULER_NAME" \
            --project "$GCP_PROJECT_ID" \
            --location "$GCP_REGION" \
            --quiet

      - name: Verify publication asset bucket state
        if: ${{ inputs.operation == 'reconcile-publication-assets-bucket' }}
        shell: bash
        run: |
          set -euo pipefail
          BUCKET_URI="gs://${PUBLICATION_ASSET_BUCKET}"
          POLICY="$(gcloud storage buckets get-iam-policy "$BUCKET_URI" --project "$GCP_PROJECT_ID" --format=json)"
          CONFIG="$(gcloud storage buckets describe "$BUCKET_URI" --project "$GCP_PROJECT_ID" --raw --format=json)"
          jq -e --arg sa "serviceAccount:${GCP_RUNTIME_SERVICE_ACCOUNT}" 'any(.bindings[]?; .role == "roles/storage.objectCreator" and any(.members[]?; . == $sa))' <<<"$POLICY" >/dev/null
          jq -e --arg sa "serviceAccount:${GCP_RUNTIME_SERVICE_ACCOUNT}" 'any(.bindings[]?; .role == "roles/storage.objectViewer" and any(.members[]?; . == $sa))' <<<"$POLICY" >/dev/null
          jq -e 'all(.bindings[]?; all(.members[]?; . != "allUsers" and . != "allAuthenticatedUsers"))' <<<"$POLICY" >/dev/null
          jq -e 'any(.lifecycle.rule[]?; .action.type == "Delete" and .condition.age == 7)' <<<"$CONFIG" >/dev/null
          echo 'INFRA_CONTROL_PLANE_RECONCILED=1'

      - name: Verify TOCA-managed Instagram heartbeat remains fail-closed
        if: ${{ inputs.operation == 'reconcile-toca-managed-instagram-heartbeat' }}
        shell: bash
        run: |
          set -euo pipefail
          JOB_JSON="$(gcloud run jobs describe "$TOCA_MANAGED_JOB_NAME" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=json)"
          SCHEDULER_JSON="$(gcloud scheduler jobs describe "$TOCA_MANAGED_SCHEDULER_NAME" \
            --project "$GCP_PROJECT_ID" \
            --location "$GCP_REGION" \
            --format=json)"

          printf '%s' "$JOB_JSON" | jq -e '
            .spec.template.spec.template.spec.containers[0] as $container |
            ($container.command == ["node"]) and
            ($container.args == ["dist/src/instagram-publication-worker.js"]) and
            ([$container.env[] | select(.name == "TOCA_MANAGED_INSTAGRAM_SCHEDULER_ENABLED") | .value] == ["false"]) and
            ([$container.env[] | select(.name == "TOCA_MANAGED_INSTAGRAM_EXECUTOR_ENABLED") | .value] == ["false"]) and
            ([$container.env[] | select(.name == "INSTAGRAM_PUBLICATION_WRITES_ENABLED") | .value] == ["false"]) and
            ([$container.env[] | select(.name == "META_ENABLED") | .value] == ["false"])
          ' >/dev/null

          printf '%s' "$SCHEDULER_JSON" | jq -e --arg schedule "$TOCA_MANAGED_SCHEDULE" --arg timezone "$TOCA_MANAGED_TIME_ZONE" --arg sa "$GCP_RUNTIME_SERVICE_ACCOUNT" '
            (.state == "PAUSED") and
            (.schedule == $schedule) and
            (.timeZone == $timezone) and
            (.httpTarget.httpMethod == "POST") and
            (.httpTarget.oauthToken.serviceAccountEmail == $sa)
          ' >/dev/null

          echo 'TOCA_MANAGED_HEARTBEAT_PROVISIONED_PAUSED=1'
