name: TEMP Finalize Staging Deploy Contract 2026-08-23

on:
  push:
    branches: [fix/staging-runtime-digest-rollback-20260823]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/staging-runtime-digest-rollback-20260823
          persist-credentials: true
          fetch-depth: 0

      - name: Apply permanent staging contract remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          deploy_path = Path('.github/workflows/deploy-gcp-staging-canonical.yml')
          runtime_path = Path('.github/workflows/staging-runtime-observability.yml')
          test_path = Path('test/gcp-staging-canonical-workflow.test.ts')
          deploy = deploy_path.read_text()
          runtime = runtime_path.read_text()
          test = test_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, got {count}')
              return text.replace(old, new)

          old = '''          REMOTE_DIGEST="$(gcloud artifacts docker images describe "$IMAGE_TAG" --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          test "$REMOTE_DIGEST" = "$IMAGE_DIGEST"
          echo "IMAGE=${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"
'''
          new = '''          REMOTE_DIGEST="$(gcloud artifacts docker images describe "$IMAGE_TAG" --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          test "$REMOTE_DIGEST" = "$IMAGE_DIGEST"
          OCI_MANIFEST_JSON="$(docker buildx imagetools inspect "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" --format '{{json .Manifest}}')"
          RESOLVED_IMAGE_DIGEST="$(jq -r '.digest // empty' <<<"$OCI_MANIFEST_JSON")"
          MEDIA_TYPE="$(jq -r '.mediaType // empty' <<<"$OCI_MANIFEST_JSON")"
          test "$RESOLVED_IMAGE_DIGEST" = "$IMAGE_DIGEST"
          case "$MEDIA_TYPE" in
            application/vnd.oci.image.index.v1+json|application/vnd.docker.distribution.manifest.list.v2+json)
              PLATFORM_MATCH_COUNT="$(jq '[.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length' <<<"$OCI_MANIFEST_JSON")"
              test "$PLATFORM_MATCH_COUNT" = 1
              RUNTIME_IMAGE_DIGEST="$(jq -r 'first(.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest) // empty' <<<"$OCI_MANIFEST_JSON")"
              ;;
            application/vnd.oci.image.manifest.v1+json|application/vnd.docker.distribution.manifest.v2+json)
              OCI_IMAGE_JSON="$(docker buildx imagetools inspect "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" --format '{{json .Image}}')"
              test "$(jq -r '.os // empty' <<<"$OCI_IMAGE_JSON")" = linux
              test "$(jq -r '.architecture // empty' <<<"$OCI_IMAGE_JSON")" = amd64
              RUNTIME_IMAGE_DIGEST="$IMAGE_DIGEST"
              ;;
            *)
              echo "Unsupported or unknown OCI media type: $MEDIA_TYPE" >&2
              exit 1
              ;;
          esac
          [[ "$RUNTIME_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IMAGE=${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"
          echo "RUNTIME_IMAGE_DIGEST=$RUNTIME_IMAGE_DIGEST" >> "$GITHUB_ENV"
'''
          deploy = replace_once(deploy, old, new, 'OCI resolver')

          old = '''          current_revision() {
            gcloud run services describe "$1" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.traffic[percent=100].revisionName)' 2>/dev/null || true
          }
          echo "PREVIOUS_MCP_REVISION=$(current_revision "$GCP_CLOUD_RUN_MCP_SERVICE")" >> "$GITHUB_ENV"
          echo "PREVIOUS_WEBHOOK_REVISION=$(current_revision "$GCP_CLOUD_RUN_WEBHOOK_SERVICE")" >> "$GITHUB_ENV"
'''
          new = '''          current_revision() {
            local service="$1" payload count traffic_sum revision
            payload="$(gcloud run services describe "$service" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
            count="$(jq '[.status.traffic[]? | select((.percent // 0) == 100 and (.revisionName // "") != "")] | length' <<<"$payload")"
            traffic_sum="$(jq '[.status.traffic[]?.percent // 0] | add // 0' <<<"$payload")"
            revision="$(jq -r 'first(.status.traffic[]? | select((.percent // 0) == 100 and (.revisionName // "") != "") | .revisionName) // empty' <<<"$payload")"
            test "$count" = 1
            test "$traffic_sum" = 100
            test -n "$revision"
            printf '%s\\n' "$revision"
          }
          PREVIOUS_MCP_REVISION="$(current_revision "$GCP_CLOUD_RUN_MCP_SERVICE")"
          PREVIOUS_WEBHOOK_REVISION="$(current_revision "$GCP_CLOUD_RUN_WEBHOOK_SERVICE")"
          test -n "$PREVIOUS_MCP_REVISION"
          test -n "$PREVIOUS_WEBHOOK_REVISION"
          echo "PREVIOUS_MCP_REVISION=$PREVIOUS_MCP_REVISION" >> "$GITHUB_ENV"
          echo "PREVIOUS_WEBHOOK_REVISION=$PREVIOUS_WEBHOOK_REVISION" >> "$GITHUB_ENV"
'''
          deploy = replace_once(deploy, old, new, 'rollback target capture')

          deploy = replace_once(
              deploy,
              '            --min-instances 0 --max-instances 1 --cpu-throttling --memory 512Mi --cpu 1 --no-allow-unauthenticated',
              '            --min-instances 0 --max-instances 1 --cpu-throttling --memory 512Mi --cpu 1 \\\n            --ingress all --default-url --invoker-iam-check --no-allow-unauthenticated',
              'private MCP routing',
          )
          deploy = replace_once(
              deploy,
              '            --min-instances 0 --max-instances 2 --cpu-throttling --memory 512Mi --cpu 1 --allow-unauthenticated',
              '            --min-instances 0 --max-instances 2 --cpu-throttling --memory 512Mi --cpu 1 \\\n            --ingress all --default-url --no-invoker-iam-check',
              'public webhook routing',
          )

          old = '''          gcloud run services update-traffic "$GCP_CLOUD_RUN_MCP_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions "${MCP_REVISION}=100"
          gcloud run services update-traffic "$GCP_CLOUD_RUN_WEBHOOK_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions "${WEBHOOK_REVISION}=100"
          echo 'TRAFFIC_PROMOTED=true' >> "$GITHUB_ENV"
'''
          new = '''          echo 'TRAFFIC_PROMOTION_STARTED=true' >> "$GITHUB_ENV"
          gcloud run services update-traffic "$GCP_CLOUD_RUN_MCP_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions "${MCP_REVISION}=100"
          gcloud run services update-traffic "$GCP_CLOUD_RUN_WEBHOOK_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions "${WEBHOOK_REVISION}=100"
          echo 'TRAFFIC_PROMOTED=true' >> "$GITHUB_ENV"
'''
          deploy = replace_once(deploy, old, new, 'promotion start marker')

          old = '''          verify_service() {
            local service="$1" revision="$2" expected_sa="$3" evidence="$4"
            gcloud run services describe "$service" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "/tmp/${service}-final.json"
            test "$(jq --arg revision "$revision" '[.status.traffic[]? | select((.percent // 0) == 100 and .revisionName == $revision)] | length' "/tmp/${service}-final.json")" = 1
            test "$(jq '[.status.traffic[]?.percent // 0] | add // 0' "/tmp/${service}-final.json")" = 100
            gcloud run revisions describe "$revision" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "/tmp/${revision}.json"
            release_sha="$(jq -r 'first(.spec.containers[0].env[]? | select(.name == "TOCA_RELEASE_SHA") | .value) // empty' "/tmp/${revision}.json")"
            runtime_sa="$(jq -r '.spec.serviceAccountName // empty' "/tmp/${revision}.json")"
            image="$(jq -r '.spec.containers[0].image // empty' "/tmp/${revision}.json")"
            test "$release_sha" = "$CANDIDATE_SHA"
            test "$runtime_sa" = "$expected_sa"
            test "${image##*@}" = "$IMAGE_DIGEST"
            jq -n --arg service "$service" --arg revision "$revision" --arg releaseSha "$release_sha" --arg runtimeIdentity "$runtime_sa" --arg imageDigest "$IMAGE_DIGEST" '{service:$service,revision:$revision,trafficPercent:100,releaseSha:$releaseSha,runtimeIdentity:$runtimeIdentity,imageDigest:$imageDigest}' > "staging-deploy-evidence/${evidence}"
          }
'''
          new = '''          verify_service() {
            local service="$1" revision="$2" expected_sa="$3" evidence="$4"
            local traffic_ready=false traffic_count traffic_sum release_sha runtime_sa image runtime_digest
            for attempt in $(seq 1 24); do
              gcloud run services describe "$service" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "/tmp/${service}-final.json"
              traffic_count="$(jq --arg revision "$revision" '[.status.traffic[]? | select((.percent // 0) == 100 and .revisionName == $revision)] | length' "/tmp/${service}-final.json")"
              traffic_sum="$(jq '[.status.traffic[]?.percent // 0] | add // 0' "/tmp/${service}-final.json")"
              if [[ "$traffic_count" == 1 && "$traffic_sum" == 100 ]]; then
                traffic_ready=true
                break
              fi
              sleep 5
            done
            test "$traffic_ready" = true
            gcloud run revisions describe "$revision" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "/tmp/${revision}.json"
            release_sha="$(jq -r 'first(.spec.containers[0].env[]? | select(.name == "TOCA_RELEASE_SHA") | .value) // empty' "/tmp/${revision}.json")"
            runtime_sa="$(jq -r '.spec.serviceAccountName // empty' "/tmp/${revision}.json")"
            image="$(jq -r '.spec.containers[0].image // empty' "/tmp/${revision}.json")"
            runtime_digest="${image##*@}"
            test "$release_sha" = "$CANDIDATE_SHA"
            test "$runtime_sa" = "$expected_sa"
            test "$runtime_digest" = "$RUNTIME_IMAGE_DIGEST"
            jq -n --arg service "$service" --arg revision "$revision" --arg releaseSha "$release_sha" --arg runtimeIdentity "$runtime_sa" --arg imageIndexDigest "$IMAGE_DIGEST" --arg runtimeImageDigest "$runtime_digest" '{service:$service,revision:$revision,trafficPercent:100,releaseSha:$releaseSha,runtimeIdentity:$runtimeIdentity,imageIndexDigest:$imageIndexDigest,runtimeImageDigest:$runtimeImageDigest}' > "staging-deploy-evidence/${evidence}"
          }
'''
          deploy = replace_once(deploy, old, new, 'final runtime readback')

          deploy = replace_once(
              deploy,
              '''            --arg imageDigest "$IMAGE_DIGEST" \\
            --arg mcpRevision "$MCP_REVISION" \\
''',
              '''            --arg imageIndexDigest "$IMAGE_DIGEST" \\
            --arg runtimeImageDigest "$RUNTIME_IMAGE_DIGEST" \\
            --arg mcpRevision "$MCP_REVISION" \\
''',
              'manifest digest args',
          )
          deploy = replace_once(
              deploy,
              '''            '{schemaVersion:"toca.staging.canonical-deploy.v1",candidateSha:$candidateSha,imageDigest:$imageDigest,mcpRevision:$mcpRevision,webhookRevision:$webhookRevision,canonicalConfigSha256:$configSha,trafficPercent:100,providersEnabled:false,providerAccess:false,productionAccess:false,result:"PASS"}' > staging-deploy-evidence/manifest.json''',
              '''            '{schemaVersion:"toca.staging.canonical-deploy.v1",candidateSha:$candidateSha,imageIndexDigest:$imageIndexDigest,runtimeImageDigest:$runtimeImageDigest,mcpRevision:$mcpRevision,webhookRevision:$webhookRevision,canonicalConfigSha256:$configSha,trafficPercent:100,providersEnabled:false,providerAccess:false,productionAccess:false,result:"PASS"}' > staging-deploy-evidence/manifest.json''',
              'manifest digest fields',
          )

          old = '''      - name: Automatic staging traffic rollback after failed post-promotion step
        if: failure() && env.TRAFFIC_PROMOTED == 'true' && env.PREVIOUS_MCP_REVISION != '' && env.PREVIOUS_WEBHOOK_REVISION != ''
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$GCP_CLOUD_RUN_MCP_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions "${PREVIOUS_MCP_REVISION}=100"
          gcloud run services update-traffic "$GCP_CLOUD_RUN_WEBHOOK_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions "${PREVIOUS_WEBHOOK_REVISION}=100"
'''
          new = '''      - name: Automatic staging traffic rollback after failed post-promotion step
        if: failure() && env.TRAFFIC_PROMOTION_STARTED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PREVIOUS_MCP_REVISION"
          test -n "$PREVIOUS_WEBHOOK_REVISION"
          rollback_service() {
            local service="$1" revision="$2" payload count traffic_sum
            gcloud run services update-traffic "$service" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions "${revision}=100"
            for attempt in $(seq 1 24); do
              payload="$(gcloud run services describe "$service" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
              count="$(jq --arg revision "$revision" '[.status.traffic[]? | select((.percent // 0) == 100 and .revisionName == $revision)] | length' <<<"$payload")"
              traffic_sum="$(jq '[.status.traffic[]?.percent // 0] | add // 0' <<<"$payload")"
              if [[ "$count" == 1 && "$traffic_sum" == 100 ]]; then
                return 0
              fi
              sleep 5
            done
            echo "Timed out verifying staging rollback for $service to $revision" >&2
            return 1
          }
          rollback_failures=0
          rollback_service "$GCP_CLOUD_RUN_MCP_SERVICE" "$PREVIOUS_MCP_REVISION" || rollback_failures=1
          rollback_service "$GCP_CLOUD_RUN_WEBHOOK_SERVICE" "$PREVIOUS_WEBHOOK_REVISION" || rollback_failures=1
          test "$rollback_failures" = 0
          echo 'STAGING_TRAFFIC_ROLLBACK=PASS'
'''
          deploy = replace_once(deploy, old, new, 'rollback action')

          runtime = replace_once(
              runtime,
              '  WEBHOOK_RUNTIME_SA: toca-next-stg-webhook@toca-mcp-next-staging.iam.gserviceaccount.com\n',
              '  WEBHOOK_RUNTIME_SA: toca-next-stg-webhook@toca-mcp-next-staging.iam.gserviceaccount.com\n  ARTIFACT_REPOSITORY: toca-mcp-staging\n',
              'runtime artifact repository',
          )

          setup_anchor = '''      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

'''
          image_step = '''      - name: Resolve expected Cloud Run runtime manifest from attested image digest
        id: image
        env:
          EXPECTED_IMAGE_DIGEST: __EXPECTED_IMAGE_DIGEST_EXPR__
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          IMAGE_REPOSITORY="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/server"
          OCI_MANIFEST_JSON="$(docker buildx imagetools inspect "${IMAGE_REPOSITORY}@${EXPECTED_IMAGE_DIGEST}" --format '{{json .Manifest}}')"
          RESOLVED_IMAGE_DIGEST="$(jq -r '.digest // empty' <<<"$OCI_MANIFEST_JSON")"
          MEDIA_TYPE="$(jq -r '.mediaType // empty' <<<"$OCI_MANIFEST_JSON")"
          test "$RESOLVED_IMAGE_DIGEST" = "$EXPECTED_IMAGE_DIGEST"
          case "$MEDIA_TYPE" in
            application/vnd.oci.image.index.v1+json|application/vnd.docker.distribution.manifest.list.v2+json)
              PLATFORM_MATCH_COUNT="$(jq '[.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length' <<<"$OCI_MANIFEST_JSON")"
              test "$PLATFORM_MATCH_COUNT" = 1
              RUNTIME_IMAGE_DIGEST="$(jq -r 'first(.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest) // empty' <<<"$OCI_MANIFEST_JSON")"
              ;;
            application/vnd.oci.image.manifest.v1+json|application/vnd.docker.distribution.manifest.v2+json)
              OCI_IMAGE_JSON="$(docker buildx imagetools inspect "${IMAGE_REPOSITORY}@${EXPECTED_IMAGE_DIGEST}" --format '{{json .Image}}')"
              test "$(jq -r '.os // empty' <<<"$OCI_IMAGE_JSON")" = linux
              test "$(jq -r '.architecture // empty' <<<"$OCI_IMAGE_JSON")" = amd64
              RUNTIME_IMAGE_DIGEST="$EXPECTED_IMAGE_DIGEST"
              ;;
            *)
              echo "Unsupported or unknown OCI media type: $MEDIA_TYPE" >&2
              exit 1
              ;;
          esac
          [[ "$RUNTIME_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "runtime_digest=$RUNTIME_IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

'''
          expected_expr = '$' + '{{ inputs.expected_image_digest }}'
          image_step = image_step.replace('__EXPECTED_IMAGE_DIGEST_EXPR__', expected_expr)
          runtime = replace_once(runtime, setup_anchor, setup_anchor + image_step, 'runtime OCI step')

          old_expr = '$' + '{{ inputs.expected_image_digest }}'
          runtime_env_old = '        env:\n          EXPECTED_CANDIDATE_SHA: ' + ('$' + '{{ inputs.expected_candidate_sha }}') + '\n          EXPECTED_IMAGE_DIGEST: ' + old_expr + '\n'
          runtime_env_new = '        env:\n          EXPECTED_CANDIDATE_SHA: ' + ('$' + '{{ inputs.expected_candidate_sha }}') + '\n          EXPECTED_IMAGE_INDEX_DIGEST: ' + old_expr + '\n          EXPECTED_RUNTIME_IMAGE_DIGEST: ' + ('$' + '{{ steps.image.outputs.runtime_digest }}') + '\n'
          runtime = replace_once(runtime, runtime_env_old, runtime_env_new, 'runtime expected digest env')
          runtime = replace_once(runtime, '            test "$image_digest" = "$EXPECTED_IMAGE_DIGEST"\n', '            test "$image_digest" = "$EXPECTED_RUNTIME_IMAGE_DIGEST"\n', 'runtime digest comparison')
          runtime = replace_once(
              runtime,
              '''              --arg imageDigest "$image_digest" \\
              --arg serviceUrl "$service_url" \\
              '{service:$service,revision:$revision,trafficPercent:100,releaseSha:$releaseSha,runtimeIdentity:$runtimeIdentity,imageDigest:$imageDigest,serviceUrl:$serviceUrl}' \\
''',
              '''              --arg imageIndexDigest "$EXPECTED_IMAGE_INDEX_DIGEST" \\
              --arg runtimeImageDigest "$image_digest" \\
              --arg serviceUrl "$service_url" \\
              '{service:$service,revision:$revision,trafficPercent:100,releaseSha:$releaseSha,runtimeIdentity:$runtimeIdentity,imageIndexDigest:$imageIndexDigest,runtimeImageDigest:$runtimeImageDigest,serviceUrl:$serviceUrl}' \\
''',
              'runtime evidence digests',
          )

          helper_anchor = "const config = JSON.parse(readFileSync(configPath, 'utf8')) as Record<string, unknown>;\n"
          helper = r'''

type OciPlatform = { os?: string; architecture?: string };
type OciDescriptor = { digest?: string; platform?: OciPlatform };
type OciManifest = { digest?: string; mediaType?: string; manifests?: OciDescriptor[] };
type OciImageConfig = { os?: string; architecture?: string };

const digestPattern = /^sha256:[0-9a-f]{64}$/;

function resolveExpectedRuntimeDigest(
  attestedDigest: string,
  manifest: OciManifest,
  imageConfig?: OciImageConfig,
): string {
  if (!digestPattern.test(attestedDigest) || manifest.digest !== attestedDigest) {
    throw new Error('attested digest mismatch');
  }

  if (
    manifest.mediaType === 'application/vnd.oci.image.index.v1+json' ||
    manifest.mediaType === 'application/vnd.docker.distribution.manifest.list.v2+json'
  ) {
    const matches = (manifest.manifests ?? []).filter(
      (entry) => entry.platform?.os === 'linux' && entry.platform?.architecture === 'amd64',
    );
    if (matches.length !== 1 || !matches[0]?.digest || !digestPattern.test(matches[0].digest)) {
      throw new Error('linux/amd64 child is missing or ambiguous');
    }
    return matches[0].digest;
  }

  if (
    manifest.mediaType === 'application/vnd.oci.image.manifest.v1+json' ||
    manifest.mediaType === 'application/vnd.docker.distribution.manifest.v2+json'
  ) {
    if (imageConfig?.os !== 'linux' || imageConfig.architecture !== 'amd64') {
      throw new Error('single manifest platform mismatch');
    }
    return attestedDigest;
  }

  throw new Error('unsupported OCI media type');
}

function assertRuntimeDigest(
  runtimeDigest: string,
  attestedDigest: string,
  manifest: OciManifest,
  imageConfig?: OciImageConfig,
): void {
  if (runtimeDigest !== resolveExpectedRuntimeDigest(attestedDigest, manifest, imageConfig)) {
    throw new Error('runtime digest is not the proven linux/amd64 runtime manifest');
  }
}
'''
          test = replace_once(test, helper_anchor, helper_anchor + helper, 'test helpers')

          marker = "  it('requires exact frozen candidate, immutable digest, readiness before promotion and final readback', () => {"
          added = r'''  it('resolves exactly one linux/amd64 child from an attested OCI index', () => {
    const indexDigest = `sha256:${'a'.repeat(64)}`;
    const childDigest = `sha256:${'b'.repeat(64)}`;
    const manifest: OciManifest = {
      digest: indexDigest,
      mediaType: 'application/vnd.oci.image.index.v1+json',
      manifests: [
        { digest: childDigest, platform: { os: 'linux', architecture: 'amd64' } },
        { digest: `sha256:${'c'.repeat(64)}`, platform: { os: 'linux', architecture: 'arm64' } },
      ],
    };

    expect(resolveExpectedRuntimeDigest(indexDigest, manifest)).toBe(childDigest);
    expect(() => assertRuntimeDigest(childDigest, indexDigest, manifest)).not.toThrow();
  });

  it('fails closed for a non-child runtime digest', () => {
    const indexDigest = `sha256:${'a'.repeat(64)}`;
    const childDigest = `sha256:${'b'.repeat(64)}`;
    const manifest: OciManifest = {
      digest: indexDigest,
      mediaType: 'application/vnd.oci.image.index.v1+json',
      manifests: [{ digest: childDigest, platform: { os: 'linux', architecture: 'amd64' } }],
    };

    expect(() =>
      assertRuntimeDigest(`sha256:${'d'.repeat(64)}`, indexDigest, manifest),
    ).toThrow('runtime digest is not the proven linux/amd64 runtime manifest');
  });

  it('supports a single linux/amd64 image manifest without inventing a child digest', () => {
    const digest = `sha256:${'e'.repeat(64)}`;
    const manifest: OciManifest = {
      digest,
      mediaType: 'application/vnd.oci.image.manifest.v1+json',
    };

    expect(resolveExpectedRuntimeDigest(digest, manifest, { os: 'linux', architecture: 'amd64' })).toBe(
      digest,
    );
  });

  it('fails closed for unknown media types, wrong platforms and ambiguous indexes', () => {
    const digest = `sha256:${'f'.repeat(64)}`;
    const child = `sha256:${'1'.repeat(64)}`;
    expect(() => resolveExpectedRuntimeDigest(digest, { digest, mediaType: 'unknown' })).toThrow(
      'unsupported OCI media type',
    );
    expect(() =>
      resolveExpectedRuntimeDigest(
        digest,
        { digest, mediaType: 'application/vnd.oci.image.manifest.v1+json' },
        { os: 'linux', architecture: 'arm64' },
      ),
    ).toThrow('single manifest platform mismatch');
    expect(() =>
      resolveExpectedRuntimeDigest(digest, {
        digest,
        mediaType: 'application/vnd.oci.image.index.v1+json',
        manifests: [
          { digest: child, platform: { os: 'linux', architecture: 'amd64' } },
          { digest: `sha256:${'2'.repeat(64)}`, platform: { os: 'linux', architecture: 'amd64' } },
        ],
      }),
    ).toThrow('linux/amd64 child is missing or ambiguous');
  });

  it('pins OCI readback, rollback and routing contracts in the permanent workflows', () => {
    expect(workflow).toContain('PLATFORM_MATCH_COUNT=');
    expect(workflow).toContain('test "$PLATFORM_MATCH_COUNT" = 1');
    expect(workflow).toContain('application/vnd.oci.image.manifest.v1+json');
    expect(workflow).toContain("--format '{{json .Image}}'");
    expect(workflow).toContain('test "$runtime_digest" = "$RUNTIME_IMAGE_DIGEST"');
    expect(runtimeWorkflow).toContain('EXPECTED_RUNTIME_IMAGE_DIGEST');
    expect(runtimeWorkflow).toContain('test "$image_digest" = "$EXPECTED_RUNTIME_IMAGE_DIGEST"');

    expect(workflow).not.toContain('status.traffic[percent=100].revisionName');
