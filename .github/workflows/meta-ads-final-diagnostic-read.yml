name: Meta Ads Final Diagnostic READ Only

on:
  push:
    branches:
      - ops/meta-ads-final-diagnostic

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: toca-mcp-production
      GCP_REGION: southamerica-east1
      GCP_ARTIFACT_REPOSITORY: toca-mcp
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
      GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
      FAILED_JOB_NAME: toca-meta-ads-validation-31935162022-1
      FAILED_EXECUTION_NAME: toca-meta-ads-validation-31935162022-1-qtzvs
      META_TOKEN_SECRET_ID: toca-meta-oauth-token
      META_GRAPH_BASE_URL: https://graph.facebook.com/v24.0
      META_ADS_ACCOUNT_ID: '311793958882290'
      CAMPAIGN_ID: '52618047446865'
      ADSET_ID: '52618047458265'
      CREATIVE_ID: '2844574235935509'
      AD_ID: '52618047512465'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Authenticate deployer to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Recover exact failed-run checkpoint and error
        shell: bash
        run: |
          set -euo pipefail
          echo '--- CHECKPOINT ---'
          gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=${FAILED_JOB_NAME} AND textPayload:\"META_ADS_SMOKE_PROVIDER_CHECKPOINT=\"" \
            --project "$GCP_PROJECT_ID" --freshness=6h --limit=20 --order=asc \
            --format='value(timestamp,textPayload)' || true
          echo '--- APPLICATION ERRORS ---'
          gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=${FAILED_JOB_NAME} AND severity>=ERROR" \
            --project "$GCP_PROJECT_ID" --freshness=6h --limit=50 --order=asc \
            --format='value(timestamp,severity,textPayload,jsonPayload.message)' || true
      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
      - name: Build temporary read-only image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/server:meta-ads-final-readback-${GITHUB_SHA}"
          READBACK_JOB="toca-meta-ads-readback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "READBACK_JOB=$READBACK_JOB" >> "$GITHUB_ENV"
      - name: Deploy GET-only runtime readback job
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$READBACK_JOB" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --command node \
            --args dist/src/meta-ads-final-readback.js \
            --set-env-vars "^~^META_GRAPH_BASE_URL=$META_GRAPH_BASE_URL~META_ADS_ACCOUNT_ID=$META_ADS_ACCOUNT_ID~META_ADS_CAMPAIGN_ID=$CAMPAIGN_ID~META_ADS_ADSET_ID=$ADSET_ID~META_ADS_CREATIVE_ID=$CREATIVE_ID~META_ADS_AD_ID=$AD_ID" \
            --set-secrets "META_TOKEN=$META_TOKEN_SECRET_ID:latest" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 120s \
            --quiet
      - name: Execute and capture GET-only provider readback
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs execute "$READBACK_JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet
          RESULT=''
          for attempt in $(seq 1 12); do
            LINE="$(gcloud logging read \
              "resource.type=cloud_run_job AND resource.labels.job_name=${READBACK_JOB} AND textPayload:\"META_ADS_FINAL_READBACK_RESULT=\"" \
              --project "$GCP_PROJECT_ID" --freshness=15m --limit=20 --order=desc \
              --format='value(textPayload)' | grep 'META_ADS_FINAL_READBACK_RESULT=' | head -n1 || true)"
            if [ -n "$LINE" ]; then RESULT="${LINE#META_ADS_FINAL_READBACK_RESULT=}"; break; fi
            sleep 5
          done
          test -n "$RESULT"
          printf '%s' "$RESULT" | jq -e '
            .campaign.status == "PAUSED" and .campaign.effective_status != "ACTIVE" and
            .adSet.status == "PAUSED" and .adSet.effective_status != "ACTIVE" and
            .ad.status == "PAUSED" and .ad.effective_status != "ACTIVE" and
            .spend == 0
          ' >/dev/null
          printf '%s\n' "$RESULT" | jq . | tee meta-ads-failed-attempt-readback.json
      - name: Upload GET-only readback evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meta-ads-failed-attempt-readback
          path: meta-ads-failed-attempt-readback.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary readback job
        if: always()
        shell: bash
        run: |
          gcloud run jobs delete "$READBACK_JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet || true
