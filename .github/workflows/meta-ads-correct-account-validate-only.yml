name: Meta Ads Correct Account Validate Only

on:
  push:
    branches:
      - diag/meta-ads-smoke-15442397-failure
    paths:
      - '.github/workflows/meta-ads-correct-account-validate-only.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  TOKEN_SECRET_ID: toca-meta-oauth-token
  JOB: toca-meta-ads-correct-account-validate-only
  ACCOUNT_ID: '394512749760530'
  PIXEL_ID: '461233076843065'
  PAGE_ID: '306103746115875'
  INSTAGRAM_USER_ID: '17841402033495654'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Build immutable validate-only image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/correct-account-validate
          cat > /tmp/correct-account-validate/validate.mjs <<'NODE'
          const token = process.env.META_ACCESS_TOKEN;
          const accountId = process.env.ACCOUNT_ID;
          const pixelId = process.env.PIXEL_ID;
          const pageId = process.env.PAGE_ID;
          const instagramUserId = process.env.INSTAGRAM_USER_ID;
          if (![token,accountId,pixelId,pageId,instagramUserId].every(Boolean)) throw new Error('CONFIGURATION_MISSING');

          const graph = 'https://graph.facebook.com/v24.0';
          const headers = { Authorization: `Bearer ${token}`, Accept: 'application/json' };
          const sanitize = (v) => String(v ?? '')
            .replace(/(access[_-]?token|authorization|bearer|secret)\s*[:=]?\s*\S+/gi, '[REDACTED]')
            .replace(/[\r\n\t]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 400);
          const get = async (path) => {
            const response = await fetch(`${graph}/${path}`, { headers });
            const body = await response.json().catch(() => ({}));
            return { response, body };
          };
          const postForm = async (path, values) => {
            const response = await fetch(`${graph}/${path}`, {
              method: 'POST',
              headers: { ...headers, 'content-type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams(values).toString(),
            });
            const body = await response.json().catch(() => ({}));
            return { response, body };
          };
          const rows = (body) => Array.isArray(body?.data) ? body.data : [];
          const errorOf = (result) => {
            const e = result.body?.error ?? {};
            return {
              httpStatus: result.response.status,
              type: sanitize(e.type),
              code: Number(e.code) || null,
              subcode: Number(e.error_subcode) || null,
              userTitle: sanitize(e.error_user_title),
              userMessage: sanitize(e.error_user_msg),
              message: sanitize(e.message),
            };
          };
          const okNoId = (label, result) => {
            if (!result.response.ok) return { label, ok: false, ...errorOf(result) };
            if (result.body?.id) throw new Error(`${label}_VALIDATE_ONLY_UNEXPECTED_ID`);
            return { label, ok: true, httpStatus: result.response.status, returnedId: null };
          };

          const accountResult = await get(`act_${accountId}?fields=id,account_id,name,account_status,currency,timezone_name,business`);
          if (!accountResult.response.ok) {
            console.log(`META_ADS_CORRECT_ACCOUNT_VALIDATION=${JSON.stringify({ accountError: errorOf(accountResult) })}`);
            process.exit(2);
          }
          const account = accountResult.body;

          const campaignsResult = await get(`act_${accountId}/campaigns?fields=id,name,objective,status,effective_status&limit=100`);
          const campaigns = campaignsResult.response.ok ? rows(campaignsResult.body) : [];
          const campaignForValidation = campaigns.find((item) => item?.id && item?.status !== 'ARCHIVED') ?? campaigns[0];

          const adSetsResult = await get(`act_${accountId}/adsets?fields=id,name,status,effective_status,campaign_id,promoted_object&limit=200`);
          const adSets = adSetsResult.response.ok ? rows(adSetsResult.body) : [];
          const pixelAdSets = adSets.filter((item) => String(item?.promoted_object?.pixel_id ?? '') === pixelId);

          const creativesResult = await get(`act_${accountId}/adcreatives?fields=id,name,object_story_spec&limit=200`);
          const creatives = creativesResult.response.ok ? rows(creativesResult.body) : [];
          const eligibleCreatives = creatives.filter((item) => {
            const spec = item?.object_story_spec;
            return item?.id && String(spec?.page_id ?? '') === pageId && (spec?.link_data || spec?.photo_data || spec?.video_data || spec?.template_data);
          });
          if (eligibleCreatives.length === 0) throw new Error('NO_ELIGIBLE_PAGE_CREATIVE_IN_CORRECT_ACCOUNT');
          const sourceCreative = eligibleCreatives[0];

          const campaignValidation = await postForm(`act_${accountId}/campaigns`, {
            name: 'TOCA | P0 VALIDATE_ONLY | correct account',
            objective: 'OUTCOME_SALES',
            status: 'PAUSED',
            special_ad_categories: JSON.stringify([]),
            is_adset_budget_sharing_enabled: 'false',
            execution_options: JSON.stringify(['validate_only']),
          });

          let adSetValidation = null;
          if (campaignForValidation?.id) {
            const start = new Date(Date.now() + 30 * 60 * 1000);
            const end = new Date(start.getTime() + 25 * 60 * 60 * 1000);
            adSetValidation = await postForm(`act_${accountId}/adsets`, {
              campaign_id: String(campaignForValidation.id),
              name: 'P0 AdSet VALIDATE_ONLY | correct account | Morro',
              daily_budget: '17000',
              billing_event: 'IMPRESSIONS',
              optimization_goal: 'OFFSITE_CONVERSIONS',
              bid_strategy: 'LOWEST_COST_WITHOUT_CAP',
              targeting: JSON.stringify({
                geo_locations: {
                  custom_locations: [{ latitude: -13.3833, longitude: -38.9167, radius: 15, distance_unit: 'kilometer' }],
                },
              }),
              promoted_object: JSON.stringify({ pixel_id: pixelId, custom_event_type: 'PURCHASE' }),
              start_time: start.toISOString(),
              end_time: end.toISOString(),
              status: 'PAUSED',
              execution_options: JSON.stringify(['validate_only']),
            });
          }

          const sourceSpec = JSON.parse(JSON.stringify(sourceCreative.object_story_spec));
          delete sourceSpec.page_id;
          delete sourceSpec.instagram_actor_id;
          delete sourceSpec.instagram_user_id;
          if (sourceSpec.video_data && typeof sourceSpec.video_data === 'object' && sourceSpec.video_data.image_hash && sourceSpec.video_data.image_url) {
            delete sourceSpec.video_data.image_url;
          }
          sourceSpec.page_id = pageId;
          sourceSpec.instagram_user_id = instagramUserId;
          const creativeValidation = await postForm(`act_${accountId}/adcreatives`, {
            name: 'P0 Creative VALIDATE_ONLY | correct account',
            object_story_spec: JSON.stringify(sourceSpec),
            execution_options: JSON.stringify(['validate_only']),
          });

          const result = {
            account: {
              id: String(account.id ?? ''), accountId: String(account.account_id ?? ''), name: account.name ?? null,
              accountStatus: account.account_status ?? null, currency: account.currency ?? null,
              timezoneName: account.timezone_name ?? null, business: account.business ?? null,
            },
            campaignCount: campaigns.length,
            campaignForValidation: campaignForValidation ? { id: String(campaignForValidation.id), name: campaignForValidation.name ?? null, objective: campaignForValidation.objective ?? null, status: campaignForValidation.status ?? null, effectiveStatus: campaignForValidation.effective_status ?? null } : null,
            adSetCount: adSets.length,
            pixelAdSetCount: pixelAdSets.length,
            samplePixelAdSets: pixelAdSets.slice(0, 5).map((item) => ({ id: String(item.id), name: item.name ?? null, status: item.status ?? null, effectiveStatus: item.effective_status ?? null })),
            creativeCount: creatives.length,
            sourceCreative: { id: String(sourceCreative.id), name: sourceCreative.name ?? null, storyKeys: Object.keys(sourceCreative.object_story_spec ?? {}).sort() },
            validations: {
              campaign: okNoId('CAMPAIGN', campaignValidation),
              adSet: adSetValidation ? okNoId('ADSET', adSetValidation) : { label: 'ADSET', ok: false, reason: 'NO_EXISTING_CAMPAIGN_FOR_VALIDATE_ONLY' },
              creative: okNoId('CREATIVE', creativeValidation),
            },
          };
          console.log(`META_ADS_CORRECT_ACCOUNT_VALIDATION=${JSON.stringify(result)}`);
          if (!result.validations.campaign.ok || !result.validations.adSet.ok || !result.validations.creative.ok) process.exit(3);
          NODE
          cat > /tmp/correct-account-validate/Dockerfile <<'DOCKER'
          FROM node:24-bookworm-slim
          WORKDIR /app
          COPY validate.mjs ./validate.mjs
          USER node
          CMD ["node", "validate.mjs"]
          DOCKER
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/meta-ads-correct-account-validate-only:${GITHUB_SHA}"
          docker build -t "$IMAGE" /tmp/correct-account-validate
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy validation job
        run: |
          gcloud run jobs deploy "$JOB" --image "$IMAGE" --project "$PROJECT_ID" --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars "ACCOUNT_ID=$ACCOUNT_ID,PIXEL_ID=$PIXEL_ID,PAGE_ID=$PAGE_ID,INSTAGRAM_USER_ID=$INSTAGRAM_USER_ID" \
            --set-secrets "META_ACCESS_TOKEN=$TOKEN_SECRET_ID:latest" \
            --tasks 1 --max-retries 0 --task-timeout 180s --quiet
      - name: Execute validate-only checks
        run: gcloud run jobs execute "$JOB" --project "$PROJECT_ID" --region "$REGION" --wait --quiet
      - name: Print persisted result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULT=""
          for attempt in $(seq 1 15); do
            RESULT="$(gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$JOB\" AND textPayload:\"META_ADS_CORRECT_ACCOUNT_VALIDATION=\"" \
              --project "$PROJECT_ID" --freshness=15m --order=desc --limit=1 --format='value(textPayload)')"
            [ -n "$RESULT" ] && break
            sleep 3
          done
          test -n "$RESULT"
          printf '%s\n' "$RESULT"
      - name: Remove validation job
        if: always()
        run: gcloud run jobs delete "$JOB" --project "$PROJECT_ID" --region "$REGION" --quiet || true
