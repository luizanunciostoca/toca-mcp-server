name: Temporary Instagram Token Only Meta Config

on:
  push:
    branches:
      - fix/instagram-engagement-token-only-meta-config

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/instagram-engagement-token-only-meta-config
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch token-only Meta engagement configuration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs';

          const configPath = 'src/config.ts';
          let config = fs.readFileSync(configPath, 'utf8');

          const schemaNeedle = '    META_ENABLED: booleanFromEnv,\n';
          if ((config.split(schemaNeedle).length - 1) !== 1) throw new Error('META_ENABLED_SCHEMA_ANCHOR_INVALID');
          config = config.replace(schemaNeedle, `${schemaNeedle}    META_PROVIDER_VERIFIED: booleanFromEnv,\n`);

          const engagementNeedle = `    if (config.INSTAGRAM_ENGAGEMENT_WRITES_ENABLED && !config.META_ENABLED) {\n      context.addIssue({\n        code: 'custom',\n        path: ['INSTAGRAM_ENGAGEMENT_WRITES_ENABLED'],\n        message: 'META_ENABLED must be true when INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=true',\n      });\n    }\n`;
          if ((config.split(engagementNeedle).length - 1) !== 1) throw new Error('ENGAGEMENT_META_GATE_ANCHOR_INVALID');
          const engagementReplacement = `${engagementNeedle}\n    if (config.INSTAGRAM_ENGAGEMENT_WRITES_ENABLED && !config.META_PROVIDER_VERIFIED) {\n      context.addIssue({\n        code: 'custom',\n        path: ['META_PROVIDER_VERIFIED'],\n        message: 'META_PROVIDER_VERIFIED must be true when INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=true',\n      });\n    }\n\n    if (config.INSTAGRAM_ENGAGEMENT_WRITES_ENABLED && !config.META_ACCESS_TOKEN_ENV_KEY) {\n      context.addIssue({\n        code: 'custom',\n        path: ['META_ACCESS_TOKEN_ENV_KEY'],\n        message: 'META_ACCESS_TOKEN_ENV_KEY is required when INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=true',\n      });\n    }\n`;
          config = config.replace(engagementNeedle, engagementReplacement);

          const oauthBlock = `    if (!config.META_ENABLED) return;\n\n    const required = [\n      'META_APP_ID',\n      'META_APP_SECRET_PROVIDER',\n      'META_APP_SECRET_KEY',\n      'META_AUTHORIZATION_ENDPOINT',\n      'META_TOKEN_ENDPOINT',\n      'META_REDIRECT_URI',\n      'META_REQUESTED_SCOPES',\n      'META_GRAPH_BASE_URL',\n      'META_GRAPH_API_VERSION',\n    ] as const;\n\n    for (const field of required) {\n      if (!config[field]) {\n        context.addIssue({\n          code: 'custom',\n          path: [field],\n          message: \`\${field} is required when META_ENABLED=true\`,\n        });\n      }\n    }\n`;
          if ((config.split(oauthBlock).length - 1) !== 1) throw new Error('META_OAUTH_BLOCK_ANCHOR_INVALID');
          const oauthReplacement = `    if (!config.META_ENABLED) return;\n\n    const verifiedTokenOnlyEngagement =\n      config.INSTAGRAM_ENGAGEMENT_WRITES_ENABLED &&\n      config.META_PROVIDER_VERIFIED &&\n      Boolean(config.META_ACCESS_TOKEN_ENV_KEY) &&\n      !config.META_WEBHOOK_ENABLED &&\n      !config.META_WEBHOOK_PERSISTENCE_ENABLED &&\n      !config.META_ADS_READ_ENABLED &&\n      !config.META_ADS_WRITE_ENABLED &&\n      !config.INSTAGRAM_READ_ENABLED &&\n      !config.INSTAGRAM_PUBLICATION_WRITES_ENABLED &&\n      !config.TOCA_MANAGED_INSTAGRAM_EXECUTOR_ENABLED;\n\n    if (!verifiedTokenOnlyEngagement) {\n      const required = [\n        'META_APP_ID',\n        'META_APP_SECRET_PROVIDER',\n        'META_APP_SECRET_KEY',\n        'META_AUTHORIZATION_ENDPOINT',\n        'META_TOKEN_ENDPOINT',\n        'META_REDIRECT_URI',\n        'META_REQUESTED_SCOPES',\n        'META_GRAPH_BASE_URL',\n        'META_GRAPH_API_VERSION',\n      ] as const;\n\n      for (const field of required) {\n        if (!config[field]) {\n          context.addIssue({\n            code: 'custom',\n            path: [field],\n            message: \`\${field} is required when META_ENABLED=true\`,\n          });\n        }\n      }\n    }\n`;
          config = config.replace(oauthBlock, oauthReplacement);

          const loadNeedle = `  if (config.INSTAGRAM_PUBLICATION_WRITES_ENABLED && config.MCP_ENABLED) {\n`;
          if ((config.split(loadNeedle).length - 1) !== 1) throw new Error('LOAD_CONFIG_ENGAGEMENT_SECRET_ANCHOR_INVALID');
          const loadInsertion = `  if (config.INSTAGRAM_ENGAGEMENT_WRITES_ENABLED) {\n    if (!config.META_ACCESS_TOKEN_ENV_KEY) {\n      throw new Error(\n        'META_ACCESS_TOKEN_ENV_KEY is required when INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=true',\n      );\n    }\n    assertReferencedSecret(env, config.META_ACCESS_TOKEN_ENV_KEY, 'META_ACCESS_TOKEN_ENV_KEY');\n  }\n\n`;
          config = config.replace(loadNeedle, `${loadInsertion}${loadNeedle}`);
          fs.writeFileSync(configPath, config);

          const testPath = 'test/config.test.ts';
          let test = fs.readFileSync(testPath, 'utf8');
          const testNeedle = `  it('accepts a complete Meta configuration using only a secret reference', () => {\n`;
          if ((test.split(testNeedle).length - 1) !== 1) throw new Error('CONFIG_TEST_ANCHOR_INVALID');
          const newTests = `  it('accepts verified token-only Meta configuration for governed engagement writes', () => {\n    const config = loadConfig({\n      NODE_ENV: 'test',\n      META_ENABLED: 'true',\n      META_PROVIDER_VERIFIED: 'true',\n      INSTAGRAM_ENGAGEMENT_WRITES_ENABLED: 'true',\n      META_ACCESS_TOKEN_ENV_KEY: 'TOCA_META_ACCESS_TOKEN',\n      TOCA_META_ACCESS_TOKEN: 'test-access-token',\n    });\n\n    expect(config).toMatchObject({\n      META_ENABLED: true,\n      META_PROVIDER_VERIFIED: true,\n      INSTAGRAM_ENGAGEMENT_WRITES_ENABLED: true,\n      META_ACCESS_TOKEN_ENV_KEY: 'TOCA_META_ACCESS_TOKEN',\n    });\n    expect(config.META_APP_ID).toBeUndefined();\n  });\n\n  it('rejects engagement writes unless the Meta provider is explicitly verified', () => {\n    expect(() =>\n      loadConfig({\n        NODE_ENV: 'test',\n        META_ENABLED: 'true',\n        INSTAGRAM_ENGAGEMENT_WRITES_ENABLED: 'true',\n        META_ACCESS_TOKEN_ENV_KEY: 'TOCA_META_ACCESS_TOKEN',\n        TOCA_META_ACCESS_TOKEN: 'test-access-token',\n      }),\n    ).toThrow('META_PROVIDER_VERIFIED must be true when INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=true');\n  });\n\n  it('rejects engagement writes without a referenced Meta access token', () => {\n    expect(() =>\n      loadConfig({\n        NODE_ENV: 'test',\n        META_ENABLED: 'true',\n        META_PROVIDER_VERIFIED: 'true',\n        INSTAGRAM_ENGAGEMENT_WRITES_ENABLED: 'true',\n      }),\n    ).toThrow('META_ACCESS_TOKEN_ENV_KEY is required when INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=true');\n  });\n\n  it('does not let token-only engagement bypass the full OAuth configuration for webhook runtime', () => {\n    expect(() =>\n      loadConfig({\n        NODE_ENV: 'test',\n        META_ENABLED: 'true',\n        META_PROVIDER_VERIFIED: 'true',\n        META_WEBHOOK_ENABLED: 'true',\n        INSTAGRAM_ENGAGEMENT_WRITES_ENABLED: 'true',\n        META_ACCESS_TOKEN_ENV_KEY: 'TOCA_META_ACCESS_TOKEN',\n        TOCA_META_ACCESS_TOKEN: 'test-access-token',\n      }),\n    ).toThrow('META_APP_ID is required when META_ENABLED=true');\n  });\n\n`;
          test = test.replace(testNeedle, `${newTests}${testNeedle}`);
          fs.writeFileSync(testPath, test);
          NODE
      - name: Apply repository Prettier
        run: pnpm exec prettier --write src/config.ts test/config.test.ts
      - name: Run focused regression tests
        run: pnpm exec vitest run test/config.test.ts test/instagram-engagement-controlled-write-canary-v2.test.ts
      - name: Commit governed source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/config.ts test/config.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(instagram): support verified token-only engagement Meta config'
          git push origin HEAD:fix/instagram-engagement-token-only-meta-config
