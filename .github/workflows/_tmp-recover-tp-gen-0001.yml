name: TEMP Recover TP-GEN-0001

on:
  push:
    branches:
      - ops/recover-tp-gen-0001
    paths:
      - .github/workflows/_tmp-recover-tp-gen-0001.yml

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_INFRA_ADMIN_SERVICE_ACCOUNT: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com
  BUCKET: toca-mcp-publication-assets
  PREFIX: instagram/scene-continuation-review-v1/photo-video-265d244dbd5f052cb2c6288d-

jobs:
  recover:
    if: github.ref == 'refs/heads/ops/recover-tp-gen-0001'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Authenticate existing infrastructure administrator
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_INFRA_ADMIN_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Recover exact persisted candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered
          gcloud storage ls "gs://${BUCKET}/${PREFIX}*.mp4" > /tmp/matches.txt
          test "$(grep -c '^gs://' /tmp/matches.txt)" -eq 1
          OBJECT="$(grep '^gs://' /tmp/matches.txt)"
          gcloud storage cp "$OBJECT" recovered/TOCA_THEPARTY_DUAS-PISTAS_GENERATIVE_MASTER_8s_v01.mp4
          SHA="$(sha256sum recovered/TOCA_THEPARTY_DUAS-PISTAS_GENERATIVE_MASTER_8s_v01.mp4 | awk '{print $1}')"
          SIZE="$(stat -c '%s' recovered/TOCA_THEPARTY_DUAS-PISTAS_GENERATIVE_MASTER_8s_v01.mp4)"
          python - <<'PY'
          from pathlib import Path
          p=Path('recovered/TOCA_THEPARTY_DUAS-PISTAS_GENERATIVE_MASTER_8s_v01.mp4')
          b=p.read_bytes()[:12]
          if len(b)<12 or b[4:8] != b'ftyp':
              raise SystemExit('RECOVERED_FILE_NOT_MP4')
          PY
          printf '%s\n' "{\"schemaVersion\":1,\"sourceContentItemId\":\"VID-TP-20260904-DUAS-PISTAS-GEN-001\",\"gcsObject\":\"${OBJECT}\",\"sha256\":\"${SHA}\",\"sizeBytes\":${SIZE},\"publicationAuthorized\":false,\"generationRepeated\":false}" > recovered/recovery.json

      - name: Upload recovered candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recovered-tp-gen-0001
          path: recovered/
          if-no-files-found: error
          retention-days: 14
