name: Format Instagram Engagement

on:
  push:
    branches: [feat/instagram-engagement-messaging]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/instagram-engagement-messaging
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier --write src/providers/meta/meta-api-client.ts src/providers/instagram/instagram-engagement-contracts.ts src/providers/instagram/instagram-engagement-provider.ts src/providers/instagram/instagram-capabilities.ts src/policy/engagement-policy.ts test/engagement-policy.test.ts docs/integrations/instagram-engagement.md scripts/architecture-check.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/providers/meta/meta-api-client.ts src/providers/instagram/instagram-engagement-contracts.ts src/providers/instagram/instagram-engagement-provider.ts src/providers/instagram/instagram-capabilities.ts src/policy/engagement-policy.ts test/engagement-policy.test.ts docs/integrations/instagram-engagement.md scripts/architecture-check.mjs
          git diff --cached --quiet || git commit -m "style: format Instagram engagement foundation"
          git push origin HEAD:feat/instagram-engagement-messaging
