name: TEMP Format Publication Queue Sync

on:
  push:
    branches:
      - fix/github-native-publication-queue-sync

permissions:
  contents: write

concurrency:
  group: temp-format-publication-queue-sync
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/github-native-publication-queue-sync
          persist-credentials: true
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository Prettier to queue sync compiler
        run: pnpm exec prettier --write src/github-native-publication/github-native-publication-queue-sync.ts

      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          path=src/github-native-publication/github-native-publication-queue-sync.ts
          if git diff --quiet -- "$path"; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git config user.name 'toca-format[bot]'
          git config user.email 'toca-format[bot]@users.noreply.github.com'
          git add -- "$path"
          git commit -m 'style(instagram): apply repository prettier to queue sync'
          git push origin HEAD:fix/github-native-publication-queue-sync
