name: Meta Ads Expired Ad Set Format One-Shot

on:
  push:
    branches: [fix/meta-ads-preflight-expired-adset]
    paths: ['.github/workflows/meta-ads-expired-adset-format-once.yml']

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/providers/meta-ads/meta-ads-smoke-readiness.ts
      - name: Commit formatted source only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = 'src/providers/meta-ads/meta-ads-smoke-readiness.ts'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/providers/meta-ads/meta-ads-smoke-readiness.ts
          git diff --cached --quiet && exit 0
          git commit -m 'style(meta-ads): format expired ad set guard'
          git push origin HEAD:fix/meta-ads-preflight-expired-adset
