name: Format Meta Ads Stories Fix Helper

on:
  push:
    branches:
      - fix/meta-ads-the-party-0904-stories-only-link
    paths:
      - '.github/workflows/format-meta-ads-stories-fix-helper.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and commit target only
        shell: bash
        run: |
          set -euo pipefail
          target='src/meta-ads-the-party-2026-09-04-stories-link-fix.ts'
          pnpm exec prettier --write "$target"
          if git diff --quiet -- "$target"; then
            echo 'FORMAT_ALREADY_CLEAN=1'
            exit 0
          fi
          git config user.name 'toca-mcp-ci'
          git config user.email 'toca-mcp-ci@users.noreply.github.com'
          git add -- "$target"
          git commit -m 'style(meta-ads): format stories-only correction'
          git push origin HEAD:fix/meta-ads-the-party-0904-stories-only-link
