name: Foundation Production Migration Deploy Patch One-Shot

on:
  push:
    branches: [fix/foundation-daily-control-observability]
    paths: ['.github/workflows/foundation-production-migration-deploy-patch-once.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/foundation-daily-control-observability
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch daemon deploy with migration gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('.github/workflows/deploy-toca-managed-instagram-daemon-gcp.yml')
          text = path.read_text()
          if '  migrate-production:\n' in text:
              raise SystemExit('migrate-production already exists')
          marker = '  provision-minute-trigger:\n'
          if marker not in text:
              raise SystemExit('provision-minute-trigger marker missing')

          job = textwrap.indent(
              textwrap.dedent(
                  '''\
                  migrate-production:
                    needs: quality-build-image
                    runs-on: ubuntu-latest
                    environment: production
                    timeout-minutes: 20
                    env:
                      IMAGE: __IMAGE__
                    steps:
                      - name: Authenticate deployer to Google Cloud
                        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
                        with:
                          workload_identity_provider: __WIF__
                          service_account: __DEPLOY_SA__

                      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

                      - name: Apply and verify official production migrations
                        shell: bash
                        run: |
                          set -euo pipefail
                          test -n "$IMAGE"
                          JOB_NAME="toca-production-migrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                          cleanup() {
                            gcloud run jobs delete "$JOB_NAME" \
                              --project "$GCP_PROJECT_ID" \
                              --region "$GCP_REGION" \
                              --quiet >/dev/null 2>&1 || true
                          }
                          trap cleanup EXIT

                          gcloud run jobs deploy "$JOB_NAME" \
                            --image "$IMAGE" \
                            --project "$GCP_PROJECT_ID" \
                            --region "$GCP_REGION" \
                            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
                            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
                            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" \
                            --command node \
                            --args dist/scripts/migrate-and-verify.js \
                            --tasks 1 \
                            --max-retries 0 \
                            --task-timeout 300s \
                            --quiet

                          gcloud run jobs execute "$JOB_NAME" \
                            --project "$GCP_PROJECT_ID" \
                            --region "$GCP_REGION" \
                            --wait \
                            --quiet

                          LOGS="$(gcloud logging read \
                            "resource.type=\\"cloud_run_job\\" AND resource.labels.job_name=\\"${JOB_NAME}\\"" \
                            --project "$GCP_PROJECT_ID" \
                            --freshness=20m \
                            --limit=200 \
                            --order=asc \
                            --format='value(textPayload)' || true)"
                          printf '%s\\n' "$LOGS"
                          printf '%s' "$LOGS" | grep -Eq 'PRODUCTION_SCHEMA_MIGRATIONS_CURRENT=[0-9]+'
                          echo 'TOCA_PRODUCTION_SCHEMA_MIGRATION_GATE=PASS'

                  '''
              ),
              '  ',
          )
          dollar = '$'
          job = job.replace('__IMAGE__', dollar + '{{ needs.quality-build-image.outputs.image }}')
          job = job.replace('__WIF__', dollar + '{{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}')
          job = job.replace('__DEPLOY_SA__', dollar + '{{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}')
          text = text.replace(marker, job + marker, 1)

          old_needs = '    needs: [quality-build-image, provision-minute-trigger]\n'
          new_needs = '    needs: [quality-build-image, migrate-production, provision-minute-trigger]\n'
          if old_needs not in text:
              raise SystemExit('deploy-runtime dependency marker missing')
          path.write_text(text.replace(old_needs, new_needs, 1))
          PY
          pnpm exec prettier --write .github/workflows/deploy-toca-managed-instagram-daemon-gcp.yml
          pnpm quality
      - name: Commit tested permanent gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/deploy-toca-managed-instagram-daemon-gcp.yml
          git commit -m 'fix(reliability): gate production deploy on schema migrations'
          git push origin HEAD:fix/foundation-daily-control-observability
