name: Final TOCA Main Production Deploy 2026-08-16

on:
  push:
    branches: [ops/final-exact-main-deploy-20260816]
    paths: ['.github/workflows/final-toca-main-production-deploy-20260816.yml']

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch official production deploy on current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$MAIN_SHA" = 'e0696df1d1860261afba78f1634e8c979401cdc7'
          HTTP="$(curl --silent --output /tmp/response.txt --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data '{"ref":"main","inputs":{"environment":"production"}}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-gcp.yml/dispatches")"
          cat /tmp/response.txt
          test "$HTTP" = '204'
          echo "TOCA_MAIN_PRODUCTION_DEPLOY_DISPATCH=PASS sha=${MAIN_SHA}"
