name: TEMP Prettier Human Review Trace

on:
  push:
    branches:
      - fix/instagram-direct-human-review-trace

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact Prettier output when needed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET='src/ops/instagram-engagement-direct-human-review-trace-readonly.ts'
          pnpm exec prettier --write "$TARGET"
          if git diff --quiet -- "$TARGET"; then
            echo 'PRETTIER_ALREADY_EXACT=true'
            exit 0
          fi
          SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${TARGET}?ref=${GITHUB_REF_NAME}" --jq '.sha')"
          CONTENT="$(base64 -w0 "$TARGET")"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${TARGET}" \
            -f message='style(instagram): apply exact Prettier output' \
            -f content="$CONTENT" \
            -f sha="$SHA" \
            -f branch="$GITHUB_REF_NAME" >/dev/null
          echo 'PRETTIER_APPLIED=true'
