name: TEMP Instagram Comment Channel Config Patch

on:
  push:
    branches:
      - feat/instagram-comment-reality-gate-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/instagram-comment-reality-gate-v1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply channel configuration patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          config = Path('src/config.ts')
          text = config.read_text()
          anchor = """const enabledByDefaultFromEnv = z\n  .enum(['true', 'false'])\n  .default('true')\n  .transform((value) => value === 'true');\n\n"""
          addition = """const instagramEngagementAutoReplyChannelsFromEnv = z\n  .enum(['DIRECT', 'COMMENT', 'DIRECT,COMMENT'])\n  .default('DIRECT')\n  .transform((value): ('DIRECT' | 'COMMENT')[] =>\n    value.split(',') as ('DIRECT' | 'COMMENT')[],\n  );\n\n"""
          assert anchor in text
          text = text.replace(anchor, anchor + addition, 1)
          old = """    INSTAGRAM_ENGAGEMENT_WRITES_ENABLED: booleanFromEnv,\n    INSTAGRAM_PUBLICATION_WRITES_ENABLED: booleanFromEnv,\n"""
          new = """    INSTAGRAM_ENGAGEMENT_WRITES_ENABLED: booleanFromEnv,\n    INSTAGRAM_ENGAGEMENT_AUTO_REPLY_CHANNELS: instagramEngagementAutoReplyChannelsFromEnv,\n    INSTAGRAM_PUBLICATION_WRITES_ENABLED: booleanFromEnv,\n"""
          assert old in text
          config.write_text(text.replace(old, new, 1))

          runtime = Path('src/instagram-engagement/runtime.ts')
          text = runtime.read_text()
          old = """    // Persistent production activation is intentionally DIRECT-only until a\n    // separate real COMMENT provider-acknowledgement gate is satisfied.\n    autoReplyChannels: ['DIRECT'],\n"""
          new = """    // Production defaults to DIRECT. COMMENT must be selected explicitly by a\n    // separately governed provider-acknowledgement / promotion gate.\n    autoReplyChannels: config.INSTAGRAM_ENGAGEMENT_AUTO_REPLY_CHANNELS,\n"""
          assert old in text
          runtime.write_text(text.replace(old, new, 1))

          env_file = Path('.env.example')
          text = env_file.read_text()
          old = """INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=false\nINSTAGRAM_PUBLICATION_WRITES_ENABLED=false\n"""
          new = """INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=false\n# Fail-closed channel allowlist. COMMENT or DIRECT,COMMENT require a separate\n# governed promotion gate; production LIMITED currently uses DIRECT only.\nINSTAGRAM_ENGAGEMENT_AUTO_REPLY_CHANNELS=DIRECT\nINSTAGRAM_PUBLICATION_WRITES_ENABLED=false\n"""
          assert old in text
          env_file.write_text(text.replace(old, new, 1))

          test = Path('test/config.test.ts')
          text = test.read_text()
          old = """      META_WEBHOOK_ENABLED: false,\n      GOOGLE_ADS_PHASE: 'OFF',\n"""
          new = """      META_WEBHOOK_ENABLED: false,\n      INSTAGRAM_ENGAGEMENT_AUTO_REPLY_CHANNELS: ['DIRECT'],\n      GOOGLE_ADS_PHASE: 'OFF',\n"""
          assert old in text
          text = text.replace(old, new, 1)
          anchor = """  it('requires Postgres when TOCA-managed scheduling is enabled', () => {\n"""
          addition = """  it('keeps engagement auto-reply channels fail-closed to Direct unless explicitly selected', () => {\n    expect(loadConfig({ NODE_ENV: 'test' }).INSTAGRAM_ENGAGEMENT_AUTO_REPLY_CHANNELS).toEqual([\n      'DIRECT',\n    ]);\n    expect(\n      loadConfig({\n        NODE_ENV: 'test',\n        INSTAGRAM_ENGAGEMENT_AUTO_REPLY_CHANNELS: 'COMMENT',\n      }).INSTAGRAM_ENGAGEMENT_AUTO_REPLY_CHANNELS,\n    ).toEqual(['COMMENT']);\n    expect(\n      loadConfig({\n        NODE_ENV: 'test',\n        INSTAGRAM_ENGAGEMENT_AUTO_REPLY_CHANNELS: 'DIRECT,COMMENT',\n      }).INSTAGRAM_ENGAGEMENT_AUTO_REPLY_CHANNELS,\n    ).toEqual(['DIRECT', 'COMMENT']);\n    expect(() =>\n      loadConfig({\n        NODE_ENV: 'test',\n        INSTAGRAM_ENGAGEMENT_AUTO_REPLY_CHANNELS: 'COMMENT,DIRECT',\n      }),\n    ).toThrow();\n  });\n\n"""
          assert anchor in text
          test.write_text(text.replace(anchor, addition + anchor, 1))

          limited_test = Path('test/instagram-engagement-limited-activation.test.ts')
          text = limited_test.read_text()
          old = """    expect(runtime).toContain(\"autoReplyChannels: ['DIRECT']\");\n"""
          new = """    expect(runtime).toContain(\n      'autoReplyChannels: config.INSTAGRAM_ENGAGEMENT_AUTO_REPLY_CHANNELS',\n    );\n"""
          assert old in text
          limited_test.write_text(text.replace(old, new, 1))
          PY
          pnpm install --frozen-lockfile
          pnpm exec prettier --write src/config.ts src/instagram-engagement/runtime.ts test/config.test.ts test/instagram-engagement-limited-activation.test.ts
          pnpm typecheck
          pnpm exec vitest run test/config.test.ts test/instagram-engagement-limited-activation.test.ts
          git diff --check
      - name: Commit channel configuration patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/config.ts src/instagram-engagement/runtime.ts .env.example test/config.test.ts test/instagram-engagement-limited-activation.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'feat(instagram): make auto-reply channels explicitly governed'
          git push origin HEAD:feat/instagram-comment-reality-gate-v1
