name: WhatsApp Provider READ Once

on:
  push:
    branches:
      - probe/whatsapp-provider-read-20260820
    paths:
      - '.github/workflows/whatsapp-provider-read-once.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: whatsapp-provider-read-once
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_ARTIFACT_REPOSITORY: toca-mcp
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  TOKEN_SECRET_ID: toca-meta-oauth-token
  META_GRAPH_API_VERSION: v24.0
  SOURCE_SHA: 6a77d6f08165c38b4b197c8a5507ec3370fe22dc

jobs:
  provider-read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout probe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Authenticate deployer to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Build immutable GET-only probe
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          mkdir -p /tmp/wa-provider-read
          cat > /tmp/wa-provider-read/read.mjs <<'NODE'
          const token = process.env.META_ACCESS_TOKEN;
          const apiVersion = process.env.META_GRAPH_API_VERSION;
          const sourceSha = process.env.SOURCE_SHA;
          if (!token || !apiVersion || !sourceSha) throw new Error('WHATSAPP_PROVIDER_READ_CONFIG_MISSING');

          async function graph(path) {
            const response = await fetch(`https://graph.facebook.com/${apiVersion}/${path}`, {
              method: 'GET',
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
            });
            let body = {};
            try { body = await response.json(); } catch {}
            return {
              ok: response.ok,
              status: response.status,
              errorCode: Number.isInteger(body?.error?.code) ? body.error.code : null,
              errorSubcode: Number.isInteger(body?.error?.error_subcode) ? body.error.error_subcode : null,
              body,
            };
          }

          const permissions = await graph('me/permissions');
          if (!permissions.ok) throw new Error(`WHATSAPP_PERMISSIONS_READ_HTTP_${permissions.status}`);
          const granted = new Set(
            (Array.isArray(permissions.body?.data) ? permissions.body.data : [])
              .filter((item) => item?.status === 'granted' && typeof item.permission === 'string')
              .map((item) => item.permission),
          );
          const requiredScopes = ['whatsapp_business_management', 'whatsapp_business_messaging'];

          const businessesResult = await graph('me/businesses?fields=id,name&limit=100');
          if (!businessesResult.ok) throw new Error(`WHATSAPP_BUSINESSES_READ_HTTP_${businessesResult.status}`);
          const businesses = Array.isArray(businessesResult.body?.data) ? businessesResult.body.data : [];
          const businessEvidence = [];
          const wabas = [];
          const phoneNumbers = [];
          const approvedTemplates = [];

          for (const business of businesses) {
            if (typeof business?.id !== 'string') continue;
            const owned = await graph(`${business.id}/owned_whatsapp_business_accounts?fields=id,name&limit=100`);
            businessEvidence.push({
              id: business.id,
              name: typeof business.name === 'string' ? business.name : null,
              wabaRead: { ok: owned.ok, status: owned.status, errorCode: owned.errorCode, errorSubcode: owned.errorSubcode },
            });
            if (!owned.ok) continue;
            for (const waba of Array.isArray(owned.body?.data) ? owned.body.data : []) {
              if (typeof waba?.id !== 'string') continue;
              wabas.push({ id: waba.id, name: typeof waba.name === 'string' ? waba.name : null, businessId: business.id });

              const phones = await graph(`${waba.id}/phone_numbers?fields=id,display_phone_number,verified_name,quality_rating&limit=100`);
              if (phones.ok) {
                for (const phone of Array.isArray(phones.body?.data) ? phones.body.data : []) {
                  if (typeof phone?.id !== 'string') continue;
                  phoneNumbers.push({
                    id: phone.id,
                    wabaId: waba.id,
                    displayPhoneNumber: typeof phone.display_phone_number === 'string' ? phone.display_phone_number : null,
                    verifiedName: typeof phone.verified_name === 'string' ? phone.verified_name : null,
                    qualityRating: typeof phone.quality_rating === 'string' ? phone.quality_rating : null,
                  });
                }
              }

              const templates = await graph(`${waba.id}/message_templates?fields=id,name,status,language&limit=100`);
              if (templates.ok) {
                for (const template of Array.isArray(templates.body?.data) ? templates.body.data : []) {
                  if (template?.status !== 'APPROVED' || typeof template?.name !== 'string') continue;
                  approvedTemplates.push({
                    wabaId: waba.id,
                    name: template.name,
                    language: typeof template.language === 'string' ? template.language : null,
                  });
                }
              }
            }
          }

          const evidence = {
            schemaVersion: 1,
            sourceSha,
            provider: 'META_WHATSAPP_CLOUD',
            apiVersion,
            providerReadOnly: true,
            requiredScopes: Object.fromEntries(requiredScopes.map((scope) => [scope, granted.has(scope)])),
            businesses: businessEvidence,
            wabas,
            phoneNumbers,
            approvedTemplates,
            discoveredWabaCount: wabas.length,
            discoveredPhoneNumberCount: phoneNumbers.length,
            approvedTemplateCount: approvedTemplates.length,
            providerReadyForControlledSendReadGate:
              requiredScopes.every((scope) => granted.has(scope)) && wabas.length > 0 && phoneNumbers.length > 0,
            verifiedAt: new Date().toISOString(),
          };
          console.log(`WHATSAPP_PROVIDER_READ_RESULT=${JSON.stringify(evidence)}`);
          NODE
          cat > /tmp/wa-provider-read/Dockerfile <<'DOCKER'
          FROM node:24-bookworm-slim
          WORKDIR /app
          COPY read.mjs ./read.mjs
          USER node
          CMD ["node", "read.mjs"]
          DOCKER
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/whatsapp-provider-read:${GITHUB_RUN_ID}"
          docker build -t "$IMAGE" /tmp/wa-provider-read
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "JOB_NAME=toca-whatsapp-provider-read-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Execute with runtime identity and GET-only Meta script
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            gcloud run jobs delete "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true
            gcloud artifacts docker images delete "$IMAGE" --project "$GCP_PROJECT_ID" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          gcloud run jobs deploy "$JOB_NAME" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars "META_GRAPH_API_VERSION=$META_GRAPH_API_VERSION,SOURCE_SHA=$SOURCE_SHA" \
            --set-secrets "META_ACCESS_TOKEN=$TOKEN_SECRET_ID:latest" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 120s \
            --quiet
          gcloud run jobs execute "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet

          RESULT_LINE="$(gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME} AND textPayload:\"WHATSAPP_PROVIDER_READ_RESULT=\"" \
            --project "$GCP_PROJECT_ID" \
            --freshness=20m \
            --limit=20 \
            --order=desc \
            --format='value(textPayload)' | grep 'WHATSAPP_PROVIDER_READ_RESULT=' | head -n1)"
          test -n "$RESULT_LINE"
          RESULT_JSON="${RESULT_LINE#WHATSAPP_PROVIDER_READ_RESULT=}"
          printf '%s\n' "$RESULT_JSON" | jq -e --arg sha "$SOURCE_SHA" '
            .schemaVersion == 1 and
            .sourceSha == $sha and
            .provider == "META_WHATSAPP_CLOUD" and
            .providerReadOnly == true and
            (.businesses | type == "array") and
            (.wabas | type == "array") and
            (.phoneNumbers | type == "array")
          ' >/dev/null
          printf '%s\n' "$RESULT_JSON" | jq . > whatsapp-provider-read.json
          echo 'WHATSAPP_PROVIDER_READ=COLLECTED'

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: whatsapp-provider-read-${{ env.SOURCE_SHA }}
          path: whatsapp-provider-read.json
          if-no-files-found: error
          retention-days: 90
