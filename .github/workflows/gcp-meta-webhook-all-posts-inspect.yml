name: GCP Meta Webhook All POSTs Inspect

on:
  push:
    branches:
      - feat/instagram-engagement-messaging
    paths:
      - .github/workflows/gcp-meta-webhook-all-posts-inspect.yml

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  SERVICE: toca-meta-oauth-staging

jobs:
  inspect-all-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect sanitized recent POST request routes
        shell: bash
        run: |
          set -euo pipefail
          SINCE="$(date -u -d '45 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')"
          FILTER="resource.type=cloud_run_revision AND resource.labels.service_name=${SERVICE} AND timestamp>=\"${SINCE}\" AND httpRequest.requestMethod=POST"
          gcloud logging read "$FILTER" \
            --project "$PROJECT_ID" \
            --limit 100 \
            --order desc \
            --format=json > /tmp/posts.json

          COUNT="$(jq 'length' /tmp/posts.json)"
          echo "Sanitized recent POST count: ${COUNT}"
          jq -r '.[] | [(.timestamp // ""), (.httpRequest.status // 0 | tostring), (.resource.labels.revision_name // ""), ((.httpRequest.requestUrl // "") | sub("^https?://[^/]+"; ""))] | @tsv' /tmp/posts.json \
            | sed -E 's/[?&](access_token|token|code|client_secret|appsecret_proof)=[^&[:space:]]+//g' \
            | head -100
