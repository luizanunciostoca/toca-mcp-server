name: TEMP Instagram Limited Typefix

on:
  push:
    branches:
      - fix/instagram-limited-activation-safety-v1

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/instagram-limited-activation-safety-v1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply exact optional-property fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/crm/social-engagement-lead-engine.ts')
          text = path.read_text()
          old = """      classificationConfidence:\n        input.authorization.classificationConfidence ?? classification.confidence,\n      contextConflict: input.authorization.contextConflict,\n      threadAutomationBlocked: input.authorization.threadAutomationBlocked,\n"""
          new = """      classificationConfidence:\n        input.authorization.classificationConfidence ?? classification.confidence,\n      ...(input.authorization.contextConflict === undefined\n        ? {}\n        : { contextConflict: input.authorization.contextConflict }),\n      ...(input.authorization.threadAutomationBlocked === undefined\n        ? {}\n        : { threadAutomationBlocked: input.authorization.threadAutomationBlocked }),\n"""
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm install --frozen-lockfile
          pnpm exec prettier --write src/crm/social-engagement-lead-engine.ts
          pnpm typecheck
          git diff --check
      - name: Commit typefix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/crm/social-engagement-lead-engine.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(instagram): preserve optional policy signals exactly'
          git push origin HEAD:fix/instagram-limited-activation-safety-v1
