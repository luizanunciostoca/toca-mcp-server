name: Format TOCA Managed Scheduler Debug
on:
  push:
    branches:
      - feat/toca-managed-instagram-scheduler-v1
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print canonical Prettier output
        run: |
          pnpm exec prettier src/scheduler/toca-managed-instagram-scheduler.ts src/tools/register-instagram-managed-scheduler.ts --write
          echo '===SCHEDULER_START==='
          cat src/scheduler/toca-managed-instagram-scheduler.ts
          echo '===SCHEDULER_END==='
          echo '===TOOLS_START==='
          cat src/tools/register-instagram-managed-scheduler.ts
          echo '===TOOLS_END==='
