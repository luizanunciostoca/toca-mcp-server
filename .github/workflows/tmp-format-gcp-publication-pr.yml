name: Temporary Format GCP Publication PR

on:
  push:
    branches:
      - ops/activate-gcp-instagram-writer-20260916
    paths:
      - '.github/workflows/tmp-format-gcp-publication-pr.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format exact recovery files
        run: |
          pnpm exec prettier --write \
            docs/operations/github-native-instagram-publication.md \
            test/marketing-publish-now-hardening.test.ts
          pnpm exec prettier --check \
            docs/operations/github-native-instagram-publication.md \
            test/marketing-publish-now-hardening.test.ts
          git diff --check

      - name: Remove temporary formatter and commit final tree
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-format-gcp-publication-pr.yml
          git config user.name 'toca-format[bot]'
          git config user.email 'toca-format[bot]@users.noreply.github.com'
          git add docs/operations/github-native-instagram-publication.md test/marketing-publish-now-hardening.test.ts
          git commit -m 'style(instagram): format GCP publication recovery contract'
          git push origin HEAD:ops/activate-gcp-instagram-writer-20260916
