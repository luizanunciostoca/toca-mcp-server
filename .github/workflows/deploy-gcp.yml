name: Deploy GCP Next

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options: [staging, production]
      operation:
        description: Governed deployment or recovery operation
        required: true
        default: deploy
        type: choice
        options: [deploy, rollback, kill_switch, clear_kill_switch]
      rollout:
        description: Traffic promotion after candidate readiness
        required: true
        default: candidate
        type: choice
        options: [candidate, canary, full]
      rollback_mcp_revision:
        description: Known MCP/Core revision for explicit rollback
        required: false
        type: string
      rollback_webhook_revision:
        description: Known webhook revision, or ABNENT to restore closed external exposure when no prior webhook revision served traffic
        required: false
        type: string
      rollback_compatibility_ref:
        description: Evidence that rollback revisions are schema-compatible
        required: false
        type: string
      staging_evidence_ref:
        description: Approved staging evidence package required before production
        required: false
        type: string
      production_authorization_ref:
        description: Coordinator authorization required before production mutation
        required: false
        type: string
      alert_evidence_ref:
        description: Alert firing/readback evidence reference
        required: false
        type: string
      dr_evidence_ref:
        description: Isolated DR drill evidence reference
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-gcp-next-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.environment != 'production' || github.ref == 'refs/heads/main'
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || (inputs.environment == 'production' && 'toca-mcp-production') || '' }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER || (inputs.environment == 'production' && '990081828836') || '' }}
      GCP_REGION: ${{ vars.GCP_REGION || (inputs.environment == 'production' && 'southamerica-east1') || '' }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY || (inputs.environment == 'production' && 'toca-mcp') || '' }}
      GCP_CLOUD_SQL_INSTANCE: ${{ vars.GCP_CLOUD_SQL_INSTANCE || (inputs.environment == 'production' && 'toca-mcp-db') || '' }}
      GCP_CLOUD_RUN_MCP_SERVICE: ${{ vars.GCP_CLOUD_RUN_MCP_SERVICE || (inputs.environment == 'production' && 'toca-mcp-production') || '' }}
      GCP_CLOUD_RUN_WEBHOOK_SERVICE: ${{ vars.GCP_CLOUD_RUN_WEBHOOK_SERVICE || (inputs.environment == 'production' && 'toca-webhook-next-production') || '' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || (inputs.environment == 'production' && 'projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp') || '' }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || (inputs.environment == 'production' && 'toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com') || '' }}
      GCP_MCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_MCP_RUNTIME_SERVICE_ACCOUNT || (inputs.environment == 'production' && 'toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com') || '' }}
      GCP_WEBHOOK_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_WEBHOOK_RUNTIME_SERVICE_ACCOUNT || (inputs.environment == 'production' && 'toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com') || '' }}
      GCP_DATABASE_URL_SECRET: ${{ vars.GCP_DATABASE_URL_SECRET || (inputs.environment == 'production' && 'toca-database-url') || '' }}
      GCP_DATABASE_URL_SECRET_VERSION: ${{ vars.GCP_DATABASE_URL_SECRET_VERSION || (inputs.environment == 'production' && '1') || '' }}
      PRODUCTION_GCP_PROJECT_ID: ${{ vars.PRODUCTION_GCP_PROJECT_ID }}
      PRODUCTION_GCP_PROJECT_NUMBER: ${{ vars.PRODUCTION_GCP_PROJECT_NUMBER }}
      PRODUCTION_GCP_REGION: ${{ vars.PRODUCTION_GCP_REGION }}
      PRODUCTION_GCP_CLOUD_SQL_INSTANCE: ${{ vars.PRODUCTION_GCP_CLOUD_SQL_INSTANCE }}
      PRODUCTION_GCP_CLOUD_RUN_MCP_SERVICE: ${{ vars.PRODUCTION_GCP_CLOUD_RUN_MCP_SERVICE }}
      PRODUCTION_GCP_CLOUD_RUN_WEBHOOK_SERVICE: ${{ vars.PRODUCTION_GCP_CLOUD_RUN_WEBHOOK_SERVICE }}
      PRODUCTION_GCP_DATABASE_URL_SECRET: ${{ vars.PRODUCTION_GCP_DATABASE_URL_SECRET }}
      PRODUCTION_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.PRODUCTION_GCP_WORKLOAD_IDENTITY_PROVIDER }}
      PRODUCTION_GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.PRODUCTION_GCP_DEPLOY_SERVICE_ACCOUNT }}
      PRODUCTION_GCP_MCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.PRODUCTION_GCP_MCP_RUNTIME_SERVICE_ACCOUNT }}
      PRODUCTION_GCP_WEBHOOK_RUNTIME_SERVICE_ACCOUNT: ${{ vars.PRODUCTION_GCP_WEBHOOK_RUNTIME_SERVICE_ACCOUNT }}
      STAGING_DATABASE_ISOLATION_MODE: ${{ vars.STAGING_DATABASE_ISOLATION_MODE }}
      STAGING_PROVIDER_MODE: ${{ vars.STAGING_PROVIDER_MODE || 'DISABLED' }}
      STAGING_PROVIDER_ISOLATION_EVIDENCE_REF: ${{ vars.STAGING_PROVIDER_ISOLATION_EVIDENCE_REF }}
      GCP_META_ACCESS_TOKEN_SECRET: ${{ vars.GCP_META_ACCESS_TOKEN_SECRET || (inputs.environment == 'production' && 'toca-meta-oauth-token') || '' }}
      GCP_META_ACCESS_TOKEN_SECRET_VERSION: ${{ vars.GCP_META_ACCESS_TOKEN_SECRET_VERSION || (inputs.environment == 'production' && 'RESOLVE_RUNTIME') || '' }}
      GCP_META_APP_SECRET: ${{ vars.GCP_META_APP_SECRET }}
      GCP_META_APP_SECRET_VERSION: ${{ vars.GCP_META_APP_SECRET_VERSION }}
      GCP_META_WEBHOOK_VERIFY_TOKEN_SECRET: ${{ vars.GCP_META_WEBHOOK_VERIFY_TOKEN_SECRET }}
      GCP_META_WEBHOOK_VERIFY_TOKEN_SECRET_VERSION: ${{ vars.GCP_META_WEBHOOK_VERIFY_TOKEN_SECRET_VERSION }}
      GCP_SENDGRRD_API_KEY_SECRET: ${{ vars.GCP_SENDGRID_API_KEY_SECRET }}
      GCP_SENDGRRD_API_KEY_SECRET_VERSION: ${{ vars.GCP_SENDGRID_API_KEY_SECRET_VERSION }}
      GCP_GOOGLE_ADS_DEVELOPER_TOKEN_SECRET: ${{ vars.GCP_GOOGLE_ADS_DEVELOPER_TOKEN_SECRET }}
      GCP_GOOGLE_ADS_DEVELOPER_TOKEN_SECRET_VERSION: ${{ vars.GCP_GOOGLE_ADS_DEVELOPER_TOKEN_SECRET_VERSION }}
      GCP_GOOGLE_ADS_CLIENT_ID_SECRET: ${{ vars.GCP_GOOGLE_ADS_CLIENT_ID_SECRET }}
      GCP_GOOGLE_ADS_CLIENT_ID_SECRET_VERSION: ${{ vars.GCP_GOOGLE_ADS_CLIENT_ID_SECRET_VERSION }}
      GCP_GOOGLE_ADS_CLIENT_SECRET_SECRET: ${{ vars.GCP_GOOGLE_ADS_CLIENT_SECRET_SECRET }}
      GCP_GOOGLE_ADS_CLIENT_SECRET_VERSION: ${{ vars.GCP_GOOGLE_ADS_CLIENT_SECRET_VERSION }}
      GCP_GOOGLE_ADS_REFRESH_TOKEN_SECRET: ${{ vars.GCP_GOOGLE_ADS_REFRESH_TOKEN_SECRET }}
      GCP_GOOGLE_ADS_REFRESH_TOKEN_SECRET_VERSION: ${{ vars.GCP_GOOGLE_ADS_REFRESH_TOKEN_SECRET_VERSION }}
