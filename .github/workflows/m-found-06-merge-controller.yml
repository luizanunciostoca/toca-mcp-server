name: M-FOUND-06 Merge Controller

on:
  push:
    branches:
      - controller/m-found-06-merge

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  validate-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: "98"
      EXPECTED_BASE_SHA: "166b4e98a636c0fd5b64c849fd3af986d0593b9e"
      TARGET_BRANCH: "feat/m-found-06-durable-workflows"
    steps:
      - name: Wait for target branch cleanup and freeze head
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            pr_json="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")"
            head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
            base_sha="$(jq -r '.base.sha' <<<"${pr_json}")"
            base_ref="$(jq -r '.base.ref' <<<"${pr_json}")"
            head_ref="$(jq -r '.head.ref' <<<"${pr_json}")"

            if [[ "${base_ref}" != "main" || "${head_ref}" != "${TARGET_BRANCH}" ]]; then
              echo "PR refs changed unexpectedly: base=${base_ref} head=${head_ref}" >&2
              exit 1
            fi
            if [[ "${base_sha}" != "${EXPECTED_BASE_SHA}" ]]; then
              echo "Main/base advanced from validated SHA: ${base_sha}" >&2
              exit 1
            fi

            temp_found=false
            for path in \
              .github/workflows/format-m-found-06.yml \
              .github/workflows/m-found-06-invariant-fix.yml \
              .github/workflows/m-found-06-repair.yml; do
              if gh api "repos/${REPO}/contents/${path}?ref=${head_sha}" >/dev/null 2>&1; then
                temp_found=true
              fi
            done

            if [[ "${temp_found}" == "false" ]]; then
              echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"
              echo "Frozen clean PR head: ${head_sha}"
              exit 0
            fi
            echo "Temporary workflows still present at ${head_sha}; waiting for isolated repair..."
            sleep 10
          done
          echo "Target branch never reached a clean workflow state." >&2
          exit 1

      - name: Verify required M-FOUND-06 files at frozen head
        env:
          HEAD_SHA: ${{ steps.freeze.outputs.head_sha }}
        run: |
          set -euo pipefail
          for path in \
            src/workflow/workflow-contracts.ts \
            src/workflow/in-memory-workflow-store.ts \
            src/persistence/postgres-workflow-store.ts \
            migrations/007_durable_workflow_persistence.sql \
            migrations/008_workflow_execution_claims.sql \
            test/durable-workflow.test.ts \
            test/durable-workflow-migration.test.ts \
            test/durable-workflow-resume-attempt.test.ts \
            docs/checkpoints/m-found-06-durable-workflow-persistence.md; do
            gh api "repos/${REPO}/contents/${path}?ref=${HEAD_SHA}" >/dev/null
          done
          if gh api "repos/${REPO}/contents/migrations/007_durable_workflow_persistence.sql?ref=${HEAD_SHA}" --jq '.content' \
            | tr -d '\n' | base64 -d | grep -q 'event_outbox'; then
            echo "M-FOUND-07 outbox leaked into M-FOUND-06." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.freeze.outputs.head_sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Re-run complete repository quality on frozen head
        run: pnpm quality

      - name: Require official Quality Gate success for exact frozen head
        env:
          HEAD_SHA: ${{ steps.freeze.outputs.head_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            runs="$(gh api "repos/${REPO}/actions/workflows/quality.yml/runs?event=pull_request&per_page=30")"
            run_id="$(jq -r --arg sha "${HEAD_SHA}" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last | .id // empty' <<<"${runs}")"
            status="$(jq -r --arg sha "${HEAD_SHA}" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last | .status // empty' <<<"${runs}")"
            conclusion="$(jq -r --arg sha "${HEAD_SHA}" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last | .conclusion // empty' <<<"${runs}")"
            if [[ -n "${run_id}" && "${status}" == "completed" ]]; then
              if [[ "${conclusion}" != "success" ]]; then
                echo "Official Quality Gate ${run_id} concluded ${conclusion}." >&2
                exit 1
              fi
              echo "Official Quality Gate ${run_id} is green for ${HEAD_SHA}."
              exit 0
            fi
            echo "Waiting for official Quality Gate on ${HEAD_SHA}..."
            sleep 10
          done
          echo "No completed official Quality Gate for frozen head." >&2
          exit 1

      - name: Reconfirm frozen head and main base immediately before merge
        env:
          HEAD_SHA: ${{ steps.freeze.outputs.head_sha }}
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          current_main="$(gh api "repos/${REPO}/commits/main" --jq '.sha')"
          if [[ "${current_head}" != "${HEAD_SHA}" ]]; then
            echo "PR head moved after validation: ${current_head}" >&2
            exit 1
          fi
          if [[ "${current_main}" != "${EXPECTED_BASE_SHA}" ]]; then
            echo "Main moved after validation: ${current_main}" >&2
            exit 1
          fi

      - name: Mark PR ready and merge exact validated head
        id: merge
        env:
          HEAD_SHA: ${{ steps.freeze.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh pr ready "${PR_NUMBER}" --repo "${REPO}" || true
          response="$(gh api --method PUT "repos/${REPO}/pulls/${PR_NUMBER}/merge" \
            -f sha="${HEAD_SHA}" \
            -f merge_method=merge \
            -f commit_title='feat: implement M-FOUND-06 durable workflow persistence (#98)' \
            -f commit_message='Add durable workflow instances, DAG steps, dependencies, events, human tasks, timers, compensation persistence and concurrency-safe claims after an exact-head green Quality Gate.')"
          merged="$(jq -r '.merged' <<<"${response}")"
          merge_sha="$(jq -r '.sha' <<<"${response}")"
          if [[ "${merged}" != "true" || -z "${merge_sha}" || "${merge_sha}" == "null" ]]; then
            echo "Merge failed: ${response}" >&2
            exit 1
          fi
          echo "merge_sha=${merge_sha}" >> "${GITHUB_OUTPUT}"
          echo "Merged M-FOUND-06 at ${merge_sha}."

      - name: Require post-merge main Quality Gate success
        env:
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            runs="$(gh api "repos/${REPO}/actions/workflows/quality.yml/runs?event=push&branch=main&per_page=30")"
            run_id="$(jq -r --arg sha "${MERGE_SHA}" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last | .id // empty' <<<"${runs}")"
            status="$(jq -r --arg sha "${MERGE_SHA}" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last | .status // empty' <<<"${runs}")"
            conclusion="$(jq -r --arg sha "${MERGE_SHA}" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last | .conclusion // empty' <<<"${runs}")"
            if [[ -n "${run_id}" && "${status}" == "completed" ]]; then
              if [[ "${conclusion}" != "success" ]]; then
                echo "Post-merge Quality Gate ${run_id} concluded ${conclusion}." >&2
                exit 1
              fi
              echo "Post-merge Quality Gate ${run_id} is green."
              exit 0
            fi
            sleep 10
          done
          echo "Post-merge Quality Gate did not complete in time." >&2
          exit 1

      - name: Require post-merge production deploy success
        env:
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            runs="$(gh api "repos/${REPO}/actions/workflows/deploy-toca-managed-instagram-daemon-gcp.yml/runs?event=push&branch=main&per_page=30")"
            run_id="$(jq -r --arg sha "${MERGE_SHA}" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last | .id // empty' <<<"${runs}")"
            status="$(jq -r --arg sha "${MERGE_SHA}" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last | .status // empty' <<<"${runs}")"
            conclusion="$(jq -r --arg sha "${MERGE_SHA}" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last | .conclusion // empty' <<<"${runs}")"
            if [[ -n "${run_id}" && "${status}" == "completed" ]]; then
              if [[ "${conclusion}" != "success" ]]; then
                echo "Post-merge deploy ${run_id} concluded ${conclusion}." >&2
                exit 1
              fi
              echo "Post-merge production deploy ${run_id} is green."
              exit 0
            fi
            sleep 10
          done
          echo "Post-merge deploy did not complete in time." >&2
          exit 1
