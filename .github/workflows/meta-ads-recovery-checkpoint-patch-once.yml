name: Meta Ads Recovery Checkpoint Patch Once

on:
  push:
    branches: [fix/meta-ads-create-paused-recovery-checkpoint]
    paths: ['.github/workflows/meta-ads-recovery-checkpoint-patch-once.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Patch smoke execution and evidence docs
        shell: bash
        run: |
          set -euo pipefail
          BASE='0f812077c84cea92547352320e2cc859ec832003'
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          python - <<'PY'
          from pathlib import Path

          path = Path('src/meta-ads-create-paused-smoke.ts')
          text = path.read_text()
          anchor = "import { MetaAdsControlledGraphProvider } from './providers/meta-ads/meta-ads-controlled-graph-provider.js';\n"
          addition = anchor + "import {\n  metaAdsProviderCreationCheckpointFromError,\n  runMetaAdsCreatePausedSettlement,\n} from './providers/meta-ads/meta-ads-smoke-execution.js';\n"
          if anchor not in text:
              raise SystemExit('import anchor missing')
          text = text.replace(anchor, addition, 1)

          old = """  try {\n    const result = await service.createPaused(plan, approvedSha256);\n    const providerVerification = await reconcileProviderPaused(\n      result.campaignId,\n      result.adSetId,\n      result.adIds,\n    );\n\n    await pool.query(\n"""
          new = """  try {\n    const settled = await runMetaAdsCreatePausedSettlement(\n      {\n        smokeId,\n        campaignName: plan.campaign.name,\n        approvedRequestSha256: approvedSha256,\n      },\n      {\n        createPaused: () => service.createPaused(plan, approvedSha256),\n        checkpointCreated: async (checkpoint) => {\n          console.log(`META_ADS_SMOKE_PROVIDER_CHECKPOINT=${JSON.stringify(checkpoint)}`);\n          await pool.query(\n            `insert into audit_events\n               (correlation_id, actor_id, tool_name, risk_class, decision, normalized_payload, provider_result)\n             values ($1, $2, $3, $4, $5, $6::jsonb, $7::jsonb)`,\n            [\n              correlationId,\n              'github-actions/provider-smoke',\n              'meta_ads.campaign.create_paused',\n              'WRITE_EXTERNAL',\n              'SMOKE_PROVIDER_CREATED',\n              JSON.stringify({\n                requestSha256: approvedSha256,\n                smokeId,\n                campaignName: plan.campaign.name,\n              }),\n              JSON.stringify(checkpoint),\n            ],\n          );\n        },\n        reconcile: (result) =>\n          reconcileProviderPaused(result.campaignId, result.adSetId, result.adIds),\n      },\n    );\n    const { result, providerVerification } = settled;\n\n    await pool.query(\n"""
          if old not in text:
              raise SystemExit('settlement anchor missing')
          text = text.replace(old, new, 1)

          old_fail = "        JSON.stringify({ error: normalizeError(error) }),\n"
          new_fail = """        JSON.stringify({\n          error: normalizeError(error),\n          ...(metaAdsProviderCreationCheckpointFromError(error)\n            ? { providerCheckpoint: metaAdsProviderCreationCheckpointFromError(error) }\n            : {}),\n        }),\n"""
          if old_fail not in text:
              raise SystemExit('failure anchor missing')
          text = text.replace(old_fail, new_fail, 1)
          path.write_text(text)

          checkpoint = Path('docs/checkpoints/meta-ads-provider-settlement-readiness-v2.md')
          doc = checkpoint.read_text()
          doc = doc.replace(
              'Status: **PRIMARY PREPARE VALIDATED / CREATE_PAUSED PENDING — NO WRITE / NO SPEND**',
              'Status: **PRIMARY CREATE_PAUSED PROVIDER-VALIDATED — PAUSED / ZERO SPEND / NO ACTIVATION**',
              1,
          )
          doc = doc.replace(
              'Current reconciliation baseline: `main@808454749b1d56ae7c42a1f7cc543959da1ef391`.',
              'Current reconciliation baseline: `main@0f812077c84cea92547352320e2cc859ec832003`.',
              1,
          )
          marker = '## Provider evidence boundary\n\n'
          evidence = """## Real primary-account CREATE_PAUSED evidence — PASS after read-only reconciliation\n\nA single exact-hash provider mutation was executed against primary account `311793958882290` from source `main@0f812077c84cea92547352320e2cc859ec832003`, using approved request SHA-256 `47d719b08c31ca8db827e8d9c89c3f8374cf915ee22653ad270cdc0096c8d243`, zero provider retries and no activation path.\n\nMutation run `31920903042` created provider resources but the original bounded settlement loop timed out with `META_ADS_SMOKE_PROVIDER_RECONCILIATION_TIMEOUT`; the mutation was not retried. GET-only reconciliation run `31921580945` subsequently proved:\n\n- campaign `52618007729865`: configured/effective `PAUSED`;\n- Ad Set `52618007731065`: configured/effective `PAUSED`;\n- creative `2844574235935509`, bound to account `311793958882290`;\n- Ad `52618007737265`: configured/effective `PAUSED`;\n- campaign -> Ad Set -> Ad -> creative relationships match;\n- duplicate counts are exactly one for campaign, Ad Set and Ad;\n- no `issues_info`, no failed delivery checks and no effective `ACTIVE` state;\n- provider Insights returned no delivery rows and total spend `0`;\n- no activation call occurred.\n\nSanitized read-back artifact: ID `9256521917`, digest `sha256:f70b4cd4a272588e1f5480eb8fd3a2f0172ecd5c643f1aede24fa25058422cf5`.\n\nThe timeout exposed an observability/recovery gap, not a failed provider write. The hardened execution now records returned provider IDs and approved hash immediately after `createPaused` and before settlement polling. A later read-back failure must reconcile those exact IDs by GET and must never trigger a blind second create.\n\n"""
          if marker not in doc:
              raise SystemExit('provider boundary marker missing')
          doc = doc.replace(marker, evidence + marker, 1)

          start = doc.index('The current primary account now has fresh provider proof for:')
          end_marker = '\n## Merge and safety gate'
          end = doc.index(end_marker, start)
          replacement = """The current primary account has fresh provider proof for granted `ads_management`, exact active BRL account binding, Pixel assignment, no-side-effect `validate_only`, one exact approved CREATE_PAUSED mutation, exact provider resource identities, settled PAUSED read-back, no provider issues and zero spend.\n\n`meta_ads.campaign.create_paused` is therefore **PRODUCTION_VALIDATED for controlled PAUSED-only creation on primary account `311793958882290`**. This does not validate or authorize activation, budget expansion, automatic retries or spend.\n"""
          doc = doc[:start] + replacement + doc[end:]
          doc = doc.replace(
              '`CREATE_PAUSED` remains a separate controlled operation. It must use the exact prepared descriptor/hash, remain PAUSED-only, use zero mutation retries and require provider settlement/read-back. Activation and spend are not authorized by this checkpoint.',
              '`CREATE_PAUSED` is provider-validated only for exact approved PAUSED-only creation. Future executions must retain exact descriptor/hash binding, zero blind retries and provider read-back. Activation, budget expansion and spend are not validated or authorized by this checkpoint.',
              1,
          )
          checkpoint.write_text(doc)

          register = Path('docs/operations/provider-write-validation-register.md')
          reg = register.read_text()
          old = """Required sequence:\n\n1. reconcile #118 to the then-current `main` and pass exact-head Quality;\n2. granted `ads_management` proof;\n3. exact active ad account `311793958882290` + currency proof;\n4. exact Pixel assignment proof;\n5. provider `validate_only` preflight returns no created Ad ID;\n6. explicit approved `CREATE_PAUSED` descriptor/hash;\n7. one bounded create-paused mutation;\n8. provider states settle safely as paused with no `issues_info` or failed delivery checks;\n9. immutable evidence/read-back;\n10. zero activation and zero spend.\n\nLifecycle conclusion: **IMPLEMENTED / fresh CREATE_PAUSED provider settlement validation pending; do not activate or spend**.\n"""
          new = """Production validation evidence:\n\n1. primary-account PREPARE passed provider `validate_only`;\n2. exact approved request SHA-256 `47d719b08c31ca8db827e8d9c89c3f8374cf915ee22653ad270cdc0096c8d243`;\n3. one bounded CREATE_PAUSED mutation in run `31920903042`, zero retries and no activation;\n4. the initial settlement poll timed out, so the mutation was not retried;\n5. GET-only reconciliation run `31921580945` recovered exact campaign / Ad Set / creative / Ad IDs `52618007729865` / `52618007731065` / `2844574235935509` / `52618007737265`;\n6. campaign, Ad Set and Ad settled configured/effective `PAUSED`, with no issues or failed delivery checks;\n7. duplicate counts are one and provider spend is `0`;\n8. sanitized artifact `9256521917`, digest `sha256:f70b4cd4a272588e1f5480eb8fd3a2f0172ecd5c643f1aede24fa25058422cf5`.\n\nLifecycle conclusion: **PRODUCTION_VALIDATED for controlled CREATE_PAUSED on account `311793958882290`; activation, budget expansion and spend remain unvalidated and prohibited**.\n"""
          if old not in reg:
              raise SystemExit('register sequence block missing')
          register.write_text(reg.replace(old, new, 1))
          PY

          pnpm exec prettier --write \
            src/meta-ads-create-paused-smoke.ts \
            src/providers/meta-ads/meta-ads-smoke-execution.ts \
            test/meta-ads-smoke-execution.test.ts \
            docs/checkpoints/meta-ads-provider-settlement-readiness-v2.md \
            docs/operations/provider-write-validation-register.md
          pnpm quality

      - name: Commit permanent patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'luizidebook'
          git config user.email '47362223+luizidebook@users.noreply.github.com'
          git add src/meta-ads-create-paused-smoke.ts docs/checkpoints/meta-ads-provider-settlement-readiness-v2.md docs/operations/provider-write-validation-register.md src/providers/meta-ads/meta-ads-smoke-execution.ts test/meta-ads-smoke-execution.test.ts
          git commit -m 'fix(meta-ads): checkpoint provider ids before settlement'
          git push origin HEAD:fix/meta-ads-create-paused-recovery-checkpoint
