name: Temporary GCP Recovery Format Artifact

on:
  push:
    branches:
      - ops/restore-gcp-instagram-publication-20260916
    paths:
      - '.github/workflows/tmp-format-gcp-recovery-artifact.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ops/restore-gcp-instagram-publication-20260916
          persist-credentials: false
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format recovery test
        run: pnpm prettier --write test/instagram-gcp-publication-recovery-preflight.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: formatted-gcp-recovery-test
          path: test/instagram-gcp-publication-recovery-preflight.test.ts
          if-no-files-found: error
          retention-days: 1
