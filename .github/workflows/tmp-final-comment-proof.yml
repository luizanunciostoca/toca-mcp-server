name: Temporary Final Comment Proof

on:
  push:
    branches:
      - feat/instagram-engagement-messaging

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  SERVICE: toca-meta-oauth-staging
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  DATABASE_SECRET_ID: toca-database-url
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  INSPECTION_JOB: toca-final-comment-proof
  INSPECTION_SINCE: '2026-08-12T00:30:00Z'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Count sanitized webhook HTTP results
        shell: bash
        run: |
          set -euo pipefail
          FILTER='resource.type="cloud_run_revision" AND resource.labels.service_name="'"$SERVICE"'" AND httpRequest.requestMethod="POST" AND httpRequest.requestUrl:"/webhooks/meta" AND timestamp>="'"$INSPECTION_SINCE"'"'
          TOTAL="$(gcloud logging read "$FILTER" --project "$PROJECT_ID" --limit=100 --format='value(httpRequest.status)' 2>/dev/null | sed '/^$/d' | wc -l | tr -d ' ')"
          SUCCESS="$(gcloud logging read "$FILTER AND httpRequest.status>=200 AND httpRequest.status<300" --project "$PROJECT_ID" --limit=100 --format='value(insertId)' 2>/dev/null | sed '/^$/d' | wc -l | tr -d ' ')"
          CLIENT_ERROR="$(gcloud logging read "$FILTER AND httpRequest.status>=400 AND httpRequest.status<500" --project "$PROJECT_ID" --limit=100 --format='value(insertId)' 2>/dev/null | sed '/^$/d' | wc -l | tr -d ' ')"
          echo "SAFE_FINAL_HTTP_TOTAL=$TOTAL"
          echo "SAFE_FINAL_HTTP_2XX=$SUCCESS"
          echo "SAFE_FINAL_HTTP_4XX=$CLIENT_ERROR"

      - name: Build sanitized database inspector
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/final-comment-proof
          cat > /tmp/final-comment-proof/inspect.mjs <<'NODE'
          import pg from 'pg';
          const connectionString = process.env.DATABASE_URL;
          const since = process.env.INSPECTION_SINCE;
          if (!connectionString || !since) throw new Error('inspection configuration missing');
          const pool = new pg.Pool({ connectionString, ssl: false, max: 1 });
          try {
            const persisted = await pool.query(
              `select count(*)::int as count
                 from meta_webhook_events
                where channel = 'COMMENT'
                  and received_at >= $1::timestamptz
                  and occurred_at is not null`,
              [since],
            );
            const audit = await pool.query(
              `select count(*)::int as count
                 from audit_events a
                 join meta_webhook_events e on e.event_id = a.correlation_id
                where e.channel = 'COMMENT'
                  and e.received_at >= $1::timestamptz
                  and e.occurred_at is not null
                  and a.tool_name = 'instagram.engagement.webhook.receive'
                  and a.decision = 'ACCEPTED'`,
              [since],
            );
            console.log(`SAFE_FINAL_COMMENT_PERSISTED=${persisted.rows[0]?.count ?? 0}`);
            console.log(`SAFE_FINAL_COMMENT_AUDITED=${audit.rows[0]?.count ?? 0}`);
          } finally {
            await pool.end().catch(() => undefined);
          }
          NODE
          cat > /tmp/final-comment-proof/Dockerfile <<'DOCKER'
          FROM node:24-bookworm-slim
          WORKDIR /app
          RUN npm init -y >/dev/null 2>&1 && npm install pg@8.23.0 >/dev/null 2>&1
          COPY inspect.mjs ./inspect.mjs
          USER node
          CMD ["node", "inspect.mjs"]
          DOCKER
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/toca-mcp/final-comment-proof:${GITHUB_SHA}"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" /tmp/final-comment-proof
          docker push "$IMAGE"
          echo "INSPECT_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Inspect persistence and audit safely
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            gcloud run jobs delete "$INSPECTION_JOB" --project "$PROJECT_ID" --region "$REGION" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          gcloud run jobs deploy "$INSPECTION_JOB" \
            --image "$INSPECT_IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --set-env-vars "INSPECTION_SINCE=$INSPECTION_SINCE" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --max-retries 0 \
            --task-timeout 120s \
            --quiet
          gcloud run jobs execute "$INSPECTION_JOB" --project "$PROJECT_ID" --region "$REGION" --wait --quiet
          MARKERS=''
          for ATTEMPT in 1 2 3 4 5; do
            MARKERS="$(gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$INSPECTION_JOB\" AND textPayload:\"SAFE_FINAL_COMMENT_\"" \
              --project "$PROJECT_ID" --freshness=10m --limit=20 --format='value(textPayload)' 2>/dev/null \
              | grep -E '^SAFE_FINAL_COMMENT_(PERSISTED|AUDITED)=[0-9]+$' | sort -u || true)"
            [ -n "$MARKERS" ] && break
            sleep 2
          done
          echo "$MARKERS"
          PERSISTED="$(echo "$MARKERS" | sed -n 's/^SAFE_FINAL_COMMENT_PERSISTED=//p' | tail -1)"
          AUDITED="$(echo "$MARKERS" | sed -n 's/^SAFE_FINAL_COMMENT_AUDITED=//p' | tail -1)"
          test "${PERSISTED:-0}" -ge 1
          test "${AUDITED:-0}" -ge 1
