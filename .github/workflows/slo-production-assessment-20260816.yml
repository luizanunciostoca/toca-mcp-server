name: SLO Production Assessment 2026-08-16

on:
  push:
    branches: [ops/slo-production-assessment-20260816]
    paths: ['.github/workflows/slo-production-assessment-20260816.yml']

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  DATABASE_SECRET_ID: toca-database-url
  PROD_SERVICE: toca-mcp-production
  DAEMON_SERVICE: toca-managed-instagram-daemon
  SOURCE_MAIN_SHA: 2971ab1195134c9de89585a8e440e9398d9f0675
  RESTORE_EVIDENCE_AT: '2026-08-16T07:29:28Z'

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Collect scheduler, backup, PITR and immutable runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          SERVICE="$(gcloud run services describe "$PROD_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          IMAGE="$(jq -r '.spec.template.spec.containers[0].image // empty' <<<"$SERVICE")"
          test -n "$IMAGE"

          DAEMON_LOGS="$(gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${DAEMON_SERVICE}\"" \
            --project "$GCP_PROJECT_ID" --freshness=24h --limit=10000 --format=json)"
          SCHEDULER_SUCCEEDED="$(jq '[.[] | tostring | select(contains("toca.managed.instagram.daemon.tick.completed"))] | length' <<<"$DAEMON_LOGS")"
          SCHEDULER_FAILED="$(jq '[.[] | tostring | select(contains("toca.managed.instagram.daemon.tick.failed"))] | length' <<<"$DAEMON_LOGS")"
          SCHEDULER_TICKS=$((SCHEDULER_SUCCEEDED + SCHEDULER_FAILED))
          test "$SCHEDULER_TICKS" -gt 0

          INSTANCE="$(gcloud sql instances describe toca-mcp-db --project "$GCP_PROJECT_ID" --format=json)"
          PITR_ENABLED="$(jq -r '.settings.backupConfiguration.pointInTimeRecoveryEnabled // false' <<<"$INSTANCE")"
          test "$PITR_ENABLED" = true

          BACKUPS="$(gcloud sql backups list --instance=toca-mcp-db --project "$GCP_PROJECT_ID" --limit=25 --format=json)"
          LATEST_BACKUP_END="$(jq -r '[.[] | select((.status // "") == "SUCCESSFUL" or (.status // "") == "SUCCESS") | (.endTime // .end_time // empty)] | map(select(length > 0)) | sort | last // empty' <<<"$BACKUPS")"
          test -n "$LATEST_BACKUP_END"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "SCHEDULER_TICKS=$SCHEDULER_TICKS" >> "$GITHUB_ENV"
          echo "SCHEDULER_FAILED=$SCHEDULER_FAILED" >> "$GITHUB_ENV"
          echo "PITR_ENABLED=$PITR_ENABLED" >> "$GITHUB_ENV"
          echo "LATEST_BACKUP_END=$LATEST_BACKUP_END" >> "$GITHUB_ENV"
          echo "SLO_JOB=toca-slo-assessment-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Execute canonical evaluator on production data and persist operational signal
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            gcloud run jobs delete "$SLO_JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          cat >/tmp/assess.mjs <<'NODE'
          import { createRequire } from 'node:module';
          import { randomUUID } from 'node:crypto';
          const require = createRequire('/app/package.json');
          const pg = require('pg');
          const { assessReliability } = await import('file:///app/dist/src/core/reliability.js');
          const { PostgresAuditSink } = await import('file:///app/dist/src/persistence/postgres-audit-sink.js');
          const { PostgresOperationalObservabilityStore } = await import('file:///app/dist/src/persistence/postgres-operational-observability.js');
          const { createToolRegistry } = await import('file:///app/dist/src/registry.js');

          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          const schedulerTicks = Number(process.env.SCHEDULER_TICKS);
          const schedulerFailures = Number(process.env.SCHEDULER_FAILED);
          const latestBackupEnd = new Date(process.env.LATEST_BACKUP_END);
          const restoreEvidenceAt = new Date(process.env.RESTORE_EVIDENCE_AT);
          const now = new Date();
          if (!Number.isSafeInteger(schedulerTicks) || schedulerTicks <= 0) throw new Error('SLO_SCHEDULER_WINDOW_EMPTY');
          if (!Number.isSafeInteger(schedulerFailures) || schedulerFailures < 0 || schedulerFailures > schedulerTicks) throw new Error('SLO_SCHEDULER_COUNTS_INVALID');
          if (!Number.isFinite(latestBackupEnd.getTime())) throw new Error('SLO_BACKUP_TIME_INVALID');
          if (!Number.isFinite(restoreEvidenceAt.getTime())) throw new Error('SLO_RESTORE_TIME_INVALID');

          try {
            const terminal = await pool.query(`
              with latest as (
                select distinct on (execution_id)
                  execution_id, status, external_resource_id, created_at
                from audit_ledger_events
                where created_at >= now() - interval '24 hours'
                  and status in ('SUCCEEDED','FAILED')
                order by execution_id, sequence desc
              )
              select
                count(*)::int as total,
                count(*) filter (where status='FAILED')::int as failures,
                count(*) filter (where status='SUCCEEDED' and external_resource_id is not null)::int as external_successes
              from latest`);
            const outbox = await pool.query(`
              select count(*)::int as pending,
                coalesce(greatest(0, extract(epoch from (now() - min(occurred_at)))),0)::float8 as oldest_age
              from event_outbox
              where status in ('PENDING','CLAIMED','FAILED_RETRYABLE')`);
            const heads = await pool.query(`
              select execution_id from audit_ledger_heads
              where updated_at >= now() - interval '24 hours'
              order by updated_at desc, execution_id asc
              limit 100`);

            const verifier = new PostgresAuditSink(pool, createToolRegistry());
            let invalidAuditExecutions = 0;
            for (const row of heads.rows) {
              const result = await verifier.verifyExecution(row.execution_id);
              if (!result.valid) invalidAuditExecutions += 1;
            }

            const coreRequests = Number(terminal.rows[0]?.total ?? 0);
            const coreFailures = Number(terminal.rows[0]?.failures ?? 0);
            const successfulExternalWrites = Number(terminal.rows[0]?.external_successes ?? 0);
            // The canonical atomic executor records SUCCEEDED for formal provider writes only
            // after providerReadback.verified=true and durable approval consumption succeeds.
            const verifiedExternalWrites = successfulExternalWrites;
            const snapshot = {
              windowMinutes: 1440,
              coreRequests,
              coreFailures,
              schedulerTicks,
              schedulerFailures,
              successfulExternalWrites,
              verifiedExternalWrites,
              outboxPending: Number(outbox.rows[0]?.pending ?? 0),
              oldestOutboxAgeSeconds: Number(outbox.rows[0]?.oldest_age ?? 0),
              auditLedgerIntegrityValid: invalidAuditExecutions === 0,
              latestBackupAgeHours: Math.max(0, (now.getTime() - latestBackupEnd.getTime()) / 3600000),
              pointInTimeRecoveryEnabled: process.env.PITR_ENABLED === 'true',
              latestRestoreDrillAgeDays: Math.max(0, (now.getTime() - restoreEvidenceAt.getTime()) / 86400000),
            };
            const assessment = assessReliability(snapshot);
            const evidence = {
              schemaVersion: 1,
              sourceMainSha: process.env.SOURCE_MAIN_SHA,
              window: '24h',
              snapshot,
              assessment,
              auditExecutionsChecked: heads.rows.length,
              measuredAt: now.toISOString(),
            };

            const store = new PostgresOperationalObservabilityStore(pool);
            const client = await pool.connect();
            try {
              await client.query('begin');
              await store.write(client, {
                signalId: randomUUID(),
                auditEventId: null,
                executionId: null,
                correlationId: `foundation:slo:${process.env.SOURCE_MAIN_SHA}`,
                tenantId: null,
                signalType: 'STATE',
                name: 'foundation.slo.assessment.completed',
                value: assessment.healthy ? 1 : 0,
                attributes: {
                  sourceMainSha: process.env.SOURCE_MAIN_SHA,
                  healthy: assessment.healthy,
                  coreRequests,
                  coreFailures,
                  schedulerTicks,
                  schedulerFailures,
                },
                evidence: [
                  `slo:core:${JSON.stringify(assessment.slos[0])}`,
                  `slo:scheduler:${JSON.stringify(assessment.slos[1])}`,
                  `alerts:${assessment.alerts.map((a) => `${a.severity}:${a.code}`).join(',') || 'none'}`,
                  `backup-age-hours:${snapshot.latestBackupAgeHours}`,
                  `restore-drill-age-days:${snapshot.latestRestoreDrillAgeDays}`,
                ],
                occurredAt: now.toISOString(),
              });
              await client.query('commit');
            } catch (error) {
              await client.query('rollback');
              throw error;
            } finally {
              client.release();
            }

            console.log(`FOUNDATION_SLO_ASSESSMENT_RESULT=${JSON.stringify(evidence)}`);
            if (assessment.slos.some((s) => s.met !== true)) throw new Error('SLO_OBJECTIVE_NOT_PROVEN');
            if (!assessment.healthy) throw new Error('SLO_ASSESSMENT_UNHEALTHY');
          } finally {
            await pool.end();
          }
          NODE

          B64="$(base64 -w0 /tmp/assess.mjs)"
          rm -f /tmp/assess.mjs
          SCRIPT='set -eu; printf %s "$SLO_SCRIPT_B64" | base64 -d >/tmp/assess.mjs; node /tmp/assess.mjs; rm -f /tmp/assess.mjs'

          gcloud run jobs deploy "$SLO_JOB" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --set-env-vars "^~^SOURCE_MAIN_SHA=$SOURCE_MAIN_SHA~SCHEDULER_TICKS=$SCHEDULER_TICKS~SCHEDULER_FAILED=$SCHEDULER_FAILED~LATEST_BACKUP_END=$LATEST_BACKUP_END~PITR_ENABLED=$PITR_ENABLED~RESTORE_EVIDENCE_AT=$RESTORE_EVIDENCE_AT~SLO_SCRIPT_B64=$B64" \
            --command /bin/sh \
            --args="^@^-lc@${SCRIPT}" \
            --tasks 1 --max-retries 0 --task-timeout 10m --memory 512Mi --cpu 1 --quiet

          gcloud run jobs execute "$SLO_JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet
          RESULT_LINE=''
          for attempt in $(seq 1 12); do
            RESULT_LINE="$(gcloud logging read \
              "resource.type=cloud_run_job AND resource.labels.job_name=${SLO_JOB} AND textPayload:\"FOUNDATION_SLO_ASSESSMENT_RESULT=\"" \
              --project "$GCP_PROJECT_ID" --freshness=20m --limit=50 --order=desc --format='value(textPayload)' \
              | grep 'FOUNDATION_SLO_ASSESSMENT_RESULT=' | head -n1 || true)"
            if [ -n "$RESULT_LINE" ]; then break; fi
            sleep 5
          done
          test -n "$RESULT_LINE"
          RESULT_JSON="${RESULT_LINE#FOUNDATION_SLO_ASSESSMENT_RESULT=}"
          printf '%s\n' "$RESULT_JSON" | jq -e --arg sha "$SOURCE_MAIN_SHA" '
            .sourceMainSha == $sha and
            .assessment.healthy == true and
            ([.assessment.slos[].met] | all(. == true))
          ' >/dev/null
          printf '%s\n' "$RESULT_JSON" | jq . > foundation-slo-production-assessment.json
          echo 'FOUNDATION_SLO_PRODUCTION_ASSESSMENT=PASS'

      - name: Upload SLO production evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-slo-production-assessment-${{ github.sha }}
          path: foundation-slo-production-assessment.json
          if-no-files-found: warn
          retention-days: 90
