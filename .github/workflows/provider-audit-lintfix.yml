name: Provider Audit One Shot Lint Fix

on:
  push:
    branches:
      - audit/provider-onboarding-email-whatsapp-20260821
    paths:
      - '.github/workflows/provider-audit-lintfix.yml'

permissions:
  contents: write

jobs:
  lintfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: audit/provider-onboarding-email-whatsapp-20260821
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Autofix only provider audit probe lint
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec eslint scripts/provider-onboarding-read-preflight.mjs --fix
          pnpm exec prettier --write scripts/provider-onboarding-read-preflight.mjs
          if git diff --quiet -- scripts/provider-onboarding-read-preflight.mjs; then
            echo 'No lint fixes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/provider-onboarding-read-preflight.mjs
          git commit -m 'style(audit): satisfy provider probe lint'
          git push origin HEAD:audit/provider-onboarding-email-whatsapp-20260821
