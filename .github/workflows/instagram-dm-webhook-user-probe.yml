name: Instagram DM Webhook User Probe

# Operational READ_ONLY diagnostic. No Instagram writes.
# Diagnostic generation 6: use the permanent PR #341 bounded user_id + message cursor implementation.
on:
  push:
    branches:
      - ops/instagram-dm-2025-version-probe-20260828
    paths:
      - '.github/workflows/instagram-dm-webhook-user-probe.yml'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_ARTIFACT_REPOSITORY: toca-mcp
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  DATABASE_SECRET_ID: toca-database-url
  TOKEN_SECRET_ID: toca-meta-oauth-token
  INSTAGRAM_ACCOUNT_ID: '17841402033495654'
  MESSAGING_BRANCH: feat/instagram-messaging-readonly-20260828

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout operational probe source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compose permanent messaging candidate with operational probe
        shell: bash
        run: |
          set -euo pipefail
          cp src/ops/instagram-dm-webhook-user-probe.ts /tmp/instagram-dm-webhook-user-probe.ts
          git fetch origin "$MESSAGING_BRANCH"
          git checkout --detach "origin/$MESSAGING_BRANCH"
          mkdir -p src/ops
          cp /tmp/instagram-dm-webhook-user-probe.ts src/ops/instagram-dm-webhook-user-probe.ts

          python3 <<'PY'
          from pathlib import Path
          server = Path('src/server.ts')
          text = server.read_text()
          old = "  const cloudRunService = env.K_SERVICE?.trim();"
          if old in text:
              server.write_text(text.replace(old, "  const cloudRunService = env.K_SERVICE?.trim() || env.CLOUD_RUN_JOB?.trim();", 1))
          PY
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Validate composed read-only candidate
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --check src/providers/instagram/instagram-messaging-read-provider.ts src/mcp/runtime-capability-resolver.ts
          pnpm exec prettier --write src/server.ts src/ops/instagram-dm-webhook-user-probe.ts
          pnpm typecheck
          pnpm build

      - name: Authenticate deployer to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Build ephemeral read-only image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          MESSAGING_SHA="$(git rev-parse HEAD)"
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/server:ig-dm-bounded-${MESSAGING_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "MESSAGING_SHA=$MESSAGING_SHA" >> "$GITHUB_ENV"

      - name: Execute paginated bounded probe through TOCA MCP
        shell: bash
        run: |
          set -euo pipefail
          JOB_NAME="toca-ig-dm-bounded-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            gcloud run jobs delete "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          gcloud run jobs deploy "$JOB_NAME" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --command node \
            --args dist/src/ops/instagram-dm-webhook-user-probe.js \
            --set-env-vars "^~^NODE_ENV=production~MCP_ENABLED=true~INSTAGRAM_READ_ENABLED=true~INSTAGRAM_BUSINESS_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID~META_ACCESS_TOKEN_ENV_KEY=META_ACCESS_TOKEN~META_GRAPH_BASE_URL=https://graph.facebook.com~META_GRAPH_API_VERSION=v24.0~META_ENABLED=false~META_WEBHOOK_ENABLED=false~META_WEBHOOK_PERSISTENCE_ENABLED=false~INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=false~INSTAGRAM_PUBLICATION_WRITES_ENABLED=false~META_ADS_READ_ENABLED=false~META_ADS_WRITE_ENABLED=false~GOOGLE_ADS_PHASE=OFF~TOCA_MANAGED_INSTAGRAM_SCHEDULER_ENABLED=false~TOCA_MANAGED_INSTAGRAM_EXECUTOR_ENABLED=false" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest,META_ACCESS_TOKEN=$TOKEN_SECRET_ID:latest" \
            --tasks 1 --max-retries 0 --task-timeout 600s --quiet

          STATUS=0
          gcloud run jobs execute "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet || STATUS=$?
          sleep 15
          gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME}" \
            --project "$GCP_PROJECT_ID" --freshness=30m --limit=500 --order=asc --format=json > /tmp/logs.json
          python3 <<'PY'
          import json, re, sys
          rows=json.load(open('/tmp/logs.json'))
          for row in rows:
              vals=[]
              if isinstance(row.get('textPayload'),str): vals.append(row['textPayload'])
              if isinstance(row.get('jsonPayload'),dict): vals.append(json.dumps(row['jsonPayload'],separators=(',',':')))
              for text in vals:
                  candidates=[]
                  try:
                      obj=json.loads(text)
                      if isinstance(obj,dict): candidates.append(obj)
                  except Exception:
                      for m in re.finditer(r'\{[^\n]*"validation":"instagram-dm-webhook-user-probe-v2"[^\n]*\}', text):
                          try: candidates.append(json.loads(m.group(0)))
                          except Exception: pass
                  for obj in candidates:
                      if obj.get('validation')=='instagram-dm-webhook-user-probe-v2':
                          obj['messagingCandidateSha']='REDACTED_IN_JOB_LOG' if not obj.get('messagingCandidateSha') else obj['messagingCandidateSha']
                          print(json.dumps(obj,separators=(',',':')))
                          sys.exit(0)
          print('WEBHOOK_USER_PROBE_V2_EVIDENCE_NOT_FOUND', file=sys.stderr)
          sys.exit(1)
          PY
          exit "$STATUS"
