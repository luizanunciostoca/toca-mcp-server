name: Video Vertex Prettier Diagnostic

on:
  pull_request:
    paths:
      - src/providers/gcp/vertex-veo-scene-continuation-video-provider.ts
      - test/google-service-identity-oauth-resolver.test.ts
      - test/vertex-veo-scene-continuation-video-provider.test.ts
      - .github/workflows/video-vertex-prettier-diagnostic.yml

permissions:
  contents: read

jobs:
  prettier-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Print exact Prettier patch
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            src/providers/gcp/vertex-veo-scene-continuation-video-provider.ts \
            test/google-service-identity-oauth-resolver.test.ts \
            test/vertex-veo-scene-continuation-video-provider.test.ts
          git diff -- \
            src/providers/gcp/vertex-veo-scene-continuation-video-provider.ts \
            test/google-service-identity-oauth-resolver.test.ts \
            test/vertex-veo-scene-continuation-video-provider.test.ts
