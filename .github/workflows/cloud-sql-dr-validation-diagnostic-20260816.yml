name: Cloud SQL DR Validation Diagnostic 2026-08-16

on:
  push:
    branches: [ops/cloud-sql-dr-drill-v3-20260816]
    paths: ['.github/workflows/cloud-sql-dr-validation-diagnostic-20260816.yml']

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  EXECUTION: toca-mcp-dr-val4-31932595115-ghd6g
  JOB_NAME: toca-mcp-dr-val4-31932595115
  DEPLOY_SA: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Read execution and logs only
        shell: bash
        run: |
          set -euo pipefail
          DESC_OK=false
          LOGS_OK=false
          if gcloud run jobs executions describe "$EXECUTION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > /tmp/execution.json 2>/tmp/execution.err; then
            DESC_OK=true
          else
            printf '%s\n' '{}' > /tmp/execution.json
          fi
          if gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${JOB_NAME}\"" --project "$GCP_PROJECT_ID" --freshness=1h --limit=200 --order=asc --format=json > /tmp/logs.json 2>/tmp/logs.err; then
            LOGS_OK=true
          else
            printf '%s\n' '[]' > /tmp/logs.json
          fi
          jq -n \
            --argjson describeOk "$DESC_OK" \
            --argjson logsOk "$LOGS_OK" \
            --slurpfile execution /tmp/execution.json \
            --slurpfile logs /tmp/logs.json \
            '{schemaVersion:1,describeOk:$describeOk,logsOk:$logsOk,execution:($execution[0] // {}),logs:($logs[0] // [])}' > cloud-sql-dr-validation-diagnostic.json
          echo "DR_VALIDATION_DIAGNOSTIC describe=$DESC_OK logs=$LOGS_OK"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloud-sql-dr-validation-diagnostic-${{ github.sha }}
          path: cloud-sql-dr-validation-diagnostic.json
          retention-days: 90
