name: GCP Meta App Subscription Check

on:
  push:
    branches:
      - feat/instagram-engagement-messaging
    paths:
      - .github/workflows/gcp-meta-app-subscription-check.yml

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  JOB: toca-meta-app-subscription-check
  APP_ID: "2281930145887404"
  EXPECTED_CALLBACK: "https://toca-meta-oauth-staging-990081828836.southamerica-east1.run.app/webhooks/meta"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy condition-check job
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT='import json, os, urllib.request\napp=os.environ["APP_ID"]\nsecret=os.environ["APP_SECRET"]\nexpected=os.environ["EXPECTED_CALLBACK"]\nreq=urllib.request.Request("https://graph.facebook.com/v26.0/"+app+"/subscriptions", headers={"Authorization":"Bearer "+app+"|"+secret})\nwith urllib.request.urlopen(req, timeout=30) as r: data=json.load(r).get("data",[])\nsub=next((x for x in data if x.get("object")=="instagram"), None)\nif not sub: raise SystemExit(21)\ncallback=sub.get("callback_url") or ""\nfields={f.get("name") if isinstance(f,dict) else str(f) for f in sub.get("fields",[])}\nif callback!=expected: raise SystemExit(22)\nif not {"comments","messages"}.issubset(fields): raise SystemExit(23)\nprint("SAFE_META_APP_SUBSCRIPTION_OK=true")\n'
          gcloud run jobs deploy "$JOB" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image python:3.12-slim \
            --service-account toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com \
            --set-env-vars "APP_ID=${APP_ID},EXPECTED_CALLBACK=${EXPECTED_CALLBACK}" \
            --set-secrets "APP_SECRET=toca-meta-app-secret:latest" \
            --command python \
            --args=-c,"$SCRIPT" \
            --max-retries 0 \
            --task-timeout 120s \
            --quiet
      - name: Verify Meta app subscription condition
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs execute "$JOB" --project "$PROJECT_ID" --region "$REGION" --wait --quiet
          echo "Meta app Instagram callback + comments/messages subscription condition passed."
      - name: Delete ephemeral job
        if: always()
        shell: bash
        run: |
          gcloud run jobs delete "$JOB" --project "$PROJECT_ID" --region "$REGION" --quiet || true
