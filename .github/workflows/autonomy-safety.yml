name: Autonomy Safety

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomy-safety-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  autonomy-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate effective autonomy policy
        run: node scripts/check-effective-autonomy-policy.mjs

      - name: Validate provider-backed capability evidence
        run: node scripts/check-capability-validation-evidence.mjs

      - name: Typecheck autonomy contracts
        run: pnpm typecheck

      - name: Run Autonomy Gate and readiness tests
        run: >-
          pnpm exec vitest run
          test/effective-autonomy-policy.test.ts
          test/autonomy-gate.test.ts
          test/autopilot-readiness.test.ts

      - name: Run scheduler resilience tests
        run: >-
          pnpm exec vitest run
          test/scheduler-watchdog.test.ts
          test/scheduler-reconciler.test.ts
          test/worker.test.ts
          test/worker-retry-chain.test.ts

      - name: Run approval, rollout and learning governance tests
        run: >-
          pnpm exec vitest run
          test/approval-batch.test.ts
          test/approval-executor-atomicity.test.ts
          test/autonomy-rollout.test.ts
          test/learning-governance.test.ts

      - name: Run fault injection and capability validation tests
        run: >-
          pnpm exec vitest run
          test/autopilot-fault-injection.test.ts
          test/capability-validation-evidence.test.ts
          test/instagram-core-publication-runtime.test.ts
