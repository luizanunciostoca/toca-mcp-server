name: Temporary GCP Controlled Publication Disabled Smoke

on:
  push:
    branches:
      - chore/tmp-gcp-controlled-publication-disabled-smoke
    paths:
      - '.github/workflows/tmp-gcp-controlled-publication-disabled-smoke.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  JOB_NAME: toca-instagram-controlled-publication-disabled-smoke

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push current image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/server:controlled-publication-disabled-${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy disabled controlled publication job
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$JOB_NAME" \
            --image "$IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --command node \
            --args dist/src/instagram-controlled-publication.js \
            --set-env-vars "NODE_ENV=production,META_ENABLED=false,MCP_ENABLED=false,INSTAGRAM_PUBLICATION_WRITES_ENABLED=false" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 60s \
            --quiet

      - name: Execute and verify fail-closed behavior
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs execute "$JOB_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --wait \
            --quiet

          sleep 5
          LOGS="$(gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME} AND timestamp>=\"$(date -u -d '10 minutes ago' +%Y-%m-%dT%H:%M:%SZ)\"" \
            --project "$PROJECT_ID" \
            --limit 100 \
            --format='value(textPayload)' 2>/dev/null || true)"
          printf '%s\n' "$LOGS"
          grep -q 'instagram.controlled-publication.disabled' <<<"$LOGS"
          echo 'GCP_CONTROLLED_PUBLICATION_DISABLED_SMOKE=1'

      - name: Delete temporary Cloud Run Job
        if: always()
        run: |
          gcloud run jobs delete "$JOB_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --quiet || true
