name: Temporary FAQ Prettier Artifact

on:
  push:
    branches:
      - wave/social-response-faq-expansion

permissions:
  contents: write

jobs:
  format-artifact:
    if: github.repository == 'luizanunciostoca/toca-mcp-server' && github.ref == 'refs/heads/wave/social-response-faq-expansion'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format only FAQ expansion files
        run: >-
          pnpm exec prettier --write
          src/crm/social-engagement-classifier.ts
          src/instagram-engagement/knowledge-base-ingest.ts
          src/instagram-engagement/knowledge-snapshot-current.ts
          src/instagram-engagement/processor.ts
          src/instagram-engagement/ticket-information.ts
          test/instagram-engagement-policy.test.ts

      - name: Verify formatted file boundary
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          allowed='^(src/crm/social-engagement-classifier\.ts|src/instagram-engagement/knowledge-base-ingest\.ts|src/instagram-engagement/knowledge-snapshot-current\.ts|src/instagram-engagement/processor\.ts|src/instagram-engagement/ticket-information\.ts|test/instagram-engagement-policy\.test\.ts)$'
          for path in "${changed[@]}"; do
            [[ "$path" =~ $allowed ]] || { echo "UNEXPECTED_FORMAT_PATH=$path"; exit 1; }
          done

      - name: Verify formatted files
        run: >-
          pnpm exec prettier --check
          src/crm/social-engagement-classifier.ts
          src/instagram-engagement/knowledge-base-ingest.ts
          src/instagram-engagement/knowledge-snapshot-current.ts
          src/instagram-engagement/processor.ts
          src/instagram-engagement/ticket-information.ts
          test/instagram-engagement-policy.test.ts

      - name: Commit exact Prettier output when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'PRETTIER_ALREADY_CANONICAL=true'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/crm/social-engagement-classifier.ts \
            src/instagram-engagement/knowledge-base-ingest.ts \
            src/instagram-engagement/knowledge-snapshot-current.ts \
            src/instagram-engagement/processor.ts \
            src/instagram-engagement/ticket-information.ts \
            test/instagram-engagement-policy.test.ts
          git commit -m 'style(instagram): apply canonical FAQ formatting'
          git push origin HEAD:wave/social-response-faq-expansion
