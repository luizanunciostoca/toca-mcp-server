name: Temporary FAQ Prettier Artifact

on:
  push:
    branches:
      - wave/social-response-faq-expansion

permissions:
  contents: read

jobs:
  format-artifact:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format only FAQ expansion files
        run: >-
          pnpm exec prettier --write
          src/crm/social-engagement-classifier.ts
          src/instagram-engagement/knowledge-base-ingest.ts
          src/instagram-engagement/knowledge-snapshot-current.ts
          src/instagram-engagement/processor.ts
          src/instagram-engagement/ticket-information.ts
          test/instagram-engagement-policy.test.ts

      - name: Verify formatted files
        run: >-
          pnpm exec prettier --check
          src/crm/social-engagement-classifier.ts
          src/instagram-engagement/knowledge-base-ingest.ts
          src/instagram-engagement/knowledge-snapshot-current.ts
          src/instagram-engagement/processor.ts
          src/instagram-engagement/ticket-information.ts
          test/instagram-engagement-policy.test.ts

      - name: Upload formatted files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: faq-prettier-${{ github.sha }}
          path: |
            src/crm/social-engagement-classifier.ts
            src/instagram-engagement/knowledge-base-ingest.ts
            src/instagram-engagement/knowledge-snapshot-current.ts
            src/instagram-engagement/processor.ts
            src/instagram-engagement/ticket-information.ts
            test/instagram-engagement-policy.test.ts
          if-no-files-found: error
          retention-days: 1
