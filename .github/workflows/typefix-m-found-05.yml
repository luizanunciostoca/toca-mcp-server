name: M-FOUND-05 Typefix

on:
  push:
    branches:
      - feat/m-found-05-approval-atomicity

permissions:
  contents: write

jobs:
  typefix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply remaining exact TypeScript fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/governance/approval-governance.ts')
          text = p.read_text()
          old = "  if (capability.primary_route_id) allowedRoutes.add(capability.primary_route_id);"
          new = "  if (capability.primary_route_id !== 'TRANSVERSAL')\n    allowedRoutes.add(capability.primary_route_id);"
          if text.count(old) != 1:
              raise SystemExit(f'PATCH_ANCHOR_COUNT_INVALID:{text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Validate exact result
        run: |
          pnpm exec prettier --write src/governance/approval-governance.ts
          pnpm format:check
          pnpm typecheck
      - name: Commit validated fix and remove temporary workflow
        run: |
          rm .github/workflows/typefix-m-found-05.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: narrow approval primary route before reservation"
      - name: Push validated result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:feat/m-found-05-approval-atomicity"
