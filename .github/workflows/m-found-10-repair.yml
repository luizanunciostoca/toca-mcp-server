name: M-FOUND-10 Repair

on:
  push:
    branches: [feat/m-found-10-crm-core-records]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preserve terminal CRM evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          contracts = Path('src/crm/crm-records.ts')
          text = contracts.read_text()
          replacements = {
              "  } else if (record.disqualifiedReason !== null) {\n    throw new Error('CRM_LEAD_DISQUALIFIED_REASON_NOT_ALLOWED');\n  }":
              "  } else if (record.status !== 'ARCHIVED' && record.disqualifiedReason !== null) {\n    throw new Error('CRM_LEAD_DISQUALIFIED_REASON_NOT_ALLOWED');\n  }",
              "  if (['WON', 'LOST', 'CANCELED'].includes(record.status) && record.closedAt === null) {\n    throw new Error('CRM_OPPORTUNITY_CLOSED_AT_REQUIRED');\n  }":
              "  if (record.status !== 'OPEN' && record.closedAt === null) {\n    throw new Error('CRM_OPPORTUNITY_CLOSED_AT_REQUIRED');\n  }",
              "  if (record.status !== 'LOST' && record.lossReason !== null) throw new Error('CRM_OPPORTUNITY_LOSS_REASON_NOT_ALLOWED');":
              "  if (!['LOST', 'ARCHIVED'].includes(record.status) && record.lossReason !== null) throw new Error('CRM_OPPORTUNITY_LOSS_REASON_NOT_ALLOWED');",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing contract pattern: {old[:80]}')
              text = text.replace(old, new)
          contracts.write_text(text)

          migration = Path('migrations/012_crm_core_records.sql')
          text = migration.read_text()
          replacements = {
              "check (status = 'DISQUALIFIED' or disqualified_reason is null)":
              "check (status in ('DISQUALIFIED', 'ARCHIVED') or disqualified_reason is null)",
              "check (status not in ('WON', 'LOST', 'CANCELED') or closed_at is not null)":
              "check (status = 'OPEN' or closed_at is not null)",
              "check (status = 'LOST' or loss_reason is null)":
              "check (status in ('LOST', 'ARCHIVED') or loss_reason is null)",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing migration pattern: {old}')
              text = text.replace(old, new)
          migration.write_text(text)

          tests = Path('test/crm-core-records.test.ts')
          text = tests.read_text()
          lead_anchor = "    expect(() => validateLeadRecord({ ...lead, status: 'CONVERTED', qualification: 'MARKETING_QUALIFIED' })).toThrow(\n      'CRM_LEAD_CONVERTED_REQUIRES_SALES_QUALIFICATION',\n    );"
          lead_extra = lead_anchor + "\n    expect(() =>\n      validateLeadRecord({\n        ...lead,\n        status: 'ARCHIVED',\n        qualification: 'DISQUALIFIED',\n        disqualifiedReason: 'No commercial fit',\n      }),\n    ).not.toThrow();"
          if lead_anchor not in text:
              raise SystemExit('missing lead test anchor')
          text = text.replace(lead_anchor, lead_extra)
          opp_anchor = "    expect(() => validateOpportunityRecord(opportunity)).not.toThrow();"
          opp_extra = opp_anchor + "\n    expect(() =>\n      validateOpportunityRecord({\n        ...opportunity,\n        status: 'ARCHIVED',\n        closedAt: '2026-08-15T06:00:00.000Z',\n        lossReason: 'Budget',\n      }),\n    ).not.toThrow();"
          if opp_anchor not in text:
              raise SystemExit('missing opportunity test anchor')
          text = text.replace(opp_anchor, opp_extra)
          tests.write_text(text)
          PY
      - name: Format repository
        run: pnpm format
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/crm/crm-records.ts migrations/012_crm_core_records.sql test/crm-core-records.test.ts src/persistence/postgres-crm-core-store.ts src/persistence/postgres-internal-audit-ledger.ts docs/checkpoints/m-found-10-crm-core-records.md .github/workflows/m-found-10-repair.yml
          git commit -m "fix: preserve CRM terminal evidence and apply formatting"
          git push
