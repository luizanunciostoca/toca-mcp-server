name: RETIRED — Instagram Publication Worker GCP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Retired control-plane marker
        shell: bash
        run: |
          set -euo pipefail
          echo 'LEGACY_GCP_INSTAGRAM_PUBLICATION_WORKER_RETIRED=1'
          echo 'Canonical publication transport is .github/workflows/github-native-instagram-publisher.yml'

