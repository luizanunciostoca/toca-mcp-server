name: Marketing Autopilot Publication — Legacy Retired

on:
  push:
    branches:
      - main
    paths:
      - control/marketing-autopilot-publication-command.json

permissions:
  contents: read

concurrency:
  group: marketing-autopilot-instagram-publication-legacy-retired
  cancel-in-progress: false

jobs:
  legacy-retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm legacy GCP publication lane is retired
        shell: bash
        run: |
          set -euo pipefail
          echo "LEGACY_GCP_MARKETING_AUTOPILOT_PUBLICATION=RETIRED"
          echo "Canonical execution lane: .github/workflows/github-native-instagram-publisher.yml"
          echo "No provider write, Google Cloud authentication, Cloud Run, Cloud SQL, GCS, WIF or TOCA_POSTGRES action is executed by this workflow."
