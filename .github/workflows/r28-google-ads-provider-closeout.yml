name: R28 Google Ads Provider Closeout

on:
  push:
    branches:
      - ops/r28-google-ads-provider-closeout-20260816
    paths:
      - '.github/workflows/r28-google-ads-provider-closeout.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: r28-google-ads-provider-closeout
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_ARTIFACT_REPOSITORY: toca-mcp
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  CLOUD_RUN_SERVICE: toca-mcp-production

jobs:
  readiness-read:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Checkout exact operational head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Authenticate deployer to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Inspect production runtime and credential references
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_JSON="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$SERVICE_JSON" > /tmp/service.json

          env_value() {
            jq -r --arg key "$1" '.spec.template.spec.containers[0].env[]? | select(.name == $key) | .value // empty' /tmp/service.json | head -n1
          }
          secret_name_for_env() {
            jq -r --arg key "$1" '.spec.template.spec.containers[0].env[]? | select(.name == $key) | .valueFrom.secretKeyRef.name // .valueSource.secretKeyRef.secret // empty' /tmp/service.json | head -n1
          }
          secret_version_for_env() {
            jq -r --arg key "$1" '.spec.template.spec.containers[0].env[]? | select(.name == $key) | .valueFrom.secretKeyRef.key // .valueSource.secretKeyRef.version // "latest"' /tmp/service.json | head -n1
          }

          PHASE="$(env_value GOOGLE_ADS_PHASE)"
          CUSTOMER_ID="$(env_value GOOGLE_ADS_CUSTOMER_ID)"
          LOGIN_CUSTOMER_ID="$(env_value GOOGLE_ADS_LOGIN_CUSTOMER_ID)"
          ACCESS_ENV_KEY="$(env_value GOOGLE_ADS_ACCESS_TOKEN_ENV_KEY)"
          DEV_ENV_KEY="$(env_value GOOGLE_ADS_DEVELOPER_TOKEN_ENV_KEY)"
          ALLOWED_CUSTOMER_ID="$(env_value GOOGLE_ADS_ALLOWED_CUSTOMER_ID)"
          CURRENCY="$(env_value GOOGLE_ADS_ALLOWED_CURRENCY)"
          MAX_BUDGET="$(env_value GOOGLE_ADS_MAX_DAILY_BUDGET_MICROS)"
          MINOR_MICROS="$(env_value GOOGLE_ADS_CURRENCY_MINOR_UNIT_MICROS)"
          LOCATIONS="$(env_value GOOGLE_ADS_ALLOWED_LOCATION_CRITERION_IDS)"
          LANGUAGES="$(env_value GOOGLE_ADS_ALLOWED_LANGUAGE_CRITERION_IDS)"

          ACCESS_SECRET=""
          ACCESS_VERSION="latest"
          DEV_SECRET=""
          DEV_VERSION="latest"
          if [ -n "$ACCESS_ENV_KEY" ]; then
            ACCESS_SECRET="$(secret_name_for_env "$ACCESS_ENV_KEY")"
            ACCESS_VERSION="$(secret_version_for_env "$ACCESS_ENV_KEY")"
          fi
          if [ -n "$DEV_ENV_KEY" ]; then
            DEV_SECRET="$(secret_name_for_env "$DEV_ENV_KEY")"
            DEV_VERSION="$(secret_version_for_env "$DEV_ENV_KEY")"
          fi

          SECRET_CANDIDATES="$(gcloud secrets list --project "$GCP_PROJECT_ID" --format='value(name)' 2>/dev/null | grep -Ei 'google.*ads|ads.*google' || true)"
          REVISION="$(jq -r '.status.latestReadyRevisionName // empty' /tmp/service.json)"
          IMAGE="$(jq -r '.spec.template.spec.containers[0].image // empty' /tmp/service.json)"
          URL="$(jq -r '.status.url // empty' /tmp/service.json)"

          COMPLETE=true
          for required in "$CUSTOMER_ID" "$ACCESS_ENV_KEY" "$DEV_ENV_KEY" "$ALLOWED_CUSTOMER_ID" "$CURRENCY" "$MAX_BUDGET" "$MINOR_MICROS" "$LOCATIONS" "$ACCESS_SECRET" "$DEV_SECRET"; do
            if [ -z "$required" ]; then COMPLETE=false; fi
          done
          if [ "$PHASE" = "" ] || [ "$PHASE" = "OFF" ]; then COMPLETE=false; fi

          jq -n \
            --arg sourceSha "$GITHUB_SHA" \
            --arg service "$CLOUD_RUN_SERVICE" \
            --arg revision "$REVISION" \
            --arg image "$IMAGE" \
            --arg url "$URL" \
            --arg phase "$PHASE" \
            --arg customerId "$CUSTOMER_ID" \
            --arg loginCustomerId "$LOGIN_CUSTOMER_ID" \
            --arg allowedCustomerId "$ALLOWED_CUSTOMER_ID" \
            --arg currency "$CURRENCY" \
            --arg maxBudgetMicros "$MAX_BUDGET" \
            --arg currencyMinorUnitMicros "$MINOR_MICROS" \
            --arg locations "$LOCATIONS" \
            --arg languages "$LANGUAGES" \
            --arg accessEnvKey "$ACCESS_ENV_KEY" \
            --arg developerEnvKey "$DEV_ENV_KEY" \
            --arg accessSecret "$ACCESS_SECRET" \
            --arg accessSecretVersion "$ACCESS_VERSION" \
            --arg developerSecret "$DEV_SECRET" \
            --arg developerSecretVersion "$DEV_VERSION" \
            --arg secretCandidates "$SECRET_CANDIDATES" \
            --argjson complete "$COMPLETE" \
            '{schemaVersion:1,sourceSha:$sourceSha,service:$service,revision:$revision,image:$image,url:$url,googleAds:{phase:$phase,customerId:$customerId,loginCustomerId:($loginCustomerId|select(length>0)?),allowedCustomerId:$allowedCustomerId,currency:$currency,maxDailyBudgetMicros:$maxBudgetMicros,currencyMinorUnitMicros:$currencyMinorUnitMicros,allowedLocationCriterionIds:$locations,allowedLanguageCriterionIds:$languages,accessTokenEnvKey:$accessEnvKey,developerTokenEnvKey:$developerEnvKey,accessTokenSecretRef:{name:$accessSecret,version:$accessSecretVersion},developerTokenSecretRef:{name:$developerSecret,version:$developerSecretVersion},secretCandidates:($secretCandidates|split("\n")|map(select(length>0))),configurationComplete:$complete}}' \
            > r28-google-ads-runtime-readiness.json

          echo "complete=$COMPLETE" >> "$GITHUB_OUTPUT"
          echo "customer_id=$CUSTOMER_ID" >> "$GITHUB_OUTPUT"
          echo "login_customer_id=$LOGIN_CUSTOMER_ID" >> "$GITHUB_OUTPUT"
          echo "access_secret=$ACCESS_SECRET" >> "$GITHUB_OUTPUT"
          echo "access_version=$ACCESS_VERSION" >> "$GITHUB_OUTPUT"
          echo "developer_secret=$DEV_SECRET" >> "$GITHUB_OUTPUT"
          echo "developer_version=$DEV_VERSION" >> "$GITHUB_OUTPUT"
          echo "currency=$CURRENCY" >> "$GITHUB_OUTPUT"
          echo "GOOGLE_ADS_RUNTIME_CONFIGURATION_COMPLETE=$COMPLETE"

      - name: Configure immutable provider-read image
        if: steps.inspect.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          mkdir -p /tmp/r28-google-ads-read
          cat > /tmp/r28-google-ads-read/read.mjs <<'NODE'
          const cfg = {
            apiVersion: process.env.GOOGLE_ADS_API_VERSION || 'v25',
            customerId: String(process.env.GOOGLE_ADS_CUSTOMER_ID || '').replaceAll('-', ''),
            loginCustomerId: String(process.env.GOOGLE_ADS_LOGIN_CUSTOMER_ID || '').replaceAll('-', ''),
            accessToken: process.env.GOOGLE_ADS_ACCESS_TOKEN,
            developerToken: process.env.GOOGLE_ADS_DEVELOPER_TOKEN,
            sourceSha: process.env.SOURCE_SHA,
          };

          const cleanError = (error) => {
            const text = error instanceof Error ? error.message : String(error);
            return text.slice(0, 1200);
          };

          async function google(path, body, method = 'POST') {
            const response = await fetch(`https://googleads.googleapis.com/${cfg.apiVersion}${path}`, {
              method,
              headers: {
                Authorization: `Bearer ${cfg.accessToken}`,
                'developer-token': cfg.developerToken,
                ...(cfg.loginCustomerId ? {'login-customer-id': cfg.loginCustomerId} : {}),
                ...(body ? {'Content-Type':'application/json'} : {}),
              },
              ...(body ? {body: JSON.stringify(body)} : {}),
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) {
              const status = payload?.error?.status || `HTTP_${response.status}`;
              const message = payload?.error?.message || 'provider request failed';
              throw new Error(`GOOGLE_ADS_PROVIDER_ERROR:${status}:${message}`);
            }
            return {body: payload, requestId: response.headers.get('request-id') || null};
          }

          async function search(query) {
            return google(`/customers/${cfg.customerId}/googleAds:search`, {query});
          }

          const result = {
            schemaVersion: 1,
            sourceSha: cfg.sourceSha,
            apiVersion: cfg.apiVersion,
            customerId: cfg.customerId,
            loginCustomerId: cfg.loginCustomerId || null,
            oauth: {adwordsScope:false, expiresInSeconds:null},
            reads: {},
            billing: {available:false},
            verified: false,
            verifiedAt: new Date().toISOString(),
          };

          try {
            if (!cfg.customerId || !cfg.accessToken || !cfg.developerToken || !cfg.sourceSha) {
              throw new Error('GOOGLE_ADS_PROVIDER_READ_CONFIG_MISSING');
            }

            const tokenInfoResponse = await fetch(`https://oauth2.googleapis.com/tokeninfo?access_token=${encodeURIComponent(cfg.accessToken)}`);
            const tokenInfo = await tokenInfoResponse.json().catch(() => ({}));
            if (!tokenInfoResponse.ok) throw new Error(`GOOGLE_ADS_OAUTH_TOKENINFO_HTTP_${tokenInfoResponse.status}`);
            const scopes = String(tokenInfo.scope || '').split(/\s+/).filter(Boolean);
            result.oauth.adwordsScope = scopes.includes('https://www.googleapis.com/auth/adwords');
            result.oauth.expiresInSeconds = Number.isFinite(Number(tokenInfo.expires_in)) ? Number(tokenInfo.expires_in) : null;
            if (!result.oauth.adwordsScope) throw new Error('GOOGLE_ADS_OAUTH_SCOPE_ADWORDS_MISSING');

            const accessible = await google('/customers:listAccessibleCustomers', undefined, 'GET');
            const expectedResource = `customers/${cfg.customerId}`;
            const resourceNames = Array.isArray(accessible.body?.resourceNames) ? accessible.body.resourceNames : [];
            if (!resourceNames.includes(expectedResource)) throw new Error('GOOGLE_ADS_CUSTOMER_NOT_ACCESSIBLE');

            const account = await search('SELECT customer.id, customer.descriptive_name, customer.currency_code, customer.time_zone, customer.manager, customer.test_account, customer.status FROM customer LIMIT 1');
            const accountRows = Array.isArray(account.body?.results) ? account.body.results : [];
            if (accountRows.length !== 1) throw new Error('GOOGLE_ADS_ACCOUNT_INSPECT_EMPTY');
            result.reads.accountInspect = {requestId: account.requestId, result: accountRows[0]};

            const campaigns = await search("SELECT campaign.id, campaign.name, campaign.status, campaign.advertising_channel_type, campaign.campaign_budget, campaign_budget.amount_micros FROM campaign WHERE campaign.status != 'REMOVED' ORDER BY campaign.id DESC LIMIT 100");
            const campaignRows = Array.isArray(campaigns.body?.results) ? campaigns.body.results : [];
            result.reads.campaignsList = {requestId: campaigns.requestId, count: campaignRows.length, results: campaignRows};

            const end = new Date();
            const start = new Date(end.getTime() - 6 * 86400000);
            const iso = (d) => d.toISOString().slice(0,10);
            const insights = await search(`SELECT campaign.id, campaign.name, segments.date, metrics.impressions, metrics.clicks, metrics.cost_micros, metrics.conversions, metrics.conversions_value FROM campaign WHERE segments.date BETWEEN '${iso(start)}' AND '${iso(end)}' ORDER BY segments.date DESC LIMIT 100`);
            const insightRows = Array.isArray(insights.body?.results) ? insights.body.results : [];
            const totalCostMicros = insightRows.reduce((sum,row) => sum + Number(row?.metrics?.costMicros || 0), 0);
            result.reads.insightsGet = {requestId: insights.requestId, startDate: iso(start), endDate: iso(end), count: insightRows.length, totalCostMicros, results: insightRows};

            const conversions = await search("SELECT conversion_action.id, conversion_action.name, conversion_action.status, conversion_action.type, conversion_action.category, conversion_action.primary_for_goal FROM conversion_action WHERE conversion_action.status != 'REMOVED' LIMIT 100");
            const conversionRows = Array.isArray(conversions.body?.results) ? conversions.body.results : [];
            result.reads.conversionActionsList = {requestId: conversions.requestId, count: conversionRows.length, results: conversionRows};

            try {
              const billing = await search('SELECT billing_setup.id, billing_setup.status, billing_setup.payments_account_info.payments_account_id, billing_setup.payments_account_info.payments_profile_id FROM billing_setup LIMIT 20');
              const billingRows = Array.isArray(billing.body?.results) ? billing.body.results : [];
              result.billing = {available:true, requestId:billing.requestId, results:billingRows};
            } catch (error) {
              result.billing = {available:false, error:cleanError(error)};
            }

            result.verified = true;
          } catch (error) {
            result.error = cleanError(error);
          }

          console.log(`R28_GOOGLE_ADS_PROVIDER_READ_RESULT=${JSON.stringify(result)}`);
          NODE
          cat > /tmp/r28-google-ads-read/Dockerfile <<'DOCKER'
          FROM node:24-bookworm-slim
          WORKDIR /app
          COPY read.mjs ./read.mjs
          USER node
          CMD ["node", "read.mjs"]
          DOCKER
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/r28-google-ads-read:${GITHUB_SHA}"
          docker build -t "$IMAGE" /tmp/r28-google-ads-read
          docker push "$IMAGE"
          echo "READ_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "READ_JOB=toca-r28-google-ads-read-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Execute real Google Ads READs under production runtime identity
        if: steps.inspect.outputs.complete == 'true'
        shell: bash
        env:
          CUSTOMER_ID: ${{ steps.inspect.outputs.customer_id }}
          LOGIN_CUSTOMER_ID: ${{ steps.inspect.outputs.login_customer_id }}
          ACCESS_SECRET: ${{ steps.inspect.outputs.access_secret }}
          ACCESS_VERSION: ${{ steps.inspect.outputs.access_version }}
          DEVELOPER_SECRET: ${{ steps.inspect.outputs.developer_secret }}
          DEVELOPER_VERSION: ${{ steps.inspect.outputs.developer_version }}
        run: |
          set -euo pipefail
          cleanup() {
            gcloud run jobs delete "$READ_JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ENV_VARS="GOOGLE_ADS_CUSTOMER_ID=$CUSTOMER_ID,SOURCE_SHA=$GITHUB_SHA"
          if [ -n "$LOGIN_CUSTOMER_ID" ]; then
            ENV_VARS="$ENV_VARS,GOOGLE_ADS_LOGIN_CUSTOMER_ID=$LOGIN_CUSTOMER_ID"
          fi
          gcloud run jobs deploy "$READ_JOB" \
            --image "$READ_IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars "$ENV_VARS" \
            --set-secrets "GOOGLE_ADS_ACCESS_TOKEN=${ACCESS_SECRET}:${ACCESS_VERSION},GOOGLE_ADS_DEVELOPER_TOKEN=${DEVELOPER_SECRET}:${DEVELOPER_VERSION}" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 180s \
            --quiet
          gcloud run jobs execute "$READ_JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet

          RESULT_LINE="$(gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=${READ_JOB} AND textPayload:\"R28_GOOGLE_ADS_PROVIDER_READ_RESULT=\"" \
            --project "$GCP_PROJECT_ID" --freshness=20m --limit=20 --order=desc --format='value(textPayload)' \
            | grep 'R28_GOOGLE_ADS_PROVIDER_READ_RESULT=' | head -n1)"
          test -n "$RESULT_LINE"
          RESULT_JSON="${RESULT_LINE#R28_GOOGLE_ADS_PROVIDER_READ_RESULT=}"
          printf '%s\n' "$RESULT_JSON" | jq . > r28-google-ads-provider-read.json
          jq -e '.verified == true' r28-google-ads-provider-read.json >/dev/null || true
          echo "GOOGLE_ADS_PROVIDER_READ_EXECUTED=1"

      - name: Record explicit blocker when runtime configuration is incomplete
        if: steps.inspect.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          jq '. + {providerRead:{executed:false,reason:"RUNTIME_PROVIDER_CONFIGURATION_INCOMPLETE"}}' r28-google-ads-runtime-readiness.json > /tmp/final.json
          mv /tmp/final.json r28-google-ads-runtime-readiness.json
          echo 'GOOGLE_ADS_PROVIDER_READ_SKIPPED=RUNTIME_PROVIDER_CONFIGURATION_INCOMPLETE'

      - name: Upload sanitized R28 Google Ads evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r28-google-ads-provider-closeout-${{ github.sha }}
          path: |
            r28-google-ads-runtime-readiness.json
            r28-google-ads-provider-read.json
          if-no-files-found: warn
          retention-days: 90
