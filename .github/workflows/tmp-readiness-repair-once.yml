name: Temporary Readiness Repair

on:
  push:
    branches: [feat/readiness-gcp-observability-dr-next-20260820]

permissions:
  contents: write

jobs:
  repair-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          ref: feat/readiness-gcp-observability-dr-next-20260820
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Repair lint and canonical secret-provider contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/health/runtime-readiness.ts')
          s = p.read_text()
          for name in ['meta','whatsapp','email','google_ads','provider_credentials','critical_configuration']:
              s = s.replace(f"namedCheck('{name}', async () => {{", f"namedCheck('{name}', () => {{")
          old = "function namedCheck(name: string, check: () => Promise<void>): ReadinessCheck {\n  return { name, check };\n}"
          new = "function namedCheck(name: string, check: () => void | Promise<void>): ReadinessCheck {\n  return {\n    name,\n    check: async () => {\n      await check();\n    },\n  };\n}"
          if old not in s:
              raise SystemExit('namedCheck anchor not found')
          p.write_text(s.replace(old,new))

          p = Path('test/runtime-readiness.test.ts')
          s = p.read_text()
          anchor = "  const query = async (text: string, values?: readonly unknown[]) => {\n"
          if anchor not in s:
              raise SystemExit('fake query anchor not found')
          p.write_text(s.replace(anchor, anchor + "    await Promise.resolve();\n", 1))

          p = Path('.github/workflows/deploy-gcp.yml')
          s = p.read_text()
          old = 'append_env EMAIL_SENDGRID_API_KEY_SECRET_PROVIDER env'
          new = 'append_env EMAIL_SENDGRID_API_KEY_SECRET_PROVIDER gcp-secret-manager'
          if old not in s:
              raise SystemExit('SendGrid secret provider anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
          pnpm exec prettier --write src/health/runtime-readiness.ts test/runtime-readiness.test.ts .github/workflows/deploy-gcp.yml
          git rm .github/workflows/tmp-readiness-repair-once.yml
          git config user.name 'TOCA OS Integration'
          git config user.email 'actions@users.noreply.github.com'
          git add src/health/runtime-readiness.ts test/runtime-readiness.test.ts .github/workflows/deploy-gcp.yml
          git commit -m 'fix(platform): repair readiness lint and SendGrid secret binding'
          git push origin HEAD:feat/readiness-gcp-observability-dr-next-20260820
