name: Temporary Meta Messaging Diagnostics

on:
  push:
    branches:
      - feat/instagram-engagement-messaging
    paths:
      - '.github/workflows/tmp-meta-messaging-diagnostics.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  TOKEN_SECRET_ID: toca-meta-oauth-token
  PAGE_ID: '306103746115875'
  INSTAGRAM_ACCOUNT_ID: '17841402033495654'
  DIAG_JOB: toca-meta-messaging-diagnostics

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build read-only diagnostic image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/meta-messaging-diag
          cat > /tmp/meta-messaging-diag/diag.mjs <<'NODE'
          const oauthToken = process.env.META_ACCESS_TOKEN;
          const pageId = process.env.PAGE_ID;
          const accountId = process.env.INSTAGRAM_ACCOUNT_ID;
          if (!oauthToken || !pageId || !accountId) throw new Error('DIAG_CONFIGURATION_MISSING');

          async function graph(path, token, stage) {
            const response = await fetch(`https://graph.facebook.com/v24.0/${path}`, {
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
            });
            const body = await response.json().catch(() => ({}));
            console.log(`SAFE_META_DIAG_${stage}_HTTP=${response.status}`);
            return { response, body };
          }

          const permissions = await graph('me/permissions', oauthToken, 'PERMISSIONS');
          if (!permissions.response.ok || !Array.isArray(permissions.body?.data)) throw new Error('DIAG_PERMISSIONS_FAILED');
          const granted = new Set(
            permissions.body.data
              .filter((item) => item?.status === 'granted' && typeof item?.permission === 'string')
              .map((item) => item.permission),
          );
          console.log(`SAFE_META_DIAG_PAGES_MESSAGING_GRANTED=${granted.has('pages_messaging') ? 1 : 0}`);
          console.log(`SAFE_META_DIAG_INSTAGRAM_MANAGE_MESSAGES_GRANTED=${granted.has('instagram_manage_messages') ? 1 : 0}`);
          console.log(`SAFE_META_DIAG_PAGES_READ_ENGAGEMENT_GRANTED=${granted.has('pages_read_engagement') ? 1 : 0}`);
          console.log(`SAFE_META_DIAG_INSTAGRAM_BASIC_GRANTED=${granted.has('instagram_basic') ? 1 : 0}`);

          const page = await graph(`${pageId}?fields=access_token,instagram_business_account`, oauthToken, 'PAGE');
          if (!page.response.ok) throw new Error('DIAG_PAGE_FAILED');
          const pageToken = page.body?.access_token;
          const linkedId = page.body?.instagram_business_account?.id;
          console.log(`SAFE_META_DIAG_PAGE_TOKEN_PRESENT=${typeof pageToken === 'string' && pageToken.length > 0 ? 1 : 0}`);
          console.log(`SAFE_META_DIAG_LINKED_ACCOUNT_MATCH=${linkedId === accountId ? 1 : 0}`);
          if (typeof pageToken !== 'string' || pageToken.length === 0) throw new Error('DIAG_PAGE_TOKEN_MISSING');

          for (const [label, path] of [
            ['PAGE_SUBSCRIBED_APPS', `${pageId}/subscribed_apps?fields=id,subscribed_fields`],
            ['IG_SUBSCRIBED_APPS', `${accountId}/subscribed_apps?fields=id,subscribed_fields`],
            ['IG_CONVERSATIONS', `${accountId}/conversations?platform=instagram&fields=id&limit=5`],
            ['PAGE_IG_CONVERSATIONS', `${pageId}/conversations?platform=instagram&fields=id&limit=5`],
          ]) {
            const result = await graph(path, pageToken, label);
            const data = Array.isArray(result.body?.data) ? result.body.data : [];
            console.log(`SAFE_META_DIAG_${label}_DATA_COUNT=${data.length}`);
            const fields = data.flatMap((item) => Array.isArray(item?.subscribed_fields) ? item.subscribed_fields : []);
            if (label.endsWith('SUBSCRIBED_APPS')) {
              console.log(`SAFE_META_DIAG_${label}_MESSAGES_SUBSCRIBED=${fields.includes('messages') ? 1 : 0}`);
            }
          }
          NODE

          cat > /tmp/meta-messaging-diag/Dockerfile <<'DOCKER'
          FROM node:24-bookworm-slim
          WORKDIR /app
          COPY diag.mjs ./diag.mjs
          USER node
          CMD ["node", "diag.mjs"]
          DOCKER

          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/toca-mcp/meta-messaging-diag:${GITHUB_SHA}"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" /tmp/meta-messaging-diag
          docker push "$IMAGE"
          echo "DIAG_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Run read-only diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            gcloud run jobs delete "$DIAG_JOB" --project "$PROJECT_ID" --region "$REGION" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          gcloud run jobs deploy "$DIAG_JOB" \
            --image "$DIAG_IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars "PAGE_ID=$PAGE_ID,INSTAGRAM_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID" \
            --set-secrets "META_ACCESS_TOKEN=$TOKEN_SECRET_ID:latest" \
            --max-retries 0 --task-timeout 120s --quiet

          set +e
          gcloud run jobs execute "$DIAG_JOB" --project "$PROJECT_ID" --region "$REGION" --wait --quiet
          STATUS=$?
          set -e

          gcloud logging read \
            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$DIAG_JOB\" AND textPayload:\"SAFE_META_DIAG_\"" \
            --project "$PROJECT_ID" --freshness=10m --limit=100 --format='value(textPayload)' \
            | grep '^SAFE_META_DIAG_' | sort -u || true
          exit "$STATUS"
