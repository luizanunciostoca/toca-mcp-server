name: Temporary Patch Readiness Buildx Driver

on:
  push:
    branches:
      - fix/instagram-gcp-readiness-buildx-driver-20260916
    paths:
      - '.github/workflows/tmp-patch-readiness-buildx.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/instagram-gcp-readiness-buildx-driver-20260916
          persist-credentials: false
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch exact workflow and contract test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/instagram-gcp-publication-execution-readiness.yml')
          lines = workflow_path.read_text().splitlines()
          marker = '      - name: Build and push exact application image by verified immutable digest'
          if lines.count(marker) != 1:
              raise SystemExit(f'workflow marker count={lines.count(marker)}')
          idx = lines.index(marker)
          insert = [
              '      - name: Setup Docker Buildx for provenance and SBOM attestations',
              '        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3',
              '        with:',
              '          driver: docker-container',
              '',
          ]
          if any('docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f' in line for line in lines):
              raise SystemExit('workflow already patched')
          lines[idx:idx] = insert
          workflow_path.write_text('\n'.join(lines) + '\n')

          test_path = Path('test/instagram-gcp-publication-execution-readiness.test.ts')
          test_lines = test_path.read_text().splitlines()
          method = "  it('binds execution to the build-produced digest and verifies the remote tag before deployment', () => {"
          if test_lines.count(method) != 1:
              raise SystemExit(f'test method count={test_lines.count(method)}')
          method_idx = test_lines.index(method)
          expectation = "    expect(workflow).toContain('docker buildx build');"
          candidates = [i for i in range(method_idx + 1, min(len(test_lines), method_idx + 30)) if test_lines[i] == expectation]
          if len(candidates) != 1:
              raise SystemExit(f'test expectation count={len(candidates)}')
          exp_idx = candidates[0]
          test_insert = [
              '    const setupBuildx = workflow.indexOf(',
              "      'docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f',",
              '    );',
              "    const build = workflow.indexOf('docker buildx build');",
              '    expect(setupBuildx).toBeGreaterThanOrEqual(0);',
              '    expect(build).toBeGreaterThan(setupBuildx);',
              "    expect(workflow).toContain('driver: docker-container');",
          ]
          test_lines[exp_idx:exp_idx] = test_insert
          test_path.write_text('\n'.join(test_lines) + '\n')
          PY
          pnpm prettier --write \
            .github/workflows/instagram-gcp-publication-execution-readiness.yml \
            test/instagram-gcp-publication-execution-readiness.test.ts
          git diff --check
          git diff -- .github/workflows/instagram-gcp-publication-execution-readiness.yml test/instagram-gcp-publication-execution-readiness.test.ts
      - name: Create detached blobs and record manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          create_blob() {
            local file="$1"
            local encoded
            encoded="$(base64 -w0 "$file")"
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}/git/blobs" \
              --data "$(jq -nc --arg content "$encoded" '{content:$content,encoding:"base64"}')" \
              | jq -r '.sha'
          }
          workflow_sha="$(create_blob .github/workflows/instagram-gcp-publication-execution-readiness.yml)"
          test_sha="$(create_blob test/instagram-gcp-publication-execution-readiness.test.ts)"
          [[ "$workflow_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$test_sha" =~ ^[0-9a-f]{40}$ ]]
          manifest="$(jq -nc --arg workflow "$workflow_sha" --arg test "$test_sha" '{workflow_blob:$workflow,test_blob:$test}')"
          manifest_b64="$(printf '%s\n' "$manifest" | base64 -w0)"
          curl --fail --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${api}/contents/control/tmp-readiness-buildx-blobs.json" \
            --data "$(jq -nc --arg message 'chore(ci): record readiness buildx blob SHAs' --arg content "$manifest_b64" --arg branch 'fix/instagram-gcp-readiness-buildx-driver-20260916' '{message:$message,content:$content,branch:$branch}')" >/dev/null
          echo "WORKFLOW_BLOB=$workflow_sha"
          echo "TEST_BLOB=$test_sha"
