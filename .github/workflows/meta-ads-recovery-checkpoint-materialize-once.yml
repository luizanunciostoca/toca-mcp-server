name: Meta Ads Recovery Checkpoint Materialize Once

on:
  push:
    branches: [fix/meta-ads-create-paused-recovery-checkpoint]
    paths: ['.github/workflows/meta-ads-recovery-checkpoint-materialize-once.yml']

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Assert exact clean base
        shell: bash
        run: |
          set -euo pipefail
          BASE='0f812077c84cea92547352320e2cc859ec832003'
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(git diff --name-only "$BASE" HEAD)" = '.github/workflows/meta-ads-recovery-checkpoint-materialize-once.yml'

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Materialize recovery checkpoint hardening
        shell: bash
        run: |
          set -euo pipefail

          cat > src/providers/meta-ads/meta-ads-smoke-execution.ts <<'EOF'
          import type { ControlledCreatePausedResult } from './meta-ads-controlled-write.js';
          import type { MetaAdsProviderSmokeSnapshot } from './meta-ads-smoke-readiness.js';

          export interface MetaAdsProviderCreationCheckpoint extends ControlledCreatePausedResult {
            readonly smokeId: string;
            readonly campaignName: string;
            readonly approvedRequestSha256: string;
          }

          export interface MetaAdsCreatePausedSettlementContext {
            readonly smokeId: string;
            readonly campaignName: string;
            readonly approvedRequestSha256: string;
          }

          export interface MetaAdsCreatePausedSettlementDependencies {
            readonly createPaused: () => Promise<ControlledCreatePausedResult>;
            readonly checkpointCreated: (
              checkpoint: MetaAdsProviderCreationCheckpoint,
            ) => Promise<void>;
            readonly reconcile: (
              result: ControlledCreatePausedResult,
            ) => Promise<MetaAdsProviderSmokeSnapshot>;
          }

          export class MetaAdsPostCreateSettlementError extends Error {
            readonly checkpoint: MetaAdsProviderCreationCheckpoint;
            readonly originalError: unknown;

            constructor(error: unknown, checkpoint: MetaAdsProviderCreationCheckpoint) {
              super(error instanceof Error ? error.message : String(error));
              this.name = 'MetaAdsPostCreateSettlementError';
              this.checkpoint = checkpoint;
              this.originalError = error;
            }
          }

          export async function runMetaAdsCreatePausedSettlement(
            context: MetaAdsCreatePausedSettlementContext,
            dependencies: MetaAdsCreatePausedSettlementDependencies,
          ): Promise<{
            readonly result: ControlledCreatePausedResult;
            readonly checkpoint: MetaAdsProviderCreationCheckpoint;
            readonly providerVerification: MetaAdsProviderSmokeSnapshot;
          }> {
            const result = await dependencies.createPaused();
            const checkpoint: MetaAdsProviderCreationCheckpoint = {
              smokeId: context.smokeId,
              campaignName: context.campaignName,
              approvedRequestSha256: context.approvedRequestSha256,
              ...result,
            };

            try {
              await dependencies.checkpointCreated(checkpoint);
              if (result.requestSha256 !== context.approvedRequestSha256) {
                throw new Error('META_ADS_SMOKE_PROVIDER_RESULT_SHA_MISMATCH');
              }
              const providerVerification = await dependencies.reconcile(result);
              return { result, checkpoint, providerVerification };
            } catch (error) {
              throw new MetaAdsPostCreateSettlementError(error, checkpoint);
            }
          }

          export function metaAdsProviderCreationCheckpointFromError(
            error: unknown,
          ): MetaAdsProviderCreationCheckpoint | undefined {
            return error instanceof MetaAdsPostCreateSettlementError ? error.checkpoint : undefined;
          }
          EOF

          cat > test/meta-ads-smoke-execution.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import type { ControlledCreatePausedResult } from '../src/providers/meta-ads/meta-ads-controlled-write.js';
          import {
            metaAdsProviderCreationCheckpointFromError,
            runMetaAdsCreatePausedSettlement,
          } from '../src/providers/meta-ads/meta-ads-smoke-execution.js';
          import type { MetaAdsProviderSmokeSnapshot } from '../src/providers/meta-ads/meta-ads-smoke-readiness.js';

          const requestSha256 = 'a'.repeat(64);
          const result: ControlledCreatePausedResult = {
            requestSha256,
            campaignId: 'campaign-1',
            adSetId: 'adset-1',
            creativeIds: ['creative-1'],
            adIds: ['ad-1'],
            status: 'PAUSED',
          };
          const snapshot: MetaAdsProviderSmokeSnapshot = {
            campaign: { id: 'campaign-1', status: 'PAUSED', effective_status: 'PAUSED' },
            adSet: { id: 'adset-1', status: 'PAUSED', effective_status: 'PAUSED' },
            ads: [{ id: 'ad-1', status: 'PAUSED', effective_status: 'PAUSED' }],
          };
          const context = {
            smokeId: 'smoke-1',
            campaignName: 'TOCA | P0 SMOKE CREATE_PAUSED | smoke-1',
            approvedRequestSha256: requestSha256,
          };

          describe('Meta Ads CREATE_PAUSED recovery checkpoint', () => {
            it('checkpoints provider IDs before settlement polling', async () => {
              const order: string[] = [];
              const settled = await runMetaAdsCreatePausedSettlement(context, {
                createPaused: async () => {
                  order.push('create');
                  return result;
                },
                checkpointCreated: async (checkpoint) => {
                  order.push('checkpoint');
                  expect(checkpoint).toMatchObject({
                    campaignId: 'campaign-1',
                    adSetId: 'adset-1',
                    creativeIds: ['creative-1'],
                    adIds: ['ad-1'],
                    approvedRequestSha256: requestSha256,
                  });
                },
                reconcile: async (created) => {
                  order.push('reconcile');
                  expect(created).toBe(result);
                  return snapshot;
                },
              });

              expect(order).toEqual(['create', 'checkpoint', 'reconcile']);
              expect(settled.providerVerification).toBe(snapshot);
            });

            it('preserves exact IDs and approved hash when settlement times out without recreating', async () => {
              let createCalls = 0;
              let checkpointCalls = 0;
              let caught: unknown;

              try {
                await runMetaAdsCreatePausedSettlement(context, {
                  createPaused: async () => {
                    createCalls += 1;
                    return result;
                  },
                  checkpointCreated: async () => {
                    checkpointCalls += 1;
                  },
                  reconcile: async () => {
                    throw new Error('META_ADS_SMOKE_PROVIDER_RECONCILIATION_TIMEOUT');
                  },
                });
              } catch (error) {
                caught = error;
              }

              expect(createCalls).toBe(1);
              expect(checkpointCalls).toBe(1);
              expect(caught).toBeInstanceOf(Error);
              expect((caught as Error).message).toBe('META_ADS_SMOKE_PROVIDER_RECONCILIATION_TIMEOUT');
              expect(metaAdsProviderCreationCheckpointFromError(caught)).toEqual({
                smokeId: 'smoke-1',
                campaignName: context.campaignName,
                approvedRequestSha256: requestSha256,
                ...result,
              });
            });

            it('preserves the provider checkpoint even if durable checkpoint persistence itself fails', async () => {
              let createCalls = 0;
              let reconcileCalls = 0;
              let caught: unknown;

              try {
                await runMetaAdsCreatePausedSettlement(context, {
                  createPaused: async () => {
                    createCalls += 1;
                    return result;
                  },
                  checkpointCreated: async () => {
                    throw new Error('AUDIT_CHECKPOINT_WRITE_FAILED');
                  },
                  reconcile: async () => {
                    reconcileCalls += 1;
                    return snapshot;
                  },
                });
              } catch (error) {
                caught = error;
              }

              expect(createCalls).toBe(1);
              expect(reconcileCalls).toBe(0);
              expect((caught as Error).message).toBe('AUDIT_CHECKPOINT_WRITE_FAILED');
              expect(metaAdsProviderCreationCheckpointFromError(caught)?.campaignId).toBe('campaign-1');
            });
          });
          EOF

          python - <<'PY'
          from pathlib import Path

          path = Path('src/meta-ads-create-paused-smoke.ts')
          text = path.read_text()
          import_anchor = "import { MetaAdsControlledGraphProvider } from './providers/meta-ads/meta-ads-controlled-graph-provider.js';\n"
          import_insert = import_anchor + "import {\n  metaAdsProviderCreationCheckpointFromError,\n  runMetaAdsCreatePausedSettlement,\n} from './providers/meta-ads/meta-ads-smoke-execution.js';\n"
          if import_anchor not in text:
              raise SystemExit('smoke import anchor missing')
          text = text.replace(import_anchor, import_insert, 1)

          old = """  try {\n    const result = await service.createPaused(plan, approvedSha256);\n    const providerVerification = await reconcileProviderPaused(\n      result.campaignId,\n      result.adSetId,\n      result.adIds,\n    );\n\n    await pool.query(\n"""
          new = """  try {\n    const settled = await runMetaAdsCreatePausedSettlement(\n      {\n        smokeId,\n        campaignName: plan.campaign.name,\n        approvedRequestSha256: approvedSha256,\n      },\n      {\n        createPaused: () => service.createPaused(plan, approvedSha256),\n        checkpointCreated: async (checkpoint) => {\n          console.log(`META_ADS_SMOKE_PROVIDER_CHECKPOINT=${JSON.stringify(checkpoint)}`);\n          await pool.query(\n            `insert into audit_events\n               (correlation_id, actor_id, tool_name, risk_class, decision, normalized_payload, provider_result)\n             values ($1, $2, $3, $4, $5, $6::jsonb, $7::jsonb)`,\n            [\n              correlationId,\n              'github-actions/provider-smoke',\n              'meta_ads.campaign.create_paused',\n              'WRITE_EXTERNAL',\n              'SMOKE_PROVIDER_CREATED',\n              JSON.stringify({\n                requestSha256: approvedSha256,\n                smokeId,\n                campaignName: plan.campaign.name,\n              }),\n              JSON.stringify(checkpoint),\n            ],\n          );\n        },\n        reconcile: (result) =>\n          reconcileProviderPaused(result.campaignId, result.adSetId, result.adIds),\n      },\n    );\n    const { result, providerVerification } = settled;\n\n    await pool.query(\n"""
          if old not in text:
              raise SystemExit('execute settlement anchor missing')
          text = text.replace(old, new, 1)

          old_catch = """        JSON.stringify({ error: normalizeError(error) }),\n"""
          new_catch = """        JSON.stringify({\n          error: normalizeError(error),\n          ...(metaAdsProviderCreationCheckpointFromError(error)\n            ? { providerCheckpoint: metaAdsProviderCreationCheckpointFromError(error) }\n            : {}),\n        }),\n"""
          if old_catch not in text:
              raise SystemExit('catch provider result anchor missing')
          text = text.replace(old_catch, new_catch, 1)
          path.write_text(text)

          checkpoint = Path('docs/checkpoints/meta-ads-provider-settlement-readiness-v2.md')
          doc = checkpoint.read_text()
          doc = doc.replace(
              'Status: **PRIMARY PREPARE VALIDATED / CREATE_PAUSED PENDING — NO WRITE / NO SPEND**',
              'Status: **PRIMARY CREATE_PAUSED PROVIDER-VALIDATED — PAUSED / ZERO SPEND / NO ACTIVATION**',
              1,
          )
          doc = doc.replace(
              'Current reconciliation baseline: `main@808454749b1d56ae7c42a1f7cc543959da1ef391`.',
              'Current reconciliation baseline: `main@0f812077c84cea92547352320e2cc859ec832003`.',
              1,
          )
          boundary_start = "## Provider evidence boundary\n\nThe current primary account now has fresh provider proof for:\n"
          insert = """## Real primary-account CREATE_PAUSED evidence — PASS after read-only reconciliation\n\nA single exact-hash provider mutation was executed against primary account `311793958882290` from source `main@0f812077c84cea92547352320e2cc859ec832003`. The approved request SHA-256 was `47d719b08c31ca8db827e8d9c89c3f8374cf915ee22653ad270cdc0096c8d243`. The mutation used zero provider retries and introduced no activation path.\n\nGitHub Actions mutation run: `31920903042`. The provider created the requested resources, but the original bounded settlement loop timed out with `META_ADS_SMOKE_PROVIDER_RECONCILIATION_TIMEOUT`; the mutation was **not retried**. A subsequent GET-only reconciliation under the existing runtime identity, run `31921580945`, proved the exact provider state:\n\n- campaign `52618007729865`: configured `PAUSED`, effective `PAUSED`;\n- Ad Set `52618007731065`: configured `PAUSED`, effective `PAUSED`;\n- creative `2844574235935509`, bound to account `311793958882290`;\n- Ad `52618007737265`: configured `PAUSED`, effective `PAUSED`;\n- campaign -> Ad Set -> Ad -> creative relationships match exactly;\n- exactly one campaign, one Ad Set and one Ad matched the unique smoke descriptor;\n- `issues_info` empty and no failed delivery checks;\n- provider Insights returned no delivery rows and total spend was `0`;\n- no resource had effective status `ACTIVE`;\n- no activation call was made.\n\nSanitized read-back artifact: ID `9256521917`, digest `sha256:f70b4cd4a272588e1f5480eb8fd3a2f0172ecd5c643f1aede24fa25058422cf5`.\n\nThe delayed settlement exposed an observability/recovery gap rather than a failed write. This hardening records the returned provider IDs and approved hash immediately after `createPaused` returns and before settlement polling. Any later settlement/read-back failure therefore carries an immutable recovery checkpoint and must be reconciled by GET using those exact IDs; it must never trigger a blind second create.\n\n"""
          if boundary_start not in doc:
              raise SystemExit('checkpoint boundary anchor missing')
          doc = doc.replace(boundary_start, insert + boundary_start, 1)
          old_boundary = """The current primary account now has fresh provider proof for:\n\n1. granted `ads_management` permission;\n2. exact active ad account + `BRL` currency;\n3. Pixel assignment to that account;\n4. successful no-side-effect `validate_only` preflight with no created Ad ID.\n\nThis is sufficient to close the PREPARE readiness gate. It does **not** promote `meta_ads.campaign.create_paused` to production-validated write status because no provider mutation was performed.\n\nThe remaining controlled sequence is:\n\n5. explicit approved `CREATE_PAUSED` descriptor/hash bound to the exact prepared plan;\n6. one bounded provider mutation with no activation;\n7. settled provider read-back with campaign/ad set/ad remaining safely paused and with no issues/delivery failures;\n8. immutable audit evidence;\n9. zero activation and zero spend.\n\nUntil that write-and-readback sequence succeeds, lifecycle remains **IMPLEMENTED / PREPARE VALIDATED / CREATE_PAUSED PROVIDER SETTLEMENT PENDING**.\n"""
          new_boundary = """The current primary account now has fresh provider proof for:\n\n1. granted `ads_management` permission;\n2. exact active ad account + `BRL` currency;\n3. Pixel assignment to that account;\n4. successful no-side-effect `validate_only` preflight with no created Ad ID;\n5. one exact approved `CREATE_PAUSED` descriptor/hash;\n6. one bounded provider mutation with zero retries and no activation;\n7. exact provider resource identities for campaign, Ad Set, creative and Ad;\n8. settled GET-only provider read-back with campaign/Ad Set/Ad safely paused and without issues/delivery failures;\n9. zero activation and zero spend.\n\n`meta_ads.campaign.create_paused` is therefore **PRODUCTION_VALIDATED for controlled PAUSED-only creation on primary account `311793958882290`**. This does not validate or authorize activation, budget expansion, automatic retries, or spend.\n"""
          if old_boundary not in doc:
              raise SystemExit('checkpoint old boundary block missing')
          doc = doc.replace(old_boundary, new_boundary, 1)
          doc = doc.replace(
              '`CREATE_PAUSED` remains a separate controlled operation. It must use the exact prepared descriptor/hash, remain PAUSED-only, use zero mutation retries and require provider settlement/read-back. Activation and spend are not authorized by this checkpoint.',
              '`CREATE_PAUSED` is provider-validated only for exact approved PAUSED-only creation. Future executions must still use exact descriptor/hash binding, zero blind retries and provider read-back. Activation, budget expansion and spend are not validated or authorized by this checkpoint.',
              1,
          )
          checkpoint.write_text(doc)

          register = Path('docs/operations/provider-write-validation-register.md')
          reg = register.read_text()
          old_section = """Required sequence:\n\n1. reconcile #118 to the then-current `main` and pass exact-head Quality;\n2. granted `ads_management` proof;\n3. exact active ad account `311793958882290` + currency proof;\n4. exact Pixel assignment proof;\n5. provider `validate_only` preflight returns no created Ad ID;\n6. explicit approved `CREATE_PAUSED` descriptor/hash;\n7. one bounded create-paused mutation;\n8. provider states settle safely as paused with no `issues_info` or failed delivery checks;\n9. immutable evidence/read-back;\n10. zero activation and zero spend.\n\nLifecycle conclusion: **IMPLEMENTED / fresh CREATE_PAUSED provider settlement validation pending; do not activate or spend**.\n"""
          new_section = """Production validation evidence:\n\n1. fresh PREPARE on primary account `311793958882290` passed provider `validate_only`;\n2. exact approved request SHA-256 `47d719b08c31ca8db827e8d9c89c3f8374cf915ee22653ad270cdc0096c8d243`;\n3. one bounded CREATE_PAUSED mutation in run `31920903042`, with zero retries and no activation;\n4. delayed provider settlement caused the original bounded poll to time out, so the mutation was not retried;\n5. GET-only reconciliation run `31921580945` recovered exact IDs `52618007729865` / `52618007731065` / `2844574235935509` / `52618007737265`;\n6. campaign, Ad Set and Ad all settled configured/effective `PAUSED`, with no issues or failed delivery checks;\n7. duplicate counts are exactly one and provider spend is `0`;\n8. sanitized read-back artifact `9256521917`, digest `sha256:f70b4cd4a272588e1f5480eb8fd3a2f0172ecd5c643f1aede24fa25058422cf5`.\n\nLifecycle conclusion: **PRODUCTION_VALIDATED for controlled CREATE_PAUSED on account `311793958882290`; activation, budget expansion and spend remain unvalidated and prohibited**.\n"""
          if old_section not in reg:
              raise SystemExit('provider register Meta Ads sequence block missing')
          reg = reg.replace(old_section, new_section, 1)
          register.write_text(reg)
          PY

          pnpm exec prettier --write \
            src/providers/meta-ads/meta-ads-smoke-execution.ts \
            src/meta-ads-create-paused-smoke.ts \
            test/meta-ads-smoke-execution.test.ts \
            docs/checkpoints/meta-ads-provider-settlement-readiness-v2.md \
            docs/operations/provider-write-validation-register.md

      - name: Validate focused hardening
        run: pnpm quality

      - name: Commit only permanent delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'luizidebook'
          git config user.email '47362223+luizidebook@users.noreply.github.com'
          git add \
            src/providers/meta-ads/meta-ads-smoke-execution.ts \
            src/meta-ads-create-paused-smoke.ts \
            test/meta-ads-smoke-execution.test.ts \
            docs/checkpoints/meta-ads-provider-settlement-readiness-v2.md \
            docs/operations/provider-write-validation-register.md
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix(meta-ads): checkpoint provider ids before settlement'
          git push origin HEAD:fix/meta-ads-create-paused-recovery-checkpoint
