name: GCP Staging Bootstrap Authority Preflight

on:
  pull_request:
    paths:
      - '.github/workflows/gcp-staging-bootstrap-authority-preflight.yml'

permissions:
  contents: read
  id-token: write

env:
  CANDIDATE_SHA: 7db1a6e5caf01f98b200257c4aeecc2f1b29550a
  STAGING_PROJECT_ID: toca-mcp-next-staging
  STAGING_PROJECT_NUMBER: '729069789107'
  REGION: southamerica-east1
  STAGING_MCP_SERVICE: toca-mcp-next-staging
  FAILED_MCP_REVISION: toca-mcp-next-staging-mcp-7db1a6e-46
  PROD_PROJECT_ID: toca-mcp-production
  PROD_PROJECT_NUMBER: '990081828836'
  PROD_WIF: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  INFRA_ADMIN_SA: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com

jobs:
  read-failed-revision-logs:
    name: Read failed staging revision logs with ephemeral access
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Assert immutable isolation boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$STAGING_PROJECT_ID" != "$PROD_PROJECT_ID"
          test "$STAGING_PROJECT_NUMBER" != "$PROD_PROJECT_NUMBER"
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.PROD_WIF }}
          service_account: ${{ env.INFRA_ADMIN_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Read logs and remove temporary permission
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud projects describe "$STAGING_PROJECT_ID" --format='value(projectNumber)')" = "$STAGING_PROJECT_NUMBER"
          MEMBER="serviceAccount:${INFRA_ADMIN_SA}"
          HAD_ROLE=false
          if gcloud projects get-iam-policy "$STAGING_PROJECT_ID" --format=json | jq -e --arg m "$MEMBER" '.bindings[]? | select(.role=="roles/logging.viewer") | (.members // []) | index($m) != null' >/dev/null; then
            HAD_ROLE=true
          else
            gcloud projects add-iam-policy-binding "$STAGING_PROJECT_ID" --member="$MEMBER" --role=roles/logging.viewer --condition=None --quiet >/dev/null
          fi
          cleanup() {
            if [[ "$HAD_ROLE" = false ]]; then
              gcloud projects remove-iam-policy-binding "$STAGING_PROJECT_ID" --member="$MEMBER" --role=roles/logging.viewer --condition=None --quiet >/dev/null || true
            fi
          }
          trap cleanup EXIT
          FILTER="resource.type=cloud_run_revision AND resource.labels.service_name=${STAGING_MCP_SERVICE} AND resource.labels.revision_name=${FAILED_MCP_REVISION}"
          echo 'FAILED_REVISION_LOGS_BEGIN'
          gcloud logging read "$FILTER" --project="$STAGING_PROJECT_ID" --limit=200 --order=asc --format='value(timestamp,severity,textPayload,jsonPayload.message,jsonPayload.error)'
          echo 'FAILED_REVISION_LOGS_END'
          echo 'EPHEMERAL_LOGGING_ACCESS_USED=YES'
          echo 'PRODUCTION_MUTATION_EXECUTED=NO'
