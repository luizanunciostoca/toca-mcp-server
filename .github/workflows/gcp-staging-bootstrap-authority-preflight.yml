name: GCP Staging Bootstrap Authority Preflight

on:
  pull_request:
    paths:
      - '.github/workflows/gcp-staging-bootstrap-authority-preflight.yml'

permissions:
  contents: read
  id-token: write

env:
  CANDIDATE_SHA: 7db1a6e5caf01f98b200257c4aeecc2f1b29550a
  PROD_PROJECT_ID: toca-mcp-production
  PROD_PROJECT_NUMBER: '990081828836'
  ORG_ID: '995529283213'
  BILLING_ACCOUNT: 017F93-60A594-4271D6
  STAGING_PROJECT_ID: toca-mcp-next-staging
  PROD_WIF: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  INFRA_ADMIN_SA: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com

jobs:
  authority-preflight:
    name: Read-only isolated staging handoff preflight
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 10
    steps:
      - name: Checkout frozen candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Assert exact frozen candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$STAGING_PROJECT_ID" != "$PROD_PROJECT_ID"
      - name: Authenticate infrastructure administrator via existing WIF
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.PROD_WIF }}
          service_account: ${{ env.INFRA_ADMIN_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Prove project billing isolation and local bootstrap authority
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          echo 'INFRA_ADMIN_AUTH=PASS'

          PROD_JSON="$(gcloud projects describe "$PROD_PROJECT_ID" --format=json)"
          STAGING_JSON="$(gcloud projects describe "$STAGING_PROJECT_ID" --format=json)"
          PROD_NUMBER="$(printf '%s' "$PROD_JSON" | jq -r '.projectNumber')"
          STAGING_NUMBER="$(printf '%s' "$STAGING_JSON" | jq -r '.projectNumber')"
          STAGING_PARENT_TYPE="$(printf '%s' "$STAGING_JSON" | jq -r '.parent.type')"
          STAGING_PARENT_ID="$(printf '%s' "$STAGING_JSON" | jq -r '.parent.id')"

          test "$PROD_NUMBER" = "$PROD_PROJECT_NUMBER"
          test "$STAGING_NUMBER" != "$PROD_PROJECT_NUMBER"
          test "$STAGING_PARENT_TYPE" = organization
          test "$STAGING_PARENT_ID" = "$ORG_ID"
          echo "STAGING_PROJECT_NUMBER=$STAGING_NUMBER"
          echo 'STAGING_PROJECT_IDENTITY_DISTINCT=PASS'

          STAGING_BILLING="$(gcloud billing projects describe "$STAGING_PROJECT_ID" --format=json)"
          test "$(printf '%s' "$STAGING_BILLING" | jq -r '.billingAccountName' | sed 's#^billingAccounts/##')" = "$BILLING_ACCOUNT"
          test "$(printf '%s' "$STAGING_BILLING" | jq -r '.billingEnabled')" = true
          echo 'STAGING_BILLING_LINK=PASS'

          STAGING_BODY='{"permissions":["serviceusage.services.enable","serviceusage.services.use","resourcemanager.projects.getIamPolicy","resourcemanager.projects.setIamPolicy","iam.serviceAccounts.create","iam.serviceAccounts.getIamPolicy","iam.serviceAccounts.setIamPolicy","iam.serviceAccounts.actAs","iam.workloadIdentityPools.create","iam.workloadIdentityPools.get","iam.workloadIdentityPools.update","iam.workloadIdentityPoolProviders.create","artifactregistry.repositories.create","artifactregistry.repositories.get","cloudsql.instances.create","cloudsql.instances.get","cloudsql.users.create","secretmanager.secrets.create","secretmanager.versions.add","run.services.create","run.services.get","run.services.setIamPolicy"]}'
          STAGING_HTTP="$(curl -sS -o /tmp/staging-perms.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$STAGING_BODY" \
            "https://cloudresourcemanager.googleapis.com/v3/projects/${STAGING_PROJECT_ID}:testIamPermissions")"
          test "$STAGING_HTTP" = 200
          jq -c '{permissions:(.permissions // [])}' /tmp/staging-perms.json

          EXPECTED=(
            serviceusage.services.enable
            resourcemanager.projects.getIamPolicy
            resourcemanager.projects.setIamPolicy
            iam.serviceAccounts.create
            iam.serviceAccounts.setIamPolicy
            iam.serviceAccounts.actAs
            iam.workloadIdentityPools.create
            iam.workloadIdentityPoolProviders.create
            artifactregistry.repositories.create
            cloudsql.instances.create
            secretmanager.secrets.create
            secretmanager.versions.add
            run.services.create
          )
          for permission in "${EXPECTED[@]}"; do
            if ! jq -e --arg p "$permission" '(.permissions // []) | index($p) != null' /tmp/staging-perms.json >/dev/null; then
              echo "MISSING_STAGING_PERMISSION=$permission"
              exit 1
            fi
          done

          echo 'STAGING_LOCAL_BOOTSTRAP_AUTHORITY=PASS'
          echo 'APPLICATION_MIGRATION_EXECUTED=NO'
          echo 'APPLICATION_DEPLOY_EXECUTED=NO'
          echo 'PROVIDER_MUTATION_EXECUTED=NO'
          echo 'HANDOFF_PREFLIGHT_READ_ONLY=true'
