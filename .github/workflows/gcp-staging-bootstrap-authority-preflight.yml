name: GCP Staging Bootstrap Authority Preflight

on:
  pull_request:
    paths:
      - '.github/workflows/gcp-staging-bootstrap-authority-preflight.yml'

permissions:
  contents: read
  id-token: write

env:
  CANDIDATE_SHA: 7db1a6e5caf01f98b200257c4aeecc2f1b29550a
  STAGING_PROJECT_ID: toca-mcp-next-staging
  STAGING_PROJECT_NUMBER: '729069789107'
  REGION: southamerica-east1
  STAGING_MCP_SERVICE: toca-mcp-next-staging
  CANDIDATE_TAG: candidate-7db1a6e
  STAGING_DEPLOYER_SA: toca-next-stg-deployer@toca-mcp-next-staging.iam.gserviceaccount.com
  STAGING_WIF: projects/729069789107/locations/global/workloadIdentityPools/github-staging/providers/github-toca-mcp-staging
  PROD_PROJECT_ID: toca-mcp-production
  PROD_PROJECT_NUMBER: '990081828836'

jobs:
  inspect-readiness:
    name: Inspect private candidate readiness directly
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Assert immutable isolated staging boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$STAGING_PROJECT_ID" != "$PROD_PROJECT_ID"
          test "$STAGING_PROJECT_NUMBER" != "$PROD_PROJECT_NUMBER"
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.STAGING_WIF }}
          service_account: ${{ env.STAGING_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Resolve zero-traffic candidate URL and call health/readiness
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud projects describe "$STAGING_PROJECT_ID" --format='value(projectNumber)')" = "$STAGING_PROJECT_NUMBER"
          SERVICE_JSON="$(gcloud run services describe "$STAGING_MCP_SERVICE" --project="$STAGING_PROJECT_ID" --region="$REGION" --format=json)"
          SERVICE_URL="$(printf '%s' "$SERVICE_JSON" | jq -r '.status.url')"
          CANDIDATE_REVISION="$(printf '%s' "$SERVICE_JSON" | jq -r --arg tag "$CANDIDATE_TAG" '.status.traffic[]? | select(.tag==$tag) | .revisionName')"
          CANDIDATE_URL="$(printf '%s' "$SERVICE_JSON" | jq -r --arg tag "$CANDIDATE_TAG" '.status.traffic[]? | select(.tag==$tag) | .url')"
          test -n "$SERVICE_URL"; test -n "$CANDIDATE_REVISION"; test -n "$CANDIDATE_URL"
          test "$(printf '%s' "$SERVICE_JSON" | jq -r --arg rev "$CANDIDATE_REVISION" '[.status.traffic[]? | select(.revisionName==$rev and (.percent // 0) > 0)] | length')" = 0
          TOKEN="$(gcloud auth print-identity-token --impersonate-service-account="$STAGING_DEPLOYER_SA" --audiences="$SERVICE_URL")"
          HEALTH_CODE="$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' -H "Authorization: Bearer $TOKEN" "$CANDIDATE_URL/healthz")"
          READY_CODE="$(curl --silent --show-error --output /tmp/ready.json --write-out '%{http_code}' -H "Authorization: Bearer $TOKEN" "$CANDIDATE_URL/readyz")"
          echo "CANDIDATE_REVISION=$CANDIDATE_REVISION"
          echo "CANDIDATE_TRAFFIC_PERCENT=0"
          echo "HEALTH_HTTP=$HEALTH_CODE"
          cat /tmp/health.json
          echo
          echo "READY_HTTP=$READY_CODE"
          cat /tmp/ready.json
          echo
          test "$HEALTH_CODE" = 200
          [[ "$READY_CODE" = 200 || "$READY_CODE" = 503 ]]
          jq -e '.status == "ready" or .status == "not_ready"' /tmp/ready.json >/dev/null
          echo 'DIRECT_PRIVATE_READINESS_DIAGNOSTIC=PASS'
          echo 'APPLICATION_MIGRATION_EXECUTED=NO'
          echo 'APPLICATION_DEPLOY_EXECUTED=NO'
          echo 'PROVIDER_MUTATION_EXECUTED=NO'
          echo 'PRODUCTION_MUTATION_EXECUTED=NO'
