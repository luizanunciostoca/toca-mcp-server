name: GCP Staging Bootstrap Authority Preflight

on:
  pull_request:
    paths:
      - '.github/workflows/gcp-staging-bootstrap-authority-preflight.yml'

permissions:
  contents: read
  id-token: write

env:
  CANDIDATE_SHA: 7db1a6e5caf01f98b200257c4aeecc2f1b29550a
  PROD_PROJECT_ID: toca-mcp-production
  PROD_PROJECT_NUMBER: '990081828836'
  PROD_WIF: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  INFRA_ADMIN_SA: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com
  BILLING_ACCOUNT: 017F93-60A594-4271D6

jobs:
  authority-preflight:
    name: Read-only staging bootstrap authority preflight
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 10
    steps:
      - name: Checkout frozen candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Assert exact frozen candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Authenticate infrastructure administrator via existing WIF
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.PROD_WIF }}
          service_account: ${{ env.INFRA_ADMIN_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Verify token parent billing and bootstrap permissions read-only
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          echo 'INFRA_ADMIN_AUTH=PASS'

          PROJECT_JSON="$(gcloud projects describe "$PROD_PROJECT_ID" --format=json)"
          printf '%s' "$PROJECT_JSON" | jq -c '{projectId,projectNumber,parent}'
          PARENT_TYPE="$(printf '%s' "$PROJECT_JSON" | jq -r '.parent.type // empty')"
          PARENT_ID="$(printf '%s' "$PROJECT_JSON" | jq -r '.parent.id // empty')"
          echo "PARENT_TYPE=${PARENT_TYPE:-none}"
          echo "PARENT_ID=${PARENT_ID:-none}"

          PROJECT_BODY='{"permissions":["serviceusage.services.enable","resourcemanager.projects.getIamPolicy","resourcemanager.projects.setIamPolicy","iam.serviceAccounts.create","iam.serviceAccounts.setIamPolicy","iam.workloadIdentityPools.create","iam.workloadIdentityPoolProviders.create","cloudsql.instances.create","secretmanager.secrets.create","run.services.create","artifactregistry.repositories.create"]}'
          PROJECT_HTTP="$(curl -sS -o /tmp/project-perms.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$PROJECT_BODY" \
            "https://cloudresourcemanager.googleapis.com/v3/projects/${PROD_PROJECT_ID}:testIamPermissions")"
          echo "PROJECT_TEST_IAM_HTTP=$PROJECT_HTTP"
          jq -c '{permissions:(.permissions // [])}' /tmp/project-perms.json || cat /tmp/project-perms.json

          ORG_BODY='{"permissions":["resourcemanager.organizations.get","resourcemanager.projects.create","resourcemanager.projects.move"]}'
          ORG_HTTP="$(curl -sS -o /tmp/org-perms.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$ORG_BODY" \
            "https://cloudresourcemanager.googleapis.com/v3/organizations/${PARENT_ID}:testIamPermissions")"
          echo "ORG_TEST_IAM_HTTP=$ORG_HTTP"
          jq -c '{permissions:(.permissions // [])}' /tmp/org-perms.json || cat /tmp/org-perms.json

          echo 'CLOUD_BILLING_API_STATE_BEGIN'
          gcloud services list --project "$PROD_PROJECT_ID" --enabled --filter='name:cloudbilling.googleapis.com' --format='value(name)' || true
          echo 'CLOUD_BILLING_API_STATE_END'

          echo 'PRODUCTION_BILLING_LINK_BEGIN'
          gcloud billing projects describe "$PROD_PROJECT_ID" --format='json(projectId,billingAccountName,billingEnabled)' || true
          echo 'PRODUCTION_BILLING_LINK_END'

          BILLING_BODY='{"permissions":["billing.accounts.get","billing.accounts.getIamPolicy","billing.accounts.list","billing.resourceAssociations.create"]}'
          BILLING_HTTP="$(curl -sS -o /tmp/billing-perms.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$BILLING_BODY" \
            "https://cloudbilling.googleapis.com/v1/billingAccounts/${BILLING_ACCOUNT}:testIamPermissions")"
          echo "BILLING_TEST_IAM_HTTP=$BILLING_HTTP"
          jq -c '{permissions:(.permissions // [])}' /tmp/billing-perms.json || cat /tmp/billing-perms.json

          echo 'VISIBLE_BILLING_ACCOUNTS_BEGIN'
          gcloud billing accounts list --format='value(name,displayName,open)' || true
          echo 'VISIBLE_BILLING_ACCOUNTS_END'

          echo 'VISIBLE_PROJECTS_BEGIN'
          gcloud projects list --format='value(projectId,projectNumber)' || true
          echo 'VISIBLE_PROJECTS_END'
          echo 'AUTHORITY_PREFLIGHT_READ_ONLY=true'
