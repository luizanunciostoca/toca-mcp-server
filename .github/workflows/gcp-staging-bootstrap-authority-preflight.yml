name: GCP Staging Bootstrap Authority Preflight

on:
  pull_request:
    paths:
      - '.github/workflows/gcp-staging-bootstrap-authority-preflight.yml'

permissions:
  contents: read
  id-token: write

env:
  CANDIDATE_SHA: 7db1a6e5caf01f98b200257c4aeecc2f1b29550a
  PLATFORM_READINESS_RUN: '32509071007'
  STAGING_PROJECT_ID: toca-mcp-next-staging
  STAGING_PROJECT_NUMBER: '729069789107'
  REGION: southamerica-east1
  STAGING_ARTIFACT_REPOSITORY: toca-mcp-staging
  STAGING_SQL_INSTANCE: toca-mcp-next-staging-db
  STAGING_DATABASE_SECRET: toca-next-staging-database-url
  STAGING_DATABASE_SECRET_VERSION: '1'
  STAGING_MCP_SERVICE: toca-mcp-next-staging
  STAGING_WEBHOOK_SERVICE: toca-webhook-next-staging
  STAGING_DEPLOYER_SA: toca-next-stg-deployer@toca-mcp-next-staging.iam.gserviceaccount.com
  STAGING_MCP_RUNTIME_SA: toca-next-stg-mcp@toca-mcp-next-staging.iam.gserviceaccount.com
  STAGING_WEBHOOK_RUNTIME_SA: toca-next-stg-webhook@toca-mcp-next-staging.iam.gserviceaccount.com
  STAGING_WIF: projects/729069789107/locations/global/workloadIdentityPools/github-staging/providers/github-toca-mcp-staging
  PROD_PROJECT_ID: toca-mcp-production
  PROD_PROJECT_NUMBER: '990081828836'

jobs:
  continue-deploy:
    name: Continue exact-candidate staging deploy after migrated schema
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Assert immutable staging boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$PLATFORM_READINESS_RUN" = 32509071007
          test "$STAGING_PROJECT_ID" != "$PROD_PROJECT_ID"
          test "$STAGING_PROJECT_NUMBER" != "$PROD_PROJECT_NUMBER"
      - name: Authenticate through dedicated staging WIF
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.STAGING_WIF }}
          service_account: ${{ env.STAGING_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Revalidate migrated staging resources before image build
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud projects describe "$STAGING_PROJECT_ID" --format='value(projectNumber)')" = "$STAGING_PROJECT_NUMBER"
          SQL_JSON="$(gcloud sql instances describe "$STAGING_SQL_INSTANCE" --project="$STAGING_PROJECT_ID" --format=json)"
          test "$(printf '%s' "$SQL_JSON" | jq -r '.project')" = "$STAGING_PROJECT_ID"
          test "$(printf '%s' "$SQL_JSON" | jq -r '.connectionName')" = "${STAGING_PROJECT_ID}:${REGION}:${STAGING_SQL_INSTANCE}"
          test "$(printf '%s' "$SQL_JSON" | jq -r '(.settings.ipConfiguration.authorizedNetworks // []) | length')" = 0
          gcloud secrets versions describe "$STAGING_DATABASE_SECRET_VERSION" --secret="$STAGING_DATABASE_SECRET" --project="$STAGING_PROJECT_ID" --format='value(state)' | grep -Fxq ENABLED
          echo 'POST_MIGRATION_STAGING_REVALIDATION=PASS'
      - name: Configure Docker authentication and attestation-capable Buildx
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker buildx create --name toca-staging-builder --driver docker-container --use --bootstrap
          docker buildx inspect toca-staging-builder | grep -E '^Driver:[[:space:]]+docker-container$'
          echo 'BUILDX_DOCKER_CONTAINER_DRIVER=PASS'
      - name: Build push and resolve immutable candidate image digest
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REPOSITORY="${REGION}-docker.pkg.dev/${STAGING_PROJECT_ID}/${STAGING_ARTIFACT_REPOSITORY}/server"
          IMAGE_TAG="${IMAGE_REPOSITORY}:${CANDIDATE_SHA}"
          docker buildx build --builder toca-staging-builder --pull --push --provenance=mode=max --sbom=true \
            --metadata-file /tmp/build-metadata.json -t "$IMAGE_TAG" .
          IMAGE_DIGEST="$(jq -r '."containerimage.digest" // empty' /tmp/build-metadata.json)"
          [[ "$IMAGE_DIGEST" == sha256:* ]]
          REMOTE_DIGEST="$(gcloud artifacts docker images describe "$IMAGE_TAG" --project="$STAGING_PROJECT_ID" --format='value(image_summary.digest)')"
          test "$REMOTE_DIGEST" = "$IMAGE_DIGEST"
          echo "IMAGE=${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"
          echo "MCP_TAG=candidate-${CANDIDATE_SHA:0:7}" >> "$GITHUB_ENV"
          echo "WEBHOOK_TAG=candidate-${CANDIDATE_SHA:0:7}" >> "$GITHUB_ENV"
          echo "MCP_SUFFIX=mcp-${CANDIDATE_SHA:0:7}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "WEBHOOK_SUFFIX=webhook-${CANDIDATE_SHA:0:7}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo 'STAGING_IMAGE_DIGEST_READBACK=PASS'
      - name: Deploy exact candidate revisions with no traffic and providers disabled
        shell: bash
        run: |
          set -euo pipefail
          COMMON_ENV="NODE_ENV=production,TOCA_DEPLOY_ENVIRONMENT=staging,TOCA_RELEASE_SHA=${CANDIDATE_SHA},TOCA_PLATFORM_KILL_SWITCH=false,TOCA_DEFAULT_TENANT_ID=toca,TOCA_DEFAULT_WORKSPACE_ID=toca,TOCA_DEFAULT_ORGANIZATION_ID=toca,STAGING_PROVIDER_MODE=DISABLED,META_ENABLED=false,META_PROVIDER_VERIFIED=false,META_WEBHOOK_ENABLED=false,META_WEBHOOK_PERSISTENCE_ENABLED=false,INSTAGRAM_READ_ENABLED=false,META_ADS_READ_ENABLED=false,META_ADS_WRITE_ENABLED=false,WHATSAPP_ENABLED=false,WHATSAPP_RUNTIME_ENABLED=false,WHATSAPP_PROVIDER_VERIFIED=false,EMAIL_SENDGRID_ENABLED=false,EMAIL_SENDGRID_PROVIDER_VERIFIED=false,GOOGLE_ADS_PHASE=OFF,GOOGLE_ADS_PROVIDER_VERIFIED=false,AG01_MODEL_ENABLED=false,AG01_MODEL_PROVIDER_VERIFIED=false,GCP_PROJECT_ID=${STAGING_PROJECT_ID}"
          CONNECTION_NAME="${STAGING_PROJECT_ID}:${REGION}:${STAGING_SQL_INSTANCE}"
          gcloud run deploy "$STAGING_MCP_SERVICE" --image "$IMAGE" --project="$STAGING_PROJECT_ID" --region="$REGION" \
            --revision-suffix "$MCP_SUFFIX" --tag "$MCP_TAG" --no-traffic \
            --service-account "$STAGING_MCP_RUNTIME_SA" --add-cloudsql-instances "$CONNECTION_NAME" \
            --update-secrets "DATABASE_URL=${STAGING_DATABASE_SECRET}:${STAGING_DATABASE_SECRET_VERSION}" \
            --update-env-vars "${COMMON_ENV},MCP_ENABLED=true,TOCA_SERVICE_ROLE=mcp" \
            --startup-probe 'httpGet.path=/readyz,httpGet.port=8080,failureThreshold=20,timeoutSeconds=3,periodSeconds=3' \
            --readiness-probe 'httpGet.path=/readyz,httpGet.port=8080,successThreshold=1,failureThreshold=3,timeoutSeconds=3,periodSeconds=5' \
            --liveness-probe 'httpGet.path=/healthz,httpGet.port=8080,failureThreshold=3,timeoutSeconds=3,periodSeconds=10' \
            --ingress=all --min=0 --max=1 --cpu=1 --memory=512Mi --no-allow-unauthenticated --quiet
          gcloud run deploy "$STAGING_WEBHOOK_SERVICE" --image "$IMAGE" --project="$STAGING_PROJECT_ID" --region="$REGION" \
            --revision-suffix "$WEBHOOK_SUFFIX" --tag "$WEBHOOK_TAG" --no-traffic \
            --service-account "$STAGING_WEBHOOK_RUNTIME_SA" --add-cloudsql-instances "$CONNECTION_NAME" \
            --update-secrets "DATABASE_URL=${STAGING_DATABASE_SECRET}:${STAGING_DATABASE_SECRET_VERSION}" \
            --update-env-vars "${COMMON_ENV},MCP_ENABLED=false,TOCA_SERVICE_ROLE=webhook" \
            --startup-probe 'httpGet.path=/readyz,httpGet.port=8080,failureThreshold=20,timeoutSeconds=3,periodSeconds=3' \
            --readiness-probe 'httpGet.path=/readyz,httpGet.port=8080,successThreshold=1,failureThreshold=3,timeoutSeconds=3,periodSeconds=5' \
            --liveness-probe 'httpGet.path=/healthz,httpGet.port=8080,failureThreshold=3,timeoutSeconds=3,periodSeconds=10' \
            --ingress=all --min=0 --max=1 --cpu=1 --memory=512Mi --no-allow-unauthenticated --quiet
          echo 'STAGING_CANDIDATE_DEPLOY_NO_TRAFFIC=PASS'
      - name: Prove no traffic promotion and resolve tagged revisions
        shell: bash
        run: |
          set -euo pipefail
          MCP_JSON="$(gcloud run services describe "$STAGING_MCP_SERVICE" --project="$STAGING_PROJECT_ID" --region="$REGION" --format=json)"
          WEBHOOK_JSON="$(gcloud run services describe "$STAGING_WEBHOOK_SERVICE" --project="$STAGING_PROJECT_ID" --region="$REGION" --format=json)"
          MCP_REVISION="$(printf '%s' "$MCP_JSON" | jq -r --arg tag "$MCP_TAG" '.status.traffic[] | select(.tag==$tag) | .revisionName')"
          MCP_URL="$(printf '%s' "$MCP_JSON" | jq -r --arg tag "$MCP_TAG" '.status.traffic[] | select(.tag==$tag) | .url')"
          WEBHOOK_REVISION="$(printf '%s' "$WEBHOOK_JSON" | jq -r --arg tag "$WEBHOOK_TAG" '.status.traffic[] | select(.tag==$tag) | .revisionName')"
          WEBHOOK_URL="$(printf '%s' "$WEBHOOK_JSON" | jq -r --arg tag "$WEBHOOK_TAG" '.status.traffic[] | select(.tag==$tag) | .url')"
          test -n "$MCP_REVISION"; test -n "$MCP_URL"; test -n "$WEBHOOK_REVISION"; test -n "$WEBHOOK_URL"
          test "$(printf '%s' "$MCP_JSON" | jq -r --arg rev "$MCP_REVISION" '[.status.traffic[] | select(.revisionName==$rev and (.percent // 0) > 0)] | length')" = 0
          test "$(printf '%s' "$WEBHOOK_JSON" | jq -r --arg rev "$WEBHOOK_REVISION" '[.status.traffic[] | select(.revisionName==$rev and (.percent // 0) > 0)] | length')" = 0
          echo "MCP_REVISION=$MCP_REVISION" >> "$GITHUB_ENV"
          echo "MCP_URL=$MCP_URL" >> "$GITHUB_ENV"
          echo "WEBHOOK_REVISION=$WEBHOOK_REVISION" >> "$GITHUB_ENV"
          echo "WEBHOOK_URL=$WEBHOOK_URL" >> "$GITHUB_ENV"
          echo 'STAGING_CANDIDATE_TRAFFIC_PERCENT=0'
      - name: Authenticated health readiness and final revision readback
        shell: bash
        run: |
          set -euo pipefail
          MCP_TOKEN="$(gcloud auth print-identity-token --audiences="$MCP_URL")"
          WEBHOOK_TOKEN="$(gcloud auth print-identity-token --audiences="$WEBHOOK_URL")"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 -H "Authorization: Bearer $MCP_TOKEN" "$MCP_URL/healthz" >/tmp/mcp-health.json
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 -H "Authorization: Bearer $MCP_TOKEN" "$MCP_URL/readyz" >/tmp/mcp-ready.json
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 -H "Authorization: Bearer $WEBHOOK_TOKEN" "$WEBHOOK_URL/healthz" >/tmp/webhook-health.json
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 -H "Authorization: Bearer $WEBHOOK_TOKEN" "$WEBHOOK_URL/readyz" >/tmp/webhook-ready.json
          jq -e '.status == "ready" and (.checks | all(.ok == true))' /tmp/mcp-ready.json >/dev/null
          jq -e '.status == "ready" and (.checks | all(.ok == true))' /tmp/webhook-ready.json >/dev/null
          for SPEC in "$MCP_REVISION|$STAGING_MCP_RUNTIME_SA" "$WEBHOOK_REVISION|$STAGING_WEBHOOK_RUNTIME_SA"; do
            REVISION="${SPEC%%|*}"; EXPECTED_SA="${SPEC#*|}"
            REV_JSON="$(gcloud run revisions describe "$REVISION" --project="$STAGING_PROJECT_ID" --region="$REGION" --format=json)"
            test "$(printf '%s' "$REV_JSON" | jq -r '.spec.serviceAccountName')" = "$EXPECTED_SA"
            test "$(printf '%s' "$REV_JSON" | jq -r '[.spec.containers[].env[]? | select(.name=="TOCA_RELEASE_SHA") | .value][0]')" = "$CANDIDATE_SHA"
            test "$(printf '%s' "$REV_JSON" | jq -r '[.spec.containers[].env[]? | select(.name=="STAGING_PROVIDER_MODE") | .value][0]')" = DISABLED
            test "$(printf '%s' "$REV_JSON" | jq -r '[.spec.containers[].env[]? | select(.name=="GOOGLE_ADS_PHASE") | .value][0]')" = OFF
          done
          MCP_PUBLIC="$(curl --silent --output /dev/null --write-out '%{http_code}' "$MCP_URL/healthz")"
          WEBHOOK_PUBLIC="$(curl --silent --output /dev/null --write-out '%{http_code}' "$WEBHOOK_URL/healthz")"
          [[ "$MCP_PUBLIC" == 401 || "$MCP_PUBLIC" == 403 ]]
          [[ "$WEBHOOK_PUBLIC" == 401 || "$WEBHOOK_PUBLIC" == 403 ]]
          echo "CANDIDATE_SHA=$CANDIDATE_SHA"
          echo "IMAGE_DIGEST=$IMAGE_DIGEST"
          echo "MCP_REVISION=$MCP_REVISION"
          echo "WEBHOOK_REVISION=$WEBHOOK_REVISION"
          echo 'STAGING_EXACT_CANDIDATE_DEPLOYED=YES'
          echo 'STAGING_CANDIDATE_HEALTH_READY=PASS'
          echo 'STAGING_TRAFFIC_PROMOTED=NO'
          echo 'PROVIDER_MUTATION_EXECUTED=NO'
          echo 'PRODUCTION_MUTATION_EXECUTED=NO'
