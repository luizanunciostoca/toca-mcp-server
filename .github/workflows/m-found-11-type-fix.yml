name: M-FOUND-11 Type Fix One-Shot

on:
  push:
    branches:
      - feat/m-found-11-toca-core-mcp-surface
    paths:
      - '.github/workflows/m-found-11-type-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/m-found-11-toca-core-mcp-surface
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Normalize exact optional contracts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function replace(path, from, to) {
            let source = fs.readFileSync(path, 'utf8');
            if (!source.includes(from)) throw new Error(`PATTERN_NOT_FOUND:${path}`);
            source = source.replace(from, to);
            fs.writeFileSync(path, source);
          }

          replace(
            'src/mcp/core-surface.ts',
            `      const steps = input.steps.map((step) => {\n        if (!step.capabilityId) return step;\n        const resolved = resolveCapabilityDefinition(step.capabilityId);\n        if (!resolved) throw new Error(\`WORKFLOW_CAPABILITY_UNKNOWN:\${step.capabilityId}\`);\n        return { ...step, capabilityId: resolved.canonical_id };\n      });`,
            `      const steps = input.steps.map((step) => {\n        const capabilityId = step.capabilityId\n          ? (() => {\n              const resolved = resolveCapabilityDefinition(step.capabilityId);\n              if (!resolved) throw new Error(\`WORKFLOW_CAPABILITY_UNKNOWN:\${step.capabilityId}\`);\n              return resolved.canonical_id;\n            })()\n          : step.capabilityId;\n        return {\n          stepId: step.stepId,\n          name: step.name,\n          ...(capabilityId !== undefined ? { capabilityId } : {}),\n          ...(step.input !== undefined ? { input: step.input } : {}),\n          ...(step.maxAttempts !== undefined ? { maxAttempts: step.maxAttempts } : {}),\n          ...(step.dependsOn !== undefined ? { dependsOn: step.dependsOn } : {}),\n        };\n      });`,
          );

          replace(
            'src/mcp/core-surface.ts',
            `      return response(\n        await executeCoreCapability(input, identity, {\n          registry: dependencies.registry,\n          runtimeResolver: dependencies.runtimeResolver,\n          auditSink: auditStore,\n          ...(dependencies.approvalStore ? { approvalStore: dependencies.approvalStore } : {}),\n        }),\n      );`,
            `      const executionInput = {\n        capabilityId: input.capabilityId,\n        payload: input.payload,\n        correlationId: input.correlationId,\n        ...(input.approvalId !== undefined ? { approvalId: input.approvalId } : {}),\n      };\n      return response(\n        await executeCoreCapability(executionInput, identity, {\n          registry: dependencies.registry,\n          runtimeResolver: dependencies.runtimeResolver,\n          auditSink: auditStore,\n          ...(dependencies.approvalStore ? { approvalStore: dependencies.approvalStore } : {}),\n        }),\n      );`,
          );

          replace(
            'src/mcp/runtime-capability-resolver.ts',
            `import {\n  requestSha256,\n  type MetaAdsControlledWriteService,\n} from '../providers/meta-ads/meta-ads-controlled-write.js';`,
            `import {\n  requestSha256,\n  type ControlledCreatePausedPlan,\n  type MetaAdsControlledWriteService,\n} from '../providers/meta-ads/meta-ads-controlled-write.js';`,
          );

          const schemaEnd = `const rescheduleSchema = z.object({`;
          const helper = `function toControlledCreatePausedPlan(\n  input: z.infer<typeof planSchema>,\n): ControlledCreatePausedPlan {\n  return {\n    account: input.account,\n    campaign: input.campaign,\n    adSet: {\n      name: input.adSet.name,\n      dailyBudgetMinor: input.adSet.dailyBudgetMinor,\n      billingEvent: input.adSet.billingEvent,\n      optimizationGoal: input.adSet.optimizationGoal,\n      targeting: input.adSet.targeting,\n      promotedObject: input.adSet.promotedObject,\n      ...(input.adSet.startTime !== undefined ? { startTime: input.adSet.startTime } : {}),\n      ...(input.adSet.endTime !== undefined ? { endTime: input.adSet.endTime } : {}),\n    },\n    creatives: input.creatives.map((creative) => ({\n      name: creative.name,\n      pageId: creative.pageId,\n      objectStorySpec: creative.objectStorySpec,\n      ...(creative.instagramActorId !== undefined\n        ? { instagramActorId: creative.instagramActorId }\n        : {}),\n    })),\n    ads: input.ads,\n  };\n}\n\nconst rescheduleSchema = z.object({`;
          replace('src/mcp/runtime-capability-resolver.ts', schemaEnd, helper);

          replace(
            'src/mcp/runtime-capability-resolver.ts',
            `        ? binding(planSchema, (input) => Promise.resolve(services.metaAdsWrite!.prepare(input)), {\n            targetAccount: (input) => input.account.adAccountId,\n          })`,
            `        ? binding(\n            planSchema,\n            (input) => Promise.resolve(services.metaAdsWrite!.prepare(toControlledCreatePausedPlan(input))),\n            {\n              targetAccount: (input) => input.account.adAccountId,\n            },\n          )`,
          );

          replace(
            'src/mcp/runtime-capability-resolver.ts',
            `(input) => services.metaAdsWrite!.createPaused(input, requestSha256(input)),`,
            `(input) => {\n              const plan = toControlledCreatePausedPlan(input);\n              return services.metaAdsWrite!.createPaused(plan, requestSha256(plan));\n            },`,
          );
          replace(
            'src/mcp/runtime-capability-resolver.ts',
            `idempotencyKey: (input) => \`meta-ads:create-paused:\${requestSha256(input)}\`,`,
            `idempotencyKey: (input) =>\n                \`meta-ads:create-paused:\${requestSha256(toControlledCreatePausedPlan(input))}\`,`,
          );
          NODE
          pnpm exec prettier --write src/mcp/core-surface.ts src/mcp/runtime-capability-resolver.ts
          pnpm typecheck
          pnpm eslint src/mcp/core-surface.ts src/mcp/runtime-capability-resolver.ts
      - name: Commit type corrections
        shell: bash
        run: |
          set -euo pipefail
          git add src/mcp/core-surface.ts src/mcp/runtime-capability-resolver.ts
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(m-found-11): preserve exact optional contracts'
          git push origin HEAD:feat/m-found-11-toca-core-mcp-surface
