name: Email hardening PR v2

on:
  pull_request:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          ref: rebase/email-real-sendgrid-20260820
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Normalize checkpoint
        run: python scripts/prep-email-hardening-doc.py
      - name: Apply idempotent hardening patch
        run: python scripts/apply-email-hardening.py
      - name: Format Email-owned files
        run: >-
          pnpm exec prettier --write
          .env.example
          docs/checkpoints/email-real-sendgrid-2026-08-20.md
          scripts/validate-sendgrid-email.ts
          src/omnichannel/email-orchestrator.ts
          src/providers/sendgrid/email-provider.ts
          src/providers/sendgrid/runtime-config.ts
          test/email-orchestrator.test.ts
          test/sendgrid-email-provider.test.ts
      - name: Lint Email-owned files
        run: >-
          pnpm exec eslint
          scripts/validate-sendgrid-email.ts
          src/omnichannel/email-orchestrator.ts
          src/providers/sendgrid/email-provider.ts
          src/providers/sendgrid/runtime-config.ts
          test/email-orchestrator.test.ts
          test/sendgrid-email-provider.test.ts
      - name: Typecheck Email-owned graph
        run: node scripts/verify-email-typecheck.mjs
      - name: Email unit tests
        run: >-
          pnpm vitest run
          test/email-runtime.test.ts
          test/email-orchestrator.test.ts
          test/sendgrid-email-provider.test.ts
      - name: Commit patch when changed
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example docs/checkpoints/email-real-sendgrid-2026-08-20.md scripts/validate-sendgrid-email.ts src/omnichannel/email-orchestrator.ts src/providers/sendgrid/email-provider.ts src/providers/sendgrid/runtime-config.ts test/email-orchestrator.test.ts test/sendgrid-email-provider.test.ts
          git commit -m "fix(email): harden retry and inbound validation"
          git push origin HEAD:rebase/email-real-sendgrid-20260820
