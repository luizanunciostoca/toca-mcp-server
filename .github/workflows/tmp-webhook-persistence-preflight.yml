name: Temporary Webhook Persistence Preflight

on:
  push:
    branches:
      - feat/instagram-engagement-messaging

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check persistence infrastructure metadata
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ID=toca-mcp-production
          INSTANCE=toca-mcp-db
          echo 'SQL_DATABASES_BEGIN'
          gcloud sql databases list --project "$PROJECT_ID" --instance "$INSTANCE" --format='value(name)' 2>/dev/null | head -n 20 || true
          echo 'SQL_DATABASES_END'
          echo 'SQL_USERS_BEGIN'
          gcloud sql users list --project "$PROJECT_ID" --instance "$INSTANCE" --format='value(name,type)' 2>/dev/null | head -n 20 || true
          echo 'SQL_USERS_END'
          echo 'SQL_INSTANCE_SETTINGS_BEGIN'
          gcloud sql instances describe "$INSTANCE" --project "$PROJECT_ID" --format='value(databaseVersion,settings.ipConfiguration.ipv4Enabled,settings.ipConfiguration.privateNetwork)' 2>/dev/null || true
          echo 'SQL_INSTANCE_SETTINGS_END'
