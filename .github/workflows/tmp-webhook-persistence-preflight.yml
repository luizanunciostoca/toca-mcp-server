name: Temporary Webhook Persistence Preflight

on:
  push:
    branches:
      - feat/instagram-engagement-messaging

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Bootstrap dedicated database identity and secret
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ID=toca-mcp-production
          INSTANCE=toca-mcp-db
          DATABASE=toca_mcp
          DB_USER=toca_mcp_app
          SECRET=toca-database-url
          RUNTIME_SA=toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
          CONNECTION_NAME="$(gcloud sql instances describe "$INSTANCE" --project "$PROJECT_ID" --format='value(connectionName)')"

          if ! gcloud sql users list --project "$PROJECT_ID" --instance "$INSTANCE" --format='value(name)' | grep -Fxq "$DB_USER"; then
            DB_PASSWORD="$(openssl rand -base64 36 | tr -d '\n' | tr '/+' '_-')"
            gcloud sql users create "$DB_USER" --project "$PROJECT_ID" --instance "$INSTANCE" --password="$DB_PASSWORD" --quiet
            echo 'DATABASE_APP_USER_CREATED=true'
          else
            echo 'DATABASE_APP_USER_CREATED=false'
            echo 'Existing application user has no recoverable credential secret; refusing to rotate it implicitly.' >&2
            exit 1
          fi

          ENCODED_PASSWORD="$(DB_PASSWORD="$DB_PASSWORD" node -e 'process.stdout.write(encodeURIComponent(process.env.DB_PASSWORD))')"
          DATABASE_URL="postgresql://${DB_USER}:${ENCODED_PASSWORD}@localhost/${DATABASE}?host=/cloudsql/${CONNECTION_NAME}"

          if ! gcloud secrets describe "$SECRET" --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud secrets create "$SECRET" --project "$PROJECT_ID" --replication-policy=automatic --quiet
          fi
          printf '%s' "$DATABASE_URL" > /tmp/database-url
          gcloud secrets versions add "$SECRET" --project "$PROJECT_ID" --data-file=/tmp/database-url --quiet >/dev/null
          rm -f /tmp/database-url
          unset DB_PASSWORD ENCODED_PASSWORD DATABASE_URL

          gcloud secrets add-iam-policy-binding "$SECRET" \
            --project "$PROJECT_ID" \
            --member="serviceAccount:${RUNTIME_SA}" \
            --role='roles/secretmanager.secretAccessor' \
            --quiet >/dev/null

          echo 'DATABASE_SECRET_PRESENT=true'
          echo 'DATABASE_RUNTIME_ACCESS_GRANTED=true'
