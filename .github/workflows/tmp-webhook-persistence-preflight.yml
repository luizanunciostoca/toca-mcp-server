name: Temporary Webhook Persistence Preflight

on:
  push:
    branches:
      - feat/instagram-engagement-messaging

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check persistence infrastructure metadata
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ID=toca-mcp-production
          if gcloud secrets describe toca-database-url --project "$PROJECT_ID" --format='value(name)' >/dev/null 2>&1; then
            echo 'DATABASE_SECRET_PRESENT=true'
          else
            echo 'DATABASE_SECRET_PRESENT=false'
          fi
          SQL_COUNT="$(gcloud sql instances list --project "$PROJECT_ID" --format='value(name)' 2>/dev/null | sed '/^$/d' | wc -l | tr -d ' ')"
          echo "CLOUD_SQL_INSTANCE_COUNT=$SQL_COUNT"
          gcloud sql instances list --project "$PROJECT_ID" --format='value(name,connectionName)' 2>/dev/null | head -n 10 || true
          echo 'DATABASE_RELATED_SECRET_NAMES_BEGIN'
          gcloud secrets list --project "$PROJECT_ID" --format='value(name)' 2>/dev/null | grep -Ei 'database|postgres|db|sql' | head -n 20 || true
          echo 'DATABASE_RELATED_SECRET_NAMES_END'
