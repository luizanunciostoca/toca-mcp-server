name: Next coordinator format once

on:
  push:
    branches:
      - coord/next-version-control-plane-20260820

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout coordinator branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: coord/next-version-control-plane-20260820
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier
        run: >-
          pnpm exec prettier --write
          control/next-version-feature-registry.v1.json
          docs/operations/next-version-evidence-index.md
          docs/operations/next-version-master-tracker.md
      - name: Commit formatting only
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control/next-version-feature-registry.v1.json docs/operations/next-version-evidence-index.md docs/operations/next-version-master-tracker.md
          git commit -m "style(next): normalize coordinator artifacts"
          git push origin HEAD:coord/next-version-control-plane-20260820
