name: Temporary Harden Meta Boundary Deploys

on:
  push:
    branches:
      - feat/instagram-engagement-messaging

permissions:
  contents: write

concurrency:
  group: tmp-harden-meta-boundary-deploys
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/instagram-engagement-messaging

      - name: Patch permanent Meta boundary workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('.github/workflows/gcp-meta-oauth-boundary-smoke.yml'),
              Path('.github/workflows/gcp-meta-webhook-boundary-smoke.yml'),
          ]

          for path in paths:
              text = path.read_text()

              marker = '  WEBHOOK_VERIFY_TOKEN_SECRET_ID: toca-meta-webhook-verify-token\n'
              addition = (
                  marker
                  + '  DATABASE_SECRET_ID: toca-database-url\n'
                  + '  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db\n'
              )
              if '  DATABASE_SECRET_ID: toca-database-url\n' not in text:
                  if marker not in text:
                      raise SystemExit(f'env marker missing in {path}')
                  text = text.replace(marker, addition, 1)

              old_flags = 'META_WEBHOOK_ENABLED=true@MCP_ENABLED=false'
              new_flags = (
                  'META_WEBHOOK_ENABLED=true@META_WEBHOOK_PERSISTENCE_ENABLED=true@'
                  'INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=false@MCP_ENABLED=false'
              )
              if old_flags in text:
                  text = text.replace(old_flags, new_flags, 1)
              elif new_flags not in text:
                  raise SystemExit(f'persistence env marker missing in {path}')

              old_secrets = '--set-secrets "META_APP_SECRET=toca-meta-app-secret:1,META_WEBHOOK_VERIFY_TOKEN=$WEBHOOK_VERIFY_TOKEN_SECRET_ID:latest" \\\n'
              new_secrets = '--set-secrets "META_APP_SECRET=toca-meta-app-secret:1,META_WEBHOOK_VERIFY_TOKEN=$WEBHOOK_VERIFY_TOKEN_SECRET_ID:latest,DATABASE_URL=$DATABASE_SECRET_ID:latest" \\\n'
              if old_secrets in text:
                  text = text.replace(old_secrets, new_secrets, 1)
              elif new_secrets not in text:
                  raise SystemExit(f'secret marker missing in {path}')

              service_account = '            --service-account "$RUNTIME_SERVICE_ACCOUNT" \\\n'
              cloudsql = service_account + '            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \\\n'
              if '            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \\\n' not in text:
                  if service_account not in text:
                      raise SystemExit(f'service account marker missing in {path}')
                  text = text.replace(service_account, cloudsql, 1)

              path.write_text(text)

          deploy = Path('.github/workflows/deploy-gcp.yml')
          deploy_text = deploy.read_text()
          deploy_text = deploy_text.replace(
              'DATABASE_URL=toca-mcp-database-url:latest',
              'DATABASE_URL=toca-database-url:latest',
          )
          deploy.write_text(deploy_text)
          PY

          if git diff --quiet; then
            echo 'Permanent workflows already hardened.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/gcp-meta-oauth-boundary-smoke.yml \
                  .github/workflows/gcp-meta-webhook-boundary-smoke.yml \
                  .github/workflows/deploy-gcp.yml
          git commit -m 'fix: preserve webhook persistence across Meta deploys'
          git push origin HEAD:feat/instagram-engagement-messaging
