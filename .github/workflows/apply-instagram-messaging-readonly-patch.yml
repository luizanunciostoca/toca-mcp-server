name: Apply Instagram Messaging Read-Only Patch

on:
  push:
    branches:
      - feat/instagram-messaging-readonly-20260828
    paths:
      - 'scripts/patch-instagram-messaging-readonly.mjs'
      - '.github/workflows/apply-instagram-messaging-readonly-patch.yml'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/instagram-messaging-readonly-20260828
          fetch-depth: 0

      - name: Apply deterministic patch
        run: node scripts/patch-instagram-messaging-readonly.mjs

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit generated integration changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No generated changes required.'
            exit 0
          fi
          git config user.name 'TOCA OS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/registry.ts src/mcp/runtime-capability-resolver.ts src/server.ts
          git commit -m 'feat(instagram): register read-only messaging MCP tools'
          git push origin HEAD:feat/instagram-messaging-readonly-20260828
