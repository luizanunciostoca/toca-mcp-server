name: Format WhatsApp Adapter Test Once

on:
  push:
    branches:
      - feat/next-whatsapp-real-20260820

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format and commit
        run: |
          pnpm exec prettier --write test/whatsapp-cloud-adapter.test.ts
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/whatsapp-cloud-adapter.test.ts
          git commit -m "style(whatsapp): format adapter test"
          git push origin HEAD:feat/next-whatsapp-real-20260820
