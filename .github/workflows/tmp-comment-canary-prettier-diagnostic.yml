name: TEMP Comment Canary Prettier Diagnostic

on:
  push:
    branches: [fix/instagram-comment-canary-target-binding]

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff for canary regression test
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier test/instagram-engagement-comment-provider-canary.test.ts --write
          git --no-pager diff -- test/instagram-engagement-comment-provider-canary.test.ts
