name: WhatsApp PostgreSQL E2E Once

on:
  push:
    branches:
      - feat/next-whatsapp-real-stack-crm-20260820

permissions:
  contents: write

jobs:
  whatsapp-postgres-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: toca
          POSTGRES_PASSWORD: toca-whatsapp-local-only
          POSTGRES_DB: toca_whatsapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toca -d toca_whatsapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://toca:toca-whatsapp-local-only@127.0.0.1:5432/toca_whatsapp
      DATABASE_SSL: 'false'
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/next-whatsapp-real-stack-crm-20260820
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Remove helper and commit final validation HEAD
        run: |
          git rm .github/workflows/whatsapp-postgres-e2e-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): remove WhatsApp PostgreSQL E2E helper"
          git push origin HEAD:feat/next-whatsapp-real-stack-crm-20260820
          echo "WHATSAPP_E2E_VALIDATED_HEAD=$(git rev-parse HEAD)"
      - name: Apply real repository migrations
        run: pnpm migrate
      - name: Run WhatsApp PostgreSQL restart/retry/idempotency E2E
        run: pnpm exec vitest run test/whatsapp-provider-postgres-e2e.test.ts
      - name: Verify no migration drift
        run: pnpm migrate
      - name: Verify helper absent from validated HEAD
        run: test ! -e .github/workflows/whatsapp-postgres-e2e-once.yml
