name: Meta Ads Itacare Rebalance Plus 1000

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meta-ads-itacare-rebalance-plus-1000.yml'
      - 'src/meta-ads-itacare-rebalance-plus-1000-2026-09-25.ts'
      - 'scripts/run-meta-ads-itacare-rebalance-plus-1000.sh'

permissions:
  contents: read
  id-token: write

concurrency:
  group: meta-ads-itacare-rebalance-plus-1000
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_ARTIFACT_REPOSITORY: toca-mcp
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  TOKEN_SECRET_ID: toca-meta-oauth-token
  META_APP_ID: '2281930145887404'
  META_REDIRECT_URI: https://toca-meta-oauth-staging-990081828836.southamerica-east1.run.app/oauth/meta/callback

jobs:
  rebalance:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm quality

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Execute approved rebalance
        run: bash scripts/run-meta-ads-itacare-rebalance-plus-1000.sh

      - name: Upload immutable evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meta-ads-itacare-rebalance-plus-1000-${{ github.run_id }}-${{ github.run_attempt }}
          path: meta-ads-itacare-rebalance-plus-1000.json
          if-no-files-found: error
          retention-days: 30
