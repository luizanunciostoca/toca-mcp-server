name: AG-01 OIDC Token Creator Remediation

on:
  push:
    branches:
      - ops/ag01-vertex-permanent-binding-20260828
    paths:
      - '.github/workflows/ag01-oidc-token-creator-remediation.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp

jobs:
  remediate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Grant minimal self OIDC token creation
        run: |
          set -euo pipefail
          mkdir -p evidence
          gcloud iam service-accounts add-iam-policy-binding "$DEPLOY_SERVICE_ACCOUNT" \
            --project "$PROJECT_ID" \
            --member "serviceAccount:$DEPLOY_SERVICE_ACCOUNT" \
            --role roles/iam.serviceAccountOpenIdTokenCreator \
            --quiet
          gcloud iam service-accounts get-iam-policy "$DEPLOY_SERVICE_ACCOUNT" \
            --project "$PROJECT_ID" --format=json > evidence/iam-policy.json
          jq -e --arg member "serviceAccount:$DEPLOY_SERVICE_ACCOUNT" '
            .bindings[]? | select(.role=="roles/iam.serviceAccountOpenIdTokenCreator") | (.members // [])[]? | select(.==$member)
          ' evidence/iam-policy.json >/dev/null
          jq -n --arg sa "$DEPLOY_SERVICE_ACCOUNT" '{status:"IAM_REMEDIATED",serviceAccount:$sa,role:"roles/iam.serviceAccountOpenIdTokenCreator",scope:"self",staticCredentialCreated:false}' > evidence/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ag01-oidc-token-creator-remediation-${{ github.run_id }}
          path: evidence
          retention-days: 90
