name: Bootstrap GitHub Native Instagram Publisher Identity

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-github-native-instagram-publisher-identity.yml
      - .github/workflows/github-native-instagram-publisher.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: bootstrap-github-native-instagram-publisher-identity
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_PROJECT_NUMBER: '990081828836'
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_WORKLOAD_IDENTITY_POOL: github
  GCP_INFRA_ADMIN_SERVICE_ACCOUNT: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com
  GCP_PUBLISHER_SERVICE_ACCOUNT: toca-instagram-publisher@toca-mcp-production.iam.gserviceaccount.com
  GCP_PUBLISHER_SERVICE_ACCOUNT_ID: toca-instagram-publisher
  GCP_META_TOKEN_SECRET_ID: toca-meta-oauth-token
  EXPECTED_REPOSITORY: luizanunciostoca/toca-mcp-server

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 10
    steps:
      - name: Checkout exact main controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Fail closed on repository and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Authenticate existing infrastructure administrator
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_INFRA_ADMIN_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Reconcile dedicated publication identity
        shell: bash
        run: |
          set -euo pipefail

          if ! gcloud iam service-accounts describe "$GCP_PUBLISHER_SERVICE_ACCOUNT" \
            --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud iam service-accounts create "$GCP_PUBLISHER_SERVICE_ACCOUNT_ID" \
              --project="$GCP_PROJECT_ID" \
              --display-name='TOCA Instagram Publisher' \
              --description='Least-privilege GitHub-native Instagram publication identity'
          fi

          wif_member="principalSet://iam.googleapis.com/projects/${GCP_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${GCP_WORKLOAD_IDENTITY_POOL}/attribute.repository/${EXPECTED_REPOSITORY}"

          gcloud iam service-accounts add-iam-policy-binding "$GCP_PUBLISHER_SERVICE_ACCOUNT" \
            --project="$GCP_PROJECT_ID" \
            --member="$wif_member" \
            --role='roles/iam.workloadIdentityUser' >/dev/null

          gcloud secrets add-iam-policy-binding "$GCP_META_TOKEN_SECRET_ID" \
            --project="$GCP_PROJECT_ID" \
            --member="serviceAccount:${GCP_PUBLISHER_SERVICE_ACCOUNT}" \
            --role='roles/secretmanager.secretAccessor' >/dev/null

      - name: Verify least-privilege bindings without reading secret data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publisher-identity-evidence

          gcloud iam service-accounts get-iam-policy "$GCP_PUBLISHER_SERVICE_ACCOUNT" \
            --project="$GCP_PROJECT_ID" --format=json > /tmp/publisher-sa-policy.json
          gcloud secrets get-iam-policy "$GCP_META_TOKEN_SECRET_ID" \
            --project="$GCP_PROJECT_ID" --format=json > /tmp/meta-secret-policy.json

          expected_wif="principalSet://iam.googleapis.com/projects/${GCP_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${GCP_WORKLOAD_IDENTITY_POOL}/attribute.repository/${EXPECTED_REPOSITORY}"
          jq -e --arg member "$expected_wif" \
            '.bindings[] | select(.role == "roles/iam.workloadIdentityUser") | .members[] | select(. == $member)' \
            /tmp/publisher-sa-policy.json >/dev/null
          jq -e --arg member "serviceAccount:${GCP_PUBLISHER_SERVICE_ACCOUNT}" \
            '.bindings[] | select(.role == "roles/secretmanager.secretAccessor") | .members[] | select(. == $member)' \
            /tmp/meta-secret-policy.json >/dev/null

          jq -n \
            --arg serviceAccount "$GCP_PUBLISHER_SERVICE_ACCOUNT" \
            --arg secret "$GCP_META_TOKEN_SECRET_ID" \
            --arg repository "$EXPECTED_REPOSITORY" \
            '{schemaVersion:"toca.instagram.publisher-identity.v1",serviceAccount:$serviceAccount,secret:$secret,repository:$repository,projectRolesGranted:[],secretScopedRole:"roles/secretmanager.secretAccessor",wifRole:"roles/iam.workloadIdentityUser",secretDataRead:false,result:"PASS"}' \
            > publisher-identity-evidence/manifest.json

          rm -f /tmp/publisher-sa-policy.json /tmp/meta-secret-policy.json

      - name: Upload sanitized bootstrap evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instagram-publisher-identity-${{ github.run_id }}
          path: publisher-identity-evidence
          if-no-files-found: error
          retention-days: 90
