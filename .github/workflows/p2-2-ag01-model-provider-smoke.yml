name: P2.2 AG-01 Model Provider Smoke

on:
  push:
    branches: [ops/p2-2-ag01-model-provider-20260828]
    paths:
      - src/ag01-model-provider-smoke.ts
      - .github/workflows/p2-2-ag01-model-provider-smoke.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: p2-2-ag01-model-provider-smoke
  cancel-in-progress: false

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  CONFIGURED_SECRET: ${{ vars.GCP_AG01_MODEL_API_KEY_SECRET }}
  CONFIGURED_SECRET_VERSION: ${{ vars.GCP_AG01_MODEL_API_KEY_SECRET_VERSION }}
  CONFIGURED_MODEL: ${{ vars.AG01_OPENAI_MODEL || vars.AG01_MODEL_NAME }}

jobs:
  provider-smoke:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify authority boundary is unchanged
        run: |
          set -euo pipefail
          grep -Fq 'ExistingCoreCapabilityGateway' src/orchestrator/production-runtime.ts
          grep -Fq 'bindApprovalStoreToScope' src/orchestrator/production-runtime.ts
          grep -Fq 'Core remains authoritative for policy and approval.' src/orchestrator/openai-responses-adapter.ts
          grep -Fq 'AG01_FAIL_CLOSED' src/orchestrator/production-runtime.ts
          echo 'AG01_AUTHORITY_BOUNDARY=PASS'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Quality gate
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm quality

      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Resolve model and Secret Manager binding without reading plaintext
        run: |
          set -euo pipefail
          MODEL="${CONFIGURED_MODEL:-gpt-5-mini}"
          SECRET="${CONFIGURED_SECRET:-}"
          VERSION="${CONFIGURED_SECRET_VERSION:-latest}"

          if [ -z "$SECRET" ]; then
            for CANDIDATE in OPENAI_API_KEY openai-api-key toca-ag01-model-api-key; do
              if gcloud secrets describe "$CANDIDATE" --project "$PROJECT_ID" >/dev/null 2>&1; then
                SECRET="$CANDIDATE"
                break
              fi
            done
          fi

          if [ -z "$SECRET" ]; then
            mkdir -p p2-2-evidence
            jq -n \
              --arg sha "$GITHUB_SHA" \
              --arg model "$MODEL" \
              '{schemaVersion:"toca.p2.2.ag01-model-provider-preflight.v1",status:"BLOCKED_SECRET_BINDING_MISSING",sourceSha:$sha,provider:"openai",model:$model,secretValueRead:false}' \
              > p2-2-evidence/preflight.json
            echo 'No AG-01 model API-key secret binding was found.' >&2
            exit 1
          fi

          gcloud secrets describe "$SECRET" --project "$PROJECT_ID" >/dev/null
          echo "AG01_OPENAI_MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "AG01_SECRET_NAME=$SECRET" >> "$GITHUB_ENV"
          echo "AG01_SECRET_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p p2-2-evidence
          jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg model "$MODEL" \
            --arg secret "$SECRET" \
            --arg version "$VERSION" \
            '{schemaVersion:"toca.p2.2.ag01-model-provider-preflight.v1",status:"SECRET_BINDING_METADATA_VERIFIED",sourceSha:$sha,provider:"openai",model:$model,secretId:$secret,secretVersion:$version,secretValueRead:false}' \
            > p2-2-evidence/preflight.json

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push immutable smoke image
        run: |
          set -euo pipefail
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/server:p2-2-ag01-${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy temporary fail-closed provider smoke job
        run: |
          set -euo pipefail
          JOB="toca-ag01-model-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CORRELATION="p2.2:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${GITHUB_SHA}"
          echo "JOB=$JOB" >> "$GITHUB_ENV"
          echo "P2_2_CORRELATION_ID=$CORRELATION" >> "$GITHUB_ENV"
          gcloud run jobs deploy "$JOB" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --command node \
            --args dist/src/ag01-model-provider-smoke.js \
            --set-env-vars "AG01_OPENAI_MODEL=$AG01_OPENAI_MODEL,TOCA_RELEASE_SHA=$GITHUB_SHA,P2_2_CORRELATION_ID=$CORRELATION" \
            --set-secrets "OPENAI_API_KEY=$AG01_SECRET_NAME:$AG01_SECRET_VERSION" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 120s \
            --quiet

      - name: Execute provider smoke and capture independent readback
        id: execute
        run: |
          set +e
          gcloud run jobs execute "$JOB" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --wait
          EXEC_STATUS=$?
          set -e

          sleep 5
          gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=$JOB" \
            --project "$PROJECT_ID" \
            --freshness=15m \
            --limit=300 \
            --format=json > p2-2-evidence/cloud-run-logs.json || true
          jq -r '.[] | (.textPayload // .jsonPayload.message // "")' p2-2-evidence/cloud-run-logs.json \
            > p2-2-evidence/cloud-run-job.log

          RESULT="$(grep -F 'P2_2_AG01_MODEL_READBACK_RESULT=' p2-2-evidence/cloud-run-job.log | tail -1 | sed 's/^.*P2_2_AG01_MODEL_READBACK_RESULT=//' || true)"
          FAILURE="$(grep -F 'P2_2_AG01_MODEL_READBACK_FAILURE=' p2-2-evidence/cloud-run-job.log | tail -1 | sed 's/^.*P2_2_AG01_MODEL_READBACK_FAILURE=//' || true)"
          if [ -n "$RESULT" ]; then
            printf '%s\n' "$RESULT" | jq . > p2-2-evidence/model-readback.json
          fi
          if [ -n "$FAILURE" ]; then
            printf '%s\n' "$FAILURE" | jq . > p2-2-evidence/model-readback-failure.json
          fi
          jq -n \
            --argjson exitCode "$EXEC_STATUS" \
            --arg resultCaptured "$([ -n "$RESULT" ] && echo true || echo false)" \
            --arg failureCaptured "$([ -n "$FAILURE" ] && echo true || echo false)" \
            --arg job "$JOB" \
            --arg correlationId "$P2_2_CORRELATION_ID" \
            '{schemaVersion:"toca.p2.2.ag01-model-provider-execution.v1",cloudRunExitCode:$exitCode,resultCaptured:($resultCaptured=="true"),failureCaptured:($failureCaptured=="true"),job:$job,correlationId:$correlationId}' \
            > p2-2-evidence/execution.json

          test "$EXEC_STATUS" -eq 0
          test -n "$RESULT"
          jq -e '.status == "PROVIDER_VERIFIED" and .authority == "CORE_POLICY_APPROVAL" and .sideEffectAuthorization == false and .providerMutationExecuted == false and .externalCapabilityExecuted == false and .store == false' \
            p2-2-evidence/model-readback.json >/dev/null

      - name: Upload immutable P2.2 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p2-2-ag01-model-provider-${{ github.run_id }}-${{ github.run_attempt }}
          path: p2-2-evidence
          if-no-files-found: warn
          retention-days: 90

      - name: Remove temporary Cloud Run job
        if: always() && env.JOB != ''
        run: |
          gcloud run jobs delete "$JOB" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --quiet || true
