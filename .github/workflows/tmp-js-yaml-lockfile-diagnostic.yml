name: TEMP js-yaml Lockfile Diagnostic

on:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/tmp-js-yaml-lockfile-diagnostic.yml'

permissions:
  contents: write

jobs:
  lockfile-write:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Generate and commit exact lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only
          git diff --exit-code -- pnpm-lock.yaml && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'security: regenerate lockfile for js-yaml 4.3.2'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
