name: GCP Meta Real DM Check

on:
  push:
    branches:
      - feat/instagram-engagement-messaging
    paths:
      - .github/workflows/gcp-meta-real-dm-check.yml

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  SERVICE: toca-meta-oauth-staging

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect recent real DM webhook traffic
        shell: bash
        run: |
          set -euo pipefail
          SINCE="$(date -u -d '20 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')"
          REQ_FILTER="resource.type=cloud_run_revision AND resource.labels.service_name=${SERVICE} AND timestamp>=\"${SINCE}\" AND httpRequest.requestMethod=POST"
          gcloud logging read "$REQ_FILTER" --project "$PROJECT_ID" --limit 100 --order desc --format=json > /tmp/req.json
          echo "SAFE_POST_COUNT=$(jq 'length' /tmp/req.json)"
          jq -r '.[] | [(.timestamp // ""), (.httpRequest.status // 0 | tostring), ((.httpRequest.requestUrl // "") | sub("^https?://[^/]+"; ""))] | @tsv' /tmp/req.json | sed -E 's/[?&](access_token|token|code|client_secret|appsecret_proof)=[^&[:space:]]+//g' | head -100

          APP_FILTER="resource.type=cloud_run_revision AND resource.labels.service_name=${SERVICE} AND timestamp>=\"${SINCE}\""
          gcloud logging read "$APP_FILTER" --project "$PROJECT_ID" --limit 500 --order desc --format=json > /tmp/app.json
          SAFE_LINES="$(jq -r '.[] | (.textPayload // .jsonPayload.message // "") | select(test("webhook accepted|DIRECT|COMMENT"; "i"))' /tmp/app.json | head -120)"
          printf '%s\n' "$SAFE_LINES"
          DIRECT_COUNT="$(printf '%s\n' "$SAFE_LINES" | grep -ci 'DIRECT' || true)"
          echo "SAFE_DIRECT_COUNT=${DIRECT_COUNT}"
