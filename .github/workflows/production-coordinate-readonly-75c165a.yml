name: Production Coordinate Read-Only 75c165a

on:
  pull_request:
    paths:
      - '.github/workflows/production-coordinate-readonly-75c165a.yml'

permissions:
  contents: read
  id-token: write

env:
  CANDIDATE_SHA: 75c165a044c6e79e9545328dd04a2a3e73d2e910
  PROD_PROJECT_ID: toca-mcp-production
  PROD_PROJECT_NUMBER: '990081828836'
  REGION: southamerica-east1
  PROD_WIF: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  PROD_DEPLOYER_SA: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

jobs:
  read-prod:
    name: Production coordinates read-only
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = '2b373b1564e495d81a73ca04254efec18c0e774c'
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.PROD_WIF }}
          service_account: ${{ env.PROD_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Read non-secret production runtime coordinates
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud projects describe "$PROD_PROJECT_ID" --format='value(projectNumber)')" = "$PROD_PROJECT_NUMBER"
          echo '=== PROD_CLOUD_RUN ==='
          gcloud run services list --project="$PROD_PROJECT_ID" --region="$REGION" --format=json \
            | jq -r '.[] | [.metadata.name, (.spec.template.spec.serviceAccountName // ""), (.status.latestReadyRevisionName // "")] | @tsv'
          echo '=== PROD_CLOUD_SQL ==='
          gcloud sql instances describe toca-mcp-db --project="$PROD_PROJECT_ID" --format=json 2>/tmp/sql.err \
            | jq -r '[.name,.region,.connectionName,.state] | @tsv' \
            || { echo 'PROD_SQL_DESCRIBE=DENIED'; cat /tmp/sql.err >&2; true; }
          echo '=== PROD_DATABASE_SECRET ==='
          if gcloud secrets describe toca-database-url --project="$PROD_PROJECT_ID" --format='value(name)' >/tmp/secret.name 2>/tmp/secret.err; then
            cat /tmp/secret.name
          else
            echo 'PROD_DATABASE_SECRET_DESCRIBE=DENIED'
            cat /tmp/secret.err >&2
          fi
          echo 'PRODUCTION_COORDINATE_READ_ONLY=PASS'
          echo 'PRODUCTION_MUTATION_EXECUTED=NO'
