name: Temporary Drive Public Download Diagnostic

on:
  push:
    branches:
      - wave/github-native-publication-queue

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download known approved public Drive JPEG
        shell: bash
        run: |
          set -euo pipefail
          url='https://drive.usercontent.google.com/download?id=1-P3RdbWi_X4H1_X5L_xrLiY2UA3cte1o&export=download&confirm=t'
          curl --fail --silent --show-error --location \
            --output /tmp/asset.jpg \
            --write-out 'FINAL_URL=%{url_effective}\nHTTP_CODE=%{http_code}\nCONTENT_TYPE=%{content_type}\n' \
            "$url"
          file /tmp/asset.jpg
          stat -c 'SIZE=%s' /tmp/asset.jpg
          sha256sum /tmp/asset.jpg
          head -c 3 /tmp/asset.jpg | od -An -t x1
