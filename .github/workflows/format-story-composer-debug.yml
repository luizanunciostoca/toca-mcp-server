name: Format Story Composer Debug

on:
  push:
    branches:
      - feat/marketing-autopilot-story-composer

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print canonical source
        run: pnpm exec prettier src/providers/local/local-story-composer.ts
      - name: Print canonical test
        run: pnpm exec prettier test/local-story-composer.test.ts
