name: TEMP PR Run Staging Contract Finalizer 2026-08-23

on:
  pull_request:
    branches: [main]
    types: [reopened, synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'fix/staging-runtime-digest-rollback-20260823' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/staging-runtime-digest-rollback-20260823
          persist-credentials: true
          fetch-depth: 0

      - name: Apply permanent staging contract remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            ops/tmp-staging-contract-deploy-a.py \
            ops/tmp-staging-contract-deploy-b.py \
            ops/tmp-staging-contract-runtime.py \
            ops/tmp-staging-contract-test.py
          python3 ops/tmp-staging-contract-deploy-a.py
          python3 ops/tmp-staging-contract-deploy-b.py
          python3 ops/tmp-staging-contract-runtime.py
          python3 ops/tmp-staging-contract-test.py
          git diff --check

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validate affected permanent files
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            .github/workflows/deploy-gcp-staging-canonical.yml \
            .github/workflows/staging-runtime-observability.yml \
            test/gcp-staging-canonical-workflow.test.ts
          git diff --check
          pnpm exec vitest run test/gcp-staging-canonical-workflow.test.ts

      - name: Commit permanent remediation with zero TEMP artifacts
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-finalize-staging-contract-20260823.yml
          git rm .github/workflows/temp-pr-run-staging-contract-finalizer-20260823.yml
          git rm .temp-finalize-staging-contract-trigger
          git rm ops/tmp-staging-contract-deploy-a.py
          git rm ops/tmp-staging-contract-deploy-b.py
          git rm ops/tmp-staging-contract-runtime.py
          git rm ops/tmp-staging-contract-test.py

          for forbidden in \
            .github/workflows/ops-apply-staging-runtime-digest-rollback-20260823.yml \
            .github/workflows/ops-run-staging-digest-rollback-patch-20260823.yml \
            .github/workflows/ops-run-staging-digest-rollback-pr-20260823.yml \
            .ops-trigger-staging-digest-rollback \
            ops/tmp-apply-staging-digest-rollback.py; do
            test ! -e "$forbidden"
          done

          git add \
            .github/workflows/deploy-gcp-staging-canonical.yml \
            .github/workflows/staging-runtime-observability.yml \
            test/gcp-staging-canonical-workflow.test.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(staging): close OCI readback rollback and routing contract'
          FINAL_COMMIT_SHA="$(git rev-parse HEAD)"
          echo "FINAL_COMMIT_SHA=$FINAL_COMMIT_SHA"
          git push origin HEAD:fix/staging-runtime-digest-rollback-20260823
