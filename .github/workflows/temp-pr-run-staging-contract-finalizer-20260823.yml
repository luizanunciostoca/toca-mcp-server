name: TEMP PR Run Staging Contract Finalizer 2026-08-23

on:
  pull_request:
    branches: [main]
    types: [reopened, synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'fix/staging-runtime-digest-rollback-20260823' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/staging-runtime-digest-rollback-20260823
          persist-credentials: true
          fetch-depth: 0

      - name: Execute embedded permanent patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/temp-finalize-staging-contract-20260823.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/finalize-staging-contract.py').write_text(code)
          PY
          python3 /tmp/finalize-staging-contract.py

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validate affected permanent files
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write .github/workflows/deploy-gcp-staging-canonical.yml .github/workflows/staging-runtime-observability.yml test/gcp-staging-canonical-workflow.test.ts
          git diff --check
          pnpm exec vitest run test/gcp-staging-canonical-workflow.test.ts

      - name: Commit only permanent remediation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-finalize-staging-contract-20260823.yml
          git rm .github/workflows/temp-pr-run-staging-contract-finalizer-20260823.yml
          git rm .temp-finalize-staging-contract-trigger
          git add .github/workflows/deploy-gcp-staging-canonical.yml .github/workflows/staging-runtime-observability.yml test/gcp-staging-canonical-workflow.test.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(staging): close OCI readback rollback and routing contract'
          git push origin HEAD:fix/staging-runtime-digest-rollback-20260823
