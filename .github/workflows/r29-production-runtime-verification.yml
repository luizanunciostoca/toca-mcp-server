name: R29 Production Runtime Verification

on:
  workflow_run:
    workflows: ['Deploy TOCA Managed Instagram Daemon GCP']
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: r29-production-runtime-verification
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_ARTIFACT_REPOSITORY: toca-mcp
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  DATABASE_SECRET_ID: toca-database-url

jobs:
  verify-r29-production-runtime:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Bind exact deployed SHA
        id: source
        shell: bash
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYED_SHA"
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/server:toca-managed-daemon-$DEPLOYED_SHA"
          echo "sha=$DEPLOYED_SHA" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "validation_run_id=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Authenticate deployer to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Execute R29 production runtime gate
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          IMAGE: ${{ steps.source.outputs.image }}
          VALIDATION_RUN_ID: ${{ steps.source.outputs.validation_run_id }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_SHA"
          test -n "$IMAGE"
          test -n "$VALIDATION_RUN_ID"
          JOB_NAME="toca-r29-runtime-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            gcloud run jobs delete "$JOB_NAME" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          gcloud run jobs deploy "$JOB_NAME" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --set-env-vars "SOURCE_SHA=$SOURCE_SHA,VALIDATION_RUN_ID=$VALIDATION_RUN_ID" \
            --command node \
            --args dist/scripts/verify-r29-production-runtime.js \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 300s \
            --quiet

          gcloud run jobs execute "$JOB_NAME" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --wait \
            --quiet

          RESULT_LINE="$(gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME} AND textPayload:\"R29_PRODUCTION_RUNTIME_VERIFY=\"" \
            --project "$GCP_PROJECT_ID" \
            --freshness=20m \
            --limit=20 \
            --order=desc \
            --format='value(textPayload)' | grep 'R29_PRODUCTION_RUNTIME_VERIFY=' | head -n1)"
          test -n "$RESULT_LINE"
          RESULT_JSON="${RESULT_LINE#R29_PRODUCTION_RUNTIME_VERIFY=}"
          printf '%s\n' "$RESULT_JSON" | jq -e \
            --arg sha "$SOURCE_SHA" '
              .schemaVersion == 1 and
              .sourceSha == $sha and
              .executionSurface == "toca.execute" and
              .executionEngine == "executeCoreCapability" and
              .publicToolCount == 12 and
              .videoCapability == "video.caption.embed" and
              .r29Capability == "content_item.channel.adapt" and
              .providerReadbackVerified == true and
              .durableReadbackVerified == true and
              .artifactRows == 1 and
              .outboxRows == 1 and
              .auditValid == true and
              .failClosed == true and
              .externalPublicationExecuted == false
            ' >/dev/null
          printf '%s\n' "$RESULT_JSON" | jq .
          echo 'TOCA_R29_PRODUCTION_RUNTIME_GATE=PASS'