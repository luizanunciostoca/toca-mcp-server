name: R29 Production Runtime Verification

on:
  workflow_run:
    workflows: ['Deploy TOCA Managed Instagram Daemon GCP']
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: r29-production-runtime-verification
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_ARTIFACT_REPOSITORY: toca-mcp
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  DATABASE_SECRET_ID: toca-database-url

jobs:
  verify-r29-production-runtime:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Bind exact deployed SHA
        id: source
        shell: bash
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYED_SHA"
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/server:toca-managed-daemon-$DEPLOYED_SHA"
          echo "sha=$DEPLOYED_SHA" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "validation_run_id=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Authenticate deployer to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Execute R29 production runtime gate
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          IMAGE: ${{ steps.source.outputs.image }}
          VALIDATION_RUN_ID: ${{ steps.source.outputs.validation_run_id }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_SHA"
          test -n "$IMAGE"
          test -n "$VALIDATION_RUN_ID"
          JOB_NAME="toca-r29-runtime-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          DRAIN_JOB_NAME="toca-r29-outbox-drain-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            gcloud run jobs delete "$DRAIN_JOB_NAME" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --quiet >/dev/null 2>&1 || true
            gcloud run jobs delete "$JOB_NAME" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          gcloud run jobs deploy "$JOB_NAME" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --set-env-vars "SOURCE_SHA=$SOURCE_SHA,VALIDATION_RUN_ID=$VALIDATION_RUN_ID" \
            --command node \
            --args dist/scripts/verify-r29-production-runtime.js \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 300s \
            --quiet

          set +e
          gcloud run jobs execute "$JOB_NAME" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --wait \
            --quiet
          EXECUTION_STATUS=$?
          set -e

          LOGS="$(gcloud logging read \
            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${JOB_NAME}\"" \
            --project "$GCP_PROJECT_ID" \
            --freshness=20m \
            --limit=200 \
            --order=asc \
            --format='value(textPayload)' || true)"
          printf '%s\n' "$LOGS"
          if [ "$EXECUTION_STATUS" -ne 0 ]; then
            echo "TOCA_R29_PRODUCTION_RUNTIME_GATE=FAILED:execution_status=${EXECUTION_STATUS}"
            exit "$EXECUTION_STATUS"
          fi

          RESULT_LINE="$(printf '%s\n' "$LOGS" | grep 'R29_PRODUCTION_RUNTIME_VERIFY=' | tail -n1)"
          test -n "$RESULT_LINE"
          RESULT_JSON="${RESULT_LINE#R29_PRODUCTION_RUNTIME_VERIFY=}"
          printf '%s\n' "$RESULT_JSON" | jq -e \
            --arg sha "$SOURCE_SHA" '
              .schemaVersion == 1 and
              .sourceSha == $sha and
              .executionSurface == "toca.execute" and
              .executionEngine == "executeCoreCapability" and
              .publicToolCount == 12 and
              .videoCapability == "video.caption.embed" and
              .r29Capability == "content_item.channel.adapt" and
              .providerReadbackVerified == true and
              .durableReadbackVerified == true and
              .artifactRows == 1 and
              .outboxRows == 1 and
              .auditValid == true and
              .failClosed == true and
              .externalPublicationExecuted == false
            ' >/dev/null
          printf '%s\n' "$RESULT_JSON" | jq .

          cat >/tmp/drain-r29-validation-outbox.mjs <<'NODE'
          import { randomUUID } from 'node:crypto';
          import { createRequire } from 'node:module';
          const require = createRequire('/app/package.json');
          const pg = require('pg');
          const sourceSha = process.env.SOURCE_SHA?.trim();
          const validationRunId = process.env.VALIDATION_RUN_ID?.trim();
          const databaseUrl = process.env.DATABASE_URL?.trim();
          if (!sourceSha || !validationRunId || !databaseUrl) throw new Error('R29_DRAIN_ENV_REQUIRED');
          const sourceEvidence = `production:r29:${sourceSha}`;
          const runEvidence = `validation-run:${validationRunId}`;
          const allowedTypes = new Set([
            'content_item.created',
            'content_item.version_created',
            'content.video_artifact.created',
          ]);
          const pool = new pg.Pool({ connectionString: databaseUrl, max: 2 });
          const client = await pool.connect();
          const now = new Date().toISOString();
          let drained = 0;
          try {
            await client.query('begin');
            const rows = await client.query(
              `select event_id,event_type,status,attempts,max_attempts,version,evidence,tenant_id,correlation_id
                 from event_outbox
                where evidence @> $1::jsonb
                  and evidence @> $2::jsonb
                order by occurred_at,event_id
                for update`,
              [JSON.stringify([sourceEvidence]), JSON.stringify([runEvidence])],
            );
            if (rows.rows.length !== 3) throw new Error(`R29_DRAIN_EVENT_COUNT_INVALID:${rows.rows.length}`);
            for (const row of rows.rows) {
              if (!allowedTypes.has(row.event_type)) throw new Error(`R29_DRAIN_EVENT_TYPE_UNEXPECTED:${row.event_type}`);
              if (row.status !== 'PENDING' || row.attempts !== 0 || row.max_attempts < 1)
                throw new Error(`R29_DRAIN_EVENT_STATE_INVALID:${row.event_id}:${row.status}:${row.attempts}`);
              if (!String(row.tenant_id).startsWith('r29-production-'))
                throw new Error(`R29_DRAIN_TENANT_UNEXPECTED:${row.event_id}`);
              if (!String(row.correlation_id).startsWith('r29-production-runtime-'))
                throw new Error(`R29_DRAIN_CORRELATION_UNEXPECTED:${row.event_id}`);

              const executionId = `r29-validation-sink-${randomUUID()}`;
              const workerId = 'r29-production-verifier-validation-sink';
              const attemptNumber = Number(row.attempts) + 1;
              const claimed = await client.query(
                `update event_outbox set
                   status='CLAIMED',attempts=$2,claimed_by=$3,claim_execution_id=$4,
                   claimed_at=$5::timestamptz,delivered_at=null,last_error_code=null,version=version+1
                 where event_id=$1 and version=$6 and status='PENDING'
                 returning version`,
                [row.event_id, attemptNumber, workerId, executionId, now, row.version],
              );
              if (claimed.rowCount !== 1) throw new Error(`R29_DRAIN_CLAIM_CONFLICT:${row.event_id}`);
              await client.query(
                `insert into event_outbox_delivery_attempts (
                   execution_id,event_id,worker_id,attempt_number,status,claimed_at,completed_at,error_code,evidence
                 ) values ($1,$2,$3,$4,'CLAIMED',$5::timestamptz,null,null,'[]'::jsonb)`,
                [executionId, row.event_id, workerId, attemptNumber, now],
              );
              const deliveryEvidence = [
                `r29:validation-sink:${validationRunId}`,
                `r29:source-sha:${sourceSha}`,
                'r29:external-publication:false',
              ];
              const attempt = await client.query(
                `update event_outbox_delivery_attempts set
                   status='DELIVERED',completed_at=$2::timestamptz,error_code=null,evidence=$3::jsonb
                 where execution_id=$1 and status='CLAIMED'`,
                [executionId, now, JSON.stringify(deliveryEvidence)],
              );
              if (attempt.rowCount !== 1) throw new Error(`R29_DRAIN_ATTEMPT_CONFLICT:${row.event_id}`);
              const delivered = await client.query(
                `update event_outbox set
                   status='DELIVERED',delivered_at=$2::timestamptz,claimed_by=null,
                   claim_execution_id=null,claimed_at=null,last_error_code=null,version=version+1
                 where event_id=$1 and claim_execution_id=$3 and status='CLAIMED'`,
                [row.event_id, now, executionId],
              );
              if (delivered.rowCount !== 1) throw new Error(`R29_DRAIN_DELIVER_CONFLICT:${row.event_id}`);
              drained += 1;
            }
            await client.query('commit');
          } catch (error) {
            await client.query('rollback');
            throw error;
          } finally {
            client.release();
          }
          try {
            const readback = await pool.query(
              `select status,count(*)::int as count
                 from event_outbox
                where evidence @> $1::jsonb and evidence @> $2::jsonb
                group by status order by status`,
              [JSON.stringify([sourceEvidence]), JSON.stringify([runEvidence])],
            );
            const delivered = Number(readback.rows.find((row) => row.status === 'DELIVERED')?.count ?? 0);
            const pending = readback.rows
              .filter((row) => ['PENDING','CLAIMED','FAILED_RETRYABLE'].includes(row.status))
              .reduce((sum, row) => sum + Number(row.count), 0);
            if (delivered !== 3 || pending !== 0 || drained !== 3)
              throw new Error(`R29_DRAIN_READBACK_INVALID:${drained}:${delivered}:${pending}`);
            console.log(`R29_VALIDATION_OUTBOX_DRAIN=${JSON.stringify({
              schemaVersion: 1,
              sourceSha,
              validationRunId,
              matched: 3,
              drained,
              delivered,
              pending,
              transport: 'r29-production-verifier-validation-sink',
              externalPublicationExecuted: false,
              drainedAt: now,
            })}`);
          } finally {
            await pool.end();
          }
          NODE
          DRAIN_SCRIPT_B64="$(base64 -w0 /tmp/drain-r29-validation-outbox.mjs)"
          rm -f /tmp/drain-r29-validation-outbox.mjs
          DRAIN_SCRIPT='set -eu; printf %s "$DRAIN_SCRIPT_B64" | base64 -d >/tmp/drain.mjs; node /tmp/drain.mjs; rm -f /tmp/drain.mjs'

          gcloud run jobs deploy "$DRAIN_JOB_NAME" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --set-env-vars "^~^SOURCE_SHA=$SOURCE_SHA~VALIDATION_RUN_ID=$VALIDATION_RUN_ID~DRAIN_SCRIPT_B64=$DRAIN_SCRIPT_B64" \
            --command /bin/sh \
            --args="^@^-lc@${DRAIN_SCRIPT}" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 300s \
            --quiet

          gcloud run jobs execute "$DRAIN_JOB_NAME" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --wait \
            --quiet
          DRAIN_LOGS="$(gcloud logging read \
            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${DRAIN_JOB_NAME}\"" \
            --project "$GCP_PROJECT_ID" \
            --freshness=20m \
            --limit=100 \
            --order=asc \
            --format='value(textPayload)' || true)"
          printf '%s\n' "$DRAIN_LOGS"
          DRAIN_LINE="$(printf '%s\n' "$DRAIN_LOGS" | grep 'R29_VALIDATION_OUTBOX_DRAIN=' | tail -n1)"
          test -n "$DRAIN_LINE"
          DRAIN_JSON="${DRAIN_LINE#R29_VALIDATION_OUTBOX_DRAIN=}"
          printf '%s\n' "$DRAIN_JSON" | jq -e \
            --arg sha "$SOURCE_SHA" \
            --arg run "$VALIDATION_RUN_ID" '
              .schemaVersion == 1 and
              .sourceSha == $sha and
              .validationRunId == $run and
              .matched == 3 and
              .drained == 3 and
              .delivered == 3 and
              .pending == 0 and
              .transport == "r29-production-verifier-validation-sink" and
              .externalPublicationExecuted == false
            ' >/dev/null
          printf '%s\n' "$DRAIN_JSON" | jq .
          echo 'TOCA_R29_PRODUCTION_RUNTIME_GATE=PASS'