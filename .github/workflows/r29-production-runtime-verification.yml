name: R29 Production Runtime Verification

on:
  workflow_run:
    workflows: ['Deploy TOCA Managed Instagram Daemon GCP']
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: r29-production-runtime-verification
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_ARTIFACT_REPOSITORY: toca-mcp
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  DATABASE_SECRET_ID: toca-database-url

jobs:
  verify-r29-production-runtime:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Bind exact deployed SHA
        id: source
        shell: bash
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYED_SHA"
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/server:toca-managed-daemon-$DEPLOYED_SHA"
          echo "sha=$DEPLOYED_SHA" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "validation_run_id=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Authenticate deployer to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Execute R29 production runtime gate
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          IMAGE: ${{ steps.source.outputs.image }}
          VALIDATION_RUN_ID: ${{ steps.source.outputs.validation_run_id }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_SHA"
          test -n "$IMAGE"
          test -n "$VALIDATION_RUN_ID"
          JOB_NAME="toca-r29-runtime-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          DRAIN_JOB_NAME="toca-r29-outbox-drain-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          POST_CLEANUP_JOB_NAME="toca-r29-post-cleanup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup_job() {
            local name="$1"
            gcloud run jobs delete "$name" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --quiet >/dev/null 2>&1 || true
          }
          cleanup_all() {
            cleanup_job "$POST_CLEANUP_JOB_NAME"
            cleanup_job "$DRAIN_JOB_NAME"
            cleanup_job "$JOB_NAME"
          }
          assert_job_absent() {
            local name="$1"
            local remaining
            remaining="$(gcloud run jobs list \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --filter="metadata.name=${name}" \
              --format='value(metadata.name)')"
            if [ -n "$remaining" ]; then
              echo "R29_TEMP_JOB_CLEANUP_FAILED:${name}:${remaining}"
              exit 1
            fi
          }
          trap cleanup_all EXIT

          gcloud run jobs deploy "$JOB_NAME" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --set-env-vars "SOURCE_SHA=$SOURCE_SHA,VALIDATION_RUN_ID=$VALIDATION_RUN_ID" \
            --command node \
            --args dist/scripts/verify-r29-production-runtime.js \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 300s \
            --quiet

          set +e
          gcloud run jobs execute "$JOB_NAME" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --wait \
            --quiet
          EXECUTION_STATUS=$?
          set -e

          LOGS="$(gcloud logging read \
            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${JOB_NAME}\"" \
            --project "$GCP_PROJECT_ID" \
            --freshness=20m \
            --limit=200 \
            --order=asc \
            --format='value(textPayload)' || true)"
          printf '%s\n' "$LOGS"
          if [ "$EXECUTION_STATUS" -ne 0 ]; then
            echo "TOCA_R29_PRODUCTION_RUNTIME_GATE=FAILED:execution_status=${EXECUTION_STATUS}"
            exit "$EXECUTION_STATUS"
          fi

          RESULT_LINE="$(printf '%s\n' "$LOGS" | grep 'R29_PRODUCTION_RUNTIME_VERIFY=' | tail -n1)"
          test -n "$RESULT_LINE"
          RESULT_JSON="${RESULT_LINE#R29_PRODUCTION_RUNTIME_VERIFY=}"
          printf '%s\n' "$RESULT_JSON" | jq -e \
            --arg sha "$SOURCE_SHA" '
              .schemaVersion == 1 and
              .sourceSha == $sha and
              .executionSurface == "toca.execute" and
              .executionEngine == "executeCoreCapability" and
              .publicToolCount == 12 and
              .videoCapability == "video.caption.embed" and
              .r29Capability == "content_item.channel.adapt" and
              .providerReadbackVerified == true and
              .durableReadbackVerified == true and
              .artifactRows == 1 and
              .outboxRows == 1 and
              .auditValid == true and
              .failClosed == true and
              .externalPublicationExecuted == false
            ' >/dev/null
          printf '%s\n' "$RESULT_JSON" | jq .

          gcloud run jobs deploy "$DRAIN_JOB_NAME" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --set-env-vars "SOURCE_SHA=$SOURCE_SHA,VALIDATION_RUN_ID=$VALIDATION_RUN_ID" \
            --command node \
            --args dist/scripts/drain-r29-validation-outbox.js \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 300s \
            --quiet

          gcloud run jobs execute "$DRAIN_JOB_NAME" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --wait \
            --quiet
          DRAIN_LOGS="$(gcloud logging read \
            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${DRAIN_JOB_NAME}\"" \
            --project "$GCP_PROJECT_ID" \
            --freshness=20m \
            --limit=100 \
            --order=asc \
            --format='value(textPayload)' || true)"
          printf '%s\n' "$DRAIN_LOGS"
          DRAIN_LINE="$(printf '%s\n' "$DRAIN_LOGS" | grep 'R29_VALIDATION_OUTBOX_DRAIN=' | tail -n1)"
          test -n "$DRAIN_LINE"
          DRAIN_JSON="${DRAIN_LINE#R29_VALIDATION_OUTBOX_DRAIN=}"
          printf '%s\n' "$DRAIN_JSON" | jq -e \
            --arg sha "$SOURCE_SHA" \
            --arg run "$VALIDATION_RUN_ID" '
              .schemaVersion == 1 and
              .sourceSha == $sha and
              .validationRunId == $run and
              .matched == 3 and
              .drained == 3 and
              .delivered == 3 and
              .pending == 0 and
              .transport == "r29-production-verifier-validation-sink" and
              .externalPublicationExecuted == false
            ' >/dev/null
          printf '%s\n' "$DRAIN_JSON" | jq .

          cleanup_job "$DRAIN_JOB_NAME"
          cleanup_job "$JOB_NAME"
          assert_job_absent "$DRAIN_JOB_NAME"
          assert_job_absent "$JOB_NAME"
          echo 'TOCA_R29_PRIMARY_TEMP_JOB_CLEANUP=VERIFIED'

          gcloud run jobs deploy "$POST_CLEANUP_JOB_NAME" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --set-env-vars "SOURCE_SHA=$SOURCE_SHA,VALIDATION_RUN_ID=$VALIDATION_RUN_ID" \
            --command node \
            --args dist/scripts/verify-r29-post-cleanup.js \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 300s \
            --quiet

          gcloud run jobs execute "$POST_CLEANUP_JOB_NAME" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --wait \
            --quiet
          POST_LOGS="$(gcloud logging read \
            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${POST_CLEANUP_JOB_NAME}\"" \
            --project "$GCP_PROJECT_ID" \
            --freshness=20m \
            --limit=100 \
            --order=asc \
            --format='value(textPayload)' || true)"
          printf '%s\n' "$POST_LOGS"
          POST_LINE="$(printf '%s\n' "$POST_LOGS" | grep 'R29_POST_CLEANUP_RUNTIME_VERIFY=' | tail -n1)"
          test -n "$POST_LINE"
          POST_JSON="${POST_LINE#R29_POST_CLEANUP_RUNTIME_VERIFY=}"
          printf '%s\n' "$POST_JSON" | jq -e \
            --arg sha "$SOURCE_SHA" \
            --arg run "$VALIDATION_RUN_ID" '
              .schemaVersion == 1 and
              .sourceSha == $sha and
              .validationRunId == $run and
              .migrationsVerified == [
                "020_content_item_versioning_video.sql",
                "021_r29_video_artifacts.sql"
              ] and
              .artifactRows == 1 and
              .providerReadbackVerified == true and
              .r29ReadbackVerified == true and
              .durableContentReadbackVerified == true and
              .auditReadbackVerified == true and
              .failClosed == true and
              .outboxMatched == 3 and
              .outboxDelivered == 3 and
              .outboxPending == 0 and
              .externalPublicationExecuted == false
            ' >/dev/null
          printf '%s\n' "$POST_JSON" | jq .

          cleanup_job "$POST_CLEANUP_JOB_NAME"
          assert_job_absent "$POST_CLEANUP_JOB_NAME"
          assert_job_absent "$DRAIN_JOB_NAME"
          assert_job_absent "$JOB_NAME"
          trap - EXIT
          echo 'TOCA_R29_POST_CLEANUP_TEMP_JOB_CLEANUP=VERIFIED'
          echo 'TOCA_R29_POST_CLEANUP_RUNTIME_GATE=PASS'
          echo 'TOCA_R29_PRODUCTION_RUNTIME_GATE=PASS'

  quality-after-cleanup:
    needs: verify-r29-production-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact deployed SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Re-run full Quality after R29 cleanup
        run: pnpm quality

  promote-video-r29:
    needs: [verify-r29-production-runtime, quality-after-cleanup]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Promote VIDEO / R29
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_SHA"
          echo "VIDEO_R29_PRODUCTION_VERIFIED_SHA=$SOURCE_SHA"
          {
            echo '## VIDEO / R29 — PRODUCTION_VERIFIED'
            echo ''
            echo "- Exact deployed SHA: \`$SOURCE_SHA\`"
            echo '- Runtime provider readback: verified'
            echo '- Durable PostgreSQL readback: verified'
            echo '- R29 migrations: verified'
            echo '- Verifier-owned outbox pending: 0'
            echo '- Temporary Cloud Run jobs: cleanup verified by readback'
            echo '- Fail-closed: verified before and after cleanup'
            echo '- Full Quality after cleanup: passed'
            echo '- External publication: not executed'
          } >> "$GITHUB_STEP_SUMMARY"
