name: Meta Ads CREATE_PAUSED Provider Validation

on:
  workflow_dispatch:
    inputs:
      phase:
        description: PREPARE performs provider preflight only; EXECUTE requires the exact prepared plan and hash
        required: true
        type: choice
        options: [PREPARE, EXECUTE]
      smoke_id:
        description: PREPARE leaves this blank; EXECUTE must use the smokeId returned by PREPARE
        required: false
        type: string
      approved_request_sha256:
        description: Required only for EXECUTE; exact requestSha256 returned by PREPARE
        required: false
        type: string
      plan_base64:
        description: Required only for EXECUTE; exact planBase64 returned by PREPARE
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: meta-ads-create-paused-provider-validation
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_ARTIFACT_REPOSITORY: toca-mcp
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  DATABASE_SECRET_ID: toca-database-url
  TOKEN_SECRET_ID: toca-meta-oauth-token
  MCP_SERVICE_NAME: toca-mcp-production
  META_APP_ID: '2281930145887404'
  META_REDIRECT_URI: https://toca-meta-oauth-staging-990081828836.southamerica-east1.run.app/oauth/meta/callback
  META_ADS_ACCOUNT_ID: '311793958882290'
  META_ADS_CURRENCY: BRL
  META_ADS_PIXEL_ID: '461233076843065'
  META_ADS_PAGE_ID: '306103746115875'
  META_ADS_INSTAGRAM_ACTOR_ID: '17841402033495654'
  META_ADS_DAILY_BUDGET_MINOR: '17000'
  META_ADS_MAX_DAILY_BUDGET_MINOR: '100000'

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm quality

      - name: Validate phase inputs before cloud authentication
        id: request
        shell: bash
        env:
          PHASE: ${{ inputs.phase }}
          PROVIDED_SMOKE_ID: ${{ inputs.smoke_id }}
          APPROVED_SHA: ${{ inputs.approved_request_sha256 }}
          PLAN_B64: ${{ inputs.plan_base64 }}
        run: |
          set -euo pipefail
          if [ "$PHASE" = 'PREPARE' ]; then
            SMOKE_ID="prepare-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            test -z "$APPROVED_SHA"
            test -z "$PLAN_B64"
          else
            printf '%s' "$PROVIDED_SMOKE_ID" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
            printf '%s' "$APPROVED_SHA" | grep -Eq '^[a-f0-9]{64}$'
            test -n "$PLAN_B64"
            printf '%s' "$PLAN_B64" | base64 --decode > /tmp/approved-plan.json
            jq -e \
              --arg account "$META_ADS_ACCOUNT_ID" \
              --arg campaign "TOCA | P0 SMOKE CREATE_PAUSED | $PROVIDED_SMOKE_ID" '
                .account.adAccountId == $account and
                .account.currency == "BRL" and
                .campaign.name == $campaign and
                .campaign.objective == "OUTCOME_SALES" and
                .adSet.promotedObject.pixel_id == "461233076843065" and
                .adSet.promotedObject.custom_event_type == "PURCHASE" and
                .adSet.targeting.targeting_automation.advantage_audience == 0 and
                (.ads | length == 1) and
                (.creatives | length == 1)
              ' /tmp/approved-plan.json >/dev/null
            SMOKE_ID="$PROVIDED_SMOKE_ID"
          fi
          echo "smoke_id=$SMOKE_ID" >> "$GITHUB_OUTPUT"
          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"

      - name: Authenticate deployer to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Assert public MCP Meta Ads writes remain disabled
        shell: bash
        run: |
          set -euo pipefail
          MCP_JSON="$(gcloud run services describe "$MCP_SERVICE_NAME" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=json)"
          printf '%s' "$MCP_JSON" | jq -e '
            .spec.template.spec.containers[0] as $container |
            ([ $container.env[]? | select(.name == "META_ADS_WRITE_ENABLED" and .value == "true") ] | length == 0)
          ' >/dev/null

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - name: Build and push immutable validation image
        shell: bash
        env:
          SMOKE_ID: ${{ steps.request.outputs.smoke_id }}
        run: |
          set -euo pipefail
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/server:meta-ads-validation-${GITHUB_SHA}"
          JOB_NAME="toca-meta-ads-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "JOB_NAME=$JOB_NAME" >> "$GITHUB_ENV"
          echo "SMOKE_ID=$SMOKE_ID" >> "$GITHUB_ENV"

      - name: Deploy PREPARE provider-preflight job
        if: steps.request.outputs.phase == 'PREPARE'
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$JOB_NAME" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --command node \
            --args dist/src/meta-ads-create-paused-smoke.js \
            --set-env-vars "^~^NODE_ENV=production~MCP_ENABLED=false~META_ENABLED=true~META_WEBHOOK_ENABLED=false~META_WEBHOOK_PERSISTENCE_ENABLED=false~INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=false~INSTAGRAM_PUBLICATION_WRITES_ENABLED=false~META_ADS_READ_ENABLED=false~META_ADS_WRITE_ENABLED=false~META_APP_ID=$META_APP_ID~META_APP_SECRET_PROVIDER=env~META_APP_SECRET_KEY=UNUSED_META_APP_SECRET~META_AUTHORIZATION_ENDPOINT=https://www.facebook.com/dialog/oauth~META_TOKEN_ENDPOINT=https://graph.facebook.com/oauth/access_token~META_REDIRECT_URI=$META_REDIRECT_URI~META_REQUESTED_SCOPES=ads_read,ads_management,business_management~META_GRAPH_BASE_URL=https://graph.facebook.com~META_GRAPH_API_VERSION=v24.0~META_TOKEN_STORE_PROVIDER=gcp-secret-manager~META_TOKEN_SECRET_ID=$TOKEN_SECRET_ID~GCP_PROJECT_ID=$GCP_PROJECT_ID~META_ADS_SMOKE_MODE=PREPARE~META_ADS_SMOKE_ACCOUNT_ID=$META_ADS_ACCOUNT_ID~META_ADS_SMOKE_CURRENCY=$META_ADS_CURRENCY~META_ADS_SMOKE_PIXEL_ID=$META_ADS_PIXEL_ID~META_ADS_SMOKE_PAGE_ID=$META_ADS_PAGE_ID~META_ADS_SMOKE_INSTAGRAM_ACTOR_ID=$META_ADS_INSTAGRAM_ACTOR_ID~META_ADS_SMOKE_ID=$SMOKE_ID~META_ADS_SMOKE_DAILY_BUDGET_MINOR=$META_ADS_DAILY_BUDGET_MINOR~META_ADS_SMOKE_MAX_DAILY_BUDGET_MINOR=$META_ADS_MAX_DAILY_BUDGET_MINOR" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 180s \
            --quiet

      - name: Run PREPARE and capture exact descriptor
        if: steps.request.outputs.phase == 'PREPARE'
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs execute "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet
          RESULT_JSON=''
          for attempt in $(seq 1 12); do
            LINE="$(gcloud logging read \
              "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME} AND textPayload:\"META_ADS_SMOKE_PREPARE_RESULT=\"" \
              --project "$GCP_PROJECT_ID" --freshness=15m --limit=50 --order=desc \
              --format='value(textPayload)' | grep 'META_ADS_SMOKE_PREPARE_RESULT=' | head -n1 || true)"
            if [ -n "$LINE" ]; then RESULT_JSON="${LINE#META_ADS_SMOKE_PREPARE_RESULT=}"; break; fi
            sleep 5
          done
          test -n "$RESULT_JSON"
          printf '%s' "$RESULT_JSON" | jq -e \
            --arg smoke "$SMOKE_ID" --arg account "$META_ADS_ACCOUNT_ID" --arg pixel "$META_ADS_PIXEL_ID" '
              .smokeId == $smoke and
              (.requestSha256 | test("^[a-f0-9]{64}$")) and
              (.planBase64 | length > 0) and
              (.account.id | tostring | endswith($account)) and
              .account.currency == "BRL" and
              .pixelAccess.pixelId == $pixel and
              .pixelAccess.accountId == $account and
              .pixelAccess.assigned == true and
              .writeReadiness.validated == true and
              (.grantedScopes | index("ads_management") != null)
            ' >/dev/null
          printf '%s\n' "$RESULT_JSON" | jq . > meta-ads-provider-prepare.json
          echo "META_ADS_PREPARED_SMOKE_ID=$SMOKE_ID"
          echo "META_ADS_PREPARED_REQUEST_SHA256=$(printf '%s' "$RESULT_JSON" | jq -r .requestSha256)"
          echo "META_ADS_PREPARED_PLAN_BASE64=$(printf '%s' "$RESULT_JSON" | jq -r .planBase64)"

      - name: Upload PREPARE evidence
        if: steps.request.outputs.phase == 'PREPARE'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meta-ads-provider-prepare-${{ steps.request.outputs.smoke_id }}
          path: meta-ads-provider-prepare.json
          if-no-files-found: error
          retention-days: 30

      - name: Deploy exact approved EXECUTE job
        if: steps.request.outputs.phase == 'EXECUTE'
        shell: bash
        env:
          APPROVED_SHA: ${{ inputs.approved_request_sha256 }}
          PLAN_B64: ${{ inputs.plan_base64 }}
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$JOB_NAME" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --command node \
            --args dist/src/meta-ads-create-paused-smoke.js \
            --set-env-vars "^~^NODE_ENV=production~MCP_ENABLED=false~META_ENABLED=true~META_WEBHOOK_ENABLED=false~META_WEBHOOK_PERSISTENCE_ENABLED=false~INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=false~INSTAGRAM_PUBLICATION_WRITES_ENABLED=false~META_ADS_READ_ENABLED=false~META_ADS_WRITE_ENABLED=false~META_APP_ID=$META_APP_ID~META_APP_SECRET_PROVIDER=env~META_APP_SECRET_KEY=UNUSED_META_APP_SECRET~META_AUTHORIZATION_ENDPOINT=https://www.facebook.com/dialog/oauth~META_TOKEN_ENDPOINT=https://graph.facebook.com/oauth/access_token~META_REDIRECT_URI=$META_REDIRECT_URI~META_REQUESTED_SCOPES=ads_read,ads_management,business_management~META_GRAPH_BASE_URL=https://graph.facebook.com~META_GRAPH_API_VERSION=v24.0~META_TOKEN_STORE_PROVIDER=gcp-secret-manager~META_TOKEN_SECRET_ID=$TOKEN_SECRET_ID~GCP_PROJECT_ID=$GCP_PROJECT_ID~META_ADS_SMOKE_MODE=EXECUTE~META_ADS_SMOKE_ACCOUNT_ID=$META_ADS_ACCOUNT_ID~META_ADS_SMOKE_CURRENCY=$META_ADS_CURRENCY~META_ADS_SMOKE_PIXEL_ID=$META_ADS_PIXEL_ID~META_ADS_SMOKE_PAGE_ID=$META_ADS_PAGE_ID~META_ADS_SMOKE_INSTAGRAM_ACTOR_ID=$META_ADS_INSTAGRAM_ACTOR_ID~META_ADS_SMOKE_ID=$SMOKE_ID~META_ADS_SMOKE_DAILY_BUDGET_MINOR=$META_ADS_DAILY_BUDGET_MINOR~META_ADS_SMOKE_MAX_DAILY_BUDGET_MINOR=$META_ADS_MAX_DAILY_BUDGET_MINOR~META_ADS_SMOKE_APPROVED_SHA256=$APPROVED_SHA~META_ADS_SMOKE_PLAN_B64=$PLAN_B64" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 180s \
            --quiet

      - name: Execute one exact approved PAUSED mutation and verify provider settlement
        if: steps.request.outputs.phase == 'EXECUTE'
        shell: bash
        env:
          APPROVED_SHA: ${{ inputs.approved_request_sha256 }}
        run: |
          set -euo pipefail
          gcloud run jobs execute "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet
          RESULT_JSON=''
          for attempt in $(seq 1 12); do
            LINE="$(gcloud logging read \
              "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME} AND textPayload:\"META_ADS_SMOKE_EXECUTE_RESULT=\"" \
              --project "$GCP_PROJECT_ID" --freshness=15m --limit=50 --order=desc \
              --format='value(textPayload)' | grep 'META_ADS_SMOKE_EXECUTE_RESULT=' | head -n1 || true)"
            if [ -n "$LINE" ]; then RESULT_JSON="${LINE#META_ADS_SMOKE_EXECUTE_RESULT=}"; break; fi
            sleep 5
          done
          test -n "$RESULT_JSON"
          printf '%s' "$RESULT_JSON" | jq -e \
            --arg smoke "$SMOKE_ID" '
              .smokeId == $smoke and
              .status == "PAUSED" and
              (.campaignId | length > 0) and
              (.adSetId | length > 0) and
              (.creativeIds | length == 1) and
              (.adIds | length == 1) and
              .providerVerification.campaign.status == "PAUSED" and
              .providerVerification.adSet.status == "PAUSED" and
              ([.providerVerification.ads[].status] | all(. == "PAUSED")) and
              ([.providerVerification.ads[].effective_status] | all(. != "ACTIVE"))
            ' >/dev/null
          printf '%s\n' "$RESULT_JSON" | jq --arg approvedSha "$APPROVED_SHA" --arg actor "$GITHUB_ACTOR" \
            '. + {approvedRequestSha256: $approvedSha, githubActor: $actor}' > meta-ads-provider-execute.json

      - name: Upload EXECUTE evidence
        if: steps.request.outputs.phase == 'EXECUTE' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meta-ads-provider-execute-${{ steps.request.outputs.smoke_id }}
          path: meta-ads-provider-execute.json
          if-no-files-found: error
          retention-days: 90

      - name: Reassert public MCP Meta Ads writes remain disabled
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          MCP_JSON="$(gcloud run services describe "$MCP_SERVICE_NAME" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$MCP_JSON" | jq -e '
            .spec.template.spec.containers[0] as $container |
            ([ $container.env[]? | select(.name == "META_ADS_WRITE_ENABLED" and .value == "true") ] | length == 0)
          ' >/dev/null

      - name: Remove temporary provider validation job
        if: always()
        run: gcloud run jobs delete "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet || true
