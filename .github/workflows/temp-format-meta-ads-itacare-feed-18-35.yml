name: TEMP Format Meta Ads Itacare Feed 18-35

on:
  push:
    branches:
      - wave/meta-ads-itacare-feed-18-35-create-paused-20260923
    paths:
      - 'src/meta-ads-the-party-itacare-2026-10-11-feed-18-35-create-paused.ts'
      - '.github/workflows/temp-format-meta-ads-itacare-feed-18-35.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: wave/meta-ads-itacare-feed-18-35-create-paused-20260923
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/meta-ads-the-party-itacare-2026-10-11-feed-18-35-create-paused.ts
      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/meta-ads-the-party-itacare-2026-10-11-feed-18-35-create-paused.ts; then
            echo "NO_FORMAT_CHANGES=1"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/meta-ads-the-party-itacare-2026-10-11-feed-18-35-create-paused.ts
          git commit -m "style(meta-ads): apply canonical formatting"
          git push origin HEAD:wave/meta-ads-itacare-feed-18-35-create-paused-20260923
