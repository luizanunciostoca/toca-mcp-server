name: TEMP The Party Reel Batch Diagnostic

on:
  push:
    branches:
      - ops/the-party-reel-gen-20260904
    paths:
      - .github/workflows/_tmp-the-party-reel-batch-diagnostic.yml

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  FAILED_JOB_NAME: toca-tp-reel-gen-33891585150-1

jobs:
  diagnose:
    if: github.ref == 'refs/heads/ops/the-party-reel-gen-20260904'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Authenticate proven deployer identity
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Capture sanitized retained Cloud Run logs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          gcloud logging read \
            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${FAILED_JOB_NAME}\"" \
            --project "$GCP_PROJECT_ID" \
            --freshness=3h \
            --limit=500 \
            --order=asc \
            --format=json > /tmp/raw.json

          node <<'NODE'
          const fs = require('fs');
          const entries = JSON.parse(fs.readFileSync('/tmp/raw.json', 'utf8'));
          const redact = (value) => String(value)
            .replace(/Bearer\s+[A-Za-z0-9._~+\/-]+=*/giu, 'Bearer <REDACTED>')
            .replace(/\beyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\b/gu, '<JWT>')
            .replace(/\bya29\.[A-Za-z0-9._-]+\b/gu, '<GOOGLE_TOKEN>')
            .replace(/https?:\/\/[^\s"']+/giu, '<URL>')
            .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/giu, '<EMAIL>')
            .replace(/\b[a-f0-9]{64}\b/giu, '<SHA256>')
            .replace(/\b[A-Za-z0-9_-]{48,}\b/gu, '<TOKEN>')
            .replace(/\s+/gu, ' ')
            .trim()
            .slice(0, 1200);
          const messageFor = (entry) => {
            if (typeof entry?.textPayload === 'string') return entry.textPayload;
            if (typeof entry?.jsonPayload?.message === 'string') return entry.jsonPayload.message;
            if (typeof entry?.jsonPayload?.error === 'string') return entry.jsonPayload.error;
            if (typeof entry?.protoPayload?.status?.message === 'string') return entry.protoPayload.status.message;
            return '';
          };
          const rows = (Array.isArray(entries) ? entries : []).map((entry) => ({
            severity: String(entry?.severity ?? 'DEFAULT'),
            timestamp: String(entry?.timestamp ?? ''),
            log: String(entry?.logName ?? '').replaceAll('%2F', '/').split('/logs/').at(-1) ?? 'unknown',
            message: redact(messageFor(entry)),
          })).filter((row) => row.message && /ERROR|FAILED|PERMISSION|DENIED|UNAUTH|FORBIDDEN|DRIVE|VERTEX|VEO|QUOTA|RATE|429|400|403|404|SOURCE|APPROVAL|VIDEO|SCENE|PERSON|SAFETY|INVALID/iu.test(row.message));
          fs.writeFileSync('diagnostic/diagnostic.json', JSON.stringify({
            schemaVersion: 1,
            failedJobName: process.env.FAILED_JOB_NAME,
            entryCount: entries.length,
            sanitizedEntries: rows.slice(0, 120),
            rawPayloadPersisted: false,
          }, null, 2));
          console.log(JSON.stringify(rows.slice(-20), null, 2));
          NODE

      - name: Upload sanitized diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: the-party-reel-batch-diagnostic
          path: diagnostic/diagnostic.json
          if-no-files-found: error
          retention-days: 7
