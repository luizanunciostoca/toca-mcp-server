name: TEMP Staging Auth Boundary V10 2026-08-23

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  diagnose-auth-boundary:
    if: github.head_ref == 'ops/diag-staging-auth-boundary-v8-fd37-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fd3799153cf41b6d573dde8889f355247b7eaf74
          persist-credentials: false
          fetch-depth: 1

      - name: Load staging coordinates
        id: config
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'fd3799153cf41b6d573dde8889f355247b7eaf74'
          node scripts/export-staging-deploy-config.mjs infra/environments/staging.json > /tmp/staging.env
          cat /tmp/staging.env >> "$GITHUB_ENV"
          set -a; source /tmp/staging.env; set +a
          test "$GCP_PROJECT_ID" = 'toca-mcp-next-staging'
          test "$GCP_PROJECT_NUMBER" = '729069789107'
          test "$GCP_REGION" = 'southamerica-east1'
          echo "wif=$GCP_WORKLOAD_IDENTITY_PROVIDER" >> "$GITHUB_OUTPUT"
          echo "deployer_sa=$GCP_DEPLOY_SERVICE_ACCOUNT" >> "$GITHUB_OUTPUT"

      - name: Authenticate staging deployer only
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ steps.config.outputs.wif }}
          service_account: ${{ steps.config.outputs.deployer_sa }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Inspect v2 auth boundary and effective permissions
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)" = "$GCP_DEPLOY_SERVICE_ACCOUNT"
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          trap 'unset ACCESS_TOKEN' EXIT
          mkdir -p /tmp/auth-boundary

          read_service() {
            local service="$1" output="$2"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              "https://run.googleapis.com/v2/projects/${GCP_PROJECT_ID}/locations/${GCP_REGION}/services/${service}" \
              > "$output"
          }
          test_permissions() {
            local service="$1" output="$2"
            curl --fail --silent --show-error --request POST \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H 'Content-Type: application/json' \
              --data '{"permissions":["run.routes.invoke","run.services.get"]}' \
              "https://run.googleapis.com/v2/projects/${GCP_PROJECT_ID}/locations/${GCP_REGION}/services/${service}:testIamPermissions" \
              > "$output"
          }

          read_service "$GCP_CLOUD_RUN_MCP_SERVICE" /tmp/auth-boundary/mcp.json
          read_service "$GCP_CLOUD_RUN_WEBHOOK_SERVICE" /tmp/auth-boundary/webhook.json
          test_permissions "$GCP_CLOUD_RUN_MCP_SERVICE" /tmp/auth-boundary/mcp-perms.json
          test_permissions "$GCP_CLOUD_RUN_WEBHOOK_SERVICE" /tmp/auth-boundary/webhook-perms.json

          gcloud run services get-iam-policy "$GCP_CLOUD_RUN_MCP_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > /tmp/auth-boundary/mcp-iam.json
          gcloud run services get-iam-policy "$GCP_CLOUD_RUN_WEBHOOK_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > /tmp/auth-boundary/webhook-iam.json

          safe_service() {
            jq -c '{
              ingress:(.ingress // null),
              defaultUriDisabled:(.defaultUriDisabled // false),
              invokerIamDisabled:(.invokerIamDisabled // false),
              iapEnabled:(.iapEnabled // false),
              threatDetectionEnabled:(.threatDetectionEnabled // false),
              uri:(.uri // null),
              urls:(.urls // []),
              customAudiences:(.customAudiences // []),
              terminalConditionState:(.terminalCondition.state // null),
              latestReadyRevision:(.latestReadyRevision // null)
            }' "$1"
          }

          MCP_STATE="$(safe_service /tmp/auth-boundary/mcp.json)"
          WEBHOOK_STATE="$(safe_service /tmp/auth-boundary/webhook.json)"
          MCP_PERMS="$(jq -c '.permissions // [] | sort' /tmp/auth-boundary/mcp-perms.json)"
          WEBHOOK_PERMS="$(jq -c '.permissions // [] | sort' /tmp/auth-boundary/webhook-perms.json)"
          MEMBER="serviceAccount:$GCP_DEPLOY_SERVICE_ACCOUNT"
          MCP_DEPLOYER_INVOKER="$(jq --arg member "$MEMBER" '[.bindings[]? | select(.role == "roles/run.invoker") | select(any(.members[]?; . == $member)) | select(.condition == null)] | length' /tmp/auth-boundary/mcp-iam.json)"
          WEBHOOK_ALLUSERS_INVOKER="$(jq '[.bindings[]? | select(.role == "roles/run.invoker") | select(any(.members[]?; . == "allUsers"))] | length' /tmp/auth-boundary/webhook-iam.json)"

          cat > /tmp/comment.md <<EOF
          STAGING_AUTH_BOUNDARY_DIAG_V10 RUN_ID=${GITHUB_RUN_ID} CANDIDATE=fd3799153cf41b6d573dde8889f355247b7eaf74

          MCP_V2_AUTH_STATE=${MCP_STATE}
          WEBHOOK_V2_AUTH_STATE=${WEBHOOK_STATE}
          MCP_EFFECTIVE_TEST_IAM_PERMISSIONS=${MCP_PERMS}
          WEBHOOK_EFFECTIVE_TEST_IAM_PERMISSIONS=${WEBHOOK_PERMS}
          MCP_DEPLOYER_UNCONDITIONAL_INVOKER_COUNT=${MCP_DEPLOYER_INVOKER}
          WEBHOOK_ALLUSERS_INVOKER_COUNT=${WEBHOOK_ALLUSERS_INVOKER}

          READ_ONLY=true
          ACCESS_TOKEN_EXPOSED=false
          PRODUCTION_ACCESS=false
          PROVIDER_ACCESS=false
          TRAFFIC_MUTATION=false
          IAM_MUTATION=false
          EOF
          gh issue comment 151 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
