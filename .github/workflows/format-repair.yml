name: Temporary format repair

on:
  push:
    branches:
      - fix/quality-format-20260819

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply canonical Prettier formatting
        run: >-
          pnpm exec prettier --write
          control/creative-standards/sunset-story-standard.v1.json
          docs/operations/branch-cleanup-inventory-2026-08-17.md
          docs/operations/google-ads-operational-closeout.md
          docs/operations/omnichannel-operational-closeout.md
          docs/operations/v1-canonical-state-2026-08-17.md

      - name: Commit formatting repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            control/creative-standards/sunset-story-standard.v1.json \
            docs/operations/branch-cleanup-inventory-2026-08-17.md \
            docs/operations/google-ads-operational-closeout.md \
            docs/operations/omnichannel-operational-closeout.md \
            docs/operations/v1-canonical-state-2026-08-17.md
          git commit -m "style: apply canonical Prettier formatting"
          git push origin HEAD:fix/quality-format-20260819
