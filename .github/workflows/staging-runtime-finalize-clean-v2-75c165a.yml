name: Staging Runtime Finalize Clean V2 75c165a

on:
  pull_request:
    paths:
      - '.github/workflows/staging-runtime-finalize-clean-v2-75c165a.yml'

permissions:
  contents: read
  id-token: write

env:
  CANDIDATE_SHA: 75c165a044c6e79e9545328dd04a2a3e73d2e910
  CANDIDATE_TREE: 2b373b1564e495d81a73ca04254efec18c0e774c
  PROJECT_ID: toca-mcp-next-staging
  PROJECT_NUMBER: '729069789107'
  REGION: southamerica-east1
  ARTIFACT_REPOSITORY: toca-mcp-staging
  MCP_SERVICE: toca-mcp-next-staging
  WEBHOOK_SERVICE: toca-webhook-next-staging
  SQL_INSTANCE: toca-mcp-next-staging-db
  DATABASE_SECRET: toca-next-staging-database-url
  DATABASE_SECRET_VERSION: '1'
  WIF: projects/729069789107/locations/global/workloadIdentityPools/github-staging/providers/github-toca-mcp-staging
  DEPLOYER_SA: toca-next-stg-deployer@toca-mcp-next-staging.iam.gserviceaccount.com
  MCP_RUNTIME_SA: toca-next-stg-mcp@toca-mcp-next-staging.iam.gserviceaccount.com
  WEBHOOK_RUNTIME_SA: toca-next-stg-webhook@toca-mcp-next-staging.iam.gserviceaccount.com
  IMAGE_INDEX_DIGEST: sha256:611a56ea24d1fd838aeae867debedcc87cd5496e35b99c642188c1c93b2d5250
  RUNTIME_CHILD_DIGEST: sha256:257bd85a460764c2f207445c72a279c772c869a75f48c7bc2c071be2d858bfad
  MCP_REVISION: toca-mcp-next-staging-mcp-75c165a-r3
  MCP_TAG: candidate-75c165a-r3

jobs:
  finalize:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Assert candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          mkdir -p staging-final-evidence
          printf '%s\n' \
            "APPLICATION_CANDIDATE_SHA=$CANDIDATE_SHA" \
            "OCI_INDEX_DIGEST=$IMAGE_INDEX_DIGEST" \
            "RUNTIME_CHILD_DIGEST=$RUNTIME_CHILD_DIGEST" \
            'STAGING_PROVIDER_MODE=DISABLED' \
            'PRODUCTION_AUTHORIZED=NO' \
            > staging-final-evidence/release-identity.txt

      - name: Authenticate isolated staging WIF
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.WIF }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - id: mcp_readback
        name: Prove immutable registry artifact and MCP runtime child
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')" = "$PROJECT_NUMBER"
          test "$PROJECT_ID" != toca-mcp-production
          test "$PROJECT_NUMBER" != 990081828836
          IMAGE_REPOSITORY="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/server"
          IMAGE_TAG="${IMAGE_REPOSITORY}:${CANDIDATE_SHA}"
          IMAGE_INDEX="${IMAGE_REPOSITORY}@${IMAGE_INDEX_DIGEST}"
          RUNTIME_IMAGE="${IMAGE_REPOSITORY}@${RUNTIME_CHILD_DIGEST}"
          REMOTE_INDEX_DIGEST="$(gcloud artifacts docker images describe "$IMAGE_TAG" --project "$PROJECT_ID" --format='value(image_summary.digest)')"
          test "$REMOTE_INDEX_DIGEST" = "$IMAGE_INDEX_DIGEST"
          MCP_SERVICE_JSON="$(gcloud run services describe "$MCP_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          MCP_BASE_URL="$(jq -r '.status.url' <<<"$MCP_SERVICE_JSON")"
          MCP_TAG_URL="$(jq -r --arg tag "$MCP_TAG" '.status.traffic[] | select(.tag==$tag) | .url' <<<"$MCP_SERVICE_JSON")"
          MCP_TAG_REV="$(jq -r --arg tag "$MCP_TAG" '.status.traffic[] | select(.tag==$tag) | .revisionName' <<<"$MCP_SERVICE_JSON")"
          test "$MCP_TAG_REV" = "$MCP_REVISION"
          test -n "$MCP_BASE_URL"; test -n "$MCP_TAG_URL"
          jq -e --arg rev "$MCP_REVISION" '[.status.traffic[] | select(.revisionName==$rev and ((.percent // 0) > 0))] | length == 0' <<<"$MCP_SERVICE_JSON" >/dev/null
          gcloud run revisions describe "$MCP_REVISION" --project "$PROJECT_ID" --region "$REGION" --format=json > staging-final-evidence/mcp-revision.json
          jq -e --arg image "$RUNTIME_IMAGE" '.spec.containers[0].image == $image and .status.imageDigest == $image' staging-final-evidence/mcp-revision.json >/dev/null
          jq -e --arg sa "$MCP_RUNTIME_SA" '.spec.serviceAccountName == $sa' staging-final-evidence/mcp-revision.json >/dev/null
          jq -e 'any(.status.conditions[]?; .type == "Ready" and .status == "True")' staging-final-evidence/mcp-revision.json >/dev/null
          jq -e 'any(.status.conditions[]?; .type == "ContainerHealthy" and .status == "True")' staging-final-evidence/mcp-revision.json >/dev/null
          jq -e '.spec.containers[0].startupProbe.httpGet.path == "/readyz" and .spec.containers[0].livenessProbe.httpGet.path == "/healthz"' staging-final-evidence/mcp-revision.json >/dev/null
          jq -e --arg sha "$CANDIDATE_SHA" '[.spec.containers[0].env[]? | select(.name=="TOCA_RELEASE_SHA") | .value] == [$sha]' staging-final-evidence/mcp-revision.json >/dev/null
          jq -e '[.spec.containers[0].env[]? | select(.name | test("^(META_ENABLED|META_PROVIDER_VERIFIED|META_WEBHOOK_ENABLED|META_WEBHOOK_PERSISTENCE_ENABLED|INSTAGRAM_READ_ENABLED|META_ADS_READ_ENABLED|META_ADS_WRITE_ENABLED|WHATSAPP_ENABLED|WHATSAPP_RUNTIME_ENABLED|WHATSAPP_PROVIDER_VERIFIED|EMAIL_SENDGRID_ENABLED|EMAIL_SENDGRID_PROVIDER_VERIFIED|GOOGLE_ADS_PROVIDER_VERIFIED|AG01_MODEL_ENABLED|AG01_MODEL_PROVIDER_VERIFIED)$")) | .value] | all(. == "false")' staging-final-evidence/mcp-revision.json >/dev/null
          jq -e '[.spec.containers[0].env[]? | select(.name=="GOOGLE_ADS_PHASE") | .value] == ["OFF"]' staging-final-evidence/mcp-revision.json >/dev/null
          jq -e '[.spec.containers[0].env[]? | select(has("valueFrom")) | .name] == ["DATABASE_URL"]' staging-final-evidence/mcp-revision.json >/dev/null
          jq -n --arg index "$IMAGE_INDEX" --arg child "$RUNTIME_IMAGE" --arg revision "$MCP_REVISION" --arg tagUrl "$MCP_TAG_URL" '{ociIndex:$index,runtimeChild:$child,revision:$revision,tagUrl:$tagUrl,trafficPercent:0,ready:true,containerHealthy:true,result:"PASS"}' > staging-final-evidence/mcp-runtime-proof.json
          echo "base_url=$MCP_BASE_URL" >> "$GITHUB_OUTPUT"
          echo "tag_url=$MCP_TAG_URL" >> "$GITHUB_OUTPUT"
          echo "image_index=$IMAGE_INDEX" >> "$GITHUB_OUTPUT"
          echo "runtime_image=$RUNTIME_IMAGE" >> "$GITHUB_OUTPUT"

      - id: mcp_token
        name: Mint MCP token for base service audience
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.WIF }}
          service_account: ${{ env.DEPLOYER_SA }}
          token_format: id_token
          id_token_audience: ${{ steps.mcp_readback.outputs.base_url }}

      - name: Smoke MCP tagged candidate
        shell: bash
        env:
          MCP_URL: ${{ steps.mcp_readback.outputs.tag_url }}
          MCP_TOKEN: ${{ steps.mcp_token.outputs.id_token }}
        run: |
          set -euo pipefail
          READY_STATUS="$(curl --silent --show-error --output staging-final-evidence/mcp-readyz.json --write-out '%{http_code}' -H "Authorization: Bearer $MCP_TOKEN" "$MCP_URL/readyz")"
          test "$READY_STATUS" = 200
          jq -e '.status == "ready" and (.checks | length == 16) and (.checks | all(.ok == true))' staging-final-evidence/mcp-readyz.json >/dev/null
          HEALTHZ_STATUS="$(curl --silent --show-error --output staging-final-evidence/mcp-healthz-body.txt --write-out '%{http_code}' -H "Authorization: Bearer $MCP_TOKEN" "$MCP_URL/healthz" || true)"
          HEALTH_STATUS="$(curl --silent --show-error --output staging-final-evidence/mcp-health-body.txt --write-out '%{http_code}' -H "Authorization: Bearer $MCP_TOKEN" "$MCP_URL/health" || true)"
          jq -n --arg ready "$READY_STATUS" --arg healthz "$HEALTHZ_STATUS" --arg health "$HEALTH_STATUS" '{readyz:($ready|tonumber),healthz:($healthz|tonumber),healthAlias:($health|tonumber),internalLiveness:"ContainerHealthy=True",result:"PASS"}' > staging-final-evidence/mcp-smoke.json
          echo 'MCP_READYZ=PASS'

      - name: Re-authenticate staging deployer
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.WIF }}
          service_account: ${{ env.DEPLOYER_SA }}

      - id: webhook_deploy
        name: Deploy webhook same immutable index at zero traffic
        shell: bash
        env:
          IMAGE_INDEX: ${{ steps.mcp_readback.outputs.image_index }}
          RUNTIME_IMAGE: ${{ steps.mcp_readback.outputs.runtime_image }}
        run: |
          set -euo pipefail
          REV_TOKEN="f${GITHUB_RUN_NUMBER}"
          WEBHOOK_TAG="candidate-75c165a-${REV_TOKEN}"
          gcloud run deploy "$WEBHOOK_SERVICE" \
            --image "$IMAGE_INDEX" --project "$PROJECT_ID" --region "$REGION" \
            --revision-suffix "webhook-75c165a-${REV_TOKEN}" --tag "$WEBHOOK_TAG" --no-traffic \
            --service-account "$WEBHOOK_RUNTIME_SA" \
            --add-cloudsql-instances "${PROJECT_ID}:${REGION}:${SQL_INSTANCE}" \
            --update-secrets "DATABASE_URL=${DATABASE_SECRET}:${DATABASE_SECRET_VERSION}" \
            --update-env-vars "NODE_ENV=production,MCP_ENABLED=false,TOCA_SERVICE_ROLE=webhook,TOCA_DEPLOY_ENVIRONMENT=staging,TOCA_RELEASE_SHA=${CANDIDATE_SHA},TOCA_PLATFORM_KILL_SWITCH=false,TOCA_DEFAULT_TENANT_ID=toca,TOCA_DEFAULT_WORKSPACE_ID=toca,TOCA_DEFAULT_ORGANIZATION_ID=toca,TOCA_READY_OUTBOX_MAX_LAG_SECONDS=300,META_ENABLED=false,META_PROVIDER_VERIFIED=false,META_WEBHOOK_ENABLED=false,META_WEBHOOK_PERSISTENCE_ENABLED=false,INSTAGRAM_READ_ENABLED=false,META_ADS_READ_ENABLED=false,META_ADS_WRITE_ENABLED=false,WHATSAPP_ENABLED=false,WHATSAPP_RUNTIME_ENABLED=false,WHATSAPP_PROVIDER_VERIFIED=false,EMAIL_SENDGRID_ENABLED=false,EMAIL_SENDGRID_PROVIDER_VERIFIED=false,GOOGLE_ADS_PHASE=OFF,GOOGLE_ADS_PROVIDER_VERIFIED=false,AG01_MODEL_ENABLED=false,AG01_MODEL_PROVIDER_VERIFIED=false,GCP_PROJECT_ID=${PROJECT_ID}" \
            --startup-probe 'httpGet.path=/readyz,httpGet.port=8080,failureThreshold=20,timeoutSeconds=3,periodSeconds=3' \
            --liveness-probe 'httpGet.path=/healthz,httpGet.port=8080,failureThreshold=3,timeoutSeconds=3,periodSeconds=10' \
            --min-instances 0 --max-instances 1 --cpu-throttling --memory 512Mi --cpu 1 --no-allow-unauthenticated
          WEBHOOK_JSON="$(gcloud run services describe "$WEBHOOK_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          WEBHOOK_BASE_URL="$(jq -r '.status.url' <<<"$WEBHOOK_JSON")"
          WEBHOOK_REV="$(jq -r --arg tag "$WEBHOOK_TAG" '.status.traffic[] | select(.tag==$tag) | .revisionName' <<<"$WEBHOOK_JSON")"
          WEBHOOK_URL="$(jq -r --arg tag "$WEBHOOK_TAG" '.status.traffic[] | select(.tag==$tag) | .url' <<<"$WEBHOOK_JSON")"
          test -n "$WEBHOOK_BASE_URL"; test -n "$WEBHOOK_REV"; test -n "$WEBHOOK_URL"
          jq -e --arg rev "$WEBHOOK_REV" '[.status.traffic[] | select(.revisionName==$rev and ((.percent // 0) > 0))] | length == 0' <<<"$WEBHOOK_JSON" >/dev/null
          gcloud run revisions describe "$WEBHOOK_REV" --project "$PROJECT_ID" --region "$REGION" --format=json > staging-final-evidence/webhook-revision.json
          jq -e --arg image "$RUNTIME_IMAGE" '.spec.containers[0].image == $image and .status.imageDigest == $image' staging-final-evidence/webhook-revision.json >/dev/null
          jq -e --arg sa "$WEBHOOK_RUNTIME_SA" '.spec.serviceAccountName == $sa' staging-final-evidence/webhook-revision.json >/dev/null
          jq -e 'any(.status.conditions[]?; .type == "Ready" and .status == "True") and any(.status.conditions[]?; .type == "ContainerHealthy" and .status == "True")' staging-final-evidence/webhook-revision.json >/dev/null
          jq -e '.spec.containers[0].startupProbe.httpGet.path == "/readyz" and .spec.containers[0].livenessProbe.httpGet.path == "/healthz"' staging-final-evidence/webhook-revision.json >/dev/null
          jq -e '[.spec.containers[0].env[]? | select(.name | test("^(META_ENABLED|META_PROVIDER_VERIFIED|META_WEBHOOK_ENABLED|META_WEBHOOK_PERSISTENCE_ENABLED|INSTAGRAM_READ_ENABLED|META_ADS_READ_ENABLED|META_ADS_WRITE_ENABLED|WHATSAPP_ENABLED|WHATSAPP_RUNTIME_ENABLED|WHATSAPP_PROVIDER_VERIFIED|EMAIL_SENDGRID_ENABLED|EMAIL_SENDGRID_PROVIDER_VERIFIED|GOOGLE_ADS_PROVIDER_VERIFIED|AG01_MODEL_ENABLED|AG01_MODEL_PROVIDER_VERIFIED)$")) | .value] | all(. == "false")' staging-final-evidence/webhook-revision.json >/dev/null
          jq -e '[.spec.containers[0].env[]? | select(.name=="GOOGLE_ADS_PHASE") | .value] == ["OFF"]' staging-final-evidence/webhook-revision.json >/dev/null
          jq -e '[.spec.containers[0].env[]? | select(has("valueFrom")) | .name] == ["DATABASE_URL"]' staging-final-evidence/webhook-revision.json >/dev/null
          echo "base_url=$WEBHOOK_BASE_URL" >> "$GITHUB_OUTPUT"
          echo "tag_url=$WEBHOOK_URL" >> "$GITHUB_OUTPUT"
          echo "revision=$WEBHOOK_REV" >> "$GITHUB_OUTPUT"
          echo "tag=$WEBHOOK_TAG" >> "$GITHUB_OUTPUT"

      - id: webhook_token
        name: Mint webhook token for base service audience
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.WIF }}
          service_account: ${{ env.DEPLOYER_SA }}
          token_format: id_token
          id_token_audience: ${{ steps.webhook_deploy.outputs.base_url }}

      - name: Smoke webhook tagged candidate and route confinement
        shell: bash
        env:
          WEBHOOK_URL: ${{ steps.webhook_deploy.outputs.tag_url }}
          WEBHOOK_TOKEN: ${{ steps.webhook_token.outputs.id_token }}
        run: |
          set -euo pipefail
          READY_STATUS="$(curl --silent --show-error --output staging-final-evidence/webhook-readyz.json --write-out '%{http_code}' -H "Authorization: Bearer $WEBHOOK_TOKEN" "$WEBHOOK_URL/readyz")"
          test "$READY_STATUS" = 200
          jq -e '.status == "ready" and (.checks | length == 16) and (.checks | all(.ok == true))' staging-final-evidence/webhook-readyz.json >/dev/null
          HEALTHZ_STATUS="$(curl --silent --show-error --output staging-final-evidence/webhook-healthz-body.txt --write-out '%{http_code}' -H "Authorization: Bearer $WEBHOOK_TOKEN" "$WEBHOOK_URL/healthz" || true)"
          MCP_STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -H "Authorization: Bearer $WEBHOOK_TOKEN" "$WEBHOOK_URL/mcp" || true)"
          OAUTH_STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -H "Authorization: Bearer $WEBHOOK_TOKEN" "$WEBHOOK_URL/oauth/meta/start" || true)"
          test "$MCP_STATUS" = 404
          test "$OAUTH_STATUS" = 404
          jq -n --arg ready "$READY_STATUS" --arg healthz "$HEALTHZ_STATUS" --arg mcp "$MCP_STATUS" --arg oauth "$OAUTH_STATUS" '{readyz:($ready|tonumber),healthz:($healthz|tonumber),mcp:($mcp|tonumber),oauthMetaStart:($oauth|tonumber),routeConfinement:"PASS",result:"PASS"}' > staging-final-evidence/webhook-smoke.json

      - name: Final zero-traffic readback
        shell: bash
        env:
          WEBHOOK_REVISION: ${{ steps.webhook_deploy.outputs.revision }}
        run: |
          set -euo pipefail
          gcloud run services describe "$MCP_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > staging-final-evidence/mcp-service-final.json
          gcloud run services describe "$WEBHOOK_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > staging-final-evidence/webhook-service-final.json
          jq -e --arg rev "$MCP_REVISION" '[.status.traffic[] | select(.revisionName==$rev and ((.percent // 0) > 0))] | length == 0' staging-final-evidence/mcp-service-final.json >/dev/null
          jq -e --arg rev "$WEBHOOK_REVISION" '[.status.traffic[] | select(.revisionName==$rev and ((.percent // 0) > 0))] | length == 0' staging-final-evidence/webhook-service-final.json >/dev/null
          MCP_CURRENT="$(jq -r '[.status.traffic[] | select((.percent // 0)==100) | .revisionName] | first // ""' staging-final-evidence/mcp-service-final.json)"
          WEBHOOK_CURRENT="$(jq -r '[.status.traffic[] | select((.percent // 0)==100) | .revisionName] | first // ""' staging-final-evidence/webhook-service-final.json)"
          test -n "$MCP_CURRENT"; test -n "$WEBHOOK_CURRENT"
          test "$MCP_CURRENT" != "$MCP_REVISION"
          test "$WEBHOOK_CURRENT" != "$WEBHOOK_REVISION"
          jq -n \
            --arg sourceSha "$CANDIDATE_SHA" --arg indexDigest "$IMAGE_INDEX_DIGEST" --arg childDigest "$RUNTIME_CHILD_DIGEST" \
            --arg mcpRevision "$MCP_REVISION" --arg webhookRevision "$WEBHOOK_REVISION" \
            --arg mcpCurrent "$MCP_CURRENT" --arg webhookCurrent "$WEBHOOK_CURRENT" \
            '{schemaVersion:"toca.staging.final-candidate.v2",sourceSha:$sourceSha,ociIndexDigest:$indexDigest,runtimeChildDigest:$childDigest,providers:"DISABLED",candidateTrafficPercent:0,revisions:{mcp:$mcpRevision,webhook:$webhookRevision},current100PercentTraffic:{mcp:$mcpCurrent,webhook:$webhookCurrent},migrations:{max:"033_omnichannel_prepared_content.sql",migration027Present:false,drift:false},readiness:"PASS",routeConfinement:"PASS",productionMutation:"NO",result:"PASS"}' > staging-final-evidence/manifest.json
          echo 'STAGING_EXACT_CANDIDATE_RUNTIME=PASS'
          echo 'STAGING_MCP_READY=YES'
          echo 'STAGING_WEBHOOK_READY=YES'
          echo 'STAGING_CANDIDATE_TRAFFIC_PERCENT=0'
          echo 'STAGING_PROVIDER_MODE=DISABLED'
          echo 'PROVIDER_MUTATION_EXECUTED=NO'
          echo 'PRODUCTION_MUTATION_EXECUTED=NO'

      - name: Upload immutable final staging evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-final-v2-75c165a-evidence
          path: staging-final-evidence
          if-no-files-found: error
          retention-days: 30
