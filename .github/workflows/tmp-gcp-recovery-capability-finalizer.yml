name: Temporary GCP Recovery Capability Finalizer

on:
  push:
    branches:
      - fix/gcp-recovery-capability-preflight-20260916
    paths:
      - '.github/workflows/tmp-gcp-recovery-capability-finalizer.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/gcp-recovery-capability-preflight-20260916
          persist-credentials: false
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Finalize capability preflight semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          workflow_path = Path('.github/workflows/instagram-gcp-publication-recovery-preflight.yml')
          test_path = Path('test/instagram-gcp-publication-recovery-preflight.test.ts')
          workflow = workflow_path.read_text()

          transforms = [
              ('  repair-bindings:\n', '  bootstrap-contract:\n'),
              ('    needs: repair-bindings\n', '    needs: bootstrap-contract\n'),
          ]
          for old, new in transforms:
              if workflow.count(old) != 1:
                  raise SystemExit(f'EXPECTED_JOB_SEMANTIC_TRANSFORM_NOT_FOUND_EXACTLY_ONCE: {old}')
              workflow = workflow.replace(old, new, 1)

          artifact_pattern = r'name: instagram-gcp-bootstrap-boundary-\d+'
          matches = re.findall(artifact_pattern, workflow)
          if len(matches) != 1:
              raise SystemExit('EXPECTED_HARDCODED_BOOTSTRAP_ARTIFACT_NAME_NOT_FOUND_EXACTLY_ONCE')
          expression = '$' + '{{ github.run_id }}'
          workflow = re.sub(
              artifact_pattern,
              'name: instagram-gcp-bootstrap-boundary-' + expression,
              workflow,
              count=1,
          )
          workflow_path.write_text(workflow)

          test_lines = test_path.read_text().splitlines()
          anchor = "    expect(workflow).toContain('GCP_PUBLICATION_EXTERNAL_BOOTSTRAP_BOUNDARY=VERIFIED');"
          if test_lines.count(anchor) != 1:
              raise SystemExit('EXPECTED_BOOTSTRAP_TEST_ANCHOR_NOT_FOUND_EXACTLY_ONCE')
          i = test_lines.index(anchor)
          test_lines[i + 1:i + 1] = [
              "    expect(workflow).toContain('bootstrap-contract:');",
              "    expect(workflow).toContain('needs: bootstrap-contract');",
          ]
          test_path.write_text('\n'.join(test_lines) + '\n')
          PY
          pnpm prettier --write \
            .github/workflows/instagram-gcp-publication-recovery-preflight.yml \
            test/instagram-gcp-publication-recovery-preflight.test.ts
          git diff --check
      - name: Upload finalized blobs and publish SHA manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upload_blob() {
            local path="$1"
            jq -Rs '{content: ., encoding: "utf-8"}' "$path" > /tmp/blob-payload.json
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header 'Content-Type: application/json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
              --data-binary @/tmp/blob-payload.json \
              | jq -r '.sha'
          }
          workflow_blob="$(upload_blob .github/workflows/instagram-gcp-publication-recovery-preflight.yml)"
          test_blob="$(upload_blob test/instagram-gcp-publication-recovery-preflight.test.ts)"
          [[ "$workflow_blob" =~ ^[0-9a-f]{40}$ ]]
          [[ "$test_blob" =~ ^[0-9a-f]{40}$ ]]

          jq -n \
            --arg sourceSha "$GITHUB_SHA" \
            --arg workflowBlobSha "$workflow_blob" \
            --arg testBlobSha "$test_blob" \
            '{schemaVersion:1,sourceSha:$sourceSha,workflowBlobSha:$workflowBlobSha,testBlobSha:$testBlobSha}' \
            > /tmp/blob-shas.json
          manifest_b64="$(base64 -w 0 /tmp/blob-shas.json)"
          jq -n \
            --arg message 'chore(ci): record finalized capability preflight blob SHAs' \
            --arg content "$manifest_b64" \
            --arg branch 'fix/gcp-recovery-capability-preflight-20260916' \
            '{message:$message,content:$content,branch:$branch}' \
            > /tmp/manifest-put.json
          curl --fail --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/control/tmp-gcp-recovery-capability-final-blob-shas.json" \
            --data-binary @/tmp/manifest-put.json \
            > /tmp/manifest-response.json
          jq -e '.content.path == "control/tmp-gcp-recovery-capability-final-blob-shas.json"' /tmp/manifest-response.json >/dev/null
          echo 'CAPABILITY_PREFLIGHT_FINAL_BLOB_MANIFEST=CREATED'
