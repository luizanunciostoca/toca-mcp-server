name: Temporary Add Scheduled Publication Mode

on:
  push:
    branches:
      - ops/restore-gcp-instagram-scheduler-20260916
    paths:
      - 'scripts/tmp-add-scheduled-publication-mode.py'
      - '.github/workflows/tmp-add-scheduled-publication-mode.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 1

      - name: Apply scheduled-mode patch
        run: python3 scripts/tmp-add-scheduled-publication-mode.py

      - name: Verify and retire patcher
        run: |
          set -euo pipefail
          bash -n scripts/marketing-publish-now.sh
          grep -Fq 'PUBLICATION_POLICY_MODE="${PUBLICATION_POLICY_MODE:-FAST_PATH}"' scripts/marketing-publish-now.sh
          grep -Fq '.schedulingPolicy == "SCHEDULED_GCP"' scripts/marketing-publish-now.sh
          grep -Fq 'test "$scheduled_delta" -ge 0' scripts/marketing-publish-now.sh
          grep -Fq 'COMMAND_FILE="${COMMAND_FILE:-control/marketing-publish-now-command.json}"' scripts/marketing-publish-now.sh
          git rm scripts/tmp-add-scheduled-publication-mode.py
          git rm .github/workflows/tmp-add-scheduled-publication-mode.yml
          git diff --check

      - name: Commit final patch
        run: |
          set -euo pipefail
          git config user.name 'toca-scheduler[bot]'
          git config user.email 'toca-scheduler[bot]@users.noreply.github.com'
          git add scripts/marketing-publish-now.sh
          git commit -m 'feat(instagram): add governed scheduled publication mode'
          git push origin HEAD:ops/restore-gcp-instagram-scheduler-20260916
