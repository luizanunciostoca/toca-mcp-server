name: Meta Ads Architecture Format

on:
  push:
    branches:
      - feat/meta-ads-controlled-create-paused

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/meta-ads-controlled-create-paused
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format architecture check
        run: pnpm exec prettier --write scripts/architecture-check.mjs
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/architecture-check.mjs
          git commit -m "style(meta-ads): format architecture check"
          git push origin HEAD:feat/meta-ads-controlled-create-paused
