name: Provider Onboarding Control Plane Discovery

on:
  pull_request:
    paths:
      - '.github/workflows/provider-onboarding-control-plane-discovery.yml'
  push:
    branches:
      - audit/provider-onboarding-email-whatsapp-20260821
    paths:
      - '.github/workflows/provider-onboarding-control-plane-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  discover:
    name: Discover provider control-plane metadata
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      # These are non-secret production identifiers already recorded by the
      # repository's prior M-FOUND-12/provider-read evidence. Secret values are
      # never fetched by this workflow.
      GCP_PROJECT_ID: toca-mcp-production
      GCP_REGION: southamerica-east1
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
      GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
      EXPECTED_META_SECRET: toca-meta-oauth-token

    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Authenticate deployer to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Discover secret metadata and runtime IAM only
        id: discovery
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ALL_SECRETS < <(gcloud secrets list --project "$GCP_PROJECT_ID" --format='value(name)' | sort)
          mapfile -t SENDGRID_CANDIDATES < <(printf '%s\n' "${ALL_SECRETS[@]}" | grep -Ei 'sendgrid' || true)
          META_PRESENT=false
          if printf '%s\n' "${ALL_SECRETS[@]}" | grep -Fxq "$EXPECTED_META_SECRET"; then META_PRESENT=true; fi

          secret_summary() {
            local secret="$1"
            local latest_enabled
            latest_enabled="$(gcloud secrets versions list "$secret" --project "$GCP_PROJECT_ID" --filter='state=ENABLED' --sort-by='~name' --limit=1 --format='value(name)' || true)"
            local iam=false
            if [[ -n "$latest_enabled" ]]; then
              policy="$(gcloud secrets get-iam-policy "$secret" --project "$GCP_PROJECT_ID" --format=json)"
              if jq -e --arg member "serviceAccount:${GCP_RUNTIME_SERVICE_ACCOUNT}" \
                '[.bindings[]? | select(.role=="roles/secretmanager.secretAccessor") | .members[]?] | index($member) != null' \
                <<<"$policy" >/dev/null; then iam=true; fi
            fi
            jq -n --arg id "$secret" --arg version "$latest_enabled" --argjson iam "$iam" \
              '{secretId:$id,latestEnabledVersion:($version|select(length>0)//null),runtimeSecretAccessor:$iam}'
          }

          META_JSON='null'
          if [[ "$META_PRESENT" == true ]]; then META_JSON="$(secret_summary "$EXPECTED_META_SECRET")"; fi
          SENDGRID_JSON='[]'
          if (( ${#SENDGRID_CANDIDATES[@]} > 0 )); then
            SENDGRID_JSON="$(for secret in "${SENDGRID_CANDIDATES[@]}"; do secret_summary "$secret"; done | jq -s .)"
          fi

          SENDGRID_UNIQUE=false
          if [[ "$(jq 'length' <<<"$SENDGRID_JSON")" -eq 1 ]]; then SENDGRID_UNIQUE=true; fi
          META_READY="$(jq -r '(.latestEnabledVersion != null) and (.runtimeSecretAccessor == true)' <<<"$META_JSON" 2>/dev/null || echo false)"
          SENDGRID_READY=false
          if [[ "$SENDGRID_UNIQUE" == true ]]; then
            SENDGRID_READY="$(jq -r '.[0] | (.latestEnabledVersion != null) and (.runtimeSecretAccessor == true)' <<<"$SENDGRID_JSON")"
          fi
          PASS=false
          if [[ "$META_READY" == true && "$SENDGRID_READY" == true ]]; then PASS=true; fi

          jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            --arg project "$GCP_PROJECT_ID" \
            --arg region "$GCP_REGION" \
            --arg runtime "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --argjson meta "$META_JSON" \
            --argjson sendgrid "$SENDGRID_JSON" \
            --argjson pass "$PASS" \
            '{schemaVersion:1,sourceSha:$sha,workflowRunId:$run,mode:"SECRET_METADATA_ONLY",project:$project,region:$region,runtimeIdentity:$runtime,meta:$meta,sendgridCandidates:$sendgrid,pass:$pass,safety:{secretValuesRead:false,providerApiCalled:false,providerWrites:false,emailSent:false,whatsappSent:false,lifecyclePromoted:false}}' \
            > provider-control-plane-discovery.json
          jq . provider-control-plane-discovery.json
          echo "pass=$PASS" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized control-plane evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-control-plane-discovery-${{ github.sha }}
          path: provider-control-plane-discovery.json
          if-no-files-found: error
          retention-days: 90

      - name: Fail closed when provider secret metadata is incomplete or ambiguous
        if: always()
        run: jq -e '.pass == true' provider-control-plane-discovery.json >/dev/null
