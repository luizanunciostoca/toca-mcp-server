name: Temporary Controlled Direct Webhook Write V3

on:
  push:
    branches:
      - feat/instagram-engagement-messaging
    paths:
      - '.github/workflows/tmp-controlled-direct-webhook-write-v3.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  DATABASE_SECRET_ID: toca-database-url
  TOKEN_SECRET_ID: toca-meta-oauth-token
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  INSTAGRAM_ACCOUNT_ID: '17841402033495654'
  WRITE_JOB: toca-controlled-direct-webhook-write-v3

jobs:
  controlled-write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2

      - name: Build fail-closed Instagram Send API writer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/direct-write-v3
          cp package.json pnpm-lock.yaml /tmp/direct-write-v3/
          cat > /tmp/direct-write-v3/write.mjs <<'NODE'
          import { createHash } from 'node:crypto';
          import pg from 'pg';

          const { Pool } = pg;
          const env = process.env;
          const databaseUrl = env.DATABASE_URL;
          const accessToken = env.META_ACCESS_TOKEN?.trim();
          const accountId = env.INSTAGRAM_ACCOUNT_ID;
          const runNonce = env.RUN_NONCE ?? 'unknown';
          const targetText = 'TESTE TOCA MCP DIRECT WEBHOOK 002';
          const replyText = 'TESTE TOCA MCP DIRECT REPLY CONTROLADO 002';
          const since = new Date('2026-08-12T01:19:06Z');
          const apiVersion = 'v24.0';
          const sha256 = (value) => createHash('sha256').update(value, 'utf8').digest('hex');
          const targetHash = sha256(targetText);
          const replyHash = sha256(replyText);
          const mark = (key, value) => console.log(`SAFE_DIRECT_V3_${key}=${value}`);

          if (!databaseUrl || !accessToken || !accountId) throw new Error('DIRECT_V3_CONFIGURATION_MISSING');
          if (env.INSTAGRAM_ENGAGEMENT_WRITES_ENABLED !== 'true') throw new Error('DIRECT_V3_KILL_SWITCH_CLOSED');

          async function instagram(path, init = {}, stage = 'UNKNOWN') {
            const method = String(init.method ?? 'GET').toUpperCase();
            const maxAttempts = method === 'GET' ? 3 : 1;
            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const response = await fetch(`https://graph.instagram.com/${apiVersion}/${path}`, {
                ...init,
                headers: {
                  Authorization: `Bearer ${accessToken}`,
                  Accept: 'application/json',
                  ...(init.headers ?? {}),
                },
              });
              const body = await response.json().catch(() => ({}));
              if (response.ok) return body;
              mark(`${stage}_HTTP_STATUS`, response.status);
              if (Number.isInteger(body?.error?.code)) mark(`${stage}_PROVIDER_CODE`, body.error.code);
              if (Number.isInteger(body?.error?.error_subcode)) mark(`${stage}_PROVIDER_SUBCODE`, body.error.error_subcode);
              const transient = response.status === 429 || response.status >= 500;
              if (method === 'GET' && transient && attempt < maxAttempts) {
                await new Promise((resolve) => setTimeout(resolve, attempt * 1000));
                continue;
              }
              throw new Error(`DIRECT_V3_${stage}_HTTP_${response.status}`);
            }
            throw new Error(`DIRECT_V3_${stage}_RETRY_EXHAUSTED`);
          }

          async function main() {
            const pool = new Pool({ connectionString: databaseUrl });
            try {
              mark('RUN_NONCE', runNonce);
              const matches = await pool.query(
                `select event_id, sender_scoped_id, provider_message_id
                   from meta_webhook_events
                  where channel='DIRECT' and text_sha256=$1
                    and sender_scoped_id is not null and provider_message_id is not null
                    and received_at >= $2
                  order by received_at desc limit 2`,
                [targetHash, since],
              );
              mark('TARGET_MATCHES', matches.rowCount);
              if (matches.rowCount !== 1) throw new Error(`DIRECT_V3_TARGET_MATCH_COUNT_${matches.rowCount}`);
              const target = matches.rows[0];
              if (typeof target.sender_scoped_id !== 'string' || typeof target.provider_message_id !== 'string') {
                throw new Error('DIRECT_V3_ROUTING_INVALID');
              }

              // Validate the stored token on the Instagram host before any POST.
              const identity = await instagram('me?fields=id,username', {}, 'IDENTITY');
              if (String(identity?.id ?? '') !== accountId) {
                mark('IDENTITY_MATCH', 0);
                throw new Error('DIRECT_V3_INSTAGRAM_IDENTITY_MISMATCH');
              }
              mark('IDENTITY_MATCH', 1);

              const idempotencyKey = sha256(`instagram-direct-controlled-v3|${target.provider_message_id}|${replyHash}`);
              const correlationId = `controlled-direct-v3:${idempotencyKey}`;
              const inserted = await pool.query(
                `insert into provider_publications
                   (correlation_id,provider,account_id,state,idempotency_key,payload)
                 values ($1,'meta',$2,'PENDING',$3,$4::jsonb)
                 on conflict (idempotency_key) do nothing
                 returning correlation_id`,
                [correlationId, accountId, idempotencyKey, JSON.stringify({
                  channel:'DIRECT', contract:'instagram-send-api-v3',
                  targetEventIdHash:sha256(target.event_id),
                  providerMessageIdHash:sha256(target.provider_message_id), replyHash,
                })],
              );

              if (inserted.rowCount === 0) {
                const existing = await pool.query('select state from provider_publications where idempotency_key=$1', [idempotencyKey]);
                const state = existing.rows[0]?.state;
                if (state === 'SUCCEEDED') {
                  mark('WRITE_ALREADY_PRESENT', 1);
                  mark('WRITE_CREATED', 0);
                  return;
                }
                throw new Error(`DIRECT_V3_IDEMPOTENCY_AMBIGUOUS_${String(state ?? 'MISSING')}`);
              }
              mark('IDEMPOTENCY_RESERVED', 1);

              let created;
              try {
                created = await instagram(`${accountId}/messages`, {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({
                    recipient: { id: target.sender_scoped_id },
                    messaging_type: 'RESPONSE',
                    message: { text: replyText },
                  }),
                }, 'SEND');
              } catch (error) {
                await pool.query(
                  `update provider_publications set state='FAILED',last_error=$2,updated_at=now()
                    where correlation_id=$1 and state='PENDING'`,
                  [correlationId, error instanceof Error ? error.message : 'SEND_FAILURE'],
                );
                throw error;
              }

              if (typeof created?.message_id !== 'string' || typeof created?.recipient_id !== 'string') {
                await pool.query(
                  `update provider_publications set state='FAILED',last_error='PROVIDER_IDS_MISSING',updated_at=now()
                    where correlation_id=$1 and state='PENDING'`, [correlationId]);
                throw new Error('DIRECT_V3_PROVIDER_IDS_MISSING');
              }
              if (created.recipient_id !== target.sender_scoped_id) {
                await pool.query(
                  `update provider_publications set state='FAILED',external_resource_id=$2,last_error='RECIPIENT_MISMATCH',updated_at=now()
                    where correlation_id=$1 and state='PENDING'`, [correlationId, created.message_id]);
                throw new Error('DIRECT_V3_RECIPIENT_MISMATCH');
              }

              const updated = await pool.query(
                `update provider_publications set state='SUCCEEDED',external_resource_id=$2,
                   payload=payload || $3::jsonb,last_error=null,updated_at=now()
                  where correlation_id=$1 and state='PENDING' returning correlation_id`,
                [correlationId, created.message_id, JSON.stringify({
                  providerAcknowledged:true,
                  providerMessageIdHash:sha256(created.message_id),
                  recipientHash:sha256(created.recipient_id),
                })],
              );
              if (updated.rowCount !== 1) throw new Error('DIRECT_V3_SUCCESS_STATE_NOT_PERSISTED');
              mark('WRITE_ALREADY_PRESENT', 0);
              mark('WRITE_CREATED', 1);
              mark('PROVIDER_ACKNOWLEDGED', 1);
            } finally {
              await pool.end();
            }
          }

          main().catch((error) => {
            console.error(`DIRECT_V3_FATAL=${error instanceof Error ? error.message : 'UNKNOWN'}`);
            process.exitCode = 1;
          });
          NODE

          node --check /tmp/direct-write-v3/write.mjs
          echo 'SAFE_DIRECT_V3_SYNTAX_CHECK=1'
          cat > /tmp/direct-write-v3/Dockerfile <<'DOCKER'
          FROM node:24-bookworm-slim
          WORKDIR /app
          RUN corepack enable && corepack prepare pnpm@10.15.0 --activate
          COPY package.json pnpm-lock.yaml ./
          RUN pnpm install --prod --frozen-lockfile
          COPY write.mjs ./write.mjs
          USER node
          CMD ["node", "write.mjs"]
          DOCKER
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/controlled-direct-webhook-write-v3:${GITHUB_SHA}"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" /tmp/direct-write-v3
          docker push "$IMAGE"
          echo "WRITE_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Execute one controlled Direct proof
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$WRITE_JOB" \
            --image "$WRITE_IMAGE" --project "$PROJECT_ID" --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --set-env-vars "INSTAGRAM_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID,INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=true,RUN_NONCE=$GITHUB_SHA" \
            --set-secrets "META_ACCESS_TOKEN=$TOKEN_SECRET_ID:latest,DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --max-retries 0 --task-timeout 180s --quiet
          set +e
          gcloud run jobs execute "$WRITE_JOB" --project "$PROJECT_ID" --region "$REGION" --wait --quiet
          STATUS=$?
          set -e
          sleep 3
          LOGS="$(gcloud logging read \
            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$WRITE_JOB\"" \
            --project "$PROJECT_ID" --freshness=10m --limit=100 --format='value(textPayload)' 2>/dev/null || true)"
          echo '--- DIRECT V3 MARKERS ---'
          echo "$LOGS" | grep -E 'SAFE_DIRECT_V3_|DIRECT_V3_FATAL=' || true
          if [ "$STATUS" -ne 0 ]; then exit "$STATUS"; fi
          TARGETS="$(echo "$LOGS" | sed -n 's/^SAFE_DIRECT_V3_TARGET_MATCHES=//p' | tail -1)"
          CREATED="$(echo "$LOGS" | sed -n 's/^SAFE_DIRECT_V3_WRITE_CREATED=//p' | tail -1)"
          ALREADY="$(echo "$LOGS" | sed -n 's/^SAFE_DIRECT_V3_WRITE_ALREADY_PRESENT=//p' | tail -1)"
          ACK="$(echo "$LOGS" | sed -n 's/^SAFE_DIRECT_V3_PROVIDER_ACKNOWLEDGED=//p' | tail -1)"
          test "$TARGETS" = "1"
          if [ "${CREATED:-0}" = "1" ]; then test "${ACK:-0}" = "1"; else test "${ALREADY:-0}" = "1"; fi

      - name: Confirm public boundary remains writes-off
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe toca-meta-oauth-staging --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/service.json
          VALUE="$(jq -r '[.spec.template.spec.containers[0].env[]? | select(.name == "INSTAGRAM_ENGAGEMENT_WRITES_ENABLED") | .value][0] // "__MISSING__"' /tmp/service.json)"
          test "$VALUE" = "false"
          echo 'SAFE_PUBLIC_BOUNDARY_WRITES_ENABLED=0'

      - name: Cleanup temporary write job
        if: always()
        shell: bash
        run: gcloud run jobs delete "$WRITE_JOB" --project "$PROJECT_ID" --region "$REGION" --quiet || true
