name: M-FOUND-11 Test Fixture Fix One-Shot

on:
  push:
    branches:
      - feat/m-found-11-toca-core-mcp-surface
    paths:
      - '.github/workflows/m-found-11-test-fixture-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/m-found-11-toca-core-mcp-surface
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add required approval evidence to fixture
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'tests/m-found-11-core-surface.test.ts';
          let source = fs.readFileSync(path, 'utf8');
          const from = `        correlationId: 'test:approval-read',\n`;
          const to = `        correlationId: 'test:approval-read',\n        evidence: ['test:approval-request'],\n`;
          if (!source.includes(from)) throw new Error('M_FOUND_11_FIXTURE_PATTERN_NOT_FOUND');
          source = source.replace(from, to);
          fs.writeFileSync(path, source);
          NODE
          pnpm exec prettier --write tests/m-found-11-core-surface.test.ts
          pnpm exec vitest run tests/m-found-11-core-surface.test.ts
          pnpm eslint tests/m-found-11-core-surface.test.ts
      - name: Commit fixture correction
        shell: bash
        run: |
          set -euo pipefail
          git add tests/m-found-11-core-surface.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(m-found-11): include required approval evidence'
          git push origin HEAD:feat/m-found-11-toca-core-mcp-surface
