name: Foundation IAM Recheck One-Shot

on:
  push:
    branches: [ops/foundation-iam-recheck-20260815]
    paths: ['.github/workflows/foundation-iam-recheck-once.yml']

permissions:
  contents: read
  id-token: write

concurrency:
  group: foundation-iam-recheck-once
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_INFRA_ADMIN_SERVICE_ACCOUNT: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  CLOUD_SQL_INSTANCE: toca-mcp-db

jobs:
  recheck:
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 10
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Assert read-only source delta
        shell: bash
        run: |
          set -euo pipefail
          BASE='b9b44d172a044306a41115f5247813cd2dca5a4f'
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(git diff --name-only "$BASE" HEAD)" = '.github/workflows/foundation-iam-recheck-once.yml'

      - name: Authenticate infrastructure-admin
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_INFRA_ADMIN_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Recheck Monitoring inventory and permissions as infrastructure-admin
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          cat > /tmp/monitoring-request.json <<'JSON'
          {"permissions":["monitoring.notificationChannels.get","monitoring.notificationChannels.list","monitoring.notificationChannels.create","monitoring.notificationChannels.update","monitoring.notificationChannels.delete","monitoring.alertPolicies.get","monitoring.alertPolicies.list","monitoring.alertPolicies.create","monitoring.alertPolicies.update","monitoring.alertPolicies.delete"]}
          JSON
          IAM_HTTP="$(curl --silent --output /tmp/infra-monitoring-iam.json --write-out '%{http_code}' -X POST -H "Authorization: Bearer ${ACCESS_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/monitoring-request.json "https://cloudresourcemanager.googleapis.com/v1/projects/${GCP_PROJECT_ID}:testIamPermissions")"
          CHANNEL_HTTP="$(curl --silent --output /tmp/infra-channels.json --write-out '%{http_code}' -H "Authorization: Bearer ${ACCESS_TOKEN}" -H 'Accept: application/json' "https://monitoring.googleapis.com/v3/projects/${GCP_PROJECT_ID}/notificationChannels?pageSize=100")"
          POLICY_HTTP="$(curl --silent --output /tmp/infra-policies.json --write-out '%{http_code}' -H "Authorization: Bearer ${ACCESS_TOKEN}" -H 'Accept: application/json' "https://monitoring.googleapis.com/v3/projects/${GCP_PROJECT_ID}/alertPolicies?pageSize=100")"
          GRANTED='[]'; CHANNEL_COUNT=0; POLICY_COUNT=0
          if [ "$IAM_HTTP" = '200' ]; then GRANTED="$(jq -c '(.permissions // []) | sort' /tmp/infra-monitoring-iam.json)"; fi
          if [ "$CHANNEL_HTTP" = '200' ]; then CHANNEL_COUNT="$(jq '(.notificationChannels // []) | length' /tmp/infra-channels.json)"; fi
          if [ "$POLICY_HTTP" = '200' ]; then POLICY_COUNT="$(jq '(.alertPolicies // []) | length' /tmp/infra-policies.json)"; fi
          jq -n --arg identity infrastructure-admin --argjson iamHttp "$IAM_HTTP" --argjson channelHttp "$CHANNEL_HTTP" --argjson policyHttp "$POLICY_HTTP" --argjson granted "$GRANTED" --argjson channelCount "$CHANNEL_COUNT" --argjson policyCount "$POLICY_COUNT" '{identity:$identity,iamHttp:$iamHttp,grantedPermissions:$granted,notificationChannels:{httpStatus:$channelHttp,count:$channelCount},alertPolicies:{httpStatus:$policyHttp,count:$policyCount}}' > reliability-monitoring-infra-recheck.json
          echo "MONITORING_INFRA_IAM_HTTP=$IAM_HTTP GRANTED=$GRANTED CHANNEL_HTTP=$CHANNEL_HTTP CHANNELS=$CHANNEL_COUNT POLICY_HTTP=$POLICY_HTTP POLICIES=$POLICY_COUNT"

      - name: Reauthenticate deployer
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Recheck Monitoring inventory and permissions as deployer
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          cat > /tmp/monitoring-request.json <<'JSON'
          {"permissions":["monitoring.notificationChannels.get","monitoring.notificationChannels.list","monitoring.notificationChannels.create","monitoring.notificationChannels.update","monitoring.notificationChannels.delete","monitoring.alertPolicies.get","monitoring.alertPolicies.list","monitoring.alertPolicies.create","monitoring.alertPolicies.update","monitoring.alertPolicies.delete"]}
          JSON
          IAM_HTTP="$(curl --silent --output /tmp/deployer-monitoring-iam.json --write-out '%{http_code}' -X POST -H "Authorization: Bearer ${ACCESS_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/monitoring-request.json "https://cloudresourcemanager.googleapis.com/v1/projects/${GCP_PROJECT_ID}:testIamPermissions")"
          CHANNEL_HTTP="$(curl --silent --output /tmp/deployer-channels.json --write-out '%{http_code}' -H "Authorization: Bearer ${ACCESS_TOKEN}" -H 'Accept: application/json' "https://monitoring.googleapis.com/v3/projects/${GCP_PROJECT_ID}/notificationChannels?pageSize=100")"
          POLICY_HTTP="$(curl --silent --output /tmp/deployer-policies.json --write-out '%{http_code}' -H "Authorization: Bearer ${ACCESS_TOKEN}" -H 'Accept: application/json' "https://monitoring.googleapis.com/v3/projects/${GCP_PROJECT_ID}/alertPolicies?pageSize=100")"
          GRANTED='[]'; CHANNEL_COUNT=0; POLICY_COUNT=0
          if [ "$IAM_HTTP" = '200' ]; then GRANTED="$(jq -c '(.permissions // []) | sort' /tmp/deployer-monitoring-iam.json)"; fi
          if [ "$CHANNEL_HTTP" = '200' ]; then CHANNEL_COUNT="$(jq '(.notificationChannels // []) | length' /tmp/deployer-channels.json)"; fi
          if [ "$POLICY_HTTP" = '200' ]; then POLICY_COUNT="$(jq '(.alertPolicies // []) | length' /tmp/deployer-policies.json)"; fi
          jq -n --arg identity deployer --argjson iamHttp "$IAM_HTTP" --argjson channelHttp "$CHANNEL_HTTP" --argjson policyHttp "$POLICY_HTTP" --argjson granted "$GRANTED" --argjson channelCount "$CHANNEL_COUNT" --argjson policyCount "$POLICY_COUNT" '{identity:$identity,iamHttp:$iamHttp,grantedPermissions:$granted,notificationChannels:{httpStatus:$channelHttp,count:$channelCount},alertPolicies:{httpStatus:$policyHttp,count:$policyCount}}' > reliability-monitoring-deployer-recheck.json
          echo "MONITORING_DEPLOYER_IAM_HTTP=$IAM_HTTP GRANTED=$GRANTED CHANNEL_HTTP=$CHANNEL_HTTP CHANNELS=$CHANNEL_COUNT POLICY_HTTP=$POLICY_HTTP POLICIES=$POLICY_COUNT"

      - name: Recheck DR permissions and recovery controls as deployer
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          cat > /tmp/dr-request.json <<'JSON'
          {"permissions":["cloudsql.instances.get","cloudsql.backupRuns.get","cloudsql.backupRuns.list","cloudsql.instances.create","cloudsql.instances.delete","cloudsql.instances.clone","cloudsql.instances.restoreBackup"]}
          JSON
          IAM_HTTP="$(curl --silent --output /tmp/dr-iam.json --write-out '%{http_code}' -X POST -H "Authorization: Bearer ${ACCESS_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/dr-request.json "https://cloudresourcemanager.googleapis.com/v1/projects/${GCP_PROJECT_ID}:testIamPermissions")"
          test "$IAM_HTTP" = '200'
          GRANTED="$(jq -c '(.permissions // []) | sort' /tmp/dr-iam.json)"
          INSTANCE_JSON="$(gcloud sql instances describe "$CLOUD_SQL_INSTANCE" --project "$GCP_PROJECT_ID" --format=json)"
          printf '%s' "$INSTANCE_JSON" | jq -e '.state == "RUNNABLE" and .settings.deletionProtectionEnabled == true and .settings.backupConfiguration.enabled == true and .settings.backupConfiguration.pointInTimeRecoveryEnabled == true' >/dev/null
          BACKUPS_JSON="$(gcloud sql backups list --instance "$CLOUD_SQL_INSTANCE" --project "$GCP_PROJECT_ID" --limit=20 --format=json)"
          LATEST_END="$(jq -r '[.[] | select(.status == "SUCCESSFUL" and .endTime != null)] | sort_by(.endTime) | last | .endTime // empty' <<<"$BACKUPS_JSON")"
          test -n "$LATEST_END"
          NOW_EPOCH="$(date -u +%s)"; BACKUP_EPOCH="$(date -u -d "$LATEST_END" +%s)"; AGE_SECONDS=$((NOW_EPOCH-BACKUP_EPOCH))
          jq -n --arg identity deployer --argjson granted "$GRANTED" --arg latestSuccessfulBackup "$LATEST_END" --argjson backupAgeSeconds "$AGE_SECONDS" '{identity:$identity,grantedPermissions:$granted,instance:"toca-mcp-db",pitrEnabled:true,automatedBackupsEnabled:true,deletionProtectionEnabled:true,latestSuccessfulBackup:$latestSuccessfulBackup,backupAgeSeconds:$backupAgeSeconds,restoreDrillCreateCapable:($granted|index("cloudsql.instances.create")!=null),restoreDrillDeleteCapable:($granted|index("cloudsql.instances.delete")!=null),restoreBackupCapable:($granted|index("cloudsql.instances.restoreBackup")!=null)}' > reliability-dr-recheck.json
          echo "DR_GRANTED=$GRANTED LATEST_BACKUP=$LATEST_END AGE_SECONDS=$AGE_SECONDS"

      - name: Upload sanitized read-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-iam-recheck-${{ github.run_id }}
          path: |
            reliability-monitoring-infra-recheck.json
            reliability-monitoring-deployer-recheck.json
            reliability-dr-recheck.json
          if-no-files-found: warn
          retention-days: 90
