name: Staging Migration Drift Proof 75c165a

on:
  pull_request:
    paths:
      - '.github/workflows/staging-migration-drift-proof-75c165a.yml'

permissions:
  contents: read
  id-token: write

env:
  CANDIDATE_SHA: 75c165a044c6e79e9545328dd04a2a3e73d2e910
  CANDIDATE_TREE: 2b373b1564e495d81a73ca04254efec18c0e774c
  PROJECT_ID: toca-mcp-next-staging
  PROJECT_NUMBER: '729069789107'
  REGION: southamerica-east1
  SQL_INSTANCE: toca-mcp-next-staging-db
  DATABASE_SECRET: toca-next-staging-database-url
  DATABASE_SECRET_VERSION: '1'
  WIF: projects/729069789107/locations/global/workloadIdentityPools/github-staging/providers/github-toca-mcp-staging
  DEPLOYER_SA: toca-next-stg-deployer@toca-mcp-next-staging.iam.gserviceaccount.com

jobs:
  prove:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Assert candidate identity and local migration authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          mapfile -t LOCAL < <(find migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          test "${LOCAL[-1]}" = '033_omnichannel_prepared_content.sql'
          if printf '%s\n' "${LOCAL[@]}" | grep -q '^027_'; then
            echo 'MIGRATION_027_PRESENT=YES' >&2
            exit 1
          fi
          printf '%s\n' "${LOCAL[@]}" > /tmp/local-migrations.txt
          echo 'LOCAL_MIGRATION_AUTHORITY=PASS'

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Authenticate isolated staging WIF
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.WIF }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Fail closed on project identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')" = "$PROJECT_NUMBER"
          test "$PROJECT_ID" != 'toca-mcp-production'
          test "$PROJECT_NUMBER" != '990081828836'
          echo 'STAGING_PROJECT_IDENTITY=PASS'

      - name: Start checksum-pinned Cloud SQL Auth Proxy
        shell: bash
        run: |
          set -euo pipefail
          PROXY_VERSION='2.24.1'
          PROXY_SHA256='fae2766aac9d614a2bdef2f2a7778f3d054f3acd5ff07a81a9e300bd471512eb'
          curl --fail --silent --show-error --location "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v${PROXY_VERSION}/cloud-sql-proxy.linux.amd64" --output /tmp/cloud-sql-proxy
          echo "${PROXY_SHA256}  /tmp/cloud-sql-proxy" | sha256sum --check --strict
          chmod 0755 /tmp/cloud-sql-proxy
          /tmp/cloud-sql-proxy --address 127.0.0.1 --port 5432 "${PROJECT_ID}:${REGION}:${SQL_INSTANCE}" >/tmp/cloud-sql-proxy.log 2>&1 &
          echo "CLOUD_SQL_PROXY_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if (echo >/dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/cloud-sql-proxy.log >&2
          exit 1

      - name: Apply idempotent migrations and prove zero drift
        shell: bash
        run: |
          set -euo pipefail
          RAW_DATABASE_URL="$(gcloud secrets versions access "$DATABASE_SECRET_VERSION" --secret "$DATABASE_SECRET" --project "$PROJECT_ID")"
          export DATABASE_URL="$(RAW_DATABASE_URL="$RAW_DATABASE_URL" node --input-type=module -e '
            const url = new URL(process.env.RAW_DATABASE_URL);
            url.hostname = "127.0.0.1";
            url.port = "5432";
            for (const key of ["host","port","ssl","sslmode","sslcert","sslkey","sslrootcert","sslaccept"]) url.searchParams.delete(key);
            process.stdout.write(url.toString());
          ')"
          unset RAW_DATABASE_URL
          export DATABASE_SSL=false
          pnpm migrate
          node --input-type=module - <<'NODE' > /tmp/db-migrations.txt
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL, ssl: false });
          const result = await pool.query('select version from schema_migrations order by version');
          for (const row of result.rows) console.log(row.version);
          await pool.end();
          NODE
          diff -u /tmp/local-migrations.txt /tmp/db-migrations.txt
          test "$(tail -n 1 /tmp/db-migrations.txt)" = '033_omnichannel_prepared_content.sql'
          if grep -q '^027_' /tmp/db-migrations.txt; then
            echo 'STAGING_MIGRATION_027_PRESENT=YES' >&2
            exit 1
          fi
          echo "STAGING_MIGRATION_COUNT=$(wc -l < /tmp/db-migrations.txt)"
          echo 'STAGING_MIGRATION_MAX=033_omnichannel_prepared_content.sql'
          echo 'STAGING_MIGRATION_027_PRESENT=NO'
          echo 'STAGING_MIGRATION_DRIFT=NO'
          echo 'STAGING_MIGRATIONS=PASS'
          unset DATABASE_URL DATABASE_SSL

      - name: Stop Cloud SQL Auth Proxy
        if: always()
        shell: bash
        run: |
          if [[ -n "${CLOUD_SQL_PROXY_PID:-}" ]] && kill -0 "$CLOUD_SQL_PROXY_PID" 2>/dev/null; then
            kill "$CLOUD_SQL_PROXY_PID" || true
          fi

      - name: Final mutation boundary
        if: success()
        run: |
          echo 'APPLICATION_DEPLOY_EXECUTED=NO'
          echo 'PROVIDER_MUTATION_EXECUTED=NO'
          echo 'PRODUCTION_MUTATION_EXECUTED=NO'
