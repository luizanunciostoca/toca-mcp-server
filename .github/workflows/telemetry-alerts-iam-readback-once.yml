name: Telemetry Alerts IAM Readback Once

on:
  push:
    branches:
      - ops/telemetry-alerts-iam-revalidation

permissions:
  contents: read
  id-token: write

concurrency:
  group: telemetry-alerts-iam-readback-once
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_INFRA_ADMIN_SERVICE_ACCOUNT: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Authenticate infrastructure administrator
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_INFRA_ADMIN_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Read-only Monitoring and IAM probe as infrastructure administrator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          cat > /tmp/request.json <<'JSON'
          {"permissions":["resourcemanager.projects.getIamPolicy","resourcemanager.projects.setIamPolicy","monitoring.notificationChannels.get","monitoring.notificationChannels.list","monitoring.notificationChannels.create","monitoring.notificationChannels.update","monitoring.notificationChannels.delete","monitoring.notificationChannels.verify","monitoring.alertPolicies.get","monitoring.alertPolicies.list","monitoring.alertPolicies.create","monitoring.alertPolicies.update","monitoring.alertPolicies.delete"]}
          JSON
          IAM_HTTP="$(curl --silent --output /tmp/infra-iam.json --write-out '%{http_code}' -X POST -H "Authorization: Bearer ${ACCESS_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/request.json "https://cloudresourcemanager.googleapis.com/v1/projects/${GCP_PROJECT_ID}:testIamPermissions")"
          CHANNELS_HTTP="$(curl --silent --output /tmp/channels.json --write-out '%{http_code}' -H "Authorization: Bearer ${ACCESS_TOKEN}" "https://monitoring.googleapis.com/v3/projects/${GCP_PROJECT_ID}/notificationChannels?pageSize=100")"
          POLICIES_HTTP="$(curl --silent --output /tmp/policies.json --write-out '%{http_code}' -H "Authorization: Bearer ${ACCESS_TOKEN}" "https://monitoring.googleapis.com/v3/projects/${GCP_PROJECT_ID}/alertPolicies?pageSize=100")"
          jq -n \
            --arg identity "$GCP_INFRA_ADMIN_SERVICE_ACCOUNT" \
            --arg iamHttp "$IAM_HTTP" \
            --arg channelsHttp "$CHANNELS_HTTP" \
            --arg policiesHttp "$POLICIES_HTTP" \
            --slurpfile iam /tmp/infra-iam.json \
            '{identity:$identity,iamHttp:$iamHttp,channelsHttp:$channelsHttp,policiesHttp:$policiesHttp,grantedPermissions:($iam[0].permissions // [])}' \
            > evidence/infra-admin-summary.json
          if [ "$CHANNELS_HTTP" = "200" ]; then
            jq '{notificationChannels:[.notificationChannels[]? | {name,displayName,type,enabled,verificationStatus}]}' /tmp/channels.json > evidence/channels-sanitized.json
          else
            jq '{error:{code:(.error.code // null),status:(.error.status // null),message:(.error.message // null)}}' /tmp/channels.json > evidence/channels-sanitized.json
          fi
          if [ "$POLICIES_HTTP" = "200" ]; then
            jq '{alertPolicies:[.alertPolicies[]? | {name,displayName,enabled,combiner,notificationChannels,conditions:[.conditions[]? | {name,displayName,conditionType:(if .conditionThreshold then "threshold" elif .conditionMatchedLog then "matchedLog" elif .conditionMonitoringQueryLanguage then "mql" elif .conditionPrometheusQueryLanguage then "promql" else "other" end)}]}]}' /tmp/policies.json > evidence/policies-sanitized.json
          else
            jq '{error:{code:(.error.code // null),status:(.error.status // null),message:(.error.message // null)}}' /tmp/policies.json > evidence/policies-sanitized.json
          fi
          echo "INFRA_IAM_HTTP=$IAM_HTTP"
          echo "INFRA_CHANNELS_HTTP=$CHANNELS_HTTP"
          echo "INFRA_POLICIES_HTTP=$POLICIES_HTTP"
          jq -r '.grantedPermissions[]? | "INFRA_GRANTED=" + .' evidence/infra-admin-summary.json
          test "$IAM_HTTP" = "200"

      - name: Reauthenticate deployer
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Read-only Monitoring and IAM probe as deployer
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          cat > /tmp/request.json <<'JSON'
          {"permissions":["resourcemanager.projects.getIamPolicy","resourcemanager.projects.setIamPolicy","monitoring.notificationChannels.get","monitoring.notificationChannels.list","monitoring.notificationChannels.create","monitoring.notificationChannels.update","monitoring.notificationChannels.delete","monitoring.notificationChannels.verify","monitoring.alertPolicies.get","monitoring.alertPolicies.list","monitoring.alertPolicies.create","monitoring.alertPolicies.update","monitoring.alertPolicies.delete"]}
          JSON
          IAM_HTTP="$(curl --silent --output /tmp/deployer-iam.json --write-out '%{http_code}' -X POST -H "Authorization: Bearer ${ACCESS_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/request.json "https://cloudresourcemanager.googleapis.com/v1/projects/${GCP_PROJECT_ID}:testIamPermissions")"
          CHANNELS_HTTP="$(curl --silent --output /tmp/deployer-channels.json --write-out '%{http_code}' -H "Authorization: Bearer ${ACCESS_TOKEN}" "https://monitoring.googleapis.com/v3/projects/${GCP_PROJECT_ID}/notificationChannels?pageSize=100")"
          POLICIES_HTTP="$(curl --silent --output /tmp/deployer-policies.json --write-out '%{http_code}' -H "Authorization: Bearer ${ACCESS_TOKEN}" "https://monitoring.googleapis.com/v3/projects/${GCP_PROJECT_ID}/alertPolicies?pageSize=100")"
          jq -n \
            --arg identity "$GCP_DEPLOY_SERVICE_ACCOUNT" \
            --arg iamHttp "$IAM_HTTP" \
            --arg channelsHttp "$CHANNELS_HTTP" \
            --arg policiesHttp "$POLICIES_HTTP" \
            --slurpfile iam /tmp/deployer-iam.json \
            '{identity:$identity,iamHttp:$iamHttp,channelsHttp:$channelsHttp,policiesHttp:$policiesHttp,grantedPermissions:($iam[0].permissions // [])}' \
            > evidence/deployer-summary.json
          echo "DEPLOYER_IAM_HTTP=$IAM_HTTP"
          echo "DEPLOYER_CHANNELS_HTTP=$CHANNELS_HTTP"
          echo "DEPLOYER_POLICIES_HTTP=$POLICIES_HTTP"
          jq -r '.grantedPermissions[]? | "DEPLOYER_GRANTED=" + .' evidence/deployer-summary.json
          test "$IAM_HTTP" = "200"

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: telemetry-alerts-iam-readback-${{ github.sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
