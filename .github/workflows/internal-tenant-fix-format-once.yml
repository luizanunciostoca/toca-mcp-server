name: Internal tenant fix format once

on:
  push:
    branches:
      - 'fix/tenant-scoped-scheduler-dlq-20260822'
    paths:
      - '.github/workflows/internal-tenant-fix-format-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/tenant-scoped-scheduler-dlq-20260822
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add R31 tenant context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('test/r31-learning-postgres-e2e.test.ts')
          source = path.read_text()
          source = source.replace("const postgresDescribe = DATABASE_URL ? describe : describe.skip;\n", "const postgresDescribe = DATABASE_URL ? describe : describe.skip;\nconst TENANT_ID = 'tenant-r31';\n")
          if source.count('new PostgresScheduler(firstPool);') != 1:
              raise SystemExit('R31_FIRST_SCHEDULER_PRECONDITION_FAILED')
          if source.count('new PostgresScheduler(secondPool);') != 1:
              raise SystemExit('R31_SECOND_SCHEDULER_PRECONDITION_FAILED')
          source = source.replace('new PostgresScheduler(firstPool);', 'new PostgresScheduler(firstPool, TENANT_ID);')
          source = source.replace('new PostgresScheduler(secondPool);', 'new PostgresScheduler(secondPool, TENANT_ID);')
          source = source.replace("        pool: firstPool,\n        handlers:", "        pool: firstPool,\n        tenantId: TENANT_ID,\n        handlers:")
          source = source.replace("        pool: secondPool,\n        handlers:", "        pool: secondPool,\n        tenantId: TENANT_ID,\n        handlers:")
          source = source.replace("    tenantId: 'tenant-r31',", "    tenantId: TENANT_ID,")
          path.write_text(source)
          PY
      - name: Format touched files
        run: pnpm exec prettier --write src/toca-managed-instagram-daemon.ts test/scheduler-multitenancy-postgres-e2e.test.ts test/r31-learning-postgres-e2e.test.ts
      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'toca-os-internal-acceptance'
          git config user.email 'actions@users.noreply.github.com'
          git add src/toca-managed-instagram-daemon.ts test/scheduler-multitenancy-postgres-e2e.test.ts test/r31-learning-postgres-e2e.test.ts
          git diff --cached --check
          git commit -m 'test(tenancy): bind R31 worker to tenant scope and format regression'
          git push origin HEAD:fix/tenant-scoped-scheduler-dlq-20260822
