name: Temporary OAuth Scope Prettier Preview

on:
  push:
    branches:
      - fix/meta-oauth-instagram-content-publish-scope
    paths:
      - '.github/workflows/tmp-prettier-oauth-scope-preview.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier test/meta-oauth-publication-scope.test.ts
