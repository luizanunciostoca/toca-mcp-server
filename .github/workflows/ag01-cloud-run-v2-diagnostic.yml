name: AG-01 Cloud Run V2 Diagnostic

on:
  push:
    branches:
      - ops/ag01-vertex-permanent-binding-20260828
    paths:
      - '.github/workflows/ag01-cloud-run-v2-diagnostic.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  SERVICE: toca-ag01-orchestrator
  WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Read Cloud Run v2 service flags
        run: |
          set -euo pipefail
          mkdir -p evidence
          TOKEN="$(gcloud auth print-access-token)"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${SERVICE}" > evidence/service-v2.json
          jq '{name,uid,generation,uri,urls,launchStage,invokerIamDisabled,defaultUriDisabled,iapEnabled,ingress,traffic,terminalCondition,latestReadyRevision,latestCreatedRevision,customAudiences}' evidence/service-v2.json > evidence/summary.json
          cat evidence/summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ag01-cloud-run-v2-diagnostic-${{ github.run_id }}
          path: evidence
          retention-days: 30
