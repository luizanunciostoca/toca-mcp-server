name: Instagram DM Bounded User Probe

on:
  push:
    branches:
      - ops/instagram-dm-2025-version-probe-20260828
    paths:
      - '.github/workflows/instagram-dm-bounded-user-probe.yml'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_ARTIFACT_REPOSITORY: toca-mcp
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  DATABASE_SECRET_ID: toca-database-url
  TOKEN_SECRET_ID: toca-meta-oauth-token
  INSTAGRAM_ACCOUNT_ID: '17841402033495654'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Materialize bounded user lookup in read-only provider
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          provider = Path('src/providers/instagram/instagram-messaging-read-provider.ts')
          text = provider.read_text()
          old = """export interface InstagramConversationListInput {
            readonly limit: number;
            readonly after?: string | undefined;
          }"""
          new = """export interface InstagramConversationListInput {
            readonly limit: number;
            readonly after?: string | undefined;
            readonly userId?: string | undefined;
          }"""
          if old not in text:
              raise SystemExit('PROVIDER_INPUT_PATCH_TARGET_NOT_FOUND')
          text = text.replace(old, new, 1)
          old = """          ...(input.after ? { after: input.after } : {}),
                },"""
          new = """          ...(input.after ? { after: input.after } : {}),
                  ...(input.userId ? { user_id: input.userId } : {}),
                },"""
          if old not in text:
              raise SystemExit('PROVIDER_QUERY_PATCH_TARGET_NOT_FOUND')
          provider.write_text(text.replace(old, new, 1))

          resolver = Path('src/mcp/runtime-capability-resolver.ts')
          text = resolver.read_text()
          old = """const instagramConversationListSchema = z.object({
            limit: z.number().int().min(1).max(100).default(50),
            after: z.string().min(1).optional(),
          });"""
          new = """const instagramConversationListSchema = z.object({
            limit: z.number().int().min(1).max(100).default(50),
            after: z.string().min(1).optional(),
            userId: z.string().min(1).optional(),
          });"""
          if old not in text:
              raise SystemExit('RESOLVER_SCHEMA_PATCH_TARGET_NOT_FOUND')
          resolver.write_text(text.replace(old, new, 1))

          server = Path('src/server.ts')
          text = server.read_text()
          old = "  const cloudRunService = env.K_SERVICE?.trim();"
          if old in text:
              server.write_text(text.replace(old, "  const cloudRunService = env.K_SERVICE?.trim() || env.CLOUD_RUN_JOB?.trim();", 1))
          PY
          pnpm install --frozen-lockfile
          pnpm exec prettier --write src/providers/instagram/instagram-messaging-read-provider.ts src/mcp/runtime-capability-resolver.ts src/server.ts src/ops/instagram-dm-bounded-user-probe.ts
          pnpm typecheck
          pnpm build

      - name: Authenticate deployer to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Build ephemeral bounded-probe image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/server:ig-dm-bounded-${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Execute bounded read-only probe
        shell: bash
        run: |
          set -euo pipefail
          JOB_NAME="toca-ig-dm-bounded-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            gcloud run jobs delete "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          gcloud run jobs deploy "$JOB_NAME" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --command node \
            --args dist/src/ops/instagram-dm-bounded-user-probe.js \
            --set-env-vars "^~^NODE_ENV=production~MCP_ENABLED=true~INSTAGRAM_READ_ENABLED=true~INSTAGRAM_BUSINESS_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID~META_ACCESS_TOKEN_ENV_KEY=META_ACCESS_TOKEN~META_GRAPH_BASE_URL=https://graph.facebook.com~META_GRAPH_API_VERSION=v24.0~META_ENABLED=false~META_WEBHOOK_ENABLED=false~META_WEBHOOK_PERSISTENCE_ENABLED=false~INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=false~INSTAGRAM_PUBLICATION_WRITES_ENABLED=false~META_ADS_READ_ENABLED=false~META_ADS_WRITE_ENABLED=false~GOOGLE_ADS_PHASE=OFF~TOCA_MANAGED_INSTAGRAM_SCHEDULER_ENABLED=false~TOCA_MANAGED_INSTAGRAM_EXECUTOR_ENABLED=false" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest,META_ACCESS_TOKEN=$TOKEN_SECRET_ID:latest" \
            --tasks 1 --max-retries 0 --task-timeout 300s --quiet

          STATUS=0
          gcloud run jobs execute "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet || STATUS=$?
          sleep 15
          gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME}" \
            --project "$GCP_PROJECT_ID" --freshness=30m --limit=400 --order=asc --format=json > /tmp/logs.json
          python3 <<'PY'
          import json, re
          rows=json.load(open('/tmp/logs.json'))
          for row in rows:
              vals=[]
              if isinstance(row.get('textPayload'),str): vals.append(row['textPayload'])
              if isinstance(row.get('jsonPayload'),dict): vals.append(json.dumps(row['jsonPayload'],separators=(',',':')))
              for text in vals:
                  if 'instagram-dm-bounded-user-probe' not in text: continue
                  try:
                      obj=json.loads(text)
                      if isinstance(obj,dict) and obj.get('validation')=='instagram-dm-bounded-user-probe':
                          print(json.dumps(obj,separators=(',',':')))
                          raise SystemExit(0)
                  except json.JSONDecodeError:
                      for m in re.finditer(r'\{[^\n]*"validation":"instagram-dm-bounded-user-probe"[^\n]*\}',text):
                          try:
                              print(json.dumps(json.loads(m.group(0)),separators=(',',':')))
                              raise SystemExit(0)
                          except json.JSONDecodeError: pass
          print('BOUNDED_PROBE_EVIDENCE_NOT_FOUND')
          PY
          exit "$STATUS"
