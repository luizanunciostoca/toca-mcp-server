name: Ops Reliability Final E822 Observer

on:
  push:
    branches:
      - ops/reliability-final-e822-preflight-20260823

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Publish recent branch runs
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ops/reliability-final-e822-preflight-20260823
        shell: bash
        run: |
          set -euo pipefail
          RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${BRANCH}&per_page=10" --jq '[.workflow_runs[] | {id,name,status,conclusion,head_sha,created_at}]')"
          gh api "repos/${GITHUB_REPOSITORY}/issues/151/comments" -f body="$(printf '## RELIABILITY_FINAL_E822 — REPAIR_READBACK_OBSERVER\n\n```json\n%s\n```' "$RUNS")" >/dev/null
