name: Ops Reliability Final E822 Repair Alerts

on:
  push:
    branches:
      - ops/reliability-final-e822-preflight-20260823

permissions:
  contents: read
  id-token: write
  issues: write

env:
  CANDIDATE_SHA: e8221698d36040c2c86da46f697121e34ca7258c
  POLICY_PATH: infra/observability/staging-runtime-observability-policy.json
  RECONCILE_SCRIPT: ops/staging-runtime-observability-reconcile-v3.sh
  PROJECT_ID: toca-mcp-next-staging
  PROJECT_NUMBER: '729069789107'
  PRODUCTION_PROJECT_ID: toca-mcp-production
  PRODUCTION_PROJECT_NUMBER: '990081828836'
  REGION: southamerica-east1
  MCP_SERVICE: toca-mcp-next-staging
  WEBHOOK_SERVICE: toca-webhook-next-staging
  STAGING_WIF: projects/729069789107/locations/global/workloadIdentityPools/github-staging/providers/github-toca-mcp-staging
  STAGING_OPERATOR_SA: toca-next-stg-deployer@toca-mcp-next-staging.iam.gserviceaccount.com

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Enforce exact candidate and staging-only boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = luizanunciostoca/toca-mcp-server
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | awk '{print $1}')" = "$CANDIDATE_SHA"
          test "$PROJECT_ID" = toca-mcp-next-staging
          test "$PROJECT_NUMBER" = 729069789107
          test "$PROJECT_ID" != "$PRODUCTION_PROJECT_ID"
          test "$PROJECT_NUMBER" != "$PRODUCTION_PROJECT_NUMBER"
          [[ "$STAGING_WIF" == projects/${PROJECT_NUMBER}/* ]]
          [[ "$STAGING_OPERATOR_SA" == *@${PROJECT_ID}.iam.gserviceaccount.com ]]
          jq -e '.version==3 and .uptimeCheck.path=="/ready" and .uptimeCheck.authentication=="MONITORING_SERVICE_AGENT_OIDC" and .uptimeCheck.port==443 and .uptimeCheck.useSsl==true and .uptimeCheck.period=="300s" and .uptimeCheck.timeout=="10s" and .forbid.productionAccess==true and .forbid.productionMutation==true and .forbid.providerMutation==true and .forbid.databaseMutation==true and .forbid.backupMutation==true and .forbid.drRestore==true and .forbid.trafficMutation==true and .forbid.cloudRunMutation==true and .forbid.secretRead==true and .forbid.secretMutation==true' "$POLICY_PATH" >/dev/null
          echo BOUNDARY=PASS

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.STAGING_WIF }}
          service_account: ${{ env.STAGING_OPERATOR_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Repair only global uptime path to frozen canonical contract
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)" = "$STAGING_OPERATOR_SA"
          test "$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')" = "$PROJECT_NUMBER"
          DISPLAY="$(jq -r '.uptimeCheck.displayName' "$POLICY_PATH")"
          TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error -H "Authorization: Bearer ${TOKEN}" "https://monitoring.googleapis.com/v3/projects/${PROJECT_ID}/uptimeCheckConfigs?pageSize=100" >/tmp/uptimes-before.json
          NAME="$(jq -r --arg d "$DISPLAY" 'first(.uptimeCheckConfigs[]? | select(.displayName==$d) | .name)//empty' /tmp/uptimes-before.json)"
          test -n "$NAME"
          BEFORE_PATH="$(jq -r --arg d "$DISPLAY" 'first(.uptimeCheckConfigs[]? | select(.displayName==$d) | .httpCheck.path)//empty' /tmp/uptimes-before.json)"
          test "$BEFORE_PATH" = /readyz
          jq -n --arg display "$DISPLAY" --arg project "$PROJECT_ID" --arg location "$REGION" --arg service "$WEBHOOK_SERVICE" '{displayName:$display,monitoredResource:{type:"cloud_run_revision",labels:{project_id:$project,location:$location,service_name:$service}},httpCheck:{requestMethod:"GET",path:"/ready",port:443,useSsl:true,serviceAgentAuthentication:{type:"OIDC_TOKEN"}},contentMatchers:[],timeout:"10s",period:"300s"}' >/tmp/desired.json
          curl --fail --silent --show-error -X PATCH -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/desired.json "https://monitoring.googleapis.com/v3/${NAME}?updateMask=displayName,monitoredResource,httpCheck,contentMatchers,timeout,period" >/tmp/patched.json
          unset TOKEN
          jq -e --arg display "$DISPLAY" --arg service "$WEBHOOK_SERVICE" '.displayName==$display and .monitoredResource.type=="cloud_run_revision" and .monitoredResource.labels.service_name==$service and .httpCheck.requestMethod=="GET" and .httpCheck.path=="/ready" and .httpCheck.port==443 and .httpCheck.useSsl==true and .httpCheck.serviceAgentAuthentication.type=="OIDC_TOKEN" and (.contentMatchers//[])==[] and .timeout=="10s" and .period=="300s"' /tmp/patched.json >/dev/null
          echo "before_path=$BEFORE_PATH" >>"$GITHUB_OUTPUT"
          echo UPTIME_CONFIG_PATCH=PASS

      - name: Resolve isolated staging webhook target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$WEBHOOK_SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          [[ "$SERVICE_URL" == https://*.run.app ]]
          echo "host=${SERVICE_URL#https://}" >>"$GITHUB_OUTPUT"

      - name: Reconcile complete canonical staging alert coverage
        env:
          HOST: ${{ steps.target.outputs.host }}
          EVIDENCE_DIR: staging-runtime-observability-evidence
        shell: bash
        run: |
          set -euo pipefail
          bash "$RECONCILE_SCRIPT"

      - name: Verify post-reconcile live alert topology
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error -H "Authorization: Bearer ${TOKEN}" "https://monitoring.googleapis.com/v3/projects/${PROJECT_ID}/alertPolicies?pageSize=100" >/tmp/policies.json
          curl --fail --silent --show-error -H "Authorization: Bearer ${TOKEN}" "https://monitoring.googleapis.com/v3/projects/${PROJECT_ID}/notificationChannels?pageSize=100" >/tmp/channels.json
          curl --fail --silent --show-error -H "Authorization: Bearer ${TOKEN}" "https://monitoring.googleapis.com/v3/projects/${PROJECT_ID}/uptimeCheckConfigs?pageSize=100" >/tmp/uptimes-after.json
          unset TOKEN
          REQUIRED='["availability","ag01_readiness","approval_readiness","crm_readiness","db_readiness","outbox_dlq_readiness","workflow_readiness","http_latency","http_error_rate"]'
          ROLES="$(jq -c '[.alertPolicies[]? | select(.enabled==true and .userLabels.toca_managed=="staging_reliability") | .userLabels.alert_role//empty] | unique | sort' /tmp/policies.json)"
          for role in $(jq -r '.[]' <<<"$REQUIRED"); do jq -e --arg r "$role" 'index($r)!=null' <<<"$ROLES" >/dev/null; done
          CHANNELS="$(jq -c '[.notificationChannels[]? | select(.enabled!=false and .userLabels.toca_managed=="staging_reliability") | .type] | unique | sort' /tmp/channels.json)"
          jq -e 'index("email")!=null and index("webhook_tokenauth")!=null' <<<"$CHANNELS" >/dev/null
          DISPLAY="$(jq -r '.uptimeCheck.displayName' "$POLICY_PATH")"
          test "$(jq -r --arg d "$DISPLAY" 'first(.uptimeCheckConfigs[]? | select(.displayName==$d) | .httpCheck.path)//empty' /tmp/uptimes-after.json)" = /ready
          COUNT="$(jq '.alertPolicies//[]|length' /tmp/policies.json)"
          echo "roles=$ROLES" >>"$GITHUB_OUTPUT"
          echo "channels=$CHANNELS" >>"$GITHUB_OUTPUT"
          echo "policy_count=$COUNT" >>"$GITHUB_OUTPUT"
          echo ALERT_TOPOLOGY=PASS

      - name: Publish sanitized repair evidence
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_PATH: ${{ steps.patch.outputs.before_path }}
          ROLES: ${{ steps.verify.outputs.roles }}
          CHANNELS: ${{ steps.verify.outputs.channels }}
          POLICY_COUNT: ${{ steps.verify.outputs.policy_count }}
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$(jq -n --arg candidate "$CANDIDATE_SHA" --arg beforePath "$BEFORE_PATH" --arg afterPath /ready --argjson roles "$ROLES" --argjson channels "$CHANNELS" --argjson count "$POLICY_COUNT" '{candidateSha:$candidate,uptimePathBefore:$beforePath,uptimePathAfter:$afterPath,configChanged:true,canonicalReconcilerApplied:true,alertPolicyCount:$count,requiredRolesObserved:$roles,channelFamilies:$channels,productionAccess:false,productionMutation:false,providerMutation:false,databaseMutation:false,backupMutation:false,drRestore:false,trafficMutation:false,cloudRunMutation:false,secretRead:false,secretMutation:false}')"
          gh api "repos/${GITHUB_REPOSITORY}/issues/151/comments" -f body="$(printf '## RELIABILITY_FINAL_E822 — ALERT_REPAIR\n\n`RUN_ID=%s`\n\n```json\n%s\n```' "$GITHUB_RUN_ID" "$EVIDENCE")" >/dev/null
          echo ALERT_REPAIR=PASS
