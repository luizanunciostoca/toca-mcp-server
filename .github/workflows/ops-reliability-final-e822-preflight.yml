name: Ops Reliability Final E822 Alerts

on:
  push:
    branches:
      - ops/reliability-final-e822-preflight-20260823

permissions:
  contents: read
  id-token: write
  issues: write

env:
  CANDIDATE_SHA: e8221698d36040c2c86da46f697121e34ca7258c
  PROJECT_ID: toca-mcp-next-staging
  PROJECT_NUMBER: '729069789107'
  PRODUCTION_PROJECT_ID: toca-mcp-production
  PRODUCTION_PROJECT_NUMBER: '990081828836'
  STAGING_WIF: projects/729069789107/locations/global/workloadIdentityPools/github-staging/providers/github-toca-mcp-staging
  STAGING_OPERATOR_SA: toca-next-stg-deployer@toca-mcp-next-staging.iam.gserviceaccount.com
  SYNTHETIC_POLICY: TOCA Next Staging - Synthetic Reliability Delivery
  HISTORICAL_INCIDENT: 0.obqbjhmrmmv8

jobs:
  alerts:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Enforce exact candidate and staging-only boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          MAIN_HEAD="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | awk '{print $1}')"
          test "$MAIN_HEAD" = "$CANDIDATE_SHA"
          test "$PROJECT_ID" = toca-mcp-next-staging
          test "$PROJECT_NUMBER" = 729069789107
          test "$PROJECT_ID" != "$PRODUCTION_PROJECT_ID"
          test "$PROJECT_NUMBER" != "$PRODUCTION_PROJECT_NUMBER"
          [[ "$STAGING_WIF" == projects/${PROJECT_NUMBER}/* ]]
          [[ "$STAGING_OPERATOR_SA" == *@${PROJECT_ID}.iam.gserviceaccount.com ]]

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.STAGING_WIF }}
          service_account: ${{ env.STAGING_OPERATOR_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Read back canonical alerts channels and historical closure
        id: readback
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)" = "$STAGING_OPERATOR_SA"
          TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error -H "Authorization: Bearer ${TOKEN}" "https://monitoring.googleapis.com/v3/projects/${PROJECT_ID}/alertPolicies?pageSize=100" >/tmp/policies.json
          curl --fail --silent --show-error -H "Authorization: Bearer ${TOKEN}" "https://monitoring.googleapis.com/v3/projects/${PROJECT_ID}/notificationChannels?pageSize=100" >/tmp/channels.json

          REQUIRED_ROLES='["ag01_readiness","approval_readiness","crm_readiness","db_readiness","outbox_dlq_readiness","workflow_readiness","http_latency","http_error_rate"]'
          OBSERVED_ROLES="$(jq -c '[.alertPolicies[]? | select(.enabled==true and .userLabels.staging_reliability=="true") | .userLabels.alert_role // empty] | unique | sort' /tmp/policies.json)"
          for role in $(jq -r '.[]' <<<"$REQUIRED_ROLES"); do jq -e --arg r "$role" 'index($r)!=null' <<<"$OBSERVED_ROLES" >/dev/null; done

          SYN_COUNT="$(jq --arg n "$SYNTHETIC_POLICY" '[.alertPolicies[]? | select(.displayName==$n and .enabled==true)]|length' /tmp/policies.json)"
          test "$SYN_COUNT" = 1
          SYN_POLICY_NAME="$(jq -r --arg n "$SYNTHETIC_POLICY" 'first(.alertPolicies[]? | select(.displayName==$n and .enabled==true) | .name)//empty' /tmp/policies.json)"
          SYN_AUTOCLOSE="$(jq -r --arg n "$SYNTHETIC_POLICY" 'first(.alertPolicies[]? | select(.displayName==$n and .enabled==true) | .alertStrategy.autoClose)//empty' /tmp/policies.json)"
          test "$SYN_AUTOCLOSE" = 1800s

          CHANNELS="$(jq -c '[.notificationChannels[]? | select(.enabled==true and .userLabels.staging_reliability=="true") | {name,type,enabled}]' /tmp/channels.json)"
          test "$(jq 'length' <<<"$CHANNELS")" -ge 2
          jq -e 'map(.type)|index("email")!=null' <<<"$CHANNELS" >/dev/null
          jq -e 'map(.type)|index("webhook_tokenauth")!=null' <<<"$CHANNELS" >/dev/null

          curl --fail --silent --show-error -H "Authorization: Bearer ${TOKEN}" -H "x-goog-user-project: ${PROJECT_ID}" "https://monitoring.googleapis.com/v3/projects/${PROJECT_ID}/alerts/${HISTORICAL_INCIDENT}" >/tmp/historical.json
          test "$(jq -r '.state' /tmp/historical.json)" = CLOSED
          test "$(jq -r '.policy.displayName' /tmp/historical.json)" = "$SYNTHETIC_POLICY"
          test -n "$(jq -r '.closeTime // .close_time // empty' /tmp/historical.json)"
          unset TOKEN

          test "$(jq -r '.automaticRecoveryClosureVerified' ops/evidence/staging-synthetic-incident-closure-2026-08-22.json)" = true
          test "$(jq -r '.positiveReceiverSideReceiptVerified' ops/evidence/staging-webhook-notification-receipt-2026-08-22.json)" = true
          grep -Fq 'docs/operations/observability-incident-runbook.md' infra/observability/staging-runtime-observability-policy.json
          echo "syn_policy_name=$SYN_POLICY_NAME" >>"$GITHUB_OUTPUT"
          echo "observed_roles=$OBSERVED_ROLES" >>"$GITHUB_OUTPUT"
          echo CANONICAL_ALERT_READBACK=PASS

      - name: Emit one non-destructive staging synthetic signal
        id: fire
        shell: bash
        run: |
          set -euo pipefail
          MARKER="TOCA_STAGING_RELIABILITY_SYNTHETIC final-e822-${GITHUB_RUN_ID}"
          START="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gcloud logging write toca-next-staging-reliability "$MARKER" --severity=ERROR --project="$PROJECT_ID" --quiet
          echo "marker=$MARKER" >>"$GITHUB_OUTPUT"
          echo "start=$START" >>"$GITHUB_OUTPUT"
          echo SYNTHETIC_SIGNAL_EMITTED=PASS

      - name: Read back fresh incident creation
        id: fresh
        env:
          START: ${{ steps.fire.outputs.start }}
          SYN_POLICY_NAME: ${{ steps.readback.outputs.syn_policy_name }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          FRESH=''
          for attempt in $(seq 1 24); do
            curl --fail --silent --show-error --get -H "Authorization: Bearer ${TOKEN}" -H "x-goog-user-project: ${PROJECT_ID}" --data-urlencode "filter=(open_time>=\"${START}\")" "https://monitoring.googleapis.com/v3/projects/${PROJECT_ID}/alerts" >/tmp/alerts.json
            FRESH="$(jq -c --arg p "$SYN_POLICY_NAME" '[.alerts[]? | select(.policy.name==$p and .state=="OPEN")] | sort_by(.openTime // .open_time) | last // empty' /tmp/alerts.json)"
            test -z "$FRESH" || break
            sleep 10
          done
          test -n "$FRESH"
          FRESH_NAME="$(jq -r '.name' <<<"$FRESH")"
          test "$(jq -r '.policy.displayName' <<<"$FRESH")" = "$SYNTHETIC_POLICY"
          jq -n --argjson fresh "$FRESH" --arg marker "${{ steps.fire.outputs.marker }}" '{syntheticMarker:$marker,freshIncident:$fresh}' >/tmp/fresh.json
          echo "fresh_name=$FRESH_NAME" >>"$GITHUB_OUTPUT"
          unset TOKEN
          echo FRESH_INCIDENT_CREATION=PASS

      - name: Publish sanitized final alert evidence
        env:
          GH_TOKEN: ${{ github.token }}
          OBSERVED_ROLES: ${{ steps.readback.outputs.observed_roles }}
          FRESH_NAME: ${{ steps.fresh.outputs.fresh_name }}
        shell: bash
        run: |
          set -euo pipefail
          HIST_STATE="$(jq -r '.state' /tmp/historical.json)"
          CHANNEL_TYPES="$(jq -c 'map(.type)|sort' <<<"$(jq -c '[.notificationChannels[]? | select(.enabled==true and .userLabels.staging_reliability=="true") | {type}]' /tmp/channels.json)")"
          EVIDENCE="$(jq -n --arg candidate "$CANDIDATE_SHA" --arg freshIncident "$FRESH_NAME" --arg historicalIncident "projects/${PROJECT_ID}/alerts/${HISTORICAL_INCIDENT}" --arg historicalState "$HIST_STATE" --argjson roles "$OBSERVED_ROLES" --argjson channels "$CHANNEL_TYPES" '{candidateSha:$candidate,requiredAlertRolesObserved:$roles,notificationChannelFamilies:$channels,syntheticFiring:true,freshIncidentCreated:true,freshIncident:$freshIncident,historicalCanonicalIncident:$historicalIncident,historicalCanonicalIncidentState:$historicalState,automaticRecoveryClosurePreviouslyVerified:true,receiverSideWebhookReceiptPreviouslyVerified:true,runbookCorrelation:true,productionAccess:false,productionMutation:false,providerMutation:false,databaseMutation:false,backupMutation:false,drRestore:false,trafficMutation:false,cloudRunMutation:false,secretRead:false,secretMutation:false}')"
          BODY=$(printf '## RELIABILITY_FINAL_E822 — ALERTS_LIVE\n\n`RUN_ID=%s`\n`CANDIDATE_SHA=%s`\n\n```json\n%s\n```' "$GITHUB_RUN_ID" "$CANDIDATE_SHA" "$EVIDENCE")
          gh api "repos/${GITHUB_REPOSITORY}/issues/151/comments" -f body="$BODY" >/dev/null
          echo ALERTS_LIVE_ACCEPTANCE=PASS
