name: Ops Reliability Final E822 Uptime Drift Diagnostic

on:
  push:
    branches:
      - ops/reliability-final-e822-preflight-20260823

permissions:
  contents: read
  id-token: write
  issues: write

env:
  CANDIDATE_SHA: e8221698d36040c2c86da46f697121e34ca7258c
  PROJECT_ID: toca-mcp-next-staging
  PROJECT_NUMBER: '729069789107'
  PRODUCTION_PROJECT_ID: toca-mcp-production
  PRODUCTION_PROJECT_NUMBER: '990081828836'
  REGION: southamerica-east1
  WEBHOOK_SERVICE: toca-webhook-next-staging
  STAGING_WIF: projects/729069789107/locations/global/workloadIdentityPools/github-staging/providers/github-toca-mcp-staging
  STAGING_OPERATOR_SA: toca-next-stg-deployer@toca-mcp-next-staging.iam.gserviceaccount.com
  POLICY_PATH: infra/observability/staging-runtime-observability-policy.json

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | awk '{print $1}')" = "$CANDIDATE_SHA"
          test "$PROJECT_ID" = toca-mcp-next-staging
          test "$PROJECT_NUMBER" = 729069789107
          test "$PROJECT_ID" != "$PRODUCTION_PROJECT_ID"
          test "$PROJECT_NUMBER" != "$PRODUCTION_PROJECT_NUMBER"
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.STAGING_WIF }}
          service_account: ${{ env.STAGING_OPERATOR_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Publish sanitized uptime projection diff
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DISPLAY="$(jq -r '.uptimeCheck.displayName' "$POLICY_PATH")"
          TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error -H "Authorization: Bearer ${TOKEN}" "https://monitoring.googleapis.com/v3/projects/${PROJECT_ID}/uptimeCheckConfigs?pageSize=100" >/tmp/uptimes.json
          unset TOKEN
          ACTUAL="$(jq -c --arg d "$DISPLAY" 'first(.uptimeCheckConfigs[]? | select(.displayName==$d)) | {name,displayName,monitoredResource,httpCheck,contentMatchers:(.contentMatchers//[]),timeout,period}' /tmp/uptimes.json)"
          test "$ACTUAL" != null
          DESIRED="$(jq -cn --arg display "$DISPLAY" --arg project "$PROJECT_ID" --arg location "$REGION" --arg service "$WEBHOOK_SERVICE" '{displayName:$display,monitoredResource:{type:"cloud_run_revision",labels:{project_id:$project,location:$location,service_name:$service}},httpCheck:{requestMethod:"GET",path:"/ready",port:443,useSsl:true,serviceAgentAuthentication:{type:"OIDC_TOKEN"}},contentMatchers:[],timeout:"10s",period:"300s"}')"
          EVIDENCE="$(jq -n --arg candidate "$CANDIDATE_SHA" --argjson actual "$ACTUAL" --argjson desired "$DESIRED" '{candidateSha:$candidate,actual:$actual,desired:$desired,equal:($actual|del(.name)==$desired),productionAccess:false,providerAccess:false,monitoringMutation:false}')"
          gh api "repos/${GITHUB_REPOSITORY}/issues/151/comments" -f body="$(printf '## RELIABILITY_FINAL_E822 — UPTIME_DRIFT_DIAGNOSTIC\n\n`RUN_ID=%s`\n\n```json\n%s\n```' "$GITHUB_RUN_ID" "$EVIDENCE")" >/dev/null
          echo UPTIME_DRIFT_DIAGNOSTIC=PASS
