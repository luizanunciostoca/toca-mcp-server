name: Alerts Live Check v5 2026-08-16
on:
  push:
    branches: [ops/alerts-email-readback-20260816]
    paths: [.github/workflows/alerts-live-check-v5-20260816.yml]
permissions:
  contents: read
  id-token: write
env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_INFRA_ADMIN_SERVICE_ACCOUNT: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  TARGET_JOB: toca-alert-metric-v5-31938048761
  TEST_RUN: alerts-v5-31938048761-1
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_INFRA_ADMIN_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Inspect metric and alerts
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          START="$(date -u -d '15 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          END="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          FILTER="metric.type=\"run.googleapis.com/job/completed_execution_count\" AND resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${TARGET_JOB}\" AND metric.labels.result=\"succeeded\""
          curl --fail --silent -G -H "Authorization: Bearer ${TOKEN}" -H "x-goog-user-project: ${GCP_PROJECT_ID}" --data-urlencode "filter=${FILTER}" --data-urlencode "interval.startTime=${START}" --data-urlencode "interval.endTime=${END}" --data-urlencode 'view=FULL' "https://monitoring.googleapis.com/v3/projects/${GCP_PROJECT_ID}/timeSeries" >/tmp/series.json
          echo '=== METRIC POSITIVE POINTS ==='
          jq -S '[.timeSeries[]?.points[]? | select(((.value.int64Value // "0") | tonumber) > 0)]' /tmp/series.json
          curl --fail --silent -G -H "Authorization: Bearer ${TOKEN}" -H "x-goog-user-project: ${GCP_PROJECT_ID}" --data-urlencode 'page_size=100' "https://monitoring.googleapis.com/v3/projects/${GCP_PROJECT_ID}/alerts" >/tmp/alerts.json
          echo '=== ALERTS TOP ==='
          jq -S . /tmp/alerts.json
          echo '=== TEST MATCHES ==='
          jq -S --arg t "$TEST_RUN" '[.. | objects | select(tostring | contains($t))]' /tmp/alerts.json
