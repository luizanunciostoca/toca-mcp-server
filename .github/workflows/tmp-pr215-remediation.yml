name: Temporary PR 215 Remediation

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/production-env-bootstrap-meta-secret-20260824
          persist-credentials: true
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fix Meta app-id scoping and add regression assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/deploy-gcp.yml')
          lines = workflow_path.read_text().splitlines()
          app_indices = [i for i, line in enumerate(lines) if 'add_both META_APP_ID' in line]
          if len(app_indices) != 1:
              raise SystemExit(f'expected one META_APP_ID binding, found {len(app_indices)}')
          app_index = app_indices[0]
          broad_index = app_index - 1
          broad = lines[broad_index]
          if 'META_ADS_READ_ENABLED' not in broad or 'META_ENABLED' not in broad:
              raise SystemExit('unexpected Meta-backed condition around META_APP_ID')
          app_line = lines.pop(app_index)
          lines[broad_index:broad_index] = [
              '          if [[ "$META_ENABLED" == true ]]; then',
              app_line,
              '          fi',
          ]
          workflow_path.write_text('\n'.join(lines) + '\n')

          test_path = Path('test/gcp-production-bootstrap-contract.test.ts')
          test_text = test_path.read_text()
          marker = "  it('keeps Meta token binding scoped away from the public webhook in this release', () => {"
          if marker not in test_text:
              raise SystemExit('regression insertion marker missing')
          regression = """  it('scopes META_APP_ID to META_ENABLED instead of Meta Ads read-only mode', () => {\n    const appIdIndex = workflow.indexOf('add_both META_APP_ID');\n    const broadMetaIndex = workflow.indexOf(\n      'if [[ \"$META_ENABLED\" == true || \"$META_WEBHOOK_ENABLED\"',\n    );\n    const dedicatedMetaIndex = workflow.lastIndexOf(\n      'if [[ \"$META_ENABLED\" == true ]]; then',\n      appIdIndex,\n    );\n    expect(dedicatedMetaIndex).toBeGreaterThan(-1);\n    expect(appIdIndex).toBeGreaterThan(dedicatedMetaIndex);\n    expect(appIdIndex).toBeLessThan(broadMetaIndex);\n  });\n\n"""
          if "scopes META_APP_ID to META_ENABLED" not in test_text:
              test_text = test_text.replace(marker, regression + marker)
              test_path.write_text(test_text)
          PY

      - name: Apply canonical formatting and stage workflow outside Actions path
        run: |
          set -euo pipefail
          pnpm exec prettier --write scripts/validate-gcp-deploy-environment.mjs test/gcp-production-bootstrap-contract.test.ts .github/workflows/deploy-gcp.yml
          mkdir -p tmp/pr215
          cp .github/workflows/deploy-gcp.yml tmp/pr215/deploy-gcp.formatted.yml
          git restore .github/workflows/deploy-gcp.yml

      - name: Commit only non-workflow remediation outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate-gcp-deploy-environment.mjs test/gcp-production-bootstrap-contract.test.ts tmp/pr215/deploy-gcp.formatted.yml
          git diff --cached --check
          git commit -m 'fix(deploy): format production bootstrap remediation'
          git push origin HEAD:fix/production-env-bootstrap-meta-secret-20260824
