name: Temporary Format Instagram DRS Test

on:
  push:
    branches:
      - fix/instagram-shadow-drs-public-callback-20260829

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Print canonical formatted test
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write test/instagram-engagement-shadow-drs-continuation.test.ts >/dev/null
          echo 'BEGIN_FORMATTED_DRS_TEST'
          cat test/instagram-engagement-shadow-drs-continuation.test.ts
          echo 'END_FORMATTED_DRS_TEST'
