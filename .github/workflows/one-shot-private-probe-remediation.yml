name: One-shot private probe remediation

on:
  push:
    branches: [fix/production-private-candidate-acceptance-20260826]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'luizanunciostoca'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/production-private-candidate-acceptance-20260826
          fetch-depth: 1

      - name: Apply and self-remove remediation
        run: |
          set -euo pipefail
          python3 scripts/one-shot-private-probe-remediation.py
          rm .github/workflows/one-shot-private-probe-remediation.yml
          rm scripts/one-shot-private-probe-remediation.py
          git config user.name "TOCA OS Automation"
          git config user.email "actions@github.com"
          git add .github/workflows/deploy-gcp.yml .github/workflows/one-shot-private-probe-remediation.yml scripts/one-shot-private-probe-remediation.py
          git diff --cached --check
          git commit -m "fix(deploy): validate private candidate on canonical endpoint"
          git push origin HEAD:fix/production-private-candidate-acceptance-20260826
