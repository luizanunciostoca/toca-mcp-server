name: Apply R16 Privacy Catalog

on:
  push:
    branches:
      - feat/r16-privacy-consent-preferences

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/r16-privacy-consent-preferences
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 .github/scripts/apply-r16-privacy.py
      - run: pnpm exec prettier --write src/governance/capability-ids.ts src/governance/capability-catalog.ts src/governance/capability-contract-overrides.ts test/governance-catalog.test.ts test/capability-resolution.test.ts
      - name: Commit catalog updates
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/governance/capability-ids.ts src/governance/capability-catalog.ts src/governance/capability-contract-overrides.ts test/governance-catalog.test.ts test/capability-resolution.test.ts
          git commit -m "feat(privacy): register R16 capability contracts"
          git push origin HEAD:feat/r16-privacy-consent-preferences
