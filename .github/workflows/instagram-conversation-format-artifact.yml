name: Instagram Conversation Format Apply

on:
  push:
    branches:
      - feat/instagram-conversation-ops-v1-20260902

permissions:
  contents: write

jobs:
  format-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/instagram-conversation-ops-v1-20260902
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository Prettier exactly
        run: >-
          pnpm exec prettier --write
          src/crm/social-engagement-classifier.ts
          src/crm/social-engagement-contracts.ts
          src/instagram-engagement/conversation-operations.ts
          src/instagram-engagement/conversation-reply-state.ts
          src/instagram-engagement/processor.ts
          src/persistence/meta-webhook-event-store.ts
          src/policy/engagement-policy.ts

      - name: Remove temporary formatter workflow
        run: rm .github/workflows/instagram-conversation-format-artifact.yml

      - name: Commit exact formatted sources atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/crm/social-engagement-classifier.ts \
            src/crm/social-engagement-contracts.ts \
            src/instagram-engagement/conversation-operations.ts \
            src/instagram-engagement/conversation-reply-state.ts \
            src/instagram-engagement/processor.ts \
            src/persistence/meta-webhook-event-store.ts \
            src/policy/engagement-policy.ts \
            .github/workflows/instagram-conversation-format-artifact.yml
          if git diff --cached --quiet; then
            echo "Expected formatter changes were not produced" >&2
            exit 1
          fi
          git commit -m "style(instagram): apply exact conversation formatter"
          git push origin HEAD:feat/instagram-conversation-ops-v1-20260902
