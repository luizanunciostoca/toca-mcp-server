name: Instagram Engagement Webhook Callback Readonly

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: ${{ github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'PRODUCTION AUTHORIZATION — Instagram webhook callback READONLY AUTO') && 'instagram-engagement-webhook-callback-control' || format('instagram-webhook-callback-readonly-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DIAGNOSTIC_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  WEBHOOK_SERVICE_NAME: toca-webhook-next-production

jobs:
  readback:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'PRODUCTION AUTHORIZATION — Instagram webhook callback READONLY AUTO')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout exact readback controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate exact owner read-only authorization
        id: auth
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ISSUE_NUMBER="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
          ISSUE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
          BODY="$(printf '%s' "$ISSUE_JSON" | jq -r '.body // ""')"
          printf '%s' "$ISSUE_JSON" | jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" '
            (.state == "open") and
            (.user.login == $owner) and
            (.title | startswith("PRODUCTION AUTHORIZATION — Instagram webhook callback READONLY AUTO"))
          ' >/dev/null
          CURRENT_MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          test "$CURRENT_MAIN_SHA" = "$GITHUB_SHA"
          required=(
            "AUTHORIZED_CANDIDATE_SHA=$GITHUB_SHA"
            'AUTHORIZATION_STATE=ACTIVE'
            'INSTAGRAM_ENGAGEMENT_WEBHOOK_CALLBACK_READONLY=AUTHORIZED'
            'READ_ONLY=true'
            'SERVICE_MUTATIONS_AUTHORIZED=false'
            'DATABASE_MUTATIONS_AUTHORIZED=false'
            'PROVIDER_CALLS_AUTHORIZED=false'
            'EXTERNAL_REPLY_WRITES_AUTHORIZED=false'
          )
          for marker in "${required[@]}"; do
            test "$(grep -c "^${marker%%=*}=" <<< "$BODY")" = 1
            grep -Fxq "$marker" <<< "$BODY"
          done
          INCLUDE_RUNTIME_DIAGNOSTICS=false
          OPTIONAL_COUNT="$(grep -c '^INCLUDE_SANITIZED_RUNTIME_LOGS=' <<< "$BODY" || true)"
          if [[ "$OPTIONAL_COUNT" != 0 ]]; then
            test "$OPTIONAL_COUNT" = 1
            grep -Eq '^INCLUDE_SANITIZED_RUNTIME_LOGS=(true|false)$' <<< "$BODY"
            if grep -Fxq 'INCLUDE_SANITIZED_RUNTIME_LOGS=true' <<< "$BODY"; then
              for marker in 'RUNTIME_LOG_WINDOW=LAST_2_HOURS' 'RUNTIME_LOG_LIMIT=200' 'PUBLIC_HEALTH_PROBES=GET_HEALTH_AND_READY_ONLY' 'IAM_MUTATIONS_AUTHORIZED=false'; do
                test "$(grep -c "^${marker%%=*}=" <<< "$BODY")" = 1
                grep -Fxq "$marker" <<< "$BODY"
              done
              INCLUDE_RUNTIME_DIAGNOSTICS=true
            fi
          fi
          CONTROL_BODY="$(gh api "repos/${GITHUB_REPOSITORY}/issues/640" --jq '.body // ""')"
          grep -Fxq 'MAIN_STABILITY=PASS' <<< "$CONTROL_BODY"
          grep -Fxq "EVALUATED_MAIN_SHA=$GITHUB_SHA" <<< "$CONTROL_BODY"
          grep -Fxq 'MERGE_RESERVATION=NONE' <<< "$CONTROL_BODY"
          echo "authorization_issue=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "include_runtime_diagnostics=$INCLUDE_RUNTIME_DIAGNOSTICS" >> "$GITHUB_OUTPUT"

      - name: Authenticate diagnostic identity
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DIAGNOSTIC_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Read authoritative webhook callback posture
        id: readback
        env:
          INCLUDE_RUNTIME_DIAGNOSTICS: ${{ steps.auth.outputs.include_runtime_diagnostics }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_JSON="$(gcloud run services describe "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          IAM_JSON="$(gcloud run services get-iam-policy "$WEBHOOK_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          SERVING_REVISION="$(printf '%s' "$SERVICE_JSON" | jq -r '[.status.traffic[]? | select((.percent // 0) == 100 and (.revisionName // "") != "") | .revisionName] | unique | if length == 1 then .[0] else empty end')"
          test -n "$SERVING_REVISION"
          REVISION_JSON="$(gcloud run revisions describe "$SERVING_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          test "$(jq -r '.metadata.name' <<< "$SERVICE_JSON")" = "$WEBHOOK_SERVICE_NAME"
          test "$(jq -r '.metadata.name' <<< "$REVISION_JSON")" = "$SERVING_REVISION"
          jq -e --arg service "$WEBHOOK_SERVICE_NAME" '.metadata.labels["serving.knative.dev/service"] == $service' <<< "$REVISION_JSON" >/dev/null
          if [[ "$INCLUDE_RUNTIME_DIAGNOSTICS" == true ]]; then
            SERVICE_STATUS_URL="$(jq -r '.status.url // empty' <<< "$SERVICE_JSON")" node --input-type=module -e '
              import { validateWebhookServiceUrl } from "./scripts/instagram-webhook-runtime-log-summary.mjs";
              console.log("status_url=" + validateWebhookServiceUrl(process.env.SERVICE_STATUS_URL));
            ' >> "$GITHUB_OUTPUT"
          fi

          INGRESS="$(printf '%s' "$SERVICE_JSON" | jq -r '.metadata.annotations["run.googleapis.com/ingress"] // "all"')"
          DEFAULT_URL_DISABLED="$(printf '%s' "$SERVICE_JSON" | jq -r '.metadata.annotations["run.googleapis.com/default-url-disabled"] // "false"')"
          INVOKER_IAM_DISABLED="$(printf '%s' "$SERVICE_JSON" | jq -r '.metadata.annotations["run.googleapis.com/invoker-iam-disabled"] // "false"')"
          STATUS_URL_PRESENT="$(printf '%s' "$SERVICE_JSON" | jq -r 'if ((.status.url // "") | length) > 0 then "true" else "false" end')"
          LEGACY_ALLUSERS_INVOKER=false
          if printf '%s' "$IAM_JSON" | jq -e '.bindings[]? | select(.role == "roles/run.invoker") | (.members // [])[]? | select(. == "allUsers")' >/dev/null; then
            LEGACY_ALLUSERS_INVOKER=true
          fi

          REVISION_READY="$(printf '%s' "$REVISION_JSON" | jq -r '[.status.conditions[]? | select(.type == "Ready") | .status] | last // "False"')"
          META_WEBHOOK_ENABLED="$(printf '%s' "$REVISION_JSON" | jq -r '[.spec.containers[0].env[]? | select(.name == "META_WEBHOOK_ENABLED") | .value] | last // "false"')"
          META_WEBHOOK_PERSISTENCE_ENABLED="$(printf '%s' "$REVISION_JSON" | jq -r '[.spec.containers[0].env[]? | select(.name == "META_WEBHOOK_PERSISTENCE_ENABLED") | .value] | last // "false"')"
          ENGAGEMENT_RUNTIME_ENABLED="$(printf '%s' "$REVISION_JSON" | jq -r '[.spec.containers[0].env[]? | select(.name == "INSTAGRAM_ENGAGEMENT_RUNTIME_ENABLED") | .value] | last // "false"')"
          SERVICE_ROLE="$(printf '%s' "$REVISION_JSON" | jq -r '[.spec.containers[0].env[]? | select(.name == "TOCA_SERVICE_ROLE") | .value] | last // ""')"

          CLASSIFICATION=PUBLIC_CALLBACK_READY
          if [[ "$REVISION_READY" != True ]]; then
            CLASSIFICATION=BLOCKED_SERVING_REVISION_NOT_READY
          elif [[ "$SERVICE_ROLE" != webhook ]]; then
            CLASSIFICATION=BLOCKED_WRONG_SERVICE_ROLE
          elif [[ "$META_WEBHOOK_ENABLED" != true ]]; then
            CLASSIFICATION=BLOCKED_META_WEBHOOK_DISABLED
          elif [[ "$META_WEBHOOK_PERSISTENCE_ENABLED" != true ]]; then
            CLASSIFICATION=BLOCKED_META_WEBHOOK_PERSISTENCE_DISABLED
          elif [[ "$ENGAGEMENT_RUNTIME_ENABLED" != true ]]; then
            CLASSIFICATION=BLOCKED_ENGAGEMENT_RUNTIME_DISABLED
          elif [[ "$INGRESS" != all ]]; then
            CLASSIFICATION=BLOCKED_INGRESS_RESTRICTED
          elif [[ "$DEFAULT_URL_DISABLED" == true ]]; then
            CLASSIFICATION=BLOCKED_DEFAULT_URL_DISABLED
          elif [[ "$INVOKER_IAM_DISABLED" != true ]]; then
            CLASSIFICATION=BLOCKED_INVOKER_IAM_CHECK_ENABLED
          elif [[ "$LEGACY_ALLUSERS_INVOKER" == true ]]; then
            CLASSIFICATION=BLOCKED_LEGACY_ALLUSERS_INVOKER
          elif [[ "$STATUS_URL_PRESENT" != true ]]; then
            CLASSIFICATION=BLOCKED_STATUS_URL_MISSING
          fi

          {
            echo "classification=$CLASSIFICATION"
            echo "serving_revision=$SERVING_REVISION"
            echo "revision_ready=$REVISION_READY"
            echo "ingress=$INGRESS"
            echo "default_url_disabled=$DEFAULT_URL_DISABLED"
            echo "invoker_iam_disabled=$INVOKER_IAM_DISABLED"
            echo "legacy_allusers_invoker=$LEGACY_ALLUSERS_INVOKER"
            echo "status_url_present=$STATUS_URL_PRESENT"
            echo "meta_webhook_enabled=$META_WEBHOOK_ENABLED"
            echo "meta_webhook_persistence_enabled=$META_WEBHOOK_PERSISTENCE_ENABLED"
            echo "engagement_runtime_enabled=$ENGAGEMENT_RUNTIME_ENABLED"
            echo "service_role=$SERVICE_ROLE"
          } >> "$GITHUB_OUTPUT"

      - name: Read bounded runtime logs and public health without mutations
        id: diagnostic
        if: steps.auth.outputs.include_runtime_diagnostics == 'true'
        env:
          SERVING_REVISION: ${{ steps.readback.outputs.serving_revision }}
          WEBHOOK_URL: ${{ steps.readback.outputs.status_url }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          WORK_DIR="$(mktemp -d)"
          trap 'rm -rf "$WORK_DIR"' EXIT
          [[ "$SERVING_REVISION" =~ ^toca-webhook-next-production-[a-z0-9-]+$ ]]
          test "${#SERVING_REVISION}" -le 63
          HEALTH_STATUS="$(curl --silent --connect-timeout 5 --max-time 15 --proto '=https' --output /dev/null --write-out '%{http_code}' "$WEBHOOK_URL/health")" || HEALTH_STATUS=NETWORK_ERROR
          READY_STATUS="$(curl --silent --connect-timeout 5 --max-time 20 --proto '=https' --output /dev/null --write-out '%{http_code}' "$WEBHOOK_URL/ready")" || READY_STATUS=NETWORK_ERROR
          [[ "$HEALTH_STATUS" =~ ^[1-5][0-9]{2}$ ]] || HEALTH_STATUS=NETWORK_ERROR
          [[ "$READY_STATUS" =~ ^[1-5][0-9]{2}$ ]] || READY_STATUS=NETWORK_ERROR
          HEALTH_CLASSIFICATION=PUBLIC_HEALTH_OR_READY_NON200
          if [[ "$HEALTH_STATUS" == 200 && "$READY_STATUS" == 200 ]]; then
            HEALTH_CLASSIFICATION=PUBLIC_HEALTH_AND_READY_HTTP_200
          fi
          UNTIL="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SINCE="$(date -u -d "$UNTIL -2 hours" +%Y-%m-%dT%H:%M:%SZ)"
          FILTER="resource.type=\"cloud_run_revision\" AND resource.labels.project_id=\"$GCP_PROJECT_ID\" AND resource.labels.location=\"$GCP_REGION\" AND resource.labels.service_name=\"$WEBHOOK_SERVICE_NAME\" AND resource.labels.revision_name=\"$SERVING_REVISION\" AND timestamp>=\"$SINCE\" AND timestamp<=\"$UNTIL\""
          LOG_READ_STATUS=READ_FAILED
          LOG_SUMMARY='{"classification":"LOG_READ_FAILED","rootCause":"NOT_PROVEN","runtimeHealth":"NOT_PROVEN","rawLogPayloadPublished":false}'
          if gcloud logging read "$FILTER" --project "$GCP_PROJECT_ID" --limit=200 --order=desc --format=json > "$WORK_DIR/logs.json" 2> "$WORK_DIR/read-error.txt"; then
            LOG_SUMMARY="$(node scripts/instagram-webhook-runtime-log-summary.mjs "$WORK_DIR/logs.json" "$SERVING_REVISION" "$SINCE" "$UNTIL")"
            LOG_READ_STATUS=READ
          elif grep -Eqi 'PERMISSION_DENIED|permission denied|does not have.*permission' "$WORK_DIR/read-error.txt"; then
            LOG_READ_STATUS=ACCESS_DENIED
          fi
          {
            echo "health_http_status=$HEALTH_STATUS"
            echo "ready_http_status=$READY_STATUS"
            echo "health_classification=$HEALTH_CLASSIFICATION"
            echo "log_read_status=$LOG_READ_STATUS"
            echo "log_window_since=$SINCE"
            echo "log_window_until=$UNTIL"
            echo "log_summary=$LOG_SUMMARY"
          } >> "$GITHUB_OUTPUT"
          test "$LOG_READ_STATUS" = READ

      - name: Publish sanitized callback readback and consume authorization
        if: always() && steps.auth.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORIZATION_ISSUE: ${{ steps.auth.outputs.authorization_issue }}
          READBACK_OUTCOME: ${{ steps.readback.outcome }}
          CLASSIFICATION: ${{ steps.readback.outputs.classification }}
          SERVING_REVISION: ${{ steps.readback.outputs.serving_revision }}
          REVISION_READY: ${{ steps.readback.outputs.revision_ready }}
          INGRESS: ${{ steps.readback.outputs.ingress }}
          DEFAULT_URL_DISABLED: ${{ steps.readback.outputs.default_url_disabled }}
          INVOKER_IAM_DISABLED: ${{ steps.readback.outputs.invoker_iam_disabled }}
          LEGACY_ALLUSERS_INVOKER: ${{ steps.readback.outputs.legacy_allusers_invoker }}
          STATUS_URL_PRESENT: ${{ steps.readback.outputs.status_url_present }}
          META_WEBHOOK_ENABLED: ${{ steps.readback.outputs.meta_webhook_enabled }}
          META_WEBHOOK_PERSISTENCE_ENABLED: ${{ steps.readback.outputs.meta_webhook_persistence_enabled }}
          ENGAGEMENT_RUNTIME_ENABLED: ${{ steps.readback.outputs.engagement_runtime_enabled }}
          SERVICE_ROLE: ${{ steps.readback.outputs.service_role }}
          INCLUDE_RUNTIME_DIAGNOSTICS: ${{ steps.auth.outputs.include_runtime_diagnostics }}
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostic.outcome }}
          HEALTH_HTTP_STATUS: ${{ steps.diagnostic.outputs.health_http_status }}
          READY_HTTP_STATUS: ${{ steps.diagnostic.outputs.ready_http_status }}
          HEALTH_CLASSIFICATION: ${{ steps.diagnostic.outputs.health_classification }}
          LOG_READ_STATUS: ${{ steps.diagnostic.outputs.log_read_status }}
          LOG_WINDOW_SINCE: ${{ steps.diagnostic.outputs.log_window_since }}
          LOG_WINDOW_UNTIL: ${{ steps.diagnostic.outputs.log_window_until }}
          LOG_SUMMARY: ${{ steps.diagnostic.outputs.log_summary }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTHORIZATION_ISSUE:-}"
          STATUS=FAIL
          if [[ "$READBACK_OUTCOME" == success ]]; then STATUS=PASS; fi
          if [[ "$INCLUDE_RUNTIME_DIAGNOSTICS" == true && "$DIAGNOSTIC_OUTCOME" != success ]]; then STATUS=FAIL; fi
          ISSUE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${AUTHORIZATION_ISSUE}")"
          BODY="$(printf '%s' "$ISSUE_JSON" | jq -r '.body // ""')"
          BODY="$(sed 's/^AUTHORIZATION_STATE=ACTIVE$/AUTHORIZATION_STATE=CONSUMED_AND_CLOSED/' <<< "$BODY")"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${AUTHORIZATION_ISSUE}" \
            -f state=closed -f state_reason=completed -f body="$BODY" >/dev/null
          printf -v REPORT '%s\n' \
            "WEBHOOK_CALLBACK_READONLY_STATUS=$STATUS" \
            "CONTROLLER_SHA=$GITHUB_SHA" \
            "CALLBACK_CLASSIFICATION=${CLASSIFICATION:-READBACK_FAILED}" \
            "SERVING_REVISION=${SERVING_REVISION:-UNKNOWN}" \
            "REVISION_READY=${REVISION_READY:-UNKNOWN}" \
            "INGRESS=${INGRESS:-UNKNOWN}" \
            "DEFAULT_URL_DISABLED=${DEFAULT_URL_DISABLED:-UNKNOWN}" \
            "INVOKER_IAM_DISABLED=${INVOKER_IAM_DISABLED:-UNKNOWN}" \
            "LEGACY_ALLUSERS_INVOKER=${LEGACY_ALLUSERS_INVOKER:-UNKNOWN}" \
            "STATUS_URL_PRESENT=${STATUS_URL_PRESENT:-UNKNOWN}" \
            "META_WEBHOOK_ENABLED=${META_WEBHOOK_ENABLED:-UNKNOWN}" \
            "META_WEBHOOK_PERSISTENCE_ENABLED=${META_WEBHOOK_PERSISTENCE_ENABLED:-UNKNOWN}" \
            "ENGAGEMENT_RUNTIME_ENABLED=${ENGAGEMENT_RUNTIME_ENABLED:-UNKNOWN}" \
            "SERVICE_ROLE=${SERVICE_ROLE:-UNKNOWN}" \
            'READ_ONLY=true' \
            'SERVICE_MUTATIONS=false' \
            'DATABASE_MUTATIONS=false' \
            'PROVIDER_CALLS=false' \
            'EXTERNAL_REPLY_WRITES=false'
          if [[ "$INCLUDE_RUNTIME_DIAGNOSTICS" == true ]]; then
            printf -v DIAGNOSTIC_REPORT '%s\n' \
              "PUBLIC_HEALTH_HTTP_STATUS=${HEALTH_HTTP_STATUS:-NOT_OBSERVED}" \
              "PUBLIC_READY_HTTP_STATUS=${READY_HTTP_STATUS:-NOT_OBSERVED}" \
              "PUBLIC_HEALTH_CLASSIFICATION=${HEALTH_CLASSIFICATION:-NOT_PROVEN}" \
              "RUNTIME_LOG_READ_STATUS=${LOG_READ_STATUS:-READ_FAILED}" \
              "RUNTIME_LOG_WINDOW_SINCE=${LOG_WINDOW_SINCE:-UNKNOWN}" \
              "RUNTIME_LOG_WINDOW_UNTIL=${LOG_WINDOW_UNTIL:-UNKNOWN}" \
              "SANITIZED_RUNTIME_LOG_SUMMARY=${LOG_SUMMARY:-NOT_AVAILABLE}" \
              'RUNTIME_LOG_LIMIT=200' \
              'RAW_LOG_PAYLOAD_PUBLISHED=false' \
              'IAM_MUTATIONS=false' \
              'PROVIDER_END_TO_END=NOT_PROVEN_BY_RUNTIME_DIAGNOSTIC'
            REPORT+=$'\n'"$DIAGNOSTIC_REPORT"
          fi
          gh issue comment "$AUTHORIZATION_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$REPORT" >/dev/null
          test "$STATUS" = PASS
