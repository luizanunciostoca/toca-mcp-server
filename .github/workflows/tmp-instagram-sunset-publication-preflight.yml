name: Temporary Instagram Sunset Approval Manifest

on:
  push:
    branches:
      - chore/tmp-instagram-sunset-publication-preflight
    paths:
      - '.github/workflows/tmp-instagram-sunset-publication-preflight.yml'

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Generate exact approval manifest
        env:
          INSTAGRAM_PUBLICATION_REQUEST_JSON: >-
            {"account":{"pageId":"306103746115875","instagramAccountId":"17841402033495654"},"mediaType":"IMAGE","mediaUrls":["https://drive.google.com/uc?export=download&id=1kQOkD7igGJTT4ttx-lCkj_BwQqMSPiPS"],"caption":"Há fins de tarde que não pedem pressa. 🌅🦇\n\nNa Toca do Morcego, o sol encontra o mar e, por alguns minutos, tudo desacelera. O horizonte vira cenário, os encontros ganham outro ritmo e um instante simples se transforma em memória. ✨🌊\n\nSunset é isso: estar presente, sentir a energia e lembrar que celebrar a vida também mora nesses momentos. 💛🥂\n\nCom quem você viveria esse pôr do sol? 🌅\n\n🎟️ Garanta seu ingresso pelo link na bio.\n\n#TocadoMorcego #Sunset #MorroDeSaoPaulo #CelebrarAVida","correlationId":"instagram-sunset-2026-08-12-001","idempotencyKey":"sunset-feed-2026-08-12-v1"}
        run: pnpm start:instagram-publication-approval-manifest
