name: TEMP Staging Policy Boundary Diagnostic fd37 V4 2026-08-23

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  diagnose-policy:
    if: github.head_ref == 'ops/diag-staging-ingress-fd37-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fd3799153cf41b6d573dde8889f355247b7eaf74
          persist-credentials: false
          fetch-depth: 1

      - name: Load exact staging coordinates
        id: config
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'fd3799153cf41b6d573dde8889f355247b7eaf74'
          node scripts/export-staging-deploy-config.mjs infra/environments/staging.json > /tmp/staging.env
          cat /tmp/staging.env >> "$GITHUB_ENV"
          set -a; source /tmp/staging.env; set +a
          test "$GCP_PROJECT_ID" = 'toca-mcp-next-staging'
          test "$GCP_PROJECT_NUMBER" = '729069789107'
          echo "wif=$GCP_WORKLOAD_IDENTITY_PROVIDER" >> "$GITHUB_OUTPUT"
          echo "deployer_sa=$GCP_DEPLOY_SERVICE_ACCOUNT" >> "$GITHUB_OUTPUT"

      - name: Authenticate staging deployer only
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ steps.config.outputs.wif }}
          service_account: ${{ steps.config.outputs.deployer_sa }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Query Cloud Run ingress policy-denied logs and effective org policy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)" = "$GCP_DEPLOY_SERVICE_ACCOUNT"
          mkdir -p /tmp/policy

          POLICY_LOG_ACCESS=PASS
          POLICY_FILTER="resource.type=\"audited_resource\" AND logName=\"projects/${GCP_PROJECT_ID}/logs/cloudaudit.googleapis.com%2Fpolicy\" AND resource.labels.method=\"run.googleapis.com/HttpIngress\""
          if gcloud logging read "$POLICY_FILTER" \
            --project "$GCP_PROJECT_ID" \
            --freshness=45m \
            --limit=100 \
            --format=json > /tmp/policy/http-ingress.json 2>/tmp/policy/http-ingress.err; then
            POLICY_LOG_COUNT="$(jq 'length' /tmp/policy/http-ingress.json)"
            POLICY_DENIED_COUNT="$(jq '[.[] | select((.protoPayload.status.code // 0) != 0 or (.severity // "") == "ERROR")] | length' /tmp/policy/http-ingress.json)"
            POLICY_CODES="$(jq -c '[.[] | (.protoPayload.status.code // 0)] | unique' /tmp/policy/http-ingress.json)"
            POLICY_MESSAGES="$(jq -c '[.[] | (.protoPayload.status.message // empty) | tostring | gsub("[[:space:]]+"; " ") | .[0:180]] | unique | .[0:10]' /tmp/policy/http-ingress.json)"
            POLICY_TIMESTAMPS="$(jq -c '[.[] | (.timestamp // empty)] | unique | sort | reverse | .[0:10]' /tmp/policy/http-ingress.json)"
            POLICY_VIOLATION_TYPES="$(jq -c '[.[] | (.protoPayload.metadata.violationReason // .protoPayload.metadata.vpcServiceControlsTroubleshootToken // .protoPayload.metadata.securityPolicyInfo // empty) | tostring | .[0:180]] | unique | .[0:10]' /tmp/policy/http-ingress.json)"
          else
            POLICY_LOG_ACCESS=DENIED
            POLICY_LOG_COUNT=unknown
            POLICY_DENIED_COUNT=unknown
            POLICY_CODES=unknown
            POLICY_MESSAGES=unknown
            POLICY_TIMESTAMPS=unknown
            POLICY_VIOLATION_TYPES=unknown
          fi

          PROJECT_PARENT="$(gcloud projects describe "$GCP_PROJECT_ID" --format='value(parent.type,parent.id)' 2>/dev/null || true)"
          [[ -n "$PROJECT_PARENT" ]] || PROJECT_PARENT=unavailable

          ALLOWED_INGRESS_ACCESS=PASS
          if gcloud resource-manager org-policies describe run.allowedIngress \
            --project "$GCP_PROJECT_ID" --effective --format=json \
            > /tmp/policy/allowed-ingress.json 2>/tmp/policy/allowed-ingress.err; then
            ALLOWED_INGRESS_SUMMARY="$(jq -c '{constraint:(.constraint // .name // "unknown"),listPolicy:(.listPolicy // null),booleanPolicy:(.booleanPolicy // null),restoreDefault:(.restoreDefault // null)}' /tmp/policy/allowed-ingress.json)"
          else
            ALLOWED_INGRESS_ACCESS=DENIED_OR_UNSUPPORTED
            ALLOWED_INGRESS_SUMMARY=unavailable
          fi

          VPC_EGRESS_ACCESS=PASS
          if gcloud resource-manager org-policies describe run.allowedVPCEgress \
            --project "$GCP_PROJECT_ID" --effective --format=json \
            > /tmp/policy/allowed-vpc-egress.json 2>/tmp/policy/allowed-vpc-egress.err; then
            VPC_EGRESS_SUMMARY="$(jq -c '{constraint:(.constraint // .name // "unknown"),listPolicy:(.listPolicy // null),booleanPolicy:(.booleanPolicy // null),restoreDefault:(.restoreDefault // null)}' /tmp/policy/allowed-vpc-egress.json)"
          else
            VPC_EGRESS_ACCESS=DENIED_OR_UNSUPPORTED
            VPC_EGRESS_SUMMARY=unavailable
          fi

          cat > /tmp/comment.md <<EOF
          STAGING_POLICY_BOUNDARY_DIAG_V4 RUN_ID=${GITHUB_RUN_ID} CANDIDATE=fd3799153cf41b6d573dde8889f355247b7eaf74

          POLICY_LOG_ACCESS=${POLICY_LOG_ACCESS}
          HTTP_INGRESS_POLICY_LOG_COUNT=${POLICY_LOG_COUNT}
          HTTP_INGRESS_POLICY_DENIED_COUNT=${POLICY_DENIED_COUNT}
          HTTP_INGRESS_POLICY_CODES=${POLICY_CODES}
          HTTP_INGRESS_POLICY_MESSAGES=${POLICY_MESSAGES}
          HTTP_INGRESS_POLICY_TIMESTAMPS=${POLICY_TIMESTAMPS}
          HTTP_INGRESS_POLICY_VIOLATION_TYPES=${POLICY_VIOLATION_TYPES}

          PROJECT_PARENT=${PROJECT_PARENT}
          RUN_ALLOWED_INGRESS_POLICY_ACCESS=${ALLOWED_INGRESS_ACCESS}
          RUN_ALLOWED_INGRESS_POLICY=${ALLOWED_INGRESS_SUMMARY}
          RUN_ALLOWED_VPC_EGRESS_POLICY_ACCESS=${VPC_EGRESS_ACCESS}
          RUN_ALLOWED_VPC_EGRESS_POLICY=${VPC_EGRESS_SUMMARY}

          READ_ONLY=true
          PRODUCTION_ACCESS=false
          PROVIDER_ACCESS=false
          TRAFFIC_MUTATION=false
          IAM_MUTATION=false
          ORG_POLICY_MUTATION=false
          EOF
          gh issue comment 151 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
