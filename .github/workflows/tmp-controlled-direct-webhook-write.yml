name: Temporary Controlled Direct Webhook Write

on:
  push:
    branches:
      - feat/instagram-engagement-messaging
    paths:
      - '.github/workflows/tmp-controlled-direct-webhook-write.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  DATABASE_SECRET_ID: toca-database-url
  TOKEN_SECRET_ID: toca-meta-oauth-token
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  PAGE_ID: '306103746115875'
  INSTAGRAM_ACCOUNT_ID: '17841402033495654'
  WRITE_JOB: toca-controlled-direct-webhook-write

jobs:
  controlled-write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build DB-routed fail-closed writer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/controlled-direct-webhook-write
          cp package.json pnpm-lock.yaml /tmp/controlled-direct-webhook-write/
          cat > /tmp/controlled-direct-webhook-write/write.mjs <<'NODE'
          import { createHash } from 'node:crypto';
          import pg from 'pg';

          const { Pool } = pg;
          const databaseUrl = process.env.DATABASE_URL;
          const oauthToken = process.env.META_ACCESS_TOKEN;
          const pageId = process.env.PAGE_ID;
          const accountId = process.env.INSTAGRAM_ACCOUNT_ID;
          const writesEnabled = process.env.INSTAGRAM_ENGAGEMENT_WRITES_ENABLED === 'true';
          const targetText = 'TESTE TOCA MCP DIRECT WEBHOOK 002';
          const replyText = 'TESTE TOCA MCP DIRECT REPLY CONTROLADO 002';
          const routingActivatedAt = new Date('2026-08-12T01:19:06Z');

          if (!databaseUrl || !oauthToken || !pageId || !accountId) {
            throw new Error('CONTROLLED_DIRECT_WEBHOOK_CONFIGURATION_MISSING');
          }
          if (!writesEnabled) throw new Error('CONTROLLED_DIRECT_WEBHOOK_KILL_SWITCH_CLOSED');

          const sha256 = (value) => createHash('sha256').update(value, 'utf8').digest('hex');
          const targetHash = sha256(targetText);
          const replyHash = sha256(replyText);
          const pool = new Pool({ connectionString: databaseUrl });

          async function graph(path, token, options = {}, stage = 'UNKNOWN') {
            const method = String(options.method ?? 'GET').toUpperCase();
            const maxAttempts = method === 'GET' ? 4 : 1;
            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const response = await fetch(`https://graph.facebook.com/v24.0/${path}`, {
                ...options,
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: 'application/json',
                  ...(options.headers ?? {}),
                },
              });
              const body = await response.json().catch(() => ({}));
              if (response.ok) return body;
              const providerCode = body?.error?.code;
              const providerSubcode = body?.error?.error_subcode;
              console.log(`SAFE_CONTROLLED_DIRECT_WEBHOOK_${stage}_HTTP_STATUS=${response.status}`);
              if (Number.isInteger(providerCode)) console.log(`SAFE_CONTROLLED_DIRECT_WEBHOOK_${stage}_PROVIDER_CODE=${providerCode}`);
              if (Number.isInteger(providerSubcode)) console.log(`SAFE_CONTROLLED_DIRECT_WEBHOOK_${stage}_PROVIDER_SUBCODE=${providerSubcode}`);
              const transient = response.status === 429 || response.status >= 500;
              if (method === 'GET' && transient && attempt < maxAttempts) {
                console.log(`SAFE_CONTROLLED_DIRECT_WEBHOOK_${stage}_TRANSIENT_RETRY=${attempt}`);
                await new Promise((resolve) => setTimeout(resolve, 1000 * attempt));
                continue;
              }
              throw new Error(`META_CONTROLLED_DIRECT_WEBHOOK_${stage}_HTTP_${response.status}`);
            }
            throw new Error(`CONTROLLED_DIRECT_WEBHOOK_${stage}_RETRY_EXHAUSTED`);
          }

          try {
            const matches = await pool.query(
              `select event_id, sender_scoped_id, provider_message_id, received_at
                 from meta_webhook_events
                where channel = 'DIRECT'
                  and text_sha256 = $1
                  and sender_scoped_id is not null
                  and provider_message_id is not null
                  and received_at >= $2
                order by received_at desc
                limit 2`,
              [targetHash, routingActivatedAt],
            );
            console.log(`SAFE_CONTROLLED_DIRECT_WEBHOOK_TARGET_MATCHES=${matches.rowCount}`);
            if (matches.rowCount !== 1) {
              throw new Error(`CONTROLLED_DIRECT_WEBHOOK_TARGET_MATCH_COUNT_${matches.rowCount}`);
            }

            const target = matches.rows[0];
            if (typeof target.sender_scoped_id !== 'string' || typeof target.provider_message_id !== 'string') {
              throw new Error('CONTROLLED_DIRECT_WEBHOOK_ROUTING_METADATA_INVALID');
            }

            const idempotencyKey = sha256(
              `instagram-direct-controlled|${target.provider_message_id}|${replyHash}`,
            );
            const correlationId = `controlled-direct:${idempotencyKey}`;

            const client = await pool.connect();
            try {
              await client.query('begin');
              const inserted = await client.query(
                `insert into provider_publications
                   (correlation_id, provider, account_id, state, idempotency_key, payload)
                 values ($1, 'meta', $2, 'PENDING', $3, $4::jsonb)
                 on conflict (idempotency_key) do nothing
                 returning correlation_id`,
                [
                  correlationId,
                  accountId,
                  idempotencyKey,
                  JSON.stringify({
                    channel: 'DIRECT',
                    targetEventIdHash: sha256(target.event_id),
                    providerMessageIdHash: sha256(target.provider_message_id),
                    replyHash,
                  }),
                ],
              );

              if (inserted.rowCount === 0) {
                const existing = await client.query(
                  `select state from provider_publications where idempotency_key = $1 for update`,
                  [idempotencyKey],
                );
                const state = existing.rows[0]?.state;
                await client.query('rollback');
                if (state === 'SUCCEEDED') {
                  console.log('SAFE_CONTROLLED_DIRECT_WEBHOOK_WRITE_ALREADY_PRESENT=1');
                  console.log('SAFE_CONTROLLED_DIRECT_WEBHOOK_WRITE_CREATED=0');
                  return;
                }
                throw new Error(`CONTROLLED_DIRECT_WEBHOOK_IDEMPOTENCY_AMBIGUOUS_${String(state ?? 'MISSING')}`);
              }
              await client.query('commit');
              console.log('SAFE_CONTROLLED_DIRECT_WEBHOOK_IDEMPOTENCY_RESERVED=1');
            } catch (error) {
              await client.query('rollback').catch(() => undefined);
              throw error;
            } finally {
              client.release();
            }

            const page = await graph(
              `${pageId}?fields=access_token,instagram_business_account`,
              oauthToken,
              {},
              'PAGE_TOKEN',
            );
            const pageToken = page?.access_token;
            const linkedAccountId = page?.instagram_business_account?.id;
            if (typeof pageToken !== 'string' || pageToken.length === 0) {
              await pool.query(`update provider_publications set state='FAILED', last_error='PAGE_TOKEN_MISSING', updated_at=now() where correlation_id=$1 and state='PENDING'`, [correlationId]);
              throw new Error('CONTROLLED_DIRECT_WEBHOOK_PAGE_TOKEN_MISSING');
            }
            if (linkedAccountId !== accountId) {
              await pool.query(`update provider_publications set state='FAILED', last_error='LINKED_ACCOUNT_MISMATCH', updated_at=now() where correlation_id=$1 and state='PENDING'`, [correlationId]);
              throw new Error('CONTROLLED_DIRECT_WEBHOOK_LINKED_ACCOUNT_MISMATCH');
            }
            console.log('SAFE_CONTROLLED_DIRECT_WEBHOOK_PAGE_TOKEN_RESOLVED=1');

            let created;
            try {
              created = await graph(
                `${accountId}/messages`,
                pageToken,
                {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({
                    recipient: { id: target.sender_scoped_id },
                    message: { text: replyText },
                  }),
                },
                'SEND',
              );
            } catch (error) {
              await pool.query(
                `update provider_publications set state = 'FAILED', last_error = $2, updated_at = now() where correlation_id = $1 and state = 'PENDING'`,
                [correlationId, error instanceof Error ? error.message : 'UNKNOWN_SEND_FAILURE'],
              );
              throw error;
            }

            if (typeof created?.message_id !== 'string' || typeof created?.recipient_id !== 'string') {
              await pool.query(
                `update provider_publications set state = 'FAILED', last_error = 'PROVIDER_IDS_MISSING', updated_at = now() where correlation_id = $1 and state = 'PENDING'`,
                [correlationId],
              );
              throw new Error('CONTROLLED_DIRECT_WEBHOOK_PROVIDER_IDS_MISSING');
            }
            if (created.recipient_id !== target.sender_scoped_id) {
              await pool.query(
                `update provider_publications set state = 'FAILED', external_resource_id = $2, last_error = 'RECIPIENT_MISMATCH', updated_at = now() where correlation_id = $1 and state = 'PENDING'`,
                [correlationId, created.message_id],
              );
              throw new Error('CONTROLLED_DIRECT_WEBHOOK_RECIPIENT_MISMATCH');
            }

            await pool.query(
              `update provider_publications
                  set state = 'SUCCEEDED', external_resource_id = $2,
                      payload = payload || $3::jsonb, last_error = null, updated_at = now()
                where correlation_id = $1 and state = 'PENDING'`,
              [correlationId, created.message_id, JSON.stringify({
                providerMessageIdHash: sha256(created.message_id),
                recipientHash: sha256(created.recipient_id),
                providerAcknowledged: true,
              })],
            );

            console.log('SAFE_CONTROLLED_DIRECT_WEBHOOK_WRITE_ALREADY_PRESENT=0');
            console.log('SAFE_CONTROLLED_DIRECT_WEBHOOK_WRITE_CREATED=1');
            console.log('SAFE_CONTROLLED_DIRECT_WEBHOOK_PROVIDER_ACKNOWLEDGED=1');
          } catch (error) {
            const message = error instanceof Error ? error.message : 'UNKNOWN';
            console.error(`CONTROLLED_DIRECT_WEBHOOK_FATAL=${message}`);
            throw error;
          } finally {
            await pool.end();
          }
          NODE

          cat > /tmp/controlled-direct-webhook-write/Dockerfile <<'DOCKER'
          FROM node:24-bookworm-slim
          WORKDIR /app
          RUN corepack enable && corepack prepare pnpm@10.15.0 --activate
          COPY package.json pnpm-lock.yaml ./
          RUN pnpm install --prod --frozen-lockfile
          COPY write.mjs ./write.mjs
          USER node
          CMD ["node", "write.mjs"]
          DOCKER

          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/controlled-direct-webhook-write:${GITHUB_SHA}"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" /tmp/controlled-direct-webhook-write
          docker push "$IMAGE"
          echo "WRITE_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Execute exactly one DB-routed controlled Direct write
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            gcloud run jobs delete "$WRITE_JOB" --project "$PROJECT_ID" --region "$REGION" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          gcloud run jobs deploy "$WRITE_JOB" \
            --image "$WRITE_IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --set-env-vars "PAGE_ID=$PAGE_ID,INSTAGRAM_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID,INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=true" \
            --set-secrets "META_ACCESS_TOKEN=$TOKEN_SECRET_ID:latest,DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --max-retries 0 --task-timeout 180s --quiet

          set +e
          EXEC_OUTPUT="$(gcloud run jobs execute "$WRITE_JOB" --project "$PROJECT_ID" --region "$REGION" --wait --format='value(metadata.name)' 2>&1)"
          EXEC_STATUS=$?
          set -e
          echo "$EXEC_OUTPUT"
          EXECUTION="$(echo "$EXEC_OUTPUT" | grep -Eo 'toca-controlled-direct-webhook-write-[a-z0-9]+' | tail -1 || true)"

          if [ -n "$EXECUTION" ]; then
            for i in $(seq 1 12); do
              LOGS="$(gcloud logging read \
                "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$WRITE_JOB\" AND labels.\"run.googleapis.com/execution_name\"=\"$EXECUTION\"" \
                --project "$PROJECT_ID" --freshness=15m --limit=100 --format='value(textPayload)' 2>/dev/null || true)"
              if echo "$LOGS" | grep -Eq 'SAFE_CONTROLLED_DIRECT_WEBHOOK_|CONTROLLED_DIRECT_WEBHOOK_FATAL='; then
                echo '--- CONTROLLED DIRECT EXECUTION LOGS ---'
                echo "$LOGS" | grep -E 'SAFE_CONTROLLED_DIRECT_WEBHOOK_|CONTROLLED_DIRECT_WEBHOOK_FATAL=|Error:' || true
                break
              fi
              sleep 5
            done
          fi

          if [ "$EXEC_STATUS" -ne 0 ]; then
            exit "$EXEC_STATUS"
          fi

          MARKERS="$(echo "$LOGS" | grep -E '^SAFE_CONTROLLED_DIRECT_WEBHOOK_' | sort -u || true)"
          CREATED="$(echo "$MARKERS" | sed -n 's/^SAFE_CONTROLLED_DIRECT_WEBHOOK_WRITE_CREATED=//p' | tail -1)"
          ALREADY="$(echo "$MARKERS" | sed -n 's/^SAFE_CONTROLLED_DIRECT_WEBHOOK_WRITE_ALREADY_PRESENT=//p' | tail -1)"
          ACK="$(echo "$MARKERS" | sed -n 's/^SAFE_CONTROLLED_DIRECT_WEBHOOK_PROVIDER_ACKNOWLEDGED=//p' | tail -1)"
          if [ "${CREATED:-0}" = "1" ]; then test "${ACK:-0}" = "1"; else test "${ALREADY:-0}" = "1"; fi

      - name: Confirm public boundary remains writes-off
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe toca-meta-oauth-staging --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/service.json
          VALUE="$(jq -r '[.spec.template.spec.containers[0].env[]? | select(.name == "INSTAGRAM_ENGAGEMENT_WRITES_ENABLED") | .value][0] // "__MISSING__"' /tmp/service.json)"
          test "$VALUE" = "false"
          echo 'SAFE_PUBLIC_BOUNDARY_WRITES_ENABLED=0'
