name: TEMP Comment Provider Canary Safety Patch

on:
  push:
    branches:
      - fix/comment-provider-canary-authority-null-safety

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Apply exact safety patch
        run: python .tmp/patch-comment-provider-canary-safety.py

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Format and run focused regression
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write .github/workflows/instagram-engagement-comment-provider-canary.yml scripts/instagram-engagement-comment-provider-canary.mjs test/instagram-engagement-comment-provider-canary.test.ts
          pnpm exec vitest run test/instagram-engagement-comment-provider-canary.test.ts

      - name: Record exact tested file digests
        run: |
          set -euo pipefail
          sha256sum \
            .github/workflows/instagram-engagement-comment-provider-canary.yml \
            scripts/instagram-engagement-comment-provider-canary.mjs \
            test/instagram-engagement-comment-provider-canary.test.ts \
            | tee tested-files.sha256

      - name: Upload exact tested patch artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: comment-provider-canary-tested-patch-${{ github.run_id }}
          path: |
            .github/workflows/instagram-engagement-comment-provider-canary.yml
            scripts/instagram-engagement-comment-provider-canary.mjs
            test/instagram-engagement-comment-provider-canary.test.ts
            tested-files.sha256
          if-no-files-found: error
          retention-days: 1
