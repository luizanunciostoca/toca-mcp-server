name: TEMP Comment Provider Canary Safety Patch

on:
  push:
    branches:
      - fix/comment-provider-canary-authority-null-safety

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Apply exact safety patch
        run: python .tmp/patch-comment-provider-canary-safety.py

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Format and run focused regression
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write .github/workflows/instagram-engagement-comment-provider-canary.yml scripts/instagram-engagement-comment-provider-canary.mjs test/instagram-engagement-comment-provider-canary.test.ts
          pnpm exec vitest run test/instagram-engagement-comment-provider-canary.test.ts

      - name: Stage exact tested candidate commit without moving branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            '.github/workflows/instagram-engagement-comment-provider-canary.yml'
            'scripts/instagram-engagement-comment-provider-canary.mjs'
            'test/instagram-engagement-comment-provider-canary.test.ts'
          )

          declare -A blobs
          for path in "${paths[@]}"; do
            file_sha256="$(sha256sum "$path" | awk '{print $1}')"
            blob_sha="$(jq -Rs '{content: ., encoding: "utf-8"}' < "$path" \
              | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq '.sha')"
            [[ "$blob_sha" =~ ^[0-9a-f]{40}$ ]]
            blobs["$path"]="$blob_sha"
            echo "TESTED_FILE_SHA256[$path]=$file_sha256"
            echo "TESTED_BLOB_SHA[$path]=$blob_sha"
          done

          base_tree="$(git rev-parse 'HEAD^{tree}')"
          tree_payload="$(jq -n \
            --arg base_tree "$base_tree" \
            --arg workflow_blob "${blobs[.github/workflows/instagram-engagement-comment-provider-canary.yml]}" \
            --arg runner_blob "${blobs[scripts/instagram-engagement-comment-provider-canary.mjs]}" \
            --arg test_blob "${blobs[test/instagram-engagement-comment-provider-canary.test.ts]}" \
            '{base_tree:$base_tree,tree:[
              {path:".github/workflows/instagram-engagement-comment-provider-canary.yml",mode:"100644",type:"blob",sha:$workflow_blob},
              {path:"scripts/instagram-engagement-comment-provider-canary.mjs",mode:"100644",type:"blob",sha:$runner_blob},
              {path:"test/instagram-engagement-comment-provider-canary.test.ts",mode:"100644",type:"blob",sha:$test_blob},
              {path:".github/workflows/tmp-comment-provider-canary-safety-patch.yml",mode:"100644",type:"blob",sha:null},
              {path:".tmp/patch-comment-provider-canary-safety.py",mode:"100644",type:"blob",sha:null}
            ]}')"
          tree_sha="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq '.sha' <<< "$tree_payload")"
          [[ "$tree_sha" =~ ^[0-9a-f]{40}$ ]]

          commit_payload="$(jq -n \
            --arg message 'fix(instagram): harden Comment canary authority checks' \
            --arg tree "$tree_sha" \
            --arg parent "$GITHUB_SHA" \
            '{message:$message,tree:$tree,parents:[$parent]}')"
          commit_sha="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq '.sha' <<< "$commit_payload")"
          [[ "$commit_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "CANDIDATE_TREE_SHA=$tree_sha"
          echo "CANDIDATE_COMMIT_SHA=$commit_sha"
          echo 'BRANCH_REF_UPDATED=false'

      - name: Upload exact tested patch artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: comment-provider-canary-tested-patch-${{ github.run_id }}
          path: |
            .github/workflows/instagram-engagement-comment-provider-canary.yml
            scripts/instagram-engagement-comment-provider-canary.mjs
            test/instagram-engagement-comment-provider-canary.test.ts
          if-no-files-found: error
          retention-days: 1
