name: Ops Apply Threshold Normalization

on:
  push:
    branches:
      - fix/reliability-threshold-default-normalization-20260823

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/reliability-threshold-default-normalization-20260823
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Apply exact minimal patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script = Path('ops/staging-runtime-observability-reconcile-v3.sh')
          text = script.read_text()
          old = '    conditions:[.conditions[] | del(.name)],'
          new = '    conditions:[.conditions[] | del(.name) | if has("conditionThreshold") then .conditionThreshold.thresholdValue = (.conditionThreshold.thresholdValue // 0) else . end],'
          if text.count(old) != 1:
              raise SystemExit(f'expected one alert projection target, found {text.count(old)}')
          script.write_text(text.replace(old, new))

          test = Path('test/staging-runtime-observability-contract.test.ts')
          text = test.read_text()
          anchor = "    expect(script).toContain('revision_name:');\n"
          addition = "    expect(script).toContain(\n      '.conditionThreshold.thresholdValue = (.conditionThreshold.thresholdValue // 0)',\n    );\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one test anchor, found {text.count(anchor)}')
          test.write_text(text.replace(anchor, anchor + addition))
          PY
          rm .github/workflows/ops-apply-threshold-normalization.yml
          bash -n ops/staging-runtime-observability-reconcile-v3.sh
          pnpm install --frozen-lockfile
          pnpm exec prettier --check ops/staging-runtime-observability-reconcile-v3.sh test/staging-runtime-observability-contract.test.ts
          pnpm exec vitest run test/staging-runtime-observability-contract.test.ts
      - name: Commit final branch-only fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/staging-runtime-observability-reconcile-v3.sh test/staging-runtime-observability-contract.test.ts .github/workflows/ops-apply-threshold-normalization.yml
          git diff --cached --check
          git commit -m 'fix(reliability): normalize zero alert threshold readback'
          git push origin HEAD:fix/reliability-threshold-default-normalization-20260823
