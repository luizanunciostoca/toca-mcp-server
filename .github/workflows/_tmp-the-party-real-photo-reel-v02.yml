name: TEMP The Party Real Photo Reel V02

on:
  push:
    branches:
      - ops/the-party-real-photo-reel-v02-20260904
    paths:
      - .github/workflows/_tmp-the-party-real-photo-reel-v02.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: the-party-real-photo-reel-v02-diagnostics-20260904
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  FAILED_JOB: toca-tp-realphoto-v02-33905028916-1
  FAILED_EXECUTION: toca-tp-realphoto-v02-33905028916-1-6m7tv

jobs:
  diagnose:
    if: github.ref == 'refs/heads/ops/the-party-real-photo-reel-v02-20260904'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Authenticate deployer identity
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Capture sanitized failed execution logs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          FILTER="resource.type=cloud_run_job AND resource.labels.job_name=${FAILED_JOB}"
          gcloud logging read "$FILTER" \
            --project "$GCP_PROJECT_ID" \
            --freshness=4h \
            --limit=500 \
            --order=asc \
            --format=json > diagnostics/raw.json
          jq '[.[] | {
            timestamp,
            severity,
            textPayload,
            jsonPayload: (if .jsonPayload then (.jsonPayload | del(.authorizationInfo,.authenticationInfo,.requestMetadata,.serviceAccountDelegationInfo)) else null end),
            labels
          }]' diagnostics/raw.json > diagnostics/sanitized.json
          jq -r '.[] | [.timestamp, (.severity // ""), (.textPayload // (.jsonPayload.message // .jsonPayload.error // ""))] | @tsv' diagnostics/sanitized.json \
            | grep -Ei 'error|failed|exception|invalid|mismatch|denied|quota|permission|sha|source|veo|vertex|drive|oauth|video|content|authorization|consent|resolution|aspect' \
            | tail -n 160 > diagnostics/relevant.txt || true
          echo '--- SANITIZED RELEVANT LOGS ---'
          cat diagnostics/relevant.txt
          echo '--- END SANITIZED RELEVANT LOGS ---'
          test -s diagnostics/sanitized.json

      - name: Upload diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: the-party-real-photo-reel-v02-diagnostics
          path: diagnostics/
          if-no-files-found: error
          retention-days: 7
