name: Security Supply Chain

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-supply-chain-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  vulnerability-secret-container-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Node dependency vulnerabilities
        run: pnpm audit --audit-level high

      - name: Scan pull-request commits for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.24.3

      - name: Scan complete candidate ancestry for secrets
        if: always()
        run: >-
          gitleaks git
          --redact
          --exit-code=1
          --report-format=sarif
          --report-path=full-history-gitleaks-results.sarif
          --log-opts=HEAD
          .

      - name: Upload complete-history secret-scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-full-history-${{ env.CANDIDATE_SHA }}
          path: full-history-gitleaks-results.sarif
          if-no-files-found: error
          retention-days: 90

      - name: Scan repository filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Build immutable candidate container
        run: docker build --pull -t "toca-mcp:${CANDIDATE_SHA}" .

      - name: Scan candidate container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'toca-mcp:${{ env.CANDIDATE_SHA }}'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'toca-mcp:${{ env.CANDIDATE_SHA }}'
          format: 'cyclonedx'
          output: 'toca-mcp-sbom.cdx.json'
          exit-code: '0'

      - name: Build immutable AG-01 orchestrator candidate
        run: docker build --pull --file Dockerfile.orchestrator -t "toca-ag01:${CANDIDATE_SHA}" .

      - name: Scan AG-01 orchestrator candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'toca-ag01:${{ env.CANDIDATE_SHA }}'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate AG-01 CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'toca-ag01:${{ env.CANDIDATE_SHA }}'
          format: 'cyclonedx'
          output: 'toca-ag01-sbom.cdx.json'
          exit-code: '0'

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: toca-container-sboms-${{ env.CANDIDATE_SHA }}
          path: |
            toca-mcp-sbom.cdx.json
            toca-ag01-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  codeql:
    permissions:
      contents: read
      security-events: write
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
        with:
          languages: javascript-typescript

      - name: Analyze CodeQL database
        uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
