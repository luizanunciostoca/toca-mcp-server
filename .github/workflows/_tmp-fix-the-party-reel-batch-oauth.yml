name: TEMP Fix The Party Reel Batch OAuth Reference

on:
  push:
    branches:
      - ops/the-party-reel-gen-20260904
    paths:
      - .github/workflows/_tmp-fix-the-party-reel-batch-oauth.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/ops/the-party-reel-gen-20260904'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Apply exact canonical OAuth reference
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('src/the-party-reel-generative-batch.ts')
          text = path.read_text()
          old = "const driveTokenReference = { provider: 'gcp-service-identity-oauth', key: 'the-party-reel-batch' } as const;"
          new = "const driveTokenReference = { provider: 'gcp-service-identity-oauth', key: 'video-workspace' } as const;"
          if text.count(old) != 1:
              raise SystemExit(f'EXPECTED_OLD_REFERENCE_ONCE: observed={text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          grep -F "key: 'video-workspace'" src/the-party-reel-generative-batch.ts >/dev/null
          ! grep -F "key: 'the-party-reel-batch'" src/the-party-reel-generative-batch.ts >/dev/null

      - name: Commit exact fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/the-party-reel-generative-batch.ts
          git commit -m 'fix(video): use canonical workspace OAuth scope set'
          git push origin HEAD:ops/the-party-reel-gen-20260904
