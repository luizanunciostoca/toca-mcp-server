name: GCP Infra Admin WIF Binding Repair

on:
  push:
    branches:
      - ops/final-candidate-readonly-proof-20260821
    paths:
      - '.github/workflows/gcp-infra-admin-wif-binding-repair.yml'

permissions:
  contents: read
  id-token: write

jobs:
  repair:
    environment: infrastructure-admin
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: toca-mcp-production
      WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
      DEPLOYER_SA: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      INFRA_ADMIN_SA: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com
      WIF_MEMBER: principal://iam.googleapis.com/projects/990081828836/locations/global/workloadIdentityPools/github/subject/repo:luizanunciostoca@318748875/toca-mcp-server@1339919100:environment:infrastructure-admin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 7db1a6e5caf01f98b200257c4aeecc2f1b29550a
          persist-credentials: false
      - name: Authenticate known-good deployer
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Apply exact authorized WIF binding
        run: |
          set -euo pipefail
          gcloud iam service-accounts add-iam-policy-binding "$INFRA_ADMIN_SA" \
            --project "$PROJECT_ID" \
            --member "$WIF_MEMBER" \
            --role roles/iam.workloadIdentityUser \
            --condition=None
          echo 'INFRA_ADMIN_WIF_BINDING_REPAIR_APPLIED=true'
      - name: Verify infra-admin impersonation after repair
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.INFRA_ADMIN_SA }}
      - name: Verify usable infra-admin token
        run: |
          set -euo pipefail
          gcloud auth print-access-token >/dev/null
          echo 'INFRA_ADMIN_WIF_TOKEN=PASS'
