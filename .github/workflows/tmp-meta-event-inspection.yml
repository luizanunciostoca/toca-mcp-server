name: Temporary Meta Event Inspection

on:
  push:
    branches:
      - feat/instagram-engagement-messaging

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect sanitized webhook evidence
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ID=toca-mcp-production
          SERVICE=toca-meta-oauth-staging
          FILTER='resource.type="cloud_run_revision" AND resource.labels.service_name="'"$SERVICE"'" AND timestamp>="2026-08-11T21:30:00Z"'
          gcloud logging read "$FILTER" --project "$PROJECT_ID" --limit=500 --format='value(textPayload)' > /tmp/meta-logs.txt
          POST_COUNT=$(grep -c 'POST /webhooks/meta' /tmp/meta-logs.txt || true)
          COMMENT_COUNT=$(grep -c 'COMMENT' /tmp/meta-logs.txt || true)
          DIRECT_COUNT=$(grep -c 'DIRECT' /tmp/meta-logs.txt || true)
          EVENT_LINES=$(grep -E 'COMMENT|DIRECT|eventId|webhook' /tmp/meta-logs.txt | sed -E 's/[[:alnum:]_@.-]{24,}/[redacted]/g' | head -n 40 || true)
          echo "SAFE_POST_COUNT=$POST_COUNT"
          echo "SAFE_COMMENT_COUNT=$COMMENT_COUNT"
          echo "SAFE_DIRECT_COUNT=$DIRECT_COUNT"
          if [ -n "$EVENT_LINES" ]; then
            echo 'SAFE_EVENT_MARKERS_BEGIN'
            echo "$EVENT_LINES"
            echo 'SAFE_EVENT_MARKERS_END'
          fi
