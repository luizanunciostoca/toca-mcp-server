name: CRM Sales Format Helper

on:
  push:
    branches:
      - feat/next-crm-sales-engine-advanced-20260820

permissions:
  contents: write

concurrency:
  group: crm-sales-format-helper
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/next-crm-sales-engine-advanced-20260820
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Correct canonical audit readback assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('test/crm-sales-postgres-e2e.test.ts')
          text = path.read_text()
          old = """`select count(*)::text as count from internal_audit_ledger
          where tenant_id=$1 and workspace_id=$2 and organization_id=$3
            and record_type='OPPORTUNITY' and record_id=$4`"""
          new = """`select count(*)::text as count from audit_ledger_events
          where tenant_id=$1 and workspace_id=$2 and organization_id=$3
            and tool_name='core.crm.sales.opportunity.updated' and external_resource_id=$4`"""
          if old not in text:
              raise SystemExit('CRM_SALES_AUDIT_ASSERTION_PATTERN_NOT_FOUND')
          path.write_text(text.replace(old, new))
          PY
      - name: Format CRM Sales files
        run: >-
          pnpm exec prettier --write
          src/crm/sales-engine.ts
          src/persistence/postgres-crm-sales-store.ts
          test/crm-sales-postgres-e2e.test.ts
          test/crm-sales-engine.test.ts
          .github/workflows/m-found-12-postgres-e2e.yml
      - name: Commit normalized files
        run: |
          if git diff --quiet; then
            echo 'CRM_SALES_FORMAT_NO_CHANGES=1'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/crm/sales-engine.ts src/persistence/postgres-crm-sales-store.ts test/crm-sales-postgres-e2e.test.ts test/crm-sales-engine.test.ts .github/workflows/m-found-12-postgres-e2e.yml
          git commit -m 'style(crm): apply repository formatting'
          git push origin HEAD:feat/next-crm-sales-engine-advanced-20260820
