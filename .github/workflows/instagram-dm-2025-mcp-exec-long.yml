name: Instagram DM 2025 MCP Execution Long

on:
  push:
    branches:
      - ops/instagram-dm-2025-mcp-exec-20260828
    paths:
      - '.github/workflows/instagram-dm-2025-mcp-exec-long.yml'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_ARTIFACT_REPOSITORY: toca-mcp
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  DATABASE_SECRET_ID: toca-database-url
  TOKEN_SECRET_ID: toca-meta-oauth-token
  INSTAGRAM_ACCOUNT_ID: '17841402033495654'

jobs:
  execute-through-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Prepare long-running TOCA MCP client
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          ids = Path('src/governance/capability-ids.ts')
          text = ids.read_text()
          old = "  R08: ['meta_ads.accounts.list', 'meta_ads.campaign.prepare_paused'],\n  R17: ['system.capabilities', 'system.health'],"
          new = "  R08: ['meta_ads.accounts.list', 'meta_ads.campaign.prepare_paused'],\n  R09: [\n    'instagram.messaging.conversations.read',\n    'instagram.messaging.messages.read',\n  ],\n  R17: ['system.capabilities', 'system.health'],"
          if old in text:
              ids.write_text(text.replace(old, new, 1))

          server = Path('src/server.ts')
          text = server.read_text()
          old = "  const cloudRunService = env.K_SERVICE?.trim();"
          new = "  const cloudRunService = env.K_SERVICE?.trim() || env.CLOUD_RUN_JOB?.trim();"
          if old in text:
              server.write_text(text.replace(old, new, 1))

          workflow = Path('.github/workflows/instagram-dm-2025-mcp-exec.yml').read_text()
          start_marker = "cat > src/instagram-dm-2025-mcp-exec.ts <<'TS'\n"
          end_marker = "\n          TS\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          raw = workflow[start:end]
          lines = []
          for line in raw.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          client = '\n'.join(lines) + '\n'
          client = client.replace('}, 20000);', '}, 90000);')
          Path('src/instagram-dm-2025-mcp-exec.ts').write_text(client)
          PY
          pnpm install --frozen-lockfile
          pnpm exec prettier --write src/governance/capability-ids.ts src/server.ts src/instagram-dm-2025-mcp-exec.ts
          pnpm typecheck
          pnpm build

      - name: Authenticate deployer to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Build immutable MCP image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/server:instagram-dm-mcp-long-${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "JOB_NAME=toca-instagram-dm-mcp-long-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Execute and read MCP validation
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            gcloud run jobs delete "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          gcloud run jobs deploy "$JOB_NAME" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --command node \
            --args dist/src/instagram-dm-2025-mcp-exec.js \
            --set-env-vars "^~^NODE_ENV=production~MCP_ENABLED=true~INSTAGRAM_READ_ENABLED=true~INSTAGRAM_BUSINESS_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID~META_ACCESS_TOKEN_ENV_KEY=META_ACCESS_TOKEN~META_GRAPH_BASE_URL=https://graph.facebook.com~META_GRAPH_API_VERSION=v24.0~META_ENABLED=false~META_WEBHOOK_ENABLED=false~META_WEBHOOK_PERSISTENCE_ENABLED=false~INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=false~INSTAGRAM_PUBLICATION_WRITES_ENABLED=false~META_ADS_READ_ENABLED=false~META_ADS_WRITE_ENABLED=false~GOOGLE_ADS_PHASE=OFF~TOCA_MANAGED_INSTAGRAM_SCHEDULER_ENABLED=false~TOCA_MANAGED_INSTAGRAM_EXECUTOR_ENABLED=false" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest,META_ACCESS_TOKEN=$TOKEN_SECRET_ID:latest" \
            --tasks 1 --max-retries 0 --task-timeout 240s --quiet

          STATUS=0
          gcloud run jobs execute "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet || STATUS=$?

          for attempt in 1 2 3 4 5 6; do
            LINES="$(gcloud logging read "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME}" --project "$GCP_PROJECT_ID" --freshness=30m --limit=200 --order=asc --format='value(textPayload)' | grep '"validation"' || true)"
            if [ -n "$LINES" ]; then
              printf '%s\n' "$LINES"
              break
            fi
            sleep 10
          done
          exit "$STATUS"
