name: GCP Meta Webhook Routing Diagnose

on:
  push:
    branches:
      - feat/instagram-engagement-messaging

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Diagnose sanitized webhook routing
        shell: bash
        run: |
          set -euo pipefail
          PROJECT='toca-mcp-production'
          REGION='southamerica-east1'
          EXPECTED_SERVICE='toca-meta-oauth-staging'
          SINCE="$(date -u -d '6 hours ago' '+%Y-%m-%dT%H:%M:%SZ')"

          echo '=== EXPECTED SERVICE ==='
          gcloud run services describe "$EXPECTED_SERVICE" --project "$PROJECT" --region "$REGION" --format='value(metadata.name,status.url,status.latestReadyRevisionName)'

          echo '=== ALL CLOUD RUN SERVICES ==='
          gcloud run services list --project "$PROJECT" --region "$REGION" --format='table(metadata.name,status.url,status.latestReadyRevisionName)'

          echo '=== WEBHOOK POSTS BY SERVICE (SANITIZED) ==='
          FILTER="resource.type=cloud_run_revision AND httpRequest.requestMethod=POST AND httpRequest.requestUrl:\"/webhooks/meta\" AND timestamp>=\"${SINCE}\""
          gcloud logging read "$FILTER" --project "$PROJECT" --limit=1000 --format='value(resource.labels.service_name)' | sort | uniq -c || true

          echo '=== ACCEPTED WEBHOOK EVENTS BY SERVICE (SANITIZED) ==='
          FILTER2="resource.type=cloud_run_revision AND textPayload:\"Meta webhook events accepted\" AND timestamp>=\"${SINCE}\""
          gcloud logging read "$FILTER2" --project "$PROJECT" --limit=1000 --format='value(resource.labels.service_name,textPayload)' | sed -E 's/(eventIds|sender|text|message)[=:][^ ]+//g' || true
