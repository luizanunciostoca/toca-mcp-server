name: Final Deploy Stale Cancel Dispatch 2026-08-16

on:
  push:
    branches: [ops/final-exact-main-deploy-20260816]
    paths: ['.github/workflows/final-deploy-stale-cancel-dispatch-20260816.yml']

permissions:
  actions: write
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded deploy runs and dispatch exact current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for RUN_ID in 31936404714 31936712415; do
            HTTP="$(curl --silent --output "/tmp/cancel-${RUN_ID}.txt" --write-out '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/cancel")"
            cat "/tmp/cancel-${RUN_ID}.txt"
            case "$HTTP" in
              202|409) ;;
              *) echo "unexpected cancel HTTP ${HTTP} for ${RUN_ID}"; exit 1 ;;
            esac
          done
          MAIN_SHA="$(curl --silent \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" | jq -r '.object.sha')"
          test "$MAIN_SHA" = '58f31df28e63629d3933bbce67bf912932d05829'
          HTTP="$(curl --silent --output /tmp/dispatch.txt --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data '{"ref":"main"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-toca-managed-instagram-daemon-gcp.yml/dispatches")"
          cat /tmp/dispatch.txt
          test "$HTTP" = '204'
          echo "FINAL_EXACT_MAIN_DEPLOY_DISPATCH=PASS sha=$MAIN_SHA"
