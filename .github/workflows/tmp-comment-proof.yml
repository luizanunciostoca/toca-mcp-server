name: Temporary Comment Proof

on:
  push:
    branches:
      - feat/instagram-engagement-messaging

permissions:
  contents: read
  id-token: write

concurrency:
  group: tmp-comment-proof
  cancel-in-progress: false

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  SERVICE: toca-meta-oauth-staging
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  DATABASE_SECRET_ID: toca-database-url
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  JOB: toca-comment-proof

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build sanitized PostgreSQL proof image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/comment-proof
          cat > /tmp/comment-proof/proof.mjs <<'NODE'
          import pg from 'pg';

          const connectionString = process.env.DATABASE_URL;
          const runId = process.env.PROOF_RUN_ID;
          if (!connectionString || !runId) throw new Error('proof configuration missing');

          const pool = new pg.Pool({ connectionString, ssl: false, max: 1 });
          try {
            const comments = await pool.query(`
              select count(*)::int as count
              from meta_webhook_events
              where channel = 'COMMENT'
                and received_at >= now() - interval '30 minutes'
                and event_id not like 'validation:%'
            `);
            const audits = await pool.query(`
              select count(*)::int as count
              from audit_events
              where created_at >= now() - interval '30 minutes'
                and tool_name = 'instagram.engagement.webhook.receive'
                and decision = 'ACCEPTED'
                and correlation_id not like 'validation:%'
            `);

            const commentCount = comments.rows[0]?.count ?? 0;
            const auditCount = audits.rows[0]?.count ?? 0;
            console.log(`SAFE_RUN_${runId}_PERSISTED_COMMENT_COUNT=${commentCount}`);
            console.log(`SAFE_RUN_${runId}_ACCEPTED_AUDIT_COUNT=${auditCount}`);

            if (commentCount < 1) process.exitCode = 2;
            else if (auditCount < 1) process.exitCode = 3;
            else console.log(`SAFE_RUN_${runId}_COMMENT_PERSISTENCE_OK=1`);
          } finally {
            await pool.end().catch(() => undefined);
          }
          NODE

          cat > /tmp/comment-proof/Dockerfile <<'DOCKER'
          FROM node:24-bookworm-slim
          WORKDIR /app
          RUN npm init -y >/dev/null 2>&1 && npm install pg@8.16.3 >/dev/null 2>&1
          COPY proof.mjs ./proof.mjs
          USER node
          CMD ["node", "proof.mjs"]
          DOCKER

          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/comment-proof:${GITHUB_SHA}"
          docker build -t "$IMAGE" /tmp/comment-proof
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Verify Cloud Run and PostgreSQL comment proof
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            gcloud run jobs delete "$JOB" --project "$PROJECT_ID" --region "$REGION" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          POST_COUNT="$(gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$SERVICE\" AND httpRequest.requestMethod=\"POST\" AND httpRequest.requestUrl:\"/webhooks/meta\"" \
            --project "$PROJECT_ID" --freshness=30m --limit=100 --format='value(insertId)' 2>/dev/null | sed '/^$/d' | wc -l | tr -d ' ')"
          COMMENT_ACCEPTED_COUNT="$(gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$SERVICE\" AND textPayload:\"Meta webhook events accepted\" AND textPayload:\"COMMENT\"" \
            --project "$PROJECT_ID" --freshness=30m --limit=100 --format='value(insertId)' 2>/dev/null | sed '/^$/d' | wc -l | tr -d ' ')"

          echo "SAFE_RUN_${GITHUB_RUN_ID}_WEBHOOK_POST_COUNT=$POST_COUNT"
          echo "SAFE_RUN_${GITHUB_RUN_ID}_COMMENT_ACCEPTED_COUNT=$COMMENT_ACCEPTED_COUNT"

          gcloud run jobs deploy "$JOB" \
            --image "$IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --set-env-vars "PROOF_RUN_ID=$GITHUB_RUN_ID" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --max-retries 0 \
            --task-timeout 120s \
            --quiet

          set +e
          gcloud run jobs execute "$JOB" --project "$PROJECT_ID" --region "$REGION" --wait --quiet
          EXECUTE_STATUS=$?
          set -e

          MARKERS=''
          for ATTEMPT in 1 2 3 4 5; do
            MARKERS="$(gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$JOB\" AND textPayload:\"SAFE_RUN_${GITHUB_RUN_ID}_\"" \
              --project "$PROJECT_ID" --freshness=10m --limit=30 --format='value(textPayload)' 2>/dev/null \
              | grep -E "^SAFE_RUN_${GITHUB_RUN_ID}_(PERSISTED_COMMENT_COUNT|ACCEPTED_AUDIT_COUNT|COMMENT_PERSISTENCE_OK)=[0-9]+$" | sort -u || true)"
            [ -n "$MARKERS" ] && break
            sleep 2
          done
          echo "$MARKERS"

          test "$POST_COUNT" -ge 1
          test "$COMMENT_ACCEPTED_COUNT" -ge 1
          test "$EXECUTE_STATUS" -eq 0
          echo "$MARKERS" | grep -q "SAFE_RUN_${GITHUB_RUN_ID}_COMMENT_PERSISTENCE_OK=1"
