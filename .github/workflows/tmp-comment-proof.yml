name: Temporary Comment Proof

on:
  push:
    branches:
      - feat/instagram-engagement-messaging

permissions:
  contents: read
  id-token: write

concurrency:
  group: tmp-comment-proof
  cancel-in-progress: false

env:
  PROJECT_ID: toca-mcp-production
  SERVICE: toca-meta-oauth-staging

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Classify sanitized webhook statuses
        shell: bash
        run: |
          set -euo pipefail
          BASE_FILTER='resource.type="cloud_run_revision" AND resource.labels.service_name="'"$SERVICE"'" AND httpRequest.requestMethod="POST" AND httpRequest.requestUrl:"/webhooks/meta"'

          count_status() {
            local status="$1"
            gcloud logging read "$BASE_FILTER AND httpRequest.status=$status" \
              --project "$PROJECT_ID" --freshness=60m --limit=100 --format='value(insertId)' 2>/dev/null \
              | sed '/^$/d' | wc -l | tr -d ' '
          }

          TOTAL="$(gcloud logging read "$BASE_FILTER" --project "$PROJECT_ID" --freshness=60m --limit=100 --format='value(insertId)' 2>/dev/null | sed '/^$/d' | wc -l | tr -d ' ')"
          S200="$(count_status 200)"
          S202="$(count_status 202)"
          S400="$(count_status 400)"
          S401="$(count_status 401)"
          S403="$(count_status 403)"
          S413="$(count_status 413)"
          S500="$(count_status 500)"

          echo "SAFE_RUN_${GITHUB_RUN_ID}_POST_TOTAL=$TOTAL"
          echo "SAFE_RUN_${GITHUB_RUN_ID}_STATUS_200=$S200"
          echo "SAFE_RUN_${GITHUB_RUN_ID}_STATUS_202=$S202"
          echo "SAFE_RUN_${GITHUB_RUN_ID}_STATUS_400=$S400"
          echo "SAFE_RUN_${GITHUB_RUN_ID}_STATUS_401=$S401"
          echo "SAFE_RUN_${GITHUB_RUN_ID}_STATUS_403=$S403"
          echo "SAFE_RUN_${GITHUB_RUN_ID}_STATUS_413=$S413"
          echo "SAFE_RUN_${GITHUB_RUN_ID}_STATUS_500=$S500"

          test "$TOTAL" -ge 1
