name: Temporary Comment Proof

on:
  push:
    branches:
      - feat/instagram-engagement-messaging

permissions:
  contents: read
  id-token: write

concurrency:
  group: tmp-comment-proof
  cancel-in-progress: false

env:
  PROJECT_ID: toca-mcp-production
  SERVICE: toca-meta-oauth-staging

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Identify sanitized constraint
        shell: bash
        run: |
          set -euo pipefail
          ERROR_FILTER='resource.type="cloud_run_revision" AND resource.labels.service_name="'"$SERVICE"'" AND textPayload:"HTTP request failed"'

          count_pattern() {
            local pattern="$1"
            gcloud logging read "$ERROR_FILTER AND textPayload:\"$pattern\"" \
              --project "$PROJECT_ID" --freshness=120m --limit=200 --format='value(insertId)' 2>/dev/null \
              | sed '/^$/d' | wc -l | tr -d ' '
          }

          OCCURRED_AT="$(count_pattern 'occurred_at')"
          NOT_NULL="$(count_pattern 'not-null')"
          CHANNEL="$(count_pattern 'channel')"
          EVENT_ID="$(count_pattern 'event_id')"
          AUDIT_EVENTS="$(count_pattern 'audit_events')"

          echo "SAFE_RUN_${GITHUB_RUN_ID}_OCCURRED_AT_MATCHES=$OCCURRED_AT"
          echo "SAFE_RUN_${GITHUB_RUN_ID}_NOT_NULL_MATCHES=$NOT_NULL"
          echo "SAFE_RUN_${GITHUB_RUN_ID}_CHANNEL_MATCHES=$CHANNEL"
          echo "SAFE_RUN_${GITHUB_RUN_ID}_EVENT_ID_MATCHES=$EVENT_ID"
          echo "SAFE_RUN_${GITHUB_RUN_ID}_AUDIT_EVENTS_MATCHES=$AUDIT_EVENTS"

          test "$OCCURRED_AT" -ge 1
