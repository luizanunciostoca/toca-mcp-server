name: Temporary Comment Proof

on:
  push:
    branches:
      - feat/instagram-engagement-messaging

permissions:
  contents: read
  id-token: write

concurrency:
  group: tmp-comment-proof
  cancel-in-progress: false

env:
  PROJECT_ID: toca-mcp-production
  SERVICE: toca-meta-oauth-staging

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Classify sanitized webhook errors
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_FILTER='resource.type="cloud_run_revision" AND resource.labels.service_name="'"$SERVICE"'" AND httpRequest.requestMethod="POST" AND httpRequest.requestUrl:"/webhooks/meta"'
          ERROR_FILTER='resource.type="cloud_run_revision" AND resource.labels.service_name="'"$SERVICE"'" AND textPayload:"HTTP request failed"'

          count_request() {
            local suffix="$1"
            gcloud logging read "$REQUEST_FILTER $suffix" --project "$PROJECT_ID" --freshness=90m --limit=200 --format='value(insertId)' 2>/dev/null \
              | sed '/^$/d' | wc -l | tr -d ' '
          }

          count_error_pattern() {
            local pattern="$1"
            gcloud logging read "$ERROR_FILTER AND textPayload:\"$pattern\"" --project "$PROJECT_ID" --freshness=90m --limit=200 --format='value(insertId)' 2>/dev/null \
              | sed '/^$/d' | wc -l | tr -d ' '
          }

          TOTAL="$(count_request '')"
          S200="$(count_request 'AND httpRequest.status=200')"
          S400="$(count_request 'AND httpRequest.status=400')"
          ERROR_TOTAL="$(gcloud logging read "$ERROR_FILTER" --project "$PROJECT_ID" --freshness=90m --limit=200 --format='value(insertId)' 2>/dev/null | sed '/^$/d' | wc -l | tr -d ' ')"
          EXPECTED="$(count_error_pattern 'expected')"
          ZOD="$(count_error_pattern 'Zod')"
          JSON_SYNTAX="$(count_error_pattern 'Unexpected')"
          VIOLATES="$(count_error_pattern 'violates')"
          INVALID_INPUT="$(count_error_pattern 'invalid input syntax')"
          DUPLICATE="$(count_error_pattern 'duplicate key')"
          ECONN="$(count_error_pattern 'ECONN')"
          DATABASE="$(count_error_pattern 'database')"

          echo "SAFE_RUN_${GITHUB_RUN_ID}_POST_TOTAL=$TOTAL"
          echo "SAFE_RUN_${GITHUB_RUN_ID}_STATUS_200=$S200"
          echo "SAFE_RUN_${GITHUB_RUN_ID}_STATUS_400=$S400"
          echo "SAFE_RUN_${GITHUB_RUN_ID}_HTTP_ERROR_TOTAL=$ERROR_TOTAL"
          echo "SAFE_RUN_${GITHUB_RUN_ID}_SCHEMA_EXPECTED_MATCHES=$EXPECTED"
          echo "SAFE_RUN_${GITHUB_RUN_ID}_ZOD_MATCHES=$ZOD"
          echo "SAFE_RUN_${GITHUB_RUN_ID}_JSON_SYNTAX_MATCHES=$JSON_SYNTAX"
          echo "SAFE_RUN_${GITHUB_RUN_ID}_DB_VIOLATION_MATCHES=$VIOLATES"
          echo "SAFE_RUN_${GITHUB_RUN_ID}_DB_INVALID_INPUT_MATCHES=$INVALID_INPUT"
          echo "SAFE_RUN_${GITHUB_RUN_ID}_DB_DUPLICATE_MATCHES=$DUPLICATE"
          echo "SAFE_RUN_${GITHUB_RUN_ID}_DB_CONNECTION_MATCHES=$ECONN"
          echo "SAFE_RUN_${GITHUB_RUN_ID}_DATABASE_WORD_MATCHES=$DATABASE"

          test "$TOTAL" -ge 1
