name: TEMP The Party Real Photo Reel V02 Diagnostics

on:
  push:
    branches:
      - ops/the-party-real-photo-reel-v02-20260904
    paths:
      - .github/workflows/_tmp-the-party-real-photo-reel-v02-diagnostics.yml

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  BUCKET: toca-mcp-publication-assets

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Authenticate deployer identity
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Recover any completed pre-failure Veo object
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered
          cat > /tmp/prefixes.tsv <<'EOF'
          S01_CROWD_PHONES	VID-TP-REALPHOTO-V02-20260904-S01_CROWD_PHONES	1186d894ecab2121
          S02_ENTRANCE	VID-TP-REALPHOTO-V02-20260904-S02_ENTRANCE	0270c47b88eb3aee
          S03_TOAST	VID-TP-REALPHOTO-V02-20260904-S03_TOAST	26a6f3f4449e327a
          S04_DJ	VID-TP-REALPHOTO-V02-20260904-S04_DJ	909bfb67ee14aad9
          S05_PORTRAIT	VID-TP-REALPHOTO-V02-20260904-S05_PORTRAIT	8fad8535951c0e02
          S06_FIRE	VID-TP-REALPHOTO-V02-20260904-S06_FIRE	6f7c67724f242fc3
          EOF
          : > recovered/inventory.tsv
          while IFS=$'\t' read -r id content sha16; do
            prefix="gs://${BUCKET}/video-generative/veo/${content}/${sha16}/"
            objects="$(gcloud storage ls "${prefix}**" 2>/dev/null || true)"
            count="$(printf '%s\n' "$objects" | sed '/^$/d' | wc -l | tr -d ' ')"
            printf '%s\t%s\t%s\n' "$id" "$count" "$prefix" >> recovered/inventory.tsv
            if [ "$count" -gt 0 ]; then
              obj="$(printf '%s\n' "$objects" | grep -E '\.(mp4|MP4)$' | head -n1 || true)"
              if [ -n "$obj" ]; then
                gcloud storage cp "$obj" "recovered/${id}.mp4" --quiet
                printf '%s  %s\n' "$(sha256sum "recovered/${id}.mp4" | awk '{print $1}')" "$id" >> recovered/recovered-sha256.txt
              fi
            fi
          done < /tmp/prefixes.tsv
          echo '--- VEO RECOVERY INVENTORY ---'
          cat recovered/inventory.tsv
          if [ -f recovered/recovered-sha256.txt ]; then cat recovered/recovered-sha256.txt; fi
          echo '--- END INVENTORY ---'

      - name: Upload recovery evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: the-party-real-photo-reel-v02-recovery
          path: recovered/
          if-no-files-found: error
          retention-days: 7
