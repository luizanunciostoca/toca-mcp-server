name: M-FOUND-06 Lint Fix

on:
  push:
    branches:
      - feat/m-found-06-durable-workflows

permissions:
  contents: write

jobs:
  lintfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for path in ['src/workflow/workflow-contracts.ts', 'src/persistence/postgres-workflow-store.ts']:
              p = Path(path)
              text = p.read_text()
              text = text.replace('readonly output: unknown | null;', 'readonly output: unknown;')
              text = text.replace('readonly completion: unknown | null;', 'readonly completion: unknown;')
              p.write_text(text)

          p = Path('src/workflow/in-memory-workflow-store.ts')
          text = p.read_text()
          methods = [
              'create',
              'completeStep',
              'failStep',
              'retryStep',
              'openHumanTask',
              'claimHumanTask',
              'completeHumanTask',
              'scheduleTimer',
              'registerCompensation',
              'activateCompensations',
          ]
          for method in methods:
              old = f'  async {method}('
              if text.count(old) != 1:
                  raise SystemExit(f'ASYNC_METHOD_ANCHOR_INVALID:{method}:{text.count(old)}')
              text = text.replace(old, f'  {method}(', 1)
          text = re.sub(r'return this\.#snapshot\(([^;]+)\);', r'return Promise.resolve(this.#snapshot(\1));', text)
          p.write_text(text)
          PY
      - name: Validate lint fixes
        run: |
          pnpm exec prettier --write \
            src/workflow/workflow-contracts.ts \
            src/workflow/in-memory-workflow-store.ts \
            src/persistence/postgres-workflow-store.ts
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test -- durable-workflow
      - name: Remove temporary workflow and commit validated fixes
        run: |
          rm .github/workflows/m-found-06-lintfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: normalize durable workflow lint contracts"
      - name: Push validated lint fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:feat/m-found-06-durable-workflows"
