name: R29 Fix Repurpose Type Once

on:
  push:
    branches: [feat/r29-video-reconciliation-final]
    paths:
      - scripts/r29-fix-repurpose-type.mjs
      - .github/workflows/r29-fix-repurpose-type-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/r29-video-reconciliation-final
          fetch-depth: 0
      - name: Apply repurpose type fix
        run: node scripts/r29-fix-repurpose-type.mjs
      - name: Remove one-shot assets
        run: rm scripts/r29-fix-repurpose-type.mjs .github/workflows/r29-fix-repurpose-type-once.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(r29): require variant key for repurpose destinations"
          git push origin HEAD:feat/r29-video-reconciliation-final
