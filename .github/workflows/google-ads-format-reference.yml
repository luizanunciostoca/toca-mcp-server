name: Google Ads Format Reference

on:
  pull_request:
    paths:
      - 'src/google-ads-provider-read-smoke.ts'
      - '.github/workflows/google-ads-format-reference.yml'

permissions:
  contents: read

jobs:
  format-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Render exact Prettier output
        run: pnpm exec prettier src/google-ads-provider-read-smoke.ts > /tmp/google-ads-provider-read-smoke.ts
      - name: Upload formatter reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: google-ads-format-reference-${{ github.sha }}
          path: /tmp/google-ads-provider-read-smoke.ts
          if-no-files-found: error
          retention-days: 1
