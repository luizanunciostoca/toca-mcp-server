name: Instagram GCP Publication Recovery Preflight

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/instagram-gcp-publication-recovery-preflight.yml'
      - 'infra/control-plane/instagram-gcp-publication-recovery-policy.json'

permissions:
  contents: read
  id-token: write

concurrency:
  group: instagram-gcp-publication-recovery-preflight
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_PROJECT_NUMBER: '990081828836'
  GCP_REGION: southamerica-east1
  GCP_ARTIFACT_REPOSITORY: toca-mcp
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_INFRA_ADMIN_SERVICE_ACCOUNT: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  TOKEN_SECRET_ID: toca-meta-oauth-token
  APP_SECRET_ID: toca-meta-app-secret
  DATABASE_SECRET_ID: toca-database-url
  PUBLICATION_ASSET_BUCKET: toca-mcp-publication-assets
  META_GRAPH_API_VERSION: v24.0
  META_PAGE_ID: '306103746115875'
  INSTAGRAM_ACCOUNT_ID: '17841402033495654'
  DRIVE_FILE_ID: 1uFK4y1fqUHi-m4qn6m-TB-ehBC0Y7JOK
  EXPECTED_ASSET_SHA256: a495fa29db54dc2af24700b0556e8a6d1fb01472c333067c91ee6d613525e4e6

jobs:
  repair-bindings:
    runs-on: ubuntu-latest
    environment: infrastructure-admin
    timeout-minutes: 15
    steps:
      - name: Checkout exact protected main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Guard repository and scoped recovery policy
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REPOSITORY" = 'luizanunciostoca/toca-mcp-server'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          POLICY=infra/control-plane/instagram-gcp-publication-recovery-policy.json
          jq -e \
            --arg project "$GCP_PROJECT_ID" \
            --arg region "$GCP_REGION" \
            --arg infra "$GCP_INFRA_ADMIN_SERVICE_ACCOUNT" \
            --arg deploy "$GCP_DEPLOY_SERVICE_ACCOUNT" \
            --arg runtime "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --arg ig "$INSTAGRAM_ACCOUNT_ID" \
            --arg drive "$DRIVE_FILE_ID" \
            --arg asset "$EXPECTED_ASSET_SHA256" '
              .schemaVersion == 1 and
              .status == "AUTHORIZED_RECOVERY" and
              .projectId == $project and
              .region == $region and
              .infrastructureAdminServiceAccount == $infra and
              .deployServiceAccount == $deploy and
              .runtimeServiceAccount == $runtime and
              .preflight.providerReadOnly == true and
              .preflight.instagramAccountId == $ig and
              .preflight.driveFileId == $drive and
              .preflight.expectedAssetSha256 == $asset and
              .bindings.runtimeSecretRole == "roles/secretmanager.secretAccessor" and
              .bindings.deployerRuntimeRole == "roles/iam.serviceAccountUser" and
              .bindings.deployerArtifactRepositoryRole == "roles/artifactregistry.writer" and
              .forbidden.projectOwner == true and
              .forbidden.projectEditor == true and
              .forbidden.serviceAccountKeys == true and
              .forbidden.providerWriteDuringRecovery == true and
              .forbidden.secretValueLogging == true and
              .forbidden.publicBucketIam == true and
              .forbidden.schedulerMutation == true and
              .forbidden.cloudSqlMutation == true and
              .forbidden.billingMutation == true
            ' "$POLICY" >/dev/null

      - name: Authenticate infrastructure administrator
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_INFRA_ADMIN_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Reconcile only allowlisted APIs and IAM bindings
        shell: bash
        run: |
          set -euo pipefail
          POLICY=infra/control-plane/instagram-gcp-publication-recovery-policy.json
          mapfile -t apis < <(jq -r '.requiredApis[]' "$POLICY")
          gcloud services enable "${apis[@]}" --project "$GCP_PROJECT_ID" --quiet

          runtime_member="serviceAccount:${GCP_RUNTIME_SERVICE_ACCOUNT}"
          deploy_member="serviceAccount:${GCP_DEPLOY_SERVICE_ACCOUNT}"

          for secret in "$TOKEN_SECRET_ID" "$APP_SECRET_ID" "$DATABASE_SECRET_ID"; do
            gcloud secrets add-iam-policy-binding "$secret" \
              --project "$GCP_PROJECT_ID" \
              --member "$runtime_member" \
              --role roles/secretmanager.secretAccessor \
              --condition=None \
              --quiet >/dev/null
          done

          gcloud iam service-accounts add-iam-policy-binding "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --project "$GCP_PROJECT_ID" \
            --member "$deploy_member" \
            --role roles/iam.serviceAccountUser \
            --condition=None \
            --quiet >/dev/null

          for role in roles/run.developer roles/logging.viewer; do
            gcloud projects add-iam-policy-binding "$GCP_PROJECT_ID" \
              --member "$deploy_member" \
              --role "$role" \
              --condition=None \
              --quiet >/dev/null
          done

          gcloud artifacts repositories add-iam-policy-binding "$GCP_ARTIFACT_REPOSITORY" \
            --project "$GCP_PROJECT_ID" \
            --location "$GCP_REGION" \
            --member "$deploy_member" \
            --role roles/artifactregistry.writer \
            --condition=None \
            --quiet >/dev/null

          gcloud projects add-iam-policy-binding "$GCP_PROJECT_ID" \
            --member "$runtime_member" \
            --role roles/cloudsql.client \
            --condition=None \
            --quiet >/dev/null

          for role in roles/storage.objectCreator roles/storage.objectViewer; do
            gcloud storage buckets add-iam-policy-binding "gs://${PUBLICATION_ASSET_BUCKET}" \
              --project "$GCP_PROJECT_ID" \
              --member "$runtime_member" \
              --role "$role" >/dev/null
          done

      - name: Verify bindings and API state without reading secret values
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gcp-recovery-evidence
          runtime_member="serviceAccount:${GCP_RUNTIME_SERVICE_ACCOUNT}"
          deploy_member="serviceAccount:${GCP_DEPLOY_SERVICE_ACCOUNT}"

          for api in artifactregistry.googleapis.com run.googleapis.com secretmanager.googleapis.com iamcredentials.googleapis.com sqladmin.googleapis.com logging.googleapis.com; do
            state="$(gcloud services list --enabled --project "$GCP_PROJECT_ID" --filter="config.name=${api}" --format='value(config.name)')"
            test "$state" = "$api"
          done

          for secret in "$TOKEN_SECRET_ID" "$APP_SECRET_ID" "$DATABASE_SECRET_ID"; do
            policy="$(gcloud secrets get-iam-policy "$secret" --project "$GCP_PROJECT_ID" --format=json)"
            jq -e --arg member "$runtime_member" 'any(.bindings[]?; .role == "roles/secretmanager.secretAccessor" and any(.members[]?; . == $member))' <<<"$policy" >/dev/null
          done

          runtime_sa_policy="$(gcloud iam service-accounts get-iam-policy "$GCP_RUNTIME_SERVICE_ACCOUNT" --project "$GCP_PROJECT_ID" --format=json)"
          jq -e --arg member "$deploy_member" 'any(.bindings[]?; .role == "roles/iam.serviceAccountUser" and any(.members[]?; . == $member))' <<<"$runtime_sa_policy" >/dev/null

          project_policy="$(gcloud projects get-iam-policy "$GCP_PROJECT_ID" --format=json)"
          for role in roles/run.developer roles/logging.viewer; do
            jq -e --arg role "$role" --arg member "$deploy_member" 'any(.bindings[]?; .role == $role and any(.members[]?; . == $member))' <<<"$project_policy" >/dev/null
          done
          jq -e --arg member "$runtime_member" 'any(.bindings[]?; .role == "roles/cloudsql.client" and any(.members[]?; . == $member))' <<<"$project_policy" >/dev/null

          ar_policy="$(gcloud artifacts repositories get-iam-policy "$GCP_ARTIFACT_REPOSITORY" --project "$GCP_PROJECT_ID" --location "$GCP_REGION" --format=json)"
          jq -e --arg member "$deploy_member" 'any(.bindings[]?; .role == "roles/artifactregistry.writer" and any(.members[]?; . == $member))' <<<"$ar_policy" >/dev/null

          bucket_policy="$(gcloud storage buckets get-iam-policy "gs://${PUBLICATION_ASSET_BUCKET}" --project "$GCP_PROJECT_ID" --format=json)"
          for role in roles/storage.objectCreator roles/storage.objectViewer; do
            jq -e --arg role "$role" --arg member "$runtime_member" 'any(.bindings[]?; .role == $role and any(.members[]?; . == $member))' <<<"$bucket_policy" >/dev/null
          done
          jq -e 'all(.bindings[]?.members[]?; . != "allUsers" and . != "allAuthenticatedUsers")' <<<"$bucket_policy" >/dev/null

          jq -n \
            --arg sourceSha "$GITHUB_SHA" \
            --arg project "$GCP_PROJECT_ID" \
            --arg region "$GCP_REGION" \
            --arg runtime "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --arg deploy "$GCP_DEPLOY_SERVICE_ACCOUNT" \
            '{schemaVersion:1,sourceSha:$sourceSha,projectId:$project,region:$region,runtimeServiceAccount:$runtime,deployServiceAccount:$deploy,requiredApisEnabled:true,secretBindingsVerified:true,runtimeImpersonationBindingVerified:true,cloudRunDeployBindingVerified:true,artifactRegistryBindingVerified:true,cloudSqlBindingVerified:true,assetBucketBindingsVerified:true,publicBucketAccess:false,result:"PASS"}' \
            > gcp-recovery-evidence/iam-repair.json
          echo 'GCP_PUBLICATION_IAM_REPAIR=VERIFIED'

      - name: Upload sanitized IAM recovery evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instagram-gcp-iam-recovery-${{ github.run_id }}
          path: gcp-recovery-evidence/iam-repair.json
          if-no-files-found: error
          retention-days: 90

  provider-read-preflight:
    needs: repair-bindings
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Checkout exact protected main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Guard provider-read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REPOSITORY" = 'luizanunciostoca/toca-mcp-server'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          jq -e '.status == "AUTHORIZED_RECOVERY" and .preflight.providerReadOnly == true and .forbidden.providerWriteDuringRecovery == true' infra/control-plane/instagram-gcp-publication-recovery-policy.json >/dev/null

      - name: Authenticate production deployer and Drive read-only
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/drive.readonly

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Bind exact approved Drive asset without mutation
        shell: bash
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          mkdir -p gcp-recovery-evidence
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GOOGLE_ACCESS_TOKEN}" \
            "https://www.googleapis.com/drive/v3/files/${DRIVE_FILE_ID}?alt=media" \
            --output gcp-recovery-evidence/asset.jpg
          test -s gcp-recovery-evidence/asset.jpg
          test "$(file --brief --mime-type gcp-recovery-evidence/asset.jpg)" = 'image/jpeg'
          actual="$(sha256sum gcp-recovery-evidence/asset.jpg | awk '{print $1}')"
          test "$actual" = "$EXPECTED_ASSET_SHA256"
          echo "APPROVED_ASSET_SHA256=$actual" >> "$GITHUB_ENV"

      - name: Build and push immutable read-only preflight image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          mkdir -p /tmp/instagram-gcp-provider-read
          cat > /tmp/instagram-gcp-provider-read/read.mjs <<'NODE'
          const token = process.env.META_ACCESS_TOKEN;
          const appSecret = process.env.META_APP_SECRET;
          const databaseUrl = process.env.DATABASE_URL;
          const apiVersion = process.env.META_GRAPH_API_VERSION;
          const pageId = process.env.META_PAGE_ID;
          const instagramAccountId = process.env.INSTAGRAM_ACCOUNT_ID;
          const sourceSha = process.env.SOURCE_SHA;
          if (!token || !appSecret || !databaseUrl || !apiVersion || !pageId || !instagramAccountId || !sourceSha) {
            throw new Error('GCP_PUBLICATION_PREFLIGHT_RUNTIME_CONFIG_MISSING');
          }
          if (typeof fetch !== 'function') throw new Error('GCP_PUBLICATION_PREFLIGHT_FETCH_UNAVAILABLE');

          async function graph(path) {
            const response = await fetch(`https://graph.facebook.com/${apiVersion}/${path}`, {
              method: 'GET',
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
            });
            const body = await response.json();
            if (!response.ok) {
              const code = Number.isInteger(body?.error?.code) ? body.error.code : 0;
              const subcode = Number.isInteger(body?.error?.error_subcode) ? body.error.error_subcode : 0;
              throw new Error(`GCP_PUBLICATION_PREFLIGHT_META_READ_HTTP_${response.status}_CODE_${code}_SUBCODE_${subcode}`);
            }
            return body;
          }

          const permissions = await graph('me/permissions');
          const granted = new Set((Array.isArray(permissions.data) ? permissions.data : [])
            .filter((item) => item?.status === 'granted' && typeof item.permission === 'string')
            .map((item) => item.permission));
          const required = ['instagram_basic', 'instagram_content_publish', 'pages_show_list', 'pages_read_engagement'];
          for (const scope of required) {
            if (!granted.has(scope)) throw new Error(`GCP_PUBLICATION_PREFLIGHT_SCOPE_MISSING_${scope}`);
          }

          const pages = await graph('me/accounts?fields=id,instagram_business_account&limit=100');
          const page = (Array.isArray(pages.data) ? pages.data : []).find((item) => item?.id === pageId);
          if (!page) throw new Error('GCP_PUBLICATION_PREFLIGHT_TARGET_PAGE_NOT_MANAGED');
          if (page?.instagram_business_account?.id !== instagramAccountId) {
            throw new Error('GCP_PUBLICATION_PREFLIGHT_INSTAGRAM_ACCOUNT_BINDING_MISMATCH');
          }

          const profile = await graph(`${instagramAccountId}?fields=id,username,media_count`);
          if (profile.id !== instagramAccountId) throw new Error('GCP_PUBLICATION_PREFLIGHT_INSTAGRAM_ID_MISMATCH');
          if (profile.username !== 'tocadomorcego') throw new Error('GCP_PUBLICATION_PREFLIGHT_USERNAME_MISMATCH');
          const media = await graph(`${instagramAccountId}/media?fields=id,media_type,timestamp&limit=3`);
          if (!Array.isArray(media.data)) throw new Error('GCP_PUBLICATION_PREFLIGHT_MEDIA_SHAPE_INVALID');

          console.log(`GCP_PUBLICATION_PROVIDER_READ_RESULT=${JSON.stringify({
            schemaVersion: 1,
            sourceSha,
            instagramAccountId,
            pageId,
            username: profile.username,
            mediaCount: profile.media_count,
            requiredScopes: required,
            runtimeSecretsPresent: true,
            providerReadOnly: true,
            recentMediaIds: media.data.map((item) => item?.id).filter((id) => typeof id === 'string'),
            verifiedAt: new Date().toISOString(),
            result: 'PASS',
          })}`);
          NODE
          cat > /tmp/instagram-gcp-provider-read/Dockerfile <<'DOCKER'
          FROM node:24-bookworm-slim
          WORKDIR /app
          COPY read.mjs ./read.mjs
          USER node
          CMD ["node", "read.mjs"]
          DOCKER
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/instagram-gcp-publication-preflight:${GITHUB_SHA}"
          docker build -t "$IMAGE" /tmp/instagram-gcp-provider-read
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "JOB_NAME=toca-instagram-pub-preflight-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Execute Cloud Run under production runtime identity with provider writes impossible
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            gcloud run jobs delete "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          gcloud run jobs deploy "$JOB_NAME" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars "META_GRAPH_API_VERSION=$META_GRAPH_API_VERSION,META_PAGE_ID=$META_PAGE_ID,INSTAGRAM_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID,SOURCE_SHA=$GITHUB_SHA" \
            --set-secrets "META_ACCESS_TOKEN=$TOKEN_SECRET_ID:latest,META_APP_SECRET=$APP_SECRET_ID:1,DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 120s \
            --quiet
          gcloud run jobs execute "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet

          result_line=''
          for _ in $(seq 1 18); do
            result_line="$(gcloud logging read \
              "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME} AND textPayload:\"GCP_PUBLICATION_PROVIDER_READ_RESULT=\"" \
              --project "$GCP_PROJECT_ID" \
              --freshness=20m \
              --limit=20 \
              --order=desc \
              --format='value(textPayload)' | grep 'GCP_PUBLICATION_PROVIDER_READ_RESULT=' | head -n1 || true)"
            [ -n "$result_line" ] && break
            sleep 5
          done
          test -n "$result_line"
          result_json="${result_line#GCP_PUBLICATION_PROVIDER_READ_RESULT=}"
          printf '%s\n' "$result_json" | jq -e \
            --arg sha "$GITHUB_SHA" \
            --arg page "$META_PAGE_ID" \
            --arg ig "$INSTAGRAM_ACCOUNT_ID" '
              .schemaVersion == 1 and
              .sourceSha == $sha and
              .pageId == $page and
              .instagramAccountId == $ig and
              .username == "tocadomorcego" and
              .runtimeSecretsPresent == true and
              .providerReadOnly == true and
              .result == "PASS" and
              (.requiredScopes | index("instagram_content_publish") != null)
            ' >/dev/null
          printf '%s\n' "$result_json" | jq . > gcp-recovery-evidence/provider-read.json
          jq -n \
            --arg sourceSha "$GITHUB_SHA" \
            --arg assetSha "$APPROVED_ASSET_SHA256" \
            --arg driveFileId "$DRIVE_FILE_ID" \
            '{schemaVersion:1,sourceSha:$sourceSha,driveFileId:$driveFileId,assetSha256:$assetSha,mimeType:"image/jpeg",result:"PASS"}' \
            > gcp-recovery-evidence/drive-asset.json
          rm -f gcp-recovery-evidence/asset.jpg
          echo 'GCP_PUBLICATION_PROVIDER_READ_PREFLIGHT=VERIFIED'

      - name: Upload sanitized provider-read evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instagram-gcp-provider-read-${{ github.run_id }}
          path: |
            gcp-recovery-evidence/provider-read.json
            gcp-recovery-evidence/drive-asset.json
          if-no-files-found: error
          retention-days: 90
