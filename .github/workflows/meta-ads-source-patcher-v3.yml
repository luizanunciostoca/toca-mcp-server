name: Meta Ads Source Patcher v3

on:
  push:
    branches:
      - fix/meta-ads-final-settlement-window-v3

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply source-only bounded settlement fix
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='src/meta-ads-create-paused-smoke.ts'
          test "$(grep -c 'const maxAttempts = 12;' "$SOURCE")" -eq 1
          sed -i 's/const maxAttempts = 12;/const maxAttempts = 20;/' "$SOURCE"
          test "$(grep -c 'const maxAttempts = 20;' "$SOURCE")" -eq 1
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SOURCE"
          git commit -m 'fix(meta-ads): extend bounded provider settlement window'
          git push origin HEAD:fix/meta-ads-final-settlement-window-v3
