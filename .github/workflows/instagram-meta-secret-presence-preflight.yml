name: Instagram Meta Secret Presence Preflight

on:
  push:
    branches:
      - ops/meta-secret-presence-preflight-20260915
    paths:
      - .github/workflows/instagram-meta-secret-presence-preflight.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify Meta secret is configured without exposing it
        shell: bash
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${META_ACCESS_TOKEN:-}" ]; then
            echo 'META_ACCESS_TOKEN_MISSING'
            exit 1
          fi
          echo 'META_ACCESS_TOKEN_PRESENT'
