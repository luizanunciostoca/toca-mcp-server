name: Instagram Meta Secret Presence Preflight

on:
  push:
    branches:
      - ops/meta-secret-presence-preflight-20260915
    paths:
      - .github/workflows/instagram-meta-secret-presence-preflight.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify repository secret injection without exposing values
        shell: bash
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          STAGING_ALERT_EMAIL: ${{ secrets.STAGING_ALERT_EMAIL }}
        run: |
          set -euo pipefail
          meta=missing
          staging=missing
          [ -n "${META_ACCESS_TOKEN:-}" ] && meta=present
          [ -n "${STAGING_ALERT_EMAIL:-}" ] && staging=present
          echo "META_ACCESS_TOKEN_${meta^^}"
          echo "STAGING_ALERT_EMAIL_${staging^^}"
          if [ "$meta" != present ]; then
            exit 1
          fi

# presence-only diagnostic; values are never printed
