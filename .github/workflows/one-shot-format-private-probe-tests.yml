name: One-shot format private probe tests

on:
  push:
    branches: [fix/production-private-candidate-acceptance-20260826]

permissions:
  contents: write

jobs:
  format:
    if: github.actor == 'luizanunciostoca'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/production-private-candidate-acceptance-20260826
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Format affected tests
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            test/gcp-production-internal-probe-contract.test.ts \
            test/gcp-production-probe-rollback-contract.test.ts \
            test/gcp-deploy-cloud-run-probes.test.ts
          git diff --check
          if git diff --quiet -- \
            test/gcp-production-internal-probe-contract.test.ts \
            test/gcp-production-probe-rollback-contract.test.ts \
            test/gcp-deploy-cloud-run-probes.test.ts; then
            echo 'No formatting changes required'
            exit 0
          fi
          git config user.name "TOCA OS Automation"
          git config user.email "actions@github.com"
          git add \
            test/gcp-production-internal-probe-contract.test.ts \
            test/gcp-production-probe-rollback-contract.test.ts \
            test/gcp-deploy-cloud-run-probes.test.ts
          git commit -m "style(test): format private probe contracts"
          git push origin HEAD:fix/production-private-candidate-acceptance-20260826
