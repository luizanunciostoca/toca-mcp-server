name: Temporary Marketing Autopilot Formatter

on:
  push:
    branches:
      - codex/marketing-autopilot-closed-loop

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format closed-loop files
        run: pnpm exec prettier --write src/learning/marketing-autopilot-closed-loop.ts src/worker/marketing-autopilot-closed-loop-composition.ts test/marketing-autopilot-closed-loop.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/learning/marketing-autopilot-closed-loop.ts src/worker/marketing-autopilot-closed-loop-composition.ts test/marketing-autopilot-closed-loop.test.ts
          git commit -m "style(marketing): format closed-loop implementation"
          git push origin HEAD:codex/marketing-autopilot-closed-loop
