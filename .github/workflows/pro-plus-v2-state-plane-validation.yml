name: PRO+ v2 State Plane Validation

on:
  issues:
    types: [opened, edited, closed, reopened]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: pro-plus-v2-state-plane-validation
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
        (github.event.issue.number == 639 || github.event.issue.number == 640 || github.event.issue.number == 641 || github.event.issue.number == 642)) ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 641)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact default-branch control-plane validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Fetch sanitized mutable state plane
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for issue in 639 640 641 642; do
            gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}" > "$RUNNER_TEMP/pro-plus-v2-${issue}.json"
          done
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/641/comments?per_page=100" \
            | jq '[.[][]]' > "$RUNNER_TEMP/pro-plus-v2-641-comments.json"

      - name: Validate PRO+ v2 state plane
        env:
          EXPECTED_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-pro-plus-v2-state-plane.mjs \
            "$RUNNER_TEMP/pro-plus-v2-639.json" \
            "$RUNNER_TEMP/pro-plus-v2-640.json" \
            "$RUNNER_TEMP/pro-plus-v2-641.json" \
            "$RUNNER_TEMP/pro-plus-v2-642.json" \
            "$RUNNER_TEMP/pro-plus-v2-641-comments.json"