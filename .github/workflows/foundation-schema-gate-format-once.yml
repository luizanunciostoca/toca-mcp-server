name: Foundation Schema Gate Format One-Shot

on:
  push:
    branches: [fix/foundation-production-schema-gate]
    paths: ['.github/workflows/foundation-schema-gate-format-once.yml']

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/foundation-production-schema-gate
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and validate verifier
        run: |
          pnpm exec prettier --write scripts/migrate-and-verify.ts
          pnpm exec prettier --check scripts/migrate-and-verify.ts
      - name: Commit formatter result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/migrate-and-verify.ts
          git diff --cached --quiet && exit 0
          git commit -m 'style(reliability): format production migration verifier'
          git push origin HEAD:fix/foundation-production-schema-gate
