name: Format Diagnostic

on:
  push:
    branches:
      - feat/instagram-engagement-messaging
    paths:
      - .github/workflows/format-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write src/providers/meta/meta-webhook.ts test/meta-webhook.test.ts
          git diff -- src/providers/meta/meta-webhook.ts test/meta-webhook.test.ts
