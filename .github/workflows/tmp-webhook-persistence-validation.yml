name: Temporary Webhook Persistence Validation

on:
  push:
    branches:
      - feat/instagram-engagement-messaging

permissions:
  contents: read
  id-token: write

concurrency:
  group: tmp-webhook-persistence-validation
  cancel-in-progress: false

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  DATABASE_SECRET_ID: toca-database-url
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  JOB: toca-webhook-persistence-validate

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build persistence validation image
        shell: bash
        run: |
          set -euo pipefail
          cat > Dockerfile.persistence-validation <<'DOCKER'
          FROM node:24-bookworm-slim
          WORKDIR /app
          RUN corepack enable && corepack prepare pnpm@10.15.0 --activate
          COPY package.json pnpm-lock.yaml ./
          RUN pnpm install --frozen-lockfile
          COPY tsconfig.json ./
          COPY src ./src
          COPY scripts ./scripts
          COPY migrations ./migrations
          COPY .github/tmp/validate-webhook-persistence.ts ./validate-webhook-persistence.ts
          USER node
          CMD ["sh", "-c", "pnpm migrate && pnpm exec tsx validate-webhook-persistence.ts"]
          DOCKER

          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/webhook-persistence-validate:${GITHUB_SHA}"
          docker build -f Dockerfile.persistence-validation -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Run migrations and persistent idempotency proof
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            gcloud run jobs delete "$JOB" --project "$PROJECT_ID" --region "$REGION" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          gcloud run jobs deploy "$JOB" \
            --image "$IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --set-env-vars "DATABASE_SSL=false,VALIDATION_RUN_ID=$GITHUB_RUN_ID" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --max-retries 0 \
            --task-timeout 180s \
            --quiet

          set +e
          gcloud run jobs execute "$JOB" --project "$PROJECT_ID" --region "$REGION" --wait --quiet
          STATUS=$?
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo 'Persistence validation failed. Sanitized marker follows:' >&2
            for ATTEMPT in 1 2 3 4 5; do
              MARKER="$(gcloud logging read \
                "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$JOB\" AND textPayload:\"PERSISTENCE_RUN_${GITHUB_RUN_ID}_\"" \
                --project "$PROJECT_ID" --freshness=10m --limit=20 --format='value(textPayload)' 2>/dev/null \
                | grep -E "^PERSISTENCE_RUN_${GITHUB_RUN_ID}_[A-Z0-9_]+$" | head -n 1 || true)"
              if [ -n "$MARKER" ]; then
                echo "$MARKER"
                break
              fi
              sleep 2
            done
            exit "$STATUS"
          fi

          echo 'Persistent webhook idempotency and audit validation completed successfully.'
