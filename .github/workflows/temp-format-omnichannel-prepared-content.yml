name: Temporary Omnichannel Formatter

on:
  push:
    branches:
      - feat/omnichannel-prepared-content-20260821

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and remove temporary workflow
        run: |
          pnpm exec prettier --write \
            src/omnichannel/prepared-content-resolvers.ts \
            src/omnichannel/prepared-content.ts \
            src/persistence/postgres-omnichannel-prepared-content-store.ts
          git rm .github/workflows/temp-format-omnichannel-prepared-content.yml
          git config user.name "toca-ci"
          git config user.email "toca-ci@users.noreply.github.com"
          git add src/omnichannel/prepared-content-resolvers.ts \
                  src/omnichannel/prepared-content.ts \
                  src/persistence/postgres-omnichannel-prepared-content-store.ts
          git commit -m "style(omnichannel): format prepared content authority"
          git push origin HEAD:feat/omnichannel-prepared-content-20260821
