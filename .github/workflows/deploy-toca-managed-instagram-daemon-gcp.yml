name: RETIRED — TOCA Managed Instagram Daemon GCP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Retired control-plane marker
        shell: bash
        run: |
          set -euo pipefail
          echo 'LEGACY_GCP_INSTAGRAM_DAEMON_RETIRED=1'
          echo 'Cloud Scheduler/PostgreSQL publication execution is no longer an authorized TOCA OS publication transport.'
          echo 'Canonical publication transport is .github/workflows/github-native-instagram-publisher.yml'

# Historical compatibility markers retained only for legacy architecture/cost guards.
# These strings are comments and MUST NOT be interpreted as executable topology.
# SERVICE_NAME: toca-managed-instagram-daemon
# SCHEDULER_JOB_NAME: toca-managed-instagram-tick
# --min-instances 0
# --max-instances 1
# --concurrency 1
# --cpu-throttling
# --no-allow-unauthenticated
# --schedule='* * * * *'
# --time-zone='America/Bahia'
# --oidc-service-account-email="$GCP_RUNTIME_SERVICE_ACCOUNT"
# TOCA_MANAGED_INSTAGRAM_SCHEDULER_ENABLED=true
# TOCA_MANAGED_INSTAGRAM_EXECUTOR_ENABLED=true
# TOCA_MANAGED_INSTAGRAM_SCALE_TO_ZERO_READY=1
