name: Google Ads R28 Reconcile Once

on:
  push:
    branches: [reconcile/r28-google-ads-current-main]
    paths: ['.github/workflows/google-ads-r28-reconcile-once.yml']

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Reconcile legacy R28 delta into current core facade
        shell: bash
        run: |
          set -euo pipefail
          BASE='81f6f84df6b725bfc5994c2d1582241b7936c614'
          LEGACY_BASE='b0d067e9cc6b469fdb1421ab7a25a25a3b0f1f47'
          LEGACY_HEAD='87a9798481b72ebe9eeb144ca9d2458da033d452'
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(git diff --name-only "$BASE" HEAD)" = '.github/workflows/google-ads-r28-reconcile-once.yml'
          git fetch origin "$LEGACY_BASE" "$LEGACY_HEAD"

          # Reuse the already-audited R28 contract changes where the current files
          # have not changed semantically. Server/public MCP wiring is intentionally
          # excluded because M-FOUND-11 replaced that architecture with TOCA Core.
          git diff --binary "$LEGACY_BASE" "$LEGACY_HEAD" -- \
            docs/architecture/routes-capabilities-v1.md \
            src/config.ts \
            src/governance/capability-catalog.ts \
            src/governance/capability-ids.ts \
            src/registry.ts \
            test/config.test.ts \
            test/governance-catalog.test.ts \
            > /tmp/shared.patch
          git apply --3way --index /tmp/shared.patch

          for path in \
            docs/architecture/r28-google-ads-paid-media.md \
            src/providers/google-ads/google-ads-api-client.ts \
            src/providers/google-ads/google-ads-paid-media.ts \
            src/providers/google-ads/google-ads-phase.ts \
            test/google-ads-api-client.test.ts \
            test/google-ads-create-idempotency.test.ts \
            test/google-ads-paid-media.test.ts
          do
            mkdir -p "$(dirname "$path")"
            git show "$LEGACY_HEAD:$path" > "$path"
            git add "$path"
          done

          python - <<'PY'
          from pathlib import Path

          # Current server: construct Google Ads provider but expose it only through
          # the small TOCA Core facade/runtime resolver, never as 13 direct MCP tools.
          path = Path('src/server.ts')
          text = path.read_text()
          anchor = "import { PostgresWorkflowStore } from './persistence/postgres-workflow-store.js';\n"
          insert = anchor + "import { GoogleAdsRestApiClient } from './providers/google-ads/google-ads-api-client.js';\nimport { GoogleAdsPaidMediaProvider } from './providers/google-ads/google-ads-paid-media.js';\n"
          if anchor not in text:
              raise SystemExit('server import anchor missing')
          text = text.replace(anchor, insert, 1)

          old_registry = """    metaAdsReadsEnabled: config.META_ADS_READ_ENABLED,\n    metaAdsWritesEnabled: config.META_ADS_WRITE_ENABLED,\n    tocaManagedInstagramSchedulerEnabled: config.TOCA_MANAGED_INSTAGRAM_SCHEDULER_ENABLED,\n"""
          new_registry = """    metaAdsReadsEnabled: config.META_ADS_READ_ENABLED,\n    metaAdsWritesEnabled: config.META_ADS_WRITE_ENABLED,\n    googleAdsPhase: config.GOOGLE_ADS_PHASE,\n    tocaManagedInstagramSchedulerEnabled: config.TOCA_MANAGED_INSTAGRAM_SCHEDULER_ENABLED,\n"""
          if old_registry not in text:
              raise SystemExit('server registry anchor missing')
          text = text.replace(old_registry, new_registry, 1)

          runtime_anchor = """  const runtimeResolver = createRuntimeCapabilityResolver({\n    ...(instagramHistory ? { instagramHistory } : {}),\n"""
          provider_block = """  let googleAds: GoogleAdsPaidMediaProvider | undefined;\n  if (config.GOOGLE_ADS_PHASE !== 'OFF') {\n    const {\n      GOOGLE_ADS_CUSTOMER_ID: customerId,\n      GOOGLE_ADS_LOGIN_CUSTOMER_ID: loginCustomerId,\n      GOOGLE_ADS_ACCESS_TOKEN_ENV_KEY: accessTokenEnvKey,\n      GOOGLE_ADS_DEVELOPER_TOKEN_ENV_KEY: developerTokenEnvKey,\n      GOOGLE_ADS_ALLOWED_CUSTOMER_ID: allowedCustomerId,\n      GOOGLE_ADS_ALLOWED_CURRENCY: allowedCurrency,\n      GOOGLE_ADS_MAX_DAILY_BUDGET_MICROS: maxDailyBudgetMicros,\n      GOOGLE_ADS_CURRENCY_MINOR_UNIT_MICROS: currencyMinorUnitMicros,\n      GOOGLE_ADS_ALLOWED_LOCATION_CRITERION_IDS: allowedLocationIdsRaw,\n      GOOGLE_ADS_ALLOWED_LANGUAGE_CRITERION_IDS: allowedLanguageIdsRaw,\n    } = config;\n    if (\n      !customerId ||\n      !accessTokenEnvKey ||\n      !developerTokenEnvKey ||\n      !allowedCustomerId ||\n      !allowedCurrency ||\n      !maxDailyBudgetMicros ||\n      !currencyMinorUnitMicros ||\n      !allowedLocationIdsRaw\n    ) {\n      throw new Error('GOOGLE_ADS_RUNTIME_GUARDRAILS_REQUIRED');\n    }\n    const api = new GoogleAdsRestApiClient(\n      {\n        apiVersion: config.GOOGLE_ADS_API_VERSION,\n        customerId,\n        ...(loginCustomerId ? { loginCustomerId } : {}),\n        accessTokenRef: { provider: 'env', key: accessTokenEnvKey },\n        developerTokenRef: { provider: 'env', key: developerTokenEnvKey },\n      },\n      secrets,\n    );\n    googleAds = new GoogleAdsPaidMediaProvider(api, {\n      allowedCustomerId,\n      allowedCurrency,\n      maxDailyBudgetMicros,\n      currencyMinorUnitMicros,\n      allowedLocationCriterionIds: csvValues(allowedLocationIdsRaw),\n      ...(allowedLanguageIdsRaw\n        ? { allowedLanguageCriterionIds: csvValues(allowedLanguageIdsRaw) }\n        : {}),\n      allowedAdvertisingChannelTypes: ['SEARCH'],\n    });\n  }\n\n"""
          if runtime_anchor not in text:
              raise SystemExit('server runtime anchor missing')
          text = text.replace(runtime_anchor, provider_block + runtime_anchor, 1)
          text = text.replace(
              "    ...(metaAdsWriteProvider ? { metaAdsWriteProvider } : {}),\n",
              "    ...(metaAdsWriteProvider ? { metaAdsWriteProvider } : {}),\n    ...(googleAds ? { googleAds } : {}),\n",
              1,
          )

          helper_anchor = "\nfunction runtimeServiceIdentity(\n"
          helper = """\nfunction csvValues(value: string): string[] {\n  return value\n    .split(',')\n    .map((item) => item.trim())\n    .filter(Boolean);\n}\n\n"""
          if helper_anchor not in text:
              raise SystemExit('server helper anchor missing')
          text = text.replace(helper_anchor, helper + helper_anchor, 1)
          path.write_text(text)

          # Runtime resolver: integrate through toca.execute instead of direct tools.
          path = Path('src/mcp/runtime-capability-resolver.ts')
          text = path.read_text()
          import_anchor = "import type { InstagramHistoryProvider } from '../providers/instagram/instagram-history-provider.js';\n"
          import_insert = """import type {\n  GoogleAdsCampaignPlan,\n  GoogleAdsPaidMediaProvider,\n} from '../providers/google-ads/google-ads-paid-media.js';\n""" + import_anchor
          if import_anchor not in text:
              raise SystemExit('resolver import anchor missing')
          text = text.replace(import_anchor, import_insert, 1)

          schema_anchor = "const recordSchema = z.record(z.string(), z.unknown());\n"
          schemas = """const googleAdsPlanSchema = z.object({\n  customerId: z.string().min(1),\n  currencyCode: z.string().length(3),\n  campaignName: z.string().min(1),\n  budgetName: z.string().min(1),\n  dailyBudgetMicros: z.number().int().positive(),\n  advertisingChannelType: z.literal('SEARCH').optional(),\n  targeting: z.object({\n    locationCriterionIds: z.array(z.string().regex(/^\\d+$/)).min(1),\n    languageCriterionIds: z.array(z.string().regex(/^\\d+$/)).optional(),\n    presenceOnly: z.boolean().optional(),\n  }),\n});\nconst googleAdsDateRangeSchema = z.object({\n  startDate: z.string().regex(/^\\d{4}-\\d{2}-\\d{2}$/),\n  endDate: z.string().regex(/^\\d{4}-\\d{2}-\\d{2}$/),\n});\nconst googleAdsCampaignReferenceSchema = z.object({ campaignIdOrName: z.string().min(1) });\n\n"""
          if schema_anchor not in text:
              raise SystemExit('resolver schema anchor missing')
          text = text.replace(schema_anchor, schema_anchor + schemas, 1)

          service_anchor = "export interface RuntimeCapabilityServices {\n"
          if service_anchor not in text:
              raise SystemExit('resolver service anchor missing')
          text = text.replace(
              service_anchor,
              service_anchor + "  readonly googleAds?: GoogleAdsPaidMediaProvider;\n",
              1,
          )

          switch_anchor = "  switch (capabilityId) {\n"
          google_cases = """  switch (capabilityId) {\n    case 'google_ads.account.inspect':\n      return services.googleAds\n        ? binding(z.object({}), () => services.googleAds!.inspectAccount())\n        : undefined;\n    case 'google_ads.campaigns.list':\n      return services.googleAds\n        ? binding(\n            z.object({ limit: z.number().int().min(1).max(500).default(100) }),\n            (input) => services.googleAds!.listCampaigns(input.limit),\n          )\n        : undefined;\n    case 'google_ads.insights.get':\n      return services.googleAds\n        ? binding(\n            googleAdsDateRangeSchema.extend({ limit: z.number().int().min(1).max(500).default(100) }),\n            (input) => services.googleAds!.getInsights(input.startDate, input.endDate, input.limit),\n          )\n        : undefined;\n    case 'google_ads.conversion_actions.list':\n      return services.googleAds\n        ? binding(\n            z.object({ limit: z.number().int().min(1).max(500).default(100) }),\n            (input) => services.googleAds!.listConversionActions(input.limit),\n          )\n        : undefined;\n    case 'google_ads.spend.monitor':\n      return services.googleAds\n        ? binding(googleAdsDateRangeSchema, (input) =>\n            services.googleAds!.spendMonitor(input.startDate, input.endDate),\n          )\n        : undefined;\n    case 'google_ads.conversions.monitor':\n      return services.googleAds\n        ? binding(googleAdsDateRangeSchema, (input) =>\n            services.googleAds!.conversionsMonitor(input.startDate, input.endDate),\n          )\n        : undefined;\n    case 'google_ads.campaign.prepare':\n      return services.googleAds\n        ? binding(googleAdsPlanSchema, (input) =>\n            Promise.resolve(services.googleAds!.prepare(input as GoogleAdsCampaignPlan)),\n          )\n        : undefined;\n    case 'google_ads.targeting.validate':\n      return services.googleAds\n        ? binding(googleAdsPlanSchema, (input) =>\n            services.googleAds!.validateTargeting(input as GoogleAdsCampaignPlan),\n          )\n        : undefined;\n    case 'google_ads.campaign.create_paused':\n      return services.googleAds\n        ? binding(\n            googleAdsPlanSchema,\n            (input) => services.googleAds!.createPaused(input as GoogleAdsCampaignPlan),\n            {\n              targetAccount: (input) => input.customerId,\n              idempotencyKey: (input) =>\n                `google-ads:create-paused:${services.googleAds!.prepare(input as GoogleAdsCampaignPlan).requestSha256}`,\n              financialContext: (input) => ({\n                amountMinor: services.googleAds!.minorUnitsForMicros(input.dailyBudgetMicros),\n                currency: input.currencyCode.toUpperCase(),\n              }),\n              providerReadback: async (result) => {\n                const record = result as Record<string, unknown>;\n                const resourceName =\n                  typeof record.campaignResourceName === 'string'\n                    ? record.campaignResourceName\n                    : undefined;\n                if (!resourceName) {\n                  return {\n                    verified: false,\n                    evidence: ['google-ads:create-paused:resource-name-missing'],\n                    reason: 'GOOGLE_ADS_CREATED_RESOURCE_NAME_REQUIRED',\n                  };\n                }\n                const readback = await services.googleAds!.verifyPaused(resourceName);\n                return {\n                  verified: readback.verified,\n                  evidence: [JSON.stringify(readback.evidence)],\n                  externalResourceId: resourceName,\n                  ...(!readback.verified\n                    ? { reason: 'GOOGLE_ADS_CAMPAIGN_NOT_READ_BACK_AS_PAUSED' }\n                    : {}),\n                };\n              },\n              sideEffectValidated: false,\n            },\n          )\n        : undefined;\n    case 'google_ads.campaign.readback':\n      return services.googleAds\n        ? binding(googleAdsCampaignReferenceSchema, (input) =>\n            services.googleAds!.readbackCampaign(input.campaignIdOrName),\n          )\n        : undefined;\n"""
          if switch_anchor not in text:
              raise SystemExit('resolver switch anchor missing')
          text = text.replace(switch_anchor, google_cases, 1)
          path.write_text(text)
          PY

          git add src/server.ts src/mcp/runtime-capability-resolver.ts
          pnpm exec prettier --write \
            docs/architecture/r28-google-ads-paid-media.md \
            docs/architecture/routes-capabilities-v1.md \
            src/config.ts \
            src/governance/capability-catalog.ts \
            src/governance/capability-ids.ts \
            src/mcp/runtime-capability-resolver.ts \
            src/providers/google-ads/google-ads-api-client.ts \
            src/providers/google-ads/google-ads-paid-media.ts \
            src/providers/google-ads/google-ads-phase.ts \
            src/registry.ts \
            src/server.ts \
            test/config.test.ts \
            test/google-ads-api-client.test.ts \
            test/google-ads-create-idempotency.test.ts \
            test/google-ads-paid-media.test.ts \
            test/governance-catalog.test.ts

          pnpm quality

      - name: Commit clean current-architecture reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'luizidebook'
          git config user.email '47362223+luizidebook@users.noreply.github.com'
          git add \
            docs/architecture/r28-google-ads-paid-media.md \
            docs/architecture/routes-capabilities-v1.md \
            src/config.ts \
            src/governance/capability-catalog.ts \
            src/governance/capability-ids.ts \
            src/mcp/runtime-capability-resolver.ts \
            src/providers/google-ads/google-ads-api-client.ts \
            src/providers/google-ads/google-ads-paid-media.ts \
            src/providers/google-ads/google-ads-phase.ts \
            src/registry.ts \
            src/server.ts \
            test/config.test.ts \
            test/google-ads-api-client.test.ts \
            test/google-ads-create-idempotency.test.ts \
            test/google-ads-paid-media.test.ts \
            test/governance-catalog.test.ts
          git commit -m 'feat(r28): reconcile Google Ads with TOCA Core facade'
          git push origin HEAD:reconcile/r28-google-ads-current-main
