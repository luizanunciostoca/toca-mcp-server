name: Dispatch e026 Staging Candidate

on:
  pull_request:
    paths:
      - '.github/workflows/dispatch-e026-staging-candidate.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Assert exact main candidate before dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: e026b2b441c9a1233a05e62c8a981511ccc1f92e
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "EXACT_MAIN_CANDIDATE=$ACTUAL_SHA"

      - name: Dispatch canonical staging candidate rollout only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-gcp.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f environment=staging \
            -f operation=deploy \
            -f rollout=candidate
          echo 'DEPLOY_ENVIRONMENT=staging'
          echo 'DEPLOY_OPERATION=deploy'
          echo 'DEPLOY_ROLLOUT=candidate'
          echo 'PRODUCTION_AUTHORIZED=NO'
