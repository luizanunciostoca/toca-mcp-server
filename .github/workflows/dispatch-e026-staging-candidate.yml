name: Read 75c Staging Candidate Run

on:
  pull_request:
    paths:
      - '.github/workflows/dispatch-e026-staging-candidate.yml'

permissions:
  contents: read
  actions: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve canonical deploy run for exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 75c165a044c6e79e9545328dd04a2a3e73d2e910
        shell: bash
        run: |
          set -euo pipefail
          RUN="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow deploy-gcp.yml \
            --branch main \
            --event workflow_dispatch \
            --limit 10 \
            --json databaseId,headSha,status,conclusion,createdAt,url \
            | jq -c --arg sha "$EXPECTED_SHA" '[.[] | select(.headSha == $sha)][0]')"
          test "$RUN" != null
          echo "CANONICAL_DEPLOY_RUN=$(jq -r '.databaseId' <<<"$RUN")"
          echo "CANONICAL_DEPLOY_HEAD=$(jq -r '.headSha' <<<"$RUN")"
          echo "CANONICAL_DEPLOY_STATUS=$(jq -r '.status' <<<"$RUN")"
          echo "CANONICAL_DEPLOY_CONCLUSION=$(jq -r '.conclusion // ""' <<<"$RUN")"
          echo "CANONICAL_DEPLOY_URL=$(jq -r '.url' <<<"$RUN")"
          test "$(jq -r '.headSha' <<<"$RUN")" = "$EXPECTED_SHA"
          echo 'READBACK_ONLY=YES'
