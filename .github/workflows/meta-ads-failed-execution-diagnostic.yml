name: Meta Ads Failed Execution Diagnostic

on:
  push:
    branches:
      - diag/meta-ads-failed-execution-h8ts7
    paths:
      - '.github/workflows/meta-ads-failed-execution-diagnostic.yml'

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Read and sanitize failed Cloud Run execution logs
        shell: bash
        run: |
          set -euo pipefail
          gcloud logging read \
            'resource.type="cloud_run_job" AND resource.labels.job_name="toca-meta-ads-create-paused-smoke" AND timestamp>="2026-08-14T02:35:40Z" AND timestamp<="2026-08-14T02:36:01Z"' \
            --project toca-mcp-production \
            --order=asc \
            --limit=300 \
            --format=json > /tmp/meta-ads-failure-logs.json

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          entries = json.loads(Path('/tmp/meta-ads-failure-logs.json').read_text() or '[]')
          markers = (
              'MetaApiError',
              'META_HTTP_',
              'MetaAdsControlledWriteService',
              'MetaAdsControlledGraphProvider',
              'meta-ads-create-paused-smoke',
              'createCampaign',
              'createAdSet',
              'createCreative',
              'createAd',
              'SMOKE_FAILED',
          )
          sensitive = re.compile(r'(?i)(access[_-]?token|authorization|bearer|secret)([=: ]+)([^ ,;\\n]+)')
          output = []
          for entry in entries:
              text = entry.get('textPayload')
              if not isinstance(text, str):
                  payload = entry.get('jsonPayload')
                  if isinstance(payload, dict):
                      text = json.dumps(payload, sort_keys=True)
              if not isinstance(text, str):
                  continue
              if not any(marker in text for marker in markers):
                  continue
              text = sensitive.sub(r'\\1\\2[REDACTED]', text)
              output.append(text[:4000])

          print(f'META_ADS_DIAGNOSTIC_MATCH_COUNT={len(output)}')
          for index, text in enumerate(output, start=1):
              print(f'--- META_ADS_DIAGNOSTIC_{index} ---')
              print(text)
          if not output:
              raise SystemExit('No sanitized diagnostic lines matched the failed execution window')
          PY
