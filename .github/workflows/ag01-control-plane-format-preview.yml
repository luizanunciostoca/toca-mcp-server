name: AG-01 Control Plane Format Preview

on:
  push:
    branches:
      - wave/backend-autonomy-p0-control-plane-v2-20260915
    paths:
      - '.github/workflows/ag01-control-plane-format-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: wave/backend-autonomy-p0-control-plane-v2-20260915
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write scripts/check-ag01-control-plane-state.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ag01-control-plane-format-preview-${{ github.run_id }}
          path: scripts/check-ag01-control-plane-state.mjs
          if-no-files-found: error
          retention-days: 1
