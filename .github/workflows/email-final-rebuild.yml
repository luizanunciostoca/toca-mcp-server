name: Email final clean rebuild

on:
  pull_request:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          ref: final/email-real-sendgrid-20260820
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Replay permanent Email-owned files
        shell: bash
        run: |
          git fetch origin rebase/email-real-sendgrid-20260820
          git checkout origin/rebase/email-real-sendgrid-20260820 -- \
            .github/workflows/email-provider-gate.yml \
            docs/checkpoints/email-real-sendgrid-2026-08-20.md \
            migrations/024_email_provider_runtime.sql \
            scripts/validate-sendgrid-email.ts \
            scripts/verify-email-typecheck.mjs \
            src/omnichannel/email-orchestrator.ts \
            src/omnichannel/email-runtime.ts \
            src/persistence/postgres-email-runtime-store.ts \
            src/providers/sendgrid/email-provider.ts \
            src/providers/sendgrid/runtime-config.ts \
            test/email-orchestrator.test.ts \
            test/email-runtime.test.ts \
            test/sendgrid-email-provider.test.ts \
            tsconfig.email.json
      - name: Merge SendGrid env block without overwriting parent config
        shell: bash
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          source = subprocess.check_output([
              'git', 'show',
              'origin/rebase/email-real-sendgrid-20260820:.env.example',
          ], text=True)
          match = re.search(
              r'(?ms)^# Real Email / Twilio SendGrid remains fail-closed.*?^EMAIL_SENDGRID_SPF_INCLUDE=sendgrid\.net\n',
              source,
          )
          if not match:
              raise SystemExit('SENDGRID_ENV_BLOCK_NOT_FOUND_IN_SOURCE')
          block = match.group(0).rstrip() + '\n\n'
          path = Path('.env.example')
          target = path.read_text()
          existing = re.search(
              r'(?ms)^# Real Email / Twilio SendGrid remains fail-closed.*?^EMAIL_SENDGRID_SPF_INCLUDE=sendgrid\.net\n+',
              target,
          )
          if existing:
              target = target[:existing.start()] + block + target[existing.end():]
          elif '# Non-secret identifiers/endpoints.' in target:
              target = target.replace('# Non-secret identifiers/endpoints.', block + '# Non-secret identifiers/endpoints.', 1)
          else:
              target = target.rstrip() + '\n\n' + block
          path.write_text(target)
          PY
      - run: pnpm install --frozen-lockfile
      - name: Format check permanent Email files
        run: >-
          pnpm exec prettier --check
          .github/workflows/email-provider-gate.yml
          docs/checkpoints/email-real-sendgrid-2026-08-20.md
          scripts/validate-sendgrid-email.ts
          scripts/verify-email-typecheck.mjs
          src/omnichannel/email-orchestrator.ts
          src/omnichannel/email-runtime.ts
          src/persistence/postgres-email-runtime-store.ts
          src/providers/sendgrid/email-provider.ts
          src/providers/sendgrid/runtime-config.ts
          test/email-orchestrator.test.ts
          test/email-runtime.test.ts
          test/sendgrid-email-provider.test.ts
          tsconfig.email.json
      - name: Lint permanent Email files
        run: >-
          pnpm exec eslint
          scripts/validate-sendgrid-email.ts
          src/omnichannel/email-orchestrator.ts
          src/omnichannel/email-runtime.ts
          src/persistence/postgres-email-runtime-store.ts
          src/providers/sendgrid/email-provider.ts
          src/providers/sendgrid/runtime-config.ts
          test/email-orchestrator.test.ts
          test/email-runtime.test.ts
          test/sendgrid-email-provider.test.ts
      - name: Typecheck Email graph
        run: node scripts/verify-email-typecheck.mjs
      - name: Email unit tests
        run: >-
          pnpm vitest run
          test/email-runtime.test.ts
          test/email-orchestrator.test.ts
          test/sendgrid-email-provider.test.ts
      - name: Commit one clean Email delta
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example .github/workflows/email-provider-gate.yml docs/checkpoints/email-real-sendgrid-2026-08-20.md migrations/024_email_provider_runtime.sql scripts/validate-sendgrid-email.ts scripts/verify-email-typecheck.mjs src/omnichannel/email-orchestrator.ts src/omnichannel/email-runtime.ts src/persistence/postgres-email-runtime-store.ts src/providers/sendgrid/email-provider.ts src/providers/sendgrid/runtime-config.ts test/email-orchestrator.test.ts test/email-runtime.test.ts test/sendgrid-email-provider.test.ts tsconfig.email.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(email): real SendGrid runtime over canonical CRM and Privacy"
          git push origin HEAD:final/email-real-sendgrid-20260820
