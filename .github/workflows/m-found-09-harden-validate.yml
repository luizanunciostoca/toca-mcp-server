name: M-FOUND-09 Validate

on:
  push:
    branches:
      - feat/m-found-09-event-record

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/m-found-09-harden.py
      - run: pnpm exec prettier --write src/events/event-record.ts src/persistence/postgres-event-record-store.ts test/event-record.test.ts test/event-record-postgres-contract.test.ts
      - run: pnpm quality
      - name: Commit validated result
        run: |
          rm .github/workflows/m-found-09-harden-validate.yml scripts/m-found-09-harden.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: validate M-FOUND-09 EventRecord foundation"
      - name: Push validated result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:feat/m-found-09-event-record"
