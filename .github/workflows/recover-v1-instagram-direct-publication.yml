name: Temporary V1 Instagram recovery

on:
  push:
    branches:
      - recovery/v1-instagram-direct-publication-20260819

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Recover exact feature files from migrated source branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/v1-instagram-direct-publication:refs/remotes/origin/recovery-source
          git checkout refs/remotes/origin/recovery-source -- \
            .github/workflows/deploy-toca-managed-instagram-daemon-gcp.yml \
            docs/checkpoints/v1-instagram-direct-publication-gate.md \
            src/config.ts \
            src/mcp/instagram-publication-runtime.ts \
            src/mcp/runtime-capability-resolver.ts \
            src/registry.ts \
            src/server.ts \
            test/instagram-core-publication-runtime.test.ts \
            test/instagram-publication-config.test.ts

          if git diff --cached --quiet; then
            echo "No recovery changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(instagram): recover V1 direct publication Core integration"
          git push origin HEAD:recovery/v1-instagram-direct-publication-20260819
