name: Compliance Pages Live Check

on:
  push:
    branches:
      - feat/instagram-engagement-messaging
    paths:
      - .github/workflows/compliance-pages-live-check.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public compliance pages
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://toca-meta-oauth-staging-990081828836.southamerica-east1.run.app'
          check() {
            local path="$1"
            local marker="$2"
            local headers body status
            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(curl --silent --show-error --location --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$BASE$path")"
            test "$status" = '200'
            grep -qi '^content-type: text/html; charset=utf-8' "$headers"
            grep -q "$marker" "$body"
            echo "PASS $path"
          }
          check '/privacy' 'Política de Privacidade'
          check '/terms' 'Termos de Serviço'
          check '/data-deletion' 'Exclusão de Dados'
