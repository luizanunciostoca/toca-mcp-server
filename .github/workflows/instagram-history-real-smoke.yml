name: Instagram History Real Smoke

on:
  push:
    branches:
      - chore/validate-instagram-history-read

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  TOKEN_SECRET_ID: toca-meta-oauth-token
  INSTAGRAM_ACCOUNT_ID: '17841402033495654'
  READ_SMOKE_JOB: toca-instagram-history-read-smoke

jobs:
  real-read-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build isolated smoke image from current code
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/Dockerfile.instagram-history-smoke <<'DOCKER'
          FROM node:24-bookworm-slim AS build
          RUN corepack enable && corepack prepare pnpm@10.15.0 --activate
          WORKDIR /app
          COPY package.json pnpm-lock.yaml ./
          RUN pnpm install --frozen-lockfile
          COPY tsconfig.json ./
          COPY src ./src
          RUN pnpm build

          FROM node:24-bookworm-slim
          RUN corepack enable && corepack prepare pnpm@10.15.0 --activate
          WORKDIR /app
          COPY package.json pnpm-lock.yaml ./
          RUN pnpm install --prod --frozen-lockfile
          COPY --from=build /app/dist ./dist
          COPY .github/smoke/instagram-history-real-smoke.mjs ./.github/smoke/instagram-history-real-smoke.mjs
          USER node
          CMD ["node", ".github/smoke/instagram-history-real-smoke.mjs"]
          DOCKER

          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/instagram-history-smoke:${GITHUB_SHA}"
          docker build -f /tmp/Dockerfile.instagram-history-smoke -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy real read smoke job
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$READ_SMOKE_JOB" \
            --image "$IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars "INSTAGRAM_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID" \
            --set-secrets "META_ACCESS_TOKEN=$TOKEN_SECRET_ID:latest" \
            --max-retries 0 \
            --task-timeout 120s \
            --quiet

      - name: Execute real read smoke under runtime identity
        id: execute
        shell: bash
        run: |
          set -uo pipefail
          set +e
          gcloud run jobs execute "$READ_SMOKE_JOB" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --wait \
            --quiet
          RC=$?
          set -e

          EXECUTION="$(gcloud run jobs executions list \
            --job "$READ_SMOKE_JOB" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --limit 1 \
            --sort-by='~metadata.creationTimestamp' \
            --format='value(metadata.name)')"
          test -n "$EXECUTION"
          echo "EXECUTION=$EXECUTION" >> "$GITHUB_ENV"
          echo "EXECUTION_RC=$RC" >> "$GITHUB_ENV"
          echo "Cloud Run execution: $EXECUTION (gcloud rc=$RC)"

      - name: Read and validate smoke result
        shell: bash
        run: |
          set -euo pipefail
          test "${EXECUTION_RC:-1}" = "0"
          sleep 2

          FILTER="resource.type=cloud_run_job AND resource.labels.job_name=$READ_SMOKE_JOB AND labels.\"run.googleapis.com/execution_name\"=$EXECUTION AND jsonPayload.validation=\"history-reconciliation-sample\""
          gcloud logging read "$FILTER" \
            --project "$PROJECT_ID" \
            --limit 1 \
            --freshness 20m \
            --order=desc \
            --format='json(jsonPayload)' > /tmp/reconciliation-raw.json

          test "$(jq 'length' /tmp/reconciliation-raw.json)" -eq 1
          jq -e '.[0].jsonPayload.mediaListOk == true and .[0].jsonPayload.instagramManageInsightsGranted == true' /tmp/reconciliation-raw.json >/dev/null
          jq -r '.[0].jsonPayload | [.returnedMedia,.mediaInsightsOk,.mediaInsightsStatus,.accountInsightsOk,.accountInsightsStatus] | @tsv' /tmp/reconciliation-raw.json

      - name: Build sanitized visual reconciliation package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/reconciliation/previews
          jq '.[0].jsonPayload' /tmp/reconciliation-raw.json > /tmp/payload.json

          jq -r '.historySample[] | select(.sourceUrl != null) | [.id,.sourceUrl] | @tsv' /tmp/payload.json | \
          while IFS=$'\t' read -r id url; do
            curl --fail --location --silent --show-error --retry 2 "$url" -o "/tmp/reconciliation/previews/${id}.jpg" || true
          done

          jq '.historySample[] | select(.children != null) | .id as $parent | .children | to_entries[] | select(.value.sourceUrl != null) | [$parent, (.key|tostring), .value.sourceUrl] | @tsv' -r /tmp/payload.json | \
          while IFS=$'\t' read -r parent idx url; do
            curl --fail --location --silent --show-error --retry 2 "$url" -o "/tmp/reconciliation/previews/${parent}_child_${idx}.jpg" || true
          done

          jq 'del(.historySample[].sourceUrl) | .historySample[].children |= map(del(.sourceUrl))' /tmp/payload.json > /tmp/reconciliation/metadata.json
          find /tmp/reconciliation/previews -type f -maxdepth 1 -print | sort
          test "$(find /tmp/reconciliation/previews -type f | wc -l)" -gt 0

      - name: Upload private reconciliation artifact
        uses: actions/upload-artifact@v4
        with:
          name: instagram-history-reconciliation-${{ github.run_id }}
          path: /tmp/reconciliation
          retention-days: 1
          if-no-files-found: error

      - name: Cleanup isolated smoke job
        if: always()
        shell: bash
        run: |
          gcloud run jobs delete "$READ_SMOKE_JOB" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --quiet >/dev/null 2>&1 || true
