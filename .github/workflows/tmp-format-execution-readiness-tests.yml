name: Temporary Format Execution Readiness Tests

on:
  push:
    branches:
      - feat/instagram-gcp-execution-runtime-readiness-20260916
    paths:
      - '.github/workflows/tmp-format-execution-readiness-tests.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/instagram-gcp-execution-runtime-readiness-20260916
          persist-credentials: true
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact readiness tests
        run: >-
          pnpm prettier --write
          test/instagram-gcp-publication-execution-readiness.test.ts
          test/instagram-publication-execution-readiness-runtime.test.ts
      - name: Commit formatted tests only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --quiet -- .github/workflows/instagram-gcp-publication-execution-readiness.yml
          git diff --quiet -- .github/workflows/instagram-gcp-execution-readiness-owner-command-gateway.yml
          git diff --quiet -- src/instagram-publication-execution-readiness.ts
          if git diff --quiet -- test/instagram-gcp-publication-execution-readiness.test.ts test/instagram-publication-execution-readiness-runtime.test.ts; then
            echo 'FORMAT_ALREADY_CLEAN=true'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/instagram-gcp-publication-execution-readiness.test.ts test/instagram-publication-execution-readiness-runtime.test.ts
          git commit -m 'style(instagram): format execution readiness tests'
          git push origin HEAD:feat/instagram-gcp-execution-runtime-readiness-20260916
