name: Temporary Instagram Canary Meta Runtime Fix

on:
  push:
    branches:
      - fix/instagram-canary-meta-runtime-config

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/instagram-canary-meta-runtime-config
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch exact Meta runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs';
          const path = '.github/workflows/instagram-engagement-controlled-write-canary-v2.yml';
          let source = fs.readFileSync(path, 'utf8');

          const envNeedle = '  TOKEN_SECRET_ID: toca-meta-oauth-token\n';
          const envReplacement = `${envNeedle}  META_APP_SECRET_ID: toca-meta-app-secret\n  META_APP_ID: '2281930145887404'\n  META_REDIRECT_URI: https://toca-meta-oauth-staging-990081828836.southamerica-east1.run.app/oauth/meta/callback\n  META_REQUESTED_SCOPES: pages_show_list,pages_read_engagement,pages_manage_metadata,pages_messaging,business_management,instagram_basic,instagram_manage_comments,instagram_manage_messages,instagram_content_publish\n`;
          if ((source.split(envNeedle).length - 1) !== 1) throw new Error('CANARY_META_ENV_ANCHOR_INVALID');
          source = source.replace(envNeedle, envReplacement);

          const secretNeedle = '--set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest,TOCA_SECRET_META_ACCESS_TOKEN=$TOKEN_SECRET_ID:latest"';
          const secretReplacement = '--set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest,TOCA_SECRET_META_ACCESS_TOKEN=$TOKEN_SECRET_ID:latest,META_APP_SECRET=$META_APP_SECRET_ID:latest"';
          if ((source.split(secretNeedle).length - 1) !== 3) throw new Error('CANARY_META_SECRET_ANCHOR_INVALID');
          source = source.split(secretNeedle).join(secretReplacement);

          const configNeedle = '#META_PROVIDER_VERIFIED=true#META_ACCESS_TOKEN_ENV_KEY=TOCA_SECRET_META_ACCESS_TOKEN';
          const configReplacement = '#META_PROVIDER_VERIFIED=true#META_APP_ID=$META_APP_ID#META_APP_SECRET_PROVIDER=env#META_APP_SECRET_KEY=META_APP_SECRET#META_AUTHORIZATION_ENDPOINT=https://www.facebook.com/dialog/oauth#META_TOKEN_ENDPOINT=https://graph.facebook.com/oauth/access_token#META_REDIRECT_URI=$META_REDIRECT_URI#META_REQUESTED_SCOPES=$META_REQUESTED_SCOPES#META_ACCESS_TOKEN_ENV_KEY=TOCA_SECRET_META_ACCESS_TOKEN';
          if ((source.split(configNeedle).length - 1) !== 3) throw new Error('CANARY_META_CONFIG_ANCHOR_INVALID');
          source = source.split(configNeedle).join(configReplacement);

          fs.writeFileSync(path, source);
          NODE
      - name: Apply repository Prettier
        run: pnpm exec prettier --write .github/workflows/instagram-engagement-controlled-write-canary-v2.yml test/instagram-engagement-canary-meta-runtime-config.test.ts
      - name: Commit governed patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/instagram-engagement-controlled-write-canary-v2.yml test/instagram-engagement-canary-meta-runtime-config.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(instagram): bind complete Meta config in canary jobs'
          git push origin HEAD:fix/instagram-canary-meta-runtime-config
