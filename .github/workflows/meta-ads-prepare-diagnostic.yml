name: Meta Ads PREPARE Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meta-ads-prepare-diagnostic.yml'

permissions:
  contents: read
  id-token: write
  issues: write

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_ARTIFACT_REPOSITORY: toca-mcp
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  TOKEN_SECRET_ID: toca-meta-oauth-token
  JOB_NAME: toca-meta-ads-prepare-diagnostic
  META_APP_ID: '2281930145887404'
  META_REDIRECT_URI: https://toca-meta-oauth-staging-990081828836.southamerica-east1.run.app/oauth/meta/callback
  META_ADS_ACCOUNT_ID: '394512749760530'
  META_ADS_CURRENCY: BRL
  META_ADS_PIXEL_ID: '461233076843065'
  META_ADS_PAGE_ID: '306103746115875'
  META_ADS_INSTAGRAM_ACTOR_ID: '17841402033495654'
  META_ADS_DAILY_BUDGET_MINOR: '17000'
  META_ADS_MAX_DAILY_BUDGET_MINOR: '100000'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm quality

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - name: Build immutable diagnostic image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/server:meta-ads-prepare-diagnostic-${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "SMOKE_ID=${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Deploy PREPARE-only no-side-effect diagnostic job
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$JOB_NAME" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --command node \
            --args dist/src/meta-ads-create-paused-smoke.js \
            --set-env-vars "^~^NODE_ENV=production~MCP_ENABLED=false~META_ENABLED=true~META_WEBHOOK_ENABLED=false~META_WEBHOOK_PERSISTENCE_ENABLED=false~INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=false~INSTAGRAM_PUBLICATION_WRITES_ENABLED=false~META_ADS_READ_ENABLED=false~META_ADS_WRITE_ENABLED=false~META_APP_ID=$META_APP_ID~META_APP_SECRET_PROVIDER=env~META_APP_SECRET_KEY=UNUSED_META_APP_SECRET~META_AUTHORIZATION_ENDPOINT=https://www.facebook.com/dialog/oauth~META_TOKEN_ENDPOINT=https://graph.facebook.com/oauth/access_token~META_REDIRECT_URI=$META_REDIRECT_URI~META_REQUESTED_SCOPES=ads_read,ads_management,business_management~META_GRAPH_BASE_URL=https://graph.facebook.com~META_GRAPH_API_VERSION=v24.0~META_TOKEN_STORE_PROVIDER=gcp-secret-manager~META_TOKEN_SECRET_ID=$TOKEN_SECRET_ID~GCP_PROJECT_ID=$GCP_PROJECT_ID~META_ADS_SMOKE_MODE=PREPARE~META_ADS_SMOKE_ACCOUNT_ID=$META_ADS_ACCOUNT_ID~META_ADS_SMOKE_CURRENCY=$META_ADS_CURRENCY~META_ADS_SMOKE_PIXEL_ID=$META_ADS_PIXEL_ID~META_ADS_SMOKE_PAGE_ID=$META_ADS_PAGE_ID~META_ADS_SMOKE_INSTAGRAM_ACTOR_ID=$META_ADS_INSTAGRAM_ACTOR_ID~META_ADS_SMOKE_ID=$SMOKE_ID~META_ADS_SMOKE_DAILY_BUDGET_MINOR=$META_ADS_DAILY_BUDGET_MINOR~META_ADS_SMOKE_MAX_DAILY_BUDGET_MINOR=$META_ADS_MAX_DAILY_BUDGET_MINOR" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 180s \
            --quiet

      - name: Execute PREPARE and publish sanitized diagnostic
        id: diagnostic
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          gcloud run jobs execute "$JOB_NAME" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --wait \
            --quiet
          EXEC_STATUS=$?

          sleep 5
          gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME}" \
            --project "$GCP_PROJECT_ID" \
            --freshness=30m \
            --limit=100 \
            --order=desc \
            --format=json > /tmp/runtime-logs.json || true

          DIAGNOSTIC="$(jq -r '
            [ .[] |
              (.textPayload // .jsonPayload.message // .jsonPayload.error // empty) |
              tostring |
              select(test("META_ADS|Error|permission|secret|Graph|OAuth|geolocation|creative|account|payment|billing"; "i"))
            ] | unique | .[:25] | .[]
          ' /tmp/runtime-logs.json 2>/dev/null \
            | sed -E 's/(access[_-]?token|token)[=:][^ ,}\"]+/\1=[REDACTED]/Ig' \
            | head -n 25)"

          if [ -z "$DIAGNOSTIC" ]; then
            DIAGNOSTIC="No sanitized application/provider error line was extracted from Cloud Logging."
          fi

          BODY="$(cat <<EOF
          ### Meta Ads PREPARE diagnostic — ${GITHUB_SHA}

          PREPARE exit status: \`${EXEC_STATUS}\`

          Sanitized Cloud Run diagnostic:
          \`\`\`text
          ${DIAGNOSTIC}
          \`\`\`

          PREPARE has no ID-producing Meta Ads mutation. It uses provider reads plus an Ad request with \`execution_options=[\"validate_only\"]\` as a no-side-effect readiness gate.
          EOF
          )"
          gh api "repos/${GITHUB_REPOSITORY}/issues/67/comments" -f body="$BODY" >/dev/null

          exit "$EXEC_STATUS"

      - name: Remove diagnostic Cloud Run Job
        if: always()
        shell: bash
        run: |
          gcloud run jobs delete "$JOB_NAME" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --quiet || true
