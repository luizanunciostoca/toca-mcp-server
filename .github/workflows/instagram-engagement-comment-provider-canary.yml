name: Instagram Engagement Comment Provider Canary

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: instagram-engagement-comment-provider-canary
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_ARTIFACT_REPOSITORY: toca-mcp
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  DATABASE_SECRET_ID: toca-database-url
  TOKEN_SECRET_ID: toca-meta-oauth-token
  DAEMON_SERVICE_NAME: toca-managed-instagram-daemon
  INSTAGRAM_ACCOUNT_ID: '17841402033495654'
  INSTAGRAM_PAGE_ID: '306103746115875'
  CANONICAL_FAQ_SPREADSHEET_ID: 1M0HSs7QJpFCJvvnrZxJRaaXY8scv5R3okCG_OyFLiEU
  TOCA_TENANT_ID: toca
  TOCA_WORKSPACE_ID: toca
  TOCA_ORGANIZATION_ID: toca
  KB_SOURCE_IDS: SRC-OPS-001,SRC-MENU-002,SRC-LOC-001

jobs:
  comment-provider-canary:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'PRODUCTION AUTHORIZATION — Instagram engagement real-write COMMENT CANARY AUTO')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35

    steps:
      - name: Checkout exact authorized controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate exact single-Comment authorization
        id: auth
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          BODY="$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")"
          ISSUE_NUMBER="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
          CURRENT_MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          test "$CURRENT_MAIN_SHA" = "$GITHUB_SHA"
          RUNTIME_SHA="$(grep '^RUNTIME_SOURCE_SHA=' <<< "$BODY" | cut -d= -f2-)"
          RUNTIME_DIGEST="$(grep '^RUNTIME_IMAGE_DIGEST=' <<< "$BODY" | cut -d= -f2-)"
          TARGET_COUNT="$(grep -c '^ELIGIBLE_TARGET_SHA256=' <<< "$BODY" || true)"
          test "$TARGET_COUNT" = '1'
          ELIGIBLE_TARGET_SHA="$(grep '^ELIGIBLE_TARGET_SHA256=' <<< "$BODY" | cut -d= -f2-)"
          test "$RUNTIME_SHA" = "$GITHUB_SHA"
          [[ "$RUNTIME_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ELIGIBLE_TARGET_SHA" =~ ^[0-9a-f]{64}$ ]]
          required=(
            "AUTHORIZED_CONTROLLER_SHA=$GITHUB_SHA"
            "AUTHORIZATION_STATE=ACTIVE"
            "INSTAGRAM_ENGAGEMENT_REAL_COMMENT_CANARY=AUTHORIZED"
            "RUNTIME_SOURCE_SHA=$GITHUB_SHA"
            "RUNTIME_IMAGE_DIGEST=$RUNTIME_DIGEST"
            "ELIGIBLE_TARGET_SHA256=$ELIGIBLE_TARGET_SHA"
            "CANARY_CHANNEL=COMMENT"
            "CANARY_MAX_EXTERNAL_REPLIES=1"
            "TEMPORARY_JOB_ONLY=true"
            "PERSISTENT_COMMENT_PROMOTION_AUTHORIZED=false"
            "EXTERNAL_COMMENT_REPLY_AUTHORIZED=true"
            "DIRECT_LIMITED_RUNTIME_MUST_REMAIN_ACTIVE=true"
            "AUTO_CANARY_AUTHORIZED=true"
          )
          for line in "${required[@]}"; do
            grep -Fxq "$line" <<< "$BODY" || {
              echo "Missing exact Comment canary authorization field: $line" >&2
              exit 1
            }
          done
          SESSION="ig-comment-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "runtime_image=$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/server@$RUNTIME_DIGEST" >> "$GITHUB_OUTPUT"
          echo "runtime_digest=$RUNTIME_DIGEST" >> "$GITHUB_OUTPUT"
          echo "eligible_target_sha=$ELIGIBLE_TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "authorization_issue=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "canary_session=$SESSION" >> "$GITHUB_OUTPUT"
          echo "started_at=$STARTED_AT" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Exact-head Quality Gate
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm quality

      - name: Authenticate governed deployer
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Verify immutable image and active Direct-only serving boundary
        id: boundary
        env:
          RUNTIME_IMAGE: ${{ steps.auth.outputs.runtime_image }}
          RUNTIME_DIGEST: ${{ steps.auth.outputs.runtime_digest }}
        shell: bash
        run: |
          set -euo pipefail
          DESCRIBED_DIGEST="$(gcloud artifacts docker images describe "$RUNTIME_IMAGE" --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          test "$DESCRIBED_DIGEST" = "$RUNTIME_DIGEST"

          SERVICE_JSON="$(gcloud run services describe "$DAEMON_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          DIRECT_REVISION="$(printf '%s' "$SERVICE_JSON" | jq -r '[.status.traffic[]? | select((.percent // 0)==100 and (.revisionName // "")!="") | .revisionName] | if length==1 then .[0] else empty end')"
          test -n "$DIRECT_REVISION"
          REVISION_JSON="$(gcloud run revisions describe "$DIRECT_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$REVISION_JSON" | jq -e '
            .status.conditions as $conditions |
            .spec.containers[0] as $c |
            ([$conditions[]? | select(.type=="Ready") | .status] | last) == "True" and
            ([$c.env[]? | select(.name=="INSTAGRAM_ENGAGEMENT_RUNTIME_ENABLED") | .value] | last) == "true" and
            ([$c.env[]? | select(.name=="INSTAGRAM_ENGAGEMENT_WRITES_ENABLED") | .value] | last) == "true" and
            ([$c.env[]? | select(.name=="INSTAGRAM_PUBLICATION_WRITES_ENABLED") | .value] | last // "false") == "false" and
            (([$c.env[]? | select(.name=="INSTAGRAM_ENGAGEMENT_AUTO_REPLY_CHANNELS") | .value] | last // "DIRECT") == "DIRECT")
          ' >/dev/null
          echo "direct_revision=$DIRECT_REVISION" >> "$GITHUB_OUTPUT"
          echo "DIRECT_LIMITED_PRESTATE=PASS"

      - name: Prove Comment provider readiness without sending
        env:
          RUNTIME_IMAGE: ${{ steps.auth.outputs.runtime_image }}
        shell: bash
        run: |
          set -euo pipefail
          JOB="toca-ig-comment-ready-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          gcloud run jobs deploy "$JOB" \
            --image "$RUNTIME_IMAGE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest,TOCA_SECRET_META_ACCESS_TOKEN=$TOKEN_SECRET_ID:latest" \
            --set-env-vars "^#^NODE_ENV=production#META_ENABLED=true#META_PROVIDER_VERIFIED=true#META_ACCESS_TOKEN_ENV_KEY=TOCA_SECRET_META_ACCESS_TOKEN#META_GRAPH_BASE_URL=https://graph.facebook.com#META_GRAPH_API_VERSION=v24.0#INSTAGRAM_ENGAGEMENT_RUNTIME_ENABLED=true#INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=true#INSTAGRAM_ENGAGEMENT_AUTO_REPLY_CHANNELS=COMMENT#INSTAGRAM_ENGAGEMENT_TENANT_ID=$TOCA_TENANT_ID#INSTAGRAM_ENGAGEMENT_WORKSPACE_ID=$TOCA_WORKSPACE_ID#INSTAGRAM_ENGAGEMENT_ORGANIZATION_ID=$TOCA_ORGANIZATION_ID#INSTAGRAM_ENGAGEMENT_PAGE_ID=$INSTAGRAM_PAGE_ID#INSTAGRAM_BUSINESS_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID#INSTAGRAM_ENGAGEMENT_KNOWLEDGE_SPREADSHEET_ID=$CANONICAL_FAQ_SPREADSHEET_ID#INSTAGRAM_ENGAGEMENT_KNOWLEDGE_SOURCE=postgres#INSTAGRAM_ENGAGEMENT_KNOWLEDGE_BASE_ENABLED=true#INSTAGRAM_ENGAGEMENT_KB_SOURCE_IDS=$KB_SOURCE_IDS" \
            --command node --args dist/src/instagram-engagement-readiness-preflight.js \
            --tasks 1 --max-retries 0 --task-timeout 240s --quiet
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet

      - name: Reserve one already-classified safe recent Comment
        env:
          RUNTIME_IMAGE: ${{ steps.auth.outputs.runtime_image }}
          CANARY_SESSION: ${{ steps.auth.outputs.canary_session }}
          ELIGIBLE_TARGET_SHA: ${{ steps.auth.outputs.eligible_target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          JOB="toca-ig-comment-pre-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          gcloud run jobs deploy "$JOB" \
            --image "$RUNTIME_IMAGE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --set-env-vars "^#^INSTAGRAM_ENGAGEMENT_COMMENT_CANARY_MODE=PREPARE#INSTAGRAM_ENGAGEMENT_COMMENT_CANARY_SESSION=$CANARY_SESSION#INSTAGRAM_ENGAGEMENT_COMMENT_CANARY_EXPECTED_TARGET_SHA256=$ELIGIBLE_TARGET_SHA#INSTAGRAM_ENGAGEMENT_COMMENT_CANARY_MAX_AGE_MINUTES=30#INSTAGRAM_ENGAGEMENT_KNOWLEDGE_SPREADSHEET_ID=$CANONICAL_FAQ_SPREADSHEET_ID#INSTAGRAM_BUSINESS_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID" \
            --command node --args scripts/instagram-engagement-comment-provider-canary.mjs \
            --tasks 1 --max-retries 0 --task-timeout 120s --quiet
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet

      - name: Execute exactly one Comment provider call
        env:
          RUNTIME_IMAGE: ${{ steps.auth.outputs.runtime_image }}
          CANARY_SESSION: ${{ steps.auth.outputs.canary_session }}
          ELIGIBLE_TARGET_SHA: ${{ steps.auth.outputs.eligible_target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          JOB="toca-ig-comment-send-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          gcloud run jobs deploy "$JOB" \
            --image "$RUNTIME_IMAGE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest,TOCA_SECRET_META_ACCESS_TOKEN=$TOKEN_SECRET_ID:latest" \
            --set-env-vars "^#^NODE_ENV=production#META_ENABLED=true#META_PROVIDER_VERIFIED=true#META_ACCESS_TOKEN_ENV_KEY=TOCA_SECRET_META_ACCESS_TOKEN#META_GRAPH_BASE_URL=https://graph.facebook.com#META_GRAPH_API_VERSION=v24.0#INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=true#INSTAGRAM_ENGAGEMENT_AUTO_REPLY_CHANNELS=COMMENT#INSTAGRAM_ENGAGEMENT_COMMENT_CANARY_MODE=EXECUTE#INSTAGRAM_ENGAGEMENT_COMMENT_CANARY_SESSION=$CANARY_SESSION#INSTAGRAM_ENGAGEMENT_COMMENT_CANARY_EXPECTED_TARGET_SHA256=$ELIGIBLE_TARGET_SHA#INSTAGRAM_ENGAGEMENT_COMMENT_CANARY_MAX_AGE_MINUTES=30#INSTAGRAM_ENGAGEMENT_KNOWLEDGE_SPREADSHEET_ID=$CANONICAL_FAQ_SPREADSHEET_ID#INSTAGRAM_BUSINESS_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID" \
            --command node --args scripts/instagram-engagement-comment-provider-canary.mjs \
            --tasks 1 --max-retries 0 --task-timeout 120s --quiet
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet

      - name: Verify Comment provider ACK and conversation receipt
        env:
          RUNTIME_IMAGE: ${{ steps.auth.outputs.runtime_image }}
          CANARY_SESSION: ${{ steps.auth.outputs.canary_session }}
          CANARY_STARTED_AT: ${{ steps.auth.outputs.started_at }}
        shell: bash
        run: |
          set -euo pipefail
          JOB="toca-ig-comment-post-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          gcloud run jobs deploy "$JOB" \
            --image "$RUNTIME_IMAGE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --set-env-vars "^#^INSTAGRAM_ENGAGEMENT_COMMENT_CANARY_MODE=POST#INSTAGRAM_ENGAGEMENT_COMMENT_CANARY_SESSION=$CANARY_SESSION#INSTAGRAM_ENGAGEMENT_COMMENT_CANARY_STARTED_AT=$CANARY_STARTED_AT#INSTAGRAM_ENGAGEMENT_KNOWLEDGE_SPREADSHEET_ID=$CANONICAL_FAQ_SPREADSHEET_ID#INSTAGRAM_BUSINESS_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID" \
            --command node --args scripts/instagram-engagement-comment-provider-canary.mjs \
            --tasks 1 --max-retries 0 --task-timeout 120s --quiet
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet

      - name: Reverify unchanged Direct LIMITED serving boundary
        env:
          DIRECT_REVISION: ${{ steps.boundary.outputs.direct_revision }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_JSON="$(gcloud run services describe "$DAEMON_SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          CURRENT_REVISION="$(printf '%s' "$SERVICE_JSON" | jq -r '[.status.traffic[]? | select((.percent // 0)==100 and (.revisionName // "")!="") | .revisionName] | if length==1 then .[0] else empty end')"
          test "$CURRENT_REVISION" = "$DIRECT_REVISION"
          REVISION_JSON="$(gcloud run revisions describe "$CURRENT_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          printf '%s' "$REVISION_JSON" | jq -e '
            .spec.containers[0] as $c |
            ([$c.env[]? | select(.name=="INSTAGRAM_ENGAGEMENT_RUNTIME_ENABLED") | .value] | last) == "true" and
            ([$c.env[]? | select(.name=="INSTAGRAM_ENGAGEMENT_WRITES_ENABLED") | .value] | last) == "true" and
            (([$c.env[]? | select(.name=="INSTAGRAM_ENGAGEMENT_AUTO_REPLY_CHANNELS") | .value] | last // "DIRECT") == "DIRECT") and
            ([$c.env[]? | select(.name=="INSTAGRAM_PUBLICATION_WRITES_ENABLED") | .value] | last // "false") == "false"
          ' >/dev/null
          echo "DIRECT_LIMITED_POSTSTATE=PASS"

      - name: Publish Comment canary PASS
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.auth.outputs.authorization_issue }}
          RUNTIME_DIGEST: ${{ steps.auth.outputs.runtime_digest }}
          ELIGIBLE_TARGET_SHA: ${{ steps.auth.outputs.eligible_target_sha }}
          DIRECT_REVISION: ${{ steps.boundary.outputs.direct_revision }}
        shell: bash
        run: |
          set -euo pipefail
          PASS_BODY="$(printf '%s\n' \
            'COMMENT_CANARY_STATUS=PASS' \
            "CONTROLLER_SHA=$GITHUB_SHA" \
            "RUNTIME_IMAGE_DIGEST=$RUNTIME_DIGEST" \
            "ELIGIBLE_TARGET_SHA256=$ELIGIBLE_TARGET_SHA" \
            'CANARY_CHANNEL=COMMENT' \
            'CANARY_SENT_COUNT=1' \
            'PROVIDER_ACKNOWLEDGED=true' \
            'CONVERSATION_RECEIPT=PASS' \
            'PERSISTENT_COMMENT_PROMOTION=false' \
            "DIRECT_LIMITED_REVISION_UNCHANGED=$DIRECT_REVISION" \
            'DIRECT_LIMITED_RUNTIME_ACTIVE=true' \
            'GENERAL_AUTONOMY_PROMOTED=false')"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$PASS_BODY"

      - name: Release reservation only when no provider attempt occurred
        if: failure()
        env:
          RUNTIME_IMAGE: ${{ steps.auth.outputs.runtime_image }}
          CANARY_SESSION: ${{ steps.auth.outputs.canary_session }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNTIME_IMAGE:-}" || exit 0
          test -n "${CANARY_SESSION:-}" || exit 0
          JOB="toca-ig-comment-cancel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { gcloud run jobs delete "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          gcloud run jobs deploy "$JOB" \
            --image "$RUNTIME_IMAGE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --set-env-vars "^#^INSTAGRAM_ENGAGEMENT_COMMENT_CANARY_MODE=CANCEL#INSTAGRAM_ENGAGEMENT_COMMENT_CANARY_SESSION=$CANARY_SESSION#INSTAGRAM_ENGAGEMENT_KNOWLEDGE_SPREADSHEET_ID=$CANONICAL_FAQ_SPREADSHEET_ID#INSTAGRAM_BUSINESS_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID" \
            --command node --args scripts/instagram-engagement-comment-provider-canary.mjs \
            --tasks 1 --max-retries 0 --task-timeout 120s --quiet
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet || true

      - name: Consume single-use Comment authorization
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ISSUE_NUMBER="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
          BODY="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" --jq '.body // ""')"
          BODY="$(sed 's/^AUTHORIZATION_STATE=ACTIVE$/AUTHORIZATION_STATE=CONSUMED_AND_CLOSED/' <<< "$BODY")"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -f body="$BODY" -f state='closed' >/dev/null
