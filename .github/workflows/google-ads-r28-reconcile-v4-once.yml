name: Google Ads R28 Reconcile V4 Once

on:
  push:
    branches: [reconcile/r28-google-ads-current-main]
    paths: ['.github/workflows/google-ads-r28-reconcile-v4-once.yml']

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Materialize and validate current-architecture Google Ads R28
        run: python scripts/google-ads-r28-reconcile-once.py
      - name: Commit permanent reconciliation only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'luizidebook'
          git config user.email '47362223+luizidebook@users.noreply.github.com'
          git add \
            docs/architecture/r28-google-ads-paid-media.md \
            docs/architecture/routes-capabilities-v1.md \
            src/config.ts \
            src/governance/capability-catalog.ts \
            src/governance/capability-ids.ts \
            src/mcp/runtime-capability-resolver.ts \
            src/providers/google-ads/google-ads-api-client.ts \
            src/providers/google-ads/google-ads-paid-media.ts \
            src/providers/google-ads/google-ads-phase.ts \
            src/registry.ts \
            src/server.ts \
            test/config.test.ts \
            test/google-ads-api-client.test.ts \
            test/google-ads-create-idempotency.test.ts \
            test/google-ads-paid-media.test.ts \
            test/governance-catalog.test.ts
          test "$(git diff --cached --name-only | wc -l)" = '16'
          git commit -m 'feat(r28): reconcile Google Ads with TOCA Core facade'
          git push origin HEAD:reconcile/r28-google-ads-current-main
