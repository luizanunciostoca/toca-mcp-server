name: Demand Intelligence Provider READ TEMP

on:
  push:
    branches:
      - recovery/meta-ads-demand-intelligence-20260819
    paths:
      - '.github/workflows/demand-intelligence-provider-read-temp.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: demand-intelligence-provider-read-temp
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_ARTIFACT_REPOSITORY: toca-mcp
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  TOKEN_SECRET_ID: toca-meta-oauth-token
  META_GRAPH_API_VERSION: v24.0
  META_ADS_ACCOUNT_ID: '311793958882290'

jobs:
  provider-read:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Authenticate deployer to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Build immutable READ-only validator
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          mkdir -p /tmp/demand-provider-read
          cat > /tmp/demand-provider-read/read.mjs <<'NODE'
          const token = process.env.META_ACCESS_TOKEN;
          const apiVersion = process.env.META_GRAPH_API_VERSION;
          const adAccountId = process.env.META_ADS_ACCOUNT_ID;
          const sourceSha = process.env.SOURCE_SHA;
          if (!token || !apiVersion || !adAccountId || !sourceSha) {
            throw new Error('DEMAND_PROVIDER_READ_CONFIG_MISSING');
          }

          const targetingSpec = {
            geo_locations: {
              custom_locations: [
                {
                  latitude: -13.3833,
                  longitude: -38.9167,
                  radius: 15,
                  distance_unit: 'kilometer',
                },
              ],
            },
          };

          async function graph(path, params = {}) {
            const url = new URL(`https://graph.facebook.com/${apiVersion}/${path}`);
            for (const [key, value] of Object.entries(params)) url.searchParams.set(key, value);
            const response = await fetch(url, {
              method: 'GET',
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
            });
            const body = await response.json();
            if (!response.ok) {
              const code = Number.isInteger(body?.error?.code) ? body.error.code : 0;
              const subcode = Number.isInteger(body?.error?.error_subcode) ? body.error.error_subcode : 0;
              throw new Error(`DEMAND_PROVIDER_READ_HTTP_${response.status}_CODE_${code}_SUBCODE_${subcode}`);
            }
            return body;
          }

          const permissions = await graph('me/permissions');
          const granted = new Set(
            (Array.isArray(permissions.data) ? permissions.data : [])
              .filter((item) => item?.status === 'granted' && typeof item.permission === 'string')
              .map((item) => item.permission),
          );
          if (!granted.has('ads_read')) throw new Error('DEMAND_PROVIDER_READ_SCOPE_MISSING_ads_read');

          const body = await graph(`act_${adAccountId}/delivery_estimate`, {
            fields: 'estimate_mau_lower_bound,estimate_mau_upper_bound,estimate_ready',
            optimization_goal: 'REACH',
            targeting_spec: JSON.stringify(targetingSpec),
          });
          const estimate = Array.isArray(body.data) ? body.data[0] : undefined;
          if (!estimate || typeof estimate.estimate_ready !== 'boolean') {
            throw new Error('DEMAND_PROVIDER_READ_ESTIMATE_SHAPE_INVALID');
          }
          const lower = Number.isInteger(estimate.estimate_mau_lower_bound)
            ? estimate.estimate_mau_lower_bound
            : 0;
          const upper = Number.isInteger(estimate.estimate_mau_upper_bound)
            ? estimate.estimate_mau_upper_bound
            : 0;
          if (estimate.estimate_ready && (lower < 0 || upper < lower)) {
            throw new Error('DEMAND_PROVIDER_READ_ESTIMATE_BOUNDS_INVALID');
          }

          const evidence = {
            schemaVersion: 1,
            sourceSha,
            provider: 'Meta Marketing API',
            apiVersion,
            adAccountId,
            operation: 'GET delivery_estimate',
            optimizationGoal: 'REACH',
            targetingSpec,
            estimateReady: estimate.estimate_ready,
            lowerMau: lower,
            upperMau: upper,
            midpointMau: (lower + upper) / 2,
            requiredScope: 'ads_read',
            providerReadOnly: true,
            writeExecuted: false,
            verified: true,
            verifiedAt: new Date().toISOString(),
          };
          console.log(`DEMAND_PROVIDER_READ_RESULT=${JSON.stringify(evidence)}`);
          NODE
          cat > /tmp/demand-provider-read/Dockerfile <<'DOCKER'
          FROM node:24-bookworm-slim
          WORKDIR /app
          COPY read.mjs ./read.mjs
          USER node
          CMD ["node", "read.mjs"]
          DOCKER
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/demand-provider-read-temp:${GITHUB_SHA}"
          docker build -t "$IMAGE" /tmp/demand-provider-read
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "JOB_NAME=toca-demand-read-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Execute provider READ under production runtime identity
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            gcloud run jobs delete "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true
            gcloud artifacts docker images delete "$IMAGE" --delete-tags --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          gcloud run jobs deploy "$JOB_NAME" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars "META_GRAPH_API_VERSION=$META_GRAPH_API_VERSION,META_ADS_ACCOUNT_ID=$META_ADS_ACCOUNT_ID,SOURCE_SHA=$GITHUB_SHA" \
            --set-secrets "META_ACCESS_TOKEN=$TOKEN_SECRET_ID:latest" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 120s \
            --quiet
          gcloud run jobs execute "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet

          RESULT_LINE="$(gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME} AND textPayload:\"DEMAND_PROVIDER_READ_RESULT=\"" \
            --project "$GCP_PROJECT_ID" \
            --freshness=20m \
            --limit=20 \
            --order=desc \
            --format='value(textPayload)' | grep 'DEMAND_PROVIDER_READ_RESULT=' | head -n1)"
          test -n "$RESULT_LINE"
          RESULT_JSON="${RESULT_LINE#DEMAND_PROVIDER_READ_RESULT=}"
          printf '%s\n' "$RESULT_JSON" | jq -e \
            --arg sha "$GITHUB_SHA" \
            --arg account "$META_ADS_ACCOUNT_ID" '
              .schemaVersion == 1 and
              .sourceSha == $sha and
              .adAccountId == $account and
              .operation == "GET delivery_estimate" and
              .requiredScope == "ads_read" and
              .providerReadOnly == true and
              .writeExecuted == false and
              .verified == true
            ' >/dev/null
          printf '%s\n' "$RESULT_JSON" | jq . > demand-intelligence-provider-read.json
          echo 'DEMAND_INTELLIGENCE_PROVIDER_READ=VERIFIED'

      - name: Upload sanitized provider READ evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demand-intelligence-provider-read-${{ github.sha }}
          path: demand-intelligence-provider-read.json
          if-no-files-found: error
          retention-days: 90
