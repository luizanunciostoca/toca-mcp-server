name: Meta Ads The Party Itacare 2026-10-11 Feed 18-35 Create Paused

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meta-ads-the-party-itacare-2026-10-11-feed-18-35-paused.yml'
      - 'src/meta-ads-the-party-itacare-2026-10-11-add-feed-18-35-paused.ts'
      - 'src/providers/meta-ads/meta-ads-the-party-itacare-2026-10-11-feed-plan.ts'
      - 'test/meta-ads-the-party-itacare-2026-10-11-feed-plan.test.ts'

permissions:
  contents: read
  id-token: write

concurrency:
  group: meta-ads-the-party-itacare-2026-10-11-feed-18-35-paused
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_ARTIFACT_REPOSITORY: toca-mcp
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  TOKEN_SECRET_ID: toca-meta-oauth-token
  META_APP_ID: '2281930145887404'
  META_REDIRECT_URI: https://toca-meta-oauth-staging-990081828836.southamerica-east1.run.app/oauth/meta/callback
  EXPECTED_APPROVAL: APPROVED_THE_PARTY_ITACARE_1011_FEED_18_35_CREATE_PAUSED

jobs:
  create-paused:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality

      - name: Authenticate to Google Cloud and Drive
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/drive.readonly

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Hydrate exact Feed assets
        shell: bash
        env:
          DRIVE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          mkdir -p ops/meta-ads/the-party-itacare-2026-10-11
          ids=(1HRkEn3M1U-MrgHowCllceBC5kDNvVUhx 1l9nGtL4OJ9VyJtEUZju9eajloOYdqDx5 1mygYM6Lr48LOGEOzomQ5Rgy7EhIiwJ_u 1k1jYcsdpiwzXEtqoLGRUXVZcQbKo1XDl 1wOQgEsBG15nTJW6RcRRWjdC6uSeQP6Sz)
          files=(creative-01-marca.jpg creative-02-data.jpg creative-03-lineup.jpg creative-04-illusionize.jpg creative-05-lote.jpg)
          hashes=(156d87d1045efacdeaa4e9de17e33a74ab2645b7a49124e25eacd471b0f7ea85 ea9b7d263906ab62bdae043ab385d5d13e73065cf2e339e7fe44d82b43909693 31cf4408c8100026115131b270b54b27487d06eee68f251389abb87f9f2f911e fe75d300b3ab86de009a120a1ca8725c4b032defe6c37d7b949cbb6423558b02 e0d0fad62b05477a49e9efecaa78e9f3b212f44b6af544db8afb9350103b4ae4)
          for i in "${!files[@]}"; do
            path="ops/meta-ads/the-party-itacare-2026-10-11/${files[$i]}"
            curl --fail --silent --show-error --location --retry 3 -H "Authorization: Bearer $DRIVE_ACCESS_TOKEN" "https://www.googleapis.com/drive/v3/files/${ids[$i]}?alt=media" -o "$path"
            printf '%s  %s\n' "${hashes[$i]}" "$path" | sha256sum --check --strict
          done

      - name: Authenticate Docker
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - name: Build execution image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/server:meta-ads-itacare-feed-18-35-${GITHUB_SHA}"
          JOB_NAME="toca-meta-ads-itacare-feed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "JOB_NAME=$JOB_NAME" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
