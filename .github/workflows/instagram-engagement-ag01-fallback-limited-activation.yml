name: Instagram Engagement AG-01 Fallback LIMITED Activation

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: instagram-engagement-ag01-fallback-limited-activation
  cancel-in-progress: false

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  DAEMON_SERVICE: toca-managed-instagram-daemon
  AG01_SERVICE: toca-ag01-orchestrator
  SCHEDULER_JOB: toca-managed-instagram-tick
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp

jobs:
  activate:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'PRODUCTION AUTHORIZATION — Instagram AG-01 grounded fallback LIMITED activation AUTO')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35

    steps:
      - name: Checkout exact authorized controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate authorization and protected main state
        id: authz
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')" = "$GITHUB_SHA"
          ISSUE_JSON="$(jq -c '.issue' "$GITHUB_EVENT_PATH")"
          BODY="$(jq -r '.body // ""' <<< "$ISSUE_JSON")"
          ISSUE_NUMBER="$(jq -r '.number' <<< "$ISSUE_JSON")"
          jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" '.state=="open" and .user.login==$owner and (.title|startswith("PRODUCTION AUTHORIZATION — Instagram AG-01 grounded fallback LIMITED activation AUTO"))' <<< "$ISSUE_JSON" >/dev/null
          required=(
            "AUTHORIZED_CONTROLLER_SHA=$GITHUB_SHA"
            'AUTHORIZATION_STATE=ACTIVE'
            'INSTAGRAM_AG01_GROUNDED_FALLBACK_LIMITED_ACTIVATION=AUTHORIZED'
            'AUTONOMY_STAGE=LIMITED'
            'AUTO_REPLY_CHANNELS=DIRECT,COMMENT'
            'CURRENT_LIMITED_STATE_REQUIRED=true'
            'SERVICE_MUTATION_AUTHORIZED=true'
            'DATABASE_MUTATIONS_AUTHORIZED=false'
            'SCHEDULER_MUTATION_AUTHORIZED=false'
            'PROVIDER_CONFIG_MUTATION_AUTHORIZED=false'
            'GENERAL_AUTONOMY_PROMOTION_AUTHORIZED=false'
            'ZERO_TRAFFIC_STAGE_REQUIRED=true'
            'ROLLBACK_ON_FAILURE=true'
            'BATCH_SIZE=1'
          )
          for line in "${required[@]}"; do grep -Fxq "$line" <<< "$BODY" || exit 1; done
          DIGEST="$(grep '^RUNTIME_IMAGE_DIGEST=' <<< "$BODY" | tail -1 | cut -d= -f2-)"
          AG01_URL="$(grep '^AG01_SERVICE_URL=' <<< "$BODY" | tail -1 | cut -d= -f2-)"
          AG01_AUDIENCE="$(grep '^AG01_AUDIENCE=' <<< "$BODY" | tail -1 | cut -d= -f2-)"
          PREVIOUS="$(grep '^EXPECTED_PREVIOUS_REVISION=' <<< "$BODY" | tail -1 | cut -d= -f2-)"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$AG01_URL" =~ ^https://[a-z0-9-]+\.run\.app$ ]]
          test "$AG01_AUDIENCE" = "$AG01_URL"
          [[ "$PREVIOUS" =~ ^toca-managed-instagram-daemon-[a-z0-9-]+$ ]]
          CONTROL="$(gh api "repos/${GITHUB_REPOSITORY}/issues/640" --jq '.body // ""')"
          for line in 'MAIN_STABILITY=PASS' "EVALUATED_MAIN_SHA=$GITHUB_SHA" 'MERGE_RESERVATION=NONE' 'ENGAGEMENT_AUTONOMY_STAGE=LIMITED' 'ENGAGEMENT_AUTO_REPLY_CHANNELS=DIRECT,COMMENT' 'DIRECT_LIMITED_RUNTIME_ACTIVE=true' 'COMMENT_LIMITED_RUNTIME_ACTIVE=true' 'GENERAL_AUTONOMY=false'; do
            grep -Fxq "$line" <<< "$CONTROL" || exit 1
          done
          echo "authorization_issue=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "runtime_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "runtime_image=$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/server@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "ag01_url=$AG01_URL" >> "$GITHUB_OUTPUT"
          echo "ag01_audience=$AG01_AUDIENCE" >> "$GITHUB_OUTPUT"
          echo "expected_previous_revision=$PREVIOUS" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Exact-head Quality Gate
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm quality

      - name: Authenticate governed deployer
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Verify immutable image AG-01 privacy and LIMITED prestate
        id: prestate
        env:
          RUNTIME_IMAGE: ${{ steps.authz.outputs.runtime_image }}
          RUNTIME_DIGEST: ${{ steps.authz.outputs.runtime_digest }}
          AG01_URL: ${{ steps.authz.outputs.ag01_url }}
          EXPECTED_PREVIOUS_REVISION: ${{ steps.authz.outputs.expected_previous_revision }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud artifacts docker images describe "$RUNTIME_IMAGE" --project "$PROJECT_ID" --format='value(image_summary.digest)')" = "$RUNTIME_DIGEST"
          SERVICE_JSON="$(gcloud run services describe "$DAEMON_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          PRE_REVISION="$(jq -r '[.status.traffic[]? | select((.percent//0)==100 and (.revisionName//"")!="") | .revisionName] | if length==1 then .[0] else empty end' <<< "$SERVICE_JSON")"
          test "$PRE_REVISION" = "$EXPECTED_PREVIOUS_REVISION"
          PRE_JSON="$(gcloud run revisions describe "$PRE_REVISION" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          jq -e --arg sa "$RUNTIME_SERVICE_ACCOUNT" '.spec.serviceAccountName==$sa and ([.status.conditions[]? | select(.type=="Ready") | .status]|last)=="True" and ([.spec.containers[0].env[]? | select(.name=="INSTAGRAM_ENGAGEMENT_RUNTIME_ENABLED") | .value]|last)=="true" and ([.spec.containers[0].env[]? | select(.name=="INSTAGRAM_ENGAGEMENT_WRITES_ENABLED") | .value]|last)=="true" and ([.spec.containers[0].env[]? | select(.name=="INSTAGRAM_ENGAGEMENT_BATCH_SIZE") | .value]|last)=="1" and ([.spec.containers[0].env[]? | select(.name=="INSTAGRAM_ENGAGEMENT_AUTO_REPLY_CHANNELS") | .value]|last)=="DIRECT,COMMENT" and (([.spec.containers[0].env[]? | select(.name=="INSTAGRAM_PUBLICATION_WRITES_ENABLED") | .value]|last//"false")=="false")' <<< "$PRE_JSON" >/dev/null
          AG01_JSON="$(gcloud run services describe "$AG01_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          test "$(jq -r '.status.url // empty' <<< "$AG01_JSON")" = "$AG01_URL"
          AG01_REVISION="$(jq -r '[.status.traffic[]? | select((.percent//0)==100 and (.revisionName//"")!="") | .revisionName] | if length==1 then .[0] else empty end' <<< "$AG01_JSON")"
          test -n "$AG01_REVISION"
          AG01_REV_JSON="$(gcloud run revisions describe "$AG01_REVISION" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          jq -e '([.status.conditions[]? | select(.type=="Ready") | .status]|last)=="True"' <<< "$AG01_REV_JSON" >/dev/null
          AG01_IAM="$(gcloud run services get-iam-policy "$AG01_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          ! jq -e '.bindings[]? | select(.role=="roles/run.invoker") | (.members//[])[]? | select(.=="allUsers")' <<< "$AG01_IAM" >/dev/null
          SCHEDULER_JSON="$(gcloud scheduler jobs describe "$SCHEDULER_JOB" --project "$PROJECT_ID" --location "$REGION" --format=json)"
          FINGERPRINT="$(jq -c '{state,schedule,timeZone,httpTarget}' <<< "$SCHEDULER_JSON" | sha256sum | awk '{print $1}')"
          echo "pre_revision=$PRE_REVISION" >> "$GITHUB_OUTPUT"
          echo "scheduler_fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "ag01_revision=$AG01_REVISION" >> "$GITHUB_OUTPUT"

      - name: Mint AG-01 private health token
        id: ag01_token
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.authz.outputs.ag01_audience }}
          create_credentials_file: false
          export_environment_variables: false

      - name: Revalidate grounded AG-01 base before daemon mutation
        env:
          ID_TOKEN: ${{ steps.ag01_token.outputs.id_token }}
          AG01_URL: ${{ steps.authz.outputs.ag01_url }}
        shell: bash
        run: |
          set -euo pipefail
          for path in health ready; do
            test "$(curl --silent --show-error -o "/tmp/ag01-${path}.json" -w '%{http_code}' -H "Authorization: Bearer $ID_TOKEN" "$AG01_URL/$path")" = 200
          done
          jq -n --arg key "ig-fallback-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '{idempotencyKey:$key,message:"Que horas começa o Sunset?",expectedIntent:"EVENT_INFO",correlationId:$key}' >/tmp/ag01-request.json
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $ID_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/ag01-request.json "$AG01_URL/v1/knowledge/answer" >/tmp/ag01-answer.json
          jq -e '.status=="GROUNDED" and (.confidence>=0.85) and (.citedResourceIds|length>0)' /tmp/ag01-answer.json >/dev/null

      - name: Stage daemon candidate with grounded fallback at zero traffic
        id: stage
        env:
          RUNTIME_IMAGE: ${{ steps.authz.outputs.runtime_image }}
          RUNTIME_DIGEST: ${{ steps.authz.outputs.runtime_digest }}
          AG01_URL: ${{ steps.authz.outputs.ag01_url }}
          AG01_AUDIENCE: ${{ steps.authz.outputs.ag01_audience }}
          PRE_REVISION: ${{ steps.prestate.outputs.pre_revision }}
        shell: bash
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA::8}"
          SUFFIX="ag01-${SHORT}-${GITHUB_RUN_ATTEMPT}"
          CANDIDATE="${DAEMON_SERVICE}-${SUFFIX}"
          gcloud run deploy "$DAEMON_SERVICE" --project "$PROJECT_ID" --region "$REGION" --image "$RUNTIME_IMAGE" --revision-suffix "$SUFFIX" --update-env-vars "INSTAGRAM_ENGAGEMENT_AG01_GROUNDED_FALLBACK_ENABLED=true,INSTAGRAM_ENGAGEMENT_AG01_SERVICE_URL=$AG01_URL,INSTAGRAM_ENGAGEMENT_AG01_AUDIENCE=$AG01_AUDIENCE,INSTAGRAM_ENGAGEMENT_AG01_TIMEOUT_MS=8000" --no-traffic --quiet
          REV_JSON="$(gcloud run revisions describe "$CANDIDATE" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          jq -e --arg sa "$RUNTIME_SERVICE_ACCOUNT" --arg digest "$RUNTIME_DIGEST" --arg url "$AG01_URL" --arg audience "$AG01_AUDIENCE" '.spec.serviceAccountName==$sa and ([.status.conditions[]? | select(.type=="Ready") | .status]|last)=="True" and (.spec.containers[0].image|contains($digest)) and ([.spec.containers[0].env[]? | select(.name=="INSTAGRAM_ENGAGEMENT_RUNTIME_ENABLED") | .value]|last)=="true" and ([.spec.containers[0].env[]? | select(.name=="INSTAGRAM_ENGAGEMENT_WRITES_ENABLED") | .value]|last)=="true" and ([.spec.containers[0].env[]? | select(.name=="INSTAGRAM_ENGAGEMENT_BATCH_SIZE") | .value]|last)=="1" and ([.spec.containers[0].env[]? | select(.name=="INSTAGRAM_ENGAGEMENT_AUTO_REPLY_CHANNELS") | .value]|last)=="DIRECT,COMMENT" and (([.spec.containers[0].env[]? | select(.name=="INSTAGRAM_PUBLICATION_WRITES_ENABLED") | .value]|last//"false")=="false") and ([.spec.containers[0].env[]? | select(.name=="INSTAGRAM_ENGAGEMENT_AG01_GROUNDED_FALLBACK_ENABLED") | .value]|last)=="true" and ([.spec.containers[0].env[]? | select(.name=="INSTAGRAM_ENGAGEMENT_AG01_SERVICE_URL") | .value]|last)==$url and ([.spec.containers[0].env[]? | select(.name=="INSTAGRAM_ENGAGEMENT_AG01_AUDIENCE") | .value]|last)==$audience and ([.spec.containers[0].env[]? | select(.name=="INSTAGRAM_ENGAGEMENT_AG01_TIMEOUT_MS") | .value]|last)=="8000"' <<< "$REV_JSON" >/dev/null
          SERVICE_JSON="$(gcloud run services describe "$DAEMON_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          jq -e --arg candidate "$CANDIDATE" --arg previous "$PRE_REVISION" '([.status.traffic[]? | select(.revisionName==$candidate) | (.percent//0)]|add//0)==0 and ([.status.traffic[]? | select(.revisionName==$previous) | (.percent//0)]|add//0)==100' <<< "$SERVICE_JSON" >/dev/null
          echo "candidate_revision=$CANDIDATE" >> "$GITHUB_OUTPUT"

      - name: Cut over exact candidate transactionally and verify LIMITED readback
        id: promote
        env:
          CANDIDATE: ${{ steps.stage.outputs.candidate_revision }}
          PRE_REVISION: ${{ steps.prestate.outputs.pre_revision }}
          PRE_SCHEDULER_FINGERPRINT: ${{ steps.prestate.outputs.scheduler_fingerprint }}
          EXPECTED_AG01_REVISION: ${{ steps.prestate.outputs.ag01_revision }}
          RUNTIME_DIGEST: ${{ steps.authz.outputs.runtime_digest }}
          AG01_URL: ${{ steps.authz.outputs.ag01_url }}
          AG01_AUDIENCE: ${{ steps.authz.outputs.ag01_audience }}
        shell: bash
        run: |
          set -euo pipefail
          current_revision(){ gcloud run services describe "$DAEMON_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json | jq -r '[.status.traffic[]? | select((.percent//0)==100 and (.revisionName//"")!="") | .revisionName] | if length==1 then .[0] else empty end'; }
          scheduler_fingerprint(){ gcloud scheduler jobs describe "$SCHEDULER_JOB" --project "$PROJECT_ID" --location "$REGION" --format=json | jq -c '{state,schedule,timeZone,httpTarget}' | sha256sum | awk '{print $1}'; }
          current_ag01(){ gcloud run services describe "$AG01_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json | jq -r '[.status.traffic[]? | select((.percent//0)==100 and (.revisionName//"")!="") | .revisionName] | if length==1 then .[0] else empty end'; }
          rollback(){
            [[ "${TRAFFIC_CHANGED:-false}" == true ]] || return 0
            [[ "$(current_revision)" == "$CANDIDATE" ]] || return 0
            gcloud run services update-traffic "$DAEMON_SERVICE" --project "$PROJECT_ID" --region "$REGION" --to-revisions "$PRE_REVISION=100" --quiet
          }
          test "$(current_revision)" = "$PRE_REVISION"
          test "$(scheduler_fingerprint)" = "$PRE_SCHEDULER_FINGERPRINT"
          test "$(current_ag01)" = "$EXPECTED_AG01_REVISION"
          AG01_IAM="$(gcloud run services get-iam-policy "$AG01_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          ! jq -e '.bindings[]? | select(.role=="roles/run.invoker") | (.members//[])[]? | select(.=="allUsers")' <<< "$AG01_IAM" >/dev/null
          TRAFFIC_CHANGED=false
          trap rollback ERR
          gcloud run services update-traffic "$DAEMON_SERVICE" --project "$PROJECT_ID" --region "$REGION" --to-revisions "$CANDIDATE=100" --quiet
          TRAFFIC_CHANGED=true
          echo 'traffic_changed=true' >> "$GITHUB_OUTPUT"
          test "$(current_revision)" = "$CANDIDATE"
          REV_JSON="$(gcloud run revisions describe "$CANDIDATE" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          jq -e --arg digest "$RUNTIME_DIGEST" --arg url "$AG01_URL" --arg audience "$AG01_AUDIENCE" '(.spec.containers[0].image|contains($digest)) and ([.spec.containers[0].env[]? | select(.name=="INSTAGRAM_ENGAGEMENT_AUTO_REPLY_CHANNELS") | .value]|last)=="DIRECT,COMMENT" and ([.spec.containers[0].env[]? | select(.name=="INSTAGRAM_ENGAGEMENT_AG01_GROUNDED_FALLBACK_ENABLED") | .value]|last)=="true" and ([.spec.containers[0].env[]? | select(.name=="INSTAGRAM_ENGAGEMENT_AG01_SERVICE_URL") | .value]|last)==$url and ([.spec.containers[0].env[]? | select(.name=="INSTAGRAM_ENGAGEMENT_AG01_AUDIENCE") | .value]|last)==$audience and (([.spec.containers[0].env[]? | select(.name=="INSTAGRAM_PUBLICATION_WRITES_ENABLED") | .value]|last//"false")=="false")' <<< "$REV_JSON" >/dev/null
          test "$(scheduler_fingerprint)" = "$PRE_SCHEDULER_FINGERPRINT"
          test "$(current_ag01)" = "$EXPECTED_AG01_REVISION"
          AG01_IAM="$(gcloud run services get-iam-policy "$AG01_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json)"
          ! jq -e '.bindings[]? | select(.role=="roles/run.invoker") | (.members//[])[]? | select(.=="allUsers")' <<< "$AG01_IAM" >/dev/null
          trap - ERR

      - name: Publish sanitized activation evidence
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.authz.outputs.authorization_issue }}
          CANDIDATE: ${{ steps.stage.outputs.candidate_revision }}
          DIGEST: ${{ steps.authz.outputs.runtime_digest }}
          AG01_REVISION: ${{ steps.prestate.outputs.ag01_revision }}
        shell: bash
        run: |
          set -euo pipefail
          printf -v COMMENT '%s\n' 'INSTAGRAM_AG01_GROUNDED_FALLBACK_ACTIVATION_STATUS=PASS' "RUNTIME_SOURCE_SHA=$GITHUB_SHA" "RUNTIME_IMAGE_DIGEST=$DIGEST" "PROMOTED_REVISION=$CANDIDATE" 'TRAFFIC_PERCENT=100' 'AUTONOMY_STAGE=LIMITED' 'AUTO_REPLY_CHANNELS=DIRECT,COMMENT' 'GENERAL_AUTONOMY=false' 'AG01_GROUNDED_FALLBACK_ENABLED=true' "AG01_REVISION=$AG01_REVISION" 'DATABASE_MUTATIONS=false' 'SCHEDULER_MUTATION=false' 'PROVIDER_CONFIG_MUTATION=false'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="$COMMENT" >/dev/null
          printf '%s\n' "$COMMENT" >> "$GITHUB_STEP_SUMMARY"

      - name: Consume single-use authorization
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.authz.outputs.authorization_issue }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ISSUE_NUMBER:-}" ]] || exit 0
          BODY="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" --jq '.body // ""')"
          UPDATED="$(printf '%s' "$BODY" | sed 's/^AUTHORIZATION_STATE=ACTIVE$/AUTHORIZATION_STATE=CONSUMED/')"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" -f body="$UPDATED" -f state=closed >/dev/null
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="AUTHORIZATION_CONSUMED=true\nWORKFLOW_STATUS=$JOB_STATUS\nREUSE_PROHIBITED=true" >/dev/null

      - name: Roll back if any post-cutover step failed
        if: failure() && steps.promote.outputs.traffic_changed == 'true'
        env:
          CANDIDATE: ${{ steps.stage.outputs.candidate_revision }}
          PRE_REVISION: ${{ steps.prestate.outputs.pre_revision }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(gcloud run services describe "$DAEMON_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json | jq -r '[.status.traffic[]? | select((.percent//0)==100) | .revisionName] | if length==1 then .[0] else empty end')"
          if [[ "$CURRENT" == "$CANDIDATE" ]]; then
            gcloud run services update-traffic "$DAEMON_SERVICE" --project "$PROJECT_ID" --region "$REGION" --to-revisions "$PRE_REVISION=100" --quiet
          fi
          FINAL="$(gcloud run services describe "$DAEMON_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json | jq -r '[.status.traffic[]? | select((.percent//0)==100) | .revisionName] | if length==1 then .[0] else empty end')"
          test "$FINAL" = "$PRE_REVISION" || test "$FINAL" != "$CANDIDATE"
