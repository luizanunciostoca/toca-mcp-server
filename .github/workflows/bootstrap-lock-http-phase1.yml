name: Bootstrap Lock Remote MCP Phase 1

on:
  push:
    branches: [feat/meta-connection-phase-1]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/meta-connection-phase-1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --lockfile-only
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --quiet || git commit -m "chore: refresh lockfile for remote MCP runtime"
          git push origin HEAD:feat/meta-connection-phase-1
