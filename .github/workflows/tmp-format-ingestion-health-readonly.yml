name: TEMP Format Ingestion Health Readonly

on:
  push:
    branches:
      - feat/instagram-ingestion-health-readonly

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Format only the two TS files
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            src/ops/instagram-engagement-ingestion-health-readonly.ts \
            test/instagram-engagement-ingestion-health-readonly.test.ts
          git diff --exit-code -- .github/workflows/instagram-engagement-ingestion-health-readonly.yml

      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/ops/instagram-engagement-ingestion-health-readonly.ts \
            test/instagram-engagement-ingestion-health-readonly.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style(instagram): format ingestion health diagnostic'
          git push origin HEAD:feat/instagram-ingestion-health-readonly
