name: Persist SUN-0087 Creative Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/persist-sun0087-once.yml'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  CREATIVE_BUCKET: toca-mcp-creative-assets
  SOURCE_ASSET_ID: SUN-0087
  SOURCE_DRIVE_FILE_ID: 1j6cUBD82Hw8an3Bu9Cx19WesaUF4Gr7b
  CREATIVE_OBJECT: creatives/MKT-20260813-SUNSET-FEED-0900/v1.jpg

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm quality

      - name: Install local image runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick

      - name: Authenticate to Google Cloud and Drive
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/drive.readonly

      - uses: google-github-actions/setup-gcloud@v2

      - name: Download canonical Drive source
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          mkdir -p .creative-once
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GOOGLE_ACCESS_TOKEN}" \
            "https://www.googleapis.com/drive/v3/files/${SOURCE_DRIVE_FILE_ID}?alt=media&supportsAllDrives=true" \
            --output .creative-once/source.jpg
          test -s .creative-once/source.jpg

      - name: Enhance exact source locally
        run: |
          set -euo pipefail
          pnpm dev:marketing-autopilot-image-edit \
            --source .creative-once/source.jpg \
            --output .creative-once/output.jpg \
            --source-asset-id "$SOURCE_ASSET_ID" \
            --source-drive-file-id "$SOURCE_DRIVE_FILE_ID" \
            --content-type image/jpeg \
            --provider local \
            | tee .creative-once/command.log
          tail -n 1 .creative-once/command.log > .creative-once/result.json
          jq -e '.sourceImageBound == true and .editorProvider == "LOCAL_IMAGEMAGICK" and .pipelineVersion == "local-photo-enhancer-v1"' .creative-once/result.json >/dev/null
          sha256sum .creative-once/output.jpg | awk '{print $1}' > .creative-once/local.sha256

      - name: Reconcile private canonical creative bucket
        run: |
          set -euo pipefail
          BUCKET_URI="gs://${CREATIVE_BUCKET}"
          if ! gcloud storage buckets describe "$BUCKET_URI" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud storage buckets create "$BUCKET_URI" \
              --project "$GCP_PROJECT_ID" \
              --location "$GCP_REGION" \
              --uniform-bucket-level-access \
              --public-access-prevention
          fi
          gcloud storage buckets update "$BUCKET_URI" \
            --project "$GCP_PROJECT_ID" \
            --uniform-bucket-level-access \
            --public-access-prevention

      - name: Persist canonical creative
        run: |
          set -euo pipefail
          URI="gs://${CREATIVE_BUCKET}/${CREATIVE_OBJECT}"
          gcloud storage cp .creative-once/output.jpg "$URI" --project "$GCP_PROJECT_ID"
          gcloud storage cp "$URI" .creative-once/persisted.jpg --project "$GCP_PROJECT_ID"
          sha256sum .creative-once/persisted.jpg | awk '{print $1}' > .creative-once/persisted.sha256
          test "$(cat .creative-once/local.sha256)" = "$(cat .creative-once/persisted.sha256)"
          gcloud storage objects describe "$URI" --project "$GCP_PROJECT_ID" --format=json > .creative-once/persisted.json
          echo "$URI" > .creative-once/creative-uri.txt
          echo "CANONICAL_CREATIVE_URI=$URI"

      - name: Upload execution evidence
        uses: actions/upload-artifact@v4
        with:
          name: sun-0087-canonical-creative-evidence
          path: |
            .creative-once/result.json
            .creative-once/local.sha256
            .creative-once/persisted.sha256
            .creative-once/persisted.json
            .creative-once/creative-uri.txt
          retention-days: 7
