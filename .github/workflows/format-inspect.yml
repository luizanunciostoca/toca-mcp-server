name: Format Inspect

on:
  push:
    branches:
      - feat/instagram-engagement-messaging
    paths:
      - .github/workflows/format-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write test/meta-assets.test.ts
      - run: cat test/meta-assets.test.ts
