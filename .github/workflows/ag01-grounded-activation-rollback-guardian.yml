name: AG-01 Grounded Activation Rollback Guardian

on:
  workflow_run:
    workflows:
      - AG-01 Grounded Runtime Activation
      - Instagram Engagement AG-01 Fallback LIMITED Activation
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: read
  id-token: write

# These are the producers' existing writer mutexes, including callback writers.
# Irrelevant events cannot cancel a pending recovery in either service's group.
concurrency:
  group: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.name == 'AG-01 Grounded Runtime Activation' && 'ag01-grounded-runtime-activation' || 'instagram-engagement-webhook-callback-control') || format('ag01-guardian-irrelevant-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp

jobs:
  rollback:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout protected main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Refuse stale failed run
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FAILED_HEAD_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')" = "$FAILED_HEAD_SHA"

      - name: Verify failed attempt and immutable pre-stage context before credentials
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: node scripts/ag01-activation-rollback-guard.mjs guardian-context

      - name: Authenticate bounded rollback identity
        if: steps.context.outputs.context_verified == 'true'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        if: steps.context.outputs.context_verified == 'true'
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Restore only this instance while its candidate still owns all traffic
        if: steps.context.outputs.context_verified == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_KIND: ${{ steps.context.outputs.kind }}
        shell: bash
        run: node scripts/ag01-activation-rollback-guard.mjs rollback "$RECOVERY_KIND"
