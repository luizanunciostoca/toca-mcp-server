name: Temporary Autopilot Corrective Patch

on:
  push:
    branches:
      - ops/restore-marketing-autopilot-gcp-scheduler-20260916
    paths:
      - .github/workflows/tmp-autopilot-corrective-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ops/restore-marketing-autopilot-gcp-scheduler-20260916
          persist-credentials: true
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact corrective patches
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label} mismatch count={count}')
              return updated

          registry = Path('scripts/marketing-autopilot-registry.mjs')
          text = registry.read_text()
          text = replace_once(
              text,
              r"async function recordPrecheck\(\) \{.*?\n\}\n\n(?=async function reconcilePublication\(\) \{)",
              '''async function recordPrecheck() {
            const sheet = await readContentSheet();
            const item = findRow(sheet, contentItemId).object;
            const scheduledAt = text(item.scheduled_at);
            const schedulingStatus = text(item.scheduling_status);
            assert(scheduledAt, 'AUTOPILOT_PRECHECK_SCHEDULED_AT_REQUIRED');
            assert(
              schedulingStatus === 'CANARY_READY' || schedulingStatus === 'LIMITED_READY_AFTER_CANARY',
              `AUTOPILOT_PRECHECK_SCHEDULING_STATUS_INVALID:${schedulingStatus}`,
            );
            const now = formatBahia(new Date());
            await appendSchedulerLog([
              `AUTOPILOT-PRECHECK-${process.env.GITHUB_RUN_ID ?? 'local'}`,
              now,
              contentItemId,
              process.env.GITHUB_RUN_ID ?? '',
              'GITHUB_ACTIONS_CONTROL_PLANE',
              scheduledAt,
              'PRECHECK',
              schedulingStatus,
              '0',
              '0',
              '',
              'NOT_CALLED',
              '',
              '',
              `run=${process.env.GITHUB_RUN_ID ?? ''};sha=${process.env.GITHUB_SHA ?? ''};provider_called=false;writer=${policy.canonicalWriter.workflow}`,
              policy.policyId,
            ]);
          }

          ''',
              'recordPrecheck',
              re.S,
          )
          text = replace_once(
              text,
              r"  assert\(\s*text\(row\.object\.master_drive_file_id\) === command\.driveFileId,\s*'AUTOPILOT_REGISTRY_DRIVE_FILE_DRIFT',\s*\);",
              '''  const deliveryDriveFileId =
            text(row.object.format) === 'STORY'
              ? text(row.object.story_drive_file_id)
              : text(row.object.master_drive_file_id);
          assert(deliveryDriveFileId === command.driveFileId, 'AUTOPILOT_REGISTRY_DRIVE_FILE_DRIFT');''',
              'delivery drive binding',
              re.S,
          )
          legacy = "'GCP_PUBLISH_NOW_AUTOPILOT_CANARY'"
          if text.count(legacy) != 2:
              raise SystemExit(f'legacy policy marker mismatch count={text.count(legacy)}')
          text = text.replace(legacy, 'policy.policyId')
          registry.write_text(text)

          workflow = Path('.github/workflows/marketing-autopilot-publication.yml')
          text = workflow.read_text()
          start_marker = '''          baseline_run_id="$(jq -r '.rollout.providerReconciliationBaseline.runId' "$POLICY_PATH")"'''
          end_marker = '''          writer_runs_json="$(gh api --paginate -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/actions/workflows/marketing-publish-now.yml/runs?event=workflow_dispatch&per_page=100" --jq '.workflow_runs')"'''
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(f'baseline structural markers missing start={start} end={end}')
          replacement = '''          baseline_run_id="$(jq -r '.rollout.providerReconciliationBaseline.runId' "$POLICY_PATH")"
          baseline_completed_at="$(jq -r '.rollout.providerReconciliationBaseline.completedAt' "$POLICY_PATH")"
          baseline_content_item="$(jq -r '.rollout.providerReconciliationBaseline.contentItemId' "$POLICY_PATH")"
          if [ "$baseline_content_item" = "$CONTENT_ITEM_ID" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${baseline_run_id}" > /tmp/baseline-run.json
            jq -e \\
              --arg completed "$baseline_completed_at" '
                .name == "Instagram GCP Publication Recovery Preflight" and
                .status == "completed" and
                .conclusion == "success" and
                .updated_at == $completed
              ' /tmp/baseline-run.json >/dev/null
            echo "MARKETING_AUTOPILOT_PROVIDER_BASELINE=VERIFIED run_id=$baseline_run_id"
          else
            baseline_completed_at='1970-01-01T00:00:00Z'
            baseline_run_id='NONE'
            echo 'MARKETING_AUTOPILOT_PROVIDER_BASELINE=NOT_APPLICABLE_STRICT_HISTORY_SCAN'
          fi
          '''
          text = text[:start] + replacement + text[end:]
          workflow.write_text(text)

          test_path = Path('test/marketing-autopilot-scheduler-restoration.test.ts')
          text = test_path.read_text()
          title = "it('rejects an unapproved Story final instead of falling back to a source asset'"
          test_start = text.find(title)
          if test_start < 0:
              raise SystemExit('Story rejection test title missing')
          block_start = text.find('    expect(parseOutput(result.stdout)).toMatchObject({', test_start)
          block_end = text.find('    });', block_start)
          if block_start < 0 or block_end < 0:
              raise SystemExit(f'Story assertion markers missing start={block_start} end={block_end}')
          block_end += len('    });')
          replacement = '''    const output = parseOutput(result.stdout);
            expect(output).toMatchObject({ status: 'NO_CANDIDATE', rolloutPhase: 'LIMITED' });
            if (typeof output !== 'object' || output === null || !('rejected' in output)) {
              throw new Error('AUTOPILOT_TEST_REJECTIONS_MISSING');
            }
            const rejected = (output as { rejected?: unknown }).rejected;
            expect(Array.isArray(rejected)).toBe(true);
            const storyRejected = (rejected as unknown[]).some((item) => {
              if (typeof item !== 'object' || item === null) return false;
              const record = item as Record<string, unknown>;
              return (
                record.contentItemId === storyId &&
                record.reason === 'AUTOPILOT_STORY_STATUS_INVALID'
              );
            });
            expect(storyRejected).toBe(true);'''
          text = text[:block_start] + replacement + text[block_end:]
          test_path.write_text(text)
          PY
      - name: Format and validate touched files
        run: |
          pnpm exec prettier --write scripts/marketing-autopilot-registry.mjs .github/workflows/marketing-autopilot-publication.yml test/marketing-autopilot-scheduler-restoration.test.ts
          pnpm exec eslint scripts/marketing-autopilot-registry.mjs test/marketing-autopilot-scheduler-restoration.test.ts
          pnpm exec vitest run test/marketing-autopilot-registry-reconciliation.test.ts test/marketing-autopilot-scheduler-restoration.test.ts test/github-native-instagram-publication-boundary.test.ts
      - name: Commit corrective patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TOCA OS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/marketing-autopilot-registry.mjs .github/workflows/marketing-autopilot-publication.yml test/marketing-autopilot-scheduler-restoration.test.ts
          git diff --cached --check
          git commit -m 'fix(marketing): reconcile daily feed and story rollout'
          git push origin HEAD:ops/restore-marketing-autopilot-gcp-scheduler-20260916
