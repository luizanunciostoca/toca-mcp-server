name: Temporary Autopilot Corrective Patch

on:
  push:
    branches:
      - ops/restore-marketing-autopilot-gcp-scheduler-20260916
    paths:
      - .github/workflows/tmp-autopilot-corrective-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ops/restore-marketing-autopilot-gcp-scheduler-20260916
          persist-credentials: true
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact corrective patches
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          registry = Path('scripts/marketing-autopilot-registry.mjs')
          text = registry.read_text()

          record_pattern = re.compile(
              r"async function recordPrecheck\(\) \{.*?\n\}\n\nasync function reconcilePublication\(\) \{",
              re.S,
          )
          record_replacement = '''async function recordPrecheck() {
            const sheet = await readContentSheet();
            const item = findRow(sheet, contentItemId).object;
            const scheduledAt = text(item.scheduled_at);
            const schedulingStatus = text(item.scheduling_status);
            assert(scheduledAt, 'AUTOPILOT_PRECHECK_SCHEDULED_AT_REQUIRED');
            assert(
              schedulingStatus === 'CANARY_READY' || schedulingStatus === 'LIMITED_READY_AFTER_CANARY',
              `AUTOPILOT_PRECHECK_SCHEDULING_STATUS_INVALID:${schedulingStatus}`,
            );
            const now = formatBahia(new Date());
            await appendSchedulerLog([
              `AUTOPILOT-PRECHECK-${process.env.GITHUB_RUN_ID ?? 'local'}`,
              now,
              contentItemId,
              process.env.GITHUB_RUN_ID ?? '',
              'GITHUB_ACTIONS_CONTROL_PLANE',
              scheduledAt,
              'PRECHECK',
              schedulingStatus,
              '0',
              '0',
              '',
              'NOT_CALLED',
              '',
              '',
              `run=${process.env.GITHUB_RUN_ID ?? ''};sha=${process.env.GITHUB_SHA ?? ''};provider_called=false;writer=${policy.canonicalWriter.workflow}`,
              policy.policyId,
            ]);
          }

          async function reconcilePublication() {'''
          text, count = record_pattern.subn(record_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'recordPrecheck block mismatch count={count}')

          drive_pattern = re.compile(
              r"\s{2}assert\(\n\s{4}text\(row\.object\.master_drive_file_id\) === command\.driveFileId,\n\s{4}'AUTOPILOT_REGISTRY_DRIVE_FILE_DRIFT',\n\s{2}\);"
          )
          drive_replacement = '''  const deliveryDriveFileId =
            text(row.object.format) === 'STORY'
              ? text(row.object.story_drive_file_id)
              : text(row.object.master_drive_file_id);
          assert(deliveryDriveFileId === command.driveFileId, 'AUTOPILOT_REGISTRY_DRIVE_FILE_DRIFT');'''
          text, count = drive_pattern.subn(drive_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'drive binding block mismatch count={count}')

          old_policy = "scheduling_policy: 'GCP_PUBLISH_NOW_AUTOPILOT_CANARY',"
          if text.count(old_policy) != 1:
              raise SystemExit(f'scheduling policy write mismatch count={text.count(old_policy)}')
          text = text.replace(old_policy, 'scheduling_policy: policy.policyId,', 1)

          old_log_policy = "    'GCP_PUBLISH_NOW_AUTOPILOT_CANARY',\n  ]);"
          if text.count(old_log_policy) != 1:
              raise SystemExit(f'scheduler log policy mismatch count={text.count(old_log_policy)}')
          text = text.replace(old_log_policy, '    policy.policyId,\n  ]);', 1)
          registry.write_text(text)

          workflow = Path('.github/workflows/marketing-autopilot-publication.yml')
          text = workflow.read_text()
          baseline_pattern = re.compile(
              r'''          baseline_run_id="\$\(jq -r '\.rollout\.providerReconciliationBaseline\.runId' "\$POLICY_PATH"\)"\n'''
              r'''          baseline_completed_at="\$\(jq -r '\.rollout\.providerReconciliationBaseline\.completedAt' "\$POLICY_PATH"\)"\n'''
              r'''          baseline_content_item="\$\(jq -r '\.rollout\.providerReconciliationBaseline\.contentItemId' "\$POLICY_PATH"\)"\n'''
              r'''          test "\$baseline_content_item" = "\$CONTENT_ITEM_ID"\n'''
              r'''          gh api "repos/\$\{GITHUB_REPOSITORY\}/actions/runs/\$\{baseline_run_id\}" > /tmp/baseline-run\.json\n'''
              r'''          jq -e \\\n'''
              r'''            --arg completed "\$baseline_completed_at" '\n'''
              r'''              \.name == "Instagram GCP Publication Recovery Preflight" and\n'''
              r'''              \.status == "completed" and\n'''
              r'''              \.conclusion == "success" and\n'''
              r'''              \.updated_at == \$completed\n'''
              r'''            ' /tmp/baseline-run\.json >/dev/null\n'''
          )
          baseline_replacement = '''          baseline_run_id="$(jq -r '.rollout.providerReconciliationBaseline.runId' "$POLICY_PATH")"
                    baseline_completed_at="$(jq -r '.rollout.providerReconciliationBaseline.completedAt' "$POLICY_PATH")"
                    baseline_content_item="$(jq -r '.rollout.providerReconciliationBaseline.contentItemId' "$POLICY_PATH")"
                    if [ "$baseline_content_item" = "$CONTENT_ITEM_ID" ]; then
                      gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${baseline_run_id}" > /tmp/baseline-run.json
                      jq -e \\
                        --arg completed "$baseline_completed_at" '
                          .name == "Instagram GCP Publication Recovery Preflight" and
                          .status == "completed" and
                          .conclusion == "success" and
                          .updated_at == $completed
                        ' /tmp/baseline-run.json >/dev/null
                      echo "MARKETING_AUTOPILOT_PROVIDER_BASELINE=VERIFIED run_id=$baseline_run_id"
                    else
                      baseline_completed_at='1970-01-01T00:00:00Z'
                      baseline_run_id='NONE'
                      echo 'MARKETING_AUTOPILOT_PROVIDER_BASELINE=NOT_APPLICABLE_STRICT_HISTORY_SCAN'
                    fi
          '''
          text, count = baseline_pattern.subn(baseline_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'baseline guard block mismatch count={count}')
          workflow.write_text(text)
          PY
      - name: Format and validate touched files
        run: |
          pnpm exec prettier --write scripts/marketing-autopilot-registry.mjs .github/workflows/marketing-autopilot-publication.yml
          pnpm exec eslint scripts/marketing-autopilot-registry.mjs
          pnpm exec vitest run test/marketing-autopilot-registry-reconciliation.test.ts test/marketing-autopilot-scheduler-restoration.test.ts test/github-native-instagram-publication-boundary.test.ts
      - name: Commit corrective patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TOCA OS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/marketing-autopilot-registry.mjs .github/workflows/marketing-autopilot-publication.yml
          git diff --cached --check
          git commit -m 'fix(marketing): reconcile daily feed and story rollout'
          git push origin HEAD:ops/restore-marketing-autopilot-gcp-scheduler-20260916
