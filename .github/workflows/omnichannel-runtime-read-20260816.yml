name: Omnichannel Runtime Read 2026-08-16

on:
  push:
    branches:
      - ops/omnichannel-runtime-read-20260816

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_REGION: southamerica-east1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_DEPLOY_SERVICE_ACCOUNT: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  PROD_SERVICE: toca-mcp-production

jobs:
  runtime-read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate deployer to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Read deployed runtime and provider bindings without secret values
        shell: bash
        run: |
          set -euo pipefail

          gcloud run services describe "$PROD_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=json > /tmp/service.json

          jq -c '{
            service: (.metadata.name // null),
            latestReadyRevision: (.status.latestReadyRevisionName // null),
            runtimeServiceAccount: (.spec.template.spec.serviceAccountName // null),
            image: (.spec.template.spec.containers[0].image // null),
            envNames: [(.spec.template.spec.containers[0].env // [])[]?.name] | sort,
            secretBindings: [(.spec.template.spec.containers[0].env // [])[]? | select(.valueFrom.secretKeyRef != null) | {env: .name, secret: .valueFrom.secretKeyRef.name, key: .valueFrom.secretKeyRef.key}] | sort_by(.env)
          }' /tmp/service.json | sed 's/^/OMNI_RUNTIME_SERVICE=/'

          printf 'OMNI_CLOUD_RUN_SERVICES='
          gcloud run services list \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(metadata.name)' | sort | paste -sd, -

          printf 'OMNI_CLOUD_RUN_JOBS='
          gcloud run jobs list \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(metadata.name)' | sort | paste -sd, -

          printf 'OMNI_PROVIDER_SECRET_NAMES='
          gcloud secrets list \
            --project "$GCP_PROJECT_ID" \
            --format='value(name)' | grep -Eai '(whatsapp|email|sendgrid|postmark|mailgun|resend|smtp|meta)' | sort | paste -sd, - || true

          set +e
          SCHEDULERS="$(gcloud scheduler jobs list \
            --project "$GCP_PROJECT_ID" \
            --location "$GCP_REGION" \
            --format='value(name)' 2>/tmp/scheduler-error.txt | sort | paste -sd, -)"
          SCHED_STATUS=$?
          set -e
          if [ "$SCHED_STATUS" -eq 0 ]; then
            echo "OMNI_SCHEDULER_JOBS=$SCHEDULERS"
          else
            echo "OMNI_SCHEDULER_READ=UNAVAILABLE"
          fi

          echo 'OMNI_RUNTIME_READ=COMPLETE'
