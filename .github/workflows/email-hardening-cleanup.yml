name: Email hardening cleanup

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          ref: rebase/email-real-sendgrid-20260820
      - name: Remove temporary hardening machinery
        shell: bash
        run: |
          git rm -f \
            .github/workflows/email-provider-hardening-patch.yml \
            .github/workflows/email-hardening-trigger.yml \
            .github/workflows/email-hardening-pr-one-shot.yml \
            .github/workflows/email-hardening-pr-v2.yml \
            .github/workflows/email-hardening-pr-v3.yml \
            .github/workflows/email-hardening-pr-v4.yml \
            .github/workflows/email-hardening-pr-v5.yml \
            .github/workflows/email-hardening-cleanup.yml \
            scripts/apply-email-hardening.py \
            scripts/prep-email-hardening-doc.py \
            scripts/prep-email-hardening-test.py \
            scripts/prep-email-hardening-retry.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(email): remove temporary hardening machinery"
          git push origin HEAD:rebase/email-real-sendgrid-20260820
