name: Prettier Diagnostic Scheduling Batch

on:
  pull_request:
    paths:
      - 'src/toca-managed-instagram-schedule-batch-command.ts'
      - '.github/workflows/prettier-diagnostic-scheduling-batch.yml'

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write src/toca-managed-instagram-schedule-batch-command.ts
          git --no-pager diff -- src/toca-managed-instagram-schedule-batch-command.ts
