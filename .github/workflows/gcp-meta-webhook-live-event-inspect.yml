name: GCP Meta Webhook Live Event Inspect

on:
  push:
    branches:
      - feat/instagram-engagement-messaging
    paths:
      - '.github/workflows/gcp-meta-webhook-live-event-inspect.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  SERVICE: toca-meta-oauth-staging

jobs:
  inspect-live-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Inspect sanitized recent webhook acceptance logs
        shell: bash
        run: |
          set -euo pipefail

          FILTER="resource.type=cloud_run_revision AND resource.labels.service_name=${SERVICE} AND timestamp>=\"$(date -u -d '2 hours ago' '+%Y-%m-%dT%H:%M:%SZ')\" AND textPayload:\"Meta webhook events accepted\""

          gcloud logging read "$FILTER" \
            --project "$PROJECT_ID" \
            --limit 100 \
            --order desc \
            --format=json > /tmp/meta-webhook-logs.json

          COMMENT_COUNT="$(jq '[.[] | .textPayload // "" | select(contains("COMMENT"))] | length' /tmp/meta-webhook-logs.json)"
          DIRECT_COUNT="$(jq '[.[] | .textPayload // "" | select(contains("DIRECT"))] | length' /tmp/meta-webhook-logs.json)"

          echo "Sanitized COMMENT webhook log entries: ${COMMENT_COUNT}"
          echo "Sanitized DIRECT webhook log entries: ${DIRECT_COUNT}"

          test "$COMMENT_COUNT" -ge 1
          test "$DIRECT_COUNT" -ge 1
