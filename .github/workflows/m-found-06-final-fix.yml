name: M-FOUND-06 Final Fix

on:
  push:
    branches:
      - feat/m-found-06-durable-workflows

permissions:
  contents: write

jobs:
  final-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/m-found-06-final-fix.py
      - name: Validate complete repository
        run: |
          pnpm exec prettier --write \
            src/workflow/workflow-contracts.ts \
            src/workflow/in-memory-workflow-store.ts \
            src/persistence/postgres-workflow-store.ts \
            test/durable-workflow-migration.test.ts \
            test/durable-workflow-concurrency-contract.test.ts
          pnpm quality
      - name: Commit validated result
        run: |
          rm .github/workflows/m-found-06-final-fix.yml scripts/m-found-06-final-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: finalize durable workflow concurrency invariants"
      - name: Push validated result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:feat/m-found-06-durable-workflows"
