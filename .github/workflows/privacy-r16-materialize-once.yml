name: Privacy R16 Finalize One-Shot

on:
  push:
    branches: [reconcile/privacy-r16-materialize]
    paths: ['.github/workflows/privacy-r16-materialize-once.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: reconcile/privacy-r16-materialize
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build exact clean Privacy R16 candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE=9454085ec9f2e67eae249560183bf6c20bdf81b6
          SOURCE=572f4bfcb5cb1795f31ded72489874e09e1f61b9
          git fetch origin "$BASE" "$SOURCE"
          git checkout -B privacy-final "$BASE"
          git checkout "$SOURCE" -- \
            docs/checkpoints/r16-privacy-lgpd-governance.md \
            migrations/014_privacy_governance.sql \
            src/persistence/postgres-privacy-ledger-store.ts \
            src/privacy/capability-registry.ts \
            src/privacy/contracts.ts \
            src/privacy/in-memory.ts \
            src/privacy/index.ts \
            src/privacy/privacy-governance-base.ts \
            src/privacy/privacy-governance-core.ts \
            src/privacy/privacy-governance-helpers.ts \
            src/privacy/privacy-governance-rights.ts \
            src/privacy/privacy-governance.ts \
            test/privacy-capability-registry.test.ts \
            test/privacy-governance-fixtures.ts \
            test/privacy-governance-sensitive.test.ts \
            test/privacy-governance.test.ts \
            test/privacy-postgres-contract.test.ts
          test "$(git diff --cached --name-only | wc -l)" -eq 17
          pnpm quality
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat(privacy): add R16 consent and LGPD governance'
          FINAL_SHA="$(git rev-parse HEAD)"
          git push --force origin HEAD:feat/r16-privacy-consent-preferences-v2
          echo "PRIVACY_R16_FINAL_SHA=$FINAL_SHA"
