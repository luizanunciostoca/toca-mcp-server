name: One-shot production webhook internal probe fix

on:
  push:
    branches:
      - fix/production-webhook-internal-probe-20260826

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'luizanunciostoca'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/production-webhook-internal-probe-20260826
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply remediation
        run: python scripts/one-shot-fix-production-webhook-internal-probe.py

      - name: Validate affected contracts
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write test/gcp-production-webhook-internal-probe-contract.test.ts
          git diff --check
          pnpm exec vitest run test/gcp-production-webhook-internal-probe-contract.test.ts test/gcp-deploy-cloud-run-probes.test.ts test/gcp-production-internal-probe-contract.test.ts test/gcp-production-probe-rollback-contract.test.ts

      - name: Commit clean remediation
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-fix-production-webhook-internal-probe.yml
          rm scripts/one-shot-fix-production-webhook-internal-probe.py
          git diff --check
          git config user.name "TOCA OS Automation"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "fix(deploy): probe production webhook from GCP"
          git push origin HEAD:fix/production-webhook-internal-probe-20260826
