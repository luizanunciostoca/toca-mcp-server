name: Temporary Format PR 874

on:
  push:
    branches:
      - ops/restore-gcp-instagram-scheduler-20260916
    paths:
      - .github/workflows/tmp-format-pr874.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ops/restore-gcp-instagram-scheduler-20260916
          persist-credentials: true
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format exact scheduler files
        run: pnpm exec prettier --write scripts/marketing-scheduled-publication-controller.mjs test/marketing-autopilot-gcp-scheduler.test.ts
      - name: Remove temporary formatter and commit final tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-format-pr874.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/marketing-scheduled-publication-controller.mjs test/marketing-autopilot-gcp-scheduler.test.ts .github/workflows/tmp-format-pr874.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(instagram): format GCP scheduler recovery files'
          git push origin HEAD:ops/restore-gcp-instagram-scheduler-20260916
