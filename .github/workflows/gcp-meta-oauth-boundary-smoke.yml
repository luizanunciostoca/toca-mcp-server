name: GCP Meta OAuth Boundary Smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-meta-oauth-boundary
  cancel-in-progress: false

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  SERVICE: toca-meta-oauth-staging
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  REDIRECT_URI: https://toca-meta-oauth-staging-990081828836.southamerica-east1.run.app/oauth/meta/callback
  TOKEN_SECRET_ID: toca-meta-oauth-token
  WEBHOOK_VERIFY_TOKEN_SECRET_ID: toca-meta-webhook-verify-token
  DATABASE_SECRET_ID: toca-database-url
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  INSTAGRAM_ACCOUNT_ID: '17841402033495654'
  READ_SMOKE_JOB: toca-meta-read-smoke

jobs:
  oauth-boundary:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push OAuth image from current head
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/server:oauth-${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy isolated real Meta OAuth and webhook boundary
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --set-env-vars "^@^NODE_ENV=production@META_ENABLED=true@META_WEBHOOK_ENABLED=true@META_WEBHOOK_PERSISTENCE_ENABLED=true@INSTAGRAM_ENGAGEMENT_WRITES_ENABLED=false@MCP_ENABLED=false@LOG_LEVEL=info@META_APP_ID=2281930145887404@META_APP_SECRET_PROVIDER=env@META_APP_SECRET_KEY=META_APP_SECRET@META_WEBHOOK_VERIFY_TOKEN_KEY=META_WEBHOOK_VERIFY_TOKEN@META_AUTHORIZATION_ENDPOINT=https://www.facebook.com/dialog/oauth@META_TOKEN_ENDPOINT=https://graph.facebook.com/oauth/access_token@META_REDIRECT_URI=$REDIRECT_URI@META_REQUESTED_SCOPES=pages_show_list,pages_read_engagement,pages_manage_metadata,pages_messaging,business_management,instagram_basic,instagram_manage_comments,instagram_manage_messages,ads_read,ads_management@META_GRAPH_BASE_URL=https://graph.facebook.com@META_GRAPH_API_VERSION=v24.0@META_TOKEN_STORE_PROVIDER=gcp-secret-manager@META_TOKEN_SECRET_ID=$TOKEN_SECRET_ID@GCP_PROJECT_ID=$PROJECT_ID" \
            --set-secrets "META_APP_SECRET=toca-meta-app-secret:1,META_WEBHOOK_VERIFY_TOKEN=$WEBHOOK_VERIFY_TOKEN_SECRET_ID:latest,DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --min-instances 0 \
            --max-instances 1 \
            --ingress all \
            --default-url \
            --no-invoker-iam-check \
            --quiet

      - name: Resolve public service URL
        run: |
          CANONICAL_URL="https://toca-meta-oauth-staging-990081828836.southamerica-east1.run.app"
          STATUS_URL="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"

          for CANDIDATE in "$CANONICAL_URL" "$STATUS_URL"; do
            [ -n "$CANDIDATE" ] || continue
            STATUS="$(curl --silent --output /tmp/health-response.json --write-out '%{http_code}' "$CANDIDATE/health")"
            if [ "$STATUS" = "200" ] && grep -q '"status":"ok"' /tmp/health-response.json; then
              echo "SERVICE_URL=$CANDIDATE" >> "$GITHUB_ENV"
              exit 0
            fi
          done

          echo 'No unauthenticated Cloud Run URL served /health successfully.' >&2
          exit 1

      - name: Verify OAuth start redirects to Meta with Ads management scopes
        run: |
          STATUS="$(curl --silent --output /dev/null --dump-header /tmp/oauth-headers.txt --write-out '%{http_code}' "$SERVICE_URL/oauth/meta/start")"
          test "$STATUS" = "302"
          LOCATION="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/oauth-headers.txt)"
          test -n "$LOCATION"
          case "$LOCATION" in
            https://www.facebook.com/*/dialog/oauth*|https://www.facebook.com/dialog/oauth*) ;;
            *) echo 'OAuth start did not redirect to the expected Meta authorization endpoint.' >&2; exit 1 ;;
          esac
          echo "$LOCATION" | grep -q 'client_id=2281930145887404'
          echo "$LOCATION" | grep -q 'redirect_uri='
          echo "$LOCATION" | grep -q 'state='
          echo "$LOCATION" | grep -q 'business_management'
          echo "$LOCATION" | grep -q 'pages_messaging'
          echo "$LOCATION" | grep -q 'ads_read'
          echo "$LOCATION" | grep -q 'ads_management'
          echo 'OAuth start returned a valid Meta authorization redirect with Instagram, messaging and Marketing API management scopes.'

      - name: Verify webhook remains enabled after OAuth deploy
        run: |
          STATUS="$(curl --silent --output /tmp/webhook-invalid.json --write-out '%{http_code}' \
            "$SERVICE_URL/webhooks/meta?hub.mode=subscribe&hub.verify_token=invalid-token&hub.challenge=challenge-rejected")"
          test "$STATUS" = "403"
          grep -q '"error":"meta_webhook_verification_rejected"' /tmp/webhook-invalid.json
          echo 'Webhook remains enabled after OAuth boundary deployment.'

      - name: Build read-only Instagram smoke image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/meta-read-smoke
          cat > /tmp/meta-read-smoke/meta-read-smoke.mjs <<'NODE'
          const token = process.env.META_ACCESS_TOKEN;
          const accountId = process.env.INSTAGRAM_ACCOUNT_ID;
          if (!token || !accountId) throw new Error('Read smoke configuration missing');

          async function graph(path) {
            const response = await fetch(`https://graph.facebook.com/v24.0/${path}`, {
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
            });
            const body = await response.json();
            if (!response.ok) throw new Error(`Meta Graph read failed: HTTP ${response.status}`);
            return body;
          }

          const profile = await graph(`${accountId}?fields=id,username,name,followers_count,media_count`);
          if (profile.id !== accountId) throw new Error('Instagram account ID mismatch');
          if (profile.username !== 'tocadomorcego') throw new Error(`Unexpected Instagram username: ${profile.username}`);
          if (typeof profile.followers_count !== 'number') throw new Error('followers_count missing');
          if (typeof profile.media_count !== 'number') throw new Error('media_count missing');

          const media = await graph(`${accountId}/media?fields=id,media_type,timestamp&limit=3`);
          if (!Array.isArray(media.data)) throw new Error('Instagram media response missing data array');

          let commentsReadOk = false;
          let returnedComments = 0;
          const firstMediaId = media.data[0]?.id;
          if (firstMediaId) {
            const comments = await graph(`${firstMediaId}/comments?fields=id,text,username,timestamp&limit=3`);
            if (!Array.isArray(comments.data)) throw new Error('Instagram comments response missing data array');
            commentsReadOk = true;
            returnedComments = comments.data.length;
          }

          console.log(JSON.stringify({
            profileReadOk: true,
            id: profile.id,
            username: profile.username,
            name: profile.name ?? null,
            followersCount: profile.followers_count,
            mediaCount: profile.media_count,
            mediaReadOk: true,
            returnedMedia: media.data.length,
            commentsReadOk,
            returnedComments,
          }));
          NODE

          cat > /tmp/meta-read-smoke/Dockerfile <<'DOCKER'
          FROM node:24-bookworm-slim
          WORKDIR /app
          COPY meta-read-smoke.mjs ./meta-read-smoke.mjs
          USER node
          CMD ["node", "meta-read-smoke.mjs"]
          DOCKER

          READ_SMOKE_IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/meta-read-smoke:${GITHUB_SHA}"
          docker build -t "$READ_SMOKE_IMAGE" /tmp/meta-read-smoke
          docker push "$READ_SMOKE_IMAGE"
          echo "READ_SMOKE_IMAGE=$READ_SMOKE_IMAGE" >> "$GITHUB_ENV"

      - name: Validate real Instagram account read-only under runtime identity
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            gcloud run jobs delete "$READ_SMOKE_JOB" --project "$PROJECT_ID" --region "$REGION" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          gcloud run jobs deploy "$READ_SMOKE_JOB" \
            --image "$READ_SMOKE_IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars "INSTAGRAM_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID" \
            --set-secrets "META_ACCESS_TOKEN=$TOKEN_SECRET_ID:latest" \
            --max-retries 0 \
            --task-timeout 120s \
            --quiet

          gcloud run jobs execute "$READ_SMOKE_JOB" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --wait \
            --quiet

          echo 'Real Instagram profile/media/comments read smoke passed under runtime identity.'

      - name: Verify MCP remains isolated
        run: |
          STATUS="$(curl --silent --output /tmp/mcp-response.json --write-out '%{http_code}' -X POST "$SERVICE_URL/mcp")"
          test "$STATUS" = "404"
          grep -q '"error":"not_found"' /tmp/mcp-response.json
          echo 'MCP remains disabled on the public OAuth boundary.'
