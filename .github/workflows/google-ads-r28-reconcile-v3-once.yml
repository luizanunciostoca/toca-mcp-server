name: Google Ads R28 Reconcile V3 Once

on:
  push:
    branches: [reconcile/r28-google-ads-current-main]
    paths: ['.github/workflows/google-ads-r28-reconcile-v3-once.yml']

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Replay proven R28 materialization without its old lint gate
        shell: bash
        run: |
          set -euo pipefail
          BASE='81f6f84df6b725bfc5994c2d1582241b7936c614'
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(git diff --name-only "$BASE" HEAD | wc -l)" = '2'

          awk '
            /- name: Reconcile legacy R28 delta into current core facade/ { wanted=1; next }
            wanted && /run: \|/ { capture=1; next }
            capture && /^      - name: Commit clean current-architecture reconciliation/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/google-ads-r28-reconcile-once.yml > /tmp/reconcile.sh
          test -s /tmp/reconcile.sh

          sed -i "/test .*google-ads-r28-reconcile-once.yml/d" /tmp/reconcile.sh
          sed -i '/^pnpm quality$/d' /tmp/reconcile.sh
          bash /tmp/reconcile.sh

      - name: Align legacy code with current lint and exact-optional contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          resolver = Path('src/mcp/runtime-capability-resolver.ts')
          value = resolver.read_text()
          import_anchor = "import type { InstagramHistoryProvider } from '../providers/instagram/instagram-history-provider.js';\n"
          if "GoogleAdsCampaignPlan" not in value:
              value = value.replace(
                  import_anchor,
                  "import type { GoogleAdsCampaignPlan } from '../providers/google-ads/google-ads-paid-media.js';\n" + import_anchor,
                  1,
              )
          schema_end = "const googleAdsCampaignReferenceSchema = z.object({ campaignIdOrName: z.string().min(1) });\n"
          helper = """

          function googleAdsPlanFromInput(
            input: z.infer<typeof googleAdsPlanSchema>,
          ): GoogleAdsCampaignPlan {
            return {
              customerId: input.customerId,
              currencyCode: input.currencyCode,
              campaignName: input.campaignName,
              budgetName: input.budgetName,
              dailyBudgetMicros: input.dailyBudgetMicros,
              advertisingChannelType: input.advertisingChannelType ?? 'SEARCH',
              targeting: {
                locationCriterionIds: input.targeting.locationCriterionIds,
                ...(input.targeting.languageCriterionIds !== undefined
                  ? { languageCriterionIds: input.targeting.languageCriterionIds }
                  : {}),
                ...(input.targeting.presenceOnly !== undefined
                  ? { presenceOnly: input.targeting.presenceOnly }
                  : {}),
              },
            };
          }
          """
          if schema_end not in value:
              raise SystemExit('resolver schema end anchor missing')
          value = value.replace(schema_end, schema_end + helper, 1)
          value = value.replace('services.googleAds!.prepare(input as GoogleAdsCampaignPlan)', 'services.googleAds!.prepare(googleAdsPlanFromInput(input))')
          value = value.replace('services.googleAds!.prepare(input)', 'services.googleAds!.prepare(googleAdsPlanFromInput(input))')
          value = value.replace('services.googleAds!.validateTargeting(input as GoogleAdsCampaignPlan)', 'services.googleAds!.validateTargeting(googleAdsPlanFromInput(input))')
          value = value.replace('services.googleAds!.validateTargeting(input)', 'services.googleAds!.validateTargeting(googleAdsPlanFromInput(input))')
          value = value.replace('services.googleAds!.createPaused(input as GoogleAdsCampaignPlan)', 'services.googleAds!.createPaused(googleAdsPlanFromInput(input))')
          value = value.replace('services.googleAds!.createPaused(input)', 'services.googleAds!.createPaused(googleAdsPlanFromInput(input))')
          resolver.write_text(value)

          api = Path('src/providers/google-ads/google-ads-api-client.ts')
          value = api.read_text()
          old = """    return {
      body: payload,
      ...(response.headers.get('request-id')
        ? { requestId: response.headers.get('request-id') ?? undefined }
        : {}),
    };
"""
          new = """    const requestId = response.headers.get('request-id');
    return {
      body: payload,
      ...(requestId ? { requestId } : {}),
    };
"""
          if old not in value:
              raise SystemExit('api response request-id anchor missing')
          api.write_text(value.replace(old, new, 1))

          paid = Path('src/providers/google-ads/google-ads-paid-media.ts')
          value = paid.read_text()
          old = """    const results = response.body.results ?? [];
    const first = results[0] as Record<string, unknown> | undefined;
    const campaign = first?.campaign as Record<string, unknown> | undefined;
"""
          new = """    const rawResults = response.body.results;
    const results = Array.isArray(rawResults)
      ? rawResults.filter(
          (item): item is Record<string, unknown> =>
            item !== null && typeof item === 'object' && !Array.isArray(item),
        )
      : [];
    const first = results[0];
    const campaign = first?.campaign as Record<string, unknown> | undefined;
"""
          if old not in value:
              raise SystemExit('paid-media readback results anchor missing')
          paid.write_text(value.replace(old, new, 1))

          api_test = Path('test/google-ads-api-client.test.ts')
          value = api_test.read_text()
          first = 'const fakeFetch = async (input: string | URL | Request, init?: RequestInit) => {\n'
          if first not in value:
              first = 'const fakeFetch = (async (input: string | URL | Request, init?: RequestInit) => {\n'
          if first not in value:
              raise SystemExit('fakeFetch anchor missing')
          value = value.replace(first, first + '      await Promise.resolve();\n', 1)
          old_url = '      calls.push({ url: String(input), init });'
          new_url = "      calls.push({\n        url: typeof input === 'string' ? input : input instanceof URL ? input.toString() : input.url,\n        ...(init ? { init } : {}),\n      });"
          if old_url not in value:
              raise SystemExit('fakeFetch URL anchor missing')
          value = value.replace(old_url, new_url, 1)
          old_body = "    expect(JSON.parse(String(calls[0]?.init?.body))).toEqual({\n      query: 'SELECT campaign.id FROM campaign LIMIT 1',\n    });"
          new_body = "    const requestBody = calls[0]?.init?.body;\n    expect(typeof requestBody).toBe('string');\n    if (typeof requestBody !== 'string') throw new Error('TEST_REQUEST_BODY_STRING_REQUIRED');\n    expect(JSON.parse(requestBody)).toEqual({\n      query: 'SELECT campaign.id FROM campaign LIMIT 1',\n    });"
          if old_body not in value:
              raise SystemExit('request body anchor missing')
          value = value.replace(old_body, new_body, 1)
          for pattern in (
              "async () => new Response('{}', { status: 200 })",
              "(async () => new Response('{}', { status: 200 }))",
          ):
              if pattern in value:
                  value = value.replace(
                      pattern,
                      "async () => { await Promise.resolve(); return new Response('{}', { status: 200 }); }",
                      1,
                  )
                  break
          else:
              raise SystemExit('boundary fake fetch anchor missing')
          api_test.write_text(value)

          paid_test = Path('test/google-ads-paid-media.test.ts')
          value = paid_test.read_text()
          signatures = {
              'async listAccessibleCustomers() {': "async listAccessibleCustomers(): ReturnType<GoogleAdsApiClient['listAccessibleCustomers']> {",
              'async search(query: string) {': "async search(query: string): ReturnType<GoogleAdsApiClient['search']> {",
              'async mutate(path: string, body: Record<string, unknown>) {': "async mutate(path: string, body: Record<string, unknown>): ReturnType<GoogleAdsApiClient['mutate']> {",
              'override async mutate(path: string, body: Record<string, unknown>) {': "override async mutate(path: string, body: Record<string, unknown>): ReturnType<GoogleAdsApiClient['mutate']> {",
              'override async search(query: string) {': "override async search(query: string): ReturnType<GoogleAdsApiClient['search']> {",
          }
          for old_sig, new_sig in signatures.items():
              if old_sig in value:
                  value = value.replace(old_sig, new_sig)
          for method in ('listAccessibleCustomers', 'search', 'mutate'):
              pattern = rf'(?m)^(\s*)(override\s+)?async {method}([^\n]*\{{)\n(?!\s*await Promise\.resolve\(\);)'
              def inject(match):
                  indent = match.group(1)
                  override = match.group(2) or ''
                  rest = match.group(3)
                  return f'{indent}{override}async {method}{rest}\n{indent}  await Promise.resolve();\n'
              value = re.sub(pattern, inject, value)
          paid_test.write_text(value)
          PY

          pnpm exec prettier --write \
            src/mcp/runtime-capability-resolver.ts \
            src/providers/google-ads/google-ads-api-client.ts \
            src/providers/google-ads/google-ads-paid-media.ts \
            test/google-ads-api-client.test.ts \
            test/google-ads-paid-media.test.ts

      - name: Run full canonical Quality Gate locally
        run: pnpm quality

      - name: Commit permanent current-architecture reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'luizidebook'
          git config user.email '47362223+luizidebook@users.noreply.github.com'
          git add \
            docs/architecture/r28-google-ads-paid-media.md \
            docs/architecture/routes-capabilities-v1.md \
            src/config.ts \
            src/governance/capability-catalog.ts \
            src/governance/capability-ids.ts \
            src/mcp/runtime-capability-resolver.ts \
            src/providers/google-ads/google-ads-api-client.ts \
            src/providers/google-ads/google-ads-paid-media.ts \
            src/providers/google-ads/google-ads-phase.ts \
            src/registry.ts \
            src/server.ts \
            test/config.test.ts \
            test/google-ads-api-client.test.ts \
            test/google-ads-create-idempotency.test.ts \
            test/google-ads-paid-media.test.ts \
            test/governance-catalog.test.ts
          test "$(git diff --cached --name-only | wc -l)" = '16'
          git commit -m 'feat(r28): reconcile Google Ads with TOCA Core facade'
          git push origin HEAD:reconcile/r28-google-ads-current-main
