name: Staging Acceptance E2E 75c165a

'on':
  pull_request:
    paths:
      - '.github/workflows/staging-acceptance-e2e-75c165a.yml'
      - 'scripts/staging-e2e/**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: staging-acceptance-e2e-75c165a
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 75c165a044c6e79e9545328dd04a2a3e73d2e910
  CANDIDATE_TREE: 2b373b1564e495d81a73ca04254efec18c0e774c
  PROJECT_ID: toca-mcp-next-staging
  PROJECT_NUMBER: '729069789107'
  PRODUCTION_PROJECT_ID: toca-mcp-production
  PRODUCTION_PROJECT_NUMBER: '990081828836'
  REGION: southamerica-east1
  ARTIFACT_REPOSITORY: toca-mcp-staging
  MCP_SERVICE: toca-mcp-next-staging
  WEBHOOK_SERVICE: toca-webhook-next-staging
  MCP_REVISION: toca-mcp-next-staging-mcp-75c165a-r3
  WEBHOOK_REVISION: toca-webhook-next-staging-webhook-75c165a-f1
  DATABASE_INSTANCE: toca-mcp-next-staging-db
  DATABASE_SECRET: toca-next-staging-database-url
  DATABASE_SECRET_VERSION: '1'
  WIF: projects/729069789107/locations/global/workloadIdentityPools/github-staging/providers/github-toca-mcp-staging
  DEPLOYER_SA: toca-next-stg-deployer@toca-mcp-next-staging.iam.gserviceaccount.com
  MCP_RUNTIME_SA: toca-next-stg-mcp@toca-mcp-next-staging.iam.gserviceaccount.com
  WEBHOOK_RUNTIME_SA: toca-next-stg-webhook@toca-mcp-next-staging.iam.gserviceaccount.com
  IMAGE_INDEX_DIGEST: sha256:611a56ea24d1fd838aeae867debedcc87cd5496e35b99c642188c1c93b2d5250
  RUNTIME_CHILD_DIGEST: sha256:257bd85a460764c2f207445c72a279c772c869a75f48c7bc2c071be2d858bfad
  CLOUD_SQL_PROXY_VERSION: v2.24.1
  CLOUD_SQL_PROXY_SHA256: fae2766aac9d614a2bdef2f2a7778f3d054f3acd5ff07a81a9e300bd471512eb
  HARNESS_ROOT: ${{ github.workspace }}/harness
  CANDIDATE_ROOT: ${{ github.workspace }}/candidate
  EVIDENCE_DIR: ${{ github.workspace }}/staging-e2e-evidence

jobs:
  staging-e2e:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 50
    steps:
      - name: Checkout reviewable evidence harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: harness
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact frozen application candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1

      - name: Assert exact application identity and prepare evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git -C "$CANDIDATE_ROOT" rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C "$CANDIDATE_ROOT" rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          if find "$CANDIDATE_ROOT/migrations" -maxdepth 1 -type f -name '027_*.sql' -printf '%f\n' | grep -q '^027_'; then
            echo 'RETIRED_MIGRATION_027_PRESENT'
            exit 1
          fi
          test "$(find "$CANDIDATE_ROOT/migrations" -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | tail -n 1)" = '033_omnichannel_prepared_content.sql'
          printf '%s\n' \
            "APPLICATION_CANDIDATE_SHA=$CANDIDATE_SHA" \
            "APPLICATION_CANDIDATE_TREE=$CANDIDATE_TREE" \
            "OCI_INDEX_DIGEST=$IMAGE_INDEX_DIGEST" \
            "RUNTIME_CHILD_DIGEST=$RUNTIME_CHILD_DIGEST" \
            'STAGING_PROVIDER_MODE=DISABLED' \
            'PRODUCTION_AUTHORIZED=NO' \
            'HARNESS_MERGE_AUTHORIZED=NO' \
            > "$EVIDENCE_DIR/release-identity.txt"

      - name: Set up pnpm 10.15.0
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml

      - name: Install exact candidate dependencies
        shell: bash
        run: pnpm --dir "$CANDIDATE_ROOT" install --frozen-lockfile

      - name: Authenticate isolated staging WIF
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.WIF }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - id: runtime
        name: Fail-closed runtime, artifact, and provider preflight
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_NUMBER="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
          test "$ACTUAL_NUMBER" = "$PROJECT_NUMBER"
          test "$PROJECT_ID" != "$PRODUCTION_PROJECT_ID"
          test "$PROJECT_NUMBER" != "$PRODUCTION_PROJECT_NUMBER"

          IMAGE_REPOSITORY="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/server"
          IMAGE_TAG="${IMAGE_REPOSITORY}:${CANDIDATE_SHA}"
          RUNTIME_IMAGE="${IMAGE_REPOSITORY}@${RUNTIME_CHILD_DIGEST}"
          REMOTE_INDEX_DIGEST="$(gcloud artifacts docker images describe "$IMAGE_TAG" --project "$PROJECT_ID" --format='value(image_summary.digest)')"
          test "$REMOTE_INDEX_DIGEST" = "$IMAGE_INDEX_DIGEST"

          gcloud run services describe "$MCP_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$EVIDENCE_DIR/mcp-service.json"
          gcloud run services describe "$WEBHOOK_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$EVIDENCE_DIR/webhook-service.json"
          gcloud run revisions describe "$MCP_REVISION" --project "$PROJECT_ID" --region "$REGION" --format=json > "$EVIDENCE_DIR/mcp-revision.json"
          gcloud run revisions describe "$WEBHOOK_REVISION" --project "$PROJECT_ID" --region "$REGION" --format=json > "$EVIDENCE_DIR/webhook-revision.json"

          jq -e --arg rev "$MCP_REVISION" '[.status.traffic[]? | select(.revisionName==$rev and (.percent // 0)==100)] | length == 1' "$EVIDENCE_DIR/mcp-service.json" >/dev/null
          jq -e --arg rev "$WEBHOOK_REVISION" '[.status.traffic[]? | select(.revisionName==$rev and (.percent // 0)==100)] | length == 1' "$EVIDENCE_DIR/webhook-service.json" >/dev/null

          for tuple in \
            "$MCP_RUNTIME_SA:$EVIDENCE_DIR/mcp-revision.json" \
            "$WEBHOOK_RUNTIME_SA:$EVIDENCE_DIR/webhook-revision.json"; do
            runtime_sa="${tuple%%:*}"
            file="${tuple#*:}"
            jq -e --arg image "$RUNTIME_IMAGE" '.spec.containers[0].image == $image and .status.imageDigest == $image' "$file" >/dev/null
            jq -e --arg sa "$runtime_sa" '.spec.serviceAccountName == $sa' "$file" >/dev/null
            jq -e 'any(.status.conditions[]?; .type=="Ready" and .status=="True") and any(.status.conditions[]?; .type=="ContainerHealthy" and .status=="True")' "$file" >/dev/null
            jq -e '.spec.containers[0].startupProbe.httpGet.path == "/readyz" and .spec.containers[0].livenessProbe.httpGet.path == "/healthz"' "$file" >/dev/null
            jq -e --arg sha "$CANDIDATE_SHA" '[.spec.containers[0].env[]? | select(.name=="TOCA_RELEASE_SHA") | .value] == [$sha]' "$file" >/dev/null
            jq -e '[.spec.containers[0].env[]? | select(.name | test("^(META_ENABLED|META_PROVIDER_VERIFIED|META_WEBHOOK_ENABLED|META_WEBHOOK_PERSISTENCE_ENABLED|INSTAGRAM_READ_ENABLED|META_ADS_READ_ENABLED|META_ADS_WRITE_ENABLED|WHATSAPP_ENABLED|WHATSAPP_RUNTIME_ENABLED|WHATSAPP_PROVIDER_VERIFIED|EMAIL_SENDGRID_ENABLED|EMAIL_SENDGRID_PROVIDER_VERIFIED|GOOGLE_ADS_PROVIDER_VERIFIED|AG01_MODEL_ENABLED|AG01_MODEL_PROVIDER_VERIFIED)$")) | .value] | all(. == "false")' "$file" >/dev/null
            jq -e '[.spec.containers[0].env[]? | select(.name=="GOOGLE_ADS_PHASE") | .value] == ["OFF"]' "$file" >/dev/null
          done

          MCP_BASE_URL="$(jq -r '.status.url' "$EVIDENCE_DIR/mcp-service.json")"
          test -n "$MCP_BASE_URL"
          echo "mcp_base_url=$MCP_BASE_URL" >> "$GITHUB_OUTPUT"
          echo 'STAGING_RUNTIME_PREFLIGHT=PASS'

      - id: database
        name: Connect to isolated staging database through pinned proxy
        shell: bash
        run: |
          set -euo pipefail
          CONNECTION_NAME="$(gcloud sql instances describe "$DATABASE_INSTANCE" --project "$PROJECT_ID" --format='value(connectionName)')"
          test -n "$CONNECTION_NAME"
          PROXY_URL="https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/${CLOUD_SQL_PROXY_VERSION}/cloud-sql-proxy.linux.amd64"
          curl --fail --silent --show-error --location "$PROXY_URL" --output "$RUNNER_TEMP/cloud-sql-proxy"
          printf '%s  %s\n' "$CLOUD_SQL_PROXY_SHA256" "$RUNNER_TEMP/cloud-sql-proxy" | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/cloud-sql-proxy"
          "$RUNNER_TEMP/cloud-sql-proxy" --address 127.0.0.1 --port 5432 "$CONNECTION_NAME" > "$EVIDENCE_DIR/cloud-sql-proxy.log" 2>&1 &
          PROXY_PID=$!
          echo "PROXY_PID=$PROXY_PID" >> "$GITHUB_ENV"

          RAW_DATABASE_URL="$(gcloud secrets versions access "$DATABASE_SECRET_VERSION" --secret "$DATABASE_SECRET" --project "$PROJECT_ID")"
          test -n "$RAW_DATABASE_URL"
          echo "::add-mask::$RAW_DATABASE_URL"
          DATABASE_URL="$(RAW_DATABASE_URL="$RAW_DATABASE_URL" node --input-type=module -e "const u=new URL(process.env.RAW_DATABASE_URL); u.hostname='127.0.0.1'; u.port='5432'; for (const k of ['host','ssl','sslmode','sslrootcert','sslcert','sslkey']) u.searchParams.delete(k); process.stdout.write(u.toString())")"
          echo "::add-mask::$DATABASE_URL"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
          echo "BASE_DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
          echo 'DATABASE_SSL=false' >> "$GITHUB_ENV"

          for attempt in $(seq 1 30); do
            if DATABASE_URL="$DATABASE_URL" node --input-type=module -e "import pg from '$CANDIDATE_ROOT/node_modules/pg/lib/index.js'; const p=new pg.Pool({connectionString:process.env.DATABASE_URL,max:1}); await p.query('select 1'); await p.end()"; then
              echo 'ready=yes' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Copy reviewable harness scripts beside exact candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CANDIDATE_ROOT/scripts/staging-e2e"
          cp "$HARNESS_ROOT/scripts/staging-e2e/db-preflight.ts" "$CANDIDATE_ROOT/scripts/staging-e2e/db-preflight.ts"
          cp "$HARNESS_ROOT/scripts/staging-e2e/durable-workflow.ts" "$CANDIDATE_ROOT/scripts/staging-e2e/durable-workflow.ts"
          cp "$HARNESS_ROOT/scripts/staging-e2e/ephemeral-schema.ts" "$CANDIDATE_ROOT/scripts/staging-e2e/ephemeral-schema.ts"
          cp "$HARNESS_ROOT/scripts/staging-e2e/recover-workflows.ts" "$CANDIDATE_ROOT/scripts/staging-e2e/recover-workflows.ts"
          cp "$HARNESS_ROOT/scripts/staging-e2e/settle-outbox.ts" "$CANDIDATE_ROOT/scripts/staging-e2e/settle-outbox.ts"

      - name: Recover only interrupted synthetic acceptance residue
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/staging-e2e/settle-outbox.ts 2>&1 | tee "$EVIDENCE_DIR/pre-recovery-outbox-settlement.log"
          cp "$EVIDENCE_DIR/outbox-settlement.json" "$EVIDENCE_DIR/pre-recovery-outbox-settlement.json"
          pnpm exec tsx scripts/staging-e2e/recover-workflows.ts 2>&1 | tee "$EVIDENCE_DIR/synthetic-workflow-recovery.log"
          pnpm exec tsx scripts/staging-e2e/settle-outbox.ts 2>&1 | tee "$EVIDENCE_DIR/post-recovery-outbox-settlement.log"
          cp "$EVIDENCE_DIR/outbox-settlement.json" "$EVIDENCE_DIR/post-recovery-outbox-settlement.json"

      - name: Verify current schema and quiescent acceptance window
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/staging-e2e/db-preflight.ts
          cp "$EVIDENCE_DIR/database-preflight.json" "$EVIDENCE_DIR/public-database-preflight.json"

      - name: Prove migrations are current and idempotent twice
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          pnpm migrate 2>&1 | tee "$EVIDENCE_DIR/migrate-pass-1.log"
          if grep -q '^Applied migration ' "$EVIDENCE_DIR/migrate-pass-1.log"; then
            echo 'MIGRATION_PASS_1_WAS_NOT_A_NOOP'
            exit 1
          fi
          pnpm migrate 2>&1 | tee "$EVIDENCE_DIR/migrate-pass-2.log"
          if grep -q '^Applied migration ' "$EVIDENCE_DIR/migrate-pass-2.log"; then
            echo 'MIGRATION_PASS_2_WAS_NOT_A_NOOP'
            exit 1
          fi
          echo 'MIGRATIONS_CURRENT_AND_IDEMPOTENT=PASS'

      - id: acceptance_schema
        name: Create exact ephemeral acceptance schema
        working-directory: candidate
        shell: bash
        run: pnpm exec tsx scripts/staging-e2e/ephemeral-schema.ts create

      - name: Apply and verify exact migrations in ephemeral schema
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_COUNT="$(find migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d '[:space:]')"
          pnpm migrate 2>&1 | tee "$EVIDENCE_DIR/ephemeral-migrate-apply.log"
          APPLIED_COUNT="$(grep -c '^Applied migration ' "$EVIDENCE_DIR/ephemeral-migrate-apply.log" || true)"
          test "$APPLIED_COUNT" = "$EXPECTED_COUNT"
          pnpm migrate 2>&1 | tee "$EVIDENCE_DIR/ephemeral-migrate-noop.log"
          if grep -q '^Applied migration ' "$EVIDENCE_DIR/ephemeral-migrate-noop.log"; then
            echo 'EPHEMERAL_MIGRATION_SECOND_PASS_WAS_NOT_A_NOOP'
            exit 1
          fi
          pnpm exec tsx scripts/staging-e2e/db-preflight.ts
          cp "$EVIDENCE_DIR/database-preflight.json" "$EVIDENCE_DIR/ephemeral-database-preflight.json"
          echo 'EPHEMERAL_SCHEMA_MIGRATIONS=PASS'

      - name: Run PostgreSQL acceptance contracts sequentially
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          run_test() {
            test_file="$1"
            printf '\n### %s\n' "$test_file" | tee -a "$EVIDENCE_DIR/postgres-e2e.log"
            pnpm exec vitest run "$test_file" --maxWorkers=1 --minWorkers=1 --testTimeout=60000 --hookTimeout=60000 2>&1 | tee -a "$EVIDENCE_DIR/postgres-e2e.log"
          }
          run_test test/m-found-12-postgres-e2e.test.ts
          run_test test/crm-sales-postgres-e2e.test.ts
          run_test test/whatsapp-postgres-e2e.test.ts
          run_test test/ag01-orchestrator-postgres-e2e.test.ts
          run_test test/attribution-revenue-postgres-e2e.test.ts
          run_test test/tenant-approval-postgres-e2e.test.ts
          run_test test/omnichannel-prepared-content-postgres-e2e.test.ts

      - name: Prove human approval and timer resume across process restart
        working-directory: candidate
        shell: bash
        run: pnpm exec tsx scripts/staging-e2e/durable-workflow.ts 2>&1 | tee "$EVIDENCE_DIR/durable-workflow.log"

      - id: mcp_token
        name: Mint short-lived MCP token for staging service audience
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.WIF }}
          service_account: ${{ env.DEPLOYER_SA }}
          token_format: id_token
          id_token_audience: ${{ steps.runtime.outputs.mcp_base_url }}

      - name: Run authenticated read-only MCP protocol smoke
        shell: bash
        env:
          MCP_URL: ${{ steps.runtime.outputs.mcp_base_url }}
          MCP_TOKEN: ${{ steps.mcp_token.outputs.id_token }}
        run: |
          set -euo pipefail
          MCP_CLIENT_DIR="$RUNNER_TEMP/toca-mcp-client"
          mkdir -p "$MCP_CLIENT_DIR"
          cp "$HARNESS_ROOT/scripts/staging-e2e/mcp-smoke.mjs" "$MCP_CLIENT_DIR/mcp-smoke.mjs"
          cd "$MCP_CLIENT_DIR"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --save-exact @modelcontextprotocol/client@2.0.0
          node mcp-smoke.mjs 2>&1 | tee "$EVIDENCE_DIR/mcp-protocol-smoke.log"

      - name: Settle only allowlisted synthetic outbox records without providers
        if: always() && steps.database.outputs.ready == 'yes'
        working-directory: candidate
        shell: bash
        run: pnpm exec tsx scripts/staging-e2e/settle-outbox.ts 2>&1 | tee "$EVIDENCE_DIR/outbox-settlement.log"

      - name: Verify post-E2E readiness and unchanged exact traffic
        shell: bash
        env:
          MCP_URL: ${{ steps.runtime.outputs.mcp_base_url }}
          MCP_TOKEN: ${{ steps.mcp_token.outputs.id_token }}
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --output "$EVIDENCE_DIR/mcp-readyz-after-e2e.json" --write-out '%{http_code}' -H "Authorization: Bearer $MCP_TOKEN" "$MCP_URL/readyz")"
          test "$STATUS" = 200
          jq -e '.status=="ready" and (.checks|length)==16 and (.checks|all(.ok==true))' "$EVIDENCE_DIR/mcp-readyz-after-e2e.json" >/dev/null
          gcloud run services describe "$MCP_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$EVIDENCE_DIR/mcp-service-after-e2e.json"
          gcloud run services describe "$WEBHOOK_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$EVIDENCE_DIR/webhook-service-after-e2e.json"
          jq -e --arg rev "$MCP_REVISION" '[.status.traffic[]? | select(.revisionName==$rev and (.percent // 0)==100)] | length == 1' "$EVIDENCE_DIR/mcp-service-after-e2e.json" >/dev/null
          jq -e --arg rev "$WEBHOOK_REVISION" '[.status.traffic[]? | select(.revisionName==$rev and (.percent // 0)==100)] | length == 1' "$EVIDENCE_DIR/webhook-service-after-e2e.json" >/dev/null
          echo 'POST_E2E_READINESS_AND_TRAFFIC=PASS'

      - name: Write immutable acceptance manifest
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg sourceSha "$CANDIDATE_SHA" \
            --arg sourceTree "$CANDIDATE_TREE" \
            --arg indexDigest "$IMAGE_INDEX_DIGEST" \
            --arg childDigest "$RUNTIME_CHILD_DIGEST" \
            --arg mcpRevision "$MCP_REVISION" \
            --arg webhookRevision "$WEBHOOK_REVISION" \
            --arg runUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{schemaVersion:"toca.staging.acceptance-e2e.v1",sourceSha:$sourceSha,sourceTree:$sourceTree,ociIndexDigest:$indexDigest,runtimeChildDigest:$childDigest,revisions:{mcp:$mcpRevision,webhook:$webhookRevision},trafficPercent:100,migrations:{head:"033_omnichannel_prepared_content.sql",migration027Present:false,drift:false,publicNoopRuns:2,ephemeralApplyCount:27,ephemeralNoopRuns:1},testIsolation:"ephemeral-schema",contracts:["M-FOUND-12 durability","CRM sales lifecycle","WhatsApp persistence and replay","AG-01 checkpoint durability","attribution and revenue readback gate","tenant-scoped ApprovalRecord","immutable prepared content","human approval resume","timer resume","authenticated MCP read-only smoke"],providers:"DISABLED",googleAdsPhase:"OFF",sideEffectingProviderCall:"NO",providerMutation:"NO",trafficMutation:"NO",productionMutation:"NO",runUrl:$runUrl,result:"PASS"}' > "$EVIDENCE_DIR/manifest.json"

      - name: Drop exact ephemeral acceptance schema
        if: always() && steps.acceptance_schema.outputs.created == 'yes'
        working-directory: candidate
        shell: bash
        run: pnpm exec tsx scripts/staging-e2e/ephemeral-schema.ts drop

      - name: Stop Cloud SQL proxy
        if: always()
        shell: bash
        run: |
          if [[ -n "${PROXY_PID:-}" ]]; then
            kill "$PROXY_PID" 2>/dev/null || true
          fi

      - name: Upload immutable staging E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-acceptance-e2e-75c165a
          path: staging-e2e-evidence
          if-no-files-found: error
          retention-days: 30

  staging-operational-preflight:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      EVIDENCE_DIR: ${{ github.workspace }}/staging-operational-evidence
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Assert exact application identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          printf '%s\n' \
            "APPLICATION_CANDIDATE_SHA=$CANDIDATE_SHA" \
            "APPLICATION_CANDIDATE_TREE=$CANDIDATE_TREE" \
            'PRODUCTION_AUTHORIZED=NO' \
            'PROVIDER_CALLS_AUTHORIZED=NO' \
            'MUTATION_MODE=READ_ONLY' \
            > "$EVIDENCE_DIR/release-identity.txt"

      - name: Authenticate isolated staging WIF
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.WIF }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - id: operational_runtime
        name: Fail-closed project and runtime identity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_NUMBER="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
          test "$ACTUAL_NUMBER" = "$PROJECT_NUMBER"
          test "$PROJECT_ID" != "$PRODUCTION_PROJECT_ID"
          test "$PROJECT_NUMBER" != "$PRODUCTION_PROJECT_NUMBER"

          gcloud run services describe "$MCP_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$EVIDENCE_DIR/mcp-service.json"
          gcloud run services describe "$WEBHOOK_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$EVIDENCE_DIR/webhook-service.json"
          gcloud run revisions describe "$MCP_REVISION" --project "$PROJECT_ID" --region "$REGION" --format=json > "$EVIDENCE_DIR/mcp-revision.json"
          gcloud run revisions describe "$WEBHOOK_REVISION" --project "$PROJECT_ID" --region "$REGION" --format=json > "$EVIDENCE_DIR/webhook-revision.json"

          jq -e --arg rev "$MCP_REVISION" '[.status.traffic[]? | select(.revisionName==$rev and (.percent // 0)==100)] | length == 1' "$EVIDENCE_DIR/mcp-service.json" >/dev/null
          jq -e --arg rev "$WEBHOOK_REVISION" '[.status.traffic[]? | select(.revisionName==$rev and (.percent // 0)==100)] | length == 1' "$EVIDENCE_DIR/webhook-service.json" >/dev/null
          for file in "$EVIDENCE_DIR/mcp-revision.json" "$EVIDENCE_DIR/webhook-revision.json"; do
            jq -e --arg sha "$CANDIDATE_SHA" '[.spec.containers[0].env[]? | select(.name=="TOCA_RELEASE_SHA") | .value] == [$sha]' "$file" >/dev/null
            jq -e 'any(.status.conditions[]?; .type=="Ready" and .status=="True")' "$file" >/dev/null
          done
          MCP_BASE_URL="$(jq -r '.status.url' "$EVIDENCE_DIR/mcp-service.json")"
          test -n "$MCP_BASE_URL"
          echo "mcp_base_url=$MCP_BASE_URL" >> "$GITHUB_OUTPUT"
          echo 'STAGING_EXACT_RUNTIME_IDENTITY=PASS'

      - id: operational_mcp_token
        name: Mint short-lived token for readiness sampling
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.WIF }}
          service_account: ${{ env.DEPLOYER_SA }}
          token_format: id_token
          id_token_audience: ${{ steps.operational_runtime.outputs.mcp_base_url }}

      - name: Capture redacted provider configuration inventory
        shell: bash
        run: |
          set -euo pipefail
          jq '
            [
              .spec.containers[0].env[]?
              | select(.name | test("^(META_|INSTAGRAM_|WHATSAPP_|EMAIL_SENDGRID_|GOOGLE_ADS_|AG01_MODEL_)"))
              | if .valueFrom.secretKeyRef? then
                  {
                    name,
                    source: "secret_ref",
                    secretName: .valueFrom.secretKeyRef.name,
                    secretVersion: .valueFrom.secretKeyRef.key
                  }
                elif (.name | test("(TOKEN|SECRET|PASSWORD|API_KEY)")) then
                  {name, source: "literal", value: "REDACTED_IF_PRESENT"}
                else
                  {name, source: "literal", value: (.value // null)}
                end
            ]
          ' "$EVIDENCE_DIR/mcp-revision.json" > "$EVIDENCE_DIR/provider-runtime-env.json"

          node - <<'NODE'
          const fs = require('fs');
          const path = process.env.EVIDENCE_DIR + '/provider-runtime-env.json';
          const rows = JSON.parse(fs.readFileSync(path, 'utf8'));
          const byName = Object.fromEntries(rows.map((row) => [row.name, row]));
          const value = (name) => byName[name]?.value ?? null;
          const secretRefs = rows.filter((row) => row.source === 'secret_ref').map((row) => row.name);
          const matrix = {
            schemaVersion: 'toca.staging.provider-preflight.v1',
            exactCandidateSha: process.env.CANDIDATE_SHA,
            externalProviderCallsExecuted: false,
            productionMutationExecuted: false,
            secretValuesRead: false,
            providers: {
              metaInstagram: {
                runtimeEnabled: value('META_ENABLED') === 'true',
                providerVerified: value('META_PROVIDER_VERIFIED') === 'true',
                instagramReadEnabled: value('INSTAGRAM_READ_ENABLED') === 'true',
                secretReferencePresent: secretRefs.some((name) => name.startsWith('META_')),
                status: 'BLOCKED_NOT_BOUND_IN_STAGING',
              },
              whatsapp: {
                runtimeEnabled:
                  value('WHATSAPP_ENABLED') === 'true' &&
                  value('WHATSAPP_RUNTIME_ENABLED') === 'true',
                providerVerified: value('WHATSAPP_PROVIDER_VERIFIED') === 'true',
                secretReferencePresent: secretRefs.some((name) => name.startsWith('WHATSAPP_')),
                status: 'BLOCKED_NOT_BOUND_IN_STAGING',
              },
              sendgrid: {
                runtimeEnabled: value('EMAIL_SENDGRID_ENABLED') === 'true',
                providerVerified: value('EMAIL_SENDGRID_PROVIDER_VERIFIED') === 'true',
                secretReferencePresent: secretRefs.some((name) =>
                  name.startsWith('EMAIL_SENDGRID_'),
                ),
                status: 'BLOCKED_NOT_BOUND_IN_STAGING',
              },
              googleAds: {
                phase: value('GOOGLE_ADS_PHASE'),
                providerVerified: value('GOOGLE_ADS_PROVIDER_VERIFIED') === 'true',
                secretReferencePresent: secretRefs.some((name) => name.startsWith('GOOGLE_ADS_')),
                activationExecuted: false,
                status: 'BLOCKED_OFF_AND_UNVERIFIED',
              },
              ag01Model: {
                runtimeEnabled: value('AG01_MODEL_ENABLED') === 'true',
                providerVerified: value('AG01_MODEL_PROVIDER_VERIFIED') === 'true',
                secretReferencePresent: secretRefs.some((name) => name.startsWith('AG01_MODEL_')),
                status: 'BLOCKED_NOT_BOUND_IN_STAGING',
              },
            },
            promotionEligible: false,
          };
          fs.writeFileSync(
            process.env.EVIDENCE_DIR + '/provider-preflight.json',
            JSON.stringify(matrix, null, 2) + '\n',
          );
          NODE
          jq -e '
            .externalProviderCallsExecuted == false and
            .productionMutationExecuted == false and
            .secretValuesRead == false and
            .providers.metaInstagram.runtimeEnabled == false and
            .providers.metaInstagram.providerVerified == false and
            .providers.metaInstagram.secretReferencePresent == false and
            .providers.whatsapp.runtimeEnabled == false and
            .providers.whatsapp.providerVerified == false and
            .providers.whatsapp.secretReferencePresent == false and
            .providers.sendgrid.runtimeEnabled == false and
            .providers.sendgrid.providerVerified == false and
            .providers.sendgrid.secretReferencePresent == false and
            .providers.googleAds.phase == "OFF" and
            .providers.googleAds.providerVerified == false and
            .providers.googleAds.secretReferencePresent == false and
            .providers.googleAds.activationExecuted == false and
            .providers.ag01Model.runtimeEnabled == false and
            .providers.ag01Model.providerVerified == false and
            .providers.ag01Model.secretReferencePresent == false and
            .promotionEligible == false
          ' "$EVIDENCE_DIR/provider-preflight.json" >/dev/null
          echo 'STAGING_PROVIDER_PREFLIGHT=BLOCKED_FAIL_CLOSED'

      - name: Read Cloud SQL protection, backup and recovery window
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gcloud sql instances describe "$DATABASE_INSTANCE" --project "$PROJECT_ID" --format=json > "$EVIDENCE_DIR/cloud-sql-instance.json"
          jq '{
            name,
            state,
            databaseVersion,
            region,
            settings: {
              deletionProtectionEnabled: .settings.deletionProtectionEnabled,
              backupEnabled: .settings.backupConfiguration.enabled,
              pitrEnabled: .settings.backupConfiguration.pointInTimeRecoveryEnabled,
              availabilityType: .settings.availabilityType,
              tier: .settings.tier,
              edition: .settings.edition,
              transactionLogRetentionDays: .settings.backupConfiguration.transactionLogRetentionDays
            }
          }' "$EVIDENCE_DIR/cloud-sql-instance.json" > "$EVIDENCE_DIR/cloud-sql-settings.json"

          gcloud sql backups list --instance "$DATABASE_INSTANCE" --project "$PROJECT_ID" --limit 20 --format=json > "$EVIDENCE_DIR/cloud-sql-backups.json"
          TOKEN="$(gcloud auth print-access-token)"
          HTTP="$(curl --silent --show-error --output "$EVIDENCE_DIR/cloud-sql-recovery-window.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://sqladmin.googleapis.com/v1/projects/${PROJECT_ID}/instances/${DATABASE_INSTANCE}/getLatestRecoveryTime")"
          printf '%s\n' "$HTTP" > "$EVIDENCE_DIR/cloud-sql-recovery-window.http"

          jq -e '
            .state == "RUNNABLE" and
            .region == "southamerica-east1" and
            .settings.deletionProtectionEnabled == true and
            .settings.backupEnabled == true and
            .settings.pitrEnabled == true
          ' "$EVIDENCE_DIR/cloud-sql-settings.json" >/dev/null
          jq -e '[.[] | select(.status=="SUCCESSFUL")] | length > 0' "$EVIDENCE_DIR/cloud-sql-backups.json" >/dev/null
          test "$HTTP" = 200
          jq -e '.latestRecoveryTime and .earliestRecoveryTime' "$EVIDENCE_DIR/cloud-sql-recovery-window.json" >/dev/null
          echo 'STAGING_CLOUD_SQL_READINESS=PASS'

      - name: Read current operational IAM
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          jq -n '{
            permissions: [
              "cloudsql.instances.get",
              "cloudsql.instances.clone",
              "cloudsql.instances.delete",
              "cloudsql.instances.update",
              "monitoring.alertPolicies.get",
              "monitoring.alertPolicies.list",
              "monitoring.notificationChannels.get",
              "monitoring.notificationChannels.list"
            ]
          }' > /tmp/iam-request.json
          HTTP="$(curl --silent --show-error --output "$EVIDENCE_DIR/iam-permissions.json" --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/iam-request.json \
            "https://cloudresourcemanager.googleapis.com/v1/projects/${PROJECT_ID}:testIamPermissions")"
          test "$HTTP" = 200
          jq -e '.permissions | type == "array"' "$EVIDENCE_DIR/iam-permissions.json" >/dev/null
          echo 'STAGING_OPERATIONAL_IAM_READ=PASS'

      - name: Read Monitoring policies and channels
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          POLICIES_HTTP="$(curl --silent --show-error --output "$EVIDENCE_DIR/monitoring-alert-policies.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://monitoring.googleapis.com/v3/projects/${PROJECT_ID}/alertPolicies?pageSize=100")"
          CHANNELS_HTTP="$(curl --silent --show-error --output "$EVIDENCE_DIR/monitoring-notification-channels.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://monitoring.googleapis.com/v3/projects/${PROJECT_ID}/notificationChannels?pageSize=100")"
          jq -n \
            --arg policiesHttp "$POLICIES_HTTP" \
            --arg channelsHttp "$CHANNELS_HTTP" \
            --argjson policyCount "$(jq '(.alertPolicies // []) | length' "$EVIDENCE_DIR/monitoring-alert-policies.json")" \
            --argjson enabledPolicyCount "$(jq '[.alertPolicies[]? | select(.enabled == true)] | length' "$EVIDENCE_DIR/monitoring-alert-policies.json")" \
            --argjson channelCount "$(jq '(.notificationChannels // []) | length' "$EVIDENCE_DIR/monitoring-notification-channels.json")" \
            --argjson verifiedChannelCount "$(jq '[.notificationChannels[]? | select(.verificationStatus == "VERIFIED" and .enabled == true)] | length' "$EVIDENCE_DIR/monitoring-notification-channels.json")" \
            '{
              policiesHttp: $policiesHttp,
              channelsHttp: $channelsHttp,
              policyCount: $policyCount,
              enabledPolicyCount: $enabledPolicyCount,
              channelCount: $channelCount,
              verifiedChannelCount: $verifiedChannelCount,
              providerPathFiringTestExecuted: false
            }' > "$EVIDENCE_DIR/monitoring-summary.json"
          echo 'STAGING_MONITORING_INVENTORY=CAPTURED'

      - name: Sample authenticated readiness
        shell: bash
        env:
          MCP_URL: ${{ steps.operational_runtime.outputs.mcp_base_url }}
          MCP_TOKEN: ${{ steps.operational_mcp_token.outputs.id_token }}
        run: |
          set -euo pipefail
          test -n "$MCP_URL"
          test -n "$MCP_TOKEN"
          : > "$EVIDENCE_DIR/readiness-samples.jsonl"
          for index in $(seq 1 30); do
            STATUS_AND_TIME="$(curl --silent --show-error --output /tmp/ready-body.json --write-out '%{http_code} %{time_total}' \
              -H "Authorization: Bearer ${MCP_TOKEN}" "$MCP_URL/readyz")"
            STATUS="$(cut -d' ' -f1 <<<"$STATUS_AND_TIME")"
            ELAPSED="$(cut -d' ' -f2 <<<"$STATUS_AND_TIME")"
            test "$STATUS" = 200
            jq -e '.status=="ready" and (.checks | length == 16) and all(.checks[]; .ok==true)' /tmp/ready-body.json >/dev/null
            jq -n --argjson index "$index" --argjson status "$STATUS" --argjson seconds "$ELAPSED" \
              '{index:$index,status:$status,seconds:$seconds}' >> "$EVIDENCE_DIR/readiness-samples.jsonl"
          done
          jq -s '
            sort_by(.seconds) as $rows
            | {
                requestCount: ($rows | length),
                http200Count: ([$rows[] | select(.status==200)] | length),
                minSeconds: $rows[0].seconds,
                p50Seconds: $rows[((($rows|length) * 0.50 | ceil) - 1)].seconds,
                p95Seconds: $rows[((($rows|length) * 0.95 | ceil) - 1)].seconds,
                maxSeconds: $rows[-1].seconds,
                allChecksHealthy: true
              }
          ' "$EVIDENCE_DIR/readiness-samples.jsonl" > "$EVIDENCE_DIR/readiness-summary.json"
          jq -e '.requestCount==30 and .http200Count==30 and .allChecksHealthy==true' "$EVIDENCE_DIR/readiness-summary.json" >/dev/null
          echo 'STAGING_READINESS_SAMPLE=PASS'

      - name: Build promotion gate manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const dir = process.env.EVIDENCE_DIR;
          const read = (name, fallback = null) => {
            try {
              return JSON.parse(fs.readFileSync(dir + '/' + name, 'utf8'));
            } catch {
              return fallback;
            }
          };
          const permissions = read('iam-permissions.json', { permissions: [] }).permissions ?? [];
          const requiredDr = [
            'cloudsql.instances.get',
            'cloudsql.instances.clone',
            'cloudsql.instances.delete',
            'cloudsql.instances.update',
          ];
          const sql = read('cloud-sql-settings.json', {});
          const backups = read('cloud-sql-backups.json', []);
          const recovery = read('cloud-sql-recovery-window.json', {});
          const monitoring = read('monitoring-summary.json', {});
          const provider = read('provider-preflight.json', {});
          const readiness = read('readiness-summary.json', {});
          const latestMs = Date.parse(recovery.latestRecoveryTime ?? '');
          const recoveryLagSeconds = Number.isFinite(latestMs)
            ? Math.max(0, Math.ceil((Date.now() - latestMs) / 1000))
            : null;
          const databaseReady =
            sql.state === 'RUNNABLE' &&
            sql.settings?.deletionProtectionEnabled === true &&
            sql.settings?.backupEnabled === true &&
            sql.settings?.pitrEnabled === true &&
            backups.some((backup) => backup.status === 'SUCCESSFUL') &&
            recoveryLagSeconds !== null &&
            recoveryLagSeconds <= 900;
          const drAuthorityReady = requiredDr.every((permission) => permissions.includes(permission));
          const monitoringReady =
            monitoring.policiesHttp === '200' &&
            monitoring.channelsHttp === '200' &&
            monitoring.enabledPolicyCount > 0 &&
            monitoring.verifiedChannelCount > 0;
          const manifest = {
            schemaVersion: 'toca.staging.operational-preflight.v1',
            candidateSha: process.env.CANDIDATE_SHA,
            candidateTree: process.env.CANDIDATE_TREE,
            projectId: process.env.PROJECT_ID,
            productionTouched: false,
            externalProviderCallsExecuted: false,
            sideEffectsExecuted: false,
            runtimeReadinessPass:
              readiness.requestCount === 30 &&
              readiness.http200Count === 30 &&
              readiness.allChecksHealthy === true,
            databaseReadiness: {
              ready: databaseReady,
              recoveryLagSeconds,
              latestSuccessfulBackupPresent: backups.some(
                (backup) => backup.status === 'SUCCESSFUL',
              ),
            },
            drRehearsal: {
              executed: false,
              authorityReady: drAuthorityReady,
              missingPermissions: requiredDr.filter(
                (permission) => !permissions.includes(permission),
              ),
            },
            monitoring: {
              ready: monitoringReady,
              policyCount: monitoring.policyCount ?? null,
              enabledPolicyCount: monitoring.enabledPolicyCount ?? null,
              channelCount: monitoring.channelCount ?? null,
              verifiedChannelCount: monitoring.verifiedChannelCount ?? null,
              firingPathExecuted: false,
            },
            providersReady: provider.promotionEligible === true,
            promotionEligible: false,
            decision: 'HOLD',
          };
          fs.writeFileSync(
            dir + '/operational-preflight.json',
            JSON.stringify(manifest, null, 2) + '\n',
          );
          NODE
          cat "$EVIDENCE_DIR/operational-preflight.json"
          jq -e '
            .candidateSha == "75c165a044c6e79e9545328dd04a2a3e73d2e910" and
            .productionTouched == false and
            .externalProviderCallsExecuted == false and
            .sideEffectsExecuted == false and
            .runtimeReadinessPass == true and
            .promotionEligible == false and
            .decision == "HOLD"
          ' "$EVIDENCE_DIR/operational-preflight.json" >/dev/null
          echo 'STAGING_OPERATIONAL_PREFLIGHT=PASS_PROMOTION_HOLD'

      - name: Upload immutable operational evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-operational-preflight-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}
          path: staging-operational-evidence
          if-no-files-found: error
          retention-days: 90
