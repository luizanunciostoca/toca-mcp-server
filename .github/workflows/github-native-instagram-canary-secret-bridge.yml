name: GitHub Native Instagram Canary Secret Bridge

on:
  push:
    branches:
      - main
    paths:
      - control/github-native-publication-queue.json

permissions:
  contents: write
  id-token: write

concurrency:
  group: github-native-instagram-publisher
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: toca-mcp-production
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  GCP_RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  GCP_META_TOKEN_SECRET_ID: toca-meta-oauth-token
  TOCA_PUBLICATION_QUEUE_PATH: control/github-native-publication-queue.json
  TOCA_PUBLICATION_STATE_DIR: .publication-state-worktree/publication-state
  TOCA_PUBLICATION_EVIDENCE_PATH: github-native-publication-evidence.json
  TOCA_GITHUB_NATIVE_PUBLICATION_MODE: CANARY
  TOCA_GITHUB_NATIVE_PUBLICATION_WRITES_ENABLED: 'true'
  TOCA_GITHUB_NATIVE_MANUAL_WRITE_CONFIRMATION: 'true'
  TOCA_GITHUB_NATIVE_CANARY_CONTENT_ITEM_ID: MKT-20260917-SUNSET-FEED-0900
  META_GRAPH_BASE_URL: https://graph.facebook.com

jobs:
  publish-canary:
    if: github.event.before == '69f388b2726b64f622b7fb2e51a65460b68e7022'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ vars.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v24.0' }}
    steps:
      - name: Checkout exact trusted default-branch controller SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact controller SHA and trusted ref
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF}" = "refs/heads/${DEFAULT_BRANCH}"
          test "${{ github.event.before }}" = '69f388b2726b64f622b7fb2e51a65460b68e7022'

      - name: Checkout immutable publication ledger branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: publication-state
          path: .publication-state-worktree
          persist-credentials: true
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build exact controller
        run: pnpm build

      - name: Wait for protected publication window
        shell: bash
        run: |
          set -euo pipefail
          item_count="$(jq --arg id "$TOCA_GITHUB_NATIVE_CANARY_CONTENT_ITEM_ID" '[.items[] | select(.contentItemId == $id)] | length' "$TOCA_PUBLICATION_QUEUE_PATH")"
          test "$item_count" -eq 1
          scheduled_at="$(jq -r --arg id "$TOCA_GITHUB_NATIVE_CANARY_CONTENT_ITEM_ID" '.items[] | select(.contentItemId == $id) | .scheduledAt' "$TOCA_PUBLICATION_QUEUE_PATH")"
          expires_at="$(jq -r --arg id "$TOCA_GITHUB_NATIVE_CANARY_CONTENT_ITEM_ID" '.items[] | select(.contentItemId == $id) | .expiresAt' "$TOCA_PUBLICATION_QUEUE_PATH")"
          test -n "$scheduled_at" && test "$scheduled_at" != "null"
          test -n "$expires_at" && test "$expires_at" != "null"
          target_epoch="$(date -d "$scheduled_at" +%s)"
          expires_epoch="$(date -d "$expires_at" +%s)"
          now_epoch="$(date +%s)"
          delay=$((target_epoch - now_epoch))
          if [ "$delay" -gt 0 ]; then
            test "$delay" -le 900
            sleep "$delay"
          fi
          now_epoch="$(date +%s)"
          test "$now_epoch" -ge $((target_epoch - 300))
          test "$now_epoch" -le $((target_epoch + 300))
          test "$now_epoch" -le "$expires_epoch"

      - name: Authenticate runtime identity directly through WIF
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_RUNTIME_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Execute fail-closed canary with runtime Meta token
        shell: bash
        env:
          TOCA_GITHUB_NATIVE_CONTROLLER_SHA: ${{ github.sha }}
          TOCA_GITHUB_NATIVE_WORKFLOW_RUN_ID: ${{ github.run_id }}
          TOCA_GITHUB_NATIVE_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'luizanunciostoca/toca-mcp-server'
          test "$GITHUB_REF" = 'refs/heads/main'
          item_count="$(jq --arg id "$TOCA_GITHUB_NATIVE_CANARY_CONTENT_ITEM_ID" '[.items[] | select(.contentItemId == $id)] | length' "$TOCA_PUBLICATION_QUEUE_PATH")"
          test "$item_count" -eq 1
          scheduled_at="$(jq -r --arg id "$TOCA_GITHUB_NATIVE_CANARY_CONTENT_ITEM_ID" '.items[] | select(.contentItemId == $id) | .scheduledAt' "$TOCA_PUBLICATION_QUEUE_PATH")"
          expires_at="$(jq -r --arg id "$TOCA_GITHUB_NATIVE_CANARY_CONTENT_ITEM_ID" '.items[] | select(.contentItemId == $id) | .expiresAt' "$TOCA_PUBLICATION_QUEUE_PATH")"
          target_epoch="$(date -d "$scheduled_at" +%s)"
          expires_epoch="$(date -d "$expires_at" +%s)"
          now_epoch="$(date +%s)"
          test "$now_epoch" -ge $((target_epoch - 300))
          test "$now_epoch" -le $((target_epoch + 300))
          test "$now_epoch" -le "$expires_epoch"
          meta_token="$(gcloud secrets versions access latest \
            --secret="$GCP_META_TOKEN_SECRET_ID" \
            --project="$GCP_PROJECT_ID")"
          test -n "$meta_token"
          echo "::add-mask::$meta_token"
          export META_ACCESS_TOKEN="$meta_token"
          node dist/src/github-native-publication/github-native-publication-runtime.js
          test -s "$TOCA_PUBLICATION_EVIDENCE_PATH"
          jq -e --arg id "$TOCA_GITHUB_NATIVE_CANARY_CONTENT_ITEM_ID" '
            (.items | length) == 1 and
            .items[0].contentItemId == $id and
            (.items[0].outcome == "PUBLISHED_AND_READBACK_VERIFIED" or
             .items[0].outcome == "RECONCILED_ALREADY_PUBLISHED_READBACK_VERIFIED") and
            (.items[0].externalMediaId | type == "string" and length > 0)
          ' "$TOCA_PUBLICATION_EVIDENCE_PATH" >/dev/null

      - name: Persist publication ledger only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ledger=.publication-state-worktree
          mkdir -p "$ledger/publication-state"
          if [ -n "$(git -C "$ledger" status --porcelain -- publication-state)" ]; then
            git -C "$ledger" config user.name "toca-publication-ledger[bot]"
            git -C "$ledger" config user.email "toca-publication-ledger[bot]@users.noreply.github.com"
            git -C "$ledger" add -- publication-state
            git -C "$ledger" commit -m "state(instagram): canary run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            git -C "$ledger" push origin HEAD:publication-state
          fi

      - name: Upload immutable publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-native-instagram-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: github-native-publication-evidence.json
          if-no-files-found: warn
          retention-days: 90
