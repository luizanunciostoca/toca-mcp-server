name: Temporary GCP Publish Now Hardening Patcher

on:
  push:
    branches:
      - ops/activate-gcp-instagram-writer-20260916
    paths:
      - 'scripts/tmp-harden-gcp-publish-now.py'
      - '.github/workflows/tmp-harden-gcp-publish-now.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 1

      - name: Normalize temporary patcher delimiter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/tmp-harden-gcp-publish-now.py')
          text = path.read_text(encoding='utf-8')
          start = "wrapper = r'''#!/usr/bin/env bash"
          end = "exec bash \"$PATCHED\"\n'''\nwrapper_path.write_text(wrapper, encoding='utf-8')"
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit('temporary wrapper delimiter anchors did not match exactly once')
          text = text.replace(start, 'wrapper = r\"\"\"#!/usr/bin/env bash', 1)
          text = text.replace(
              end,
              "exec bash \"$PATCHED\"\n\"\"\"\nwrapper_path.write_text(wrapper, encoding='utf-8')",
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile scripts/tmp-harden-gcp-publish-now.py

      - name: Apply deterministic hardening patch
        run: python3 scripts/tmp-harden-gcp-publish-now.py

      - name: Remove expired GitHub-native canary controllers
        run: |
          git rm .github/workflows/instagram-canary-window-controller.yml
          git rm .github/workflows/instagram-publication-canary-recovery-controller.yml

      - name: Verify patched source and retire patcher
        run: |
          set -euo pipefail
          bash -n scripts/marketing-publish-now.sh
          bash -n scripts/marketing-publish-now-fixed.sh
          grep -Fq 'Authorization: Bearer ${GOOGLE_ACCESS_TOKEN}' scripts/marketing-publish-now.sh
          test "$(grep -Fc 'DATABASE_URL=$DATABASE_SECRET_ID:$DATABASE_SECRET_VERSION' scripts/marketing-publish-now.sh)" -eq 2
          ! grep -Fq 'DATABASE_URL=$DATABASE_SECRET_ID:latest' scripts/marketing-publish-now.sh
          grep -Fq 'APP_IMAGE="${app_image_tag%:*}@${APP_IMAGE_DIGEST}"' scripts/marketing-publish-now.sh
          grep -Fq 'PREP_IMAGE="${prep_image_tag%:*}@${PREP_IMAGE_DIGEST}"' scripts/marketing-publish-now.sh
          grep -Fq 'verify_writes_disabled' scripts/marketing-publish-now.sh
          git rm scripts/tmp-harden-gcp-publish-now.py
          git rm .github/workflows/tmp-harden-gcp-publish-now.yml
          git diff --check

      - name: Commit clean final tree to PR branch
        run: |
          set -euo pipefail
          git config user.name 'toca-hardening[bot]'
          git config user.email 'toca-hardening[bot]@users.noreply.github.com'
          git add scripts/marketing-publish-now.sh scripts/marketing-publish-now-fixed.sh
          git commit -m 'security(instagram): harden GCP publication execution boundary'
          git push origin HEAD:ops/activate-gcp-instagram-writer-20260916
