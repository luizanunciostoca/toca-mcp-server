name: Temporary GCP Recovery Bootstrap Boundary Fixer

on:
  push:
    branches:
      - fix/gcp-recovery-verify-bootstrap-apis-20260916
    paths:
      - '.github/workflows/tmp-fix-gcp-recovery-bootstrap-boundary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/gcp-recovery-verify-bootstrap-apis-20260916
          persist-credentials: false
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove Service Usage mutation from recovery runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/instagram-gcp-publication-recovery-preflight.yml')
          test_path = Path('test/instagram-gcp-publication-recovery-preflight.test.ts')

          lines = workflow_path.read_text().splitlines()
          step_name = '      - name: Reconcile only fixed allowlisted APIs and IAM bindings'
          if lines.count(step_name) != 1:
              raise SystemExit('EXPECTED_RECOVERY_STEP_NAME_NOT_FOUND_EXACTLY_ONCE')
          step_index = lines.index(step_name)
          lines[step_index] = '      - name: Reconcile only fixed allowlisted IAM bindings'

          api_start_line = '          approved_apis=('
          runtime_line = '          runtime_member="serviceAccount:${GCP_RUNTIME_SERVICE_ACCOUNT}"'
          if lines.count(api_start_line) != 1:
              raise SystemExit('EXPECTED_RECOVERY_API_START_NOT_FOUND_EXACTLY_ONCE')
          api_start = lines.index(api_start_line)
          runtime_candidates = [
              index
              for index in range(api_start + 1, len(lines))
              if lines[index] == runtime_line
          ]
          if not runtime_candidates:
              raise SystemExit('EXPECTED_RECOVERY_RUNTIME_BOUNDARY_NOT_FOUND_AFTER_API_BLOCK')
          runtime_index = runtime_candidates[0]
          replacement = [
              '          # API enablement is an external production bootstrap precondition.',
              '          # This recovery workflow never grants itself Service Usage authority.',
          ]
          lines[api_start:runtime_index] = replacement

          verify_start_line = '          for api in artifactregistry.googleapis.com run.googleapis.com secretmanager.googleapis.com iamcredentials.googleapis.com sqladmin.googleapis.com logging.googleapis.com; do'
          if lines.count(verify_start_line) != 1:
              raise SystemExit('EXPECTED_RECOVERY_API_VERIFY_START_NOT_FOUND_EXACTLY_ONCE')
          verify_start = lines.index(verify_start_line)
          verify_done = next(
              index
              for index in range(verify_start + 1, len(lines))
              if lines[index] == '          done'
          )
          verify_end = verify_done + 1
          if verify_end < len(lines) and lines[verify_end] == '':
              verify_end += 1
          del lines[verify_start:verify_end]

          evidence_old = 'requiredApisEnabled:true'
          evidence_new = 'requiredApisExternalBootstrap:true'
          joined = '\n'.join(lines) + '\n'
          if joined.count(evidence_old) != 1:
              raise SystemExit('EXPECTED_RECOVERY_API_EVIDENCE_NOT_FOUND_EXACTLY_ONCE')
          joined = joined.replace(evidence_old, evidence_new)
          workflow_path.write_text(joined)

          test_lines = test_path.read_text().splitlines()
          assertion = "    expect(workflow).toContain('approved_apis=(');"
          if test_lines.count(assertion) != 1:
              raise SystemExit('EXPECTED_RECOVERY_API_TEST_ASSERTION_NOT_FOUND_EXACTLY_ONCE')
          assertion_index = test_lines.index(assertion)
          test_lines[assertion_index:assertion_index + 1] = [
              "    expect(workflow).not.toContain('gcloud services enable');",
              "    expect(workflow).not.toContain('gcloud services list --enabled');",
              "    expect(workflow).toContain('requiredApisExternalBootstrap:true');",
          ]
          test_path.write_text('\n'.join(test_lines) + '\n')
          PY
          pnpm prettier --write \
            .github/workflows/instagram-gcp-publication-recovery-preflight.yml \
            test/instagram-gcp-publication-recovery-preflight.test.ts
          git diff --check
      - name: Upload exact corrected blobs without moving refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upload_blob() {
            local path="$1"
            jq -Rs '{content: ., encoding: "utf-8"}' "$path" > /tmp/blob-payload.json
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header 'Content-Type: application/json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
              --data-binary @/tmp/blob-payload.json \
              | jq -r '.sha'
          }
          workflow_blob="$(upload_blob .github/workflows/instagram-gcp-publication-recovery-preflight.yml)"
          test_blob="$(upload_blob test/instagram-gcp-publication-recovery-preflight.test.ts)"
          [[ "$workflow_blob" =~ ^[0-9a-f]{40}$ ]]
          [[ "$test_blob" =~ ^[0-9a-f]{40}$ ]]
          echo "CORRECTED_WORKFLOW_BLOB_SHA=$workflow_blob"
          echo "CORRECTED_TEST_BLOB_SHA=$test_blob"
