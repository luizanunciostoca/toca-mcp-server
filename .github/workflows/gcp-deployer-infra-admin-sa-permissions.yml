name: GCP Deployer Infra Admin SA Permissions

on:
  pull_request:
    paths:
      - '.github/workflows/gcp-deployer-infra-admin-sa-permissions.yml'

permissions:
  contents: read
  id-token: write

env:
  CANDIDATE_SHA: 7db1a6e5caf01f98b200257c4aeecc2f1b29550a
  PROJECT_ID: toca-mcp-production
  WIF_PROVIDER: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
  DEPLOYER_SA: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
  INFRA_ADMIN_SA: toca-mcp-infra-admin@toca-mcp-production.iam.gserviceaccount.com
  CLOUDSDK_CORE_DISABLE_PROMPTS: '1'

jobs:
  test-permissions:
    name: Read-only deployer permissions on infra-admin SA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Assert exact frozen candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Authenticate deployer
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Test IAM permissions on infra-admin service account
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          SA_PATH="projects/$PROJECT_ID/serviceAccounts/$INFRA_ADMIN_SA"
          BODY='{"permissions":["iam.serviceAccounts.getIamPolicy","iam.serviceAccounts.setIamPolicy","iam.serviceAccounts.getAccessToken","iam.serviceAccounts.actAs"]}'
          HTTP_CODE="$(curl -sS -o /tmp/sa-perms.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$BODY" \
            "https://iam.googleapis.com/v1/$SA_PATH:testIamPermissions")"
          echo "HTTP_CODE=$HTTP_CODE"
          echo 'DEPLOYER_INFRA_ADMIN_SA_GRANTED_BEGIN'
          if [ "$HTTP_CODE" = '200' ]; then
            jq -c '{permissions:(.permissions // [])}' /tmp/sa-perms.json
          else
            jq -c '{error:(.error.status // "UNKNOWN")}' /tmp/sa-perms.json || true
          fi
          echo 'DEPLOYER_INFRA_ADMIN_SA_GRANTED_END'
          echo 'READ_ONLY=true'
