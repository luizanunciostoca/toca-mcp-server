name: Sunset Font Pin Probe

on:
  push:
    branches:
      - feat/sunset-font-pins-20260827

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Measure candidate font binaries
        shell: bash
        run: |
          set -euo pipefail
          sha256sum assets/fonts/BodoniModa-Variable.ttf assets/fonts/Montserrat-Variable.ttf
          file assets/fonts/BodoniModa-Variable.ttf assets/fonts/Montserrat-Variable.ttf
          if command -v fc-scan >/dev/null 2>&1; then
            printf 'BODONI_FAMILY='
            fc-scan --format '%{family}\n' assets/fonts/BodoniModa-Variable.ttf | head -n 1
            printf 'MONTSERRAT_FAMILY='
            fc-scan --format '%{family}\n' assets/fonts/Montserrat-Variable.ttf | head -n 1
          fi
