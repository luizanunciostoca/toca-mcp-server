name: Video Generative Provider Smoke

on:
  workflow_dispatch:
    inputs:
      authorization_ref:
        description: Owner authorization issue URL bound to the exact main SHA
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  issues: read

concurrency:
  group: video-generative-provider-smoke
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'toca-mcp-production' }}
      GCP_REGION: ${{ vars.GCP_REGION || 'southamerica-east1' }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY || 'toca-mcp' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp' }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || 'toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com' }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_MCP_RUNTIME_SERVICE_ACCOUNT || 'toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com' }}
      GCP_VIDEO_OPENAI_API_KEY_SECRET: ${{ vars.GCP_VIDEO_OPENAI_API_KEY_SECRET || vars.GCP_AG01_MODEL_API_KEY_SECRET || 'OPENAI_API_KEY' }}
      GCP_VIDEO_OPENAI_API_KEY_SECRET_VERSION: ${{ vars.GCP_VIDEO_OPENAI_API_KEY_SECRET_VERSION || vars.GCP_AG01_MODEL_API_KEY_SECRET_VERSION || 'latest' }}
      GCP_VIDEO_GOOGLE_OAUTH_CLIENT_ID_SECRET: ${{ vars.GCP_VIDEO_GOOGLE_OAUTH_CLIENT_ID_SECRET || 'GOOGLE_OAUTH_CLIENT_ID' }}
      GCP_VIDEO_GOOGLE_OAUTH_CLIENT_ID_SECRET_VERSION: ${{ vars.GCP_VIDEO_GOOGLE_OAUTH_CLIENT_ID_SECRET_VERSION || 'latest' }}
      GCP_VIDEO_GOOGLE_OAUTH_CLIENT_SECRET_SECRET: ${{ vars.GCP_VIDEO_GOOGLE_OAUTH_CLIENT_SECRET_SECRET || 'GOOGLE_OAUTH_CLIENT_SECRET' }}
      GCP_VIDEO_GOOGLE_OAUTH_CLIENT_SECRET_VERSION: ${{ vars.GCP_VIDEO_GOOGLE_OAUTH_CLIENT_SECRET_VERSION || 'latest' }}
      GCP_VIDEO_GOOGLE_OAUTH_REFRESH_TOKEN_SECRET: ${{ vars.GCP_VIDEO_GOOGLE_OAUTH_REFRESH_TOKEN_SECRET || 'GOOGLE_OAUTH_REFRESH_TOKEN' }}
      GCP_VIDEO_GOOGLE_OAUTH_REFRESH_TOKEN_SECRET_VERSION: ${{ vars.GCP_VIDEO_GOOGLE_OAUTH_REFRESH_TOKEN_SECRET_VERSION || 'latest' }}
      INSTAGRAM_PUBLICATION_ASSET_BUCKET_CONFIGURED: ${{ vars.INSTAGRAM_PUBLICATION_ASSET_BUCKET || 'toca-mcp-publication-assets' }}
      OPENAI_VIDEO_MODEL: ${{ vars.OPENAI_VIDEO_MODEL || 'sora-2' }}

    steps:
      - name: Checkout exact main candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate owner authorization and exact main SHA
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORIZATION_REF: ${{ inputs.authorization_ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PREFIX="https://github.com/${GITHUB_REPOSITORY}/issues/"
          [[ "$AUTHORIZATION_REF" == "$PREFIX"* ]]
          ISSUE_NUMBER="${AUTHORIZATION_REF#${PREFIX}}"
          [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > /tmp/video-auth.json
          jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" --arg sha "$GITHUB_SHA" '
            (.state == "open") and
            (.user.login == $owner) and
            (.title == "PROVIDER AUTHORIZATION — Video Generative Smoke TP-GEN-0001") and
            ((.body // "") | contains("AUTHORIZED_CANDIDATE_SHA=" + $sha)) and
            ((.body // "") | contains("AUTHORIZATION_STATE=ACTIVE")) and
            ((.body // "") | contains("VIDEO_CONTENT_ITEM_ID=VID-TP-20260904-DUAS-PISTAS-GEN-001")) and
            ((.body // "") | contains("VIDEO_GENERATIVE_SMOKE=AUTHORIZED")) and
            ((.body // "") | contains("PUBLICATION_AUTHORIZED=false"))
          ' /tmp/video-auth.json >/dev/null

      - name: Authenticate deployer to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Resolve governed runtime bindings without exposing secret values
        shell: bash
        run: |
          set -euo pipefail

          require_binding() {
            local value="$1" logical="$2"
            if [ -z "$value" ]; then
              echo "VIDEO_GENERATIVE_BINDING_REQUIRED:${logical}" >&2
              exit 1
            fi
          }

          OPENAI_SECRET="$GCP_VIDEO_OPENAI_API_KEY_SECRET"
          OPENAI_VERSION="$GCP_VIDEO_OPENAI_API_KEY_SECRET_VERSION"
          GOOGLE_CLIENT_ID_SECRET="$GCP_VIDEO_GOOGLE_OAUTH_CLIENT_ID_SECRET"
          GOOGLE_CLIENT_ID_VERSION="$GCP_VIDEO_GOOGLE_OAUTH_CLIENT_ID_SECRET_VERSION"
          GOOGLE_CLIENT_SECRET_SECRET="$GCP_VIDEO_GOOGLE_OAUTH_CLIENT_SECRET_SECRET"
          GOOGLE_CLIENT_SECRET_VERSION="$GCP_VIDEO_GOOGLE_OAUTH_CLIENT_SECRET_VERSION"
          GOOGLE_REFRESH_SECRET="$GCP_VIDEO_GOOGLE_OAUTH_REFRESH_TOKEN_SECRET"
          GOOGLE_REFRESH_VERSION="$GCP_VIDEO_GOOGLE_OAUTH_REFRESH_TOKEN_SECRET_VERSION"

          require_binding "$OPENAI_SECRET" openai_api_key_secret
          require_binding "$OPENAI_VERSION" openai_api_key_secret_version
          require_binding "$GOOGLE_CLIENT_ID_SECRET" google_oauth_client_id_secret
          require_binding "$GOOGLE_CLIENT_ID_VERSION" google_oauth_client_id_secret_version
          require_binding "$GOOGLE_CLIENT_SECRET_SECRET" google_oauth_client_secret_secret
          require_binding "$GOOGLE_CLIENT_SECRET_VERSION" google_oauth_client_secret_version
          require_binding "$GOOGLE_REFRESH_SECRET" google_oauth_refresh_token_secret
          require_binding "$GOOGLE_REFRESH_VERSION" google_oauth_refresh_token_secret_version

          BUCKET="$INSTAGRAM_PUBLICATION_ASSET_BUCKET_CONFIGURED"
          require_binding "$BUCKET" instagram_publication_asset_bucket

          {
            echo "VIDEO_OPENAI_SECRET=$OPENAI_SECRET"
            echo "VIDEO_OPENAI_VERSION=$OPENAI_VERSION"
            echo "VIDEO_GOOGLE_CLIENT_ID_SECRET=$GOOGLE_CLIENT_ID_SECRET"
            echo "VIDEO_GOOGLE_CLIENT_ID_VERSION=$GOOGLE_CLIENT_ID_VERSION"
            echo "VIDEO_GOOGLE_CLIENT_SECRET_SECRET=$GOOGLE_CLIENT_SECRET_SECRET"
            echo "VIDEO_GOOGLE_CLIENT_SECRET_VERSION=$GOOGLE_CLIENT_SECRET_VERSION"
            echo "VIDEO_GOOGLE_REFRESH_SECRET=$GOOGLE_REFRESH_SECRET"
            echo "VIDEO_GOOGLE_REFRESH_VERSION=$GOOGLE_REFRESH_VERSION"
            echo "VIDEO_ASSET_BUCKET=$BUCKET"
          } >> "$GITHUB_ENV"

          mkdir -p video-generative-evidence
          jq -n \
            --arg openai "$OPENAI_SECRET" --arg openaiVersion "$OPENAI_VERSION" \
            --arg clientId "$GOOGLE_CLIENT_ID_SECRET" --arg clientIdVersion "$GOOGLE_CLIENT_ID_VERSION" \
            --arg clientSecret "$GOOGLE_CLIENT_SECRET_SECRET" --arg clientSecretVersion "$GOOGLE_CLIENT_SECRET_VERSION" \
            --arg refresh "$GOOGLE_REFRESH_SECRET" --arg refreshVersion "$GOOGLE_REFRESH_VERSION" \
            --arg bucket "$BUCKET" \
            '{schemaVersion:1,openAiSecretId:$openai,openAiSecretVersion:$openaiVersion,googleOAuthClientIdSecretId:$clientId,googleOAuthClientIdSecretVersion:$clientIdVersion,googleOAuthClientSecretSecretId:$clientSecret,googleOAuthClientSecretSecretVersion:$clientSecretVersion,googleOAuthRefreshSecretId:$refresh,googleOAuthRefreshSecretVersion:$refreshVersion,assetBucket:$bucket,secretValuesExposed:false,secretEnumerationUsed:false}' \
            > video-generative-evidence/runtime-bindings.json

      - name: Build and push exact immutable smoke image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/server:video-gen-smoke-${GITHUB_SHA}"
          JOB_NAME="toca-video-gen-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --pull -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "JOB_NAME=$JOB_NAME" >> "$GITHUB_ENV"

      - name: Execute exact scene-continuation provider smoke
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            set +e
            gcloud run jobs delete "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true
            set -e
          }
          trap cleanup EXIT

          ENV_VARS="^~^VIDEO_GENERATIVE_SMOKE_SOURCE_SHA=$GITHUB_SHA~GCP_PROJECT_ID=$GCP_PROJECT_ID~INSTAGRAM_PUBLICATION_ASSET_BUCKET=$VIDEO_ASSET_BUCKET~OPENAI_API_KEY_ENV_KEY=TOCA_SECRET_VIDEO_OPENAI_API_KEY~OPENAI_VIDEO_MODEL=$OPENAI_VIDEO_MODEL~VIDEO_GOOGLE_OAUTH_CLIENT_ID_ENV_KEY=TOCA_SECRET_VIDEO_GOOGLE_CLIENT_ID~VIDEO_GOOGLE_OAUTH_CLIENT_SECRET_ENV_KEY=TOCA_SECRET_VIDEO_GOOGLE_CLIENT_SECRET~VIDEO_GOOGLE_OAUTH_REFRESH_TOKEN_ENV_KEY=TOCA_SECRET_VIDEO_GOOGLE_REFRESH_TOKEN"
          SECRET_BINDINGS="^~^TOCA_SECRET_VIDEO_OPENAI_API_KEY=$VIDEO_OPENAI_SECRET:$VIDEO_OPENAI_VERSION~TOCA_SECRET_VIDEO_GOOGLE_CLIENT_ID=$VIDEO_GOOGLE_CLIENT_ID_SECRET:$VIDEO_GOOGLE_CLIENT_ID_VERSION~TOCA_SECRET_VIDEO_GOOGLE_CLIENT_SECRET=$VIDEO_GOOGLE_CLIENT_SECRET_SECRET:$VIDEO_GOOGLE_CLIENT_SECRET_VERSION~TOCA_SECRET_VIDEO_GOOGLE_REFRESH_TOKEN=$VIDEO_GOOGLE_REFRESH_SECRET:$VIDEO_GOOGLE_REFRESH_VERSION"

          gcloud run jobs deploy "$JOB_NAME" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --command node \
            --args dist/src/video-generative-provider-smoke.js \
            --set-env-vars "$ENV_VARS" \
            --set-secrets "$SECRET_BINDINGS" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 1200s \
            --quiet

          gcloud run jobs execute "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet

          RESULT_JSON=''
          for attempt in $(seq 1 20); do
            LINE="$(gcloud logging read \
              "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME} AND textPayload:\"VIDEO_GENERATIVE_PROVIDER_SMOKE_RESULT=\"" \
              --project "$GCP_PROJECT_ID" --freshness=30m --limit=100 --order=desc \
              --format='value(textPayload)' | grep 'VIDEO_GENERATIVE_PROVIDER_SMOKE_RESULT=' | head -n1 || true)"
            if [ -n "$LINE" ]; then RESULT_JSON="${LINE#VIDEO_GENERATIVE_PROVIDER_SMOKE_RESULT=}"; break; fi
            sleep 5
          done
          test -n "$RESULT_JSON"
          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$GITHUB_SHA" '
            .schemaVersion == 1 and
            .sourceSha == $sha and
            .status == "GENERATED_REVIEW_REQUIRED" and
            .contentItemId == "VID-TP-20260904-DUAS-PISTAS-GEN-001" and
            .routeType == "GENERATIVE_SCENE_CONTINUATION_VIDEO" and
            .sourceAssetId == "TP-GEN-0001" and
            .sourceSha256 == "e16d4bc9dba27eb60a826d9be6fd3dade2f1e2e48445e1155a421cf52ca7d85b" and
            .provider == "OPENAI_VIDEO_API" and
            (.outputSha256 | test("^[a-f0-9]{64}$")) and
            .requiresPostGenerationHumanReview == true and
            .publicationEligible == false and
            .publicationAuthorized == false and
            (.deliveryUrl | startswith("https://storage.googleapis.com/"))
          ' >/dev/null
          printf '%s\n' "$RESULT_JSON" | jq . > video-generative-evidence/provider-result.json
          DELIVERY_URL="$(printf '%s' "$RESULT_JSON" | jq -r '.deliveryUrl')"
          EXPECTED_SHA="$(printf '%s' "$RESULT_JSON" | jq -r '.outputSha256')"
          curl --fail --silent --show-error --location "$DELIVERY_URL" --output video-generative-evidence/TOCA_THEPARTY_DUAS-PISTAS_GENERATIVE_MASTER_8s_v01.mp4
          OBSERVED_SHA="$(sha256sum video-generative-evidence/TOCA_THEPARTY_DUAS-PISTAS_GENERATIVE_MASTER_8s_v01.mp4 | awk '{print $1}')"
          test "$OBSERVED_SHA" = "$EXPECTED_SHA"
          jq -n --arg expected "$EXPECTED_SHA" --arg observed "$OBSERVED_SHA" '{expectedSha256:$expected,observedSha256:$observed,exactReadback:($expected==$observed),publicationAuthorized:false}' > video-generative-evidence/readback.json

          cleanup
          trap - EXIT

      - name: Upload exact candidate and sanitized evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: video-generative-tp-gen-0001-${{ github.sha }}
          path: video-generative-evidence/
          if-no-files-found: error
          retention-days: 14
