name: Video Generative Provider Smoke

on:
  workflow_dispatch:
    inputs:
      authorization_ref:
        description: Owner authorization issue URL bound to the exact main SHA
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: video-generative-provider-smoke
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'toca-mcp-production' }}
      GCP_REGION: ${{ vars.GCP_REGION || 'southamerica-east1' }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY || 'toca-mcp' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp' }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || 'toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com' }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_MCP_RUNTIME_SERVICE_ACCOUNT || 'toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com' }}
      INSTAGRAM_PUBLICATION_ASSET_BUCKET_CONFIGURED: ${{ vars.INSTAGRAM_PUBLICATION_ASSET_BUCKET || 'toca-mcp-publication-assets' }}
      VIDEO_SCENE_CONTINUATION_PROVIDER: GOOGLE_VERTEX_VEO
      VIDEO_GOOGLE_AUTH_MODE: GCP_SERVICE_IDENTITY
      VERTEX_VEO_LOCATION: us-central1
      VERTEX_VEO_MODEL: veo-3.1-generate-001

    steps:
      - name: Checkout exact main candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate owner authorization exact main and bounded provider proof
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORIZATION_REF: ${{ inputs.authorization_ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          CURRENT_MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          test "$CURRENT_MAIN_SHA" = "$GITHUB_SHA"

          PREFIX="https://github.com/${GITHUB_REPOSITORY}/issues/"
          [[ "$AUTHORIZATION_REF" == "$PREFIX"* ]]
          ISSUE_NUMBER="${AUTHORIZATION_REF#${PREFIX}}"
          [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]
          ISSUE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
          printf '%s' "$ISSUE_JSON" > /tmp/video-auth.json
          jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" '
            (.state == "open") and
            (.user.login == $owner) and
            (.title == "PROVIDER AUTHORIZATION — Video Generative Smoke TP-GEN-0001")
          ' /tmp/video-auth.json >/dev/null
          BODY="$(jq -r '.body // ""' /tmp/video-auth.json)"

          read_key_once() {
            local key="$1" count actual
            count="$(awk -v prefix="${key}=" 'index($0,prefix)==1 {count++} END {print count+0}' <<<"$BODY")"
            test "$count" -eq 1
            actual="$(awk -v prefix="${key}=" 'index($0,prefix)==1 {print substr($0,length(prefix)+1)}' <<<"$BODY")"
            test -n "$actual"
            printf '%s' "$actual"
          }
          require_key_value_once() {
            local key="$1" expected="$2" actual
            actual="$(read_key_once "$key")"
            test "$actual" = "$expected"
          }

          require_key_value_once AUTHORIZED_CANDIDATE_SHA "$GITHUB_SHA"
          require_key_value_once AUTHORIZATION_STATE ACTIVE
          require_key_value_once VIDEO_CONTENT_ITEM_ID VID-TP-20260904-DUAS-PISTAS-GEN-001
          require_key_value_once VIDEO_GENERATIVE_SMOKE AUTHORIZED
          require_key_value_once PROVIDER_CALL_AUTHORIZED true
          require_key_value_once PRODUCTION_PROVIDER_PROOF_AUTHORIZED true
          require_key_value_once PROVIDER GOOGLE_VERTEX_VEO
          require_key_value_once MODEL veo-3.1-generate-001
          require_key_value_once PROVIDER_LOCATION us-central1
          require_key_value_once PROVIDER_OUTPUT_SECONDS 8
          require_key_value_once PROVIDER_SAMPLE_COUNT 1
          require_key_value_once PROVIDER_RESOLUTION 720p
          require_key_value_once PROVIDER_AUDIO_GENERATION false
          require_key_value_once PRODUCTION_ARTIFACT_REGISTRY_WRITE_AUTHORIZED true
          require_key_value_once PRODUCTION_CLOUD_RUN_JOB_MUTATION_AUTHORIZED true
          require_key_value_once PRODUCTION_GCS_REVIEW_ARTIFACT_WRITE_AUTHORIZED true
          require_key_value_once GOOGLE_DRIVE_READ_AUTHORIZED true
          require_key_value_once GOOGLE_SHEETS_READ_AUTHORIZED true
          require_key_value_once GOOGLE_SHEETS_CANDIDATE_WRITE_AUTHORIZED true
          require_key_value_once IAM_CREDENTIAL_SIGNING_AUTHORIZED true
          require_key_value_once PRODUCTION_SERVICE_DEPLOYMENT_AUTHORIZED false
          require_key_value_once PRODUCTION_TRAFFIC_MUTATION_AUTHORIZED false
          require_key_value_once PRODUCTION_DATABASE_MUTATION_AUTHORIZED false
          require_key_value_once PUBLICATION_AUTHORIZED false
          require_key_value_once SCHEDULING_AUTHORIZED false
          require_key_value_once MARKETING_READY_AUTHORIZED false
          require_key_value_once PAID_MEDIA_AUTHORIZED false

          FINANCIAL_CEILING="$(read_key_once FINANCIAL_CEILING)"
          [[ "$FINANCIAL_CEILING" =~ ^USD:([0-9]+([.][0-9]{1,2})?)$ ]]
          FINANCIAL_AMOUNT="${BASH_REMATCH[1]}"
          awk -v amount="$FINANCIAL_AMOUNT" 'BEGIN { exit !(amount > 0) }'

          CONTROL_BODY="$(gh api "repos/${GITHUB_REPOSITORY}/issues/640" --jq '.body // ""')"
          require_control_value_once() {
            local key="$1" expected="$2" count actual
            count="$(awk -v prefix="${key}=" 'index($0,prefix)==1 {count++} END {print count+0}' <<<"$CONTROL_BODY")"
            test "$count" -eq 1
            actual="$(awk -v prefix="${key}=" 'index($0,prefix)==1 {print substr($0,length(prefix)+1)}' <<<"$CONTROL_BODY")"
            test "$actual" = "$expected"
          }
          require_control_value_once MAIN_STABILITY PASS
          require_control_value_once EVALUATED_MAIN_SHA "$GITHUB_SHA"
          require_control_value_once MERGE_RESERVATION NONE

          echo "AUTHORIZATION_ISSUE_NUMBER=$ISSUE_NUMBER" >> "$GITHUB_ENV"
          echo "VIDEO_PROVIDER_FINANCIAL_CEILING=$FINANCIAL_CEILING" >> "$GITHUB_ENV"
          echo 'VIDEO_GENERATIVE_PROVIDER_AUTHORIZATION=VERIFIED'

      - name: Consume one-shot authorization before production or provider mutation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          test "$CURRENT_MAIN_SHA" = "$GITHUB_SHA"
          LIVE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${AUTHORIZATION_ISSUE_NUMBER}")"
          test "$(jq -r '.state' <<<"$LIVE_JSON")" = open
          BODY="$(jq -r '.body // ""' <<<"$LIVE_JSON")"
          test "$(grep -Fxc 'AUTHORIZATION_STATE=ACTIVE' <<<"$BODY" || true)" -eq 1
          test "$(grep -Fxc 'VIDEO_GENERATIVE_SMOKE=AUTHORIZED' <<<"$BODY" || true)" -eq 1
          test "$(grep -Fxc "AUTHORIZED_CANDIDATE_SHA=$GITHUB_SHA" <<<"$BODY" || true)" -eq 1
          CONSUMED_BODY="$(awk '
            $0=="AUTHORIZATION_STATE=ACTIVE" {$0="AUTHORIZATION_STATE=CONSUMED_EXECUTION_STARTED"}
            $0=="VIDEO_GENERATIVE_SMOKE=AUTHORIZED" {$0="VIDEO_GENERATIVE_SMOKE=CONSUMED"}
            {print}
          ' <<<"$BODY")"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${AUTHORIZATION_ISSUE_NUMBER}" \
            -f body="$CONSUMED_BODY" -f state=closed >/tmp/video-auth-consumed.json
          jq -e '.state == "closed"' /tmp/video-auth-consumed.json >/dev/null
          READBACK="$(jq -r '.body // ""' /tmp/video-auth-consumed.json)"
          test "$(grep -Fxc 'AUTHORIZATION_STATE=CONSUMED_EXECUTION_STARTED' <<<"$READBACK" || true)" -eq 1
          test "$(grep -Fxc 'VIDEO_GENERATIVE_SMOKE=CONSUMED' <<<"$READBACK" || true)" -eq 1
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${AUTHORIZATION_ISSUE_NUMBER}/comments" \
            -f body="VIDEO_PROVIDER_AUTHORIZATION_CONSUMED run_id=${GITHUB_RUN_ID} candidate_sha=${GITHUB_SHA} financial_ceiling=${VIDEO_PROVIDER_FINANCIAL_CEILING} publication=false scheduling=false paid_media=false" >/dev/null
          echo 'VIDEO_GENERATIVE_PROVIDER_AUTHORIZATION=CONSUMED'

      - name: Authenticate deployer to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Resolve governed runtime bindings without long-lived provider secrets
        shell: bash
        run: |
          set -euo pipefail

          require_binding() {
            local value="$1" logical="$2"
            if [ -z "$value" ]; then
              echo "VIDEO_GENERATIVE_BINDING_REQUIRED:${logical}" >&2
              exit 1
            fi
          }

          BUCKET="$INSTAGRAM_PUBLICATION_ASSET_BUCKET_CONFIGURED"
          require_binding "$BUCKET" instagram_publication_asset_bucket
          require_binding "$GCP_RUNTIME_SERVICE_ACCOUNT" runtime_service_account
          require_binding "$VERTEX_VEO_LOCATION" vertex_veo_location
          require_binding "$VERTEX_VEO_MODEL" vertex_veo_model
          require_binding "$VIDEO_PROVIDER_FINANCIAL_CEILING" financial_ceiling
          test "$GCP_PROJECT_ID" = 'toca-mcp-production'
          test "$GCP_REGION" = 'southamerica-east1'
          test "$GCP_DEPLOY_SERVICE_ACCOUNT" = 'toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com'
          test "$GCP_RUNTIME_SERVICE_ACCOUNT" = 'toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com'
          test "$BUCKET" = 'toca-mcp-publication-assets'
          test "$VIDEO_SCENE_CONTINUATION_PROVIDER" = 'GOOGLE_VERTEX_VEO'
          test "$VIDEO_GOOGLE_AUTH_MODE" = 'GCP_SERVICE_IDENTITY'
          test "$VERTEX_VEO_LOCATION" = 'us-central1'
          test "$VERTEX_VEO_MODEL" = 'veo-3.1-generate-001'

          echo "VIDEO_ASSET_BUCKET=$BUCKET" >> "$GITHUB_ENV"

          mkdir -p video-generative-evidence
          jq -n \
            --arg provider "$VIDEO_SCENE_CONTINUATION_PROVIDER" \
            --arg providerModel "$VERTEX_VEO_MODEL" \
            --arg providerLocation "$VERTEX_VEO_LOCATION" \
            --arg runtimeServiceAccount "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --arg bucket "$BUCKET" \
            --arg financialCeiling "$VIDEO_PROVIDER_FINANCIAL_CEILING" \
            '{schemaVersion:2,provider:$provider,providerModel:$providerModel,providerLocation:$providerLocation,runtimeServiceAccount:$runtimeServiceAccount,workspaceAuthMode:"GCP_SERVICE_IDENTITY_SIGNED_JWT",cloudAuthMode:"METADATA_SERVICE",assetBucket:$bucket,financialCeiling:$financialCeiling,productionProviderProofAuthorized:true,providerCallAuthorized:true,productionArtifactRegistryWriteAuthorized:true,productionCloudRunJobMutationAuthorized:true,productionGcsReviewArtifactWriteAuthorized:true,googleDriveReadAuthorized:true,googleSheetsReadAuthorized:true,googleSheetsCandidateWriteAuthorized:true,iamCredentialSigningAuthorized:true,productionServiceDeploymentAuthorized:false,productionTrafficMutationAuthorized:false,productionDatabaseMutationAuthorized:false,outputSeconds:8,sampleCount:1,resolution:"720p",generateAudio:false,publicationAuthorized:false,schedulingAuthorized:false,marketingReadyAuthorized:false,paidMediaAuthorized:false,longLivedProviderSecretsUsed:false,serviceAccountPrivateKeyUsed:false,secretEnumerationUsed:false}' \
            > video-generative-evidence/runtime-bindings.json

      - name: Build and push exact immutable smoke image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/server:video-gen-smoke-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          JOB_NAME="toca-video-gen-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --pull -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "JOB_NAME=$JOB_NAME" >> "$GITHUB_ENV"

      - name: Execute exact scene-continuation provider smoke
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            set +e
            gcloud run jobs delete "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true
            set -e
          }
          trap cleanup EXIT

          capture_failure_evidence() {
            local execution_status="$1"
            mkdir -p video-generative-evidence
            gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${JOB_NAME}\"" \
              --project "$GCP_PROJECT_ID" \
              --freshness=30m \
              --limit=500 \
              --order=asc \
              --format=json > /tmp/video-smoke-failure-logs.json || printf '[]\n' > /tmp/video-smoke-failure-logs.json

            VIDEO_SMOKE_EXECUTION_STATUS="$execution_status" VIDEO_SMOKE_JOB_NAME="$JOB_NAME" node <<'NODE'
          import fs from 'node:fs';

          const entries = JSON.parse(fs.readFileSync('/tmp/video-smoke-failure-logs.json', 'utf8'));
          const redact = (value) =>
            String(value)
              .replace(/Bearer\s+[A-Za-z0-9._~+\/-]+=*/giu, 'Bearer <REDACTED>')
              .replace(/\beyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\b/gu, '<JWT>')
              .replace(/\bya29\.[A-Za-z0-9._-]+\b/gu, '<GOOGLE_TOKEN>')
              .replace(/https?:\/\/[^\s"']+/giu, '<URL>')
              .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/giu, '<EMAIL>')
              .replace(/\b[a-f0-9]{64}\b/giu, '<SHA256>')
              .replace(/\b[A-Za-z0-9_-]{48,}\b/gu, '<TOKEN>')
              .replace(/\s+/gu, ' ')
              .trim()
              .slice(0, 700);
          const messageFor = (entry) => {
            if (typeof entry?.textPayload === 'string') return entry.textPayload;
            if (typeof entry?.jsonPayload?.message === 'string') return entry.jsonPayload.message;
            if (typeof entry?.jsonPayload?.error === 'string') return entry.jsonPayload.error;
            if (typeof entry?.protoPayload?.status?.message === 'string') {
              return entry.protoPayload.status.message;
            }
            return '';
          };
          const relevant = (Array.isArray(entries) ? entries : [])
            .map((entry) => ({
              severity: String(entry?.severity ?? 'DEFAULT'),
              log: String(entry?.logName ?? '').replaceAll('%2F', '/').split('/logs/').at(-1) ?? 'unknown',
              timestamp: String(entry?.timestamp ?? ''),
              message: redact(messageFor(entry)),
            }))
            .filter(
              (entry) =>
                entry.message &&
                /ERROR|FAILED|PERMISSION|DENIED|UNAUTH|FORBIDDEN|IAM|SIGNBLOB|OAUTH|DRIVE|SHEETS|VERTEX|VEO|QUOTA|RATE|429|403|404|GCS|STORAGE|SOURCE|POLICY|APPROVAL|VIDEO/iu.test(
                  entry.message,
                ),
            )
            .slice(0, 80);
          fs.writeFileSync(
            'video-generative-evidence/failure-diagnostic.json',
            `${JSON.stringify(
              {
                schemaVersion: 1,
                jobName: process.env.VIDEO_SMOKE_JOB_NAME,
                executionStatus: Number(process.env.VIDEO_SMOKE_EXECUTION_STATUS ?? '1'),
                entryCount: Array.isArray(entries) ? entries.length : 0,
                sanitizedEntries: relevant,
                rawPayloadPrinted: false,
                rawPayloadPersistedInArtifact: false,
                publicationAuthorized: false,
              },
              null,
              2,
            )}\n`,
          );
          NODE
          }

          ENV_VARS="^~^VIDEO_GENERATIVE_SMOKE_SOURCE_SHA=$GITHUB_SHA~GCP_PROJECT_ID=$GCP_PROJECT_ID~INSTAGRAM_PUBLICATION_ASSET_BUCKET=$VIDEO_ASSET_BUCKET~VIDEO_SCENE_CONTINUATION_PROVIDER=$VIDEO_SCENE_CONTINUATION_PROVIDER~VIDEO_GOOGLE_AUTH_MODE=$VIDEO_GOOGLE_AUTH_MODE~VERTEX_VEO_LOCATION=$VERTEX_VEO_LOCATION~VERTEX_VEO_MODEL=$VERTEX_VEO_MODEL"

          gcloud run jobs deploy "$JOB_NAME" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --command node \
            --args dist/src/video-generative-provider-smoke.js \
            --set-env-vars "$ENV_VARS" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 1200s \
            --quiet

          set +e
          gcloud run jobs execute "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet
          EXECUTION_STATUS=$?
          set -e
          if [ "$EXECUTION_STATUS" -ne 0 ]; then
            capture_failure_evidence "$EXECUTION_STATUS"
            cleanup
            trap - EXIT
            exit "$EXECUTION_STATUS"
          fi

          RESULT_JSON=''
          for attempt in $(seq 1 20); do
            LINE="$(gcloud logging read \
              "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME} AND textPayload:\"VIDEO_GENERATIVE_PROVIDER_SMOKE_RESULT=\"" \
              --project "$GCP_PROJECT_ID" --freshness=30m --limit=100 --order=desc \
              --format='value(textPayload)' | grep 'VIDEO_GENERATIVE_PROVIDER_SMOKE_RESULT=' | head -n1 || true)"
            if [ -n "$LINE" ]; then RESULT_JSON="${LINE#VIDEO_GENERATIVE_PROVIDER_SMOKE_RESULT=}"; break; fi
            sleep 5
          done
          test -n "$RESULT_JSON"
          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$GITHUB_SHA" '
            .schemaVersion == 1 and
            .sourceSha == $sha and
            .status == "GENERATED_REVIEW_REQUIRED" and
            .contentItemId == "VID-TP-20260904-DUAS-PISTAS-GEN-001" and
            .routeType == "GENERATIVE_SCENE_CONTINUATION_VIDEO" and
            .sourceAssetId == "TP-GEN-0001" and
            .sourceSha256 == "e16d4bc9dba27eb60a826d9be6fd3dade2f1e2e48445e1155a421cf52ca7d85b" and
            .provider == "GOOGLE_VERTEX_VEO" and
            .providerModel == "veo-3.1-generate-001" and
            .seconds == 8 and
            .size == "720x1280" and
            (.outputSha256 | test("^[a-f0-9]{64}$")) and
            .requiresPostGenerationHumanReview == true and
            .publicationEligible == false and
            .publicationAuthorized == false and
            (.deliveryUrl | startswith("https://storage.googleapis.com/"))
          ' >/dev/null
          printf '%s\n' "$RESULT_JSON" | jq . > video-generative-evidence/provider-result.json
          DELIVERY_URL="$(printf '%s' "$RESULT_JSON" | jq -r '.deliveryUrl')"
          EXPECTED_SHA="$(printf '%s' "$RESULT_JSON" | jq -r '.outputSha256')"
          curl --fail --silent --show-error --location "$DELIVERY_URL" --output video-generative-evidence/TOCA_THEPARTY_DUAS-PISTAS_GENERATIVE_MASTER_8s_v01.mp4
          OBSERVED_SHA="$(sha256sum video-generative-evidence/TOCA_THEPARTY_DUAS-PISTAS_GENERATIVE_MASTER_8s_v01.mp4 | awk '{print $1}')"
          test "$OBSERVED_SHA" = "$EXPECTED_SHA"
          jq -n --arg expected "$EXPECTED_SHA" --arg observed "$OBSERVED_SHA" '{expectedSha256:$expected,observedSha256:$observed,exactReadback:($expected==$observed),publicationAuthorized:false}' > video-generative-evidence/readback.json

          cleanup
          trap - EXIT

      - name: Verify ephemeral Cloud Run job cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${JOB_NAME:-}" ]; then
            ! gcloud run jobs describe "$JOB_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" >/dev/null 2>&1
          fi
          echo 'VIDEO_GENERATIVE_EPHEMERAL_JOB_ABSENT=PASS'

      - name: Upload exact candidate and sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: video-generative-tp-gen-0001-${{ github.sha }}
          path: video-generative-evidence/
          if-no-files-found: error
          retention-days: 14
