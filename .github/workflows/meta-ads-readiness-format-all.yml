name: Meta Ads Readiness Format All

on:
  push:
    branches:
      - fix/meta-ads-account-pixel-readiness
    paths:
      - '.github/workflows/meta-ads-readiness-format-all.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/meta-ads-account-pixel-readiness
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format permanent PR files
        run: |
          pnpm exec prettier --write \
            src/meta-ads-create-paused-smoke.ts \
            src/providers/meta-ads/meta-ads-provider-preflight.ts \
            src/providers/meta-ads/meta-ads-smoke-readiness.ts \
            test/meta-ads-provider-preflight.test.ts \
            test/meta-ads-smoke-readiness.test.ts \
            .github/workflows/meta-ads-create-paused-provider-smoke.yml \
            .github/workflows/meta-ads-prepare-diagnostic.yml \
            .github/workflows/meta-ads-prepare-gates.yml
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/meta-ads-create-paused-smoke.ts \
            src/providers/meta-ads/meta-ads-provider-preflight.ts \
            src/providers/meta-ads/meta-ads-smoke-readiness.ts \
            test/meta-ads-provider-preflight.test.ts \
            test/meta-ads-smoke-readiness.test.ts \
            .github/workflows/meta-ads-create-paused-provider-smoke.yml \
            .github/workflows/meta-ads-prepare-diagnostic.yml \
            .github/workflows/meta-ads-prepare-gates.yml
          git commit -m 'style(meta-ads): format account readiness hardening'
          git push origin HEAD:fix/meta-ads-account-pixel-readiness
