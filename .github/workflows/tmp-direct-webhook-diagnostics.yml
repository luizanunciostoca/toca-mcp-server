name: Temporary Direct Webhook Diagnostics

on:
  push:
    branches:
      - feat/instagram-engagement-messaging
    paths:
      - '.github/workflows/tmp-direct-webhook-diagnostics.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  WRITE_EXECUTION: toca-controlled-direct-webhook-write-v2-cnhgw

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect Meta 400 markers
        shell: bash
        run: |
          set -euo pipefail
          gcloud logging read \
            "resource.type=\"cloud_run_job\" AND labels.\"run.googleapis.com/execution_name\"=\"$WRITE_EXECUTION\"" \
            --project "$PROJECT_ID" --freshness=30m --limit=100 \
            --format='value(textPayload)' | grep -E 'SAFE_DIRECT_V2_|DIRECT_V2_FATAL=|Error:' || true
          echo 'SAFE_DIRECT_META_400_DIAGNOSTIC_COMPLETE=1'
