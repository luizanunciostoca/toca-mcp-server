name: Temporary Direct Webhook Diagnostics

on:
  push:
    branches:
      - feat/instagram-engagement-messaging
    paths:
      - '.github/workflows/tmp-direct-webhook-diagnostics.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  DATABASE_SECRET_ID: toca-database-url
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  DIAG_JOB: toca-direct-webhook-diagnostics

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build rollback-only DB diagnostic image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/direct-webhook-diag
          cp package.json pnpm-lock.yaml /tmp/direct-webhook-diag/
          cat > /tmp/direct-webhook-diag/diag.mjs <<'NODE'
          import { createHash } from 'node:crypto';
          import pg from 'pg';
          const { Pool } = pg;
          const pool = new Pool({ connectionString: process.env.DATABASE_URL });
          const sha256 = (value) => createHash('sha256').update(value, 'utf8').digest('hex');
          const targetHash = sha256('TESTE TOCA MCP DIRECT WEBHOOK 002');
          const replyHash = sha256('TESTE TOCA MCP DIRECT REPLY CONTROLADO 002');
          const accountId = '17841402033495654';
          const since = new Date('2026-08-12T01:19:06Z');
          try {
            const targetRows = await pool.query(`select event_id, provider_message_id, sender_scoped_id from meta_webhook_events where channel='DIRECT' and text_sha256=$1 and received_at >= $2 order by received_at desc limit 2`, [targetHash, since]);
            console.log('SAFE_DIRECT_DIAG_TARGET_MATCHES=' + targetRows.rowCount);
            if (targetRows.rowCount !== 1) throw new Error('TARGET_COUNT_INVALID');
            const target = targetRows.rows[0];
            const idempotencyKey = sha256(`instagram-direct-controlled|${target.provider_message_id}|${replyHash}`);
            const correlationId = `controlled-direct:${idempotencyKey}`;

            const columns = await pool.query(`select column_name, data_type, is_nullable, column_default from information_schema.columns where table_schema='public' and table_name='provider_publications' order by ordinal_position`);
            const constraints = await pool.query(`select conname, pg_get_constraintdef(oid) as definition from pg_constraint where conrelid='public.provider_publications'::regclass order by conname`);
            console.log('SAFE_DIRECT_DIAG_COLUMNS=' + JSON.stringify(columns.rows));
            console.log('SAFE_DIRECT_DIAG_CONSTRAINTS=' + JSON.stringify(constraints.rows));

            const client = await pool.connect();
            try {
              await client.query('begin');
              try {
                const inserted = await client.query(`insert into provider_publications (correlation_id, provider, account_id, state, idempotency_key, payload) values ($1,'meta',$2,'PENDING',$3,$4::jsonb) returning correlation_id`, [correlationId, accountId, idempotencyKey, JSON.stringify({ channel:'DIRECT', targetEventIdHash:sha256(target.event_id), providerMessageIdHash:sha256(target.provider_message_id), replyHash })]);
                console.log('SAFE_DIRECT_DIAG_ROLLBACK_INSERT_SUCCEEDED=' + inserted.rowCount);
              } catch (error) {
                console.log('SAFE_DIRECT_DIAG_INSERT_ERROR=' + JSON.stringify({ name:error?.name ?? null, code:error?.code ?? null, constraint:error?.constraint ?? null, column:error?.column ?? null, table:error?.table ?? null, message:error?.message ?? null }));
              } finally {
                await client.query('rollback').catch(() => undefined);
              }
            } finally { client.release(); }
          } finally { await pool.end(); }
          NODE
          cat > /tmp/direct-webhook-diag/Dockerfile <<'DOCKER'
          FROM node:24-bookworm-slim
          WORKDIR /app
          RUN corepack enable && corepack prepare pnpm@10.15.0 --activate
          COPY package.json pnpm-lock.yaml ./
          RUN pnpm install --prod --frozen-lockfile
          COPY diag.mjs ./diag.mjs
          USER node
          CMD ["node", "diag.mjs"]
          DOCKER
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/direct-webhook-diag:${GITHUB_SHA}"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" /tmp/direct-webhook-diag
          docker push "$IMAGE"
          echo "DIAG_IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Run rollback-only DB diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { gcloud run jobs delete "$DIAG_JOB" --project "$PROJECT_ID" --region "$REGION" --quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          gcloud run jobs deploy "$DIAG_JOB" --image "$DIAG_IMAGE" --project "$PROJECT_ID" --region "$REGION" --service-account "$RUNTIME_SERVICE_ACCOUNT" --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" --max-retries 0 --task-timeout 120s --quiet
          EXECUTION="$(gcloud run jobs execute "$DIAG_JOB" --project "$PROJECT_ID" --region "$REGION" --wait --format='value(metadata.name)')"
          for i in $(seq 1 8); do
            OUT="$(gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$DIAG_JOB\" AND labels.\"run.googleapis.com/execution_name\"=\"$EXECUTION\" AND textPayload:\"SAFE_DIRECT_DIAG_\"" --project "$PROJECT_ID" --freshness=10m --limit=30 --format='value(textPayload)' 2>/dev/null || true)"
            if [ -n "$OUT" ]; then echo "$OUT"; exit 0; fi
            sleep 5
          done
          exit 1
