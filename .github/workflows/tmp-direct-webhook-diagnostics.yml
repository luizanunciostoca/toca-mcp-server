name: Temporary Direct Webhook Diagnostics

on:
  push:
    branches:
      - feat/instagram-engagement-messaging
    paths:
      - '.github/workflows/tmp-direct-webhook-diagnostics.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  REGION: southamerica-east1
  REPOSITORY: toca-mcp
  RUNTIME_SERVICE_ACCOUNT: toca-mcp-runtime@toca-mcp-production.iam.gserviceaccount.com
  DATABASE_SECRET_ID: toca-database-url
  CLOUD_SQL_INSTANCE: toca-mcp-production:southamerica-east1:toca-mcp-db
  DIAG_JOB: toca-direct-webhook-diagnostics

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Inspect webhook service logs
        shell: bash
        run: |
          set -euo pipefail
          echo '--- WEBHOOK REQUEST LOG SUMMARY ---'
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="toca-meta-oauth-staging" AND httpRequest.requestUrl:"/webhooks/meta"' \
            --project "$PROJECT_ID" --freshness=30m --limit=50 \
            --format='table(timestamp,httpRequest.requestMethod,httpRequest.status,httpRequest.requestUrl)' || true
          echo '--- ACCEPTED EVENT LOG SUMMARY ---'
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="toca-meta-oauth-staging" AND textPayload:"Meta webhook events accepted"' \
            --project "$PROJECT_ID" --freshness=30m --limit=50 \
            --format='value(timestamp,textPayload)' || true

      - name: Build read-only DB diagnostic image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/direct-webhook-diag
          cp package.json pnpm-lock.yaml /tmp/direct-webhook-diag/
          cat > /tmp/direct-webhook-diag/diag.mjs <<'NODE'
          import { createHash } from 'node:crypto';
          import pg from 'pg';
          const { Pool } = pg;
          const pool = new Pool({ connectionString: process.env.DATABASE_URL });
          const targetHash = createHash('sha256').update('TESTE TOCA MCP DIRECT WEBHOOK 002', 'utf8').digest('hex');
          const since = new Date('2026-08-12T01:19:06Z');
          try {
            const totals = await pool.query(`
              select
                count(*)::int as total_since_activation,
                count(*) filter (where channel = 'DIRECT')::int as direct_since_activation,
                count(*) filter (where channel = 'DIRECT' and sender_scoped_id is not null)::int as direct_with_sender,
                count(*) filter (where channel = 'DIRECT' and provider_message_id is not null)::int as direct_with_message_id,
                count(*) filter (where channel = 'DIRECT' and text_sha256 is not null)::int as direct_with_text_hash,
                max(received_at) as latest_received_at
              from meta_webhook_events
              where received_at >= $1
            `, [since]);
            const target = await pool.query(`
              select
                count(*)::int as target_matches,
                count(*) filter (where sender_scoped_id is not null)::int as target_with_sender,
                count(*) filter (where provider_message_id is not null)::int as target_with_message_id,
                min(received_at) as first_received_at,
                max(received_at) as last_received_at
              from meta_webhook_events
              where channel = 'DIRECT' and text_sha256 = $1 and received_at >= $2
            `, [targetHash, since]);
            const audit = await pool.query(`
              select normalized_payload
              from audit_events
              where tool_name = 'instagram.engagement.webhook.receive'
                and created_at >= $1
              order by created_at desc
              limit 10
            `, [since]);
            console.log('SAFE_DIRECT_DIAG_TOTALS=' + JSON.stringify(totals.rows[0]));
            console.log('SAFE_DIRECT_DIAG_TARGET=' + JSON.stringify(target.rows[0]));
            console.log('SAFE_DIRECT_DIAG_AUDIT=' + JSON.stringify(audit.rows));
          } finally {
            await pool.end();
          }
          NODE
          cat > /tmp/direct-webhook-diag/Dockerfile <<'DOCKER'
          FROM node:24-bookworm-slim
          WORKDIR /app
          RUN corepack enable && corepack prepare pnpm@10.15.0 --activate
          COPY package.json pnpm-lock.yaml ./
          RUN pnpm install --prod --frozen-lockfile
          COPY diag.mjs ./diag.mjs
          USER node
          CMD ["node", "diag.mjs"]
          DOCKER
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/direct-webhook-diag:${GITHUB_SHA}"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" /tmp/direct-webhook-diag
          docker push "$IMAGE"
          echo "DIAG_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Run read-only DB diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            gcloud run jobs delete "$DIAG_JOB" --project "$PROJECT_ID" --region "$REGION" --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          gcloud run jobs deploy "$DIAG_JOB" \
            --image "$DIAG_IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-cloudsql-instances "$CLOUD_SQL_INSTANCE" \
            --set-secrets "DATABASE_URL=$DATABASE_SECRET_ID:latest" \
            --max-retries 0 --task-timeout 120s --quiet
          EXECUTION="$(gcloud run jobs execute "$DIAG_JOB" --project "$PROJECT_ID" --region "$REGION" --wait --format='value(metadata.name)')"
          for i in 1 2 3 4 5 6; do
            OUT="$(gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$DIAG_JOB\" AND labels.\"run.googleapis.com/execution_name\"=\"$EXECUTION\" AND textPayload:\"SAFE_DIRECT_DIAG_\"" \
              --project "$PROJECT_ID" --freshness=10m --limit=20 --format='value(textPayload)' 2>/dev/null || true)"
            if [ -n "$OUT" ]; then
              echo "$OUT"
              exit 0
            fi
            sleep 5
          done
          echo 'SAFE_DIRECT_DIAG_LOGS_MISSING=1'
          exit 1
