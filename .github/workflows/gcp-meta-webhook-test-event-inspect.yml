name: GCP Meta Webhook Test Event Inspect

on:
  push:
    branches:
      - feat/instagram-engagement-messaging
    paths:
      - '.github/workflows/gcp-meta-webhook-test-event-inspect.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  SERVICE: toca-meta-oauth-staging

jobs:
  inspect-test-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Inspect sanitized webhook request logs
        shell: bash
        run: |
          set -euo pipefail

          SINCE="$(date -u -d '30 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')"
          FILTER="resource.type=cloud_run_revision AND resource.labels.service_name=${SERVICE} AND timestamp>=\"${SINCE}\" AND httpRequest.requestUrl:\"/webhooks/meta\""

          gcloud logging read "$FILTER" \
            --project "$PROJECT_ID" \
            --limit 100 \
            --order desc \
            --format='table(timestamp,httpRequest.requestMethod,httpRequest.status,resource.labels.revision_name)' \
            | sed -E 's#https?://[^ ]+##g'
