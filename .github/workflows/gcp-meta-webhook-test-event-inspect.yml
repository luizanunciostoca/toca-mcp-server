name: GCP Meta Webhook Test Event Inspect

on:
  push:
    branches:
      - feat/instagram-engagement-messaging
    paths:
      - '.github/workflows/gcp-meta-webhook-test-event-inspect.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: toca-mcp-production
  SERVICE: toca-meta-oauth-staging

jobs:
  inspect-test-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/990081828836/locations/global/workloadIdentityPools/github/providers/github-toca-mcp
          service_account: toca-mcp-deployer@toca-mcp-production.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Inspect sanitized latest webhook request and acceptance logs
        shell: bash
        run: |
          set -euo pipefail
          SINCE="$(date -u -d '20 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')"

          REQUEST_FILTER="resource.type=cloud_run_revision AND resource.labels.service_name=${SERVICE} AND timestamp>=\"${SINCE}\" AND httpRequest.requestUrl:\"/webhooks/meta\""
          ACCEPT_FILTER="resource.type=cloud_run_revision AND resource.labels.service_name=${SERVICE} AND timestamp>=\"${SINCE}\" AND textPayload:\"Meta webhook events accepted\""

          gcloud logging read "$REQUEST_FILTER" --project "$PROJECT_ID" --limit 100 --order desc --format=json > /tmp/requests.json
          gcloud logging read "$ACCEPT_FILTER" --project "$PROJECT_ID" --limit 100 --order desc --format=json > /tmp/accepted.json

          POST_COUNT="$(jq '[.[] | select(.httpRequest.requestMethod == "POST")] | length' /tmp/requests.json)"
          POST_2XX_COUNT="$(jq '[.[] | select(.httpRequest.requestMethod == "POST" and (.httpRequest.status >= 200 and .httpRequest.status < 300))] | length' /tmp/requests.json)"
          DIRECT_COUNT="$(jq '[.[] | .textPayload // "" | select(contains("DIRECT"))] | length' /tmp/accepted.json)"

          echo "Sanitized POST webhook requests: ${POST_COUNT}"
          echo "Sanitized POST 2xx webhook requests: ${POST_2XX_COUNT}"
          echo "Sanitized DIRECT accepted events: ${DIRECT_COUNT}"

          test "$POST_COUNT" -ge 1
          test "$POST_2XX_COUNT" -ge 1
          test "$DIRECT_COUNT" -ge 1
