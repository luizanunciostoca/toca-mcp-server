name: Deploy GCP Staging Canonical

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact frozen candidate SHA to deploy
        required: true
        type: string
      promote_full:
        description: Promote the verified candidate to 100% staging traffic
        required: true
        default: true
        type: boolean
      evidence_issue:
        description: Issue number for sanitized deployment evidence
        required: false
        default: '151'
        type: string

permissions: {}

concurrency:
  group: deploy-gcp-staging-canonical
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact workflow and candidate identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$GITHUB_SHA" = "$CANDIDATE_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Exact-head Quality in clean non-deployment environment
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GCP_PROJECT_ID:-}"
          test -z "${GCP_WORKLOAD_IDENTITY_PROVIDER:-}"
          test -z "${GCP_DATABASE_URL_SECRET:-}"
          pnpm install --frozen-lockfile
          pnpm quality

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact candidate identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$GITHUB_SHA" = "$CANDIDATE_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Load repository-canonical staging coordinates
        id: config
        shell: bash
        run: |
          set -euo pipefail
          echo 'DEPLOY_ENVIRONMENT=staging' >> "$GITHUB_ENV"
          node scripts/export-staging-deploy-config.mjs infra/environments/staging.json > /tmp/staging-deploy.env
          cat /tmp/staging-deploy.env >> "$GITHUB_ENV"
          set -a
          source /tmp/staging-deploy.env
          set +a
          echo "wif=$GCP_WORKLOAD_IDENTITY_PROVIDER" >> "$GITHUB_OUTPUT"
          echo "deployer_sa=$GCP_DEPLOY_SERVICE_ACCOUNT" >> "$GITHUB_OUTPUT"

      - name: Validate canonical staging isolation without production coordinates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-gcp-deploy-environment.mjs
          echo 'CANONICAL_STAGING_CONFIG=PASS'

      - name: Authenticate isolated staging deployer only
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ steps.config.outputs.wif }}
          service_account: ${{ steps.config.outputs.deployer_sa }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Read-only staging infrastructure preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging-deploy-evidence
          test "$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)" = "$GCP_DEPLOY_SERVICE_ACCOUNT"
          test "$(gcloud projects describe "$GCP_PROJECT_ID" --format='value(projectNumber)')" = "$GCP_PROJECT_NUMBER"
          gcloud artifacts repositories describe "$GCP_ARTIFACT_REPOSITORY" --project "$GCP_PROJECT_ID" --location "$GCP_REGION" --format=json > /tmp/artifact-repo.json
          test "$(jq -r '.name | split("/") | last' /tmp/artifact-repo.json)" = "$GCP_ARTIFACT_REPOSITORY"
          gcloud sql instances describe "$GCP_CLOUD_SQL_INSTANCE" --project "$GCP_PROJECT_ID" --format=json > /tmp/cloud-sql.json
          jq -e '.region == env.GCP_REGION' /tmp/cloud-sql.json >/dev/null
          jq -e '.settings.backupConfiguration.enabled == true' /tmp/cloud-sql.json >/dev/null
          jq -e '.settings.backupConfiguration.pointInTimeRecoveryEnabled == true' /tmp/cloud-sql.json >/dev/null
          jq -e '(.settings.backupConfiguration.transactionLogRetentionDays // 0) >= 7' /tmp/cloud-sql.json >/dev/null
          jq -e '(.settings.backupConfiguration.backupRetentionSettings.retainedBackups // 0) >= 7' /tmp/cloud-sql.json >/dev/null
          SECRET_NAME="$(gcloud secrets describe "$GCP_DATABASE_URL_SECRET" --project "$GCP_PROJECT_ID" --format='value(name)')"
          test "${SECRET_NAME##*/}" = "$GCP_DATABASE_URL_SECRET"
          for spec in "$GCP_CLOUD_RUN_MCP_SERVICE:$GCP_MCP_RUNTIME_SERVICE_ACCOUNT" "$GCP_CLOUD_RUN_WEBHOOK_SERVICE:$GCP_WEBHOOK_RUNTIME_SERVICE_ACCOUNT"; do
            service="${spec%%:*}"
            expected_sa="${spec#*:}"
            gcloud run services describe "$service" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "/tmp/${service}.json"
            test "$(jq -r '.spec.template.spec.serviceAccountName // empty' "/tmp/${service}.json")" = "$expected_sa"
          done
          jq -n \
            --arg projectId "$GCP_PROJECT_ID" \
            --arg projectNumber "$GCP_PROJECT_NUMBER" \
            --arg region "$GCP_REGION" \
            --arg artifactRepository "$GCP_ARTIFACT_REPOSITORY" \
            --arg cloudSqlInstance "$GCP_CLOUD_SQL_INSTANCE" \
            --arg configSha "$STAGING_CONFIG_SHA256" \
            '{projectId:$projectId,projectNumber:$projectNumber,region:$region,artifactRepository:$artifactRepository,cloudSqlInstance:$cloudSqlInstance,canonicalConfigSha256:$configSha,secretPayloadRead:false,providerAccess:false,productionAccess:false,result:"PASS"}' > staging-deploy-evidence/preflight.json

      - name: Start verified Cloud SQL Auth Proxy
        shell: bash
        run: |
          set -euo pipefail
          PROXY_VERSION='2.24.1'
          PROXY_SHA256='fae2766aac9d614a2bdef2f2a7778f3d054f3acd5ff07a81a9e300bd471512eb'
          curl --fail --silent --show-error --location "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v${PROXY_VERSION}/cloud-sql-proxy.linux.amd64" --output /tmp/cloud-sql-proxy
          echo "${PROXY_SHA256}  /tmp/cloud-sql-proxy" | sha256sum --check --strict
          chmod 0755 /tmp/cloud-sql-proxy
          /tmp/cloud-sql-proxy --address 127.0.0.1 --port 5432 "${GCP_PROJECT_ID}:${GCP_REGION}:${GCP_CLOUD_SQL_INSTANCE}" >/tmp/cloud-sql-proxy.log 2>&1 &
          PROXY_PID=$!
          echo "CLOUD_SQL_PROXY_PID=$PROXY_PID" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if (echo >/dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then exit 0; fi
            kill -0 "$PROXY_PID" 2>/dev/null || { cat /tmp/cloud-sql-proxy.log >&2; exit 1; }
            sleep 1
          done
          cat /tmp/cloud-sql-proxy.log >&2
          exit 1

      - name: Apply repository migrations through staging Secret Manager reference
        shell: bash
        run: |
          set -euo pipefail
          RAW_DATABASE_URL="$(gcloud secrets versions access "$GCP_DATABASE_URL_SECRET_VERSION" --secret "$GCP_DATABASE_URL_SECRET" --project "$GCP_PROJECT_ID")"
          export DATABASE_URL="$(RAW_DATABASE_URL="$RAW_DATABASE_URL" node --input-type=module -e '
            const url = new URL(process.env.RAW_DATABASE_URL);
            url.hostname = "127.0.0.1";
            url.port = "5432";
            for (const key of ["host", "port", "ssl", "sslmode", "sslcert", "sslkey", "sslrootcert", "sslaccept"]) url.searchParams.delete(key);
            process.stdout.write(url.toString());
          ')"
          unset RAW_DATABASE_URL
          export DATABASE_SSL=false
          pnpm migrate
          unset DATABASE_URL DATABASE_SSL

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Setup Docker Buildx for attestations
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: docker-container

      - name: Build push and resolve immutable candidate digest
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REPOSITORY="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/server"
          IMAGE_TAG="${IMAGE_REPOSITORY}:${GITHUB_SHA}"
          docker buildx build --pull --push --provenance=mode=max --sbom=true --metadata-file /tmp/build-metadata.json -t "$IMAGE_TAG" .
          IMAGE_DIGEST="$(jq -r '."containerimage.digest" // empty' /tmp/build-metadata.json)"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          REMOTE_DIGEST="$(gcloud artifacts docker images describe "$IMAGE_TAG" --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          test "$REMOTE_DIGEST" = "$IMAGE_DIGEST"
          echo "IMAGE=${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"
          echo "MCP_TAG=staging-mcp-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "WEBHOOK_TAG=wh-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "MCP_REVISION_SUFFIX=mcp-${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          echo "WEBHOOK_REVISION_SUFFIX=webhook-${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - name: Build provider-disabled runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          MCP_ENV=(
            "NODE_ENV=production" "MCP_ENABLED=true" "TOCA_SERVICE_ROLE=mcp"
            "TOCA_DEPLOY_ENVIRONMENT=staging" "TOCA_RELEASE_SHA=${GITHUB_SHA}"
            "TOCA_PLATFORM_KILL_SWITCH=false"
            "TOCA_DEFAULT_TENANT_ID=${TOCA_DEFAULT_TENANT_ID}" "TOCA_DEFAULT_WORKSPACE_ID=${TOCA_DEFAULT_WORKSPACE_ID}" "TOCA_DEFAULT_ORGANIZATION_ID=${TOCA_DEFAULT_ORGANIZATION_ID}"
            "TOCA_READY_OUTBOX_MAX_LAG_SECONDS=${TOCA_READY_OUTBOX_MAX_LAG_SECONDS}"
            "META_ENABLED=false" "META_PROVIDER_VERIFIED=false" "META_WEBHOOK_ENABLED=false" "META_WEBHOOK_PERSISTENCE_ENABLED=false"
            "INSTAGRAM_READ_ENABLED=false" "META_ADS_READ_ENABLED=false" "META_ADS_WRITE_ENABLED=false"
            "WHATSAPP_ENABLED=false" "WHATSAPP_RUNTIME_ENABLED=false" "WHATSAPP_PROVIDER_VERIFIED=false"
            "EMAIL_SENDGRID_ENABLED=false" "EMAIL_SENDGRID_PROVIDER_VERIFIED=false"
            "GOOGLE_ADS_PHASE=OFF" "GOOGLE_ADS_PROVIDER_VERIFIED=false"
            "AG01_MODEL_ENABLED=false" "AG01_MODEL_PROVIDER_VERIFIED=false"
            "GCP_PROJECT_ID=${GCP_PROJECT_ID}"
          )
          WEBHOOK_ENV=(
            "NODE_ENV=production" "MCP_ENABLED=false" "TOCA_SERVICE_ROLE=webhook"
            "TOCA_DEPLOY_ENVIRONMENT=staging" "TOCA_RELEASE_SHA=${GITHUB_SHA}"
            "TOCA_PLATFORM_KILL_SWITCH=false"
            "TOCA_DEFAULT_TENANT_ID=${TOCA_DEFAULT_TENANT_ID}" "TOCA_DEFAULT_WORKSPACE_ID=${TOCA_DEFAULT_WORKSPACE_ID}" "TOCA_DEFAULT_ORGANIZATION_ID=${TOCA_DEFAULT_ORGANIZATION_ID}"
            "TOCA_READY_OUTBOX_MAX_LAG_SECONDS=${TOCA_READY_OUTBOX_MAX_LAG_SECONDS}"
            "META_ENABLED=false" "META_PROVIDER_VERIFIED=false" "META_WEBHOOK_ENABLED=false" "META_WEBHOOK_PERSISTENCE_ENABLED=false"
            "INSTAGRAM_READ_ENABLED=false" "META_ADS_READ_ENABLED=false" "META_ADS_WRITE_ENABLED=false"
            "WHATSAPP_ENABLED=false" "WHATSAPP_RUNTIME_ENABLED=false" "WHATSAPP_PROVIDER_VERIFIED=false"
            "EMAIL_SENDGRID_ENABLED=false" "EMAIL_SENDGRID_PROVIDER_VERIFIED=false"
            "GOOGLE_ADS_PHASE=OFF" "GOOGLE_ADS_PROVIDER_VERIFIED=false"
            "AG01_MODEL_ENABLED=false" "AG01_MODEL_PROVIDER_VERIFIED=false"
            "GCP_PROJECT_ID=${GCP_PROJECT_ID}"
          )
          { IFS='|'; echo "MCP_RUNTIME_ENV=^|^${MCP_ENV[*]}"; } >> "$GITHUB_ENV"
          { IFS='|'; echo "WEBHOOK_RUNTIME_ENV=^|^${WEBHOOK_ENV[*]}"; } >> "$GITHUB_ENV"
          echo "RUNTIME_SECRETS=DATABASE_URL=${GCP_DATABASE_URL_SECRET}:${GCP_DATABASE_URL_SECRET_VERSION}" >> "$GITHUB_ENV"

      - name: Capture current rollback targets
        shell: bash
        run: |
          set -euo pipefail
          current_revision() {
            gcloud run services describe "$1" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.traffic[percent=100].revisionName)' 2>/dev/null || true
          }
          echo "PREVIOUS_MCP_REVISION=$(current_revision "$GCP_CLOUD_RUN_MCP_SERVICE")" >> "$GITHUB_ENV"
          echo "PREVIOUS_WEBHOOK_REVISION=$(current_revision "$GCP_CLOUD_RUN_WEBHOOK_SERVICE")" >> "$GITHUB_ENV"

      - name: Deploy private MCP candidate by digest with no traffic
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$GCP_CLOUD_RUN_MCP_SERVICE" --image "$IMAGE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --revision-suffix "$MCP_REVISION_SUFFIX" --tag "$MCP_TAG" --no-traffic \
            --service-account "$GCP_MCP_RUNTIME_SERVICE_ACCOUNT" \
            --add-cloudsql-instances "${GCP_PROJECT_ID}:${GCP_REGION}:${GCP_CLOUD_SQL_INSTANCE}" \
            --update-secrets "$RUNTIME_SECRETS" --update-env-vars "$MCP_RUNTIME_ENV" \
            --startup-probe 'httpGet.path=/readyz,httpGet.port=8080,failureThreshold=20,timeoutSeconds=3,periodSeconds=3' \
            --liveness-probe 'httpGet.path=/healthz,httpGet.port=8080,failureThreshold=3,timeoutSeconds=3,periodSeconds=10' \
            --min-instances 0 --max-instances 1 --cpu-throttling --memory 512Mi --cpu 1 --no-allow-unauthenticated

      - name: Deploy public webhook candidate by digest with no traffic
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$GCP_CLOUD_RUN_WEBHOOK_SERVICE" --image "$IMAGE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --revision-suffix "$WEBHOOK_REVISION_SUFFIX" --tag "$WEBHOOK_TAG" --no-traffic \
            --service-account "$GCP_WEBHOOK_RUNTIME_SERVICE_ACCOUNT" \
            --add-cloudsql-instances "${GCP_PROJECT_ID}:${GCP_REGION}:${GCP_CLOUD_SQL_INSTANCE}" \
            --update-secrets "$RUNTIME_SECRETS" --update-env-vars "$WEBHOOK_RUNTIME_ENV" \
            --startup-probe 'httpGet.path=/readyz,httpGet.port=8080,failureThreshold=20,timeoutSeconds=3,periodSeconds=3' \
            --liveness-probe 'httpGet.path=/healthz,httpGet.port=8080,failureThreshold=3,timeoutSeconds=3,periodSeconds=10' \
            --min-instances 0 --max-instances 2 --cpu-throttling --memory 512Mi --cpu 1 --allow-unauthenticated

      - name: Resolve candidate tagged revisions and URLs
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          resolve_tag() {
            local service="$1" tag="$2"
            local payload revision url
            for attempt in $(seq 1 24); do
              payload="$(gcloud run services describe "$service" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
              revision="$(jq -r --arg tag "$tag" 'first(.status.traffic[]? | select(.tag == $tag) | .revisionName) // empty' <<<"$payload")"
              url="$(jq -r --arg tag "$tag" 'first(.status.traffic[]? | select(.tag == $tag) | .url) // empty' <<<"$payload")"
              if [[ -n "$revision" && -n "$url" ]]; then
                printf '%s\t%s\n' "$revision" "$url"
                return 0
              fi
              sleep 5
            done
            echo "Timed out resolving Cloud Run traffic tag '$tag' for service '$service'" >&2
            return 1
          }
          IFS=$'\t' read -r MCP_REVISION MCP_URL < <(resolve_tag "$GCP_CLOUD_RUN_MCP_SERVICE" "$MCP_TAG")
          IFS=$'\t' read -r WEBHOOK_REVISION WEBHOOK_URL < <(resolve_tag "$GCP_CLOUD_RUN_WEBHOOK_SERVICE" "$WEBHOOK_TAG")
          EXPECTED_MCP_REVISION="${GCP_CLOUD_RUN_MCP_SERVICE}-${MCP_REVISION_SUFFIX}"
          EXPECTED_WEBHOOK_REVISION="${GCP_CLOUD_RUN_WEBHOOK_SERVICE}-${WEBHOOK_REVISION_SUFFIX}"
          test "$MCP_REVISION" = "$EXPECTED_MCP_REVISION"
          test "$WEBHOOK_REVISION" = "$EXPECTED_WEBHOOK_REVISION"
          test -n "$MCP_URL"; test -n "$WEBHOOK_URL"
          echo "MCP_REVISION=$MCP_REVISION" >> "$GITHUB_ENV"
          echo "MCP_URL=$MCP_URL" >> "$GITHUB_ENV"
          echo "WEBHOOK_REVISION=$WEBHOOK_REVISION" >> "$GITHUB_ENV"
          echo "WEBHOOK_URL=$WEBHOOK_URL" >> "$GITHUB_ENV"
          echo "mcp_url=$MCP_URL" >> "$GITHUB_OUTPUT"

      - name: Mint MCP readiness identity token through staging WIF
        id: mcp_probe_auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ steps.config.outputs.wif }}
          service_account: ${{ steps.config.outputs.deployer_sa }}
          token_format: id_token
          id_token_audience: ${{ steps.candidate.outputs.mcp_url }}
          create_credentials_file: false
          export_environment_variables: false

      - name: Verify candidate health readiness and public route confinement before traffic
        env:
          MCP_TOKEN: ${{ steps.mcp_probe_auth.outputs.id_token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 -H "Authorization: Bearer $MCP_TOKEN" "$MCP_URL/healthz" > staging-deploy-evidence/mcp-healthz.json
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 -H "Authorization: Bearer $MCP_TOKEN" "$MCP_URL/readyz" > staging-deploy-evidence/mcp-readyz.json
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "$WEBHOOK_URL/healthz" > staging-deploy-evidence/webhook-healthz.json
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "$WEBHOOK_URL/readyz" > staging-deploy-evidence/webhook-readyz.json
          jq -e '.status == "ready" and (.checks | all(.ok == true))' staging-deploy-evidence/mcp-readyz.json >/dev/null
          jq -e '.status == "ready" and (.checks | all(.ok == true))' staging-deploy-evidence/webhook-readyz.json >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$WEBHOOK_URL/mcp")" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$WEBHOOK_URL/oauth/meta/start")" = 404

      - name: Capture database runtime evidence through authenticated proxy
        shell: bash
        run: |
          set -euo pipefail
          RAW_DATABASE_URL="$(gcloud secrets versions access "$GCP_DATABASE_URL_SECRET_VERSION" --secret "$GCP_DATABASE_URL_SECRET" --project "$GCP_PROJECT_ID")"
          export DATABASE_URL="$(RAW_DATABASE_URL="$RAW_DATABASE_URL" node --input-type=module -e '
            const url = new URL(process.env.RAW_DATABASE_URL);
            url.hostname = "127.0.0.1";
            url.port = "5432";
            for (const key of ["host", "port", "ssl", "sslmode", "sslcert", "sslkey", "sslrootcert", "sslaccept"]) url.searchParams.delete(key);
            process.stdout.write(url.toString());
          ')"
          unset RAW_DATABASE_URL
          export DATABASE_SSL=false
          export TOCA_RELEASE_SHA="$GITHUB_SHA"
          export TOCA_DEPLOY_ENVIRONMENT=staging
          node scripts/capture-platform-evidence.mjs staging-deploy-evidence/database-runtime.json
          unset DATABASE_URL DATABASE_SSL

      - name: Promote verified candidate to full staging traffic
        if: ${{ inputs.promote_full }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$GCP_CLOUD_RUN_MCP_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions "${MCP_REVISION}=100"
          gcloud run services update-traffic "$GCP_CLOUD_RUN_WEBHOOK_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions "${WEBHOOK_REVISION}=100"
          echo 'TRAFFIC_PROMOTED=true' >> "$GITHUB_ENV"

      - name: Read back exact final staging runtime
        if: ${{ inputs.promote_full }}
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          verify_service() {
            local service="$1" revision="$2" expected_sa="$3" evidence="$4"
            gcloud run services describe "$service" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "/tmp/${service}-final.json"
            test "$(jq --arg revision "$revision" '[.status.traffic[]? | select((.percent // 0) == 100 and .revisionName == $revision)] | length' "/tmp/${service}-final.json")" = 1
            test "$(jq '[.status.traffic[]?.percent // 0] | add // 0' "/tmp/${service}-final.json")" = 100
            gcloud run revisions describe "$revision" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "/tmp/${revision}.json"
            release_sha="$(jq -r 'first(.spec.containers[0].env[]? | select(.name == "TOCA_RELEASE_SHA") | .value) // empty' "/tmp/${revision}.json")"
            runtime_sa="$(jq -r '.spec.serviceAccountName // empty' "/tmp/${revision}.json")"
            image="$(jq -r '.spec.containers[0].image // empty' "/tmp/${revision}.json")"
            test "$release_sha" = "$CANDIDATE_SHA"
            test "$runtime_sa" = "$expected_sa"
            test "${image##*@}" = "$IMAGE_DIGEST"
            jq -n --arg service "$service" --arg revision "$revision" --arg releaseSha "$release_sha" --arg runtimeIdentity "$runtime_sa" --arg imageDigest "$IMAGE_DIGEST" '{service:$service,revision:$revision,trafficPercent:100,releaseSha:$releaseSha,runtimeIdentity:$runtimeIdentity,imageDigest:$imageDigest}' > "staging-deploy-evidence/${evidence}"
          }
          verify_service "$GCP_CLOUD_RUN_MCP_SERVICE" "$MCP_REVISION" "$GCP_MCP_RUNTIME_SERVICE_ACCOUNT" mcp-final.json
          verify_service "$GCP_CLOUD_RUN_WEBHOOK_SERVICE" "$WEBHOOK_REVISION" "$GCP_WEBHOOK_RUNTIME_SERVICE_ACCOUNT" webhook-final.json
          jq -n \
            --arg candidateSha "$CANDIDATE_SHA" \
            --arg imageDigest "$IMAGE_DIGEST" \
            --arg mcpRevision "$MCP_REVISION" \
            --arg webhookRevision "$WEBHOOK_REVISION" \
            --arg configSha "$STAGING_CONFIG_SHA256" \
            '{schemaVersion:"toca.staging.canonical-deploy.v1",candidateSha:$candidateSha,imageDigest:$imageDigest,mcpRevision:$mcpRevision,webhookRevision:$webhookRevision,canonicalConfigSha256:$configSha,trafficPercent:100,providersEnabled:false,providerAccess:false,productionAccess:false,result:"PASS"}' > staging-deploy-evidence/manifest.json
          echo 'STAGING_CANONICAL_DEPLOY=PASS'

      - name: Publish sanitized deployment evidence
        if: ${{ inputs.promote_full && inputs.evidence_issue != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_ISSUE: ${{ inputs.evidence_issue }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Canonical staging deploy — PASS'
            echo
            echo "\`RUN_ID=${GITHUB_RUN_ID}\`"
            echo
            echo '\`\`\`json'
            cat staging-deploy-evidence/manifest.json
            echo '\`\`\`'
            echo
            echo 'No production access and no external provider calls.'
          } > /tmp/staging-deploy-comment.md
          gh issue comment "$EVIDENCE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/staging-deploy-comment.md

      - name: Automatic staging traffic rollback after failed post-promotion step
        if: failure() && env.TRAFFIC_PROMOTED == 'true' && env.PREVIOUS_MCP_REVISION != '' && env.PREVIOUS_WEBHOOK_REVISION != ''
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$GCP_CLOUD_RUN_MCP_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions "${PREVIOUS_MCP_REVISION}=100"
          gcloud run services update-traffic "$GCP_CLOUD_RUN_WEBHOOK_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions "${PREVIOUS_WEBHOOK_REVISION}=100"

      - name: Stop Cloud SQL Auth Proxy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CLOUD_SQL_PROXY_PID:-}" ]] && kill -0 "$CLOUD_SQL_PROXY_PID" 2>/dev/null; then
            kill "$CLOUD_SQL_PROXY_PID"
            wait "$CLOUD_SQL_PROXY_PID" || true
          fi

      - name: Upload staging deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-canonical-deploy-${{ inputs.candidate_sha }}
          path: staging-deploy-evidence
          if-no-files-found: warn
          retention-days: 90
